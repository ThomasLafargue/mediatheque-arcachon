  {t:"L'Île des secondes chances",a:"Diamond Lucy",y:"2026",ed:"Charleston",cote:"R DIA",pub:"Adulte",sup:"Imprimé",d:"Sur l'île de Céphalonie, face aux eaux turquoise, L'Echappée ionienne promet des vacances hors du temps. Chaque semaine, de nouveaux voyageurs franchissent les portes de l'hôtel avec l'espoir de laisser leurs soucis derrière eux. Miranda Vallance, ancienne star de la télévision, tente de disparaître, loin du scandale qui a brisé sa carrière. Evelyn Chambers, quatre-vingt-deux ans, a traversé l'Europe pour disperser les cendres de son épouse. Frank Neale, lui, espère fuir les accusations qui menacent de détruire sa réputation - tandis que sa femme, Nelly, nourrit un tout autre projet : retrouver son amour de jeunesse. Entre baignades, excursions sur l'île et longues soirées dans la douceur des nuits grecques, les vies se croisent et les confidences naissent. Car, derrière ce cadre idyllique, chacun porte en lui des regrets, des blessures... et peut-être le désir d'une seconde chance. Lucy Diamond signe un roman lumineux qui célèbre l'amour, les amitiés inattendues, et nous rappelle combien la vie peut nous surprendre. \"UN LIVRE IMPOSSIBLE A LACHER, QUI ENTRAINE LE LECTEUR DANS LE MAGNETISME DE LA VIE SUR L'ILE\". Woman's Weekly Après un début de carrière dans l'édition, Lucy Diamond a quitté Londres pour s'installer dans la ville de Bath avec son mari et ses trois enfants. Et c'est depuis cette jolie ville du sud de l'Angleterre, à jamais immortalisée par Jane Austen, qu'elle écrit ses romans à succès. Au cours des dernières années, elle a vendu plus de trois millions de livres et s'est imposée comme l'une des autrices préférées des Britanniques. Traduit de l'anglais par Nathalie Guillaume",isbn:"9782385295462",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295462-M.jpg"},
  {t:"La librairie des secrets",a:"Avril Virginie",y:"2026",ed:"L'Archipel",cote:"R AVR",pub:"Adulte",sup:"Imprimé",d:"A la mort de sa mère, Charlotte espère découvrir enfin l'identité de son père, qu'elle n'a jamais connu. Mais il n'en est rien. Minée par ce secret, elle ne parvient plus à faire semblant et décide de prendre un temps de recul. Elle quitte le foyer familial et retrouve son ami d'enfance, Victor, qui tient une charmante librairie. Ensemble, ils décident de mener l'enquête... Découvrir ses racines pour mieux déployer ses ailes A la mort de sa mère, Charlotte espérait trouver des indices et découvrir enfin l'identité de son père. Il n'en est rien. Minée par cette question à laquelle sa mère a toujours refusé de répondre, elle ne parvient plus à avancer dans l'existence. Elle décide de prendre un temps de recul et quitte le foyer familial, laissant son mari s'occuper de leurs deux adolescents. Victor, son ami d'enfance, qui tient une charmante librairie-salon de thé, L'Exquis Mot, lui propose de l'héberger afin qu'elle puisse faire le point. Ensemble, ils décident d'enquêter sur le père de Charlotte. Au gré des rencontres que favorise ce lieu, havre de paix et de gourmandise, Charlotte découvre un monde insoupçonné et s'ouvre de nouveau à la vie. Mais bientôt, de mystérieux colis arrivent à son intention. Elle n'est pas au bout de ses surprises... Ses recherches la mèneront bien plus loin qu'elle ne l'avait imaginé. Pourrait-t-elle désormais s'inventer une nouvelle vie, en accord avec ses aspirations profondes ? Un roman tout en délicatesse sur les tourbillons du milieu de vie, quand tout semble écrit alors qu'il reste tant de livres à lire et de pistes à explorer !",isbn:"9782809853711",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809853711-M.jpg"},
  {t:"Les filles de la librairie",a:"Foïs Giulia",y:"2026",ed:"Flammarion",cote:"R FOI",pub:"Adulte",sup:"Imprimé",d:"A Nice, le soleil brille trois cents jours par an. A Nice, de vieilles haines grattent à la porte. A Nice, Maud et Malika tiennent une librairie. Quand elles se sont rencontrées, quand elles sont tombées amoureuses, quand elles ont tout quitté, elles ont ouvert Les Affranchies. Trois ans plus tard, on y croise, entre autres, un anarchiste italien en cavale, un baby-sitter fan de Taylor Swift, une journaliste en lutte - un peu à l'ouest sur ses cycles ovariens -, une jeune mère tatouée qui promène sa poussette au bord du précipice, un prof de yoga déconstruit et le club de lecture des Veuves Poignet. Ce que les filles de la librairie espéraient, c'était offrir un refuge à celles et ceux qui voudraient continuer à respirer, à lutter, à s'aimer librement. Ce qu'elles n'imaginaient pas, c'est qu'il faudrait, pour aider l'une d'entre elles, enterrer un cadavre sur les rives du Paillon.",isbn:"9782080146045",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080146045-M.jpg"},
  {t:"L'espoir de Sophia",a:"Bomann Corina",y:"2025",ed:"Charleston",cote:"R BOM",pub:"Adulte",sup:"Imprimé",d:"Berlin, 1926. A seulement 20 ans, Sophia Krohn voit sa vie s'effondrer. Brillante étudiante en chimie, elle rêvait de reprendre la droguerie familiale et d'y vendre ses propres produits de beauté, mais lorsqu'elle tombe enceinte, son père la met à la porte. Anéantie, Sophia décide de tenter sa chance à Paris. Malgré sa modeste situation, elle continue de croire en son rêve et fabrique des crèmes dans la petite cuisine de sa pension parisienne. Jusqu'au jour où elle rencontre la grande Helena Rubinstein, qui lui propose un poste à deux conditions : la suivre à New York et s'abstenir de se marier pendant les dix prochaines années... Une saga fascinante dans l'univers des cosmétiques de luxe à Berlin, Paris et New York portée par une héroïne libre et attachante, qui souhaite construire sa vie comme elle l'entend, loin des carcans imposés par son sexe. \"SUPERBEMENT DOCUMENTE ET CAPTIVANT ! \" Für Sie Corina Bomann vit dans la campagne allemande, où elle peut écrire en toute tranquillité. Romancière à succès, elle est l'autrice de nombreux ouvrages qui sont fréquemment dans les listes des best-sellers du monde entier et qui se sont vendus à plus de deux millions d'exemplaires. Traduit de l'allemand par Corinna Gepner",isbn:"9782385294793",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385294793-M.jpg"},
  {t:"Sucre Noir",a:"Ollagnier Virginie",y:"2026",ed:"Le Lombard",cote:"BD EFA",pub:"Adulte",sup:"Imprimé",d:"D'après le roman de Miguel Bonnefoy. Dans un petit village des Caraïbes, où la légende d'un trésor disparu vient bouleverser l'existence de la famille Otero, les explorateurs se succèdent. Tous sont à la recherche du butin du capitaine Henry Morgan. Et tous vont croiser le chemin de Serena Otero, l'héritière de la plantation de cannes à sucre qui rêve à d'autres horizons, ainsi que celui de sa fille, Eva Fuego. Au fil des ans, tandis que la propriété familiale prospère, qu'elle distille alors le meilleur rhum de la région, chacun cherche le trésor qui donnera un sens à sa vie. Et si le véritable trésor n'était pas celui qu'ils croyaient ? Avec cette adaptation du roman de Miguel Bonnefoy, Ricard Efa et Virginie Ollagnier nous transportent dans un récit transgénérationnel empreint de réalisme magique qui fait la part belle aux femmes de la famille Otero, véritables héroïnes de ce récit.",isbn:"9782808211659",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808211659-M.jpg"},
  {t:"Très brève théorie de l'enfer",a:"Ferrari Jérôme",y:"2026",ed:"Actes Sud",cote:"R FER",pub:"Adulte",sup:"Imprimé",d:"Après avoir quitté son île natale pour enseigner à Alger, un homme, mû par le désir d'un ailleurs où échapper à lui-même, prend un poste au lycée français d'Abu Dhabi et s'y installe avec femme et enfant. Bientôt, leur trajectoire effleure celle de leur employée, Kaveesha, partie du Sri Lanka trente ans plus tôt et voguant depuis de famille en famille pour subsister. Expatrié, immigré - deux manières d'être étranger, deux mots pour dire deux mondes, séparés par un mur invisible que l'empathie ne saurait abattre. Dans une langue acérée, ténébreuse, Jérôme Ferrari poursuit l'examen lucide de notre rapport à l'autre et livre un nouvel opus déchirant des \"Contes de l'indigène et du voyageur\".",isbn:"9782330216382",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216382-M.jpg"},
  {t:"Les Nouvelles Vagues",a:"Cathrine Arnaud",y:"2026",ed:"Pocket",cote:"J CAT",pub:"Jeunesse",sup:"Imprimé",d:"Après le succès de *Romance*, découvrez l'histoire de Vince, Micha, Marilyn et Octave : quatre ados en quête d'eux-mêmes, entre premiers amours, doutes et épreuves de la vie. Les Nouvelles Vagues, c'est Vince, Micha, Marilyn et Octave. Les Nouvelles Vagues, c'est le portrait d'une génération qui invente sa façon d'aimer et d'être soi. Moi, je veux flamber. Sinon on n'est pas vivant. Je veux me jeter sur tout ce qui est inflammable. Même si j'ai peur. La vie me fait peur. Les garçons me font peur. Les filles me font peur. Mais je veux cramer. Ce sera bref, et qu'est-ce qu'on s'en fout : pourquoi une histoire courte ne serait-elle pas une histoire tout court'",isbn:"9782266354462",extraUrl:"https://products-images.di-static.com/image/base/9782266354462-475x500-1.jpg"},
  {t:"Que la joie demeure",a:"Orsenna Erik",y:"2026",ed:"Albin Michel",cote:"780.92 ORS",pub:"Adulte",sup:"Imprimé",d:"\" Ce peut être une cantate ou un choral, un dimanche, à l'église ou au temple. Ou, entendu quelque part sur les ondes, le mouvement dansant d'une partita, l'extrait bouleversant d'une Passion. Et voilà, Bach est entré en vous et ne vous quittera plus. Une pianiste, un écrivain se demandent, en racontant la vie de Bach, comment, jour après jour, il a changé la leur. Et quelles sont cette paix, cette joie qu'ils lui doivent. Il était une fois, il y a plus de trois cents ans, au coeur de l'Allemagne, le descendant d'un boulanger. Il était une fois cette musique qui n'a plus jamais cessé de nous tenir haute et fraternelle compagnie.\" Erik Orsenna L'écrivain Erik Orsenna, conteur de Vivaldi et de Beethoven, et la pianiste Claire-Marie Le Guay nous entraînent sur les chemins de Bach.",isbn:"9782226503435",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226503435-M.jpg"},
  {t:"Titanic",a:"Boudeville Peggy",y:"2026",ed:"Fleurus",cote:"J BOU",pub:"Adolescent",sup:"Imprimé",d:"Le 11 avril 1912, le Titanic s'élance en direction de New York avec, à son bord, plus de deux mille personnes. Parmi eux, Ernest ainsi que Juliette et sa famille, tous pleins d'espoir et de rêves. Mais, dans la nuit du 14 au 15 avril, l'impensable arrive : après avoir heurté un iceberg, le paquebot coule petit à petit dans les eaux glaciales de l'Atlantique. Ernest et Juliette vont alors devoir unir leurs forces et faire preuve d'un courage extraordinaire pour survivre et tenter de sauver des enfants perdus dans le chaos du naufrage.",isbn:"9782215197416",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215197416-475x500-1.jpg"},
  {t:"Les cogne-trottoirs",a:"Bartabas",y:"2026",ed:"Gallimard",cote:"R BAR",pub:"Adulte",sup:"Imprimé",d:"\"Ce qu'ils virent ce jour-là fut si incroyable qu'ils ne purent en rendre compte ; les enfants furent traités de menteurs et les adultes d'affabulateurs. Même l'escouade de policiers, arrivés en nombre pour dissiper l'attroupement et verbaliser les fauteurs de troubles, resta en arrêt et tomba le képi. Les regards étaient somptueux. A la fin, l'angelotte et l'âne, immobiles sur la corde, en équilibre l'un sur l'autre, vibraient en silence au même diapason\". Une jeune fille muette s'enfuit de chez son oncle après y avoir mis le feu et se réfugie dans la forêt, accompagnée de son âne. Une rencontre menant à l'autre, ils échouent à Paris, dans une troupe de saltimbanques, les Baladins du Temple. De la place Saint-Eustache à Montparnasse, sous la houlette de l'Amiral, les membres de cette joyeuse tribu de marginaux donnent des spectacles de rue, font la manche, défient l'ordre bourgeois. Renommée Cascabelle, l'adolescente va recueillir leurs confidences, découvrir la liberté et partager leurs excès, leurs rêves et leurs chagrins... Avec Les cogne-trottoirs, roman d'apprentissage mettant en scène le duo touchant d'un âne funambule et d'une môme qu'un drame a privée de parole, Bartabas signe un premier roman halluciné, lyrique et gouailleur, au style éblouissant.",isbn:"9782073129963",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073129963-M.jpg"},
  {t:"Calligrammes",a:"Apollinaire Guillaume",y:"2018",ed:"Flammarion",cote:"841 APO",pub:"Adulte",sup:"Imprimé",d:"Sept mois avant sa mort, Apollinaire publie des poèmes \"de la paix et de la guerre\", écrits de 1913 à 1916, sous le titre Calligrammes. Ce néologisme, qu'il forge à partir des mots \"calligraphie\" et \"idéogramme\", annonce un mode d'expression original : le poème-dessin, qui allie jeu du langage et jeu des formes. Les mots dessinent ici un cigare, là une montre ou une colombe, et traversent la page sous forme de gouttes de pluie ou de trains partant pour les champs de bataille de la Première Guerre mondiale... Car Apollinaire a en partie composé ses Calligrammes au front, pour ses correspondantes aimées, Lou et Madeleine. S'il a pu se nourrir du spectacle de la guerre, c'était pour mieux la transfigurer. Et c'est aussi pour continuer de croire en l'avenir qu'il a osé, sous le fracas des bombes, cette étonnante synthèse de plusieurs arts. Dossier : 1. Une conférence d'Apollinaire : \"L'Esprit nouveau et les poètes\"2. Les poètes et la Grande Guerre3. Autour du calligramme4. Poètes contemporains d'Apollinaire5. Le jugement d'André Breton.",isbn:"9782081445123",extraUrl:"https://covers.openlibrary.org/b/isbn/9782081445123-M.jpg"},
  {t:"De l'autre côté de l'Arc-en-ciel",a:"Blue Beatrice",y:"2026",ed:"Little urban",cote:"A BLU",pub:"Jeunesse",sup:"Imprimé",d:"Elio n'aime pas le changement. Il ne quitte presque jamais le calme rassurant de sa chambre. Jusqu'au jour où il rencontre une petite flamme qui lui fait découvrir les merveilles de la nature et l'incite à s'ouvrir au monde extérieur. Une histoire MAGIQUE au rythme des saisons pour voir la vie du bon côté.",isbn:"9782374082288",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782374082288-475x500-1.jpg"},
  {t:"One-Punch Man",a:"Murata Yusuke",y:"2026",ed:"Kurokawa",cote:"BD ONE",pub:"Jeunesse",sup:"Imprimé",d:"Saitama est trop puissant ; tellement puissant qu'il élimine tous les monstres les plus farouches avec un simple coup de poing. Découvrez l'histoire du plus puissant des super-héros dans ce manga qui va vous mettre K. O. !! L'affrontement entre Garoh et Saitama est si violent que la Terre est au bord de la destruction. La lutte acharnée, poings contre poings, se poursuit jusque dans l'espace. Face à Garoh, qui exécute les techniques mortelles apprises jusqu'ici, Saitama passe en mode vénère. C'est alors qu'un événement inattendu se produit ! Disponible ne version collector !",isbn:"9791042021665",extraUrl:"https://covers.openlibrary.org/b/isbn/9791042021665-M.jpg"},
  {t:"Les périphériques",a:"Blondel Jean-Philippe",y:"2026",ed:"Gallimard",cote:"J BLO",pub:"Jeunesse",sup:"Imprimé",d:"Axel a quinze ans et vit dans une petite ville de province. Au pied de l'immeuble, il zone avec les copains en tentant d'oublier que l'avenir est un horizon bouché. Et qu'il n'a pas trouvé de stage pour clore son année de seconde. Grâce à son beau-père, il atterrit à Totem Radio, une radio locale que personne n'écoute... Quand les rencontres font des miracles. Un roman social lumineux dont les héros sont les oubliés du système, par l'auteur de Blog et Un été 79.",isbn:"9782075223645",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075223645-475x500-1.jpg"},
  {t:"Voisines",a:"Debrocq Aliénor",y:"2025",ed:"Bayard éditions",cote:"J DEB",pub:"Jeunesse",sup:"Imprimé",d:"Qui n'a jamais rêvé d'habiter en face de sa meilleure amie ? Lou et Lila sont meilleures amies depuis toujours, tout comme leurs mères. Elles vivent de part et d'autre d'une rue tranquille de Bruxelles. Ensemble, leurs deux famille forment une grande tribu de coeur. Soirées d'été, vacances à la campagne, sorties au parc : inséparables ! Et puis un jour, tout bascule. Désormais, ce sera chacun chez soi. Lou, désemparée, veut comprendre : où sont passés les liens qu'on pensait plus forts que tout ? Un roman très actuel : l'histoire d'amitié bouleversante entre deux fillettes à l'aube de l'adolescence Une plongée très juste au coeur de l'évolution d'une enfant, de ses 9 à ses 13 ans, avec ses métamorphoses, ses émotions, ses incertitudes.",isbn:"9791036374241",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791036374241-475x500-1.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2025",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeunesse",sup:"Imprimé",d:"Le monde est anéanti... Partons le visiter à moto ! Un avion de chasse a fait irruption dans le ciel de Nagaoka. Désireuses de faire connaissance avec son mystérieux pilote, Yôko et Airi entreprennent de se rendre à la base aérienne de Misawa dans le département d'Aomori, où l'avion est censé atterrir. Elles en profiteront pour visiter la région du Tôhoku, en faisant halte successivement à Yamagata, Sendai, Morioka et Akita.",isbn:"9791041116263",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041116263-M.jpg"},
  {t:"Le banc",a:"Smith Géraldine",y:"2026",ed:"Albin Michel",cote:"R SMI",pub:"Adulte",sup:"Imprimé",d:"Drôle, tendre, bouleversant. Mélissa da Costa Coup de coeurde Valérie Expert - Sud Radio Un très joli roman, malicieux, drôle. Sophie Aurenche RTL Le roman dresse une galerie bouleversante de portraits et offre un regard tendre et réaliste sur le grand âge. Biblioteca Chaque jour, à la résidence des Merles bleus, Georges, 95 ans, Marcel, de six ans son cadet, et Jean-Marc, fraîchement retraité, se retrouvent sur leur banc. Ensemble, ils devisent sur le monde qui passe... et celui qui s'efface. Un matin, Georges est retrouvé mort au fond de son lit, dans des circonstances suspectes. Qui aurait pu vouloir la peau du nonagénaire ? Isabelle et Paul, ses enfants ? Mariola, son auxiliaire de vie ? Chantal, qui lui faisait la lecture... et les poches ? Alain, le \"shérif\" de l'immeuble ? Ou Abdel, le gérant de la baraque à frites ? Avec une immense tendresse pour ses personnages, Géraldine Smith signe un roman policier aussi léger que subtil. Car sous les pas de l'inspecteur Moussa Mballo, une vérité se dessine : le très grand âge cache parfois une jeunesse intacte, simplement rangée dans la cave des souvenirs. Géraldine Smith vit en Caroline du Nord. Elle a publié plu-sieurs livres de non-fiction dont, chez Stock, Vu en Amérique, bientôt en France (2018) et Rue Jean-Pierre-Timbaud (2016). Le banc est son premier roman.",isbn:"9782226502834",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226502834-M.jpg"},
  {t:"L'Exercice des mâchoires",a:"Vernhes Adélie",y:"2026",ed:"Julliard",cote:"843.92 VER",pub:"Adulte",sup:"Imprimé",d:"\"Je veux raconter la cuisine comme elle est, par celles et ceux qui la font. Celles et ceux qui y gravitent, que l'on rencontre de jour comme de nuit.\" De la cuisine d'un étoilé au zinc des brasseries parisiennes en passant par une enseigne de prêt-à-manger, Adélie Vernhes raconte par tableaux successifs les joies et les peines de la restauration. Elle retranscrit aussi bien le tourbillon des coups de feu - où tous les sens sont en éveil, où chaque plat est source d'émerveillement et de créativité - que les rencontres d'hommes et de femmes associant leur solitude après le service. Des cadences infernales des cuisines aux repas partagés au petit matin, L'Exercice des mâchoires est un portrait sensoriel et délicat de celles et ceux qui ont fait viril de nourrir autrui, parfois au détriment de leur propre personne.",isbn:"9782260057352",extraUrl:"https://covers.openlibrary.org/b/isbn/9782260057352-M.jpg"},
  {t:"Vous êtes comme ma fille",a:"Bourgeat Cécile",y:"2026",ed:"R. Laffont",cote:"R BOU",pub:"Adulte",sup:"Imprimé",d:"Comment reconstruire sa vie après un drame ? Alice, 25 ans, a l'avenir devant elle. Alors qu'elle est en mission pour une ONG, tout bascule un soir sur une route. Une enfant traverse. Un choc. Plus rien ne sera jamais comme avant. Arrachée à ses certitudes, Alice affronte l'insoutenable, mais aussi la douleur de la famille, la sienne, et la réaction inattendue d'un père qui va changer le cours de sa vie. De retour en France, hantée par l'accident, étrangère à elle-même, elle doit apprendre à accepter son destin. Avec un style qui exprime l'urgence de dire l'indicible, ce premier roman raconte la bascule toujours possible de l'existence. Cécile Bourgeat nous livre avec poésie et pudeur le parcours d'une femme entre culpabilité et pardon.",isbn:"9782221282212",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221282212-M.jpg"},
  {t:"Ma gloire",a:"Oiseau Florent",y:"2026",ed:"Gallimard",cote:"R OIS",pub:"Adulte",sup:"Imprimé",d:"\"C'est la nuit et le dehors qui m'ont fait ça, ils m'ont attrapé et ne m'ont pas rendu\". Alcoolique débonnaire, le narrateur a pour philosophie l'absence d'ambition. Fraîchement licencié, il vit de petits trafics, passe ses journées à arpenter le Paris populaire, du cimetière de Charonne à la porte de Bagnolet, et ses soirées dans les bars. Sa gloire, ce sont les deux femmes qu'il aime : son épouse, Almeria, et leur fille, l'espiègle Lune, dix ans. Mais elles s'inquiètent de ses excès, qui ressemblent à un lent suicide. Jusqu'au jour où il est choisi pour jouer une fée dans le spectacle de fin d'année de l'école : l'occasion de trouver, enfin, le rôle de sa vie ? ... Hommage à la nuit, à l'ivresse et aux rencontres de hasard, Ma gloire interroge nos loyautés et la place que nous occupons dans le monde. De sa plume poétique et fantasque, Florent Oiseau poursuit son exploration fraternelle des gens de l'ombre, et signe un roman poignant sur les histoires que nous nous racontons tous pour survivre.",isbn:"9782073114273",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073114273-M.jpg"},
  {t:"Si le temps m'était compté",a:"Giordano Stéphanie",y:"2026",ed:"Charleston",cote:"R GIO",pub:"Adulte",sup:"Imprimé",d:"Mila, jeune horlogère passionnée, travaille à Genève dans une boutique de montres de luxe. Un cadre prestigieux, un salaire à la hauteur de ses ambitions, et pourtant... Cette réussite apparente ne la satisfait pas. Elle veut avoir le sentiment de servir à quelque chose. Après avoir refusé les avances d'un client important, elle décide de tout quitter et de retourner chez sa mère à Lautrec, dans le sud de la France, où elle a grandi. Au village, elle rencontre Pablo, un garçon de café philosophe, qui lui pose une question déconcertante : de quelles personnes a-t-elle marqué l'existence sans le savoir ? Mila est persuadée qu'il n'y en a aucune. Pablo, lui, fait le pari de les retrouver, persuadé que l'impact d'une existence ne se mesure pas à des exploits, mais à la profondeur des gestes, ceux qui laissent une trace sans faire de bruit. Dans ce nouveau roman plein d'émotions, Stéphanie Giordano explore la tension entre désir de dépassement de soi et fragilité intime, et interroge ce que signifie pour chacun réussir sa vie.",isbn:"9782385295363",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295363-M.jpg"},
  {t:"L'empereur de la joie",a:"Vuong Ocean",y:"2026",ed:"Gallimard",cote:"R VUO",pub:"Adulte",sup:"Imprimé",d:"Un soir d'été, sous une pluie battante, Hai se retrouve sur un pont, prêt à sauter. Il faut dire que grandir dans un coin aussi perdu qu'East Gladness peut ôter tout espoir, même à dix-neuf ans. Mais le destin en décide autrement quand Grazina, vieille veuve logeant près de la rive, repère sa silhouette à temps et l'interpelle - c'est ainsi qu'elle sauve Hai, et lui ouvre la porte de sa maison délabrée. Un tandem incongru et joyeux se forme alors entre ce jeune homme d'origine vietnamienne, accro aux opioïdes et mythomane, et cette ancienne réfugiée lituanienne qui n'a plus toute sa tête. Quand ils n'arrivent plus à joindre les deux bouts, Hai décroche un poste dans un fast-food du coin où une bande de marginaux l'accueille chaleureusement. Mais alors qu'il reprend doucement goût à la vie, la santé de Grazina se dégrade sérieusement. Parviendra-t-il pour une fois à ne pas fuir la réalité?",isbn:"9782073090270",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073090270-M.jpg"},
  {t:"Jaloux comme Manchot !",a:"Lewis-Jones Huw",y:"2026",ed:"Milan",cote:"A LEW",pub:"Jeunesse",sup:"Imprimé",d:"Comment peut-on être jaloux des mouettes ? Elles savent voler, et alors ? Après tout, il suffit d'avoir des ailes ! Pour Manchot, rien d'impossible... ou presque !",isbn:"9782408060435",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408060435-475x500-1.jpg"},
  {t:"Une poignée de vent",a:"Naseh Negar",y:"2026",ed:"Marabout",cote:"R NAS",pub:"Adulte",sup:"Imprimé",d:"\"Avant que nous nous quittions, je voudrais citer un vers de votre poète national, Omar Khayyâm, qui dit, je crois, qu'on doit aller à la rencontre de la mort une poignée de vent dans une main et un verre de vin dans l'autre.\" Automne 1978. A Téhéran, le mouvement de contestation contre le régime du Shah monte en puissance. Depuis son balcon, Minou, enceinte, observe les files interminables de manifestants. Pendant ce temps, le Shah déchu, dévoré par un cancer, vit les six derniers mois de son existence, entre Le Panama et Le Caire. Avec ses illusions, la façade de la dynastie se craquelle. Dans cet espace liminaire entre révolution et douceur familiale, Minou assiste aux bouleversements qui ébranlent son pays et à la liesse qui accompagne le renversement du régime. Son mari Hassan, opposant exilé en Suède, a entamé les démarches pour qu'elle et leur fils aîné le rejoignent. Plus de trente ans plus tard, alors que ses enfants se cherchent une vie en Suède, Minou n'a oublié ni sa patrie ni ceux qu'elle a perdus durant cette période troublée. Lorsqu'elle apprend que sa mère est mourante, la décision de retourner en Iran s'impose.",isbn:"9782501171878",extraUrl:"https://covers.openlibrary.org/b/isbn/9782501171878-M.jpg"},
  {t:"Tout le monde sait",a:"HARPER Jordan",y:"2026",ed:"Actes Sud",cote:"R HAR",pub:"Adulte",sup:"Imprimé",d:"Dans un Los Angeles crépusculaire s'étend un royaume de secrets ensevelis. Mae Pruett, publiciste spécialisée en gestion de crise, sait mieux que quiconque comment enterrer les scandales, salir les adversaires et manipuler l'opinion pour protéger les tout- puissants. Mais lorsque son patron est abattu devant le Beverly Hills Hotel, Mae voit sa vie basculer. Résolue à élucider le mystère, elle s'engouffre dans un labyrinthe de rumeurs et de silences, découvrant peu à peu l'étendue de cette \"bête\" tentaculaire qui régit la ville. Roman de la nuit californienne, \"Tout le monde sait\" dit l'insatiabilité d'une cité qui dévore ses enfants autant qu'elle les fait briller. Jordan Harper y orchestre une descente hypnotique dans le coeur obscur du spectacle. Un monde où la disgrâce se cache sous les paillettes et où chaque vérité tue plus sûrement qu'une balle. \" \"Tout le monde sait\" est le meilleur roman policier que j'aie lu depuis des années [... ] Jordan Harper écrit des phrases - et ici un livre entier - à la fois terrifiantes et exaltantes\". James Patterson \"Quel voyage ! Si James Ellroy et James M. Cain pouvaient donner naissance à un enfant illégitime, ce serait \"Tout le monde sait\" de Jordan Harper. . \". Dennis Lehane",isbn:"9782330215866",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330215866-M.jpg"},
  {t:"Le Somnambule",a:"Kepler Lars",y:"2026",ed:"Actes Sud",cote:"R KEP",pub:"Adulte",sup:"Imprimé",d:"Une nuit d'hiver, la police reçoit un appel. Un cambriolage est signalé dans un camping désert aux abords de Stockholm. A l'intérieur d'une caravane, ils découvrent l'indicible : un bain de sang, une hache, un corps réduit en morceaux... et, dans la pièce voisine, un adolescent endormi, un bras sectionné en guise d'oreiller. Le garçon s'appelle Hugo Sand. Il a dix-sept ans. Il souffre d'un trouble du sommeil rare - un somnambulisme qui se déclenche au coeur de ses pires cauchemars. Au réveil, il ne se souvient de rien. Coupable ou simple témoin ? L'inspecteur Joona Linna doit faire appel à son ami hypnotiseur, Erik Maria Bark, pour chercher la vérité enfouie dans les méandres de ces terreurs nocturnes. Mais la nuit, elle, n'oublie rien, et réclame son dû. Thriller de l'ombre et du vertige, \"Le Somnambule\" explore la frontière mouvante entre rêve et souvenir, déni et innocence.",isbn:"9782330218348",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330218348-M.jpg"},
  {t:"Capricieuse",a:"Fontanel Béatrice",y:"2019",ed:"L'Etagère du bas",cote:"A FON",pub:"Jeunesse",sup:"Imprimé",d:"Capricieuse, une petite fille plutôt mal élevée, se retrouve parachutée dans le monde des animaux et autres insectes de la forêt. Enfant autoritaire et impatiente, elle va devoir ralentir la cadence à cause d'une blessure au pied et se déplacer à dos de tortue. Ce rythme modéré va l'amener à observer davantage tout ce qui l'entoure... c'est le début de bien des aventures !",isbn:"9782490253159",extraUrl:"https://static.wixstatic.com/media/b71342_4a5c6216edc34d6f8ed28d20b081c3ba~mv2_d_1662_2320_s_2.png/v1/fill/w_358,h_488,al_c,q_85,usm_0.66_1.00_0.01/Capricieuse-couverture.webp"},
  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"Le royaume de Boss est en crise. Son fondateur à la force surhumaine est gravement malade. Son héritier, le prince Bojji, est sourd-muet. Dans un monde où la puissance des rois fait tout, cette faiblesse ne le destine pas à régner et son frère cadet Daida reçoit le soutien populaire. Mais l'aîné, d'un optimisme à toute épreuve, garde son objectif en tête, devenir le meilleur roi du monde. ©Electre 2022",isbn:"9791032712191",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712191-M.jpg"},
  {t:"Je suis un ange perdu",a:"Lafebre Jordi",y:"2025",ed:"Dargaud",cote:"BD LAF",pub:"Adulte",sup:"Imprimé",d:"\"Me revoilà face à un cadavre. Mais cette fois, je suis vraiment dans la merde. Je dois raconter au docteur Llull et à la police tous les événements de la semaine écoulée : la disparition de l'un de mes patients, ma rencontre avec une bande de néonazis... Une chose est sûre, je suis douée pour résoudre des crimes. Et les voix que j'entends dans ma tête ? Elles sont toujours là, mais j'apprends à les gérer.\"",isbn:"9782505130796",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505130796-M.jpg"},
  {t:"Toxique",a:"Bourdelier Matthias",y:"2025",ed:"Expé Editions",cote:"BD BOU",pub:"Adulte",sup:"Imprimé",d:"Une série d'histoires courtes humoristiques qui mettent en scènes des situations toxiques, explorant des thèmes tels que la société, la politique, la psychologie, les relations amoureuses, le sexe, l'amitié, la colocation, le monde du travail, la famille... Tout est abordé au travers du prisme de la toxicité, mêlant subtilement l'absurde et le réalisme.",isbn:"9782493412072",extraUrl:"https://covers.openlibrary.org/b/isbn/9782493412072-M.jpg"},
  {t:"La mission de Péril",a:"Sutherland Tui",y:"2025",ed:"Gallimard jeunesse",cote:"A SUT",pub:"Jeunesse",sup:"Imprimé",d:"La cruelle reine Scarlet veut tuer Argil et les autres Dragonnets du Destin. Entre la reine déchue et son seul ami, qui Péril va-t-elle choisir, elle qui est connue pour prendre toujours les pires décisions ?",isbn:"9782075221061",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782075221061-475x500-1.jpg"},
  {t:"Les fables du Roi des Aulnes",a:"Ba Juni",y:"2026",ed:"Bayard éditions",cote:"BDJ BA",pub:"Jeunesse",sup:"Imprimé",d:"Au coeur de la fabuleuse foret de Mynislyvix, deux figures se font face : Goupil, rusé manipulateur qui a déjoué la mort, et le Roi des Aulnes, immortel et solitaire. Leur rivalité anime la forêt depuis la nuit des temps, donnant naissance à une série de contes qui forment la grande Histoire. Reste à savoir comment finira la leur ! Et si les deux ennemis n'étaient finalement pas aussi différents qu'ils ne le pensent ? Un roman graphique qui dégoupille les classiques... Deux figures iconiques se font face dans ce roman graphique : le renard rusé, d'une part, et le monstre mystérieux de l'autre. A travers leurs affrontements répétés, ces deux personnages hauts en nuance questionnent et déconstruisent les rôles classiques des fables : le héros ne serait finalement pas si héroïque, et l'antagoniste pas si méchant... ... signé par un dessinateur au style incomparable Juni Ba nous livre une fois de plus une oeuvre percutante, dans la lignée de Mobilis et The Boy Wonder (Urban Comics). Le dessinateur de comics acclamé joue avec les codes graphiques et n'hésite pas à bousculer nos modes de lectures : contrastes bluffants, découpages ultra dynamique, sens du détail... Les Fables du Roi des Aulnes ne laissera personne indifférent.",isbn:"9791036387654",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036387654-475x500-1.jpg"},
  {t:"Partir sur la Route circulaire d'Islande",a:"Ham Anthony",y:"2026",ed:"Lonely Planet",cote:"914.91 ISL",pub:"Adulte",sup:"Imprimé",d:"Grâce à la nouvelle collection Partir de Lonely Planet, lancez-vous sur l'incomparable route circulaire d'Islande ! Cette boucle de 1 322 km fait le tour de l'île volcanique et relie presque tous les sites d'intérêt accessibles sans besoin de louer un 4x4 . A la clé, des paysages à couper le souffle et toute la richesse de la vie culturelle islandaise. Située tout près du Cercle polaire arctique, cette île isolée, peu peuplée, est une merveille de la nature, façonnée par des forces titanesques - geysers, volcans et glaciers. Les amateurs d'espaces sauvages spectaculaires seront ravis ! Boucle de 1 322 km, la Route 1 ou Route circulaire relie presque l'ensemble des sites accessibles sans besoin de louer un 4x4 ! En route, vous longerez fjords, marmites de boue, champs de lave lunaires, cascades, plages de sable noir, glaciers majestueux... Vous découvrirez la capitale Reykjavik, un concentré de la vie culturelle islandaise. Avec un peu de patience, vous pourrez observer des macareux sur les falaises, des baleines au large des côtes ou encore des phoques se prélassant sur les plages. Retrouvez toutes les astuces et tous les conseils d'auteurs amoureux de l'Islande pour planifier et préparer votre itinéraire. Ce guide décrit étape par étape les 1 322 km qui composent la Route circulaire. Chaque étape se présente avec un tracé du tronçon proposé, les principaux points d'intérêt, des recommandations de lieux où se restaurer et où se loger et des conseils des auteurs. Des essais thématiques apportent un éclairage sur des spécificités naturelles et culturelles en Islande. Des cartes claires avec le tracé de la Route circulaire et les incontournables, les plans des villes principales avec leurs points d'intérêts. Et une belle première carte dépliante et illustrée qui donne le ton de ce guide. Et bien sûr, toutes les informations pratiques pour se lancer à son tour dans ce beau périple (location de véhicule, code de la route, budget...). En clair, un joli carnet de route avec des pages aux coins arrondis et un format pratique, à emporter avec soi sur la Route circulaire d'Islande.",isbn:"9782384929436",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929436-M.jpg"},
  {t:"Irène de Byzance, l'iconophile",a:"Corbeyran",y:"2026",ed:"Delcourt",cote:"BD COB",pub:"Adulte",sup:"Imprimé",d:"Au VIIIe siècle, l'Empire byzantin vacille, déchiré par des querelles religieuses et miné par les complots. Orphelin à deux ans, Irène élevée par son oncle Constantin dans la foi iconophile. Mariée à 16 ans à Léon, fut empereur de Constantinople, elle devient impératrice dans une cour en pleine tourmente. Déterminée à restaurer le culte des icônes, elle s'oppose à son mari et prend les rênes du pouvoir. Audacieuse et stratège, elle est la première femme régner seule sur Byzance. Entre intrigues de palais, réformes politique alliances diplomatiques, Irène s'efforce de préserver l'unité de son empire tout en consolidant sa place sur le trône.",isbn:"9782413042129",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413042129-M.jpg"},
  {t:"Une forêt",a:"Jouannais Jean Yves",y:"2026",ed:"Albin Michel",cote:"R JOU",pub:"Adulte",sup:"Imprimé",d:"Puissant. Le Figaro Quel talent dingue pour faire exister pareille atmosphère en un si bref livre. La Tribune Dimanche \"Le capitaine Lenz finissait par se prendre au jeu. S'il n'avait aucun intérêt dans l'affaire, c'est qu'il ne la comprenait pas. Mais sa curiosité était piquée. Et puis, défendre la cause de ces oiseaux allemands, démontrer qu'ils n'étaient pas de fervents nazis représentait somme toute une occupation préférable à l'ennui\". Jean-Yves Jouannais, né en 1964, est professeur à l'Ecole nationale supérieure des beaux-arts de Paris. Il a publié, notamment, L'Idiotie (Beaux-Arts livres), Artistes sans oeuvres (Verticales), Les Barrages de sable (Grasset). De 2008 à 2024, il est l'auteur du cycle de conférences-performances, L'Encyclopédie des guerres, au Centre Pompidou (Paris).",isbn:"9782226499523",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226499523-M.jpg"},
  {t:"Moscow",a:"Žigunov Ûrij",y:"2024",ed:"Dargaud",cote:"BD JIG",pub:"Adulte",sup:"Imprimé",d:"Dans un avion pour Moscou, Boris, l'agent russe du FSB que XIII a connu dans sa jeunesse lors de son infiltration à Cuba, rappelle à notre héros une ancienne mission que sa mémoire avait effacée. En stimulant la mémoire perdue de Jason Mac Lane, le Russe espère découvrir la cachette d'une vieille preuve de complot pouvant être utile pour relancer sa carrière. En 1984, du temps de la guerre froide, XIII avait été missionné pour tuer un candidat à la présidence russe jugé un peu trop conservateur par le gouvernement américain dans le cadre du plan de réchauffement des relations Est-Ouest. Mais l'attentat prévu lors d'une réception à Spaso House, la résidence moscovite de l'ambassadeur américain, avait échoué par la faute d'une agente infiltrée du KGB, Nina Orekhova, alias \"Babotchka\" (\"papillon\"). Cette dernière, voyant en Jason Mac Lane un jeune idéaliste, glisse dans ses mains une microcassette contenant les preuves de complicités de milliardaires russes et américains dans un trafic d'armes et de technologies militaires entre Soviétiques et Américains vénaux ayant des intérêts communs dans le maintien des tensions entre les deux super puissances. XIII parviendra à s'échapper et sera renvoyé par la CIA à Cuba (qu'il quittera bientôt \"pour Maria\" . Mais ceci est une autre histoire... cfr tomes 9 et suivants de la série.) Aujourd'hui, le passé revient frapper à la porte de notre amnésique. Désireux de mettre la main sur la microcassette dont XIII a oublié jusqu'à l'existence, le GRU, alias les services de renseignements militaires russes, compte forcer un déclic dans la mémoire de Jason Mac Lane. Mais à peine arrivés à Moscou, voilà XIII enlevé par des motards dirigés par Nina qui travaille pour le FSB. Nina propose un marché à XIII. Elle promet de le libérer des gens du GRU et de l'emprise que la Fondation Mayflower a sur son cerveau si, en échange, il l'aide à retrouver la fameuse microcassette. Ensemble, ils pourront alors faire gagner Carrington aux prochaines élections présidentielles américaines et enfin favoriser un climat de détente entre les deux plus vieux ennemis de la politique internationale...",isbn:"9782505124306",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505124306-M.jpg"},
  {t:"Le prieur de Bethléem",a:"Khadra Yasmina",y:"2026",ed:"Flammarion",cote:"R KHA",pub:"Adulte",sup:"Imprimé",d:"Un éditeur parisien est enlevé dans des circonstances mystérieuses. Séquestré dans un réduit, il découvre que son ravisseur lui a soumis un manuscrit qu'il a refusé. L'auteur, un moine palestinien éprouvé par la violence, tient à ce que son récit soit connu de tous et, à travers lui, la tragédie d'une terre en larmes et en sang. Avec un talent remarquable, Yasmina Khadra déploie un texte d'une force impressionnante et empreint d'une poésie très évocatrice sur le naufrage de l'humanité d'aujourd'hui.",isbn:"9782080149671",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080149671-M.jpg"},
  {t:"Aya de Yopougon",a:"Abouet Marguerite",y:"2005",ed:"Gallimard",cote:"BD ABO",pub:"Adulte",sup:"Imprimé",d:"",isbn:"9782070573110",extraUrl:"https://covers.openlibrary.org/b/isbn/9782070573110-M.jpg"},
  {t:"Le porto",a:"Corbeyran",y:"2022",ed:"Glénat",cote:"BD COR",pub:"Adulte",sup:"Imprimé",d:"Vigneron de père en fils, une histoire de famille sur les terres arides et sauvages du Douro.1703, Liverpool. Robert Handsome et Thomas Woodmass, deux négociants anglais, s'apprêtent à faire route vers le Portugal. Robert compte bien y développer l'activité de son négoce en prospectant les vignobles de la vallée du Douro. Hélas, la région est difficile à dompter et les Anglais ne sont pas toujours les bienvenus. Robert perdra la vie sur ces terres arides avant d'avoir pu réaliser son rêve viticole. Marqué par ce drame, son fils Walter à refait sa vie loin du soleil. Mais le destin est curieux, et en 1708, le jeune vigneron devenu adulte est de retour au Portugal. Aura-t-il plus de chance dans cette entreprise risquée que son défunt père ? Trois générations de vignerons se succèderont pour former cette fresque historique et familiale très documentée.",isbn:"9782344037959",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344037959-M.jpg"},
  {t:"Du goût pour le bonheur",a:"Fouchet Lorraine",y:"2026",ed:"Editions Héloïse d'Ormesson",cote:"R FOU",pub:"Adulte",sup:"Imprimé",d:"Pia, vingt ans, a grandi seule avec sa mère Rose et son parrain, Max. Un jour, parrain et filleule apprennent qu'ils pourraient devenir père et fille. Mais au moment où elle doute de tout, Pia croise la route de celui qu'elle pensait ne jamais connaître... Et si en adoptant un père, elle en trouvait deux ? Par la magie de Groix, cette famille réinventée va révéler le meilleur d'elle-même. Pia, vingt ans, a grandi avec sa mère, Rose, à qui la vie n'a pas fait de cadeau, et son parrain, Max, qu'elle adore. Il est leur pilier et Groix leur port d'attache. Au cours d'un séjour sur l'île, Pia et Max, éternels complices, découvrent qu'ils pourraient devenir fille et père. Cette révélation bouleverse toutes leurs certitudes. Lorraine Fouchet, l'autrice du best-seller Entre ciel et Lou nous offre un concentré d'émotion grâce aux péripéties que vivent ses personnages. Parrain et filleule envisagent de se lancer alors dans une procédure d'adoption sans en parler à Rose, qui de son côté prépare une surprise que Pia n'appréciera guère. Sous le poids des non-dits le trio frise l'implosion et lorsque le père biologique de Pia, Oscar, débarque dans l'équation, tous devront se remettre en question. Pia, Rose, Max et Oscar, cabossés par l'existence, ne demandent qu'à s'aimer, mais les écueils vont s'accumuler sur leur parcours... Heureusement la tendresse et les vents d'ouest vont les aider à retrouver le cap et à révéler le meilleur d'eux-mêmes.",isbn:"9782487819849",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487819849-M.jpg"},
  {t:"Sous le soleil exactement",a:"Multon Anne-Fleur",y:"2026",ed:"Poulpe fictions",cote:"J MUL",pub:"Jeunesse",sup:"Imprimé",d:"Ingrédients pour des vacances survoltées : prenez quatre copines à l'imagination débridée et invitez-les dans un grand manoir mystérieux. Ajoutez un tableau intriguant, des rencontres surprenantes, une bonne dose de curiosité et une chaîne YouTube pour documenter le tout... Vous obtiendrez une enquête haletante et des aventures délirantes !",isbn:"9782377424597",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782377424597-475x500-1.jpg"},
  {t:"L'île aux murmures",a:"Swan Karen",y:"2026",ed:"Charleston",cote:"R SWAN",pub:"Adulte",sup:"Imprimé",d:"Ecosse, 1930. Effie Gillies vit sur la dernière île sauvage d'Ecosse, Saint Kilda, avec ses trois meilleures amies. Aussi libre et indomptable que les falaises qu'elle escalade, la jeune femme accepte de servir de guide au comte de Dumfries et à son fils, lord Sholto, lorsqu'ils viennent découvrir l'île et ses oiseaux. Entre Sholto et Effie, c'est le coup de foudre. Hélas, personne ne voit ce rapprochement d'un bon oeil : les deux jeunes gens viennent de mondes bien trop différents... Des mois plus tard, les insulaires sont forcés de quitter l'île pour le continent. Si Effie est effondrée, elle se réjouit de revoir Sholto lorsqu'elle est invitée à travailler chez les Dumfries. Mais leurs retrouvailles sont vite interrompues par une terrible nouvelle : un homme a été retrouvé assassiné à Saint Kilda. Et Effie est la principale suspecte... Le premier tome d'une saga passionnante mêlant secrets, suspense et grande histoire d'amour au coeur de l'un des plus sauvages archipels de l'Ecosse. UNE ILE SAUVAGE. QUATRE AMIES. ET UN SECRET QUI MENACE LEUR LIBERTE... Karen Swan a été journaliste de mode avant de se consacrer à l'écriture. Elle a écrit une trentaine de romans figurant dans les best-sellers du Sunday Times. Elle vit dans le Sussex, en Angleterre, avec son mari et ses trois enfants. L'Ile aux murmures, saga au succès international, a été traduite dans dix pays. Traduit de l'anglais par Elisabeth Luc",isbn:"9782385295080",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295080-M.jpg"},
  {t:"Monstres à l'horizon",a:"Bloch Serge",y:"2024",ed:"Bayard éditions",cote:"BDJ BLO",pub:"Jeunesse",sup:"Imprimé",d:"SamSam est un superhéros qui vit sur une planète peuplée d'êtres extraordinaires, affrontant à la fois les dangers de l'espace et les problèmes d'une vie d'enfant. Ses aventures l'aident finalement à grandir et à devenir plus fort. SamSam revient à la télévision pour une nouvelle saison sur Okoo ! 20 épisodes réunis en 3 chapitres : - Plus fort que les monstres ! - Marchel 1er contre-attaque ! - L'amitié c'est sacré !",isbn:"9791036365379",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791036365379-475x500-1.jpg"},
  {t:"Le secret du coeur de pierre",a:"Hicks Faith Erin",y:"2018",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeunesse",sup:"Imprimé",d:"Une tentative d'assassinat vient d'être commise contre le Général de toutes les Lames et le chaos éclate à nouveau dans la cité sans nom. Malgré les efforts de ses habitants pacifiques, la cité est au bord de la guerre. Luttant avec l'aide de Kaidu pour sauver la ville, Rat révèle quelque secrets sur le monastère dans lequel elle a grandi. ©Electre 2018",isbn:"9782369813736",extraUrl:"https://www.bedetheque.com/cache/thb_couv/Couv_327045.jpg"},
  {t:"Le vin et la Chine",a:"Corbeyran",y:"2022",ed:"Glénat",cote:"BD COR",pub:"Adulte",sup:"Imprimé",d:"Les tribulations d'un jeune héritier bordelais.Le jeune Olivier Wiener pourrait hériter d'une belle propriété viticole à Bordeaux. Mais avant, il doit faire ses preuves. Direction : la Chine ! Car faire du vin ne suffit pas, encore faut-il savoir le vendre. La Chine, il n'y connaît rien, pourtant c'est un endroit stratégique pour faire ses armes dans le commerce. Entouré de ses nouveaux collègues, le jeune homme va découvrir une autre facette du métier de vigneron et visiter les régions reculées ou poussent les vignes chinoises. En Chine, la production semble intensive et le vin a un goût bien singulier en bouche. Après le choc culturel, Olivier va peu à peu comprendre le paradoxe de ce pays qui oscille entre traditions millénaires et désire de modernité. Il n'est pourtant qu'au début de son initiation. Il ne maîtrise pas encore les codes lors des repas d'affaires et va commettre des impaires ! Mais pas question de rester sur un malentendu ! A force de persévérance, il pourrait trouver ce qu'il est venu chercher si loin : l'expérience qui lui manque pour reprendre le domaine familial.",isbn:"9782344041949",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344041949-M.jpg"},
  {t:"Silence, Léo, ça tourne",a:"Schmitt Michel-Yves",y:"2024",ed:"La Boîte à bulles",cote:"BDJ SCH",pub:"Jeunesse",sup:"Imprimé",d:"En visite au musée, Céline est repérée pour rejoindre le casting de la prochaine série de Proflix. Intégrant une équipe de super héros affrontant des aliens pilleurs de trésors, elle interprétera bientôt le rôle de Zif, la fille la plus rapide du monde. Face à la célébrité grandissante de sa soeur, difficile pour Léopold de ne pas être jaloux. N'est-ce pas lui le véritable super héros ? Pire encore, il est obligé d'assister au tournage des aventures de ces héros de seconde zone ! Jamais à court de bêtises, il va mettre la zizanie dans les studios. Et c'est au détour d'un couloir qu'il fait une découverte de taille : des extra-terrestres déguisés en humains semblent préparer un complot visant à piller les trésors de l'humanité. S'agit-il d'un complot intergalactique ou Léopold fabule-t-il ? Parfois, la frontière entre fiction et réalité est floue et faire la part de choses n'est pas chose aisée.",isbn:"9782849535035",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782849535035-475x500-1.jpg"},
  {t:"Micmac à la ferme",a:"Schmitt Michel-Yves",y:"2015",ed:"La Boîte à bulles",cote:"BDJ SCH",pub:"Jeunesse",sup:"Imprimé",d:"Qui, comme Léopold, n'a jamais rêvé de devenir invisible à volonté ? Un pouvoir étonnant qui lui permet de faire toutes sortes de bêtises et autres espiègleries. Cette fois-ci, c'est à la ferme que Léopold et sa soeur, Céline, se retrouvent, coincés chez Papy et Mamie pour les vacances ! Bien décidé à devenir Super-Léo pour libérer les animaux de la ferme et découvrir le mystérieux voleur qui sévit dans les environs, le dynamique Léopold n'en reste pas moins un farceur invétéré... C'est certain, au village, ils n'oublieront pas de sitôt Super-Léo !",isbn:"9782849532133",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782849532133-475x500-1.jpg"},
  {t:"SamSam, Tome 01",a:"Bloch Serge",y:"2026",ed:"Bayard éditions",cote:"BDJ BLO",pub:"Jeunesse",sup:"Imprimé",d:"Ensemble, SamPapa, SamMaman, SamSam et SamNounours affrontent tous les dangers et protègent la SamPlanète. Mais ils sont aussi très forts pour les bisous, les câlins et la rigolade ! SamSam, le plus petit des grands héros SamSam, le héros créé par Serge Bloch pour Pomme d'Api, est un enfant comme les autres : il aime jouer avec ses copains, regarder la télé un peu trop longtemps, faire des bêtises... et beaucoup moins ranger sa chambre ou obéir à ses parents ! Mais c'est aussi un superhéros qui part à l'aventure, découvre des planètes inconnues et joue avec des monstres bizarres ! Dans cette nouvelle présentation, les cases ont été agrandies, le texte est plus lisible et la lecture partagée plus simple : un classique à redécouvrir et offrir à tous les enfants de 3 à 7 ans ! SamSam, un héros à retrouver partout ! SamSam est publié tous les mois dans le magazine Pomme d'Api, il est aussi le héros d'un dessin animé diffusé sur France Télévisions, Netflix, YouTube et Okoo et d'un film sorti au cinéma, prix du public au festival Anima de Bruxelles. On le retrouve aussi sur Lumni, en collaboration avec Bayard jeunesse, dans une série sur le vivre-ensemble. SamSam, c'est aussi des histoires audio, des jouets, des jeux et des déguisements. Serge Bloch, l'auteur de SamSam, est aussi le scénariste de Zouk et Max et Lili, et le dessinateur de Toto. « SamSam est un personnage attachant, qui a la particularité de vivre sa vie de superhéros grâce à sa cape magique et son rayon spatial, tout en rencontrant les mêmes problèmes que tout petit Terrien de 6 ans : des lâches attaques de Pipiolis (certaines en plein jour !) à la difficulté de se séparer de son fidèle doudou... » Télérama",isbn:"9791036385292",extraUrl:"https://products-images.di-static.com/image/base/9791036385292-475x500-1.jpg"},
  {t:"Le carnaval",a:"Luciani Brigitte",y:"2012",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeunesse",sup:"Imprimé",d:"Monsieur Blaireau et Madame Rebarde décident qu'ils vont tous vivre dans le même terrier !",isbn:"9782205067835",extraUrl:"https://products-images.di-static.com/image/base/9782205067835-475x500-1.jpg"},
  {t:"La petite mère",a:"Saint-Cricq Nathalie",y:"2026",ed:"Editions de l'Observatoire",cote:"R SAI",pub:"Adulte",sup:"Imprimé",d:"Noël 2015. Jean-Yves, avocat flamboyant du barreau de Bourges, vient de prendre sa retraite. Veuf, désabusé, il brûle ses vieux dossiers dans la cheminée quand un message sur son répondeur le ramène vingt ans en arrière. Nadège Brisson. \" La petite mère \". En 1995, cette jeune femme frêle, mais déterminée, était venue le trouver pour se dénoncer. Son compagnon, Richard, avait enterré vivant leur bébé dans une clairière. Elle avait assisté à la scène, paralysée, sous emprise. Jean-Yves l'avait défendue avec passion et succès. Une victoire dont il était fier. Mais aujourd'hui, alors que des lettres anonymes lui sont envoyées, Nadège veut le revoir pour \" clore l'affaire \", dit-elle. Pourquoi ? Entre thriller judiciaire et portraits psychologiques, Nathalie Saint-Cricq signe un roman noir sur la manipulation, la vengeance, et ces mensonges auxquels on choisit de croire.",isbn:"9791032935446",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032935446-M.jpg"},
  {t:"Athéna la Guerrière",a:"Prévot Pascal",y:"2026",ed:"Larousse",cote:"J PRE",pub:"Jeunesse",sup:"Imprimé",d:"P'tite Athéna est une déesse rusée et fière. Dans toute sa bonté, elle aide les dieux à affronter les géants, déterminés à détruire l'Olympe. Pleine de sagesse, elle guide P'tit Hercule, missionné par Zeus, pour sauver tout le Panthéon grec. Mais parviendra-t-elle à éviter tous les obstacles ? P'tite Athéna devra mobiliser toute la ruse qui est en elle pour y parvenir.",isbn:"9782036079830",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782036079830-475x500-1.jpg"},
  {t:"Free",a:"Keneally Meg",y:"2026",ed:"L'Archipel",cote:"R KEN",pub:"Adulte",sup:"Imprimé",d:"Angleterre, 1789. Molly, 14 ans, est condamnée à mort pour le vol d'un cheval, avant de voir sa peine commuée en bannissement. Envoyée dans un bagne en Australie, elle deviendra la femme d'affaires la plus influente de Sydney. Un roman historique au souffle puissant librement inspiré de la vie de Mary Reibey, le destin hors du commun d'une femme qui a su conquérir sa liberté. Le destin d'une ancienne condamnée à mort, devenue la femme la plus puissante d'Australie. Librement inspiré de la vie de Mary Reibey, qui, partie de rien, fut au début du XIXe siècle la femme d'affaires la plus riche et la plus influente de son temps, un roman historique au souffle puissant. Angleterre, 1789. Molly, jeune domestique de 14 ans, est condamnée à mort pour le vol d'un cheval avant de voir sa peine commuée en bannissement dans une nouvelle colonie. Bien des années plus tard, c'est en citoyenne libre qu'elle débarque de nouveau sur le quai de Sydney, la ville dont elle est devenue la femme la plus riche et la plus in fluente. Quel chemin parcouru entretemps ! Quel destin extraordinaire que celui de Molly qui, avec son mari Angus, négociant avisé et père de leurs sept enfants, aura su bâtir un empire commercial et, surtout, gagner le respect de tous... Librement inspirée de la vie de Mary Reibey, cette fresque historique au puissant souffle romanesque retrace la naissance d'une nation en même temps qu'il brosse le portrait d'une femme hors du commun, celui de l'ancienne bagnarde dont l'énergie orne aujourd'hui les billets de vingt dollars australiens.",isbn:"9782809853100",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809853100-M.jpg"},
  {t:"Douceur de la musculation",a:"Page Martin",y:"2025",ed:"Le Nouvel Attila",cote:"305.4 PAG",pub:"Adulte",sup:"Imprimé",d:"Et si la musculation était une voie vers l'émancipation ? Et si elle renforçait la confiance, l'autonomie et la liberté ? Et si la puissance de notre corps se révélait une source de joie ? Martin Page propose de considérer avec un regard nouveau cette pratique, qui permet de prendre soin de nous et de nos proches, tout en protégeant notre fragilité et notre douceur.",isbn:"9782487749498",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487749498-M.jpg"},
  {t:"Sécher tes larmes",a:"Lepage Meï",y:"2026",ed:"Seuil",cote:"R LEP",pub:"Adulte",sup:"Imprimé",d:"Même victime, même lieu, même mode opératoire. Adèle Jezequel, la fille du commandant de police d'Annemasse, vient d'être enlevée. L'affaire est des plus troublantes : la jeune femme avait déjà disparu sept ans auparavant, dans les mêmes circonstances. Emma Fauvel est enquêtrice à la PJ de Créteil. Elle a fui Annemasse pour oublier son lourd passé et s'était juré de ne plus jamais y remettre les pieds. Mais Adèle et Emma se connaissent depuis l'enfance. Alors, quand en haut lieu on lui demande de diriger l'enquête, Emma accepte de revenir dans sa ville natale cernée par les Alpes. Quitte à y affronter ses pires cauchemars. Au coeur de cette ville étouffée par la canicule, il se pourrait que leurs destins se croisent. Si la justice est aveugle, cette fois Emma devra lui rendre la vue...",isbn:"9782386433542",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386433542-M.jpg"},
  {t:"Les Disparus d'As Covas",a:"Fortes Susana",y:"2026",ed:"L'Archipel",cote:"R FOR",pub:"Adulte",sup:"Imprimé",d:"Août 1979, trois enfants disparaissent à As Covas : les frères Cadavid et Blanca Suances, âgés de 12 à 8 ans. Le lendemain, la fillette est retrouvée indemne. Des deux garçons, nulle trace... 25 ans plus tard, quand leurs ossements sont exhumés, Blanca revient en Galice pour tenter de comprendre ce qui s'est passé cette nuit-là. Un roman d'atmosphère, noir, puissant et singulier. Trois enfants disparaissent en Galice, un village se tait. Vingt-cinq ans après les faits, la seule rescapée revient sur les lieux du drame pour tenter de résoudre le mystère. Un roman d'atmosphère, noir, puissant, singulier. Le suspense littéraire de la rentrée d'hiver 2026. Le samedi 12 août 1979 au soir, trois enfants disparaissent dans la commune espagnole d'As Covas, en Galice, lors de la fête du Castro : Blanca Suances, 8 ans, Nicolas et Hugo Cadavid, 12 et 10 ans. Le lendemain matin, la fillette est retrouvée indemne mais amnésique à des kilomètres de là, de l'autre côté de la frontière portugaise. De Nicolas et d'Hugo, nulle trace... Vingt-cinq ans plus tard, les ossements des frères Cadavid sont exhumés... Accompagnée d'un journaliste local, Blanca retourne sur les lieux du drame, interroge les témoins de l'époque et se heurte à un village encore marqué par les rancunes nées de la guerre civile et d'affaires plus récentes. Même si des flashs lui reviennent, des souvenirs par bribes, difficile pour elle de se représenter un tableau net du passé, aux contours bien définis. D'autant qu'à son envie de résoudre le mystère se mêle une quête toute personnelle, à la (re)découverte de son histoire familiale.",isbn:"9782809850420",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809850420-M.jpg"},
  {t:"Voir clair",a:"Moati Félix",y:"2026",ed:"Editions de l'Observatoire",cote:"R MOA",pub:"Adulte",sup:"Imprimé",d:"Portraits d'une génération en quête de sens \"Je veux que vous racontiez mon histoire. - Comment ça ? - Je veux que vous écriviez à ma place\". Dans ce livre comme dans la vie, tout commence par une rencontre. Félix, trentenaire essoufflé, est interpellé en pleine rue par un homme qui lui ressemble étrangement, Joachim. Celui-ci le supplie de raconter son histoire... Dès lors, hasard et destin se brouillent : le pauvre Félix se retrouve embarqué dans un récit où paternité bancale, disputes conjugales et angoisses existentielles se mêlent joyeusement. Au fil des pages, on rencontrera donc : un frère aimé et rival, une ex au bord de l'implosion, un prêtre fou amoureux, un espion paranoïaque, une belle bande d'arnaqueurs, et, au milieu du chaos, Joachim - qui vacille, encore, toujours, rongé par le désir de disparaître, ou le désir de se dissoudre dans plus grand que lui. D'Orléans à Budapest (en passant par Jérusalem), d'un divan de psy à des rades pour insomniaques, Félix Moati compose un roman drôle, tendre, féroce, sur la transmission impossible, sur la religion comme refuge ou fardeau, sur ces choix minuscules qui font basculer une vie. Un livre d'une ambition folle qui, au milieu des mirages, cherche une chose vertigineuse : voir clair.",isbn:"9791032937464",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032937464-M.jpg"},
  {t:"Les Invisibles",a:"Ellory Roger Jon",y:"2026",ed:"Sonatine",cote:"R ELL",pub:"Adulte",sup:"Imprimé",d:"Il est partout. Et il est nulle part. Exactement comme le diable. \" 1975, Syracuse, Etat de New York. Rachel Hoff man, nouvelle recrue de la police locale, est appelée sur sa première scène de crime : une institutrice vient d'être assassinée. A côté du corps, un étrange message tiré de La Divine Comédie de Dante. Peu après, une deuxième victime est découverte. C'est le début d'une série d'homicides à laquelle Rachel va être intimement mêlée, nouant une relation très particulière avec le mystérieux assassin. Cinq ans plus tard, alors que l'affaire semble close, une nouvelle vague d'assassinats frappe New York, étonnamment similaires à ceux de Syracuse. Rachel, qui s'apprête à rejoindre l'unité d'analyse comportementale du FBI, ignore encore qu'il lui faudra plus d'une décennie, avec nombre d'autres meurtres à la clé, pour peut-être résoudre cette enquête très personnelle qui, peu à peu, va virer à l'obsession, à la paranoïa, et la mener aux confins de la folie. Dans cette traque obsédante qui, année après année, dévore l'existence de son héroïne, R. J. Ellory nous entraîne dans un voyage au bout de l'enfer, digne de Seul le silence et d'Une saison pour les ombres. On y retrouve sa puissance romanesque, son humanité vibrante, son sens inégalé du suspense : tout ce qui consacre, encore et toujours, le maître incontesté du thriller.",isbn:"9782383992691",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383992691-M.jpg"},
  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"La reine Hiling consent à laisser le prince Bojji, héritier du royaume de Boss, partir en voyage, accompagné de Domas, son maître d'armes, et de Hokuro, un jeune soldat qui connaît la langue des signes. Lorsque le groupe arrive devant la porte des Enfers, Bojji est confronté à une trahison inattendue. ©Electre 2022",isbn:"9791032712177",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712177-M.jpg"},
  {t:"Gigi",a:"Bouilhac Claire",y:"2026",ed:"Dargaud",cote:"BD BOU",pub:"Adulte",sup:"Imprimé",d:"Pas simple pour Gigi de suivre tous les préceptes de la bienséance qu'essaie de lui transmettre sa grand-mère quand on a : 15 ans, envie de rire, danser, et s'amuser, sans penser au lendemain ! La fraîcheur de cette adolescente émeut Tonton, un jeune homme célèbre et bien né, qui, progressivement, va regarder cette femme éclore et s'en émerveiller. Est-ce le début d'une vie d'émancipation pour Gigi ?",isbn:"9782205211245",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205211245-M.jpg"},
  {t:"HONG KONG",a:"Ogaki Philippe",y:"2019",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Deux voleurs travaillant pour un receleur dérobent la tête de l'un des fameux soldats de la grande armée de terre cuite qui protège la tombe de Qin Shi Huang, premier empereur de Chine. Le fantôme de ce dernier est réveillé par le Mal. En quête d'alliés, il a besoin de l'empereur pour libérer le Chaos et accentuer sa domination sur le Monde. Mais les choses ne se passent pas comme il l'a prévu...",isbn:"9782413013082",extraUrl:"https://images.epagine.fr/082/9782413013082_1_m.jpg"},
  {t:"Réha",a:"Ogaki Philippe",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Ils sont six ! Six héros pourvus d'armes sacrées, six héritiers des plus grands héros antiques. Leur mission : sauver notre monde ! On les appelle... les Mythics.",isbn:"9782413085126",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782413085126-475x500-1.jpg"},
  {t:"A l'école des filles",a:"Châtelet Noëlle",y:"2026",ed:"R. Laffont",cote:"R CHA",pub:"Adulte",sup:"Imprimé",d:"\" Mon adolescence a ceci de particulier que je l'ai vécue en internat. Huit années pendant lesquelles je vais grandir, changer, me transformer dans la contrainte et la discipline, le plus souvent, mais découvrir aussi, émerveillée, mes métamorphoses successives où le désir a, évidemment, sa place. Des années sans lesquelles je ne serais pas devenue la femme que j'ai été et que je demeure encore aujourd'hui. \" Enfermée dans cette vie de pensionnaire à la toute fin des années 1950, Noëlle Châtelet y a acquis le sens de la justice et appris la valeur de la liberté. S'insurgeant contre les ordres des surveillantes revêches et la bienséance obscurantiste à laquelle on aurait voulu la soumettre, vivant des amours clandestines avec d'autres femmes, elle a développé durant ces années un art de la subversion que ses combats comme ses ouvrages n'ont ensuite cessé de défendre. A l'école des filles est le récit de cette expérience fondatrice. Portrait d'une époque où les femmes subissaient encore le carcan d'un ordre ancien, plaidoyer serein pour l'indocilité, ce livre offre un éloge intime, gai et sensuel, de l'émancipation.",isbn:"9782221282465",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221282465-M.jpg"},
  {t:"Il y a une autre rive",a:"Montety Etienne de",y:"2026",ed:"Stock",cote:"R MON",pub:"Adulte",sup:"Imprimé",d:"Après le divorce de ses parents, Rahman, alors adolescent, reste en France avec sa mère Halima tandis que son père Ibrahim choisit de rentrer en Algérie, son pays d'origine Quinze ans plus tard, à la mort brutale de ce père qu'il ne voyait plus, Rahman part séjourner dans le clan familial, retrouvant avec bonheur sa grand-mère et ses cousins. Il s'immerge dans leur quotidien rythmé par la tradition de l'islam, bien loin de l'économie numérique et des journées trépidantes de la start-up parisienne dans laquelle il travaille ; leur ferveur fait écho à son aspiration à une autre vie. Il s'interroge d'abord sur la religion musulmane, mais c'est finalement auprès d'un religieux catholique, le frère Jean- Marie, que sa quête de sens va grandir. Et avec elle son désir d'explorer une autre rive : cette foi qui professe que Dieu est Père.",isbn:"9782234097025",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234097025-M.jpg"},
  {t:"Shangri-La Frontier",a:"Katarina",y:"2026",ed:"Glénat",cote:"BD SHA",pub:"Jeunesse",sup:"Imprimé",d:"Le combat contre Kthaanid des Abysses, l'un des Sept Suprêmes, est entré dans sa troisième phase ! Sunraku et ses coéquipiers, dont les genres et les stats ont été intervertis, passent à l'attaque en inversant aussi les rôles. Les humains d'aujourd'hui seront-ils capables de suivre les illustres traces divines célébrées par le maître des Abysses, et surmonter les épreuves qu'il leur impose ?",isbn:"9782344071502",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344071502-M.jpg"},
  {t:"La vieillesse, un émerveillement",a:"Gilbert Guy",y:"2020",ed:"Ed. de la Loupe",cote:"248.8 GIL",pub:"Adulte",sup:"Imprimé",d:"Vieillir est un privilège... Et une grande source d'ennuis. Comment l'aborder avec joie et sérénité quand tout semble changer ? Eh oui, les gens parlent moins distinctement, les radiateurs semblent moins efficaces et les livres écrits plus petits. Et pourtant, si notre corps avance en âge et qu'il nous joue des tours à sa façon, on peut apprendre à conserver l'esprit jeune et l'humour (et l'amour) actifs, piocher dans la vie ce qu'elle nous offre de magique. Et non, ce n'est pas parce qu'on a 90 ans que l'on est inutile. Prêtre-éducateur depuis 45 ans, Guy Gilbert, appelé aussi le curé des loubards, aide quotidiennement des jeunes en perdition.",isbn:"9782848689609",extraUrl:"https://covers.openlibrary.org/b/isbn/9782848689609-M.jpg"},
  {t:"La pêche au chalut",a:"Castillo Laure",y:"2026",ed:"HarperCollins",cote:"R CAS",pub:"Adulte",sup:"Imprimé",d:"\"Lorsque le kiné a massé mon bras, le mois dernier, j'ai réalisé que c'était la première main d'homme à toucher mon corps depuis des années. La sensation était agréable, la pensée l'était moins. Je m'étonne toujours d'en voir certaines se jeter sur les sites de rencontres à peine débarrassées de leur compagnon, au lieu de danser toutes nues en hurlant : \"Bon débarras, bon débarras ! \" Mais aujourd'huij'ai envie de revivre une histoire avec un homme. Avant le départ de ma fille, l'idée me trottait déjà dans la tête. Le meilleur moyen d'y parvenir est de m'inscrire sur un site, malgré ma réticence idiote - à l'inverse de mon pragmatisme habituel. C'est évident. Mieux, c'est statistique\". Céline pensait avoir apprivoisé le vide et s'était convaincue que solitude pouvait rimer avec sérénité. A cinquante-trois ans, alors que sa fille s'apprête à quitter le nid, elle se demande : et si un nouveau chapitre, plus audacieux, commençait ? Céline plonge alors dans l'univers des rencontres en ligne, entre rires, doutes et échanges improbables. De Lyon à Paris, de textos maladroits en rendez-vous inattendus, elle explore les méandres du désir moderne et ses propres cicatrices tout en interrogeant son regard sur les hommes. Et, qui sait, la rencontre attend peut-être Céline là où elle l'imagine le moins ? Inspiré de l'expérience personnelle de l'autrice sur les applis de rencontres, La Pêche au chalut mêle humour et introspection. Roman acide, comédie de moeurs rythmée : qu'il est réjouissant de suivre Céline et ses déconvenues ! \"Un délicieux roman\". Télépro \"Une lecture réjouissante dont on ne fait qu'une bouchée\". La Librairie des thés, Surgère A propos de l'autrice Laure Castillo est formatrice et, dans une autre vie, autrice de romans. Elle vit entre Lyon et Paris.",isbn:"9791033926849",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033926849-M.jpg"},
  {t:"Les Reines de sang",a:"Blengino Luca",y:"2026",ed:"Delcourt",cote:"BD BLE",pub:"Adulte",sup:"Imprimé",d:"L'histoire des deux vies de Poppée Sabina, épouse de Néron. D'abord, femme ambitieuse et prête à tout pour obtenir le pouvoir, devenue marionnette entre les mains d'un mari fou, violent et... tout-puissant. An 54 après J.-C. : depuis que Messaline a fait massacrer sa famille, la jeune Poppée Sabina n'a qu'un objectif : épouser l'empereur Claude. L'assassinat de ce dernier l'ayant forcée à se reporter sur Néron, son successeur, la confrontation avec sa mère Agrippine, est inévitable... mais son véritable ennemi se révélera être Néron, mari manipulateur, alcoolique et violent.",isbn:"9782413087045",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413087045-M.jpg"},
  {t:"Les boucles de Celadön",a:"Duval Fred",y:"2025",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"Le « Complexe » est une fédération dont la Terre est le 24e membre. Constitué depuis des millénaires par trois planètes fondatrices (Thorgon, Köbalt et Skuall), le Complexe a connu de nombreux conflits dont celui du premier conflit interstellaire ! Il affronte alors la civilisation Ouröbörös, prête à faire la guerre afin de mettre la main sur de nouvelles ressources. Nous découvrirons cette guerre spatiale à travers 4 personnages : Un frère et une soeur venus de la planète Kerath, dame Eliz, une Ouröbörös qui critique ouvertement la volonté hégémonique de son peuple et Marcus Valerius, un humain enlevé par les Ouröbörös avec plusieurs de ses hommes.  La nouvelle saga des créateurs de \"Renaissance \"!",isbn:"9782205211849",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205211849-M.jpg"},
  {t:"Monténégro",a:"Dragicevich Peter",y:"2026",ed:"Lonely Planet",cote:"914.974 MON",pub:"Adulte",sup:"Imprimé",d:"Des églises solitaires au milieu des flots, des criques secrètes au détour d'une baie, une explosion de couleurs dans l'intimité d'un monastère reculé, des lacs cristallins et de profonds canyons... le Monténégro réserve une palette de surprises et de moments de paix absolue. Tous les sites incontournables et les meilleures expériences à découvrir au Monténégro : le petit village de Sveti Stefan, le mausolée de Njegos, la vieille ville de Kotor, le monastère d'Ostrog, le parc national de Biogradska Gora et celui du Durmitor, la ville d'Ulcinj, le lac de Skadar, la route de Kotor au Lovcen... Une sélection inspirante et très pratique d'itinéraires pour découvrir le meilleur du Monténégro, quel que soit le temps ou le budget disponible. Un chapitre pour organiser une escapade dans la magnifique ville de Dubrovnik, en Croatie, frontalière et toute proche. Un chapitre dédié aux activités en plein air, sur l'eau, sur terre et dans les airs. Un focus sur la cuisine monténégrine : spécialités balkaniques, principaux repas...",isbn:"9782384929306",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929306-M.jpg"},
  {t:"Toilet-bound Hanako-kun T24",a:"AidaIro",y:"2026",ed:"Pika édition",cote:"BD TOI",pub:"Jeunesse",sup:"Imprimé",d:"Toujours dans ce monde modifié, Kô et Mitsuba sont conduits inconsciemment dans la Maison Rouge. De leur côté, Nene et ses amis se rendent également dans la bâtisse maudite pour en apprendre plus sur le passé de Hanako et de Tsukasa. En ces lieux maléfiques, la nouvelle vie des élèves de Kamome va se retrouver complètement chamboulée'",isbn:"9791043305740",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043305740-M.jpg"},
  {t:"Toilet-bound",a:"",y:"2025",ed:"Pika édition",cote:"BD TOI",pub:"Jeunesse",sup:"Imprimé",d:"Après le procès tenu par les Gardiens de l horloge, ces derniers ont jugé nécessaire d altérer le passé pour changer le présent. Propulsée dans une autre réalité, Nene prend peu à peu conscience qu elle ne se trouve pas dans son monde d origine, et constate qu un rituel semble être en vogue& et non pas l un des plus anodins.",isbn:"9791043303043",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303043-M.jpg"},
  {t:"Whalefall",a:"Kraus Daniel",y:"2026",ed:"Rivages",cote:"R KRA",pub:"Adulte",sup:"Imprimé",d:"Jay Gardiner s'est lancé dans une quête insensée : retrouver la dépouille de son père disparu dans l’océan Pacifique, au large de Monastery Beach. La seule façon, pour lui, de se libérer du poids de la culpabilité. La plongée commence bien, mais l'apparition d'un calmar géant le met en danger, danger aggravé par l'arrivée d'un cachalot. Soudain, Jay est entraîné dans l’estomac de la bête. Il lui reste une heure avant que ses bouteilles ne se vident, une heure pour vaincre ses démons et s'échapper du ventre du cachalot. « Kraus apporte la rigueur d'un scientifique et la sensibilité d'un poète à ses descriptions du monde sous-marin. » The New York Times « Absolument remarquable. Whalefall est, tout simplement, un roman magnifique. » Gillian Flynn « Des choses plus étranges que d'être avalé par une baleine se sont probablement produites, mais elles ont rarement été racontées aussi bien. » Stephen Graham Jones",isbn:"9782743669195",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743669195-M.jpg"},
  {t:"A propos de Nora",a:"Koval Kristin",y:"2026",ed:"Sonatine",cote:"R KOV",pub:"Adulte",sup:"Imprimé",d:"\" Que pouvez-vous me dire à propos de Nora ? \" Julian Dumont, brillant avocat new-yorkais, revient dans la petite ville de montagne où il a grandi, au coeur du Colorado. Il est là pour aider sa mère, Martine, avocate respectée proche de la retraite, à défendre Nora Sheehan, une adolescente accusée d'avoir tué son propre frère. Les Dumont et les Sheehan se connaissent bien. Trop bien, même. Une histoire tragique unit les deux familles. Si elles ne se fréquentent plus depuis un drame survenu une vingtaine d'années auparavant, elles vont désormais devoir unir leurs forces pour comprendre Nora et la défendre. Mais les raisons pour lesquelles celle-ci a tué son frère demeurent obscures et la jeune fille s'enferme dans un étrange mutisme. Alors que le système judiciaire s'apprête à sceller le sort de Nora, des secrets enfouis depuis trop longtemps remontent bientôt à la surface. Avec ce récit exceptionnel de deux familles séparées par un drame, réunies par un autre, Kristin Koval nous offre une histoire d'une émotion et d'une intensité foudroyantes. Ce premier roman magistral, qui n'est pas sans rappeler Laura Kasischke, Joyce Maynard ou Jeanine Cummins, est aussi un très grand livre sur les liens familiaux, la culpabilité et la possibilité du pardon. \" Profondément humain, indocile, douloureux et généreux. \" Lynn Steger Strong \" A propos de Nora s'ouvre sur un acte de violence terrible, mais ce qui s'y déploie, c'est la délicatesse des histoires de famille, des secrets trop longtemps gardés et des conjonctures. \" Mary Beth Keane",isbn:"9782383991731",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383991731-M.jpg"},
  {t:"La sage-femme de Norolani",a:"Cau Bibbiana",y:"2026",ed:"Charleston",cote:"CAU",pub:"Adulte",sup:"Imprimé",d:"Sardaigne, 1917. Pour échapper à un mariage arrangé, Mallena trouve refuge avec l'amour de sa vie à Norolani. Dans ce village où le mistral porte le souffle de la mer, elle devient vite un pilier. En tant que llevadora, elle aide les femmes à accoucher grâce à un savoir ancestral transmis par sa mère et sa grand-mère. Elle ne demande rien en retour, si ce n'est quelques tranches de fromage ou de pain. Mais tout change lorsque son mari revient du front, blessé dans son corps et dans son âme. Pour payer ses soins, Mallena presse le maire de la rémunérer pour son travail. Hélas cette compensation lui est refusée, et en conformité avec un nouveau décret royal, une sage-femme diplômée est engagée. Alors que Mallena craint d'être remplacée, les fantômes du passé ne tardent pas à la rattraper... A travers le destin inoubliable d'une sage-femme sarde au début du xxe siècle, Bibbiana Cau nous offre une histoire extraordinaire de courage et de solidarité féminine. \"UNE BELLE HISTOIRE DE LUTTE ET DE REDEMPTION\". Vanity Fair Bibbiana Cau est née et vit en Sardaigne. Elle a été sagefemme pendant de longues années au cours desquelles elle a eu le privilège d'assister à d'innombrables naissances. Passionnée par les livres depuis toujours, elle a suivi des ateliers d'écriture. La Sage-femme de Norolani, son premier roman, a été immédiatement n? 1 des ventes en Italie. Traduit de l'italien par Liliane Guillard",isbn:"9782385295158",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295158-M.jpg"},
  {t:"Le livre qu'il ne faut pas ouvrir (sous aucun prétexte !)",a:"Patschke Steve",y:"2021",ed:"Glénat",cote:"A PAT",pub:"Jeunesse",sup:"Imprimé",d:"Pierre, Sami, Sarah et Lucie découvrent une mystérieuse caisse en bois. Sur le couvercle, un message leur intime l'ordre de ne pas l'ouvrir. Un album sur le thème de l'interdit. ©Electre 2022",isbn:"9782344050835",extraUrl:"https://www.babelio.com/couv/CVT_Le-livre-quil-ne-faut-pas-ouvrir_2425.jpg"},
