  {t:"Strasbourg En quelques jours",a:"",y:"2026",ed:"Lonely Planet",cote:"914.439 STR",pub:"Adulte",sup:"Imprimé",d:"Le guide parfait pour visiter Strasbourg le temps d'un weekend ! Lonely Planet, l'éditeur n?1 de guides de voyage dans le monde. Ce guide vous accompagne du parc de l'Orangerie à la cathédrale Notre-Dame, en passant dans chaque quartier pour découvrir les plus beaux monuments de Strasbourg ! Voici tout ce que vous trouverez dans ce guide : - Les endroits incontournables à voir à Strasbourg : la cathédrale Notre-Dame, la Petite France, le musée historique, les bains municipaux Art nouveau enfin réouverts, le musée alsacien, le parc de l'Orangerie, le quartier des institutions européennes ... - Des sélections thématiques : vivre la magie de Noël en Alsace, savourer les spécialités alsaciennes dans une winstub, siroter bières et vins d'Alsace, se balader au fil de l'eau... - Conseils d'experts Lonely Planet : des parcours adaptés à la durée de votre visite, des adresses mises à jour régulièrement, et des recommandations pratiques pour voyager sereinement. - Promenades et itinéraires thématiques : de NoLiStra à l'écoquartier Danube, galeries d'art et boutiques à la Krutenau, une virée en Allemagne, une boucle sauvage au nord de Strasbourg... - Cartes détaillées, plan détachable : un plan détachable de Strasbourg et une carte détaillée pour chaque chapitre. Ce guide inclut également des conseils détaillés pour organiser vos déplacements, des informations pour voyager de manière responsable et des éclairages culturels pour comprendre l'histoire et les traditions strasbourgeoises . Un guide de voyage complet, facile à utiliser et pensé pour vous permettre de plonger au coeur de Strasbourg.",isbn:"9782384929023",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929023-M.jpg"},
  {t:"Chemin des falaises",a:"Richard Jennifer",y:"2026",ed:"Grasset & Fasquelle",cote:"R RIC",pub:"Adulte",sup:"Imprimé",d:"Comment Marie, qui a toujours détesté la campagne et n'a jamais tellement aimé les chiens, se retrouve-t-elle à vivre seule dans un hameau normand avec un malinois de vingt-cinq kilos ? Il a suffi d'une seconde. Une seconde d'inattention, un camion dans un virage, et tout a basculé. Alex n'est plus là et Marie se retrouve veuve, avec pour seul compagnon le chien qu'il avait recueilli. Un long voyage commence pour elle. De Berlin, où ils vivaient leur vie rêvée et cosmopolite, elle part s'installer aux abords de Fécamp, où Alex avait ses racines, et où il espérait finir ses jours. Là, dans la maison du chemin des Falaises, qu'un escalier construit par des prisonniers de guerre allemands relie à la mer, elle affrontera l'épreuve du deuil. Ici, elle survivra ou elle sombrera avec la ville. Car comme elle, Fécamp a connu des jours meilleurs - les années fastes ne sont plus qu'un lointain souvenir pour un peuple de héros déchus, rudoyés par les vagues et lancés à marche forcée vers la modernité. Chemin des Falaises est l'odyssée d'une femme qui navigue sur l'étroite ligne de démarcation entre la solitude et la folie, et que la vie embarque en des contrées inattendues. Marie, qui croyait pouvoir tout maîtriser, doit lâcher prise et se laisser porter... Elle croisera des voisins indiscrets, des femmes bavardes, des lamas, un clown, une veuve ukrainienne, un pêcheur intolérant, des Parisiens plus fermés encore, des jeunes désoeuvrés, un loup de mer renfrogné. Grâce à son chien, elle apprendra à les connaître et à les apprécier, de la même manière qu'elle finira par tomber amoureuse de son nouveau port d'attache. Pour Marie comme pour Fécamp, Chemin des Falaises est une histoire de naufrage et de résurrection.",isbn:"9782246845386",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246845386-M.jpg"},
];

const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};

// Cache (par titre) de l'URL résolue, et ensemble des livres confirmés sans illustration possible
const resolvedUrl={};
const badTitles=new Set();

// Résout l'illustration d'un livre une seule fois, met en cache le résultat (succès ou échec)
async function resolveCover(doc){
  if(resolvedUrl[doc.t]!==undefined) return resolvedUrl[doc.t];
  if(badTitles.has(doc.t)) return null;
  const urls=buildUrls(doc);
  if(!urls.length){ badTitles.add(doc.t); resolvedUrl[doc.t]=null; return null; }
  const url=await tryUrlsAsync(urls);
  resolvedUrl[doc.t]=url;
  if(!url) badTitles.add(doc.t);
  return url;
}

function makeFace(cls,doc,knownUrl){
  const face=document.createElement('div');
  face.className=cls;
  face.style.background='#000';

  if(knownUrl){
    setFaceCover(face,knownUrl,doc);
  } else {
    resolveCover(doc).then(url=>{ if(url && face.isConnected) setFaceCover(face,url,doc); });
  }
  return face;
}

function setFaceCover(face,url,doc,attempt){
  attempt=attempt||0;
  const img=document.createElement('img');
  img.className='cover-img';
  img.alt='';
  img.onerror=()=>{
    img.remove();
    if(attempt===0 && doc){
      // 1er échec : on retente une résolution fraîche pour ce même livre
      delete resolvedUrl[doc.t];
      resolveCover(doc).then(retryUrl=>{
        if(retryUrl && face.isConnected) setFaceCover(face,retryUrl,doc,1);
        else { removeFromPool(doc); fallbackToOtherCover(face,doc); }
      });
    } else {
      removeFromPool(doc);
      fallbackToOtherCover(face,doc);
    }
  };
  img.src=url;
  face.appendChild(img);
}

// Une source qui a échoué deux fois est retirée du pool : on ne la retentera plus
function removeFromPool(doc){
  if(!doc) return;
  goodPool=goodPool.filter(e=>e.doc.t!==doc.t);
}

// En dernier recours, on remplace par une autre couverture du pool déjà confirmée fonctionnelle
// (jamais de case vide : on retombe toujours sur une illustration qui a déjà fonctionné)
function fallbackToOtherCover(face,excludeDoc,triedTitles){
  if(!face.isConnected || !goodPool.length) return;
  triedTitles=triedTitles||new Set();
  if(excludeDoc) triedTitles.add(excludeDoc.t);
  const candidates=shuffle(goodPool.filter(e=>!triedTitles.has(e.doc.t)));
  const pool=candidates.length?candidates:shuffle(goodPool);
  const pick=pool[0];
  const img=document.createElement('img');
  img.className='cover-img';
  img.alt='';
  img.onerror=()=>{
    img.remove();
    triedTitles.add(pick.doc.t);
    // On a essayé suffisamment de candidats différents : on n'insiste pas indéfiniment,
    // mais on retente toujours avec un nouveau candidat tant qu'il en reste un non testé
    if(triedTitles.size<goodPool.length) fallbackToOtherCover(face,null,triedTitles);
  };
  img.src=pick.url;
  face.appendChild(img);
}

let displayed=[],flipTimer=null,popClose=null,goodPool=[],flipQueue=[];

// Teste tous les livres en parallèle au démarrage, ne garde que ceux dont l'illustration charge réellement
async function buildGoodPool(){
  const results=await Promise.all(BOOKS.map(async doc=>{
    const url=await resolveCover(doc);
    return url?{doc,url}:null;
  }));
  return results.filter(Boolean);
}

// Pioche le prochain livre illustré dans une file mélangée (pool de livres confirmés), en évitant les doublons déjà affichés
function nextBookForFlip(){
  if(!goodPool.length) return null;
  if(!flipQueue.length) flipQueue=shuffle(goodPool.map((_,i)=>i));
  const shownTitles=new Set(displayed.map(d=>d&&d.t));
  for(let k=0;k<flipQueue.length;k++){
    const idx=flipQueue[k];
    if(!shownTitles.has(goodPool[idx].doc.t)){
      flipQueue.splice(k,1);
      return goodPool[idx];
    }
  }
  const idx=flipQueue.shift();
  return goodPool[idx];
}

function buildGrid(){
  const mosaic=document.getElementById('mosaic');
  let pool=shuffle(goodPool);
  while(pool.length<44) pool=[...pool,...shuffle(goodPool)];
  const slots=pool.slice(0,44);
  displayed=slots.map(s=>s.doc);
  slots.forEach((entry,i)=>{
    const card=document.createElement('div'); card.className='card'; card.dataset.index=i;
    const inner=document.createElement('div'); inner.className='card-inner';
    inner.appendChild(makeFace('card-front',entry.doc,entry.url));
    const backEntry=slots[(i+22)%slots.length];
    inner.appendChild(makeFace('card-back',backEntry.doc,backEntry.url));
    card.appendChild(inner);
    card.addEventListener('click',()=>openPopup(i));
    mosaic.appendChild(card);
  });
}

function startFlipping(){
  if(flipTimer) clearInterval(flipTimer);
  let lastIndex=-1;
  flipTimer=setInterval(()=>{
    const next=nextBookForFlip();
    if(!next) return; // sécurité : aucun livre illustré disponible
    const cards=[...document.querySelectorAll('.card')];
    // On exclut la tuile retournée juste avant : jamais deux fois de suite la même
    const candidates=cards.filter(c=>parseInt(c.dataset.index)!==lastIndex);
    const pick=candidates[Math.floor(Math.random()*candidates.length)];
    // On met à jour la face actuellement cachée (celle qui va devenir visible), jamais l'inverse
    const isFlipped=pick.classList.contains('flipped');
    const hiddenCls=isFlipped?'card-front':'card-back';
    pick.querySelector('.'+hiddenCls).replaceWith(makeFace(hiddenCls,next.doc,next.url));
    pick.classList.toggle('flipped');
    displayed[parseInt(pick.dataset.index)]=next.doc;
    lastIndex=parseInt(pick.dataset.index);
  },FLIP);
}

function openPopup(i){
  const doc=displayed[i]; if(!doc) return;
  document.getElementById('popup-title').textContent=doc.t||'';
  document.getElementById('popup-author').textContent=doc.a||'';
  const m=[]; if(doc.y) m.push('Paru en '+doc.y); if(doc.ed) m.push('chez '+doc.ed);
  document.getElementById('popup-meta').textContent=m.join(' ');
  document.getElementById('popup-summary').textContent=doc.d||'';
  document.getElementById('pi-cote').textContent=doc.cote||'—';
  document.getElementById('pi-public').textContent=doc.pub||'—';
  document.getElementById('pi-support').textContent=doc.sup||'—';

  const wrap=document.getElementById('popup-cover-wrap');
  const cov=document.getElementById('popup-cover');
  wrap.classList.remove('on'); cov.src='';

  const showPopupCover=url=>{
    cov.onload=()=>{ if(cov.naturalWidth>10) wrap.classList.add('on'); };
    cov.onerror=()=>{ wrap.classList.remove('on'); };
    cov.src=url;
  };

  resolveCover(doc).then(url=>{ if(url) showPopupCover(url); });

  document.getElementById('popup-overlay').classList.add('active');
  clearTimeout(popClose);
  const bar=document.getElementById('popup-timer-progress');
  bar.style.transition='none'; bar.style.width='100%';
  bar.getBoundingClientRect();
  bar.style.transition=`width ${POPUP}ms linear`; bar.style.width='0%';
  popClose=setTimeout(closePopup,POPUP);
}

function closePopup(){
  document.getElementById('popup-overlay').classList.remove('active');
  clearTimeout(popClose);
}

document.getElementById('popup-close').addEventListener('click',closePopup);
document.getElementById('popup-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('popup-overlay'))closePopup();});

async function init(){
  goodPool=await buildGoodPool();
  buildGrid();
  startFlipping();
}
init();
</script>
