  {t:"Yuko",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001928",extraUrl:"https://images.epagine.fr/928/9782413001928_1_m.jpg"},
  {t:"Parvati",a:"Ogaki Philippe",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001966",extraUrl:"https://images.epagine.fr/966/9782413001966_1_m.jpg"},
  {t:"Quatre filles et une coloc",a:"Tsuno Mizoko",y:"2026",ed:"Groupe Delcourt",cote:"BD QUA",pub:"Jeunesse",sup:"Imprimé",d:"Employée de bureau de 28 ans, Shûko Maeda vit en colocation avec trois amies : Eika Matsuki, une forcenée du travail, Misaki Kawaseda, une artiste romantique, et Shio Momoyama, une indépendante née sous une bonne étoile",isbn:"9782413090250",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413090250-M.jpg"},
  {t:"La robe de soie",a:"Mezzalama Chiara",y:"2022",ed:"les Éditions des éléphants",cote:"BDJ MEZ",pub:"Jeunesse",sup:"Imprimé",d:"Les vieilles maisons gardent la mémoire et les secrets. Il ne faut pas avoir peur des ancêtres et des fantômes, ni les oublier.",isbn:"9782372731065",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782372731065-475x500-1.jpg"},
  {t:"Arrière-cuisine",a:"Chapman Katriona",y:"2026",ed:"Futuropolis Gallisol Editions",cote:"BD CHA",pub:"Adulte",sup:"Imprimé",d:"La jeune trentaine, Claudia est en passe de devenir une véritable star de la scène culinaire. Alors qu'elle s'efforce de faire connaître son restaurant d'un quartier hype du Sud-Est de Londres, le Alley, elle décide de participer au prochain concours du Chef de l'année. Tout cela, alors qu'elle tente également de se faire un nom, loin de l'ombre de son célèbre père chef cuisinier français, à la retraite. A l'approche du concours, la tension monte, la pressions des affaires, de la famille et de l'amitié menacent de bouleverser son univers. Pour ce livre, Katriona Chapman donne vie à l'atmosphère sous tension de la vie d'un restaurant. Ses personnages, la chef Claudia, sa meilleure amie et sous-chef Lisa, et le barman Ben sonnent on ne peut plus juste. Le lecteur s'installe à la meilleure table et observe avec gourmandise les envies et les doutes des différents personnages, dans leurs vies personnelles comme professionnelles. Après le très remarqué Breakwater (élu l'un des meilleurs romans graphiques de 2020 pour le New York Times), Katriona Chapman revient avec un récit intimiste au coeur d'un restaurant londonien à la mode. Arrière-cuisine parait quasi simultanément en France et aux USA chez Fantagraphics.",isbn:"9782754848091",extraUrl:"https://covers.openlibrary.org/b/isbn/9782754848091-M.jpg"},
  {t:"SamSam, Tome 01",a:"Bloch Serge",y:"2026",ed:"Bayard éditions",cote:"BDJ BLO",pub:"Jeunesse",sup:"Imprimé",d:"Ensemble, SamPapa, SamMaman, SamSam et SamNounours affrontent tous les dangers et protègent la SamPlanète. Mais ils sont aussi très forts pour les bisous, les câlins et la rigolade ! SamSam, le plus petit des grands héros SamSam, le héros créé par Serge Bloch pour Pomme d'Api, est un enfant comme les autres : il aime jouer avec ses copains, regarder la télé un peu trop longtemps, faire des bêtises... et beaucoup moins ranger sa chambre ou obéir à ses parents ! Mais c'est aussi un superhéros qui part à l'aventure, découvre des planètes inconnues et joue avec des monstres bizarres ! Dans cette nouvelle présentation, les cases ont été agrandies, le texte est plus lisible et la lecture partagée plus simple : un classique à redécouvrir et offrir à tous les enfants de 3 à 7 ans ! SamSam, un héros à retrouver partout ! SamSam est publié tous les mois dans le magazine Pomme d'Api, il est aussi le héros d'un dessin animé diffusé sur France Télévisions, Netflix, YouTube et Okoo et d'un film sorti au cinéma, prix du public au festival Anima de Bruxelles. On le retrouve aussi sur Lumni, en collaboration avec Bayard jeunesse, dans une série sur le vivre-ensemble. SamSam, c'est aussi des histoires audio, des jouets, des jeux et des déguisements. Serge Bloch, l'auteur de SamSam, est aussi le scénariste de Zouk et Max et Lili, et le dessinateur de Toto. « SamSam est un personnage attachant, qui a la particularité de vivre sa vie de superhéros grâce à sa cape magique et son rayon spatial, tout en rencontrant les mêmes problèmes que tout petit Terrien de 6 ans : des lâches attaques de Pipiolis (certaines en plein jour !) à la difficulté de se séparer de son fidèle doudou... » Télérama",isbn:"9791036385292",extraUrl:"https://products-images.di-static.com/image/base/9791036385292-475x500-1.jpg"},
  {t:"Monstres à l'horizon",a:"Bloch Serge",y:"2024",ed:"Bayard éditions",cote:"BDJ BLO",pub:"Jeunesse",sup:"Imprimé",d:"SamSam est un superhéros qui vit sur une planète peuplée d'êtres extraordinaires, affrontant à la fois les dangers de l'espace et les problèmes d'une vie d'enfant. Ses aventures l'aident finalement à grandir et à devenir plus fort. SamSam revient à la télévision pour une nouvelle saison sur Okoo ! 20 épisodes réunis en 3 chapitres : - Plus fort que les monstres ! - Marchel 1er contre-attaque ! - L'amitié c'est sacré !",isbn:"9791036365379",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791036365379-475x500-1.jpg"},
  {t:"L'école des superhéros",a:"Bloch Serge",y:"2022",ed:"BD Kids",cote:"J BLO",pub:"Jeunesse",sup:"Imprimé",d:"Le super-héros SamSam fait sa rentrée des classes, avec sa maîtresse Marie-Agnès, qu'il adore, et ses camarades de l'école. ©Electre 2022",isbn:"9791036350504",extraUrl:"https://products-images.di-static.com/image/base/9791036350504-475x500-1.jpg"},
  {t:"Ce qu'il nous reste à aimer",a:"Dupuis Camille",y:"2026",ed:"R. Laffont",cote:"R DUP",pub:"Adulte",sup:"Imprimé",d:"Roxane a tout pour être heureuse. Un mari aimant. De grands enfants. Des amies fidèles. Un bel appartement à Nice. Et des certitudes bien établies. Oui, Roxane a tout pour être heureuse. Mais elle a aussi un terrible secret...",isbn:"9782221285039",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221285039-M.jpg"},
  {t:"Jaloux comme Manchot !",a:"Lewis-Jones Huw",y:"2026",ed:"Milan",cote:"A LEW",pub:"Jeunesse",sup:"Imprimé",d:"Comment peut-on être jaloux des mouettes ? Elles savent voler, et alors ? Après tout, il suffit d'avoir des ailes ! Pour Manchot, rien d'impossible... ou presque !",isbn:"9782408060435",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408060435-475x500-1.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève du lycée Chidori qui  rassemble des garçons au plus bas de l échelle  scolaire, fait un jour la connaissance de  Kaoruko Waguri, qui fréquente l établissement  des filles de bonne famille, Kikyô.  Le jeune homme aux traits durs, habitué à  effrayer les autres sans le vouloir, est d'abord  perplexe devant l attitude de Kaoruko,   qui lui fait face avec une grande sincérité.  Cependant, il va peu à peu oser s ouvrir à la  jeune fille&Malgré le rapprochement qui s'opère entre  les deux lycéens, le fossé entre leurs écoles  voisines reste encore profond. C est alors qu un  jour, Subaru Hoshina, une amie de Kaoruko  qui déteste cordialement Chidori, interpelle  Rintarô&Roméo et Juliette moderne,   référence incontournable au Japon,   Bloom est une vraie pépite de  comédie et d émotions !",isbn:"9782373499766",extraUrl:"https://covers.openlibrary.org/b/isbn/9782373499766-M.jpg"},
  {t:"Bêêê, oui ! Meuh, non !",a:"Gutman Colas",y:"2026",ed:"L'École des loisirs",cote:"A MAU",pub:"Jeunesse",sup:"Imprimé",d:"Petit mouton cherche sa famille, il demande à la vache si elle est sa maman, mais elle lui répond MEUH, NON ! Il demande au tigre s'il est son papa, mais il lui répond GRRR, NON ! Le serpent répond TSSS, NON ! quand il lui demande s'il est sa tata... Pauvre petit mouton... quand va-t-il retrouver quelqu'un de sa famille ?",isbn:"9782211349024",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782211349024-475x500-1.jpg"},
  {t:"Silence, Léo, ça tourne",a:"Schmitt Michel-Yves",y:"2024",ed:"La Boîte à bulles",cote:"BDJ SCH",pub:"Jeunesse",sup:"Imprimé",d:"En visite au musée, Céline est repérée pour rejoindre le casting de la prochaine série de Proflix. Intégrant une équipe de super héros affrontant des aliens pilleurs de trésors, elle interprétera bientôt le rôle de Zif, la fille la plus rapide du monde. Face à la célébrité grandissante de sa soeur, difficile pour Léopold de ne pas être jaloux. N'est-ce pas lui le véritable super héros ? Pire encore, il est obligé d'assister au tournage des aventures de ces héros de seconde zone ! Jamais à court de bêtises, il va mettre la zizanie dans les studios. Et c'est au détour d'un couloir qu'il fait une découverte de taille : des extra-terrestres déguisés en humains semblent préparer un complot visant à piller les trésors de l'humanité. S'agit-il d'un complot intergalactique ou Léopold fabule-t-il ? Parfois, la frontière entre fiction et réalité est floue et faire la part de choses n'est pas chose aisée.",isbn:"9782849535035",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782849535035-475x500-1.jpg"},
  {t:"L'Atelier des Sorciers",a:"Shirahama Kamome",y:"2026",ed:"Pika édition",cote:"BD ATE",pub:"Jeunesse",sup:"Imprimé",d:"Coco et les sorciers ont établi un plan pour stopper la sangsue-rideau qui déferle sur la ville. Malheureusement, l'opération semble vouée à l'échec à cause des intempéries. Mais Coco a une idée et elle se précipite vers le danger avec Agathe pour tenter de régler la situation... Le plan va-t-il être finalement couronné de succès ?",isbn:"9791043307751",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043307751-M.jpg"},
  {t:"Dans le ventre de Cornebidouille",a:"Bertrand Pierre",y:"2026",ed:"L'École des loisirs",cote:"A BER",pub:"Jeunesse",sup:"Imprimé",d:"Quand Pierre ne veut pas manger sa soupe, Cornebidouille déboule ! Plus mauvaise et pétaradante que jamais, la sorcière au langage fleuri engloutit cette fois le petit garçon dans son sommeil. Il se réveille dans son ventre, où règne un bazar pas possible. Heureusement, ses doudous ont aussi été avalés et les trois compères ont plus d'un tour dans leur sac pour lui faire regretter son sortilège !",isbn:"9782211348355",extraUrl:"https://covers.openlibrary.org/b/isbn/9782211348355-M.jpg"},
  {t:"Ouzbékistan",a:"MacLeod Calum",y:"2008",ed:"Éd. Olizane",cote:"915.87 MAC",pub:"Adulte",sup:"Imprimé",d:"",isbn:"9782880863616",extraUrl:"https://covers.openlibrary.org/b/isbn/9782880863616-M.jpg"},
  {t:"Off",a:"Renard Romain",y:"2026",ed:"Daniel Maghen",cote:"BD REN",pub:"Adulte",sup:"Imprimé",d:"Une tempête solaire a provoqué à l'échelle mondiale une coupure de courant généralisée qui risquent d'être durable. Tout s'arrête et menace de s'effondrer. Les destins croisés de cinq hommes et femmes racontent la chronique d'un monde qui pourrait être le nôtre... quand il faudra tout recommencer",isbn:"9782356742162",extraUrl:"https://covers.openlibrary.org/b/isbn/9782356742162-M.jpg"},
  {t:"La Recette",a:"Verjus Bruno",y:"2026",ed:"Albin Michel",cote:"R VER",pub:"Adulte",sup:"Imprimé",d:"Un conte initiatique et sensuel où la cusine fait corps - et âme - avec notre humanité. La Tribune Dimanche Un premier roman plein de de relief, de surprises, de découvertes. Le Figaro Magazine Une odyssée vibrante d'humanité, où le goût aide à réenchanter le monde Miki, jeune femme cantonaise vivant à Paris, est habitée par une fascination singulière pour la mémoire culinaire française. Lorsqu'elle découvre un carnet ancien signé du mystérieux Henry Cornil, elle se lance dans une quête inattendue : retrouver la trace d'un dessert oublié - la tarte aux pralines roses - et, à travers elle, celle de chefs qui ont fait de la cuisine un art de vivre, de penser, d'aimer. Des bistrots parisiens aux tables étoilées jusqu'à la frugalité lumineuse des villages grecs, Miki avance à la recherche d'un goût juste, d'un geste vrai. Chemin faisant, elle explore ce que signifie réellement \"bien manger\" : un geste d'amour et de beauté. Avec La Recette, Bruno Verjus signe un premier roman sensuel et érudit, où la cuisine devient une langue universelle, capable de dire le temps, la mémoire et le bonheur partagé. Chef doublement étoilé au Michelin, Bruno Verjus a exercé de nombreux métiers à travers le monde, notamment en Asie, avant de s'imposer en autodidacte parmi les grandes voix de la gastronomie mondiale contemporaine. Il est également l'auteur de l'essai L'Art de nourrir (Flammarion).",isbn:"9782226504791",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226504791-M.jpg"},
  {t:"A propos de Nora",a:"Koval Kristin",y:"2026",ed:"Sonatine",cote:"R KOV",pub:"Adulte",sup:"Imprimé",d:"\" Que pouvez-vous me dire à propos de Nora ? \" Julian Dumont, brillant avocat new-yorkais, revient dans la petite ville de montagne où il a grandi, au coeur du Colorado. Il est là pour aider sa mère, Martine, avocate respectée proche de la retraite, à défendre Nora Sheehan, une adolescente accusée d'avoir tué son propre frère. Les Dumont et les Sheehan se connaissent bien. Trop bien, même. Une histoire tragique unit les deux familles. Si elles ne se fréquentent plus depuis un drame survenu une vingtaine d'années auparavant, elles vont désormais devoir unir leurs forces pour comprendre Nora et la défendre. Mais les raisons pour lesquelles celle-ci a tué son frère demeurent obscures et la jeune fille s'enferme dans un étrange mutisme. Alors que le système judiciaire s'apprête à sceller le sort de Nora, des secrets enfouis depuis trop longtemps remontent bientôt à la surface. Avec ce récit exceptionnel de deux familles séparées par un drame, réunies par un autre, Kristin Koval nous offre une histoire d'une émotion et d'une intensité foudroyantes. Ce premier roman magistral, qui n'est pas sans rappeler Laura Kasischke, Joyce Maynard ou Jeanine Cummins, est aussi un très grand livre sur les liens familiaux, la culpabilité et la possibilité du pardon. \" Profondément humain, indocile, douloureux et généreux. \" Lynn Steger Strong \" A propos de Nora s'ouvre sur un acte de violence terrible, mais ce qui s'y déploie, c'est la délicatesse des histoires de famille, des secrets trop longtemps gardés et des conjonctures. \" Mary Beth Keane",isbn:"9782383991731",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383991731-M.jpg"},
  {t:"Le labyrinthe des brumes",a:"Burniat Mathieu",y:"2026",ed:"Charivari",cote:"BDJ BUR",pub:"Jeunesse",sup:"Imprimé",d:"Toujours sur les traces de l'armée de Neptune et de Lyssa, Icare et Kalio mettent le cap au nord, vers l'île aux quatre couleurs. Ils arrivent en pleine course annuelle : les quartiers s'affrontent en quête du pouvoir. L'amitié d'Icare et Kalio, champions de familles rivales, survivra-t-elle à leur affrontement dans le labyrinthe des brumes ?",isbn:"9782487663404",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487663404-M.jpg"},
  {t:"Au dodo maintenant !",a:"Iriyama Satoshi",y:"2026",ed:"Milan",cote:"A IRI",pub:"Jeunesse",sup:"Imprimé",d:"Les bruits de la forêt empêchent cinq petits ratons laveurs de s'endormir. Ils finissent par trouver le sommeil chacun leur tour, sauf le petit dernier, à qui la nuit réserve une belle surprise...",isbn:"9782408059163",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782408059163-475x500-1.jpg"},
  {t:"Haley",a:"Oda Eiichirō",y:"2026",ed:"Glénat",cote:"BD ONE",pub:"Jeunesse",sup:"Imprimé",d:"Se hisser sur les épaules des géants ! Maintenant qu'elle a débarqué sur Erbaf, Robin peut enfin fêter ses retrouvailles tant attendues avec Sauro. Mais alors que de nouvelles aventures débutent dans cette contrée inconnue, des personnages pour le moins inquiétants font leur apparition. Faut-il y voir le présage d'une tempête ? ! Les aventures de Luffy à la poursuite du One Piece continuent !",isbn:"9782344068922",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344068922-M.jpg"},
  {t:"Sucre Noir",a:"Ollagnier Virginie",y:"2026",ed:"Le Lombard",cote:"BD EFA",pub:"Adulte",sup:"Imprimé",d:"D'après le roman de Miguel Bonnefoy. Dans un petit village des Caraïbes, où la légende d'un trésor disparu vient bouleverser l'existence de la famille Otero, les explorateurs se succèdent. Tous sont à la recherche du butin du capitaine Henry Morgan. Et tous vont croiser le chemin de Serena Otero, l'héritière de la plantation de cannes à sucre qui rêve à d'autres horizons, ainsi que celui de sa fille, Eva Fuego. Au fil des ans, tandis que la propriété familiale prospère, qu'elle distille alors le meilleur rhum de la région, chacun cherche le trésor qui donnera un sens à sa vie. Et si le véritable trésor n'était pas celui qu'ils croyaient ? Avec cette adaptation du roman de Miguel Bonnefoy, Ricard Efa et Virginie Ollagnier nous transportent dans un récit transgénérationnel empreint de réalisme magique qui fait la part belle aux femmes de la famille Otero, véritables héroïnes de ce récit.",isbn:"9782808211659",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808211659-M.jpg"},
  {t:"Amir",a:"Ogaki Philippe",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue",isbn:"9782413001935",extraUrl:"https://images.epagine.fr/935/9782413001935_1_m.jpg"},
  {t:"Les Soeurs de Skara",a:"Buchanan Tanner",y:"2026",ed:"Calmann-Lévy",cote:"R BUC",pub:"Adulte",sup:"Imprimé",d:"Quatre s'urs dispersées à travers le monde Une saga historique captivante. Écosse, 1931. Lorsque le père des s'urs Blackmore renverse des pierres ancestrales sur la péninsule sauvage de Skara, une malédiction s'abat sur toute la famille. Après la mort de leurs parents et la perte de leur fortune, les filles n'ont d'autre choix que de quitter leur maison avec pour unique possession une bague chacune, héritée de leur mère. L'aînée, Iris, voyage vers l'est'd'abord Ceylan et ensuite l'Australie'à la recherche d'un oncle qui, elle l'espère, les sauvera de la misère. Australie, de nos jours. Roz Chatton déménage à Londres en emportant une bague trouvée dans les affaires de sa mère récemment disparue. Chez un antiquaire, elle voit un tableau des pierres de Skara qui semble révéler un lien mystérieux avec le bijou. Grâce à l'aide d'un jeune avocat, Finn Drummond, elle met au jour des secrets qu'elle n'aurait jamais pu imaginer",isbn:"9782702195215",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702195215-M.jpg"},
  {t:"L'Exercice des mâchoires",a:"Vernhes Adélie",y:"2026",ed:"Julliard",cote:"843.92 VER",pub:"Adulte",sup:"Imprimé",d:"\"Je veux raconter la cuisine comme elle est, par celles et ceux qui la font. Celles et ceux qui y gravitent, que l'on rencontre de jour comme de nuit.\" De la cuisine d'un étoilé au zinc des brasseries parisiennes en passant par une enseigne de prêt-à-manger, Adélie Vernhes raconte par tableaux successifs les joies et les peines de la restauration. Elle retranscrit aussi bien le tourbillon des coups de feu - où tous les sens sont en éveil, où chaque plat est source d'émerveillement et de créativité - que les rencontres d'hommes et de femmes associant leur solitude après le service. Des cadences infernales des cuisines aux repas partagés au petit matin, L'Exercice des mâchoires est un portrait sensoriel et délicat de celles et ceux qui ont fait viril de nourrir autrui, parfois au détriment de leur propre personne.",isbn:"9782260057352",extraUrl:"https://covers.openlibrary.org/b/isbn/9782260057352-M.jpg"},
  {t:"Legardien de la colline aux cerisiers",a:"Faggiani Franco",y:"2026",ed:"Paulsen",cote:"R FAG",pub:"Adulte",sup:"Imprimé",d:"**Inspiré d'une histoire vraie, ce roman est une ode à la halte et au sens qu'on trouve chemin faisant.** À l'approche des jeux olympiques de 1912, l'empereur Mutsuhito, désireux de renforcer ses relations diplomatiques avec l'Occident, a besoin d'athlètes pour défendre les couleurs du Japon. Tous les jours, à l'aube, le jeune Shizo Kanakuri parcourt les versants boisés qui bordent la demeure de ses parents. C'est ainsi que ce coureur solitaire se sent vivant et éprouve les bienfaits de la nature. Sa foulée remarquable et l'étrange grâce avec laquelle il court retiennent l'attention d'un entraîneur qui le prépare au marathon des jeux olympiques de Stockholm. Alors que les sportifs japonais sont rares à s'illustrer dans la pratique des sports occidentaux, Shizo est le favori de l'épreuve. Pourtant, à sept kilomètres de la ligne d'arrivée, il se volatilise. Une singulière fugue qui fait dévier le cours de son destin. Il lui faudra 54 ans, 8 mois, 6 jours, 5 heures, 32 minutes et 20 secondes pour venir à bout de son marathon. Un détour qui lui permettra de trouver un sens à sa vie. \" Délicat et profond, un formidable roman picaresque inspiré de faits réels. \" *Corriere della Sera* \" Le roman de Faggiani possède le don rare d'envoûter le lecteur dès les premières pages comme une fable sur les caprices du destin. \" *La Stampa* \" La biographie romancée de Faggiani exalte notre vie spirituelle, célèbre la course à pied comme une forme de prière et invite à un mysticisme de la nature. \" *La Repubblica* \" Faggiani parvient à saisir l'instant et à le faire éclore, créant ainsi une littérature de la nature où se mêlent l'infiniment petit et l'infiniment grand. \" *Il Foglio* \" La sérénité et la beauté qui émanent de la prose de Faggiani, ravivent à chaque page notre désir de contempler la nature. \" Luca Mercalli **Prix Biblioteche di Roma 2019** Première sélection du **Prix Bancarella 2020**",isbn:"9782375024812",extraUrl:"https://covers.openlibrary.org/b/isbn/9782375024812-M.jpg"},
  {t:"Ruptures",a:"Minier Bernard",y:"2026",ed:"XO Editions",cote:"R MIN",pub:"Adulte",sup:"Imprimé",d:"Lucia Guerrero face aux nouveaux maîtres du monde. Lundi 28 avril 2025. L'Espagne est paralysée par la plus grande panne électrique de son histoire. Directrice de la filiale espagnole de StarCo, Emma Bosch se précipite au chevet de son père, dont la vie dépend d'un respirateur artificiel. Elle n'arrivera jamais. Aux Etats-Unis, les corps sans vie de plusieurs collaboratrices du célèbre milliardaire Milton Gail, le fantasque et génial fondateur de StarCo, sont retrouvés. Toutes étaient enceintes. C'est le début de l'extraordinaire enquête que va mener Lucia Guerrero des deux côtés de l'Atlantique et dans les fabriques ultra-secrètes où s'inventent le présent et le futur de milliards d'individus. Jusqu'à un face-à-face inoubliable avec celui qui a fait main basse sur la terre et sur l'espace. Une plongée glaçante dans la toute-puissance de l'Amérique de Donald Trump.",isbn:"9782374489513",extraUrl:"https://covers.openlibrary.org/b/isbn/9782374489513-M.jpg"},
  {t:"Nous qui avons connu Solange",a:"Vareille Marie",y:"2026",ed:"Flammarion",cote:"R VAR",pub:"Adulte",sup:"Imprimé",d:"Sarégnac, Corrèze. Célestine grandit dans la ferme familiale, bien décidée à réussir ses études pour échapper à la vie de labeur qui l'attend aux champs. Cadiran, Gironde. Solange est internée dans une école de préservation pour jeunes filles où sont envoyées des adolescentes jugées \"déviantes\". Quel secret lie ces deux jeunes femmes ? Pourquoi Solange déteste-t-elle tant Célestine ? Et comment cette dernière a-t-elle pu commettre l'irréparable ? De la France de nos grands-parents jusqu'à nos jours, cette intrigue poignante ménage autant de suspense que de rebondissements. A travers les destinées de quatre générations de femmes puissantes, Marie Vareille retrace l'extraordinaire évolution de notre monde depuis un siècle et nous rappelle ce que nous devons tous à la persévérance et au courage de nos aînées.",isbn:"9782080476418",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080476418-M.jpg"},
  {t:"Love",a:"Cashell Sophie",y:"2026",ed:"Editions Gründ",cote:"A CAS",pub:"Jeunesse",sup:"Imprimé",d:"Un album tendre et poétique sur l'amour pour les petits ! Et s'il existait un monde où règne l'amour ? Et si ce monde, c'était le nôtre ? Ce livre regorge de belles idées pour transmettre l'amour autour de soi. Il nous rappelle qu'avec de petits gestes du quotidien, ou même simplement en étant présent, chacun peut contribuer à rendre le monde plus tendre. Un bel album cartonné sur l'amour, les différences et la tolérance, illustré avec tendresse par Axel Scheffler.",isbn:"9782324038099",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782324038099-475x500-1.jpg"},
  {t:"Le pain des anges",a:"Smith Patti",y:"2026",ed:"Gallimard",cote:"B SMI",pub:"Adulte",sup:"Imprimé",d:"Dans Le pain des anges, Patti Smith poursuit son oeuvre autobiographique par une méditation intime sur la mémoire, l'absence et ce qui nourrit une vie. Entre fragments de souvenirs et confessions, sa prose épurée et poétique se déploie sur huit décennies de vie en faisant dialoguer enfance et liberté, vivants et morts, art et sacré, dans un livre de fidélité et de gratitude qui célèbre, avant tout, le pouvoir de la littérature.",isbn:"9782070105588",extraUrl:"https://covers.openlibrary.org/b/isbn/9782070105588-M.jpg"},
  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"Après la mort du roi, alors que le prince Boiji est pressenti pour le remplacer, la reine Hiling tente de contrecarrer son accession au trône. Et comble de malchance, son ami Ombre a disparu. ©Electre 2022",isbn:"9791032712184",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712184-M.jpg"},
  {t:"Très brève théorie de l'enfer",a:"Ferrari Jérôme",y:"2026",ed:"Actes Sud",cote:"R FER",pub:"Adulte",sup:"Imprimé",d:"Après avoir quitté son île natale pour enseigner à Alger, un homme, mû par le désir d'un ailleurs où échapper à lui-même, prend un poste au lycée français d'Abu Dhabi et s'y installe avec femme et enfant. Bientôt, leur trajectoire effleure celle de leur employée, Kaveesha, partie du Sri Lanka trente ans plus tôt et voguant depuis de famille en famille pour subsister. Expatrié, immigré - deux manières d'être étranger, deux mots pour dire deux mondes, séparés par un mur invisible que l'empathie ne saurait abattre. Dans une langue acérée, ténébreuse, Jérôme Ferrari poursuit l'examen lucide de notre rapport à l'autre et livre un nouvel opus déchirant des \"Contes de l'indigène et du voyageur\".",isbn:"9782330216382",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216382-M.jpg"},
  {t:"Brûlez tout",a:"Molmy Christophe",y:"2025",ed:"Fayard",cote:"R MOL",pub:"Adulte",sup:"Imprimé",d:"Cette nuit-là, un feu ravage la permanence d'un député. Le lendemain, un relais 5G explose. Quelques jours plus tard, un essayiste célèbre est violemment agressé, un avocat menacé de mort. A chaque fois, la même revendication, la même signature : un mystérieux groupe sème la terreur... et diffuse ses exploits sur les réseaux sociaux, sous les yeux d'une France sidérée. Face à cette vague de crimes spectaculaires, Sacha Letellier, flic à l'ancienne, se lance dans une course contre la montre. Marqué par une fusillade qui a pulvérisé sa vie, incompris de ses collègues, il doit affronter une criminalité nouvelle, insaisissable, qui se nourrit du chaos numérique et défie la police à chaque clic. Mais quand la technologie devient le terrain de jeu des criminels, Sacha n'a plus qu'une arme : son instinct. Et s'il était le seul à pouvoir faire tomber ce réseau qui rêve d'insurrection ? Christophe Molmy est flic et écrivain. Ancien patron de la BRI de Paris, il dirige aujourd'hui la brigade de protection des mineurs. Brûlez tout est son septième roman.",isbn:"9782213733920",extraUrl:"https://covers.openlibrary.org/b/isbn/9782213733920-M.jpg"},
  {t:"La pensionnaire",a:"Fielding Joy",y:"2026",ed:"Michel Lafon",cote:"R FIE",pub:"Adulte",sup:"Imprimé",d:"Le nouveau thriller de Joy Fielding, après le succès de La Gouvernante vendu à plus de 40 000 exemplaires en France ! \" Ce thriller de Joy Fielding joue habilement avec la frontière entre folie, culpabilité et vérité jusqu'à la dernière page. \" Le Courrier Picard \"C'est un secret. Vous ne devez le dire à personne\". A la suite de la disparition de son mari, Linda Davidson rend visite à une amie installée à Legacy Place, une résidence pour personnes âgées. Elle y rencontre Jenny Cooper, une pensionnaire qui lui fait un aveu troublant : elle tue des gens. Dans un premier temps, Linda accorde peu de crédit à ces paroles. Mais la mort soudaine d'un autre résident éveille ses soupçons. Jenny Cooper est-elle une vieille dame sénile... ou une serial killer ? \" Un thriller puissant qui touche en plein coeur ! \" Oprah Winfrey",isbn:"9782749963860",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749963860-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève d un lycée qui rassemble des garçons au plus bas de l échelle scolaire, fait un jour la connaissance de Kaoruko Waguri, qui fréquente un établissement de filles de bonne famille.Appréciant de plus en plus les moments passés en compagnie de la jeune fille, notre héros commence bientôt à s apercevoir de ses sentiments naissants à son égard.Un jour, alors qu ils se retrouvent tous les deux, submergé par ses sentiments à l égard de Kaoruko, les mots lui échappent& et Rintarô lui déclare sa flamme.  Suite à cet épisode, il est bien déterminé à lui transmettre tout ce qu il ressent pour elle.  L amour sincère entre ces deux lycéens que tout oppose, et pourtant si proches, finira-t-il par éclore ?",isbn:"9782384963928",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963928-M.jpg"},
  {t:"L'odyssée de Luca",a:"Bréchignac Catherine",y:"2026",ed:"Cerf",cote:"121 BRE",pub:"Adulte",sup:"Imprimé",d:"Et si la destinée de Luca, jeune homme au nom inspiré du dernier ancêtre commun à tous les êtres vivants (Last Universal Common Ancestor), rejouait toute l'épopée de l'humanité vers la rationalité ? Au lycée, il s'éprend des grands penseurs, rêvant d'une vie guidée par la science et la philosophie. Mais cette noble ambition se heurte bientôt à la réalité : voilà Luca confronté aux limites de la raison, celles de la passion amoureuse et des réseaux sociaux. Comment déjouera-t-il les erreurs de la raison, tels les biais cognitifs ? Comment parviendra-t-il à garder la réflexion pour boussole et à éviter de perdre le nord ? A travers ce récit initiatique, Catherine Bréchignac dépeint avec brio ce nouveau monde où l'opinion prend le pas sur l'argumentation, l'ignorance sur la science, la domination sur l'émancipation. Un constat sans concession, porté par une voix d'exception, sur les pièges mortifères de l'actuelle déraison. Physicienne de renommée internationale, membre de l'Académie des sciences et de l'Académie des technologies, après avoir été directrice puis présidente du CNRS, Catherine Bréchignac est l'autrice d'essais remarqués, dont Retour vers l'obscurantisme (2022) et La Force de nos racines (2024).",isbn:"9782204170451",extraUrl:"https://covers.openlibrary.org/b/isbn/9782204170451-M.jpg"},
  {t:"A Troie, on lâche tout !",a:"Larbier Philippe",y:"2022",ed:"Bamboo Edition",cote:"BDJ LAR",pub:"Jeunesse",sup:"Imprimé",d:"La mythologie grecque revisitée par un humour légendaire ! Sale période pour Achille. La mère d'un des plus grands héros de la mythologie grecque a peur pour son fils car elle a appris qu'il ne reviendra pas de la guerre. Elle décide de le déguiser en fille et de le planquer sur une île habitée uniquement par des femmes. Il faudra toute la ruse d'Ulysse pour démasquer son copain et le traîner avec lui pour se préparer à ce qui deviendra, des années plus tard, la guerre de Troie... Qui a dit que Petit Mythos était un métier de tout repos ?",isbn:"9782818994894",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818994894-475x500-1.jpg"},
  {t:"Les Schtroumpfs",a:"Peyo",y:"2023",ed:"Hachette",cote:"LJ PEY",pub:"Jeunesse",sup:"Imprimé",d:"Le Grand Schtroumpf, le Schtroumpf à Lunettes, la Schtroumpfette... Retrouve tes personnages préférés et de nombreux objets dans chacune des scènes schtroumpfantes de ce livre. A toi de jouer !",isbn:"9782017246787",extraUrl:"https://products-images.di-static.com/image/base/9782017246787-475x500-1.jpg"},
  {t:"Crète party",a:"Cazenove Christophe",y:"2020",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeunesse",sup:"Imprimé",d:"La mythologie grecque revisitée par un humour légendaire ! Mais où donc habite Poséidon ? Et pourquoi n'en sait-on pas plus sur ses enfants, Triton et Rhodé ? Et si on en profitait pour expliquer pourquoi c'est à cause du dieu de la mer qu'est né le Minotaure ? Et le Minotaure, pourquoi est-il obligé de vivre dans un labyrinthe construit par un certain Dédale sur ordre du roi Minos ? Les questions sont nombreuses, espérons que nos petits Mythos sauront apporter plus de réponses que de catastrophes !",isbn:"9782818976746",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818976746-475x500-1.jpg"},
  {t:"Les animaux",a:"Jugla Cécile",y:"2026",ed:"Lito",cote:"J 590.83 JIG",pub:"Jeunesse",sup:"Imprimé",d:"Plus de 160 questions étonnantes, et leurs réponses tout aussi passionnantes, pour découvrir les animaux du monde entier !",isbn:"9782244428710",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782244428710-475x500-1.jpg"},
  {t:"Il n'y a pas de place pour la mort",a:"Quignard Pascal",y:"2026",ed:"Hardies",cote:"R QUI",pub:"Adulte",sup:"Imprimé",d:"\"Ecris ce livre en sorte que ta vie pénètre en lui sans qu'elle mente. Que quelque chose touche celle qui n'en a pas été touchée\". \"Il n'y a pas de place pour la mort\" : un homme et une femme s'enfuient. Le nouveau roman de Pascal Quignard aux Editions Hardies. \"Quelle joie qu'un nouvel éditeur apparaisse. Quel bonheur qu'il se soucie de littérature pure. Quelle merveille enfin que l'amitié, la mémoire, la ferveur, les passions partagées y président. Je sens qu'un destin magique nous favorise\". Pascal Quignard",isbn:"9782959564369",extraUrl:"https://covers.openlibrary.org/b/isbn/9782959564369-M.jpg"},
  {t:"Le jour où je suis devenue plus méchante que le loup",a:"Javaux Amélie",y:"2026",ed:"Mijade",cote:"J JAV",pub:"Jeunesse",sup:"Imprimé",d:"Dans mon école, il y a un méchant loup. Elle s'appelle Agnès et se déplace toujours avec sa meute. Pour que ses moqueries cessent et avoir moi aussi des super copines... je suis devenue plus méchante que le loup.",isbn:"9782807702752",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782807702752-475x500-1.jpg"},
  {t:"L'autre enquête",a:"Horst Jørn Lier",y:"2026",ed:"Gallimard",cote:"R HOR",pub:"Adulte",sup:"Imprimé",d:"Le silence inquiétant d'une internaute norvégienne membre d'un forum en ligne qui enquête sur le meurtre d'une touriste australienne sur la Costa Brava. Une camionnette immatriculée en Espagne et abandonnée depuis plusieurs jours près d'un arrêt de car dans le secteur de l'inspecteur Wisting. Le corps d'une jeune femme retrouvé non loin de là, sous la neige qui tombe sans relâche. Autant d'éléments convergents qui incitent Wisting à sauter dans un avion pour la Catalogne. Loin de sa zone de confort, il va devoir composer avec un groupe de détectives amateurs aux méthodes peu orthodoxes et une police locale plutôt réticente à coopérer.",isbn:"9782073074928",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073074928-M.jpg"},
  {t:"Le crime d'Halloween",a:"Christie Agatha",y:"2024",ed:"Paquet",cote:"BD ZIE",pub:"Adulte",sup:"Imprimé",d:"Fin octobre, dans le petit village de Woodleigh Common, on fête sorcières et fantômes. Rowena Drake, personnalité importante de la localité, reçoit petits et grands pour une soirée mémorable ! Mais, devant l'assistance médusée, une des jeunes participantes déclare avoir déjà assisté à un meurtre. Bien sûr, personne ne prend au sérieux cette jeune fille connue pour ses mensonges. Or, en fin de soirée, son cadavre est retrouvé dans la bibliothèque. La fète est terminée, les affaires sérieuses commencent pour Hercule Poirot ! Ses petites cellules grises vont avoir fort à faire afin de découvrir l'assassin !",isbn:"9782889324644",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889324644-M.jpg"},
  {t:"Christmas Pudding",a:"Bottier Isabelle",y:"2025",ed:"EP média",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Connaissez-vous la recette du Christmas pudding selon Hercule Poirot ? Prenez une belle maison dans la campagne anglaise, installez-y une famille respectable, où se mélangent la jeunesse et la tradition, insérez une mission secrête, un peu d'imprévu et quelques invités, tournez bien l'ensemble, et n'oubliez pas... Tout le monde doit mettre la pain à la pâte, y compris le voleur et l'assassin ! Une nouvelle enquête pour le plus grand des détectives, dans la tradition d'un Noël anglais, mais avec le chauffage central. Car c'est important, ça, le chauffage central...",isbn:"9782889326655",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889326655-M.jpg"},
  {t:"La grande soif",a:"Cassano Erica",y:"2026",ed:"Jean-Claude Lattès",cote:"R CAS",pub:"Adulte",sup:"Imprimé",d:"La lutte d'une femme pour sa liberté. La fascinante ville de Naples entre Occupation et Libération. La révélation d'une nouvelle voix. Naples, 1943. L'eau manque partout, sauf dans la maison où vivent Anna et sa famille. Devant la Maison de l'eau, la file des femmes qui cherchent à se désaltérer s'allonge. La soif qu'Anna ressent est différente : c'est une soif de vivre et de revanche. A vingt ans, elle voudrait étudier la littérature, lire, s'épanouir dans une ville sans décombres, sans sirènes d'alerte aérienne. Mais il n'y a pas de temps pour rêver. Le père a disparu, la mère s'est renfermée, la soeur et le neveu sont malades. Leur futur dépend d'elle. Alors, dès qu'elle en a l'opportunité, Anna accepte un poste de secrétaire à la base américaine de Bagnoli. Elle entre dans un monde inconnu de promesses qui enchantent et effraient à la fois. La solution la plus facile serait de fuir, de laisser les années douloureuses de la guerre derrière elle. Mais Anna ne veut pas que quelqu'un la sauve. Comme Naples, elle espère gagner elle-même sa liberté. La grande soif est le récit d'un petit monde immense, de ses silences et de ses bruits, d'une aspiration à quelque chose de plus grand qui sommeille en nous. Traduit de l'italien par Anaïs Bouteille-Bokobza",isbn:"9782709676328",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709676328-M.jpg"},
  {t:"Grand-Père",a:"Ieradi Assia",y:"2026",ed:"Alice",cote:"A IER",pub:"Jeunesse",sup:"Imprimé",d:"Au lieu de parler, Grand-Père fait des sons étranges. Le seul qui semble le comprendre, c'est son chien. Mais ça, on n'en est pas bien sûrs.",isbn:"9782874266904",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782874266904-475x500-1.jpg"},
  {t:"Au nom d'Amra",a:"Deschard Jean-Gaël",y:"2026",ed:"Vents d'Ouest",cote:"BDJ DES",pub:"Jeunesse",sup:"Imprimé",d:"Qui survivra au Jugement d'Amra ? Alors qu'Asmodée et Oni reviennent tout juste de leur périlleuse mission à Ferroc, le royaume de Sayran est en proie au chaos : un culte fanatique, celui d'Amra, a pris le contrôle de la ville, imposant sa foi par la force et la peur, et demandant expressément la libération de Sainte Namielle, leur Semi-déus guérisseuse. Mais les négociations tournent court, et pour écraser Amra, la Reine Bérénice n'hésite pas à libérer les plus dangereux des Semi-Déus enfermés depuis des années dans le Cloître Doré. Pendant ce temps, Asmodée et Orphée tentent un plan pour essayer de raisonner les Amraïtes. Mais Antios, l'archonte d'Amra, impose bientôt un jugement divin : les pouvoirs des Semi-Déus doivent être purifiés ou éradiqués. La tension monte, les alliances se brisent et les trahisons se multiplient. Une guerre sainte est sur le point d'éclater, opposant fanatiques, résistants et Semi-Déus. Ces derniers, longtemps utilisés comme armes, doivent choisir : se soumettre, fuir... ou se battre. Dans ce nouveau tome, les masques tombent, les secrets éclatent, et la frontière entre foi et folie devient floue. Un album captivant, entre intrigues politiques, manipulations et suspense, qui nous offre son florilège de personnages et une héroïne attachante dans un univers empreint de mystère.",isbn:"9782749310336",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310336-475x500-1.jpg"},
  {t:"Les filles d'Oxford",a:"Miller Joanna",y:"2026",ed:"R. Laffont",cote:"R MIL",pub:"Adulte",sup:"Imprimé",d:"Angleterre, 1920. Pour la première fois en prés de mille ans d'existence, la plus célèbre université du monde ouvre ses portes aux femmes. Portées par leur rêve d'émancipation, quatre jeunes étudiantes intègrent Oxford. Dora, Beatrice, Otto et Marianne viennent d'horizons différents, mais le destin les a réunies et scelle entre elles une amitié aussi improbable qu'indéfectible. Alors que la misogynie est encore partout, que la grippe espagnole fait toujours des ravages, et que les fantômes de la Grande Guerre hantent encore les salles d'études et les mémoires, leur solidarité sera leur atout le plus précieux. Tandis qu'elles participent à une page nouvelle de l'Histoire, ces quatre jeunes femmes apprennent surtout á écrire la leur.",isbn:"9782221273609",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221273609-M.jpg"},
  {t:"Auguste Renoir",a:"Protais Johann",y:"2026",ed:"Larousse",cote:"759.4 PRO",pub:"Adulte",sup:"Imprimé",d:"Enfant de son siècle, Renoir est également celui d'une France et d'un monde artistique en pleine révolution. Celui qui se présente avant tout comme un \"ouvrier de la peinture\" et qui va devenir l'une des figures majeures d'un courant d'avant-garde, l'impressionnisme, s'y ménage toutefois une place particulière. Se laissant porter au gré de ses inspirations et de ses rencontres, il s'impose comme le peintre de la figure humaine. Maître des jeux de lumière, Auguste Renoir est aussi celui qui voue un véritable culte à la sensualité par le biais de ses portraits et de ses nus féminins. Riche de très nombreuses illustrations, cet ouvrage retrace la vie passionnante de Renoir et explique comment, tout au long de sa carrière prolifique, il n'a eu qu'un seul objectif : \"peindre du bonheur\" . Vous pensiez tout savoir sur Renoir ? Détrompez-vous, cet ouvrage vous réserve bien des surprises !",isbn:"9782036086760",extraUrl:"https://covers.openlibrary.org/b/isbn/9782036086760-M.jpg"},
  {t:"La mystérieuse affaire de styles",a:"Gleyse Romuald",y:"2020",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"1917, le capitaine Hastings, blessé au combat, est rapatrié en Angleterre et vient passer sa convalescence à Styles Court, dans la demeure familiale de son ami John Cavendish. L'ambiance est lourde car Emily, la mère de John, s'est remariée avec l'antipathique Alfred Inglethorp, plus jeune qu'elle. Et quand Emily meurt, empoisonnée, le hasard fait bien les choses avec la présence sur les lieux d'un ancien policier belge, ami du capitaine Hastings. Hercule Poire saura-t-il démêler le vrai du faux et confondre le coupable ?",isbn:"9782889325573",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889325573-M.jpg"},
  {t:"Le château",a:"Cooper Catherine",y:"2026",ed:"L'Archipel",cote:"R COO",pub:"Adulte",sup:"Imprimé",d:"\" L'autrice du best-seller Le Chalet revient avec un thriller psychologique tout aussi addictif qui vous tiendra en haleine jusqu'au petit matin. \" The Sun \" Glaçant ! \" Bella Aura et son mari Nick, la trentaine, ont décidé de quitter Londres avec leurs deux enfants en bas âge pour transformer un château du Sud-Ouest de la France en Bed & Breakfast. Sur place, ils sont rejoints par une équipe chargée de filmer leurs travaux de rénovation pour une émission de téléréalité. C'est alors que des phénomènes étranges commencent à se produire. Jusqu'à ce meurtre commis au cours d'une soirée... Nick et Aura voulaient fuir leur passé. Ce dernier vient de les rattraper !",isbn:"9782809853490",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809853490-M.jpg"},
  {t:"Lincoln dans la ligne de mire",a:"Neidhardt Fred",y:"2025",ed:"Dupuis",cote:"BDJ NEI",pub:"Jeunesse",sup:"Imprimé",d:"Condamné au peloton d'exécution pour une désertion de trop, Blutch se retrouve emprisonné, avec pour voisine la mystérieuse Isabella Boyd, elle-même frappée de peine capitale pour intelligence avec l'ennemi. Parvenant à s'évader avec cette dernière, l'ancien caporal intègre un groupe de conspirateurs sudistes, qui vont lui demander d'abattre le président Lincoln ! Blutch, pacifiste par nature, parviendra-t-il à résister à l'insistance de ses nouveaux \"amis\" ? Cela s'annonce compliqué, car les charmes de la belle Isabella semblent l'éloigner des bras de Chesterfield qui, se sentant coupable de l'arrestation de son ami, le recherche désespérément... Entre grande aventure, gags en rafale et exploration de l'Histoire, Fred Neidhardt poursuit avec un épatant respect l'oeuvre de Raoul Cauvin, toujours en compagnie de l'inusable Willy Lambil ! Fred Neidhardt, à l'aise dans de nombreux registres, chausse les bottes des Tuniques Bleues pour des intrigues pleines d'humour et de culture. L'inépuisable Lambil est, comme toujours, impeccable.",isbn:"9782808507660",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808507660-475x500-1.jpg"},
  {t:"Honey Lemon Soda T15",a:"Murata Mayu",y:"2026",ed:"Nobi Nobi",cote:"BD HON",pub:"Jeunesse",sup:"Imprimé",d:"Uka Ishimori et Kai Miura filent le parfait amour depuis plus d'un an. La classe verte des terminales approche à grands pas ! S'agissant du dernier événement scolaire de ses années lycée, Uka attend ce séjour avec impatience... Mais voilà que les problèmes s'enchaînent juste avant le départ ! Le voyage se passera-t-il comme prévu ? Cinq nuits et quatre jours auprès de la personne qu'on aime, que peut-on rêver de mieux ?",isbn:"9782384966646",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384966646-M.jpg"},
  {t:"Honey Lemon Soda T14",a:"Murata Mayu",y:"2026",ed:"nobi nobi !",cote:"BD HON",pub:"Jeunesse",sup:"Imprimé",d:"Uka Ishimori et Kai Miura filent  le parfait amour et l'ont proclamé  haut et fort lors de la fête du lycée.  Il est d'ailleurs temps pour eux de  fêter le premier anniversaire de  leur relation ! Afin de célébrer ce  grand jour, la jeune fi lle a préparé  un planning aux petits oignons'  Réussira-t-elle à rendre la journée  aussi inoubliable qu'elle l'imagine'L'amour repars pour un tour !",isbn:"9782384966622",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384966622-M.jpg"},
  {t:"Bonne nuit !",a:"Tourlonias Joëlle",y:"2026",ed:"minedition",cote:"A TOU",pub:"Jeunesse",sup:"Imprimé",d:"Un livre interactif pour se préparer à aller au lit ! On se brosse les dents, on fait pipi, et on va au lit... et les peluches, où sont-elles ? Deux frères se préparent à se coucher. L'enfant suit toutes les étapes une à une et grâce aux tirettes et aux rabats sur chaque double page, il est aussi acteur de la lecture.",isbn:"9782354137755",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137755-475x500-1.jpg"},
  {t:"Marilyn et Ella",a:"Bryce Denny S.",y:"2026",ed:"HarperCollins",cote:"R BRY",pub:"Adulte",sup:"Imprimé",d:"Marilyn et Ella : une amitié qui défie les préjugés. 1952. Ella Fitzgerald et Marilyn Monroe brillent chacune dans leur univers mais affrontent les mêmes obstacles : le mépris, le contrôle et les limites imposées aux femmes. Quand Marilyn cherche à apprendre à chanter, elle se tourne vers Ella. De leur rencontre naît une amitié inattendue, profonde, dans un monde qui ne cesse de les sous-estimer. Ensemble, elles trouvent la force de s'affirmer, de résister et de conquérir leur liberté. Un roman lumineux sur la sororité, le courage et la volonté de s'imposer dans une époque qui refuse aux femmes le droit de choisir leur place. Traduit de l'anglais (Etats-Unis) par Carole Delporte A propos des autrices : Denny S. Bryce est l'autrice primée de cinq romans à succès. Elle est également critique littéraire, professeure à l'université et rédactrice pour Harper's Bazaar et USA Today. Elle vit à Savannah, en Géorgie. Eliza Knight est une autrice primée dont les titres se sont classés parmi les meilleures ventes aux Etats-Unis et à l'international. Son amour pour l'histoire remonte à son enfance, lorsqu'elle arpentait les couloirs de Versailles.",isbn:"9791033917502",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033917502-M.jpg"},
  {t:"Eclair de génie",a:"Zidrou",y:"2025",ed:"Le Lombard",cote:"BDJ ZID",pub:"Jeunesse",sup:"Imprimé",d:"Léonard voit les choses en grand, très grand ! son dernier projet ? Fonder la Siliconval(i) du Moyen Age et révolutionner les télécoms avec sa société Génie.com. Crypto-monnaie, panneaux solaires et OGM s'invitent à la ferme, avec le génie farfelu du Maître et la maladresse légendaire du disciple. Un concentré d'humour absurde et d'inventions (presque) révolutionnaires, signé par la série culte qui défie la logique depuis 56 tomes.",isbn:"9782808212465",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808212465-475x500-1.jpg"},
  {t:"Les belles photos de famille",a:"Lee Siwon",y:"2026",ed:"Gautier-Languereau",cote:"A LEE",pub:"Jeunesse",sup:"Imprimé",d:"Dans le village de la forêt, chez Hibou et Ours, les photographes, tous les animaux défilent pour poser en famille. Mais panda, lui, est tout seul : avec qui va-t-il poser ?",isbn:"9782017371007",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782017371007-475x500-1.jpg"},
  {t:"Magimage",a:"Albon Lucie",y:"2024",ed:"Thierry Magnier",cote:"A ALB",pub:"Jeunesse",sup:"Imprimé",d:"Ce livre est vraiment magique : il transforme les images grâce à un simple miroir. Et voici comment le poisson se transforme soudain... en chat !",isbn:"9791035207243",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035207243-475x500-1.jpg"},
  {t:"Comment le monde est parti en saucisse",a:"Schmauch Anne",y:"2026",ed:"Éditions Sarbacane",cote:"J SCH",pub:"Jeunesse",sup:"Imprimé",d:"Moi, c'est Célestin, 11 ans, spécialiste mondial de la lutte anti-microbes. Mes trois pires ennemis ? Les bactéries. Le nez morveux de mon petit frère. La bave de son chien, Saucisse. Je rêvais de vacances paisibles. Sans germes, sans drames. Raté. Et puis, une extraterrestre s'est écrasée sur notre toit, a semé des graines de trou noir partout... et il paraît que NOUS aurions, peut-être-un-tout-petit-peu, déclenché la fin du monde. Ah, et avant de tourner la page : merci de reculer d'un mètre. Mesures sanitaires.",isbn:"9791040808008",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791040808008-475x500-1.jpg"},
  {t:"Azur et le mystère de la pièce d'or",a:"Beauvais Clémentine",y:"2022",ed:"Rageot",cote:"A BEA",pub:"Jeunesse",sup:"Imprimé",d:"Paris, au tournant du XXe siècle. Pour gagner sa vie, Azur, orphelin, porte à vélo les lettres les plus urgentes de la capitale. Un jour, il remarque une enveloppe différente des autres. A l'intérieur, il y a... une pièce d'or ! Azur se laisse tenter : il garde la pièce et le message qu'il devait livrer...",isbn:"9782700277289",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782700277289-475x500-1.jpg"},
  {t:"Le bain des quatre saisons",a:"Kim Hyojeong",y:"2026",ed:"Gallimard",cote:"A KIM",pub:"Jeunesse",sup:"Imprimé",d:"Un album plein d'humour, fourmillant de détails, pour célébrer la nature qui s'éveille ! C'est le printemps ! Papy Mousse s'active : il ouvre sa maison et prépare son bassin. Tout doit être prêt pour l'arrivée des animaux ! Déjà, un ours sort d'hibernation. Il a besoin d'un bon bain !",isbn:"9782075233729",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075233729-475x500-1.jpg"},
  {t:"Le coup de la cacahuète",a:"Manceau Édouard",y:"2026",ed:"Sens dessus dessous",cote:"A MAN",pub:"Jeunesse",sup:"Imprimé",d:"Pour transformer une grosses cacahuète, il faut être malin et faire preuve de beaucoup d'imagination...",isbn:"9782385071202",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782385071202-475x500-1.jpg"},
  {t:"La petite poule rousse",a:"Paku",y:"2026",ed:"Fleurus",cote:"A PAK",pub:"Jeunesse",sup:"Imprimé",d:"Il était une fois... L'histoire de La Petite Poule rousse tendrement illustrée pour faire découvrir aux tout-petits les contes de notre enfance.",isbn:"9782215201564",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215201564-475x500-1.jpg"},
  {t:"A nous, demain",a:"Giannone Francesca",y:"2026",ed:"Albin Michel",cote:"R GIA",pub:"Adulte",sup:"Imprimé",d:"Après le succès de La Porteuse de lettres, lauréat du prix Bancarella, Francesca Giannone signe un roman d'amour poignant et un magnifique portrait de femme.  Sud de l'Italie, fin des années 1950. Agnese et son frère Lorenzo veulent perpétuer l'oeuvre de leur grand-père : la savonnerie familiale \"Casa Rizzo\" . Ce rêve se brise lorsque leur père, désireux d'une autre vie, leur annonce la vente de l'entreprise. Si Lorenzo claque la porte, Agnese, passionnée par son métier, accepte de travailler pour le nouveau propriétaire. Elle veut préserver l'héritage de sa famille et créer de nouvelles fragrances, mais elle se heurte à son patron, véritable despote. L'amour de Giorgio, un marin originaire de Savone, va lui faire prendre conscience de sa valeur et l'inciter à se rebeller. Où est le vrai combat : retenir à tout prix le passé ou accueillir les promesses de demain ?",isbn:"9782226501240",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226501240-M.jpg"},
  {t:"Le Noël d'Hercule Poirot",a:"Bottier Isabelle",y:"2023",ed:"EP média",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Quoi de plus beau et de plus romantique qu'une famille réunie à quelques jours de Noël ? L'occasion de se retrouver, de partager la chaleur d'un foyer alors que la neige tombe au-dehors. Mais le vieux Siméon Lee n'est pas du genre sentimental et, s'il a réuni ses enfants autour de lui, c'est qu'il a des choses à leur annoncer, ce qui risque de ne pas plaire à tout le monde. De ne pas plaire au point de tuer ? Pour Hercule Poirot, en visite chez son ami le colonel Johnson, une vieille connaissance rencontrée autour du Drame en trois actes, élucider un crime sera le plus beau des cadeaux de Noël !",isbn:"9782889323739",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889323739-M.jpg"},
  {t:"Le mystère du dernier Stradivarius",a:"Roemmers Alejandro Guillermo",y:"2026",ed:"Métailié",cote:"R ROE",pub:"Adulte",sup:"Imprimé",d:"Lorsqu'en 1737 le grand Antonio Stradivari, prodigieux luthier italien, signe de son sang son dernier violon, il lui transmet un pouvoir mystérieux qui va changer le destin de tous ceux qui l'auront entre leurs mains. En 2021, l'assassinat au Paraguay d'un antiquaire et de sa fille fait l'objet d'une enquête chaotique menée par un inspecteur honnête et malchanceux et son adjoint. Quel est le lien entre ces terribles meurtres et le violon ? Nous suivons les traces du merveilleux dernier Stradivarius et de ses protégés. De la jeune novice du couvent vénitien à Casanova fuyant ses créanciers, du grand Verdi touché par la grâce de celui qui va devenir le premier violon de ses opéras aux triplés rouquins de l'orchestre de Naples, du conspirateur nationaliste de Sarajevo qui déclenche la Première Guerre mondiale au commandant nazi du camp de la mort. Nous accompagnons toutes leurs aventures, fascinés et pris au piège du suspense de ce récit haletant qui se déploie sur les ailes de la musique.",isbn:"9791022615426",extraUrl:"https://covers.openlibrary.org/b/isbn/9791022615426-M.jpg"},
  {t:"Les fables du Roi des Aulnes",a:"Ba Juni",y:"2026",ed:"Bayard éditions",cote:"BDJ BA",pub:"Jeunesse",sup:"Imprimé",d:"Au coeur de la fabuleuse foret de Mynislyvix, deux figures se font face : Goupil, rusé manipulateur qui a déjoué la mort, et le Roi des Aulnes, immortel et solitaire. Leur rivalité anime la forêt depuis la nuit des temps, donnant naissance à une série de contes qui forment la grande Histoire. Reste à savoir comment finira la leur ! Et si les deux ennemis n'étaient finalement pas aussi différents qu'ils ne le pensent ? Un roman graphique qui dégoupille les classiques... Deux figures iconiques se font face dans ce roman graphique : le renard rusé, d'une part, et le monstre mystérieux de l'autre. A travers leurs affrontements répétés, ces deux personnages hauts en nuance questionnent et déconstruisent les rôles classiques des fables : le héros ne serait finalement pas si héroïque, et l'antagoniste pas si méchant... ... signé par un dessinateur au style incomparable Juni Ba nous livre une fois de plus une oeuvre percutante, dans la lignée de Mobilis et The Boy Wonder (Urban Comics). Le dessinateur de comics acclamé joue avec les codes graphiques et n'hésite pas à bousculer nos modes de lectures : contrastes bluffants, découpages ultra dynamique, sens du détail... Les Fables du Roi des Aulnes ne laissera personne indifférent.",isbn:"9791036387654",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036387654-475x500-1.jpg"},
  {t:"Résolutions",a:"Borecki Ludo",y:"2024",ed:"Kennes",cote:"BDJ BOR",pub:"Jeunesse",sup:"Imprimé",d:"Bienvenue dons l'univers de Léo rempli d'amitié, de guerres de nunuches, de remises en question, d'embrouilles familiales et d'histoires d'amour. En somme, une vie compliquée d'adolescente empreinte de réalisme et d'humour.",isbn:"9782380759419",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782380759419-475x500-1.jpg"},
  {t:"Un balcon à Naples",a:"Elamine Juliette",y:"2026",ed:"Maison Pop",cote:"R ELA",pub:"Adulte",sup:"Imprimé",d:"Anita, jeune chercheuse française, sillonne l'Italie pour redonner une voix aux héroïnes de la Résistance à travers sa thèse. Après Rome et Milan, sa route la mène à Naples, dans une petite auberge nichée sur le pont Sanità. Lorsqu'elle pose ses valises, la jeune femme reçoit un étrange guide aux allures de jeu de piste confié par Gabriella, la propriétaire, l'invitant à découvrir la ville sous un jour nouveau. Entre les ruelles bouillonnantes du quartier de la Sanità et les récits vibrants de Leone, un réceptionniste aussi troublant qu'érudit, l'Histoire se confronte à la réalité brute des marques laissées par la guerre. Dans cette ville où le passé ne meurt jamais, Anita s'apprête à découvrir que les archives les plus précieuses ne se trouvent pas toujours dans les bibliothèques, mais dans le coeur de ceux qui se souviennent.",isbn:"9782488201650",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488201650-M.jpg"},
  {t:"La chute de l'Etoile rouge",a:"John D. B.",y:"2026",ed:"Plon",cote:"R JOH",pub:"Adulte",sup:"Imprimé",d:"Sept ans après le succès de L'étoile du nord, le nouvel opus attendu de D. B. John. Un thriller géopolitique haletant de New York à Singapour, entre Donald Trump et Kim Jong-un, qui nous plonge au coeur de la folie politique contemporaine et de l'espionnage. Février 2017 : un Coréen est empoisonné en plein jour à l'aéroport de Kuala Lumpur. L'homme est le demi-frère de Kim Jong-un, le dictateur nord-coréen. Dans un hôtel cossu de Washington, un haut-gradé des services secrets russes est retrouvé mort dans sa chambre dans des circonstances plus que suspectes. Dans le même temps, Donald Trump, un magnat de l'immobilier élu 45e président des Etats-Unis, fait ses premiers pas à la Maison Blanche. Dans l'ombre, le monde est au bord du gouffre et trois personnes sont aux premières loges. Jenna, une agente américano-coréenne de la CIA, hantée par son passé. Six ans plus tôt, au terme d'une mission d'infiltration, elle est parvenue à sauver sa soeur jumelle des geôles nord-coréennes et à dévoiler un programme d'espions dormants qui s'apprêtaient à infiltrer la société américaine. Lyosha, un étudiant moscovite qui paye le prix fort pour avoir humilié Vladimir Poutine en direct à la télévision. Le FSB commence à lui tourner autour. Eric, un jeune américain d'origine coréenne, qui travaille comme conseiller spécial auprès de Trump, unique rescapé du programme d'infiltration que Jenna pensait avoir démantelé des années plus tôt... Quand les supérieurs de Jenna l'informent de l'existence d'un programme au coeur du Kremlin, ils l'envoient en toute clandestinité à Moscou prendre contact avec Lyosha qui détiendrait des documents révélant le complot. La mission s'avère plus dangereuse que prévue, tandis qu'à Washington les décisions erratiques du président menacent le monde du chaos...",isbn:"9782259323710",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259323710-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Pour remplacer Soo-won, qui souffre de la maladie écarlate, Yona siège à la réunion avec les représentants de l'Empire de Kai. Elle parvient à se faire respecter et à discuter à pied d'égalité avec eux, mais l'un des émissaires décède brutalement, et la jeune princesse se retrouve accusée du meurtre…",isbn:"9782811668167",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811668167-M.jpg"},
  {t:"Gribouillis & Kraboutchat",a:"Bailly Pierre",y:"2025",ed:"Dupuis",cote:"BDJ BAI",pub:"Jeunesse",sup:"Imprimé",d:"Il est petit. Il est poilu. C'est Petit Poilu ! Le v'là parti de bon matin. Le vie parti et tout va bien. Mais ? ... Que se passe-t-il ? Ca se bouscule. Et tout bascule ! Un crayon à tailler. Des copeaux de toutes les couleurs. Des noeuds, des boucles et des entrelacs. Deux compères complètement fadas. Des folies, des pitreries, des dingueries... Vas-y, Petit Poilu, fonce ! Petit débrouillard de la vie ! Petit Poilu est un petit bonhomme curieux, optimiste et courageux qui plonge malgré lui dans des aventures extraordinaires dont il ressort toujours grande. Petit Poilu tord le cou aux idées reçues et apprend la vie en s'initiant aux relations humaines. Viens grandir avec lui !",isbn:"9782808510127",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808510127-475x500-1.jpg"},
  {t:"Hercule Poirot",a:"Brrémaud Frédéric",y:"2020",ed:"Paquet",cote:"BD BRR",pub:"Adulte",sup:"Imprimé",d:"La 4ème de couverture indique : \"Un grand classique des romans d'Agathe Christie, un roman sombre et machiavélique adapté pour la première fois en bande dessinée. Une course contre la montre, et un annuaire des transports pour toute signature. Voici Hercule Poirot aux prises avec un adversaire bien déroutant, qui le prévient de ses méfaits et le met au défi de l'arrêter. Un challenge de taille pour celui qui prétend être le plus grand détective du monde. Alors que toute l'Angleterre se passionne et soupçonne, Hercule Poirot saura-s-il mettre fin à cette série de meurtres par ordre alphabétique'\"",isbn:"9782889325252",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889325252-M.jpg"},
  {t:"You Rock me",a:"Iwashita Keiko",y:"2026",ed:"Pika édition",cote:"BD YOU",pub:"Adulte",sup:"Imprimé",d:"Après avoir hésité jusqu'au bout à montrer son travail à la fameuse Fête des arts de l'université, Hibari gagne assez confiance en elle pour se lancer, grâce aux encouragements de Gaku. Pendant ce temps, sa meilleure amie, Airi, cherche une occasion d'exprimer ses sentiments à un autre membre du groupe, Jô...",isbn:"9791043306396",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043306396-M.jpg"},
  {t:"The Strange House",a:"Uketsu",y:"2026",ed:"Kana",cote:"Bd STR",pub:"Adulte",sup:"Imprimé",d:"\"Dès l'instant où j'ai vu les plans, j'ai tout de suite pensé que c'était une étrange maison\". Un pigiste spécialisé dans le paranormal et l'horreur reçoit un jour la visite d'un homme qui envisage d'acheter une maison. Cependant, les plans de cette dernière sont plus qu'étranges, laissant supposer qu'il y a potentiellement eu des actes de maltraitance d'enfant à l'intérieur... Quel est donc le secret caché derrière ces curieux agencements de pièces ? Accompagné d'un architecte de renom, il va mener son enquête au sujet de cette drôle de bâtisse...",isbn:"9782505143567",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505143567-M.jpg"},
  {t:"Sous les vagues de Barcelone",a:"Blancard Gabriel",y:"2026",ed:"Maison Pop",cote:"R BLA",pub:"Adulte",sup:"Imprimé",d:"Architecte rigoureuse, Bianca a étouffé ses origines espagnoles sous le béton parisien. Entre sa thèse, son emploi dans un cabinet et sa routine avec Gontran, tout est sous contrôle. Peut-être trop. Son quotidien vacille lorsqu'elle est chargée d'expertiser la verrière d'un hôtel particulier pour Brigitte Viard, cliente aussi fortunée qu'exubérante. Sous la poussière des décennies, gravée dans le métal, une signature attire son regard : \"C. Vilá, 1900\" . Au fil de ses recherches, dans les couloirs feutrés des archives et les rues dansantes de Barcelone, Bianca découvre l'histoire de Juan Carmen Vilá, dont le travail a été éclipsé par l'oeuvre d'Antoni Gaudí. Au coeur de la capitale catalane, aux prémices de l'Art nouveau, et au plus près de ses racines familiales, Bianca se lance sur les traces de cette figure oubliée, dont le nom résonne étrangement en elle. Deux destins séparés par le temps, unis par une même question : comment laisser son empreinte sans se perdre soi-même ?",isbn:"9782488201704",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488201704-M.jpg"},
  {t:"Petit pays",a:"Faye Gaël",y:"2026",ed:"Voir de près",cote:"R FAY",pub:"Adulte",sup:"Imprimé",d:"\"Avant, Gabriel faisait les quatre cents coups avec ses copains dans leur coin de paradis. Et puis l'harmonie familiale s'est disloquée en même temps que son « petit pays », le Burundi, ce bout d'Afrique centrale brutalement malmené par l'Histoire. Plus tard, Gabriel fait revivre un monde à jamais perdu. Les battements de cœur et les souffles coupés, les pensées profondes et les rires déployés, le parfum de citronnelle, les termites les jours d'orage, les jacarandas en fleur… L'enfance, son infinie douceur, ses douleurs qui ne nous quittent jamais.\"",isbn:"9782378288662",extraUrl:"https://covers.openlibrary.org/b/isbn/9782378288662-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2026",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n accueillir que des cancres, s'est lié d'amitié avec Kaoruko Waguri, qui fréquente un établissement pour filles de bonne famille, Kikyô.Tandis que l été qui marque le début de leur relation touche bientôt à sa fin, Rintarô donne rendez-vous à Waguri pour lui offrir un gâteau en récompense de son dur labeur estival. Le jour de leur tête-à-tête, le jeune homme s attendait à tout& sauf à se retrouver soudain invité à dîner chez la famille de sa petite amie ! L aspirant pâtissier en profite alors pour transmettre ses bonnes intentions à la mère de Waguri&Roméo & Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions![xc2][xa0]",isbn:"9782384966448",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384966448-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2026",ed:"Nobi Nobi",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n'accueillir que des cancres, est tombé amoureux de Kaoruko Waguri, qui fréquente un établissement pour fi lles de bonne famille, Kikyô. Alors qu'ils profi tent de leur première sortie en amoureux depuis la fi n des grandes vacances, ils sont aperçus par quatre fi lles de Kikyô. Inquiètes pour leur camarade, les lycéennes se montrent fortement opposées à cette relation. Mais grâce à la présence de Madoka Yuzuhara, une jeune fi lle qui ne porte aucun préjugé aux élèves de Chidori, elles décident tout de même de rencontrer Rintarô... Le fossé profondément ancré entre les deux écoles serait-il sur le point d'être comblé ? Roméo et Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions !",isbn:"9782384967070",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384967070-M.jpg"},
  {t:"Chercher le bonheur",a:"Nille Peggy",y:"2022",ed:"Actes Sud",cote:"1042003331",pub:"Jeunesse",sup:"Imprimé",d:"Une nouvelle pépite signée Peggy Nille ! Une aventure pleine de philosophie et de poésie, où l'on suit les questionnements d'un petit pingouin sur le bonheur.",isbn:"9782330167783",extraUrl:"https://www.base-orb.fr/visuels-pim/image/base/9782330167783-475x500-1.jpg"},
  {t:"De l'autre côté de la rivière",a:"Talty Morgan",y:"2026",ed:"Albin Michel",cote:"R TAL",pub:"Adulte",sup:"Imprimé",d:"\"Je voulais que la petite connaisse la vérité. Je voulais qu'elle sache qui j'étais - qui j'étais réellement, plutôt que cet homme blanc qui habitait en face de chez elle depuis toujours et qui la regardait grandir de l'autre côté de la rivière\". Charles Lamosway a grandi sur une réserve indienne du Maine dont il est aujourd'hui séparé par un cours d'eau. C'est là que vit Elizabeth, sa fille, qui ignore qu'il est son père. La cinquantaine venue, Charles ressent l'urgence de se libérer de ce secret trop longtemps gardé. Elevé par une mère blanche et un beau-père autochtone, abîmé par la vie, hanté par la mort de son beau-père lors d'un accident de chasse, il se raccroche au seul lien qui lui donne l'impression d'exister. Tandis qu'il s'apprête à révéler la vérité à Elizabeth, la jeune femme disparaît mystérieusement, le plongeant dans une inquiétude plus grande encore. D'une écriture âpre et singulière, Morgan Talty raconte l'histoire d'une famille déchirée par le mensonge. Interrogeant les notions d'appartenance et d'identité, il leur oppose l'amour d'un père pour sa fille.",isbn:"9782226494641",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226494641-M.jpg"},
  {t:"Pourquoi je mens",a:"Klein Pauline",y:"2026",ed:"Gallimard",cote:"R KLE",pub:"Adulte",sup:"Imprimé",d:"\"Je doutais de la fiabilité de mes souvenirs. De tous les souvenirs. Je savais bien que dans le fond ils étaient inventés. Et cette propension à l'invention s'est répandue comme un liquide\". Pourquoi sabotons-nous nos relations amoureuses ? Alors que la narratrice, Pauline, quarante-cinq ans, retrouve Roman, son amour de jeunesse, vient l'heure du bilan. Elle rouvre un dossier qu'elle croyait clos : celui de son père, cet homme si beau et si malheureux dont elle ignore tout, sinon qu'il est mort mystérieusement lorsqu'elle avait dix ans. En revenant sur les silences qui entourent ce personnage trouble, elle interroge son propre sens du drame et son penchant pour la mythomanie, qui lui ont valu tant de déboires sentimentaux. Aidée d'un détective privé à l'imagination rocambolesque, elle remonte, avec espièglerie, la piste de ce père méconnu qui a déterminé sa vie. A partir d'archives, de témoignages et de ses rares souvenirs, elle explore des hypothèses. Cherche des secrets. Attend de grandes révélations. Au risque de découvrir que, en amour comme dans l'existence, les histoires qu'on se raconte l'emportent bien souvent sur la réalité... Ce roman poignant, plein de fantaisie et d'humour, explore ce que sont les pères pour les filles, et la part d'ombre que l'on reçoit en héritage.",isbn:"9782073129710",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073129710-M.jpg"},
  {t:"Sécher tes larmes",a:"Lepage Meï",y:"2026",ed:"Seuil",cote:"R LEP",pub:"Adulte",sup:"Imprimé",d:"Même victime, même lieu, même mode opératoire. Adèle Jezequel, la fille du commandant de police d'Annemasse, vient d'être enlevée. L'affaire est des plus troublantes : la jeune femme avait déjà disparu sept ans auparavant, dans les mêmes circonstances. Emma Fauvel est enquêtrice à la PJ de Créteil. Elle a fui Annemasse pour oublier son lourd passé et s'était juré de ne plus jamais y remettre les pieds. Mais Adèle et Emma se connaissent depuis l'enfance. Alors, quand en haut lieu on lui demande de diriger l'enquête, Emma accepte de revenir dans sa ville natale cernée par les Alpes. Quitte à y affronter ses pires cauchemars. Au coeur de cette ville étouffée par la canicule, il se pourrait que leurs destins se croisent. Si la justice est aveugle, cette fois Emma devra lui rendre la vue...",isbn:"9782386433542",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386433542-M.jpg"},
  {t:"Duels au collège",a:"Cazot Vero",y:"2026",ed:"Dupuis",cote:"BDJ CAZ",pub:"Jeunesse",sup:"Imprimé",d:"Punie par sa mère pour lui avoir caché qu'elle faisait de la boxe malgré son interdiction formelle, trahie par Elias, son ex-meilleur ami, qui a tout cafté, harcelée par ses camarades de classe qui ne ratent pas une occasion de se moquer de son format réduit, Colette manque terriblement de moments un peu excitants dans sa vie. Et puis Astrid, qui la persécute depuis des années dans la cour de récréation, lui propose un marché : elle arrêtera de l'embêter si Colette accepte de faire quelques combats clandestins dans la salle de sport de l'école. Pour Colette, c'est l'occasion rêvée d'enfiler à nouveau des gants de boxe et de retrouver les sensations qu'elle avait précédemment adorées. \"Mi-mouche\", c'est le poids minimum pour faire des combats de boxe. C'est désormais également une série de bande dessinée d'une grande richesse, passant de la tragédie à la comédie. Avec beaucoup d'humour et ? on s'en doute ? énormément d'émotion.",isbn:"9782808506823",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808506823-475x500-1.jpg"},
  {t:"The Strange House",a:"Uketsu",y:"2025",ed:"Kana",cote:"BD STR",pub:"Adulte",sup:"Imprimé",d:"Une architecture parfaite... pour dissimuler l'impensable. \"Quel genre de personnes étaient les habitants de cette maison ? \" Le plan d'une maison de Tokyo a laissé supposer qu'il s'y passait des choses anormales : un enfant y aurait été séquestré pour commettre des meurtres. C'est alors qu'une jeune femme, Yuzuki Miyae, déclare être persuadée que son mari a été assassiné par les habitants de cette étrange maison et révèle les plans d'une deuxième maison. L'architecte Kurihara ne tarde pas à mettre le doigt sur un point curieux concernant cette autre maison !!",isbn:"9782505129035",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505129035-M.jpg"},
  {t:"Tu ne tueras point",a:"Pobi Robert",y:"2026",ed:"Editions Les Arènes",cote:"R POB",pub:"Adulte",sup:"Imprimé",d:"New York, par une nuit glacée En accompagnant sa femme, chirurgienne, à un gala de bienfaisance, Lucas Page est frappé par une vidéo d'hommage aux disparus de l'année : trop de médecins sont morts dans des circonstances étranges, accidents troublants ou suicides inexpliqués. Astrophysicien bourru, professeur d'université atrabilaire et ancien agent du FBI, le Dr Lucas Page est doté d'un don unique pour déceler les schémas cachés derrière les chiffres et les statistiques. Il comprend que quelque chose ne tourne pas rond... Et si les médecins étaient pris pour cible par un tueur particulièrement intelligent ? Et si la prochaine cible n'était autre que sa femme ? Alors qu'il s'était juré de se retirer, Page se trouve entraîné malgré lui dans la traque d'un nouveau tueur en série redoutable. \" Un personnage fascinant. Ce livre va faire frémir vos neurones. \" Associated Press \" Un thriller implacable ! Les rebondissements tiennent le lecteur en haleine jusqu'à la fin. \" Publishers Weekly",isbn:"9791037515704",extraUrl:"https://covers.openlibrary.org/b/isbn/9791037515704-M.jpg"},
  {t:"Spécimen",a:"Clavière Pauline",y:"2026",ed:"Grasset & Fasquelle",cote:"R CLA",pub:"Adulte",sup:"Imprimé",d:"\"Quel genre de jeune homme faut-il être pour écrire une chose pareille ? L'écriture est soignée, la calligraphie appliquée. Tout cela rend le texte plus dérangeant encore. Comme si l'auteur savait qu'il serait lu. Qu'il m'attendait.\" Une mère, la narratrice, dépose son jeune fils chez sa nourrice, Mina. Elle a ainsi du temps pour écrire. Mina vit seule et a aussi un enfant, Rafael, plus âgé. Il a disparu sans raison et a laissé un mystérieux carnet. En découvrant le contenu du carnet que lui a confié la nourrice, la narratrice est bouleversée. Il n'en fallait pas plus pour que la menace plane, qu'elle contamine tout. Les souvenirs refont surface. Qu'est devenue son amie d'enfance disparue vingt-cinq ans auparavant ? Des questions restées sans réponses reviennent la hanter. Passé et présent se confondent et le lecteur découvre peu à peu l'histoire de Rafaël. S'il est un spécimen, unique, ou s'il est à l'image de son espèce, qui sera en mesure de l'affronter ? Pauline Claviere nous offre un roman diabolique, travaillé par le grand sujet de notre époque : jusqu'où irions-nous pour protéger nos enfants, et de qui ? Son intrigue implacable nous conduit dans un Marseille intime et inquiétant où toute la société se désaxe. Entre nos mains, le roman d'une enquêtrice au-dessus de tout soupçon... Vous ne dormirez plus avant de savoir qui est vraiment \" le spécimen \" . Ce texte impossible à lâcher est en cours d'adaptation par RT Features, société de production du brésilien Rodrigo Teixeira, notamment producteur de \" Call me by you name \" (2017) et\" Je suis toujours là \" (Oscar du meilleur film 2025). \" Il y a des romans qu'on lit et d'autres, comme celui-ci, qu'on dévore. Rarement, la fin d'un roman, m'aura à ce point surpris, et donné l'envie immédiate de le relire. \" (Maxime Chattam).",isbn:"9782246846109",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246846109-M.jpg"},
