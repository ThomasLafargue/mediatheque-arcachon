  {t:"Contro natura",a:"Andolfo Mirka",y:"2025",ed:"Glénat",cote:"BD AND",pub:"Adulte",sup:"Imprimé",d:"La vie est un combat L'horrible dictature « darwinienne » qui régnait sur la ville de New Roark est terminée. Leslie et Khal peuvent enfin vivre librement leur relation, même s'ils appartiennent à deux races différentes. Pour gagner leur vie, ils travaillent dans le bar que Leslie a acquis et élèvent comme leur fille la jeune Shea,  une orpheline sauvée de l'Abattoir. Mais l'idylle se brise quand Leslie commence à être affectée par des symptômes qu'elle connaît bien. Elle est en proie à des crises violentes et des rêves angoissants. Ses vieux pouvoirs recommencent à se manifester et surtout son sang et ses cheveux redeviennent bleus ! Ce sont des signes d'une réalité inquiétante : l'Albinos est encore vivant. Cette entité surnaturelle semblable à un dieu cruel et violent, qui pour des générations a hanté toutes les femmes de la famille de Leslie, existe encore. Une faible série d indices semble relier le retour de la Bête à ce qui se passe de l autre côté de l océan, dans un village isolé et perdu entre les montagnes : Griffe Sacrée. Il semblerait que là-bas, a l abri du monde moderne il existe encore une secte très ancienne qui vénère l Albinos. Leslie et Khal partent donc ensemble pour leur dernière aventure, en espérant tirer un trait sur un passé qui revient toujours les hanter.",isbn:"9782344069080",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344069080-M.jpg"},
  {t:"Night Eaters T02 - Ses petits faucheurs",a:"Liu Marjorie",y:"2026",ed:"Delcourt",cote:"BD LIU",pub:"Adulte",sup:"Imprimé",d:"Milly et Billy connaissent maintenant l'histoire insolite de leur famille et appréhendent peu à peu leurs capacités surnaturelles. Mais un esprit amnésique et sans visage guidée par une étrange poupée hante Milly, une seule question : qui est-elle'Après la révélation à Milly et Billy Ting de leur véritable nature, les jumeaux ont commencé à explorer leurs pouvoirs. Ils savent maintenant qu'ils font partie d'un monde surnaturel plus vaste et que quelque chose ne va pas, mais alors pas du tout. Tandis qu'Ipo et Keon sont sollicités par la haute société démoniaque, les jumeaux découvrent qu'on ne traite pas avec le monde des esprits impunément..",isbn:"9782413090939",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413090939-M.jpg"},
  {t:"La longue vie",a:"Retz Valentin",y:"2026",ed:"Gallimard",cote:"R RET",pub:"Adulte",sup:"Imprimé",d:"Un biologiste, un prophète et un écrivain se croisent à travers le temps. Ils se posent tous les trois la question de la vie éternelle : est-il possible de ne pas mourir ? Entre le protocole scientifique, la foi religieuse et l'extase de la littérature, quelle est la solution ? A travers un entrelacement qui démultiplie les possibilités féeriques de la fiction, ce roman met en scène le délire contemporain de la science et nous embarque jusqu'au mont Athos, sur les pas des premiers chrétiens.",isbn:"9782073115416",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073115416-M.jpg"},
  {t:"Les livres m'ont menti, parfois",a:"Ortin Morgane",y:"2026",ed:"Nami",cote:"844 ORT",pub:"Adulte",sup:"Imprimé",d:"J'ai longtemps nourri la croyance que les livres savaient mieux que moi ce qu'était l'amour. Je leur faisais confi ance plus qu'à mon propre corps, qu'à mes propres élans. Je lisais des histoires d'absolu et je croyais que je devais, moi aussi, aimer comme cela : avec démesure et douleur. Les livres m'ont appris à attendre des promesses que la vie ne tenait pas\". Dans ses explorations de l'amour, Morgane Ortin a toujours été influencée par les grands textes, qu'ils la guident ou qu'ils la nourrissent d'attentes inatteignables. Au travers des extraits qui l'ont marquée, elle nous livre ici un lexique de l'amour très personnel. De James Joyce à Annie Ernaux, de Flaubert à Marguerite Duras en passant par Beckett, Proust et Monique Wittig, on y traverse des mots brûlants - fusion, désir, manque, tendresse, mais aussi emprise, désamour, pudeur - qui font se rencontrer l'expérience intime et la voix universelle de la littérature. Editrice et autrice, Morgane Ortin est la créatrice du phénomène Amours solitaires. Carnets, recueils de poésie, anthologie de la littérature... elle s'attache à explorer le sentiment amoureux sous toutes ses coutures, dans tous les formats. Elle est ainsi l'autrice des best-sellers Amours solitaires et Le Secret (Albin Michel, 2018, 2019 et 2021), La Chambre sans murs (Nami, 2023) Toutes les lettres ne sont pas des lettres d'amour et Le Club des larmes (Le Papier fait de la Résistance x Leduc, 2021 et 2023).",isbn:"9782487606234",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487606234-M.jpg"},
  {t:"Shérif malgré lui",a:"Offutt Chris",y:"2026",ed:"Editions Gallmeister",cote:"R OFF",pub:"Adulte",sup:"Imprimé",d:"Mick Hardin est un ancien marine de retour dans son Kentucky natal. Il officie comme shérif le temps que sa soeur, titulaire du poste, récupère d'une blessure par balle. Mais les difficultés s'accumulent. Les meurtres se succèdent, et Mick est le seul représentant de la loi disponible. Dans ce pays où les gens sont à fleur de peau et les apparences trompeuses, de nombreuses surprises l'attendent : des bandits venus de Detroit, une agente secrète britannique, de mystérieux Biélorusses... mais surtout la violence latente d'un pays construit sur un code moral impitoyable. Shérif malgré lui est la quatrième enquête du duo de choc composé du vétéran Mick Hardin et de sa soeur Linda, première femme shérif locale.",isbn:"9782351783559",extraUrl:"https://covers.openlibrary.org/b/isbn/9782351783559-M.jpg"},
  {t:"Le palais de sang",a:"Hur June",y:"2025",ed:"Bayard éditions",cote:"J HUR",pub:"Jeunesse",sup:"Imprimé",d:"Corée, 1758. Fille illégitime, Hyeon, 18 ans, a réussi à devenir infirmière au palais à force de travail et d'acharnement. Elle n'a d'autre but que d'effectuer son métier discrètement et, peut-être, gagner enfin l'approbation de son père. Lorsque quatre femmes sont sauvagement assassinées en une nuit et que sa mentor est accusée, Hyeon décide d'enquêter en secret pour prouver son innocence. Elle croise alors la route d'Eojin, un jeune inspecteur. Ensemble, ils plongent dans les recoins les plus sombres du palais. Mais les secrets mortels qu'ils découvrent les mènent vers une piste sanglante et dangereuse... Une immersion palpitante dans la Corée impériale Entre secrets d'Etat, romance naissante et condition féminine, Le palais de sang est un thriller historique aussi haletant qu'émouvant. A la manière des k-dramas, il mêle thriller et amour sur fond de décors somptueux et de tensions politiques. Porté par la plume précise et sensible de June Hur, ce récit envoûtant dévoile les rouages du pouvoir à travers une héroïne forte, lucide et bouleversante. Pour vibrer entre enquête et émotion Ce roman dès 13 ans invite à explorer une culture fascinante, tout en posant des questions très actuelles : comment s'imposer quand on ne rentre dans aucune case ? Comment distinguer le vrai du faux quand tout semble masque et manipulation ? Lauréat du prestigieux Prix Edgar Allan Poe 2023, ce texte mêle brillamment quête de justice, recherche d'identité et premiers émois.",isbn:"9791036373381",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791036373381-475x500-1.jpg"},
  {t:"La folle idée de Suzette la Mouette",a:"Carquain Sophie",y:"2026",ed:"La Joie de lire",cote:"J CAR",pub:"Jeunesse",sup:"Imprimé",d:"Quand Suzette la mouette rieuse et Niko le corbeau parisien débarquent en Normandie, c'est la surprise générale. Leur duo a de quoi étonner : l'une, fantasque et excessive, a toujours le bec ouvert, tandis que l'autre est calme et réfléchi. Mais pour les autres mouettes et goélands, il est surtout interdit de se mélanger entre oiseaux des villes et oiseaux des mers ! Niko parviendra-t-il à se faire une petite place sur la plage ? Son amitié avec Suzette survivra-t-elle à cette épreuve ?",isbn:"9782889860562",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782889860562-475x500-1.jpg"},
  {t:"L'envol de la mémoire",a:"Spira Myriam",y:"2026",ed:"Grasset & Fasquelle",cote:"B SPI",pub:"Adulte",sup:"Imprimé",d:"Betty, résistante, a vingt et un ans lorsqu'elle est arrêtée à Bruges, en mars 1942, pour avoir dissimulé un poste émetteur clandestin. Elle est déportée au camp de Ravensbrück puis de Mauthausen. Joseph, juif et résistant, est arrêté quelques mois plus tard, Gare du Midi à Bruxelles, et déporté à Auschwitz-Birkenau. C'est après leur libération, à bord d'un train de la Croix-Rouge, que Betty et Joseph se rencontrent. Cinq enfants grandissent dans l'ombre de ce couple singulier, beau et meurtri. Cinq enfants pour reconstruire une famille décimée, celle de Joseph, dont le père et les quatre frères et soeurs ont été assassinés dans les camps. Petite, Myriam Spira écoutait ses parents raconter : la faim, le froid, les souffrances, la douleur des expériences médicales. Mais aussi leur combat pour la vie, l'espoir de retrouver une existence normale. Cet héritage douloureux imprègne l'âme des enfants qui connaîtront le mal-être existentiel, et la difficulté à devenir parents à leur tour. Autant de symptômes d'une transmission souvent indicible. Myriam Spira nous offre le récit rare d'une \" deuxième génération \", l'histoire de sa vie déportée dans les souvenirs de ses parents, mais aussi de sa reconstruction : à quarante-six ans, grâce à une volonté féroce, elle obtient sa licence de pilote privé et part seule survoler les camps, pour comprendre, maintenant adulte. Et raconter à son tour. Un récit bouleversant.",isbn:"9782246841906",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246841906-M.jpg"},
  {t:"Moi, Lubochka",a:"Baum Gilles",y:"2026",ed:"les Éditions des éléphants",cote:"BDJ BAU",pub:"Jeunesse",sup:"Imprimé",d:"Un ours mène une vie d'ours au fil des saisons. Et puis un Jour, la terre tremble, les bombes pleuvent, le ciel prend feu... Une fable qui permet d'évoquer, avec finesse et subtilité, l'impact des conflits sur les hommes et la nature Cette singulière histoire d'amitié est aussi un hymne puissant à la solidarité et à l'espoir. Amnesty International.",isbn:"9782372731720",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782372731720-475x500-1.jpg"},
  {t:"L'Île des secondes chances",a:"Diamond Lucy",y:"2026",ed:"Charleston",cote:"R DIA",pub:"Adulte",sup:"Imprimé",d:"Sur l'île de Céphalonie, face aux eaux turquoise, L'Echappée ionienne promet des vacances hors du temps. Chaque semaine, de nouveaux voyageurs franchissent les portes de l'hôtel avec l'espoir de laisser leurs soucis derrière eux. Miranda Vallance, ancienne star de la télévision, tente de disparaître, loin du scandale qui a brisé sa carrière. Evelyn Chambers, quatre-vingt-deux ans, a traversé l'Europe pour disperser les cendres de son épouse. Frank Neale, lui, espère fuir les accusations qui menacent de détruire sa réputation - tandis que sa femme, Nelly, nourrit un tout autre projet : retrouver son amour de jeunesse. Entre baignades, excursions sur l'île et longues soirées dans la douceur des nuits grecques, les vies se croisent et les confidences naissent. Car, derrière ce cadre idyllique, chacun porte en lui des regrets, des blessures... et peut-être le désir d'une seconde chance. Lucy Diamond signe un roman lumineux qui célèbre l'amour, les amitiés inattendues, et nous rappelle combien la vie peut nous surprendre. \"UN LIVRE IMPOSSIBLE A LACHER, QUI ENTRAINE LE LECTEUR DANS LE MAGNETISME DE LA VIE SUR L'ILE\". Woman's Weekly Après un début de carrière dans l'édition, Lucy Diamond a quitté Londres pour s'installer dans la ville de Bath avec son mari et ses trois enfants. Et c'est depuis cette jolie ville du sud de l'Angleterre, à jamais immortalisée par Jane Austen, qu'elle écrit ses romans à succès. Au cours des dernières années, elle a vendu plus de trois millions de livres et s'est imposée comme l'une des autrices préférées des Britanniques. Traduit de l'anglais par Nathalie Guillaume",isbn:"9782385295462",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295462-M.jpg"},
  {t:"Les filles de la librairie",a:"Foïs Giulia",y:"2026",ed:"Flammarion",cote:"R FOI",pub:"Adulte",sup:"Imprimé",d:"A Nice, le soleil brille trois cents jours par an. A Nice, de vieilles haines grattent à la porte. A Nice, Maud et Malika tiennent une librairie. Quand elles se sont rencontrées, quand elles sont tombées amoureuses, quand elles ont tout quitté, elles ont ouvert Les Affranchies. Trois ans plus tard, on y croise, entre autres, un anarchiste italien en cavale, un baby-sitter fan de Taylor Swift, une journaliste en lutte - un peu à l'ouest sur ses cycles ovariens -, une jeune mère tatouée qui promène sa poussette au bord du précipice, un prof de yoga déconstruit et le club de lecture des Veuves Poignet. Ce que les filles de la librairie espéraient, c'était offrir un refuge à celles et ceux qui voudraient continuer à respirer, à lutter, à s'aimer librement. Ce qu'elles n'imaginaient pas, c'est qu'il faudrait, pour aider l'une d'entre elles, enterrer un cadavre sur les rives du Paillon.",isbn:"9782080146045",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080146045-M.jpg"},
  {t:"L'espoir de Sophia",a:"Bomann Corina",y:"2025",ed:"Charleston",cote:"R BOM",pub:"Adulte",sup:"Imprimé",d:"Berlin, 1926. A seulement 20 ans, Sophia Krohn voit sa vie s'effondrer. Brillante étudiante en chimie, elle rêvait de reprendre la droguerie familiale et d'y vendre ses propres produits de beauté, mais lorsqu'elle tombe enceinte, son père la met à la porte. Anéantie, Sophia décide de tenter sa chance à Paris. Malgré sa modeste situation, elle continue de croire en son rêve et fabrique des crèmes dans la petite cuisine de sa pension parisienne. Jusqu'au jour où elle rencontre la grande Helena Rubinstein, qui lui propose un poste à deux conditions : la suivre à New York et s'abstenir de se marier pendant les dix prochaines années... Une saga fascinante dans l'univers des cosmétiques de luxe à Berlin, Paris et New York portée par une héroïne libre et attachante, qui souhaite construire sa vie comme elle l'entend, loin des carcans imposés par son sexe. \"SUPERBEMENT DOCUMENTE ET CAPTIVANT ! \" Für Sie Corina Bomann vit dans la campagne allemande, où elle peut écrire en toute tranquillité. Romancière à succès, elle est l'autrice de nombreux ouvrages qui sont fréquemment dans les listes des best-sellers du monde entier et qui se sont vendus à plus de deux millions d'exemplaires. Traduit de l'allemand par Corinna Gepner",isbn:"9782385294793",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385294793-M.jpg"},
  {t:"Si le temps m'était compté",a:"Giordano Stéphanie",y:"2026",ed:"Charleston",cote:"R GIO",pub:"Adulte",sup:"Imprimé",d:"Mila, jeune horlogère passionnée, travaille à Genève dans une boutique de montres de luxe. Un cadre prestigieux, un salaire à la hauteur de ses ambitions, et pourtant... Cette réussite apparente ne la satisfait pas. Elle veut avoir le sentiment de servir à quelque chose. Après avoir refusé les avances d'un client important, elle décide de tout quitter et de retourner chez sa mère à Lautrec, dans le sud de la France, où elle a grandi. Au village, elle rencontre Pablo, un garçon de café philosophe, qui lui pose une question déconcertante : de quelles personnes a-t-elle marqué l'existence sans le savoir ? Mila est persuadée qu'il n'y en a aucune. Pablo, lui, fait le pari de les retrouver, persuadé que l'impact d'une existence ne se mesure pas à des exploits, mais à la profondeur des gestes, ceux qui laissent une trace sans faire de bruit. Dans ce nouveau roman plein d'émotions, Stéphanie Giordano explore la tension entre désir de dépassement de soi et fragilité intime, et interroge ce que signifie pour chacun réussir sa vie.",isbn:"9782385295363",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295363-M.jpg"},
  {t:"Toxique",a:"Bourdelier Matthias",y:"2025",ed:"Expé Editions",cote:"BD BOU",pub:"Adulte",sup:"Imprimé",d:"Une série d'histoires courtes humoristiques qui mettent en scènes des situations toxiques, explorant des thèmes tels que la société, la politique, la psychologie, les relations amoureuses, le sexe, l'amitié, la colocation, le monde du travail, la famille... Tout est abordé au travers du prisme de la toxicité, mêlant subtilement l'absurde et le réalisme.",isbn:"9782493412072",extraUrl:"https://covers.openlibrary.org/b/isbn/9782493412072-M.jpg"},
  {t:"Partir sur la Route circulaire d'Islande",a:"Ham Anthony",y:"2026",ed:"Lonely Planet",cote:"914.91 ISL",pub:"Adulte",sup:"Imprimé",d:"Grâce à la nouvelle collection Partir de Lonely Planet, lancez-vous sur l'incomparable route circulaire d'Islande ! Cette boucle de 1 322 km fait le tour de l'île volcanique et relie presque tous les sites d'intérêt accessibles sans besoin de louer un 4x4 . A la clé, des paysages à couper le souffle et toute la richesse de la vie culturelle islandaise. Située tout près du Cercle polaire arctique, cette île isolée, peu peuplée, est une merveille de la nature, façonnée par des forces titanesques - geysers, volcans et glaciers. Les amateurs d'espaces sauvages spectaculaires seront ravis ! Boucle de 1 322 km, la Route 1 ou Route circulaire relie presque l'ensemble des sites accessibles sans besoin de louer un 4x4 ! En route, vous longerez fjords, marmites de boue, champs de lave lunaires, cascades, plages de sable noir, glaciers majestueux... Vous découvrirez la capitale Reykjavik, un concentré de la vie culturelle islandaise. Avec un peu de patience, vous pourrez observer des macareux sur les falaises, des baleines au large des côtes ou encore des phoques se prélassant sur les plages. Retrouvez toutes les astuces et tous les conseils d'auteurs amoureux de l'Islande pour planifier et préparer votre itinéraire. Ce guide décrit étape par étape les 1 322 km qui composent la Route circulaire. Chaque étape se présente avec un tracé du tronçon proposé, les principaux points d'intérêt, des recommandations de lieux où se restaurer et où se loger et des conseils des auteurs. Des essais thématiques apportent un éclairage sur des spécificités naturelles et culturelles en Islande. Des cartes claires avec le tracé de la Route circulaire et les incontournables, les plans des villes principales avec leurs points d'intérêts. Et une belle première carte dépliante et illustrée qui donne le ton de ce guide. Et bien sûr, toutes les informations pratiques pour se lancer à son tour dans ce beau périple (location de véhicule, code de la route, budget...). En clair, un joli carnet de route avec des pages aux coins arrondis et un format pratique, à emporter avec soi sur la Route circulaire d'Islande.",isbn:"9782384929436",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929436-M.jpg"},
  {t:"Aya de Yopougon",a:"Abouet Marguerite",y:"2005",ed:"Gallimard",cote:"BD ABO",pub:"Adulte",sup:"Imprimé",d:"",isbn:"9782070573110",extraUrl:"https://covers.openlibrary.org/b/isbn/9782070573110-M.jpg"},
  {t:"Le porto",a:"Corbeyran",y:"2022",ed:"Glénat",cote:"BD COR",pub:"Adulte",sup:"Imprimé",d:"Vigneron de père en fils, une histoire de famille sur les terres arides et sauvages du Douro.1703, Liverpool. Robert Handsome et Thomas Woodmass, deux négociants anglais, s'apprêtent à faire route vers le Portugal. Robert compte bien y développer l'activité de son négoce en prospectant les vignobles de la vallée du Douro. Hélas, la région est difficile à dompter et les Anglais ne sont pas toujours les bienvenus. Robert perdra la vie sur ces terres arides avant d'avoir pu réaliser son rêve viticole. Marqué par ce drame, son fils Walter à refait sa vie loin du soleil. Mais le destin est curieux, et en 1708, le jeune vigneron devenu adulte est de retour au Portugal. Aura-t-il plus de chance dans cette entreprise risquée que son défunt père ? Trois générations de vignerons se succèderont pour former cette fresque historique et familiale très documentée.",isbn:"9782344037959",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344037959-M.jpg"},
  {t:"Du goût pour le bonheur",a:"Fouchet Lorraine",y:"2026",ed:"Editions Héloïse d'Ormesson",cote:"R FOU",pub:"Adulte",sup:"Imprimé",d:"Pia, vingt ans, a grandi seule avec sa mère Rose et son parrain, Max. Un jour, parrain et filleule apprennent qu'ils pourraient devenir père et fille. Mais au moment où elle doute de tout, Pia croise la route de celui qu'elle pensait ne jamais connaître... Et si en adoptant un père, elle en trouvait deux ? Par la magie de Groix, cette famille réinventée va révéler le meilleur d'elle-même. Pia, vingt ans, a grandi avec sa mère, Rose, à qui la vie n'a pas fait de cadeau, et son parrain, Max, qu'elle adore. Il est leur pilier et Groix leur port d'attache. Au cours d'un séjour sur l'île, Pia et Max, éternels complices, découvrent qu'ils pourraient devenir fille et père. Cette révélation bouleverse toutes leurs certitudes. Lorraine Fouchet, l'autrice du best-seller Entre ciel et Lou nous offre un concentré d'émotion grâce aux péripéties que vivent ses personnages. Parrain et filleule envisagent de se lancer alors dans une procédure d'adoption sans en parler à Rose, qui de son côté prépare une surprise que Pia n'appréciera guère. Sous le poids des non-dits le trio frise l'implosion et lorsque le père biologique de Pia, Oscar, débarque dans l'équation, tous devront se remettre en question. Pia, Rose, Max et Oscar, cabossés par l'existence, ne demandent qu'à s'aimer, mais les écueils vont s'accumuler sur leur parcours... Heureusement la tendresse et les vents d'ouest vont les aider à retrouver le cap et à révéler le meilleur d'eux-mêmes.",isbn:"9782487819849",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487819849-M.jpg"},
  {t:"Le secret du coeur de pierre",a:"Hicks Faith Erin",y:"2018",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeunesse",sup:"Imprimé",d:"Une tentative d'assassinat vient d'être commise contre le Général de toutes les Lames et le chaos éclate à nouveau dans la cité sans nom. Malgré les efforts de ses habitants pacifiques, la cité est au bord de la guerre. Luttant avec l'aide de Kaidu pour sauver la ville, Rat révèle quelque secrets sur le monastère dans lequel elle a grandi. ©Electre 2018",isbn:"9782369813736",extraUrl:"https://www.bedetheque.com/cache/thb_couv/Couv_327045.jpg"},
  {t:"Le vin et la Chine",a:"Corbeyran",y:"2022",ed:"Glénat",cote:"BD COR",pub:"Adulte",sup:"Imprimé",d:"Les tribulations d'un jeune héritier bordelais.Le jeune Olivier Wiener pourrait hériter d'une belle propriété viticole à Bordeaux. Mais avant, il doit faire ses preuves. Direction : la Chine ! Car faire du vin ne suffit pas, encore faut-il savoir le vendre. La Chine, il n'y connaît rien, pourtant c'est un endroit stratégique pour faire ses armes dans le commerce. Entouré de ses nouveaux collègues, le jeune homme va découvrir une autre facette du métier de vigneron et visiter les régions reculées ou poussent les vignes chinoises. En Chine, la production semble intensive et le vin a un goût bien singulier en bouche. Après le choc culturel, Olivier va peu à peu comprendre le paradoxe de ce pays qui oscille entre traditions millénaires et désire de modernité. Il n'est pourtant qu'au début de son initiation. Il ne maîtrise pas encore les codes lors des repas d'affaires et va commettre des impaires ! Mais pas question de rester sur un malentendu ! A force de persévérance, il pourrait trouver ce qu'il est venu chercher si loin : l'expérience qui lui manque pour reprendre le domaine familial.",isbn:"9782344041949",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344041949-M.jpg"},
  {t:"Micmac à la ferme",a:"Schmitt Michel-Yves",y:"2015",ed:"La Boîte à bulles",cote:"BDJ SCH",pub:"Jeunesse",sup:"Imprimé",d:"Qui, comme Léopold, n'a jamais rêvé de devenir invisible à volonté ? Un pouvoir étonnant qui lui permet de faire toutes sortes de bêtises et autres espiègleries. Cette fois-ci, c'est à la ferme que Léopold et sa soeur, Céline, se retrouvent, coincés chez Papy et Mamie pour les vacances ! Bien décidé à devenir Super-Léo pour libérer les animaux de la ferme et découvrir le mystérieux voleur qui sévit dans les environs, le dynamique Léopold n'en reste pas moins un farceur invétéré... C'est certain, au village, ils n'oublieront pas de sitôt Super-Léo !",isbn:"9782849532133",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782849532133-475x500-1.jpg"},
  {t:"Douceur de la musculation",a:"Page Martin",y:"2025",ed:"Le Nouvel Attila",cote:"305.4 PAG",pub:"Adulte",sup:"Imprimé",d:"Et si la musculation était une voie vers l'émancipation ? Et si elle renforçait la confiance, l'autonomie et la liberté ? Et si la puissance de notre corps se révélait une source de joie ? Martin Page propose de considérer avec un regard nouveau cette pratique, qui permet de prendre soin de nous et de nos proches, tout en protégeant notre fragilité et notre douceur.",isbn:"9782487749498",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487749498-M.jpg"},
  {t:"Les Disparus d'As Covas",a:"Fortes Susana",y:"2026",ed:"L'Archipel",cote:"R FOR",pub:"Adulte",sup:"Imprimé",d:"Août 1979, trois enfants disparaissent à As Covas : les frères Cadavid et Blanca Suances, âgés de 12 à 8 ans. Le lendemain, la fillette est retrouvée indemne. Des deux garçons, nulle trace... 25 ans plus tard, quand leurs ossements sont exhumés, Blanca revient en Galice pour tenter de comprendre ce qui s'est passé cette nuit-là. Un roman d'atmosphère, noir, puissant et singulier. Trois enfants disparaissent en Galice, un village se tait. Vingt-cinq ans après les faits, la seule rescapée revient sur les lieux du drame pour tenter de résoudre le mystère. Un roman d'atmosphère, noir, puissant, singulier. Le suspense littéraire de la rentrée d'hiver 2026. Le samedi 12 août 1979 au soir, trois enfants disparaissent dans la commune espagnole d'As Covas, en Galice, lors de la fête du Castro : Blanca Suances, 8 ans, Nicolas et Hugo Cadavid, 12 et 10 ans. Le lendemain matin, la fillette est retrouvée indemne mais amnésique à des kilomètres de là, de l'autre côté de la frontière portugaise. De Nicolas et d'Hugo, nulle trace... Vingt-cinq ans plus tard, les ossements des frères Cadavid sont exhumés... Accompagnée d'un journaliste local, Blanca retourne sur les lieux du drame, interroge les témoins de l'époque et se heurte à un village encore marqué par les rancunes nées de la guerre civile et d'affaires plus récentes. Même si des flashs lui reviennent, des souvenirs par bribes, difficile pour elle de se représenter un tableau net du passé, aux contours bien définis. D'autant qu'à son envie de résoudre le mystère se mêle une quête toute personnelle, à la (re)découverte de son histoire familiale.",isbn:"9782809850420",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809850420-M.jpg"},
  {t:"A l'école des filles",a:"Châtelet Noëlle",y:"2026",ed:"R. Laffont",cote:"R CHA",pub:"Adulte",sup:"Imprimé",d:"\" Mon adolescence a ceci de particulier que je l'ai vécue en internat. Huit années pendant lesquelles je vais grandir, changer, me transformer dans la contrainte et la discipline, le plus souvent, mais découvrir aussi, émerveillée, mes métamorphoses successives où le désir a, évidemment, sa place. Des années sans lesquelles je ne serais pas devenue la femme que j'ai été et que je demeure encore aujourd'hui. \" Enfermée dans cette vie de pensionnaire à la toute fin des années 1950, Noëlle Châtelet y a acquis le sens de la justice et appris la valeur de la liberté. S'insurgeant contre les ordres des surveillantes revêches et la bienséance obscurantiste à laquelle on aurait voulu la soumettre, vivant des amours clandestines avec d'autres femmes, elle a développé durant ces années un art de la subversion que ses combats comme ses ouvrages n'ont ensuite cessé de défendre. A l'école des filles est le récit de cette expérience fondatrice. Portrait d'une époque où les femmes subissaient encore le carcan d'un ordre ancien, plaidoyer serein pour l'indocilité, ce livre offre un éloge intime, gai et sensuel, de l'émancipation.",isbn:"9782221282465",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221282465-M.jpg"},
  {t:"Les Reines de sang",a:"Blengino Luca",y:"2026",ed:"Delcourt",cote:"BD BLE",pub:"Adulte",sup:"Imprimé",d:"L'histoire des deux vies de Poppée Sabina, épouse de Néron. D'abord, femme ambitieuse et prête à tout pour obtenir le pouvoir, devenue marionnette entre les mains d'un mari fou, violent et... tout-puissant. An 54 après J.-C. : depuis que Messaline a fait massacrer sa famille, la jeune Poppée Sabina n'a qu'un objectif : épouser l'empereur Claude. L'assassinat de ce dernier l'ayant forcée à se reporter sur Néron, son successeur, la confrontation avec sa mère Agrippine, est inévitable... mais son véritable ennemi se révélera être Néron, mari manipulateur, alcoolique et violent.",isbn:"9782413087045",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413087045-M.jpg"},
  {t:"Monténégro",a:"Dragicevich Peter",y:"2026",ed:"Lonely Planet",cote:"914.974 MON",pub:"Adulte",sup:"Imprimé",d:"Des églises solitaires au milieu des flots, des criques secrètes au détour d'une baie, une explosion de couleurs dans l'intimité d'un monastère reculé, des lacs cristallins et de profonds canyons... le Monténégro réserve une palette de surprises et de moments de paix absolue. Tous les sites incontournables et les meilleures expériences à découvrir au Monténégro : le petit village de Sveti Stefan, le mausolée de Njegos, la vieille ville de Kotor, le monastère d'Ostrog, le parc national de Biogradska Gora et celui du Durmitor, la ville d'Ulcinj, le lac de Skadar, la route de Kotor au Lovcen... Une sélection inspirante et très pratique d'itinéraires pour découvrir le meilleur du Monténégro, quel que soit le temps ou le budget disponible. Un chapitre pour organiser une escapade dans la magnifique ville de Dubrovnik, en Croatie, frontalière et toute proche. Un chapitre dédié aux activités en plein air, sur l'eau, sur terre et dans les airs. Un focus sur la cuisine monténégrine : spécialités balkaniques, principaux repas...",isbn:"9782384929306",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929306-M.jpg"},
  {t:"Comment habiller un garçon",a:"Martinez Cyrille",y:"2026",ed:"Verticales",cote:"R MAR",pub:"Adulte",sup:"Imprimé",d:"\"Avant de connaître les mods, j'en étais presque à regretter la Renaissance, la poudre sur le visage, les rouges à lèvre gras, la perruque lourde, les bijoux voyants, les habits tapageurs, tellement je trouvais ça triste de s'habiller en garçon\". Avignon, début des années 1990. Un jeune homme désoeuvré est initié aux codes vestimentaires des mods, une sous-culture née dans la working class anglaise des sixties. Chaque chapitre propose une aventure, extravagante ou burlesque, liée à une pièce de ce vestiaire jusqu'à ce que la tenue soit complète, et la vie du narrateur réinventée. Un roman en forme d'histoire intime de la mode masculine.",isbn:"9782073123329",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073123329-M.jpg"},
  {t:"Cycle 4 - Voyage au centr des terres",a:"Filippi Denis-Pierre",y:"2025",ed:"Vents d'Ouest",cote:"BDJ FIL",pub:"Jeunesse",sup:"Imprimé",d:"La quête ultime Egypte. Emilien, Noémie et Mathilde se retrouvent au coeur du désert. Traqués par Ursula et ses sbires qui veulent récupérer la sphère d'activation, les enfants n'ont d'autre choix que de faire confiance à leur guide Sélim et de fuir à bord d'une felouque des sables. Sous une chaleur écrasante, ils parviennent à franchir le mur de sable d'une tempête errante. Bientôt, ils atterrissent dans une cité cachée qui se trouve être le berceau de la civilisation ayant créé les technologies obscures ! Les enfants n'en croient pas leur yeux et l'espoir de retrouver leurs parents renaît ! Mais en explorant ce lieu, ils sont confrontés à une nouvelle menace : de monstrueux robots sauvages qui n'ont rien à voir avec leur gentil Robby les prennent en chasse... Par chance, Kiritsu et ses robots ninjas viennent en aide à nos jeunes explorateurs. Finalement coincés dans une antique bâtisse, encerclés par une horde de robots, il leur reste peu de temps pour percer le secret qui sommeille dans cet endroit mystérieux. Après avoir sillonné le monde, les enfants touchent presque au but. Parviendront-ils à retrouver leurs parents et à élucider l'énigme de l'origine des technologies obscures ? Ce dernier tome plein de rebondissements clôt une incroyable série fantastique qui a captivé les lecteurs depuis 2012 grâce à ses nombreuses péripéties, son intrigue bien ficelée et une galerie de personnages toujours en quête de vérité. Une saga à ne pas manquer !",isbn:"9782749310350",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310350-475x500-1.jpg"},
  {t:"Inventaire de la basse période",a:"Dantzig Charles",y:"2026",ed:"Grasset & Fasquelle",cote:"844 DAN",pub:"Adulte",sup:"Imprimé",d:"Le monde occidental vit un moment à la fois piteux et menaçant. Ce moment, Charles Dantzig l'appelle la Basse Période. Basse, comme il y a marée basse ; période, parce que les choses n'ont pas encore suffisamment duré pour pouvoir être qualifiées d'époque. Nous pensions les barbares à l'extérieur. Quel optimisme. Ils sont à l'intérieur, et à l'oeuvre. La réaction la plus glaciale est au pouvoir dans bien des pays, souvent portée par une alliance entre des milliardaires et une partie de l'électorat qu'ils ont enragée. Cet Inventaire établit l'accumulation des faits anciens et récents qui, joints à cette volonté de conspirateurs en plein jour, sont devenus des causes : l'injure institutionnalisée, l'abandon du droit au profit de la force, la destruction de toute culture, la course à l'obéissance, un narcissisme féroce... Direction : la tyrannie, dans cet espace mental nommé Occident pourtant fondé contre elle. Ses ennemis intérieurs cherchent à créer un nouvel espace mental d'archaïsme moral joint à la technique la plus perfectionnée. Et parmi cela, la vie, la vie qui continue, distraite, frivole, avec l'amour, la jalousie, la sexualité... qui ne sont pas des absolus. Les sentiments sont aussi des produits du monde où ils apparaissent. Et eux aussi changent, et bien souvent dans le sens de la réaction contre toute humanité. La marée remontera-t-elle ou la tyrannie nous entraînera-t-elle par le fond ?",isbn:"9782246845324",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246845324-M.jpg"},
  {t:"Mon cerveau sous emprise",a:"Michelon Pascale",y:"2026",ed:"Leduc",cote:"155.2 MIC",pub:"Adulte",sup:"Imprimé",d:"L'emprise combine manipulation, contrôle et abus pour vulnérabiliser et maîtriser autrui. Violente, elle est souvent incompréhensible. Comment un être humain peut-il en faire souffrir un autre de la sorte ? Et pourquoi la personne ciblée reste-t-elle en lien ? Aujourd'hui, les neurosciences offrent des réponses à ces questions : l'emprise remodèle le cerveau des personnes prises au piège, provoquant confusion et dépendance. Du côté des auteurs d'emprise, la neuroimagerie révèle des dysfonctionnements émotionnels et relationnels. Ce livre, écrit du point de vue de la personne sous emprise, permet de prendre conscience des mécanismes cérébraux et psychologiques à l'oeuvre. Il propose également des solutions pour échapper à la violence de la situation et éviter sa répétition. une approche neuroscientifique qui offre : > Une perspective inédite par la compréhension de ce qui se joue à la fois dans le cerveau des auteurs d'emprise et dans celui de leurs cibles. > Une vision factuelle et déculpabilisante de ce qu'est une relation d'emprise. > Des pistes concrètes pour se libérer, grâce à la plasticité neuronale. Accessible et riche de nombreux cas, Mon cerveau sous emprise s'adresse à vous, qui avez vécu ou vivez encore une relation d'emprise. Il sera également précieux pour vos proches et pour les professionnels qui vous accompagnent. Il ouvre la voie vers l'action et la libération. Pascale Michelon est docteure en neurosciences et psychologue. Après une carrière dans la recherche scientifique aux Etats-Unis, elle ouvre un cabinet de consultation à Genève. Ses années d'accompagnement et d'étude du cerveau lui ont donné une compréhension en profondeur du fonctionnement humain et des relations. Elle a publié Au coeur des cerveaux hauts potentiels et hypersensibles chez Leduc.",isbn:"9791028534066",extraUrl:"https://covers.openlibrary.org/b/isbn/9791028534066-M.jpg"},
  {t:"Le voyage dans le temps",a:"Mallorquí César",y:"2026",ed:"Editions Casterman",cote:"J MAL",pub:"Jeunesse",sup:"Imprimé",d:"Une suite attendue pour la série à succès ! Quand un bébé nommé Kid est laissé à l'entrée de l'école Zener, Axel est loin de s'imaginer qu'il s'apprête à vivre sa plus folle aventure ! Car si le bambin semble a priori inoffensif, il est capable de voyager à travers le temps et l'espace. C'est ainsi qu'Axel, Lola et Treize se retrouvent malgré eux projetés d'une bataille médiévale à la destruction de Pompéi au péril de leurs vies... Mais la situation dégénère encore quand des créatures tout droit sorties de la préhistoire commencent à apparaître dans le pensionnat. Le temps presse, Axel et ses amis doivent trouver un moyen d'arrêter cet enfant avant qu'il ne détruise l'école !",isbn:"9782203300187",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300187-475x500-1.jpg"},
  {t:"Corps célestes à la lisière du monde",a:"Stefánsson Jón Kalman",y:"2026",ed:"Christian Bourgois éditeur",cote:"R STE",pub:"Adulte",sup:"Imprimé",d:"Islande, XVIIe siècle. Le révérend Pétur, un homme tourmenté précédé d'une réputation sulfureuse, écrit une longue lettre à une destinataire mystérieuse. Après des études à Copenhague et un séjour en Angleterre, il a été nommé à la paroisse de Brúnisandur dans les fjords de l'Ouest. A son arrivée, Pétur est accueilli par la servante Dóróthea, une femme à la mémoire prodigieuse et au caractère affirmé. Elle deviendra rapidement un soutien indéfectible face à l'adversité et dans son projet de relater les événements tragiques qui secouent l'île : le bailli Ari Magnússon - représentant de la couronne danoise - a décidé de s'attaquer aux pêcheurs espagnols échoués sur l'île après le naufrage de leurs bateaux, et Pétur tente d'empêcher le pire. Son récit oscille entre le passé et le présent, l'intime et le politique, et met en scène des personnages inoubliables - un capitaine anglais amoureux de l'Islande, la chienne Sappho, les pêcheurs espagnols Pedro et Sebastián, la mystérieuse Helga - pour raconter cette tragédie qui compte parmi les pages les plus sombres de l'histoire de l'Islande. Corps célestes à la lisière du monde est un très grand roman, assurément l'un des plus puissants de Stefánsson, à la résonance très contemporaine.",isbn:"9782267058376",extraUrl:"https://covers.openlibrary.org/b/isbn/9782267058376-M.jpg"},
  {t:"J'irai jusqu'au bout de vos nuits",a:"Gutmann Caroline",y:"2026",ed:"Editions de l'Observatoire",cote:"R GUT",pub:"Adulte",sup:"Imprimé",d:"Paris, l'été. Après une opération au cerveau, Caroline Mendel, lasse de ses rendez-vous à l'hôpital dans la capitale désertée, cherche une échappatoire. C'est au parc Montsouris qu'elle va la trouver : grâce à la rencontre d'une vieille dame fantasque, elle découvre le mystère du palais du Bardo. Reproduction du palais du bey de Tunis et haut lieu de science, il a trôné pendant plus de cent vingt ans sur la colline de Montsouris, avant de disparaître le 5 mars 1991 dans un incendie dont on n'a jamais su l'origine. La narratrice se livre alors à un véritable jeu de pistes. D'un palais oublié aux laboratoires de l'Empire allemand, de la grande chimiste Clara Immerwahr, suicidée par idéal pacifiste, à une histoire d'amour lourde de secrets, elle tente à tout prix d'élucider cette \" affaire du Bardo \". Enquête passionnante autour d'un joyau disparu de Paris qui donne voix à des femmes que l'on a longtemps tenté de réduire au silence, J'irai jusqu'au bout de vos nuits nous rappelle que si la mémoire est oublieuse, il reste toujours, dans les cendres, des traces du passé.",isbn:"9791032938423",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032938423-M.jpg"},
  {t:"Les mystères de Sinclair. Le vol du moineau d'or",a:"Woodfine Katherine",y:"2026",ed:"Poulpe fictions",cote:"J WOO",pub:"Jeunesse",sup:"Imprimé",d:"Bienvenue chez Sinclair, le plus grand et le plus élégant magasin de Londres ! Sophie, une jeune orpheline débrouillarde, vient d'y être embauchée comme vendeuse. A elle les robes en soie, les chapeaux à plumes et les vitrines somptueuses ! Mais le rêve tourne au cauchemar lorsque l'inestimable Moineau d'Or y est volé... et que Sophie est accusée ! Accompagnée de Billy, garçon d'étage fan de romans policiers, et de Lil, mannequin qui rêve de devenir actrice, réussira-t-elle à faire éclater la vérité ?",isbn:"9782377424405",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782377424405-475x500-1.jpg"},
  {t:"Les Voies souterraines",a:"Kermici Sylvain",y:"2026",ed:"Plon",cote:"R KER",pub:"Adulte",sup:"Imprimé",d:"Deux âmes à la dérive que tout aimante, jusqu'au pire... Dans un snack miteux d'une zone périphérique décrépie, Liz rencontre Joshua. Liz vient de s'enfuir de l'hôpital psychiatrique où ses parents l'ont abandonnée quelques années auparavant : depuis qu'elle est enfant, elle évolue dans un monde peuplé de fantômes et de démons qu'elle seule peut voir. Une fois sortie de ce cauchemar médicalisé et arrivée en ville, Liz erre, dans les rues, les gares, les bars. Joshua, lui, est un jeune homme en colère. Rebelle radical, il est en guerre contre toutes les normes sociales. Lui aussi est en fuite, mais pas pour les mêmes raisons : il a tué ses parents. En cavale, il n'a plus rien à perdre. Ces deux êtres à la dérive s'aimantent au premier regard. Joshua propose à Liz de partager sa chambre dans un sinistre hôtel peuplé de sans-papiers, de travailleurs précaires qui se lèvent au coeur de la nuit pour aller bosser. Joshua et Liz commencent à voler dans les chambres, de menues rapines mais c'est comme si le feu avait pris. Très vite, ils passent à la vitesse supérieure, vivent dans des squats, préparent les prochains coups. Ces deux-là se nourrissent l'un l'autre : Liz permet à Joshua d'assumer sa violence impulsive et macabre, Joshua donne à Liz l'impression de compter enfin pour quelqu'un. Un jour, Joshua repousse les limites : il demande à Liz de lui livrer des victimes pour les tuer... Les Voies souterraines est un livre vénéneux et âpre, une expérience littéraire qui marque le lecteur au fer rouge. S'inspirant des couples de serial killers comme Michel Fourniret et Monique Olivier ou le couple anglais des West, Sylvain Kermici décrit cette dynamique qui se crée entre deux personnes n'ayant plus rien à perdre mais obéissant seulement à la tyrannie du présent et à leurs pulsions destructrices. Mais aussi fascinant et dérangeant que cela puisse être, Les Voies souterraines est d'abord une histoire d'amour, et l'exploration sans fard de sa dimension noire et morbide.",isbn:"9782259322751",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259322751-M.jpg"},
  {t:"Klaus",a:"Collard Gilles",y:"2025",ed:"Climats",cote:"B KLA",pub:"Adulte",sup:"Imprimé",d:"Dans la célèbre famille du prix Nobel de littérature Thomas Mann, c'est du fils que nous pouvons tirer des leçons pour notre temps. Ecrivain précoce et prolifique, Klaus Mann invente une manière de vivre préfigurant les sexualités queer. Avec sa soeur Erika, il incarne l'esprit de la République de Weimar. Dès le début des années 1930, Klaus alerte sur les dangers qui menacent la fragile démocratie et l'Europe tout entière. En mars 1933, il prend le chemin de l'exil et devient, à travers ses romans, ses essais et la revue Die Sammlung, une figure de proue du combat contre le nazisme. Parmi les premiers déchus de la nationalité allemande, il mène une vie d'errance et de lutte entre le sud de la France, Amsterdam et New York, sans jamais renoncer à l'idéal d'un humanisme socialiste et européen. Dans ce portrait biographique passionné, qui ne sépare pas les gestes des idées, Gilles Collard redonne tout son relief à un pan entier de l'histoire intellectuelle du XX ? siècle, qui voit dialoguer Klaus Mann et Stefan Zweig, Walter Benjamin, André Gide ou encore Hannah Arendt. Il retrace l'histoire de la \"gravité désespérée\" qui fut celle de Klaus Mann. Eloigné à la fois d'un héroïsme sacrificiel et de la victimisation stérile, celui-ci n'aura jamais cédé ni sur les principes universels, ni sur sa part d'ombre, opaque et singulière. C'est cette tension, tragique et lumineuse, qui fait de Klaus Mann un modèle pour les temps troublés qui sont à nouveau les nôtres.",isbn:"9782080480101",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080480101-M.jpg"},
  {t:"Le Cataclysme",a:"Aupied Pauline",y:"2026",ed:"Gallimard",cote:"J AUP",pub:"Adolescent",sup:"Imprimé",d:"Eléments déchaînés, tentation du mal et destins tragiques : un final fracassant pour ce diptyque de fantasy. A peine sortis de Fort-Ressac, les Azuriens se retrouvent prisonniers au fond d'une grotte. Hors de question pour Nérée de les laisser dépérir comme de vieilles algues séchées ! Il convainc donc ses amis de repartir à l'aventure. Objectif : s'assurer contre les Pyres le soutien de Ryk, la plus terrible des prodiges. Alors que menace rien de moins que la fin du monde, Nérée est déterminé à être le héros de l'histoire. Quitte à affronter le Cataclysme, et peut-être même à perdre ses amis.",isbn:"9782075236096",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075236096-475x500-1.jpg"},
  {t:"Myrmidon sous les mers",a:"Dauvillier Loïc",y:"2024",ed:"Editions de la Gouttière",cote:"BDJ DAU",pub:"Jeunesse",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même... C'est quoi Myrmidon ? Une série de bande dessinée sans texte, créative, drôle, et poétique à lire dès 2 ans, en autonomie ou avec un accompagnement !",isbn:"9782357961050",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782357961050-475x500-1.jpg"},
  {t:"Myrmidon et la bête de la montagne",a:"Dauvillier Loïc",y:"2018",ed:"les Éditions de la Gouttière",cote:"BDJ DAU",pub:"Jeunesse",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même...",isbn:"9791092111828",extraUrl:"https://images.epagine.fr/828/9791092111828_1_m.jpg"},
  {t:"L'esprit d'élégance",a:"Ternynck Catherine",y:"2026",ed:"Desclée de Brouwer",cote:"153 TER",pub:"Adulte",sup:"Imprimé",d:"Autour de nous, les incivilités se multiplient, les barbaries se répandent, l'impudeur règne, l'outrance est la norme. L'élégance semble être devenue une pensée anachronique, l'emblème d'un âge ancien. Ce qui aujourd'hui anime les esprits, c'est la consommation, le profit, la libéralité, l'immédiateté en toutes circonstances. Il y a pourtant ce \"quelque-chose, presque-rien\" fugitivement saisi dans l'ordinaire du temps, comme une distinction singulière, une tension vers la beauté, une grandeur ajoutée à la vie. Cette impression, qui n'a rien de mièvre ou de naïf, a amené Catherine Ternynck à envisager, bien au-delà de sa dimension esthétique, la force de l'expression spirituelle de l'élégance. Cet esprit d'élégance s'impose comme une résistance à la vulgarité de notre époque. Il nous permet de trouver une plus haute qualité d'existence, et nous mène vers des joies humaines inattendues. Catherine Ternynck est docteur en psychologie, psychanalyste. Elle a exercé à l'hôpital Saint Philibert de Lomme et enseigné à l'université catholique de Lille. Elle est l'auteur de plusieurs essais dont Chambre à part (Desclée de Brouwer, 2007 ; prix du Furet et de La Voix du Nord), L'homme de sable (Seuil, 2011), La possibilité de l'âme (Bayard, 2018).",isbn:"9782220099392",extraUrl:"https://covers.openlibrary.org/b/isbn/9782220099392-M.jpg"},
  {t:"Chine - Etats-Unis : la nouvelle guerre froide",a:"Niblett Robin",y:"2026",ed:"Armand Colin",cote:"327 NIB",pub:"Adulte",sup:"Imprimé",d:"Face a la nouvelle guerre froide, l'europe joue sa survie stratégique. La lutte entre les Etats-Unis et la Chine est mondiale, elle englobe tous les principaux instruments de gouvernance - économiques, politiques et militaires. Et les deux protagonistes travaillent dur pour attirer à leurs côtés des alliés du monde entier. Mais cette nouvelle guerre froide n'a rien à voir avec le conflit entre l'Union soviétique et l'Occident qui a marqué la seconde moitié du XXe siècle. La manière dont cette rivalité sera gérée déterminera la survie de la coopération internationale, l'issue de l'urgence climatique et de la révolution technologique et, bien sûr, quelles puissances domineront le XXIe siècle et quel modèle de gouvernement définira notre avenir. Dans ce livre, Sir Robin Niblett affirme que ce n'est qu'en regardant en arrière que nous pourrons tirer les leçons qui nous guideront à travers cette nouvelle réalité. Il revient ici sur les dix particularités de la nouvelle guerre froide et propose cinq pistes pour la surmonter.",isbn:"9782200642037",extraUrl:"https://covers.openlibrary.org/b/isbn/9782200642037-M.jpg"},
  {t:"Brown-out : quand le travail perd son sens",a:"Desmet Etienne",y:"2026",ed:"Eyrolles",cote:"158.7 DES",pub:"Adulte",sup:"Imprimé",d:"De plus en plus de salariés s'interrogent sur la valeur et le sens de leur travail. Perte de sens, chute de le motivation, désengagement ou désalignement... le phénomène touche tous les secteurs, publics comme privés, et a désormais un nom : le brown-out. Premier ouvrage de référence sur le sujet, ce livre en propose une analyse complète, à la fois rigoureuse et accessible. A travers des témoignages concrets, des apports théoriques éclairants et des outils pratiques, il aide à comprendre les mécanismes du brown-out et à agir pour le prévenir. Dirigeants, managers, RH, coach et professionnels de l'accompagnement y trouveront des clés pour nourrir le sens au travail des équipes, recréer de l'engagement et construire des organisations à la fois plus humaines, plus performantes et plus durables.",isbn:"9782416024047",extraUrl:"https://covers.openlibrary.org/b/isbn/9782416024047-M.jpg"},
  {t:"Iles secrètes en Europe",a:"Firquet Hélène",y:"2026",ed:"Gallimard",cote:"914.04 FIR",pub:"Adulte",sup:"Imprimé",d:"Envie de larguer les amarres ? D'être dépaysé sans vous envoler à l'autre bout du monde ? Aux antipodes de stars comme Capri, Santorin ou Ibiza, ces îles plus confidentielles promettent des séjours inédits, à l'écart des foules, mais tout aussi riches ! Sauvages ou habitées, elles réservent des trésors de plages, criques, petits ports de charme, volcans, montagnes, dunes et falaises, réserves sous-marines, eaux bleu marine ou turquoise... Des paysages d'une infinité variété sous toutes les latitudes, de la mer de Norvège à la mer Egée, en passant par l'Atlantique et la Baltique... et même les lacs italiens ou finlandais. Ces voyages augurent de belles rencontres avec les îliens, toujours à l'écoute des éléments et de la nature. Mais aussi des expériences entre ciel et terre : dormir dans un phare à l'île Vierge, jouer les Robinson aux îles Kornati, accompagner les pêcheurs dans l'archipel de Solund, se baigner dans des piscines volcaniques à Faial...",isbn:"9782742469789",extraUrl:"https://covers.openlibrary.org/b/isbn/9782742469789-M.jpg"},
  {t:"Un rêve dangereux",a:"Westin Miila",y:"2026",ed:"Éditions Sarbacane",cote:"BDJ WES",pub:"Jeunesse",sup:"Imprimé",d:"L'été n'a pas été de tout repos pour Eevi : elle a sauvé le monde d'un hiver sans fin en libérant l'esprit du printemps... Et voilà que son ami, le gnome Otso, fait irruption dans sa chambre pour lui demander de l'aider à sauver sa soeur, victime d'une malédiction. Eevi et Otso partent pour le monde des gnomes. Mais attention, la terrible sorcière Louhi et ses affreux lutins sont à leurs trousses...",isbn:"9791040807063",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040807063-475x500-1.jpg"},
  {t:"Un hiver sans fin",a:"Westin Miila",y:"2025",ed:"Éditions Sarbacane",cote:"BDJ WES",pub:"Jeunesse",sup:"Imprimé",d:"Il neige encore en juin ! Alors que l'été refuse d'arriver, Eevi accompagne sa famille chez sa grand-mère pour trier les affaires de son grand-père récemment disparu. Se promenant près de la rivière, elle fait une rencontre pour le moins étonnante : un esprit de l'orge ! Il lui explique que l'esprit du printemps est retenu prisonnier par une terrible sorcière et qu'il suffit de le libérer pour mettre fin à cet interminable hiver. Eevi se retrouve alors dans les profondeurs de Tuonela, un monde peuplé de créatures magiques où l'on règle les problèmes à coups de puissants sortilèges !",isbn:"9791040807056",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040807056-475x500-1.jpg"},
  {t:"Intelligence criminelle",a:"Weaver Thomas R.",y:"2026",ed:"Seuil",cote:"SF WEA",pub:"Adulte",sup:"Imprimé",d:"Nous sommes en 2050. Notre intelligence nous a conduit au bord du gouffre. Alors qu'une catastrophe climatique sans précédent ravage la planète, l'humanité n'a plus qu'une solution radicale pour éviter l'effondrement : confier son destin à un dirigeant global, chargé de la guider à travers l'apocalypse annoncée. Deux candidats s'affrontent pour ce pouvoir absolu. Lockwood, ancien président des Etats-Unis. Solomon, première intelligence artificielle politique de l'Histoire. Quand la créatrice de Solomon est retrouvée assassinée, le journaliste d'investigation Marcus Tully comprend que cette élection n'est qu'une façade : quelqu'un tire les ficelles. Alors que la rumeur d'un complot mondial enflamme les nations, Tully découvre bientôt que son enquête en cache une autre. Car ce n'est plus seulement l'issue de l'élection qui est en jeu, mais ce qui définit l'humanité : sa liberté.",isbn:"9782386433597",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386433597-M.jpg"},
  {t:"Babinoche mon grand chien",a:"Surribas Caroline",y:"2026",ed:"Frimousse",cote:"A SUR",pub:"Jeunesse",sup:"Imprimé",d:"A quoi ressemble une année avec mon chien Babinoche ? Ce que je peux vous dire, c'est qu'on ne s'ennuie jamais... Nos bêtises et nos aventures sont comme lui : gi-gan-tesques !",isbn:"9782383496557",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496557-475x500-1.jpg"},
  {t:"Rue des Batailles",a:"Crenn Antonin",y:"2026",ed:"Actes Sud",cote:"R CRE",pub:"Adulte",sup:"Imprimé",d:"Un homme a disparu. Il s'appelait Jules, Napoléon, Prosper, et le nom de son père. Antonin Crenn raconte. Enfant, Jules grandit à Epinal, puis à Tours, suivant les déplacements de son père vétérinaire militaire. Orphelin à quinze ans, il est envoyé à Paris chez le musicien François Delsarte, rue des Batailles. Puis Jules rencontre Elmina à Montmartre et part en Espagne avec elle, embarqués dans l'épopée du chemin de fer naissant. Ils reviennent avec Maurice, leur fils né à Madrid. Quand Jules disparaît, il a cinq ans. Un an plus tard, le drame intime de Maurice et Elmina devient le sort de tout le monde : après les sièges de Paris et l'écrasement sanglant de la Commune, des milliers de pères et de mères sont notés absents. C'est cela aussi que raconte \"Rue des Batailles\" : une histoire de la violence politique, des démolitions à grande échelle, des bouleversements qui nous dépassent et nous englobent. Autour de la figure absente, Antonin Crenn déroule un brillant récit en spirale, à la fois intime et historique ; traversée éminemment sensible et intelligente du XIXe siècle, en même temps que réflexion sur la mémoire dont nous choisissons ou non d'être les dépositaires.",isbn:"9782330216603",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216603-M.jpg"},
  {t:"García Lorca et le poète birman",a:"Malowé Nour",y:"2026",ed:"Editions Récamier",cote:"R MAL",pub:"Adulte",sup:"Imprimé",d:"RENTREE LITTERAIRE Quand la dictature bâillonne, la littérature devient résistance. Un roman incandescent sur le pouvoir de la littérature face à l'oppression. - Apportez-moi un livre interdit. - Un livre interdit ? - García Lorca, Noces de sang. Ce livre détient la réponse à l'énigme de ma vie. Depuis des décennies, la Birmanie vit sous le joug d'une junte militaire impitoyable. Là-bas, les mots sont plus redoutés que les armes : lire est un crime, et la littérature, un acte de résistance. C'est à Naypyidaw, capitale démesurée et presque vide, que se croisent Arun, fils d'un général, poète bâillonné par le totalitarisme, et Jack, écrivain français en exil, à bout de souffle. Ils ont la littérature en commun : l'un mourrait pour elle, l'autre n'attend qu'elle pour revivre. Jack est celui qu'Arun espérait, celui qui le mènera au livre interdit. Au-delà du récit d'aventure et de la fable politique, García Lorca et le poète birman est une ode à la littérature comme ultime refuge contre la barbarie. A travers la destinée tragique d'Arun, Nour Malowé signe un roman incandescent sur le pouvoir des mots, la beauté, l'amour et la liberté - ces armes silencieuses qui défient l'obscurantisme. Son précédent roman, Le Printemps reviendra, a remporté le Prix littéraire de la Grande Mosquée de Paris, le Prix Gonet, ainsi que le prix du Roman Métis des Lecteurs de la Ville de Saint-Denis 2025.",isbn:"9782385772253",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385772253-M.jpg"},
  {t:"Madame la Nuit",a:"Colin Fabrice",y:"2025",ed:"Gautier-Languereau",cote:"A COL",pub:"Jeunesse",sup:"Imprimé",d:"Madame la Nuit aime faire la fête! Sortir, danser sans s'arrêter...Alors pourquoi aller se reposer ? Un jour, elle décide de ne pas rentrer. Du tout. Depuis, dans la Grande Ville, il fait toujours nuit. Sortir le chien, jouer à la marelle, courir à l'école... tout se passe dans le miroitement des étoiles et des réverbères. C'est amusant... et puis, ça l'est un peu moins. Comment convaincre Madame la Nuit d'aller se coucher ? Un conte nocturne poétique et enchanteur, éclatant de couleurs, pour s'émerveiller des petits mystères de la nuit.",isbn:"9782017348214",extraUrl:"https://m.media-amazon.com/images/I/513VXxwul2L._SX210_.jpg"},
  {t:"Chansons des bois",a:"Piercey Rachel",y:"2025",ed:"Gallimard",cote:"J 841 PIE",pub:"Jeunesse",sup:"Imprimé",d:"La forêt regorge de magie et de poésie à observer et à méditer au travers de ces 40 chansons des bois. Papa ours invite son ourson à se laisser bercer par les secrets de la nature et à partager la délicatesse de chaque instant, même infime. Aube, rosée ou champignon, chaque élément est célébré. Il y a tant de merveilles à découvrir !",isbn:"9782075211864",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075211864-475x500-1.jpg"},
  {t:"Les minéraux",a:"Beaumont Jacques",y:"2013",ed:"Fleurus",cote:"J 549 BEAU",pub:"Jeunesse",sup:"Imprimé",d:"Comment se forme les minéraux ? où les trouve-t-on ? En quoi sont-ils importants dans notre vie quotidienne ? Un livre pour tout savoir sur ce sujet qui captive les enfants. De belles doubles pages sur l'or, les diamants, les pierres précieuses et les minéraux extraordinaires, avec des précisions sur leur mode d'extraction et des histoires sur les pierres.",isbn:"9782215116219",extraUrl:"https://products-images.di-static.com/image/base/9782215116219-120x160-1.jpg"},
  {t:"L'archéologie",a:"Beaumont Jacques",y:"2013",ed:"Fleurus",cote:"J 930.1 BEAU",pub:"Jeunesse",sup:"Imprimé",d:"11 doubles pages pour mieux connaître ce métier passionnant : la découverte d'un site, les étapes d'une fouille, l'archéologie sous-marine, le travail en laboratoire, les méthodes de datation et de reconstitution des vestiges, comment transmettre le passé?",isbn:"9782215115700",extraUrl:"https://products-images.di-static.com/image/base/9782215115700-120x160-1.jpg"},
  {t:"Etre montagne",a:"Starace Jacopo",y:"2022",ed:"Éditions Sarbacane",cote:"BD STA",pub:"Adulte",sup:"Imprimé",d:"Il y a d'abord eu la puanteur, qui a brutalement remplacé la brise parfumée soufflant habituellement sur la vallée des êtres fourmis, ces hommes de quelques millimètres de haut vivant dans les sous-bois. Puis, la maladie du Bacille s'est répandue comme une traînée de poudre, n'épargnant aucun village endeuillant chaque foyer. C'est au paroxysme de l'épidémie qu'ils sont apparus, immenses salvateurs divins : les êtres montagnes ont donné l'antidote au Prieur Armillaire et ont ainsi sauvé son peuple. Tout le monde connaît cette légende, y compris Myco et sa petite soeur, Paille, qui ont perdu leurs parents dans cette tragédie... Et l'austère Prieur, désormais chef du village des Champignons, s'assure que personne ne l'oublie et que tout un chacun honore dûment les êtres montagnes. Alors quand un étranger portant un masque doté d'un long bec d'oiseau arrive au village et annonce que la maladie est de retour, personne ne veut le croire. Mais Myco, qui voit des premiers stigmates apparaître sur la peau de sa soeur, décide, contre l'avis de tous, de gravir la montagne pour chercher la dernière dose antidote.",isbn:"9782377318148",extraUrl:"https://covers.openlibrary.org/b/isbn/9782377318148-M.jpg"},
  {t:"Jane Eyre",a:"Brontë Charlotte",y:"2026",ed:"Editions Gallmeister",cote:"823 BRO",pub:"Adulte",sup:"Imprimé",d:"Orpheline, Jane Eyre est recueillie par sa tante qui ne cesse de la maltraiter. Envoyée en pension, elle y reste jusqu'à ses dix-huit ans. Elle devient alors la préceptrice de la pupille de l'énigmatique M. Rochester, dont elle ne tarde pas à tomber passionnément amoureuse. Bien que cet amour soit réciproque, les obstacles seront nombreux sur la route des deux amants. Jane devra faire preuve d'une détermination sans pareille pour surmonter ses doutes et se libérer de ses entraves.",isbn:"9782404081403",extraUrl:"https://covers.openlibrary.org/b/isbn/9782404081403-M.jpg"},
  {t:"Les tendresses de Zanzibar",a:"Morales Thomas",y:"2026",ed:"Editions du Rocher",cote:"R MOR",pub:"Adulte",sup:"Imprimé",d:"Dans Les Tendresses de Zanzibar, Thomas Morales nous raconte un homme et une femme. Comment ils se sont aimés. Leurs rires, leurs fêlures, leurs caresses. La géographie sentimentale de leur histoire est une fugue permanente. Entre Paris et la province, leurs coeurs balancent. Ennio Flaiano et Philippe de Broca s'invitent dans la conversation. Des actrices oubliées passent, s'attardent, comme sorties d'un film de Sorrentino. Rome et la Corse ont pour les amoureux le charme des paradis perdus et des chansons de Lucio Battisti. Ils aiment la lenteur, celle des plages et du soleil, mais ne détestent pas la vitesse, quand il s'agit de conduire à tombeau ouvert sur des routes départementales. La mort, parfois, est plus abrupte qu'un virage. Ceci est un roman d'amour, écrit de la plus délicate des plumes, à la fois quête mélancolique des jours heureux et lettre d'adieu. En refermant ces pages, la gorge serrée, ces mots, tel un écho : \"Ne me secouez pas, je suis plein de larmes\". Ecrivain et chroniqueur, notamment pour Le Figaro, Thomas Morales est l'auteur de plusieurs essais littéraires remarqués, et primés (Coup de Shako du prix des Hussards 2017, prix Tillinac 2022). Il signe avec Les Tendresses de Zanzibar son roman le plus intime et le plus bouleversant.",isbn:"9782268112985",extraUrl:"https://covers.openlibrary.org/b/isbn/9782268112985-M.jpg"},
  {t:"Vivre avec Parkinson",a:"Deseyn José",y:"2026",ed:"Racine Lannoo",cote:"612.821 DES",pub:"Adulte",sup:"Imprimé",d:"La maladie de Parkinson est en nette progression dans le monde et touche des patients de plus en plus jeunes. Dans nos régions, elle constitue la deuxième maladie neurodégénérative après Alzheimer. Qui ne connaît pas, dans sa famille ou son entourage, une personne atteinte de la maladie de Parkinson ? Pourtant, l'annonce d'un tel diagnostic reste un choc, tant pour le patient que pour ses proches. Tremblements, lenteur, rigidité... Les symptômes moteurs sont visibles, mais bien d'autres, plus discrets, bouleversent le quotidien : troubles du sommeil, fatigue, anxiété, perte d'odorat ou difficultés de concentration. Sur un ton à la fois lucide et bienveillant, le Dr José Deseyn, médecin généraliste atteint de la maladie depuis plus de vingt ans, partage son double regard de praticien et de patient. Il explique ce qu'est réellement la maladie, comment en reconnaître les multiples manifestations et quelles sont les options thérapeutiques aujourd'hui disponibles, médicamenteuses ou autres. Entre témoignage personnel et guide pratique, ce livre offre aux patients et à leurs proches une compréhension approfondie de cette pathologie complexe, dont les symptômes et les réponses aux traitements varient d'un individu à l'autre. Il invite à dédramatiser, à mieux comprendre et à vivre pleinement malgré la maladie.",isbn:"9782390253709",extraUrl:"https://covers.openlibrary.org/b/isbn/9782390253709-M.jpg"},
  {t:"Le crépuscule des dieux",a:"Duhamel Patrice",y:"2026",ed:"Editions de l'Observatoire",cote:"320 DUH",pub:"Adulte",sup:"Imprimé",d:"Après des années de combat contre la maladie, Georges Pompidou et François Mitterrand n'avalent ni la force de présider ni le courage de démissionner. Quand la souffrance d'un président devient insupportable, quand l'épuisement brouille le jugement, quand les traitements altèrent le caractère, c'est l'Etat tout entier qui vacille. Chez un chef d'Etat, cette vérité devient un problème politique et institutionnel majeur. En 1955, les médecins de De Gaulle découvrent l'anévrisme qui le tuera. Le général ne le saura jamais. Le professeur Jean Bernard diagnostique la leucémie de Pompidou huit mois avant son élection. Le secret durera au-delà même de la mort du président. En 1981, Mitterrand apprend qu'un cancer métastasé lui laisse entre trois mois et deux ans à vivre. Il tiendra quatorze ans, au prix de douleurs parfois difficilement compatibles avec ses fonctions et de bulletins de santé mensongers. En 2005, un AVC change insidieusement la fin de la présidence Chirac. Grâce à un document saisissant, le journal de Jean Bernard, et à partir de nouveaux témoignages et d'archives rares, Patrice Duhamel retrace, dans une enquête inédite, ces drames intimes devenus mensonges d'Etat. Où s'arrête le secret médical quand il s'agit du chef des armées et du gardien de l'arme nucléaire ? Quand un président n'a plus la force de présider, qui doit le dire - et qui ose le faire ?",isbn:"9791032939284",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032939284-M.jpg"},
  {t:"Le jour ou je suis devenu espion",a:"Crouzet Vincent",y:"2026",ed:"Editions de l'Observatoire",cote:"330 CRO",pub:"Adulte",sup:"Imprimé",d:"\"Je souhaite raconter non pas un, mais des jours J, ceux qui m'ont construit dans mon activité d'agent de renseignement au sein du \"service clandestin\" de la DGSE. Qui m'ont fait me confronter, à la fin de la guerre froide, aux fractures du monde, auprès des personnalités les plus extraordinaires que j'aie jamais rencontrées. Il sera question évidemment d'opérations clandestines, de manipulations, d'apprentissage de \"couvertures\" et de \"légendes\", d'officiers traitants, d'infiltration dans les milieux criminels. Contrebandier au côté des guérilleros, marchand de carburant et de bien d'autres choses, consultant dans le milieu diamantaire d'Anvers, j'ai connu mille vies, du Liban au Congo, du Caire au Cap, au service de mon pays. Bienvenue dans ce métier fantasmé, digne des plus grands romans d'espionnage.\"",isbn:"9791032937068",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032937068-M.jpg"},
  {t:"Réussir sa déco pour être bien chez soi",a:"Noula Stella",y:"2026",ed:"Editions Jouvence",cote:"643 MAI",pub:"Adulte",sup:"Imprimé",d:"Ce livre n'est pas un guide de décoration parfaite à tout prix. Ce livre n'est pas un condensé des \"faux pas déco\" à éviter absolument. Ce livre est en revanche votre meilleur allié bien-être pour faire de votre intérieur un lieu qui vous ressemble et vous ressource. Architecte d'intérieur et décoratrice, Stella Noula partage ici tout ce qu'elle applique au quotidien dans ses projets : comprendre l'impact réel de la décoration sur notre humeur, choisir les bonnes couleurs, placer le mobilier intelligemment, jouer avec la lumière, trouver l'équilibre entre tendances et intemporalité... mais aussi apprendre à écouter ses envies, ses habitudes et son mode de vie. A travers des conseils concrets et des méthodes faciles à appliquer, ce livre vous aidera à identifier les ambiances qui vous apaisent ou au contraire vous fatiguent ; rendre une pièce plus grande sans pousser les murs ; créer des combinaisons de couleurs et matières qui fonctionnent à tous les coups ; éviter les erreurs déco les plus courantes ; bâtir un chez-vous à votre image. Plus qu'un guide déco, c'est un véritable outil de transformation personnelle, qui vous accompagnera dans la création d'un lieu où vous vous sentez vraiment bien.",isbn:"9782889840656",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889840656-M.jpg"},
  {t:"La prisonnière d'Antésalem",a:"Gazzotti Bruno",y:"2026",ed:"Rue de Sèvres",cote:"BDJ GAZ",pub:"Jeunesse",sup:"Imprimé",d:"Les Cinq ne sont pas revenus indemnes de leur expédition sur l'île au bord du monde mais ils savent désormais où Jezabel est retenue captive. Parti libérer la mystérieuse prisonnière en compagnie du Maître-Fou, Dodji découvre les ruines d'Antésalem, vestiges de la précédente guerre : éloigné de son camp, il ignore que Saul a déployé ses forces et se tient prêt à frapper. Convaincu d'oeuvrer pour le Bien, le jeune Imperator a activé de nouveaux Protecteurs et s'est doté d'une arme implacable : les Séraphins, une milice d'enfants-soldats d'une fidélité absolue, prêts à se sacrifier pour lui. Grisé par la puissance de ses pouvoirs, Saul lance une attaque sans pitié : la Nouvelle Guerre des Limbes a commencé.",isbn:"9782810206162",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782810206162-475x500-1.jpg"},
  {t:"Comment embobiner la momie",a:"Parme Fabrice",y:"2026",ed:"Rue de Sèvres",cote:"BDJ PAR",pub:"Jeunesse",sup:"Imprimé",d:"Monsieur de Rosette, le célèbre égyptologue a découvert un incroyable tombeau pharaonique. Le sarcophage va être envoyé aux Etats-Unis pour être conservé dans un musée ! Karnak, un étrange client désargenté du Grand Louxor Hotel, saisit l'occasion : ce sarcophage serait une cache idéale pour lui, l'occasion de fuir en toute discrétion sans régler sa note... Il n'y a plus qu'à se déguiser, s'allonger et remplacer la momie qui s'y trouve déjà. Mais cette dernière n'a pas dit son dernier mot... Une nouvelle enquête pour Astrid qui embarque elle aussi sur le paquebot. Une traversée qui s'annonce mouvementée !",isbn:"9782810209637",extraUrl:"https://covers.openlibrary.org/b/isbn/9782810209637-M.jpg"},
  {t:"Noah de Montréal",a:"Husar Stéphane",y:"2021",ed:"ABC melody",cote:"J 917.14 HUS",pub:"Jeunesse",sup:"Imprimé",d:"Pars à la découverte de Montréal, avec Noah, un petit Québécois de 8 ans. Il te présente sa maison, sa famille, son école, ses amis, le mont Royal, le Biodôme, les activités d'hiver, la poutine... Prêt(e) pour la visite ? Bienvenue à Montréal ! Avec la collection Viens voir ma ville, départ immédiat pour découvrir les villes du monde dès 5 ans ! De belles double-pages illustrées, des détails amusants et des textes pleins d'humour ! Sans oublier le lexique québécois de Noah pour te faire plein d'amis lors de ton prochain voyage à Montréal !",isbn:"9782368362495",extraUrl:"https://covers.openlibrary.org/b/isbn/9782368362495-M.jpg"},
  {t:"Boston et la Nouvelle Angleterre",a:"Zerdoun Catherine",y:"2026",ed:"Michelin",cote:"917.3 BOS",pub:"Adulte",sup:"Imprimé",d:"Laissez-vous guider par nos auteurs ! Au cours de leurs innombrables tournées, ils ont déniché pour vous des lieux inoubliables ou insolites : - Les incontournables (classés 1, 2 ou 3 étoiles) : Boston, Newport, Acadia National Park... - Les coups de coeur : Pousser les portes d'un palais vénitien ; S'offrir un road trip sur la Route 100 ; Voir s'ébattre les baleines au nord du Cape Cod... - Les bonnes adresses pour tous les budgets : se restaurer, prendre un verre, shopping, sortir, se loger - Les meilleurs spots en famille (activités pour les 6-14 ans) : Approcher les élans ; Prendre place à bord d'un train à crémaillère ; Revivre l'épopée des passagers du Mayflower... - Des suggestions d'itinéraires : De Boston au Cape Cod en 8 jours ; Le Vermont en 7 jours... Retrouvez également : - De nombreux cartes et plans pour retrouver les principaux sites étoilés de la destination. - Toutes les infos mises à jour dans cette nouvelle édition Ce guide est divisé en 6 micro-régions : Massachusetts ; Rhode Island ; Connecticut ; Vermont ; New Hampshire ; Maine.",isbn:"9782067271135",extraUrl:"https://covers.openlibrary.org/b/isbn/9782067271135-M.jpg"},
  {t:"Les Précurseurs",a:"Merle Loïc",y:"2026",ed:"Actes Sud",cote:"R MER",pub:"Adulte",sup:"Imprimé",d:"A l'aplomb des plateaux de Lozère, se dessine la silhouette éclatante et libre d'Augusta, qui aura passé sa vie à suivre ces chemins escarpés - ses sentiers adorés. D'elle on entrevoit des images, on la devine joyeuse, dispensant quelques conseils à son petit-fils, Loïc. Des années plus tard, Loïc cherchera des réponses auprès d'une autre augure. Entre les pages du \"Journal\" de Jean- Luc Lagarce, il emprunte les portes dérobées d'une oeuvre obsédée par l'éternel retour et les origines ; s'y reconnaît, parfois. Sans doute ce livre est-il un hommage singulier : dans une prose magnétique, Loïc Merle y brosse le portrait émerveillé d'une femme humble, qui toujours veilla sur les siens. D'un repère à l'autre - l'amour d'une grand-mère, la dévotion à l'art de l'auteur de \"Juste la fin du monde\" -, il dresse un monument à cette part du passé qui nous constitue, que l'on souhaiterait transmettre. Et que la littérature permet de rendre, à travers les années, plus vive que jamais.",isbn:"9782330216283",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216283-M.jpg"},
  {t:"L'intelligence naturelle et l'éveil de la conscience",a:"Damasio Antonio R.",y:"2026",ed:"Editions Odile Jacob",cote:"153.9 DAM",pub:"Adulte",sup:"Imprimé",d:"\"Ce livre est né d'une conviction : je crois qu'il est possible d'expliquer de manière convaincante comment la conscience est fabriquée et ce qu'elle apporte à l'humanité. Alors comment la définir ? Donnons-en une formulation rapide : la conscience est le processus biologique qui permet à chacun de faire l'expérience de sa vie individuelle. En d'autres termes, telle que je la conçois, la conscience nous permet de sentir que nous sommes en vie, que nous existons. Grâce à elle, il nous est possible de conclure que nous avons un esprit, mais aussi d'avoir l'intuition de sa nature privée, et même la conviction assez forte que nous n'avons qu'un seul esprit et non pas plusieurs. C'est incroyable, mais nous sommes parvenus à approcher, je crois, au moins une petite partie du mystère - la fabrication de la conscience - et à la résoudre\". (A. D.) Le nouveau livre d'Antonio Damasio explore les mystères de la conscience.",isbn:"9782415011499",extraUrl:"https://covers.openlibrary.org/b/isbn/9782415011499-M.jpg"},
  {t:"Je serai un homme des cavernes",a:"Mozzillo Angelo",y:"2026",ed:"L'École des loisirs",cote:"A MOZ",pub:"Jeunesse",sup:"Imprimé",d:"Devenir président, banquier ou commandant ? Non merci, quel ennui ! Alors qu'il existe depuis la nuit des temps un emploi qui permet d'être tout cracra, de manger avec ses doigts, de grogner, et de pêcher ses crottes de nez : homme des cavernes. Mais même avec la vocation, c'est une dure profession... Pour bien la pratiquer, mieux vaut commencer tout de suite à s'entraîner !",isbn:"9782211349048",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782211349048-475x500-1.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Seigaku et Saint-Rudolph s’acheminent vers la demi-finale. Durant les doubles n° 1 et n° 2, leurs équipes s’affrontent dans des face-à-face explosifs ! Un rythme à couper le souffle !!  Ôishi et Kikumaru perdent leur match alors que, de leur côté, Kaidô et Momo semblent avoir trouvé un terrain d’entente. Que nous réservent-ils ?",isbn:"9782871299356",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299356-M.jpg"},
  {t:"Point de mire !",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Le match opposant Ryôma à Fuji Yûta est sur le point d'avoir lieu. Ce dernier n'est autre que le petit frère du prodigieux Fuji Shûsuke ! Ryôma va devoir faire face à cet excellent joueur surnommé \"le tueur gaucher\" et à son twist lifté surpuissant !! Ryôma s'en sortira-t-il indemne ?!",isbn:"9782871299653",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299653-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Nous voici dans la seconde partie du championnat de Tokyo ! Seigaku a réussi un tour de force en se qualifiant pour la finale. Son futur adversaire n'est autre que la brillante équipe de Yamabuki, dont les équipes en double étaient classées au niveau national l'année précédente. Le premier match est une catastrophe. Le duo Fuji - Kawamura se fait littéralement balayer! L'équipe jouant l'autre double, constituée de la golden pair Ôishi - Kikumaru, prend le relais mais la tension est à son comble !",isbn:"9782871299905",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299905-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Afin de se mettre en jambes en vue des demi-finales du championnat de Tokyo, l’équipe de Seigaku reprend ses entraînements. Nos titulaires se mesurent les uns aux autres, chacun faisant démonstration de sa puissance de jeu. Le premier match d’entraînement oppose Ryôma à Fuji ! Notre petit génie est plus que déterminé mais leur rencontre prend une tournure très inattendue !",isbn:"9782871299806",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299806-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Le championnat de Tokyo a bel et bien commencé ! Tous les participants s'affrontent dans des matches enflammés avec pour unique objectif d'atteindre le championnat du Kantô ! Seigaku, qui jusqu'à présent enchaîne les victoires, se retrouve face au célèbre collège de Saint-Rudolph. Un nouveau challenge pour Ryoma et ses coéquipiers!",isbn:"9782871299158",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299158-M.jpg"},
