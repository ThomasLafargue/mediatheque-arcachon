  {t:"Voisines",a:"Debrocq Aliénor",y:"2025",ed:"Bayard éditions",cote:"J DEB",pub:"Jeunesse",sup:"Imprimé",d:"Qui n'a jamais rêvé d'habiter en face de sa meilleure amie ? Lou et Lila sont meilleures amies depuis toujours, tout comme leurs mères. Elles vivent de part et d'autre d'une rue tranquille de Bruxelles. Ensemble, leurs deux famille forment une grande tribu de coeur. Soirées d'été, vacances à la campagne, sorties au parc : inséparables ! Et puis un jour, tout bascule. Désormais, ce sera chacun chez soi. Lou, désemparée, veut comprendre : où sont passés les liens qu'on pensait plus forts que tout ? Un roman très actuel : l'histoire d'amitié bouleversante entre deux fillettes à l'aube de l'adolescence Une plongée très juste au coeur de l'évolution d'une enfant, de ses 9 à ses 13 ans, avec ses métamorphoses, ses émotions, ses incertitudes.",isbn:"9791036374241",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791036374241-475x500-1.jpg"},
  {t:"Déclaration des droits de la femme et de la citoyenne",a:"Gouges Olympe de",y:"2021",ed:"Flammarion",cote:"305.4 GOU",pub:"Adulte",sup:"Imprimé",d:"Parcours Ecrire et combattre pour l'égalité\". La femme naît libre et demeure égale à l'homme en droits. Les distinctions sociales ne peuvent être fondées que sur l'utilité commune\". TOUT POUR COMPRENDRE- Notes lexicales- Biographie et contexte- Genèse et genre de l'oeuvre- Pour mieux interpréterECRIRE ET COMBATTRE POUR L'EGALITE- Analyse du parcours- Groupement de textes- Histoire des idéesVERS LE BAC- Explications linéaires guidées- Sujets de dissertation et de commentaire guidés- MéthodologieANNEXE- La Déclaration de 1789 annotéeCAHIER ICONOGRAPHIQUE",isbn:"9782080253163",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080253163-M.jpg"},
  {t:"Les Petites Voleuses",a:"Renaud Claire",y:"2024",ed:"Éditions Sarbacane",cote:"J REN",pub:"Jeunesse",sup:"Imprimé",d:"Pauline, alias Popo, n'éblouit personne, à l'inverse de sa cousine Héloïse qui vit dans une banlieue très chic de Paris, fréquente un lycée bourgeois et organise des rallyes. Pauline l'admire et l'envie, et ferait tout, tout, tout pour rentrer dans ses grâces. Or, le seul truc qu'elles ont en commun, Pauline et Héloïse... c'est la kleptomanie. Incapables de s'arrêter, elles volent dans les grands magasins. Jusqu'au jour où Pauline se fait prendre (et pas Héloïse, bien sûr ! ). Plutôt que de payer l'amende, le vieux commissaire en retraite qui s'occupe de son cas lui propose alors un marché pour réparer ses torts... piéger sa cousine ! Paniquée, mais secondée par son meilleur ami, l'irrésistible Boubou, qui en pince pour elle, Pauline saura-t-elle se dépêtrer du guêpier dans lequel elle s'est fourrée ? Une comédie familiale tendre et loufoque, débordante d'amour et de malice.",isbn:"9791040805496",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040805496-475x500-1.jpg"},
  {t:"TKT",a:"Arca Fabien",y:"2026",ed:"Rouergue",cote:"J ARC",pub:"Adolescent",sup:"Imprimé",d:"Alors qu'il attend sa copie de brevet blanc, Tristan stresse, sa note va peser lourd dans son orientation. Trop mauvaise = filière professionnelle. Pas trop mauvaise = filière générale. Et alors qu'il attend, Tristan pense à Ava. Qu'est-ce qui a bien pu se passer entre eux ? Pourtant, c'était bien au début. Alors pourquoi, elle ne veut plus lui parler ? Au fond de lui, Tristan sait. Et c'est en attendant cette note, celle qui fera prendre ou pas un virage à sa vie d'ado, que les souvenirs remontent petit à petit. Ava est dans tous. C'est normal, Ava occupait toutes ses pensées. Ava occupe toujours ses pensées...",isbn:"9782812627873",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782812627873-475x500-1.jpg"},
  {t:"Mes premiers pas en origami",a:"Akass Susan",y:"2013",ed:"Les Editions de Saxe",cote:"736.98 AKA",pub:"Jeunesse",sup:"Imprimé",d:"35 modèles d'origami des plus simples (des papillons, des maisons, etc.) aux plus compliqués (des nichoirs, des poupées russes, etc.). Des smileys leur attribuent un niveau de difficulté : le niveau 1 pour les pliages les plus simples, le niveau 2 intermédiaire et le niveau 3 pour les plus difficiles (les pliages inversés).",isbn:"9782756510385",extraUrl:"https://products-images.di-static.com/image/akass-susan-mes-premiers-pas-en-origami/9782756510385-475x500-1.webp"},
  {t:"Neige",a:"Brunet Anaïs",y:"2021",ed:"Didier jeunesse",cote:"A BRU",pub:"Jeunesse",sup:"Imprimé",d:"Un album qui raconte l'attente, le ciel en coton, la légèreté des premiers flocons, les mains qui rougissent, le bonheur des luges qui glissent et des pas qui crissent, le scintillement de la glace, la neige qui fond, et les premiers bourgeons gorgés d'eau et de promesses…L'univers graphique d'Anaïs Brunet est fort, sensible et singulier. Ses peintures nous transportent au cœur d'une nature merveilleuse.",isbn:"9782278097852",extraUrl:"https://m.media-amazon.com/images/I/512ueUS5neL._SX195_.jpg"},
  {t:"Les plus grands fleuves du monde",a:"Mehnert Volker",y:"2021",ed:"Rue du Monde",cote:"551.48 MEH",pub:"Jeunesse",sup:"Imprimé",d:"Un documentaire présentant 18 des plus grands fleuves du globe et ce qui les entoure : la faune, la flore, les villes, l'économie, les hommes au cours de leur histoire et les questions écologiques. Chaque double page donne de nombreuses informations sur chacun de ces cours d'eau grâce à des vignettes. Au centre de l'ouvrage, une quadruple page détaille en particulier ce qui a trait au Nil. ©Electre 2021",isbn:"9782355046681",extraUrl:"https://www.babelio.com/couv/CVT_Les-plus-grands-fleuves-du-monde_229.jpg"},
  {t:"Napoléon",a:"Jannin Frédéric",y:"2024",ed:"Graine de Loup jeunesse",cote:"944.05 JAN",pub:"Jeunesse",sup:"Imprimé",d:"Deux siècles après la mort de Napoléon Bonaparte (1769 - 1821), que savent les enfants de son histoire'Clotilde Jannin fait revivre dans cet album quelques épisodes fameux de la légende napoléonienne. Elle sest attachée à lenfance et à la jeunesse de cet « enfant corse » que rien ne prédestinait à devenir empereur, avant de décrire quelques grands moments de sa carrière militaire sans oublier le couronnement, la campagne de Russie et lexil à Sainte-Hélène. Napoléon a gouverné la France pendant seize années. Grâce à son génie militaire, il a dominé lEurope, reconstituant lempire de Charlemagne, mille ans après lempereur à la barbe fleurie. Ces conquêtes auront été faites au prix de la vie de dix millions de soldats et son orgueil ambitieux aura été la cause de sa chute. Mais son souvenir est encore présent dans nos lois, le baccalauréat, la Légion dHonneur... Le petit officier corse adoré par ses soldats, détesté par les uns, admiré par les autres, a pris sa place dans lHistoire de France. AUTEURS Mère de famille passionnée par lHistoire, habitant à Cherbourg, auteur de plusieurs biographies pour la jeunesse (Éd. Edilys), Clotilde Jannin a choisi de raconter, dans un style direct, très vivant et riche en dialogues, quelques épisodes parmi les plus significatifs de la vie de Napoléon Bonaparte. Formé aux Arts Appliqués de Lyon, longtemps directeur artistique dans la publicité, féru dhistoire, de littérature et de bande dessinée, Cyril Flautat vit avec sa famille au coeur des montagnes de Savoie. Il a déjà publié trois livres en tant quauteur et illustrateur : William Adams le samouraï des mers (Éd. du Jasmin) ; Au temps des samouraïs (Éd. Fleurus) ; Les Ténèbres de lInquisition (Éd. Elisa), tous fondés sur lhistoire. Conjuguant savoir-faire classique et savoir-faire digital, il a créé des illustrations aussi documentées quénergiques.",isbn:"9782487568013",extraUrl:"https://products-images.di-static.com/image/base/9782487568013-475x500-1.jpg"},
  {t:"Arnaque à Central Park",a:"Payet Jean-Michel",y:"2016",ed:"Milan",cote:"J PAY",pub:"Jeunesse",sup:"Imprimé",d:"Prénom : Scarlett. Signe distinctif : détective en herbe. Particularité son chat, Watson, l'aide dans ses enquêtes... Petit détail : le plus malin des deux n'est pas celui qu'on croit !  En voyage à New York, Scarlett achète une petite souris en origami sur un stand de Central Park. Voilà qui fera un joli souvenir pour Watson, resté de l'autre côté de l'Atlantique. Mais la souris en papier disparait et Scarlett se rend compte qu'elle avait bien plus de valeur qu'il n'y paraît...",isbn:"9782745976758",extraUrl:"https://products-images.di-static.com/image/base/9782745976758-475x500-1.jpg"},
  {t:"Le chantier",a:"Hédelin Pascale",y:"2017",ed:"Milan",cote:"624 HED",pub:"Jeunesse",sup:"Imprimé",d:"Cette collection documentaire pour les petits développe des encyclopédies complètes, accessibles et modernes. Elle se veut une référence d'images, tant pour les parents et leurs enfants que pour les enseignants.",isbn:"9782745980946",extraUrl:"https://products-images.di-static.com/image/base/9782745980946-475x500-1.jpg"},
  {t:"Les solitudes de Petite Rivière",a:"Ramphul Kalindi",y:"2026",ed:"Jean-Claude Lattès",cote:"R RAM",pub:"Adulte",sup:"Imprimé",d:"En quittant son Andalousie natale, Soledad, romancière taciturne, croyait avoir laissé derrière elle l'essentiel : le souvenir de sa mère Sheela, cantatrice baroque, et... sa malédiction. Elle aspire désormais à la tranquilité à l'Ile Maurice. Jusqu'à ce que l'un de ses lecteurs, le jeune Sanjay, la supplie de lui raconter son histoire. Sa véritable histoire. Alors Soledad se confie : son enfance au bazar de Petite Rivière, la passion tempétueuse de ses parents, les airs de Puccini, ses soeurs tyranniques... A mesure du récit, une autre histoire se révèle - plus intime, plus secrète aussi. Des toits en taule de Petite Rivière aux plus beaux théâtres sévillans, Kalindi Ramphul vous embarque dans une fresque vibrante où l'art et le désir traversent le temps et les océans. Un roman virevoltant sur les héritages silencieux et les mots comme refuge contre l'oubli. \" Entre les théâtres sévillans et les lagons mauriciens, Kalindi Ramphul offre un troisième roman vibrant sur l'héritage et le désir, explorant avec une grande sensibilité la manière dont l'art nous sauve de l'oubli\". L'éclaireur Fnac \" Chaque livre de Kalindi Ramphul relie des territoires rarement associés, comme pour explorer de nouvelles trajectoires de vie. Une manière de partager son évidente curiosité tout en ouvrant ses lecteur-ices à l'aventure. \" Marie Claire \" Avec ce troisième roman, Kalindi Ramphul confirme son talent et nous propose une histoire qui nous entraîne dans le temps (tout commence dans les années 1980) et l'espace (l'intrigue se déroule entre l'Espagne et l'île Maurice). \" ELLE \" Si le ton de Kalindi Ramphul est moins burlesque que dans ses deux précédents livres, sa fantaisie doucement désenchantée n'a rien à envier à celle d'Olivier Bourdeaut dans \"En attendant Bojangles\" . Pour nous raconter ce qu'est une famille, elle convoque des lumières, des odeurs, des musiques, des étoffes, des rires aux larmes et des peines immenses. Sheela, la soprano qui se prenait pour Madame Butterfly, continuera long temps de chanter dans nos mémoires. \" ELLE",isbn:"9782709677424",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709677424-M.jpg"},
  {t:"L'Aube des dragons",a:"Mancusi Mari",y:"2026",ed:"Saxo",cote:"J MAN",pub:"Adolescent",sup:"Imprimé",d:"Les dragons arrivent. Etes-vous prêts ? Le monde extérieur est devenu dangereux. Des incendies ravagent les terres et rendent l'air quasiment irrespirable. Comme tous les habitants de sa ville, Lucas est donc forcé de passer la majorité de son temps à la maison. Son ami Noah est persuadé que des dragons sont à l'origine des feux, mais Lucas a du mal à y voir plus que des théories du complot... Pourtant, quand la famille de Noah quitte précipitamment la région et que de mystérieux agents débarquent pour fouiller leur maison, Lucas commence à se demander si son ami n'approchait pas de trop près de la vérité. Décidé à connaître le fond de l'histoire, le jeune garçon fait alors une découverte qui menace de tout embraser...",isbn:"9782385701659",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701659-475x500-1.jpg"},
  {t:"Venise",a:"Plisson Philip",y:"2016",ed:"La Martinière",cote:"914.5 VEN",pub:"Adulte",sup:"Imprimé",d:"Fondée au Ve siècle, la ville insulaire devenue cinq siècles plus tard une grande puissance maritime, s'étend sur plus de 118 îlots et compte près de 400 ponts. Navigant à bord de son petit bateau dans l'enchevêtrement des canaux de Venise, Philip Plisson, dont le statut de résident vénitien lui ouvre les portes les plus secrètes de la ville, se consacre depuis près de trois années à cet ouvrage. C'est un rêve nourri de longue date : naviguer sur les canaux aux mille-et-une légendes, marcher, de jour comme de nuit, se perdre, se retrouver dans ce double labyrinthe de terre et d'eau, d'ombre et de lumière où s'agitent des silhouettes. Se promener, sans jamais mettre le pied à terre et explorer les lieux souvent secrets où Venise garde la mémoire d'anciens hôtes prestigieux. Témoin privilégié de la vie des habitants de Venise, Philip Plisson a embarqué au petit matin avec les livreurs, les remorqueurs, avec les pilotes du port, ou sur le plus gros porte-conteneur qui, régulièrement, décharge au terminal industriel. De jour comme de nuit, il est monté à bord des navettes de la police, des pompiers ou des ambulanciers. Ses photographies révèlent la Sérénissime comme un décor de théâtre posé à fleur d'eau.",isbn:"9782732480237",extraUrl:"https://covers.openlibrary.org/b/isbn/9782732480237-M.jpg"},
  {t:"Un an ailleurs",a:"Ducos Max",y:"2026",ed:"Éditions Sarbacane",cote:"A DUC",pub:"Jeunesse",sup:"Imprimé",d:"As-tu déjà imaginé t'installer avec tes parents une année entière dans une maison et un pays inconnus ? C'était le rêve du peintre Max Ducos, qui t'emmène, le temps de ce livre, dans les bagages de sa propre famille, au fond d'une vallée secrète à deux heures de New York. Les saisons défilent, la maison se pare pour les fêtes puis se couvre de neige, les filles de Max s'élancent au-dehors, d'élégants petits animaux s'approchent ... Au fil des pages, partage les surprises, les émotions, les jeux, les rencontres, les découvertes - en un mot, la joie ressentie tout au long de cette année exceptionnelle. Une expérience qui changera la vie des deux fillettes. La tienne aussi, peut-être ?",isbn:"9791040808497",extraUrl:"https://covers.openlibrary.org/b/isbn/9791040808497-M.jpg"},
  {t:"Le Voyage de mille lieues",a:"Bloom Léonie",y:"2026",ed:"HarperCollins",cote:"R BLO",pub:"Adulte",sup:"Imprimé",d:"Deux femmes. Deux époques. Une traversée pour devenir soi-même. Paris, de nos jours. A vingt-six ans, Colombe a l'impression d'avoir raté sa vie. Fleuriste accablée par un manque de confiance chronique, elle étouffe dans un quotidien qui ne lui ressemble pas. Lorsqu'elle perd son emploi, l'urgence de fuir devient vitale, et elle rejoint la terre brute du cap Sizun, en Bretagne. Là-bas, à la \"ferme des Rêveurs\", elle espère trouver un nouveau sens à son existence, loin des attentes maternelles et des jugements de la société. Un siècle plus tôt, sur cette même côte bretonne, une autre vie se joue. Yvonne, sardinière au caractère bien trempé, use sa santé dans les usines de poisson pour un salaire de misère. Femme de convictions, elle s'engage corps et âme dans les grèves historiques des Penn Sardin, prête à tout pour offrir un avenir meilleur à sa fille. De la lutte ouvrière des Années folles à la résistance de 1940, une lignée de femmes indomptables se dessine en filigrane du parcours de Colombe. Porté par une écriture lumineuse et profondément humaine, Le Voyage de mille lieues mêle avec justesse quête de soi et saga familiale historique. \"Avec une plume délicate, Léonie Bloom parvient à lier les histoires et les générations pour créer un roman que l'on a du mal à refermer\". Le Bonbon A propos de l'autrice Léonie Bloom vit à Donges, en Loire-Atlantique. Elle a rencontré un vrai succès avec Le Petit Vieux qui a fait le tour du monde (3 fois), son précédent roman autoédité.",isbn:"9791033925019",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033925019-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Yona poursuit sa lecture du journal de Yon-hi, la mère de Soo-won. Elle découvre que Yu-hon a exécuté les prêtres qui avaient découvert que sa femme descendait du roi Hiryû. Neuf ans plus tard, Yon-hi, qui a donné naissance à son fils quelques années auparavant, fait la connaissance d'une femme qui s'avère être Kashi, prêtresse rescapée du meurtre perpétré par son mari…",isbn:"9782811666385",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811666385-M.jpg"},
  {t:"Gamba",a:"Tavert Macian Sophie",y:"2024",ed:"Belfond",cote:"R TAV",pub:"Adulte",sup:"Imprimé",d:"\"C'est fou, quand elle y pense. Elle a dix-sept ans et la seule chose qu'elle désire, c'est la gym.\". Elle, c'est Maélys, une athlète de haut niveau qui a quitté sa famille, son club et son île, pour s'entraîner dans un pôle d'élite en vue des prochains Jeux olympiques. Et gamba, c'est son mantra. Le cri de soutien des supporters français à leurs gymnastes, en compétition, lorsqu'elles s'élancent sur les agrès, poutre, sol, barres, saut. Un petit mot que Maëlys se répète à chaque obstacle. Gymner en prenant des risques, gamba. Garder la confiance de son entraîneur Max, gamba. S'imposer le silence, gamba. Tout envoyer bouler, tenir le coup, défier la gravité, gamba. Continuer à rêver, gamba ! Un premier roman en immersion dans les coulisses d'un sport extrême, au plus près des pulsations de Maëlys et de ses coéquipières.",isbn:"9782714403988",extraUrl:"https://covers.openlibrary.org/b/isbn/9782714403988-M.jpg"},
  {t:"De Gaulle, une vie",a:"Barré Jean-Luc",y:"2025",ed:"Grasset & Fasquelle",cote:"B GAU",pub:"Adulte",sup:"Imprimé",d:"Après la libération de Paris en août 1944, \"l'homme de personne\" est devenu \"le premier des Français\". Ce deuxième volume couvre les années les plus méconnues de la destinée de Charles de Gaulle jusqu'à sa reprise du pouvoir en juin 1958. A partir d'archives inédites - celles en particulier du fonds de Gaulle que l'auteur a été le premier à explorer - il renouvelle la connaissance de cette période au fil d'une dramaturgie où l'analyse psychologique du personnage principal se mêle aux péripéties politiques qui ont émaillé ce parcours tumultueux. Dans son action gouvernementale, de Gaulle alterne à une vitesse accélérée restauration de l'Etat et révolution sociale et économique. Il mène de front offensive diplomatique pour rétablit le rang de la France et tentatives de réforme d'un système colonial menacé de tous côtés. Confronté à l'hostilité des partis dont il ne cesse de dénoncer la malfaisance, il met un terme à ses fonctions en janvier 1946. S'ouvre alors la longue parenthèse d'une \"traversée du désert\" qui fut surtout, pour le fondateur du RPF, une façon de préparer son retour au pouvoir. On saisit ici dans toute sa complexité, au plus près d'une intimité jalonnée de drames personnels - la mort de sa fille Anne en 1948 - et de difficultés de santé, un homme partagé entre rage, exaltation et mélancolie. L'auteur éclaire d'un jour nouveau des épisodes sur lesquels on croyait tout savoir : les procès de l'épuration, la tragédie de Sétif en 1945, l'affrontement avec le parti communiste et le MRP, le fonctionnement interne du RPF, et l'implication du général dans les événements de mai 1958, entre sédition militaire et \"processus régulier\" pour reprendre la direction de la France. Son combat pour des institutions solides et pérennes, son refus de s'enfermer dans des limites idéologiques de droite ou de gauche, et sa conception d'une Europe affranchie de toute tutelle étrangère illustrent sa dimension de visionnaire : autant de leçons à méditer pour aujourd'hui...",isbn:"9782246834199",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246834199-M.jpg"},
  {t:"Le secret du Viking King",a:"Fromental Jean-Luc",y:"2025",ed:"Hélium",cote:"BDJ FRO",pub:"Jeunesse",sup:"Imprimé",d:"Elle mène ses enquêtes à patte de velours, mais quand elle sort ses griffes, ça déchire... Le Polp'z, milk-bar préféré de Miss Chat, est fermé. Ole, le barman, a disparu. Sur la piste de son ami, la détective croise le chemin de Big Ø, le chef du gang des Six Poulpes de la rue Treize qu'elle a envoyé en prison au début de sa carrière. La voici immergée en compagnie de la pétulante Griselda, archiviste au quotidien Dag Tablet, dans une sombre affaire d'archéologie sous-marine. Quel secret historique dort dans la mystérieuse épave du Viking King ? Pour le savoir, il va falloir plonger. Chat échaudé craint l'eau froide, mais chez notre féline, la curiosité l'emporte toujours sur l'effroi.",isbn:"9782330209735",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330209735-475x500-1.jpg"},
  {t:"La fille du chaos",a:"O'Donnell Cassandra",y:"2025",ed:"Flammarion",cote:"J ODO",pub:"Jeunesse",sup:"Imprimé",d:"Depuis l'arrivée d'agents du Ministère au collège des Enfants Spéciaux, des élèves disparaissent mystérieusement. Lorsque ces hommes inquiétants commencent à s'intéresser à ses pouvoirs, Emma n'a plus qu'une solution pour protéger sa magie : la fuite. Mais Hell, son ténébreux protecteur, disparaît à son tour, et son courage vacille. Seule l'union des créatures surnaturelles de l'école pourrait désormais contrer le Ministère...",isbn:"9782080496850",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080496850-475x500-1.jpg"},
  {t:"Au pot, Hippo !",a:"Antony Steve",y:"2026",ed:"Circonflexe",cote:"A ANT",pub:"Jeunesse",sup:"Imprimé",d:"Suivez Hippo, un petit hippopotame qui n'a pas vraiment envie d'aller sur le pot[xe2][x80][xa6] une histoire pour accompagner les enfants dans l'apprentissage de la propreté",isbn:"9782378625573",extraUrl:"https://products-images.di-static.com/image/base/9782378625573-475x500-1.jpg"},
  {t:"Les âmes folles",a:"Dalban-Moreynas Géraldine",y:"2026",ed:"Flammarion",cote:"R DAL",pub:"Adulte",sup:"Imprimé",d:"\"Elle le voit tout de suite en descendant les marches en pierre du perron de l'hôtel. Elle ne peut pas ne pas le voir, on ne voit que lui. Ils sont pourtant une dizaine assis autour de la table, mais on ne voit que lui. Il se retourne, comme s'il avait senti son regard, sourit. Bonjour, vous vous asseyez avec nous ? Sans très bien savoir pourquoi, elle répond oui\". Où s'arrête l'amour ? Où commence l'emprise ?",isbn:"9782080511072",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080511072-M.jpg"},
  {t:"Les pouvoirs extraordinares du drainage lymphatique",a:"Nado Elisabeth",y:"2026",ed:"Solar",cote:"615.822 NAD",pub:"Adulte",sup:"Imprimé",d:"Grâce à des protocoles ciblés, transformez durablement votre silhouette et améliorez votre bien-être ! Elisabeth Nado, créatrice de la méthode Nado et du programme d'auto-drainage Boost'Lymph, mais aussi masseuse de célébrités depuis presque trente ans, dévoile ses protocoles exclusifs. Grâce à des technique douces et précises mais d'une grande simplicité de réalisation, ils permettent d'obtenir des effets spectaculaires et multidimensionnels : dégonflement rapide, silhouette affinée (une taille de pantalon perdue en quelques jours pour de nombreuses femmes), regain d'énergie et sensation de légèreté profonde. Que vous souhaitiez aplanir votre ventre, galber vos jambes ou redessiner l'ovale de votre visage, atténuer les signes visibles de la ménopause, libérer vos émotions ou gagner en confort pendant la grossesse, vous trouverez dans ce guide des pas-à-pas illustrés qui vous permettront d'adapter votre action et d'obtenir des résultats visibles, avec seulement 5 à 12 minutes de pratique quotidienne.",isbn:"9782263194092",extraUrl:"https://covers.openlibrary.org/b/isbn/9782263194092-M.jpg"},
  {t:"L'hypnotiseur",a:"Kepler Lars",y:"2026",ed:"Actes Sud",cote:"R KEP",pub:"Adulte",sup:"Imprimé",d:"Erik Maria Bark, psychiatre spécialisé dans le traitement des traumas aigus, a longtemps été l'un des rares véritables experts de l'hypnose médicale. Jusqu'au jour où une séance d'hypnose profonde a très mal tourné. Dix ans plus tard, l'inspecteur Joona Linna le réveille en pleine nuit : Josef, un adolescent, a assisté au massacre de sa famille. Le seul moyen d'interroger le garçon, inconscient et en état de choc, est de pénétrer son subconscient par l'hypnose pour tenter de revoir le carnage à travers ses yeux. Ils sont encore loin de se douter du spectacle horrifique qui les attend... Rythme effréné, richesse et complexité des personnages, écriture au cordeau : un roman policier d'une intelligence redoutable doublé d'un thriller terrifiant.",isbn:"9782330220150",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330220150-M.jpg"},
  {t:"Un homme raisonnable",a:"Couturier Hélène",y:"2026",ed:"Rivages",cote:"R COU",pub:"Adulte",sup:"Imprimé",d:"Qu'a fait Orso Orsini à son fils adoré pour que celui-ci parte travailler dans la lointaine Afrique ? Et que s'est-il passé avec sa femme, la spécialiste du peintre Joaquim Sorolla, pour que celle-ci prenne pour amant un Cubain d'une rare beauté ? Anéanti par la douleur et salement déprimé, Orso n'a plus qu'une envie : approcher l'amant et entendre sa voix. Mais le jeu de piste pour homme trompé s'arrête brutalement avec le décès de l'amant. Accident ou meurtre ? Entre alors en scène la capitaine Blandine Bianco qui ressemble davantage à une avocate d'affaires de l'Ouest parisien qu'à une officière de police à la Crime.",isbn:"9782743669188",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743669188-M.jpg"},
  {t:"Whalefall",a:"Kraus Daniel",y:"2026",ed:"Rivages",cote:"R KRA",pub:"Adulte",sup:"Imprimé",d:"Jay Gardiner s'est lancé dans une quête insensée : retrouver la dépouille de son père disparu dans l’océan Pacifique, au large de Monastery Beach. La seule façon, pour lui, de se libérer du poids de la culpabilité. La plongée commence bien, mais l'apparition d'un calmar géant le met en danger, danger aggravé par l'arrivée d'un cachalot. Soudain, Jay est entraîné dans l’estomac de la bête. Il lui reste une heure avant que ses bouteilles ne se vident, une heure pour vaincre ses démons et s'échapper du ventre du cachalot. « Kraus apporte la rigueur d'un scientifique et la sensibilité d'un poète à ses descriptions du monde sous-marin. » The New York Times « Absolument remarquable. Whalefall est, tout simplement, un roman magnifique. » Gillian Flynn « Des choses plus étranges que d'être avalé par une baleine se sont probablement produites, mais elles ont rarement été racontées aussi bien. » Stephen Graham Jones",isbn:"9782743669195",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743669195-M.jpg"},
  {t:"Le Huit",a:"Neville Katherine",y:"2025",ed:"Pocket",cote:"R NEV",pub:"Adulte",sup:"Imprimé",d:"De la Révolution française au XXe siècle, la lutte pour la possession d'un jeu d'échecs aux inquiétants pouvoirs... Provence, 1790. Un \" printemps sanglant \" s'est abattu sur l'abbaye de Montglane. Les cerisiers en fleur, surpris par le gel, nappent le pays de prophétiques taches rouges. La rumeur gronde, les biens de l'Eglise seront bientôt confisqués. Talleyrand, le \" diable boiteux \", convoiterait même les trésors de Montglane. Alertée, la mère supérieure disperse les pièces d'un mystérieux jeu d'échecs, cadeau des Maures au roi Charlemagne... New York, 1972. Approchée par un étrange antiquaire, Catherine Velis se lance sur la piste du légendaire échiquier. De Catherine de Russie à Marat, de Robespierre à Napoléon, elle n'est pas la première. Mais les pièces l'ont choisie : elle sera leur reine noire. \" Un roman époustouflant. \" Le Figaro Magazine Fresque monumentale doublée d'un puzzle diabolique, ce livre est devenu, depuis sa première parution en 1988, un classique du thriller historique, peut-être le sommet du genre.",isbn:"9782266353984",extraUrl:"https://covers.openlibrary.org/b/isbn/9782266353984-M.jpg"},
  {t:"Prédateurs de la nuit",a:"Gründ Maria",y:"2026",ed:"R. Laffont",cote:"R GRU",pub:"Adulte",sup:"Imprimé",d:"\" MON NOM, C'EST SANNA BERLING. ON PEUT PARLER ICI, OU VOUS PREFEREZ AILLEURS ? \" Un thriller psychologique redoutable par la reine du suspense suédois. Suède, Mars 1986. Un brouillard glacial recouvre les lacs d'Augu. Deux ans plus tôt, à cet endroit précis, les restes d'une adolescente ont été retrouvés dans deux valises blanches. Depuis le meurtrier est derrière les barreaux. C'est du moins ce que croient les habitants des environs. Lorsque Sanna Berling, policière tout juste diplômée, apprend qu'une autre fille du village a disparu, elle décide de mener l'enquête et découvre des incohérences dans le dossier. Plus elle s'enfonce dans ce dédale de mensonges et de secrets, plus elle est déterminée à faire éclater la vérité. \" DE LA PROFONDEUR, UNE CONSTRUCTION IRREPROCHABLE ET UNE TENSION CROISSANTE : TOUT Y EST. \" Annaïk Kerneuzet, Librairie Dialogues, Brest",isbn:"9782221281185",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221281185-M.jpg"},
  {t:"Maman (Oie)  Ours n'aime pas l'hive",a:"Higgins Ryan T.",y:"2026",ed:"Albin Michel",cote:"A HIG",pub:"Jeunesse",sup:"Imprimé",d:"Les souris sont prêtes pour leurs activités hivernales préférées : ski, luge, patinage et fabrication de bonshommes de neige. Malheureusement, Michel a un rhume et sa famille ne veut pas le laisser tout à seul à la maison. Si Michel ne peut pas jouer dans la neige, alors celle-ci viendra à lui... et les bêtises des souris, aussi !",isbn:"9782226507969",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226507969-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"À la veille d'une bataille qui opposera le pays de Kôka au Kai du sud, Yona se prépare à rejoindre le front. De leur côté, Hak et Yeon traversent la province de Kin à la recherche de la milleplantes. Mais Geun-tae ayant été sérieusement blessé, Hak prend la tête des troupes affaiblies et se retrouve en première ligne pour repousser l'ennemi…",isbn:"9782811673512",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811673512-M.jpg"},
  {t:"La promesse de Tyratops",a:"Paré-Sorel Julien",y:"2025",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeunesse",sup:"Imprimé",d:"L'heure est grave. Alors que Patchy est toujours sous l'emprise d'Ovi la sorcière et que la menace du retour des Titans se fait sentir, Rex s'est fait capturer par les sbires de Tyratops ! Il tentera d'infiltrer le repaire du sorcier maléfique afin de l'arrêter. Pendant ce temps, d'anciens alliés uniront leurs forces pour sauver les enfants du royaume de Mézoïk. Cependant, Tyratops a plus d'un tour dans son sac et sa patience tire à sa fin... Rex sera-t-il assez fort pour affronter les démons du passé ?",isbn:"9782897518806",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518806-475x500-1.jpg"},
  {t:"Maman pour toujours",a:"Lorenzoni Chiara",y:"2026",ed:"Éditions Sarbacane",cote:"A LOR",pub:"Jeunesse",sup:"Imprimé",d:"\" Olivo habite avec son papa. Il y a lui et son papa et puis voilà. \" Comme un doux poème, voici l'histoire d'un enfant dont la maman n'est plus là. Cela le met en colère et ses jambes donnent des coups de pied et cassent des choses. Heureusement, il y a les câlins surprises, qui eux, sont restés. Ils ont même augmenté. Un jour, son papa l'invite à couper du bois\". Un mot triste, un bout de bois, un mot colère, un autre bout de bois. \" Jusqu'à épuiser le tas du jardin - et tous les mots tristes ou colères. Puis ils se rendent auprès du grand chêne, et cette fois, c'est le papa qui va épuiser son chagrin en construisant une cabane dans les hautes branches. D'où Olivo comprendra que sa maman est avec eux - pour toujours...",isbn:"9791040807742",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791040807742-475x500-1.jpg"},
  {t:"Kilomètre zéro",a:"Ankaoua Maud",y:"2017",ed:"Eyrolles",cote:"R ANK",pub:"Adulte",sup:"Imprimé",d:"Et vous, jusqu'où irez-vous pour sauver une amie ? Maëlle, directrice financière d'une start-up en pleine expansion, vit le rythme effréné de ses journées ; sa vie se résume au travail, au luxe et à sa salle de sport. Ses rêves... quels rêves ? Cette vie bien rodée ne lui en laisse pas la place ; jusqu'au jour où sa meilleures amie, Romane, lui demande un immense service. Question de vie ou de mort. Maëlle sceptique, accepte la mission malgré elle. Elle rejoint le Népal, où l'ascension des Annapurnas sera un véritable parcours initiatique. Quand la jeune femme prend conscience que la réalité n'est peut-être pas celle que l'on a toujours voulu lui faire croire... c'est sa propre quête qui commence. C'est au cours d'expériences et de rencontres bouleversantes que Maëlle va apprendre les secrets du bonheur profond et transformer sa vie. Mais réussira-t-elle à sauver son amie ? \" Vous devez trouver à l'intérieur de vous-même l'endroit où rien n'est impossible\" Deepak Chopra Passionnée par les relations humaines, Maud Ankaoua signe un premier roman riche d'enseignements et rempli d'espoir. Il changera pour toujours notre compréhension des autres et nous rappelle l'essentiel de la vie.",isbn:"9782212567434",extraUrl:"https://covers.openlibrary.org/b/isbn/9782212567434-M.jpg"},
  {t:"Pourquôôââ ?",a:"Voutch",y:"2026",ed:"Thierry Magnier",cote:"A VOU",pub:"Jeunesse",sup:"Imprimé",d:"Les enfants grenouilles sont comme les autres : ils sont curieux. Et quand vient l'heure de dormir, leur curiosité s'aiguise d'autant plus. Les parents grenouilles se retrouvent alors face à une avalanche de \"Pourquôôôâââ ? \" qui semblent intarissables. Sauront-ils y répondre sans perdre leur sang-froid ? !",isbn:"9791035209285",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209285-475x500-1.jpg"},
  {t:"Le déni",a:"Perlant Hélène",y:"2026",ed:"Michel Lafon",cote:"364 PER",pub:"Adulte",sup:"Imprimé",d:"\" Il y a quelque chose de vraiment très puissant et très intelligent qui traverse tout ce livre. \" - Sonia Devilliers, La Grande Matinale de France Inter \" Bouleversant. \" - Juliette Hochberg, Marie-Claire BRISER LE SILENCE, COMPRENDRE LE DENI : LE LIVRE-EVENEMENT D'HELENE PERLANT \"Le geste déplacé s'est déroulé au milieu d'une assistance nombreuse, une fête de famille, une sortie de groupe. Ou devant les gens que vous aimez, qui sont censés vous aimer aussi, enfin, vous croyiez. Et là, rien. Un coup de Jarnac. C'est l'incrédulité, qui s'étend, se redouble, se retourne contre elle-même\". Bétharram n'a pas seulement révélé des violences. Il a mis au jour un mécanisme : l'impossibilité de dire non. Dans Le Déni, Hélène Perlant analyse la manière dont des dispositifs de perversion s'installent et se maintiennent, non par ignorance ou par mensonge, mais par des formes de survie, de honte sociale et de détournement du regard. La violence peut alors se déployer à ciel ouvert tout en devenant impensable. En interrogeant la confusion persistante entre absence de réaction et consentement, ce livre démonte un système collectif et donne des outils pour penser ce qui, trop longtemps, a empêché de vivre.",isbn:"9782749963365",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749963365-M.jpg"},
  {t:"L'art de disparaître",a:"Stepanova Maria",y:"2026",ed:"Stock",cote:"R STE",pub:"Adulte",sup:"Imprimé",d:"M. est écrivaine. Quelques années plus tôt, son pays a déclaré la guerre à l'un de ses voisins. Désormais en exil, elle s'applique à recréer un nouveau chez-soi, tout en se sentant peu à peu coupée de sa langue : celle qu'elle a parlée toute sa vie, dans laquelle elle a écrit ses livres, celle dont elle tente, aujourd'hui, de se détacher. Alors qu'elle se trouve dans un train en partance pour un festival littéraire à l'étranger, une grève perturbe le programme. Le voyage s'achève dans un village perdu où M. ne connaît personne et son téléphone portable est déchargé. Et si, comme par magie, elle disparaissait ? L'Art de disparaître est un grand roman sur l'exil, la perte de repères et le réenchantement du quotidien par l'écriture.",isbn:"9782234097674",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234097674-M.jpg"},
  {t:"Ecume d'hiver",a:"Muis Anne-Solange",y:"2026",ed:"Phébus",cote:"R MUI",pub:"Adulte",sup:"Imprimé",d:"Dans le village de Miquelon, l'hiver a tout effacé et l'horizon n'existe plus. C'est ici que sont nés Michel et Jean, deux frères qui vivent de la pêche traditionnelle à la morue. Mais un soir de grand froid, Jean disparaît. Son sort va alors sceller le destin de son fils Yoann, contraint à revenir sur l'île qu'il avait quittée enfant. Se heurtant à un quotidien où la nature guide tout, cet homme devra renouer avec la terre qui l'a vu naître et, qui sait, avec son passé. A travers des chapitres composés comme des tableaux, Anne-Solange Muis plonge le lecteur dans les paysages et les légendes de Miquelon-Langlade, à Saint-Pierre-et-Miquelon, ce bout de France perdu aux confins de l'Atlantique Nord. Et bâtit, avec une langue d'une infinie sobriété, le décor immense d'une vibrante histoire de transmission.",isbn:"9782752915108",extraUrl:"https://covers.openlibrary.org/b/isbn/9782752915108-M.jpg"},
  {t:"Hercule Poirot",a:"Eckartsberg Benjamin von",y:"2017",ed:"Paquet",cote:"BD ECK",pub:"Adulte",sup:"Imprimé",d:"Hercule Poirot est à Istanbul où il compte faire un peu de tourisme. Mais un télégramme lui demande de rentrer de toute urgence. Il doit prendre alors un billet pour l'Orient-Express en direction de Londres. Il reconnaît son ami M. Bouc, directeur de la ligne, qui va aussi en direction de Londres. Dans le train, M. Ratchett, un riche Américain, est tué au milieu de la nuit. Examinant le corps avec l'aide du docteur Constantine, il constate qu'il a été tué de douze coups de couteau. Poirot, en collaboration avec M. Bouc et le docteur Constantine, interroge les passagers du train et découvre un grand nombre d'informations complémentaires. Mais le mystère s'épaissit, tout comme la neige autour du train immobilisé au milieu de nulle part.",isbn:"9782888908760",extraUrl:"https://covers.openlibrary.org/b/isbn/9782888908760-M.jpg"},
  {t:"L'arbre de la gentillesse",a:"Teckentrup Britta",y:"2019",ed:"Quatre Fleuves",cote:"A TEC",pub:"Jeunesse",sup:"Imprimé",d:"Un album poétique et profond pour faire réfléchir petits et grands sur les bienfaits de l’attention aux autres et les conséquences de la méchanceté.Avec un texte rimé et des découpes simples qui représentent habilement la complexité des sentiments. En amitié, un mot blessant crée parfois une fissure qui ne fait que grandir... Mais que se passe-t-il lorsque l’on sème la gentillesse et la bienveillance ? Grâce à de belles illustrations imprégnées de symbolisme et des découpes astucieuses, Britta Teckentrup met en regard les comportements égoïstes qui créent des fossés obscurs entre les personnes, et la magie de mots doux ou de gestes tendres qui illuminent nos journées, effacent nos peines et font naître l’affection. Pour célébrer les valeurs de l’amitié et instaurer un dialogue parents-enfants.",isbn:"9791026402718",extraUrl:"https://www.babelio.com/couv/CVT_LARBRE-DE-LA-GENTILLESSE_9130.jpg"},
  {t:"Un chat, deux chats, trop de chats...",a:"Emmet Jonathan",y:"2026",ed:"Glénat Jeunesse",cote:"A HOD",pub:"Jeunesse",sup:"Imprimé",d:"Des chats se sont faufilés sous les volets et les pop-ups de ce livre animé. Combien sont-ils ? Tu donnes ta langue aux chats ? A toi de les retrouver et de les compter ! Un livre plein de surprises, tout en poils et en couleurs !",isbn:"9791026405283",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791026405283-475x500-1.jpg"},
  {t:"Rendez-vous à Bagdad",a:"Brrémaud Frédéric",y:"2024",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Victoria Jones est une jeune anglaise pleine de vie, pas très heureuse dans son travail, mais toujours disposée à aller de l'avant. Sur un coup de tête, elle a décidé de partir à Bagdad, rejoindre un jeune homme à peine croisé dans un parc de Londres. Mais son arrivée en Irak coïncide avec d'étranges événements... Le début de folles aventures pour notre héroïne, qui n'imagine pas que sa présence met en jeu le sort du monde !",isbn:"9782889323999",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889323999-M.jpg"},
  {t:"Rendez-vous à Bagdad",a:"Brémaud Frédéric",y:"2023",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Victoria Jones est une jeune anglaise pleine de vie, pas très heureuse dans son travail, mais toujours disposée à aller de l'avant. Sur un coup de tête, elle décide de partir à Bagdad, rejoindre un jeune homme à peine croisé dans un parc de Londres. Mais son arrivée en Irak va coïncider avec d'étranges événements... Le début de folles aventures pour notre héroïne, qui n'imagine pas que sa présence va mettre en jeu le sort du monde !",isbn:"9782889323722",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889323722-M.jpg"},
  {t:"Le pitou",a:"Escoffier Michaël",y:"2025",ed:"Frimousse",cote:"A ESC",pub:"Jeunesse",sup:"Imprimé",d:"Zais perdu mon pitou ! Un petit manchot est seul sur la banquise. Il a perdu son \" pitou \". Il rencontre un ours blanc ronchon. \" Tu as vu mon pitou ? \" demande le petit manchot. L'ours l'envoie loin en lui afrmant que son pitou est caché \" là bas \". Il part donc... loin... seul... sur la banquise ostile. Qui se retrouve par le plus grand des hasards sur son chemin ? Le Père Noël en personne ! Celui-ci vient d'avoir un accident de traineau... Il a heurté un drôle de personnage... Le petit manchot lui explique : \" zai perdu mon pitou \" . Le Père Noêl se met immédiatement à la recherche d'un pitou... Il doit bien y avoir ça parmi tous les cadeaux du traîneau. Mais un hurlement devance l'ours blanc, visiblement poursuivi par un monstre terrifiant... \" Mon Pitou ! \" s'exclame le petit manchot. Ouf ! doudou retrouvé.",isbn:"9782383496205",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496205-475x500-1.jpg"},
  {t:"Je n'aurai plus peur",a:"Rea Simone",y:"2026",ed:"La Partie",cote:"A REA",pub:"Jeunesse",sup:"Imprimé",d:"Un album sensible et profond sur la violence, la guerre et la résilience. Dans le calme de la nuit, une mère et son fils commencent une conversation difficile. L'enfant hésite à raconter une scène de violence dont il a été témoin à l'école. Il en saisit d'autant plus la gravité qu'il a fui un pays en guerre. Les souvenirs de ce passé traumatique se superposent au présent, et la frontière entre les événements se brouille pour mieux mettre en lumière les mécanismes de la peur. Grâce à l'écoute et l'amour de sa mère, il trouve le courage d'agir. Décidé à en parler à l'école le lendemain, l'enfant s'endort apaisé.",isbn:"9782494591417",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494591417-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Privée de contacts avec Hak et les quatre dragons, Yona demande une entrevue avec Soo-won mais on la lui refuse. Si bien qu'un soir, elle quitte sa chambre discrètement pour rejoindre Soo-won dans son bureau. Mais une fois face à lui, Yona peine à trouver les mots. De leur côté, les dragons sont réquisitionnés pour un entraînement militaire…Également inclus dans ce volume, un court épisode bonus sur l'enfance de Hak !",isbn:"9782811663674",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811663674-M.jpg"},
  {t:"Israël-Palestine, une guerre sans limites ?",a:"Boniface Pascal",y:"2026",ed:"Eyrolles",cote:"956.94 BON",pub:"Adulte",sup:"Imprimé",d:"Cet ouvrage permet de comprendre la genèse et les perspectives du conflit israélo-palestinien. Mêlant approches historique et géopolitique, il décrit avec précision les événements marquants qui ont embrasé le territoire depuis la Seconde Guerre mondiale, les différentes tentatives de paix avortées ainsi que l'engrenage des affrontements, jusqu'aux attentats terroristes du 7 octobre 2023 et leurs conséquences géostratégiques dans les années qui ont suivi. Ce livre dresse un panorama des enjeux globaux d'une guerre dont on ne connaît pas les limites, mais à même de bouleverser les équilibres mondiaux. Cette nouvelle édition a été entièrement actualisée.",isbn:"9782416024436",extraUrl:"https://covers.openlibrary.org/b/isbn/9782416024436-M.jpg"},
  {t:"Pourquoi avons-nous peur ?",a:"Bohler Sébastien",y:"2026",ed:"Plon",cote:"152.4 BOH",pub:"Adulte",sup:"Imprimé",d:"Un essai de vulgarisation accessible et brillant s'appuyant sur les neurosciences pour décrypter point par point les mécanismes de la peur Il y a 7 millions d'années, nos gènes ont muté à un rythme 1 000 fois supérieur à celui des autres espèces. Grâce à notre faculté d'adaptation et d'anticipation, nous sommes peu à peu devenus l'espèce la plus intelligente, mais aussi la plus craintive du règne animal. Aujourd'hui, 60% des 18-35 ans disent souffrir d'éco-anxiété et 1 personne sur 10 est concernée par des phobies maladives. La peur est la plus ancestrale de nos émotions. Elle existe chez tous les vertébrés depuis la nuit des temps. Une glande, nommée amygdale, en déclenche l'activité. Face à l'imminence d'un danger, l'amygdale, tel un signal de détection, lance l'alerte. Face à cette peur, le corps s'immobilise, fuit ou entre en lutte. Ainsi en est-il pour tous les vertébrés, espèce humaine comprise, qui, grâce à ce comportement de défiance, a pu assurer sa survie. Le problème est que, si nous avons domestiqué de grandes peurs - depuis la peur d'un troupeau de mammouths jusqu'à la peur de la foudre - d'autres sont apparues aujourd'hui. Peur de déclassement, peur d'un conflit planétaire, peur climatique. L'ère contemporaine a réactivé la peur. Pourquoi ? En nous éloignant du vivre-ensemble, nous cultivons un individualisme sans repères. Livré à lui-même, l'individu combat ses peurs par des projections fantastiques et des comportements addictifs, deux traits caractéristiques de notre modernité. Il est possible de reprendre le contrôle sur nos peurs en nous évertuant à mieux exercer notre faculté de raisonner, en cherchant à donner plus d'ambition à nos projets collectifs et en reconnectant nos corps à la nature et aux autres.",isbn:"9782259322638",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259322638-M.jpg"},
  {t:"1776",a:"Van Ruymbeke Bertrand",y:"2026",ed:"Coédition Tallandier/Ministère des armées",cote:"973 VAN",pub:"Adulte",sup:"Imprimé",d:"Le 4 juillet 1776, treize colonies d'Amérique du Nord se proclament indépendantes de la Grande-Bretagne, donnant naissance à une nation nouvelle : un événement destiné à bouleverser l'équilibre du monde. Ce moment fondateur est le fruit d'une série de choix politiques et stratégiques décidés de part et d'autre de l'Atlantique : les délégués du Congrès continental à Philadelphie, pris entre l'enthousiasme de leur lutte et les risques encourus face à une Angleterre toute puissante ; le Parlement, les ministres et le roi George III à Londres, intransigeants face à ce qu'ils perçoivent comme une rébellion et, à Versailles, le ministre des Affaires étrangères, Vergennes, et Louis XVI, impatients de prendre leur revanche sur l'amère défaite de la guerre de Sept Ans. Des enjeux considérables sont au coeur des débats : l'indépendance de treize colonies qui quittent le plus grand empire de l'époque, devenant une ligue de républiques indépendantes et, pour la France, l'entrée dans une guerre totale contre la Grande-Bretagne. Ce livre retrace pas à pas l'enchaînement de ces étapes, de la Boston Tea Party, le début de la révolte américaine en décembre 1773, à l'arrivée de Benjamin Franklin en France en décembre 1776. Il éclaire tout particulièrement les sept mois cruciaux, de janvier à juillet 1776, qui mènent à la naissance des Etats-Unis.",isbn:"9791021049499",extraUrl:"https://covers.openlibrary.org/b/isbn/9791021049499-M.jpg"},
  {t:"Avoir le courage de vieillir",a:"Kishimi Ichiro",y:"2026",ed:"Guy Trédaniel Editions",cote:"158.1 KIS",pub:"Adulte",sup:"Imprimé",d:"Par Ichiro Kishimi, l'auteur des best-sellers mondiaux Avoir le courage de ne pas être aimé et Avoir le courage d'être heureux. POURQUOI AVOIR PEUR DE VIEILLIR ? Dans une société qui valorise la jeunesse, vieillir est souvent perçu comme un déclin. Nous redoutons la perte de nos capacités, la maladie, la solitude ou l'impression de devenir inutile. Mais faut-il vraiment envisager la vieillesse de cette manière ? Après les best-sellers mondiaux Avoir le courage de ne pas être aimé et Avoir le courage d'être heureux, inspirés de la psychologie d'Alfred Adler, Ichiro Kishimi nous invite à réfléchir à l'une des grandes questions de notre époque : comment vivre sereinement les années qui viennent. En s'appuyant sur la philosophie, la littérature et l'expérience personnelle de l'auteur, ce livre, accessible et profond, propose une autre manière de regarder l'avenir. Vieillir ne signifie pas seulement perdre quelque chose. C'est aussi l'occasion de se libérer des attentes de la société, de redécouvrir ce qui compte vraiment et d'habiter pleinement le présent. Un essai lumineux qui invite à voir la vieillesse non comme un déclin, mais comme un moment de liberté, de lucidité et de sens.",isbn:"9782813236364",extraUrl:"https://covers.openlibrary.org/b/isbn/9782813236364-M.jpg"},
  {t:"J'en fais toute une histoire",a:"Ephron Nora",y:"2026",ed:"Editions de l'Olivier",cote:"814.54 EPH",pub:"Adulte",sup:"Imprimé",d:"\"Ce que je regrette de ne pas avoir su : Bloquez tout le monde sur votre messagerie instantanée. Les quatre dernières années de psychanalyse sont une dépense inutile. L'avion ne va pas s'écraser. Tout ce qui vous déplaît dans votre corps à l'âge de trente-cinq ans, vous le regretterez à l'âge de quarante-cinq. Si la chaussure ne vous va pas dans le magasin de chaussures, elle ne vous ira jamais. Quand vos enfants sont adolescents, il est important d'avoir un chien pour que quelqu'un dans la maison soit content de vous voir.\" J'en fais toute une histoire peut se lire comme un manuel de survie dans le monde moderne ou un one-woman show sur la \"condition féminine\". Tout y passe : l'amour, le divorce, l'argent, les enfants, la chirurgie esthétique... Nora Ephron s'empare de chaque sujet avec ironie, sans jamais oublier d'être tendre.",isbn:"9782823624007",extraUrl:"https://covers.openlibrary.org/b/isbn/9782823624007-M.jpg"},
  {t:"La sage-femme de Norolani",a:"Cau Bibbiana",y:"2026",ed:"Charleston",cote:"CAU",pub:"Adulte",sup:"Imprimé",d:"Sardaigne, 1917. Pour échapper à un mariage arrangé, Mallena trouve refuge avec l'amour de sa vie à Norolani. Dans ce village où le mistral porte le souffle de la mer, elle devient vite un pilier. En tant que llevadora, elle aide les femmes à accoucher grâce à un savoir ancestral transmis par sa mère et sa grand-mère. Elle ne demande rien en retour, si ce n'est quelques tranches de fromage ou de pain. Mais tout change lorsque son mari revient du front, blessé dans son corps et dans son âme. Pour payer ses soins, Mallena presse le maire de la rémunérer pour son travail. Hélas cette compensation lui est refusée, et en conformité avec un nouveau décret royal, une sage-femme diplômée est engagée. Alors que Mallena craint d'être remplacée, les fantômes du passé ne tardent pas à la rattraper... A travers le destin inoubliable d'une sage-femme sarde au début du xxe siècle, Bibbiana Cau nous offre une histoire extraordinaire de courage et de solidarité féminine. \"UNE BELLE HISTOIRE DE LUTTE ET DE REDEMPTION\". Vanity Fair Bibbiana Cau est née et vit en Sardaigne. Elle a été sagefemme pendant de longues années au cours desquelles elle a eu le privilège d'assister à d'innombrables naissances. Passionnée par les livres depuis toujours, elle a suivi des ateliers d'écriture. La Sage-femme de Norolani, son premier roman, a été immédiatement n? 1 des ventes en Italie. Traduit de l'italien par Liliane Guillard",isbn:"9782385295158",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295158-M.jpg"},
  {t:"Emmie, petite souris de génie",a:"Crosby-Fairall Marjorie",y:"2026",ed:"Editions Gründ",cote:"A CRO",pub:"Jeunesse",sup:"Imprimé",d:"Emmie, la petite souris, avait de grandes idées. Grâce à ses inventions astucieuses, tout fonctionnait à merveille. Jusqu'au jour où un énorme problème apparut...",isbn:"9782324038945",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782324038945-475x500-1.jpg"},
  {t:"L'inondation",a:"Modéré Armelle",y:"2026",ed:"Actes Sud",cote:"A MOD",pub:"Jeunesse",sup:"Imprimé",d:"Un soir d'orage, alors que la pluie ne cesse de tomber, la rivière déborde. La maison de Léa, enfouie dans un terrier, est submergée. Désemparée, elle fuit avec sa famille en quête d'un refuge. Mais quand tout semble désespéré, il reste toujours une lueur d'espoir.",isbn:"9782330215453",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330215453-475x500-1.jpg"},
  {t:"Le pollen du Monte Urticando",a:"Franquin André",y:"2022",ed:"Dupuis",cote:"BDJ YAN",pub:"Jeunesse",sup:"Imprimé",d:"Les cactus Comilt millénaires de la vallée Monte Urticando, fleurissent tous les quinze ans. Cela est le signe que les petits marsupilamis doivent se rendent dans cette vallée pour apprendre à se débrouiller tout seul. Et même s'ils doivent y rencontrer un adversaire tenace, Gatogordo le jaguar...",isbn:"9791034766307",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791034766307-475x500-1.jpg"},
  {t:"Max décide de faire des efforts",a:"Saint Mars Dominique de",y:"2009",ed:"Calligram",cote:"BDJ SAI",pub:"Jeunesse",sup:"Imprimé",d:"Max se surpasse pour faire de la planche à voile. Il décide d'appliquer la même méthode à l'école... Avec ses copains, il crée un club d'entraide. Mais il en fait trop, il se prive de tout ! Va-t-il tenir le coup ? Ou craquer ? Ce livre de Max et Lili parle de la difficulté de faire des efforts, ou comment s'obliger à faire ce qu'on n'aime pas, à résister aux tentations, ne pas se décourager et arriver à se concentrer. Il faut aussi savoir se relaxer et chasser les soucis de sa tête pour garder toute son énergie et avoir le plaisir et la fierté d'arriver à ce qu'on veut ! La persévérance, c'est une baguette magique pour être bon en sport, en musique, à l'école... !",isbn:"9782884805315",extraUrl:"https://covers.openlibrary.org/b/isbn/9782884805315-M.jpg"},
  {t:"Le Champ des méduses",a:"Oltvanji Oto",y:"2026",ed:"Agullo",cote:"R OLT",pub:"Adulte",sup:"Imprimé",d:"\" C'est comme c ? a qu'un sceptique est devenu le Sceptique. \" Dans le Belgrade des années 2020, Le Sceptique, ancien journaliste devenu détective et grand amateur de vinyles, se lance dans une enquête à la demande d'un ancien camarade slovène de l'armée populaire yougoslave, Ales. Celui-ci lui demande de retrouver Marijana son épouse, disparue dix ans plus tôt après un mystérieux séjour à Belgrade. L'enquête du Sceptique le mène de Belgrade à Rovinj en Istrie, le Saint-Tropez croate, qui fut le théâtre d'un drame survenu trente ans auparavant. Il s'agit de la disparition de Bisera, la mère de Marijana, lors d'un séjour dans une villa au coeur du cercle fermé de familles influentes et dépravées. Peu à peu, les masques tombent : le groupe de vacanciers est lié par un pacte de silence mêlant libertinage, argent et pouvoir. Se dévoile alors le portrait d'une élite corrompue et complice, prête à tout pour protéger ses secrets. Ce qui semblait être une banale affaire de disparition se transforme rapidement en une plongée vertigineuse dans l'histoire trouble de l'ex-Yougoslavie. Entre jeux de pouvoir, secrets familiaux et crimes non résolus...",isbn:"9782382461433",extraUrl:"https://covers.openlibrary.org/b/isbn/9782382461433-M.jpg"},
  {t:"Islande",a:"",y:"2022",ed:"Lonely Planet",cote:"914.912 ISL",pub:"Adulte",sup:"Imprimé",d:"Pour vivre la destination au plus près Un guide Lonely Planet pour s'imprégner de la culture, de l'art de vivre et des paysages grandioses de l'Islande et vivre une expérience immersive du pays. Regarder, marcher, écouter, sentir, goûter, un guide qui fait appel à tous les sens pour vivre intensément son séjour. Des pages introductives thématiques pour aborder le pays sous tous les angles : histoire et sagas, sources d'eau chaude, gastronomie, volcans et glaciers, sites perdus... Les régions islandaises à ne pas manquer (Reykjavík, le Cercle d'Or, la péninsule de Reykjanes, Vestmannaeyjar (îles Vestmann), les fjords de l'Ouest, etc.) traitées sous forme d'activités, de promenades et de visites incontournables ou insolites. Des cartes des principales régions et des clés pour construire son trajet en un clin d'œil. De nombreuses propositions d'activités nature et de plein air (plongée dans le parc national de Þingvellir, paddle dans la vallée du Hvítá, approche d'un volcan sur la péninsule de Reykjanes, découverte des macareux sur les îles Vestmann, baignade dans des sources d'eau chaude... partout !) pour s'évader et s'émerveiller dans des paysages grandioses. Et toujours : des informations pratiques pour préparer son séjour et ses visites. Une carte détachable du pays avec les incontournable par région et des propositions d'itinéraires.LA COLLECTION \" DECOUVERTES ET EXPERIENCES \" Un guide construit autour d'expériences pour sortir des sentiers battus, découvrir les sites incontournables de manière originale, changer sa manière de voyager : apprendre à cuisiner, s'initier aux savoir-faire locaux, emprunter les chemins de traverse en compagnie d'habitants, assister à une démonstration d'artisans, etc. Pour chaque région, des expériences pour une immersion dans la nature et les paysages grandioses : randonner sur les plus beaux sentiers, pagayer sur des eaux sauvages, parcourir les plus belles routes en van ou à vélo, plonger dans des sources chaudes ou des vagues...",isbn:"9782816195842",extraUrl:"https://covers.openlibrary.org/b/isbn/9782816195842-M.jpg"},
  {t:"Est-ce que vous êtes prêts ?",a:"Ma Daishu",y:"2026",ed:"minedition",cote:"A MA",pub:"Jeunesse",sup:"Imprimé",d:"La petite souris organise une fête. Est-ce que tout le monde sera prêt ? Une histoire qui se jour dans la pénombre et se termine dans la lumière de la fête.",isbn:"9782354137861",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137861-475x500-1.jpg"},
  {t:"Les pieds de Papa",a:"Jadoul Emile",y:"2026",ed:"L'École des loisirs",cote:"A JAD",pub:"Jeunesse",sup:"Imprimé",d:"Mes deux petits pieds sur le grand pied de Papa, je suis prêt pour l'aventure ! Tagada, tagada, grands pieds cheval ! A l'eau, grands pieds bateau ! On rentre à la maison, grands pieds avion ! Et quand Papa n'est pas là, les grandes bottes, c'est pour moi !",isbn:"9782211349949",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782211349949-475x500-1.jpg"},
  {t:"Les Invisibles",a:"Ellory Roger Jon",y:"2026",ed:"Sonatine",cote:"R ELL",pub:"Adulte",sup:"Imprimé",d:"Il est partout. Et il est nulle part. Exactement comme le diable. \" 1975, Syracuse, Etat de New York. Rachel Hoff man, nouvelle recrue de la police locale, est appelée sur sa première scène de crime : une institutrice vient d'être assassinée. A côté du corps, un étrange message tiré de La Divine Comédie de Dante. Peu après, une deuxième victime est découverte. C'est le début d'une série d'homicides à laquelle Rachel va être intimement mêlée, nouant une relation très particulière avec le mystérieux assassin. Cinq ans plus tard, alors que l'affaire semble close, une nouvelle vague d'assassinats frappe New York, étonnamment similaires à ceux de Syracuse. Rachel, qui s'apprête à rejoindre l'unité d'analyse comportementale du FBI, ignore encore qu'il lui faudra plus d'une décennie, avec nombre d'autres meurtres à la clé, pour peut-être résoudre cette enquête très personnelle qui, peu à peu, va virer à l'obsession, à la paranoïa, et la mener aux confins de la folie. Dans cette traque obsédante qui, année après année, dévore l'existence de son héroïne, R. J. Ellory nous entraîne dans un voyage au bout de l'enfer, digne de Seul le silence et d'Une saison pour les ombres. On y retrouve sa puissance romanesque, son humanité vibrante, son sens inégalé du suspense : tout ce qui consacre, encore et toujours, le maître incontesté du thriller.",isbn:"9782383992691",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383992691-M.jpg"},
  {t:"Drôles d'expressions sur... les émotions",a:"Mialon Estelle",y:"2026",ed:"Grenouille éditions",cote:"A MIA",pub:"Jeunesse",sup:"Imprimé",d:"En voilà de drôles d'expressions ! En douceur ou en couleurs, nos émotions sont une grande source d'inspiration pour notre imagination. Douze comptines illustrées pour découvrir le monde poétique et imagé des expressions... et des émotions !",isbn:"9782384862856",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782384862856-475x500-1.jpg"},
  {t:"Parfois, je suis triste",a:"Bowles Paula",y:"2026",ed:"Chantecler",cote:"A BOW",pub:"Jeunesse",sup:"Imprimé",d:"Votre enfant est parfois triste. Il veut rester dans son coin et n'a pas envie de jouer. C'est tout à fait normal et cela fait partie de son développement. Ce livre aidera votre enfant à reconnaître la tristesse, à la comprendre et à mieux la gérer. La petite histoire lui montrera comment retrouver le sourire d'une manière simple.",isbn:"9782803465002",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782803465002-475x500-1.jpg"},
  {t:"Ouvre la bouche en grand !",a:"Ma Daishu",y:"2026",ed:"minedition",cote:"A MA",pub:"Jeunesse",sup:"Imprimé",d:"\"Ouvre la bouche, dit Jade. Et fais \"Ahhh...\"\" Un livre qui va donner à tous les enfants l'envie de se brosser les dents.",isbn:"9782354137854",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137854-475x500-1.jpg"},
  {t:"Une bonne épouse",a:"Desjours Ingrid",y:"2026",ed:"HarperCollins",cote:"R DES",pub:"Adulte",sup:"Imprimé",d:"Alice a trente ans, Paris pour décor et le coeur en morceaux depuis qu'on lui a enlevé la garde de sa fille. Jusqu'au jour où une publicité attire son regard : une retraite dans un lieu enchanteur en pleine montagne, présentée comme une promesse de renouveau. C'est cher, un peu fou... mais que pourrait-elle perdre de plus ? Au fil des jours, Alice se découvre, se reconstruit. Lors d'une soirée dans un bar local, elle rencontre Marcel : charmeur, mystérieux et convaincant. Il l'invite à s'installer dans un village coupé du monde à deux pas de là, un havre de paix où d'autres couples filent déjà le parfait amour : la Fosse aux anges. Séduite et pleine d'espoir, Alice accepte. Mais le vernis idyllique ne va pas mettre longtemps à se craqueler : les femmes qui vivent ici sont-elles aussi heureuses qu'elles le paraissent ? Car, après tout, un cauchemar n'est qu'un rêve qui a mal tourné, n'est-ce pas ?",isbn:"9791033922711",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033922711-M.jpg"},
  {t:"Chérie",a:"Coste Sophie",y:"2026",ed:"Editions Mazarine",cote:"R COS",pub:"Adulte",sup:"Imprimé",d:"Cinq femmes. Une manipulation sans limite. Claire, Maud, Sophie, Esther et Nour. Toutes ont cru à des promesses. Toutes ont été trahies. Entre Genève, Paris et Londres, ces femmes vont glisser en silence dans une relation toxique. Jusqu'au jour où la vérité éclate. Mais au fond... qui manipule qui ? Dans ce roman saisissant, Sophie Coste explore avec une précision chirurgicale les mécanismes invisibles de la domination perverse sentimentale. Postface de la psychothérapeute Anne-Clotilde Ziegler.",isbn:"9782213734118",extraUrl:"https://covers.openlibrary.org/b/isbn/9782213734118-M.jpg"},
  {t:"La pêche au chalut",a:"Castillo Laure",y:"2026",ed:"HarperCollins",cote:"R CAS",pub:"Adulte",sup:"Imprimé",d:"\"Lorsque le kiné a massé mon bras, le mois dernier, j'ai réalisé que c'était la première main d'homme à toucher mon corps depuis des années. La sensation était agréable, la pensée l'était moins. Je m'étonne toujours d'en voir certaines se jeter sur les sites de rencontres à peine débarrassées de leur compagnon, au lieu de danser toutes nues en hurlant : \"Bon débarras, bon débarras ! \" Mais aujourd'huij'ai envie de revivre une histoire avec un homme. Avant le départ de ma fille, l'idée me trottait déjà dans la tête. Le meilleur moyen d'y parvenir est de m'inscrire sur un site, malgré ma réticence idiote - à l'inverse de mon pragmatisme habituel. C'est évident. Mieux, c'est statistique\". Céline pensait avoir apprivoisé le vide et s'était convaincue que solitude pouvait rimer avec sérénité. A cinquante-trois ans, alors que sa fille s'apprête à quitter le nid, elle se demande : et si un nouveau chapitre, plus audacieux, commençait ? Céline plonge alors dans l'univers des rencontres en ligne, entre rires, doutes et échanges improbables. De Lyon à Paris, de textos maladroits en rendez-vous inattendus, elle explore les méandres du désir moderne et ses propres cicatrices tout en interrogeant son regard sur les hommes. Et, qui sait, la rencontre attend peut-être Céline là où elle l'imagine le moins ? Inspiré de l'expérience personnelle de l'autrice sur les applis de rencontres, La Pêche au chalut mêle humour et introspection. Roman acide, comédie de moeurs rythmée : qu'il est réjouissant de suivre Céline et ses déconvenues ! \"Un délicieux roman\". Télépro \"Une lecture réjouissante dont on ne fait qu'une bouchée\". La Librairie des thés, Surgère A propos de l'autrice Laure Castillo est formatrice et, dans une autre vie, autrice de romans. Elle vit entre Lyon et Paris.",isbn:"9791033926849",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033926849-M.jpg"},
  {t:"La notaire",a:"Glowacki Ingrid",y:"2026",ed:"Albin Michel",cote:"R GLO",pub:"Adulte",sup:"Imprimé",d:"Glowacki maîtrise tant l'art du suspense qu'elle relève son défi haut la main. Version Fémina Perspicace, hypersensible, un brin décalée, Anna, notaire, sait d'expérience qu'héritage rime souvent avec carnage. Les héritiers qui font appel à ses services ignorent en revanche qu'au-delà des clauses testamentaires, Anna perce leurs secrets, tous leurs secrets... Un vieux château au fin fond du Morvan, un intendant sinistre, une comtesse privée de droits et, bientôt, un meurtre : Ingrid Glowacki abat ses cartes. A vous de jouer. Ingrid Glowacki a exercé le métier de notaire. Elle s'est largement inspirée de son expérience pour écrire ce roman.",isbn:"9782226510112",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226510112-M.jpg"},
  {t:"Irène de Byzance, l'iconophile",a:"Corbeyran",y:"2026",ed:"Delcourt",cote:"BD COB",pub:"Adulte",sup:"Imprimé",d:"Au VIIIe siècle, l'Empire byzantin vacille, déchiré par des querelles religieuses et miné par les complots. Orphelin à deux ans, Irène élevée par son oncle Constantin dans la foi iconophile. Mariée à 16 ans à Léon, fut empereur de Constantinople, elle devient impératrice dans une cour en pleine tourmente. Déterminée à restaurer le culte des icônes, elle s'oppose à son mari et prend les rênes du pouvoir. Audacieuse et stratège, elle est la première femme régner seule sur Byzance. Entre intrigues de palais, réformes politique alliances diplomatiques, Irène s'efforce de préserver l'unité de son empire tout en consolidant sa place sur le trône.",isbn:"9782413042129",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413042129-M.jpg"},
  {t:"Le renard roux",a:"Bauduret Sylvain",y:"2025",ed:"Editions de la Gouttière",cote:"BDJ BAU",pub:"Jeunesse",sup:"Imprimé",d:"Un renardeau et sa maman partent en recherche de nourriture... Mais lorsque la renarde se retrouve coincée dans un piège, le petit désormais seul n'a d'autre choix que d'apprendre à chasser par lui-même ! Tiens, il semble y avoir quelque chose d'intéressant du côté de ce potager...",isbn:"9782357961258",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357961258-M.jpg"},
  {t:"Moi, Anaïs Berg",a:"McEvoy Diane",y:"2026",ed:"City Editions",cote:"R MCE",pub:"Adulte",sup:"Imprimé",d:"Anaïs Berg est une petite amie attentionnée, une voisine souriante et une professeure respectée. Elle mène à Liverpool une vie tranquille. Un jour, dans une foule, elle aperçoit une silhouette qui fait douloureusement écho à un passé bien enfoui. Sans doute du surmenage. Puis elle a la sensation d'être suivie. Elle se raisonne, mais sort de moins en moins de chez elle. Sa maison. Son cocon. Où ses vêtements changent de place. Où une playlist se lance toute seule. Cherche-t-on à la rendre folle ? Mais quand les menaces se font directes, Anaïs comprend : quelqu'un sait, et le piège est en train de se refermer doucement sur elle.",isbn:"9782824625249",extraUrl:"https://covers.openlibrary.org/b/isbn/9782824625249-M.jpg"},
  {t:"Vous êtes comme ma fille",a:"Bourgeat Cécile",y:"2026",ed:"R. Laffont",cote:"R BOU",pub:"Adulte",sup:"Imprimé",d:"Comment reconstruire sa vie après un drame ? Alice, 25 ans, a l'avenir devant elle. Alors qu'elle est en mission pour une ONG, tout bascule un soir sur une route. Une enfant traverse. Un choc. Plus rien ne sera jamais comme avant. Arrachée à ses certitudes, Alice affronte l'insoutenable, mais aussi la douleur de la famille, la sienne, et la réaction inattendue d'un père qui va changer le cours de sa vie. De retour en France, hantée par l'accident, étrangère à elle-même, elle doit apprendre à accepter son destin. Avec un style qui exprime l'urgence de dire l'indicible, ce premier roman raconte la bascule toujours possible de l'existence. Cécile Bourgeat nous livre avec poésie et pudeur le parcours d'une femme entre culpabilité et pardon.",isbn:"9782221282212",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221282212-M.jpg"},
  {t:"La voie du tablier",a:"Oono Kousuke",y:"2026",ed:"Kana",cote:"BD VOI",pub:"Jeunesse",sup:"Imprimé",d:"Ne sous-estimez jamais un homme au foyer ! Tatsu doit accompagner son beau-père chez le vétérinaire pour faire vacciner son chien. Mais ce canidé a un drôle de défaut : il se met à trembler de tout son corps rien qu'en entendant les mots \"vaccin\", \"piqûres\" et \"piquer\"... Avec tous ces \"adversaires\" qui se succèdent, même le plus coriace des hommes au foyer en bave ! Voici le seizième volume de ce manga comique, qui raconte la vie d'un ancien yakuza à la maison !",isbn:"9782505144038",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505144038-M.jpg"},
  {t:"Cochon caché !",a:"Aaron Huw",y:"2026",ed:"Gallimard",cote:"A AAR",pub:"Jeunesse",sup:"Imprimé",d:"L'histoire hilarante d'une héroïne qui ne fait rien comme tout le monde et qui aimerait bien qu'on l'accepte comme elle est ! Mimi a un secret : elle est un cochon ! Aucun des singes avec qui elle vit dans la jungle ne s'en est aperçu. Sauf Raymond, leur chef, qui a des soupçons...",isbn:"9782075237819",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075237819-475x500-1.jpg"},
  {t:"NON ! dit lapin",a:"Henrichs Marjoke",y:"2026",ed:"Nathan",cote:"A HEN",pub:"Jeunesse",sup:"Imprimé",d:"Lapin n'a pas envie d'écouter sa maman. Non, non, non ! proteste-t-il. Maman et Lapin trouveront-ils quelque chose qu'ils aiment faire tous les deux ?",isbn:"9782095057275",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782095057275-475x500-1.jpg"},
  {t:"Le grand livre jeu du merveilleux",a:"Subi",y:"2026",ed:"La Martinière",cote:"LJ SUB",pub:"Jeunesse",sup:"Imprimé",d:"TROIS JEUX DANS UN SEUL LIVRE ! Assemblée de dragons, forêt enchantée, troupeau de licornes, monstres mythologiques, cité engloutie, congrès de sorcières... embarquez pour un merveilleux voyage à la découverte des créatures magiques ! Un cherche et trouve fantastique avec trois niveaux de difficulté pour jouer en famille, enrichi par deux pages documentaires pour tout savoir sur ces créatures merveilleuses qui peuplent notre imaginaire collectif. Un cherche et trouve palpitant avec trois niveaux de difficulté, pour jouer avec toute la famille.",isbn:"9791040125426",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040125426-475x500-1.jpg"},
  {t:"Une autre étoile que la mienne",a:"Corinne Javelaud",y:"2026",ed:"Calmann-Lévy",cote:"R JAV",pub:"Adulte",sup:"Imprimé",d:"Antiquaire passionnée, Gabie Herlane croit n'avoir affaire qu'à une banale transaction lorsqu'un expert en joaillerie lui présente une parure de bijoux somptueuse. Pourtant, sous l'éclat des pierres, affleure un scandale ancien : en 1906, à Crozant, sa grand-mère Pulchérie, ouvrière en tapisserie, fut accusée à tort de leur vol'une injustice qui brisa sa vie à jamais. Entre la clarté des ateliers d'Aubusson de la Belle Époque et la poussière des archives contemporaines, Gabie tisse le fil d'une histoire où mensonges et malédictions ancestrales s'entrelacent. Qui a vraiment volé les bijoux de Vania Eckmer'Pourquoi cette injustice n'a-t-elle jamais été réparée'Des paysages impressionnistes de la Creuse aux salons feutrés de Milan, des ravages de la Grande Guerre aux luttes ouvrières, Gabie exhume peu à peu une vérité troublante où l'art, l'amour et le pouvoir s'entremêlent. Une quête obsédante pour laver l'honneur des siens et briser enfin les chaînes du passé",isbn:"9782702195284",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702195284-M.jpg"},
  {t:"Le Grozours arrive !",a:"Allepuz Anuska",y:"2026",ed:"Albin Michel",cote:"A ALL",pub:"Jeunesse",sup:"Imprimé",d:"Au coeur de la forêt vivent quatre oursons tout fous et tout mignons. Alors qu'ils se préparent à aller se coucher, ils entendent un bruit. Ils tendent l'oreille, lèvent la truffe et ouvrent grand les yeux... Qui va là ? C'EST LE GROZOURS !",isbn:"9782226507105",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226507105-475x500-1.jpg"},
  {t:"Bienvenue au Coccinelle hôtel !",a:"Han Ra Kyoung",y:"2025",ed:"La Martinière",cote:"A KYO",pub:"Jeunesse",sup:"Imprimé",d:"L'hiver approche dans la forêt et l'effervescence règne à l'hôtel tenu par Dada et sa famille de coccinelles. Le petit MooMoo trépigne d'impatience : les prestigieux clients vont bientôt arriver ! Mais sa déception est grande quand il découvre que les célébrités attendues ne sont que des larves, des nymphes et des'ufs... Patience MooMoo, le printemps te réservera bien des surprises ! Bien plus qu'un simple album jeunesse, ce livre a des vertus documentaires. À travers les aventures de personnages irrésistibles, il ouvre une fenêtre sur le monde des insectes. Les jeunes lecteurs dès 4 ans découvriront l'univers méconnu des hôtels à insectes, ces havres de paix essentiels à la biodiversité, tout en suivant les métamorphoses surprenantes des coccinelles, trichies fasciées, capricornes et mantes religieuses. Pour prolonger plaisir, à la fin du livre, l'enfant trouvera deux doubles pages documentaires lui fournissant des informations sur les espèces d'insectes présentées dans le livre et leur cycle de vie, ainsi que des conseils pour fabriquer soi-même son hôtel à insectes",isbn:"9791040123378",extraUrl:"https://covers.openlibrary.org/b/isbn/9791040123378-M.jpg"},
  {t:"Twisted-Wonderland - La Maison Savanaclaw",a:"Oda Suzuka",y:"2025",ed:"Nobi Nobi",cote:"BD TWI",pub:"Jeunesse",sup:"Imprimé",d:"Le territoire sauvage de Savanaclaw vous ouvre ses portes. Soyez prêts ! Transportée à Twisted Wonderland, Yuka Hirasaka parcourt ce monde extraordinaire bien malgré elle. Alors qu'un grand tournoi magique se prépare, d'étranges événements semblent agiter les élèves de l'Académie Night Raven... Les griffes du dortoir Savanaclaw seraient-elles les plus dangereuses de Twisted Wonderland ? Après la maison Heartslabyul, inspirée de l'univers d'Alice au pays des merveilles, découvrez une relecture fascinante et fantastique du monde du Roi Lion avec la maison Savanaclaw !",isbn:"9782384963225",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963225-M.jpg"},
  {t:"Le foulard",a:"Grant Hardie",y:"2025",ed:"Editions Place des Victoires",cote:"746.92 VAN",pub:"Adulte",sup:"Imprimé",d:"Transformez votre foulard en véritable atout mode ! Un indispensable pour accessoiriser vos tenues avec style et originalité. Le foulard, cet accessoire intemporel, se réinvente à l'infini ! Grâce à ce petit guide pratique, découvrez plus de 30 manières de le porter autour du cou, en ceinture, dans les cheveux ou même comme top. Des pas-à-pas simples, des illustrations élégantes et des idées modernes pour sublimer tous vos looks avec style. Un incontournable du dressing féminin !",isbn:"9782809905496",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809905496-M.jpg"},
  {t:"Mer belle à forte au large",a:"Saragosse Marie-Christine",y:"2026",ed:"Calmann-Lévy",cote:"R SAR",pub:"Adulte",sup:"Imprimé",d:"\" Je me souviens en tout cas que c'était épuisant de t'aimer autant. \" Mer belle à forte au large, c'est la météo marine d'une vie. Celle d'une femme née sur une rive de la Méditerranée, en Algérie, et qui a ensuite passé l'essentiel de son existence juste en face, à Cannes, la ville des stars. Indifférente aux convenances ou au regard d'autrui, cette institutrice issue d'une famille piémontaise refuse de se plier aux carcans patriarcaux de son époque, leur opposant sa beauté et sa liberté. Mer belle à forte au large, c'est aussi une histoire de transmission, le portrait d'une mère par sa fille, les instants partagés et l'amour qui les liait. Un récit qui commence quand une vie s'achève.",isbn:"9782702196113",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702196113-M.jpg"},
  {t:"L'univers incompris",a:"Carassou Sébastien",y:"2026",ed:"Editions Les Arènes",cote:"523 CAR",pub:"Adulte",sup:"Imprimé",d:"Jamais l'Humanité n'a aussi bien compris le cosmos. Les observations des grands télescopes et des satellites de toute dernière génération semblent confirmer les principales théories scientifiques. Et pourtant... Plus l'Univers se dévoile à nous, plus le mystère s'épaissit : A-t-il des limites ? Qu'y avait-il avant le big bang ? Existe-t-il d'autres univers que le nôtre ? Qu'est-ce qui a déclenché son expansion ? Où est passée l'antimatière ? Ces observations ouvrent de nouvelles interrogations époustouflantes : la matière ordinaire, celle qui compose les étoiles, les planètes et les galaxies, ne représente qu'une infime part du cosmos. Quelle est la nature des 95 % restants, matière noire et énergie sombre ? Comprend-on vraiment la formation des galaxies ? D'où viennent les trous noirs en leur centre ? L'Univers incompris vous invite à une plongée dans les zones d'ombre de notre savoir cosmologique, ces espaces inconnus où s'écrit déjà la science de demain.",isbn:"9791037512482",extraUrl:"https://covers.openlibrary.org/b/isbn/9791037512482-M.jpg"},
