  {t:"Le Calamity Club",a:"Stockett Kathryn",y:"2026",ed:"R. Laffont",cote:"R STO",pub:"Adulte",sup:"Imprimé",d:"\"Si on donne à une fille une bouffée d'air frais et qu'ensuite on la lui reprend, elle se battra comme une lionne pour la récupérer\". Mississipi, 1933. Meg, onze ans, a appris à ne compter sur personne. Depuis que sa mère l'a abandonnée, elle fait partie des grandes filles \"inadoptables\" de l'orphelinat, où elle se bat chaque jour pour garder espoir malgré le mépris et la cruauté de la présidente. Birdie, missionnée d'aller retrouver sa soeur récemment mariée à un riche banquier pour sauver sa famille ruinée, découvre un foyer parfait en apparence mais qui repose en réalité sur un tissu de mensonges. Charlie, internée de force dans un asile après avoir été jugée \"faible d'esprit\", est prête à tout pour récupérer sa fille perdue et retrouver sa dignité. Trois destins qui vont se rencontrer par la force du hasard autour de l'orphelinat du comté de Lafayette, puis converger avec celui d'un groupe de femmes intrépides qui élaborent un plan audacieux : le \"Calamity Club\". Mais dans une ville où règne l'hypocrisie, le moindre acte de défi vous expose à tous les dangers... Quel sera le prix à payer pour leur désobéissance ?",isbn:"9782221284131",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221284131-M.jpg"},
  {t:"L'Artiste",a:"Steeds Lucy",y:"2026",ed:"Hachette",cote:"R STE",pub:"Adulte",sup:"Imprimé",d:"1920, dans un village reculé de Provence. Le célèbre peintre Savinien Goubert vit reclus avec sa nièce, Suzanne. L'arrivée de Joseph, jeune journaliste britannique qui espère écrire un article sur le peintre, vient perturber l'équilibre de cette maison silencieuse. Si Joseph a été invité, il n'a pourtant pas l'impression d'être le bienvenu. Goubert est-il vraiment l'auteur de l'invitation ? Joseph souhaitait percer les secrets du mystérieux peintre, mais c'est Suzanne qui se révèle fascinante. La jeune femme cuisine et fait le ménage pour son oncle, elle prépare son atelier, nettoie ses pinceaux et crée l'environnement idéal pour qu'il puisse travailler. Elle n'est jamais allée plus loin que le village voisin. Mais dans son regard froid, Joseph entrevoit une étincelle vive et dangereuse...",isbn:"9782017336044",extraUrl:"https://covers.openlibrary.org/b/isbn/9782017336044-M.jpg"},
  {t:"Les périphériques",a:"Blondel Jean-Philippe",y:"2026",ed:"Gallimard",cote:"J BLO",pub:"Jeunesse",sup:"Imprimé",d:"Axel a quinze ans et vit dans une petite ville de province. Au pied de l'immeuble, il zone avec les copains en tentant d'oublier que l'avenir est un horizon bouché. Et qu'il n'a pas trouvé de stage pour clore son année de seconde. Grâce à son beau-père, il atterrit à Totem Radio, une radio locale que personne n'écoute... Quand les rencontres font des miracles. Un roman social lumineux dont les héros sont les oubliés du système, par l'auteur de Blog et Un été 79.",isbn:"9782075223645",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075223645-475x500-1.jpg"},
  {t:"Une saison à Téhéran",a:"Azema Lucie",y:"2026",ed:"Les Corps Conducteurs",cote:"910.4 AZE",pub:"Adulte",sup:"Imprimé",d:"\"C'est une histoire qui a commencé il y a exactement dix ans. Un coup de foudre, une collision avec un territoire qui a constitué un véritable événement dans mon existence. Après cette rencontre, je suis retournée plusieurs fois en Iran, puis j'y ai vécu, travaillé, aimé, souffert. L'Iran vit en moi comme une histoire d'amour tardive à laquelle rien ne me prédestinait.\" L'Iran est souvent au coeur de l'actualité. Mais que sait-on vraiment de sa culture, de son histoire, du quotidien de ceux qui l'habitent ? A rebours des clichés occidentaux, Lucie Azema raconte sans l'idéaliser son Iran intérieur, celui où elle a vécu plusieurs années ; celui du pain frais, du thé à toute heure, des sorbets à la rose et du riz au safran ; celui des chauffeurs de taxi, des étudiants, des marchands de fruits, de la jeunesse dorée, des amoureux, des poètes ; celui où se nouent des relations si profondes qu'on dit que deux compagnons \" partagent le même souffle \". Dans les rues de Téhéran, de Shiraz, d'Ispahan, elle nous fait découvrir la langue et la culture de ce pays aujourd'hui isolé, qui fut pourtant l'épicentre de la littérature, des arts et des sciences. Tous les voyageurs passent un jour, même en rêve, parla Perse. Ce récit lumineux, ode au dépaysement et à la rencontre, nous invite à les rejoindre.",isbn:"9782488557306",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488557306-M.jpg"},
  {t:"Autour de minuit",a:"Chase Eve",y:"2026",ed:"R. Laffont",cote:"R CHA",pub:"Adulte",sup:"Imprimé",d:"Bestseller du Sunday Times. Plus de 153 000 ex vendus au Royaume-Uni. Le grand retour de Eve Chase ! Une famille trop parfaite. Un secret bien gardé. Une course contre la montre. Londres, mai 1998 : Dee-Dee, top-model adulé des médias, quitte sa maison de Notting Hill. Sa fille, Maggie, pense qu'elle rentrera vers minuit, mais les jours passent sans que Dee-Dee réapparaisse. Dès lors, Maggie doit se débrouiller seule avec Kit, son petit frère Déterminée à la retrouver, elle est alors entraînée dans un monde labyrinthique de boutiques d'antiquités et hanté de personnages mystérieux, loin des demeures élégantes de leur quartier confortable. Mai 2019 : Maggie, installée à Paris, reçoit un mystérieux appel qui fait voler en éclats sa nouvelle vie lui annonçant la rénovation de l'ancienne maison de sa mère. Maggie se précipite à Notting Hill, et se retrouve confrontée aux fantômes de son passé. Un roman captivant, évocateur et nostalgique, empreint d'une sombre tension et au final rédempteur et plein d'espoir.",isbn:"9782221279854",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221279854-M.jpg"},
  {t:"Fleur de peau",a:"Guisset Constance",y:"2026",ed:"Flammarion",cote:"R GUI",pub:"Adulte",sup:"Imprimé",d:"\"Toutes les fleurs semblent hostiles, même les plus délicates. Les corolles sont autant de grenades dégoupillées et les pistils ricanent de ma naïveté. Je respire mal, je tremble, j'ai peur. Quelle est la probabilité que je tombe malade ? Ne le suis-je pas déjà ? Ces fleurs sont pourtant mes alliées, impossible d'envisager leur complicité\". Pour Ava, fleuriste parisienne et mère de deux enfants, les saisons s'écoulent au gré des clients et des messages à transmettre avec les fleurs. Jusqu'au jour où elle reçoit des analyses inquiétantes qui lui font penser que son sang contient des taux élevés de pesticides. Malgré l'apparition des premières perturbations physiques, elle garde le secret. Même auprès de Jérôme, son mari, qui ne voit rien. Prise dans une course contre la montre, Ava tente la diversion. Un séminaire en Normandie dans un jardin légendaire et une nuit insolite passée à la belle étoile vont déclencher en elle le désir effréné de redevenir vivante.",isbn:"9782080498144",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080498144-M.jpg"},
  {t:"Ibiza a beaucoup changé",a:"Beigbeder Frédéric",y:"2026",ed:"Albin Michel",cote:"R BEI",pub:"Adulte",sup:"Imprimé",d:"\"Nous ne savions pas que les années 1990 seraient nos plus belles années. Nous avions entre vingt et trente ans. Un siècle se terminait, un monde nouveau allait naître. Comment aurions-nous pu deviner que notre liberté était provisoire ? La \"décennie dorée\" (1989-2001) fut le dernier instant d'humanité avant le World Wide Web. On se demandait ce que le troisième millénaire nous réservait : la réponse fut Google, Tinder, Facebook, Instagram, TikTok, YouTube, Netflix, YouPorn, Spotify, WhatsApp et ChatGPT\". Frédéric Beigbeder",isbn:"9782226490155",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226490155-M.jpg"},
  {t:"Le divan des femmes",a:"Roudinesco Elisabeth",y:"2026",ed:"Seuil",cote:"150.195 ROU",pub:"Adulte",sup:"Imprimé",d:"Epouses ou amantes des hommes qui composèrent le premier cercle psychanalytique, les femmes durent batailler ferme pour se faire une place dans un univers qui n'avait pas été conçu pour elles, puis s'imposer progressivement comme cheffes d'écoles et créatrices de nouvelles approches de l'inconscient. Les découvertes, les débats, les controverses qui furent originellement alimentées par l'étude des symptômes et des souffrances de toutes ces anonymes sont racontées ici avec science et pédagogie au long d'un récit passionnant, hommage de l'historienne de la psychanalyse à l'engagement de toutes ces femmes, qu'elles soient devenues célèbres (de Lou-Andréa Salomé à Françoise Dolto) ou demeurées dans l'ombre. Depuis le berceau viennois de la découverte freudienne, la saga se déploie dans le monde entier - Berlin, Saint-Pétersbourg, Londres, Paris, New York, Buenos Aires, Rio de Janeiro -, chaque ville générant son lot de personnalités d'exception (patientes ou thérapeutes) et d'avancées cliniques majeures auxquelles les femmes ont pris une part décisive. Chacun, chacune aussi, au terme de cette lecture bouleversante, reconnaîtra sa dette.",isbn:"9782021622423",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021622423-M.jpg"},
  {t:"Fan de carotte",a:"Ilustrajo Mariajo",y:"2026",ed:"Glénat Jeunesse",cote:"A ILU",pub:"Jeunesse",sup:"Imprimé",d:"Au potager, monsieur Lapin bêche, sème, arrose et surveille. Mais quand arrive le moment de la récolte, il va faire une rencontre très spéciale : une carotte qui danse et qui chante, une carotte un poil envahissante ! Comment dire, monsieur Lapin n'est pas très \"fan\" de cette carotte, lui qui tient plus que tout à sa solitude. Ah oui ? Vraiment ? !",isbn:"9782344070048",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344070048-475x500-1.jpg"},
  {t:"Spy X Family",a:"Endo Tatsuya",y:"2026",ed:"Kurokawa",cote:"BD SPY",pub:"Jeunesse",sup:"Imprimé",d:"Sauvez le monde avec l'élite des agents (très) spéciaux : la famille Forger ! Une comédie d'espionnage pétillante ! Loid a l'opportunité de se renseigner lors d'une consultation de Melinda. Quels secrets de Donovan Desmond lui seront dévoilés ? A la rentrée scolaire, Anya se retrouve dans des classes différentes en fonction de son niveau. Cela l'amène à être impliquée dans un conflit international !",isbn:"9791042021030",extraUrl:"https://covers.openlibrary.org/b/isbn/9791042021030-M.jpg"},
  {t:"Les ailes de la forêt",a:"Gourmaud Jamy",y:"2026",ed:"Albin Michel",cote:"R GOU",pub:"Adulte",sup:"Imprimé",d:"Un savoureux voyage depuis des forêts encore mal connues jusqu'au coeur du Paris des années folles. Sciences et Avenir Un premier roman d'aventures emballant entre la forêt guyanaise et le Paris des années 1920. Le Télégramme Un battement d'aile peut changer un destin. Saint-Laurent-du-Maroni, 1924. Lorsqu'il s'enfonce dans la forêt guyanaise, sur cette terre qui l'a vu grandir, Emile retrouve la saveur de son enfance, les parfums et la moiteur de l'air. S'il est revenu, c'est pour trouver une espèce rare. Chasseur de papillons et aventurier malgré lui, il veut profiter de l'engouement pour les lépidoptères et sauver sa boutique parisienne. Aidé de Florine, une jeune femme insaisissable, il affronte la nature et les hommes, bagnards à l'affût de trésors, trafiquants prêts à tuer... Quand apparaît, tel un miracle, le morpho gynandromorphe, spécimen rarissime aux ailes d'un bleu aveuglant, sa quête se transforme en traque périlleuse, la convoitise embrasant la jungle et les salons parisiens. De l'Amazonie vénéneuse au Paris des Années folles, Jamy, formidable conteur, signe un grand roman d'aventures, qui nous plonge au coeur des mystères de la nature et des passions insensées des hommes.",isbn:"9782226498700",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226498700-M.jpg"},
  {t:"Les veilleurs de rêves",a:"Marcero Deborah",y:"2026",ed:"Didier jeunesse",cote:"A MAR",pub:"Jeunesse",sup:"Imprimé",d:"Lenny et ses amis avaient décidé de faire ensemble une grande collection de souhaits, de rêves et d'espoirs. Mais une tempête arriva et détruisit tout. A quoi bon rêver si on pouvait tout perdre ? Traduction de l'anglais de Rose-Marie Vassallo.",isbn:"9782278133000",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782278133000-475x500-1.jpg"},
  {t:"Peaux à peaux",a:"Page Melanie",y:"2026",ed:"Albin Michel",cote:"R PAG",pub:"Adulte",sup:"Imprimé",d:"Un premier roman émouvant sur la maternité. Télé 7 Jours Je pousse une dernière fois, je donne tout ce que j'ai. Tu es là. Ton cri. Ta peau. Ton poids sur moi. Plus en moi, sur moi. Tes petites mains. Ta petite bouche. Ton souffle. Tes paupières gonflées. Tu m'as quittée pour me rencontrer. Je regarde Vincent. Je te regarde, toi. Tu n'es pas moi, tu n'es pas lui, tu es toi. Et tu es la vie. Il y a la magie de la naissance, les premiers pas et les premiers émois, les défis du quotidien. Il y a les mères comblées, fières ; les mères impuissantes, défaillantes... Puisant parmi des destins ordinaires, Melanie Page déploie un roman polyphonique qui explore la maternité et la filiation dans toute leur complexité. Son regard sensible et lucide nous tend un miroir où chacune et chacun se reconnaîtra, dans ses moments de doute, de combat silencieux ou de joie infinie. Artiste, comédienne, maman comblée, Melanie Page publie avec Peaux à peaux son premier roman.",isbn:"9782226506504",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226506504-M.jpg"},
  {t:"Tendre Maroc",a:"Boysson Emmanuelle de",y:"2026",ed:"Calmann-Lévy",cote:"R BOY",pub:"Adulte",sup:"Imprimé",d:"\" Il ne faut jamais revenir sur les lieux de son enfance, de crainte d'en brouiller le souvenir. \" Dans la maison de campagne familiale, Emma retrouve les vieux agendas de sa mère. Et le souvenir de son enfance au Maroc. Par petites touches impressionnistes, elle fait revivre ses années à Mohammedia, l'odeur des orangers, la douceur des cornes de gazelle, les jeux avec ses frères et soeur dans le jardin et le cri des mouettes sur le port. Une enfance heureuse, privilégiée. Même si Emma, timide et rêveuse, ne cesse de chercher l'affection de Blanche, une mère fascinante, plus préoccupée par les défavorisés que par les siens. Plus tard, la jeune fille, alors pensionnaire à Casablanca, se met à écrire. Dans l'espoir que la littérature, ainsi que le vent de liberté des années 1970 et l'amitié complice avec sa cousine, l'aident à s'émanciper d'un milieu où, derrière les visages souriants, le chagrin affleure. Dans ce roman solaire, Emmanuelle de Boysson ressuscite un temps perdu où chaque instant est une aventure et s'interroge sur la force de la transmission.",isbn:"9782702192832",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702192832-M.jpg"},
  {t:"5 petits moutons gloutons",a:"Claire Céline",y:"2026",ed:"L'École des loisirs",cote:"A CLA",pub:"Jeunesse",sup:"Imprimé",d:"C'est l'hiver et 5 petits moutons jouent dans la neige quand soudain une odeur alléchante de chocolat les attire vers la maison du loup. En passant par la cheminée, les moutons espèrent tomber directement dans le chaudron plein de chocolat sans se faire croquer ! Est-ce une bonne idée ?",isbn:"9782211346153",extraUrl:"https://covers.openlibrary.org/b/isbn/9782211346153-M.jpg"},
  {t:"La librairie des secrets",a:"Avril Virginie",y:"2026",ed:"L'Archipel",cote:"R AVR",pub:"Adulte",sup:"Imprimé",d:"A la mort de sa mère, Charlotte espère découvrir enfin l'identité de son père, qu'elle n'a jamais connu. Mais il n'en est rien. Minée par ce secret, elle ne parvient plus à faire semblant et décide de prendre un temps de recul. Elle quitte le foyer familial et retrouve son ami d'enfance, Victor, qui tient une charmante librairie. Ensemble, ils décident de mener l'enquête... Découvrir ses racines pour mieux déployer ses ailes A la mort de sa mère, Charlotte espérait trouver des indices et découvrir enfin l'identité de son père. Il n'en est rien. Minée par cette question à laquelle sa mère a toujours refusé de répondre, elle ne parvient plus à avancer dans l'existence. Elle décide de prendre un temps de recul et quitte le foyer familial, laissant son mari s'occuper de leurs deux adolescents. Victor, son ami d'enfance, qui tient une charmante librairie-salon de thé, L'Exquis Mot, lui propose de l'héberger afin qu'elle puisse faire le point. Ensemble, ils décident d'enquêter sur le père de Charlotte. Au gré des rencontres que favorise ce lieu, havre de paix et de gourmandise, Charlotte découvre un monde insoupçonné et s'ouvre de nouveau à la vie. Mais bientôt, de mystérieux colis arrivent à son intention. Elle n'est pas au bout de ses surprises... Ses recherches la mèneront bien plus loin qu'elle ne l'avait imaginé. Pourrait-t-elle désormais s'inventer une nouvelle vie, en accord avec ses aspirations profondes ? Un roman tout en délicatesse sur les tourbillons du milieu de vie, quand tout semble écrit alors qu'il reste tant de livres à lire et de pistes à explorer !",isbn:"9782809853711",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809853711-M.jpg"},
  {t:"Jouer l'amant",a:"Biasini Sarah",y:"2026",ed:"Stock",cote:"R BIA",pub:"Adulte",sup:"Imprimé",d:"\"Il est délicieux d'être une femme épanouie, qui a passé son après-midi à exulter. J'y crois. Oublier que je suis célibataire, déçue par certains hommes, ne pouvant compter que sur moi-même pour avoir du plaisir. Je suis toute à ce que je viens de vivre. Je n'ai rien à dire mais derrière ma bouche close, je hurle au public face à moi : Regardez une femme libre, appuyez-vous sur moi, je ne fais pas si peur que ça. Mon mari est là, à côté de moi, et vous ne savez pas combien je l'aime. Vous ne savez pas ce qui se passe entre nous, depuis combien de temps. Nous allons vous le raconter\".",isbn:"9782234093669",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234093669-M.jpg"},
  {t:"Moi d'abord !",a:"Escoffier Michaël",y:"2010",ed:"Frimousse",cote:"A ESC",pub:"Jeunesse",sup:"Imprimé",d:"C’est l’histoire d’un caneton qui veut toujours être le premier. Que maman canne (ou papa canard, difficile de trancher!) propose une promenade, une partie de pêche (aux canards, bien sûr) ou une baignade… «Moi d’abord, moi d’abord» cancanne l’insupportable palmidède en envoyant au tapis toute sa fratrie. Aussi quand il entend crier «À table!» ce n’est évidemment qu’un cri… mais à trop se précipiter on a quelquefois de bien mauvaises surprises!",isbn:"9782352410553",extraUrl:"https://www.babelio.com/couv/CVT_cvt_Moi-dabord-_9651.jpg"},
  {t:"Écume de nacre",a:"Gihef",y:"2020",ed:"les Humanoïdes associés",cote:"BD GIH",pub:"Adulte",sup:"Imprimé",d:"Victime d'une prophétie, la jeune Freydis fut abandonnée par son clan de sirènes et recueillie par une famille viking. Élevée en guerrière et fière de son appartenance au peuple norrois, elle est prête à tout pour anéantir les sirènes, auxquelles elle voue une haine farouche. Mais les liens du cœur seront-ils plus forts que les liens du sang ?  Les mers nordiques sont peuplées de créatures mythologiques aussi puissantes que cruelles, telles les neufs sirènes, filles d'Aegir. Celles-ci s'opposent aux fiers vikings, prêts à tout pour contrôler les mers… Affrontements, alliances et trahisons, la série Sirènes & Vikings présente des récits indépendants, chaque fois par un duo d'auteurs différent.",isbn:"9782731650273",extraUrl:"https://covers.openlibrary.org/b/isbn/9782731650273-M.jpg"},
  {t:"La cuisine c'est aussi de la chimie",a:"Le Caisne Arthur",y:"2013",ed:"Hachette Pratique",cote:"641.5 LEC",pub:"Adulte",sup:"Imprimé",d:"Partant des dernières recherches scientifiques les plus pointues, Arthur Le Caisne revisite 70 recettes des plus courantes : poulet rôti, pot-au-feu, poisson mariné, purée de pommes de terre, et même les œufs coque ou dur et vous explique avec des dessins et beaucoup d'humour ce qui se passe réellement pendant la réalisation de ces recettes. Vous n'allez plus jamais cuisiner vos plats préférés comme avant...",isbn:"9782012309746",extraUrl:"https://covers.openlibrary.org/b/isbn/9782012309746-M.jpg"},
  {t:"La sorcière des mers du Sud",a:"Gihef",y:"2021",ed:"les Humanoïdes associés",cote:"BD GIH",pub:"Adulte",sup:"Imprimé",d:"La jeune sirène Blodughadda se voit confier un triton rejeté par les siens car tous deux sont marqués d'une rune symbole de magie, un signe suffisant pour braver les lois qui proscrivent tout contact entre sirènes et tritons. En grandissant, Gildwin développe son don pour la magie et devient bientôt inséparable de Blodughadda. Cette amitié interdite doit à tout prix rester cachée, mais c'est sans compter sur les origines du triton qui finissent par le rattraper...Les mers nordiques sont peuplées de créatures mythologiques aussi puissantes que cruelles, telles les neufs sirènes, filles d'Aegir. Celles-ci s'opposent aux fiers vikings, prêts à tout pour contrôler les mers… Affrontements, alliances et trahisons, la série Sirènes & Vikings présente  des récits indépendants, chaque fois par un duo d'auteurs différent.",isbn:"9782731646443",extraUrl:"https://covers.openlibrary.org/b/isbn/9782731646443-M.jpg"},
  {t:"La vague invisible",a:"Mitric Nicolas",y:"2021",ed:"les Humanoïdes associés",cote:"BD MIT",pub:"Adulte",sup:"Imprimé",d:"L'épisode  : Modeste marchande de poisson, Lydveig a-t-elle hérité des talents de pisteurs de son père  ? C'est ce que pense le cruel roi Hardeknud, qui la contraint à retrouver la sirène responsable de la mort de son fils aîné. Accompagnée par le prince héritier en quête de reconnaissance, Lydveig mène l'enquête. Il lui faudra redoubler d'ingéniosité pour retrouver la trace d'une sirène si insaisissable qu'elle en paraîtrait presque invisible…  La série  : Les mers nordiques sont peuplées de créatures mythologiques aussi puissantes que cruelles, telles les neufs sirènes, filles d'Aegir. Celles-ci s'opposent aux fiers vikings, prêts à tout pour contrôler les mers… Affrontements, alliances et trahisons, la série Sirènes & Vikings présente des récits indépendants, signés chacun par un duo d'auteurs différent.",isbn:"9782731692327",extraUrl:"https://covers.openlibrary.org/b/isbn/9782731692327-M.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2025",ed:"Pika édition",cote:"BD BLU",pub:"Jeunesse",sup:"Imprimé",d:"Grâce à sa nouvelle arme d'étonante, Isagi permet au club allemand d'égaliser ! Face à son rival qui se retrouve sous les projecteurs du monde entier, Kaiser, acculé, joue le tout pour le tout avec une technique encore incomplète, dans l'espoir de régler ses comptes avec le passé ! Boostés par cette tension, les autres individualistes affamés de buts se battent, eux aussi, pour définir la ligne à franchir afin de briller à leur tour. Qui parviendra à atteindre une nouvelle dimension dans sa progression transcendantale faite de destruction et de reconstruction ? !",isbn:"9791043303326",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303326-M.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2026",ed:"Pika édition",cote:"BD BLU",pub:"Jeunesse",sup:"Imprimé",d:"Pour s'emparer du dernier but, Isagi et Kaiser unissent leurs forces, rallumant l'envie de vaincre dans tout le club allemand ! La formation française, loin de se laisser abattre, resserre également ses rangs et rend coup pour coup, transformant l'affrontement en un duel d'une intensité sans précédent ! Au coeur de cette arène en ébullition, Ness, laissé un peu de côté, cherche désespérément à retrouver Kaiser et à découvrir la voie de sa propre renaissance. Dans ce brasier où s'enchaînent les rebondissements imprévisibles, quelle équipe finira par obtenir la victoire absolue ? ! Soyez témoins du dénouement le plus imprévisible de l'histoire !",isbn:"9791043306471",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043306471-M.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2026",ed:"Pika édition",cote:"BD BLU",pub:"Jeunesse",sup:"Imprimé",d:"La rencontre explosive du football et du \"baffle royale\". Le match est relancé par le but égalisateur phénoménal de Rin Itoshi ! Portée par une série de changements fulgurants, la tension atteint son paroxysme sur le terrain. Sous l'effet de cette effervescence, Loki, encore resté sur le banc jusqu'ici, et Noa annoncent brusquement leur entrée en jeu ! Au coeur du tumulte, Isagi plonge dans une analyse acharnée, à la recherche d'une stratégie décisive... Le dénouement approche, et cette ultime bataille s'apprête à déclencher une onde de choc capable de bouleverser le monde !",isbn:"9791043306068",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043306068-M.jpg"},
  {t:"L'île aux murmures",a:"Swan Karen",y:"2026",ed:"Charleston",cote:"R SWAN",pub:"Adulte",sup:"Imprimé",d:"Ecosse, 1930. Effie Gillies vit sur la dernière île sauvage d'Ecosse, Saint Kilda, avec ses trois meilleures amies. Aussi libre et indomptable que les falaises qu'elle escalade, la jeune femme accepte de servir de guide au comte de Dumfries et à son fils, lord Sholto, lorsqu'ils viennent découvrir l'île et ses oiseaux. Entre Sholto et Effie, c'est le coup de foudre. Hélas, personne ne voit ce rapprochement d'un bon oeil : les deux jeunes gens viennent de mondes bien trop différents... Des mois plus tard, les insulaires sont forcés de quitter l'île pour le continent. Si Effie est effondrée, elle se réjouit de revoir Sholto lorsqu'elle est invitée à travailler chez les Dumfries. Mais leurs retrouvailles sont vite interrompues par une terrible nouvelle : un homme a été retrouvé assassiné à Saint Kilda. Et Effie est la principale suspecte... Le premier tome d'une saga passionnante mêlant secrets, suspense et grande histoire d'amour au coeur de l'un des plus sauvages archipels de l'Ecosse. UNE ILE SAUVAGE. QUATRE AMIES. ET UN SECRET QUI MENACE LEUR LIBERTE... Karen Swan a été journaliste de mode avant de se consacrer à l'écriture. Elle a écrit une trentaine de romans figurant dans les best-sellers du Sunday Times. Elle vit dans le Sussex, en Angleterre, avec son mari et ses trois enfants. L'Ile aux murmures, saga au succès international, a été traduite dans dix pays. Traduit de l'anglais par Elisabeth Luc",isbn:"9782385295080",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295080-M.jpg"},
  {t:"Ne vous mariez jamais ! Vraiment ?",a:"Ferry Luc",y:"2026",ed:"Editions de l'Observatoire",cote:"128 FER",pub:"Adulte",sup:"Imprimé",d:"Et si le secret du désir tenait dans la distance ? Depuis les troubadours du XIIe siècle, l'amour-passion se heurte au même paradoxe : peut-il survivre à la vie conjugale ? Faut-il choisir entre l'ivresse d'Eros et la sérénité du quotidien partagé ? Luc Ferry revisite avec brio les grands récits médiévaux - Tristan et Iseut, Lancelot et Guenièvre - pour éclairer nos tourments modernes. Ces amours illégitimes, ces désirs incessants qui défient l'honneur et la raison nous parlent encore : ils révèlent la nature même de la passion, qui se nourrit d'obstacles et de manque. A travers une relecture audacieuse de la littérature courtoise, le philosophe interroge la tension fondamentale entre désir et possession, absence et présence. Avec la clarté qui le caractérise, Luc Ferry nous invite à repenser nos attentes amoureuses. Non pour renoncer au mariage, mais pour comprendre ce qui fait vivre - ou mourir - la flamme du désir. Une méditation lumineuse sur l'amour, entre philosophie antique et psychologie contemporaine, qui nous réconcilie avec nos contradictions les plus intimes.",isbn:"9791032925683",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032925683-M.jpg"},
  {t:"Il paraît que",a:"Tallec Olivier",y:"2026",ed:"L'École des loisirs",cote:"A TAL",pub:"Jeunesse",sup:"Imprimé",d:"J'ai avalé un pépin de pomme sans faire exprès... Il paraît que si on avale un pépin, on a un arbre qui pousse à l'intérieur. Si ça se trouve, les pommiers du vieux verger sont des gens qui ont avalé un pépin de pomme ! Günther m'a dit que si on avale un pépin de pomme rouge, on a un arbre rouge qui pousse dans le ventre. Non... ça ne peut pas vraiment arriver, hein ?",isbn:"9782211350983",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782211350983-475x500-1.jpg"},
  {t:"Le carnaval",a:"Luciani Brigitte",y:"2012",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeunesse",sup:"Imprimé",d:"Monsieur Blaireau et Madame Rebarde décident qu'ils vont tous vivre dans le même terrier !",isbn:"9782205067835",extraUrl:"https://products-images.di-static.com/image/base/9782205067835-475x500-1.jpg"},
  {t:"La maison biscornue",a:"Brrémaud Frédéric",y:"2026",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Londres, 1947. Trois générations de la famille Leonides vivent ensemble sous la direction du riche patriarche Aristide, dans une grande demeure biscornue. Aristide, veuf, s'est remarié avec une très jeune femme. Sa soeur dirige la maison, tandis que sa petite-fille aime Charles Hayward et veut se marier. Mais tout bascule quand Aristide meurt empoisonné... Le meurtrier ferait-il partie de la famille ? Sophia fait part à son fiancé Charles Hayward de sa décision de ne pas consentir à l'épouser tant que le meurtrier n'aura pas été appréhendé. Désespéré de ne pouvoir obtenir sa main, il commence sa propre enquête.",isbn:"9782889325740",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889325740-M.jpg"},
  {t:"Titanic",a:"Boudeville Peggy",y:"2026",ed:"Fleurus",cote:"J BOU",pub:"Adolescent",sup:"Imprimé",d:"Le 11 avril 1912, le Titanic s'élance en direction de New York avec, à son bord, plus de deux mille personnes. Parmi eux, Ernest ainsi que Juliette et sa famille, tous pleins d'espoir et de rêves. Mais, dans la nuit du 14 au 15 avril, l'impensable arrive : après avoir heurté un iceberg, le paquebot coule petit à petit dans les eaux glaciales de l'Atlantique. Ernest et Juliette vont alors devoir unir leurs forces et faire preuve d'un courage extraordinaire pour survivre et tenter de sauver des enfants perdus dans le chaos du naufrage.",isbn:"9782215197416",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215197416-475x500-1.jpg"},
  {t:"La Terre déchirée",a:"Hicks Faith Erin",y:"2019",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeunesse",sup:"Imprimé",d:"La tribu Dao va s'allier aux Yisun pour mener une offensive contre le général Erzi et ses troupes qui font régner la terreur. Rat et Kai veulent voler le livre de Napatha contenant la formule de destruction massive, avant que l'habile Mura ne la revende aux nations pour entretenir les guerres. ©Electre 2019",isbn:"9782369813767",extraUrl:"https://products-images.di-static.com/image/base/9782369813767-475x500-1.jpg"},
  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"La reine Hiling consent à laisser le prince Bojji, héritier du royaume de Boss, partir en voyage, accompagné de Domas, son maître d'armes, et de Hokuro, un jeune soldat qui connaît la langue des signes. Lorsque le groupe arrive devant la porte des Enfers, Bojji est confronté à une trahison inattendue. ©Electre 2022",isbn:"9791032712177",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712177-M.jpg"},
  {t:"La vieillesse, un émerveillement",a:"Gilbert Guy",y:"2020",ed:"Ed. de la Loupe",cote:"248.8 GIL",pub:"Adulte",sup:"Imprimé",d:"Vieillir est un privilège... Et une grande source d'ennuis. Comment l'aborder avec joie et sérénité quand tout semble changer ? Eh oui, les gens parlent moins distinctement, les radiateurs semblent moins efficaces et les livres écrits plus petits. Et pourtant, si notre corps avance en âge et qu'il nous joue des tours à sa façon, on peut apprendre à conserver l'esprit jeune et l'humour (et l'amour) actifs, piocher dans la vie ce qu'elle nous offre de magique. Et non, ce n'est pas parce qu'on a 90 ans que l'on est inutile. Prêtre-éducateur depuis 45 ans, Guy Gilbert, appelé aussi le curé des loubards, aide quotidiennement des jeunes en perdition.",isbn:"9782848689609",extraUrl:"https://covers.openlibrary.org/b/isbn/9782848689609-M.jpg"},
  {t:"Myrmidon et la grotte mystérieuse",a:"Dauvillier Loïc",y:"2016",ed:"les Éditions de la Gouttière",cote:"BDJ DAU",pub:"Jeunesse",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même... Vêtu d'une peau de bête et lance en main, Myrmidon se retrouve projeté à l'époque de la Préhistoire, mais attention à l'effrayant tigre aux dents de sabre...",isbn:"9791092111415",extraUrl:"https://products-images.di-static.com/image/base/9791092111415-475x500-1.jpg"},
  {t:"Tous tes enfants dispersés",a:"Umubyeyi-Mairesse Beata",y:"2019",ed:"Autrement",cote:"R UMU",pub:"Adulte",sup:"Imprimé",d:"Les relations sur trois générations d'une famille brisée par la guerre. Blanche, rwandaise, a grandi à Bordeaux après avoir fui le génocide de 1994. Elle vit avec son mari et son garçon, Stokely. Un jour, elle revient au Rwanda, à Butare, pour retrouver sa mère, Immaculata. L'amour et le pardon les réuniront-elles ? Quand à Stokely, il veut tout savoir de ce passé familial. Premier roman. ©Electre 2019",isbn:"9782746751392",extraUrl:"https://covers.openlibrary.org/b/isbn/9782746751392-M.jpg"},
  {t:"Esprits rebelles",a:"Sobral Patrick",y:"2026",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"La série Les Légendaires - Origines est de retour ! Apparu en 2012, ce tout premier spin-off est le second plus gros succès commercial de la série et narre le passé de nos héros avant qu'ils ne deviennent Les Légendaires. Les Légendaires croisent Samaël, toujours à la recherche de Shimy, en compagnie de Regen. Les retrouvailles inattendues avec Gryf ne vont pas sans leur lot de tensions, malgré leur but commun : retrouver Darkhell et le mettre hors de nuire. Pendant ce temps, Shimy, prisonnière du Sorcier Noir, parvient à s'enfuir alors que Ténébris doit faire face aux tourments de son passé.",isbn:"9782413093459",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413093459-M.jpg"},
  {t:"J'écrirai votre histoire",a:"Léost Claire",y:"2026",ed:"Jean-Claude Lattès",cote:"R LEO",pub:"Adulte",sup:"Imprimé",d:"Olga n'est pas médecin, mais elle réanime les patients. C'est ainsi qu'on a présenté la biographe hospitalière au Dr Frédéric Grangier de l'hôpital de Fontainebleau. Elle n'ajoute pas des jours à la vie mais de la vie aux jours en permettant aux malades d'écrire le livre de leur vie, qui sera remis à leurs proches. Elle recueille alors les souvenirs de Jeanne, cette dame qui chante et danse pieds nus, les mots de Thomas, père taiseux d'une petite fille, ou encore ceux de Manon, six ans, la plus jeune des patientes de Frédéric. D'abord sceptique, le médecin constate bientôt les miracles accomplis par Olga. Mais pourquoi a-t-elle tout quitté pour rejoindre ce service, à la poursuite de quelle vérité ? Croisant les destins d'Olga, de Frédéric et de ses patients, et celui de Linh, la jeune directrice de l'hôpital, Claire Leost éclaire avec une infinie délicatesse un métier inconnu, d'une humanité folle, et déploie son talent de conteuse, rendant un hommage vibrant au pouvoir des mots.",isbn:"9782709676458",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709676458-M.jpg"},
  {t:"Le lynx boréal",a:"Bauduret Sylvain",y:"2026",ed:"Editions de la Gouttière",cote:"BDJ BAU",pub:"Jeunesse",sup:"Imprimé",d:"Dans les sous-bois, un lynx est en quête d'un nouveau territoire. Sa recherche est rendue difficile par les routes qui scindent la forêt et empêchent d'explorer librement. Alors quand un autre lynx arrive pour défendre sa parcelle, il faut choisir : lutter, ou braver le danger des voitures...",isbn:"9782357961494",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357961494-M.jpg"},
  {t:"Une poignée de vent",a:"Naseh Negar",y:"2026",ed:"Marabout",cote:"R NAS",pub:"Adulte",sup:"Imprimé",d:"\"Avant que nous nous quittions, je voudrais citer un vers de votre poète national, Omar Khayyâm, qui dit, je crois, qu'on doit aller à la rencontre de la mort une poignée de vent dans une main et un verre de vin dans l'autre.\" Automne 1978. A Téhéran, le mouvement de contestation contre le régime du Shah monte en puissance. Depuis son balcon, Minou, enceinte, observe les files interminables de manifestants. Pendant ce temps, le Shah déchu, dévoré par un cancer, vit les six derniers mois de son existence, entre Le Panama et Le Caire. Avec ses illusions, la façade de la dynastie se craquelle. Dans cet espace liminaire entre révolution et douceur familiale, Minou assiste aux bouleversements qui ébranlent son pays et à la liesse qui accompagne le renversement du régime. Son mari Hassan, opposant exilé en Suède, a entamé les démarches pour qu'elle et leur fils aîné le rejoignent. Plus de trente ans plus tard, alors que ses enfants se cherchent une vie en Suède, Minou n'a oublié ni sa patrie ni ceux qu'elle a perdus durant cette période troublée. Lorsqu'elle apprend que sa mère est mourante, la décision de retourner en Iran s'impose.",isbn:"9782501171878",extraUrl:"https://covers.openlibrary.org/b/isbn/9782501171878-M.jpg"},
  {t:"La princesse qui aimait les chenilles",a:"Ceccatty René de",y:"2026",ed:"Philippe Picquier",cote:"R CEC",pub:"Adulte",sup:"Imprimé",d:"Ces six contes sont aussi anciens que le Japon. Puisés dans le folklore et adaptés de recueils de légendes anciennes et de contes du Moyen Age, ils se donnent à lire comme un trésor de récits dans lesquels bien souvent le fantastique le dispute au merveilleux. Monde peuplé de monstres et de géants, de spectres terrifiants et de fantômes bienveillants, dans lequel on peut entendre les voix du rêve et du surnaturel : parfois les enfants naissent dans un coquillage ou dans une pêche, souvent les objets magiques font des prodiges, et les princesses sont délivrées comme dans nos contes d'enfants, même s'il leur arrive d'avoir des caprices inexplicables.",isbn:"9782809717365",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809717365-M.jpg"},
  {t:"De l'origine des espèces",a:"Kim Po-yŏng",y:"2026",ed:"Rivages",cote:"SF BOY",pub:"Adulte",sup:"Imprimé",d:"Dans un futur lointain, l'humanité a sombré dans l'oubli et la Terre n'est plus habitée que par des robots. Kay, chercheur en chimie, rencontre Cécile, une androi[u0308]de marginalisée à cause de son apparence. Inspirée par ses travaux, elle l'incite à s'aventurer dans le champ controversé de la biologie organique. Leurs recherches se heurtent à de vives résistances, d'autant plus que les plantes qu'ils s'efforcent de faire renaître dépérissent rapidement. Mais au fil des décennies, leur laboratoire s'agrandit et se mue en un lieu énigmatique dont aucun visiteur ne semble vouloir repartir",isbn:"9782743670030",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743670030-M.jpg"},
  {t:"Sinatra, amour et Mafia",a:"Améziane Amazing",y:"2026",ed:"Rocher",cote:"BD AME",pub:"Adulte",sup:"Imprimé",d:"Frank Sinatra a réussi à coller plus de personnes ensemble que la glue ! Sa voix a suscité les passions - et pas seulement auprès des femmes qu'il a connues. Il a toujours été fidèle en amitié - et juste en amitié -, mais pour ce qui est de ses affaires subsiste une part d'ombre que tous préfèrent ignorer. « La mafia, ça n'existe pas », affirmera le patron du FBI après avoir été pris en photo par elle. Pourtant, raconter la vie de Sinatra, c'est aussi retracer la montée en puissance du crime organisé, de Hollywood à Washinghton, en passant par Cuba. Venez découvrir The Voice comme vous ne l'avez jamais vu, à travers les témoignages de Marilyn Monroe, Ava Gardner, Sammy Davis Jr. et... du redoutable boss de la mafia de Chicago, Sam Giancana",isbn:"9782268112756",extraUrl:"https://covers.openlibrary.org/b/isbn/9782268112756-M.jpg"},
  {t:"Les mots qui tuent",a:"Fines Michelle",y:"2026",ed:"Arthaud",cote:"364.152 FIN",pub:"Adulte",sup:"Imprimé",d:"Il est la face cachée des violences conjugales. Le suicide forcé, c'est ainsi que l'on appelle le harcèlement dans le couple qui mène au suicide ou à une tentative de suicide. Ces meurtres invisibilisés font deux fois et demie plus de victimes que les féminicides : neuf cent six en 2024. En 2010, sept ans après le meurtre de Marie Trintignant, le suicide de Krisztina Rády, la femme de Bertrand Cantat, a mis le phénomène en lumière. En 2020, une loi a été votée qui punit les responsables de suicides forcés à une peine pouvant aller jusqu'à dix ans de prison. Mais le texte, encore peu connu, est rarement appliqué. Michelle Fines, journaliste d'investigation, a connu comme des milliers de femmes la violence conjugale et s'appuie sur son expérience personnelle pour en décrypter les mécanismes. Comment peut-on vouloir mourir pour échapper à l'enfer ? Qu'est-ce qui lie les victimes aux bourreaux, jusqu'à la mort ? Pour répondre à ces questions, Michelle Fines donne la parole aux victimes. Les mortes, celles qui ont raconté leur calvaire avant de disparaître, et les vivantes, qui en ont réchappé. Elle se confronte aussi aux auteurs, pervers dits narcissiques, harceleurs, manipulateurs. Elle s'intéresse enfin aux mécanismes du cerveau qui empêchent les victimes de partir pour se sauver. Une enquête nécessaire pour comprendre le suicide forcé et, au-delà, les mécanismes de l'emprise et de la violence conjugale.",isbn:"9782080482280",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080482280-M.jpg"},
  {t:"La bataille du néant",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Un mystérieux phénomène, le \"Néant\", menace le monde elfique. Shimy doit aider les elfes à sauver Astria grâce à ses pouvoirs élémentaires naissants. Mais des survivants Galinas n'apprécient pas ce renfort, tout comme ils ne souhaitent pas la disparition de ce très mystérieux \"Néant\". Quel noir secret ce dernier renferme-t-il ? Un nouvel épisode bourré d'adrénaline pour nos amis les Légendaires.",isbn:"9782756064772",extraUrl:"https://images.epagine.fr/772/9782756064772_1_m.jpg"},
  {t:"Le triangle des passions du monde",a:"Moïsi Dominique",y:"2026",ed:"R. Laffont",cote:"327 MOI",pub:"Adulte",sup:"Imprimé",d:"Dominique Moïsi est un de nos experts en géopolitique les plus reconnus internationalement. Cet essai est indispensable pour comprendre les bouleversements actuels du monde. \" Alors que nous entrons dans le second quart du xxie siècle, nous avons connu le retour de la guerre en Europe, le déchaînement de la violence au Moyen-Orient et l'abandon du rôle de garant de l'ordre mondial par les Etats-Unis. Vivons-nous une simple parenthèse cauchemardesque ou assistons-nous à la fin d'un cycle historique et au début d'un autre ? Dans notre monde qui n'a jamais été plus complexe qu'aujourd'hui, le triomphe de la passion sur la raison s'accompagne de celui de la force brute sur le droit et la morale. Et pourtant, en dépit de la fuite en arrière du monde, rien ne serait plus dangereux pour nous que de céder à la peur ou à la résignation. Je reste convaincu que la démocratie a un avenir et qu'elle mérite que l'on se batte pour elle ; nous avons le devoir d'espérer. \" D. M.",isbn:"9782221285435",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221285435-M.jpg"},
  {t:"Combat toujours perdant",a:"Houellebecq Michel",y:"2026",ed:"Flammarion",cote:"808.1 HOU",pub:"Adulte",sup:"Imprimé",d:"\"Non, cette vie n'est pas suffisante, elle ne peut contenir la millième partie de nos rêves\".",isbn:"9782080145819",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080145819-M.jpg"},
  {t:"Embraye, Louise",a:"Boussion Clara",y:"2026",ed:"Gallimard",cote:"R BOU",pub:"Adulte",sup:"Imprimé",d:"Ils ont grandi dans des villages, sur des routes de campagne, entre soirées improvisées et boulots de courte durée. Ils croyaient que l'amitié serait leur maison, leur refuge. Louise en faisait partie. Mais à l'heure où chacun choisit une voie, Louise vacille. Elle cherche à habiter son corps, son identité, sa place. Comme s'il fallait atténuer ce flou persistant, comme s'il fallait tout déterminer. Elle avance, travaille, roule la nuit fenêtres ouvertes, se réinvente dans la ville, dans la création, dans les gestes qu'elle apprend à refaire elle-même. Embraye, Louise est l'histoire d'une génération qui se soustrait aux trajectoires déjà tracées. Une génération qui tâtonne, qui brûle, qui chute, qui recommence. Un premier roman sur la force qu'il faut pour se transformer avec courage et détermination sans jamais renier ce que l'on a été.",isbn:"9782073139030",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073139030-M.jpg"},
  {t:"Shangri-La Frontier",a:"Katarina",y:"2026",ed:"Glénat",cote:"BD SHA",pub:"Jeunesse",sup:"Imprimé",d:"Le combat contre Kthaanid des Abysses, l'un des Sept Suprêmes, est entré dans sa troisième phase ! Sunraku et ses coéquipiers, dont les genres et les stats ont été intervertis, passent à l'attaque en inversant aussi les rôles. Les humains d'aujourd'hui seront-ils capables de suivre les illustres traces divines célébrées par le maître des Abysses, et surmonter les épreuves qu'il leur impose ?",isbn:"9782344071502",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344071502-M.jpg"},
  {t:"(Pas encore) une histoire de sorcière",a:"Roussey Christine",y:"2026",ed:"La Martinière",cote:"A ROU",pub:"Jeunesse",sup:"Imprimé",d:"Vous en avez assez des histoires de sorcières traditionnelles ? Parfait ! Car voici l'histoire de Scarrrmozzaaaa, la sorcière la plus nulle, la plus moche et la plus terrifiante de tous les temps ! Avec sa verrue sur le nez, son chat Gros Relou et ses pieds qui puent, elle prépare sa GRANDE VENGEANCE dans sa cabane au fond des bois.",isbn:"9791040125631",extraUrl:"https://m.media-amazon.com/images/I/51s0MrgHsSL._SX195_.jpg"},
  {t:"Petit Tête en l'air",a:"Lestrade Agnès de",y:"2026",ed:"Gautier-Languereau",cote:"A LES",pub:"Jeunesse",sup:"Imprimé",d:"Pour les étourderies, il n'y a pas plus fort que Petit tête en l'air ! Est-ce possible d'oublier de mettre son pantalon, de confondre le shampoing avec le dentifrice et de se tromper de maison ? Ce champion mérite bien son surnom. Mais heureusement, pour garder les pieds sur terre, il a sa famille et ses amis qui l'aiment à la folie !",isbn:"9782017348276",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782017348276-475x500-1.jpg"},
  {t:"La base secrète",a:"Bocquet Olivier",y:"2025",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeunesse",sup:"Imprimé",d:"La nuit, sur un toit, trois enfants déguisés en superhéros fuient des robots belliqueux. Le garçon glisse... et se tue ! Comment Ziad, Louna et Billie en sont arrivés là ? Pour comprendre, il faut remonter aux funérailles du père de Louna et Ziad quand frère et soeur s'étaient juré de ne plus tenter de devenir des superhéros. Une promesse qu'ils n'avaient pas tenue longtemps...",isbn:"9782808505116",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808505116-475x500-1.jpg"},
  {t:"Le temps suspendu",a:"Bocquet Olivier",y:"2024",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeunesse",sup:"Imprimé",d:"Ziad et Louna ont réussi tous les deux à se faire inviter aux Golden Powers, la soirée des récompenses pour superhéros. Mais la cérémonie ne se déroule pas tout à fait comme prévu : un pod de téléportation apparaît sur scène et des yeux géants en jaillissent et commencent à tirer dans la foule. C'est un vrai carnage parmi les superhéros présents. Ziad et Louna arrivent à fuir par le pod et se retrouvent en plein océan. Et Louna se noie... Fatiah et Amine, les parents de Ziad et Louna qui ont assisté, impuissants et tétanisés, à la retransmission télévisée du chaos et de l'horreur, sont interrogés par la police qui soupçonne leurs deux enfants d'êtres des \" supers \" ! Amine et Fatiah décident de prendre les choses en mains et s'incrustent dans l'enquête de police au grand dam de l'inspectrice qui la dirige. Dans Le Métier le plus dangereux du monde, Olivier Bocquet et Fabio Lai nous présentent une société légèrement futuriste où même les superhéros sont pervertis par l'argent et les réseaux sociaux. Ca n'empêche pas la série d'être passionnante, trépidante, émouvante et drôle. De la BD jubilatoire !",isbn:"9791034768578",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791034768578-475x500-1.jpg"},
  {t:"Terres de lumières",a:"Boussaha Illiès",y:"2024",ed:"EPA Editions",cote:"915.044 BOU",pub:"Adulte",sup:"Imprimé",d:"En quête d'un monde meilleur, Camille et Illiès parcourent les sentiers du monde. Passionnés de rencontres et d'apprentissage, ils ont quitté leur vie sédentaire pour s'aventurer là où ils ne pensaient pas aller. Un changement de vie radical les incite à réaliser des documentaires tout en partageant les coulisses de leur quotidien. Dans \" Terres de lumières \", ils reconstituent deux années de voyage, qui les ont conduits de la mer Caspienne jusqu'aux contreforts de l'Himalaya. Ils se lancent sur les traces de lieux et de peuples mythiques : les jardins d'Ispahan, le peuple Baloutche, les vallées isolées de l'Himalaya ou encore les fakirs du Sindh. Témoins de la beauté et de la diversité de notre planète, chaque photographie et chaque histoire qui l'accompagne invitent à apprendre de l'autre. Un périple fascinant où les limites du temps et de l'espace s'estompent pour laisser place à un horizon de merveilles.",isbn:"9782376711643",extraUrl:"https://covers.openlibrary.org/b/isbn/9782376711643-M.jpg"},
  {t:"La gouvernante de Marilyn",a:"Morlet Laurent",y:"2026",ed:"Charleston",cote:"R MOR",pub:"Adulte",sup:"Imprimé",d:"5 août 1962. Dans une lettre destinée à sa soeur, la gouvernante de Marilyn Monroe s'interroge : \"Est-ce moi qui l'ai tuée ? \" Rien ne prédestinait Eunice Murray, issue d'une famille très pieuse de Chicago, à côtoyer la plus grande star hollywoodienne de tous les temps. Pourtant, à l'aube de ses soixante ans, après avoir traversé une vie d'errance et de deuils, la chance semble enfin lui sourire quand elle entre au service de Marilyn. Dans l'intimité de l'hacienda d'Helena Drive, les deux femmes s'apprivoisent. Pendant neuf mois, Eunice partage les joies et les tourments de l'actrice comme personne avant elle. Jusqu'au jour où elle trouve Marilyn inanimée dans son lit. Que s'est-il véritablement passé la nuit du 4 au 5 août 1962, alors qu'elles étaient seules dans la maison ? Laurent Morlet est un producteur français établi à Los Angeles depuis une vingtaine d'années. Pour La Gouvernante de Marilyn, son premier roman, il a mené un vaste travail de recherche, mêlant témoignages et archives inédites, notamment autour de la célèbre maison d'Helena Drive.",isbn:"9782385295172",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295172-M.jpg"},
  {t:"Le pire des chevaliers",a:"Kemp Anna",y:"2026",ed:"Milan",cote:"A KEM",pub:"Jeunesse",sup:"Imprimé",d:"Riquiqui le crapaud, tout gluant et pas très beau, veut devenir un héros. Un vrai, un grand, un costaud ! Le roi des nénuphars en a assez des libellules, il se rêve chevalier, même avec ses pustules. Comme dans les contes de fées, seule une princesse pourrait l'aider et, d'un baiser, le transformer en fier et noble chevalier...",isbn:"9782408060428",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408060428-475x500-1.jpg"},
  {t:"C'est moi qui choisis !",a:"Gao Yile",y:"2026",ed:"Rue du Monde",cote:"A GAO",pub:"Jeunesse",sup:"Imprimé",d:"Un vêtement, un cadeau, un chemin... Plusieurs fois par jour, on doit décider et choisir. Il y a des choix que l'on fait sans même réfléchir, et d'autres, qui sont de véritables casse-têtes ! On hésite, on regrette... Choisir, c'est vraiment compliqué ! Dans ce livre, je vous raconte comment moi, je me débrouille quand je dois choisir !",isbn:"9782355048128",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355048128-475x500-1.jpg"},
  {t:"Encore une folle semaine pour M. Dubois",a:"Lewis-Jones Huw",y:"2026",ed:"Kimane",cote:"A LEW",pub:"Jeunesse",sup:"Imprimé",d:"Un lundi matin, M. Dubois découvre que l'ours a emprunté son vélo et l'a cassé. Les roues sont toutes tordues. Comment va-t-il pouvoir se rendre au travail ? Encore une folle semaine qui commence pour M. Dubois et il n'est pas au bout de ses surprises !",isbn:"9782383224761",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383224761-475x500-1.jpg"},
  {t:"Animaux LEGO",a:"Padulano Jody",y:"2026",ed:"Nuinui jeunesse",cote:"737.7 PAD",pub:"Jeunesse",sup:"Imprimé",d:"50 adorables animaux à construire avec des briques LEGO® ! Laisse-toi guider par les conseils de l'auteur et donne libre cours à ton imagination. Dans cet ouvrage ludique et créatif, découvre comment assembler une tigre féroce, un ours tout mignon, un cygne élégant et bien d'autres animaux encore, tous réalisés avec des briques LEGO(r) ! Pour chaque modèle, tu trouveras : - Une liste détaillée des pièces nécessaires - Des instructions claires et illustrées - Des astuces pour trouver les bonnes briques LEGO(r) - Un QR code pour accéder aux tutoriels vidéo",isbn:"9782889574452",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782889574452-475x500-1.jpg"},
  {t:"5 petits moutons",a:"Claire Céline",y:"2024",ed:"L'École des loisirs",cote:"A CHE",pub:"Jeunesse",sup:"Imprimé",d:"Cinq petits moutons jouent dans la forêt, mais ils doivent vite aller au lit avant que le soleil se couche, car le loup sort de chez lui à la nuit tombée. Hélas, les petits moutons ont oublié leurs doudous dans la forêt et, faute de moutons, le loup emporte les doudous pour en faire son repas. Les cinq petits moutons ont alors une idée pour aller sauver leurs doudous...",isbn:"9782211336840",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782211336840-475x500-1.jpg"},
  {t:"Nom d'un ours !",a:"Viale Marco",y:"2026",ed:"Hélium",cote:"A VIA",pub:"Jeunesse",sup:"Imprimé",d:"Tout le monde est au courant maintenant, les ours sont parfaitement inutiles et ils ne savent vraiment rien faire du tout. Les bonnes manières leurs sont complètement étrangères... En un mot : évitez à tout prix leur compagnie !",isbn:"9782330208165",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330208165-475x500-1.jpg"},
  {t:"Miam, ouvre grand",a:"Montanari Eva",y:"2026",ed:"Thierry Magnier",cote:"A MON",pub:"Jeunesse",sup:"Imprimé",d:"Mâchoire serrée, assiette renversée, pas question d'avaler cette bouchée ! Et si le repas quittait la table pour devenir une grande aventure à vivre en famille ?",isbn:"9791035209278",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209278-475x500-1.jpg"},
  {t:"Les Chambres noires de Lee Miller",a:"Lesieur Jennifer",y:"2026",ed:"R. Laffont",cote:"B MIL",pub:"Adulte",sup:"Imprimé",d:"Lee Miller a débuté comme mannequin, elle deviendra reporter de guerre. Elle a photographié des célébrités et des camps de concentration. Son oeil percevait ce que les autres ne voyaient pas - ou ne voulaient pas voir. Elle est née américaine, elle sera francophile, amante de Man Ray, amie intime d'Eluard, de Cocteau et de Picasso. Elle a travaillé pour Vogue, puis inventé des recettes de cuisine avant-gardistes. Elle a connu de nombreux hommes tout en cadenassant son coeur, avant de trouver le grand amour avec un gentleman surréaliste. Elle fuyait l'ennui dans les excès comme dans une folle créativité. Elle brillait par son humour, alors que pesaient de lourds secrets. Lee Miller fascine, échappe, émeut par ses multiples facettes. Du Montparnasse des Années folles à sa retraite dans la campagne anglaise, Jennifer Lesieur raconte l'existence d'une femme au courage inouï, devenue une artiste majeure du XXe siècle.",isbn:"9782221282601",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221282601-M.jpg"},
  {t:"L'île aux momies",a:"Arlène Alexandre",y:"2025",ed:"Auzou",cote:"BDJ ARL",pub:"Jeunesse",sup:"Imprimé",d:"Un voyage scolaire au pays des momies ? Voilà qui ravit Migali et ses amis, bien décidés à en profiter pour faire un maximum de bêtises. Migali est ravie : toute sa classe part en voyage scolaire sur l'île aux momies, une île très ancienne, qui a connu des milliers de civilisations passées. Le professeur Flamberge a prévu de leur visiter les pyramides dans lesquelles serait caché un trésor, génial ! Mais gare aux créatures qui hantent les couloirs de ces lieux à l'histoire effrayante !",isbn:"9791039559829",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791039559829-475x500-1.jpg"},
  {t:"L'école sous les étoiles",a:"Arlène Alexandre",y:"2025",ed:"Auzou",cote:"BDJ ARL",pub:"Jeunesse",sup:"Imprimé",d:"Les élèves sont de retour à l'Académie Royale et leur rentrée se fait pendant la nuit ! Etrange... Les élèves sont de retour à l'Académie Royale et leur rentrée se fait pendant la nuit ! Etrange... Un nouveau professeur noctambule va leur donner des cours d'astronomie. Il paraît qu'une comète magique va passer au-dessus du château et les élèves devront l'observer. Génial ! Migali est ravie d'avoir une nouvelle mission et de super occasions de faire des bêtises.",isbn:"9791039541299",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791039541299-475x500-1.jpg"},
  {t:"Organique",a:"Enders Giulia",y:"2026",ed:"Albin Michel",cote:"612 END",pub:"Adulte",sup:"Imprimé",d:"Giulia Enders entremêle avec talent et humour connaissances scientifiques et conseil pratique. L'Express On y apprend beaucoup de choses vitales, et d'autres plus inattendues et réjouissantes. A lire sans modération. Psychologies Magazine Giulia Enders met un point d'honneur à rendre accessible ce savoir sur le corps, alliant ses connaissances rigoureuses à un joli talent de conteuse. Le Nouvel obs Optant pour la même démarche de vulgarisation que pour le premier opus, à la fois plein d'humour et scientifiquement irréprochable, elle vante dans son nouvel ouvrage les mérites insoupçonnés de cinq nouveaux organes. Le Monde Avec Le Charme discret de l'intestin, son immense bestseller, Giulia Enders a inventé une nouvelle manière d'écrire la science. Dans Organique, elle nous convie à un voyage fascinant à travers notre organisme. En s'appuyant sur les découvertes les plus récentes, et grâce à son inimitable talent de conteuse, elle dessine une cartographie sensible de notre être organique et éveille un intérêt passionné pour ce qui nous est à la fois si proche et si lointain : nous-mêmes.",isbn:"9782226506603",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226506603-M.jpg"},
  {t:"You rock me",a:"Iwashita Keiko",y:"2025",ed:"Pika édition",cote:"BD YOU",pub:"Adulte",sup:"Imprimé",d:"Hibari, étudiante en graphisme, se trouve beaucoup trop sérieuse mais n arrive pas du tout à lâcher prise, ce qui l empêche d avancer dans son travail. Un jour, dans le restaurant de ramen où elle travaille, elle fait la rencontre tumultueuse de Gaku, étudiant en art dans la même université et tête d affiche dans un groupe de rock. C est un garçon libre et fougueux, aux antipodes de ce qu elle est, qui va complétement secouer la vie de Hibari et l inciter à changer totalement ses habitudes&",isbn:"9782811692100",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811692100-M.jpg"},
  {t:"You rock me",a:"Iwashita Keiko",y:"2025",ed:"Pika édition",cote:"BD YOU",pub:"Adulte",sup:"Imprimé",d:"Hibari, étudiante dans une université d art pour devenir graphiste, fait la rencontre de Gaku, un garçon très audacieux qui joue dans un groupe de musique. Après ça, la vie de la jeune fille se retrouve totalement chamboulée ! Alors que leur rapprochement devient de plus en plus intense, Hibari ne souhaite pas faire perdre des fans aux Pantera Negra&",isbn:"9782811692179",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811692179-M.jpg"},
  {t:"You rock me",a:"Iwashita Keiko",y:"2026",ed:"Pika édition",cote:"BD YOU",pub:"Adulte",sup:"Imprimé",d:"Hibari a décidé d’assumer ce qu’elle ressent, et de sortir avec Gaku. Par ailleurs, la véritable identité de « Baihuu » est révélée : le grand chanteur à succès n’est autre que l’ami d’enfance de la jeune femme, Rihito ! Alors qu’elle est abasourdie par la révélation, ce dernier vient lui faire une déclaration[xe2][x80][xa6] Avec son caractère libre et imprévisible, Gaku, de son côté, lui en fait voir de toutes les couleurs, mais cet été, Hibari est bien décidée à sortir de sa personnalité trop « rangée » !",isbn:"9791043305122",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043305122-M.jpg"},
  {t:"Les portes de Jurassia",a:"Paré-Sorel Julien",y:"2022",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeunesse",sup:"Imprimé",d:"Rex et Cory poursuivent leur chemin vers le volcan Kaliédos dans l'espoir de secourir Patchy et Gogo, toujours captifs de l'infâme général Ank. Traqués par Ovi la sorcière, ils devront traverser la mythique jungle de Troïka afin d'atteindre leur destination. Ils ne se doutent pas qu'une bouleversante révélation viendra sceller leur destin à tout jamais !",isbn:"9782897518721",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518721-475x500-1.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2023",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9791032712764",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712764-M.jpg"},
  {t:"Un goût de dolce vita",a:"Gentile Lorenza",y:"2026",ed:"Nami",cote:"R GEN",pub:"Adulte",sup:"Imprimé",d:"\"Il paraît qu'on est la somme de ses accomplissements, alors j'ai fait le calcul. Crayon en main, j'ai tout additionné. Résultat : je suis en négatif\". Si Selene est convaincue d'une chose, c'est qu'il faut assumer ses échecs. Mais alors que, la trentaine passée, sa vie se résume à une suite de déconvenues, elle ne peut s'empêcher de se demander où elle a fait fausse route. Etait-ce le dernier de ses coups de tête, l'ouverture d'un restaurant aujourd'hui au bord de la faillite, ou est-ce arrivé il y a quinze ans, lorsqu'elle a quitté sa vallée natale dans le sud de l'Italie ? En quête de réponses, elle décide de se rendre dans les Pouilles, sur les terres de son enfance. Là-bas, entre une Fiat Uno rouge, un âne aussi esseulé qu'elle et des après-midi passés en cuisine avec les gens qui l'ont vue grandir, Selene comprend qu'il faut parfois se perdre avant de trouver le bon chemin... \"Une écriture drôle et lumine use : un baume pour ce ux en quête de sens\". La Repubblica \"Une mer veilleuse invitation au lâcher-pris e et aux joies qui accompagnent l'inattendu\". Vanity Fair Lorenza Gentile est née en 1988 à Milan. Elle est l'autrice de plusieurs best-sellers parus en Italie, dont un inspiré de son expérience à la célèbre librairie parisienne Shakespeare and Company. Ses romans sont traduits dans plusieurs pays, et Un goût de dolce vita est son premier livre traduit en français. Traduit de l'italien par Samuel Sfez",isbn:"9782487606265",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487606265-M.jpg"},
  {t:"La vision de Patchy",a:"Paré-Sorel Julien",y:"2024",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeunesse",sup:"Imprimé",d:"Désormais au fait de la machination maléfique de Tyratops, Rex est plus déterminé que jamais à mettre fin à son règne ! Or, le cruel empereur met tout en oeuvre pour le capturer et ses forces du mal gagnent en puissance de jour en jour. Même Patchy, maintenant sous l'emprise de la sorcière Ovi, est devenue une redoutable rivale ! Jusqu'où Rex et ses amis sont-ils prêts à aller afin de percer les sombres mystères du grand royaume de Mézoïk ?",isbn:"9782897518769",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518769-475x500-1.jpg"},
  {t:"L'escadron ravage",a:"Sobral Patrick",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"La base d'Ultima est prise d'assaut par l'Escadron Ravage mené par Kalypso et son frère Kénian. Aidés des Magicors de Dame Kalandre, ils semblent inarrêtables... A mille lieux de là, de retour du Nirvanis, Galen et ses compagnons sont loin de se douter du drame qui se joue et des pertes subies dans leurs rangs. Le destin d'Alysia semble se jouer dans ce terrible affrontement.",isbn:"9782413087847",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782413087847-475x500-1.jpg"},
  {t:"La sorcière aux yeux de lune",a:"Dahman Myriam",y:"2025",ed:"Gallimard",cote:"C DAH",pub:"Jeunesse",sup:"Imprimé",d:"Ses yeux peuvent voir la vérité même dans les âmes les plus secrètes. Découvrez le nouveau chef-d'oeuvre des créateurs du Talisman du loup et Leina et le Seigneur des Amanites, célébrant la sincérité et le pouvoir de l'amitié.",isbn:"9782075228732",extraUrl:"https://products-images.di-static.com/image/base/9782075228732-475x500-1.jpg"},
  {t:"Le dernier des Mohicans",a:"Vermot Thibault",y:"2025",ed:"Éditions Sarbacane",cote:"C VER",pub:"Jeunesse",sup:"Imprimé",d:"Publié pour la première fois en 1826, Le Dernier des Mohicans est une vaste épopée mêlant vérité historique et personnages de fiction. Elle raconte l'expédition dans le nord-est américain, alors sauvage, d'un jeune officier anglais escortant deux soeurs vers la garnison de leur père. En chemin, ils devront déjouer pièges et embuscades des Iroquois, alliés des Français contre les Anglais dans les guerres de conquête du continent, de 1740 à 1804, et menés par le terrifiant Magua. Ils pourront en revanche s'appuyer sur Hawkeye, le chasseur blanc élevé par les Delaware alliés des Anglais, et ses deux amis Mohicans, père et fils.",isbn:"9791040805441",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040805441-475x500-1.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2024",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeunesse",sup:"Imprimé",d:"Le monde est anéanti... Partons le visiter à moto ! Après leur escale à Karuizawa, Yôko et Airi sont reparties en direction de Gunma. Sur leur chemin se trouve le fameux Mont Asama, un volcan encore actif et entrant régulièrement en éruption... et Yôko s'est soudain effondrée en respirant les gaz toxiques de ce dernier ! C'est alors qu'est apparu un jeune homme qui va leur venir en aide et les conduire jusqu'aux sources chaudes de Kusatsu...",isbn:"9791041106882",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041106882-M.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2025",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeunesse",sup:"Imprimé",d:"Nos deux motardes décident de faire une halte à l'abri qui a été le point de départ de leur périple. Une occasion pour elles de se remémorer le bon vieux temps. Elles reprendront ensuite la route vers la région du Tôhoku, au nord de l'île principale. Entre excavation de fossiles à Iwaki et pêche miraculeuse dans le lac Inawashiro, leur trépidant voyage les conduira jusqu'à Nagaoka, dans le département de Niigata.",isbn:"9791041111732",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041111732-M.jpg"},
  {t:"Médecin",a:"Bexington Carys",y:"2026",ed:"Editions Gründ",cote:"A BEX",pub:"Jeunesse",sup:"Imprimé",d:"Viens découvrir le métier de docteur avec Gabin ! Gabin est un lapin qui aime découvrir les métiers. Lequel découvrira-t-il aujourd'hui ? Ta-dam ! Aujourd'hui, il est docteur ! Tourne les roues pour l'aider à faire des radios, des bandages et bien plus encore ! Un album tout-carton animé au charme fou pour éveiller les petits. Dans la même collection : Gabin le lapin - Conducteur de train",isbn:"9782324038075",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782324038075-475x500-1.jpg"},
  {t:"L'île aux crabes",a:"Vermot Thibault",y:"2024",ed:"Éditions Sarbacane",cote:"J VER",pub:"Jeunesse",sup:"Imprimé",d:"Depuis le casse du siècle avec deux rônins pas bien méchants, Yanagi (le grand maigre) et Takata (le petit gros), Kyoko, 9 ans, court la campagne médiévale en quête d'aventures. Leur magot sur le dos, le trio s'arrête un soir, pour se restaurer, mais l'aubergiste leur apprend que tous les crabes ont disparu sur une île mystérieuse. En échange de quelques kobans, et la promesse de riz au crabe, le trio se lance alors à la pêche aux crustacés. Or, à leur arrivée sur l'île, ils découvrent que l'aubergiste les a bernés et leur a volé leur magot. Pire ! Les crabes, oui les crabes ! sont gigantesques et les pourchassent. Ils se réfugient alors dans la forêt, mais ils ne sont pas au bout de leur surprise ! Des fantômes de naufragés les attendent, tapis dans l'obscurité d'une grotte...",isbn:"9791040806394",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040806394-475x500-1.jpg"},
  {t:"L'Homme après Marceau Miller",a:"Miller Marceau",y:"2026",ed:"La Martinière",cote:"R MIL",pub:"Adulte",sup:"Imprimé",d:"Sur les rives du lac Léman, pendant près de vingt ans, Raphaël Aster a été le premier lecteur de Marceau Miller, l'écrivain à succès. Le seul à découvrir ses romans avant le monde entier. A la mort de l'auteur, Raphaël pense refermer ce chapitre de sa vie. Jusqu'au jour où il met la main sur les notes d'un mystérieux manuscrit. Une enquête laissée en suspens. Une mort qui ne ressemble pas à un accident. Une piste qui ramène Raphaël à l'année où son propre fils a disparu. Et si Marceau avait tout compris ? Et si quelqu'un avait tout fait pour que cette histoire ne voit jamais le jour ? Marceau Miller est scénariste et écrivain. Son premier roman, Le Roman de Marceau Miller, véritable phénomène en France, a suscité un engouement mondial avant même sa parution, il est désormais traduit dans quinze pays. Son adaptation en série télévisée (produite par Gaumont) sera diffusée sur France 2 à la fin de l'année 2026. Son identité demeure un mystère.",isbn:"9791040126294",extraUrl:"https://covers.openlibrary.org/b/isbn/9791040126294-M.jpg"},
  {t:"Même pas morte",a:"Rioux Geneviève",y:"2026",ed:"Stock",cote:"R RIO",pub:"Adulte",sup:"Imprimé",d:"27 mars 2016. Steph est victime d'une tentative de viol et de meurtre au coeur de la nuit. Son agresseur, qui l'a laissée pour morte, ignore qu'elle tire sa force des récits d'une autre survivante, sa mère, attaquée seize ans auparavant dans des circonstances d'une troublante similarité. Une question brûle : qui est le coupable ? Un inconnu, un ami, un proche ? Steph fera tout pour découvrir l'identité de celui qu'elle a combattu et qui l'a emmenée à la lisière de la mort. Pour comprendre son geste et, peut-être un jour, guérir. Récit d'une enquête judiciaire haletante, quête profonde de justice, ce premier roman saisissant, inspiré du vécu de l'autrice, est un cri de vie.",isbn:"9782234099449",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234099449-M.jpg"},
  {t:"Woke Up Like This",a:"Lea Amy",y:"2026",ed:"Flammarion",cote:"J LEA",pub:"Adolescent",sup:"Imprimé",d:"Organiser le bal de promo parfait est la dernière tâche parfaite à accomplir sur la liste parfaite de Charlotte Wu. Tout irait bien si l'insupportablement désinvolte (et très beau) J. T. Renner, n'avait pas décidé de lui gâcher la vie jusqu'au bout en devenant président du comité des élèves... De rivalités en sarcasmes, un \"accident de décoration\" survient et vingt-quatre heures plus tard, tous deux se réveillent côte à côte dans un lit inconnu : ils ont 30 ans et ils sont fiancés ! Passer à l'âge adulte, savourer le moment présent : une comédie romantique pétillante et irrésistible.",isbn:"9782080493712",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782080493712-475x500-1.jpg"},
  {t:"La mission de Péril",a:"Sutherland Tui",y:"2025",ed:"Gallimard jeunesse",cote:"A SUT",pub:"Jeunesse",sup:"Imprimé",d:"La cruelle reine Scarlet veut tuer Argil et les autres Dragonnets du Destin. Entre la reine déchue et son seul ami, qui Péril va-t-elle choisir, elle qui est connue pour prendre toujours les pires décisions ?",isbn:"9782075221061",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782075221061-475x500-1.jpg"},
  {t:"D'autres printemps",a:"Grimaldi Virginie",y:"2026",ed:"Flammarion",cote:"R GRI",pub:"Adulte",sup:"Imprimé",d:"Flora vient de voir son plus grand rêve s'effondrer. Pourtant, quand on l'appelle au chevet de sa grand-mère, elle envoie tout valser pour la retrouver. A son arrivée, Line, quatre-vingt-dix printemps, a une requête des plus surprenantes : Flora doit l'arracher à l'hôpital pour la conduire dans un petit village de Toscane. Pourquoi là-bas ? Personne ne lui connaît d'attaches en Italie. Flora hésite, mais Line insiste : c'est sa dernière volonté. Alors, au matin, elles fuguent. Embarquée dans un road trip insolite, Flora ignore la vraie raison de ce voyage et l'ampleur du secret qu'elle s'apprête à découvrir. L'une roule vers son passé, l'autre vers son avenir : grand-mère et petite-fille ont des choses à se dire. Elles n'imaginent rien de ce qui les attend au bout du chemin, là où l'histoire a commencé.",isbn:"9782080510655",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080510655-M.jpg"},
  {t:"L'amour est dans le thé",a:"Yamanaka Umebachi",y:"2026",ed:"Glénat",cote:"BD AMO",pub:"Adulte",sup:"Imprimé",d:"Chako a intégré l'équipe et la plantation Hananoki a été disqualifiée ! Malgré cela, Isshin et Chako continuent de s'impliquer corps et âme dans la préparation du thé roulé. Et l'annonce des résultats ne se fait pas attendre !Leur faux mariage va-t-il être révélé au grand jour ? Le concours de thé roulé connait une conclusion mouvementée tandis que la relation entre Chako et Isshin progresse à grands pas !",isbn:"9782344071427",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344071427-M.jpg"},
  {t:"Hé ho, croco !",a:"Alzial Sylvain",y:"2026",ed:"Marcel et Joachim/Gallimard Jeunesse",cote:"A ALZ",pub:"Jeunesse",sup:"Imprimé",d:"Un petit lapin gourmand, attiré par de beaux liserons charnus, s'approche de la rivière. Trop près. Un gros crocodile en profite pour l'avaler tout rond. Bien embêté, le petit lapin se demande comment il va bien pouvoir sortir de ce ventre dégoûtant. Quand il entend son geôlier se réjouir de cette belle prise d'un \"Hé hé hé\" sonore et cruel, il lui vient une idée : le lapin invite le crocodile à articuler des sons vraiment effrayants (et pas un petit Hé hé hé ridicule). Piqué dans son orgueil, le crocodile va se laisser guider par le petit lapin, comme un comédien le serait par son metteur en scène... Jusqu'au HA HA HA final, qui nécessite que le crocodile ouvre grand sa gueule. Le lapin malin en profite pour s'échapper, bien content !",isbn:"9782075233477",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075233477-475x500-1.jpg"},
  {t:"Ces grands-parents qui t'aiment infiniment",a:"Lewalle Capucine",y:"2026",ed:"Editions Casterman",cote:"A LEW",pub:"Jeunesse",sup:"Imprimé",d:"Une vibrante déclaration d'amour aux grands-parents. Sur notre planète, il y a plein de grands-parents à qui l'on donne des noms tendres ou surprenants... Mamie, Manou, Nonna, Babouchka, ou Mouty, Papy, Papou, Pépé, Grandpa, ou bien Daddy. Et parmi eux, il y a tes grands-parents qui t'aiment infiniment. Capucine Lewalle présente une joyeuse galerie de grands-parents et met en lumière ce lien si fort qui unit un petit enfant à son aïeul. Une déclaration d'amour à offrir à ceux qui tiennent une place toute particulière dans le coeur des enfants. Un grand format avec couverture cartonnée.",isbn:"9782203303607",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203303607-475x500-1.jpg"},
  {t:"Jeanne et le secret des petites voix dans la tête",a:"Charvel Johann",y:"2026",ed:"Flammarion",cote:"A CHA",pub:"Jeunesse",sup:"Imprimé",d:"Jeanne adore se promener avec sa tante Hélène et discuter avec elle, car elle écoute toujours et connaît plein de choses. Aujourd'hui, Jeanne a envie de lui confier un secret : - Tu sais, Tata, parfois je me parle dans ma tête et j'entends une petite voix... Un album éclairant sur un phénomène utile, précieux et même un peu magique, pour aider les enfants à apprivoiser leur monde intérieur.",isbn:"9782080480477",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782080480477-475x500-1.jpg"},
  {t:"C'était quoi, ce craquement ?",a:"Cali Davide",y:"2026",ed:"Éditions Sarbacane",cote:"A CAL",pub:"Jeunesse",sup:"Imprimé",d:"Deux frères sont couchés dans leur lit. L'un entend toujours des \" craquements \" et finit par communiquer sa peur à l'autre, qui est pourtant de nature beaucoup plus cool... C'est parti pour un échange d'explications fantaisistes qui feront intervenir : le parquet qui craque (mais ils ont du carrelage), le chien (mais ça ne craque pas, un chien ? ), un voleur (au 7e étage ? ), le père Noël... La vraie réponse sera toute différente ! Et l'effet épatant, pour l'enfant lecteur : rien de tel que l'humour pour balayer la peur !",isbn:"9791040808152",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040808152-475x500-1.jpg"},
  {t:"Sac à poux",a:"Amram Nicole",y:"2023",ed:"Gallimard",cote:"A AMR",pub:"Jeunesse",sup:"Imprimé",d:"Un recueil de poèmes joyeux et pleins d'humour. \"Ils ne sont pas poissons d'eau douce pas poissons scie, ni poissons-chats... On ne les voit pas dans les vagues. Mais en avril, ils seront là, dans ton dos, pour faire des blagues ! \" Un mariage d'hippopotame, un éléphant en hélico, des poux sur la tête, des moustiques qui piquent et tout plein d'oiseaux... Voici de petites poésies, comme des comptines, à apprendre ou à lire à haute voix pour se faire plaisir en jouant avec les mots !",isbn:"9782075175593",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075175593-475x500-1.jpg"},
  {t:"Bisous bisous",a:"Geis Patricia",y:"2026",ed:"Editions Casterman",cote:"A GEI",pub:"Jeunesse",sup:"Imprimé",d:"Des flaps et des pop-ups pour se faire des bisous par milliers ! Mamie Miel envoie un bisou à Grisou, qui le reçoit sur la joue. De flaps en flaps, une véritable chaîne de bisous se met en place : des bisous pour guérir, des bisous pour souhaiter un anniversaire, des bisous pour demander pardon, des bisous pour tout le monde ! Un très bel objet ludique et plein d'amour : le petit lecteur pourra lui-même déplacer le bisou, grâce au rabat, vers le copain suivant !",isbn:"9782203296510",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203296510-475x500-1.jpg"},
  {t:"Le Sac",a:"Adbåge Emma",y:"2026",ed:"Cambourakis",cote:"A HOB",pub:"Jeunesse",sup:"Imprimé",d:"Maman et papa ont fait le ménage ce week-end. On le voit tout de suite. Sauf qu'on ne peut pas ranger tant que ça sans rien jeter, pas vrai ? Et puis, ce grand sac noir, dans l'entrée, c'est suspect...",isbn:"9782386691003",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782386691003-475x500-1.jpg"},
  {t:"C'est dans ma nature !",a:"Salerno Angela",y:"2026",ed:"La Martinière",cote:"A SAL",pub:"Jeunesse",sup:"Imprimé",d:"Es-tu de nature plutôt bavarde, timide, espiègle, impatiente, câline, ou tout cela à la fois ?",isbn:"9791040126027",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040126027-475x500-1.jpg"},
