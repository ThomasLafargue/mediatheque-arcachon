  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"Après la mort du roi, alors que le prince Boiji est pressenti pour le remplacer, la reine Hiling tente de contrecarrer son accession au trône. Et comble de malchance, son ami Ombre a disparu. ©Electre 2022",isbn:"9791032712184",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712184-M.jpg"},
  {t:"Le temps de l'obsolescence humaine",a:"Patino Bruno",y:"2026",ed:"Grasset & Fasquelle",cote:"302.23 PAT",pub:"Adulte",sup:"Imprimé",d:"\"La révolution technologique que nous avons traversée en quelques décennies prépare peut-être le temps de l'obsolescence humaine. Elle s'est jouée en trois actes. L'ère de l'accès, à partir de 1989, a établi le réseau universel : un Internet accessible à chacun, avec sa promesse originelle d'un monde meilleur. Lui a succédé l'ère de la propagation avec l'invention du smartphone. Pour la première fois, nous avons tenu l'univers dans notre main. L'économie de l'attention s'est développée à une vitesse foudroyante, a ciblé notre temps et fait de nous des mines à ciel ouvert. Voici venue désormais l'ère de l'imbrication. Avec le développement des intelligences artificielles, tout se mêle. L'homme et la machine. Le vrai et le faux. Le réel devient instable et flottant. Dans cette nouvelle économie de la relation, c'est notre curiosité qui est ciblée... et notre esprit menacé. Vivons-nous les dernières années de la civilisation née de Gutenberg ? Est-il encore possible de renouer avec l'utopie première du réseau, universelle et humaniste ? \" B. P.",isbn:"9782246845348",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246845348-M.jpg"},
  {t:"Les miroirs sourient à ceux qui s'aiment",a:"Giordano Raphaëlle",y:"2026",ed:"Editions Récamier",cote:"R GIO",pub:"Adulte",sup:"Imprimé",d:"Le nouveau roman de Raphaëlle Giordano. Dans un monde où tout est apparence et image, Gaspard Palomino, lui, porte un regard singulier sur le corps. Il voit le Beau dans tout ce qui nous chagrine. Photographe, il reçoit une offre susceptible de changer sa vie : exposer dans une prestigieuse galerie new-yorkaise une série de photos inédites. Les délais sont serrés, la pression est de taille. En quête d'une inspiration forte, il trouve une muse inattendue en la personne d'Adèle, une institutrice divorcée au tempérament drôle et touchant, mais profondément complexée par le reflet de son corps dans le miroir. A travers les yeux de Gaspard, Adèle va-t-elle réussir à s'accepter et à rayonner enfin pour elle-même ? Un roman lumineux sur la force de l'authenticité et la magie de l'art lorsqu'il nous aide à nous réconcilier avec notre propre éclat. Une fois de plus, Raphaëlle Giordano excelle à révéler la beauté du réel, celle qui échappe aux standards et raconte ce que nous avons de plus vrai.",isbn:"9782385771201",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385771201-M.jpg"},
  {t:"De l'origine des espèces",a:"Kim Po-yŏng",y:"2026",ed:"Rivages",cote:"SF BOY",pub:"Adulte",sup:"Imprimé",d:"Dans un futur lointain, l'humanité a sombré dans l'oubli et la Terre n'est plus habitée que par des robots. Kay, chercheur en chimie, rencontre Cécile, une androi[u0308]de marginalisée à cause de son apparence. Inspirée par ses travaux, elle l'incite à s'aventurer dans le champ controversé de la biologie organique. Leurs recherches se heurtent à de vives résistances, d'autant plus que les plantes qu'ils s'efforcent de faire renaître dépérissent rapidement. Mais au fil des décennies, leur laboratoire s'agrandit et se mue en un lieu énigmatique dont aucun visiteur ne semble vouloir repartir",isbn:"9782743670030",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743670030-M.jpg"},
  {t:"Panique à Yosemite",a:"Le Gat Yan",y:"2023",ed:"Éditions Sarbacane",cote:"BDJ LEG",pub:"Jeunesse",sup:"Imprimé",d:"1906 c'est la panique à Yosemite ! Le légendaire enquêteur Angus Niper a été appelé par les responsables du parc national californien pour résoudre l'affaire des mystérieuses agressions commises sur des touristes... Mais quelle n'est pas leur surprise quand ils voient débarquer... une femme ! C'est Penny Sugar, l'assistante photographe de Niper. Son patron, retenu sur une enquête, l'a chargée de commencer à collecter les indices. Follette et maladroite, elle ne semble pas avoir les épaules pour assumer une telle tâche. Mais ces braves messieurs ont tort de s'en faire, ils sont entre de bonnes mains ! Angus Niper n'est en réalité qu'une couverture, qui permet à Penny, experte en combat, fine enquêteuse et habile transformiste, d'exercer son métier sans éveiller les soupçons. Penny saura-t-elle déchiffrer les énigmatiques mises en scène de l'agresseur qui détrousse les visiteurs ? Ces vols ont-ils un lien avec le mouvement spiritualiste \" Ghost Dance \" composé d'Indiens natifs du parc qui s'adonnent à la nuit tombée à d'étranges rituels ? Ou bien avec le projet de barrage défendu par le verreux sénateur Johnson ? Dans la traque qui s'annonce qui est le chasseur ? Qui est la proie ?",isbn:"9791040803584",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040803584-475x500-1.jpg"},
  {t:"Duels au collège",a:"Cazot Vero",y:"2026",ed:"Dupuis",cote:"BDJ CAZ",pub:"Jeunesse",sup:"Imprimé",d:"Punie par sa mère pour lui avoir caché qu'elle faisait de la boxe malgré son interdiction formelle, trahie par Elias, son ex-meilleur ami, qui a tout cafté, harcelée par ses camarades de classe qui ne ratent pas une occasion de se moquer de son format réduit, Colette manque terriblement de moments un peu excitants dans sa vie. Et puis Astrid, qui la persécute depuis des années dans la cour de récréation, lui propose un marché : elle arrêtera de l'embêter si Colette accepte de faire quelques combats clandestins dans la salle de sport de l'école. Pour Colette, c'est l'occasion rêvée d'enfiler à nouveau des gants de boxe et de retrouver les sensations qu'elle avait précédemment adorées. \"Mi-mouche\", c'est le poids minimum pour faire des combats de boxe. C'est désormais également une série de bande dessinée d'une grande richesse, passant de la tragédie à la comédie. Avec beaucoup d'humour et ? on s'en doute ? énormément d'émotion.",isbn:"9782808506823",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808506823-475x500-1.jpg"},
  {t:"La sorcière des Everglades",a:"Le Gat Yan",y:"2024",ed:"Éditions Sarbacane",cote:"BDJ LEG",pub:"Jeunesse",sup:"Imprimé",d:"Une nouvelle enquête impossible appelle le célèbre enquêteur Angus Nyper en Floride : une sorcière hanterait les mines de phosphate de la riche famille Golpah, l'obligeant à mettre à l'arrêt sa production. La faillite menace ! Penny Sugar, qui se fait passer pour l'assistante étourdie de Nyper, personnage qu'elle a inventé de toutes pièces pour pouvoir exercer un métier réservé aux hommes, débarque donc sur cette terre peuplée de crocodiles et de légendes séminoles effrayantes. Accueillie dans le manoir des Golpah, elle est tout de suite témoin de vives tensions entre Jerry, le fils héritier des mines, et sa soeur Elry, jeune femme amère qui ne semble pas se soucier le moins du monde de la malédiction qui frappe l'entreprise familiale. Qui est donc cette sorcière ? Quelles sont ses motivations ? Et pourquoi l'accès au sous-sol du manoir a-t-il été condamné ?",isbn:"9791040804963",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040804963-475x500-1.jpg"},
  {t:"Fechamos (on ferme)",a:"Baum Gilles",y:"2020",ed:"les Éditions des éléphants",cote:"BDJ BAU",pub:"Jeunesse",sup:"Imprimé",d:"Déserté du public, un musée est contraint de fermer ses portes définitivement. En cette nuit, le gardien Edson Arantes entame en compagnie de quelques habitués une ultime déambulation au cours de laquelle les collections sont distribuées. Le musée est détruit dans un incendie mais les objets qu'il conservait sont sauvés. Inspiré du sinistre survenu au musée national de Rio de Janeiro. ©Electre 2020",isbn:"9782372730914",extraUrl:"https://products-images.di-static.com/image/base/9782372730914-475x500-1.jpg"},
  {t:"La robe de soie",a:"Mezzalama Chiara",y:"2022",ed:"les Éditions des éléphants",cote:"BDJ MEZ",pub:"Jeunesse",sup:"Imprimé",d:"Les vieilles maisons gardent la mémoire et les secrets. Il ne faut pas avoir peur des ancêtres et des fantômes, ni les oublier.",isbn:"9782372731065",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782372731065-475x500-1.jpg"},
  {t:"Les Portes d'Odin",a:"Le Gris Jérôme",y:"2026",ed:"Glénat",cote:"BDJ LEG",pub:"Jeunesse",sup:"Imprimé",d:"Une guerrière viking n'abandonne jamais ! Skara est une jeune viking qui a reçu à la naissance un talent rare et divin : le don du Loup. Ce don fait d'elle une redoutable guerrière pouvant tenir tête à n'importe qui malgré son jeune âge ! Après la mort de sa mère - tuée par des pillards - Skara, emportée par la colère et le désespoir, incendie accidentellement un temple sacré d'Odin. Le brasier ravageur ouvre alors les portes entre les Neuf Royaumes et libère sur Midgard des monstruosités venues des mondes inférieurs. Venant visiter Skara dans ses rêves, Urd, la déesse tisseuse du Destin, lui explique que le seul moyen de réparer sa faute est de chasser elle-même ces créatures maléfiques. Alors seulement, Odin pourra lui pardonner. Accompagnée de Bojan, un jeune prêtre russe peu dégourdi, et de la sulfureuse sorcière Rùna, la jeune viking se lance alors dans une aventure digne des grandes sagas nordiques ! Avec ce récit mettant en scène une jeune adolescente au caractère colérique en quête de rédemption, Jérôme Le Gris et Letizia Depedri signent une nouvelle série épique au ton décalé. Mêlant action, loyauté et sororité, le duo nous plonge dans un récit sans temps mort où l'imaginaire de la mythologie nordique sert de décor au parcours initiatique jalonné d'épreuves de leur héroïne.",isbn:"9782344064535",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344064535-475x500-1.jpg"},
  {t:"Je suis là pour toi",a:"Parapaboom",y:"2026",ed:"Editions Amaterra",cote:"A PAR",pub:"Jeunesse",sup:"Imprimé",d:"Un livre cartonné graphique et coloré sur l'entraide, empreint d'humour et de tendresse. A chaque page, un personnage se retrouve dans l'embarras... Le lecteur soulève le rabat, le visuel évolue et hop ! Le problème est résolu. Avec la ritournelle rassurante \"Ne t'inquiète pas, je suis là pour toi\", ce livre interactif invite les tout-petits à découvrir la magie de l'entraide et la joie de partager, l'histoire est rythmée et le plaisir de la lecture à voix haute renforcé.",isbn:"9782368563878",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782368563878-475x500-1.jpg"},
  {t:"Résolutions",a:"Borecki Ludo",y:"2024",ed:"Kennes",cote:"BDJ BOR",pub:"Jeunesse",sup:"Imprimé",d:"Bienvenue dons l'univers de Léo rempli d'amitié, de guerres de nunuches, de remises en question, d'embrouilles familiales et d'histoires d'amour. En somme, une vie compliquée d'adolescente empreinte de réalisme et d'humour.",isbn:"9782380759419",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782380759419-475x500-1.jpg"},
  {t:"L'automne des aspirants",a:"Puysségur Alain T.",y:"2023",ed:"Scrineo",cote:"J PUY",pub:"Adolescent",sup:"Imprimé",d:"Qui a dit que les chats ne pouvaient pas faire de la magie ? Suivez les premières aventures de Kovhan, Bruyne, Lexios et Serenya, et découvrez avec eux les secrets du Manoir de Castlecatz... \" Il n'existe pas d'endroit plus prestigieux que le Manoir de Castlecatz pour étudier les arts occultes de la magie. C'est à Castlecatz que les Maggocatz les plus puissants sont formés. Mais pas seulement. Les meilleurs Mécanimateurs et les plus grands Alchimistes y étudient également depuis des siècles. \" Une nouvelle année de cours débute au Manoir de Castlecatz ! Kovhan rêve depuis toujours d'y entrer et de devenir Aspirant. Mais pour lui qui maîtrise si mal l'indispensable Maggocculture, triompher des épreuves d'admission n'est pas une tâche facile... Il y a pourtant pire. Une menace plane sur Castlecatz cet automne : des incidents magiques se multiplient, certains félins rapportent même avoir aperçu une horrible créature rôder dans les couloirs... Heureusement, le jeune chat peut compter sur Bruyne, son amie gourmande et malicieuse, ainsi que sur Lexios et Serenya, toujours prêts à lui filer un coup de patte !",isbn:"9782381672854",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782381672854-475x500-1.jpg"},
  {t:"Les Filles-au-Diable",a:"Taraud Christelle",y:"2026",ed:"La Découverte",cote:"305.42 TAR",pub:"Adulte",sup:"Imprimé",d:"En 1621, Anne Lauritsdatter est exécutée en tant que \" sorcière \" aux côtés de douze autres femmes, à Steilneset. En 2011, la Norvège érige un Mémorial dédié à toutes celles qui ont été brûlées vives, durant le XVIIe siècle, dans cette région du Finnmark. Celui-ci vise à éclairer le fait que ces femmes n'étaient pas des \" sorcières \" mais des victimes d'une persécution misogyne et d'un crime de masse aujourd'hui nommés féminicide. En 2022, Christelle Taraud se rend dans ce lieu si symbolique des violences systémiques contre les femmes et fait l'expérience sensible du souvenir de ces exécutions. Pensé comme un laboratoire scientifique, politique et littéraire, Les Filles-au-Diable suit les traces des \" sorcières \" de Steilneset en racontant l'histoire singulière d'un lieu au travers des expériences croisées de deux femmes : l'une, Norvégienne, venue du passé, l'autre, Française, vivant aujourd'hui. Dans la longue trame du temps qui se dessine entre 1620 et 2022, d'autres territoires (Irak, Mexique, Canada, Ghana, Rwanda, Cambodge...) ayant connu des épisodes féminicidaires paroxystiques sont convoqués. Entre récit historique, analyse politique et déambulation poétique, les parcours s'entrelacent, les voix s'entrechoquent, les récits s'enchevêtrent. Emerge alors une autre histoire des chasses aux \" sorcières \", qui fait écho à des situations très contemporaines de haine contre les femmes un peu partout dans le monde.",isbn:"9782348090585",extraUrl:"https://covers.openlibrary.org/b/isbn/9782348090585-M.jpg"},
  {t:"Les soeurs de la résistance",a:"Stuart Anna",y:"2026",ed:"City Editions",cote:"R STU",pub:"Adulte",sup:"Imprimé",d:"\"Les nazis pouvaient parader au pas de l'oie, mais leurs coeurs ne battaient pas comme un seul coeur la manière des nôtres.\" Tremblante, Hana glisse un bout de papier entre deux miches de pain. Si ce message tombe entre de mauvaises mains, la vie de sa famille sera en danger... Son coeur bat à tout rompre tandis qu'elle se faufile dans les rues bombardées de Varsovie où les nazis patrouillent sans relâche. Elle travaille pour la Résistance dans le ghetto où sont parqués tous les Juifs. Chaque jour, les Allemands fusillent et torturent les habitants. Avec l'aide de ses soeurs de combat, elle espère libérer la ville et déclencher le soulèvement. Mais Hana a le coeur lourd. Depuis des mois, elle est sans nouvelles d'Emil, son fiancé, engagé comme pilote de chasse. Et lorsqu'elle croise le regard d'un officier SS, le temps se fige. Un geste, un mot, et tout pourrait s'effondrer. Mais pour Emil, elle est prête à risquer sa vie. Pour qu'un jour enfin, ils puissent vivre libres et heureux... Un grand roman inspire d'une histoire vraie.",isbn:"9782824626321",extraUrl:"https://covers.openlibrary.org/b/isbn/9782824626321-M.jpg"},
  {t:"L'enfant des vagues",a:"Kelly Julia",y:"2026",ed:"Jean-Claude Lattès",cote:"R KEL",pub:"Adulte",sup:"Imprimé",d:"Ecosse, hiver 1900. Un petit garçon vient s'échouer sur la plage d'un village de pêcheurs. Il ressemble étrangement au fils de l'institutrice, Dorothy, disparu en mer plusieurs années auparavant. Lorsque Skerry est enseveli sous la neige, Dorothy accepte de s'occuper de l'enfant jusqu'à ce qu'il puisse rentrer chez lui. Mais, à mesure que le passé refait surface, les secrets de cette communauté très soudée resurgissent. Et Dorothy doit se confronter à nouveau à Joseph, le pêcheur solitaire qu'elle a passé les dernières années à fuir... Traduit de l'anglais (Royaume-Uni) par Claire Desserrey \"un premier roman très réussi\" Livres hebdo",isbn:"9782709674577",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709674577-M.jpg"},
  {t:"Une vie si lointaine",a:"Stedman M. L.",y:"2026",ed:"Stock",cote:"R STE",pub:"Adulte",sup:"Imprimé",d:"Australie-Occidentale, 1958. Depuis des générations, les MacBride vivent à Meredith Downs, une ferme de cinq mille hectares perdue au coeur de l'outback. Quand, sur une route déserte, le patriarche Phil dévie de sa trajectoire pour éviter un kangourou, c'est toute la famille qui vole en éclats. A travers les vies d'âmes isolées cherchant refuge face aux tempêtes de l'existence, M. L. Stedman explore comme nulle autre les liens qui fédèrent une communauté. Un roman époustouflant sur la résilience et le dévouement dont nous sommes capables pour protéger ceux que nous aimons.",isbn:"9782234100022",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234100022-M.jpg"},
  {t:"Le Dernier Passager",a:"Gürsel Nedim",y:"2026",ed:"Actes Sud",cote:"R GUR",pub:"Adulte",sup:"Imprimé",d:"Deniz Cakir vit à Paris avec sa femme Pénélope depuis des années. Pour les besoins d'un documentaire revenant sur sa carrière d'écrivain, il part pour Istanbul où il espère retrouver Songül, sa maîtresse. Durant le vol, il convoque les fantômes de son passé, retraçant le parcours des différents membres de sa famille dans l'Europe du XXe siècle. Le temps d'un dernier voyage, Deniz tisse le fil de son destin façonné par les guerres et les déracinements et célèbre l'écriture comme ultime rempart face à l'oubli. D'un rivage à l'autre, Nedim Gürsel pose un regard intime et politique sur la Turquie d'hier et d'aujourd'hui.",isbn:"9782330216122",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216122-M.jpg"},
  {t:"Ce qu'il nous reste à aimer",a:"Dupuis Camille",y:"2026",ed:"R. Laffont",cote:"R DUP",pub:"Adulte",sup:"Imprimé",d:"Roxane a tout pour être heureuse. Un mari aimant. De grands enfants. Des amies fidèles. Un bel appartement à Nice. Et des certitudes bien établies. Oui, Roxane a tout pour être heureuse. Mais elle a aussi un terrible secret...",isbn:"9782221285039",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221285039-M.jpg"},
  {t:"Les Fantômes de Shearwater",a:"McConaghy Charlotte",y:"2026",ed:"Gaïa",cote:"R MCC",pub:"Adulte",sup:"Imprimé",d:"Dominic Salt et ses trois enfants sont les gardiens de Shearwater, une île perdue au milieu de l'océan Austral. Abritant la plus grande banque de graines au monde, le site accueillait jusqu'à il y a peu de nombreux chercheurs que la montée des eaux a contraints à partir. C'est aux Salt, désormais seuls sous la menace inexorable des élé-ments, qu'il revient de choisir les semences qui seront sauvées et dont l'avenir de l'humanité pourrait bien dépendre. Un soir de tempête, une femme s'échoue sur le rivage, miraculeusement en vie. D'où vient-elle ? Et que cherche-t-elle ? Bientôt, des secrets enfouis referont surface. Et chacun devra affronter ses fantômes. Mêlant suspense, réflexion écologique et tragédies familiales, Charlotte McConaghy signe un thriller polyphonique addictif sur la quête de communion et de beauté dans un monde au bord du précipice.",isbn:"9782330216139",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216139-M.jpg"},
  {t:"Un jour sans femme",a:"Colombani Laetitia",y:"2026",ed:"Iconoclaste (l')",cote:"R COL",pub:"Adulte",sup:"Imprimé",d:"Islande. A la mort de sa meilleure amie, tuée par son compagnon, Katla se lance un défi inédit : organiser une grève des femmes dans le monde entier, pour dénoncer les violences et les inégalités. Japon. Michiko, jeune salariée enceinte, est harcelée par son patron. Salvador. Ana María, ouvrière à l'usine, se bat pour sa fille, condamnée à trente ans de prison pour suspicion d'avortement. Sénégal. Hawa, urgentiste, tente de sauver une enfant quand le trauma de son passé ressurgit. Katla, Michiko, Ana María et Hawa ne se connaissent pas, mais toutes décident de dire non. Elles étaient seules, elles seront des millions. Sans les femmes, le monde s'arrêtera-t-il de tourner ? Et s'il suffisait d'un jour pour tout changer ?",isbn:"9782378804978",extraUrl:"https://covers.openlibrary.org/b/isbn/9782378804978-M.jpg"},
  {t:"Le lynx boréal",a:"Bauduret Sylvain",y:"2026",ed:"Editions de la Gouttière",cote:"BDJ BAU",pub:"Jeunesse",sup:"Imprimé",d:"Dans les sous-bois, un lynx est en quête d'un nouveau territoire. Sa recherche est rendue difficile par les routes qui scindent la forêt et empêchent d'explorer librement. Alors quand un autre lynx arrive pour défendre sa parcelle, il faut choisir : lutter, ou braver le danger des voitures...",isbn:"9782357961494",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357961494-M.jpg"},
  {t:"Le renard roux",a:"Bauduret Sylvain",y:"2025",ed:"Editions de la Gouttière",cote:"BDJ BAU",pub:"Jeunesse",sup:"Imprimé",d:"Un renardeau et sa maman partent en recherche de nourriture... Mais lorsque la renarde se retrouve coincée dans un piège, le petit désormais seul n'a d'autre choix que d'apprendre à chasser par lui-même ! Tiens, il semble y avoir quelque chose d'intéressant du côté de ce potager...",isbn:"9782357961258",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357961258-M.jpg"},
  {t:"Maypops",a:"Decoin Didier",y:"2026",ed:"Stock",cote:"R DEC",pub:"Adulte",sup:"Imprimé",d:"Ce roman s'inspire d'une histoire vraie.  Un soir de mars 1944 en Caroline du Sud, Etat ségrégationniste alors sous l'emprise du Ku Klux Klan, deux petites filles blanches prennent leur vélo pour aller cueillir des maypops, une variété de passiflore aux couleurs éclatantes. On retrouvera leurs corps sans vie dans un marécage d'eau croupie.  Georges Stinney Jr., un jeune Noir de quatorze ans, a eu le malheur d'être le dernier à leur adresser la parole. Le garçon est accusé, condamné sans preuves après un simulacre de procès et exécuté deux mois plus tard sur la chaise électrique. Soixante-dix ans après, le procès sera réouvert.   Didier Decoin, que les faits divers ont toujours inspiré, nous emmène à la suite de la juge Lucy Mc Gillish, chargée d'étudier la révision éventuelle du jugement, et de son greffier noir, Goliath, dans la ville d'Alcolu où l'odeur des marais prend à la gorge. Qui a tué les deux innocentes fillettes ? Qui avait intérêt à juger en toute hâte l'enfant d'une famille pauvre ? Voluptueuse et imagée, la langue du romancier nous transporte du paradis des maypops à l'enfer du petit George.",isbn:"9782234096479",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234096479-M.jpg"},
  {t:"A nous, demain",a:"Giannone Francesca",y:"2026",ed:"Albin Michel",cote:"R GIA",pub:"Adulte",sup:"Imprimé",d:"Après le succès de La Porteuse de lettres, lauréat du prix Bancarella, Francesca Giannone signe un roman d'amour poignant et un magnifique portrait de femme.  Sud de l'Italie, fin des années 1950. Agnese et son frère Lorenzo veulent perpétuer l'oeuvre de leur grand-père : la savonnerie familiale \"Casa Rizzo\" . Ce rêve se brise lorsque leur père, désireux d'une autre vie, leur annonce la vente de l'entreprise. Si Lorenzo claque la porte, Agnese, passionnée par son métier, accepte de travailler pour le nouveau propriétaire. Elle veut préserver l'héritage de sa famille et créer de nouvelles fragrances, mais elle se heurte à son patron, véritable despote. L'amour de Giorgio, un marin originaire de Savone, va lui faire prendre conscience de sa valeur et l'inciter à se rebeller. Où est le vrai combat : retenir à tout prix le passé ou accueillir les promesses de demain ?",isbn:"9782226501240",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226501240-M.jpg"},
  {t:"Danser sur les volcans",a:"Manel Laure",y:"2026",ed:"Michel Lafon",cote:"R MAN",pub:"Adulte",sup:"Imprimé",d:"Huit femmes embarquent pour un road-trip de deux semaines en Islande. Elles n'ont rien en commun, ou presque. Il y a Rose et Lou, le duo mère-fille ; Stéphanie, célibataire sans enfant ; Sarah et Chloé, les deux jeunes Parisiennes ; Delphine, la cinquantenaire casanière ; Carole, la prof de yoga, et Nadine, la retraitée renfrognée. Entre écarts générationnels, personnalités et visions de la vie différentes, il n'est pas toujours facile de faire groupe. Pourtant, de cascades en confidences, de marches en révélations, ce voyage pourrait les transformer au-delà de ce qu'elles avaient imaginé. Et si, au coeur de cette terre sauvage, elles découvraient ce qui les unit vraiment ?",isbn:"9782749962061",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749962061-M.jpg"},
  {t:"L'Atelier des Sorciers",a:"Shirahama Kamome",y:"2026",ed:"Pika édition",cote:"BD ATE",pub:"Jeunesse",sup:"Imprimé",d:"Coco et les sorciers ont établi un plan pour stopper la sangsue-rideau qui déferle sur la ville. Malheureusement, l'opération semble vouée à l'échec à cause des intempéries. Mais Coco a une idée et elle se précipite vers le danger avec Agathe pour tenter de régler la situation... Le plan va-t-il être finalement couronné de succès ?",isbn:"9791043307751",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043307751-M.jpg"},
  {t:"Parfois, je suis triste",a:"Bowles Paula",y:"2026",ed:"Chantecler",cote:"A BOW",pub:"Jeunesse",sup:"Imprimé",d:"Votre enfant est parfois triste. Il veut rester dans son coin et n'a pas envie de jouer. C'est tout à fait normal et cela fait partie de son développement. Ce livre aidera votre enfant à reconnaître la tristesse, à la comprendre et à mieux la gérer. La petite histoire lui montrera comment retrouver le sourire d'une manière simple.",isbn:"9782803465002",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782803465002-475x500-1.jpg"},
  {t:"5 petits moutons",a:"Claire Céline",y:"2024",ed:"L'École des loisirs",cote:"A CHE",pub:"Jeunesse",sup:"Imprimé",d:"Cinq petits moutons jouent dans la forêt, mais ils doivent vite aller au lit avant que le soleil se couche, car le loup sort de chez lui à la nuit tombée. Hélas, les petits moutons ont oublié leurs doudous dans la forêt et, faute de moutons, le loup emporte les doudous pour en faire son repas. Les cinq petits moutons ont alors une idée pour aller sauver leurs doudous...",isbn:"9782211336840",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782211336840-475x500-1.jpg"},
  {t:"Spy X Family",a:"Endo Tatsuya",y:"2026",ed:"Kurokawa",cote:"BD SPY",pub:"Jeunesse",sup:"Imprimé",d:"Sauvez le monde avec l'élite des agents (très) spéciaux : la famille Forger ! Une comédie d'espionnage pétillante ! Loid a l'opportunité de se renseigner lors d'une consultation de Melinda. Quels secrets de Donovan Desmond lui seront dévoilés ? A la rentrée scolaire, Anya se retrouve dans des classes différentes en fonction de son niveau. Cela l'amène à être impliquée dans un conflit international !",isbn:"9791042021030",extraUrl:"https://covers.openlibrary.org/b/isbn/9791042021030-M.jpg"},
  {t:"Au nom d'Amra",a:"Deschard Jean-Gaël",y:"2026",ed:"Vents d'Ouest",cote:"BDJ DES",pub:"Jeunesse",sup:"Imprimé",d:"Qui survivra au Jugement d'Amra ? Alors qu'Asmodée et Oni reviennent tout juste de leur périlleuse mission à Ferroc, le royaume de Sayran est en proie au chaos : un culte fanatique, celui d'Amra, a pris le contrôle de la ville, imposant sa foi par la force et la peur, et demandant expressément la libération de Sainte Namielle, leur Semi-déus guérisseuse. Mais les négociations tournent court, et pour écraser Amra, la Reine Bérénice n'hésite pas à libérer les plus dangereux des Semi-Déus enfermés depuis des années dans le Cloître Doré. Pendant ce temps, Asmodée et Orphée tentent un plan pour essayer de raisonner les Amraïtes. Mais Antios, l'archonte d'Amra, impose bientôt un jugement divin : les pouvoirs des Semi-Déus doivent être purifiés ou éradiqués. La tension monte, les alliances se brisent et les trahisons se multiplient. Une guerre sainte est sur le point d'éclater, opposant fanatiques, résistants et Semi-Déus. Ces derniers, longtemps utilisés comme armes, doivent choisir : se soumettre, fuir... ou se battre. Dans ce nouveau tome, les masques tombent, les secrets éclatent, et la frontière entre foi et folie devient floue. Un album captivant, entre intrigues politiques, manipulations et suspense, qui nous offre son florilège de personnages et une héroïne attachante dans un univers empreint de mystère.",isbn:"9782749310336",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310336-475x500-1.jpg"},
  {t:"Chérie",a:"Coste Sophie",y:"2026",ed:"Editions Mazarine",cote:"R COS",pub:"Adulte",sup:"Imprimé",d:"Cinq femmes. Une manipulation sans limite. Claire, Maud, Sophie, Esther et Nour. Toutes ont cru à des promesses. Toutes ont été trahies. Entre Genève, Paris et Londres, ces femmes vont glisser en silence dans une relation toxique. Jusqu'au jour où la vérité éclate. Mais au fond... qui manipule qui ? Dans ce roman saisissant, Sophie Coste explore avec une précision chirurgicale les mécanismes invisibles de la domination perverse sentimentale. Postface de la psychothérapeute Anne-Clotilde Ziegler.",isbn:"9782213734118",extraUrl:"https://covers.openlibrary.org/b/isbn/9782213734118-M.jpg"},
  {t:"La vie entière",a:"Fombelle Timothée de",y:"2026",ed:"Gallimard",cote:"R FOM",pub:"Adulte",sup:"Imprimé",d:"\"Hier j'ai eu dix-neuf ans, mais il y a sous mes mains cette nuit une femme qui se met à exister dans ma chambre, bavarde et vieille. Elle descend le clavier comme un escalier d'honneur. Une femme très âgée qui parle et me survivra. C'est moi\". Paris sous l'Occupation. Claire attend son chef de réseau, dont le retard laisse présager le pire. Elle devrait quitter l'appartement. C'est la règle. Mais elle reste et tape à la machine, inventant sa vie avec cet homme qu'elle aime en secret : les baisers sur les toits, l'amour fou, les enfants, la mer, la vieillesse heureuse, et tous les miracles ordinaires d'un temps de paix. Dans l'urgence de cette nuit où l'existence ne tient qu'à un fil, Claire se sauve par les mots et crée sur le papier l'espace d'une vie entière. Habitué des récits au long cours - Tobie Lolness, Vango, Alma -, Timothée de Fombelle célèbre ici en quelques pages virtuoses la toute-puissance de l'écriture et de l'imaginaire.",isbn:"9782073132543",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073132543-M.jpg"},
  {t:"Le crime d'Halloween",a:"Christie Agatha",y:"2024",ed:"Paquet",cote:"BD ZIE",pub:"Adulte",sup:"Imprimé",d:"Fin octobre, dans le petit village de Woodleigh Common, on fête sorcières et fantômes. Rowena Drake, personnalité importante de la localité, reçoit petits et grands pour une soirée mémorable ! Mais, devant l'assistance médusée, une des jeunes participantes déclare avoir déjà assisté à un meurtre. Bien sûr, personne ne prend au sérieux cette jeune fille connue pour ses mensonges. Or, en fin de soirée, son cadavre est retrouvé dans la bibliothèque. La fète est terminée, les affaires sérieuses commencent pour Hercule Poirot ! Ses petites cellules grises vont avoir fort à faire afin de découvrir l'assassin !",isbn:"9782889324644",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889324644-M.jpg"},
  {t:"Haley",a:"Oda Eiichirō",y:"2026",ed:"Glénat",cote:"BD ONE",pub:"Jeunesse",sup:"Imprimé",d:"Se hisser sur les épaules des géants ! Maintenant qu'elle a débarqué sur Erbaf, Robin peut enfin fêter ses retrouvailles tant attendues avec Sauro. Mais alors que de nouvelles aventures débutent dans cette contrée inconnue, des personnages pour le moins inquiétants font leur apparition. Faut-il y voir le présage d'une tempête ? ! Les aventures de Luffy à la poursuite du One Piece continuent !",isbn:"9782344068922",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344068922-M.jpg"},
  {t:"Les filles d'Oxford",a:"Miller Joanna",y:"2026",ed:"R. Laffont",cote:"R MIL",pub:"Adulte",sup:"Imprimé",d:"Angleterre, 1920. Pour la première fois en prés de mille ans d'existence, la plus célèbre université du monde ouvre ses portes aux femmes. Portées par leur rêve d'émancipation, quatre jeunes étudiantes intègrent Oxford. Dora, Beatrice, Otto et Marianne viennent d'horizons différents, mais le destin les a réunies et scelle entre elles une amitié aussi improbable qu'indéfectible. Alors que la misogynie est encore partout, que la grippe espagnole fait toujours des ravages, et que les fantômes de la Grande Guerre hantent encore les salles d'études et les mémoires, leur solidarité sera leur atout le plus précieux. Tandis qu'elles participent à une page nouvelle de l'Histoire, ces quatre jeunes femmes apprennent surtout á écrire la leur.",isbn:"9782221273609",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221273609-M.jpg"},
  {t:"Sept jours",a:"Colin Fabrice",y:"2026",ed:"Calmann-Lévy",cote:"R COL",pub:"Adulte",sup:"Imprimé",d:"\" Je l'imagine, flottant au-dessus des prairies, dansant au coeur des clairières. Je me raconte des histoires parce qu'elle en est devenue une elle-même\". Un soir de neige, un couple se dispute dans sa voiture. Les enfants dorment sur la banquette arrière. Après vingt ans de complicité, Marie a trompé Julien. Le ton monte. Marie descend, claque la portière. Julien feint de poursuivre sa route, mais il fait nuit, c'est la tempête, alors il rebrousse chemin. La forêt s'étend, impénétrable. Julien ratisse les environs pendant des heures : aucune trace de Marie. Une enquête est lancée ; elle ne donnera rien. Sept ans s'écoulent, sept ans pendant lesquels Julien et les enfants doivent apprendre à vivre avec le mystère absolu de cette disparition. Jusqu'à ce qu'un soir, on frappe à la porte... Un monde sur le point de basculer, des enjeux intimes bouleversants... Fabrice Colin se penche avec délicatesse sur ceux qui restent, leur deuil impossible, leurs blessures, leurs amitiés, leurs amours. Au fond : leur humanité.",isbn:"9782702195345",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702195345-M.jpg"},
  {t:"You rock me",a:"Iwashita Keiko",y:"2026",ed:"Pika édition",cote:"BD YOU",pub:"Adulte",sup:"Imprimé",d:"Hibari a décidé d’assumer ce qu’elle ressent, et de sortir avec Gaku. Par ailleurs, la véritable identité de « Baihuu » est révélée : le grand chanteur à succès n’est autre que l’ami d’enfance de la jeune femme, Rihito ! Alors qu’elle est abasourdie par la révélation, ce dernier vient lui faire une déclaration[xe2][x80][xa6] Avec son caractère libre et imprévisible, Gaku, de son côté, lui en fait voir de toutes les couleurs, mais cet été, Hibari est bien décidée à sortir de sa personnalité trop « rangée » !",isbn:"9791043305122",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043305122-M.jpg"},
  {t:"You rock me",a:"Iwashita Keiko",y:"2025",ed:"Pika édition",cote:"BD YOU",pub:"Adulte",sup:"Imprimé",d:"Hibari, étudiante dans une université d art pour devenir graphiste, fait la rencontre de Gaku, un garçon très audacieux qui joue dans un groupe de musique. Après ça, la vie de la jeune fille se retrouve totalement chamboulée ! Alors que leur rapprochement devient de plus en plus intense, Hibari ne souhaite pas faire perdre des fans aux Pantera Negra&",isbn:"9782811692179",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811692179-M.jpg"},
  {t:"You Rock me",a:"Iwashita Keiko",y:"2026",ed:"Pika édition",cote:"BD YOU",pub:"Adulte",sup:"Imprimé",d:"Après avoir hésité jusqu'au bout à montrer son travail à la fameuse Fête des arts de l'université, Hibari gagne assez confiance en elle pour se lancer, grâce aux encouragements de Gaku. Pendant ce temps, sa meilleure amie, Airi, cherche une occasion d'exprimer ses sentiments à un autre membre du groupe, Jô...",isbn:"9791043306396",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043306396-M.jpg"},
  {t:"L'île aux momies",a:"Arlène Alexandre",y:"2025",ed:"Auzou",cote:"BDJ ARL",pub:"Jeunesse",sup:"Imprimé",d:"Un voyage scolaire au pays des momies ? Voilà qui ravit Migali et ses amis, bien décidés à en profiter pour faire un maximum de bêtises. Migali est ravie : toute sa classe part en voyage scolaire sur l'île aux momies, une île très ancienne, qui a connu des milliers de civilisations passées. Le professeur Flamberge a prévu de leur visiter les pyramides dans lesquelles serait caché un trésor, génial ! Mais gare aux créatures qui hantent les couloirs de ces lieux à l'histoire effrayante !",isbn:"9791039559829",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791039559829-475x500-1.jpg"},
  {t:"L'école sous les étoiles",a:"Arlène Alexandre",y:"2025",ed:"Auzou",cote:"BDJ ARL",pub:"Jeunesse",sup:"Imprimé",d:"Les élèves sont de retour à l'Académie Royale et leur rentrée se fait pendant la nuit ! Etrange... Les élèves sont de retour à l'Académie Royale et leur rentrée se fait pendant la nuit ! Etrange... Un nouveau professeur noctambule va leur donner des cours d'astronomie. Il paraît qu'une comète magique va passer au-dessus du château et les élèves devront l'observer. Génial ! Migali est ravie d'avoir une nouvelle mission et de super occasions de faire des bêtises.",isbn:"9791039541299",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791039541299-475x500-1.jpg"},
  {t:"Une unique lueur",a:"Vargas Fred",y:"2026",ed:"Flammarion",cote:"R VAR",pub:"Adulte",sup:"Imprimé",d:"- Vous avez regarde les photos, Danglard ? De la scène du crime ? demanda Adamsberg. - Cela va de soi. - Et donc ? Cela vous dit quelque chose ? Parce qu'à moi, oui. - Tiens. Et cela vous raconte quoi ? - Mais justement, rien. C'est quelque chose que je ne sais pas alors que cela me dit quelque chose. Donc ? - Aucune idée. - Faites un effort, nom d'un chien. - Désolé, commissaire, dit Danglard avec une pointe d'indifférence. - Bien. Réunion plénière dans quinze minutes. Il nous faut comprendre. - Comprendre quoi ? - Mais le quelque chose, commandant. On commence par là.",isbn:"9782080160713",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080160713-M.jpg"},
  {t:"La tour des mensonges",a:"Sobral Patrick",y:"2024",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Les Légendaires Résistance démarre 20 ans après le grand cycle des Légendaires. Le monde a vécu de belles années de paix mais aujourd'hui les descendants de nos héros doivent reprendre les armes pour défendre Alysia ! La lutte contre les Célestes continue. Malgré les soins de Toopie, Eloa détient toujours les pouvoirs du Dieu-Roi Akamandis. A terme, ceux-ci pourraient bien détruire tout Alysia... Nos héros ont besoin du peuple elfique pour la sauver. Seul obstacle : la tour de Fatamorgana, forteresse imprenable et meurtrière, qu'il leur faudra détruire pour accéder au monde des Elfes...",isbn:"9782413083139",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413083139-475x500-1.jpg"},
  {t:"Les coeurs sont faits pour être brisés",a:"Rosnay Tatiana de",y:"2026",ed:"Albin Michel",cote:"R ROS",pub:"Adulte",sup:"Imprimé",d:"Un matin, l'annonce de la mort prématurée de Marlo von Graf fait le tour du monde. La célèbre romancière lègue son dernier manuscrit à Audrey, une ancienne rivale, aujourd'hui libraire. Ce texte, qui retrace l'histoire d'un triangle amoureux, confronte soudain Audrey à son premier amour. C'était il y a trente ans... De Londres aux rives du lac d'Annecy en passant par le Paris d'Oscar Wilde, autour de ces deux femmes aussi opposées que la lime et le soleil, Tatiana de Rosnay tisse un suspense amoureux envoûtant sur la jalousie, la rédemption et la frontière trouble entre réalité et fiction. Faut-il toujours croire ce que racontent les écrivains ?",isbn:"9782226504555",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226504555-M.jpg"},

const resolvedUrl={};
const badTitles=new Set();

// Résout l'illustration d'un livre une seule fois, met en cache le résultat (succès ou échec)
async function resolveCover(doc){
  if(resolvedUrl[doc.t]!==undefined) return resolvedUrl[doc.t];
  if(badTitles.has(doc.t)) return null;
  const urls=buildUrls(doc);
  if(!urls.length){ badTitles.add(doc.t); resolvedUrl[doc.t]=null; return null; }
  const url=await tryUrlsAsync(urls);
  resolvedUrl[doc.t]=url;
  if(!url) badTitles.add(doc.t);
  return url;
}

function makeFace(cls,doc,knownUrl){
  const face=document.createElement('div');
  face.className=cls;
  face.style.background='#000';

  if(knownUrl){
    setFaceCover(face,knownUrl,doc);
  } else {
    resolveCover(doc).then(url=>{ if(url && face.isConnected) setFaceCover(face,url,doc); });
  }
  return face;
}

function setFaceCover(face,url,doc,attempt){
  attempt=attempt||0;
  const img=document.createElement('img');
  img.className='cover-img';
  img.alt='';
  img.onerror=()=>{
    img.remove();
    if(attempt===0 && doc){
      // 1er échec : on retente une résolution fraîche pour ce même livre
      delete resolvedUrl[doc.t];
      resolveCover(doc).then(retryUrl=>{
        if(retryUrl && face.isConnected) setFaceCover(face,retryUrl,doc,1);
        else { removeFromPool(doc); fallbackToOtherCover(face,doc); }
      });
    } else {
      removeFromPool(doc);
      fallbackToOtherCover(face,doc);
    }
  };
  img.src=url;
  face.appendChild(img);
}

// Une source qui a échoué deux fois est retirée du pool : on ne la retentera plus
function removeFromPool(doc){
  if(!doc) return;
  goodPool=goodPool.filter(e=>e.doc.t!==doc.t);
}

// En dernier recours, on remplace par une autre couverture du pool déjà confirmée fonctionnelle
// (jamais de case vide : on retombe toujours sur une illustration qui a déjà fonctionné)
function fallbackToOtherCover(face,excludeDoc,triedTitles){
  if(!face.isConnected || !goodPool.length) return;
  triedTitles=triedTitles||new Set();
  if(excludeDoc) triedTitles.add(excludeDoc.t);
  const candidates=shuffle(goodPool.filter(e=>!triedTitles.has(e.doc.t)));
  const pool=candidates.length?candidates:shuffle(goodPool);
  const pick=pool[0];
  const img=document.createElement('img');
  img.className='cover-img';
  img.alt='';
  img.onerror=()=>{
    img.remove();
    triedTitles.add(pick.doc.t);
    // On a essayé suffisamment de candidats différents : on n'insiste pas indéfiniment,
    // mais on retente toujours avec un nouveau candidat tant qu'il en reste un non testé
    if(triedTitles.size<goodPool.length) fallbackToOtherCover(face,null,triedTitles);
  };
  img.src=pick.url;
  face.appendChild(img);
}

let displayed=[],flipTimer=null,popClose=null,goodPool=[],flipQueue=[];

// Teste tous les livres en parallèle au démarrage, ne garde que ceux dont l'illustration charge réellement
async function buildGoodPool(){
  const results=await Promise.all(BOOKS.map(async doc=>{
    const url=await resolveCover(doc);
    return url?{doc,url}:null;
  }));
  return results.filter(Boolean);
}

// Pioche le prochain livre illustré dans une file mélangée (pool de livres confirmés), en évitant les doublons déjà affichés
function nextBookForFlip(){
  if(!goodPool.length) return null;
  if(!flipQueue.length) flipQueue=shuffle(goodPool.map((_,i)=>i));
  const shownTitles=new Set(displayed.map(d=>d&&d.t));
  for(let k=0;k<flipQueue.length;k++){
    const idx=flipQueue[k];
    if(!shownTitles.has(goodPool[idx].doc.t)){
      flipQueue.splice(k,1);
      return goodPool[idx];
    }
  }
  const idx=flipQueue.shift();
  return goodPool[idx];
}

function buildGrid(){
  const mosaic=document.getElementById('mosaic');
  let pool=shuffle(goodPool);
  while(pool.length<44) pool=[...pool,...shuffle(goodPool)];
  const slots=pool.slice(0,44);
  displayed=slots.map(s=>s.doc);
  slots.forEach((entry,i)=>{
    const card=document.createElement('div'); card.className='card'; card.dataset.index=i;
    const inner=document.createElement('div'); inner.className='card-inner';
    inner.appendChild(makeFace('card-front',entry.doc,entry.url));
    const backEntry=slots[(i+22)%slots.length];
    inner.appendChild(makeFace('card-back',backEntry.doc,backEntry.url));
    card.appendChild(inner);
    card.addEventListener('click',()=>openPopup(i));
    mosaic.appendChild(card);
  });
}

function startFlipping(){
  if(flipTimer) clearInterval(flipTimer);
  let lastIndex=-1;
  flipTimer=setInterval(()=>{
    const next=nextBookForFlip();
    if(!next) return; // sécurité : aucun livre illustré disponible
    const cards=[...document.querySelectorAll('.card')];
    // On exclut la tuile retournée juste avant : jamais deux fois de suite la même
    const candidates=cards.filter(c=>parseInt(c.dataset.index)!==lastIndex);
    const pick=candidates[Math.floor(Math.random()*candidates.length)];
    // On met à jour la face actuellement cachée (celle qui va devenir visible), jamais l'inverse
    const isFlipped=pick.classList.contains('flipped');
    const hiddenCls=isFlipped?'card-front':'card-back';
    pick.querySelector('.'+hiddenCls).replaceWith(makeFace(hiddenCls,next.doc,next.url));
    pick.classList.toggle('flipped');
    displayed[parseInt(pick.dataset.index)]=next.doc;
    lastIndex=parseInt(pick.dataset.index);
  },FLIP);
}

function openPopup(i){
  const doc=displayed[i]; if(!doc) return;
  document.getElementById('popup-title').textContent=doc.t||'';
  document.getElementById('popup-author').textContent=doc.a||'';
  const m=[]; if(doc.y) m.push('Paru en '+doc.y); if(doc.ed) m.push('chez '+doc.ed);
  document.getElementById('popup-meta').textContent=m.join(' ');
  document.getElementById('popup-summary').textContent=doc.d||'';
  document.getElementById('pi-cote').textContent=doc.cote||'—';
  document.getElementById('pi-public').textContent=doc.pub||'—';
  document.getElementById('pi-support').textContent=doc.sup||'—';

  const wrap=document.getElementById('popup-cover-wrap');
  const cov=document.getElementById('popup-cover');
  wrap.classList.remove('on'); cov.src='';

  const showPopupCover=url=>{
    cov.onload=()=>{ if(cov.naturalWidth>10) wrap.classList.add('on'); };
    cov.onerror=()=>{ wrap.classList.remove('on'); };
    cov.src=url;
  };

  resolveCover(doc).then(url=>{ if(url) showPopupCover(url); });

  document.getElementById('popup-overlay').classList.add('active');
  clearTimeout(popClose);
  const bar=document.getElementById('popup-timer-progress');
  bar.style.transition='none'; bar.style.width='100%';
  bar.getBoundingClientRect();
  bar.style.transition=`width ${POPUP}ms linear`; bar.style.width='0%';
  popClose=setTimeout(closePopup,POPUP);
}

function closePopup(){
  document.getElementById('popup-overlay').classList.remove('active');
  clearTimeout(popClose);
}

document.getElementById('popup-close').addEventListener('click',closePopup);
document.getElementById('popup-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('popup-overlay'))closePopup();});

async function init(){
  goodPool=await buildGoodPool();
  buildGrid();
  startFlipping();
}
init();
</script>
