const FLIP=5000, POPUP=60000;

function toASIN(isbn13){
  if(!isbn13||!isbn13.startsWith('978')||isbn13.length!==13) return null;
  const d=isbn13.slice(3,12);
  let s=0; for(let i=0;i<9;i++) s+=parseInt(d[i])*(10-i);
  const c=(11-(s%11))%11;
  return d+(c===10?'X':String(c));
}

function buildUrls(doc){
  const urls=[];
  if(doc.extraUrl) urls.push(doc.extraUrl);
  const asin=toASIN(doc.isbn);
  if(asin){
    urls.push(`https://images-na.ssl-images-amazon.com/images/P/${asin}.01.LZZZZZZZ.jpg`);
    urls.push(`https://m.media-amazon.com/images/P/${asin}.01._SX300_.jpg`);
    urls.push(`https://images-eu.ssl-images-amazon.com/images/P/${asin}.01._SX300_.jpg`);
  }
  if(doc.isbn&&doc.isbn.startsWith('978'))
    urls.push(`https://covers.openlibrary.org/b/isbn/${doc.isbn}-L.jpg`);
  return urls;
}

// Essaie chaque URL et renvoie une Promise résolue avec l'URL valide, ou null si aucune ne fonctionne
function tryUrlsAsync(urls){
  return new Promise(resolve=>{
    function attempt(list){
      if(!list.length){ resolve(null); return; }
      const [url,...rest]=list;
      const img=new Image();
      img.onload=()=>{
        (img.naturalWidth>10 && img.naturalHeight>img.naturalWidth*0.8) ? resolve(url) : attempt(rest);
      };
      img.onerror=()=>attempt(rest);
      img.src=url;
    }
    attempt(urls);
  });
}

  {t:"Alba",a:"De Boel Anne-Catherine",y:"2003",ed:"Pastel",cote:"A BOE",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9782211071079",extraUrl:"https://covers.openlibrary.org/b/isbn/9782211071079-M.jpg"},
  {t:"Frigiel et Fluffy / Le secret d'Oriel",a:"Frigiel (youtubeur)",y:"2019",ed:"Slalom",cote:"J FRI",pub:"Adolescent",sup:"Imprimé",d:"Enora, la mère de Frigiel, est bien décidée à invoquer le Dévoreur à la surface pour éradiquer la magie. Impitoyable, elle a quitté l'Ender avec le bloc de commande sans un regard pour son fils. Coincés dans la dimension, le mage et ses compagnons doivent délivrer Alice, retenue en otage par Ourepo, tout en esquivant les attaques du Dévoreur. Mais le monstre affamé semble indestructible. Frigiel et ses amis parviendront-ils à quitter l'Ender sans dommages ? Retrouveront-ils la trace de la prêtresse du Culte avant qu'elle n'invoque le dévoreur dans les Farlands ? Auront-ils le temps d'atteindre les îles célestes d'Oriel pour y trouver de l'aide ? Une chose est sûre : Enora n'a pas fini de les surprendre...",isbn:"9782375541234",extraUrl:"https://static.fnac-static.com/multimedia/Images/FR/NR/8f/84/aa/11175055/1540-1/tsp20191009152557/Le-secret.jpg"},
  {t:"La vérité toute moche",a:"Kinney Jeff",y:"2012",ed:"Seuil",cote:"J KIN",pub:"Jeunesse",sup:"Imprimé",d:"Greg grandit et découvre les secrets de la « puberté », cette étrange maladie que son copain Robert espère bien ne pas attraper... Entre les deux amis, rien ne va plus. Après une grosse dispute, Greg perd son plus fidèle allié et se retrouve seul pour faire face à des problèmes de plus en plus nombreux... Pourra-t-il échapper à l'appareil dentaire ? Participer aux soirées du collège et se faire de nouveaux amis ? En tout cas, il devra apprendre à se remettre en question et faire face à une douloureuse vérité... Lire un extrait sur www.journaldundegonfle.fr",isbn:"9782021060119",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021060119-M.jpg"},
  {t:"Le Secret de la grue blanche",a:"Huet-Gomez Christelle",y:"2011",ed:"nobi nobi !",cote:"C HUE",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9782918857075",extraUrl:"https://covers.openlibrary.org/b/isbn/9782918857075-M.jpg"},
  {t:"La musique",a:"Ledu Stéphanie",y:"2008",ed:"Milan",cote:"J 780.83 LED",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9782745931368",extraUrl:"https://covers.openlibrary.org/b/isbn/9782745931368-M.jpg"},
  {t:"La montagne",a:"Falière Amélie",y:"2019",ed:"Mes Premières Découvertes",cote:"551.43 FAL",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9782075126137",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075126137-M.jpg"},
  {t:"La mer",a:"Ahrweiller Lucile",y:"2013",ed:"Milan",cote:"J 551.46 AHR",pub:"Jeunesse",sup:"Imprimé",d:"A travers 5 grandes parties intitulées \"C'est quoi, la mer ? \", \"Une journée à la mer\", \"Une journée à la plage\", \"Une promenade en mer\" et \"Les animaux des mers\", l'enfant découvre les mots du milieu, nomme l'univers marin tel qu'il peut le découvrir : les marées, la tempête, les bateaux, les poissons, les sports nautiques, la baignade, le pique-nique, la plongée, l'aquarium, le port, le sous-marin...",isbn:"9782745961778",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782745961778-475x500-1.jpg"},
  {t:"J'attends un petit frère ou une petite soeur",a:"Dolto-Tolitch Catherine",y:"2019",ed:"Gallimard-Jeunesse Giboulées",cote:"J 155.44 DOL",pub:"Jeunesse",sup:"Imprimé",d:"\"Bientôt nous aurons un bébé à la maison. Je me demande bien si c'est un frère ou une soeur. À partir de maintenant tout sera différent, ça me fait tout drôle, mais je crois que ce sera bien\".",isbn:"9782075115339",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075115339-M.jpg"},
  {t:"Chaos",a:"Ogaki Philippe",y:"2020",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Les Mythics ont réussi à libérer Gaïa. Mais, sans le savoir, ils ont aussi rendu sa liberté au Chaos. Le Mal tente d'en prendre le contrôle et un combat s'engage au pied de la tour Eiffel. ©Electre 2020",isbn:"9782413019671",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413019671-M.jpg"},
  {t:"Sacrées sorcières",a:"Bagieu Pénélope",y:"2020",ed:"Gallimard",cote:"BDJ DAH",pub:"Jeunesse",sup:"Imprimé",d:"Les sorcières n'ont qu'un but, éliminer les enfants qu'elles détestent, grâce à leur apparence tout à fait ordinaire. Un jeune garçon qui vit avec sa grand-mère, chasseuse de sorcières, apprend à les reconnaître à ses dépens, tout en déjouant un complot mené par la Grandissime sorcière. ©Electre 2020",isbn:"9782075126939",extraUrl:"https://www.base-orb.fr/visuels-pim/image/base/9782075126939-475x500-1.jpg"},
  {t:"Le Gardien",a:"Sobral Patrick",y:"2004",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Danaël, Gryf, Jadina, Shimy et Razzia, cinq justiciers aux pouvoirs fantastiques, font la fierté du monde d'Alysia. Mais, lors d'un ultime combat les opposant à Darkhell, le Sorcier Noir, une épouvantable malédiction s'abat sur leur monde : tous ses habitants - eux compris !- retrouvent leur apparence d'enfant. Aujourd'hui, rejetés par les leurs, les cinq Légendaires veulent briser le sortilège... L'aventure ne fait que commencer !",isbn:"9782847894776",extraUrl:"https://www.bedetheque.com/cache/thb_couv/LegendairesLes2_20112004.jpg"},
  {t:"Gourmandise",a:"Ogaki Philippe",y:"2022",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Parvati débarque à Montréal chez son cousin qui cherche à mettre au point des pilules pour guérir l'obésité. Elle prend cependant le temps de se téléporter régulièrement pour retrouver les autres Mythics, en particulier Albi, qu'elle trouve un peu trop proche d'Amir à son goût. Mais l'heure n'est pas à la jalousie car le maléfique Wendigo cherche à contrefaire les recherches de son cousin. ©Electre 2022",isbn:"9782413041047",extraUrl:"https://products-images.di-static.com/image/base/9782413041047-475x500-1.jpg"},
  {t:"Coeur d'etoile",a:"Colman Stéphane",y:"2013",ed:"Dupuis",cote:"BDJ BAT",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9782800160429",extraUrl:"https://images-eu.ssl-images-amazon.com/images/I/51R0PZPfVQL.jpg"},
  {t:"La soeur à la perle",a:"Riley Lucinda",y:"2020",ed:"Charleston",cote:"R RIL",pub:"Adulte",sup:"Imprimé",d:"A la mort de leur père, énigmatique milliardaire qui les a adoptées aux quatre coins du monde lorsqu'elles étaient bébés, CeCe d'Aplièse et ses soeurs se retrouvent dans la maison de leur enfance, Atlantis, un magnifique château sur les bords du lac de Genève. CeCe, la quatrième soeur, ne s'est jamais vraiment sentie à sa place, et au décès de son père, elle se retrouve complètement perdue. N'ayant que les quelques indices que ce dernier lui a laissés, elle part à la recherche de ses origines jusque dans la chaleur et la poussière du centre rouge de l'Australie. Alors qu'elle découvre des secrets enfouis depuis bien longtemps, elle commence à penser que ce vaste et sauvage continent pourrait lui offrir quelque chose qu'elle a toujours cru impossible : un sentiment d'appartenance et un foyer... La Soeur à la perle est le quatrième tome de la série événement Les Sept Soeurs, qui a conquis 20 millions de lecteurs dans le monde entier. A travers ces romans au souffle unique, peuplés de personnages inoubliables, liés par les drames et l'amour, Lucinda Riley a affirmé comme jamais auparavant son immense talent, créant un nouveau genre littéraire à part entière. Déjà cinq tomes parus aux éditions Charleston !",isbn:"9782368125151",extraUrl:"https://covers.openlibrary.org/b/isbn/9782368125151-M.jpg"},
  {t:"Monstre rose",a:"Dios Olga de",y:"2026",ed:"Père Fouettard",cote:"A DIO",pub:"Jeunesse",sup:"Imprimé",d:"Monstre Rose est trop grand, trop rose, trop tout. Enfin c'est ce qu'il croit, ais ce ne sont pas les autres qui vont le contredire. Alors direction un monde à sa taille !",isbn:"9782371651494",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782371651494-475x500-1.jpg"},
  {t:"Curiosity",a:"Motum Markus",y:"2019",ed:"Gallimard",cote:"J 523.4 MOT",pub:"Jeunesse",sup:"Imprimé",d:"Une aventure qui transcende la fiction et vous entraîne au-delà des étoiles, au coeur d'une des plus grandes questions de l'univers. Connaissez-vous Curiosity ? Découvrez l'incroyable histoire de ce rover envoyé sur Mars pour essayer de comprendre pourquoi cette planète autrefois accueillante est devenue hostile aujourd'hui. Doté de 17 caméras, de 6 roues motrices, d'un laboratoire portatif et d'un rayon laser, Curiosity sillonne Mars à la recherche d'une trace de vie et de la vérité.",isbn:"9782075136785",extraUrl:"https://products-images.di-static.com/image/base/9782075136785-475x500-1.jpg"},
  {t:"Histoire mondiale du Covid",a:"Audureau William",y:"2026",ed:"Allary éditions",cote:"614 AUD",pub:"Adulte",sup:"Imprimé",d:"La pandémie de Covid-19 est un événement planétaire dont la véritable histoire restait à écrire. Une histoire au suspense haletant, thriller planétaire où se mêlent disputes scientifiques, épidémie de désinformation et rivalités géopolitiques. Chacun de nous l'a vécu en direct, dans un étourdissant flot d'informations et de fausses informations qui enveloppa cette tragédie d'un épais brouillard. Comment les événements se sont-ils enchaînés ? Que savaient scientifiques et politiques ? Qu'ignoraient-ils ? Quelles informations ont été dissimulées ? Grâce aux milliers de documents rendus public, il est aujourd'hui possible de le savoir. Notes déclassifiées des agences de renseignement, courriels entre chercheurs, directives du gouvernement chinois, témoignages sous serment de décideurs américains, sms entre ministres et présidents européens... Autant de pièces d'un immense puzzle que William Audureau a réunies et ordonnées pour proposer cette première histoire mondiale du Covid. Une histoire qui ressemble d'abord à un compte à rebours, tant cette tragédie était une catastrophe annoncée, avant de virer au film catastrophe. Une histoire au suspense haletant, thriller planétaire où se mêlent disputes scientifiques, épidémie de désinformation et rivalités géopolitiques.",isbn:"9782370736048",extraUrl:"https://covers.openlibrary.org/b/isbn/9782370736048-M.jpg"},
  {t:"Je sommes plusieurs",a:"Bayard Pierre",y:"2025",ed:"Les Editions de Minuit",cote:"155.2 BAY",pub:"Adulte",sup:"Imprimé",d:"Plutôt que de présenter l'être humain comme déchiré entre des pulsions contradictoires, ne serait-il pas plus simple d'admettre que chacun·e d'entre nous abrite différentes personnes, qui parfois ne se connaissent même pas ? Une telle évolution théorique, qui devrait logiquement nous inciter à prendre plusieurs noms, contribuerait à apaiser la vie en société, puisqu'il n'y aurait plus de sens à reprocher aux politiciens de changer d'avis, à accuser son conjoint d'adultère ou à condamner les malfaiteurs pour des actes qu'ils ont commis à leur insu.",isbn:"9782707356857",extraUrl:"https://covers.openlibrary.org/b/isbn/9782707356857-M.jpg"},
  {t:"Le pacte de Venise",a:"Massimi Fabiano",y:"2026",ed:"Albin Michel",cote:"R MAS",pub:"Adulte",sup:"Imprimé",d:"\"Massimi s'impose définitivement comme l'un des plus sérieux prétendants à la succession de Philip Kerr\". Le Figaro Magazine Place Saint-Marc, juin 1934. Benito Mussolini et Adolf Hitler se rencontrent pour la première fois en public. Dans la foule des chemises noires, l'ancien commissaire Siegfried Sauer et son compère, Mutti. En lien avec la résistance antifasciste, ils sont venus pour mettre à exécution une mission à haut risque. Mais une mystérieuse affaire les détourne de leur projet. Une affaire qui concerne l'intimité de Mussolini et la vie d'une femme... Après le succès de L'Ange de Munich et des Démons de Berlin, Fabiano Massimi poursuit une fresque sombre et captivante, et nous raconte une histoire de bruit et de fureur, de passion charnelle et de scandale, celle d'Ida Dalser, première épouse du Duce, mère de leur fils caché. Il puise ainsi parmi les grands secrets de l'Histoire la matière d'un suspense hors norme. Traduit de l'italien par Renaud Temperini",isbn:"9782226500373",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226500373-M.jpg"},
  {t:"Le vin des poilus",a:"Corbeyran",y:"2024",ed:"Glénat",cote:"BD COR",pub:"Adulte",sup:"Imprimé",d:"1916. Dans la Vallée de la Marne, les soldats français englués dans la boue des tranchées se donnent du courage avec une ration quotidienne de vin. Mais ils sont nombreux à juger ce breuvage imbuvable. Certains prétendent que le bon vin de Bourgogne est réservé aux officiers, tandis que les soldats hériteraient de la piquette ! Parmi eux, Gaston, un jeune homme dont le père était vigneron prend le débat à cœur. Les différentes appartenances régionales liées à la production de vin avivent parfois les tensions entre les poilus qui restent attachés à leur terroir. Alors, quand le mercanti, le marchand civil, vient ravitailler les tranchées, Gaston commande sa ration en évitant l’absinthe dont d’autres raffolent… Pendant ce temps, à Reims, des kilomètres de caves abritent un trésor que les obus n’ont pas encore détruit : le champagne ! La collection s’agrandit avec un album qui revisite l’histoire viticole de la France, prise dans la tourmente de la Grande Guerre de 14-18. Une période noire pour la production au cours de laquelle le marché mondial du vin prend un tournant. Un portrait documenté qui rend hommage à la diversité des cépages et nous rappelle l’effort de guerre des femmes pendant le conflit.",isbn:"9782344041932",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344041932-M.jpg"},
  {t:"Vivre",a:"Badinter Robert",y:"2025",ed:"Flammarion",cote:"320.944 BAD",pub:"Adulte",sup:"Imprimé",d:"\"Au cours d'un discours, j'avais prononcé cette phrase : \"Quand on parle des morts, les morts nous écoutent. \" Je ne parle jamais de mes sentiments personnels, mais la condition des enfants de déportés est tout de même singulière. Je ne crois pas qu'il faille perdre le souvenir et je ne crois pas que l'on doive vivre pour le souvenir et dans le souvenir des morts. Honorer les morts, s'en souvenir et vivre. Je crois que c'est ça, le véritable hommage à leur rendre. En essayant d'être fidèle à ce qu'ils pensaient, mais surtout : vivre\". Dans ce récit intime, Robert Badinter raconte sa vie avec une éblouissante sincérité. En 2006, pour l'INA et la Fondation pour la Mémoire de la Shoah, il convoque ses souvenirs d'enfance, dont l'arrestation et la déportation de son père. En 2023, toujours pour l'INA, l'homme de l'abolition livre son dernier entretien. Un témoignage pour l'histoire.",isbn:"9782080147158",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080147158-M.jpg"},
  {t:"Secret Bodyguard T09",a:"Masamitsu Nigatsu",y:"2026",ed:"Pika édition",cote:"BD SEC",pub:"Adulte",sup:"Imprimé",d:"Sôji Kodô a fondé son propre clan composé uniquement de lui et de sa progéniture dans le but de renverser le pouvoir de la société criminelle. Ses cibles à abattre sont, naturellement, le chef du clan Jingû, ainsi que son héritière supposée Honeko Akabane. Après avoir déjoué l'attaque sur le festival du lycée, Ibuki rentre chez lui pour y trouver l'un des fils de Sôji Kodô, Yuma Kodô. Ce dernier fait sauter la maison de Ibuki qui se retrouve à l'hôpital pour guérir de ses blessures. Dans le même temps, le clan Kodô se met en mouvement, et sa prochaine cible n'est autre que Kuran, la benjamine du clan !",isbn:"9791043303661",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303661-M.jpg"},
  {t:"La grande guerre du Péloponnèse",a:"Canfora Luciano",y:"2026",ed:"Perrin",cote:"938.05 CAN",pub:"Adulte",sup:"Imprimé",d:"Si les conflits de grande ampleur n'ont pas manqué dans l'Antiquité, la guerre du Péloponnèse est celui qui a le plus frappé les esprits. Durant la seconde moitié du Ve siècle avant notre ère, elle met aux prises la cité d'Athènes - démocratique - et celle de Sparte - sous régime oligarchique-, ainsi que les coalitions formées autour d'elles. Depuis, les historiens n'ont cessé de s'y pencher, elle est enseignée dans les écoles militaires et les spécialistes de géopolitique y recourent volontiers pour décrypter les relations internationales, notamment les rapports des Etats-Unis et de la Chine. Si cet affrontement se caractérise par un bilan matériel et humain considérable, il annonce aussi la fin de la domination politique et artistique d'Athènes, marquée par la construction du Parthénon et l'avènement des célèbres tragédies d'Eschyle, Sophocle et Euripide. Enfin et surtout, l'histoire de la guerre du Péloponnèse nous a été racontée en détail par celui que l'on considère, davantage encore que son prédécesseur immédiat, Hérodote, comme le premier historien au sens moderne du terme, Thucydide. Le livre de Luciano Canfora sur cette guerre \"totale\" ne se veut pas un simple récit exhaustif des événements. Classiciste aguerri, l'auteur multiplie aussi les observations judicieuses au sujet du texte de Thucydide et d'autres auteurs postérieurs qui ont traité du conflit, sans jamais faire l'économie d'un récit haletant qui permet une lecture de l'histoire au plus près des lieux où elle s'est jouée. Ainsi l'application des analyses de Thucydide à d'autres épisodes historiques ou à la compréhension de la situation internationale actuelle se révèle-t-elle extrêmement éclairante. En construisant son livre autour du texte thucydidien, Canfora en fait la brillante démonstration.",isbn:"9782262112301",extraUrl:"https://covers.openlibrary.org/b/isbn/9782262112301-M.jpg"},
  {t:"Le chat sauvage",a:"Luciani Brigitte",y:"2016",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeunesse",sup:"Imprimé",d:"Alors que Roussette, la petite renarde, se pose de plus en plus questions sur ses origines, un chat sauvage, accompagné de genettes, prépare un spectacle destiné à montrer son agilité dans les arbres. Mais ce chat dissimule un secret sur sa véritable identité ; un secret qui va aider Roussette à comprendre que sa nouvelle famille l'aime plus que tout. A travers cette histoire, les auteures abordent autant l'acceptation de la différence que l'idée de rester soi-même et de s'ouvrir aux autres. Le bonheur n'est jamais bien loin ! Chaque tome de la série sera dorénavant proposé à partir de 2026 en version souple à plus petit format (195 x 260) avec un bonus de huit pages supplémentaires (jeux, cahier didactique...). Le tout à petit prix !",isbn:"9782205074451",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205074451-475x500-1.jpg"},
  {t:"Dune : Maison Corrino",a:"Herbert Brian",y:"2026",ed:"Huginn & Muninn",cote:"BD HER",pub:"Adulte",sup:"Imprimé",d:"Complots. trahisons et luttes de pouvoir rythment l'empire galactique. A l'aube d'une nouvelle ère. la Maison Corrino tente de préserver sa domination alors que la Maison Atréides menace de bouleverser l'équilibre des forces. L'Empereur Shaddam. décidé à saboter la production d'épice pour imposer son substitut. précipite la galaxie dans la tourmente. Tandis que les Atréides et la Maison Vernius s'unissent contre les Tleilaxu sur lx. le duc Leto et Jessica préparent la venue de leur enfant, cible de multiples intrigues, dont celle des Bene Gesserit. Profitant de la vulnérabilité du fief des Atréides. les Harkonnen lancent leur assaut...",isbn:"9782386400810",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386400810-M.jpg"},
  {t:"Je fais le plein de protéines à l'Air Fryer",a:"Lalbaltry Juliette",y:"2026",ed:"Larousse",cote:"641.5 LAL",pub:"Adulte",sup:"Imprimé",d:"Préparez des recettes croustillantes, rassasiantes et délicieusement protéinées ! Découvrez 150 recettes adaptées à toutes les machines d'air fryer. Que ce soit pour un petit-déjeuner rapide, un dîner gourmand ou une collation healthy, laissez-vous guider par des idées audacieuses et équilibrées. Au menu : burger veggie, baked oats framboise et chocolat, nuggets de poisson panés à la noix de coco, moelleux chocolat-banane, bowl de riz croustillant, chou rouge et saumon rôti... Des recettes variées pour tous les appétits et toutes les envies !",isbn:"9782036091979",extraUrl:"https://covers.openlibrary.org/b/isbn/9782036091979-M.jpg"},
  {t:"Ta naissance",a:"Le Guen Sandra",y:"2024",ed:"Editions Casterman",cote:"A LEG",pub:"Jeunesse",sup:"Imprimé",d:"Au commencement, il y a nous, tes parents. Il y a moi, ta maman. Et il y a moi, ton papa. Nous nous sommes rencontrés. Nous nous sommes aimés. Tant et tant que nous ne voulions plus nous quitter. Et puis... tu es arrivé. A travers les voix d'un couple de gorilles, une approche sensible pour aborder avec son enfant les moments qui ont précédé sa naissance, sa venue au monde et ses premiers instants de vie.",isbn:"9782203247895",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203247895-M.jpg"},
  {t:"Ti'Tigre",a:"Prasadam-Halls Smriti",y:"2026",ed:"Éditions Sarbacane",cote:"A PRA",pub:"Jeunesse",sup:"Imprimé",d:"Ti'Tigre en a assez. Quand il demande : Je peux manger tout le gâteau ? Je peux aller à l'école en pyjama ? la réponse à ses bonnes idées est toujours : non. Et pourquoi donc ? C'est pas juste ! Pourtant, le craquant Ti'Tigre au caractère bien trempé et aux émotions fortes, n'a peur de rien. Enfin presque...",isbn:"9791040808237",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791040808237-475x500-1.jpg"},
  {t:"Revenez, amis martiens !",a:"Thinard Florence",y:"2026",ed:"Thierry Magnier",cote:"J THI",pub:"Adolescent",sup:"Imprimé",d:"Quand Eva, une collégienne solitaire et harcelée, recueille deux chats errants miraculeusement sauvés des eaux, elle ignore qu'elle se trouve face à FWFX et WDWC, des extraterrestres en mission secrète sur Terre. Nom de Mars, cette rencontre va changer sa vie ! C'est le début d'une aventure pleine de rebondissements, de télescopages improbables et de répliques inoubliables. Prêts, bande de schmulaââgs ramollis ? ! Des chats venus d'une autre planète, une ado en détresse, une vache complice : un roman aussi déjanté que jubilatoire !",isbn:"9791035209308",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209308-475x500-1.jpg"},
  {t:"Secret Bodyguard T08",a:"Masamitsu Nigatsu",y:"2026",ed:"Pika édition",cote:"BD SEC",pub:"Adulte",sup:"Imprimé",d:"Cela fait maintenant six mois qu'Ibuki est garde du corps. Alors que la terminale 4 se prépare à vivre son dernier festival lycéen, un nouveau défi se présente à elle : Ogami et Nozu attaquent durant ledit festival ! Heureusement, Ibuki a la brillante idée de déguiser leur affrontement en pièce de théâtre. Un spectacle époustouflant pour tout le lycée qui réserve son lot de surprises !",isbn:"9791043303647",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303647-M.jpg"},
  {t:"L'Invention de la douleur",a:"Fritsch Valerie",y:"2026",ed:"Plon",cote:"R FRI",pub:"Adulte",sup:"Imprimé",d:"Un roman troublant de force et de profondeur sur la dépendance mentale et physique, la tendresse et la cruauté de l'amour, qui explore les thèmes de la mythomanie et le syndrome de Münchhausen. August Drach grandit dans une maison à la périphérie d'une petite bourgade silencieuse et étrange. Son père, déçu par lui-même et par la vie, maltraite son fils, qui trouve du réconfort auprès de sa mère, Lily. Mais un jour, le père quitte sa famille sans donner d'explications et sa mère ne parvient plus à lui donner la même tendresse. Elle se met progressivement à affaiblir l'enfant pour qu'il continue d'avoir besoin d'elle. Ce n'est que des années plus tard qu'August, grâce à des accidents de la vie et la présence chaleureuse de son médecin, parvient à se libérer de l'emprise de sa mère. Il essaie alors de mener sa propre vie. Mais comment un adulte peut-il résoudre l'énigme d'une enfance qui a entremêlé si profondément cruauté et amour ? Comment briser le cycle des mensonges et des tromperies ? Et que se passe-t-il lorsque, des années plus tard, cet homme ose revenir à la source de sa douleur ?",isbn:"9782259320900",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259320900-M.jpg"},
  {t:"Le Porte-bonheur",a:"Luciani Brigitte",y:"2023",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeunesse",sup:"Imprimé",d:"- \"Moi je veux bien un porte-bonheur comme Martis\". - \"Quoi ? Ne me dis pas que tu crois à ces trucs ? \" Décidément, blaireaux et renards ne sont pas pareils. Et quand il s'agit des croyances, évidemment, ils ne sont jamais d'accord. Quand leur ami Martis arrive avec un porte-bonheur, Carcajou se moque et décide de prouver à tout le monde qu'il n'y a rien de magique dans ces amulettes en bois. Mais l'affaire n'est pas simple, l'expérience tourne mal et le doute s'installe. Si tout ça n'est qu'une question de hasard, comment se fait-il que certains semblent clairement plus chanceux que d'autres ? Avoir de la chance, finalement, à quoi ça tient ? Chaque tome de la série sera dorénavant proposé à partir de 2026 en version souple à plus petit format (195 x 260) avec un bonus de huit pages supplémentaires (jeux, cahier didactique...). Le tout à petit prix !",isbn:"9782205077964",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205077964-475x500-1.jpg"},
  {t:"Les mondes de demain",a:"Gave Charles",y:"2025",ed:"Pierre de Taillac",cote:"330 GAV",pub:"Adulte",sup:"Imprimé",d:"Avec lucidité, Charles Gave décrypte les vingt prochaines années : la fin de l'hégémonie du dollar, l'essor de l'océan Indien, le nouvel axe Pékin-Moscou-Delhi et le crépuscule de l'Occident. Là où beaucoup redoutent le chaos, il discerne autre chose : l'avènement d'un monde plus décentralisé, plus libre et donc plus prospère. Un essai visionnaire, qui ne se contente pas d'annoncer l'avenir : il nous aide à le comprendre.",isbn:"9782364453197",extraUrl:"https://covers.openlibrary.org/b/isbn/9782364453197-M.jpg"},
  {t:"Les extraterrestres ne sont pas verts !",a:"Quadri Marco",y:"2026",ed:"Rue du Monde",cote:"A QUA",pub:"Jeunesse",sup:"Imprimé",d:"As-tu déjà vu un objet suspect dans le ciel ou une silhouette étrange se dessiner dans l'ombre ? Sache qu'il ne s'agissait pas d'un extraterrestre ! Pour l'instant, rien ne prouve qu'ils existent, et encore moins qu'ils soient verts... On a pourtant le droit de rêver, il y a tellement de place dans l'espace !",isbn:"9782355048111",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355048111-475x500-1.jpg"},
  {t:"Napoléon, la France et l'Europe",a:"Lignereux Aurélien",y:"2026",ed:"Seuil",cote:"944.05 LIG",pub:"Adulte",sup:"Imprimé",d:"Et si embrasser d'un seul regard ou presque le monde napoléonien dans son ensemble devenait possible ? Avec l'infographie, la Grande Armée, le Grand Empire et la vie de Napoléon le Grand se déploient autrement, en une synthèse inventive, qui renouvelle les points de vue et met à la portée de chacun les débats et découvertes de l'historiographie internationale de ces dernières années. Déjà familière à l'histoire militaire napoléonienne pour figurer l'organisation des armées, l'évolution des campagnes ou la présentation des batailles, la visualisation graphique restitue sous une forme expressive et accessible les questionnements d'histoire politique, sociale ou économique.",isbn:"9782021594782",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021594782-M.jpg"},
  {t:"Lyra",a:"Loyer Anne",y:"2026",ed:"Editions Casterman",cote:"J LOY",pub:"Jeunesse",sup:"Imprimé",d:"On dit que la musique adoucit les moeurs... dans cette famille, elle rapproche les soeurs ! Depuis des semaines, Lyra se prépare pour l'audition de flûte qui lui permettra d'impressionner Léonard Belcanto, son père chef d'orchestre... mais dans sa tête se joue une vraie tempête. Elle s'interroge sur l'absence d'attention de ce père qui refait sa vie de son côté et semble la remplacer, elle s'alarme de ne pas être prête le jour J et, pour couronner le tout, elle doit gérer les amours de sa soeur Antara avec le doux Virgile... Courageuse, assidue et attentive aux autres sans même s'en rendre compte, Lyra va tout faire pour que sa famille entière soit réunie lors de l'audition et s'assurer que ce petit monde reste accordé !",isbn:"9782203300156",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300156-475x500-1.jpg"},
  {t:"Les araignées, 100 infos à connaître",a:"Collectif",y:"2024",ed:"Piccolia",cote:"J 595.4 DEL",pub:"Jeunesse",sup:"Imprimé",d:"Un concept pertinent de documentaire, avec photos et illustrations, de 100 infos, avec des quizz et des activités à réaliser. 100 faits numérotés, accompagnés de magnifiques illustrations, plongeront les enfants dans une aventure irrésistible de bout en bout, racontée avec humour grâce à des détails et des dessins amusants. Les jeunes esprits curieux y apprécieront les quiz et activités qui leur permettront de tout connaître sur leur sujet favori !",isbn:"9782753075221",extraUrl:"https://m.media-amazon.com/images/I/51JtYYV9EFL._SX95_.jpg"},
  {t:"Danemark et îles Féroé",a:"O'Malley Thomas",y:"2025",ed:"Lonely Planet",cote:"914.8 DAN",pub:"Adulte",sup:"Imprimé",d:"Le guide de référence pour organiser votre voyage de rêve au Danemark ! Lonely Planet, l'éditeur n?1 de guides de voyage dans le monde. Ce guide tout en couleur vous accompagne dans votre voyage pour découvrir les incontournables du Danemark et sortir des sentiers battus . De Copenhague à Kronborg Slo, découvrez tous les trésors repérés par nos auteurs sur le terrain . - Les sites incontournables d'un voyage au Danemark : Copenhague, les jardin de Tivoli, Refshaleoen, Kronborg Slot, le château de Hamlet, Frederiksborg Slot, le Versailles danois, Egeskov Slot, Moesgaard Museum, le parc à thème Legoland ... . - Des conseils d'experts Lonely Planet mis à jour régulièrement : les meilleures adresses (restaurants, cafés, hôtels), des recommandations pratiques pour organiser son voyage... - Les plus belles expériences à vivre au Danemark pour un voyage hors du commun : des activités et sorties originales avec toutes les informations nécessaires et les astuces pour les réaliser au mieux. - Des sélections d'itinéraires thématiques à pied, à vélo ou en voiture : balade gourmande à Copenhague, à vélo dans la péninsule de Jungshoved, histoire, poneys sauvages et moulin à vent sur l'île de Langeland ... Mais aussi des itinéraires régionaux pour découvrir le meilleur du Danemark, en toute saison, quel que soit le temps ou le budget disponible. - Un focus complet sur les activités de plein air à faire au Danemark, avec une attention particulière portée sur la randonnée, mais aussi le vélo, le canoë kayak ou encore les sports nautiques. - Plus de 60 cartes et plans clairs du Danemark et de ses villes principales pour repérer les sites en un coup d'oeil et organiser ses déplacements. Ce guide propose également des informations pour voyager responsable et avec des enfants, ainsi que des chapitres thématiques sur la vie des habitants, l'histoire et les traditions du Danemark. Un guide clair et synthétique pour construire facilement son voyage et vivre des expériences inoubliables au Danemark, au plus près des habitants.",isbn:"9782384927760",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384927760-M.jpg"},
  {t:"Comment la Palestine fut perdue et pourquoi Israël n'a pas gagné",a:"Filiu Jean-Pierre",y:"2025",ed:"Points",cote:"956 FIL",pub:"Adulte",sup:"Imprimé",d:"Comment la Palestine fut perdue Si vous estimez connaître assez du conflit israélo-palestinien pour en nourrir des opinions définitives, mieux vaut ne pas ouvrir ce livre. Vous risqueriez d'y apprendre que le sionisme fut très longtemps chrétien avant que d'être juif. Ou que la dynamique factionnelle a, dès l'origine, miné et affaibli le nationalisme palestinien. Jean-Pierre Filiu, spécialiste incontesté de la question, redonne du sens à un conflit apparemment sans fin. Israël a gagné guerre après guerre, sans pour autant remporter la victoire, car son avenir ne sera garanti que par l'établissement d'un Etat palestinien vivant en paix à ses côtés. A l'heure où Israël croit effacer la Palestine en anéantissant Gaza, ce livre est un formidable message d'espoir. Jean-Pierre Filiu Professeur en histoire du Moyen-Orient à Sciences Po, Paris, il est l'auteur de nombreux ouvrages de référence, traduits dans une vingtaine de langues, dont Histoire du Moyen-Orient (\"Points Histoire\", 2023) et Un historien à Gaza (Les Arènes, 2025).",isbn:"9791041415502",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041415502-M.jpg"},
  {t:"Partir sur la Route 66",a:"Bender Andrew",y:"2026",ed:"Lonely Planet",cote:"917.3 ETA",pub:"Adulte",sup:"Imprimé",d:"Grâce à la nouvelle collection Partir de Lonely Planet, lancez-vous sur l'itinéraire mythique de la Route 66 qui célèbre son centième anniversaire ! De Chicago à Los Angeles, suivez les conseils d'auteurs expérimentés et préparez-vous à vivre l'aventure de vos rêves. La Route 66 est un mythe : 4000 km de Chicago à Santa Monica (non loin de Los Angeles), des grands espaces ponctués de villes fantômes, des diners où engloutir des litres de café, des stations-services vintages. Autant de symboles qui ont construit la légende de cette \" mère des routes \" états-uniennes. 7 auteurs ont parcouru et couvert cette route emblématique, certains à plusieurs reprises. Ces experts vous livrent leur vision de la Route 66 ainsi que leurs conseils pour planifier, organiser et réussir votre périple. 8 Etats américains traversés (Illinois, Missouri, Kansas, Oklahoma, Texas, Nouveau-Mexique, Arizona et Californie) et des villes emblématiques à découvrir (Chicago, Tulsa, Oklahoma City, Santa Fe, Albuquerque, Los Angeles) L'itinéraire de la Route 66 est décrit étape par étape, avec pour chaque portion tous les incontournables à découvrir, les meilleures adresses des auteurs, la durée recommandée... Des essais thématiques apportent des éclairages sur la Route 66 et ses symboles (l'attrait pour les grands espaces, le rôle du cinéma dans son succès, les motels et les stations-services vintage...). Richement illustré de photos pour vous inspirer et de cartes (cartes régionales avec le tracé de l'itinéraire et plans des villes principales avec les points d'intérêts) pour vous repérer facilement et construire votre propre Route 66. Et bien sûr, toutes les informations pratiques pour vous lancer à votre tour (budget, assurance, permis de conduire, location...). En clair, un joli carnet de route avec des pages aux coins arrondis et un format pratique, à emporter avec soi sur la Route 66.",isbn:"9782384929429",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929429-M.jpg"},
  {t:"Invincibles",a:"De Decker Arnaud",y:"2025",ed:"Kennes",cote:"320.947 DEC",pub:"Adulte",sup:"Imprimé",d:"Depuis 2022, Arnaud De Decker sillonne l'Ukraine en guerre, micro et carnet à la main. Là où les caméras ne vont plus, il reste. Là où la peur fige, il avance. Dans Invincibles, il revient sur ses nombreux séjours en zones de combat à travers les récits intimes et bouleversants de soldats, de civils, d'enfants, de médecins... En s'attachant ainsi à mettre en lumière des parcours individuels, il rappelle cette force qui, plus que toute autre, surgit dans l'adversité : être capable d'aimer malgré la perte, d'espérer malgré la désolation. Refusant le spectaculaire ou la posture de héros, l'auteur propose une approche sobre, humaine, directe. Son livre est un cri retenu, une documentation précieuse, un hommage sincère à la résilience d'un peuple.",isbn:"9782931300312",extraUrl:"https://covers.openlibrary.org/b/isbn/9782931300312-M.jpg"},
  {t:"Le Fil de notre histoire",a:"Negrin Fabian",y:"2026",ed:"La Martinière",cote:"A NEG",pub:"Jeunesse",sup:"Imprimé",d:"Un voyage extraordinaire à travers le temps : l'histoire d'une famille racontée à rebours, jusqu'à ses origines les plus lointaines... Lucie, 90 ans, se rappelle de tendres souvenirs qui, par ricochets, en invoquent d'autres plus anciens : les joyeuses soirées avec Giorgio dans les années 1960, leur rencontre quand elle avait 16 ans, sur cette plage où elle passait depuis sa plus tendre enfance tous ses étés. Son père était reporter, il avait rencontré sa mère à Londres. Le père de cette Anglaise, grand-père Charles, capitaine au long cours, était tombé amoureux à Shanghai, au début du siècle, de Mei, une jeune Chinoise. Il avait offert à la petite Lucie une bague qui était dans la famille depuis l'époque des Croisades, lorsqu'un chevalier saxon et une princesse arabe s'étaient unis. Et avant cela ? Une aïeule reine d'Egypte, des esclaves, des chasseurs de crocodiles ou des marchands de fruits, qui sait... Des instants évocateurs et émouvants saisis en peu de mots sont servis par des illustrations et une mise en pages captivantes. Lucie, en remontant le temps, raconte la richesse de ses origines. Ce récit familial nous convie à une exploration poétique de l'identité et de nos racines. En prenant l'amour comme fil conducteur, il montre combien chaque histoire personnelle est un fragment d'une vaste mosaïque humaine et s'inscrit dans une histoire commune et universelle ; il célèbre ce lien qui devrait nous unir, ce patrimoine génétique partagé, hérité d'un ancêtre perdu dans la nuit des temps. Le lecteur rencontrera avec délice chaque génération de cette famille paradigmatique, s'interrogera sur la transmission d'une bague, croisera des personnages hauts en couleur. Jusqu'à cette silhouette dont la narratrice porte fièrement le nom, l'arrière-arrière-arrière-grand-tante de l'humanité : l'australopithèque Lucy. Une grande famille ? L'humanité tout entière ! Un album fascinant, original et graphique qui met en lumière la mixité de nos racines en même temps que notre origine commune, comme une invitation à la fraternité.",isbn:"9791040124320",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040124320-475x500-1.jpg"},
  {t:"L'habitant de l'infini",a:"Samura Hiroaki",y:"2023",ed:"Editions Casterman",cote:"BD HAB",pub:"Adulte",sup:"Imprimé",d:"Japon, fin du XVIII siècle. Manji, samouraï sans maître et hors-la-loi, est immortel : il porte en lui un mystérieux ver qui guérit ses plus terribles blessures. Pour expier ses crimes, et retrouver peut-être un jour sa mortalité, il s'est juré de sabrer mille scélérats. Sa route croise celle de Rin, jeune fille en quête de vengeance depuis que l'Ittôryû, école de sabre renégate menée par le redoutable et charismatique Anotsu Kagehisa, a tué ses parents. Celle-ci cherche un garde du corps pour l'aider dans cette tâche et Manji accepte de mettre son sabre à son service",isbn:"9782203245532",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203245532-M.jpg"},
  {t:"L'habitant de l'infini",a:"Samura Hiroaki",y:"2023",ed:"Editions Casterman",cote:"",pub:"Adulte",sup:"Imprimé",d:"Pour contrer le danger que représente Manji, Anotsu Kagehisa, le grand maître de l'Ittôryû, décide de faire appel à la plus fine lame de sa connaissance : sa cousine Makie, guerrière insurpassable qu'il admire depuis l'enfance. Toutefois, celle-ci est aussi douée pour le combat que réticente à y prendre part, et préfère encore se prostituer que de tuer des gens. Mais sa confrontation avec Rin et Manji mettra chacun face à ses contradictions et amènera la jeune fille à questionner le sens de sa vengeance",isbn:"9782203257788",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203257788-M.jpg"},
  {t:"J'aime les comptines du monde entier",a:"Ivanovitch-Lair Albena",y:"2024",ed:"Rue du Monde",cote:"J 841.9 IVA",pub:"Jeunesse",sup:"Imprimé",d:"Partout sur Terre, des comptines rythment les jeux des enfants et, le soir venues, certaines viennent tendrement les endormir.  En voici une quarantaine, venues des quatre coins du monde, en français et dans leur langue d'origine.",isbn:"9782355047503",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355047503-475x500-1.jpg"},
  {t:"Le loup ne viendra pas",a:"Ouyessad Myriam",y:"2021",ed:"Editions L'Elan vert",cote:"A OUY",pub:"Jeunesse",sup:"Imprimé",d:"- Maman, tu es sûre que le loup ne viendra pas ? - Tout à fait sûre, mon lapin. - Mais comment tu peux être aussi sûre ?",isbn:"9782844556462",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782844556462-475x500-1.jpg"},
  {t:"Farmhand",a:"Guillory Rob",y:"2026",ed:"Delcourt",cote:"BD GUI",pub:"Adulte",sup:"Imprimé",d:"Les expériences génétiques menées par Jedidiah Jenkins et Monica Thorne ont transformé cette dernière en entité maléfique. Elle est dorénavant aux commandes de Freetown, et a construit un pont reliant la Terre à l'Enfer. Ce pont passe par le coeur de la jeune Abby Jenkins... Les membres survivants de la famille Jenkins se préparent à livrer leur dernier combat. Rob Guillory, co-créateur et dessinateur de Tony Chu, Détective Cannibale, apporte ici la touche finale à cette comédie écologique noire où la science est devenue folle !",isbn:"9782413078821",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413078821-M.jpg"},
  {t:"Odilon",a:"Davenier Christine",y:"2026",ed:"Bayard éditions",cote:"A DAV",pub:"Jeunesse",sup:"Imprimé",d:"Un envol plein de tendresse et de malice Odilon est un petit papillon adorable... mais tétanisé à l'idée de quitter le nid. Contrairement à ses frères et soeurs qui volent, il préfère écouter leurs histoires de là-haut, bien au chaud. Mais ça, c'était avant qu'Isabelle, une coccinelle intrépide, débarque pour jouer. Elle l'entraîne dans un jeu inattendu et, par accident (ou par magie ? ), Odilon tombe... pour mieux s'envoler ! Une première aventure remplie de douceur, de rires et de courage. Un petit héros auquel les enfants peuvent s'identifier Ce joli récit aborde avec tendresse la peur de se lancer, ce moment où l'on hésite encore avant de grandir. Les jeunes lecteurs se reconnaîtront dans Odilon et sa crainte de l'inconnu, tandis que les parents apprécieront la manière bienveillante dont l'histoire montre que chacun avance à son rythme. Parfait pour aborder la confiance en soi, les premiers pas (ou vols ! ) et l'amitié. Une illustratrice reconnue et une collection craquante Les illustrations de Christine Davenier - déjà adorée pour la série \"Minusculette\" (à l'Ecole des loisirs) - apportent une chaleur et un charme irrésistibles à cette histoire. Elle s'inscrit dans la collection Tout Carton Tout Mignon, des livres solides et joyeux, spécialement pensés pour les petites mains... et les grands sourires.",isbn:"9791036375293",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036375293-475x500-1.jpg"},
  {t:"Des équations personnelles",a:"Serfaty Sylvia",y:"2026",ed:"Flammarion",cote:"510 SER",pub:"Adulte",sup:"Imprimé",d:"Et si les mathématiques étaient le lieu de la vérité et de la beauté par excellence ? C'était l'hypothèse de l'auteure au sortir de ses études. A l'âge où trop d'entre nous perdent le contact avec les maths, Sylvia Serfaty s'engage dans une carrière internationale. Elle nous fait entrer ici dans l'esprit d'une brillante mathématicienne et nous invite à la suivre. Qu'est-ce que l'abstraction ? \"J'écris surtout pour ceux qui ne font pas de mathématiques\", dit-elle. Guidée par son expérience personnelle, femme dans un monde très masculin, Sylvia Serfaty nous livre un témoignage intime et sensible sur les mathématiques. Elle fait surgir ce qui l'amuse, l'apaise, la réjouit et la fascine : le plaisir de la démonstration, la découverte de la preuve. Elle raconte le quotidien, la place de l'intuition et de la créativité, les déceptions et les frustrations, les errements comme les illuminations. Elle rend aussi hommage aux grands maîtres du passé, sans oublier les figures d'aujourd'hui. Quel avenir pour l'humain dans une discipline bouleversée par l'intelligence artificielle ? Garderons-nous la joie de chercher par nous-mêmes ?",isbn:"9782080145871",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080145871-M.jpg"},
  {t:"La Cafetière et autres contes fantastiques",a:"Gautier Théophile",y:"2000",ed:"Hachette",cote:"843 GAU",pub:"Adulte",sup:"Imprimé",d:"Peut-on tomber amoureux d'une cafetière ? Ou demander la main d'une momie vieille de trente siècles ? Un acteur risque-t-il d'être emporté par le diable ? Telles sont quelques-unes des histoires étranges imaginées par Théophile Gautier, qui donne vie à des personnages évadés de leurs tableaux ou entraîne son héros dans d'incroyables conversations avec des divinités échappées d'antiques tapisseries. Souvent burlesques, parodiques ou ironiques, ces contes fantastiques sont aussi une étonnante galerie de symboles et d'images romantiques.",isbn:"9782011679512",extraUrl:"https://covers.openlibrary.org/b/isbn/9782011679512-M.jpg"},
  {t:"Louise Michel",a:"Thomas Édith",y:"2026",ed:"Gallimard",cote:"B MIC",pub:"Adulte",sup:"Imprimé",d:"Archiviste paléographe, formée par l'Ecole des chartes, Edith Thomas s'est fait connaître d'abord comme auteure de romans. Rapidement engagée dans la presse de gauche pendant la guerre d'Espagne, membre active de la Résistance, au sein de laquelle elle fonde, avec Jean Paulhan et Claude Morgan, le Comité national des écrivains, elle adhère au Parti communiste en 1942 ; elle le quittera en 1949. Historienne et féministe, elle publie Les Femmes de 1848, avant d'enquêter sur le rôle des révoltées pendant la Commune. D'où son livre fameux Les \"Pétroleuses\" (1963). L'une d'elles, qui assume carrément ce terme injurieux infligé par les Versaillais, était Louise Michel, devenue une figure emblématique de l'insurrection parisienne de 1871. Dans cette biographie célèbre, jamais remplacée, Edith Thomas retrace la vie de cette femme hors du commun, avec sympathie mais aussi avec la rigueur qu'impose le métier d'historien, servie par une écriture de romancière. Comment la modeste institutrice Louise, qui s'essaie à la poésie et entretient une correspondance affectueuse avec Victor Hugo, est-elle devenue une combattante de la Commune ? Comment, après sa déportation en Nouvelle-Calédonie, s'est-elle lancée dans une infatigable campagne en faveur du socialisme anarchiste ? Edith Thomas raconte cette vie exaltée dans un ouvrage pionnier à tant d'égards. Paru en 1971, l'année du centenaire de la Commune, il était posthume : Edith Thomas l'avait achevé juste avant de mourir. Le voici réédité avec une préface inédite de Michelle Perrot.",isbn:"9782073140272",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073140272-M.jpg"},
  {t:"Art nouveau",a:"Hauffe Thomas",y:"2024",ed:"Editions Place des Victoires",cote:"745 HAU",pub:"Adulte",sup:"Imprimé",d:"Plongez dans l'univers fascinant de l'Art Nouveau à travers ce beau livre illustré, qui explore les influences majeures de ce mouvement à Amsterdam, Glasgow et Chicago. Découvrez des artistes emblématiques et explorez leur impact sur l'architecture, la peinture, le graphisme et les arts décoratifs. Un ouvrage incontournable pour les passionnés d'art et d'histoire. Cet ouvrage vous plongera dans l'univers de l'Art Nouveau, explorant ses manifestations à Amsterdam, Glasgow, et Chicago. Commencez votre exploration par l'Art Nouveau en Ecosse, mettant en lumière des artistes renommés tels que Charles Rennie Mackintosh et Frances MacDonald. Poursuivez votre voyage à travers les artistes néerlandais du \" Nieuwe Kunst \", notamment Jac. van den Bosch et Jan Toorop. Enfin, découvrez les figures majeures de l'Art Nouveau aux Etats-Unis, parmi lesquelles Louis Comfort Tiffany, Louis Sullivan, William Henry Bradley... Ce beau livre illustré de référence vous offre un panorama complet des artistes emblématiques de l'Art Nouveau dans les domaines de l'architecture, de la peinture, du graphisme et des arts décoratifs, évoquant l'héritage artistique de ces villes emblématiques que sont - notamment - Amsterdam, Glasgow et Chicago.",isbn:"9782809920246",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809920246-M.jpg"},
  {t:"W0rldtr33",a:"Tynion James",y:"2025",ed:"Urban Comics",cote:"BD TYN",pub:"Adulte",sup:"Imprimé",d:"En appuyant sur un seul bouton, Gabriel Winter a supprimé Internet et changé à jamais la face du monde. Alors que son cercle d'amis en subit les conséquences directes, l'agent spécial Siobhan Silk tente de lever le voile sur ce qui s'est passé il y a 25 ans... et de stopper Ph34R, la létale personnification de l'Undernet, de faire davantage de victimes.",isbn:"9791026829720",extraUrl:"https://covers.openlibrary.org/b/isbn/9791026829720-M.jpg"},
  {t:"Le dernier roi soleil",a:"Des Déserts Sophie",y:"2019",ed:"Ed. de la Loupe",cote:"B ORM",pub:"Adulte",sup:"Imprimé",d:"",isbn:"9782848688756",extraUrl:"https://covers.openlibrary.org/b/isbn/9782848688756-M.jpg"},
  {t:"Les guerres civiles",a:"Buisson Jean-Christophe",y:"2025",ed:"Coédition Perrin/Le Figaro Magazine",cote:"909 BUI",pub:"Adulte",sup:"Imprimé",d:"Guerre... civile ! Deux termes antinomiques pour dire l'indicible, soit la lutte fratricide dressant une partie d'un peuple contre un autre. Submergeant le cadre militaire conventionnel, les conflits intérieurs mobilisent les sociétés, divisent les cités et broient les familles, générant des massacres au nom d'une valeur suprême revendiquée, qu'elle soit d'origine religieuse, idéologique, sociale ou ethnique. Dans la lignée de leur précédent ouvrage- collectif à succès, Le Dernier Carré, Jean-Christophe Buisson et Jean Sévillia ont rassemblé historiens et journalistes de renom pour raconter et expliquer ces dérives barbares qui ont défiguré l'histoire de l'humanité depuis le XVIe siècle. Les récits, écrits au scalpel et puisés aux meilleures sources, éclairent les guerres civiles les plus emblématiques, en particulier celles du terrible XXe siècle. Les conflits célèbres (la guerre de Sécessión, la guerre civile russe, la tragédie du Liban, le génocide rwandai côtoient des épisodes plus méconnus (les guerres carlistes, la révnie des Taiping, les Cristeros, les guerres civiles yougoslave et grecque, l'Angola). Cinq chapitres sont consacrés à la France (guerres de Religion, Fronde, Vendée, Commune, fin de l'Algérie française), soulignant l'écartèlement de notre pays entre sa propension à la division et sa quête d'unité. Une préface d'envergure place l'ensemble en perspective avant d'interroger l'actualité. Une grande leçon d'histoire qui a valeur d'avertissement pour le présent et l'avenir.",isbn:"9782262109851",extraUrl:"https://covers.openlibrary.org/b/isbn/9782262109851-M.jpg"},
  {t:"Yôkai",a:"Vermot Thibault",y:"2022",ed:"Éditions Sarbacane",cote:"J VER",pub:"Jeunesse",sup:"Imprimé",d:"\"Voici Yanagi, et voici Takata. C'est pas des si mauvais garçons : s'ils m'ont enlevée, c'est qu'ils avaient besoin d'argent. Takata dit qu'il a cassé son sabre et qu'il doit en racheter un. Au fait, moi, c'est Kyoko, et je suis la fille du calligraphe. Ils ont décidé de se cacher dans la montagne en attendant la rançon, mais mon père est si radin qu'ils peuvent toujours courir ! Avec Yanagi, on a pêché des poissons, et j'ai mis une branche dans l'oeil de Takata sans le faire exprès. Moi je m'amuse bien ! Mais Yanagi guette les gens dans la vallée. Bientôt, la montagne grouillera d'hommes du daimyo, le chef de la police. C'est là que j'ai l'idée proposer un plan époustouflant à mes nouveaux copains : le casse du siècle, pas moins ! \"",isbn:"9782377316564",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782377316564-475x500-1.jpg"},
  {t:"Les aventures d'une poule aveugle et d'un canard boiteux",a:"Hub Ulrich",y:"2024",ed:"Gallimard",cote:"J HUB",pub:"Jeunesse",sup:"Imprimé",d:"Une fable subtile, drôle et pétillante qui célèbre le pouvoir de l'imagination et la force de l'amitié. Il existe un endroit où l'on peut réaliser son voeu le plus secret, et la poule veut s'y rendre ! Elle aurait bien aimée être accompagnée d'un chien guide, mais c'est sur un canard boiteux et très peureux qu'elle tombe. Il tremble déjà à l'idée de quitter son arrière-cour. Qu'importe, il fera bien l'affaire !",isbn:"9782075206907",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075206907-475x500-1.jpg"},
  {t:"La Légende de Tristan et Yseut",a:"Rachmühl Françoise",y:"2026",ed:"Flammarion",cote:"J RAC",pub:"Adolescent",sup:"Imprimé",d:"Le roi Marc de Cornouailles a décidé de prendre pour épouse la belle Yseut et charge son neveu, le chevalier Tristan, d'aller la trouver en Irlande. Mais sur le bateau du retour, les deux jeunes gens boivent par erreur un philtre d'amour. Désormais, ils sont condamnés à s'aimer à tout jamais... Retrouvez un des couples les plus mythiques de la littérature dans ce roman de chevalerie et d'amour, adapté par Françoise Rachmuhl.",isbn:"9782080497314",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080497314-475x500-1.jpg"},
  {t:"J'irai jusqu'au rivage du soleil",a:"Farrokhzad Forugh",y:"2026",ed:"Gallimard",cote:"891.5 FAR",pub:"Adulte",sup:"Imprimé",d:"Forough Farrokhzâd (1935-1967), née et morte à Téhéran, est assurément une icône non seulement de la poésie iranienne du XXe siècle mais tout autant de la cause de l'émancipation féminine dont sa vie, libre et tourmentée, objet de scandale dans son pays, est comme un manifeste. Sa poésie est un chant d'amour intensément libre, porté par un lyrisme charnel puissant et nourri par ailleurs de la grande poésie persane classique.",isbn:"9782073089755",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073089755-M.jpg"},
  {t:"Poison Ivy",a:"Wilson Gwendolyn Willow",y:"2025",ed:"Urban Comics",cote:"BD WIL",pub:"Adulte",sup:"Imprimé",d:"Alors qu'elle doit s'accommoder à sa nouvelle vie et à ses pouvoirs pleinement retrouvés, Poison Ivy reprend sa guerre pour l'équilibre du monde naturel. Sa dernière mission en date : rétablir la vie dans les zones humides entourant Gotham City, que les déchets industriels de la ville ont ravagées. Mais ses objectifs sont bouleversés lorsqu'elle fait involontairement ressurgir un lieu qui remonte aux origines de Gotham et avec lui... quelque chose d'affamé. Pendant ce temps, des incendies purificateurs brûlent à travers l'Amérique, cherchant à débarrasser le pays de l'influence humaine. Et, même sans qu'elle ne le sache'Poison Ivy elle-même est à blâmer.",isbn:"9791026825326",extraUrl:"https://covers.openlibrary.org/b/isbn/9791026825326-M.jpg"},
  {t:"Poison Ivy Infinite Tome 6",a:"Wilson G.Willow",y:"2026",ed:"Urban Comics",cote:"BD WIL",pub:"Adulte",sup:"Imprimé",d:"Marshview, le sanctuaire que Poison Ivy a exhumé des marais, est menacé de toute part... une horrible entité semble hanter les lieux, la police, mais aussi Gardener et l'ordre du Chevalier Vert sont après Ivy, et même Batman en personne est à ses trousses ! Ivy devra affronter à la fois son passé et son présent dans l'espoir d'assurer son propre avenir, mais parviendra-t-elle à sauvegarder ce lieu sans mettre en péril tous ceux qui lui sont chers'",isbn:"9791026855361",extraUrl:"https://covers.openlibrary.org/b/isbn/9791026855361-M.jpg"},
  {t:"Alliances",a:"Buchet Philippe",y:"2026",ed:"Delcourt",cote:"BD BUC",pub:"Adulte",sup:"Imprimé",d:"Des armes sophistiquées ont été repérées sur une planète qui vit encore à l'époque médiévale. Rib Wund, qui devait récupérer l'arsenal et libérer Juaiz détenu sur place, est capturé à son tour et conduit devant le roi qui ne semble rien ignorer de Sillage. Mais qui se cache réellement derrière ce mystérieux souverain ? Nävis est envoyée sur place pour tenter de parachever cette mission.",isbn:"9782413088516",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413088516-M.jpg"},
  {t:"Dandadan",a:"Tatsu Yukinobu",y:"2026",ed:"Crunchyroll",cote:"BD DAN",pub:"Adulte",sup:"Imprimé",d:"Cap sur Izumo ! Momo et les autres embarquent dans l’espoir de lever la male diction de la malle ensorcelée... mais a peine l’avion a-t-il de colle que le clan Kito s'évade pour assouvir sa vengeance, passe a l’attaque ! Alors que Zuma, prive de la vue, et Seiko, affaiblie, peinent a tenir bon, des requins gelés viennent percuter l’appareil ! A l’origine du chaos : un homme-typhon ! Face à cette menace insensée, Momo et les siens n’ont d’autre choix que de s’allier aux Kito !",isbn:"9782820354594",extraUrl:"https://covers.openlibrary.org/b/isbn/9782820354594-M.jpg"},
  {t:"La bataille du no man's land de Shinjuku : avance",a:"Akutami Gege",y:"2025",ed:"Editions Ki-oon",cote:"BD JUJ",pub:"Adulte",sup:"Imprimé",d:"Engloutir les ténèbres pour mieux les combattre ! Pour avoir une chance de vaincre Sukuna, les exorcistes savent qu'ils doivent également se débarrasser au plus vite de Kenjaku. Dans ce but, ils envoient leur meilleur élément au combat, mais aussi le plus ringard : Fumihiko Takaba ! Une stratégie qui pourrait tout de même s'avérer payante, puisque ce dernier influence l'imaginaire de son adversaire... Pendant ce temps, Atsuya et Hiromi joignent leurs forces face au roi des fléaux. En effet, seule l'épée du bourreau, capable de tuer tout ce qu'elle tranche sans exception, est en mesure de libérer Megumi ! Les exorcistes auraient-ils enfin trouvé un moyen de prendre l'avantage ?",isbn:"9791032719855",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032719855-M.jpg"},
  {t:"Jujutsu Kaisen T30",a:"Akutami Gege",y:"2026",ed:"Editions Ki-oon",cote:"BD JUJ",pub:"Adulte",sup:"Imprimé",d:"Ne manquez pas l'épique conclusion de l'affrontement millénaire contre Ryomen Sukuna dans cet ultime volume de Jujutsu Kaisen ! Ryomen Sukuna a étendu son territoire malgré toutes les tentatives de l'en empêcher ! Néanmoins, grâce à l'aide de Choso et d'Aoi, Yuji a réussi à gagner suffisamment de temps pour permettre à Yuta de revenir sous une forme inattendue et d'affaiblir encore davantage son adversaire... mais à quel prix ? Hana se joint alors au combat et Yuji tente une dernière fois de libérer Megumi de l'emprise du roi des fléaux...",isbn:"9791032723777",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032723777-M.jpg"},
  {t:"La Boutique aux horreurs",a:"Richelle Philippe",y:"2026",ed:"Glénat",cote:"BD RIC",pub:"Adulte",sup:"Imprimé",d:"Soumission chimique : retour sur les expériences top secrètes du gouvernement américain durant la guerre froide Après le succès des Mystères de la République, Philippe Richelle revient avec une nouvelle série-concept consacrée à l'émergence des services secrets au XXe siècle. Chaque tome explore une opération menée dans l'ombre, le plus souvent au coeur conflits majeurs : Seconde Guerre mondiale, Guerre froide, après-Guerre froide ou encore conflit israélo-arabe. Avec un réalisme saisissant, cette série de polars historiques, tous autoconclusifs, dévoile des récits passionnants et met en lumière des personnages hors normes, prêts à tout, souvent au mépris des règles, pour parvenir à leurs fins. Chaque album est illustré par un dessinateur différent et peut être lu indépendamment. 1953. Etats-Unis. Bill Barney a toujours été un jeune homme soucieux de servir son pays. De retour de la guerre de Corée, son idéal patriotique le pousse à devenir agent de la CIA. Mais il est loin de se douter que sa mission va le plonger dans un univers cauchemardesque... Car MK-Ultra, l'obscur programme auquel il va participer, utilise une nouvelle méthode : la soumission chimique ! A travers ces recherches top secrètes, le gouvernement américain n'a qu'un objectif : découvrir comment modifier l'esprit humain et en prendre le contrôle. En assistant le docteur Gottlieb, cheville ouvrière du Programme, Barney va bientôt comprendre que tous les moyens sont bons pour parvenir à ses fins : thérapie du sommeil, médicaments, LSD, électrochocs... Plus Gottlieb multiplie les expériences, plus il détruit la vie de ses \"cobayes\", et plus Barney sombre dans une spirale infernale, impuissant face à l'horreur... Avec ce thriller psychologique inspiré de faits réels, Philippe Richelle et Steven Lejeune nous plongent en pleine guerre froide pour un récit choc où la tension croissante est poussée à son paroxysme. Le deixième tome de la série Guerres secrètes met en lumière une page sombre de l'Histoire des Etats-Unis en revenant sur les expérimentations humaines perpétrées en secret par le gouvernement américain entre 1950 et 1960 notamment en Corée et au Viêtnam.",isbn:"9782344063699",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344063699-M.jpg"},
  {t:"Gunnar le vampire",a:"Dumontheuil Nicolas",y:"2026",ed:"Dupuis",cote:"BD DUM",pub:"Adulte",sup:"Imprimé",d:"Gunnar Gunnarson est un vampire suédois de près de 800 ans. Ou plutôt, comme il aime à le dire : il a 36 ans depuis plus de 7 siècles... Lassé de le violence et de la prédation, Gunnar essaie de bien se conduire, et vit paisiblement en Bourgogne avec sa compagne Marthe, une mortelle. Il est couturier, reste discret, mord rarement et uniquement des consentants. La population locale reste à distance, partagée entre méfiance, curiosité et fierté. Tout le monde le laisse en paix. Jusqu a ce que des animaux soient retrouvés vidés de leur sang dans les fermes alentour...",isbn:"9782808507585",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808507585-M.jpg"},
  {t:"Henriette ou le grand voyage",a:"Frossard Claire",y:"2024",ed:"Flammarion",cote:"J FRO",pub:"Jeunesse",sup:"Imprimé",d:"Moi, Henriette, cochon d'Inde de mon état, je fais maintenant partie de la tribu des Grands Campagnols Roux. Nous rêvons d'un nouveau territoire : un endroit où creuser de beaux terriers, avec une rivière et des prairies fleuries. En route pour un grand voyage semé d'embûches et de surprises !",isbn:"9782080440297",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080440297-475x500-1.jpg"},
  {t:"L'Homme qui trahit Hitler",a:"Richelle Philippe",y:"2026",ed:"Glénat",cote:"BD RIC",pub:"Adulte",sup:"Imprimé",d:"Un héros ordinaire Après le succès des Mystères de la République, Philippe Richelle revient avec une nouvelle série-concept consacrée à l'émergence des services secrets au XXe siècle. Chaque tome explore une opération menée dans l'ombre, le plus souvent au coeur de conflits majeurs : Seconde Guerre mondiale, guerre froide, après-guerre froide ou encore conflit israélo-arabe. Avec un réalisme saisissant, cette série de polars historiques, tous autoconclusifs, dévoile des récits passionnants et met en lumière des personnages hors normes, prêts à tout, souvent au mépris des règles, pour parvenir à leurs fins. Chaque album est illustré par un dessinateur différent et peut être lu indépendamment. 1931. Dans une Allemagne ruinée par la guerre, Hans-Thilo Schmidt, ancien chimiste accepte un poste modeste au ministère de la Défense sans savoir qu'il va bientôt travailler avec une machine révolutionnaire. \" Enigma \" sert à chiffrer des messages secrets. Alors qu'Enigma devient l'outil stratégique numéro 1 pour le régime nazi, ce discret employé entame une double vie et n'hésite pas à transmettre des informations capitales à l'armée française sous le nom de code Asche ! Entre manipulations, trahisons et jeux d'influence, ce père de famille en apparence fidèle au régime, va devenir la pièce maîtresse d'un affrontement souterrain où le moindre faux pas peut se révéler fatal... Philippe Richelle et Jorge Miguel nous entrainent dans une course contre la montre pleine de rebondissements. Tiré de faits réels, ce premier tomenous offre une plongée haletante dans les coulisses de l'espionnage durant la Seconde guerre mondiale. Dans un récit mêlant trahison et tension historique, ce polar captivant retrace le destin de Hans-Thilo Schmidt, considéré aujourd'hui comme l'un des plus grands espions du XXe siècle.",isbn:"9782344063675",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344063675-M.jpg"},
  {t:"Ann Bonny",a:"Bonnet Franck",y:"2026",ed:"Glénat (Grenoble, Isère, France; 1969-...)",cote:"BD BON",pub:"Adulte",sup:"Imprimé",d:"L’histoire vraie de la plus grande femme pirate de l’Histoire !  Après leur fuite de Nassau, rien ne peut arrêter les amants terribles : Ann Bonny et John Rackham écument les Caraïbes à bord du William. Leurs prises sont spectaculaires. Après une halte à Cuba où Ann donne naissance à un enfant de la piraterie qui ne connaitra jamais sa mère, elle rejoint Rackham. Mais cette fois les corsaires de Woodes Rogers sont à leurs trousses et le mari d’Ann a mis sa tête à prix pour quiconque la ramènerait vivante à Nassau. Menacée de toutes parts, Ann s’attend à tout sauf à croiser le chemin d’une autre femme, une pirate comme elle. Elle s’appelle Mary alias Mark Read, elle aussi grimée en homme. Défiant le code des pirates, les deux femmes entament une relation passionnelle sous l’œil de Rackham. Il concède à Ann cette aventure mais à une condition : aucun homme sur le navire ne devra savoir ce qui se trame. Mais les secrets ne durent jamais longtemps en mer… Entre jalousies et rivalités le trio continue de s’adonner aux pillages bien que l’étau se resserre. Le gouverneur Woodes Rogers qui s’est donné pour mission d’éradiquer la piraterie sous toutes ses formes ne compte pas s’arrêter là… Jusqu’à quand Ann poursuivra-t-elle sa course folle sous le feu des canons ? Combien de temps lui reste-t-il avant que son monde ne s’effondre ? Habitué des fresques maritimes, Franck Bonnet nous entraîne dans une aventure épique à travers cet ambitieux diptyque dans lequel il revient sur l’histoire vraie de la plus grande femme pirate. Entre passions, dangers et affrontements sanglants, ce second tome qui clôt le récit, montre le vrai mode de vie des pirates, loin de l'imagerie vulgarisée par le cinéma, sublimé par le dessin et la connaissance de l'architecture navale de Franck Bonnet, ici au sommet de son art.",isbn:"9782344064030",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344064030-M.jpg"},
  {t:"Mercury Baby",a:"Birban Julien",y:"2026",ed:"Editions Héloïse d'Ormesson",cote:"R BIR",pub:"Adulte",sup:"Imprimé",d:"Comment rester romantique quand la misère réduit l'horizon ? A l'aube de la fin du monde, lorsque le déséquilibre est partout, pourquoi faire des enfants ? New York et Tokyo. Dans les franges de ces villes-monstres, les habitants ne sont vraiment eux-mêmes que tard la nuit. Quand ils se lâchent. Mais le temps s'accélère. Les journées rétrécissent dangereusement et ne durent plus que vingt-deux heures et quelques. Et le phénomène s'aggrave : voie express vers le grabuge. Dans ce contexte d'urgence et de tension émotionnelle, trois personnages révoltés sont prêts à tout cramer. Mara, Mercury Baby, rapport à une chanson qui porte son nom et qu'elle préfèrerait oublier, est la plus punk des sociologues, spécialiste de la sous-culture. Belle à se tirer une balle dans la mâchoire. Nils a vu sa vie éclater en vol à l'adolescence, et depuis il veut sa revanche, et prouver au monde que les fauchés, eux aussi, ont droit à la consolation. Romi, nihiliste magnifique, souhaite entraîner le monde dans le chaos. Mara publie un virulent pamphlet qui affirme que ceux qui font encore des enfants en 2025 sont des fous, et que c'est l'ultime tabou, insondable, occidental. Nils est sélectionné pour une mission de sauvegarde, mission folle, elle aussi, qui nécessite de partir à Tokyo et d'y avoir un enfant. Mercury Baby est un roman choral couleur fièvre, condensé d'histoires d'amour qui implosent à la veille de la fin du monde. Des histoires en perdition, en roue libre vers une apocalypse qui sonnerait comme un soulagement.",isbn:"9782350879581",extraUrl:"https://covers.openlibrary.org/b/isbn/9782350879581-M.jpg"},
  {t:"L'Exilée",a:"De Castell Sebastien",y:"2026",ed:"Gallimard",cote:"J DEC",pub:"Adolescent",sup:"Imprimé",d:"Le dernier tome des aventures de Furia Perfax, l'héroïne que rien n'arrête. Un univers de fantasy sombre et fascinant, entre action spectaculaire et humour incisif ! En libérant la belle Arissa des geôles berabesa, Furia fait la rencontre de Chedran, l'un des derniers Mahdek. Déchirée entre son amour naissont et l'appel de ses origines, elle est confrontée à un choix qui pourrait sceller son avenir et celui de son peuple.",isbn:"9782075215251",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075215251-475x500-1.jpg"},
  {t:"A.B.C. contre Poirot",a:"Uzuki",y:"2026",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Monsieur Hercule Poirot, Vous vous imaginez, n'est-ce pas, capable de résoudre des mystères trop complexes pour notre pauvre police britannique ? Voyons, Monsieur Poirot l'Intelligent, jusqu'où vous pouvez aller. Vous trouverez peut-être cette affaire trop difficile à résoudre. Rendez-vous à Andover, le 21 du mois. Bien à vous,",isbn:"9782889326815",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889326815-M.jpg"},
  {t:"La collectionneuse",a:"Pétry-Sirvin Emmanuèle",y:"2024",ed:"L'Etagère du bas",cote:"A PET",pub:"Jeunesse",sup:"Imprimé",d:"Depuis toute petite, Tanaquil collectionne tout. Des doudous et des peluches, des mousses et des lichens, des autocollants et du parfum, des théières et des guitares. Tant et si bien que, tout le long de sa vie, Tanaquil n'a jamais eu de place pour autre chose... Saura-t-elle accueillir ce qui pourrait arriver ?",isbn:"9782490253623",extraUrl:"https://products-images.di-static.com/image/base/9782490253623-475x500-1.jpg"},
  {t:"Le coeur qui tourne",a:"Ryan Donal",y:"2015",ed:"Albin Michel",cote:"R RYA",pub:"Adulte",sup:"Imprimé",d:"Dans un petit village irlandais frappé par la crise économique, des tensions émergent et se multiplient dangereusement Un meurtre est commis, un enfant kidnappé, et c'est une communauté tout entière qui se retrouve en état de choc. Bobby Mahon était le contremaître d'une entreprise contrainte de fermer ses portes, et dont le patron s'est enfui avec la caisse. Chacun des autres personnages, une jeune fille inquiète des difficultés financières de ses parents, une mère célibataire, un ouvrier, une prostituée, un père tyrannique, un maçon d'origine russe... se trouvera lié à lui d'une façon ou d'autre, et tous chercheront à raconter leur propre vérité, dressant un portrait émouvant de l'Irlande rurale d'aujourd'hui et de la condition humaine, de la fragilité des relations et des sentiments. A la manière d'un roman choral, dont la construction ambitieuse n'est pas sans rappeler le Faulkner de Tandis que j'agonise, Donal Ryan donne ainsi la parole à vingt et un personnages dont il fait se succéder les voix, créant un choeur puissant à travers lequel les perceptions divergentes des protagonistes face à la réalité ne déroulent au final qu'une seule et même histoire. Un texte particulièrement inventif et émouvant dont l'extrême noirceur recèle un humour véritablement ravageur. Un premier roman comme on en rencontre rarement, original et plein d'énergie, et un jeune écrivain aussi singulier que talentueux.",isbn:"9782226314789",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226314789-M.jpg"},
  {t:"Les derniers retrouveurs",a:"Dixen Victor",y:"2024",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Les derniers retrouveurs Chaque jour, des objets et des gens disparaissent. Vous les pensez perdus ? Ils ont été volés par des créatures avides, venues d'un autre monde pour arracher des morceaux du nôtre : les croquemitaines. La vie de Lucy bascule quand sa mère disparaît mystérieusement. La jeune orpheline est contrainte de quitter sa campagne et d'aller vivre à New York chez sa tante Doris, qui l'oblige à voler dans les trains pour payer son \"loyer\". Jusqu'au jour où Lucy fait la connaissance de Rita Perdido, une femme entourée de secrets, qui lui propose de rejoindre son agence de retrouvage. Lucy découvre qu'elle fait partie d'une caste en voie de disparition : les retrouveurs. Depuis la nuit des temps, ces humains ont le pouvoir de pénétrer dans les oubliettes pour en rapporter les objets, les personnes et les souvenirs perdus. Persuadée que sa mère a été enlevée par un croquemitaine, Lucy se lance à sa recherche. Mais ce n'est pas seulement le sort de sa famille qui est en jeu : à mesure que s'éteigne les derniers retrouveurs, les croquemitaines gagnent en puissance et préparent leur effroyable revanche contre la surface...",isbn:"9791036374692",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036374692-475x500-1.jpg"},
  {t:"Le musée effacé",a:"Dixen Victor",y:"2025",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Depuis des siècles, les marais de Floride dévorent des personnes et engloutissent des trésors. Dans leurs sombres profondeurs, loin du soleil tropical de la surface, les croquemitaines attendent leur heure. Luciole \"Lucy\" Lachance et Jasper Tan commencent leur apprentissage de retrouveurs dans le Sunshine State, sous la houlette de Rita Perdido. Le temps presse pour retrouver les régalias maudits et éviter l'ascension d'un Haut-Roi des croquemitaines. Les membres de l'agence Perdido comptent profiter de la célèbre Foire d'Art Contemporain de Miami pour tendre un piège à la Muse Malade, détentrice du deuxième régalia. Cette effaceuse hante les artistes de génie depuis des siècles, volant leurs idées et les poussant à la folie. Mais depuis les palaces luxueux de South Beach jusqu'aux mangroves ancestrales du fin fond de la Floride, Luciole et Jasper vont découvrir que l'attaque des croquemitaines contre la surface est plus imminente que jamais...",isbn:"9791036365225",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036365225-475x500-1.jpg"},
  {t:"Une journée avec Lucy",a:"Dami Elisabetta",y:"2026",ed:"Albin Michel",cote:"J DAM",pub:"Jeunesse",sup:"Imprimé",d:"UNE AVENTURE AU COEUR DE LA PREHISTOIRE EN COMPAGNIE DES PREMIERS AUSTRALOPITHEQUES ! Par cent mille mimolettes, jamais je n'aurais imaginé me retrouver dans la savane africaine trois millions d'années plus tôt, en compagnie de Lucy, l'australopithèque ! Alors que ma nouvelle amie me fait découvrir son monde, son bébé est kidnappé. Nous voici lancés dans une course-poursuite pour le sauver... si on échappe aux prédateurs et au volcan qui s'est réveillé !",isbn:"9782226508263",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226508263-475x500-1.jpg"},
  {t:"Eiao",a:"Ledun Marin",y:"2026",ed:"Au vent des îles",cote:"J LED",pub:"Adolescent",sup:"Imprimé",d:"En Polynésie, dans Les années 1970, La France mène des essais nucléaires qui meurtrissent la région et mettent en danger ses habitants ainsi que sa faune et sa flore. Quand elle arrive à Eiao en 1972, à 19 ans, Simone pense avoir été embauchée par une compagnie de forage minier, mais L'Arvecom semble cacher ses véritables intentions... Au contact d'autres employés et du mystérieux Tahi, elle s'engage dans une Lutte qui La dépasse. En explorant les îles des Marquises et la jeunesse de la mère du futur lieutenant Morel de son roman Henua, Marin Ledun plonge dans un passé tourmenté et tumultueux, et nous entraîne dans une histoire d'amour radioactive.",isbn:"9782367346540",extraUrl:"https://products-images.di-static.com/image/orb-ef67b8aadc689cbb3d743f72577b9d21/9782367346540-475x500-1.jpg"},
  {t:"Dune : Maison Corrino",a:"Herbert Brian",y:"2025",ed:"Huginn & Muninn",cote:"BD HER",pub:"Adulte",sup:"Imprimé",d:"Après Maison Atréides, et Maison Harkonnen, voici la dernière trilogie pour découvrir les origines de DUNE. Complots, traîtrises et coups d'Etats sont légion dans un empire galactique féodal où s'affrontent des dynasties vassales. Chaque grande maison dispose ses pièces sur cet échiquier géant : les Corrino continuent les préparatifs de leur guerre commerciale en mettant au point un substitut à l'épice, les Harkonnen avides de puissance pressurent les Fremen sur Arrakis, tandis que les Atréides et les Vernius sont en route pour Ix. Mais un grand péril demeure, sous les yeux vigilants des Bene Gesserit, dame Jessica est sur le point d'accoucher... Brian Herbert et Kevin J. Anderson, adaptent le dernier chapitre préquel de leur saga à succès, Avant Dune, avec l'artiste Simone Ragazzoni (Robotech : Rick Hunter) et Andrea Scalmazzi en roman graphique.",isbn:"9782386400438",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386400438-M.jpg"},
  {t:"Dune",a:"Herbert Brian",y:"2025",ed:"Huginn & Muninn",cote:"BD HER",pub:"Adulte",sup:"Imprimé",d:"Après Maison Atréides, et Maison Harkonnen, voici la dernière trilogie pour découvrir les origines de DUNE. Complots, traîtrises et coups d’États sont légion dans un empire galactique féodal où s’affrontent des dynasties vassales. Famille royale, la maison Corrino fut longtemps la plus puissante de l’univers et cherche à retrouver ce pouvoir en déclenchant une guerre de l’épice. Alors que la maison Harkonnen intensifie sa pression sur les Fremen, la maison Atréides soutient la famille Vernius, tandis que les Bene Gesserit continuent à préparer l’avènement de leur potentiel messie. Brian Herbert et Kevin J. Anderson, adaptent le dernier chapitre préquel de leurs saga à succès, Avant Dune, avec l’artiste Simone Ragazzoni (Robotech: Rick Hunter) en roman graphique.",isbn:"9782386400353",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386400353-M.jpg"},
