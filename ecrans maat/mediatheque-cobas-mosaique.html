  {t:"Sous le soleil exactement",a:"Multon",y:"DL 2026",ed:"Poulpe fictions",cote:"J MUL",pub:"Jeune",sup:"Imprimé",d:"Ingrédients pour des vacances survoltées : prenez quatre copines à l'imagination débridée et invitez-les dans un grand manoir mystérieux. Ajoutez un tableau intriguant, des rencontres surprenantes, une bonne dose de curiosité et une chaîne YouTube pour documenter le tout... Vous obtiendrez une enquête haletante et des aventures délirantes !",isbn:"9782377424597",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782377424597-475x500-1.jpg"},
  {t:"Le musée effacé",a:"Dixen",y:"DL 2025",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Depuis des siècles, les marais de Floride dévorent des personnes et engloutissent des trésors. Dans leurs sombres profondeurs, loin du soleil tropical de la surface, les croquemitaines attendent leur heure. Luciole \"Lucy\" Lachance et Jasper Tan commencent leur apprentissage de retrouveurs dans le Sunshine State, sous la houlette de Rita Perdido. Le temps presse pour retrouver les régalias maudits et éviter l'ascension d'un Haut-Roi des croquemitaines. Les membres de l'agence Perdido comptent profiter de la célèbre Foire d'Art Contemporain de Miami pour tendre un piège à la Muse Malade, détentrice du deuxième régalia. Cette effaceuse hante les artistes de génie depuis des siècles, volant leurs idées et les poussant à la folie. Mais depuis les palaces luxueux de South Beach jusqu'aux mangroves ancestrales du fin fond de la Floride, Luciole et Jasper vont découvrir que l'attaque des croquemitaines contre la surface est plus imminente que jamais...",isbn:"9791036365225",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036365225-475x500-1.jpg"},
  {t:"Les derniers retrouveurs",a:"Dixen",y:"DL 2024",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Les derniers retrouveurs Chaque jour, des objets et des gens disparaissent. Vous les pensez perdus ? Ils ont été volés par des créatures avides, venues d'un autre monde pour arracher des morceaux du nôtre : les croquemitaines. La vie de Lucy bascule quand sa mère disparaît mystérieusement. La jeune orpheline est contrainte de quitter sa campagne et d'aller vivre à New York chez sa tante Doris, qui l'oblige à voler dans les trains pour payer son \"loyer\". Jusqu'au jour où Lucy fait la connaissance de Rita Perdido, une femme entourée de secrets, qui lui propose de rejoindre son agence de retrouvage. Lucy découvre qu'elle fait partie d'une caste en voie de disparition : les retrouveurs. Depuis la nuit des temps, ces humains ont le pouvoir de pénétrer dans les oubliettes pour en rapporter les objets, les personnes et les souvenirs perdus. Persuadée que sa mère a été enlevée par un croquemitaine, Lucy se lance à sa recherche. Mais ce n'est pas seulement le sort de sa famille qui est en jeu : à mesure que s'éteigne les derniers retrouveurs, les croquemitaines gagnent en puissance et préparent leur effroyable revanche contre la surface...",isbn:"9791036374692",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036374692-475x500-1.jpg"},
  {t:"Boîte à outils brico'kids",a:"Janod",y:"",ed:"Janod",cote:"S01-2758-BOIT",pub:"Jeune",sup:"",d:"Mallette en bois contenant toute la panoplie nécessaire pour les bricolos en herbe. 9 outils. Elle est facile à transporter grâce à sa petite poignée. Bois : hévéa. Impression : sticker.",isbn:"3700217364816",extraUrl:"https://sigb02.decalog.net/sharedstorage?mode=readfile&path=%2FExternalLinks%2FBoi%CC%82te_a%CC%80_outils_brico_kids.png&networkId=2289420879268174628&time=1778860857029"},
  {t:"Ma gloire",a:"Oiseau",y:"DL 2026",ed:"Gallimard",cote:"R OIS",pub:"Adulte",sup:"Imprimé",d:"\"C'est la nuit et le dehors qui m'ont fait ça, ils m'ont attrapé et ne m'ont pas rendu\". Alcoolique débonnaire, le narrateur a pour philosophie l'absence d'ambition. Fraîchement licencié, il vit de petits trafics, passe ses journées à arpenter le Paris populaire, du cimetière de Charonne à la porte de Bagnolet, et ses soirées dans les bars. Sa gloire, ce sont les deux femmes qu'il aime : son épouse, Almeria, et leur fille, l'espiègle Lune, dix ans. Mais elles s'inquiètent de ses excès, qui ressemblent à un lent suicide. Jusqu'au jour où il est choisi pour jouer une fée dans le spectacle de fin d'année de l'école : l'occasion de trouver, enfin, le rôle de sa vie ? ... Hommage à la nuit, à l'ivresse et aux rencontres de hasard, Ma gloire interroge nos loyautés et la place que nous occupons dans le monde. De sa plume poétique et fantasque, Florent Oiseau poursuit son exploration fraternelle des gens de l'ombre, et signe un roman poignant sur les histoires que nous nous racontons tous pour survivre.",isbn:"9782073114273",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073114273-M.jpg"},
  {t:"Coeur d'etoile",a:"Colman",y:"2013",ed:"Dupuis",cote:"BDJ BAT",pub:"Jeune",sup:"Imprimé",d:"Tous les marsupilamis se retrouvent sur les rives du lac Harum-Bayac afin de fêter un événement exceptionnel",isbn:"9782800160429",extraUrl:"https://images-eu.ssl-images-amazon.com/images/I/51R0PZPfVQL.jpg"},
  {t:"J'attends un petit frère ou une petite soeur",a:"Dolto-Tolitch",y:"2019",ed:"Gallimard-Jeunesse Giboulées",cote:"J 155.44 DOL",pub:"Jeune",sup:"Imprimé",d:"\"Bientôt nous aurons un bébé à la maison. Je me demande bien si c'est un frère ou une soeur. À partir de maintenant tout sera différent, ça me fait tout drôle, mais je crois que ce sera bien\".",isbn:"9782075115339",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075115339-M.jpg"},
  {t:"Les aventures d'une poule aveugle et d'un canard boiteux",a:"Ulrich Hub",y:"DL 2024",ed:"Gallimard",cote:"J HUB",pub:"Jeune",sup:"Imprimé",d:"Une fable subtile, drôle et pétillante qui célèbre le pouvoir de l'imagination et la force de l'amitié. Il existe un endroit où l'on peut réaliser son voeu le plus secret, et la poule veut s'y rendre ! Elle aurait bien aimée être accompagnée d'un chien guide, mais c'est sur un canard boiteux et très peureux qu'elle tombe. Il tremble déjà à l'idée de quitter son arrière-cour. Qu'importe, il fera bien l'affaire !",isbn:"9782075206907",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075206907-475x500-1.jpg"},
  {t:"Les périphériques",a:"Blondel",y:"DL 2026",ed:"Gallimard",cote:"J BLO",pub:"Jeune",sup:"Imprimé",d:"Axel a quinze ans et vit dans une petite ville de province. Au pied de l'immeuble, il zone avec les copains en tentant d'oublier que l'avenir est un horizon bouché. Et qu'il n'a pas trouvé de stage pour clore son année de seconde. Grâce à son beau-père, il atterrit à Totem Radio, une radio locale que personne n'écoute... Quand les rencontres font des miracles. Un roman social lumineux dont les héros sont les oubliés du système, par l'auteur de Blog et Un été 79.",isbn:"9782075223645",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075223645-475x500-1.jpg"},
  {t:"Henriette ou le grand voyage",a:"Claire Frossard",y:"DL 2024",ed:"Flammarion",cote:"J FRO",pub:"Jeune",sup:"Imprimé",d:"Moi, Henriette, cochon d'Inde de mon état, je fais maintenant partie de la tribu des Grands Campagnols Roux. Nous rêvons d'un nouveau territoire : un endroit où creuser de beaux terriers, avec une rivière et des prairies fleuries. En route pour un grand voyage semé d'embûches et de surprises !",isbn:"9782080440297",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080440297-475x500-1.jpg"},
  {t:"Woke Up Like This",a:"Lea",y:"DL 2026",ed:"Flammarion",cote:"J LEA",pub:"Adolescent",sup:"Imprimé",d:"Organiser le bal de promo parfait est la dernière tâche parfaite à accomplir sur la liste parfaite de Charlotte Wu. Tout irait bien si l'insupportablement désinvolte (et très beau) J. T. Renner, n'avait pas décidé de lui gâcher la vie jusqu'au bout en devenant président du comité des élèves... De rivalités en sarcasmes, un \"accident de décoration\" survient et vingt-quatre heures plus tard, tous deux se réveillent côte à côte dans un lit inconnu : ils ont 30 ans et ils sont fiancés ! Passer à l'âge adulte, savourer le moment présent : une comédie romantique pétillante et irrésistible.",isbn:"9782080493712",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782080493712-475x500-1.jpg"},
  {t:"La fille du chaos",a:"Cassandra O'Donnell",y:"DL 2025",ed:"Flammarion",cote:"J ODO",pub:"Jeune",sup:"Imprimé",d:"Depuis l'arrivée d'agents du Ministère au collège des Enfants Spéciaux, des élèves disparaissent mystérieusement. Lorsque ces hommes inquiétants commencent à s'intéresser à ses pouvoirs, Emma n'a plus qu'une solution pour protéger sa magie : la fuite. Mais Hell, son ténébreux protecteur, disparaît à son tour, et son courage vacille. Seule l'union des créatures surnaturelles de l'école pourrait désormais contrer le Ministère...",isbn:"9782080496850",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080496850-475x500-1.jpg"},
  {t:"La Légende de Tristan et Yseut",a:"Rachmühl",y:"DL 2026",ed:"Flammarion",cote:"J RAC",pub:"Adolescent",sup:"Imprimé",d:"Le roi Marc de Cornouailles a décidé de prendre pour épouse la belle Yseut et charge son neveu, le chevalier Tristan, d'aller la trouver en Irlande. Mais sur le bateau du retour, les deux jeunes gens boivent par erreur un philtre d'amour. Désormais, ils sont condamnés à s'aimer à tout jamais... Retrouvez un des couples les plus mythiques de la littérature dans ce roman de chevalerie et d'amour, adapté par Françoise Rachmuhl.",isbn:"9782080497314",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080497314-475x500-1.jpg"},
  {t:"Yôkai",a:"Thibault Vermot",y:"DL 2022",ed:"Éditions Sarbacane",cote:"J VER",pub:"Jeune",sup:"Imprimé",d:"\"Voici Yanagi, et voici Takata. C'est pas des si mauvais garçons : s'ils m'ont enlevée, c'est qu'ils avaient besoin d'argent. Takata dit qu'il a cassé son sabre et qu'il doit en racheter un. Au fait, moi, c'est Kyoko, et je suis la fille du calligraphe. Ils ont décidé de se cacher dans la montagne en attendant la rançon, mais mon père est si radin qu'ils peuvent toujours courir ! Avec Yanagi, on a pêché des poissons, et j'ai mis une branche dans l'oeil de Takata sans le faire exprès. Moi je m'amuse bien ! Mais Yanagi guette les gens dans la vallée. Bientôt, la montagne grouillera d'hommes du daimyo, le chef de la police. C'est là que j'ai l'idée proposer un plan époustouflant à mes nouveaux copains : le casse du siècle, pas moins ! \"",isbn:"9782377316564",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782377316564-475x500-1.jpg"},
  {t:"Le coeur d'Alluria",a:"Wilkinson",y:"DL 2025",ed:"Saxo",cote:"J WIL",pub:"Jeune",sup:"Imprimé",d:"Il y a bien des manières d'être brave. Fluette a grandi avec les histoires de Bravepatte, le plus grand guerrier du monde des souris. Depuis, elle rêve d'être comme lui : elle aussi veut vivre des aventures et affronter des ennemis. Mais impossible, dans son village où il ne se passe jamais rien ! Jusqu'au jour où surgissent des ombres qui se nourrissent de couleurs et de vie. Pour Fluette, c'est alors l'occasion de prouver qu'être courageux n'est pas une affaire de taille... Bonus exclusif : 2 marque-pages à découper !",isbn:"9782385701529",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701529-475x500-1.jpg"},
  {t:"Les fables du Roi des Aulnes",a:"Ba",y:"DL 2026",ed:"Bayard éditions",cote:"BDJ BA",pub:"Jeune",sup:"Imprimé",d:"Au coeur de la fabuleuse foret de Mynislyvix, deux figures se font face : Goupil, rusé manipulateur qui a déjoué la mort, et le Roi des Aulnes, immortel et solitaire. Leur rivalité anime la forêt depuis la nuit des temps, donnant naissance à une série de contes qui forment la grande Histoire. Reste à savoir comment finira la leur ! Et si les deux ennemis n'étaient finalement pas aussi différents qu'ils ne le pensent ? Un roman graphique qui dégoupille les classiques... Deux figures iconiques se font face dans ce roman graphique : le renard rusé, d'une part, et le monstre mystérieux de l'autre. A travers leurs affrontements répétés, ces deux personnages hauts en nuance questionnent et déconstruisent les rôles classiques des fables : le héros ne serait finalement pas si héroïque, et l'antagoniste pas si méchant... ... signé par un dessinateur au style incomparable Juni Ba nous livre une fois de plus une oeuvre percutante, dans la lignée de Mobilis et The Boy Wonder (Urban Comics). Le dessinateur de comics acclamé joue avec les codes graphiques et n'hésite pas à bousculer nos modes de lectures : contrastes bluffants, découpages ultra dynamique, sens du détail... Les Fables du Roi des Aulnes ne laissera personne indifférent.",isbn:"9791036387654",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036387654-475x500-1.jpg"},
  {t:"Les Petites Voleuses",a:"Renaud",y:"DL 2024",ed:"Éditions Sarbacane",cote:"J REN",pub:"Jeune",sup:"Imprimé",d:"Pauline, alias Popo, n'éblouit personne, à l'inverse de sa cousine Héloïse qui vit dans une banlieue très chic de Paris, fréquente un lycée bourgeois et organise des rallyes. Pauline l'admire et l'envie, et ferait tout, tout, tout pour rentrer dans ses grâces. Or, le seul truc qu'elles ont en commun, Pauline et Héloïse... c'est la kleptomanie. Incapables de s'arrêter, elles volent dans les grands magasins. Jusqu'au jour où Pauline se fait prendre (et pas Héloïse, bien sûr ! ). Plutôt que de payer l'amende, le vieux commissaire en retraite qui s'occupe de son cas lui propose alors un marché pour réparer ses torts... piéger sa cousine ! Paniquée, mais secondée par son meilleur ami, l'irrésistible Boubou, qui en pince pour elle, Pauline saura-t-elle se dépêtrer du guêpier dans lequel elle s'est fourrée ? Une comédie familiale tendre et loufoque, débordante d'amour et de malice.",isbn:"9791040805496",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040805496-475x500-1.jpg"},
  {t:"L'île aux crabes",a:"Thibault Vermot",y:"DL 2024",ed:"Éditions Sarbacane",cote:"J VER",pub:"Jeune",sup:"Imprimé",d:"Depuis le casse du siècle avec deux rônins pas bien méchants, Yanagi (le grand maigre) et Takata (le petit gros), Kyoko, 9 ans, court la campagne médiévale en quête d'aventures. Leur magot sur le dos, le trio s'arrête un soir, pour se restaurer, mais l'aubergiste leur apprend que tous les crabes ont disparu sur une île mystérieuse. En échange de quelques kobans, et la promesse de riz au crabe, le trio se lance alors à la pêche aux crustacés. Or, à leur arrivée sur l'île, ils découvrent que l'aubergiste les a bernés et leur a volé leur magot. Pire ! Les crabes, oui les crabes ! sont gigantesques et les pourchassent. Ils se réfugient alors dans la forêt, mais ils ne sont pas au bout de leur surprise ! Des fantômes de naufragés les attendent, tapis dans l'obscurité d'une grotte...",isbn:"9791040806394",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040806394-475x500-1.jpg"},
  {t:"Tous tes enfants dispersés",a:"Umubyeyi-Mairesse",y:"2019",ed:"Autrement",cote:"R UMU",pub:"Adulte",sup:"Imprimé",d:"Les relations sur trois générations d'une famille brisée par la guerre. Blanche, rwandaise, a grandi à Bordeaux après avoir fui le génocide de 1994. Elle vit avec son mari et son garçon, Stokely. Un jour, elle revient au Rwanda, à Butare, pour retrouver sa mère, Immaculata. L'amour et le pardon les réuniront-elles ? Quand à Stokely, il veut tout savoir de ce passé familial. Premier roman. ©Electre 2019",isbn:"9782746751392",extraUrl:"https://covers.openlibrary.org/b/isbn/9782746751392-M.jpg"},
  {t:"Skandar et la guerre de l'esprit",a:"Steadman",y:"DL 2026",ed:"Hachette",cote:"J STE",pub:"Jeune",sup:"Imprimé",d:"L'Ile est en guerre. Skandar, devenu hors-la-loi, se cache depuis que Rex Manning a révélé l'identité de sa mère lors de la dernière Coupe du Chaos. Mais alors que Rex se prépare à envahir le continent, les habitants de l'Ile ne savent plus à qui se fier. Et après la trahison de Florence, qui se bat maintenant pour le camp ennemi, Skandar doit construire de nouvelles alliances, y compris avec Kenna. Pour remporter la Guerre de l'Esprit, Skandar et ses amis devront remonter aux origines de l'Ile et exploiter toute la puissance de leur magie.",isbn:"9782017248378",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782017248378-475x500-1.jpg"},
  {t:"Athéna la Guerrière",a:"Prévot",y:"DL 2026",ed:"Larousse",cote:"J PRE",pub:"Jeune",sup:"Imprimé",d:"P'tite Athéna est une déesse rusée et fière. Dans toute sa bonté, elle aide les dieux à affronter les géants, déterminés à détruire l'Olympe. Pleine de sagesse, elle guide P'tit Hercule, missionné par Zeus, pour sauver tout le Panthéon grec. Mais parviendra-t-elle à éviter tous les obstacles ? P'tite Athéna devra mobiliser toute la ruse qui est en elle pour y parvenir.",isbn:"9782036079830",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782036079830-475x500-1.jpg"},
  {t:"Hermès le Malicieux",a:"Prévot",y:"DL 2026",ed:"Larousse",cote:"J PRE",pub:"Jeune",sup:"Imprimé",d:"P'tit Hermès est un dieu fourbe et malicieux. Il n'hésite pas à faire des farces aux autres dieux, notamment en volant leurs biens les plus précieux. Pour calmer leur colère, Zeus charge Hermès d'accomplir une nouvelle mission : libérer la vache sacrée Io, gardée par le géant Argos. Mais les dieux mécontents cherchent à se venger : ils n'hésitent pas à placer plein d'obstacles sur la route du dieu messager. Hermès va devoir mobiliser toute son ingéniosité pour mener sa quête à bien.",isbn:"9782036089341",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782036089341-475x500-1.jpg"},
  {t:"Jusqu'à leur dernier souffle",a:"Craig",y:"DL 2026",ed:"Editions Casterman",cote:"J CRA",pub:"Jeune",sup:"Imprimé",d:"Tous les dons ont un prix... Avant même sa naissance, Hazel Trépas fut promise au dieu de la Mort. Devenant son parrain, il lui offre un don qui fera d'elle une grande guérisseuse. D'un simple toucher elle est capable de déduire le mal dont souffre quelqu'un. En contrepartie, si elle utilise son pouvoir et qu'un crâne apparaît sur le patient, elle a pour devoir d'abréger ses souffrances... A 18 ans, Hazel est déjà hantée par les fantômes de tous ceux qu'elle a tués et aspire à fuir ses responsabilités. Mais le destin l'amène à la cour royale, où elle est confrontée à un dilemme : prendre la vie d'un roi marqué par la mort, condamnant ainsi le royaume à un chaos certain, ou chercher par tous les moyens un remède en défiant la Mort en personne... Prise entre les complots à la cour, un panthéon de divinités à la moralité douteuse et l'agaçant mais non moins séduisant prince Léopold, Hazel va devoir faire un choix et en assumer les conséquences.",isbn:"9782203293090",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203293090-475x500-1.jpg"},
  {t:"L'attrape-foudre",a:"Bussy",y:"DL 2026",ed:"R. Laffont",cote:"J BUS",pub:"Adolescent",sup:"Imprimé",d:"Farah a le coup de foudre pour Tao. Ensemble, ils vont prendre le risque de se brûler les ailes... Un superbe roman sur l'urgence et la voracité de l'adolescence. En attendant l'année du bac, Farah travaille tout l'été à la station-service familiale. Un jour, une vieille Ferrari blanche brinquebalante s'arrête à la pompe. A son volant : Tao, un garçon au charme magnétique, si libre, si différent de ceux que Farah connaît. Lorsqu'il lui propose de le suivre dans son road-trip vers les orages du Sud, la jeune fille ne peut qu'accepter. Mais au fil des kilomètres et des confidences, Farah comprend que Tao joue avec le feu. Et que sa fuite pourrait bien les brûler tous les deux...",isbn:"9782221286654",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782221286654-475x500-1.jpg"},
  {t:"Le disparu du train de 15h12",a:"Faustina Fiore / Pierre Druart",y:"DL 2026",ed:"Albin Michel",cote:"J FIO",pub:"Jeune",sup:"Imprimé",d:"Suivez les aventures palpitantes de Jeanne, Mélina et Francine, les jeunes soeurs de Louis et Auguste Lumière, célèbres inventeurs du cinéma ! Septembre 1890. Le génial inventeur Augustin Leprince se rend à Paris pour affaires. Monté dans le train à 15 h 12, il n'en est jamais descendu... Quelqu'un l'aurait-il enlevé ? Pire, assassiné ? Jeanne, Mélina et Francine redoutent qu'on accuse leurs frères d'avoir voulu éliminer un concurrent gênant, lancé comme eux dans la course à une invention spectaculaire : le cinéma. Afin de prouver leur innocence, les trois soeurs Lumière mènent une enquête époustouflante, en plein coeur de Paris.",isbn:"9782226502421",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226502421-475x500-1.jpg"},
  {t:"La mémoire des vaincus",a:"Guillou",y:"DL 2026",ed:"Didier jeunesse",cote:"J GUI",pub:"Adolescent",sup:"Imprimé",d:"A Novi Zora, tout s'achète, même les souvenirs. Voilà quatorze ans que la nation, vaincue par Mirska lors d'une guerre sans merci, vit dans la honte et la misère. Anastasia connaît bien la valeur de la poussière mémorielle : elle a vendu son passé pour devenir voleuse de souvenirs. Ses missions, de plus en plus dangereuses, la mènent jusqu'au Parlement des Trente. C'est là que Lev compte trouver sa place en gravissant les échelons politiques, aidé d'un mentor anonyme. Contrairement à ses traîtres de parents, effacés de toutes les mémoires par le châtiment de la damnatio memoriae, il entend marquer l'Histoire en restaurant la gloire de sa patrie. Mais dans les coulisses du Parlement, les souvenirs les plus précieux attisent les convoitises. Quand les échos du passé se heurtent aux ambitions de l'avenir, il faut parfois se méfier de sa propre mémoire...",isbn:"9782278132157",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782278132157-475x500-1.jpg"},
  {t:"Tes mots sur les murs",a:"Renard",y:"DL 2026",ed:"Rageot",cote:"J REN",pub:"Jeune",sup:"Imprimé",d:"Dans le collège d'Olympe, un poète anonyme écrit ou colle sur les murs des messages féministes éphémères qu'elle et Assia, sa meilleure amie, immortalisent en les repostant sur Instagram. Comme ces poèmes-collages se font de plus en plus engagés, le Principal est décidé à démasquer celui qu'il considère comme un vandale. Olympe aussi veut découvrir l'identité du Poète. Elle brûle de se sentir utile dans cette lutte féministe qui s'étend dans le collège, encouragée par leur professeure de français. Elle se fait une nouvelle amie, Laula, rencontrée au club féministe. Jusqu'où iront-elles, au nom d'une noble cause ?",isbn:"9782700286953",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782700286953-475x500-1.jpg"},
  {t:"Tout ce que je ne sais pas",a:"Lume",y:"DL 2026",ed:"Éditions Sarbacane",cote:"J LUM",pub:"Adolescent",sup:"Imprimé",d:"Eléonore a eu un accident. Après un an de convalescence, elle sort de son cocon pour se confronter à sa vie d'avant, dont elle a tout oublié. Anciens amis, amoureux, profs... ont chacun une version différente de qui elle était, et de ce qui s'est réellement passé. Plus elle tente de reconstituer le puzzle, plus la vérité lui échappe. Que cherche-t-on à lui cacher ?",isbn:"9791040809326",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040809326-475x500-1.jpg"},
  {t:"Le cercle de ronces",a:"Anssel",y:"DL 2025",ed:"Gallimard",cote:"J ANS",pub:"Jeune",sup:"Imprimé",d:"Le pari fou d'une rébellion clandestine féministe, dans un monde où la magie détraque les esprits. Au coeur d'une forteresse assiégée, Lalie, la plus grande Sorcière de l'Histoire, livre à huit scribes un récit aux airs de testament. Celui d'une orpheline, qui a fait trembler l'Empire. D'une jeune prodige, qui défie un système patriarcal cruel. D'une cheffe de guerre, au bord de la défaite...",isbn:"9782075232302",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075232302-475x500-1.jpg"},
  {t:"Les Mystères de Byton Cove - La nuit de la disparition",a:"Sivi",y:"2026",ed:"Fleurus",cote:"J SIV",pub:"Jeune",sup:"Imprimé",d:"De retour à Byton Cove après Noël, Ruby retrouve ses amis du club international et intègre le département de photographie. Elle espère un nouveau départ, loin de l'attention médiatique des dernières semaines. Mais voilà qu'elle est entraînée dans une nouvelle affaire ! Juana Moya lui demande d'enquêter, avec Charles, sur la disparition de son fils, Arturo, vingt-huit années plus tôt. Un seul témoin : le petit frère de la victime, Gabriel, qui l'accompagnait dans les bois de Williams Wood, cette nuit-là'et qui est persuadé qu'Arturo a été enlevé par des extraterrestres ! Ruby, Charles et leurs amis essaient de démêler le vrai du faux, s'intéressent aux théories du complot et investiguent le passé de cet Arturo, brillant étudiant d'origine immigrée qui rêvait d'être astrophysicien'Ruby cherche la vérité. Pourtant, elle sait bien que l'on peut se perdre soi-même à poursuivre des fantômes",isbn:"9782215200253",extraUrl:"https://products-images.di-static.com/image/base/9782215200253-475x500-1.jpg"},
  {t:"Les 5 lettres du mot coeur",a:"Cassidy",y:"DL 2026",ed:"Pocket",cote:"J CAS",pub:"Jeune",sup:"Imprimé",d:"Par l'autrice de la série culte Les Filles au chocolat ! Un coeur, cinq amis, zéro contact depuis deux ans... et si tout changeait ? Carrie, Omisha, Eden, Uma et Ryan sont inséparables depuis leur enfance. Leurs prénoms commencent comme les cinq lettres du mot coeur... C'est un signe ! Mais une violente dispute lors de l'anniversaire de Carrie vient séparer le groupe d'amis. Eden et Ryan qui étaient amoureux secrètement, sont fâchés à mort. Vont-ils tous pouvoir recoller les morceaux de l'amour et de l'amitié ?",isbn:"9782266357678",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782266357678-475x500-1.jpg"},
  {t:"Le talisman des 4 dragons - Tome 1 : La flamme perdue",a:"Yasmine Djebel",y:"2026",ed:"Rageot",cote:"J DJE",pub:"Jeune",sup:"Imprimé",d:"Le talisman des 4 dragons a &eacute;t&eacute; bris&eacute;&nbsp; ! Selon la l&eacute;gende, les Temp&ecirc;tes risquent de d&eacute;ferler sur l&rsquo;Archipel.<br />Ne&iuml;la se fiche de ces vieilles histoires jusqu&rsquo;au moment o&ugrave; la statue d&rsquo;un fennec prend vie devant ses yeux. Il affirme &ecirc;tre un esprit des temps anciens et confirme la menace qui plane. Ne&iuml;la, qui a plusieurs choses &agrave; se reprocher, d&eacute;cide de partir &agrave; la rencontre du dragon rouge pour demander son aide&hellip",isbn:"9782700286175",extraUrl:"https://products-images.di-static.com/image/base/9782700286175-475x500-1.jpg"},
  {t:"Ma déclaration",a:"Gaël Aymon",y:"DL 2026",ed:"Gallimard",cote:"J AYM",pub:"Jeune",sup:"Imprimé",d:"Une romance lycéenne à deux voix, aussi juste que sensible, par l'auteur de Ma réputation. Yanis est fou amoureux de Camille. Camille aime Yanis, mais elle lui avoue dans une lettre avoir embrassé d'autres garçons. Yanis vit seul avec sa mère et se demande ce que signifie \"être un mec\" aujourd'hui. Camille est en conflit avec ses parents, qui avaient prévu pour elle un avenir tout tracé. Chacun traversé par des doutes et des questionnements, réussiront-ils à préserver le lien qui les unit ?",isbn:"9782075226035",extraUrl:"https://products-images.di-static.com/image/base/9782075226035-475x500-1.jpg"},
  {t:"Le petit Gus",a:"Desmarteau",y:"DL 2026",ed:"Gallimard",cote:"BDJ DES",pub:"Jeune",sup:"Imprimé",d:"Ecole, famille, copains... des tranches de vie aussi tendres que drôles racontées par un truculent petit diable. \"Moi c'est Gus. En fait, je m'appelle Gustave, tout ça parce que les vieux prénoms moches étaient à la mode le jour où je suis né. J'aurais préféré m'appeler Brad, Bob ou même Brian, mais je suis bien obligé de me coltiner Gustave\".",isbn:"9782075226189",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075226189-475x500-1.jpg"},
  {t:"Merlin et Chou chez les pirates",a:"Adam Stower / Claire-Marie Clévy",y:"2025",ed:"Flammarion",cote:"J CLE",pub:"Jeune",sup:"Imprimé",d:"Un chat pantouflard, un lapin à la crème, une chatière magique... En avant pour des aventures poilantes ! Merlin et Chou forment un duo aussi poilu que craquant. Ensemble, ils partent à l'aventure ! Car, oui, la chatière de Merlin est magique. Aujourd'hui, elle propulse les deux amis sur un bateau de pirates ! Cap sur l'Île aux Monstres, à la recherche d'un fabuleux trésor..",isbn:"9782080489241",extraUrl:"https://products-images.di-static.com/image/base/9782080489241-475x500-1.jpg"},
  {t:"Une part de tarte sauce trahison",a:"Aurélie C Moulin",y:"2026",ed:"Nathan",cote:"J MOU",pub:"Jeune",sup:"Imprimé",d:"Mystère, humour et brioches à gogo ! Une nouvelle enquête savoureuse dans l'univers irrésistible de Wilhelmina Picpus. Bienvenue à l'Académie Wilford, où les secrets se cachent derrière chaque brioche ! Et ne faites confiance à personne... Jour de rentrée à l'austère Académie Wilford ! Wilhelmina Picpus - élève indisciplinée le jour, enquêtrice en herbe la nuit (et pas seulement...) - est ravie. Elle commençait à s'ennuyer et elle sait que les distractions ne manqueront pas dans cet étonnant pensionnat. Au programme : un concours inter-académies, des manigances, des secrets inavouables, un mariage interdit... le tout saupoudré de sucre vanillé, bien entendu ! Un roman cosy mystery drôle et rythmé qui mêle enquête, humour et gourmandises",isbn:"9782095059620",extraUrl:"https://products-images.di-static.com/image/base/9782095059620-475x500-1.jpg"},
  {t:"Les oursons de l'air",a:"Lobel",y:"DL 2026",ed:"L'École des loisirs",cote:"J LOB",pub:"Jeune",sup:"Imprimé",d:"Dans le livre préféré de grand-père, il est écrit qu'un ours doit absolument savoir se promener, se reposer, attraper du poisson et grimper aux arbres. Ronald, Donald, Harold et Sam, eux, préfèrent jouer du violon, faire des triples saltos ou manier un lasso. Grand-père décide de prendre les choses en main.",isbn:"9782211349666",extraUrl:"https://products-images.di-static.com/image/base/9782211349666-475x500-1.jpg"},
  {t:"Rousse et l'oiselle de feu",a:"Élodie Chan",y:"DL 2026",ed:"L'École des loisirs",cote:"J CHA",pub:"Jeune",sup:"Imprimé",d:"Rousse s'engouffre dans les tréfonds du bois, sur les traces de Yaya, la sorcière d'automne. Accompagnée de ses chimères, celle-ci a juré d'emporter sa grand-mère au royaume des morts. Mais Rousse est bien décidée à l'affronter ! A moins que l'oiselle de feu, créature aux pouvoirs légendaires, ne lui ouvre un autre chemin ?",isbn:"9782211350068",extraUrl:"https://products-images.di-static.com/image/base/9782211350068-475x500-1.jpg"},
  {t:"Renversante",a:"Florence Hinckel / Clothilde Delacroix",y:"DL 2026",ed:"L'École des loisirs",cote:"J HIN",pub:"Jeune",sup:"Imprimé",d:"Depuis la nuit des temps, ce sont les hommes qui s'occupent des enfants. C'est normale et naturelle, puisque les femmes, elles, portent les enfants dans leur ventre pendant neuf mois, puis elles les allaitent si elles veulent, ce qui les fatigue beaucoup. Elles n'allaient pas, en plus, s'en occuper le restant du temps ![xe2][x80][xa6] C'est pour ça que, dans mon pays, ce sont les femmes qui sont à la tête de l'État. Quelques hommes particulièrement intelligents ont réussi à se hisser au même rang qu'elles (même si on n'a encore jamais vu un homme présidente de la République). Ils sont très méritants, quand on pense à la charge qu'ils assument en plus à la maison[xe2][x80][xa6]",isbn:"9782211350921",extraUrl:"https://products-images.di-static.com/image/base/9782211350921-475x500-1.jpg"},
  {t:"Les Nouvelles Vagues",a:"Cathrine",y:"2026",ed:"Pocket",cote:"J CAT",pub:"Jeune",sup:"Imprimé",d:"Après le succès de *Romance*, découvrez l'histoire de Vince, Micha, Marilyn et Octave : quatre ados en quête d'eux-mêmes, entre premiers amours, doutes et épreuves de la vie. Les Nouvelles Vagues, c'est Vince, Micha, Marilyn et Octave. Les Nouvelles Vagues, c'est le portrait d'une génération qui invente sa façon d'aimer et d'être soi. Moi, je veux flamber. Sinon on n'est pas vivant. Je veux me jeter sur tout ce qui est inflammable. Même si j'ai peur. La vie me fait peur. Les garçons me font peur. Les filles me font peur. Mais je veux cramer. Ce sera bref, et qu'est-ce qu'on s'en fout : pourquoi une histoire courte ne serait-elle pas une histoire tout court'",isbn:"9782266354462",extraUrl:"https://products-images.di-static.com/image/base/9782266354462-475x500-1.jpg"},
  {t:"L'île des animaux fabuleux",a:"Sofia Chanfreau / Amanda Chanfreau",y:"DL 2025",ed:"Milan",cote:"J CHA",pub:"Jeune",sup:"Imprimé",d:"« Loin, au milieu de l'océan (sans doute précisément l'océan que tu imagines), se trouve une île (sans doute précisément l'île que tu imagines). Cette île a la forme d'une girafe, en tout cas si on la regarde d'en haut, ou bien si on l'observe sur une carte et qu'on a un peu d'imagination : c'est l'Île-Girafe. On dirait que cette île a trois jambes et une petite queue, un grand corps et un long cou terminé par une tête. Au milieu de son corps, il y a un grand lac qu'on appelle le Coeur-de-la-Girafe. L'eau du lac est aussi sucrée que de la limonade et sa surface est presque toujours calme, alors que la mer salée qui entoure l'île est toujours agitée. (...) Dans l'une des maisons les plus hautes de la Capitale vit une petite fille. (...) Cette fille s'appelle Vega, et elle s'assoit souvent à sa fenêtre pour rêver de ce qui se trouve de l'autre côté de la mer. »Une héroïne touchanteVega vit seule avec son papa. Seule ? Pas du tout en fait, car toute une ribambelle d'animaux lui tiennent compagnie. Même si son père les trouve bien trop envahissants, Vega est la seule à les voir : grizzlis, zèbres, hippocampes ou rhinocéros... vivent dans son placard, au coin de la rue ou dans la salle de bains. Elle croise même des lapins sans oreilles, des souris à rayures, des chevaux petits comme des chats et des scarabées gros comme des cochons d'Inde. Sans parler de tous ceux qu'il est impossible de décrire, comme les fripourdons, les spatulots, les crapaçons et les tétrabranchipattes... Quête et résilienceDepuis quelque temps, Vega est inquiète : son père a changé, il s'absente souvent. Il semble lointain, il l'écoute à peine, il est devenu... froid ! Bientôt, Vega apprend qu'une femme de glace s'est emparée de son coeur, et voit son père en train de se couvrir de givre... Pour le sauver, elle part à la recherche de sa mère dont elle ne sait rien...Un texte pour s'évader et voyager très loin, jouer avec son imagination et apprivoiser ses peurs.Revue de presse« Un livre qui...",isbn:"9782408050924",extraUrl:"https://products-images.di-static.com/image/base/9782408050924-475x500-1.jpg"},
  {t:"Mamie Pirouette",a:"Claire Renaud",y:"2026",ed:"Éditions Sarbacane",cote:"J REN",pub:"Jeune",sup:"Imprimé",d:"Quand la danse classique vire à la tyrannie, une solution : appeler Mamie Marguerite et sa bande de copains retraités ! PLIÉ, TENDU PLIÉ, TENDU À l'école de danse, Mademoiselle Gisèle règne d'une main de fer : entre cris, punitions et chorégraphies interminables, Juliette et ses amies n'en peuvent plus. Mais Juliette peut compter sur Mamie, toujours prête à dégainer ses idées farfelues ! Avec l'aide de ses copains retraités - et d'une bande d'élèves bien décidés à dire « non à la tyrannie » - la révolte s'organise. Cette fois, fini les entrechats, vive la liberté !",isbn:"9791040808121",extraUrl:"https://products-images.di-static.com/image/base/9791040808121-475x500-1.jpg"},
  {t:"Crazy Kart",a:"Jim Davis",y:"2013",ed:"Dargaud",cote:"BDJ DAV",pub:"Jeune",sup:"Imprimé",d:"Garfield décide cette fois de tester ses nouvelles inventions sur Odie et Jon. Au volant d?un bolide, il va entraîner ses amis dans une course-poursuite endiablée.",isbn:"9782205071528",extraUrl:"https://products-images.di-static.com/image/base/9782205071528-475x500-1.jpg"},
  {t:"La montagne ardente",a:"Manevy",y:"DL 2026",ed:"Le Bruit du monde",cote:"R MAN",pub:"Adulte",sup:"Imprimé",d:"Depuis des générations, les Manevy sont installés au pied du Lizieux, un volcan auvergnat éteint. Ils ont traversé le vingtième siècle au rythme de ses petites victoires et de ses grandes désillusions, un siècle de guerres et de progrès qui ont modifié notre rapport au monde et à la nature. Cette famille ordinaire contient des destins extraordinaires. Parmi eux Joseph, le grand-père que le narrateur n'a jamais connu : un funambule, qui marche sur les mains et vit toujours entre deux mondes. Jeanne, devenue sa femme après qu'ils se sont rencontrés sur le tard ; Victor, le grand-oncle curé qui aurait inspiré Albert Camus quand il écrivait La Peste... C'est tout un monde de labeur, de tendresse et de poésie que l'auteur exhume sous nos yeux. La colline qui travaille et La montagne ardente auraient dû être un seul et même texte. Philippe Manevy a finalement choisi de donner à chacun une existence distincte. Après avoir suivi le fil de sa lignée maternelle, il aborde ici le versant paternel de son histoire. Avec élégance et agilité, il va et vient entre deux mondes, l'ancien et le nouveau, la campagne et la ville, et cherche, comme le travailleur de la terre, à les faire pousser dans un même jardin.",isbn:"9782386010880",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386010880-M.jpg"},
  {t:"Le jardin des flamboyants",a:"Falmarès",y:"DL 2026",ed:"Flammarion",cote:"841 FAL",pub:"Adulte",sup:"Imprimé",d:"\"Que chante ce recueil ? Il chante la grandeur de l'homme. La possibilité de s'inventer un destin plus solaire, plus beau, plus légitime, plus noble. Il chante l'hymne d'un exil, ou celui d'un pays, le drap d'un sans-abri, la porte d'un étranger, la kora d'un griot, qui sait ? Une folle chanson. Une immensité au-delà de la terre. Tout poète rêve d'écrire un grand poème. Moi aussi j'ai ce rêve-là. J'espère que ce recueil se rapproche de ce rêve, ou peut-être qu'il en est un.\"",isbn:"9782080498625",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080498625-M.jpg"},
  {t:"Leurs enfants après eux",a:"Mathieu",y:"DL 2018",ed:"Actes Sud",cote:"R MAT",pub:"Adulte",sup:"Imprimé",d:"Août 1992. Une vallée perdue quelque part à l'Est, des hauts fourneaux qui ne brûlent plus, un lac, un après-midi de canicule. Anthony a 14 ans, et avec son cousin, ils s'emmerdent comme c'est pas permis. C'est là qu'ils décident de voler un canoë pour aller voir ce qui se passe de l'autre côté, sur la fameuse plage des culs-nus. Au bout, ce sera pour Anthony le premier amour, le premier été, celui qui décide de toute la suite. Ce sera le drame de la vie qui commence. Avec ce livre, Nicolas Mathieu écrit le roman d'une vallée, d'une époque, de l'adolescence, le récit politique d'une jeunesse qui doit trouver sa voie dans un monde qui meurt, cette France de l'entre-deux, celle des villes moyennes et des zones pavillonnaires, où presque tout le monde vit et qu'on voudrait oublier. Prix Goncourt 2018",isbn:"9782330108717",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330108717-M.jpg"},
  {t:"L'art du ricochet",a:"Delesalle",y:"DL 2026",ed:"Jean-Claude Lattès",cote:"R DEL",pub:"Adulte",sup:"Imprimé",d:"La plus jolie fille de la maternelle, le bateau pirate Playmobil de ses rêves, devenir joueur de foot professionnel, faire 1, 80 mètre, ou être le seul fils de son père, Kolia a déjà su renoncer à un certain nombre de choses dans la vie. Alors quand il est arrêté par la police moldave de retour d'un reportage en Ukraine, sans aucune idée de ce qu'il a pu faire de mal, il identifie l'un de ces moments où il va falloir rebondir. Autant se repasser la liste de ses revers pour trouver l'énergie nécessaire, dans la voiture qui l'embarque menottes aux poignets vers une destination inconnue, dans ce pays où la question la plus posée sur Google est : \"Pourquoi la Moldavie existe ? \", au coeur de cette région où il a côtoyé le meilleur et le pire. Aussi désopilant qu'intelligent, drôle, poétique, tendre et édifiant, un texte qui exalte la capacité de rebond de chacun dans les deuils futiles ou immenses, dans les drames intimes ou les tragédies collectives, un hommage à tous ceux qui ont appris à maîtriser l'art du ricochet. \"Une introspection entre autodérision et poésie\". Gala",isbn:"9782709676267",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709676267-M.jpg"},
  {t:"Ici, les miracles ont un goût de ciel",a:"Fleury",y:"DL 2026",ed:"Charleston",cote:"R FLE",pub:"Adulte",sup:"Imprimé",d:"Dans cette ville du sud de l'Italie, ça sent les épices, la friture de poisson et le soleil. Ici, on dit que s'accomplissent parfois des miracles. Emilienne, photographe française en quête d'identité et d'aventure, espère capturer ces phénomènes troublants. Alors qu'elle arpente la ville pour la première fois, on la met tout de suite en garde. Si elle croise le Petit Moine, qu'elle n'attende pas de miracles mais de grands bouleversements. Qui est cet être que tout le monde craint ? Existe-t-il vraiment ? En se lançant à sa recherche, Emilienne va rencontrer des figures inoubliables dont les histoires vont se nouer à la sienne et la mener à révéler des secrets de son passé. Dans ce roman hypnotique, Adeline Fleury entrelace avec maestria le destin d'une femme et l'âme d'une ville énigmatique et majestueuse, où l'on croit aux malédictions autant qu'aux prodiges.",isbn:"9782385294830",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385294830-M.jpg"},
  {t:"Lois Lane & le challenge de l'amitié",a:"Ellis",y:"DL 2021",ed:"Urban Comics",cote:"BDJ ELL",pub:"Jeune",sup:"Imprimé",d:"A treize ans, Lois Lane est accro aux réseaux sociaux, et plus particulièrement aux challenges en tous genres que l'on trouve sur Internet. Alors pourquoi ne pas apporter sa pierre à l'édifice en créant sa propre chaîne de vidéos ? Après tout, c'est le début de l'été à Liberty View et dans quelques jours se tiendra la course annuelle de vélo du quartier. Une toile de fond idéale pour célébrer son \" amiversaire \" avec Kristen, sa meilleure amie, et lancer son #challengedelamitié dans l'espoir de gagner un tas d'abonnés. Alors quand Lois apprend que les feux d'artifice de la fête ont été volés, elle y voit une opportunité supplémentaire d'alimenter son projet et de prouver au monde à quel point elle et Kristen sont soudées. Elle n'avait pas imaginé une seule seconde qu'une autre fille puisse accaparer l'attention de son amie à un moment si important, ni que celle-ci prévoirait de partir en camp de vacances juste après la course, la laissant seule pour les semaines à venir. Le challenge de l'amitié est encore loin d'être gagné.",isbn:"9791026819974",extraUrl:"https://products-images.di-static.com/image/base/9791026819974-475x500-1.jpg"},
  {t:"Sur leurs traces",a:"Rostagnat",y:"DL 2026",ed:"Editions Gabelire",cote:"R ROS",pub:"Adulte",sup:"Imprimé",d:"Jérémy Bouscarat est infirmier à l'hôpital Lariboisière. Une nuit, alors qu'il est dehors devant les urgences, une voiture pile face à lui. Au volant, une femme en état de choc ; à l'arrière, deux enfants blessés par balle. Lorsque le commandant Alexane Laroche arrive sur place, la mère est introuvable. Pourquoi s'est-elle évaporée dans la nuit ? Pour la policière démarre une course contre la montre ; pour l'infirmier, une quête obsessionnelle qui le transformera à jamais. Qui des deux aura le fin mot de l'histoire ? Finaliste Prix Maison de la presse 2025",isbn:"9782370835048",extraUrl:"https://covers.openlibrary.org/b/isbn/9782370835048-M.jpg"},
  {t:"Le super week-end des forêts",a:"Alméras",y:"DL 2025",ed:"Maison Georges",cote:"BDJ ALM",pub:"Jeune",sup:"Imprimé",d:"Dans cette nouvelle aventure, Orni, Rat et Castor sont rejoints par Renarde dans une cabane refuge au milieu des bois. Un super week-end attend les quatre amis, la découverte d'un écosystème fascinant : la forêt. De la naissance d'un arbre à la fabuleuse biodiversité des forêts de notre planète : une bande dessinée pour découvrir les secrets de ce monde extraordinaire.",isbn:"9782382150931",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782382150931-475x500-1.jpg"},
  {t:"Pluie",a:"Morel",y:"DL 2025",ed:"Editions Panthera",cote:"BDJ MOR",pub:"Jeune",sup:"Imprimé",d:"\"Pluie est une créature toujours triste. Et plus il est triste, plus ses bras s'allongent... Il est timide, discret et parle peu.\" Quand, excédés par ses maladresses, les villageois et villageoises le chassent de chez lui, Pluie n'a plus qu'une seule solution, se réfugier dans la forêt mystérieuse...",isbn:"9782494182158",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494182158-475x500-1.jpg"},
  {t:"Le Passeur d'âmes",a:"Taylor",y:"DL 2025",ed:"Jungle",cote:"BDJ TAY",pub:"Jeune",sup:"Imprimé",d:"Dorian Leith peut voir les fantômes. Non seulement cela, mais il est à l'écoute de leurs problèmes et essaie de les aider à passer dans l'au-delà. Un don qui a fait de lui un paria pour tous les habitants de la ville. Un jour, la clé de la Porte de la Mort est volée, emprisonnant tous les fantômes dans le monde des vivants. Si cette dernière n'est pas retrouvée rapidement, le pire est à craindre... Dorian est bien décidé à faire tout ce qui est en son pouvoir pour apporter la paix aux morts agités - mais attention, cette paix pourrait bien se faire au prix de la sienne...",isbn:"9782822245753",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782822245753-475x500-1.jpg"},
  {t:"Un Zoo de Papier",a:"Darlot",y:"DL 2025",ed:"Kennes",cote:"BDJ DAR",pub:"Jeune",sup:"Imprimé",d:"Dans les Grands Lointains, mon tigre m'a raconté qu'il n'était pas le seul de son espèce... Qu'il y avait toute une ménagerie qui le secondait... Comme un zoo de papier.",isbn:"9782931300190",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782931300190-475x500-1.jpg"},
  {t:"La forêt des esprits",a:"Élisabeth JAMMES, Élisabeth JAMMES",y:"DL 2024",ed:"Bande d'ados",cote:"BDJ JAM",pub:"Jeune",sup:"Imprimé",d:"Avec l'aide de son équipe, Fortuna a réussi à vaincre le démon qui lui a volé ses pouvoirs, et s'est libérée de la pression familiale.Maintenant, elle veut découvrir quelle magie lui correspond vraiment ! Pour cela, elle et son équipe se rendent chez la sorcière Estrella, qui habite aux confins d'une forêt millénaire. Et lorsque cette forêt semble s'éveiller et attaque les jeunes sorcières, Fortuna devra affronter une nouvelle menace, et de vieux démons, pour révéler son vrai pouvoir. Découvrez la fin de l'aventure la jeune sorcière Fortuna ! Dans le deuxième volet de cette duologie, la jeune sorcière devra affronter les démons du passé et la menace d'une forêt envoutée pour découvrir sa véritable voie. Un final palpitant et plein d'émotions, signé Elisabeth Jammes !",isbn:"9791036363177",extraUrl:"https://products-images.di-static.com/image/base/9791036363177-475x500-1.jpg"},
  {t:"Compte avec nous !",a:"Mantegazza",y:"DL 2022",ed:"Quatre Fleuves",cote:"A MAN",pub:"Jeune",sup:"Imprimé",d:"La collection des livres à trous s'agrandit ! Il était une fois UN drôle de crapaud qui avait un secret : il adorait compter... Au lecteur de l'accompagner ! Compter sur ses doigts, c'est facile, surtout quand chaque page offre des petits trous à jouer, des histoires-ritournelles et toute une galerie d'animaux rigolos pour aider à compter de 1 à 10... Un beau cartonné à trous rythmé de comptines pour jouer et apprendre à compter !",isbn:"9791026403654",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791026403654-475x500-1.jpg"},
  {t:"Mémoires de Fleur",a:"Bertrand Santini",y:"DL 2025",ed:"Éditions Sarbacane",cote:"J SAN",pub:"Jeune",sup:"Imprimé",d:"De sa naissance à ses premiers pas, de son premier chagrin à sa première joie, de ses rencontres avec son Pépé Narbier, un chaton ronchon nommé Jean-Jacques (futur Tête de Fesses !), d`une hérissonne qui prononce pas les \" s \" comme les autres, et d`une joyeuse petite chienne nommée Gurty, Mémoires de Fleur porte, avec la poésie des \" idiots littéraires \", la voix de la plus gentille et timide des chiennes. Véritable récit initiatique, traversé par des thématiques puissantes, Fleur fait l`apprentissage du deuil et de la vie, des liens d`amour et d`amitiés avec un regard à hauteur de truffe",isbn:"9791040807582",extraUrl:"https://covers.openlibrary.org/b/isbn/9791040807582-M.jpg"},
  {t:"Retour à la vallée des anges",a:"Couturiau",y:"DL 2025",ed:"Presses de la Cité",cote:"R COU",pub:"Adulte",sup:"Imprimé",d:"Peut-on échapper à son destin ? Sébastien Simonay, journaliste sportif parisien, se rend souvent à Metz pour son travail. Sa rencontre avec Louis, un sans-abri passionné par la cathédrale Saint-Etienne, va bouleverser sa vie. Lorsque son \" ami \" Louis disparaît, Sébastien se met en tête de le retrouver. Son enquête, tournant à l'obsession, lui fait croiser l'énigmatique Aline, puis l'entraîne dans l'inconnu de ses propres racines... italiennes. Sébastien part alors sur les traces de ses ancêtres, ouvriers pauvres qui ont dû prendre le chemin de l'exil et ont rêvé d'un \" Texas lorrain \", jusqu'à leur installation dans la vallée des Anges, aux allures d'enfer avec ses hauts-fourneaux... Peu à peu, de secrets en révélations, Sébastien va renouer avec son récit familial. Entre passé et présent, une page émouvante de l'histoire de la Lorraine.",isbn:"9782258209640",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258209640-M.jpg"},
  {t:"Un chat qui a du chien",a:"Davis Jim",y:"DL 2025",ed:"Dargaud",cote:"BDJ DAV",pub:"Jeune",sup:"Imprimé",d:"Le chat le plus paresseux de l'histoire de la BD voit le jour en 78 dans la presse quotidienne et dominicale américaine. Garfield, adulé par son maître, peut savourer tout à loisir le plaisir de ne rien faire ; gras, toujours fatigué, toujours affamé, toujours bavard, il philosophe avec humour sur sa condition féline. En n'oubliant pas de s'alimenter et de se reposer, bien sûr... Les éditions Bagheera ont édité en 91 un album de Garfield. Dargaud a toutefois récupéré l'exclusivité de cette série et poursuit l'édition de Garfield à raison de 2 titres par an.",isbn:"9782205213225",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205213225-475x500-1.jpg"},
  {t:"Le Zoo d'Ernald",a:"Frigiel",y:"DL 2024",ed:"Soleil",cote:"BDJ FRI",pub:"Jeune",sup:"Imprimé",d:"Frigiel et ses amis vont réaliser le rêve d'Ernald et McTool : ouvrir un zoo regroupant les créatures les plus étranges. Frigiel et Clara partent donc en chasse. Vont-ils trouver un mythique Sniffer ? Ernald ayant disparu, McTool confie à Frigiel et ses amis ses dernières volontés : ouvrir un zoo à Lanniel. Toute l'équipe est d'accord pour s'en occuper. Frigiel et Clara partent à la recherche de créatures à capturer. Au départ, tout se passe bien mais, lorsqu'Abel annonce à la presse qu'ils auront un Sniffer, Frigiel pense qu'il a parlé trop vite. Où trouver cette créature mythique ?",isbn:"9782302102613",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782302102613-475x500-1.jpg"},
  {t:"Triple galop",a:"Du Peloux",y:"DL 2007",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"Séances de mise en forme, toilettage, promenades dans les bois... Eh oui, la plus belle conquête du cheval, c'est bien l'homme ! Ce ne sont pas les personnages hauts en couleur de cette BD qui le démentiront. Souvenez-vous, vous les avez sûrement déjà croisés... Il y a Monique, la monitrice du club hippique, pas très féminine, râleuse mais sympa ; son frimeur de fils Roméo, qui rêve d'être un grand champion de concours hippique ; Bébert, l'emblématique palefrenier qui a toujours vécu \"dans\" les chevaux... Des chevaux fièrement représentés par Mascotte, le poney facétieux, Blanche Neige la jolie jument ou Ramsès le crack.",isbn:"9782350782904",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782350782904-475x500-1.jpg"},
  {t:"Triple galop",a:"Du Peloux",y:"DL 2008",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"Séances de mise en forme, toilettage, promenades dans les bois... Eh oui, la plus belle conquête du cheval, c'est bien l'homme ! Ce ne sont pas les personnages hauts en couleur de cette BD qui le démentiront. Souvenez-vous, vous les avez sûrement déjà croisés... Il y a Monique, la monitrice du club hippique, pas très féminine, râleuse mais sympa ; son frimeur de fils Roméo, qui rêve d'être un grand champion de concours hippique ; Bébert, l'emblématique palefrenier qui a toujours vécu \"dans\" les chevaux... Des chevaux fièrement représentés par Mascotte, le poney facétieux, Blanche Neige la jolie jument ou Ramsès le crack.",isbn:"9782350784557",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782350784557-475x500-1.jpg"},
  {t:"Le sortilège corse",a:"Christophe Arleston / Audrey Alwett",y:"DL 2025",ed:"Drakoo",cote:"BDJ ARL",pub:"Jeune",sup:"Imprimé",d:"Une aventure tendre et drôle qui rend hommage à la plus belle île de Méditerranée. Dans les montagnes corses, Elfie et ses soeurs retrouvent le village natal de leur grand-mère, où elles sont accueillies à bras ouverts. Mais Magda est en proie aux douleurs fantômes qui hantent sa jambe amputée. Elfie apprend qu'Orso, un pompier volontaire, savait apaiser la souffrance. Mais aujourd'hui, il refuse de pratiquer son art... Etait-il un sorcier lui aussi ? Et si oui, comment faire pour qu'il le redevienne ? Aidée d'un cochon peureux et de grands-mères au fort caractère, Elfie enquête sur Orso et son frère mystérieusement disparu...",isbn:"9782382333105",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782382333105-475x500-1.jpg"},
  {t:"Le mal",a:"Ogaki",y:"DL 2025",ed:"Delcourt",cote:"BDJ OGA",pub:"Jeune",sup:"Imprimé",d:"C'est la catastrophe, Pattinson a révélé son vrai visage : c'était en fait le dieu Ouranos et son plan arrive à son terme. Avec son armée de titans, il a privé les Mythics de leurs pouvoirs afin de ressusciter sa compagne Gaïa et dominer l'humanité selon son désir. Pire, nos héros se retrouvent transportés dans le passé, séparés et démunis. Les voilà confrontés à leurs tout premiers ennemis...",isbn:"9782413090908",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413090908-475x500-1.jpg"},
  {t:"Le Jeu de mille Vorn",a:"Douyé",y:"DL 2025",ed:"Vents d'Ouest",cote:"BDJ DOU",pub:"Jeune",sup:"Imprimé",d:"Quand j'étais petite, je rêvais d'ouvrir une pharmagie dans laquelle je soignerais toutes les créatures fantastiques blessées ou malades. Ensorcelite, maladiction, toux-garou, gnomose, hippogrippe, poussée de crépustules, invasion de microgres... dans mon cabinet secret, je chercherais un antidote à toutes les malagies. Et si ce rêve devenait réalité ? Que se passerait-il ? Deviendrais-je la plus grande pharmagicienne de tous les temps ?",isbn:"9782749310381",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782749310381-475x500-1.jpg"},
  {t:"Phénoménal",a:"Dequier",y:"DL 2025",ed:"Dupuis",cote:"BDJ DEQ",pub:"Jeune",sup:"Imprimé",d:"Coup de génie ou coup de folie ? A quelques secondes de la fin des arrêts de jeu, Louca propose à ses équipiers une formation en ligne totalement révolutionnaire, au désespoir de M. Kikov, leur entraîneur. Le but de Louca ? En marquer un dans les toutes dernières secondes du match et éviter ainsi des prolongations qui pourraient peser lourd lors de la finale de la Coupe du Griffon. Seul petit problème : Louca ne veut pas montrer le niveau de fou auquel il est arrivé grâce à son périple à l'étranger... Les Phoenix arriveront-ils en finale ? Et comment se comporteront-ils face aux redoutables Jaguars, une équipe réputée invincible ? Toutes ces questions font un peu oublier à Louca ses problèmes extra-sportifs, comme le fait qu'un redoutable tueur à gages compte toujours exécuter le contrat qui est sur sa tête...",isbn:"9782808510332",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808510332-475x500-1.jpg"},
  {t:"Zombie or not to be",a:"Midam",y:"DL 2025",ed:"Dupuis",cote:"BDJ MID",pub:"Jeune",sup:"Imprimé",d:"Kid Paddle devrait s'appeler \"King Paddle\", tant il est un super pro des jeux vidéo (surtout ceux où l'on dégomme des Blorks). Mais Kid porte ce nom car il est aussi un gamin comme les autres, si ce n'est qu'il possède un faible pour tout ce qui est gore, gluant et répugnant... Ce qui lui donne mille et une idées de blagues qu'il va vous présenter dans son tout nouvel album ! Sa soeur Carole, première de classe désespérément raisonnable, risque encore d'avoir quelques petits soucis, tout comme son père fonctionnaire aussi cravaté que flegmatique ! Avec Kid Paddle et sa série dérivée Game Over, Midam a créé un univers du quotidien où il peaufine ses gags, véritables petites mécaniques d'une précision redoutable et d'un humour imparable. Déjà dix millions de lecteurs conquis !",isbn:"9782808510363",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808510363-475x500-1.jpg"},
  {t:"De beaux moments",a:"Jim",y:"DL 2015",ed:"Bamboo Edition",cote:"BD JIM",pub:"Adulte",sup:"Imprimé",d:"C'est à l'instant où ils nous filent entre les doigts qu'on réalise que c'était de beaux moments Des histoires courtes. Des regards tendres et justes sur l'essence de nos vies. Des histoires de temps qui passe, d'amour, d'amitié, de corps ou de souvenirs que l'on farde pour s'arranger un peu avec la réalité. Des histoires simples qui n'ont d'autre point commun que leur profonde humanité et leur capacité à nous faire prendre conscience des beaux moments",isbn:"9782818934265",extraUrl:"https://covers.openlibrary.org/b/isbn/9782818934265-M.jpg"},
  {t:"Triple galop",a:"Cazenove",y:"DL 2019",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"La seule et unique BD très à cheval sur l'humour. Un jeune élève d'une \"maison familiale\" dédiée aux métiers du cheval vient faire un stage au club. Entre les multiples tâches que lui donne Bébert, les innombrables chevaux tous plus cabots les uns que les autres et les nombreuses admiratrices qui le courtisent, il ne sait plus où donner de la tête. Heureusement, il fait la connaissance de Maud, la belle cavalière du club. La vie va soudain lui sembler plus simple et plus belle. Sous les yeux attendris (mais parfois moqueur) de Blanche-Neige, Mascotte et Ramsès, cette fois, ce sont les coeurs qui vont battre au triple galop !",isbn:"9782818967225",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818967225-475x500-1.jpg"},
  {t:"Triple galop",a:"Du Peloux",y:"DL 2020",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"La seule et unique BD très à cheval sur l'humour. L'\" amoureux \" de Monique, le général de cavalerie Adhémar-Alphonse Mac Hesse, vient troubler la vie tranquille du club Triple Galop. Enfin, c'est surtout lui, le représentant de la tradition équestre, qui va être troublé devant le niveau d'équitation du club. Il va falloir remédier à tout ça et mettre un peu d'ordre et de rigueur dans ce laxisme ambiant !",isbn:"9782818976753",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818976753-475x500-1.jpg"},
  {t:"Triple galop",a:"Du Peloux",y:"DL 2021",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"Bienvenue au club hippique Triple Galop ! Sous la direction de Monique, élèves et chevaux en volent de toutes les couleurs, et pour leur plus grand plaisir. Quant à Bébert, le vieux palefrenier, il n'en manque pas une... Ah, il y a de l'ambiance au centre équestre ! Alors amoureux des chevaux, pas d'hésitation ! Tous en selle pour Triple Galop, la seule et unique BD très à cheval sur l'humour.",isbn:"9782818990285",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818990285-475x500-1.jpg"},
  {t:"Triple galop",a:"Du Peloux",y:"DL 2022",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"La seule et unique BD très à cheval sur l'humour. Le club du Triple Galop se met à l'heure des réunions interclubs. C'est un bon moyen de faire de nouvelles rencontres et de comparer son amour des chevaux et de l'équitation. Mais c'est aussi le meilleur moment pour se mesurer à de nouveaux compétiteurs. D'autant que l'élection de Miss Cavalière Interclub occupe tous les esprits. Qui remportera le prix de la meilleure cavalière ? Qui aura la monture la mieux préparée ? Et dans tout ce remue-ménage, les chevaux ne vont-ils pas aussi se prendre au jeu ?",isbn:"9782818994443",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818994443-475x500-1.jpg"},
  {t:"Triple galop",a:"Rodrigue",y:"DL 2022",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"Séances de mise en forme, toilettage, promenades dans les bois. Eh oui, la plus belle conquête du cheval, c'est bien l'homme ! Ce ne sont pas les personnages hauts en couleur de cette BD qui le démentiront. Souvenez-vous, vous les avez sûrement déjà croisés. Il y a Monique, la monitrice du club hippique, pas très féminine, râleuse mais sympa ; son frimeur de fils Roméo, qui rêve d'être un grand champion de concours hippique ; Maud, amoureuse inconditionnelle des équidés, même quand il y a une litière à changer ; Céline qui, elle, préfère les cajoler que les monter ; et Bébert, l'emblématique palefrenier qui a toujours vécu \"dans\" les chevaux. Des chevaux fièrement représentés par Mascotte, le poney facétieux, Blanche Neige la jolie jument ou Ramsès le crack. Amoureux des chevaux, pas d'hésitation ! Tous en selle pour Triple Galop, la seule et unique BD très à cheval sur l'humour !",isbn:"9782818995037",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818995037-475x500-1.jpg"},
  {t:"Triple galop",a:"Du Peloux",y:"DL 2022",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"Bienvenue au club hippique Triple Galop ! Sous la direction de Monique, élèves et chevaux en lent de toutes les couleurs, et pour leur plus grand plaisir. Quant à Bébert, le vieux palefrenier, il n'en manque pas une... Ah, il y a de l'ambiance au centre équestre ! Alors amoureux des chevaux, pas d'hésitation ! Tous en selle pour Triple Galop, la seule et unique BD très à cheval sur l'humour.",isbn:"9782818995044",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818995044-475x500-1.jpg"},
  {t:"Triple galop",a:"Du Peloux",y:"DL 2024",ed:"Bamboo Edition",cote:"BDJ DUP",pub:"Jeune",sup:"Imprimé",d:"Bienvenue au club hippique Triple Galop l Face au réchauffement climatique, tout le monde au club se rend compte qu'il faut faire quelque chose pour la planète. Céline décide alors de changer les habitudes du club et de le rendre plus écologiste. Une tâche pas simple, car les pratiques et les mentalités sont difficiles à changer, surtout chez Bébert et Monique. Et les chevaux, dans tout ça, seront-ils mis à contribution dans le verdissement du club ?",isbn:"9791041105366",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791041105366-475x500-1.jpg"},
  {t:"Cath & son chat",a:"Ramon",y:"DL 2012",ed:"Bamboo Edition",cote:"BDJ RAM",pub:"Jeune",sup:"Imprimé",d:"Les aventures en terrain minet d'une petite fille et de son chat un peu trop agité ! Avec le chat de Cath, c'est trop l'éclate ! Enfin, ça dépend : sauf les jours où il fait ses griffes sur la moquette, où il squatte le bureau de Cath et où il transforme les factures à payer en boulettes de papier... Une série pleine de fraîcheur et de tendresse qui raconte la vie quotidienne d'un père célibataire et de sa fille, aux prises avec leur félin un peu trop filou.",isbn:"9782818908426",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818908426-475x500-1.jpg"},
  {t:"Les Footmaniacs",a:"Sti",y:"DL 2025",ed:"Bamboo Edition",cote:"BDJ SIT",pub:"Jeune",sup:"Imprimé",d:"A force de voir le FC Palajoy s'enfoncer dans les profondeurs du classement, Marcel Dubut se dit que regarder jouer les pros est peut-être ce qu'il y a de plus formateur. S'il ne trouve aucune nouvelle technique d'entraînement, il pourra toujours se balader de stade en stade d la découverte des sanctuaires du foot et, enfin, assister à de vrais matchs avec de vraies équipes !",isbn:"9791041109340",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791041109340-475x500-1.jpg"},
  {t:"J'ai peur",a:"Olivier Dutto",y:"impr. 2025",ed:"Didier jeunesse",cote:"A DUT",pub:"Jeune",sup:"Imprimé",d:"Dans son lit, Emmie a peur, trèèèès peur. « BOUH ! » Une araignée se laisse glisser du plafond. Mais Emmie ne la regarde même pas. « Pfff, c’est pas toi qui me fais peur ! ». « Tu veux dire qu’il y a quelque chose qui fait plus peur que moi ?! GLAGLAGLA ! » L’araignée se réfugie dans le lit d’Emmie. Puis c’est au tour du voleur, du loup, de l’horrible monstre, de l’affreux ogre de se jeter sous la couette d’Emmie. Mais qui est donc plus horriblement atrocifique que toutes ces créatures ?",isbn:"9782278131068",extraUrl:"https://covers.openlibrary.org/b/isbn/9782278131068-M.jpg"},
  {t:"François 1er et la Renaissance",a:"Dominique Joly",y:"DL 2023",ed:"Editions Casterman",cote:"BDJ JOL",pub:"Jeune",sup:"Imprimé",d:"Monté sur le trône en 1515, François Ier er symbolise à lui seul l'éclat de la Renaissance française. Roi bâtisseur, il laisse avec Chambord ou Fontainebleau un héritage architectural sans pareil. Il renforce l'autorité royale et pose les bases d'un état centralisé. Cette bande dessinée permet de comprendre les multiples aspects d'un règne resté dans les mémoires.",isbn:"9782203276550",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782203276550-475x500-1.jpg"},
  {t:"Glen Affric",a:"Giebel",y:"2021",ed:"R. Laffont",cote:"R GIE",pub:"Adulte",sup:"Imprimé",d:"\"Je suis un idiot, un imbécile, un crétin. Je n'ai pas de cervelle.\" Léonard se répète ce refrain chaque jour et chaque nuit, une suite de mots cruels qu'il entend dans la cour, dans la rue. Son quotidien Léo le triso, Léonard le batard. Léonard n'est pas comme les autres et il a compris que le monde n'aime pas ceux qui sont différents. Alors il rêve parfois de disparaître. Être ailleurs. Loin d'ici. À Glen Affric. Mais les rêves de certains sont voués à finir en cauchemars...",isbn:"9782259307901",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259307901-M.jpg"},
  {t:"Iznogoud et la soeur du calife",a:"Lemoine",y:"DL 2025",ed:"Imav",cote:"BDJ LEM",pub:"Jeune",sup:"Imprimé",d:"Dans cet album : 5 histoires courtes en 8 planches, efficaces et surprenantes. Indémodable, inoxydable, indestructible : Iznogoud est de retour ! L'ignoble vizir veut plus que jamais : devenir calife à la place du calife ! Pour la première fois, la grande soeur du califeentre en scène : elle veut honorer une ancienne promesse et prendre la tête du califat à la place de son frère. S'il l'épouse, Iznogoud pourrait alors accèder au trône tant convoité ! Iznogoud complote et imagine des stratagèmes toujours plus machiavéliques : un massage si relaxant qu'on ne retrouve plus jamais sa forme humaine, un casque de réalité virtuelle dont on devient prisonnier, ou encore un grimoire magique qui promet le pouvoir suprême... Fidèles à l'esprit de ses créateurs René Goscinny et Jean Tabary, les aventures de cet antihéros sont magistralement scénarisées par un collectif d'auteurs et s'animent sous les traits acérés du dessinateur Elric.",isbn:"9782365901734",extraUrl:"https://products-images.di-static.com/image/orb-06ea041d349e5a3f556a0d869b91c118/9782365901734-475x500-1.jpg"},
  {t:"Le mystère de l'étang",a:"Barbara Canepa / Anaïs Halard",y:"DL 2025",ed:"Editions Oxymore",cote:"BDJ CAN",pub:"Jeune",sup:"Imprimé",d:"Un bond dans la mousse, un cri dans la nuit... puis, plus rien. Et si Vanille, la chouette au grand coeur, avait malencontreusement avalé un bébé grenouille ? Mais, à Greenwood, la vérité est toujours plus étrange qu'on ne l'imagine.",isbn:"9782385611187",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782385611187-475x500-1.jpg"},
  {t:"Les méandres du pouvoir",a:"Joann Sfar / Lewis Trondheim",y:"DL 2026",ed:"Delcourt",cote:"BDJ SFA",pub:"Jeune",sup:"Imprimé",d:"Le cycle \" Donjon Zénith \" se poursuit sous le trait du talentueux Boulet. A l'honneur dans ce nouvel album, le couple Isis - Herbert a fort à faire... Pas le temps de faire son deuil, Herbert assume avec sérieux ses nouvelles fonctions de suzerain. Si le jeune canard est fidèle à son optimisme habituel, son épouse Isis, plus lucide et pragmatique, sait bien que cette apparence de succès cache de nouvelles difficultés. Quand on est au pouvoir, les menaces sont nombreuses, qu'elles viennent d'ennemis, ou même des proches...",isbn:"9782413089445",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413089445-475x500-1.jpg"},
  {t:"Et l'heureux tour du pitre",a:"Hautière",y:"DL 2025",ed:"Rue de Sèvres",cote:"BDJ HAU",pub:"Jeune",sup:"Imprimé",d:"La Joconde a disparu du Louvre ! Elle a été remplacée par une affiche annonçant le retour du Pitre. Vilain pourtant déjà démasqué auparavant, Les Spectaculaires sont chargés de retrouver le tableau volé et le coupable. Domitille, accusée à tort d'être la coupable, se joint à l'équipe pour démasquer l'imposteur, déclenchant une enquête pleine de rebondissements.",isbn:"9782810210183",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782810210183-475x500-1.jpg"},
  {t:"Transport à risques",a:"Laudec",y:"DL 2024",ed:"Dupuis",cote:"BDJ LAU",pub:"Jeune",sup:"Imprimé",d:"Quand Pépé croise Cédric et Chen juchés derrière Nicolas sur une trottinette électrique, forcément, il tique. Avant de se rappeler qu'il fut lui-même, en ses jeunes années, champion de « patinette », comme il dit ! De là à ce qu'il leur propose de leur donner une leçon... Et c'est un des attachants moments de vie et de drôlerie du nouveau Cédric qui va vous faire retrouver l'une des familles les plus célèbres de la bande dessinée tous publics !  De tous nouveaux gags préparés par Tony Laudec, dans la tradition et le respect de l'univers codifié avec le regretté Raoul Cauvin. Le plus beau des hommages à un géant du rire, mais sans se prendre au sérieux !",isbn:"9791034762958",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791034762958-475x500-1.jpg"},
  {t:"Moi d'abord !",a:"Cazenove",y:"DL 2025",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"Laquelle sera la preum's ? Marine a un travail de dingue. Elle doit gérer le moral de Wendy qui a glissé dans ses chaussettes et s'occuper de son animalerie en peluches. Ca en fait de la charge de cervelle ! Avec tout ça, elle n'a vraiment pas le temps d'être la petite Sister parfaite. Le mieux, c'est encore qu'elle reste comme elle est, c'est-à-dire turbulente, bondissante, kro adorable et qu'elle puisse continuer de faire ce qu'elle veut. \" Moi d'abord ! C'est pourtant clair ? \"",isbn:"9791041112197",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791041112197-475x500-1.jpg"},
  {t:"L'incroyable aventure de Florence Arthaud, navigatrice intrépide",a:"Astolfi",y:"2022",ed:"Bayard éditions",cote:"J AST",pub:"Jeune",sup:"Imprimé",d:"Une biographie de Florence Arthaud, navigatrice célèbre ayant remporté la Route du rhum en 1992. La navigation et l'histoire de la voile sont abordées dans un dossier documentaire. ©Electre 2022  Passionnée par la mer dès son plus jeune âge, Florence impose sa décision à ses parents... Elle ne sera pas chirurgienne mais... navigatrice ! Formée aux courses en solitaire, elle relève tous les défis : tenir la barre nuit et jour sans dormir, braver les vagues géantes, le froid, les tempêtes, ou se retrouver à la baille, seule au milieu de la Méditerranée... En 1990, \"la petite fiancée de l'Atlantique\" se lance dans la plus grande course de sa vie. Réussira-t-elle à devenir la première femme à remporter la Route du Rhum... ?",isbn:"9791036332821",extraUrl:"https://products-images.di-static.com/image/claire-astolfi-l-incroyable-destin-de-florence-arthaud-navigatrice-intrepide/9791036332821-475x500-1.webp"},
  {t:"Quel carnaval !",a:"Julien Artigue",y:"DL 2021",ed:"Gulf Stream",cote:"J ART",pub:"Jeune",sup:"Imprimé",d:"Un concours de déguisements est organisé pour carnaval et la maîtresse insiste : c'est l'inventivité qui est récompensée ! Alors que Bastien et Nico se disputent à propos du lot à gagner, Lucas tente de se fabriquer un costume : pas question de mettre la tenue de pingouin refilée par son cousin. Lucas a alors une idée : pour remporter le concours, il choisit l'objet favori de la maîtresse... Du carton, de la colle et le voilà transformé en craie ! De plus, il est persuadé que comme chaque année, Nico se transformera en superhéros, Bastien en soldat et Élisa en princesse. Zéro pointé en originalité. À moins que Lucas ait mal interprété les indices ? Ses amis pourraient bien le surprendre !",isbn:"9782354888817",extraUrl:"https://covers.openlibrary.org/b/isbn/9782354888817-M.jpg"},
  {t:"Billy à l'envers",a:"Valckx",y:"DL 2022",ed:"L'École des loisirs",cote:"A VAL",pub:"Jeune",sup:"Imprimé",d:"Le père de Billy, le hamster cowboy, vient de lire dans le journal que l'Affreux Jojo est dans la région. L'Affreux Jojo ? Le redoutable voleur de nourriture ?! Il faut prévenir les voisins. Billy et son ami Jean-Claude partent avertir Mamie Hyda et c'est ainsi qu'ils rencontrent sa petite fille, Suzie la fouine. À trois ils forment une sacrée équipe qui va infliger au voleur la trouille de sa vie.",isbn:"9782211322478",extraUrl:"https://m.media-amazon.com/images/I/41jluxrWlSL._SX195_.jpg"},
  {t:"Boum ! Boum !! Boum !!!",a:"Wechterowicz",y:"DL 2020",ed:"L'atelier du poisson soluble",cote:"A WEC",pub:"Jeune",sup:"Imprimé",d:"Deux gorilles et leur pote aiment pratiquer les percussions corporelles. Leur joie et leur enthousiasme sont si contagieux qu'ils entraînent bientôt le monde entier dans leur ronde. Le texte de Przemek Wechterowicz, extrêmement musical… et percutant, sera un véritable plaisir de lecture partagée. Les illustrations de Marianna Oklejak emportent le lecteur dans une folle farandole qu'amplifie un jeu savant de compositions. Son audace graphique saura plonger les jeunes lecteurs dans la profusion de détails.",isbn:"9782358711579",extraUrl:"https://products-images.di-static.com/image/base/9782358711579-475x500-1.jpg"},
  {t:"Ribambelle",a:"Brosset",y:"DL 2023",ed:"Versant Sud",cote:"A BRO",pub:"Jeune",sup:"Imprimé",d:"Aujourd'hui, c'est le carnaval. Oiseau, Pierrot, baleine, Colombine, dragon ou papillon : les enfants ont mis leur plus beau déguisement ! Tiens, Nils pleure dans son coin... Il n'a pas costume comme les autres. Alors tous ses amis décident de découper de petits bouts de tissu dans le leur. Avec tous ces morceaux, il y a de quoi transformer Nils en Arlequin ! Ce livre rend hommage à la légende du célèbre personnage de la commedia dell'arte dont le costume est fait de losanges multicolores. Ceux-ci représenteraient les multiples facettes d'Arlequin, ainsi que sa pauvreté. La technique de collage de Mathilde Brosset n'est pas sans rappeler le patchwork de morceaux de tissus. Un album rythmé en ritournelle, jouant sur la répétition et l'accumulation.",isbn:"9782930938646",extraUrl:"https://products-images.di-static.com/image/base/9782930938646-475x500-1.jpg"},
  {t:"L'étrange boutique de Viktor Kopek",a:"Lévêque",y:"DL 2023",ed:"Saltimbanque",cote:"A LEV",pub:"Jeune",sup:"Imprimé",d:"Un soir, une jeune fille intriguée par une vitrine remplie de valise entre dans un curieux magasin. Elle découvre alors un bric-à-brac d'objets, et de portraits de gens avec des valises, accrochés au mur. Viktor Kopek, le propriétaire, est un homme aussi raffiné qu'étrange, un \"magicouturier\". Un récit poétique entre l'univers de Tim Burton et \"Alice au pays des merveilles\". Les illustrations de Nicolas Zouliamis nous plongent dans une atmosphère aussi captivante qu'étrange.",isbn:"9782378012656",extraUrl:"https://covers.openlibrary.org/b/isbn/9782378012656-M.jpg"},
  {t:"Rayne Ames et le redoutable hallebardier",a:"Hajime Komoto / Jean-Benoît Silvestre",y:"DL 2023",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeune",sup:"Imprimé",d:"Retrouvez la suite de la série MASHLE",isbn:"9782820346001",extraUrl:"https://covers.openlibrary.org/b/isbn/9782820346001-M.jpg"},
  {t:"Ryoh Grantz et le sens de la virilité",a:"Hajime Komoto / Jean-Benoît Silvestre",y:"DL 2023",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeune",sup:"Imprimé",d:"Orter, Rayne et le reste du groupe unissent leurs forces pour affronter Doom ! Mais l'aîné d'Innocent Zero, à l'intarissable réserve de puissance, n'a besoin que d'une fraction de ses pouvoirs pour leur faire mordre la poussière. Alors qu'un vent de désespoir souffle sur le champ de bataille, un allié de taille fait une entrée quasi biblique ! La lumière du grand chef-d'oeuvre du genre humain brillera-t-elle assez pour chasser l'obscurité'Du côté de Mash, la guérison semble imminente, mais sera-t-il réanimé à temps'",isbn:"9782820346247",extraUrl:"https://covers.openlibrary.org/b/isbn/9782820346247-M.jpg"},
  {t:"Un grand week-end à Corfou",a:"Rafenberg",y:"DL 2024",ed:"Hachette Pratique",cote:"914.95 COR",pub:"Adulte",sup:"Imprimé",d:"Un guide pour une découverte complète de Corfou et des deux petites îles encore très confidentielles Paxos et Antipaxos. - Des visites et des cartes par région, avec tout ce qu'il faut voir. - Les plus belles balades à pied, à vélo ou à cheval sur les chemins bordés d'olivier, avec vue sur la grande bleue. - Les plus belles plages, les criques les plus secrètes. - De nombreuses activités et expériences : cours de cuisine dans un village typique proche de la ville de Corfou, plongée dans les fonds marins translucides de Corfou et Paxos, dégustation des vins et produits fermiers dans la campagne corfiote. - Une large sélection d'adresses pour découvrir les meilleures tavernes les pieds dans l'eau, les bars, les boutiques et artisans pour s'approvisionner en produits locaux. Un focus sur l'histoire particulière des îles ioniennes.",isbn:"9782017263227",extraUrl:"https://covers.openlibrary.org/b/isbn/9782017263227-M.jpg"},
