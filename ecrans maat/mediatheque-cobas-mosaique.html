  {t:"La ménagerie de verre",a:"Williams",y:"DL 2019",ed:"R. Laffont",cote:"812 WIL",pub:"Adulte",sup:"Imprimé",d:"\" Nostalgique, ironique, féerique, voici une sorte de miroir magique, où se reflètent, plus ou moins déformés, les fantômes de Tom. \" Catherine Fruchon-Toussaint. La Ménagerie de verre est une \" pièce de la mémoire \", dit Tennessee Williams. \" Mémoire \" que l'on peut interpréter à la fois comme le souvenir d'un temps passé et l'hommage à une personne. Et en effet, construite en sept scènes, cette pièce s'inspire du vécu de Thomas (dit Tennessee) dans les années 1930 et témoigne surtout de son amour infini pour sa soeur, à laquelle il redonne humanité par ce texte. Dans la mémoire de Tom se rejoue devant nos yeux un passé familial qui le hante, entre une mère obsédée par sa jeunesse perdue et une soeur maladivement fragile, qui collectionne les animaux miniatures, constituant ainsi sa plus précieuse possession : une ménagerie de verre.",isbn:"9782221245804",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221245804-M.jpg"},
  {t:"Soudain l'été dernier",a:"Williams",y:"DL 2020",ed:"R. Laffont",cote:"812 WIL",pub:"Adulte",sup:"Imprimé",d:"Dans un jardin tropical vénéneux et inquiétant, la richissime Mrs Venable tente de convaincre le jeune et très beau docteur Sucre : sa nièce Catherine est coupable, c'est elle qui est responsable de la mort de Sébastien, son fils unique et adoré, décédé dans des circonstances étranges l'été dernier. La sentence exigée par la vieille femme est terrible : une lobotomie pour faire taire Catherine et faire cesser ses insupportables ragots. Tennessee Williams convoque ici les thèmes qui lui sont chers : la vieillesse et la beauté des femmes, la folie et son cortège diabolique, tout cela sous un soleil blanc, aveuglant, incandescent, qui donne un charme salé insupportable à cette grande pièce de théâtre.",isbn:"9782221249642",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221249642-M.jpg"},
  {t:"Notre jeunesse est en danger",a:"Tzourio",y:"DL 2025",ed:"Michel Lafon",cote:"155.6 TZO",pub:"Adulte",sup:"Imprimé",d:"La santé mentale des jeunes se dégrade, c'est un fait. Aujourd'hui, un étudiant sur deux souffre de stress, d'anxiété ou de dépression. Comment repérer les signes avant-coureurs ? Comment réfléchir collectivement à des solutions ? Comment agir ? Loin des idées simplistes et alarmistes, ce livre nous aide à mieux aborder le sujet de la santé mentale et à en comprendre les rouages. Un enjeu majeur pour les jeunes, mais également pour notre société dont ils sont l'avenir. Il est temps de faire des jeunes une priorité !",isbn:"9782749960562",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749960562-M.jpg"},
  {t:"La maison des rêves",a:"Hamadi",y:"DL 2025",ed:"Flammarion",cote:"B HAM",pub:"Adulte",sup:"Imprimé",d:"\"Petits, on est tous égaux devant les rêves. Médecin. Astronaute. Pompier. Danseuse. Footballeur. Actrice. Moi, je veux être chanteuse d'opéra\". Nora Hamadi a dessiné ses rêves durant l'enfance dans un local qui s'appelait la Maison des Rêves, au pied de la résidence la Rocade, une cité de Longjumeau, sortie de terre dans les années 1960 entre champs, autoroutes et nationales. Avec sa grand-mère, elle partageait un appartement dans ce quartier populaire. Un village vertical habité d'immigrés de toutes les régions françaises et du monde entier, où la solidarité et l'entraide étaient fortes. Dix ans après la mort de sa grand-mère, Nora Hamadi est retournée à Longjumeau. Les immeubles sont toujours là. Mais tout a changé. Elle a retrouvé ses amis, ses voisins, posé à sa famille des questions jamais formulées, fouillé les archives. Que sont devenus les associations, les services publics et les valeurs qui ont donné des horizons à sa génération ? Vingt ans après la mort de Zyed Benna et Bouna Traoré à Clichy-sous-Bois le 27 octobre 2005 et l'embrasement d'une partie de la jeunesse des banlieues, l'histoire des zones périphériques n'a toujours pas été écrite. Ce livre est le récit d'un retour.",isbn:"9782080456472",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080456472-M.jpg"},
  {t:"Les Sorcières de Salem",a:"Miller",y:"DL 2022",ed:"R. Laffont",cote:"812 MIL",pub:"Adulte",sup:"Imprimé",d:"\" Viscéral et vital. \" The Guardian Lorsque Abigail et une dizaine d'autres jeunes filles sont aperçues dansant nues en pleine nuit dans la forêt, quelques puritains de Salem s'empressent de crier à la sorcellerie. Bientôt, un procès plonge cette communauté de Nouvelle-Angleterre dans la colère et la confusion. Ceux qui sont accusés d'être des oeuvres du démon encourent la potence. En 1953, alors que l'Amérique est en proie au maccarthysme et à la \" chasse aux sorcières \", Arthur Miller écrit une pièce incisive sur un célèbre épisode de l'histoire américaine : le procès qui, en 1692, ébranla la petite ville de Salem, gagnée par une crise d'hystérie puritaine, et se solda par la condamnation de nombreuses personnes soupçonnées de pratiques sataniques et par vingt-cinq exécutions. Cette oeuvre illustre de façon magistrale comment peut être franchie - à toute époque - la frontière entre raison et folie, justice et fanatisme.",isbn:"9782221264294",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221264294-M.jpg"},
  {t:"Ils n'auront pas mon silence",a:"Hamidi",y:"DL 2025",ed:"R. Laffont",cote:"305.42 HAM",pub:"Adulte",sup:"Imprimé",d:"\" Comment expliquer qu'au beau milieu de Paris, au coeur de l'Europe, je doive me cacher pour la simple raison que je dis la vérité et que je défends les femmes de mon pays ? \" Le témoignage puissant de la championne afghane Marzieh Hamidi sur son combat pour le droit des femmes à la liberté en Afghanistan. \" Ils veulent faire taire les femmes. Moi, j'ai décidé de parler plus fort. \" A Kaboul, Marzieh Hamidi s'entraînait pour les Jeux olympiques. Elle a 19 ans à l'arrivée des talibans. Son dojo est devenu un lieu interdit, ses victoires un crime, sa liberté une provocation. Pour continuer à vivre, il lui a fallu fuir l'Afghanistan, la peur, le silence. En France, elle découvre la liberté - ; mais aussi l'indifférence, les incompréhensions, et la haine exportée d'un régime qui n'a pas de frontières : des milliers de menaces de mort et de viol s'abattent sur elle, cherchant à l'intimider, à la réduire au silence en plein coeur de Paris. Ce livre raconte la traversée des frontières, les humiliations, les violences d'un régime qui hait les femmes, mais aussi les retrouvailles avec la force - celle qu'on puise dans ses poings, dans sa voix, dans ses souvenirs. Portée par ses combats comme d'autres le sont par une foi ou un art, Marzieh nous entraîne de l'exil à la renaissance, de Kaboul à Paris, de la peur à la lutte. Un livre de colère et de lumière. Une voix que rien ni personne n'a réussi à faire taire.",isbn:"9782221282397",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221282397-M.jpg"},
  {t:"Rien de plus illusoire",a:"Pérez-Carbonell",y:"DL 2025",ed:"Editions Les Escales",cote:"R PER",pub:"Adulte",sup:"Imprimé",d:"Dans un train de nuit entre Londres et Edimbourg, Alicia partage le compartiment et la conversation de Terry, écrivain et professeur de littérature, et Bou, son étudiant. Terry évoque le succès de son dernier roman, inspiré des confidences de Hans, un jeune homme avec qui il a entretenu une relation ambiguë. Alicia s'interroge : a-t-on le droit de transformer la vie d'un autre en roman ? Fascinée par cette histoire, elle éprouve le besoin de découvrir ce qui s'est réellement passé. Alors quand Bou lui révèle que Hans a disparu après la publication du roman, la jeune femme se lance à sa recherche, dans une quête de vérité qui la mènera de New York aux rives du lac d'Annecy.",isbn:"9782365699143",extraUrl:"https://covers.openlibrary.org/b/isbn/9782365699143-M.jpg"},
  {t:"Les jeunes constellations",a:"Richa",y:"DL 2025",ed:"Quidam éditeur",cote:"R RIC",pub:"Adulte",sup:"Imprimé",d:"\" Je me suis mis à scruter la terre. Il faisait trop sombre. J'entendais marcher les falaises. J'écoutais le bruit aveugle de l'écume élimer les rochers. La nuit déborde de mots : réponds, ressac, repars, reviens... Et je ne sais pas comment je suis devenu les falaises et les rochers qui allaient nous déchiqueter. Je disais aux hommes de ne pas s'inquiéter. Y aura pas de cruauté inutile. On sait ce que c'est... Nous aussi on crève en silence, au fond de nos criques, par la force des choses ou parla distraction des dieux. \" Affleurer, par l'écriture, à d'autres manières de voir, de sentir, de vivre, c'est la tentative même de ce roman. En voyage de Venise en Orient à bord d'un navire fatigué d'être, un jeune homme part retrouver un géniteur qu'il n'a jamais connu. L'époque : le Moyen-Age tardif et des croisades hors d'haleine. \"Toute ressemblance avec notre temps est à imputer à la nature des hommes\", nous dit son auteur.",isbn:"9782374913964",extraUrl:"https://covers.openlibrary.org/b/isbn/9782374913964-M.jpg"},
  {t:"La Planète Libris",a:"Bruneau",y:"2012",ed:"Glénat",cote:"BDJ BRU",pub:"Jeune",sup:"Imprimé",d:"Le Petit Prince est retourné sur son astéroïde B612. Depuis, entre l'amitié de sa Rose et de Renard, il vit paisiblement en rêvant dans le ciel étoilé. Mais voici que des étoiles s'éteignent : un vieil ennemi, le Serpent, s'attaque à l'univers Seul Le Petit Prince pourra s'opposer à ce briseur de rêves. Ainsi s'ouvre le chemin de l'aventure pour Le Petit Prince et Renard. Que se passe-t-il donc sur cette planète où, depuis quelques temps, les livres s'envolent et disparaissent ? Qui donc s'amuse à priver les habitants de lecture ? Le Petit Prince enquête sur la Planète des Libris et plonge au coeur d'une histoire de jalousie amoureuse.",isbn:"9782723492010",extraUrl:"https://products-images.di-static.com/image/base/9782723492010-475x500-1.jpg"},
  {t:"La Planète Ludokaa",a:"Bruneau",y:"2012",ed:"Glénat",cote:"BDJ BRU",pub:"Jeune",sup:"Imprimé",d:"Le petit prince enquête sur la disparition de la monture d'un joueur de ludokaa, peu de temps avant la rencontre qui décidera qui du roi rouge ou du roi noir portera le sceptre de la planète Ludokaa.",isbn:"9782723492027",extraUrl:"https://products-images.di-static.com/image/base/9782723492027-475x500-1.jpg"},
  {t:"Ben ou l'art de la fuite",a:"Lewinsky",y:"DL 2025",ed:"Phébus",cote:"R LEW",pub:"Adulte",sup:"Imprimé",d:"Ben Oppenheim, auteur raté et égocentrique, jongle entre son ex-femme, ses deux enfants et sa nouvelle petite amie, Julia. Il espère renouer avec le succès grâce à un scénario sur l'Holocauste, mais peine à convaincre sa productrice. Pourtant, la persécution de ses ancêtres façonne encore aujourd'hui toute sa vie. Alors lorsqu'un dépôt d'armes explose à la frontière biélorusse, Ben, pour qui tous les chemins mènent à la bombe atomique, s'interroge : résister ou se tirer ? Obéissant à son instinct de fuite, la famille Oppenheim saute bientôt dans un avion, direction le Brésil, sur les traces du grand Stefan Zweig... S'ensuivront, dans le désordre, une cérémonie d'Ayahuasca, des ruptures et des réconciliations à tout-va, des théories conspirationnistes et une bonne dose de paranoïa. Avec un réel sens du gag et beaucoup d'autodérision, Micha Lewinsky signe une comédie noire hilarante, comme un remède à l'anxiété ambiante.",isbn:"9782752915016",extraUrl:"https://covers.openlibrary.org/b/isbn/9782752915016-M.jpg"},
  {t:"L'île dans le ciel",a:"Moreno",y:"DL 2025",ed:"Hachette Pratique",cote:"BDJ MAU",pub:"Jeune",sup:"Imprimé",d:"REJOINS LES SABIWABIS ET EMBARQUE POUR LA PLUS GRANDE AVENTURE DE TA VIE !Si on te disait qu il est possible de partir à la découverte d un monde fantastique, peuplé de créatures incroyables et de lieux mystérieux, accompagné(e) par une bande de jeunes et sympathiques aventuriers, tu n y croirais pas. C est pourtant possible avec les Sabiwabis ! Ils sont sept, mais ils ont besoin d un compagnon supplémentaire pour entreprendre leur quête.Ose ouvrir cette BD et deviens le ou la huitième Sabiwabi. Tu pourras alors crier à tue-tête, avec eux, leur cri de guerre : SABII, SABIII, SABIWABIIIIS !",isbn:"9782017252603",extraUrl:"https://products-images.di-static.com/image/base/9782017252603-475x500-1.jpg"},
  {t:"Petite chose",a:"Frédéric Maupomé",y:"DL 2025",ed:"les Éditions de la Gouttière",cote:"BDJ MAU",pub:"Jeune",sup:"",d:"\"- Dis-toi que nous sommes partis à l'aventure, et que ce sera... heu... une belle expérience - Quand on se fera descendre par L'amirauté, c'est sûr que ça va lui faire de l'expérience. \" Les îles volantes sont menacées : L'amirauté s'apprête à extraire massivement l'éthérite, Le minerai qui permet aux îles de flotter au-dessus de La dangereuse mer de nuages. Pour stopper cette catastrophe écologique, Alie rejoint Ienisseï Dero, fille du Premier amiral. Elle seule détient le carnet de son père, La clé pour le retrouver et tenter de rétablir l'équilibre...",isbn:"9782357961364",extraUrl:"https://products-images.di-static.com/image/base/9782357961364-475x500-1.jpg"},
  {t:"L'exode",a:"Charlotte Girard",y:"DL 2025",ed:"Editions Oxymore",cote:"BDJ GIR",pub:"Jeune",sup:"Imprimé",d:"2043, la rareté de l’eau bouleverse l’équilibre planétaire. Lupi, une jeune élève prodige de l’Opéra de Paris, est contrainte de fuir pour le Mexique, explorant ainsi ses racines, avec l’espoir inconscient de découvrir les raisons entourant la mystérieuse disparition de son père. Lupi réussira-t-elle à dépasser sa peur de l’inconnu et à se réinventer un avenir, même si incertain ?",isbn:"9782385610999",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782385610999-475x500-1.jpg"},
  {t:"Le manoir de Lady Heme",a:"Carole Breteau, Morgane Lafille",y:"2021",ed:"Vents d'Ouest",cote:"BDJ BRE",pub:"Jeune",sup:"Imprimé",d:"Amélie Woods, jeune scientifique est venue étudier les oiseaux au coeur d'une baie isolée loin de Londres. Depuis le décès de sa mère elle assaillie par des émotions incontrôlables. Il lui est impossible de toucher autrui sans être envahie par des visions déstabilisantes concernant leur avenir. Le manoir de Lady Heme semblait pourtant l'endroit idéal pour retrouver la sérénité. Mais le lieu et ses occupante se révèlent ébattes et emplis de mystères. Au fil des nuits. Amélie va partir sur les traces de son passé et découvrir que son histoire familiale est émaillée de secrets intimement lies a la magie. bouleversant ainsi toutes ses certitudes !",isbn:"9782749309491",extraUrl:"https://products-images.di-static.com/image/base/9782749309491-475x500-1.jpg"},
  {t:"La Confrérie",a:"Breteau, Carole",y:"DL 2023",ed:"Vents d'Ouest",cote:"BDJ LAF",pub:"Jeune",sup:"Imprimé",d:"Une jeune femme en quête de sa magique vérité. Après le tragique incendie du Manoir Heme, où s'était réfugiée Amelia Woods suite au décès de sa mère, la jeune fille doit rentrer à Londres avec son père. Elle va enfin intégrer la prestigieuse université qu'il dirige pour étudier les sciences ! Mais Amelia a l'esprit ailleurs... Depuis qu'elle a été témoin de tous les faits étranges qui se sont produits au Manoir elle aspire avant tout à percer les secrets qui entourent sa défunte mère et à en savoir davantage sur sa propre nature magique ! Son père, cartésien et autoritaire, ne prête guère attention à ces élucubrations et ne songe qu'à introduire sa fille dans les cercles érudits de la Société... Tandis qu'Amélia tente de s'habituer à sa nouvelle vie entre les murs de l'école, elle va enfin renouer avec ses origines. Et si elle était la descendante directe d'une illustre famille de magiciens ? Dans ce second tome, Amelia va poser une à une les pierres de sa propre histoire et s'émanciper pour devenir qui elle est vraiment... Magie et suspense sont au coeur de ce diptyque pétillant. Un récit initiatique dans lequel une \" jeune femme moderne \" remet en cause tout ce qu'elle croit savoir et éveille sa part spirituelle afin de trouver sa vérité, à l'âge où sentiments et secrets familiaux sont susceptibles d'encore tout bouleverser.",isbn:"9782749309880",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749309880-475x500-1.jpg"},
  {t:"Le journal de Serena",a:"Lafille, Morgane",y:"DL 2024",ed:"Vents d'Ouest",cote:"BDJ LAF",pub:"Jeune",sup:"Imprimé",d:"Angleterre. A l'aube du XXe siècle. Amelia a enfin intégré la prestigieuse université que dirige son père à Londres, pour étudier les sciences ! Mais Amelia a l'esprit ailleurs... Elle aspire avant tout à percer les secrets qui entourent sa défunte mère et à en découvrir davantage sur sa propre nature magique ! Car elle est constamment traversée par de multiples questions : Pourquoi existe-t-il tant de rivalités entre Serena et sa soeur Heme ? Quelle fut leur éducation, leur rapport entant, pourquoi sa mère n'est-elle pas devenue, comme il étais convenu, la Présidente de la Confrérie des Magiciens ? Ces réponses se trouvent-elles dans le journal intime que celle-ci lui a laissé ? La jeune fille remet en cause tout ce qu'elle croit savoir et tente de trouver sa vérité, à l'âge où sentiments et secrets familiaux sont susceptibles d'encore tout bouleverser !",isbn:"9782749310169",extraUrl:"https://products-images.di-static.com/image/orb-e5d53e6c92d8bbd5cc96a83e786cee1a/9782749310169-475x500-1.jpg"},
  {t:"Le Rituel",a:"Breteau, Carole",y:"DL 2025",ed:"Vents d'Ouest",cote:"BDJ LAF",pub:"Jeune",sup:"Imprimé",d:"Une jeune femme en quête de sa magique vérité Alors que le grand rituel débute, Amelia et ses amis passent de l'autre côté du miroir et soudain tout le monde se retrouve projeté dans un monde où créatures dangereuses et esprits se côtoient. Amelia découvre alors que les esprits des grands créateurs de la Confrérie ont survécu sous une étrange entité ! Nos apprentis magiciens n'auront pas d'autre choix que de les affronter... Amelia, qui maîtrise de plus en plus ses pouvoirs, ne tarde pas à comprendre que cette entité n'a jamais cessé d'agir dans l'ombre en épiant les jeunes mages et en influençant ainsi chaque génération de Président de la Confrérie... Mais quand Serena accède à ce poste, les Anciens se sentent vite menacés et décident de manipuler en secret sa soeur Heme pour qu'elle embrasse la Magie Noire. De cette manière, Heme alimentera leur énergie vitale par ses crimes. Amelia comprend peu à peu comment sa tante a basculé vers les forces du mal...   La tétralogie d'Amelia touche à sa fin avec ce dernier tome plein de révélations dans lequel la jeune fille va élucider ses origines et avoir le courage de briser le lien qui unit son monde à celui des Anciens. Une aventure d'émancipation et de magie pour une héroïne forte en quête de la vérité.",isbn:"9782749310367",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310367-475x500-1.jpg"},
  {t:"Mon île adorée",a:"Cee Cee Mia",y:"2021",ed:"Dupuis",cote:"BDJ CAR",pub:"Jeune",sup:"Imprimé",d:"Tania, Alban et Théo forment la brigade des souvenirs. Leur ami Camille a acheté un vieil appareil photo dans une brocante et développé de vieux clichés représentant un jeune Réunionnais. Les trois amis se lancent à la recherche du mystérieux garçon et découvrent sa triste histoire. Un tome sur le thème des enfants de la Creuse. Avec, en fin d'ouvrage, un dossier sur les droits de l'enfant. ©Electre 2022",isbn:"9782800173993",extraUrl:"https://products-images.di-static.com/image/base/9782800173993-475x500-1.jpg"},
  {t:"Le tableau de Rachel",a:"Carbone",y:"DL 2024",ed:"Dupuis",cote:"BDJ CAR",pub:"Jeune",sup:"Imprimé",d:"Alors qu'ils emménagent dans la nouvelle maison de leur papa, Tania et Alban, aidés par Théo, y trouvent une pièce secrète. A l'intérieur : un vieux tableau du XVIIème siècle, Enfant et triton ! Découvrant une croix gammée au dos de la toile, les enfants comprennent que la mystérieuse oeuvre d'art a probablement été volée par les nazis pendant la Seconde Guerre mondiale... C'est décidé, la Brigade des souvenirs prendra le temps nécessaire pour retrouver son propriétaire ! Surtout que Tania et Théo aiment de plus en plus passer du temps ensemble... Carbone et Cee Cee Mia, avec leur proverbiaux sens du rythme et de la pédagogie, s'attaquent au lourd dossier des spoliations nazies, aidées par le dessin lisible mais précis de Marko.",isbn:"9782808502641",extraUrl:"https://products-images.di-static.com/image/base/9782808502641-475x500-1.jpg"},
  {t:"L'Amour à nu",a:"Maya",y:"DL 2024",ed:"Dupuis",cote:"BDJ BEK",pub:"Jeune",sup:"Imprimé",d:"Garance est désespérée ! Alors qu'elle allait avouer ses sentiments à Abel, elle découvre que celui-ci a une petite amie. Avec Linon, elle décide d'enquêter. Les deux filles chargent Charlie de découvrir qui est cette amoureuse mystérieuse... sans savoir que c'est Charlie elle-même !",isbn:"9782808504980",extraUrl:"https://products-images.di-static.com/image/orb-e5d53e6c92d8bbd5cc96a83e786cee1a/9782808504980-475x500-1.jpg"},
  {t:"L'animal-totem",a:"Manand",y:"DL 2025",ed:"Jungle",cote:"BDJ MAN",pub:"Jeune",sup:"Imprimé",d:"Violette Ténébris, la princesse du Royaume des Ténèbres, n'a toujours pas rencontré son animal-totem. Et sans animal-totem, pas de pouvoirs ! Il ne lui reste plus que trois jours avant son 16e anniversaire pour le trouver. Elle pourrait enfin être reconnue et acceptée par son peuple, qui la trouve bien trop bizarre, colorée et excentrique pour accéder un jour au trône... Violette décide donc de briser les règles ancestrales de la magie et d'aller à la recherche de son animal-totem elle-même, quitte à braver tous les dangers.",isbn:"9782822246354",extraUrl:"https://products-images.di-static.com/image/base/9782822246354-475x500-1.jpg"},
  {t:"La lettre de Toinette",a:"Cee Cee Mia",y:"2021",ed:"Dupuis",cote:"BDJ CAR",pub:"Jeune",sup:"Imprimé",d:"Tania, Alban et Théo forment la brigade des souvenirs. Ils trouvent une vieille lettre liée à une histoire d'amour inachevée pendant la Première Guerre mondiale. Ils enquêtent afin de retrouver Toinette et Ernest, les amoureux séparés par la guerre et la société. Avec, en fin d'ouvrage, un dossier documentaire sur les femmes durant la Grande Guerre. ©Electre 2022",isbn:"9791034736119",extraUrl:"https://products-images.di-static.com/image/base/9791034736119-475x500-1.jpg"},
  {t:"Secrets d'amour",a:"BeKa",y:"2021",ed:"Dupuis",cote:"BDJ BEK",pub:"Jeune",sup:"Imprimé",d:"Garance, 11 ans, et son amie Linon se posent beaucoup de questions sur l'amour. Elles mènent une enquête auprès des grandes du collège, notamment d'Enjoy Parasol, la plus belle fille de l'école, et d'Adèle, la gothique qui a la réputation d'être une fille facile. Les deux amies apprennent à voir au-delà des apparences. ©Electre 2021",isbn:"9791034754205",extraUrl:"https://images.epagine.fr/205/9791034754205_1_m.jpg"},
  {t:"La voiture de Bob",a:"Carbone",y:"DL 2022",ed:"Dupuis",cote:"BDJ CAR",pub:"Jeune",sup:"Imprimé",d:"Théo, l'un des jeunes enquêteurs de la Brigade des souvenirs, vide en compagnie de sa maman le garage de Papilou, son grand-père mécanicien devenu un peu sénile. Y découvrant une superbe Mercedes de collection, il se voit déjà à son volant ! Encore faut-il prouver que Papilou en est bien le propriétaire. Théo appelle aussitôt à la rescousse Tania et Alban, ses deux complices. Ensemble ils vont explorer le passé, à la recherche de témoins et de vieilles archives. Et vont exhumer l'incroyable histoire d'une féministe des années 70 et le mystère entourant sa disparition... Les auteurs explorent dans cette histoire ces temps où être féministe était encore plus courageux et complexe que de nos jours.",isbn:"9791034757749",extraUrl:"https://products-images.di-static.com/image/base/9791034757749-475x500-1.jpg"},
  {t:"Chagrins d'amour",a:"Beka, Maya",y:"2022",ed:"Dupuis",cote:"BDJ BEK",pub:"Jeune",sup:"Imprimé",d:"Tandis que les parents de Garance sont au bord du divorce, Linon file le parfait amour avec Noa. Mais ce dernier a pour ambition d'intégrer la bande de Soan, un groupe d'élèves très populaires. Pour y parvenir, Noa n'hésite pas à rompre avec Linon, qui se tourne sans succès vers sa meilleure amie Garance, en quête de consolation. ©Electre 2022",isbn:"9791034762651",extraUrl:"https://images.epagine.fr/651/9791034762651_1_75.jpg"},
  {t:"Un chant d'amour",a:"BeKa",y:"2022",ed:"Dupuis",cote:"BDJ BEK",pub:"Jeune",sup:"Imprimé",d:"Désespérée par le divorce de ses parents, Garance est attirée par son nouveau voisin. De leur côté, Linon continue d'ignorer les tentatives de Noa pour se faire pardonner et Adèle, la graffeuse gothique, apprend que certaines de ses oeuvres vont être vendues dans une galerie cotée. Enjoy est elle victime de harcèlement après avoir refusé de sortir avec Soan. ©Electre 2022",isbn:"9791034763009",extraUrl:"https://images.epagine.fr/009/9791034763009_1_m.jpg"},
  {t:"Le mur de Hans",a:"Carbone",y:"DL 2023",ed:"Dupuis",cote:"BDJ CAR",pub:"Jeune",sup:"Imprimé",d:"2 octobre 1964. Berlin, la nuit. Face au Mur, le petit Hans, dans les bras de sa maman, salue son papa malheureusement coincé du côté Est... Des années plus tard, de nos jours, Tania, Alban et Théo, fondateurs de la Brigade des souvenirs, retournent les vieilles affaires de Pierre, papa de Tania et Alban. Leur objectif : trouver des trésors à vendre lors d'un futur vide-greniers ! Mettant la main sur une série de vieilles cassettes audio, ils vont découvrir que Pierre, adolescent, échangeait avec un correspondant allemand, un certain Hans... L'occasion pour la Brigade de découvrir le destin incroyable et touchant de ces familles séparées par le Mur de Berlin... Mais parviendront-il à retrouver Hans, des décennies plus tard, ainsi que le morceau du Mur qu'il offrit à Pierre ? Emotion, rire, Histoire et amitié : voici le programme de cet album à la fois palpitant et pédagogique !",isbn:"9791034767229",extraUrl:"https://products-images.di-static.com/image/base/9791034767229-475x500-1.jpg"},
  {t:"La planète de l'amour",a:"Maya",y:"DL 2023",ed:"Dupuis",cote:"BDJ BEK",pub:"Jeune",sup:"Imprimé",d:"Adèle, la graffeuse gothique, reçoit une étrange invitation à venir réaliser une fresque en Sardaigne. Elle demande à Linon et Garance, ses deux meilleures amies, de l'accompagner pour des vacances qui promettent d'être inoubliables...",isbn:"9791034768721",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791034768721-475x500-1.jpg"},
  {t:"Collège, cabrioles et cambriole",a:"Amélie SARN",y:"DL 2025",ed:"Dupuis",cote:"BDJ SAR",pub:"Jeune",sup:"Imprimé",d:"Collégienne sans histoires le jour, Cassiopée a une double vie : La nuit, c'est une voleuse de haut vol. Elle fait équipe avec son frère Natt pour des Missions périlleuses sur ordre dé mystérieux commanditaires. Depuis des années, ils parcourent le monde au gré de leurs aventures nocturnes. A peine arrivés en France, ils reçoivent un nouveau contrat : dérober des documents dans le coffre d'une entreprise spécialisée dans le diagnostic de pollution. Pour Cassiopée, dissimuler un problème écologique est révoltant. Parviendra-t-elle à garder ses valeurs et son anonymat dans cette nouvelle mission qui s'avère plus dangereuse que toutes les autres ?",isbn:"9791034770373",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791034770373-475x500-1.jpg"},
  {t:"Les copains d'abord",a:"Gaet's",y:"DL 2024",ed:"Le Lombard",cote:"BDJ GAE",pub:"Jeune",sup:"Imprimé",d:"Chassé de sa famille, Véloce le jeune vélociraptor apprend qu'un danger encore plus terrible que les piqûres de moustique le menace, lui et tous ses congénères : les mystérieuses boules de feu qui tombent du ciel ! Le seul qui en sait plus, c'est Anky, le sage ankylosaure. Pour le retrouver dans ce monde de prédateurs terrifiants, Véloce assemble une équipe à son image : de véritables pattes cassées ! Et la survie des espèces jurassiques dépend de leur succès ! Qu'est-ce qui pourrait mal se passer... ?",isbn:"9782808212496",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782808212496-475x500-1.jpg"},
  {t:"La montagne de feu",a:"Gaet's",y:"DL 2025",ed:"Le Lombard",cote:"BDJ GAE",pub:"Jeune",sup:"Imprimé",d:"Véloce, notre héroïque (et peureux) vélociraptor, et ses amis ont réussi à tenir tête à la redoutable Tyrannie ! Sains et saufs, ils reprennent leur route vers la montagne de feu à la recherche du sage ankylosaure. Mais le chemin est semé d'embûches, et les paysages deviennent plus secs et ravagés par les traces de lave... Encore une menace ! Heureusement que la petite bande a plus d'un tour dans son sac, et qu'ensemble, ils sont les potes qui dépotent... car l'ennemi n'est pas toujours celui qu'on imagine !",isbn:"9782808214933",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782808214933-475x500-1.jpg"},
  {t:"La cité des secrets",a:"Victoria Ying",y:"2022",ed:"Bande d'ados",cote:"BDJ YIN",pub:"Jeune",sup:"Imprimé",d:"A 11 ans, Ever Barnes est orphelin et vit clandestinement dans le bâtiment du standard téléphonique de la ville d'Oskars. Sa famille était chargée de garder secrète l'existence du coffre-fort et seul Ever peut déchiffrer l'énigme qui révèle son emplacement. Des assassins envoyés par une nation rivale menacent Ever. Hannah, la fille du nouveau propriétaire de l'immeuble, lui vient en aide. ©Electre 2022",isbn:"9791036326547",extraUrl:"https://products-images.di-static.com/image/base/9791036326547-475x500-1.jpg"},
  {t:"Magda",a:"Wouters",y:"DL 2025",ed:"Éditions Sarbacane",cote:"BDJ WOU",pub:"Jeune",sup:"Imprimé",d:"Magda est une vraie \"Miss Catastrophe\", mais surtout une excellente cuisinière ! Cette année, elle a atteint l'âge de participer au concours de cuisine intergalactique où des enfants s'affrontent depuis un siècle pour défendre les couleurs de leur planète. L'enjeu est grand : gagner le précieux \" Nectar \", convoité pour ses propriétés miraculeuses. Mais Magda réalise vite que certaines personnes malintentionnées se cachent parmi les organisateurs du tournoi... La petite cuisinière au grand coeur saura-t-elle déjouer les complots ?",isbn:"9791040808374",extraUrl:"https://products-images.di-static.com/image/base/9791040808374-475x500-1.jpg"},
  {t:"Magda",a:"Wouters",y:"DL 2025",ed:"Éditions Sarbacane",cote:"BDJ WOU",pub:"Jeune",sup:"Imprimé",d:"Magda, 12 ans, est née sur Azuki, une planète minuscule à la flore saisissante, à l'instar de Tamaris son imposante voisine, peuplée elle de créatures légendaires. \" Miss Catastrophe \" en puissance, et excellente cuisinière malgré elle, elle a le don pour inventer accidentellement des recettes uniques et exquises, comme les soeurs Tatin avant elle. Par un coup de génie (ou du hasard...), elle est ainsi sélectionnée pour participer au fameux concours de cuisine intergalactique, au cours duquel des enfants, représentant chacun une planète, s'affrontent depuis cent ans. L'enjeu est de taille : gagner le \" Nectar \", convoité par tous pour ses propriétés miraculeuses. Mais alors que le tournoi bat son plein, Magda découvre que les dirigeants de certaines planètes se réunissent en secret, avec de sombres desseins... A l'aide de Mamidou, sa grand-mère elle-même ancienne finaliste intergalactique, et de ses amis, la petite cuisinière au grand coeur saura-t-elle déjouer les intrigues politiques et retrouver l'esprit de paix et de partage du tournoi",isbn:"9791040808381",extraUrl:"https://products-images.di-static.com/image/base/9791040808381-475x500-1.jpg"},
  {t:"Magda",a:"Wouters",y:"DL 2025",ed:"Éditions Sarbacane",cote:"BDJ WOU",pub:"Jeune",sup:"Imprimé",d:"L'heure de la grande finale du tournoi du gourmet intergalactique a enfin sonné ! Malheureusement, Magda, petite cuisinière génialement maladroite, s'est fait éliminer en demi-finale. Pour cette ultime épreuve, Kourou, la mystérieuse fille de la Lune, et ce vantard de Golden Gourmet, s'affronteront sur le volcan du \" Bercail de la civilisation \". Mais alors que le jour J approche, Kourou a disparu des radars... En effet, avant l'affrontement final, elle a un secret à révéler à Magda sur le passé trouble de Tamaris. La planète qui domine la galaxie et où se tient le tournoi n'a pas toujours été si flamboyante : il y a de nombreuses années, l'exploitation sans vergogne de la faune et de la flore s'est retournée contre les habitants de Tamaris et les a fait courir à leur perte... Et si l'histoire se répétait ? Et si Kourou savait comment rendre le pouvoir à la nature et chasser les hommes de cette planète, est-ce que Magda accepterait d'être sa complice ? Plus qu'à un concours de cuisine, Magda va devoir se confronter à elle-même et choisir dans quel type de société elle veut vivre...",isbn:"9791040808398",extraUrl:"https://products-images.di-static.com/image/base/9791040808398-475x500-1.jpg"},
  {t:"Bora et Leap",a:"Lylian",y:"2021",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"La suite des aventures de sept enfants dotés de capacités naturelles hors norme qui, après avoir répondu à l'appel d'une force étrange, découvrent des créatures gigantesques et apprennent que le destin de la planète est entre leurs mains. ©Electre 2021",isbn:"9782344040713",extraUrl:"https://products-images.di-static.com/image/base/9782344040713-475x500-1.jpg"},
  {t:"Célestin",a:"Lylian",y:"2021",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"La suite des aventures de sept enfants dotés de capacités naturelles hors norme qui, après avoir répondu à l'appel d'une force étrange, découvrent des créatures gigantesques et apprennent que le destin de la planète est entre leurs mains. ©Electre 2021",isbn:"9782344040720",extraUrl:"https://products-images.di-static.com/image/base/9782344040720-475x500-1.jpg"},
  {t:"Luyana",a:"Lylian",y:"2022",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"La suite des aventures de sept enfants dotés de capacités naturelles hors norme qui, après avoir répondu à l'appel d'une force étrange, découvrent des créatures gigantesques et apprennent que le destin de la planète est entre leurs mains. ©Electre 2022",isbn:"9782344040737",extraUrl:"https://products-images.di-static.com/image/base/9782344040737-475x500-1.jpg"},
  {t:"Yatho",a:"Lylian",y:"2022",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"La fin des aventures de sept enfants dotés de capacités naturelles hors norme qui, après avoir répondu à l'appel d'une force étrange, découvrent des créatures gigantesques et apprennent que le destin de la planète est entre leurs mains. ©Electre 2022",isbn:"9782344040744",extraUrl:"https://products-images.di-static.com/image/base/9782344040744-120x160-1.jpg"},
  {t:"Moon",a:"Lylian",y:"DL 2023",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"Menace cosmique : les astres sont bien plus mystérieux qu'on le croit... Cinq années se sont écoulées depuis la victoire des enfants et des Géants sur Alyphar ! L'harmonie règne sur Terre, mais pour combien de temps encore ? Tandis que Julie, désormais rattachée à l'ONU et obnubilée par ces Géants, cherche de nouvelles pistes pour comprendre leur présence, un phénomène inexplicable va bientôt frapper la Corée du Nord où habite une jeune écolière de 12 ans, Moon. Une pluie de météorites s'abat sur sa ville ! L'armée va tenter de faire face à cette situation en confinant la population mais le pire est à venir. Dans le magma des météorites, des formes sommeillent... ces créatures destructrices représentent une nouvelle menace pour l'équilibre du monde ! D'où proviennent-elles et comment les arrêter ? C'est au milieu de ce chaos que Moon va découvrir l'existence de son propre géant et ses véritables pouvoirs ! Posté sur la Lune, son géant fait partie d'un autre groupe de Géants. Ce groupe appelé \"les Gardiens\" surveille le système solaire pour contrer le géant suprême : Albordaros. Le temps est venu pour Moon d'alerter le reste du monde et espérer trouver d'autres enfants connectés à de nouveaux Géants. Il leur faudra unir leur force contre ce nouveau fléau venu cette fois-ci du cosmos. Après un premier cycle best-seller, un tout nouveau cycle s'ouvre et tient toutes ses promesses.",isbn:"9782344056059",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782344056059-475x500-1.jpg"},
  {t:"Les Géants",a:"Lylian,",y:"2024",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"Les fléaux ont commencé leur oeuvre ! Précédemment, une pluie de météorites s'est abattue en Corée du Nord. Dans le magma de ces boules de feu, des créatures destructrices sommeillent et menacent l'équilibre du monde ! Ce fléau vient de toucher aussi l'Australie où habite Nangali. Face à ce cataclysme mondial, la mère de cette jeune fille de 11 ans, décide de prendre la route pour rejoindre son père, à Uluru. Même si Nangali n'a pas vu son père depuis des années, elle pourra se mettre à l'abri dans cette région sauvage où les étoiles brillent avec une incroyable intensité la nuit. Pendant ce temps en Corée, Moon qui a découvert ses pouvoirs, s'est lancée à la recherche des autres Géants capables de combattre ces fléaux. En compagnie de son Géant, Ungdy, elle ne va pas tarder à retrouver Nangali pour l'encourager à réveiller à son tour son propre Géant ! Si Nangali parvient à révéler ses forces, elle sera une alliée de taille pour Moon. Ensemble, elles pourront peut-être sauver l'humanité ! Mais comment Nangali va-t-elle réussir à entrer en contact avec son Géant ? Et que se cache-il vraiment au coeur des météorites ? Pourquoi les fléaux semblent avoir des objectifs différents selon l'endroit où ils atterrissent et à qui obéissent-ils ? Alors que le chaos règne sur Terre, plus que jamais le salut de l'Humanité passe par le courage de ces enfants liés à cette nouvelle génération de Géants, puisant leurs forces dans les planètes de notre système solaire.",isbn:"9782344056066",extraUrl:"https://images.epagine.fr/066/9782344056066_1_m.jpg"},
  {t:"Karvan",a:"Lylian / Ingrid Chabbert",y:"DL 2024",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"5 Années se sont écoulées depuis la victoire des enfants et des géants sur Alyphar. Alors que l'harmonie règne à nouveau sur Terre, une terrible menace venant des étoiles frappe l'humanité. Une nouvelle génération d'enfants se lève et découvre les liens qui les unissent avec un groupe de géants postés sur chaque planète de notre système solaire.",isbn:"9782344061749",extraUrl:"https://products-images.di-static.com/image/orb-e5d53e6c92d8bbd5cc96a83e786cee1a/9782344061749-475x500-1.jpg"},
  {t:"ENZO",a:"Lylian",y:"2025",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"À la recherche d'une s'ur dans une ville de Rome dévastée Les fléaux sont en train de détruire la Terre, désormais la guerre est planétaire. À Los Angeles, le chaos règne dans les rues. Les enfants comme Moon et Erin, essayent tant bien que mal d'unir leur force pour protéger la population qui vit réfugiée dans des abris souterrains. L'armée s'est aussi déployée pour faire face au danger mais la situation est plus que préoccupante. Les fléaux dévorent les récoltes et la famine menace les survivants. Pendant ce temps à Rome, un jeune garçon, Enzo s'est lancé à la recherche de sa petite s'ur Lucia au milieu des ruines. Mais dans sa quête il va faire une étonnante découverte et trouver son propre géant, Shrafaros. C'est peut-être une des créatures les plus puissantes, car liée au Soleil ! Enzo va endosser sa mission avec courage, et peu à peu chasser les fléaux de Rome à l'aide de son géant. Ce nouveau géant apparu soudainement en Italie donne de l'espoir aux autres enfants. Peut-être qu'ensemble ils pourront terrasser les fléaux et sauver l'humanité'Pour le savoir, Moon qui a combattu en Corée du Nord et Kervan, en Grèce s'envolent vers l'Italie dans l'espoir de rencontrer Enzo et de s'allier à lui contre les Giga-fléaux qui sont encore plus redoutables'Ce tout nouveau cycle tient toutes ses promesses avec un nouveau casting d'enfants et de géants qui nous emmènent à la découverte de nouveaux pays ! Dans ce tome 10 nous irons en Italie, pour un récit toujours nourri d'action et de nouvelles rencontres dans un cycle qui permettra de développer les origines de ces Géants !",isbn:"9782344061992",extraUrl:"https://products-images.di-static.com/image/base/9782344061992-120x160-1.jpg"},
  {t:"Menace sur l'empire Dao",a:"Faith Erin Hicks",y:"2017",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeune",sup:"Imprimé",d:"Chaque nation qui au fil des siècles s'empare de la cité la renomme. Mais pour les autochtones, elle reste la cité sans nom. Kaidu, membre d'une famille Dao, le dernier peuple à avoir pris le contrôle de la région, vient d'arriver en ville et fait ses classes de soldat. Rat est elle originaire de la cité et déteste Kaidu pour tout ce qu'il représente. Le destin les rapproche.",isbn:"9782369813712",extraUrl:"https://products-images.di-static.com/image/base/9782369813712-475x500-1.jpg"},
  {t:"Les dernières écritures",a:"Zimmer",y:"DL 2025",ed:"P.O.L",cote:"R ZIM",pub:"Adulte",sup:"Imprimé",d:"Disparition du phoque moine. Disparition du rhinocéros blanc. Disparition du manchot empereur. Disparition de la grenouille d'Asie. Disparition du lézard des Pyrénées. Disparition du tigre de Tasmanie. Disparition de l'ours polaire. Disparition du bison d'Amérique. Disparition de Léa Bergeron-Filippi.",isbn:"9782818059562",extraUrl:"https://covers.openlibrary.org/b/isbn/9782818059562-M.jpg"},
  {t:"Le monde est fou",a:"Julien Frey",y:"DL 2025",ed:"Jungle",cote:"BDJ FRE",pub:"Jeune",sup:"Imprimé",d:"Lu dans le Journal de Mickey ! Cléo et Léo sont voisins, dans la même classe et... inséparables. Après l'école, ils rentrent toujours chez eux ensemble. Chemin commun, précieuses minutes à deux. Pour refaire le monde et s'éclater !",isbn:"9782822246439",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782822246439-475x500-1.jpg"},
  {t:"Les chroniques des stellaires",a:"Blasco",y:"DL 2025",ed:"Drakoo",cote:"BDJ BLA",pub:"Jeune",sup:"Imprimé",d:"Dans la contrée de Mintaka, il est de tradition de recevoir une tapisserie divinatoire le jour de ses 18 ans. Ces tapisseries sont fabriquées dans le plus grand secret par des êtres nommés les Stellaires. Sur ces tentures figurent les portraits des personnes qui auront une importance capitale au cours des vies des uns et des autres, en particulier celui de l'élue de son coeur. Lita et Alban, nés le même jour, attendent impatiemment leur précieux présent. Seulement, suite à l'ouverture de sa tapisserie, il est clair pour Lita qu'elle n'a pas reçu la bonne. Le portrait d'Alban, son voisin quelle ne peut pas voir en peinture, figure en plein milieu de la sienne, entourée de pierres d'émeraude, signe qu'ils devraient être des âmes soeurs. IM-POS-SIBLE ! Ensemble, ils vont partir à la recherche du temple bien gardé des Stellaires, afin de tirer cette histoire au clair.",isbn:"9782382331927",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782382331927-475x500-1.jpg"},
  {t:"Blanche-Fleur",a:"Feroumont",y:"DL 2025",ed:"Dupuis",cote:"BDJ FER",pub:"Jeune",sup:"Imprimé",d:"Dans le Royaume des Six Ponts où règne le roi Serge, il fait bon vivre. Et tout le monde s'apprête à fêter dignement le mariage de la princesse Cécile. Anne, la tavernière, se réjouit de l'événement, non seulement parce qu'elle a été élevée avec Cécile, mais aussi parce que ce mariage va lui permettre de relancer sa taverne. Mais Anne est aussi la protégée du roi, qui ne peut rien lui refuser. Ce qui suscite la jalousie de la reine qui déteste Anne, complote contre elle et ne sera satisfaite que le jour où cette \" petite intrigante \" aura été éliminée. Blanche-Fleur est la réédition de la deuxième partie du Royaume de Blanche-Fleur, gros album paru en août 2019 et est la suite du tome 9 sorti en février 2025.",isbn:"9782808508865",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808508865-475x500-1.jpg"},
  {t:"On mène, mais gardons les pieds sur la tête !",a:"Poupard",y:"DL 2013",ed:"Bamboo Edition",cote:"BDJ BEK",pub:"Jeune",sup:"Imprimé",d:"Les Rugbymen débarquent dans la Capitale avec leur humour implacable ! À Paillar, le village aux ronds-points ovales où le rugby est roi, les occasions de faire la fête sont nombreuses : 3e mi-temps, mariage... Si nombreuses que L'Anesthésiste a parfois du mal à faire accepter ses sorties répétitives à sa femme ! En fin de saison, La Couane invite son père à passer un week-end à Paris pour assister à la finale du championnat de France, ainsi qu'au spectacle du célèbre cabaret « Le Crazy Ours ». Les autres joueurs du PAC vont bientôt les rejoindre et transformer cette sortie en grande fête, comme seuls les Rugbymen savent le faire !",isbn:"9782818922163",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818922163-475x500-1.jpg"},
  {t:"On a déboulé à Marcatraz !",a:"Poupard",y:"DL 2016",ed:"Bamboo Edition",cote:"BDJ BEK",pub:"Jeune",sup:"Imprimé",d:"Quand André et Boniface, les deux plus anciens supporters de Paillar, arrêtent de chanter dans les tribunes, c'est mauvais signe... signe que nos joueurs ont perdu un match ! Les défaites s'enchaînent durant tout l'automne pour l'équipe du PAC et, humiliation suprême, Ripaille, l'ennemi légendaire, les bats pour la première fois depuis de nombreuses années. L'Entraîneur se rend vite compte que, malgré leur originalité, ses méthodes ne s'avèrent pas très efficaces pour faire remonter la pente à ses joueurs. Il ne reste alors qu'une seule solution : un stage intensif au redoutable centre de formation de Marcatraz...",isbn:"9782818934715",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818934715-475x500-1.jpg"},
  {t:"La rentrée des crasses",a:"Coppée",y:"DL 2004",ed:"Delcourt",cote:"BDJ COP",pub:"Jeune",sup:"Imprimé",d:"\" -Tu aimes aller à l'école, Toto ? -Oh oui, mais j'aime bien aussi en revenir. La seule chose qui m'ennuie, c'est le temps que je passe entre les deux. \"",isbn:"9782847895131",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782847895131-475x500-1.jpg"},
  {t:"Erin",a:"Lylian",y:"2020",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"La multinationale Crossland Corporation découvre un géant d'allure bestiale endormi depuis des temps immémoriaux dans un bloc de glace en Arctique. Au même moment, en Ecosse, la jeune Erin, une orpheline qui ne cesse de rêver chaque nuit de la mort accidentelle de ses parents, croise dans la forêt une bande d'enfants mal intentionnés. C'est alors qu'un mystérieux géant vient à son secours. ©Electre 2020",isbn:"9782344039403",extraUrl:"https://products-images.di-static.com/image/base/9782344039403-475x500-1.jpg"},
  {t:"Siegfried",a:"Lylian",y:"2020",ed:"Glénat",cote:"BDJ LYL",pub:"Jeune",sup:"Imprimé",d:"La suite des aventures de sept enfants dotés de capacités naturelles hors norme qui, après avoir répondu à l'appel d'une force étrange, découvrent des créatures gigantesques et apprennent que le destin de la planète est entre leurs mains. ©Electre 2020",isbn:"9782344040706",extraUrl:"https://products-images.di-static.com/image/base/9782344040706-475x500-1.jpg"},
  {t:"Lila T07",a:"Goalec",y:"2023",ed:"Delcourt",cote:"BDJ GOA",pub:"Jeune",sup:"Imprimé",d:"Lila rentre de son camp de survie, forte d'un niveau 2 bravement gagn au prix d'un feu allum et d'une grenouille malencontreusement bouillante. Elle est donc prte partir l'autre bout du monde pour vivre un an chez Cora avec son cochon d'Inde Gizmo en bagage poilu. Elle n'est cependant pas prte sa rencontre avec Thomas, le nouveau qui se proclame spcialiste de l'espace !",isbn:"9782413044642",extraUrl:"https://products-images.di-static.com/image/base/9782413044642-475x500-1.jpg"},
  {t:"Fish & Ships",a:"Midam",y:"DL 2025",ed:"Dupuis",cote:"BDJ MID",pub:"Jeune",sup:"Imprimé",d:"Le principe du jeu vidéo de Game Over ? Un petit barbare (pas toujours super adroit, il est vrai...) doit sauver une princesse (pas toujours super maline, avouons-le...). A partir de ce postulat limpide, toute l'équipe du Gang of fun orchestre des situations toujours plus loufoques et inattendues, dégénérant systématiquement en éclats de rire et d'hémoglobine ! Un humour transgressif mais résolument tous publics, plébiscité plus que jamais par les lecteurs du journal Spirou, qui trouvent dans ce prolongement de l'univers de Kid Paddle l'occasion de se régaler de l'intrusion des célèbres Blorks ! Game Over ? Au bout de 24 tomes, on redemande toujours du \" Same player shoot again \". Une longévité exceptionnelle dans le monde de la BD.",isbn:"9782808510233",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808510233-475x500-1.jpg"},

const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};

// Cache (par titre) de l'URL résolue, et ensemble des livres confirmés sans illustration possible
const resolvedUrl={};
const badTitles=new Set();

// Résout l'illustration d'un livre une seule fois, met en cache le résultat (succès ou échec)
async function resolveCover(doc){
  if(resolvedUrl[doc.t]!==undefined) return resolvedUrl[doc.t];
  if(badTitles.has(doc.t)) return null;
  const urls=buildUrls(doc);
  if(!urls.length){ badTitles.add(doc.t); resolvedUrl[doc.t]=null; return null; }
  const url=await tryUrlsAsync(urls);
  resolvedUrl[doc.t]=url;
  if(!url) badTitles.add(doc.t);
  return url;
}

function makeFace(cls,doc,knownUrl){
  const face=document.createElement('div');
  face.className=cls;
  face.style.background='#000';

  if(knownUrl){
    setFaceCover(face,knownUrl,doc);
  } else {
    resolveCover(doc).then(url=>{ if(url && face.isConnected) setFaceCover(face,url,doc); });
  }
  return face;
}

function setFaceCover(face,url,doc,attempt){
  attempt=attempt||0;
  const img=document.createElement('img');
  img.className='cover-img';
  img.alt='';
  img.onerror=()=>{
    img.remove();
    if(attempt===0 && doc){
      // 1er échec : on retente une résolution fraîche pour ce même livre
      delete resolvedUrl[doc.t];
      resolveCover(doc).then(retryUrl=>{
        if(retryUrl && face.isConnected) setFaceCover(face,retryUrl,doc,1);
        else { removeFromPool(doc); fallbackToOtherCover(face,doc); }
      });
    } else {
      removeFromPool(doc);
      fallbackToOtherCover(face,doc);
    }
  };
  img.src=url;
  face.appendChild(img);
}

// Une source qui a échoué deux fois est retirée du pool : on ne la retentera plus
function removeFromPool(doc){
  if(!doc) return;
  goodPool=goodPool.filter(e=>e.doc.t!==doc.t);
}

// En dernier recours, on remplace par une autre couverture du pool déjà confirmée fonctionnelle
// (jamais de case vide : on retombe toujours sur une illustration qui a déjà fonctionné)
function fallbackToOtherCover(face,excludeDoc,triedTitles){
  if(!face.isConnected || !goodPool.length) return;
  triedTitles=triedTitles||new Set();
  if(excludeDoc) triedTitles.add(excludeDoc.t);
  const candidates=shuffle(goodPool.filter(e=>!triedTitles.has(e.doc.t)));
  const pool=candidates.length?candidates:shuffle(goodPool);
  const pick=pool[0];
  const img=document.createElement('img');
  img.className='cover-img';
  img.alt='';
  img.onerror=()=>{
    img.remove();
    triedTitles.add(pick.doc.t);
    // On a essayé suffisamment de candidats différents : on n'insiste pas indéfiniment,
    // mais on retente toujours avec un nouveau candidat tant qu'il en reste un non testé
    if(triedTitles.size<goodPool.length) fallbackToOtherCover(face,null,triedTitles);
  };
  img.src=pick.url;
  face.appendChild(img);
}

let displayed=[],flipTimer=null,popClose=null,goodPool=[],flipQueue=[];

// Teste tous les livres en parallèle au démarrage, ne garde que ceux dont l'illustration charge réellement
async function buildGoodPool(){
  const results=await Promise.all(BOOKS.map(async doc=>{
    const url=await resolveCover(doc);
    return url?{doc,url}:null;
  }));
  return results.filter(Boolean);
}

// Pioche le prochain livre illustré dans une file mélangée (pool de livres confirmés), en évitant les doublons déjà affichés
function nextBookForFlip(){
  if(!goodPool.length) return null;
  if(!flipQueue.length) flipQueue=shuffle(goodPool.map((_,i)=>i));
  const shownTitles=new Set(displayed.map(d=>d&&d.t));
  for(let k=0;k<flipQueue.length;k++){
    const idx=flipQueue[k];
    if(!shownTitles.has(goodPool[idx].doc.t)){
      flipQueue.splice(k,1);
      return goodPool[idx];
    }
  }
  const idx=flipQueue.shift();
  return goodPool[idx];
}

function buildGrid(){
  const mosaic=document.getElementById('mosaic');
  let pool=shuffle(goodPool);
  while(pool.length<44) pool=[...pool,...shuffle(goodPool)];
  const slots=pool.slice(0,44);
  displayed=slots.map(s=>s.doc);
  slots.forEach((entry,i)=>{
    const card=document.createElement('div'); card.className='card'; card.dataset.index=i;
    const inner=document.createElement('div'); inner.className='card-inner';
    inner.appendChild(makeFace('card-front',entry.doc,entry.url));
    const backEntry=slots[(i+22)%slots.length];
    inner.appendChild(makeFace('card-back',backEntry.doc,backEntry.url));
    card.appendChild(inner);
    card.addEventListener('click',()=>openPopup(i));
    mosaic.appendChild(card);
  });
}

function startFlipping(){
  if(flipTimer) clearInterval(flipTimer);
  let lastIndex=-1;
  flipTimer=setInterval(()=>{
    const next=nextBookForFlip();
    if(!next) return; // sécurité : aucun livre illustré disponible
    const cards=[...document.querySelectorAll('.card')];
    // On exclut la tuile retournée juste avant : jamais deux fois de suite la même
    const candidates=cards.filter(c=>parseInt(c.dataset.index)!==lastIndex);
    const pick=candidates[Math.floor(Math.random()*candidates.length)];
    // On met à jour la face actuellement cachée (celle qui va devenir visible), jamais l'inverse
    const isFlipped=pick.classList.contains('flipped');
    const hiddenCls=isFlipped?'card-front':'card-back';
    pick.querySelector('.'+hiddenCls).replaceWith(makeFace(hiddenCls,next.doc,next.url));
    pick.classList.toggle('flipped');
    displayed[parseInt(pick.dataset.index)]=next.doc;
    lastIndex=parseInt(pick.dataset.index);
  },FLIP);
}

function openPopup(i){
  const doc=displayed[i]; if(!doc) return;
  document.getElementById('popup-title').textContent=doc.t||'';
  document.getElementById('popup-author').textContent=doc.a||'';
  const m=[]; if(doc.y) m.push('Paru en '+doc.y); if(doc.ed) m.push('chez '+doc.ed);
  document.getElementById('popup-meta').textContent=m.join(' ');
  document.getElementById('popup-summary').textContent=doc.d||'';
  document.getElementById('pi-cote').textContent=doc.cote||'—';
  document.getElementById('pi-public').textContent=doc.pub||'—';
  document.getElementById('pi-support').textContent=doc.sup||'—';

  const wrap=document.getElementById('popup-cover-wrap');
  const cov=document.getElementById('popup-cover');
  wrap.classList.remove('on'); cov.src='';

  const showPopupCover=url=>{
    cov.onload=()=>{ if(cov.naturalWidth>10) wrap.classList.add('on'); };
    cov.onerror=()=>{ wrap.classList.remove('on'); };
    cov.src=url;
  };

  resolveCover(doc).then(url=>{ if(url) showPopupCover(url); });

  document.getElementById('popup-overlay').classList.add('active');
  clearTimeout(popClose);
  const bar=document.getElementById('popup-timer-progress');
  bar.style.transition='none'; bar.style.width='100%';
  bar.getBoundingClientRect();
  bar.style.transition=`width ${POPUP}ms linear`; bar.style.width='0%';
  popClose=setTimeout(closePopup,POPUP);
}

function closePopup(){
  document.getElementById('popup-overlay').classList.remove('active');
  clearTimeout(popClose);
}

document.getElementById('popup-close').addEventListener('click',closePopup);
document.getElementById('popup-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('popup-overlay'))closePopup();});

async function init(){
  goodPool=await buildGoodPool();
  buildGrid();
  startFlipping();
}
init();
</script>
