  {t:"Art nouveau",a:"Hauffe Thomas",y:"2024",ed:"Editions Place des Victoires",cote:"745 HAU",pub:"Adulte",sup:"Imprimé",d:"Plongez dans l'univers fascinant de l'Art Nouveau à travers ce beau livre illustré, qui explore les influences majeures de ce mouvement à Amsterdam, Glasgow et Chicago. Découvrez des artistes emblématiques et explorez leur impact sur l'architecture, la peinture, le graphisme et les arts décoratifs. Un ouvrage incontournable pour les passionnés d'art et d'histoire. Cet ouvrage vous plongera dans l'univers de l'Art Nouveau, explorant ses manifestations à Amsterdam, Glasgow, et Chicago. Commencez votre exploration par l'Art Nouveau en Ecosse, mettant en lumière des artistes renommés tels que Charles Rennie Mackintosh et Frances MacDonald. Poursuivez votre voyage à travers les artistes néerlandais du \" Nieuwe Kunst \", notamment Jac. van den Bosch et Jan Toorop. Enfin, découvrez les figures majeures de l'Art Nouveau aux Etats-Unis, parmi lesquelles Louis Comfort Tiffany, Louis Sullivan, William Henry Bradley... Ce beau livre illustré de référence vous offre un panorama complet des artistes emblématiques de l'Art Nouveau dans les domaines de l'architecture, de la peinture, du graphisme et des arts décoratifs, évoquant l'héritage artistique de ces villes emblématiques que sont - notamment - Amsterdam, Glasgow et Chicago.",isbn:"9782809920246",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809920246-M.jpg"},
  {t:"W0rldtr33",a:"Tynion James",y:"2025",ed:"Urban Comics",cote:"BD TYN",pub:"Adulte",sup:"Imprimé",d:"En appuyant sur un seul bouton, Gabriel Winter a supprimé Internet et changé à jamais la face du monde. Alors que son cercle d'amis en subit les conséquences directes, l'agent spécial Siobhan Silk tente de lever le voile sur ce qui s'est passé il y a 25 ans... et de stopper Ph34R, la létale personnification de l'Undernet, de faire davantage de victimes.",isbn:"9791026829720",extraUrl:"https://covers.openlibrary.org/b/isbn/9791026829720-M.jpg"},
  {t:"Honey Lemon Soda T14",a:"Murata Mayu",y:"2026",ed:"nobi nobi !",cote:"BD HON",pub:"Jeunesse",sup:"Imprimé",d:"Uka Ishimori et Kai Miura filent  le parfait amour et l'ont proclamé  haut et fort lors de la fête du lycée.  Il est d'ailleurs temps pour eux de  fêter le premier anniversaire de  leur relation ! Afin de célébrer ce  grand jour, la jeune fi lle a préparé  un planning aux petits oignons'  Réussira-t-elle à rendre la journée  aussi inoubliable qu'elle l'imagine'L'amour repars pour un tour !",isbn:"9782384966622",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384966622-M.jpg"},
  {t:"Le dernier roi soleil",a:"Des Déserts Sophie",y:"2019",ed:"Ed. de la Loupe",cote:"B ORM",pub:"Adulte",sup:"Imprimé",d:"",isbn:"9782848688756",extraUrl:"https://covers.openlibrary.org/b/isbn/9782848688756-M.jpg"},
  {t:"Les guerres civiles",a:"Buisson Jean-Christophe",y:"2025",ed:"Coédition Perrin/Le Figaro Magazine",cote:"909 BUI",pub:"Adulte",sup:"Imprimé",d:"Guerre... civile ! Deux termes antinomiques pour dire l'indicible, soit la lutte fratricide dressant une partie d'un peuple contre un autre. Submergeant le cadre militaire conventionnel, les conflits intérieurs mobilisent les sociétés, divisent les cités et broient les familles, générant des massacres au nom d'une valeur suprême revendiquée, qu'elle soit d'origine religieuse, idéologique, sociale ou ethnique. Dans la lignée de leur précédent ouvrage- collectif à succès, Le Dernier Carré, Jean-Christophe Buisson et Jean Sévillia ont rassemblé historiens et journalistes de renom pour raconter et expliquer ces dérives barbares qui ont défiguré l'histoire de l'humanité depuis le XVIe siècle. Les récits, écrits au scalpel et puisés aux meilleures sources, éclairent les guerres civiles les plus emblématiques, en particulier celles du terrible XXe siècle. Les conflits célèbres (la guerre de Sécessión, la guerre civile russe, la tragédie du Liban, le génocide rwandai côtoient des épisodes plus méconnus (les guerres carlistes, la révnie des Taiping, les Cristeros, les guerres civiles yougoslave et grecque, l'Angola). Cinq chapitres sont consacrés à la France (guerres de Religion, Fronde, Vendée, Commune, fin de l'Algérie française), soulignant l'écartèlement de notre pays entre sa propension à la division et sa quête d'unité. Une préface d'envergure place l'ensemble en perspective avant d'interroger l'actualité. Une grande leçon d'histoire qui a valeur d'avertissement pour le présent et l'avenir.",isbn:"9782262109851",extraUrl:"https://covers.openlibrary.org/b/isbn/9782262109851-M.jpg"},
  {t:"Les Mystères de Byton Cove - La nuit de la disparition",a:"Sivi Laëtitia",y:"2026",ed:"Fleurus",cote:"J SIV",pub:"Jeunesse",sup:"Imprimé",d:"De retour à Byton Cove après Noël, Ruby retrouve ses amis du club international et intègre le département de photographie. Elle espère un nouveau départ, loin de l'attention médiatique des dernières semaines. Mais voilà qu'elle est entraînée dans une nouvelle affaire ! Juana Moya lui demande d'enquêter, avec Charles, sur la disparition de son fils, Arturo, vingt-huit années plus tôt. Un seul témoin : le petit frère de la victime, Gabriel, qui l'accompagnait dans les bois de Williams Wood, cette nuit-là'et qui est persuadé qu'Arturo a été enlevé par des extraterrestres ! Ruby, Charles et leurs amis essaient de démêler le vrai du faux, s'intéressent aux théories du complot et investiguent le passé de cet Arturo, brillant étudiant d'origine immigrée qui rêvait d'être astrophysicien'Ruby cherche la vérité. Pourtant, elle sait bien que l'on peut se perdre soi-même à poursuivre des fantômes",isbn:"9782215200253",extraUrl:"https://products-images.di-static.com/image/base/9782215200253-475x500-1.jpg"},
  {t:"Hercule Poirot",a:"Brrémaud Frédéric",y:"2020",ed:"Paquet",cote:"BD BRR",pub:"Adulte",sup:"Imprimé",d:"La 4ème de couverture indique : \"Un grand classique des romans d'Agathe Christie, un roman sombre et machiavélique adapté pour la première fois en bande dessinée. Une course contre la montre, et un annuaire des transports pour toute signature. Voici Hercule Poirot aux prises avec un adversaire bien déroutant, qui le prévient de ses méfaits et le met au défi de l'arrêter. Un challenge de taille pour celui qui prétend être le plus grand détective du monde. Alors que toute l'Angleterre se passionne et soupçonne, Hercule Poirot saura-s-il mettre fin à cette série de meurtres par ordre alphabétique'\"",isbn:"9782889325252",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889325252-M.jpg"},
  {t:"Yôkai",a:"Vermot Thibault",y:"2022",ed:"Éditions Sarbacane",cote:"J VER",pub:"Jeunesse",sup:"Imprimé",d:"\"Voici Yanagi, et voici Takata. C'est pas des si mauvais garçons : s'ils m'ont enlevée, c'est qu'ils avaient besoin d'argent. Takata dit qu'il a cassé son sabre et qu'il doit en racheter un. Au fait, moi, c'est Kyoko, et je suis la fille du calligraphe. Ils ont décidé de se cacher dans la montagne en attendant la rançon, mais mon père est si radin qu'ils peuvent toujours courir ! Avec Yanagi, on a pêché des poissons, et j'ai mis une branche dans l'oeil de Takata sans le faire exprès. Moi je m'amuse bien ! Mais Yanagi guette les gens dans la vallée. Bientôt, la montagne grouillera d'hommes du daimyo, le chef de la police. C'est là que j'ai l'idée proposer un plan époustouflant à mes nouveaux copains : le casse du siècle, pas moins ! \"",isbn:"9782377316564",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782377316564-475x500-1.jpg"},
  {t:"Les aventures d'une poule aveugle et d'un canard boiteux",a:"Hub Ulrich",y:"2024",ed:"Gallimard",cote:"J HUB",pub:"Jeunesse",sup:"Imprimé",d:"Une fable subtile, drôle et pétillante qui célèbre le pouvoir de l'imagination et la force de l'amitié. Il existe un endroit où l'on peut réaliser son voeu le plus secret, et la poule veut s'y rendre ! Elle aurait bien aimée être accompagnée d'un chien guide, mais c'est sur un canard boiteux et très peureux qu'elle tombe. Il tremble déjà à l'idée de quitter son arrière-cour. Qu'importe, il fera bien l'affaire !",isbn:"9782075206907",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075206907-475x500-1.jpg"},
  {t:"La Légende de Tristan et Yseut",a:"Rachmühl Françoise",y:"2026",ed:"Flammarion",cote:"J RAC",pub:"Adolescent",sup:"Imprimé",d:"Le roi Marc de Cornouailles a décidé de prendre pour épouse la belle Yseut et charge son neveu, le chevalier Tristan, d'aller la trouver en Irlande. Mais sur le bateau du retour, les deux jeunes gens boivent par erreur un philtre d'amour. Désormais, ils sont condamnés à s'aimer à tout jamais... Retrouvez un des couples les plus mythiques de la littérature dans ce roman de chevalerie et d'amour, adapté par Françoise Rachmuhl.",isbn:"9782080497314",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080497314-475x500-1.jpg"},
  {t:"Tout ce que je ne sais pas",a:"Lume Chloé",y:"2026",ed:"Éditions Sarbacane",cote:"J LUM",pub:"Adolescent",sup:"Imprimé",d:"Eléonore a eu un accident. Après un an de convalescence, elle sort de son cocon pour se confronter à sa vie d'avant, dont elle a tout oublié. Anciens amis, amoureux, profs... ont chacun une version différente de qui elle était, et de ce qui s'est réellement passé. Plus elle tente de reconstituer le puzzle, plus la vérité lui échappe. Que cherche-t-on à lui cacher ?",isbn:"9791040809326",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040809326-475x500-1.jpg"},
  {t:"L'île des animaux fabuleux",a:"Chanfreau Sofia",y:"2025",ed:"Milan",cote:"J CHA",pub:"Jeunesse",sup:"Imprimé",d:"« Loin, au milieu de l'océan (sans doute précisément l'océan que tu imagines), se trouve une île (sans doute précisément l'île que tu imagines). Cette île a la forme d'une girafe, en tout cas si on la regarde d'en haut, ou bien si on l'observe sur une carte et qu'on a un peu d'imagination : c'est l'Île-Girafe. On dirait que cette île a trois jambes et une petite queue, un grand corps et un long cou terminé par une tête. Au milieu de son corps, il y a un grand lac qu'on appelle le Coeur-de-la-Girafe. L'eau du lac est aussi sucrée que de la limonade et sa surface est presque toujours calme, alors que la mer salée qui entoure l'île est toujours agitée. (...) Dans l'une des maisons les plus hautes de la Capitale vit une petite fille. (...) Cette fille s'appelle Vega, et elle s'assoit souvent à sa fenêtre pour rêver de ce qui se trouve de l'autre côté de la mer. »Une héroïne touchanteVega vit seule avec son papa. Seule ? Pas du tout en fait, car toute une ribambelle d'animaux lui tiennent compagnie. Même si son père les trouve bien trop envahissants, Vega est la seule à les voir : grizzlis, zèbres, hippocampes ou rhinocéros... vivent dans son placard, au coin de la rue ou dans la salle de bains. Elle croise même des lapins sans oreilles, des souris à rayures, des chevaux petits comme des chats et des scarabées gros comme des cochons d'Inde. Sans parler de tous ceux qu'il est impossible de décrire, comme les fripourdons, les spatulots, les crapaçons et les tétrabranchipattes... Quête et résilienceDepuis quelque temps, Vega est inquiète : son père a changé, il s'absente souvent. Il semble lointain, il l'écoute à peine, il est devenu... froid ! Bientôt, Vega apprend qu'une femme de glace s'est emparée de son coeur, et voit son père en train de se couvrir de givre... Pour le sauver, elle part à la recherche de sa mère dont elle ne sait rien...Un texte pour s'évader et voyager très loin, jouer avec son imagination et apprivoiser ses peurs.Revue de presse« Un livre qui...",isbn:"9782408050924",extraUrl:"https://products-images.di-static.com/image/base/9782408050924-475x500-1.jpg"},
  {t:"Rousse et l'oiselle de feu",a:"Chan Élodie",y:"2026",ed:"L'École des loisirs",cote:"J CHA",pub:"Jeunesse",sup:"Imprimé",d:"Rousse s'engouffre dans les tréfonds du bois, sur les traces de Yaya, la sorcière d'automne. Accompagnée de ses chimères, celle-ci a juré d'emporter sa grand-mère au royaume des morts. Mais Rousse est bien décidée à l'affronter ! A moins que l'oiselle de feu, créature aux pouvoirs légendaires, ne lui ouvre un autre chemin ?",isbn:"9782211350068",extraUrl:"https://products-images.di-static.com/image/base/9782211350068-475x500-1.jpg"},
  {t:"Tes mots sur les murs",a:"Renard Eve",y:"2026",ed:"Rageot",cote:"J REN",pub:"Jeunesse",sup:"Imprimé",d:"Dans le collège d'Olympe, un poète anonyme écrit ou colle sur les murs des messages féministes éphémères qu'elle et Assia, sa meilleure amie, immortalisent en les repostant sur Instagram. Comme ces poèmes-collages se font de plus en plus engagés, le Principal est décidé à démasquer celui qu'il considère comme un vandale. Olympe aussi veut découvrir l'identité du Poète. Elle brûle de se sentir utile dans cette lutte féministe qui s'étend dans le collège, encouragée par leur professeure de français. Elle se fait une nouvelle amie, Laula, rencontrée au club féministe. Jusqu'où iront-elles, au nom d'une noble cause ?",isbn:"9782700286953",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782700286953-475x500-1.jpg"},
  {t:"J'irai jusqu'au rivage du soleil",a:"Farrokhzad Forugh",y:"2026",ed:"Gallimard",cote:"891.5 FAR",pub:"Adulte",sup:"Imprimé",d:"Forough Farrokhzâd (1935-1967), née et morte à Téhéran, est assurément une icône non seulement de la poésie iranienne du XXe siècle mais tout autant de la cause de l'émancipation féminine dont sa vie, libre et tourmentée, objet de scandale dans son pays, est comme un manifeste. Sa poésie est un chant d'amour intensément libre, porté par un lyrisme charnel puissant et nourri par ailleurs de la grande poésie persane classique.",isbn:"9782073089755",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073089755-M.jpg"},
  {t:"Renversante",a:"Hinckel Florence",y:"2026",ed:"L'École des loisirs",cote:"J HIN",pub:"Jeunesse",sup:"Imprimé",d:"Depuis la nuit des temps, ce sont les hommes qui s'occupent des enfants. C'est normale et naturelle, puisque les femmes, elles, portent les enfants dans leur ventre pendant neuf mois, puis elles les allaitent si elles veulent, ce qui les fatigue beaucoup. Elles n'allaient pas, en plus, s'en occuper le restant du temps ![xe2][x80][xa6] C'est pour ça que, dans mon pays, ce sont les femmes qui sont à la tête de l'État. Quelques hommes particulièrement intelligents ont réussi à se hisser au même rang qu'elles (même si on n'a encore jamais vu un homme présidente de la République). Ils sont très méritants, quand on pense à la charge qu'ils assument en plus à la maison[xe2][x80][xa6]",isbn:"9782211350921",extraUrl:"https://products-images.di-static.com/image/base/9782211350921-475x500-1.jpg"},
  {t:"Poison Ivy",a:"Wilson Gwendolyn Willow",y:"2025",ed:"Urban Comics",cote:"BD WIL",pub:"Adulte",sup:"Imprimé",d:"Alors qu'elle doit s'accommoder à sa nouvelle vie et à ses pouvoirs pleinement retrouvés, Poison Ivy reprend sa guerre pour l'équilibre du monde naturel. Sa dernière mission en date : rétablir la vie dans les zones humides entourant Gotham City, que les déchets industriels de la ville ont ravagées. Mais ses objectifs sont bouleversés lorsqu'elle fait involontairement ressurgir un lieu qui remonte aux origines de Gotham et avec lui... quelque chose d'affamé. Pendant ce temps, des incendies purificateurs brûlent à travers l'Amérique, cherchant à débarrasser le pays de l'influence humaine. Et, même sans qu'elle ne le sache'Poison Ivy elle-même est à blâmer.",isbn:"9791026825326",extraUrl:"https://covers.openlibrary.org/b/isbn/9791026825326-M.jpg"},
  {t:"Poison Ivy Infinite Tome 6",a:"Wilson G.Willow",y:"2026",ed:"Urban Comics",cote:"BD WIL",pub:"Adulte",sup:"Imprimé",d:"Marshview, le sanctuaire que Poison Ivy a exhumé des marais, est menacé de toute part... une horrible entité semble hanter les lieux, la police, mais aussi Gardener et l'ordre du Chevalier Vert sont après Ivy, et même Batman en personne est à ses trousses ! Ivy devra affronter à la fois son passé et son présent dans l'espoir d'assurer son propre avenir, mais parviendra-t-elle à sauvegarder ce lieu sans mettre en péril tous ceux qui lui sont chers'",isbn:"9791026855361",extraUrl:"https://covers.openlibrary.org/b/isbn/9791026855361-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2018",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Les dragons ont laissé exploser leur pouvoir pour protéger Yona mais ce n'est pas sans conséquence. Après la mort de Neguro, et la blessure de Yotaka, les “cinq étoiles” sont en mauvaise posture et la Princesse Kôren est sans protection face au piège du prêtre Gobi. Mais cette princesse et sa jeune sœur ne se laisseront pas faire et elles feront tout pour sauver leur pays et tenter de négocier la paix.",isbn:"9782811645687",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811645687-M.jpg"},
  {t:"Animaux LEGO",a:"Padulano Jody",y:"2026",ed:"Nuinui jeunesse",cote:"737.7 PAD",pub:"Jeunesse",sup:"Imprimé",d:"50 adorables animaux à construire avec des briques LEGO® ! Laisse-toi guider par les conseils de l'auteur et donne libre cours à ton imagination. Dans cet ouvrage ludique et créatif, découvre comment assembler une tigre féroce, un ours tout mignon, un cygne élégant et bien d'autres animaux encore, tous réalisés avec des briques LEGO(r) ! Pour chaque modèle, tu trouveras : - Une liste détaillée des pièces nécessaires - Des instructions claires et illustrées - Des astuces pour trouver les bonnes briques LEGO(r) - Un QR code pour accéder aux tutoriels vidéo",isbn:"9782889574452",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782889574452-475x500-1.jpg"},
  {t:"Neige d'acier",a:"Repos Sylvain",y:"2023",ed:"Dargaud",cote:"BD REP",pub:"Adulte",sup:"Imprimé",d:"Affaiblis et usés par leurs précédents combats, Hiro et ses Yojimbots sont en mauvaise posture. Isolés et acculés par Topu et surtout par le redoutable Kozuki, transformé en cyborg léthal, Hiro et sa troupe cherchent un moyen de quitter l'île. Pris au piège dans une zone portuaire, attaqués par Kozuki et son armada, Hiro et les Yojimbots livrent une défense désespérée. Mais le jeune garçon est gravement blessé et laissé pour mort alors que la zone s'apprête à exploser...",isbn:"9782205206234",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205206234-M.jpg"},
  {t:"Alliances",a:"Buchet Philippe",y:"2026",ed:"Delcourt",cote:"BD BUC",pub:"Adulte",sup:"Imprimé",d:"Des armes sophistiquées ont été repérées sur une planète qui vit encore à l'époque médiévale. Rib Wund, qui devait récupérer l'arsenal et libérer Juaiz détenu sur place, est capturé à son tour et conduit devant le roi qui ne semble rien ignorer de Sillage. Mais qui se cache réellement derrière ce mystérieux souverain ? Nävis est envoyée sur place pour tenter de parachever cette mission.",isbn:"9782413088516",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413088516-M.jpg"},
  {t:"The Strange House",a:"Uketsu",y:"2026",ed:"Kana",cote:"Bd STR",pub:"Adulte",sup:"Imprimé",d:"\"Dès l'instant où j'ai vu les plans, j'ai tout de suite pensé que c'était une étrange maison\". Un pigiste spécialisé dans le paranormal et l'horreur reçoit un jour la visite d'un homme qui envisage d'acheter une maison. Cependant, les plans de cette dernière sont plus qu'étranges, laissant supposer qu'il y a potentiellement eu des actes de maltraitance d'enfant à l'intérieur... Quel est donc le secret caché derrière ces curieux agencements de pièces ? Accompagné d'un architecte de renom, il va mener son enquête au sujet de cette drôle de bâtisse...",isbn:"9782505143567",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505143567-M.jpg"},
  {t:"L'amour est dans le thé - Tome 12",a:"Yamanaka Umebachi",y:"2026",ed:"Glénat Manga",cote:"BD AMO",pub:"Adulte",sup:"Imprimé",d:"Chako et Isshin se sont enfin unis ! Leur relation commence à se concrétiser. Pour soutenir l’activité de la plantation Hananoki, Chako a décidé de faire ses débuts dans la production de thé roulé lors d’un événement organisé par monsieur Otori, un entrepreneur sagace de Kyoto. Mais le recrutement de Chako par monsieur Otori entraîne des conséquences inattendues… Une douce vie de jeunes mariés semble à portée de main… mais cette perspective est emportée par un scandale impliquant un jeune homme raffiné de Kyoto !",isbn:"9782344071441",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344071441-M.jpg"},
  {t:"L'art du profit",a:"Duarte Carlos Rafael",y:"2026",ed:"Le Lombard",cote:"BD DUA",pub:"Adulte",sup:"Imprimé",d:"I.R.S. Internal Revenue Service, l'organe de perception des impôts aux Etars-Unis. Agent spécial de l'I.R.S., Larry 6 Max est détaché aux affaires les plus sensibles. OPA, pétrole, corruption. Il dispose de tous les moyens. Il est en première ligne. En guerre contre l'argent noir et les fraudes les plus criminelles !",isbn:"9782808217798",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808217798-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2026",ed:"Nobi Nobi",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n'accueillir que des cancres, est tombé amoureux de Kaoruko Waguri, qui fréquente un établissement pour fi lles de bonne famille, Kikyô. Alors qu'ils profi tent de leur première sortie en amoureux depuis la fi n des grandes vacances, ils sont aperçus par quatre fi lles de Kikyô. Inquiètes pour leur camarade, les lycéennes se montrent fortement opposées à cette relation. Mais grâce à la présence de Madoka Yuzuhara, une jeune fi lle qui ne porte aucun préjugé aux élèves de Chidori, elles décident tout de même de rencontrer Rintarô... Le fossé profondément ancré entre les deux écoles serait-il sur le point d'être comblé ? Roméo et Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions !",isbn:"9782384967070",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384967070-M.jpg"},
  {t:"Dandadan",a:"Tatsu Yukinobu",y:"2026",ed:"Crunchyroll",cote:"BD DAN",pub:"Adulte",sup:"Imprimé",d:"Cap sur Izumo ! Momo et les autres embarquent dans l’espoir de lever la male diction de la malle ensorcelée... mais a peine l’avion a-t-il de colle que le clan Kito s'évade pour assouvir sa vengeance, passe a l’attaque ! Alors que Zuma, prive de la vue, et Seiko, affaiblie, peinent a tenir bon, des requins gelés viennent percuter l’appareil ! A l’origine du chaos : un homme-typhon ! Face à cette menace insensée, Momo et les siens n’ont d’autre choix que de s’allier aux Kito !",isbn:"9782820354594",extraUrl:"https://covers.openlibrary.org/b/isbn/9782820354594-M.jpg"},
  {t:"La bataille du no man's land de Shinjuku : avance",a:"Akutami Gege",y:"2025",ed:"Editions Ki-oon",cote:"BD JUJ",pub:"Adulte",sup:"Imprimé",d:"Engloutir les ténèbres pour mieux les combattre ! Pour avoir une chance de vaincre Sukuna, les exorcistes savent qu'ils doivent également se débarrasser au plus vite de Kenjaku. Dans ce but, ils envoient leur meilleur élément au combat, mais aussi le plus ringard : Fumihiko Takaba ! Une stratégie qui pourrait tout de même s'avérer payante, puisque ce dernier influence l'imaginaire de son adversaire... Pendant ce temps, Atsuya et Hiromi joignent leurs forces face au roi des fléaux. En effet, seule l'épée du bourreau, capable de tuer tout ce qu'elle tranche sans exception, est en mesure de libérer Megumi ! Les exorcistes auraient-ils enfin trouvé un moyen de prendre l'avantage ?",isbn:"9791032719855",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032719855-M.jpg"},
  {t:"Jujutsu Kaisen T30",a:"Akutami Gege",y:"2026",ed:"Editions Ki-oon",cote:"BD JUJ",pub:"Adulte",sup:"Imprimé",d:"Ne manquez pas l'épique conclusion de l'affrontement millénaire contre Ryomen Sukuna dans cet ultime volume de Jujutsu Kaisen ! Ryomen Sukuna a étendu son territoire malgré toutes les tentatives de l'en empêcher ! Néanmoins, grâce à l'aide de Choso et d'Aoi, Yuji a réussi à gagner suffisamment de temps pour permettre à Yuta de revenir sous une forme inattendue et d'affaiblir encore davantage son adversaire... mais à quel prix ? Hana se joint alors au combat et Yuji tente une dernière fois de libérer Megumi de l'emprise du roi des fléaux...",isbn:"9791032723777",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032723777-M.jpg"},
  {t:"La Boutique aux horreurs",a:"Richelle Philippe",y:"2026",ed:"Glénat",cote:"BD RIC",pub:"Adulte",sup:"Imprimé",d:"Soumission chimique : retour sur les expériences top secrètes du gouvernement américain durant la guerre froide Après le succès des Mystères de la République, Philippe Richelle revient avec une nouvelle série-concept consacrée à l'émergence des services secrets au XXe siècle. Chaque tome explore une opération menée dans l'ombre, le plus souvent au coeur conflits majeurs : Seconde Guerre mondiale, Guerre froide, après-Guerre froide ou encore conflit israélo-arabe. Avec un réalisme saisissant, cette série de polars historiques, tous autoconclusifs, dévoile des récits passionnants et met en lumière des personnages hors normes, prêts à tout, souvent au mépris des règles, pour parvenir à leurs fins. Chaque album est illustré par un dessinateur différent et peut être lu indépendamment. 1953. Etats-Unis. Bill Barney a toujours été un jeune homme soucieux de servir son pays. De retour de la guerre de Corée, son idéal patriotique le pousse à devenir agent de la CIA. Mais il est loin de se douter que sa mission va le plonger dans un univers cauchemardesque... Car MK-Ultra, l'obscur programme auquel il va participer, utilise une nouvelle méthode : la soumission chimique ! A travers ces recherches top secrètes, le gouvernement américain n'a qu'un objectif : découvrir comment modifier l'esprit humain et en prendre le contrôle. En assistant le docteur Gottlieb, cheville ouvrière du Programme, Barney va bientôt comprendre que tous les moyens sont bons pour parvenir à ses fins : thérapie du sommeil, médicaments, LSD, électrochocs... Plus Gottlieb multiplie les expériences, plus il détruit la vie de ses \"cobayes\", et plus Barney sombre dans une spirale infernale, impuissant face à l'horreur... Avec ce thriller psychologique inspiré de faits réels, Philippe Richelle et Steven Lejeune nous plongent en pleine guerre froide pour un récit choc où la tension croissante est poussée à son paroxysme. Le deixième tome de la série Guerres secrètes met en lumière une page sombre de l'Histoire des Etats-Unis en revenant sur les expérimentations humaines perpétrées en secret par le gouvernement américain entre 1950 et 1960 notamment en Corée et au Viêtnam.",isbn:"9782344063699",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344063699-M.jpg"},
  {t:"Gunnar le vampire",a:"Dumontheuil Nicolas",y:"2026",ed:"Dupuis",cote:"BD DUM",pub:"Adulte",sup:"Imprimé",d:"Gunnar Gunnarson est un vampire suédois de près de 800 ans. Ou plutôt, comme il aime à le dire : il a 36 ans depuis plus de 7 siècles... Lassé de le violence et de la prédation, Gunnar essaie de bien se conduire, et vit paisiblement en Bourgogne avec sa compagne Marthe, une mortelle. Il est couturier, reste discret, mord rarement et uniquement des consentants. La population locale reste à distance, partagée entre méfiance, curiosité et fierté. Tout le monde le laisse en paix. Jusqu a ce que des animaux soient retrouvés vidés de leur sang dans les fermes alentour...",isbn:"9782808507585",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808507585-M.jpg"},
  {t:"Les Petites Voleuses",a:"Renaud Claire",y:"2024",ed:"Éditions Sarbacane",cote:"J REN",pub:"Jeunesse",sup:"Imprimé",d:"Pauline, alias Popo, n'éblouit personne, à l'inverse de sa cousine Héloïse qui vit dans une banlieue très chic de Paris, fréquente un lycée bourgeois et organise des rallyes. Pauline l'admire et l'envie, et ferait tout, tout, tout pour rentrer dans ses grâces. Or, le seul truc qu'elles ont en commun, Pauline et Héloïse... c'est la kleptomanie. Incapables de s'arrêter, elles volent dans les grands magasins. Jusqu'au jour où Pauline se fait prendre (et pas Héloïse, bien sûr ! ). Plutôt que de payer l'amende, le vieux commissaire en retraite qui s'occupe de son cas lui propose alors un marché pour réparer ses torts... piéger sa cousine ! Paniquée, mais secondée par son meilleur ami, l'irrésistible Boubou, qui en pince pour elle, Pauline saura-t-elle se dépêtrer du guêpier dans lequel elle s'est fourrée ? Une comédie familiale tendre et loufoque, débordante d'amour et de malice.",isbn:"9791040805496",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040805496-475x500-1.jpg"},
  {t:"Le coeur d'Alluria",a:"Wilkinson L. M.",y:"2025",ed:"Saxo",cote:"J WIL",pub:"Jeunesse",sup:"Imprimé",d:"Il y a bien des manières d'être brave. Fluette a grandi avec les histoires de Bravepatte, le plus grand guerrier du monde des souris. Depuis, elle rêve d'être comme lui : elle aussi veut vivre des aventures et affronter des ennemis. Mais impossible, dans son village où il ne se passe jamais rien ! Jusqu'au jour où surgissent des ombres qui se nourrissent de couleurs et de vie. Pour Fluette, c'est alors l'occasion de prouver qu'être courageux n'est pas une affaire de taille... Bonus exclusif : 2 marque-pages à découper !",isbn:"9782385701529",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701529-475x500-1.jpg"},
  {t:"Henriette ou le grand voyage",a:"Frossard Claire",y:"2024",ed:"Flammarion",cote:"J FRO",pub:"Jeunesse",sup:"Imprimé",d:"Moi, Henriette, cochon d'Inde de mon état, je fais maintenant partie de la tribu des Grands Campagnols Roux. Nous rêvons d'un nouveau territoire : un endroit où creuser de beaux terriers, avec une rivière et des prairies fleuries. En route pour un grand voyage semé d'embûches et de surprises !",isbn:"9782080440297",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080440297-475x500-1.jpg"},
  {t:"La stratégie du repos",a:"Gauthier Anais",y:"2026",ed:"Eyrolles",cote:"158.1 GAU",pub:"Adulte",sup:"Imprimé",d:"Nous n'avons jamais eu autant de congés dans l'histoire de l'humanité et pourtant nous sommes exténués. L'omniprésence des écrans, l'ab?sence de pauses, l'injonction au progrès, la surstimulation... nous poussent à combler la moindre case vide de nos journées. Ce rythme stressant, imposé par notre société, a ainsi fait disparaître un art ancestral aussi essentiel à notre survie que boire ou manger : le repos. Or, sans ce dernier, nous passons à côté de ce qui a le plus de valeur : notre temps, notre énergie, notre présence. Savoir se reposer est indispensable aussi bien dans la vie personnelle que professionnelle, car de cette capacité dépendent notre santé, notre bien-être, notre créativité et même notre performance. Si vous avez l'impression de ne jamais en faire assez, d'être pris dans un rythme effréné ou d'avoir profondément besoin de vous régénérer, ce livre inspirant et plein de ressources concrètes vous guidera pour mettre le repos au coeur de votre vie. Les réflexions et les exercices accessibles vous feront cheminer vers un mieux-être durable. Après tout, gérer son énergie, n'est-ce pas l'essence même du Vivant ?",isbn:"9782416022579",extraUrl:"https://covers.openlibrary.org/b/isbn/9782416022579-M.jpg"},
  {t:"L'Homme qui trahit Hitler",a:"Richelle Philippe",y:"2026",ed:"Glénat",cote:"BD RIC",pub:"Adulte",sup:"Imprimé",d:"Un héros ordinaire Après le succès des Mystères de la République, Philippe Richelle revient avec une nouvelle série-concept consacrée à l'émergence des services secrets au XXe siècle. Chaque tome explore une opération menée dans l'ombre, le plus souvent au coeur de conflits majeurs : Seconde Guerre mondiale, guerre froide, après-guerre froide ou encore conflit israélo-arabe. Avec un réalisme saisissant, cette série de polars historiques, tous autoconclusifs, dévoile des récits passionnants et met en lumière des personnages hors normes, prêts à tout, souvent au mépris des règles, pour parvenir à leurs fins. Chaque album est illustré par un dessinateur différent et peut être lu indépendamment. 1931. Dans une Allemagne ruinée par la guerre, Hans-Thilo Schmidt, ancien chimiste accepte un poste modeste au ministère de la Défense sans savoir qu'il va bientôt travailler avec une machine révolutionnaire. \" Enigma \" sert à chiffrer des messages secrets. Alors qu'Enigma devient l'outil stratégique numéro 1 pour le régime nazi, ce discret employé entame une double vie et n'hésite pas à transmettre des informations capitales à l'armée française sous le nom de code Asche ! Entre manipulations, trahisons et jeux d'influence, ce père de famille en apparence fidèle au régime, va devenir la pièce maîtresse d'un affrontement souterrain où le moindre faux pas peut se révéler fatal... Philippe Richelle et Jorge Miguel nous entrainent dans une course contre la montre pleine de rebondissements. Tiré de faits réels, ce premier tomenous offre une plongée haletante dans les coulisses de l'espionnage durant la Seconde guerre mondiale. Dans un récit mêlant trahison et tension historique, ce polar captivant retrace le destin de Hans-Thilo Schmidt, considéré aujourd'hui comme l'un des plus grands espions du XXe siècle.",isbn:"9782344063675",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344063675-M.jpg"},
  {t:"Ann Bonny",a:"Bonnet Franck",y:"2026",ed:"Glénat (Grenoble, Isère, France; 1969-...)",cote:"BD BON",pub:"Adulte",sup:"Imprimé",d:"L’histoire vraie de la plus grande femme pirate de l’Histoire !  Après leur fuite de Nassau, rien ne peut arrêter les amants terribles : Ann Bonny et John Rackham écument les Caraïbes à bord du William. Leurs prises sont spectaculaires. Après une halte à Cuba où Ann donne naissance à un enfant de la piraterie qui ne connaitra jamais sa mère, elle rejoint Rackham. Mais cette fois les corsaires de Woodes Rogers sont à leurs trousses et le mari d’Ann a mis sa tête à prix pour quiconque la ramènerait vivante à Nassau. Menacée de toutes parts, Ann s’attend à tout sauf à croiser le chemin d’une autre femme, une pirate comme elle. Elle s’appelle Mary alias Mark Read, elle aussi grimée en homme. Défiant le code des pirates, les deux femmes entament une relation passionnelle sous l’œil de Rackham. Il concède à Ann cette aventure mais à une condition : aucun homme sur le navire ne devra savoir ce qui se trame. Mais les secrets ne durent jamais longtemps en mer… Entre jalousies et rivalités le trio continue de s’adonner aux pillages bien que l’étau se resserre. Le gouverneur Woodes Rogers qui s’est donné pour mission d’éradiquer la piraterie sous toutes ses formes ne compte pas s’arrêter là… Jusqu’à quand Ann poursuivra-t-elle sa course folle sous le feu des canons ? Combien de temps lui reste-t-il avant que son monde ne s’effondre ? Habitué des fresques maritimes, Franck Bonnet nous entraîne dans une aventure épique à travers cet ambitieux diptyque dans lequel il revient sur l’histoire vraie de la plus grande femme pirate. Entre passions, dangers et affrontements sanglants, ce second tome qui clôt le récit, montre le vrai mode de vie des pirates, loin de l'imagerie vulgarisée par le cinéma, sublimé par le dessin et la connaissance de l'architecture navale de Franck Bonnet, ici au sommet de son art.",isbn:"9782344064030",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344064030-M.jpg"},
  {t:"Mercury Baby",a:"Birban Julien",y:"2026",ed:"Editions Héloïse d'Ormesson",cote:"R BIR",pub:"Adulte",sup:"Imprimé",d:"Comment rester romantique quand la misère réduit l'horizon ? A l'aube de la fin du monde, lorsque le déséquilibre est partout, pourquoi faire des enfants ? New York et Tokyo. Dans les franges de ces villes-monstres, les habitants ne sont vraiment eux-mêmes que tard la nuit. Quand ils se lâchent. Mais le temps s'accélère. Les journées rétrécissent dangereusement et ne durent plus que vingt-deux heures et quelques. Et le phénomène s'aggrave : voie express vers le grabuge. Dans ce contexte d'urgence et de tension émotionnelle, trois personnages révoltés sont prêts à tout cramer. Mara, Mercury Baby, rapport à une chanson qui porte son nom et qu'elle préfèrerait oublier, est la plus punk des sociologues, spécialiste de la sous-culture. Belle à se tirer une balle dans la mâchoire. Nils a vu sa vie éclater en vol à l'adolescence, et depuis il veut sa revanche, et prouver au monde que les fauchés, eux aussi, ont droit à la consolation. Romi, nihiliste magnifique, souhaite entraîner le monde dans le chaos. Mara publie un virulent pamphlet qui affirme que ceux qui font encore des enfants en 2025 sont des fous, et que c'est l'ultime tabou, insondable, occidental. Nils est sélectionné pour une mission de sauvegarde, mission folle, elle aussi, qui nécessite de partir à Tokyo et d'y avoir un enfant. Mercury Baby est un roman choral couleur fièvre, condensé d'histoires d'amour qui implosent à la veille de la fin du monde. Des histoires en perdition, en roue libre vers une apocalypse qui sonnerait comme un soulagement.",isbn:"9782350879581",extraUrl:"https://covers.openlibrary.org/b/isbn/9782350879581-M.jpg"},
  {t:"L'Exilée",a:"De Castell Sebastien",y:"2026",ed:"Gallimard",cote:"J DEC",pub:"Adolescent",sup:"Imprimé",d:"Le dernier tome des aventures de Furia Perfax, l'héroïne que rien n'arrête. Un univers de fantasy sombre et fascinant, entre action spectaculaire et humour incisif ! En libérant la belle Arissa des geôles berabesa, Furia fait la rencontre de Chedran, l'un des derniers Mahdek. Déchirée entre son amour naissont et l'appel de ses origines, elle est confrontée à un choix qui pourrait sceller son avenir et celui de son peuple.",isbn:"9782075215251",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075215251-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2019",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Lors de la bataille contre l'empire de Kai, Yona et les dragons portent secours à la tribu du feu. Les membres de la tribu du feu, fervents adorateurs du roi Hiryû, découvrent ainsi l'existence de nos héros et la nouvelle parvient aux oreilles de Soo-won et Kye-sook. Grâce à l'aide de Tae-jun, Yona et ses amis trouvent refuge au château de Saika mais ils sont rapidement rejoints par Kye-sook qui vient s'entretenir de la sécurisation des frontières nord du pays avec la tribu du feu.",isbn:"9782811649258",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811649258-M.jpg"},
  {t:"A.B.C. contre Poirot",a:"Uzuki",y:"2026",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Monsieur Hercule Poirot, Vous vous imaginez, n'est-ce pas, capable de résoudre des mystères trop complexes pour notre pauvre police britannique ? Voyons, Monsieur Poirot l'Intelligent, jusqu'où vous pouvez aller. Vous trouverez peut-être cette affaire trop difficile à résoudre. Rendez-vous à Andover, le 21 du mois. Bien à vous,",isbn:"9782889326815",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889326815-M.jpg"},
  {t:"Lady Nazca",a:"Delestret Nicolas",y:"2026",ed:"Bamboo Edition",cote:"BD DEL",pub:"Adulte",sup:"Imprimé",d:"Dans le désert de Nazca, elle va trouver bien plus que le secret des lignes millénaires : elle va se trouver elle-même. Pérou, 1935. Maria, jeune expatriée allemande, mène une vie paisible à Lima avec Amy, sa compagne. Elle ne se doute pas qu'en suivant l'archéologue américain Paul Kosok, sa vie va basculer. Dans le désert, elle découvre d'immenses figures tracées dans le sol : les lignes de Nazca. Convaincue qu'il s'agit d'un trésor unique, la jeune femme se lance dans une incroyable aventure scientifique, humaine et spirituelle. Entre découvertes, obstacles et choix personnels, elle devra faire face à de nombreux défis... et apprendre à suivre sa propre voie \"Librement inspiré du film de Damien Dorsaz\"",isbn:"9782818999219",extraUrl:"https://covers.openlibrary.org/b/isbn/9782818999219-M.jpg"},
  {t:"La voie du tablier",a:"Oono Kousuke",y:"2026",ed:"Kana",cote:"BD VOI",pub:"Jeunesse",sup:"Imprimé",d:"Ne sous-estimez jamais un homme au foyer ! Tatsu doit accompagner son beau-père chez le vétérinaire pour faire vacciner son chien. Mais ce canidé a un drôle de défaut : il se met à trembler de tout son corps rien qu'en entendant les mots \"vaccin\", \"piqûres\" et \"piquer\"... Avec tous ces \"adversaires\" qui se succèdent, même le plus coriace des hommes au foyer en bave ! Voici le seizième volume de ce manga comique, qui raconte la vie d'un ancien yakuza à la maison !",isbn:"9782505144038",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505144038-M.jpg"},
  {t:"Secret bodyguard",a:"Nigatsu Masamitsu",y:"2025",ed:"Pika édition",cote:"BD SEC",pub:"Adulte",sup:"Imprimé",d:"La nuit qui suit la cérémonie de fin de semestre, deux puissantes organisations d assassins, les Chiens de chasse et le Service funéraire, unissent leurs forces pour attaquer Akabane. La terminale 4, qui attendait leur arrivée de pied ferme, enchaîne les victoires contre les deux groupes& Jusqu à ce que Moral, des Chiens de chasse, kidnappe Kuran Shutô. Ibuki et ses camarades partent à sa poursuite, aidés de Masachika Jingû, Nanafuri et Hyôka. Mais un élément les interpelle : Shutô et Moral ont l air de déjà se connaître& Quelle sera l issue de cet affrontement riche en rebondissements ?",isbn:"9782811698805",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811698805-M.jpg"},
  {t:"The Strange House",a:"Uketsu",y:"2025",ed:"Kana",cote:"BD STR",pub:"Adulte",sup:"Imprimé",d:"Une architecture parfaite... pour dissimuler l'impensable. \"Quel genre de personnes étaient les habitants de cette maison ? \" Le plan d'une maison de Tokyo a laissé supposer qu'il s'y passait des choses anormales : un enfant y aurait été séquestré pour commettre des meurtres. C'est alors qu'une jeune femme, Yuzuki Miyae, déclare être persuadée que son mari a été assassiné par les habitants de cette étrange maison et révèle les plans d'une deuxième maison. L'architecte Kurihara ne tarde pas à mettre le doigt sur un point curieux concernant cette autre maison !!",isbn:"9782505129035",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505129035-M.jpg"},
  {t:"Secret bodyguard",a:"Nigatsu Masamitsu",y:"2026",ed:"Pika édition",cote:"BD SEC",pub:"Adulte",sup:"Imprimé",d:"La terminale 4 est parvenue à vaincre deux organisations d assassins. Cependant, l affrontement s est terminé sur de nombreuses révélations concernant un certain Sôji Kodô qui a pour but de hisser son propre groupe, le clan Kodô, au sommet du monde criminel. De plus, Ibuki apprend que l auteur des messages de haine envers Akabane n est pas Kuran ! Mais alors, qui peut bien être derrière ces messages étranges ?",isbn:"9782811698812",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811698812-M.jpg"},
  {t:"La collectionneuse",a:"Pétry-Sirvin Emmanuèle",y:"2024",ed:"L'Etagère du bas",cote:"A PET",pub:"Jeunesse",sup:"Imprimé",d:"Depuis toute petite, Tanaquil collectionne tout. Des doudous et des peluches, des mousses et des lichens, des autocollants et du parfum, des théières et des guitares. Tant et si bien que, tout le long de sa vie, Tanaquil n'a jamais eu de place pour autre chose... Saura-t-elle accueillir ce qui pourrait arriver ?",isbn:"9782490253623",extraUrl:"https://products-images.di-static.com/image/base/9782490253623-475x500-1.jpg"},
  {t:"L'art de disparaître",a:"Stepanova Maria",y:"2026",ed:"Stock",cote:"R STE",pub:"Adulte",sup:"Imprimé",d:"M. est écrivaine. Quelques années plus tôt, son pays a déclaré la guerre à l'un de ses voisins. Désormais en exil, elle s'applique à recréer un nouveau chez-soi, tout en se sentant peu à peu coupée de sa langue : celle qu'elle a parlée toute sa vie, dans laquelle elle a écrit ses livres, celle dont elle tente, aujourd'hui, de se détacher. Alors qu'elle se trouve dans un train en partance pour un festival littéraire à l'étranger, une grève perturbe le programme. Le voyage s'achève dans un village perdu où M. ne connaît personne et son téléphone portable est déchargé. Et si, comme par magie, elle disparaissait ? L'Art de disparaître est un grand roman sur l'exil, la perte de repères et le réenchantement du quotidien par l'écriture.",isbn:"9782234097674",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234097674-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2019",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Victimes des manigances du prêtre Gobi, Yona et ses amis sont emmenés de force jusqu'à l'empire de Kai. Ayant repéré la puissance de Jae-ha,  Cuerbo prend Yona en otage et contraint Jae-ha à se soumettre à ses ordres. De son côté, afin de retrouver Yona et les autres captifs, Hak accepte la proposition de Kye-sook et décide de s'allier avec l'armée du pays de Kôka...",isbn:"9782811652241",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811652241-M.jpg"},
  {t:"Comment le monde est parti en saucisse",a:"Schmauch Anne",y:"2026",ed:"Éditions Sarbacane",cote:"J SCH",pub:"Jeunesse",sup:"Imprimé",d:"Moi, c'est Célestin, 11 ans, spécialiste mondial de la lutte anti-microbes. Mes trois pires ennemis ? Les bactéries. Le nez morveux de mon petit frère. La bave de son chien, Saucisse. Je rêvais de vacances paisibles. Sans germes, sans drames. Raté. Et puis, une extraterrestre s'est écrasée sur notre toit, a semé des graines de trou noir partout... et il paraît que NOUS aurions, peut-être-un-tout-petit-peu, déclenché la fin du monde. Ah, et avant de tourner la page : merci de reculer d'un mètre. Mesures sanitaires.",isbn:"9791040808008",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791040808008-475x500-1.jpg"},
  {t:"Combat toujours perdant",a:"Houellebecq Michel",y:"2026",ed:"Flammarion",cote:"808.1 HOU",pub:"Adulte",sup:"Imprimé",d:"\"Non, cette vie n'est pas suffisante, elle ne peut contenir la millième partie de nos rêves\".",isbn:"9782080145819",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080145819-M.jpg"},
  {t:"Les Mystificateurs",a:"Cohen Patrick",y:"2026",ed:"Flammarion",cote:"070.4 COH",pub:"Adulte",sup:"Imprimé",d:"Comment un mystificateur, interdit d'exercer la médecine depuis, a-t-il pu tenir le haut du pavé dans la France du Covid ? Les gourous scientifiques ne datent pas d'hier. Entre désinformation, mauvaise science et pseudo-science, ce livre est une plongée dans la face noire de l'histoire, qui a vu des scientifiques réputés se persuader d'avoir raison contre le reste de la communauté scientifique et bénéficier du soutien de médias et de politiques. Patrick Cohen nous raconte, à sa manière précise et informée, les grandes affaires qui ont contribué à populariser l'anti-science. Parmi celles-ci, le climatoscepticisme porté par l'ancien ministre Claude Allègre dans les années 2000, la controverse de la ciclosporine présentée en 1985 comme un médicament miracle face au sida. Celle de la mémoire de l'eau en 1988, censée révolutionner la biologie moléculaire et justifier l'homéopathie. Ou encore le mensonge autour du vaccin ROR (rougeole, oreillons, rubéole) suspecté de déclencher l'autisme chez des jeunes enfants, aux conséquences criminelles en Europe et aux Etats-Unis. Un livre qui invite à réconcilier science et confiance.",isbn:"9782080456427",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080456427-M.jpg"},
  {t:"Le pavillon des fièvres",a:"Adenis Noémie",y:"2026",ed:"R. Laffont",cote:"R ADE",pub:"Adulte",sup:"Imprimé",d:"Notre sort, à nous les femmes, compte parfois si peu à vos yeux. En ce mois d'août 1690, Paris étouffe. Mais dans la maison du docteur Timbert règne une atmosphère glaciale : Madeleine ne supporte plus d'être enfermée dans cette demeure où la vie tourne autour de la maladie de sa mère. Persuadée qu'on la remarquera seulement si sa santé décline, elle simule un trouble et se trouve envoyée à Pincourt, un établissement qui accueille les bourgeois éreintés aussi bien que les aliénés. Mais dans cette pension dédiée au repos sévit une étrange épidémie ; on découvre des merles morts auprès des résidentes tourmentées. Madeleine décide d'enquêter sur ces événements, qui font peu à peu ressurgir les fantômes du passé - à commencer par Antoine Lestang, ami d'enfance devenu chirurgien. Et si aucune patiente n'était à l'abri du danger ?",isbn:"9782221284995",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221284995-M.jpg"},
  {t:"Hé ho, croco !",a:"Alzial Sylvain",y:"2026",ed:"Marcel et Joachim/Gallimard Jeunesse",cote:"A ALZ",pub:"Jeunesse",sup:"Imprimé",d:"Un petit lapin gourmand, attiré par de beaux liserons charnus, s'approche de la rivière. Trop près. Un gros crocodile en profite pour l'avaler tout rond. Bien embêté, le petit lapin se demande comment il va bien pouvoir sortir de ce ventre dégoûtant. Quand il entend son geôlier se réjouir de cette belle prise d'un \"Hé hé hé\" sonore et cruel, il lui vient une idée : le lapin invite le crocodile à articuler des sons vraiment effrayants (et pas un petit Hé hé hé ridicule). Piqué dans son orgueil, le crocodile va se laisser guider par le petit lapin, comme un comédien le serait par son metteur en scène... Jusqu'au HA HA HA final, qui nécessite que le crocodile ouvre grand sa gueule. Le lapin malin en profite pour s'échapper, bien content !",isbn:"9782075233477",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075233477-475x500-1.jpg"},
  {t:"Le coeur qui tourne",a:"Ryan Donal",y:"2015",ed:"Albin Michel",cote:"R RYA",pub:"Adulte",sup:"Imprimé",d:"Dans un petit village irlandais frappé par la crise économique, des tensions émergent et se multiplient dangereusement Un meurtre est commis, un enfant kidnappé, et c'est une communauté tout entière qui se retrouve en état de choc. Bobby Mahon était le contremaître d'une entreprise contrainte de fermer ses portes, et dont le patron s'est enfui avec la caisse. Chacun des autres personnages, une jeune fille inquiète des difficultés financières de ses parents, une mère célibataire, un ouvrier, une prostituée, un père tyrannique, un maçon d'origine russe... se trouvera lié à lui d'une façon ou d'autre, et tous chercheront à raconter leur propre vérité, dressant un portrait émouvant de l'Irlande rurale d'aujourd'hui et de la condition humaine, de la fragilité des relations et des sentiments. A la manière d'un roman choral, dont la construction ambitieuse n'est pas sans rappeler le Faulkner de Tandis que j'agonise, Donal Ryan donne ainsi la parole à vingt et un personnages dont il fait se succéder les voix, créant un choeur puissant à travers lequel les perceptions divergentes des protagonistes face à la réalité ne déroulent au final qu'une seule et même histoire. Un texte particulièrement inventif et émouvant dont l'extrême noirceur recèle un humour véritablement ravageur. Un premier roman comme on en rencontre rarement, original et plein d'énergie, et un jeune écrivain aussi singulier que talentueux.",isbn:"9782226314789",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226314789-M.jpg"},
  {t:"Les derniers retrouveurs",a:"Dixen Victor",y:"2024",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Les derniers retrouveurs Chaque jour, des objets et des gens disparaissent. Vous les pensez perdus ? Ils ont été volés par des créatures avides, venues d'un autre monde pour arracher des morceaux du nôtre : les croquemitaines. La vie de Lucy bascule quand sa mère disparaît mystérieusement. La jeune orpheline est contrainte de quitter sa campagne et d'aller vivre à New York chez sa tante Doris, qui l'oblige à voler dans les trains pour payer son \"loyer\". Jusqu'au jour où Lucy fait la connaissance de Rita Perdido, une femme entourée de secrets, qui lui propose de rejoindre son agence de retrouvage. Lucy découvre qu'elle fait partie d'une caste en voie de disparition : les retrouveurs. Depuis la nuit des temps, ces humains ont le pouvoir de pénétrer dans les oubliettes pour en rapporter les objets, les personnes et les souvenirs perdus. Persuadée que sa mère a été enlevée par un croquemitaine, Lucy se lance à sa recherche. Mais ce n'est pas seulement le sort de sa famille qui est en jeu : à mesure que s'éteigne les derniers retrouveurs, les croquemitaines gagnent en puissance et préparent leur effroyable revanche contre la surface...",isbn:"9791036374692",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036374692-475x500-1.jpg"},
  {t:"Le musée effacé",a:"Dixen Victor",y:"2025",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Depuis des siècles, les marais de Floride dévorent des personnes et engloutissent des trésors. Dans leurs sombres profondeurs, loin du soleil tropical de la surface, les croquemitaines attendent leur heure. Luciole \"Lucy\" Lachance et Jasper Tan commencent leur apprentissage de retrouveurs dans le Sunshine State, sous la houlette de Rita Perdido. Le temps presse pour retrouver les régalias maudits et éviter l'ascension d'un Haut-Roi des croquemitaines. Les membres de l'agence Perdido comptent profiter de la célèbre Foire d'Art Contemporain de Miami pour tendre un piège à la Muse Malade, détentrice du deuxième régalia. Cette effaceuse hante les artistes de génie depuis des siècles, volant leurs idées et les poussant à la folie. Mais depuis les palaces luxueux de South Beach jusqu'aux mangroves ancestrales du fin fond de la Floride, Luciole et Jasper vont découvrir que l'attaque des croquemitaines contre la surface est plus imminente que jamais...",isbn:"9791036365225",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036365225-475x500-1.jpg"},
  {t:"Une journée avec Lucy",a:"Dami Elisabetta",y:"2026",ed:"Albin Michel",cote:"J DAM",pub:"Jeunesse",sup:"Imprimé",d:"UNE AVENTURE AU COEUR DE LA PREHISTOIRE EN COMPAGNIE DES PREMIERS AUSTRALOPITHEQUES ! Par cent mille mimolettes, jamais je n'aurais imaginé me retrouver dans la savane africaine trois millions d'années plus tôt, en compagnie de Lucy, l'australopithèque ! Alors que ma nouvelle amie me fait découvrir son monde, son bébé est kidnappé. Nous voici lancés dans une course-poursuite pour le sauver... si on échappe aux prédateurs et au volcan qui s'est réveillé !",isbn:"9782226508263",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226508263-475x500-1.jpg"},
  {t:"Eiao",a:"Ledun Marin",y:"2026",ed:"Au vent des îles",cote:"J LED",pub:"Adolescent",sup:"Imprimé",d:"En Polynésie, dans Les années 1970, La France mène des essais nucléaires qui meurtrissent la région et mettent en danger ses habitants ainsi que sa faune et sa flore. Quand elle arrive à Eiao en 1972, à 19 ans, Simone pense avoir été embauchée par une compagnie de forage minier, mais L'Arvecom semble cacher ses véritables intentions... Au contact d'autres employés et du mystérieux Tahi, elle s'engage dans une Lutte qui La dépasse. En explorant les îles des Marquises et la jeunesse de la mère du futur lieutenant Morel de son roman Henua, Marin Ledun plonge dans un passé tourmenté et tumultueux, et nous entraîne dans une histoire d'amour radioactive.",isbn:"9782367346540",extraUrl:"https://products-images.di-static.com/image/orb-ef67b8aadc689cbb3d743f72577b9d21/9782367346540-475x500-1.jpg"},
  {t:"Bone Parish",a:"Bunn Cullen",y:"2021",ed:"Delcourt",cote:"BD SCH",pub:"Adulte",sup:"Imprimé",d:"Ce dernier tome est sans doute le meilleur de la trilogie tant la famille Winters, autrefois seule détentrice de la \"Cendre\", est malmenée ! Cette nouvelle drogue ravage tout sur son passage et attise les convoitises...",isbn:"9782413016694",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413016694-M.jpg"},
  {t:"Dune : Maison Corrino",a:"Herbert Brian",y:"2025",ed:"Huginn & Muninn",cote:"BD HER",pub:"Adulte",sup:"Imprimé",d:"Après Maison Atréides, et Maison Harkonnen, voici la dernière trilogie pour découvrir les origines de DUNE. Complots, traîtrises et coups d'Etats sont légion dans un empire galactique féodal où s'affrontent des dynasties vassales. Chaque grande maison dispose ses pièces sur cet échiquier géant : les Corrino continuent les préparatifs de leur guerre commerciale en mettant au point un substitut à l'épice, les Harkonnen avides de puissance pressurent les Fremen sur Arrakis, tandis que les Atréides et les Vernius sont en route pour Ix. Mais un grand péril demeure, sous les yeux vigilants des Bene Gesserit, dame Jessica est sur le point d'accoucher... Brian Herbert et Kevin J. Anderson, adaptent le dernier chapitre préquel de leur saga à succès, Avant Dune, avec l'artiste Simone Ragazzoni (Robotech : Rick Hunter) et Andrea Scalmazzi en roman graphique.",isbn:"9782386400438",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386400438-M.jpg"},
  {t:"Dune",a:"Herbert Brian",y:"2025",ed:"Huginn & Muninn",cote:"BD HER",pub:"Adulte",sup:"Imprimé",d:"Après Maison Atréides, et Maison Harkonnen, voici la dernière trilogie pour découvrir les origines de DUNE. Complots, traîtrises et coups d’États sont légion dans un empire galactique féodal où s’affrontent des dynasties vassales. Famille royale, la maison Corrino fut longtemps la plus puissante de l’univers et cherche à retrouver ce pouvoir en déclenchant une guerre de l’épice. Alors que la maison Harkonnen intensifie sa pression sur les Fremen, la maison Atréides soutient la famille Vernius, tandis que les Bene Gesserit continuent à préparer l’avènement de leur potentiel messie. Brian Herbert et Kevin J. Anderson, adaptent le dernier chapitre préquel de leurs saga à succès, Avant Dune, avec l’artiste Simone Ragazzoni (Robotech: Rick Hunter) en roman graphique.",isbn:"9782386400353",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386400353-M.jpg"},
  {t:"Contro natura",a:"Andolfo Mirka",y:"2025",ed:"Glénat",cote:"BD AND",pub:"Adulte",sup:"Imprimé",d:"La vie est un combat L'horrible dictature « darwinienne » qui régnait sur la ville de New Roark est terminée. Leslie et Khal peuvent enfin vivre librement leur relation, même s'ils appartiennent à deux races différentes. Pour gagner leur vie, ils travaillent dans le bar que Leslie a acquis et élèvent comme leur fille la jeune Shea,  une orpheline sauvée de l'Abattoir. Mais l'idylle se brise quand Leslie commence à être affectée par des symptômes qu'elle connaît bien. Elle est en proie à des crises violentes et des rêves angoissants. Ses vieux pouvoirs recommencent à se manifester et surtout son sang et ses cheveux redeviennent bleus ! Ce sont des signes d'une réalité inquiétante : l'Albinos est encore vivant. Cette entité surnaturelle semblable à un dieu cruel et violent, qui pour des générations a hanté toutes les femmes de la famille de Leslie, existe encore. Une faible série d indices semble relier le retour de la Bête à ce qui se passe de l autre côté de l océan, dans un village isolé et perdu entre les montagnes : Griffe Sacrée. Il semblerait que là-bas, a l abri du monde moderne il existe encore une secte très ancienne qui vénère l Albinos. Leslie et Khal partent donc ensemble pour leur dernière aventure, en espérant tirer un trait sur un passé qui revient toujours les hanter.",isbn:"9782344069080",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344069080-M.jpg"},
  {t:"Night Eaters T02 - Ses petits faucheurs",a:"Liu Marjorie",y:"2026",ed:"Delcourt",cote:"BD LIU",pub:"Adulte",sup:"Imprimé",d:"Milly et Billy connaissent maintenant l'histoire insolite de leur famille et appréhendent peu à peu leurs capacités surnaturelles. Mais un esprit amnésique et sans visage guidée par une étrange poupée hante Milly, une seule question : qui est-elle'Après la révélation à Milly et Billy Ting de leur véritable nature, les jumeaux ont commencé à explorer leurs pouvoirs. Ils savent maintenant qu'ils font partie d'un monde surnaturel plus vaste et que quelque chose ne va pas, mais alors pas du tout. Tandis qu'Ipo et Keon sont sollicités par la haute société démoniaque, les jumeaux découvrent qu'on ne traite pas avec le monde des esprits impunément..",isbn:"9782413090939",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413090939-M.jpg"},
  {t:"Elle dévore la nuit",a:"Liu Marjorie M.",y:"2024",ed:"Delcourt",cote:"BD LIU",pub:"Adulte",sup:"Imprimé",d:"Milly et Billy, deux jumeaux sino-américains, reçoivent la visite de leurs parents Ipo et Keon. Alors que leur mère, Ipo, décide d'emmener les jumeaux nettoyer le jardin de la terrifiante maison voisine à la leur, d'étranges événements surviennent...",isbn:"9782413078449",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413078449-M.jpg"},
  {t:"La longue vie",a:"Retz Valentin",y:"2026",ed:"Gallimard",cote:"R RET",pub:"Adulte",sup:"Imprimé",d:"Un biologiste, un prophète et un écrivain se croisent à travers le temps. Ils se posent tous les trois la question de la vie éternelle : est-il possible de ne pas mourir ? Entre le protocole scientifique, la foi religieuse et l'extase de la littérature, quelle est la solution ? A travers un entrelacement qui démultiplie les possibilités féeriques de la fiction, ce roman met en scène le délire contemporain de la science et nous embarque jusqu'au mont Athos, sur les pas des premiers chrétiens.",isbn:"9782073115416",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073115416-M.jpg"},
  {t:"Les livres m'ont menti, parfois",a:"Ortin Morgane",y:"2026",ed:"Nami",cote:"844 ORT",pub:"Adulte",sup:"Imprimé",d:"J'ai longtemps nourri la croyance que les livres savaient mieux que moi ce qu'était l'amour. Je leur faisais confi ance plus qu'à mon propre corps, qu'à mes propres élans. Je lisais des histoires d'absolu et je croyais que je devais, moi aussi, aimer comme cela : avec démesure et douleur. Les livres m'ont appris à attendre des promesses que la vie ne tenait pas\". Dans ses explorations de l'amour, Morgane Ortin a toujours été influencée par les grands textes, qu'ils la guident ou qu'ils la nourrissent d'attentes inatteignables. Au travers des extraits qui l'ont marquée, elle nous livre ici un lexique de l'amour très personnel. De James Joyce à Annie Ernaux, de Flaubert à Marguerite Duras en passant par Beckett, Proust et Monique Wittig, on y traverse des mots brûlants - fusion, désir, manque, tendresse, mais aussi emprise, désamour, pudeur - qui font se rencontrer l'expérience intime et la voix universelle de la littérature. Editrice et autrice, Morgane Ortin est la créatrice du phénomène Amours solitaires. Carnets, recueils de poésie, anthologie de la littérature... elle s'attache à explorer le sentiment amoureux sous toutes ses coutures, dans tous les formats. Elle est ainsi l'autrice des best-sellers Amours solitaires et Le Secret (Albin Michel, 2018, 2019 et 2021), La Chambre sans murs (Nami, 2023) Toutes les lettres ne sont pas des lettres d'amour et Le Club des larmes (Le Papier fait de la Résistance x Leduc, 2021 et 2023).",isbn:"9782487606234",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487606234-M.jpg"},
  {t:"La Griffe de Sylvemorne",a:"Wilkinson L. M.",y:"2026",ed:"Saxo",cote:"J WIL",pub:"Jeunesse",sup:"Imprimé",d:"Une petite souris. Une grande quête. Pour sauver Alluria de la destruction, Fluette a quitté la protection de son village. Elle a suivi son coeur... jusque dans un marécage lugubre ! Or, les créatures qui peuplent cet endroit ne sont pas aimables DU TOUT. Mais face à un monstre recouvert de mousse et une tortue diabolique, que peut bien faire une petite souris ? Peu importe les obstacles, Fluette se montrera à la hauteur !",isbn:"9782385701628",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701628-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Yona poursuit sa lecture du journal de Yon-hi, la mère de Soo-won. Elle découvre que Yu-hon a exécuté les prêtres qui avaient découvert que sa femme descendait du roi Hiryû. Neuf ans plus tard, Yon-hi, qui a donné naissance à son fils quelques années auparavant, fait la connaissance d'une femme qui s'avère être Kashi, prêtresse rescapée du meurtre perpétré par son mari…",isbn:"9782811666385",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811666385-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Privée de contacts avec Hak et les quatre dragons, Yona demande une entrevue avec Soo-won mais on la lui refuse. Si bien qu'un soir, elle quitte sa chambre discrètement pour rejoindre Soo-won dans son bureau. Mais une fois face à lui, Yona peine à trouver les mots. De leur côté, les dragons sont réquisitionnés pour un entraînement militaire…Également inclus dans ce volume, un court épisode bonus sur l'enfance de Hak !",isbn:"9782811663674",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811663674-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Le tournoi de présentation officielle des quatre dragons a commencé. Ki-jae et Jae-ha, qui affrontent respectivement Joo-doh et Geun-tae, font une telle démonstration de force qu'ils en détruisent l'arène… Les exploits des guerriers dragons ajoutés au retour de la princesse Yona et de La Foudre mettent le peuple en liesse. Mais que ressent Hak, tenu à l'écart de Yona et des dragons ?",isbn:"9782811660086",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811660086-M.jpg"},
  {t:"Shérif malgré lui",a:"Offutt Chris",y:"2026",ed:"Editions Gallmeister",cote:"R OFF",pub:"Adulte",sup:"Imprimé",d:"Mick Hardin est un ancien marine de retour dans son Kentucky natal. Il officie comme shérif le temps que sa soeur, titulaire du poste, récupère d'une blessure par balle. Mais les difficultés s'accumulent. Les meurtres se succèdent, et Mick est le seul représentant de la loi disponible. Dans ce pays où les gens sont à fleur de peau et les apparences trompeuses, de nombreuses surprises l'attendent : des bandits venus de Detroit, une agente secrète britannique, de mystérieux Biélorusses... mais surtout la violence latente d'un pays construit sur un code moral impitoyable. Shérif malgré lui est la quatrième enquête du duo de choc composé du vétéran Mick Hardin et de sa soeur Linda, première femme shérif locale.",isbn:"9782351783559",extraUrl:"https://covers.openlibrary.org/b/isbn/9782351783559-M.jpg"},
  {t:"Le palais de sang",a:"Hur June",y:"2025",ed:"Bayard éditions",cote:"J HUR",pub:"Jeunesse",sup:"Imprimé",d:"Corée, 1758. Fille illégitime, Hyeon, 18 ans, a réussi à devenir infirmière au palais à force de travail et d'acharnement. Elle n'a d'autre but que d'effectuer son métier discrètement et, peut-être, gagner enfin l'approbation de son père. Lorsque quatre femmes sont sauvagement assassinées en une nuit et que sa mentor est accusée, Hyeon décide d'enquêter en secret pour prouver son innocence. Elle croise alors la route d'Eojin, un jeune inspecteur. Ensemble, ils plongent dans les recoins les plus sombres du palais. Mais les secrets mortels qu'ils découvrent les mènent vers une piste sanglante et dangereuse... Une immersion palpitante dans la Corée impériale Entre secrets d'Etat, romance naissante et condition féminine, Le palais de sang est un thriller historique aussi haletant qu'émouvant. A la manière des k-dramas, il mêle thriller et amour sur fond de décors somptueux et de tensions politiques. Porté par la plume précise et sensible de June Hur, ce récit envoûtant dévoile les rouages du pouvoir à travers une héroïne forte, lucide et bouleversante. Pour vibrer entre enquête et émotion Ce roman dès 13 ans invite à explorer une culture fascinante, tout en posant des questions très actuelles : comment s'imposer quand on ne rentre dans aucune case ? Comment distinguer le vrai du faux quand tout semble masque et manipulation ? Lauréat du prestigieux Prix Edgar Allan Poe 2023, ce texte mêle brillamment quête de justice, recherche d'identité et premiers émois.",isbn:"9791036373381",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791036373381-475x500-1.jpg"},
  {t:"L'Aube des dragons",a:"Mancusi Mari",y:"2026",ed:"Saxo",cote:"J MAN",pub:"Adolescent",sup:"Imprimé",d:"Les dragons arrivent. Etes-vous prêts ? Le monde extérieur est devenu dangereux. Des incendies ravagent les terres et rendent l'air quasiment irrespirable. Comme tous les habitants de sa ville, Lucas est donc forcé de passer la majorité de son temps à la maison. Son ami Noah est persuadé que des dragons sont à l'origine des feux, mais Lucas a du mal à y voir plus que des théories du complot... Pourtant, quand la famille de Noah quitte précipitamment la région et que de mystérieux agents débarquent pour fouiller leur maison, Lucas commence à se demander si son ami n'approchait pas de trop près de la vérité. Décidé à connaître le fond de l'histoire, le jeune garçon fait alors une découverte qui menace de tout embraser...",isbn:"9782385701659",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701659-475x500-1.jpg"},
  {t:"La folle idée de Suzette la Mouette",a:"Carquain Sophie",y:"2026",ed:"La Joie de lire",cote:"J CAR",pub:"Jeunesse",sup:"Imprimé",d:"Quand Suzette la mouette rieuse et Niko le corbeau parisien débarquent en Normandie, c'est la surprise générale. Leur duo a de quoi étonner : l'une, fantasque et excessive, a toujours le bec ouvert, tandis que l'autre est calme et réfléchi. Mais pour les autres mouettes et goélands, il est surtout interdit de se mélanger entre oiseaux des villes et oiseaux des mers ! Niko parviendra-t-il à se faire une petite place sur la plage ? Son amitié avec Suzette survivra-t-elle à cette épreuve ?",isbn:"9782889860562",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782889860562-475x500-1.jpg"},
  {t:"L'envol de la mémoire",a:"Spira Myriam",y:"2026",ed:"Grasset & Fasquelle",cote:"B SPI",pub:"Adulte",sup:"Imprimé",d:"Betty, résistante, a vingt et un ans lorsqu'elle est arrêtée à Bruges, en mars 1942, pour avoir dissimulé un poste émetteur clandestin. Elle est déportée au camp de Ravensbrück puis de Mauthausen. Joseph, juif et résistant, est arrêté quelques mois plus tard, Gare du Midi à Bruxelles, et déporté à Auschwitz-Birkenau. C'est après leur libération, à bord d'un train de la Croix-Rouge, que Betty et Joseph se rencontrent. Cinq enfants grandissent dans l'ombre de ce couple singulier, beau et meurtri. Cinq enfants pour reconstruire une famille décimée, celle de Joseph, dont le père et les quatre frères et soeurs ont été assassinés dans les camps. Petite, Myriam Spira écoutait ses parents raconter : la faim, le froid, les souffrances, la douleur des expériences médicales. Mais aussi leur combat pour la vie, l'espoir de retrouver une existence normale. Cet héritage douloureux imprègne l'âme des enfants qui connaîtront le mal-être existentiel, et la difficulté à devenir parents à leur tour. Autant de symptômes d'une transmission souvent indicible. Myriam Spira nous offre le récit rare d'une \" deuxième génération \", l'histoire de sa vie déportée dans les souvenirs de ses parents, mais aussi de sa reconstruction : à quarante-six ans, grâce à une volonté féroce, elle obtient sa licence de pilote privé et part seule survoler les camps, pour comprendre, maintenant adulte. Et raconter à son tour. Un récit bouleversant.",isbn:"9782246841906",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246841906-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2020",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"En pleine bataille opposant le pays de Kôka à la province de Sen, les quatre dragons se prêtent au jeu des simulacres pour gagner du temps. En toute première ligne, Hak, qui se bat comme un forcené, finit par rencontrer Cuerbo et s'engage dans un duel acharné contre lui. Au même moment, le prêtre Gobi se rend au château de la province de Sen et fait irruption devant Yona et Yûlan, la femme de Cuerbo.",isbn:"9782811654382",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811654382-M.jpg"},
  {t:"Jeanne et le secret des petites voix dans la tête",a:"Charvel Johann",y:"2026",ed:"Flammarion",cote:"A CHA",pub:"Jeunesse",sup:"Imprimé",d:"Jeanne adore se promener avec sa tante Hélène et discuter avec elle, car elle écoute toujours et connaît plein de choses. Aujourd'hui, Jeanne a envie de lui confier un secret : - Tu sais, Tata, parfois je me parle dans ma tête et j'entends une petite voix... Un album éclairant sur un phénomène utile, précieux et même un peu magique, pour aider les enfants à apprivoiser leur monde intérieur.",isbn:"9782080480477",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782080480477-475x500-1.jpg"},
  {t:"La solitude selon Lydia Erneman",a:"Christiansen Rune",y:"2026",ed:"Les Editions Noir Sur Blanc",cote:"R CHR",pub:"Adulte",sup:"Imprimé",d:"Ayant grandi comme enfant unique dans le nord de la Suède, Lydia est habituée à l'isolement. Quand elle part s'installer dans la campagne norvégienne pour exercer son métier de vétérinaire, elle adopte les rythmes de la vie rurale, occupe ses journées avec son amour des animaux, de la nature et du travail, oscille entre désir de contacts humains et solitude épanouie. Dans ce roman d'une exceptionnelle beauté, couronné du prix Brage - le Goncourt norvégien -, Rune Christiansen dépeint avec une poésie délicate la profonde humanité d'une vie, la plénitude qui se cache derrière une apparente simplicité, la richesse des mondes intérieurs. Poète et romancier, Rune Christiansen est l'auteur d'une quinzaine de livres unanimement salués parla critique qui lui ont valu les prix littéraires les plus prestigieux.",isbn:"9782889831609",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889831609-M.jpg"},
  {t:"La maison biscornue",a:"Brrémaud Frédéric",y:"2026",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Londres, 1947. Trois générations de la famille Leonides vivent ensemble sous la direction du riche patriarche Aristide, dans une grande demeure biscornue. Aristide, veuf, s'est remarié avec une très jeune femme. Sa soeur dirige la maison, tandis que sa petite-fille aime Charles Hayward et veut se marier. Mais tout bascule quand Aristide meurt empoisonné... Le meurtrier ferait-il partie de la famille ? Sophia fait part à son fiancé Charles Hayward de sa décision de ne pas consentir à l'épouser tant que le meurtrier n'aura pas été appréhendé. Désespéré de ne pouvoir obtenir sa main, il commence sa propre enquête.",isbn:"9782889325740",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889325740-M.jpg"},
  {t:"La mystérieuse affaire de styles",a:"Gleyse Romuald",y:"2020",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"1917, le capitaine Hastings, blessé au combat, est rapatrié en Angleterre et vient passer sa convalescence à Styles Court, dans la demeure familiale de son ami John Cavendish. L'ambiance est lourde car Emily, la mère de John, s'est remariée avec l'antipathique Alfred Inglethorp, plus jeune qu'elle. Et quand Emily meurt, empoisonnée, le hasard fait bien les choses avec la présence sur les lieux d'un ancien policier belge, ami du capitaine Hastings. Hercule Poire saura-t-il démêler le vrai du faux et confondre le coupable ?",isbn:"9782889325573",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889325573-M.jpg"},
  {t:"Moi, Lubochka",a:"Baum Gilles",y:"2026",ed:"les Éditions des éléphants",cote:"BDJ BAU",pub:"Jeunesse",sup:"Imprimé",d:"Un ours mène une vie d'ours au fil des saisons. Et puis un Jour, la terre tremble, les bombes pleuvent, le ciel prend feu... Une fable qui permet d'évoquer, avec finesse et subtilité, l'impact des conflits sur les hommes et la nature Cette singulière histoire d'amitié est aussi un hymne puissant à la solidarité et à l'espoir. Amnesty International.",isbn:"9782372731720",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782372731720-475x500-1.jpg"},
  {t:"Cadre noir",a:"Saint-André Alix de",y:"2026",ed:"Gallimard",cote:"R SAI",pub:"Adulte",sup:"Imprimé",d:"\"J'étais de nouveau enfant dans ce bureau qui ne ressemblait pas du tout à celui de mon père, mais cet homme exerçait la même fonction que lui et je voulais lui dire ça, que les écuyers pleurent quand ils perdent un cheval ; les écuyers de ce temps-là aussi, même si les hommes ne sont pas censés pleurer. Je voulais lui dire ça. Et lui donner la recette du cocktail Dubonnet ! Il y a des priorités dans la vie. \" En 1972, au sommet de sa gloire, le colonel Jean de Saint- André, écuyer en chef du Cadre noir de Saumur, est renvoyé du jour au lendemain sans explication. Que s'est-il passé? Sous la forme d'un journal enlevé et vivant, Alix mène l'enquête, explore son courrier, ses archives personnelles, la presse régionale, rencontre les protagonistes... Plongée dans les années Pompidou, elle fait de drôles de découvertes. On retrouve avec plaisir la verve d'Alix de Saint-André dans ces pages consacrées à son père, à ces hommes et à ces femmes qui font danser les chevaux.",isbn:"9782073009470",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073009470-M.jpg"},
  {t:"Tous tes enfants dispersés",a:"Umubyeyi-Mairesse Beata",y:"2019",ed:"Autrement",cote:"R UMU",pub:"Adulte",sup:"Imprimé",d:"Les relations sur trois générations d'une famille brisée par la guerre. Blanche, rwandaise, a grandi à Bordeaux après avoir fui le génocide de 1994. Elle vit avec son mari et son garçon, Stokely. Un jour, elle revient au Rwanda, à Butare, pour retrouver sa mère, Immaculata. L'amour et le pardon les réuniront-elles ? Quand à Stokely, il veut tout savoir de ce passé familial. Premier roman. ©Electre 2019",isbn:"9782746751392",extraUrl:"https://covers.openlibrary.org/b/isbn/9782746751392-M.jpg"},
