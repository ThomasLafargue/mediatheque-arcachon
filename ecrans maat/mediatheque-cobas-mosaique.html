  {t:"Le Champ des méduses",a:"Oltvanji Oto",y:"2026",ed:"Agullo",cote:"R OLT",pub:"Adulte",sup:"Imprimé",d:"\" C'est comme c ? a qu'un sceptique est devenu le Sceptique. \" Dans le Belgrade des années 2020, Le Sceptique, ancien journaliste devenu détective et grand amateur de vinyles, se lance dans une enquête à la demande d'un ancien camarade slovène de l'armée populaire yougoslave, Ales. Celui-ci lui demande de retrouver Marijana son épouse, disparue dix ans plus tôt après un mystérieux séjour à Belgrade. L'enquête du Sceptique le mène de Belgrade à Rovinj en Istrie, le Saint-Tropez croate, qui fut le théâtre d'un drame survenu trente ans auparavant. Il s'agit de la disparition de Bisera, la mère de Marijana, lors d'un séjour dans une villa au coeur du cercle fermé de familles influentes et dépravées. Peu à peu, les masques tombent : le groupe de vacanciers est lié par un pacte de silence mêlant libertinage, argent et pouvoir. Se dévoile alors le portrait d'une élite corrompue et complice, prête à tout pour protéger ses secrets. Ce qui semblait être une banale affaire de disparition se transforme rapidement en une plongée vertigineuse dans l'histoire trouble de l'ex-Yougoslavie. Entre jeux de pouvoir, secrets familiaux et crimes non résolus...",isbn:"9782382461433",extraUrl:"https://covers.openlibrary.org/b/isbn/9782382461433-M.jpg"},
  {t:"Un séisme",a:"Frèche Emilie",y:"2026",ed:"Albin Michel",cote:"364.152 FRE",pub:"Adulte",sup:"Imprimé",d:"Prix du livre politique 2026 Un récit passionnant. Le Point Collection Audiences - un procès, un écrivain Le 16 octobre 2020, Samuel Paty était tué pour avoir enseigné la liberté. En 2024, à la Cour d'assises spéciale de Paris, Emilie Frèche a suivi pour Le Point le procès des huit personnes accusées d'avoir apporté leur concours à son assassin. A travers un journal intime nourri de scènes d'audiences, de dessins pris sur le vif et de portraits des acteurs de ce grand procès terroriste, l'écrivaine dissèque les mécanismes qui ont ébranlé la République dans le sanctuaire qu'était jusque-là l'école. Un professeur a été décapité, c'est un séisme dont on ne se remet pas, dira un enseignant à la barre. Au coeur de ces journées noires, Un séisme donne aussi à voir l'humanité qui s'est déployée face à cette tragédie, et nous interroge sur notre capacité à résister pour faire vivre la démocratie.",isbn:"9782226504685",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226504685-M.jpg"},
  {t:"Le secret du Viking King",a:"Fromental Jean-Luc",y:"2025",ed:"Hélium",cote:"BDJ FRO",pub:"Jeunesse",sup:"Imprimé",d:"Elle mène ses enquêtes à patte de velours, mais quand elle sort ses griffes, ça déchire... Le Polp'z, milk-bar préféré de Miss Chat, est fermé. Ole, le barman, a disparu. Sur la piste de son ami, la détective croise le chemin de Big Ø, le chef du gang des Six Poulpes de la rue Treize qu'elle a envoyé en prison au début de sa carrière. La voici immergée en compagnie de la pétulante Griselda, archiviste au quotidien Dag Tablet, dans une sombre affaire d'archéologie sous-marine. Quel secret historique dort dans la mystérieuse épave du Viking King ? Pour le savoir, il va falloir plonger. Chat échaudé craint l'eau froide, mais chez notre féline, la curiosité l'emporte toujours sur l'effroi.",isbn:"9782330209735",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330209735-475x500-1.jpg"},
  {t:"Ce qui reste",a:"Schlink Bernhard",y:"2026",ed:"Gallimard",cote:"R SCH",pub:"Adulte",sup:"Imprimé",d:"A soixante-seize ans, Martin apprend qu'il n'a plus que quelques mois devant lui. Il s'attelle alors à mettre sa vie en ordre avant de mourir : il le doit à son épouse, Ulla, et à leur jeune fils, David. Mais comment savoir ce qui sera le plus important pour eux, une fois qu'il ne sera plus là? Et comment profiter ensemble du peu de temps dont ils disposent, tout en préparant celui de l'après ? Dans Ce qui reste, Bernhard Schlink nous invite au coeur d'une famille qui traverse des semaines bouleversantes, parce qu'elles ne reviendront jamais et par ce qu'elles révèlent comme surprises. Posant l'essentielle question de la transmission dans le cadre intime, le grand romancier allemand nous interroge délicatement sur le sens de nos choix, la possibilité du pardon et, en dernière instance, le rôle de l'amour dans nos existences.",isbn:"9782073060631",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073060631-M.jpg"},
  {t:"Piaf",a:"Margolis Noé",y:"2025",ed:"Gallimard",cote:"A MAR",pub:"Jeunesse",sup:"Imprimé",d:"Une plongée dans la vie tourbillonnante d'une icône de la chanson française. Piaf est née à Paris. C'est avec son père qu'elle apprend à chanter dans les rues de Belleville jusqu'à se faire remarquer pour sa voix sublime. Très rapidement, elle devient la voix de la chanson française. Ses immenses succès commeLa vie en rose ou Padampadam l'emmèneront aux Etats-Unis et dans les plus grandes salles de concert du monde. Elle aura pour amis les plus grands de l'époque : Trenet, Cocteau, Monnot. Elle est considérée comme l'une des plus grandes chanteuses de son temps.",isbn:"9782075212724",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075212724-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n accueillir que des cancres, s est rapproché de Kaoruko Waguri, qui fréquente unétablissement pour filles de bonne famille, Kikyô.Les vacances d été commencent, l occasion propice pour passer du temps entre amis. Mais, prenant conscience de ses sentiments à l égard de la jeune fille, Rintarô perd ses moyens lorsqu il apprend que l anniversaire de Kaoruko approche à grands pas. Après des heures de réflexion, il décide de lui préparer un gâteau pour exprimer sa gratitude. Kaoruko saura-t-elle apprécier ce cadeau empreint desincérité ?Roméo et Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d émotions !",isbn:"9782384963911",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963911-M.jpg"},
  {t:"Une bonne épouse",a:"Desjours Ingrid",y:"2026",ed:"HarperCollins",cote:"R DES",pub:"Adulte",sup:"Imprimé",d:"Alice a trente ans, Paris pour décor et le coeur en morceaux depuis qu'on lui a enlevé la garde de sa fille. Jusqu'au jour où une publicité attire son regard : une retraite dans un lieu enchanteur en pleine montagne, présentée comme une promesse de renouveau. C'est cher, un peu fou... mais que pourrait-elle perdre de plus ? Au fil des jours, Alice se découvre, se reconstruit. Lors d'une soirée dans un bar local, elle rencontre Marcel : charmeur, mystérieux et convaincant. Il l'invite à s'installer dans un village coupé du monde à deux pas de là, un havre de paix où d'autres couples filent déjà le parfait amour : la Fosse aux anges. Séduite et pleine d'espoir, Alice accepte. Mais le vernis idyllique ne va pas mettre longtemps à se craqueler : les femmes qui vivent ici sont-elles aussi heureuses qu'elles le paraissent ? Car, après tout, un cauchemar n'est qu'un rêve qui a mal tourné, n'est-ce pas ?",isbn:"9791033922711",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033922711-M.jpg"},
  {t:"Bienvenue au Coccinelle hôtel !",a:"Han Ra Kyoung",y:"2025",ed:"La Martinière",cote:"A KYO",pub:"Jeunesse",sup:"Imprimé",d:"L'hiver approche dans la forêt et l'effervescence règne à l'hôtel tenu par Dada et sa famille de coccinelles. Le petit MooMoo trépigne d'impatience : les prestigieux clients vont bientôt arriver ! Mais sa déception est grande quand il découvre que les célébrités attendues ne sont que des larves, des nymphes et des'ufs... Patience MooMoo, le printemps te réservera bien des surprises ! Bien plus qu'un simple album jeunesse, ce livre a des vertus documentaires. À travers les aventures de personnages irrésistibles, il ouvre une fenêtre sur le monde des insectes. Les jeunes lecteurs dès 4 ans découvriront l'univers méconnu des hôtels à insectes, ces havres de paix essentiels à la biodiversité, tout en suivant les métamorphoses surprenantes des coccinelles, trichies fasciées, capricornes et mantes religieuses. Pour prolonger plaisir, à la fin du livre, l'enfant trouvera deux doubles pages documentaires lui fournissant des informations sur les espèces d'insectes présentées dans le livre et leur cycle de vie, ainsi que des conseils pour fabriquer soi-même son hôtel à insectes",isbn:"9791040123378",extraUrl:"https://covers.openlibrary.org/b/isbn/9791040123378-M.jpg"},
  {t:"Un caillou magique",a:"Courtot Béatrice",y:"2026",ed:"Gautier-Languereau",cote:"A COU",pub:"Jeunesse",sup:"Imprimé",d:"Alba adore collectionner les cailloux : les petits, les grands, les pailletés et même les multicolores. Un jour, elle en découvre un nouveau, comme elle n'en a jamais vu... Quelle histoire va-t-il lui raconter ?",isbn:"9782017371014",extraUrl:"https://covers.openlibrary.org/b/isbn/9782017371014-M.jpg"},
  {t:"Une Fin de loup",a:"Camil Jérôme",y:"2019",ed:"Alice",cote:"A CAM",pub:"Jeunesse",sup:"Imprimé",d:"Dans un pré, Super-Mouton, le mouton super fort et super puissant, vole au secours de pauvres brebis attaquées par le Grand Méchant Loup ! J'ai dis attaquées par LE GRAND MECHANT LOUP ! Mais qu'est ce qu'il fabrique ? C'est le moment de l'histoire où le loup est censé entrer sur scène ! Furieux, Super-Mouton décide d'aller lui secouer les puces... Mais il va vite s'apercevoir qu'il n'est pas le seul à vouloir que le loup joue dans son histoire. Dans un pré, Super-Mouton, le mouton super fort et super puissant, vole au secours de pauvres brebis attaquées par le Grand Méchant Loup ! J'ai dis attaquées par LE GRAND MECHANT LOUP ! Mais qu'est ce qu'il fabrique ? C'est le moment de l'histoire où le loup est censé entrer sur scène ! Furieux, Super-Mouton décide d'aller lui secouer les puces... Mais il va vite s'apercevoir qu'il n'est pas le seul à vouloir que le loup joue dans son histoire.",isbn:"9782874263866",extraUrl:"https://covers.openlibrary.org/b/isbn/9782874263866-M.jpg"},
  {t:"Un ours pour deux",a:"Corrigan Patrick",y:"2026",ed:"Kimane",cote:"A COR",pub:"Jeunesse",sup:"Imprimé",d:"Lorsque Léo perd Lulu, son ours en peluche et meilleir ami, il est inconsolable. Mais il découvre rapidement qu'une petite fille l'a retrouvé et adopté. Avec son chien Toto à ses côtés, Léo élabore un plan pour récupérer Lulu... Une histoire touchante et joliment illustrée sur l'importance d'apprécier ce que l'on a, et de partager autour de soi.",isbn:"9782383225072",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383225072-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève du lycée Chidori qui  rassemble des garçons au plus bas de l échelle  scolaire, fait un jour la connaissance de  Kaoruko Waguri, qui fréquente l établissement  des filles de bonne famille, Kikyô.  Le jeune homme aux traits durs, habitué à  effrayer les autres sans le vouloir, est d'abord  perplexe devant l attitude de Kaoruko,   qui lui fait face avec une grande sincérité.  Cependant, il va peu à peu oser s ouvrir à la  jeune fille&Malgré le rapprochement qui s'opère entre  les deux lycéens, le fossé entre leurs écoles  voisines reste encore profond. C est alors qu un  jour, Subaru Hoshina, une amie de Kaoruko  qui déteste cordialement Chidori, interpelle  Rintarô&Roméo et Juliette moderne,   référence incontournable au Japon,   Bloom est une vraie pépite de  comédie et d émotions !",isbn:"9782373499766",extraUrl:"https://covers.openlibrary.org/b/isbn/9782373499766-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé pour n'accueillir que des cancres,   a tissé des liens avec Kaoruko Waguri, qui fréquente l'établissement des filles de bonne famille,   Kikyô. Malgré tout un monde qui les sépare, les deux jeunes trouvent une forme de réconfort dans les moments passés l'un avec l'autre.  Mais si la distance entre Rintarô et Kaoruko se réduit peu à peu, le mur entre leurs deux lycées demeure, et Rintarô se garde toujours de parler de cette relation à ses amis, ce qui finit par créer un malentendu entre eux...  Un soir après les cours, alors qu'il avait pris son courage à deux mains pour proposer à Kaoruko et son amie Subaru de se voir, une bande de lycéens vient le provoquer. Comment réussir à éviter la menace d'une bagarre ou pire... qu'ils s'en prennent aux filles?Roméo & Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions!",isbn:"9782373499773",extraUrl:"https://covers.openlibrary.org/b/isbn/9782373499773-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève du lycée Chidori qui rassemble des garçons au plus bas de l échelle scolaire, fait un jour la connaissance de Kaoruko Waguri, qui fréquente l établissement des filles de bonne famille, Kikyô.  Alors que Rintarô trouve un certain réconfort dans les moments passés avec la jeune fille, il restait préoccupé par le fossé entre leurs deux écoles, avant de finalement décider de présenter Kaoruko et Subaru à ses amis.  À partir de ce jour, de bonnes relations s installent petit à petit entre les six jeunes, et notre héros commence à s'ouvrir davantage à son entourage.  Invitant ses amis chez lui, il leur livre un récit de son enfance et leurs liens s'approfondissent.  Si sa mère se retrouve chamboulée par ces souvenirs et l évolution de son fils, de son côté, Rintarô s apprête à vivre un été sous le signe de la jeunesse et de l'amitié en compagnie de ses camarades !Un récit de jeunesse entre deux adolescents que tout oppose& et pourtant si proches.",isbn:"9782384963904",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963904-M.jpg"},
  {t:"La mort en miroir",a:"Rostagnat Pétronille",y:"2026",ed:"Belladone",cote:"R ROS",pub:"Adulte",sup:"Imprimé",d:"Lucie est persuadée d'avoir coché toutes les cases d'une vie réussie. Mère au foyer, femme d'un médecin légiste renommé, propriétaire d'une maison confortable près de Paris, elle enchaîne dîners mondains et vacances à l'étranger. Mais le jour où son mari, Bertrand, perd la mémoire à la suite d'un accident de voiture, tout bascule. Si la thèse d'une tentative de suicide est privilégiée, Lucie n'en croit rien et décide de mener elle-même l'enquête. Jusqu'au moment où la découverte d'un cadavre vient remettre en question toutes ses certitudes. Car ce cadavre ressemble trait pour trait à Bertrand. Qui est cet homme ? Que s'est-il passé le soir de l'accident ?",isbn:"9782488853002",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488853002-M.jpg"},
  {t:"Dans le ventre de Cornebidouille",a:"Bertrand Pierre",y:"2026",ed:"L'École des loisirs",cote:"A BER",pub:"Jeunesse",sup:"Imprimé",d:"Quand Pierre ne veut pas manger sa soupe, Cornebidouille déboule ! Plus mauvaise et pétaradante que jamais, la sorcière au langage fleuri engloutit cette fois le petit garçon dans son sommeil. Il se réveille dans son ventre, où règne un bazar pas possible. Heureusement, ses doudous ont aussi été avalés et les trois compères ont plus d'un tour dans leur sac pour lui faire regretter son sortilège !",isbn:"9782211348355",extraUrl:"https://covers.openlibrary.org/b/isbn/9782211348355-M.jpg"},
  {t:"Je suis capable",a:"Hostingue Déborah d'",y:"2026",ed:"Editions Les Arènes",cote:"A HOS",pub:"Jeunesse",sup:"Imprimé",d:"Un album pour accompagner les enfants quand ils perdent confiance en eux et développer leur force intérieure. Se séparer de ses parents le matin, se faire de nouveaux amis, parler devant tout le monde, ne pas réussir du premier coup... Autant de moments de défi, où l'enfant peut perdre confiance en lui. Pourtant, la confiance peut revenir. Cet album permet à l'enfant de retrouver une sécurité intérieure pour être à nouveau capable d'oser, de s'affirmer et de se relever de ses échecs. Et de pouvoir dire à son tour \" Je suis capable \".",isbn:"9791037515384",extraUrl:"https://covers.openlibrary.org/b/isbn/9791037515384-M.jpg"},
  {t:"Mille et une histoires d'une petite souris",a:"Barroux",y:"2026",ed:"Little urban",cote:"A BAR",pub:"Jeunesse",sup:"Imprimé",d:"Nichée dans une immense bibliothèque, une petite souris passe son temps à dévorer des livres. Malheureusement, ses jours sont comptés : un gros chat noir l'observe avec délectation. Il adorerait la croquer. Mais pas avant de connaître la fin de l'histoire racontée à voix haute par la courageuse lectrice ! Démarre alors le plus beau des voyages...",isbn:"9782374082240",extraUrl:"https://covers.openlibrary.org/b/isbn/9782374082240-M.jpg"},
  {t:"Love",a:"Cashell Sophie",y:"2026",ed:"Editions Gründ",cote:"A CAS",pub:"Jeunesse",sup:"Imprimé",d:"Un album tendre et poétique sur l'amour pour les petits ! Et s'il existait un monde où règne l'amour ? Et si ce monde, c'était le nôtre ? Ce livre regorge de belles idées pour transmettre l'amour autour de soi. Il nous rappelle qu'avec de petits gestes du quotidien, ou même simplement en étant présent, chacun peut contribuer à rendre le monde plus tendre. Un bel album cartonné sur l'amour, les différences et la tolérance, illustré avec tendresse par Axel Scheffler.",isbn:"9782324038099",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782324038099-475x500-1.jpg"},
  {t:"Un an ailleurs",a:"Ducos Max",y:"2026",ed:"Éditions Sarbacane",cote:"A DUC",pub:"Jeunesse",sup:"Imprimé",d:"As-tu déjà imaginé t'installer avec tes parents une année entière dans une maison et un pays inconnus ? C'était le rêve du peintre Max Ducos, qui t'emmène, le temps de ce livre, dans les bagages de sa propre famille, au fond d'une vallée secrète à deux heures de New York. Les saisons défilent, la maison se pare pour les fêtes puis se couvre de neige, les filles de Max s'élancent au-dehors, d'élégants petits animaux s'approchent ... Au fil des pages, partage les surprises, les émotions, les jeux, les rencontres, les découvertes - en un mot, la joie ressentie tout au long de cette année exceptionnelle. Une expérience qui changera la vie des deux fillettes. La tienne aussi, peut-être ?",isbn:"9791040808497",extraUrl:"https://covers.openlibrary.org/b/isbn/9791040808497-M.jpg"},
  {t:"La fille du chaos",a:"O'Donnell Cassandra",y:"2025",ed:"Flammarion",cote:"J ODO",pub:"Jeunesse",sup:"Imprimé",d:"Depuis l'arrivée d'agents du Ministère au collège des Enfants Spéciaux, des élèves disparaissent mystérieusement. Lorsque ces hommes inquiétants commencent à s'intéresser à ses pouvoirs, Emma n'a plus qu'une solution pour protéger sa magie : la fuite. Mais Hell, son ténébreux protecteur, disparaît à son tour, et son courage vacille. Seule l'union des créatures surnaturelles de l'école pourrait désormais contrer le Ministère...",isbn:"9782080496850",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080496850-475x500-1.jpg"},
  {t:"I Hope this doesn't find you",a:"Liang Ann",y:"2026",ed:"Pocket",cote:"J LIA",pub:"Adolescent",sup:"Imprimé",d:"Quand ses e-mails privés sont envoyés par erreur, Sadie Wen se retrouve plongée dans un tourbillon de rumeurs et de secrets... Sadie Wen, c'est la fille parfaite sur le papier : présidente du lycée et l'élève modèle. Mais pour garder ce sourire impeccable, Sadie a un petit secret : elle balance toutes ses frustrations dans des brouillons d'e-mails qu'elle n'enverra jamais. Plutôt mourir que de dire à voix haute ce qu'elle pense vraiment. Facile d'être honnête quand personne ne te lit. Jusqu'au jour où... tous ces mails sont envoyés. A tout le monde. En une nuit, sa vie parfaite explose en plein vol. Pourtant, au milieu du carnage, une personne commence à voir la vraie Sadie sous un autre jour : Julius. Le garçon qu'elle adore détester...",isbn:"9782266355278",extraUrl:"https://covers.openlibrary.org/b/isbn/9782266355278-M.jpg"},
  {t:"A tes côtés",a:"Hughes Hollie",y:"2026",ed:"Kimane",cote:"A HUG",pub:"Jeunesse",sup:"Imprimé",d:"Une histoire rassurante et adorablement illustrée par Alex Latimer sur le lien indéfectible entre parent et enfant. \"Lorsque Petit Dino est séparé de sa maman par une tempête, il sait qu'il doit faire preuve de courage et la retrouver. Mais le monde peut être effrayant sans elle à ses côtés... La gentillesse des autres animaux et quelques indices laissés dans le sable aideront-ils à ramener Petit Dino auprès de sa maman ? Une histoire rassurante, en rimes, pour célébrer le lien indéfectible entre un parent et son enfant\".",isbn:"9782383224594",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383224594-475x500-1.jpg"},
  {t:"D'ailleurs, ce n'est pas ma maison",a:"Le Gall Tiphaine",y:"2026",ed:"Manufacture de livres éditions",cote:"R LEG",pub:"Adulte",sup:"Imprimé",d:"\"Il fallait partir. Je suis montée à regret dans la voiture, et j'ai regardé s'éloigner l'image de Louise et de son amie, assises devant la mer. Mon coeur s'est serré. Nous rentrions à Rennes, et j'aurais rêvé d'avoir, moi aussi, cette liberté voluptueuse de journées face à l'océan\". A Brest, une femme se retrouve seule dans sa maison et se demande de quelle façon ce lieu agit sur elle. Qu'est-ce qui a motivé son installation dans ces murs, des années auparavant ? Et comment apprendre, après une rupture, à l'habiter ? Alors, elle remonte le fil de sa vie et des lieux qui l'ont façonnée. Immédiatement, une figure s'impose : celle de Louise, l'amie d'enfance disparue prématurément, un double ancré dans ce fantasmagorique Finistère, qu'elle fait renaître pour interroger son propre chemin. A travers une constellation de fragments, Tiphaine Le Gall tisse un récit lumineux et intime qui relie passé et présent. D'ailleurs, ce n'est pas ma maison est une réflexion sur l'empreinte des lieux, ceux qui nous précèdent, qui nous modèlent et qui nous transforment malgré nous.",isbn:"9782385532963",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385532963-M.jpg"},
  {t:"Mer belle à forte au large",a:"Saragosse Marie-Christine",y:"2026",ed:"Calmann-Lévy",cote:"R SAR",pub:"Adulte",sup:"Imprimé",d:"\" Je me souviens en tout cas que c'était épuisant de t'aimer autant. \" Mer belle à forte au large, c'est la météo marine d'une vie. Celle d'une femme née sur une rive de la Méditerranée, en Algérie, et qui a ensuite passé l'essentiel de son existence juste en face, à Cannes, la ville des stars. Indifférente aux convenances ou au regard d'autrui, cette institutrice issue d'une famille piémontaise refuse de se plier aux carcans patriarcaux de son époque, leur opposant sa beauté et sa liberté. Mer belle à forte au large, c'est aussi une histoire de transmission, le portrait d'une mère par sa fille, les instants partagés et l'amour qui les liait. Un récit qui commence quand une vie s'achève.",isbn:"9782702196113",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702196113-M.jpg"},
  {t:"Une année sur le Bassin d'Arcachon",a:"Antonutti Isabelle",y:"2026",ed:"Sud-Ouest",cote:"914.471 ANT",pub:"Adulte",sup:"Imprimé",d:"Ce calendrier perpétuel mêle harmonieusement aquarelles originales et contenus historiques sur le Bassin d'Arcachon et le Pays de Buch. Il aborde une grande variété de thèmes - histoire locale, patrimoine et art - en évoquant toutes les communes du Bassin. Traversant les époques, de l'Antiquité à nos jours, il propose chaque jour une anecdote illustrée par une aquarelle. Soigneusement documenté, l'ouvrage combine rigueur et plaisir de lecture. Une création inédite, à la croisée de l'art et de l'histoire locale. Ce bel ouvrage invite à explorer chaque jour la richesse du Bassin d'Arcachon sous une forme totalement unique. Ni dictionnaire, ni almanach, ni simple carnet de voyage, ni livre de peintures, ce calendrier perpétuel illustré n'a aucun équivalent - ni sur le Bassin, ni ailleurs en France. Un projet d'une envergure inédite, mêlant rigueur documentaire et poésie visuelle, pour redécouvrir un territoire comme jamais auparavant.",isbn:"9782817712765",extraUrl:"https://covers.openlibrary.org/b/isbn/9782817712765-M.jpg"},
  {t:"A sign of affection",a:"Morishita Suu",y:"2026",ed:"Akata",cote:"BD SIG",pub:"Jeunesse",sup:"Imprimé",d:"Charmée par l'affection qu'Itsuomi lui porte de jour en jour, Yuki prend la décision de concrétiser leur amour. Toujours plus complice, le couple se prépare même à partir en voyage à l'étranger. Toutefois, après avoir appris que Shin et Ema sortaient ensemble dans l'optique de se marier, un doute émerge dans l'esprit de Yuki : quelle place son amoureux lui réserve-t-il dans son avenir ? A Sign of Affection décrit avec pudeur et simplicité l'histoire d'amour entre une jeune femme sourde et un grand voyageur. A n'en pas douter, les personnages de ce manga ne manqueront pas de vous émouvoir !",isbn:"9782385692964",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385692964-M.jpg"},
  {t:"Magus of the Library",a:"Izumi Mitsu",y:"2026",ed:"Ki-oon",cote:"BD MAG",pub:"Adulte",sup:"Imprimé",d:"À travers les livres, deviens le héros de ta propre histoire ! Le calme est enfin revenu à Afshak. Malheureusement, l'individu responsable des troubles qui ont agité la ville s'est emparé du livre que détenait Shio... Enfin, pas tout à fait, puisque le jeune homme, prévoyant, l'avait remplacé par un autre texte ! L'objet de toutes les convoitises est donc toujours en la possession de la grande bibliothèque. Il est maintenant temps pour les apprentis kahunas de la promotion n° 86 de se consacrer à la mission qui conclura leur année d'apprentissage : choisir un projet à partir duquel ils devront réaliser un ouvrage et le mettre en vente à l'occasion du Festival des livres auspicieux. Tout un programme ! *Magus of the Library* est une ode à la lecture et un formidable appel à l'aventure. Au carrefour des *Mille et Une Nuits*, des récits de pirates et de l'heroic fantasy, c'est un terrain de jeu rêvé pour l'enfant qui sommeille en nous !",isbn:"9791032724187",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032724187-M.jpg"},
  {t:"Le crime du paradis",a:"Musso Guillaume",y:"2026",ed:"Calmann-Lévy",cote:"R MUS",pub:"Adulte",sup:"Imprimé",d:"Une histoire sombre et splendide dans une Côte d'Azur magnétique et sensuelle. Florence et Julian Livingstone, un couple d'Américains fortunés, réunissent chaque été un petit cercle d'amis dans leur somptueuse maison du cap d'Antibes, la Villa Starlight. Mais ce monde idyllique s'effondre la nuit où Oscar, leur fils de trois ans, est enlevé dans des conditions mystérieuses. Alors que l'affaire passionne le monde entier et que la peur se répand, le policier chargé de l'enquête se heurte à un mur de mensonges et de secrets. Son chemin va croiser celui de la jeune romancière Agatha Harding qui espère s'emparer du drame pour écrire un best-seller... Un suspense renversant où l'esprit d'Agatha Christie rencontre l'atmosphère fiévreuse de Tendre est la nuit jusqu'à un dénouement prodigieux. Un immense plaisir de lecture.",isbn:"9782702192979",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702192979-M.jpg"},
  {t:"Au pot, Hippo !",a:"Antony Steve",y:"2026",ed:"Circonflexe",cote:"A ANT",pub:"Jeunesse",sup:"Imprimé",d:"Suivez Hippo, un petit hippopotame qui n'a pas vraiment envie d'aller sur le pot[xe2][x80][xa6] une histoire pour accompagner les enfants dans l'apprentissage de la propreté",isbn:"9782378625573",extraUrl:"https://products-images.di-static.com/image/base/9782378625573-475x500-1.jpg"},
  {t:"Gryfenfer",a:"Sobral Patrick",y:"2014",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Récit du passé de Danaël, l'un des héros de Les Légendaires. D'un caractère impétueux, le jeune Faucon d'argent ne parvient pas à s'intégrer au corps d'armée dirigé par son frère. Prix Essentiel Jeunesse du meilleur album, Angoulême 2013",isbn:"9782756041278",extraUrl:"https://www.bedetheque.com/media/Couvertures/215609_c.jpg"},
  {t:"Peaux à peaux",a:"Page Melanie",y:"2026",ed:"Albin Michel",cote:"R PAG",pub:"Adulte",sup:"Imprimé",d:"Un premier roman émouvant sur la maternité. Télé 7 Jours Je pousse une dernière fois, je donne tout ce que j'ai. Tu es là. Ton cri. Ta peau. Ton poids sur moi. Plus en moi, sur moi. Tes petites mains. Ta petite bouche. Ton souffle. Tes paupières gonflées. Tu m'as quittée pour me rencontrer. Je regarde Vincent. Je te regarde, toi. Tu n'es pas moi, tu n'es pas lui, tu es toi. Et tu es la vie. Il y a la magie de la naissance, les premiers pas et les premiers émois, les défis du quotidien. Il y a les mères comblées, fières ; les mères impuissantes, défaillantes... Puisant parmi des destins ordinaires, Melanie Page déploie un roman polyphonique qui explore la maternité et la filiation dans toute leur complexité. Son regard sensible et lucide nous tend un miroir où chacune et chacun se reconnaîtra, dans ses moments de doute, de combat silencieux ou de joie infinie. Artiste, comédienne, maman comblée, Melanie Page publie avec Peaux à peaux son premier roman.",isbn:"9782226506504",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226506504-M.jpg"},
  {t:"Le dernier des fils",a:"Sobral Patrick",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Les Légendaires Résistance démarre 20 ans après le grand cycle des Légendaires. Le monde a vécu de belles années de paix mais aujourd'hui les descendants de nos héros doivent reprendre les armes pour défendre Alysia ! Maintenant que tout Alysia sait que les lunes n'ont jamais été détruites par les Dieux, partout dans le monde on se révolte et se dresse contre l'envahisseur divin. Du côté de la résistance, l'ambiance est explosive et Toopie est contestée pour ses décisions qui ont mené à la mort tragique d'Amy. Les tensions menacent la résistance alors qu'un espion des Célestes a infiltré leur base.",isbn:"9782413088486",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413088486-475x500-1.jpg"},
  {t:"La mort malgré lui",a:"Hérisson Armelle",y:"2026",ed:"Gallimard",cote:"R HER",pub:"Adulte",sup:"Imprimé",d:"Un village en Hongrie, 1944. De jeunes hommes sont enrôlés contre leur gré dans la Waffen-SS. Isère, 1980. Huit femmes sont enlevées puis tuées pour un projet artistique macabre. Toulouse, 1986. Martine Escadeillas disparaît mystérieusement. Laval, 1987. Le corps d'une journaliste parisienne est retrouvé, nu et couvert de sang, au pied d'une cité HLM tranquille. Séquestrée à plusieurs centaines de kilomètres de chez elle, elle semble avoir été tuée alors qu'elle tentait de s'enfuir. Pourquoi était-elle retenue prisonnière ? Par qui ? Le commissaire Ralu et sa brigade espèrent trouver la réponse dans les dossiers d'enquête de la victime.",isbn:"9782073105004",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073105004-M.jpg"},
  {t:"L'enfant du vent des Féroé",a:"Gautherie Aurélien",y:"2026",ed:"Les Editions Noir Sur Blanc",cote:"R GAU",pub:"Adulte",sup:"Imprimé",d:"Iles Féroé, 1902. Dès sa naissance, Anna semble chétive, donnant ainsi raison à sa mère, qui s'est inquiétée durant toute sa grossesse. Iles Féroé, 1953. Un vieux pêcheur sent que sa fin est proche mais il veut tenir quelques heures encore afin de s'éteindre à la même date qu'Anna, sa fille adorée. La rejoindre enfin est un soulagement. Pour raconter ce drame familial à un voyageur de passage, bien des années plus tard, les objets du quotidien ainsi que la petite ville de Gjógv prennent la parole. Et quand les hommes et les choses se taisent, ce sont les vents qui s'expriment, dans un puissant ressac de vers libres évoquant un choeur de tragédie.",isbn:"9782889831845",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889831845-M.jpg"},
  {t:"Rendez-vous à Bagdad",a:"Brrémaud Frédéric",y:"2024",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Victoria Jones est une jeune anglaise pleine de vie, pas très heureuse dans son travail, mais toujours disposée à aller de l'avant. Sur un coup de tête, elle a décidé de partir à Bagdad, rejoindre un jeune homme à peine croisé dans un parc de Londres. Mais son arrivée en Irak coïncide avec d'étranges événements... Le début de folles aventures pour notre héroïne, qui n'imagine pas que sa présence met en jeu le sort du monde !",isbn:"9782889323999",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889323999-M.jpg"},
  {t:"Rendez-vous à Bagdad",a:"Brémaud Frédéric",y:"2023",ed:"Paquet",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Victoria Jones est une jeune anglaise pleine de vie, pas très heureuse dans son travail, mais toujours disposée à aller de l'avant. Sur un coup de tête, elle décide de partir à Bagdad, rejoindre un jeune homme à peine croisé dans un parc de Londres. Mais son arrivée en Irak va coïncider avec d'étranges événements... Le début de folles aventures pour notre héroïne, qui n'imagine pas que sa présence va mettre en jeu le sort du monde !",isbn:"9782889323722",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889323722-M.jpg"},
  {t:"Les soeurs Blue",a:"Mellors Coco",y:"2026",ed:"Calmann-Lévy",cote:"R MEL",pub:"Adulte",sup:"Imprimé",d:"\" On est tes soeurs. Quoi que tu fasses, au bout du compte on sera toujours de ton côté. \" Les soeurs Blue sont aussi exceptionnelles et inoubliables qu'elles sont différentes : Sérieuse et responsable, Avery semble être la fille aînée parfaite. Mais cette avocate à Londres cache une liaison secrète qui risque de bouleverser sa vie. Déprimée après sa première défaite, Bonnie voit sa carrière de boxeuse remise en question. Alors qu'elle tente de se reconstruire à Los Angeles, un acte de violence va l'obliger à fuir la police. Lucky, la benjamine rebelle, est mannequin à Paris où elle passe son temps de soirée en soirée avant que ses excès ne la rattrapent. Un an après la mort soudaine et accidentelle de Nicky Blue, ses trois soeurs se rendent à New York pour empêcher la vente de l'appartement familial. Entre crises et disputes mais aussi fous rires et gestes d'amour, elles tentent tant bien que mal de surmonter leurs difficultés et de trouver leur chemin.",isbn:"9782702196083",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702196083-M.jpg"},
  {t:"La Citadelle de Jomsborg",a:"Le Gris Jérôme",y:"2026",ed:"Glénat",cote:"BDJ GRI",pub:"Jeunesse",sup:"Imprimé",d:"Kara, jeune guerrière viking, a malencontreusement ouvert les portes des Neuf Royaumes, libérant des créatures prêtes à semer le chaos sur Midgard. Pour expier sa faute et apaiser la colère d'Odin, elle doit traquer ces monstres et les renvoyer là d'où ils viennent. Aux côtés de Bojan, un prêtre pas très dégourdi, et de la sulfureuse sorcière Rùna, Skara s'engage dans une guète épique digne des plus grandes sagas nordiques.",isbn:"9782344074060",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344074060-M.jpg"},
  {t:"A Troie, on lâche tout !",a:"Larbier Philippe",y:"2022",ed:"Bamboo Edition",cote:"BDJ LAR",pub:"Jeunesse",sup:"Imprimé",d:"La mythologie grecque revisitée par un humour légendaire ! Sale période pour Achille. La mère d'un des plus grands héros de la mythologie grecque a peur pour son fils car elle a appris qu'il ne reviendra pas de la guerre. Elle décide de le déguiser en fille et de le planquer sur une île habitée uniquement par des femmes. Il faudra toute la ruse d'Ulysse pour démasquer son copain et le traîner avec lui pour se préparer à ce qui deviendra, des années plus tard, la guerre de Troie... Qui a dit que Petit Mythos était un métier de tout repos ?",isbn:"9782818994894",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818994894-475x500-1.jpg"},
  {t:"Haut les mains, peau de bovin !",a:"Puls David",y:"2026",ed:"Auzou",cote:"BDJ PUL",pub:"Jeunesse",sup:"Imprimé",d:"Du haut de ses 9 ans, Mia n'a qu'un seul rêve : devenir la plus grande crapule de l'Ouest ! Du haut de ses 9 ans, Mia n'a qu'un seul rêve : devenir la plus grande crapule de l'Ouest ! Mais il y a deux problèmes. D'abord, c'est Villain Farmer, l'inarrêtable braqueur aux vaches-gangsters, qui détient ce titre honorifique. Ensuite, dès qu'il s'agit d'attaquer des banques, Mia enchaîne les gaffes et les échecs... Ainsi, quand elle se retrouve nez-à-nez avec le fameux bandit, Mia va devoir mettre le paquet pour prouver que c'est ELLE, la véritable terreur de l'Ouest.",isbn:"9791039563529",extraUrl:"https://covers.openlibrary.org/b/isbn/9791039563529-M.jpg"},
  {t:"Iceworld",a:"Rivière Anne",y:"2026",ed:"Bayard éditions",cote:"BDJ RIV",pub:"Jeunesse",sup:"Imprimé",d:"Au statioport de Bluetown, Roméo est témoin d'un bug informatique. Il a à peine le temps de comprendre ce qu'il a vu sa navette spatiale est attaquée par un drone ! Roméo s'écrase sur Seiren, une planète déserte et glacée. Il lui reste 17 heures pour trouver de l'aide et comprendre qui est à ses trousses, après quoi sa combinaison thermique n'aura plus de batterie, et il sera victime du froid...",isbn:"9791036356292",extraUrl:"https://covers.openlibrary.org/b/isbn/9791036356292-M.jpg"},
  {t:"A la recherche de Rosaly Green",a:"Le Lay Delphine",y:"2026",ed:"Dargaud",cote:"BDJ LAY",pub:"Jeunesse",sup:"Imprimé",d:"Un étrange mot, et les voilà réduits... rétrécis... rapetissés. Sans le précieux carnet de Rosaty Green, comment Lynette et son ami Nino vont-its rentrer chez eux... et retrouver leur taille normale ? Une aventure mini en taille... Maxi en émotion !",isbn:"9782205214826",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205214826-M.jpg"},
  {t:"Le labyrinthe des brumes",a:"Burniat Mathieu",y:"2026",ed:"Charivari",cote:"BDJ BUR",pub:"Jeunesse",sup:"Imprimé",d:"Toujours sur les traces de l'armée de Neptune et de Lyssa, Icare et Kalio mettent le cap au nord, vers l'île aux quatre couleurs. Ils arrivent en pleine course annuelle : les quartiers s'affrontent en quête du pouvoir. L'amitié d'Icare et Kalio, champions de familles rivales, survivra-t-elle à leur affrontement dans le labyrinthe des brumes ?",isbn:"9782487663404",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487663404-M.jpg"},
  {t:"Il était une fois",a:"Derrien Jean-Christophe",y:"2026",ed:"Soleil",cote:"BDJ DER",pub:"Jeunesse",sup:"Imprimé",d:"Pour l'anniversaire de Frigiel (il a déjà 20 ans ! ), Abel a enfin terminé son autobiographie, où il évoque toutes les histoires précédentes de nos héros... mais de son point de vue ! A Lanniel, on prépare une surprise pour l'anniversaire de Frigiel : une grande fête pour ses 20 ans ! Et c'est aussi l'occasion pour Abel de dévoiler enfin son autobiographie longtemps promise... où il va revenir sur son parcours et toutes les aventures avec ses compagnons. Mais, comme toujours, notre bâtisseur préféré a sa propre vision des choses... contredite parfois par ses amis.",isbn:"9782302107595",extraUrl:"https://covers.openlibrary.org/b/isbn/9782302107595-M.jpg"},
  {t:"Un goût de dolce vita",a:"Gentile Lorenza",y:"2026",ed:"Nami",cote:"R GEN",pub:"Adulte",sup:"Imprimé",d:"\"Il paraît qu'on est la somme de ses accomplissements, alors j'ai fait le calcul. Crayon en main, j'ai tout additionné. Résultat : je suis en négatif\". Si Selene est convaincue d'une chose, c'est qu'il faut assumer ses échecs. Mais alors que, la trentaine passée, sa vie se résume à une suite de déconvenues, elle ne peut s'empêcher de se demander où elle a fait fausse route. Etait-ce le dernier de ses coups de tête, l'ouverture d'un restaurant aujourd'hui au bord de la faillite, ou est-ce arrivé il y a quinze ans, lorsqu'elle a quitté sa vallée natale dans le sud de l'Italie ? En quête de réponses, elle décide de se rendre dans les Pouilles, sur les terres de son enfance. Là-bas, entre une Fiat Uno rouge, un âne aussi esseulé qu'elle et des après-midi passés en cuisine avec les gens qui l'ont vue grandir, Selene comprend qu'il faut parfois se perdre avant de trouver le bon chemin... \"Une écriture drôle et lumine use : un baume pour ce ux en quête de sens\". La Repubblica \"Une mer veilleuse invitation au lâcher-pris e et aux joies qui accompagnent l'inattendu\". Vanity Fair Lorenza Gentile est née en 1988 à Milan. Elle est l'autrice de plusieurs best-sellers parus en Italie, dont un inspiré de son expérience à la célèbre librairie parisienne Shakespeare and Company. Ses romans sont traduits dans plusieurs pays, et Un goût de dolce vita est son premier livre traduit en français. Traduit de l'italien par Samuel Sfez",isbn:"9782487606265",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487606265-M.jpg"},
  {t:"Avoir le courage de vieillir",a:"Kishimi Ichiro",y:"2026",ed:"Guy Trédaniel Editions",cote:"158.1 KIS",pub:"Adulte",sup:"Imprimé",d:"Par Ichiro Kishimi, l'auteur des best-sellers mondiaux Avoir le courage de ne pas être aimé et Avoir le courage d'être heureux. POURQUOI AVOIR PEUR DE VIEILLIR ? Dans une société qui valorise la jeunesse, vieillir est souvent perçu comme un déclin. Nous redoutons la perte de nos capacités, la maladie, la solitude ou l'impression de devenir inutile. Mais faut-il vraiment envisager la vieillesse de cette manière ? Après les best-sellers mondiaux Avoir le courage de ne pas être aimé et Avoir le courage d'être heureux, inspirés de la psychologie d'Alfred Adler, Ichiro Kishimi nous invite à réfléchir à l'une des grandes questions de notre époque : comment vivre sereinement les années qui viennent. En s'appuyant sur la philosophie, la littérature et l'expérience personnelle de l'auteur, ce livre, accessible et profond, propose une autre manière de regarder l'avenir. Vieillir ne signifie pas seulement perdre quelque chose. C'est aussi l'occasion de se libérer des attentes de la société, de redécouvrir ce qui compte vraiment et d'habiter pleinement le présent. Un essai lumineux qui invite à voir la vieillesse non comme un déclin, mais comme un moment de liberté, de lucidité et de sens.",isbn:"9782813236364",extraUrl:"https://covers.openlibrary.org/b/isbn/9782813236364-M.jpg"},
  {t:"Ana et l'Entremonde",a:"Dubuisson Marc",y:"2026",ed:"Glénat",cote:"BDJ DUB",pub:"Jeunesse",sup:"Imprimé",d:"Quand les portes de L'Entremonde s'ouvrent enfin... Ana et Domingo, deux jeunes orphelins embarqués par accident dans la fameuse expédition de Christophe Colomb, se sont retrouvés projetés dans l'Entremonde, un univers fantastique peuplé de pirates en tous genres ! Tandis que La Main continue d'étendre son pouvoir sur Kawa-Qawa, Ana et ses amis sont plus déterminés que jamais à l'arrêter avant que les mystérieuses Portes-aux-mondes ne tombent en sa possession. Entre surprises, révélations et bataille navale explosive, l'ultime tome de la série nous plonge dans une aventure fantastique pleine d'imagination et de rebondissements avec, toujours, des planches en couleur directe à couper le souffle !",isbn:"9782344068564",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344068564-M.jpg"},
  {t:"Israël-Palestine, une guerre sans limites ?",a:"Boniface Pascal",y:"2026",ed:"Eyrolles",cote:"956.94 BON",pub:"Adulte",sup:"Imprimé",d:"Cet ouvrage permet de comprendre la genèse et les perspectives du conflit israélo-palestinien. Mêlant approches historique et géopolitique, il décrit avec précision les événements marquants qui ont embrasé le territoire depuis la Seconde Guerre mondiale, les différentes tentatives de paix avortées ainsi que l'engrenage des affrontements, jusqu'aux attentats terroristes du 7 octobre 2023 et leurs conséquences géostratégiques dans les années qui ont suivi. Ce livre dresse un panorama des enjeux globaux d'une guerre dont on ne connaît pas les limites, mais à même de bouleverser les équilibres mondiaux. Cette nouvelle édition a été entièrement actualisée.",isbn:"9782416024436",extraUrl:"https://covers.openlibrary.org/b/isbn/9782416024436-M.jpg"},
  {t:"Dit comme ça...",a:"Ennis Garth",y:"2016",ed:"Panini",cote:"BD ENN",pub:"Adulte",sup:"Imprimé",d:"Les P'tits Gars décident de venir troubler une orgie entre super héros. Les héros de Butcher affrontent une nouvelle équipe de surhumains. La Crème, le Français et la Fille dévoilent leurs origines. Compilation des épisodes Hérogasme, Question de survie et Rien de tel dans le monde entier. Avec des épisodes inédits et un carnet de croquis. ©Electre 2021",isbn:"9782809455397",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809455397-M.jpg"},
  {t:"La sorcière des mers du Sud",a:"Gihef",y:"2021",ed:"les Humanoïdes associés",cote:"BD GIH",pub:"Adulte",sup:"Imprimé",d:"La jeune sirène Blodughadda se voit confier un triton rejeté par les siens car tous deux sont marqués d'une rune symbole de magie, un signe suffisant pour braver les lois qui proscrivent tout contact entre sirènes et tritons. En grandissant, Gildwin développe son don pour la magie et devient bientôt inséparable de Blodughadda. Cette amitié interdite doit à tout prix rester cachée, mais c'est sans compter sur les origines du triton qui finissent par le rattraper...Les mers nordiques sont peuplées de créatures mythologiques aussi puissantes que cruelles, telles les neufs sirènes, filles d'Aegir. Celles-ci s'opposent aux fiers vikings, prêts à tout pour contrôler les mers… Affrontements, alliances et trahisons, la série Sirènes & Vikings présente  des récits indépendants, chaque fois par un duo d'auteurs différent.",isbn:"9782731646443",extraUrl:"https://covers.openlibrary.org/b/isbn/9782731646443-M.jpg"},
  {t:"Écume de nacre",a:"Gihef",y:"2020",ed:"les Humanoïdes associés",cote:"BD GIH",pub:"Adulte",sup:"Imprimé",d:"Victime d'une prophétie, la jeune Freydis fut abandonnée par son clan de sirènes et recueillie par une famille viking. Élevée en guerrière et fière de son appartenance au peuple norrois, elle est prête à tout pour anéantir les sirènes, auxquelles elle voue une haine farouche. Mais les liens du cœur seront-ils plus forts que les liens du sang ?  Les mers nordiques sont peuplées de créatures mythologiques aussi puissantes que cruelles, telles les neufs sirènes, filles d'Aegir. Celles-ci s'opposent aux fiers vikings, prêts à tout pour contrôler les mers… Affrontements, alliances et trahisons, la série Sirènes & Vikings présente des récits indépendants, chaque fois par un duo d'auteurs différent.",isbn:"9782731650273",extraUrl:"https://covers.openlibrary.org/b/isbn/9782731650273-M.jpg"},
  {t:"Sinatra, amour et Mafia",a:"Ameziane Amazing",y:"2026",ed:"Rocher",cote:"BD AME",pub:"Adulte",sup:"Imprimé",d:"Frank Sinatra a réussi à coller plus de personnes ensemble que la glue ! Sa voix a suscité les passions - et pas seulement auprès des femmes qu'il a connues. Il a toujours été fidèle en amitié - et juste en amitié -, mais pour ce qui est de ses affaires subsiste une part d'ombre que tous préfèrent ignorer. « La mafia, ça n'existe pas », affirmera le patron du FBI après avoir été pris en photo par elle. Pourtant, raconter la vie de Sinatra, c'est aussi retracer la montée en puissance du crime organisé, de Hollywood à Washinghton, en passant par Cuba. Venez découvrir The Voice comme vous ne l'avez jamais vu, à travers les témoignages de Marilyn Monroe, Ava Gardner, Sammy Davis Jr. et... du redoutable boss de la mafia de Chicago, Sam Giancana",isbn:"9782268112756",extraUrl:"https://covers.openlibrary.org/b/isbn/9782268112756-M.jpg"},
  {t:"La vague invisible",a:"Mitric Nicolas",y:"2021",ed:"les Humanoïdes associés",cote:"BD MIT",pub:"Adulte",sup:"Imprimé",d:"L'épisode  : Modeste marchande de poisson, Lydveig a-t-elle hérité des talents de pisteurs de son père  ? C'est ce que pense le cruel roi Hardeknud, qui la contraint à retrouver la sirène responsable de la mort de son fils aîné. Accompagnée par le prince héritier en quête de reconnaissance, Lydveig mène l'enquête. Il lui faudra redoubler d'ingéniosité pour retrouver la trace d'une sirène si insaisissable qu'elle en paraîtrait presque invisible…  La série  : Les mers nordiques sont peuplées de créatures mythologiques aussi puissantes que cruelles, telles les neufs sirènes, filles d'Aegir. Celles-ci s'opposent aux fiers vikings, prêts à tout pour contrôler les mers… Affrontements, alliances et trahisons, la série Sirènes & Vikings présente des récits indépendants, signés chacun par un duo d'auteurs différent.",isbn:"9782731692327",extraUrl:"https://covers.openlibrary.org/b/isbn/9782731692327-M.jpg"},
  {t:"Drôles d'expressions sur... les émotions",a:"Mialon Estelle",y:"2026",ed:"Grenouille éditions",cote:"A MIA",pub:"Jeunesse",sup:"Imprimé",d:"En voilà de drôles d'expressions ! En douceur ou en couleurs, nos émotions sont une grande source d'inspiration pour notre imagination. Douze comptines illustrées pour découvrir le monde poétique et imagé des expressions... et des émotions !",isbn:"9782384862856",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782384862856-475x500-1.jpg"},
  {t:"L'incroyable destin de Katherine Johnson, mathématicienne de génie à la NASA",a:"Hédelin Pascale",y:"2026",ed:"Bayard éditions",cote:"J HED",pub:"Jeunesse",sup:"Imprimé",d:"L'incroyable destin de Katherine Johnson, mathématicienne de génie à la Nasa Dès son enfance, l'américaine Katherine Johnson est une génie des mathématiques. Mais elle doit se battre et s'imposer pour surmonter sa condition de femme noire dans un monde dirigé par des hommes blancs... En 1953, elle parvient à intégrer l'agence spatiale américaine. Avec d'autres femmes surnommées les \"calculatrices en jupe\" elle manie les chiffres comme personne. Figure de l'ombre, elle a permis l'envoi de fusées et d'hommes dans l'espace.",isbn:"9791036382529",extraUrl:"https://covers.openlibrary.org/b/isbn/9791036382529-M.jpg"},
  {t:"La clé de Dedaleum",a:"Lees Jordan",y:"2026",ed:"Auzou",cote:"J LEE",pub:"Jeunesse",sup:"Imprimé",d:"Le grand final d'une saga époustouflante ! Le terrible magus Manfred Tarr est à la recherche d'une clé. Une clé perdue depuis des années, qui détient le pouvoir de libérer les ténèbres dans le labyrinthe... Pour sauver Dedaleum, Benjamiah et Elizabella n'ont qu'une seule solution : accomplir les épreuves des Trois Soeurs et retrouver la clé avant. Ils se lancent dans un dangereux voyage jusqu'à la Forêt Tordue, qui abrite les créatures les plus incroyables, et jusqu'à l'ultime bataille. Une guerre dont ils ne sortiront pas indemnes.",isbn:"9791039575119",extraUrl:"https://covers.openlibrary.org/b/isbn/9791039575119-M.jpg"},
  {t:"Les femmes de sciences vues par une ado un peu vénère !",a:"Quentin Natacha",y:"2021",ed:"Poulpe fictions",cote:"J QUE",pub:"Jeunesse",sup:"Imprimé",d:"Les femmes ont fait avancer la science, voici leur bio, drôle et illustrée ! Depuis que son frère a déclaré que les femmes étaient nulles en sciences, Louise est prête à tout pour lui prouver qu'il a tort. Et pour ça, quoi de mieux qu'une émission sur Internet qui mette en lumière le parcours et les travaux des grandes femmes scientifiques ? De la chimie à l'astronautique, c'est parti pour un tour d'horizon drôle et documenté de ces grandes figures, sans prise de tête ! Entre anecdotes, explications scientifiques et interview d'une vraie chercheuse, Louise te présente avec humour 25 femmes qui ont marqué l'histoire des sciences. Le bonus ? Grâce aux illustrations BD, les personnages prennent vie pour tout te raconter ! #ilnyapasquemariecurie #féminisme #endirectdulabo Dans la même collection, retrouve aussi d'autres personnalités vues par des ados : Léonard de Vinci, Molière, Einstein, Mozart, les figures de la mythologie grecque et Cléopâtre ! Prix Le goût des sciences 2022 . Sélection pour le Prix Tangente des lycéens 2023 .",isbn:"9782377421497",extraUrl:"https://covers.openlibrary.org/b/isbn/9782377421497-M.jpg"},
  {t:"Une vie de fantôme",a:"Langaney Anouk",y:"2026",ed:"Syros",cote:"J LAN",pub:"Adolescent",sup:"Imprimé",d:"Tu es un fantôme et tu n'as aucun souvenir de ta vie d'avant. Qui es-tu et que t'est-il arrivé ? A toi de le découvrir. Tu te réveilles dans un état cotonneux, léger comme l'air. En face de toi, un grand miroir ovale. Tu te regardes dedans, mais tu ne te vois pas. Tu comprends que tu es mort. Ou plutôt... que tu es devenu un fantôme. Tu ne te souviens de rien, pas même de ton identité. A toi de mener l'enquête en explorant le château gothique où tu t'es réveillé. Ses occupants, issus d'une ancienne et noble famille, semblent cacher de lourds secrets. L'un d'eux a-t-il un lien avec ta mort ? Et qui sont-ils pour toi ? Pour découvrir la vérité, tu devras ouvrir les yeux et fouiller aux bons endroits ! Ensuite, tu pourras passer à l'action. Choisiras-tu la vengeance ou le pardon ?",isbn:"9782748539530",extraUrl:"https://covers.openlibrary.org/b/isbn/9782748539530-M.jpg"},
  {t:"Le manga",a:"Kotenka Théo",y:"2023",ed:"Poulpe fictions",cote:"J KOT",pub:"Jeunesse",sup:"Imprimé",d:"La grande aventure du manga, racontée par deux ados passionnés ! Nilou et J. -B. sont voisins... et surtout rivaux ! Les deux collégiens sont constamment en compétition, que ce soit pour obtenir la meilleure note de la classe... ou pour décider quel est le meilleur manga de tous les temps ! Afin de les réconcilier, la documentaliste de leur collège leur propose de travailler ensemble sur une exposition autour de leur passion commune. A eux de présenter à leurs camarades l'histoire du manga, de One Piece à Sailor Moon en passant par Astroboy . Avec autant de choses à raconter, la collaboration s'annonce aussi motivante... qu'explosive ! Dans la collection 100 % Bio, découvre aussi d'autres sujets captivants présentés par des ados : Einstein, Molière, Cléopâtre, Léonard de Vinci, Mozart, Picasso, la mythologie grecque, les femmes de sciences, les femmes artistes, les grandes aventurières, les grandes chanteuses et musiciennes, l'astronomie, les grandes inventions et la Rome antique ! #lemangacestlavie #anticlichés #humour Pré-sélection pour le Prix des Incorruptibles 2025 .",isbn:"9782377422821",extraUrl:"https://covers.openlibrary.org/b/isbn/9782377422821-M.jpg"},
  {t:"Laïka, chienne cosmonaute",a:"Pouget Anne",y:"2024",ed:"Editions Casterman",cote:"J POU",pub:"Jeunesse",sup:"Imprimé",d:"1957. Le jeune Igor, 12 ans, vit avec son père Nicolaï une vie de paysans modeste. Un jour, Igor trouve dans la forêt une petite chienne chétive et se prend immédiatement d'affection pour elle. Cette chienne s'appellera Laïka. Très vite adoptée, elle apporte douceur et joie dans le coeur du garçon et de son père. Mais le bonheur est de courte durée car des hommes croisent la route de Laïka et l'embarquent avec eux jusqu'à une base scienti¿que appelée \" La Cité des Etoiles \". Révolté de voir son amie enlevée par des inconnus, Igor compte bien retrouver Laïka et veiller à ce qu'on ne lui fasse aucun mal... Il ignore qu'elle va participer malgré elle à un voyage spatial sans retour à bord de Spoutnik 2, et marquer à tout jamais notre histoire.",isbn:"9782203275966",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203275966-M.jpg"},
  {t:"L'incroyable destin d'Antoni Gaudi, le génie qui transforma Barcelone",a:"Lamoureux Sophie",y:"2026",ed:"Bayard éditions",cote:"J LAM",pub:"Jeunesse",sup:"Imprimé",d:"L'incroyable histoire de Gaudí, le génie qui transforma Barcelone Des couleurs vives qui éclatent au soleil, des tours ajourées qui grimpent vers le ciel, un lézard recouvert de mosaïques... l'oeuvre de Gaudí n'en finit pas de surprendre ceux qui visitent Barcelone. Alors qu'on commémore en 2026 l'achèvement de la Sagrada Familia, la vie mouvementée de cet architecte tourmenté fascine : entre son enfance insouciante dans sa campagne natale et sa mort brutale en 1926, Gaudí a réussi à s'affirmer comme l'un des artistes les plus marquants et originaux de toute la Catalogne.",isbn:"9791036382345",extraUrl:"https://covers.openlibrary.org/b/isbn/9791036382345-M.jpg"},
  {t:"Sel",a:"Lan Nina",y:"2026",ed:"Didier jeunesse",cote:"J LAN",pub:"Adolescent",sup:"Imprimé",d:"Nami, fille du peuple des Mouvants, a le Sel dans le sang. Cette année, elle guidera la caravane de son clan vers les salines de Perlevent. Son rêve se réalise et avec lui, surtout, l'espoir de retrouver Calist et Elian, ses amis de toujours. Mais la cité du Sud n'a plus la douce saveur de l'enfance : dirigée d'une main de fer par la Dauphine et gangrénée par un mystérieux groupe de rebelles, elle est au bord du chaos. Alors, quand les Mouvants sont suspectés d'avoir volé le Sel magique de leur propre récolte, Nami se jure de prouver leur innocence. Entre amitié contrariée et amour naissant, la jeune Mouvante devra forger des alliances délicates... et déterrer des secrets lourds de conséquences. \" Ce n'est pas seulement une histoire de magie et de révolte, mais aussi une ode à l'amitié qui m'a touchée en plein coeur. \" Romy, Librairie de Paris (Saint-Etienne)",isbn:"9782278132119",extraUrl:"https://covers.openlibrary.org/b/isbn/9782278132119-M.jpg"},
  {t:"Merlin et Chou chez les pirates",a:"Stower Adam",y:"2025",ed:"Flammarion",cote:"J CLE",pub:"Jeunesse",sup:"Imprimé",d:"Un chat pantouflard, un lapin à la crème, une chatière magique... En avant pour des aventures poilantes ! Merlin et Chou forment un duo aussi poilu que craquant. Ensemble, ils partent à l'aventure ! Car, oui, la chatière de Merlin est magique. Aujourd'hui, elle propulse les deux amis sur un bateau de pirates ! Cap sur l'Île aux Monstres, à la recherche d'un fabuleux trésor..",isbn:"9782080489241",extraUrl:"https://products-images.di-static.com/image/base/9782080489241-475x500-1.jpg"},
  {t:"Le dernier mouton",a:"Hub Ulrich",y:"2022",ed:"Gallimard",cote:"J HUB",pub:"Jeunesse",sup:"Imprimé",d:"Quelle étrange lumière ! Elle est si vive qu'elle réveille le troupeau de moutons en pleine nuit. Mais où sont passés leurs bergers ? Ont-ils été kidnappés par des OVNIS ou cela a-t-il quelque chose à voir avec la petite fille qui, paraît-il, est née dans une étable voisine ? Pour en avoir le coeur net, les moutons décident de suivre la lumière et se lancent dans une expédition nocturne plus que mouvementée...",isbn:"9782075166317",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075166317-M.jpg"},
  {t:"Méchante",a:"Sulpice Karine",y:"2026",ed:"Liana Levi",cote:"R SUL",pub:"Adulte",sup:"Imprimé",d:"Confondre comestible et vénéneux... Etrange tout de même, qu'elle ait pu cuisiner cette omelette mortelle : c'est qu'elle s'y connaissait en champignons, Violette, après une vie passée dans ces campagnes. Assassinée alors, la vieille dame ? Les regards des enquêteurs se tournent vers Bertille Granier, son aide à domicile. Très vite, pour la presse, l'affaire est entendue : cette Bertille, qui clame trop mollement son innocence, est le visage du mal. Mais c'est à la justice de se prononcer : le défilé des témoins et des experts commence, dans un procès qui passionne les foules. Le tribunal parviendra-t-il à la vérité? Dans ce roman à l'humour implacable, entre chronique judiciaire et conte cruel, Karine Sulpice décortique les de la méchanceté et de la frustration.",isbn:"9791034911714",extraUrl:"https://covers.openlibrary.org/b/isbn/9791034911714-M.jpg"},
  {t:"Les fils d'Otmar",a:"Buwalda Peter",y:"2026",ed:"Actes Sud",cote:"R BUW",pub:"Adulte",sup:"Imprimé",d:"A dire vrai, Otmar Smit n'a qu'un fils : Dolf, enfant prodige, pianiste virtuose, flamboyant et mégalomane. Ludwig, lui, n'a ni père ni don artistique, mais se rêve en \"fils d'Otmar\", l'homme qui l'a adopté, lui a donné une éducation et même un nouveau prénom. Cependant, l'existence, quelque part au monde, d'un mystérieux géniteur qui n'a pas voulu le connaître jette une ombre tenace sur la vie de Ludwig. Isabelle, journaliste d'investigation brillante, intrépide et séduisante, n'est pas non plus ce qu'elle paraît être, un pur produit de la haute bourgeoisie hollandaise. Née dans un village perdu de l'arrière-pays thaïlandais, elle est en guerre avec sa famille adoptive - et peut-être avec elle-même, entre exigence de justice et goût des plaisirs sulfureux. Ces deux êtres que tout oppose mais dont les vies se croisent ont chacun d'excellentes raisons de vouloir rencontrer Hans Tromp, l'arrogant PDG d'une multinationale pétrolière, en poste dans la lointaine île russe de Sakhaline. Conduisant avec brio cette immense symphonie romanesque, Peter Buwalda passe du blizzard sibérien à la jungle polluée du Nigeria, bondit de Beethoven au marquis de Sade, oscille sans arrêt entre présent et passé tandis que ses personnages cherchent leur chemin dans un monde futile et corrompu, grotesque et tragique - le nôtre. Et ce n'est qu'un début.",isbn:"9782330216528",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216528-M.jpg"},
  {t:"Le ciel a disparu",a:"Blottière Alain",y:"2026",ed:"Gallimard",cote:"R BLO",pub:"Adulte",sup:"Imprimé",d:"\"J'aimerais qu'on sache, parce que j'en suis fier, que le jour où mon grand-père Ayann Ader décida de tuer Elon Musk, je me trouvais avec lui à Sifra, oasis égyptienne du désert libyque\". Quelle folie habite Ayann, écrivain français partageant sa vie entre l'Egypte et Paris, pour qu'il décide d'assassiner l'homme le plus riche du monde ? Tout commence une nuit de mai 2026, aux portes du désert, lorsque, observant le ciel, le vieil homme découvre à quel point celui-ci est défiguré par les satellites Starlink : ils effacent et remplacent les étoiles, sans lesquelles nous ne mesurons pas qui nous sommes. Et bientôt, Musk rendra la Terre invivable à force de pollutions. Dans un récit écrit à la veille de l'attentat, Ayann explique les raisons de son acte, et comment il l'a préparé. Vingt-quatre ans plus tard, alors que le monde a basculé, son petit-fils retrouve ce témoignage... Hanté par l'idée de la fin de l'humanité, Le ciel a disparu, roman au souffle poétique et politique puissant, est aussi un hymne à l'empathie, à l'amour et à la beauté du monde - tout ce que Musk, dans son entreprise démente, menace de balayer.",isbn:"9782073129918",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073129918-M.jpg"},
  {t:"Les reines de sang",a:"Blengino Luca",y:"2026",ed:"Delcourt",cote:"BD BLE",pub:"Adulte",sup:"Imprimé",d:"Fin de l'an 54 après J. -C., Claude, quatrième Empereur de Rome, meurt empoisonné à l'âge de 63 ans. La coupable de ce meurtre, Julia Agrippine Mineure, est tout à la fois sa femme et sa nièce ! La dynastie décadente de la famille Julia ne compte plus que deux descendants mâles, prêts à se disputer le trône : Britannicus, frêle fils de Messaline, et le jeune et flamboyant Néron, fils d'Agrippine elle-même. Lorsque le premier succombe à son tour au poison, le second est prêt à prendre la tête de l'Empire. Mais Agrippine a d'autres projets : méfiante envers Néron et son inexpérience, inquiète de l'influence que sa maîtresse Poppée exerce sur lui, et consciente du destin cruel qui l'attend si jamais il pose la couronne de laurier sur sa tête, Agrippine caresse depuis longtemps un rêve impossible... s'emparer pour elle-même de la Ville éternelle, se faire couronner Impératrice et devenir la première femme de Rome à obtenir le pouvoir absolu !",isbn:"9782413087519",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413087519-M.jpg"},
  {t:"Une histoire d'amour et de violence",a:"Bourdeaut Olivier",y:"2026",ed:"Gallimard",cote:"B BOU",pub:"Adulte",sup:"Imprimé",d:"Le jour où il enterre son père, tout le monde félicite Olivier pour le succès de son premier roman. La scène est absurde, presque irréelle. Et pourtant, c'est là que tout commence. Car derrière la consécration de l'écrivain se cache une histoire intime. Celle d'un fils qui a grandi dans l'ombre d'un père aussi impressionnant qu'insaisissable, d'un enfant qui s'est construit contre la violence et sous les coups, d'un adolescent qui les a rendus et d'un homme qui, au moment de devenir père à son tour, choisit de transformer son héritage. De Nantes à l'Espagne, des bancs de la pension aux plateaux de télévision, Olivier Bourdeaut remonte le fil d'une vie faite de chutes, de réconciliations inattendues et de victoires inespérées. Peut-on réécrire son histoire familiale ? Et que reste-t-il, au fond, de nos pères ? Traversé par une émotion et un humour irrésistibles, ce livre raconte la métamorphose d'un mauvais élève en écrivain, d'un fils blessé en un père attentionné. Un récit vibrant sur la filiation, les épreuves, et finalement la joie de trouver enfin sa place.",isbn:"9782073130242",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073130242-M.jpg"},
  {t:"Dansez sans moi",a:"Shalev Zeruya",y:"2026",ed:"Gallimard",cote:"R SHA",pub:"Adulte",sup:"Imprimé",d:"En quatre-vingt-neuf brefs chapitres, une femme tire le fil d'un monologue féroce et débridé, traversé par le désarroi. Dans cette confession en forme de performance, il ne fait aucun doute qu'elle a tout perdu : sa fille, ses amours, sa famille, ses cheveux, jusqu'à son propre nom. Oscillant entre fureur et désir, crainte et regret, elle livre plusieurs versions de son histoire, la déforme, la réinvente, la pousse dans ses retranchements les plus absurdes, les plus démesurés. Plus de trente ans après sa parution en Israël, le premier roman de Zeruya Shalev n'a rien perdu de sa force subversive. Ancré dans un univers à la lisière du rêve, il interroge la maternité, le mariage et le désir dans ce qu'ils ont de plus complexe, parfois de cauchemardesque. En matérialisant des peurs et des angoisses vécues par de nombreuses femmes, Zeruya Shalev en révèle toutes les nuances, annonçant déjà les thèmes majeurs qui ne cesseront d'habiter son oeuvre. Surréaliste et provocateur, Dansez sans moi nous entraîne dans un voyage aussi troublant que fascinant, dont on ne revient pas tout à fait indemne.",isbn:"9782073077837",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073077837-M.jpg"},
  {t:"Les pieds de Papa",a:"Jadoul Emile",y:"2026",ed:"L'École des loisirs",cote:"A JAD",pub:"Jeunesse",sup:"Imprimé",d:"Mes deux petits pieds sur le grand pied de Papa, je suis prêt pour l'aventure ! Tagada, tagada, grands pieds cheval ! A l'eau, grands pieds bateau ! On rentre à la maison, grands pieds avion ! Et quand Papa n'est pas là, les grandes bottes, c'est pour moi !",isbn:"9782211349949",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782211349949-475x500-1.jpg"},
  {t:"Il n'y a pas de place pour la mort",a:"Quignard Pascal",y:"2026",ed:"Hardies",cote:"R QUI",pub:"Adulte",sup:"Imprimé",d:"\"Ecris ce livre en sorte que ta vie pénètre en lui sans qu'elle mente. Que quelque chose touche celle qui n'en a pas été touchée\". \"Il n'y a pas de place pour la mort\" : un homme et une femme s'enfuient. Le nouveau roman de Pascal Quignard aux Editions Hardies. \"Quelle joie qu'un nouvel éditeur apparaisse. Quel bonheur qu'il se soucie de littérature pure. Quelle merveille enfin que l'amitié, la mémoire, la ferveur, les passions partagées y président. Je sens qu'un destin magique nous favorise\". Pascal Quignard",isbn:"9782959564369",extraUrl:"https://covers.openlibrary.org/b/isbn/9782959564369-M.jpg"},
  {t:"Boston et la Nouvelle Angleterre",a:"Zerdoun Catherine",y:"2026",ed:"Michelin",cote:"917.3 BOS",pub:"Adulte",sup:"Imprimé",d:"Laissez-vous guider par nos auteurs ! Au cours de leurs innombrables tournées, ils ont déniché pour vous des lieux inoubliables ou insolites : - Les incontournables (classés 1, 2 ou 3 étoiles) : Boston, Newport, Acadia National Park... - Les coups de coeur : Pousser les portes d'un palais vénitien ; S'offrir un road trip sur la Route 100 ; Voir s'ébattre les baleines au nord du Cape Cod... - Les bonnes adresses pour tous les budgets : se restaurer, prendre un verre, shopping, sortir, se loger - Les meilleurs spots en famille (activités pour les 6-14 ans) : Approcher les élans ; Prendre place à bord d'un train à crémaillère ; Revivre l'épopée des passagers du Mayflower... - Des suggestions d'itinéraires : De Boston au Cape Cod en 8 jours ; Le Vermont en 7 jours... Retrouvez également : - De nombreux cartes et plans pour retrouver les principaux sites étoilés de la destination. - Toutes les infos mises à jour dans cette nouvelle édition Ce guide est divisé en 6 micro-régions : Massachusetts ; Rhode Island ; Connecticut ; Vermont ; New Hampshire ; Maine.",isbn:"9782067271135",extraUrl:"https://covers.openlibrary.org/b/isbn/9782067271135-M.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9791032712146",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712146-M.jpg"},
  {t:"L'éternité ne dure qu'un temps",a:"Sobral Patrick",y:"2013",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Dans ce nouvel épisode, Gryf est confronté à un choix cornélien : sauver celle qu'il aime ou sauver la race humaine de l'extinction.",isbn:"9782756032634",extraUrl:"https://www.bedetheque.com/media/Couvertures/Couv_199456.jpg"},
  {t:"World Without",a:"Sobral Patrick",y:"2017",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"En 2004 naquit ce qui allait devenir LE phénomène éditorial de la bande dessinée jeunesse du début du XXIe siècle : Les Légendaires. Dans ce tome 20, Artémus et ses compagnons auront fort à faire pour éviter le pire... C'est un grand jour à Orchidia ! Des quatre coins d'Alysia, les grands de ce monde sont venus assister à l'épreuve du bâtonaigle de Jadilyna qui désignera la princesse Shun-Day comme reine du royaume à la place de sa tante, l'impitoyable Invidia. Mais dans l'ombre de cet événement se trame une sombre machination qui pourrait bien finir en tragédie. Mais qui est visé par cet infâme complot ?",isbn:"9782756064765",extraUrl:"https://www.bedetheque.com/media/Couvertures/Couv_312707.jpg"},
  {t:"Les Précurseurs",a:"Merle Loïc",y:"2026",ed:"Actes Sud",cote:"R MER",pub:"Adulte",sup:"Imprimé",d:"A l'aplomb des plateaux de Lozère, se dessine la silhouette éclatante et libre d'Augusta, qui aura passé sa vie à suivre ces chemins escarpés - ses sentiers adorés. D'elle on entrevoit des images, on la devine joyeuse, dispensant quelques conseils à son petit-fils, Loïc. Des années plus tard, Loïc cherchera des réponses auprès d'une autre augure. Entre les pages du \"Journal\" de Jean- Luc Lagarce, il emprunte les portes dérobées d'une oeuvre obsédée par l'éternel retour et les origines ; s'y reconnaît, parfois. Sans doute ce livre est-il un hommage singulier : dans une prose magnétique, Loïc Merle y brosse le portrait émerveillé d'une femme humble, qui toujours veilla sur les siens. D'un repère à l'autre - l'amour d'une grand-mère, la dévotion à l'art de l'auteur de \"Juste la fin du monde\" -, il dresse un monument à cette part du passé qui nous constitue, que l'on souhaiterait transmettre. Et que la littérature permet de rendre, à travers les années, plus vive que jamais.",isbn:"9782330216283",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216283-M.jpg"},
  {t:"Venise, millefleurs",a:"Sekiguchi Ryôko",y:"2026",ed:"P.O.L",cote:"R SEK",pub:"Adulte",sup:"Imprimé",d:"Plus je lui écrivais de lettres, plus mon affection pour Ilaria grandissait. Il me fallait en savoir plus sur elle. Mais je n'étais pas certaine qu'elle souhaitât que je dévoile les anecdotes intimes que la lecture de son herbier m'avait apprises. Dans le même temps, certains de ses textes sur les plantes laissaient transparaître un désir de percer les secrets de Venise.",isbn:"9782818065129",extraUrl:"https://covers.openlibrary.org/b/isbn/9782818065129-M.jpg"},
  {t:"Où est ta tétine ?",a:"Van Genechten Guido",y:"2024",ed:"Albin Michel",cote:"A VAN",pub:"Jeunesse",sup:"Imprimé",d:"Petite Souris est vraiment très curieuse. Elle veut tout comprendre et tout voir... même les tétines de ses amis. Et ils en ont beaucoup ! Mais que va-t-elle faire de toutes ces tétines ?Un livre plein d'humour pour apprendre à dire au revoir à sa tétine",isbn:"9782226488367",extraUrl:"https://m.media-amazon.com/images/I/416vnYZxc1L._SX195_.jpg"},
  {t:"Un homme raisonnable",a:"Couturier Hélène",y:"2026",ed:"Rivages",cote:"R COU",pub:"Adulte",sup:"Imprimé",d:"Qu'a fait Orso Orsini à son fils adoré pour que celui-ci parte travailler dans la lointaine Afrique ? Et que s'est-il passé avec sa femme, la spécialiste du peintre Joaquim Sorolla, pour que celle-ci prenne pour amant un Cubain d'une rare beauté ? Anéanti par la douleur et salement déprimé, Orso n'a plus qu'une envie : approcher l'amant et entendre sa voix. Mais le jeu de piste pour homme trompé s'arrête brutalement avec le décès de l'amant. Accident ou meurtre ? Entre alors en scène la capitaine Blandine Bianco qui ressemble davantage à une avocate d'affaires de l'Ouest parisien qu'à une officière de police à la Crime.",isbn:"9782743669188",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743669188-M.jpg"},
  {t:"Parvati",a:"Ogaki Philippe",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001966",extraUrl:"https://images.epagine.fr/966/9782413001966_1_m.jpg"},
  {t:"Amir",a:"Ogaki Philippe",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue",isbn:"9782413001935",extraUrl:"https://images.epagine.fr/935/9782413001935_1_m.jpg"},
  {t:"Hystérie collective",a:"Shriver Lionel",y:"2026",ed:"Belfond",cote:"R SHR",pub:"Adulte",sup:"Imprimé",d:"Plus provocatrice et caustique que jamais, Lionel Shriver s'inspire de l'actualité pour livrer la satire aussi jubilatoire que glaçante d'une Amérique gangrenée par la bien-pensance, le politiquement correct et la cancel culture. Liste des mots interdits : Stupide, idiot, bête, haut potentiel, méritocratie, etc., etc. Sont désormais proscrits : Les devoirs, les tests, les notes, les examens. Les entretiens d'embauche. Les bilans de compétences. Conséquences : Enfants, parents, voisins, collègues, amis, amants, époux sont invités à se dénoncer les uns les autres. Tout contrevenant s'expose à un avertissement, une amende, voire à une peine de prison. Professeure à l'université, Pearson se demande encore comment les Etats-Unis en sont arrivés là. Depuis que le mouvement pour la Parité mentale a pris le pouvoir, les enfants n'apprennent plus à lire, le niveau des étudiants a chuté, les dîners où l'on débattait à bâtons rompus sont devenus sinistres. Heureusement, il lui reste sa meilleure amie, Emory, pour ironiser sur la situation. Les deux femmes se connaissent depuis l'adolescence, la confiance entre elles est totale. Ou du moins Pearson le croit-elle...",isbn:"9782714404138",extraUrl:"https://covers.openlibrary.org/b/isbn/9782714404138-M.jpg"},
  {t:"Moi, quand je me réincarne en Slime - Tome 30",a:"Kawakami Taiki",y:"2026",ed:"Kurokawa",cote:"BD MOI",pub:"Jeunesse",sup:"Imprimé",d:"Comment un slime devient le seigneur du royaume ! Limule affronte Yûki, manipulé par le pouvoir de Mariabell, mais comprend qu'il n'arrivera pas à le libérer de son emprise. Alors que le duel bat son plein, ils sont interrompus de façon plutôt inattendue. Millim est partie rejoindre le dragon du chaos, et pendant ce temps, Mariabell s'est volatilisée... La situation évolue rapidement sur plusieurs fronts à la fois. Comment Limule fera-t-il face à cette crise ?",isbn:"9791042021825",extraUrl:"https://covers.openlibrary.org/b/isbn/9791042021825-M.jpg"},
  {t:"Point de mire !",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Le match opposant Ryôma à Fuji Yûta est sur le point d'avoir lieu. Ce dernier n'est autre que le petit frère du prodigieux Fuji Shûsuke ! Ryôma va devoir faire face à cet excellent joueur surnommé \"le tueur gaucher\" et à son twist lifté surpuissant !! Ryôma s'en sortira-t-il indemne ?!",isbn:"9782871299653",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299653-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Nous voici dans la seconde partie du championnat de Tokyo ! Seigaku a réussi un tour de force en se qualifiant pour la finale. Son futur adversaire n'est autre que la brillante équipe de Yamabuki, dont les équipes en double étaient classées au niveau national l'année précédente. Le premier match est une catastrophe. Le duo Fuji - Kawamura se fait littéralement balayer! L'équipe jouant l'autre double, constituée de la golden pair Ôishi - Kikumaru, prend le relais mais la tension est à son comble !",isbn:"9782871299905",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299905-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Le championnat de Tokyo a bel et bien commencé ! Tous les participants s'affrontent dans des matches enflammés avec pour unique objectif d'atteindre le championnat du Kantô ! Seigaku, qui jusqu'à présent enchaîne les victoires, se retrouve face au célèbre collège de Saint-Rudolph. Un nouveau challenge pour Ryoma et ses coéquipiers!",isbn:"9782871299158",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299158-M.jpg"},
  {t:"Moi, quand je me réincarne en Slime - Tome 29",a:"Fuse",y:"2026",ed:"Kurokawa",cote:"BD MOI",pub:"Jeunesse",sup:"Imprimé",d:"**Comment un slime devient le seigneur du royaume !** Après avoir déjoué bien des pièges, Tempest rejoint le conseil des pays de l'Occident sur la base d'une relation équitable. Limule se rapproche de son idéal de coexistence pacifique entre humains et monstres. En revanche, Mariabell, tête pensante du clan Rozzo, a vu tous ses plans bouleversés et s'apprête à utiliser un atout secret qui inquiète même Yûki..",isbn:"9791042021818",extraUrl:"https://covers.openlibrary.org/b/isbn/9791042021818-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Afin de se mettre en jambes en vue des demi-finales du championnat de Tokyo, l’équipe de Seigaku reprend ses entraînements. Nos titulaires se mesurent les uns aux autres, chacun faisant démonstration de sa puissance de jeu. Le premier match d’entraînement oppose Ryôma à Fuji ! Notre petit génie est plus que déterminé mais leur rencontre prend une tournure très inattendue !",isbn:"9782871299806",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299806-M.jpg"},
