  {t:"Le livre de la culpabilité",a:"Chidgey Catherine",y:"2026",ed:"Editions Gallmeister",cote:"R CHI",pub:"Adulte",sup:"Imprimé",d:"En 1979, dans un monde où personne n'a gagné la Seconde Guerre mondiale, l'Angleterre est dirigée par un gouvernement qui repose sur des alliances inquiétantes. Des triplés de treize ans - Vincent, Lawrence et William - sont les derniers résidents d'un foyer pour garçons. Chaque jour, ils prennent leurs médicaments et étudient sous l'oeil vigilant de trois mères : Mère du Matin, Mère de l'Après-midi et Mère de la Nuit. Ils ne désirent qu'une chose : rejoindre les orphelins chanceux qu'on envoie dans une station balnéaire mythique. Non loin de là, Nancy, treize ans également, mène une vie recluse avec ses parents qui l'adorent mais ne la laissent jamais sortir. Lorsque la route des triplés croise celle de Nancy, les enfants découvrent la terrible vérité sur leurs origines et devront s'unir pour survivre. Mélange envoûtant de fable gothique et de suspense psychologique, Le Livre de la culpabilité dévoile les sombres secrets d'un monde où certaines vies ont moins de valeur que d'autres.",isbn:"9782351783856",extraUrl:"https://covers.openlibrary.org/b/isbn/9782351783856-M.jpg"},
  {t:"L'ascenseur",a:"Expert Jacques",y:"2026",ed:"Calmann-Lévy",cote:"R EXP",pub:"Adulte",sup:"Imprimé",d:"Victor a disparu.[xc2][xa0] Tous les mercredis depuis le divorce, l enfant est raccompagné par son père chez sa mère. Il aime prendre l ascenseur tout seul et, par jeu, il appuie sur les boutons, s arrêtant sur chaque palier avant d atteindre celui de sa mère, au dernier étage.[xc2][xa0] Mais, ce jour-là, la porte s ouvre sur une cabine vide.[xc2][xa0] Comment peut-on se volatiliser entre le rez-de-chaussée et le cinquième étage d un immeuble'[xc2][xa0] C est ce qu'essaient de comprendre la commissaire Jeanne Péroni et la capitaine Pauline Brézulier, amies et collègues complices qui vont avoir treize jours pour tenter par tous les moyens de retrouver Victor.[xc2][xa0] Où est-il'Est-il encore dans l'immeuble'A-t-il été enlevé'[xc2][xa0] UN THRILLER QUI SE LIT COMME UNE COURSE CONTRE LA MONTRE: DÈS LA PREMIÈRE PAGE, LE DÉCOMPTE EST LANCÉ",isbn:"9782702194584",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702194584-M.jpg"},
  {t:"A sign of affection",a:"Morishita Suu",y:"2026",ed:"Akata",cote:"BD SIG",pub:"Jeunesse",sup:"Imprimé",d:"Charmée par l'affection qu'Itsuomi lui porte de jour en jour, Yuki prend la décision de concrétiser leur amour. Toujours plus complice, le couple se prépare même à partir en voyage à l'étranger. Toutefois, après avoir appris que Shin et Ema sortaient ensemble dans l'optique de se marier, un doute émerge dans l'esprit de Yuki : quelle place son amoureux lui réserve-t-il dans son avenir ? A Sign of Affection décrit avec pudeur et simplicité l'histoire d'amour entre une jeune femme sourde et un grand voyageur. A n'en pas douter, les personnages de ce manga ne manqueront pas de vous émouvoir !",isbn:"9782385692964",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385692964-M.jpg"},
  {t:"Printemps, à la Charité",a:"Chabert Alexis",y:"2026",ed:"Bamboo Edition",cote:"BD PEL",pub:"Adulte",sup:"Imprimé",d:"\"Dans le Paris de la Belle Epoque, être un survivant du Bazar de la Charité n'est pas sans risque...\". Paris, 1897. Quelques semaines aprés l'incendie du Bazar de la Charité, les survivants meurent dans d'étranges circonstances, victimes d'hallucinations tonifiantes. L'inspecteur Amaury Broyan, flic brisé, opiomane et hanté par la mon de sa fille, est chargé de l'enquéte. Des salons de la haute société aux bas-fonds de la capitale, il s'enfonce dans un mystère oh science, culpabilité et vengea s'entrelacent. Sa rencontre avec Blanche Dambreville, fascinante entomologiste, pourrait bien faire basculer l'affaire... et sa propre raison.",isbn:"9791041106332",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041106332-M.jpg"},
  {t:"La Légende",a:"Sansal Boualem",y:"2026",ed:"Grasset & Fasquelle",cote:"B SAN",pub:"Adulte",sup:"Imprimé",d:"\" Un jour, on découvre que l'on vit dans un monde inversé - où la vérité dérange, où la justice inquiète, où la liberté fait peur. C'est dans ce \"pays des miracles \" que mon histoire commence. Ou peut-être qu'elle finit. J'ai compris que cette histoire ne m'appartenait pas. Elle circulait sans moi. Elle est née dans la tête du grand magistrat, elle est passée par un tribunal d'exception, par la prison, par les médias des cinq continents, elle s'est chargée des colères et des espoirs des uns et des autres. A aucun moment elle n'est passée par moi. Mon récit me permet de me réapproprier la légende, et rappelle ce qu'est une justice aux ordres, un pouvoir sans contrepoids, la peur quand elle s'installe dans la langue. Les bourreaux prospèrent dans l'anonymat ; la lumière commence par les désigner. Ces pages n'adoucissent rien : elles éclairent... \" B. S. La légende n'est pas seulement le récit d'une détention. C'est l'histoire d'un homme que l'on a voulu effacer - et qui devient un symbole.",isbn:"9782246847564",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246847564-M.jpg"},
  {t:"Le cauchemar du Loch Leathan",a:"Lieron Cyril",y:"2025",ed:"Ankama Éditions",cote:"BD LIE",pub:"Adulte",sup:"Imprimé",d:"Une lettre insensée attise la curiosité de Sherlock Holmes et entraîne son départ jusqu'au fin fond de l'Ecosse. Le détective et son fidèle ami, le Dr Watson, vont se heurter à un village pétri de méfiance où semble rôder une créature cauchemardesque. Réfutant le mysticisme, le duo de détectives est bien décidé à découvrir ce que cache réellement \"la malédiction du Kelpie\" ! Quels sombres secrets se cachent dans les brumes du Loch Leathan ?",isbn:"9791033518044",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033518044-M.jpg"},
  {t:"Sibylline",a:"Dano Sixtine",y:"2025",ed:"Glénat",cote:"BD DAN",pub:"Adulte",sup:"Imprimé",d:"Chroniques d'une escort girl A tout juste 19 ans, Raphaëlle ressemble à toutes les jeunes filles de son âge. Fraîchement débarquée à Paris pour ses études d'archi, elle enchaîne à un rythme effréné les cours, les nuits blanches à travailler sur ses maquettes, les soirées à servir des bières ou à refaire le monde avec sa nouvelle meilleure amie. Mais ce que ses camarades d'amphi ne savent pas c'est que certains soirs Raphaëlle se glisse dans les draps d'hôtels parisiens et récolte quelques billets verts. Avec son tout premier roman graphique, Sixtine Dano crée la surprise. Avec l'élégance de l'encre et du fusain elle dépeint les questions existentielles du passage de l'enfance à l'âge adulte, l'exploration de la féminité et des rapports de pouvoir dans une société marquée par le patriarcat et le capitalisme. Au scénario et au dessin la jeune artiste signe un récit terriblement moderne, à la fois intime et politique : une pépite graphique réussie à ne pas manquer.",isbn:"9782344060049",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344060049-M.jpg"},
  {t:"Hulda",a:"Jónasson Ragnar",y:"2026",ed:"La Martinière",cote:"R JON",pub:"Adulte",sup:"Imprimé",d:"Un soir de novembre 1980, un ours en peluche refait surface dans un pavillon de chasse du nord islandais. Ce simple jouet pourrait être la clé d'un mystère volontairement enfoui : une disparition d'enfant vieille de vingt ans, jamais élucidée. La jeune inspectrice Hulda Hermannsdóttir est envoyée dans cette vallée isolée. Dans un paysage hivernal hostile, Hulda affronte les silences d'un village replié sur lui-même, en même temps que la poursuivent les fantômes de sa propre vie.",isbn:"9791040123989",extraUrl:"https://covers.openlibrary.org/b/isbn/9791040123989-M.jpg"},
  {t:"Il faudrait leur dire",a:"Ponte Carène",y:"2026",ed:"Fleuve éditions",cote:"R PON",pub:"Adulte",sup:"Imprimé",d:"Six amis viennent d'avoir leur bac. Lors de leur dernière soirée ensemble, ils se font la promesse de se revoir, quoiqu'il arrive, tous les cinq ans. Ils vont tenir cette promesse, mais rien ne sera simple, parce que la vie ne l'est pas... Une histoire d'amitié à l'épreuve du temps et de la vie.",isbn:"9782265158931",extraUrl:"https://covers.openlibrary.org/b/isbn/9782265158931-M.jpg"},
  {t:"Cathédrale",a:"Noui Tarik",y:"2026",ed:"Actes Sud",cote:"R NOU",pub:"Adulte",sup:"Imprimé",d:"Une nuit, dans la cité déchue d'Enoch, un garçon noir issu des quartiers miséreux est pris pour cible par la police. Corban Khôl ne souhaitait pourtant qu'une chose : découvrir la construction en cours de \"la plus grande cathédrale du monde\". Quelques mois plus tard, alors que des nuées de corneilles se sont abattues sur les rues, Sarah Stavisky, une jeune étudiante a priori sans histoires, disparaît. Jonathan Lamm, affecté à l'enquête, sait qu'il doit faire vite : semant des cadavres sur son passage, la pègre pourrait bien être elle aussi à la recherche du coupable... Tarik Noui signe ici un grand roman noir sur une humanité qui contemple sa propre fin et tente à toute force d'y échapper. Entre ténèbres et éclat, au coeur d'une ville qui dévore ses enfants : un lieu en devenir où tous pourront réclamer leur part de pardon. Mais, en enfer, rares sont les innocents, et rares ceux qui n'obéissent qu'à une seule loi.",isbn:"9782330215880",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330215880-M.jpg"},
  {t:"Le sixième sens",a:"Santos José Rodrigues dos",y:"2026",ed:"Éditions Hervé Chopin",cote:"R SAN",pub:"Adulte",sup:"Imprimé",d:"\"Le divin qui est en nous\". Un homme tombe du dixième étage d'un hôtel à Lisbonne. Dans ses derniers instants, il murmure des mots mystérieux : \" UNIO MYSTICA... MISTERIUM TREMENDUM \". Accident, suicide ou homicide ? La police judiciaire trouve dans la chambre de Kurt Weilmann un dernier message avec un nom : Tomás Noronha. L'historien est convoqué pour clarifier son implication dans cette mort. Au cours de l'enquête, la CIA avertit Tomás : sa vie est en danger. Pour se sauver, l'historien devra percer le mystère de cette mort. C'est ainsi que commence une quête qui pousse Tomás Noronha à s'intéresser aux secrets de substances thérapeutiques aux propriétés miraculeuses. On les appelle enthéogènes, expression grecque signifiant... LE DIVIN EN NOUS. Basé sur des découvertes scientifiques actuellement étudiées par les plus grandes institutions scientifiques du monde, Le Sixième Sens nous montre ce que les enthéogènes (plus connus sous le nom de LSD) ont commencé à révéler sur les plus grands mystères de l'univers, notamment le mystère de la mort et le sens de la vie.",isbn:"9782357209794",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357209794-M.jpg"},
  {t:"Lady Nazca",a:"Delestret Nicolas",y:"2026",ed:"Bamboo Edition",cote:"BD DEL",pub:"Adulte",sup:"Imprimé",d:"Dans le désert de Nazca, elle va trouver bien plus que le secret des lignes millénaires : elle va se trouver elle-même. Pérou, 1935. Maria, jeune expatriée allemande, mène une vie paisible à Lima avec Amy, sa compagne. Elle ne se doute pas qu'en suivant l'archéologue américain Paul Kosok, sa vie va basculer. Dans le désert, elle découvre d'immenses figures tracées dans le sol : les lignes de Nazca. Convaincue qu'il s'agit d'un trésor unique, la jeune femme se lance dans une incroyable aventure scientifique, humaine et spirituelle. Entre découvertes, obstacles et choix personnels, elle devra faire face à de nombreux défis... et apprendre à suivre sa propre voie \"Librement inspiré du film de Damien Dorsaz\"",isbn:"9782818999219",extraUrl:"https://covers.openlibrary.org/b/isbn/9782818999219-M.jpg"},
  {t:"Sanglillon",a:"Baer Julien",y:"2026",ed:"Kaléidoscope",cote:"A BAE",pub:"Jeunesse",sup:"Imprimé",d:"Sanglillon n'a pas une vie facile : il récure, cuisine, astique du matin au soir pendant que ses chipies de soeurs se prélassent. Jusqu'au jour où le bal royal est annoncé. Et si, pour une fois, c'était à son tour de briller ? Une version poilue et déjantée de Cendrillon, où le héros ne se laisse pas marcher sur les sabots !",isbn:"9782378883287",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782378883287-475x500-1.jpg"},
  {t:"Teruko & Loui",a:"Inoue Areno",y:"2026",ed:"Philippe Picquier",cote:"R INO",pub:"Adulte",sup:"Imprimé",d:"Elles s'appellent Teruko et Loui et sont les meilleures amies du monde. A 70 ans, elles entreprennent une grande évasion du foyer conjugal et d'un foyer pour seniors : une équipée de rêve et sans le sou à travers le Japon dans de grands éclats de rire à répétition. Loui, dans sa robe panthère et sous sa doudoune fluo, gagne sa vie en chantant des chansons françaises dans les bars, et Teruko, qui se dit volontiers mamie mauvais genre, exerce son talent de \"divination par les cartes\" dans des petits cafés. Leur nouvelle vie démarre vent arrière, pleines voiles. Teruko et Loui, c'est avant tout une grande histoire d'amitié, des instants poétiques et des rêveries partagées, une exaltation devant ce qu'est la vie. A tour de rôle, elles sont l'une et l'autre sages ou fantasques, impertinentes ou allègres, la bouteille de whisky dans une main et le bâton de rouge à lèvres dans l'autre. Toutes deux prétendent avoir la vie devant elles et se lancent aussi bien dans des déclarations d'amour que dans des folies culinaires pour la préparation d'un dîner de Noël improvisé, dans le brouhaha de toutes les voix de leurs nouveaux amis. Pour tout dire, elles sèment autour d'elles joies et excentricités et un goût immodéré de la vie.",isbn:"9782809717402",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809717402-M.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2025",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeunesse",sup:"Imprimé",d:"Le monde est anéanti... Partons le visiter à moto ! Un avion de chasse a fait irruption dans le ciel de Nagaoka. Désireuses de faire connaissance avec son mystérieux pilote, Yôko et Airi entreprennent de se rendre à la base aérienne de Misawa dans le département d'Aomori, où l'avion est censé atterrir. Elles en profiteront pour visiter la région du Tôhoku, en faisant halte successivement à Yamagata, Sendai, Morioka et Akita.",isbn:"9791041116263",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041116263-M.jpg"},
  {t:"Elle dévore la nuit",a:"Liu Marjorie M.",y:"2024",ed:"Delcourt",cote:"BD LIU",pub:"Adulte",sup:"Imprimé",d:"Milly et Billy, deux jumeaux sino-américains, reçoivent la visite de leurs parents Ipo et Keon. Alors que leur mère, Ipo, décide d'emmener les jumeaux nettoyer le jardin de la terrifiante maison voisine à la leur, d'étranges événements surviennent...",isbn:"9782413078449",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413078449-M.jpg"},
  {t:"Soul Land",a:"Tang Jia San Shao",y:"2022",ed:"Nazca",cote:"BD SOU",pub:"Jeunesse",sup:"Imprimé",d:"Manga couleur qui se lit dans le sens de lecture occidentale. L'histoire suit une équipe de 7 personnages qui vont ensemble affronter l'adversité et essayer de changer leur monde. A l'intérieur du groupe s'entremêleront des romances et des découvertes troublantes.",isbn:"9782902487646",extraUrl:"https://covers.openlibrary.org/b/isbn/9782902487646-M.jpg"},
  {t:"Capricieuse",a:"Fontanel Béatrice",y:"2019",ed:"L'Etagère du bas",cote:"A FON",pub:"Jeunesse",sup:"Imprimé",d:"Capricieuse, une petite fille plutôt mal élevée, se retrouve parachutée dans le monde des animaux et autres insectes de la forêt. Enfant autoritaire et impatiente, elle va devoir ralentir la cadence à cause d'une blessure au pied et se déplacer à dos de tortue. Ce rythme modéré va l'amener à observer davantage tout ce qui l'entoure... c'est le début de bien des aventures !",isbn:"9782490253159",extraUrl:"https://static.wixstatic.com/media/b71342_4a5c6216edc34d6f8ed28d20b081c3ba~mv2_d_1662_2320_s_2.png/v1/fill/w_358,h_488,al_c,q_85,usm_0.66_1.00_0.01/Capricieuse-couverture.webp"},
  {t:"L'ultime porte",a:"Giacometti Éric",y:"2026",ed:"Jean-Claude Lattès",cote:"R GIA",pub:"Adulte",sup:"Imprimé",d:"Paris 1810, Venise de nos jours, la conspiration n'a jamais cessé. A vous d'ouvrir la porte du paradis... ou de l'enfer. De Napoléon, fasciné par les mystères de l'Egypte antique, aux sociétés secrètes qui hantent Venise, suivez Antoine Marcas dans son enquête la plus initiatique. Eric Giacometti et Jacques Ravenne, qui ont déjà fasciné plus de 3 millions de lecteurs, nous entraînent dans une nouvelle aventure de leur héros culte Marcas.",isbn:"9782709672665",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709672665-M.jpg"},
  {t:"Minorque",a:"",y:"2025",ed:"Michelin",cote:"914.675 MIN",pub:"Adulte",sup:"Imprimé",d:"Le guide de toutes les cultures. Les clés pour apprécier le patrimoine, la gastronomie, la vie locale. Laissez-vous guider... Notre sélection de sites étoilés de + à +++. Les conseils pratiques et les bons plans dénichés sur place par nos auteurs. Découvrez nos 120 adresses pour : se restaurer, prendre un verre, faire du shopping, sortir, se loger.",isbn:"9782067267411",extraUrl:"https://covers.openlibrary.org/b/isbn/9782067267411-M.jpg"},
  {t:"La sainte patronne des menteuses",a:"Patchett Ann",y:"2026",ed:"Actes Sud",cote:"R PAT",pub:"Adulte",sup:"Imprimé",d:"Rose a tout laissé derrière elle. Elle a fui la Californie et son mari sans rien lui révéler de sa grossesse, et se rend dans le Kentucky, à Sainte-Elisabeth, un refuge pour femmes enceintes souhaitant accoucher dans l'anonymat. Dans l'effervescence silencieuse de cette communauté, Rose se lie d'amitié avec soeur Evangeline et Son, le gardien du domaine. Alors que la règle impose d'abandonner son bébé pour reprendre le cours d'une vie normale, Rose fait finalement un choix impensable : elle décide de garder sa fille, Cecilia, et d'épouser Son pour s'ancrer définitivement à Sainte-Elisabeth, tout en cachant à son nouveau mari les raisons réelles de sa fuite. Mais peut-on bâtir une existence entière sur une imposture ? Des années plus tard, c'est à travers les yeux de Cecilia que se dévoilent les secrets d'une mère prête à se dérober au premier signe de menace. Premier roman d'Ann Patchett, cette saga bouleversante explore avec grâce la maternité, le poids des silences et la force des liens que l'on choisit de tisser au mépris des conventions.",isbn:"9782330221492",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330221492-M.jpg"},
  {t:"Un doux pardon",a:"Spielman Lori Nelson",y:"2016",ed:"Pocket",cote:"R SPI",pub:"Adulte",sup:"Imprimé",d:"Il suffit parfois d'une simple pierre pour faire basculer le destin. Une simple pierre ou plutôt deux, arrivées par la poste. Hannah Farr, animatrice télé en plein flottement tant professionnel qu'amoureux, se trouve ainsi face à un choix. Renvoyer l'une de ces pierres à celle qui la martyrisa enfant, c'est lui accorder son pardon. Mais à qui adresser la seconde, censée perpétuer la chaîne ? S'il est facile de pardonner, demander des excuses peut à jamais changer le cours d'une vie... \" Un roman exquis, qui donne la pêche ! \" Femme actuelle \" Un délicieux moment de lecture. \" Metronews",isbn:"9782266260138",extraUrl:"https://covers.openlibrary.org/b/isbn/9782266260138-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé pour n'accueillir que des cancres,   a tissé des liens avec Kaoruko Waguri, qui fréquente l'établissement des filles de bonne famille,   Kikyô. Malgré tout un monde qui les sépare, les deux jeunes trouvent une forme de réconfort dans les moments passés l'un avec l'autre.  Mais si la distance entre Rintarô et Kaoruko se réduit peu à peu, le mur entre leurs deux lycées demeure, et Rintarô se garde toujours de parler de cette relation à ses amis, ce qui finit par créer un malentendu entre eux...  Un soir après les cours, alors qu'il avait pris son courage à deux mains pour proposer à Kaoruko et son amie Subaru de se voir, une bande de lycéens vient le provoquer. Comment réussir à éviter la menace d'une bagarre ou pire... qu'ils s'en prennent aux filles?Roméo & Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions!",isbn:"9782373499773",extraUrl:"https://covers.openlibrary.org/b/isbn/9782373499773-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève du lycée Chidori qui rassemble des garçons au plus bas de l échelle scolaire, fait un jour la connaissance de Kaoruko Waguri, qui fréquente l établissement des filles de bonne famille, Kikyô.  Alors que Rintarô trouve un certain réconfort dans les moments passés avec la jeune fille, il restait préoccupé par le fossé entre leurs deux écoles, avant de finalement décider de présenter Kaoruko et Subaru à ses amis.  À partir de ce jour, de bonnes relations s installent petit à petit entre les six jeunes, et notre héros commence à s'ouvrir davantage à son entourage.  Invitant ses amis chez lui, il leur livre un récit de son enfance et leurs liens s'approfondissent.  Si sa mère se retrouve chamboulée par ces souvenirs et l évolution de son fils, de son côté, Rintarô s apprête à vivre un été sous le signe de la jeunesse et de l'amitié en compagnie de ses camarades !Un récit de jeunesse entre deux adolescents que tout oppose& et pourtant si proches.",isbn:"9782384963904",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963904-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n accueillir que des cancres, s est rapproché de Kaoruko Waguri, qui fréquente unétablissement pour filles de bonne famille, Kikyô.Les vacances d été commencent, l occasion propice pour passer du temps entre amis. Mais, prenant conscience de ses sentiments à l égard de la jeune fille, Rintarô perd ses moyens lorsqu il apprend que l anniversaire de Kaoruko approche à grands pas. Après des heures de réflexion, il décide de lui préparer un gâteau pour exprimer sa gratitude. Kaoruko saura-t-elle apprécier ce cadeau empreint desincérité ?Roméo et Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d émotions !",isbn:"9782384963911",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963911-M.jpg"},
  {t:"Réha",a:"Ogaki Philippe",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Ils sont six ! Six héros pourvus d'armes sacrées, six héritiers des plus grands héros antiques. Leur mission : sauver notre monde ! On les appelle... les Mythics.",isbn:"9782413085126",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782413085126-475x500-1.jpg"},
  {t:"Le gardien de la forêt",a:"Di Gregorio Giovanni",y:"2025",ed:"Dupuis",cote:"BDJ DIG",pub:"Jeunesse",sup:"Imprimé",d:"Quelque chose se cache au fond des bois. Quelque chose qui dort sous les feuilles sèches, enveloppé par les murmures du vent... et que les Grémillet s'apprêtent à réveiller, alors qu'elles découvrent la gare désaffectée où leur mère passait ses étés lorsqu'elle était jeune. Entre légendes anciennes, amours oubliées et un mystérieux enfant sans nom, les trois soeurs devront résoudre une énigme resurgie des brumes du passé. Mais cette fois, elles ne seront pas seules, le gardien de la forêt surveille chacun de leurs pas. Est-il hostile ou bienveillant ? Va-t-il les empêcher de mener leur enquête ? Mais la véritable épreuve qui les attend sera d'une toute autre nature...",isbn:"9782808510462",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782808510462-475x500-1.jpg"},
  {t:"HONG KONG",a:"Ogaki Philippe",y:"2019",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Deux voleurs travaillant pour un receleur dérobent la tête de l'un des fameux soldats de la grande armée de terre cuite qui protège la tombe de Qin Shi Huang, premier empereur de Chine. Le fantôme de ce dernier est réveillé par le Mal. En quête d'alliés, il a besoin de l'empereur pour libérer le Chaos et accentuer sa domination sur le Monde. Mais les choses ne se passent pas comme il l'a prévu...",isbn:"9782413013082",extraUrl:"https://images.epagine.fr/082/9782413013082_1_m.jpg"},
  {t:"Un couple sulfureux",a:"Bonneau Daniel",y:"2026",ed:"Plon",cote:"B BON",pub:"Adulte",sup:"Imprimé",d:"L'histoire fascinante des Morand, le couple le plus sulfureux de la littérature française. Hélène et Paul Morand, le couple le plus sulfureux de la littérature française. Lui, l'écrivain vedette des Années folles, tombé un temps dans l'oubli pour avoir choisi le mauvais côté de l'Histoire. Elle, la muse diabolique, accusée d'être à l'origine des dérives de son mari. Pour la première fois, ce livre dévoile la vérité d'Hélène et son importance capitale dans l'oeuvre de celui dont L. F. Céline disait qu'il était \" le premier qui ait jazzé la langue française \". Enfant de l'Empire d'Orient et de la Mitteleuropa, Hélène a fasciné ses contemporains. Elle parlait sept langues, sa culture était immense, sa repartie cinglante. Combien de femmes ont été l'inspiratrice de Proust, l'amie de Cocteau et ont ébloui Ernst Jünger ? Suivre ce couple mythique, c'est vivre au rythme haletant de l'histoire du XXe siècle. Connaître la magnificence et la chute. Traverser un échange virevoltant où se côtoient le meilleur de la langue et le pire des idées. Ce livre est à la fois l'histoire d'un écrivain, d'une femme, d'un amour et d'un siècle. Avec en arrière-plan, omniprésente, la littérature, la grande affaire de leur vie.",isbn:"9782259321235",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259321235-M.jpg"},
  {t:"Schmoof le Chien",a:"McKinnon Heidi",y:"2026",ed:"Editions L'Elan vert",cote:"A MCK",pub:"Jeunesse",sup:"Imprimé",d:"Schmoof est doux. Schmoof est le plus doux, câlin, mignon des toutous ! Schmoof a hâte de se faire un ami. Et Floof ?",isbn:"9782844559227",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782844559227-475x500-1.jpg"},
  {t:"Vivement ce soir !",a:"Lili la Baleine",y:"2026",ed:"Editions Casterman",cote:"A LIL",pub:"Jeunesse",sup:"Imprimé",d:"Un premier album sur le temps qui passe, pour aider les petits à patienter. Prune, Pablo et Oscar arriveront ce soir. Mais pour l'instant, le ciel est bleu et ce petit garçon doit attendre encore un peu. Attendre ? Quelle drôle d'histoire ! C'est long et ennuyeux. Heureusement, la neige est là, dans le jardin, pour jouer et patienter. Tiens, un bruit... il fait bientôt nuit. Les voilà ! Pour éveiller les sens des tout-petits, dès la naissance. Pour un moment de partage intense entre l'adulte et l'enfant grâce aux premières histoires lues avec bébé contre soi. Lili La Baleine, qui a illustré de nombreux textes, nous propose son tout premier texte qu'elle a écrit avec beaucoup d'amour pour les bébés.",isbn:"9782203302303",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203302303-475x500-1.jpg"},
  {t:"Femmes sur fond azur",a:"Thomas Chantal",y:"2026",ed:"Seuil",cote:"R THO",pub:"Adulte",sup:"Imprimé",d:"Six vies, différentes et reliées. Six expériences de la liberté ouvertement ou secrètement revendiquée contre les impératifs de l'époque. Sophie Cruvelli vicomtesse Vigier, la reine Victoria, Marie Bashkirtseff, Katherine Mansfield, Colette, Jackie... Une cantatrice, une reine, une artiste, deux écrivaines, une jeune veuve et ses deux enfants, dont l'autrice. Autant de femmes dont la découverte de la Méditerranée a modifié le destin. Elles ont en commun d'avoir vécu la Côte d'Azur comme un lieu de respiration, de désir, d'échappement et d'accomplissement. Chantal Thomas, en une suite de portraits qui saisit la singularité de chacune, nous invite à une sensuelle réflexion sur le corps féminin, sur l'effort magnifique de \"ne pas se laisser voler sa vie\", comme disait Rimbaud. Son écriture est portée par une formidable capacité à redonner souffle, ce qu'on appelle l'enthousiasme. Avec empathie, érudition et une énergie romanesque très personnelle, elle défait le corset des interdits et nous fait partager la merveilleuse, mystérieuse et revigorante rencontre avec le bleu du ciel et de la mer. Elle nous offre la joie.",isbn:"9782021601275",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021601275-M.jpg"},
  {t:"Le Somnambule",a:"Kepler Lars",y:"2026",ed:"Actes Sud",cote:"R KEP",pub:"Adulte",sup:"Imprimé",d:"Une nuit d'hiver, la police reçoit un appel. Un cambriolage est signalé dans un camping désert aux abords de Stockholm. A l'intérieur d'une caravane, ils découvrent l'indicible : un bain de sang, une hache, un corps réduit en morceaux... et, dans la pièce voisine, un adolescent endormi, un bras sectionné en guise d'oreiller. Le garçon s'appelle Hugo Sand. Il a dix-sept ans. Il souffre d'un trouble du sommeil rare - un somnambulisme qui se déclenche au coeur de ses pires cauchemars. Au réveil, il ne se souvient de rien. Coupable ou simple témoin ? L'inspecteur Joona Linna doit faire appel à son ami hypnotiseur, Erik Maria Bark, pour chercher la vérité enfouie dans les méandres de ces terreurs nocturnes. Mais la nuit, elle, n'oublie rien, et réclame son dû. Thriller de l'ombre et du vertige, \"Le Somnambule\" explore la frontière mouvante entre rêve et souvenir, déni et innocence.",isbn:"9782330218348",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330218348-M.jpg"},
  {t:"Neige d'acier",a:"Repos Sylvain",y:"2023",ed:"Dargaud",cote:"BD REP",pub:"Adulte",sup:"Imprimé",d:"Affaiblis et usés par leurs précédents combats, Hiro et ses Yojimbots sont en mauvaise posture. Isolés et acculés par Topu et surtout par le redoutable Kozuki, transformé en cyborg léthal, Hiro et sa troupe cherchent un moyen de quitter l'île. Pris au piège dans une zone portuaire, attaqués par Kozuki et son armada, Hiro et les Yojimbots livrent une défense désespérée. Mais le jeune garçon est gravement blessé et laissé pour mort alors que la zone s'apprête à exploser...",isbn:"9782205206234",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205206234-M.jpg"},
  {t:"L'art du profit",a:"Duarte Carlos Rafael",y:"2026",ed:"Le Lombard",cote:"BD DUA",pub:"Adulte",sup:"Imprimé",d:"I.R.S. Internal Revenue Service, l'organe de perception des impôts aux Etars-Unis. Agent spécial de l'I.R.S., Larry 6 Max est détaché aux affaires les plus sensibles. OPA, pétrole, corruption. Il dispose de tous les moyens. Il est en première ligne. En guerre contre l'argent noir et les fraudes les plus criminelles !",isbn:"9782808217798",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808217798-M.jpg"},
  {t:"J'ai toujours rêvé d'être un fermier",a:"Harambat, Jean",y:"2026",ed:"Charivari",cote:"BD HAR",pub:"Adulte",sup:"Imprimé",d:"Et si fermier était le métier des derniers aventuriers ? Jean Harambat retape une ferme gasconne plusieurs fois centenaire, h un jet de pierre de celle de son enfance. D'instants contemplatifs en dialogues taiseux avec son père, il raconte son attachement h la terre de ses cieux. Sous son trait, le quotidien rural devient une odyssée, un western, d'ailleurs on y croise Ulysse et Yul Brynner. Avec poésie et humour, Jean Harambat évoque les gestes de la vie paysanne et leur transmission. Et prend conscience que le dessin est, chez lui, un prolongement de cet héritage \"Nous comprenons le monde en le manipulant\".",isbn:"9782487663329",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487663329-M.jpg"},
  {t:"1986, le voyage perdu",a:"Peyrin Laurence",y:"2026",ed:"Calmann-Lévy",cote:"R PEY",pub:"Adulte",sup:"Imprimé",d:"Key West, 1986. Dans ce décor du bout du monde noyé de soleil et d'océan, Freya et Danii ont quasiment grandi ensemble. Les deux jeunes filles se ressemblent peu, l'une est aussi réservée que l'autre est flamboyante, et pourtant leur amitié est fusionnelle. Pour leurs vingt ans, Freya la raisonnable se laisse convaincre par Danii de partir dans un road trip à travers la Floride. Destination Cap Canaveral et le décollage de la navette Challenger, symbole de liberté, d'espoir et de dépassement. Cheveux au vent et Madonna en bande-son, les deux amies s'élancent sur la mythique Overseas Highway, cette route suspendue au-dessus des eaux turquoise. Une aventure qui va les entraîner bien plus loin que prévu, car l'explosion de Challenger n'est pas la tempête la plus violente qu'elles subiront. Les secrets de famille vont se fissurer, la loyauté vaciller, l'enfance s'éloigner... Et l'amour tout bouleverser",isbn:"9782702184240",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702184240-M.jpg"},
  {t:"La mort en miroir",a:"Rostagnat Pétronille",y:"2026",ed:"Belladone",cote:"R ROS",pub:"Adulte",sup:"Imprimé",d:"Lucie est persuadée d'avoir coché toutes les cases d'une vie réussie. Mère au foyer, femme d'un médecin légiste renommé, propriétaire d'une maison confortable près de Paris, elle enchaîne dîners mondains et vacances à l'étranger. Mais le jour où son mari, Bertrand, perd la mémoire à la suite d'un accident de voiture, tout bascule. Si la thèse d'une tentative de suicide est privilégiée, Lucie n'en croit rien et décide de mener elle-même l'enquête. Jusqu'au moment où la découverte d'un cadavre vient remettre en question toutes ses certitudes. Car ce cadavre ressemble trait pour trait à Bertrand. Qui est cet homme ? Que s'est-il passé le soir de l'accident ?",isbn:"9782488853002",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488853002-M.jpg"},
  {t:"Magimage",a:"Albon Lucie",y:"2025",ed:"Thierry Magnier",cote:"A THI",pub:"Jeunesse",sup:"Imprimé",d:"Ce livre est vraiment magique : il transforme les images grâce à un simple miroir. Et voici comment un panier de fruits se transforme soudain... en glace !",isbn:"9791035208523",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035208523-475x500-1.jpg"},
  {t:"Ouvre cette porte !",a:"Robert Yannick",y:"2026",ed:"Albin Michel",cote:"A ROB",pub:"Jeunesse",sup:"Imprimé",d:"C'est toujours la même histoire avec le loup : c'est lui qui décide ! Pourtant, cette fois-ci, il a beau supplier, ruser, menacer... rien n'y fait. Mais qui peut bien se cacher derrière la porte ? !",isbn:"9782226503848",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226503848-475x500-1.jpg"},
  {t:"Un jour sans femme",a:"Colombani Laetitia",y:"2026",ed:"Iconoclaste (l')",cote:"R COL",pub:"Adulte",sup:"Imprimé",d:"Islande. A la mort de sa meilleure amie, tuée par son compagnon, Katla se lance un défi inédit : organiser une grève des femmes dans le monde entier, pour dénoncer les violences et les inégalités. Japon. Michiko, jeune salariée enceinte, est harcelée par son patron. Salvador. Ana María, ouvrière à l'usine, se bat pour sa fille, condamnée à trente ans de prison pour suspicion d'avortement. Sénégal. Hawa, urgentiste, tente de sauver une enfant quand le trauma de son passé ressurgit. Katla, Michiko, Ana María et Hawa ne se connaissent pas, mais toutes décident de dire non. Elles étaient seules, elles seront des millions. Sans les femmes, le monde s'arrêtera-t-il de tourner ? Et s'il suffisait d'un jour pour tout changer ?",isbn:"9782378804978",extraUrl:"https://covers.openlibrary.org/b/isbn/9782378804978-M.jpg"},
  {t:"L'éternité ne dure qu'un temps",a:"Sobral Patrick",y:"2013",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Dans ce nouvel épisode, Gryf est confronté à un choix cornélien : sauver celle qu'il aime ou sauver la race humaine de l'extinction.",isbn:"9782756032634",extraUrl:"https://www.bedetheque.com/media/Couvertures/Couv_199456.jpg"},
  {t:"La chute de l'ordre",a:"Whyte Jack",y:"2020",ed:"Bragelonne",cote:"R WHY",pub:"Adulte",sup:"Imprimé",d:"Octobre 1307. Le roi Philippe IV fait arrêter tous les Templiers de France et saisit leurs biens avec l'aide du pape. William St. Clair réussit de justesse à s'échapper. Fuyant le pays en compagnie de quelques centaines de frères d'armes, il emporte le trésor de l'ordre. Face à cette traîtrise de la couronne, le chevalier décide qu'il est temps d'abandonner le passé : il libère ses hommes de leurs voeux d'obéissance à la papauté et les mène une dernière fois au combat lors de la bataille de Bannockburn. Une fois la victoire assurée, William et les survivants de l'ordre quittent l'Europe pour une terre de légendes : l'Amérique...",isbn:"9791028107536",extraUrl:"https://covers.openlibrary.org/b/isbn/9791028107536-M.jpg"},
  {t:"Une unique lueur",a:"Vargas Fred",y:"2026",ed:"Flammarion",cote:"R VAR",pub:"Adulte",sup:"Imprimé",d:"- Vous avez regarde les photos, Danglard ? De la scène du crime ? demanda Adamsberg. - Cela va de soi. - Et donc ? Cela vous dit quelque chose ? Parce qu'à moi, oui. - Tiens. Et cela vous raconte quoi ? - Mais justement, rien. C'est quelque chose que je ne sais pas alors que cela me dit quelque chose. Donc ? - Aucune idée. - Faites un effort, nom d'un chien. - Désolé, commissaire, dit Danglard avec une pointe d'indifférence. - Bien. Réunion plénière dans quinze minutes. Il nous faut comprendre. - Comprendre quoi ? - Mais le quelque chose, commandant. On commence par là.",isbn:"9782080160713",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080160713-M.jpg"},
  {t:"Edmond gros mouton",a:"Mallié Vincent",y:"2026",ed:"Editions Margot",cote:"A MAL",pub:"Jeunesse",sup:"Imprimé",d:"Alors qu'il gambade derrière un papillon, Edmond se perd dans la montagne. Sans personne pour le tondre, sa laine POUSSE, POUSSE, POUSSE, et il finit par ressembler à une ENORME boule de coton ! Se faisant passer pour de gentils bergers, le loup, le renard et l'aigle vont essayer de le CROQUER. Mais ce mouton n'est pas une proie si facile...",isbn:"9782494797567",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494797567-475x500-1.jpg"},
  {t:"Créer sa boîte pour les Nuls",a:"Percin Laurence de",y:"2026",ed:"First Editions",cote:"658.11 PER",pub:"Adulte",sup:"Imprimé",d:"Lancez votre petite entreprise ! Dans cette nouvelle édition entièrement mise à jour, vous trouverez tous les conseils pour mettre votre produit au point et cerner votre marché, des explications pour comprendre les différentes formes d'entreprises, des stratégies infaillibles pour séduire les investisseurs, des méthodes de gestion éprouvées pour affronter les difficultés, ainsi que des outils pour maîtriser la comptabilité et vous ouvrir la voie du succès.",isbn:"9782412106310",extraUrl:"https://covers.openlibrary.org/b/isbn/9782412106310-M.jpg"},
  {t:"La tour des mensonges",a:"Sobral Patrick",y:"2024",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Les Légendaires Résistance démarre 20 ans après le grand cycle des Légendaires. Le monde a vécu de belles années de paix mais aujourd'hui les descendants de nos héros doivent reprendre les armes pour défendre Alysia ! La lutte contre les Célestes continue. Malgré les soins de Toopie, Eloa détient toujours les pouvoirs du Dieu-Roi Akamandis. A terme, ceux-ci pourraient bien détruire tout Alysia... Nos héros ont besoin du peuple elfique pour la sauver. Seul obstacle : la tour de Fatamorgana, forteresse imprenable et meurtrière, qu'il leur faudra détruire pour accéder au monde des Elfes...",isbn:"9782413083139",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413083139-475x500-1.jpg"},
  {t:"De l'autre côté de l'Arc-en-ciel",a:"Blue Beatrice",y:"2026",ed:"Little urban",cote:"A BLU",pub:"Jeunesse",sup:"Imprimé",d:"Elio n'aime pas le changement. Il ne quitte presque jamais le calme rassurant de sa chambre. Jusqu'au jour où il rencontre une petite flamme qui lui fait découvrir les merveilles de la nature et l'incite à s'ouvrir au monde extérieur. Une histoire MAGIQUE au rythme des saisons pour voir la vie du bon côté.",isbn:"9782374082288",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782374082288-475x500-1.jpg"},
  {t:"L'autre moi",a:"Thilliez Franck",y:"2026",ed:"Fleuve Noir",cote:"R THI",pub:"Adulte",sup:"Imprimé",d:"Ici, le cauchemar commence. Longepin. Un endroit niché au coeur de la forêt de la Grande Chartreuse. Un site sur lequel militaires et civils travaillent à des projets classés secret-défense. Un cadre de vie d'exception, mais ultra-surveillé et régi par des règles étranges. Sibylle vient d'arriver avec son compagnon, Erwann. Docteur en neurosciences, celui-ci a vu la possibilité d'intégrer cette communauté comme la chance de sa carrière. Comme un espoir, aussi, que là-bas des confrères parviennent à aider celle qu'il aime. Car Sibylle, depuis l'accident qui a coûté la vie à son enfant et lui a valu une douloureuse reconstruction du visage, n'est plus la même. Elle souffre d'une amnésie post-traumatique et est sujette à des cauchemars aussi intenses que troublants, au point de ne plus toujours savoir distinguer le rêve de la réalité...",isbn:"9782265159075",extraUrl:"https://covers.openlibrary.org/b/isbn/9782265159075-M.jpg"},
  {t:"Sous le soleil exactement",a:"Multon Anne-Fleur",y:"2026",ed:"Poulpe fictions",cote:"J MUL",pub:"Jeunesse",sup:"Imprimé",d:"Ingrédients pour des vacances survoltées : prenez quatre copines à l'imagination débridée et invitez-les dans un grand manoir mystérieux. Ajoutez un tableau intriguant, des rencontres surprenantes, une bonne dose de curiosité et une chaîne YouTube pour documenter le tout... Vous obtiendrez une enquête haletante et des aventures délirantes !",isbn:"9782377424597",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782377424597-475x500-1.jpg"},
  {t:"La fin de l'histoire ?",a:"Sobral Patrick",y:"2015",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"C'est l'énigmatique Kalandre qui, depuis le début de la série, provoque et manipule le destin de nos Légendaires. Ce tome 18 sera un épisode éprouvant, dramatique, qui verra les Légendaires malmenés dans leurs corps et dans leurs cœurs comme jamais ils ne l'ont été. Le final sera apocalyptique et meurtrier mais, tel le phénix, ce sera pour mieux faire renaître la série ensuite.",isbn:"9782756053578",extraUrl:"https://www.bedetheque.com/cache/thb_couv/Couv_256882.jpg"},
  {t:"Bande de compotes !",a:"Mr Tan",y:"2025",ed:"Mr Tan & Co",cote:"BDJ TAN",pub:"Jeunesse",sup:"Imprimé",d:"Mortelle Adèle revient dans un 22e tome de gags, publié chez Mr Tan & Co ! \" Dans la vie, c'est simple, y a deux catégories de gens : les potes, et les compotes ! Laisse-moi t'expliquer comment faire le tri. Tu peux me faire confiance, la vérité sort de la bouche des... BIZARRES ! \" Mortelle Adèle n'aime pas les nazebroques, et encore moins les flagadas du cerveau ! Avec sa nouvelle catapulte, la voilà bien décidée à envoyer sur la lune le premier qui viendra lui casser les pieds ! Alors gare à vous... BANDE DE COMPOTES ! © Mr Tan et Diane Le Feyer d'après l'oeuvre créée par Mr Tan et Miss Prickly © Mr Tan & Co",isbn:"9782494678378",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782494678378-475x500-1.jpg"},
  {t:"Le pégase",a:"Chamblain Joris",y:"2026",ed:"Editions de la Gouttière",cote:"BDJ CHA",pub:"Jeunesse",sup:"Imprimé",d:"Caché au coeur d'un Muséum d'histoire Naturelle se trouve le cabinet d'Enola, une vétérinaire hors du commun. Sa spécialité ? Les animaux des contes et légendes ! Centaures, trolls et autres gargouilles n'ont aucun secret pour elle. Avec son compagnon de route Maneki et à l'aide des inventions du génial Archibald, elle parcourt le monde pour soigner les maux des créatures extraordinaires. La petite souris n'est pas passée ? Votre minotaure semble égaré ? Demandez conseil à Enola, elle saura vous aider !",isbn:"9782357961432",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357961432-M.jpg"},
  {t:"La Colline",a:"Beaussault Mathilde",y:"2026",ed:"Seuil",cote:"R BEA",pub:"Adulte",sup:"Imprimé",d:"Un jour d'hiver, dans une cité de Rennes, un nouveau-né est découvert au fond d'un container à ordures. Vivant. Quelques étages plus haut, une jeune fille se vide de son sang. Elle s'appelle Monroe, elle a dix-sept ans. Dans cette chambre où sa mère l'a enfermée, Monroe revit les mois passés sur la colline, chez sa grand-mère Madeleine. Là-haut, le vent, le labeur et le silence façonnent les corps. Auprès de cette vieille femme solitaire aux mains guérisseuses, Monroe, enceinte, a découvert une paix inespérée. Et puis tout s'est écroulé. Monroe s'affaiblit, les policiers enquêtent, les soignants espèrent, les pompiers s'interrogent, la famille se désintègre : durant ces quelques heures d'une intensité foudroyante, chacun mesurera ce qu'il a perdu - ou sauvé - de son humanité.",isbn:"9782021602302",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021602302-M.jpg"},
  {t:"L'homme qui n'avait pas assez d'une vie",a:"Kennedy Douglas",y:"2026",ed:"Belfond",cote:"R KEN",pub:"Adulte",sup:"Imprimé",d:"Il suffit d'une vie pour disparaître, il en faut plusieurs pour trouver la rédemption. Vingt-huit ans après la révélation de L'Homme qui voulait vivre sa vie, Douglas Kennedy nous entraîne dans une course poursuite effrénée à travers les paysages grandioses du Montana, sur les traces d'un homme aux mille visages, insaisissable et désespéré. Depuis le décès brutal de son épouse, Andrew Tarbell aimerait se rapprocher de son fils, Jack, avec qui il entretient une relation difficile. Longtemps à la dérive, le jeune homme s'est reconverti en apprenti journaliste dont Andrew suit assidûment les publications. Or voici que Jack dévoile une enquête sur une affaire de plagiat qui fait les gros titres à Hollywood. Le nom du coupable ? Adam Bradford. Pour Andrew, c'est le choc. Adam est le fils qu'il a abandonné quand il s'appelait encore Ben Bradford et qu'il avait été déclaré mort dans un accident de bateau. Aujourd'hui, la vérité pourrait bien remonter à la surface, brisant non seulement la vie d'Andrew, mais aussi celle de tous ceux qu'il croyait avoir protégés.",isbn:"9782714493217",extraUrl:"https://covers.openlibrary.org/b/isbn/9782714493217-M.jpg"},
  {t:"La petite fille aux allumettes",a:"Andersen Hans Christian",y:"2025",ed:"Albin Michel",cote:"C AND",pub:"Jeunesse",sup:"Imprimé",d:"C'est le tout dernier soir de l'année, celui du Nouvel An. Une petite fille arpente les rues, tête nue, pieds nus. Personne na voulu acheter ses allumettes. Pour se réchauffer, elle les craque une une, et chaque flamme lui procure une vision de bonheur : un festin sublime, un sapin de Noël richement décoré, des bougies qui se transforment en toiles... jusqu'au doux visage de sa grand-mère qui n'est plus.",isbn:"9782226499790",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226499790-475x500-1.jpg"},
  {t:"Sophie Adenot",a:"Dana Marc",y:"2026",ed:"Editions du Rocher",cote:"B ADE",pub:"Adulte",sup:"Imprimé",d:"Au départ de la mission Epsilon, Sophie Adenot est la première Française depuis Claudie Haigneré à intégrer le très fermé corps des astronautes européens, après une sélection titanesque. Parmi 22 500 candidats, cette quadragénaire - officier de l'Année de l'Air et de l'Espace, et pilote d'essai d'hélicoptère - a franchi chaque étape avec détermination. Dans cette biographie passionnante, riche en entretiens exclusifs, archives inédites et témoignages de personnalités de premier plan, Marc Dana dévoile les coulisses du parcours exceptionnel de Sophie Adenot : ses doutes et ses combats, ses mentors, ses missions militaires, sa préparation mentale et ses entraînements, tous les moments clefs qui ont façonné cette astronaute... mais aussi cette femme engagée, inspirante, profondément humaine. Entre récit intime et grande histoire du spatial, ce livre retrace l'ascension d'une figure qui marque déjà son époque, une pionnière qui montre que les étoiles ne sont jamais aussi loin qu'on le croit.",isbn:"9782268112992",extraUrl:"https://covers.openlibrary.org/b/isbn/9782268112992-M.jpg"},
  {t:"Les reines de sang",a:"Blengino Luca",y:"2026",ed:"Delcourt",cote:"BD BLE",pub:"Adulte",sup:"Imprimé",d:"Fin de l'an 54 après J. -C., Claude, quatrième Empereur de Rome, meurt empoisonné à l'âge de 63 ans. La coupable de ce meurtre, Julia Agrippine Mineure, est tout à la fois sa femme et sa nièce ! La dynastie décadente de la famille Julia ne compte plus que deux descendants mâles, prêts à se disputer le trône : Britannicus, frêle fils de Messaline, et le jeune et flamboyant Néron, fils d'Agrippine elle-même. Lorsque le premier succombe à son tour au poison, le second est prêt à prendre la tête de l'Empire. Mais Agrippine a d'autres projets : méfiante envers Néron et son inexpérience, inquiète de l'influence que sa maîtresse Poppée exerce sur lui, et consciente du destin cruel qui l'attend si jamais il pose la couronne de laurier sur sa tête, Agrippine caresse depuis longtemps un rêve impossible... s'emparer pour elle-même de la Ville éternelle, se faire couronner Impératrice et devenir la première femme de Rome à obtenir le pouvoir absolu !",isbn:"9782413087519",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413087519-M.jpg"},
  {t:"La dernière chasse",a:"Franquin André",y:"2026",ed:"Dupuis",cote:"BDJ CED",pub:"Jeunesse",sup:"Imprimé",d:"Ils sont cinq. Les cinq meilleurs chasseurs du monde, envoyés en Palombie par un mystérieux commanditaire avec un objectif : capturer un marsupilami ! Backalive, l'ennemi habituel du Marsu, cette fois accompagné de la terrible Estefania Forbalez, du débonnaire Léon de Bourgogne, du cruel Parhavi et de la jeune Violette Delacourt flanquée de ses drones, va-t-il parvenir à ses fins ? Les chances du Marsu semblent minces, tant ses ennemis sont déterminés et bardés de techniques de chasse imparables. D'autant plus qu'ils sont accompagnés par Tatou, un jeune guide chahuta spécialiste de la jungle et acquis à leur cause (ou pas...). Toujours sous les crayons du légendaire Batem, le Marsupilami revient avec un scénario signé Kid Toussaint (Animal Jack, Magic 7, Elles) accompagné de Ced, le sniper du gag. Un mélange parfait de grande aventure, de frisson, de vertige graphique et d'humour !",isbn:"9791034770830",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9791034770830-475x500-1.jpg"},
  {t:"Mary Cassatt",a:"Gentner Florence",y:"2026",ed:"Fayard",cote:"B CAS",pub:"Adulte",sup:"Imprimé",d:"Mary Cassatt (1844-1926) s'impose comme l'une des grandes figures de l'impressionnisme dans un monde artistique dominé par les hommes. Américaine installée à Paris dès 1874, elle révolutionne la peinture aux côtés de Degas, Monet, Pissarro ou Berthe Morisot, tout en revendiquant la place des femmes artistes. Entre la France et les Etats-Unis, Cassatt joue un rôle décisif : véritable passeuse, elle contribue à faire connaître l'impressionnisme aux collectionneurs américains et participe à l'essor des premières grandes collections d'art de son pays. A l'occasion du centenaire de sa mort, Florence Gentner dresse le portrait inédit d'une pionnière trop longtemps reléguée au second plan. S'appuyant sur un vaste corpus de lettres et de documents d'archives rarement consultés, elle restitue l'itinéraire singulier de Cassatt : ses engagements, ses combats pour la reconnaissance, ses amitiés avec Degas et les impressionnistes, ainsi que sa participation à quatre des expositions du groupe. L'ouvrage montre combien son regard moderne, sensible à la vie quotidienne, aux mères et aux enfants, a profondément marqué l'histoire de l'art. Croisant histoire de l'art et histoire des femmes, cette biographie captivante redonne toute sa place à Mary Cassatt dans l'aventure impressionniste et met en lumière l'influence durable qu'elle a exercée sur les deux rives de l'Atlantique.",isbn:"9782213734279",extraUrl:"https://covers.openlibrary.org/b/isbn/9782213734279-M.jpg"},
  {t:"ChatGPT pour les nuls",a:"Salmandjee Yasmina",y:"2026",ed:"First Editions",cote:"006.3 SAL",pub:"Adulte",sup:"Imprimé",d:"Pour tout savoir sur l'outil d'intelligence artificielle générative dont tout le monde parle et qui est en passe de révolutionner le monde des affaires et de la connaissance. INTRODUCTION A L'INTELLIGENCE ARTIFICIELLE : Pour tout savoir sur l'outil d'intelligence artificielle générative dont tout le monde parle et qui est en passe de révolutionner le monde des affaires et de la connaissance. Vous entendez parler de ChatGPT tous les jours depuis des mois. Cet outil développé par la société OpenAI génère des textes à partir de simples requêtes saisies par l'utilisateur sur tous les sujets possibles, ce qui ouvre des perspectives inédites aussi bien pour transmettre le savoir que pour communiquer. Cet ouvrage pour les Nuls, premier livre en français sur le sujet vous révèle tous les secrets de ChatGPT : comment il fonctionne, comment rédiger les bonnes questions et comment l'intégrer dans votre activité professionnelle. Vous découvrirez également d'autres outils concurrents d'intelligence artificielle générative. POUR TOUT SAVOIR SUR CHATGPT : Ce livre d'informatique pour les Nuls s'adresse à tous ceux qui veulent découvrir l'intelligence artificielle, et apprendre à utiliser ChatGPT. L'intelligence artificielle s'annonce comme la révolution du siècle, et est en passe de transformer la société en profondeur. Que vous soyez néophytes ou passionnés de ce sujet, ChatGPT pour les Nuls vous donnera toutes les clés pour comprendre et devenir un maître des prompts. UTILISEZ CHATGPT DANS LA VIE DE TOUS LES JOURS : Grâce à notre livre d'informatique, vous serez capable de comprendre et d'utiliser ChatGPT dans votre quotidien. Que ce soit lié à votre activité professionnelle, ou simplement dans votre vie personnelle, n'hésitez plus et rejoignez la révolution de l'intelligence artificielle. ChatGPT pour les Nuls balayera toutes les caractéristiques de cette IA générative, de la rédaction du prompt à ses spécificités, et fera de vous un véritable pro de cet outil !",isbn:"9782412107270",extraUrl:"https://covers.openlibrary.org/b/isbn/9782412107270-M.jpg"},
  {t:"Le photographe de l'empereur",a:"Pinard de Puyjoulon Nathalie",y:"2025",ed:"Editions Terres de l'Ouest",cote:"R PUY",pub:"Adulte",sup:"Imprimé",d:"Comment Nathanaël Forestier est-il devenu l’un des plus riches propriétaires de la côte atlantique ? D’Hendaye à Soulac-sur-Mer en passant par Biarritz, Hossegor, ou Arcachon, sa famille collectionne les villas comme d’autres les coquillages. De quoi intriguer le voisinage... Son histoire commence en 1859 lorsque son oncle, photographe parisien renommé, lui demande de le remplacer au pied levé, pour réaliser des portraits de Napoléon III sur la côte basque et dans les Pyrénées. Un crève-cœur pour le jeune passionné de botanique, obligé d’interrompre ses études afin de suivre un empereur qu’il déteste. Son seul désir est de rentrer au plus vite au Muséum national d’histoire naturelle de Paris, mais rien ne va se passer comme prévu ! Plus qu’un roman historique, Le Photographe de l’Empereur est une ode au Sud-Ouest et à ses paysages, de la naissance de la forêt de pins aux premières stations balnéaires, dans les pas d’un amoureux de la nature idéaliste et rebelle, dont les combats préfigurent le monde d’aujourd’hui.",isbn:"9782494231863",extraUrl:"https://covers.openlibrary.org/b/isbn/9782494231863-M.jpg"},
  {t:"Noces de cendre",a:"Calmel Mireille",y:"2026",ed:"XO Editions",cote:"R CAL",pub:"Adulte",sup:"Imprimé",d:"Lorsque le capitaine René de Kerboullart, maître des eaux et des forêts de Rhuys, demande la main de Sigilée, tout en elle s'enflamme. L'homme est aussi séduisant que mystérieux. Il ne réclame pour dot qu'un lopin de terres marécageuses, oubliées de tous ! Un choix étrange. Dans ces terres noyées de brume, les loups ródent. Et, jusque dans les murs de l'abbaye voisine, on murmure qu'un mal ancien s'éveille... Tandis que Sigilée s'abandonne à l'homme qu'elle croit aimer, Kerboullart resserre peu à peu son emprise. Il est convaincu qu'elle est la clef d'une malédiction monstrueuse. Une malédiction qu'il est prêt à détruire à tout prix. Quitte à sacrifier son épouse... De sa plume ensorcelante, Mireille Calmel nous plonge dans un roman épique et machiavélique où se mêlent la peur, la passion et la sensualité.",isbn:"9782374489780",extraUrl:"https://covers.openlibrary.org/b/isbn/9782374489780-M.jpg"},
  {t:"1966, année mirifique",a:"Compagnon Antoine",y:"2026",ed:"Gallimard",cote:"944.083 6",pub:"Adulte",sup:"Imprimé",d:"\"L'année des cheveux longs et de la minijupe\", résume le journal rétrospectif des Actualités françaises le 27 décembre 1966. Sommet des Trente Glorieuses, arrivée des enfants du baby-boom à l'âge adulte, début d'une révolution accélérée des moeurs et entrée dans la société d'abondance, 1966 a été une année tournant sur de nombreux fronts - démographique, économique, politique, social et culturel. C'est à restituer le tissu de ses jours que s'attache cette enquête profondément novatrice où se croisent, entre marée structuraliste et Nouvelle Vague, Georges Perec, Michel Foucault, le briquet jetable, André Malraux, les livres de poche, La Grande Vadrouille, la microcassette Philips, ainsi que Marguerite Duras, Aragon, Jean-Luc Godard, Roland Barthes et bien d'autres. Il y est question de choses et de mots, de sons et d'images, mais encore d'histoire et de sociologie, de cinéma et de télévision, de poésie et de musique, de révolte aussi - deux ans avant Mai -, et de mémoire, avec le débat sur les camps d'extermination. Il n'en faut pas moins pour recomposer cet incendie prodigieux qui marque un seuil entre deux époques.",isbn:"9782073130112",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073130112-M.jpg"},
  {t:"Pensées distinguées",a:"Funès Julia de",y:"2026",ed:"Editions de l'Observatoire",cote:"194 FUN",pub:"Adulte",sup:"Imprimé",d:"Quand tout se confond, plus rien ne se pense. Dans un monde saturé de certitudes et de discours binaires, où chacun croit détenir la vérité, la pensée capitule. On confond l'évidence et la vérité, l'offense et le préjudice, le blasphème et le racisme. On prend le consentement pour de la résignation, le vraisemblable pour le vrai. Faute de distinction, l'esprit s'éteint. Sous la forme d'une correspondance philosophique, ce livre propose un manuel d'émancipation intellectuelle. Lettre après lettre, une distinction conceptuelle vient éclairer les débats contemporains, aiguiser le jugement, retrouver la précision que le prêt-à-penser a enterrée. Ni traité ni leçon de morale, Pensées distinguées redonne à la nuance sa dignité et à la pensée son tranchant. Car distinguer, ce n'est pas couper les cheveux en quatre : c'est refuser la facilité, déjouer les pièges du langage, reconquérir sa liberté de penser. Pour tous ceux qui croient encore que l'intelligence est une arme, et que la distinction est une élégance.",isbn:"9791032939239",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032939239-M.jpg"},
  {t:"Chocolat",a:"Harris Joanne",y:"2014",ed:"Gallimard",cote:"R HAR",pub:"Adulte",sup:"Imprimé",d:"Séduites par Lansquenet, Vianne Rocher et sa fille Anouk décident d'y établir leur chocolaterie. Mais dans ce petit village du sud-ouest de la France, le père Reynaud veille sur ses ouailles comme la cuisinière surveille le lait sur le feu. Aussi voit-il en l'ouverture de La céleste Praline l'oeuvre d'une sorcière. Et s'il avait raison ? Joanne Harris nous offre une ode gourmande à la tolérance et au plaisir. Adapté au cinéma avec Juliette Binoche et Johnny Depp dans les rôles-titres, Chocolat s'est vendu à plus de douze millions d'exemplaires dans cinquante-cinq pays.",isbn:"9782070453122",extraUrl:"https://covers.openlibrary.org/b/isbn/9782070453122-M.jpg"},
  {t:"Audace et Préjugés",a:"Karklins-Marchay Alexis",y:"2024",ed:"Presses de la Cité",cote:"820.9 KAR",pub:"Adulte",sup:"Imprimé",d:"Armées de leur plume, elles ont défendu leurs droits et exprimé leur puissance créatrice. Depuis des siècles, des femmes s'élèvent avec audace contre l'inégalité qui règne entre les genres. Parmi elles, trois autrices anglaises se sont particulièrement distinguées : Jane Austen, Charlotte Brontë et Virginia Woolf. En quoi leurs textes sont-ils toujours aussi actuels et percutants, au point que l'on continue de s'en inspirer ? L'auteur nous invite à une promenade littéraire débutant avec O rgueil et Préjugés, dont l'héroïne affirme son droit à faire un mariage d'amour. Elle se poursuit avec Jane Eyre, qui aspire à l'indépendance, et s'achève avec Une chambre à soi, où Virginia Woolf revendique l'importance de l'intimité et de la créativité pour les femmes.",isbn:"9782258207660",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258207660-M.jpg"},
  {t:"Les miroirs sourient à ceux qui s'aiment",a:"Giordano Raphaëlle",y:"2026",ed:"Editions Récamier",cote:"R GIO",pub:"Adulte",sup:"Imprimé",d:"Le nouveau roman de Raphaëlle Giordano. Dans un monde où tout est apparence et image, Gaspard Palomino, lui, porte un regard singulier sur le corps. Il voit le Beau dans tout ce qui nous chagrine. Photographe, il reçoit une offre susceptible de changer sa vie : exposer dans une prestigieuse galerie new-yorkaise une série de photos inédites. Les délais sont serrés, la pression est de taille. En quête d'une inspiration forte, il trouve une muse inattendue en la personne d'Adèle, une institutrice divorcée au tempérament drôle et touchant, mais profondément complexée par le reflet de son corps dans le miroir. A travers les yeux de Gaspard, Adèle va-t-elle réussir à s'accepter et à rayonner enfin pour elle-même ? Un roman lumineux sur la force de l'authenticité et la magie de l'art lorsqu'il nous aide à nous réconcilier avec notre propre éclat. Une fois de plus, Raphaëlle Giordano excelle à révéler la beauté du réel, celle qui échappe aux standards et raconte ce que nous avons de plus vrai.",isbn:"9782385771201",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385771201-M.jpg"},
  {t:"Aliénor d'Aquitaine",a:"Demay Marie-Noëlle",y:"2026",ed:"Presses de la Cité",cote:"R DEM",pub:"Adulte",sup:"Imprimé",d:"Après le succès d'Aliénor d'Aquitaine. Il y eut un soir, et il y eut un matin, un nouveau roman passionnant qui revisite un moment clé méconnu de la vie de la grande reine. Novembre 1173. Aliénor d'Aquitaine se dresse contre son époux, le roi d'Angleterre Henri II, et rallie ses fils et une partie de la noblesse pour fomenter une révolte. Le complot tourne court... Acculée, Aliénor prend la fuite mais est capturée. Emprisonnée à Chinon, puis assignée à résidence pendant quinze ans en Angleterre, coupée du monde et des siens, privée de tout pouvoir, elle va affronter la solitude, le désespoir et la colère. Mais la reine comprendra peu à peu que la véritable liberté est à rechercher au coeur d'elle-même, là où l'âme vibre, intacte. Et n'est-ce pas la plus implacable des revanches ? Marie-Noëlle Demay restitue avec virtuosité l'intimité et la force d'une femme hors du commun, dont la modernité traverse les siècles et continue de fasciner. Une plongée captivante dans le Moyen Age et un récit puissant, poignant, qui explore les sacrifices et les passions d'une souveraine légendaire. \" Passionnant ! L'histoire d'une indomptable souveraine qui défie le pouvoir et traverse quinze ans de captivité. \" - Tatiana de Rosnay",isbn:"9782258214408",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258214408-M.jpg"},
  {t:"Pardonner à nos mères",a:"Richard Claire",y:"2026",ed:"Les renversantes",cote:"305.42 RIC",pub:"Adulte",sup:"Imprimé",d:"Je ne serai jamais comme elle : ce serment secret que Claire Richard s'est murmuré en regardant sa mère, bien des filles l'ont fait. Pourquoi les filles en veulent-elles tant à leur mère ? Pourquoi cette relation, souvent idéalisée, se révèle-t-elle parfois si douloureuse ? Autrement dit : que dit la matrophobie de la relation mère-fille ? A travers son récit intime et une enquête auprès de 150 femmes, l'autrice explore cette peur, non comme un simple conflit psychologique, mais comme l'effet du patriarcat dans les familles, et de la violence que les femmes subissent, voire reproduisent, depuis des générations. En esquissant une cartographie féministe de cette relation à la fois fondatrice et si complexe, Claire Richard nous offre des pistes de réflexion pour, peut-être, échapper à cette peur si partagée.",isbn:"9782488051026",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488051026-M.jpg"},
  {t:"Peut-être le hasard",a:"Charnet Agathe",y:"2026",ed:"Les Corps Conducteurs",cote:"R CHA",pub:"Adulte",sup:"Imprimé",d:"Professeure de philosophie, Marie-Pierre a dû sacrifier ses rêves de cinéma aux tâches domestiques et à la charge mentale maternelle. A l'aube de ses 50 ans, alors qu'elle a divorcé et que ses enfants quittent la maison, une catastrophe percute sa nouvelle existence : elle commence à chercher ses mots, puis à les perdre. Elle ne peut plus enseigner ; elle est atteinte d'un Alzheimer précoce. Cette femme est la mère de l'autrice. Celle-ci lui redonne en littérature la place qui aurait dû être la sienne, raconte l'irruption de la maladie et ses bouleversements, et un parcours de soin où s'instaure une relation de jeune aidante à malade, avec ses moments de joie, ses espoirs, ses abîmes. D'une écriture rageuse et empathique, Agathe Charnet retrace deux trajectoires de femmes de générations différentes, et nous interroge avec une franchise saisissante : comment accompagnons-nous nos proches quand ils souffrent ? Qu'est-ce qu'une fin de vie et une mort dignes ? En bref : comment résister et apporter du soin face aux douleurs qui nous affligent ?",isbn:"9782488557108",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488557108-M.jpg"},
  {t:"Lyndon",a:"Marchesini Irene",y:"2026",ed:"Le Lombard",cote:"BD MAR",pub:"Adulte",sup:"Imprimé",d:"Le nouveau roman graphique coup de coeur des autrices de Rebis. Écosse. Fin du XIXe siècle. Lyndon est un jeune enseignant souffrant de graves troubles anxieux. Afin d'apaiser ses tourments, il décide de fuir l'agitation londonienne pour partir enseigner dans une petite école sur une île au large des côtes écossaises. Mais lorsqu'un de ses élèves disparaît, le passé de Lyndon ressurgit. Dans une lande brumeuse où les croyances et les esprits semblent encore bien vivants, les villageois préfèrent éviter de s'intéresser de trop près à cette disparition. Seuls Lyndon et le frère aîné du petit disparu décident de partir à la recherche de l'enfant. Au fur et à mesure de leur enquête, les deux hommes en apprendront davantage l'un sur l'autre, mais aussi peut-être sur eux-mêmes.",isbn:"9782808215565",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808215565-M.jpg"},
  {t:"Les preuves",a:"Miller Suzie",y:"2026",ed:"L'Archipel",cote:"R MIL",pub:"Adulte",sup:"Imprimé",d:"Tessa, brillante avocate anglaise qui défend sans états d'âme les hommes accusés d'agressions sexuelles, se retrouve sur le banc des victimes après un viol conjugal. Le premier roman de la dramaturge internationalement reconnue Suzie Miller, tiré de sa pièce à succès Prima Facie . Un roman coup de poing vendu à plus 150 000 exemplaires et unanimement salué par la presse. Le premier roman de la dramaturge anglo-australienne Suzie Miller, tiré de sa pièce à succès Prima Facie . Un \" cri de ralliement \" contre le système judiciaire. Tessa, la trentaine, brillante avocate pénaliste issue de la classe populaire, défend sans états d'âme les hommes accusés d'agression sexuelle. Des affaires qu'elle plaide avec un sens de la justice chevillé au corps. Après une soirée avec un collègue issu de l'establishment, avec qui elle entretient une liaison depuis peu, Tessa est victime d'un viol. Nul n'est mieux placé qu'elle pour savoir que ses chances d'obtenir gain de cause sont minimes. Pourtant, au petit matin, elle décide d'aller porter plainte. Suzie Miller livre un premier roman coup de poing, qui met en exergue la longueur et l'âpreté du combat que doivent mener les victimes pour être entendues, une lutte inégale face à un système judiciaire patriarcal conçu non pas pour accueillir, mais pour mettre en doute la parole de la plaignante : où sont les preuves ? \" Ce roman, version étoffée de la pièce, rend l'histoire de Tessa plus convaincante encore, plus humaine. Un cri de ralliement politique. \" New York Times \" Audacieux et déchirant. \" Elle Magazine",isbn:"9782809852981",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809852981-M.jpg"},
  {t:"Le rêve inachevé de Jack Kerouac",a:"Adrian Pierre",y:"2026",ed:"Actes Sud",cote:"848 ADR",pub:"Adulte",sup:"Imprimé",d:"En juin 1965, Jack Kerouac passe une nuit en Bretagne à la recherche de ses origines. Dans Satori à Paris, \"Ti Jean\" raconte sa quête, un voyage éthylique qui le mène de la gare Montparnasse jusqu'à Brest dont il ne verra à peu près rien, sinon la rue de Siam, le commissariat, une chambre d'hôtel et le comptoir des bars du quartier. Soixante ans après, j'ai refait ce périple en compagnie de mon ami photographe Yann Stofer, essayant peut-être inconsciemment de réparer ce rendez-vous manqué. Une question me hantait : que restait-il de l'esprit libre du voyageur solitaire ? P. A.",isbn:"9782330219932",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330219932-M.jpg"},
  {t:"Et... Paf !",a:"Raisson Gwendoline",y:"2026",ed:"Nathan",cote:"A RAI",pub:"Jeunesse",sup:"Imprimé",d:"Bim, boum, splash, cling... A vous de faire claquer les pages pour provoquer collisions, explosions et autres rencontres.",isbn:"9782095058548",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782095058548-475x500-1.jpg"},
  {t:"Le livre qu'il ne faut pas ouvrir (sous aucun prétexte !)",a:"Patschke Steve",y:"2021",ed:"Glénat",cote:"A PAT",pub:"Jeunesse",sup:"Imprimé",d:"Pierre, Sami, Sarah et Lucie découvrent une mystérieuse caisse en bois. Sur le couvercle, un message leur intime l'ordre de ne pas l'ouvrir. Un album sur le thème de l'interdit. ©Electre 2022",isbn:"9782344050835",extraUrl:"https://www.babelio.com/couv/CVT_Le-livre-quil-ne-faut-pas-ouvrir_2425.jpg"},
  {t:"Les guerres des mers",a:"Vaujour Nicolas",y:"2026",ed:"Tallandier",cote:"359 VAU",pub:"Adulte",sup:"Imprimé",d:"Pour la première fois, un chef d'état-major de la Marine en exercice prend la plume. Il dresse un état des lieux des nouvelles menaces et explique le rôle essentiel de la Marine nationale dans cette nouvelle ère d'affirmation des puissances. Disposant du deuxième domaine maritime mondial, la France tient son rang au sein des marines internationales et de l'Otan. Alors que plus de 90% des échanges commerciaux et des flux de communication passent aujourd'hui par les mers, les défis sont considérables. Défis technologiques et humains d'abord, avec des navires et des équipements exigeant des compétences nucléaires, numériques et de cybersécurité de plus en plus sophistiquées. Défis géopolitiques aussi, car les démonstrations de forces navales russes et chinoises en mer sont quotidiennes. Défis environnementaux enfin, car l'intensité des événements climatiques augmente tandis que le réchauffement ouvre de nouvelles voies de navigation, notamment en Arctique. La Marine nationale est aux avant-postes de toutes ces mutations pour protéger les intérêts de la France et des Français. \"De nos jours, naviguer au sud de la mer Rouge signifie traverser de vastes espaces sous la menace permanente d'attaques terroristes, de drones ou de missiles. Il n'y a plus de zone de détente, nous sommes défiés partout\". Amiral Nicolas Vaujour",isbn:"9791021066700",extraUrl:"https://covers.openlibrary.org/b/isbn/9791021066700-M.jpg"},
  {t:"Où est ta tétine ?",a:"Van Genechten Guido",y:"2024",ed:"Albin Michel",cote:"A VAN",pub:"Jeunesse",sup:"Imprimé",d:"Petite Souris est vraiment très curieuse. Elle veut tout comprendre et tout voir... même les tétines de ses amis. Et ils en ont beaucoup ! Mais que va-t-elle faire de toutes ces tétines ?Un livre plein d'humour pour apprendre à dire au revoir à sa tétine",isbn:"9782226488367",extraUrl:"https://m.media-amazon.com/images/I/416vnYZxc1L._SX195_.jpg"},
  {t:"Parfois, je suis en colère",a:"Bowles Paula",y:"2026",ed:"Chantecler",cote:"A BOW",pub:"Jeunesse",sup:"Imprimé",d:"Votre enfant est parfois en colère. Il crie, tape du pied ou s'énerve envers tout le monde. C'est tout à fait normal et cela fait partie de son développement. Ce livre aidera votre enfant à reconnaître la colère, à la comprendre et à mieux la gérer. La petite histoire lui montrera comment retrouver le calme d'une manière simple.",isbn:"9782803464999",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782803464999-475x500-1.jpg"},
  {t:"Le chemin des gens perdus",a:"Moulins Xavier de",y:"2026",ed:"Flammarion",cote:"R MOU",pub:"Adulte",sup:"Imprimé",d:"\"Je me demande si quelqu'un s'inquiète de notre disparition, si on a donné l'alerte. Parce que, à un moment, il faut arrêter de se voiler la face, appeler un chat, un chat : on est des disparus\". Certains chemins ne mènent nulle part. D'autres vous ramènent à vous-même. Pour son treizième roman, Xavier de Moulins signe une fable mystérieuse et addictive. Vous ne verrez plus jamais la forêt du même oeil.",isbn:"9782080159373",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080159373-M.jpg"},
  {t:"A tes côtés",a:"Hughes Hollie",y:"2026",ed:"Kimane",cote:"A HUG",pub:"Jeunesse",sup:"Imprimé",d:"Une histoire rassurante et adorablement illustrée par Alex Latimer sur le lien indéfectible entre parent et enfant. \"Lorsque Petit Dino est séparé de sa maman par une tempête, il sait qu'il doit faire preuve de courage et la retrouver. Mais le monde peut être effrayant sans elle à ses côtés... La gentillesse des autres animaux et quelques indices laissés dans le sable aideront-ils à ramener Petit Dino auprès de sa maman ? Une histoire rassurante, en rimes, pour célébrer le lien indéfectible entre un parent et son enfant\".",isbn:"9782383224594",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383224594-475x500-1.jpg"},
  {t:"Le Maître de feu",a:"Delage Alain",y:"2026",ed:"Deborée",cote:"R DEL",pub:"Adulte",sup:"Imprimé",d:"Ce devait être un beau jour pour Suzanne et Séraphin... mais un accident lors de leurs noces provoque la mort de l'un des invités. Leur moral est déjà bien atteint quand un nouveau coup du sort s'abat sur eux : le cours de l'huile d'olive chute, venant contrarier leurs projets. Très vite, Séraphin mise sur une idée audacieuse : se former en Provence auprès d'un maître savonnier pour transformer sa production en savon.",isbn:"9782812941238",extraUrl:"https://covers.openlibrary.org/b/isbn/9782812941238-M.jpg"},
  {t:"La Terre de Pauline",a:"Barral René",y:"2026",ed:"Deborée",cote:"R BAR",pub:"Adulte",sup:"Imprimé",d:"Nommé instituteur en Aveyron, Julien espère y oublier les blessures laissées par la guerre. Mais sa rencontre avec Pauline Maillé, marquée par la disparition tragique de ses parents à la Libération, bouleverse ses projets. A travers un conflit d'école apparemment anodin, il découvre les tensions profondes qui opposent la famille de la jeune femme au maire du village. Un secret ancien hante en effet le Ponteil, et Julien est bien décidé à en percer le mystère.",isbn:"9782812941443",extraUrl:"https://covers.openlibrary.org/b/isbn/9782812941443-M.jpg"},
  {t:"Le dernier des fils",a:"Sobral Patrick",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Les Légendaires Résistance démarre 20 ans après le grand cycle des Légendaires. Le monde a vécu de belles années de paix mais aujourd'hui les descendants de nos héros doivent reprendre les armes pour défendre Alysia ! Maintenant que tout Alysia sait que les lunes n'ont jamais été détruites par les Dieux, partout dans le monde on se révolte et se dresse contre l'envahisseur divin. Du côté de la résistance, l'ambiance est explosive et Toopie est contestée pour ses décisions qui ont mené à la mort tragique d'Amy. Les tensions menacent la résistance alors qu'un espion des Célestes a infiltré leur base.",isbn:"9782413088486",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413088486-475x500-1.jpg"},
  {t:"Histoires insolites de la Coupe du monde de football",a:"Veille Frédéric",y:"2026",ed:"City Editions",cote:"796.334 VEI",pub:"Adulte",sup:"Imprimé",d:"Savez-vous que le premier but de l'histoire de la Coupe du Monde de football a été marqué par un français en 1930 ? Que le plus jeune footballeur à avoir participé à la compétition avait seulement 17 ans ? Que le Trophée est composé de 5 kilos d'or, et qu'il a été caché dans une boîte à chaussures pendant la guerre pour échapper aux Nazis ? Qu'en 1954, les Allemands ont remporté la Coupe parce qu'ils étaient dopés aux amphétamines ? Et que le taux de suicide en France a baissé de 20 % après la victoire des Bleus en 1998 ? De 1930 jusqu'à nos jours, de Pelé à Zidane en passant par Maradona ou Ronaldo, ce livre retrace l'étonnante épopée de la Coupe du Monde. Autant de personnages, de petites histoires et d'anecdotes qui ont fait la grande histoire d'une compétition sportive de légende.",isbn:"9782824625195",extraUrl:"https://covers.openlibrary.org/b/isbn/9782824625195-M.jpg"},
  {t:"Pommes, poires, abricots",a:"La Croix Séverine de",y:"2016",ed:"Delcourt",cote:"BDJ LAC",pub:"Jeunesse",sup:"Imprimé",d:"Une préadolescente s'interroge, s'inquiète et s'enthousiasme des transformations de son corps. ©Electre 2019",isbn:"9782756080215",extraUrl:"https://www.base-orb.fr/visuels-pim/image/base/9782756080215-475x500-1.jpg"},
  {t:"Razzia",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Avant de devenir l'un des cinq Légendaires mythiques, Razzia s'appelait Korbo, l'ombre rouge. Pour venger sa famille, il tue un à un les membres de l'armée des mille loups. Jusqu'au jour où il croise la route de Ténébris qui lui propose de créer un monde meilleur et de diriger à ses côtés l'armée de son père, Darkhell, le sorcier noir.",isbn:"9782756064789",extraUrl:"https://products-images.di-static.com/image/base/9782756064789-475x500-1.jpg"},
  {t:"Santé mentale tous concernés !",a:"Kierzek Gérald",y:"2026",ed:"Leduc",cote:"616.89 KIE",pub:"Adulte",sup:"Imprimé",d:"Et si prendre soin de sa santé mentale devenait aussi naturel que prendre soin de son corps ? Stress, anxiété, dépression, addictions, troubles du comportement alimentaire... Retrouvez dans ce livre un panorama de tous les principaux troubles psychiques, afin de mieux les comprendre, de repérer les signes de souffrance, de déconstruire les idées reçues et de les soigner. Dans ce guide pratique, découvrez que faire au quotidien pour prendre soin de votre santé mentale et comment réagir si vous n'allez pas bien : quand consulter, vers qui vous tourner et quelles sont les solutions mises à votre disposition pour aller mieux. Un livre qui vous aidera à vous informer, vous rassurer, et avancer pas à pas vers un mieux-être, pour soi ou pour ses proches.",isbn:"9791028536817",extraUrl:"https://covers.openlibrary.org/b/isbn/9791028536817-M.jpg"},
