  {t:"Printemps, à la Charité",a:"Chabert Alexis",y:"2026",ed:"Bamboo Edition",cote:"BD PEL",pub:"Adulte",sup:"Imprimé",d:"\"Dans le Paris de la Belle Epoque, être un survivant du Bazar de la Charité n'est pas sans risque...\". Paris, 1897. Quelques semaines aprés l'incendie du Bazar de la Charité, les survivants meurent dans d'étranges circonstances, victimes d'hallucinations tonifiantes. L'inspecteur Amaury Broyan, flic brisé, opiomane et hanté par la mon de sa fille, est chargé de l'enquéte. Des salons de la haute société aux bas-fonds de la capitale, il s'enfonce dans un mystère oh science, culpabilité et vengea s'entrelacent. Sa rencontre avec Blanche Dambreville, fascinante entomologiste, pourrait bien faire basculer l'affaire... et sa propre raison.",isbn:"9791041106332",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041106332-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2020",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Sorti vainqueur de la bataille contre la province de Sen, le pays de Kôka agrandit son territoire. Mais Hak est grièvement blessé, et Yona n'a presque plus de voix... Réquisitionné pour soigner les soldats blessés au combat, Yeon s'intéresse aux techniques de soins de la tribu du ciel. Que peut bien avoir derrière la tête le conseiller Kye-sook lorsqu'il lui propose de l'accompagner au château de Hiryû pour y apprendre la médecine ?",isbn:"9782811657345",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811657345-M.jpg"},
  {t:"Trop de bananes",a:"Courgeon Rémi",y:"2024",ed:"Milan",cote:"A COU",pub:"Jeunesse",sup:"Imprimé",d:"\" Any, sans son grand-père, ne serait pas vraiment Any. Il est le phare de sa vie. Un vieux à roulettes qui peint la mer depuis plus de quatre-vingts ans, tous les jours, en râlant qu'il n'y arrive jamais, que c'est tellement plus beau en vrai. Any aussi dessine tous les jours. Tout et n'importe quoi. C'est une artiste un peu cinglée, mais un seul adjectif n'est pas suffisant pour parler d'elle... \" Un personnage féminin fort Sous les mots et les pinceaux de Rémi Courgeon, cette histoire nous dresse le portrait d'Any, une jeune fille forte, déterminée, passionnée et rêveuse. Un personnage très attachant et inspirant dont les dessins animent l'album du début à la fin. Un album sur la relation entre un grand-père et sa petite-fille Rémi Courgeon décrit une très belle relation entre le grand-père et sa petite-fille, réunis par leur amour du dessin et leur caractère bien trempé. Un album drôle et émouvant à la fois. \" Cette histoire pleine d'humour et d'énergie, un brin loufoque, aux illustrations très colorées, nous montre comment une passion peut habiter toute une vie\". Frédérique Franco (Librairie Le Goût des mots, Mortagne-au-Perche) \"Elles ne sont pas fréquentes, les histoires abracadabrantes, qui tiennent sur la longueur sans signe d'essoufflement. Cet album en raconte une, fondée sur l'excentricité de son héroïne, fascinée par les peaux de banane. Non pas pour les semer sous les pieds des inopportuns, mais pour en faire des tableaux, des collages, voire des sculptures. Quelle sacrée personnalité Rémi Courgeon lui a donnée, en plus d'un nez de peinture sortie du tube et de cheveux en poils de pinceau écrasé ! \" Télérama",isbn:"9782408050757",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408050757-475x500-1.jpg"},
  {t:"Emmie, petite souris de génie",a:"Crosby-Fairall Marjorie",y:"2026",ed:"Editions Gründ",cote:"A CRO",pub:"Jeunesse",sup:"Imprimé",d:"Emmie, la petite souris, avait de grandes idées. Grâce à ses inventions astucieuses, tout fonctionnait à merveille. Jusqu'au jour où un énorme problème apparut...",isbn:"9782324038945",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782324038945-475x500-1.jpg"},
  {t:"La grande soif",a:"Cassano Erica",y:"2026",ed:"Jean-Claude Lattès",cote:"R CAS",pub:"Adulte",sup:"Imprimé",d:"La lutte d'une femme pour sa liberté. La fascinante ville de Naples entre Occupation et Libération. La révélation d'une nouvelle voix. Naples, 1943. L'eau manque partout, sauf dans la maison où vivent Anna et sa famille. Devant la Maison de l'eau, la file des femmes qui cherchent à se désaltérer s'allonge. La soif qu'Anna ressent est différente : c'est une soif de vivre et de revanche. A vingt ans, elle voudrait étudier la littérature, lire, s'épanouir dans une ville sans décombres, sans sirènes d'alerte aérienne. Mais il n'y a pas de temps pour rêver. Le père a disparu, la mère s'est renfermée, la soeur et le neveu sont malades. Leur futur dépend d'elle. Alors, dès qu'elle en a l'opportunité, Anna accepte un poste de secrétaire à la base américaine de Bagnoli. Elle entre dans un monde inconnu de promesses qui enchantent et effraient à la fois. La solution la plus facile serait de fuir, de laisser les années douloureuses de la guerre derrière elle. Mais Anna ne veut pas que quelqu'un la sauve. Comme Naples, elle espère gagner elle-même sa liberté. La grande soif est le récit d'un petit monde immense, de ses silences et de ses bruits, d'une aspiration à quelque chose de plus grand qui sommeille en nous. Traduit de l'italien par Anaïs Bouteille-Bokobza",isbn:"9782709676328",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709676328-M.jpg"},
  {t:"La vie en relief",a:"Delerm Philippe",y:"2022",ed:"Points",cote:"R DEL",pub:"Adulte",sup:"Imprimé",d:"Etre riche, à chaque époque de notre existence, de tous les moments qu'on a vécus, qu'on vit, qu'on vivra encore : c'est cela, la vie en relief. Voir ses souvenirs et ses sensations non pas additionnés les uns aux autres, mais comme démultipliés, à l'infini. Vivre comme si c'était la première fois. Trouver de la beauté dans l'ordinaire des choses. Aimer vieillir, écouter le bruit du temps qui passe.",isbn:"9782757892886",extraUrl:"https://covers.openlibrary.org/b/isbn/9782757892886-M.jpg"},
  {t:"Immersion",a:"Druart Nicolas",y:"2026",ed:"Belfond",cote:"R DRU",pub:"Adulte",sup:"Imprimé",d:"Vous qui entrez ici, abandonnez tout espoir. Nicolas Druart vous guide en enfer avec un thriller hors normes, mêlant atmosphère et épouvante, pour une lecture hautement compulsive. Plongez si vous osez... Dans l'Aude, gendarmes et médias sont sur le qui-vive : depuis quelques jours, des hommes et des femmes sont emportés par ce qui ressemble à une épidémie de morts subites. Seul lien entre les victimes : elles avaient toutes participé à l'exploration du gouffre de Gorre peu avant leur décès. Tout juste rouvert après un terrible accident qui a nécessité sa fermeture pendant deux ans, l'endroit, qui offre des immersions terrifiantes réservées à un public averti, se trouve de nouveau au cœur d'un scandale. Léo Masset, infirmier trentenaire, en sait quelque chose : lui et ses amis ont tenté l'aventure, et trois ne sont pas revenus, dont sa femme. Accablé de chagrin, seul avec son fils à charge, Léo est prêt à tout pour faire tomber les propriétaires du gouffre qui jouent à un jeu des plus dangereux... \" Marionnettiste de l'angoisse, Nicolas Druart joue avec nos nerfs. Et on en redemande. \" Olivier Bal",isbn:"9782714405401",extraUrl:"https://covers.openlibrary.org/b/isbn/9782714405401-M.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2023",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9791032712764",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712764-M.jpg"},
  {t:"NON ! dit lapin",a:"Henrichs Marjoke",y:"2026",ed:"Nathan",cote:"A HEN",pub:"Jeunesse",sup:"Imprimé",d:"Lapin n'a pas envie d'écouter sa maman. Non, non, non ! proteste-t-il. Maman et Lapin trouveront-ils quelque chose qu'ils aiment faire tous les deux ?",isbn:"9782095057275",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782095057275-475x500-1.jpg"},
  {t:"L'attrape-foudre",a:"Bussy Sarah",y:"2026",ed:"R. Laffont",cote:"J BUS",pub:"Adolescent",sup:"Imprimé",d:"Farah a le coup de foudre pour Tao. Ensemble, ils vont prendre le risque de se brûler les ailes... Un superbe roman sur l'urgence et la voracité de l'adolescence. En attendant l'année du bac, Farah travaille tout l'été à la station-service familiale. Un jour, une vieille Ferrari blanche brinquebalante s'arrête à la pompe. A son volant : Tao, un garçon au charme magnétique, si libre, si différent de ceux que Farah connaît. Lorsqu'il lui propose de le suivre dans son road-trip vers les orages du Sud, la jeune fille ne peut qu'accepter. Mais au fil des kilomètres et des confidences, Farah comprend que Tao joue avec le feu. Et que sa fuite pourrait bien les brûler tous les deux...",isbn:"9782221286654",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782221286654-475x500-1.jpg"},
  {t:"Le foulard",a:"Grant Hardie",y:"2025",ed:"Editions Place des Victoires",cote:"746.92 VAN",pub:"Adulte",sup:"Imprimé",d:"Transformez votre foulard en véritable atout mode ! Un indispensable pour accessoiriser vos tenues avec style et originalité. Le foulard, cet accessoire intemporel, se réinvente à l'infini ! Grâce à ce petit guide pratique, découvrez plus de 30 manières de le porter autour du cou, en ceinture, dans les cheveux ou même comme top. Des pas-à-pas simples, des illustrations élégantes et des idées modernes pour sublimer tous vos looks avec style. Un incontournable du dressing féminin !",isbn:"9782809905496",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809905496-M.jpg"},
  {t:"Yuko",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001928",extraUrl:"https://images.epagine.fr/928/9782413001928_1_m.jpg"},
  {t:"Je serai un homme des cavernes",a:"Mozzillo Angelo",y:"2026",ed:"L'École des loisirs",cote:"A MOZ",pub:"Jeunesse",sup:"Imprimé",d:"Devenir président, banquier ou commandant ? Non merci, quel ennui ! Alors qu'il existe depuis la nuit des temps un emploi qui permet d'être tout cracra, de manger avec ses doigts, de grogner, et de pêcher ses crottes de nez : homme des cavernes. Mais même avec la vocation, c'est une dure profession... Pour bien la pratiquer, mieux vaut commencer tout de suite à s'entraîner !",isbn:"9782211349048",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782211349048-475x500-1.jpg"},
  {t:"L'amour est dans le thé",a:"Yamanaka Umebachi",y:"2026",ed:"Glénat",cote:"BD AMO",pub:"Adulte",sup:"Imprimé",d:"Chako a intégré l'équipe et la plantation Hananoki a été disqualifiée ! Malgré cela, Isshin et Chako continuent de s'impliquer corps et âme dans la préparation du thé roulé. Et l'annonce des résultats ne se fait pas attendre !Leur faux mariage va-t-il être révélé au grand jour ? Le concours de thé roulé connait une conclusion mouvementée tandis que la relation entre Chako et Isshin progresse à grands pas !",isbn:"9782344071427",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344071427-M.jpg"},
  {t:"L'Arbre de la connaissance",a:"Sfar Joann",y:"2025",ed:"Dargaud",cote:"BD SFA",pub:"Adulte",sup:"Imprimé",d:"Dans ce treizième opus, Sfar et le Chat se concentrent sur leurs fondamentaux : ils moquent (et expliquent) les turpitudes humaines, ils cherchent dans les textes bibliques les sources de notre mode de pensée contemporain... Leur sujet aujourd'hui : comprendre pourquoi le savoir et la connaissance sont regardés avec tant de méfiance par les religieux et sectaires de tous poils. Leur enquête va les mener aussi bien à l'école talmudique, qu'au Hammam, dans l'étude des textes comme au café, dans ses rêves comme dans les bras d'Eve.  Dans la lutte millénaire qui oppose religion et savoir, le Chat du rabbin (et Joann Sfar avec lui) a fait son choix : il est un fervent partisan de la connaissance et se méfie profondément de l'obéissance.",isbn:"9782205211719",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205211719-M.jpg"},
  {t:"Le pitou",a:"Escoffier Michaël",y:"2025",ed:"Frimousse",cote:"A ESC",pub:"Jeunesse",sup:"Imprimé",d:"Zais perdu mon pitou ! Un petit manchot est seul sur la banquise. Il a perdu son \" pitou \". Il rencontre un ours blanc ronchon. \" Tu as vu mon pitou ? \" demande le petit manchot. L'ours l'envoie loin en lui afrmant que son pitou est caché \" là bas \". Il part donc... loin... seul... sur la banquise ostile. Qui se retrouve par le plus grand des hasards sur son chemin ? Le Père Noël en personne ! Celui-ci vient d'avoir un accident de traineau... Il a heurté un drôle de personnage... Le petit manchot lui explique : \" zai perdu mon pitou \" . Le Père Noêl se met immédiatement à la recherche d'un pitou... Il doit bien y avoir ça parmi tous les cadeaux du traîneau. Mais un hurlement devance l'ours blanc, visiblement poursuivi par un monstre terrifiant... \" Mon Pitou ! \" s'exclame le petit manchot. Ouf ! doudou retrouvé.",isbn:"9782383496205",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496205-475x500-1.jpg"},
  {t:"Mamie Pirouette",a:"Renaud Claire",y:"2026",ed:"Éditions Sarbacane",cote:"J REN",pub:"Jeunesse",sup:"Imprimé",d:"Quand la danse classique vire à la tyrannie, une solution : appeler Mamie Marguerite et sa bande de copains retraités ! PLIÉ, TENDU PLIÉ, TENDU À l'école de danse, Mademoiselle Gisèle règne d'une main de fer : entre cris, punitions et chorégraphies interminables, Juliette et ses amies n'en peuvent plus. Mais Juliette peut compter sur Mamie, toujours prête à dégainer ses idées farfelues ! Avec l'aide de ses copains retraités - et d'une bande d'élèves bien décidés à dire « non à la tyrannie » - la révolte s'organise. Cette fois, fini les entrechats, vive la liberté !",isbn:"9791040808121",extraUrl:"https://products-images.di-static.com/image/base/9791040808121-475x500-1.jpg"},
  {t:"C'était quoi, ce craquement ?",a:"Cali Davide",y:"2026",ed:"Éditions Sarbacane",cote:"A CAL",pub:"Jeunesse",sup:"Imprimé",d:"Deux frères sont couchés dans leur lit. L'un entend toujours des \" craquements \" et finit par communiquer sa peur à l'autre, qui est pourtant de nature beaucoup plus cool... C'est parti pour un échange d'explications fantaisistes qui feront intervenir : le parquet qui craque (mais ils ont du carrelage), le chien (mais ça ne craque pas, un chien ? ), un voleur (au 7e étage ? ), le père Noël... La vraie réponse sera toute différente ! Et l'effet épatant, pour l'enfant lecteur : rien de tel que l'humour pour balayer la peur !",isbn:"9791040808152",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040808152-475x500-1.jpg"},
  {t:"Aqua",a:"Koenig Gaspard",y:"2026",ed:"Editions de l'Observatoire",cote:"R KOE",pub:"Adulte",sup:"Imprimé",d:"Après son best-seller Humus, Gaspard Koenig poursuit son exploration romanesque des éléments Quand Martin Jobard, un enfant du pays devenu haut fonctionnaire à Paris, décide de revenir briguer la mairie de son village normand et de moderniser le réseau d'eau potable, il trouve sur son chemin Maria, la joyeuse et idéaliste tenancière de l'épicerie, qui a écrit une thèse sur les communs et défend la source traditionnelle. La lutte qui s'engage va éveiller, chez les habitants, le pire comme le meilleur. Maria pourra-t-elle changer le cours des choses ? Sur fond de crise de l'eau, Aqua met en scène de manière réaliste et documentée une communauté rurale prise dans des contradictions contemporaines, entre désir d'autonomie, apathie citoyenne, arcanes de la politique locale et tutelle de l'Etat-Providence. Comment gérer des ressources naturelles qui se raréfient ? Peut-on encore \"faire village\" ? Mêlant mythologies normandes de l'eau et bureaucratie des communautés de communes, maniant à la fois la poésie et l'ironie, Aqua tisse une impressionnante toile de personnages où se mêlent un ministre trop pressé, une naturopathe bouddhiste, un éleveur mélancolique, une préfète amoureuse, un maire philosophe, une hydrogéologue anticapitaliste... Inscrit dans le même terroir qu'Humus et reprenant certains de ses personnages secondaires, le nouveau roman de Gaspard Koenig constitue le second volume d'une ambitieuse tétralogie autour des quatre éléments",isbn:"9791032932025",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032932025-M.jpg"},
  {t:"L'autre enquête",a:"Horst Jørn Lier",y:"2026",ed:"Gallimard",cote:"R HOR",pub:"Adulte",sup:"Imprimé",d:"Le silence inquiétant d'une internaute norvégienne membre d'un forum en ligne qui enquête sur le meurtre d'une touriste australienne sur la Costa Brava. Une camionnette immatriculée en Espagne et abandonnée depuis plusieurs jours près d'un arrêt de car dans le secteur de l'inspecteur Wisting. Le corps d'une jeune femme retrouvé non loin de là, sous la neige qui tombe sans relâche. Autant d'éléments convergents qui incitent Wisting à sauter dans un avion pour la Catalogne. Loin de sa zone de confort, il va devoir composer avec un groupe de détectives amateurs aux méthodes peu orthodoxes et une police locale plutôt réticente à coopérer.",isbn:"9782073074928",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073074928-M.jpg"},
  {t:"Le jour où je suis devenue plus méchante que le loup",a:"Javaux Amélie",y:"2026",ed:"Mijade",cote:"J JAV",pub:"Jeunesse",sup:"Imprimé",d:"Dans mon école, il y a un méchant loup. Elle s'appelle Agnès et se déplace toujours avec sa meute. Pour que ses moqueries cessent et avoir moi aussi des super copines... je suis devenue plus méchante que le loup.",isbn:"9782807702752",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782807702752-475x500-1.jpg"},
  {t:"Babinoche mon grand chien",a:"Surribas Caroline",y:"2026",ed:"Frimousse",cote:"A SUR",pub:"Jeunesse",sup:"Imprimé",d:"A quoi ressemble une année avec mon chien Babinoche ? Ce que je peux vous dire, c'est qu'on ne s'ennuie jamais... Nos bêtises et nos aventures sont comme lui : gi-gan-tesques !",isbn:"9782383496557",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496557-475x500-1.jpg"},
  {t:"Le Livre des vies",a:"Atwood Margaret",y:"2025",ed:"R. Laffont",cote:"B ATW",pub:"Adulte",sup:"Imprimé",d:"EVENEMENT LITTERAIRE Les Mémoires d'une des plus grandes autrices de notre temps. La Servante écarlate, publié en 1985, est un roman visionnaire devenu culte dont le nombre de lecteurs ne cesse de grandir et qui inspire et nourrit aujourd'hui les luttes pour le droit des femmes à disposer de leur corps partout dans le monde. Mais qui se cache derrière cette oeuvre, qui est réellement Margaret Atwood ? C'est ce que nous allons découvrir dans Le Livre des vies - Mémoires écarlates . Elevée par des parents à l'esprit scientifique très indépendants - un père entomologiste, une mère diététicienne - Margaret Atwood a grandi au milieu de la forêt sauvage du nord du Québec. Elle y a vécu une enfance libre et nomade, parfois solitaire, mais souvent palpitante. A partir de ces débuts peu conventionnels, Margaret Atwood déroule l'histoire de sa vie, reliant des événements marquants aux livres qui ont façonné notre paysage littéraire, de l'année cruelle qui a donné naissance à Oil-de-chat, au Berlin divisé des années 1980 où elle a commencé à écrire La Servante écarlate . Au fil des pages, qui regorgent de souvenirs de ses rencontres bohèmes, de sa vie fantastique avec le très charismatique écrivain Graeme Gibson et qui évoquent des tournants politiques majeurs, nous allons croiser des poètes, des ours, des acteurs hollywoodiens et des personnages plus grands que nature, tout droit sortis des pages d'un roman de Margaret Atwood. A mesure que son récit se déroule - haut en couleur et souvent drôle - on pénètre aussi dans les coulisses de son écriture, levant ainsi le voile sur les liens qui ont uni sa vie et la littérature, nous plongeant dans les rouages de son imaginaire, celui de l'une de nos plus grandes autrices contemporaines.",isbn:"9782221284117",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221284117-M.jpg"},
  {t:"Les 5 lettres du mot coeur",a:"Cassidy Cathy",y:"2026",ed:"Pocket",cote:"J CAS",pub:"Jeunesse",sup:"Imprimé",d:"Par l'autrice de la série culte Les Filles au chocolat ! Un coeur, cinq amis, zéro contact depuis deux ans... et si tout changeait ? Carrie, Omisha, Eden, Uma et Ryan sont inséparables depuis leur enfance. Leurs prénoms commencent comme les cinq lettres du mot coeur... C'est un signe ! Mais une violente dispute lors de l'anniversaire de Carrie vient séparer le groupe d'amis. Eden et Ryan qui étaient amoureux secrètement, sont fâchés à mort. Vont-ils tous pouvoir recoller les morceaux de l'amour et de l'amitié ?",isbn:"9782266357678",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782266357678-475x500-1.jpg"},
  {t:"Sanglillon",a:"Baer Julien",y:"2026",ed:"Kaléidoscope",cote:"A BAE",pub:"Jeunesse",sup:"Imprimé",d:"Sanglillon n'a pas une vie facile : il récure, cuisine, astique du matin au soir pendant que ses chipies de soeurs se prélassent. Jusqu'au jour où le bal royal est annoncé. Et si, pour une fois, c'était à son tour de briller ? Une version poilue et déjantée de Cendrillon, où le héros ne se laisse pas marcher sur les sabots !",isbn:"9782378883287",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782378883287-475x500-1.jpg"},
  {t:"L'arbre de la gentillesse",a:"Teckentrup Britta",y:"2019",ed:"Quatre Fleuves",cote:"A TEC",pub:"Jeunesse",sup:"Imprimé",d:"Un album poétique et profond pour faire réfléchir petits et grands sur les bienfaits de l’attention aux autres et les conséquences de la méchanceté.Avec un texte rimé et des découpes simples qui représentent habilement la complexité des sentiments. En amitié, un mot blessant crée parfois une fissure qui ne fait que grandir... Mais que se passe-t-il lorsque l’on sème la gentillesse et la bienveillance ? Grâce à de belles illustrations imprégnées de symbolisme et des découpes astucieuses, Britta Teckentrup met en regard les comportements égoïstes qui créent des fossés obscurs entre les personnes, et la magie de mots doux ou de gestes tendres qui illuminent nos journées, effacent nos peines et font naître l’affection. Pour célébrer les valeurs de l’amitié et instaurer un dialogue parents-enfants.",isbn:"9791026402718",extraUrl:"https://www.babelio.com/couv/CVT_LARBRE-DE-LA-GENTILLESSE_9130.jpg"},
  {t:"Le disparu du train de 15h12",a:"Fiore Faustina",y:"2026",ed:"Albin Michel",cote:"J FIO",pub:"Jeunesse",sup:"Imprimé",d:"Suivez les aventures palpitantes de Jeanne, Mélina et Francine, les jeunes soeurs de Louis et Auguste Lumière, célèbres inventeurs du cinéma ! Septembre 1890. Le génial inventeur Augustin Leprince se rend à Paris pour affaires. Monté dans le train à 15 h 12, il n'en est jamais descendu... Quelqu'un l'aurait-il enlevé ? Pire, assassiné ? Jeanne, Mélina et Francine redoutent qu'on accuse leurs frères d'avoir voulu éliminer un concurrent gênant, lancé comme eux dans la course à une invention spectaculaire : le cinéma. Afin de prouver leur innocence, les trois soeurs Lumière mènent une enquête époustouflante, en plein coeur de Paris.",isbn:"9782226502421",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226502421-475x500-1.jpg"},
  {t:"La Rosa Perdida",a:"Laquieze Christopher",y:"2026",ed:"Jean-Claude Lattès",cote:"R LAQ",pub:"Adulte",sup:"Imprimé",d:"\"Quand Matías Ordonez dénonça sa mère, elle fut pendue le lendemain sur la Plaza Vieja, et nul ne sut jamais si c'était par amour ou par vengeance qu'il l'avait condamnée\". A San Jacinto del Río, un village oublié des cartes et des dieux, Sofia Ordonez dirige La Rosa Perdida. Un bordel célèbre pour corps en quête de volupté, devenu refuge pour âmes errantes et haut lieu de passage des hommes, opposants comme sympathisants au régime sanguinaire d'Isidro Gálvez. Lorsqu'un matin Sofia est pendue sur la place publique, dénoncée par son propre fils Matías, le village entier frémit. Et sa mémoire, ses secrets et ses douleurs se déroulent pour tenter de comprendre. Dans ce premier roman, pétri de réalisme magique et d'une véritable virtuosité dramatique, Christopher Laquieze raconte les cicatrices d'un continent meurtri, la résistance muette et le courage de ceux qui, à bas bruit, oeuvrent pour un autre monde.",isbn:"9782709675222",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709675222-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"La finale du championnat de Tokyo a fait monter la pression d'un cran !! Avec deux victoires et une seule défaite, Seigaku est à deux doigts du triomphe mais encore faut-il que Ryôma gagne son match ! Face au colossal Akutsu Jin, Ryôma, tantôt dominé, tantôt en position de force, devra grandir et améliorer son jeu s'il veut sortir vainqueur de ce match ! Le courage dont il fait preuve suffira-t-il ?!",isbn:"9782505000969",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505000969-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Grâce à son talent, qui n’est plus à prouver, et à sa technique de la triple contre-attaque, Fuji passe à l’offensive avec un nouveau coup fatal ! Quel est donc ce coup inconnu jusqu’alors et qu’il appelle \"la baleine blanche\" ?! Le mystérieux Fuji montre enfin son vrai potentiel et provoque une véritable hystérie du côté des spectateurs ! Toutefois, le match le plus attendu reste celui qui opposera les capitaines des deux équipes : Tezuka et Atobe !",isbn:"9782505001959",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505001959-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Momoshiro n’a pas donné signe de vie depuis trois jours et personne au club de tennis ne sait où il se trouve. Même s’il ne fait plus partie de l’équipe des titulaires, c’est inquiétant... Par ailleurs, Ôishi se fâche avec Kikumaru, son coéquipier, lui reprochant la légèreté de ses paroles et son sens de l’humour déplacé. Serait-ce la faille qui fera voler en éclat la légendaire golden pair ?! Cela tombe vraiment mal, vu que la force de Seigaku réside dans l’unité de ses membres... Une étrange atmosphère plane sur nos héros !!",isbn:"9782505001010",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505001010-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Shishido et Ootori, de Hyôtei, mènent Inui et Kaidô par le bout du nez. En fait, il s’agit d’une stratégie qu’Inui a mise au point afin de récolter le plus d’informations possible sur ses adversaires. Heureusement, au bout de quelques minutes de jeu, il finit par trouver ce qu’il cherchait ! Mais pourront-ils remonter la pente ? Le boomerang snake de Kaidô sera-t-il à la hauteur ?!…",isbn:"9782505001706",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505001706-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Le petit accident d’Ôishi a forcé Seigaku à improviser : Kikumaru se retrouve en double n° 2 avec Momoshiro. Hyôtei profite de la situation pour prendre le dessus. Nos deux joueurs sont en bien mauvaise posture et Kikumaru est prêt à renoncer. Par chance, les paroles d’Ôishi résonnent dans son cœur et commencent à devenir réalité. Parviendront-ils à s’en sortir ?!",isbn:"9782505001560",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505001560-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2010",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Nous voici à la finale du championnat de Tokyo. Seigaku se mesure à la redoutable équipe de Yamabuki. Grâce à sa victoire lors du second double, Seigaku rattrape son retard. Les deux équipes sont à égalité avec, chacune, une victoire et une défaite. Seigaku nourrit de grands espoirs concernant ses joueurs en simple mais Momo se fait malmener par Sengoku, dit \"le renard\". Ryôma est, quant à lui, sur le point de rencontrer l'imposant Akutsu...!",isbn:"9782505000358",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505000358-M.jpg"},
  {t:"Rue des Batailles",a:"Crenn Antonin",y:"2026",ed:"Actes Sud",cote:"R CRE",pub:"Adulte",sup:"Imprimé",d:"Un homme a disparu. Il s'appelait Jules, Napoléon, Prosper, et le nom de son père. Antonin Crenn raconte. Enfant, Jules grandit à Epinal, puis à Tours, suivant les déplacements de son père vétérinaire militaire. Orphelin à quinze ans, il est envoyé à Paris chez le musicien François Delsarte, rue des Batailles. Puis Jules rencontre Elmina à Montmartre et part en Espagne avec elle, embarqués dans l'épopée du chemin de fer naissant. Ils reviennent avec Maurice, leur fils né à Madrid. Quand Jules disparaît, il a cinq ans. Un an plus tard, le drame intime de Maurice et Elmina devient le sort de tout le monde : après les sièges de Paris et l'écrasement sanglant de la Commune, des milliers de pères et de mères sont notés absents. C'est cela aussi que raconte \"Rue des Batailles\" : une histoire de la violence politique, des démolitions à grande échelle, des bouleversements qui nous dépassent et nous englobent. Autour de la figure absente, Antonin Crenn déroule un brillant récit en spirale, à la fois intime et historique ; traversée éminemment sensible et intelligente du XIXe siècle, en même temps que réflexion sur la mémoire dont nous choisissons ou non d'être les dépositaires.",isbn:"9782330216603",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216603-M.jpg"},
  {t:"Rattraper l'horizon",a:"Mānī H̱osraw",y:"2025",ed:"Actes Sud",cote:"R MAN",pub:"Adulte",sup:"Imprimé",d:"A l'aube des années 2000, quelque part dans la campagne afghane, un jeune homme s'apprête à partir. Où va-t-il ? A Kaboul, dans \"le vrai monde\". Il laisse derrière lui de longues années d'ennui, son enfance peuplée de présences menaçantes et marquée par le désamour de son père, le mollah et maître du village. Encouragé par son ami l'Ingénieur, à qui il doit l'espoir d'une autre vie possible, et poussé par la nécessité, il arrive un matin dans les rues de la capitale. Là, il va redessiner les contours de son existence, s'enivrer en compagnie de deux jeunes voyous épris de littérature et de musique, fréquenter les bordels, philosopher jusqu'au matin. Et tenter de tenir éloigné le spectre du passé... Histoire d'une quête absolue de liberté, \"Rattraper l'horizon\" est autant une plongée bouleversante au coeur d'un pays perdu qu'un plaidoyer pour les pouvoirs de la fiction - une ode à la vie grande comme un roman d'aventures.",isbn:"9782330208387",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330208387-M.jpg"},
  {t:"Le rêve inachevé de Jack Kerouac",a:"Adrian Pierre",y:"2026",ed:"Actes Sud",cote:"848 ADR",pub:"Adulte",sup:"Imprimé",d:"En juin 1965, Jack Kerouac passe une nuit en Bretagne à la recherche de ses origines. Dans Satori à Paris, \"Ti Jean\" raconte sa quête, un voyage éthylique qui le mène de la gare Montparnasse jusqu'à Brest dont il ne verra à peu près rien, sinon la rue de Siam, le commissariat, une chambre d'hôtel et le comptoir des bars du quartier. Soixante ans après, j'ai refait ce périple en compagnie de mon ami photographe Yann Stofer, essayant peut-être inconsciemment de réparer ce rendez-vous manqué. Une question me hantait : que restait-il de l'esprit libre du voyageur solitaire ? P. A.",isbn:"9782330219932",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330219932-M.jpg"},
  {t:"Les veilleurs de rêves",a:"Marcero Deborah",y:"2026",ed:"Didier jeunesse",cote:"A MAR",pub:"Jeunesse",sup:"Imprimé",d:"Lenny et ses amis avaient décidé de faire ensemble une grande collection de souhaits, de rêves et d'espoirs. Mais une tempête arriva et détruisit tout. A quoi bon rêver si on pouvait tout perdre ? Traduction de l'anglais de Rose-Marie Vassallo.",isbn:"9782278133000",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782278133000-475x500-1.jpg"},
  {t:"Fan de carotte",a:"Ilustrajo Mariajo",y:"2026",ed:"Glénat Jeunesse",cote:"A ILU",pub:"Jeunesse",sup:"Imprimé",d:"Au potager, monsieur Lapin bêche, sème, arrose et surveille. Mais quand arrive le moment de la récolte, il va faire une rencontre très spéciale : une carotte qui danse et qui chante, une carotte un poil envahissante ! Comment dire, monsieur Lapin n'est pas très \"fan\" de cette carotte, lui qui tient plus que tout à sa solitude. Ah oui ? Vraiment ? !",isbn:"9782344070048",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344070048-475x500-1.jpg"},
  {t:"García Lorca et le poète birman",a:"Malowé Nour",y:"2026",ed:"Editions Récamier",cote:"R MAL",pub:"Adulte",sup:"Imprimé",d:"RENTREE LITTERAIRE Quand la dictature bâillonne, la littérature devient résistance. Un roman incandescent sur le pouvoir de la littérature face à l'oppression. - Apportez-moi un livre interdit. - Un livre interdit ? - García Lorca, Noces de sang. Ce livre détient la réponse à l'énigme de ma vie. Depuis des décennies, la Birmanie vit sous le joug d'une junte militaire impitoyable. Là-bas, les mots sont plus redoutés que les armes : lire est un crime, et la littérature, un acte de résistance. C'est à Naypyidaw, capitale démesurée et presque vide, que se croisent Arun, fils d'un général, poète bâillonné par le totalitarisme, et Jack, écrivain français en exil, à bout de souffle. Ils ont la littérature en commun : l'un mourrait pour elle, l'autre n'attend qu'elle pour revivre. Jack est celui qu'Arun espérait, celui qui le mènera au livre interdit. Au-delà du récit d'aventure et de la fable politique, García Lorca et le poète birman est une ode à la littérature comme ultime refuge contre la barbarie. A travers la destinée tragique d'Arun, Nour Malowé signe un roman incandescent sur le pouvoir des mots, la beauté, l'amour et la liberté - ces armes silencieuses qui défient l'obscurantisme. Son précédent roman, Le Printemps reviendra, a remporté le Prix littéraire de la Grande Mosquée de Paris, le Prix Gonet, ainsi que le prix du Roman Métis des Lecteurs de la Ville de Saint-Denis 2025.",isbn:"9782385772253",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385772253-M.jpg"},
  {t:"Madame la Nuit",a:"Colin Fabrice",y:"2025",ed:"Gautier-Languereau",cote:"A COL",pub:"Jeunesse",sup:"Imprimé",d:"Madame la Nuit aime faire la fête! Sortir, danser sans s'arrêter...Alors pourquoi aller se reposer ? Un jour, elle décide de ne pas rentrer. Du tout. Depuis, dans la Grande Ville, il fait toujours nuit. Sortir le chien, jouer à la marelle, courir à l'école... tout se passe dans le miroitement des étoiles et des réverbères. C'est amusant... et puis, ça l'est un peu moins. Comment convaincre Madame la Nuit d'aller se coucher ? Un conte nocturne poétique et enchanteur, éclatant de couleurs, pour s'émerveiller des petits mystères de la nuit.",isbn:"9782017348214",extraUrl:"https://m.media-amazon.com/images/I/513VXxwul2L._SX210_.jpg"},
  {t:"Chansons des bois",a:"Piercey Rachel",y:"2025",ed:"Gallimard",cote:"J 841 PIE",pub:"Jeunesse",sup:"Imprimé",d:"La forêt regorge de magie et de poésie à observer et à méditer au travers de ces 40 chansons des bois. Papa ours invite son ourson à se laisser bercer par les secrets de la nature et à partager la délicatesse de chaque instant, même infime. Aube, rosée ou champignon, chaque élément est célébré. Il y a tant de merveilles à découvrir !",isbn:"9782075211864",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075211864-475x500-1.jpg"},
  {t:"Les minéraux",a:"Beaumont Jacques",y:"2013",ed:"Fleurus",cote:"J 549 BEAU",pub:"Jeunesse",sup:"Imprimé",d:"Comment se forme les minéraux ? où les trouve-t-on ? En quoi sont-ils importants dans notre vie quotidienne ? Un livre pour tout savoir sur ce sujet qui captive les enfants. De belles doubles pages sur l'or, les diamants, les pierres précieuses et les minéraux extraordinaires, avec des précisions sur leur mode d'extraction et des histoires sur les pierres.",isbn:"9782215116219",extraUrl:"https://products-images.di-static.com/image/base/9782215116219-120x160-1.jpg"},
  {t:"Un doux pardon",a:"Spielman Lori Nelson",y:"2016",ed:"Pocket",cote:"R SPI",pub:"Adulte",sup:"Imprimé",d:"Il suffit parfois d'une simple pierre pour faire basculer le destin. Une simple pierre ou plutôt deux, arrivées par la poste. Hannah Farr, animatrice télé en plein flottement tant professionnel qu'amoureux, se trouve ainsi face à un choix. Renvoyer l'une de ces pierres à celle qui la martyrisa enfant, c'est lui accorder son pardon. Mais à qui adresser la seconde, censée perpétuer la chaîne ? S'il est facile de pardonner, demander des excuses peut à jamais changer le cours d'une vie... \" Un roman exquis, qui donne la pêche ! \" Femme actuelle \" Un délicieux moment de lecture. \" Metronews",isbn:"9782266260138",extraUrl:"https://covers.openlibrary.org/b/isbn/9782266260138-M.jpg"},
  {t:"L'archéologie",a:"Beaumont Jacques",y:"2013",ed:"Fleurus",cote:"J 930.1 BEAU",pub:"Jeunesse",sup:"Imprimé",d:"11 doubles pages pour mieux connaître ce métier passionnant : la découverte d'un site, les étapes d'une fouille, l'archéologie sous-marine, le travail en laboratoire, les méthodes de datation et de reconstitution des vestiges, comment transmettre le passé?",isbn:"9782215115700",extraUrl:"https://products-images.di-static.com/image/base/9782215115700-120x160-1.jpg"},
  {t:"Java pour les Nuls",a:"Burd Barry",y:"2024",ed:"First Editions",cote:"005.13 BUR",pub:"Adulte",sup:"Imprimé",d:"Idéal pour commencer avec Java comme premier langage !  Grâce à ce livre, vous allez rapidement écrire rapidement vos premières applets Java, sans pour autant devenir un gourou de la programmation objet. Rassurez-vous, on ne vous assommera pas avec toutes les subtilités du langage Java, mais vous posséderez rapidement les bases nécessaires pour utiliser la panoplie d'outils du parfait programmeur Java. Cette nouvelle édition a été entièrement mise à jour avec les spécifications de la dernière version du SDK Java. Entièrement mis à jour sur la dernière évolution du SDK Java.",isbn:"9782412094839",extraUrl:"https://covers.openlibrary.org/b/isbn/9782412094839-M.jpg"},
  {t:"Jusqu'à leur dernier souffle",a:"Craig Erin A.",y:"2026",ed:"Editions Casterman",cote:"J CRA",pub:"Jeunesse",sup:"Imprimé",d:"Tous les dons ont un prix... Avant même sa naissance, Hazel Trépas fut promise au dieu de la Mort. Devenant son parrain, il lui offre un don qui fera d'elle une grande guérisseuse. D'un simple toucher elle est capable de déduire le mal dont souffre quelqu'un. En contrepartie, si elle utilise son pouvoir et qu'un crâne apparaît sur le patient, elle a pour devoir d'abréger ses souffrances... A 18 ans, Hazel est déjà hantée par les fantômes de tous ceux qu'elle a tués et aspire à fuir ses responsabilités. Mais le destin l'amène à la cour royale, où elle est confrontée à un dilemme : prendre la vie d'un roi marqué par la mort, condamnant ainsi le royaume à un chaos certain, ou chercher par tous les moyens un remède en défiant la Mort en personne... Prise entre les complots à la cour, un panthéon de divinités à la moralité douteuse et l'agaçant mais non moins séduisant prince Léopold, Hazel va devoir faire un choix et en assumer les conséquences.",isbn:"9782203293090",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203293090-475x500-1.jpg"},
  {t:"Etre montagne",a:"Starace Jacopo",y:"2022",ed:"Éditions Sarbacane",cote:"BD STA",pub:"Adulte",sup:"Imprimé",d:"Il y a d'abord eu la puanteur, qui a brutalement remplacé la brise parfumée soufflant habituellement sur la vallée des êtres fourmis, ces hommes de quelques millimètres de haut vivant dans les sous-bois. Puis, la maladie du Bacille s'est répandue comme une traînée de poudre, n'épargnant aucun village endeuillant chaque foyer. C'est au paroxysme de l'épidémie qu'ils sont apparus, immenses salvateurs divins : les êtres montagnes ont donné l'antidote au Prieur Armillaire et ont ainsi sauvé son peuple. Tout le monde connaît cette légende, y compris Myco et sa petite soeur, Paille, qui ont perdu leurs parents dans cette tragédie... Et l'austère Prieur, désormais chef du village des Champignons, s'assure que personne ne l'oublie et que tout un chacun honore dûment les êtres montagnes. Alors quand un étranger portant un masque doté d'un long bec d'oiseau arrive au village et annonce que la maladie est de retour, personne ne veut le croire. Mais Myco, qui voit des premiers stigmates apparaître sur la peau de sa soeur, décide, contre l'avis de tous, de gravir la montagne pour chercher la dernière dose antidote.",isbn:"9782377318148",extraUrl:"https://covers.openlibrary.org/b/isbn/9782377318148-M.jpg"},
  {t:"Mes frères, nos fantômes et moi",a:"Sandrel Julien",y:"2026",ed:"Charleston",cote:"R SAN",pub:"Adulte",sup:"Imprimé",d:"Julien Sandrel n'a jamais mis les pieds à Naples, berceau de sa famille. Entre les images de carte postale - soleil, dolce vita et pasta - et les récits de son grand-père, marqués par la pauvreté et le déracinement, l'Italie reste pour lui un puzzle incomplet. Accompagné de ses deux frères, il part à la recherche de la tombe de son arrière-grand-mère, Pasqualina... pour comprendre enfin l'empreinte que cette histoire familiale italienne a laissée en lui. Il est loin d'imaginer à quel point ce voyage à Naples va changer sa vie. A travers ce premier récit intime, Julien Sandrel nous entraîne dans une enquête familiale riche en surprises et en émotions fortes, qui pose en creux une question universelle : comment savoir qui l'on est si l'on ignore d'où l'on vient ? Julien Sandrel a connu un succès fulgurant dès son premier roman, La Chambre des merveilles (Calmann- Lévy, 2018), qui a été traduit en 27 langues, adapté au théâtre et au cinéma, et a obtenu plusieurs prix littéraires. La popularité de l'auteur, qui compte désormais 2 millions de lecteurs, ne s'est jamais démentie depuis.",isbn:"9782385295011",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295011-M.jpg"},
  {t:"Jane Eyre",a:"Brontë Charlotte",y:"2026",ed:"Editions Gallmeister",cote:"823 BRO",pub:"Adulte",sup:"Imprimé",d:"Orpheline, Jane Eyre est recueillie par sa tante qui ne cesse de la maltraiter. Envoyée en pension, elle y reste jusqu'à ses dix-huit ans. Elle devient alors la préceptrice de la pupille de l'énigmatique M. Rochester, dont elle ne tarde pas à tomber passionnément amoureuse. Bien que cet amour soit réciproque, les obstacles seront nombreux sur la route des deux amants. Jane devra faire preuve d'une détermination sans pareille pour surmonter ses doutes et se libérer de ses entraves.",isbn:"9782404081403",extraUrl:"https://covers.openlibrary.org/b/isbn/9782404081403-M.jpg"},
  {t:"Les tendresses de Zanzibar",a:"Morales Thomas",y:"2026",ed:"Editions du Rocher",cote:"R MOR",pub:"Adulte",sup:"Imprimé",d:"Dans Les Tendresses de Zanzibar, Thomas Morales nous raconte un homme et une femme. Comment ils se sont aimés. Leurs rires, leurs fêlures, leurs caresses. La géographie sentimentale de leur histoire est une fugue permanente. Entre Paris et la province, leurs coeurs balancent. Ennio Flaiano et Philippe de Broca s'invitent dans la conversation. Des actrices oubliées passent, s'attardent, comme sorties d'un film de Sorrentino. Rome et la Corse ont pour les amoureux le charme des paradis perdus et des chansons de Lucio Battisti. Ils aiment la lenteur, celle des plages et du soleil, mais ne détestent pas la vitesse, quand il s'agit de conduire à tombeau ouvert sur des routes départementales. La mort, parfois, est plus abrupte qu'un virage. Ceci est un roman d'amour, écrit de la plus délicate des plumes, à la fois quête mélancolique des jours heureux et lettre d'adieu. En refermant ces pages, la gorge serrée, ces mots, tel un écho : \"Ne me secouez pas, je suis plein de larmes\". Ecrivain et chroniqueur, notamment pour Le Figaro, Thomas Morales est l'auteur de plusieurs essais littéraires remarqués, et primés (Coup de Shako du prix des Hussards 2017, prix Tillinac 2022). Il signe avec Les Tendresses de Zanzibar son roman le plus intime et le plus bouleversant.",isbn:"9782268112985",extraUrl:"https://covers.openlibrary.org/b/isbn/9782268112985-M.jpg"},
  {t:"Avant moi",a:"Houssais Emmanuelle",y:"2026",ed:"Editions du Ricochet",cote:"A HOU",pub:"Jeunesse",sup:"Imprimé",d:"Un album unique qui raconte l'évolution aux plus jeunes. Ce magnifique album répond avec simplicité aux questions des enfants sur l'origine de la vie sur Terre. Depuis le Big Bang jusqu'à la naissance d'un enfant, chaque étape de l'évolution est expliquée : formation des planètes, premières formes de vie dans les océans, apparition de la vie terrestre... Le texte est accompagné de sublimes illustrations vives et colorées pour une immersion complète !",isbn:"9782352635574",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782352635574-475x500-1.jpg"},
  {t:"Cochon caché !",a:"Aaron Huw",y:"2026",ed:"Gallimard",cote:"A AAR",pub:"Jeunesse",sup:"Imprimé",d:"L'histoire hilarante d'une héroïne qui ne fait rien comme tout le monde et qui aimerait bien qu'on l'accepte comme elle est ! Mimi a un secret : elle est un cochon ! Aucun des singes avec qui elle vit dans la jungle ne s'en est aperçu. Sauf Raymond, leur chef, qui a des soupçons...",isbn:"9782075237819",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075237819-475x500-1.jpg"},
  {t:"J'ai toujours rêvé d'être un fermier",a:"Harambat, Jean",y:"2026",ed:"Charivari",cote:"BD HAR",pub:"Adulte",sup:"Imprimé",d:"Et si fermier était le métier des derniers aventuriers ? Jean Harambat retape une ferme gasconne plusieurs fois centenaire, h un jet de pierre de celle de son enfance. D'instants contemplatifs en dialogues taiseux avec son père, il raconte son attachement h la terre de ses cieux. Sous son trait, le quotidien rural devient une odyssée, un western, d'ailleurs on y croise Ulysse et Yul Brynner. Avec poésie et humour, Jean Harambat évoque les gestes de la vie paysanne et leur transmission. Et prend conscience que le dessin est, chez lui, un prolongement de cet héritage \"Nous comprenons le monde en le manipulant\".",isbn:"9782487663329",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487663329-M.jpg"},
  {t:"La saison des pluies",a:"Colize Paul",y:"2026",ed:"Éditions Hervé Chopin",cote:"R COL",pub:"Adulte",sup:"Imprimé",d:"Allongé dans son lit, les stores baissés, Théo regarde sans les voir les images qui défilent sur l'écran de télévision. Il attend. Il l'attend, elle. Pour parler. Elle, c'est Claire. Côté vie privée, elle est mère de deux filles pleines de vie, épouse d'un homme qui ne jure que par les cours de ses cryptomonnaies et ses sorties entre copains. Côté vie professionnelle, elle est coach indépendante, elle fait son métier avec tact et application, à juste distance. Elle réserve ses émotions pour un autre pan de sa vie : elle est bénévole aux soins palliatifs dans un hôpital. Quand le temps le lui permet. Du moins c'est ce qu'elle aime se raconter. Un nouveau patient requiert toute son attention. Elle est pressée de le retrouver. Elle sent qu'il peut l'arracher à son quotidien par ses récits. Et qu'elle ne pourra résister. Même si ce voyage l'emmène à des milliers de kilomètres et des décennies en arrière. Et qu'il y aura un prix à payer.",isbn:"9782357209824",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357209824-M.jpg"},
  {t:"Vivre avec Parkinson",a:"Deseyn José",y:"2026",ed:"Racine Lannoo",cote:"612.821 DES",pub:"Adulte",sup:"Imprimé",d:"La maladie de Parkinson est en nette progression dans le monde et touche des patients de plus en plus jeunes. Dans nos régions, elle constitue la deuxième maladie neurodégénérative après Alzheimer. Qui ne connaît pas, dans sa famille ou son entourage, une personne atteinte de la maladie de Parkinson ? Pourtant, l'annonce d'un tel diagnostic reste un choc, tant pour le patient que pour ses proches. Tremblements, lenteur, rigidité... Les symptômes moteurs sont visibles, mais bien d'autres, plus discrets, bouleversent le quotidien : troubles du sommeil, fatigue, anxiété, perte d'odorat ou difficultés de concentration. Sur un ton à la fois lucide et bienveillant, le Dr José Deseyn, médecin généraliste atteint de la maladie depuis plus de vingt ans, partage son double regard de praticien et de patient. Il explique ce qu'est réellement la maladie, comment en reconnaître les multiples manifestations et quelles sont les options thérapeutiques aujourd'hui disponibles, médicamenteuses ou autres. Entre témoignage personnel et guide pratique, ce livre offre aux patients et à leurs proches une compréhension approfondie de cette pathologie complexe, dont les symptômes et les réponses aux traitements varient d'un individu à l'autre. Il invite à dédramatiser, à mieux comprendre et à vivre pleinement malgré la maladie.",isbn:"9782390253709",extraUrl:"https://covers.openlibrary.org/b/isbn/9782390253709-M.jpg"},
  {t:"Bienvenue à Dietland",a:"Walker Sarai",y:"2026",ed:"Editions Gallmeister",cote:"R WAL",pub:"Adulte",sup:"Imprimé",d:"Prune vit dans l'ombre, prisonnière d'un corps que la société refuse d'accepter. Rédactrice anonyme pour un magazine destiné aux adolescentes, elle répond aux lettres désespérées de jeunes filles brisées. Mais l'apparition mystérieuse d'une jeune femme aux collants colorés et le mot énigmatique \"Dietland\" tracé sur sa paume vont tout bouleverser. Prune découvre un monde où les femmes refusent les diktats de la beauté et de la minceur. Tandis qu'un mouvement féministe radical et violent du nom de \"Jennifer\" secoue le pays, elle doit choisir : continuer à fuir son reflet ou enfin affronter la vérité sur elle-même. Entre rage contenue et quête d'identité, Sarai Walker signe un roman féministe coup de poing, aussi féroce que libérateur, qui interroge avec audace les normes étouffant les femmes.",isbn:"9782404081090",extraUrl:"https://covers.openlibrary.org/b/isbn/9782404081090-M.jpg"},
  {t:"Au saccage des petits bonheurs",a:"Cyrulnik Boris",y:"2026",ed:"Editions Odile Jacob",cote:"155.9 CYR",pub:"Adulte",sup:"Imprimé",d:"\"Pourrait-on vivre sans civilisation ? Un enfant sauvage privé de relations humaines n'a aucune chance de devenir humain. Chez les animaux, déjà, les rituels d'interaction harmonisent les rencontres. Chez les humains, les rituels de civilisation organisent les relations quotidiennes et facilitent l'art de vivre ensemble. On utilise une fourchette, on découpe la viande, on se tient bien à table, on respecte les tours de parole, ce qui met en scène des scénarios différents selon les cultures et les époques. Depuis les années 1990, ces rituels sont mal transmis, les mots ne désignent plus les mêmes choses, les récits discordants désorganisent les petits bonheurs de la vie quotidienne, provoquent l'amertume et l'explosion des incivilités. Que se passe-t-il dans notre culture ? Les enfants sont anxieux, les femmes pensent au suicide, les hommes décrochent et les agressions sexuelles augmentent, révélant ainsi une décivilisation des moeurs. Par bonheur, après chaque catastrophe, une renaissance invente de nouveaux rituels, rétablit une autre manière d'être heureux ensemble. Il nous faut réinventer une civilité pour permettre une coexistence harmonieuse entre hommes et femmes, entre adultes et enfants, entre humains différents - mais aussi entre les humains et la nature\", B. C. Un grand message d'espoir.",isbn:"9782415015091",extraUrl:"https://covers.openlibrary.org/b/isbn/9782415015091-M.jpg"},
  {t:"Le crépuscule des dieux",a:"Duhamel Patrice",y:"2026",ed:"Editions de l'Observatoire",cote:"320 DUH",pub:"Adulte",sup:"Imprimé",d:"Après des années de combat contre la maladie, Georges Pompidou et François Mitterrand n'avalent ni la force de présider ni le courage de démissionner. Quand la souffrance d'un président devient insupportable, quand l'épuisement brouille le jugement, quand les traitements altèrent le caractère, c'est l'Etat tout entier qui vacille. Chez un chef d'Etat, cette vérité devient un problème politique et institutionnel majeur. En 1955, les médecins de De Gaulle découvrent l'anévrisme qui le tuera. Le général ne le saura jamais. Le professeur Jean Bernard diagnostique la leucémie de Pompidou huit mois avant son élection. Le secret durera au-delà même de la mort du président. En 1981, Mitterrand apprend qu'un cancer métastasé lui laisse entre trois mois et deux ans à vivre. Il tiendra quatorze ans, au prix de douleurs parfois difficilement compatibles avec ses fonctions et de bulletins de santé mensongers. En 2005, un AVC change insidieusement la fin de la présidence Chirac. Grâce à un document saisissant, le journal de Jean Bernard, et à partir de nouveaux témoignages et d'archives rares, Patrice Duhamel retrace, dans une enquête inédite, ces drames intimes devenus mensonges d'Etat. Où s'arrête le secret médical quand il s'agit du chef des armées et du gardien de l'arme nucléaire ? Quand un président n'a plus la force de présider, qui doit le dire - et qui ose le faire ?",isbn:"9791032939284",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032939284-M.jpg"},
  {t:"Un couple sulfureux",a:"Bonneau Daniel",y:"2026",ed:"Plon",cote:"B BON",pub:"Adulte",sup:"Imprimé",d:"L'histoire fascinante des Morand, le couple le plus sulfureux de la littérature française. Hélène et Paul Morand, le couple le plus sulfureux de la littérature française. Lui, l'écrivain vedette des Années folles, tombé un temps dans l'oubli pour avoir choisi le mauvais côté de l'Histoire. Elle, la muse diabolique, accusée d'être à l'origine des dérives de son mari. Pour la première fois, ce livre dévoile la vérité d'Hélène et son importance capitale dans l'oeuvre de celui dont L. F. Céline disait qu'il était \" le premier qui ait jazzé la langue française \". Enfant de l'Empire d'Orient et de la Mitteleuropa, Hélène a fasciné ses contemporains. Elle parlait sept langues, sa culture était immense, sa repartie cinglante. Combien de femmes ont été l'inspiratrice de Proust, l'amie de Cocteau et ont ébloui Ernst Jünger ? Suivre ce couple mythique, c'est vivre au rythme haletant de l'histoire du XXe siècle. Connaître la magnificence et la chute. Traverser un échange virevoltant où se côtoient le meilleur de la langue et le pire des idées. Ce livre est à la fois l'histoire d'un écrivain, d'une femme, d'un amour et d'un siècle. Avec en arrière-plan, omniprésente, la littérature, la grande affaire de leur vie.",isbn:"9782259321235",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259321235-M.jpg"},
  {t:"Le jour ou je suis devenu espion",a:"Crouzet Vincent",y:"2026",ed:"Editions de l'Observatoire",cote:"330 CRO",pub:"Adulte",sup:"Imprimé",d:"\"Je souhaite raconter non pas un, mais des jours J, ceux qui m'ont construit dans mon activité d'agent de renseignement au sein du \"service clandestin\" de la DGSE. Qui m'ont fait me confronter, à la fin de la guerre froide, aux fractures du monde, auprès des personnalités les plus extraordinaires que j'aie jamais rencontrées. Il sera question évidemment d'opérations clandestines, de manipulations, d'apprentissage de \"couvertures\" et de \"légendes\", d'officiers traitants, d'infiltration dans les milieux criminels. Contrebandier au côté des guérilleros, marchand de carburant et de bien d'autres choses, consultant dans le milieu diamantaire d'Anvers, j'ai connu mille vies, du Liban au Congo, du Caire au Cap, au service de mon pays. Bienvenue dans ce métier fantasmé, digne des plus grands romans d'espionnage.\"",isbn:"9791032937068",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032937068-M.jpg"},
  {t:"Le chemin des gens perdus",a:"Moulins Xavier de",y:"2026",ed:"Flammarion",cote:"R MOU",pub:"Adulte",sup:"Imprimé",d:"\"Je me demande si quelqu'un s'inquiète de notre disparition, si on a donné l'alerte. Parce que, à un moment, il faut arrêter de se voiler la face, appeler un chat, un chat : on est des disparus\". Certains chemins ne mènent nulle part. D'autres vous ramènent à vous-même. Pour son treizième roman, Xavier de Moulins signe une fable mystérieuse et addictive. Vous ne verrez plus jamais la forêt du même oeil.",isbn:"9782080159373",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080159373-M.jpg"},
  {t:"La gouvernante de Marilyn",a:"Morlet Laurent",y:"2026",ed:"Charleston",cote:"R MOR",pub:"Adulte",sup:"Imprimé",d:"5 août 1962. Dans une lettre destinée à sa soeur, la gouvernante de Marilyn Monroe s'interroge : \"Est-ce moi qui l'ai tuée ? \" Rien ne prédestinait Eunice Murray, issue d'une famille très pieuse de Chicago, à côtoyer la plus grande star hollywoodienne de tous les temps. Pourtant, à l'aube de ses soixante ans, après avoir traversé une vie d'errance et de deuils, la chance semble enfin lui sourire quand elle entre au service de Marilyn. Dans l'intimité de l'hacienda d'Helena Drive, les deux femmes s'apprivoisent. Pendant neuf mois, Eunice partage les joies et les tourments de l'actrice comme personne avant elle. Jusqu'au jour où elle trouve Marilyn inanimée dans son lit. Que s'est-il véritablement passé la nuit du 4 au 5 août 1962, alors qu'elles étaient seules dans la maison ? Laurent Morlet est un producteur français établi à Los Angeles depuis une vingtaine d'années. Pour La Gouvernante de Marilyn, son premier roman, il a mené un vaste travail de recherche, mêlant témoignages et archives inédites, notamment autour de la célèbre maison d'Helena Drive.",isbn:"9782385295172",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385295172-M.jpg"},
  {t:"Le livre de la culpabilité",a:"Chidgey Catherine",y:"2026",ed:"Editions Gallmeister",cote:"R CHI",pub:"Adulte",sup:"Imprimé",d:"En 1979, dans un monde où personne n'a gagné la Seconde Guerre mondiale, l'Angleterre est dirigée par un gouvernement qui repose sur des alliances inquiétantes. Des triplés de treize ans - Vincent, Lawrence et William - sont les derniers résidents d'un foyer pour garçons. Chaque jour, ils prennent leurs médicaments et étudient sous l'oeil vigilant de trois mères : Mère du Matin, Mère de l'Après-midi et Mère de la Nuit. Ils ne désirent qu'une chose : rejoindre les orphelins chanceux qu'on envoie dans une station balnéaire mythique. Non loin de là, Nancy, treize ans également, mène une vie recluse avec ses parents qui l'adorent mais ne la laissent jamais sortir. Lorsque la route des triplés croise celle de Nancy, les enfants découvrent la terrible vérité sur leurs origines et devront s'unir pour survivre. Mélange envoûtant de fable gothique et de suspense psychologique, Le Livre de la culpabilité dévoile les sombres secrets d'un monde où certaines vies ont moins de valeur que d'autres.",isbn:"9782351783856",extraUrl:"https://covers.openlibrary.org/b/isbn/9782351783856-M.jpg"},
  {t:"Réussir sa déco pour être bien chez soi",a:"Noula Stella",y:"2026",ed:"Editions Jouvence",cote:"643 MAI",pub:"Adulte",sup:"Imprimé",d:"Ce livre n'est pas un guide de décoration parfaite à tout prix. Ce livre n'est pas un condensé des \"faux pas déco\" à éviter absolument. Ce livre est en revanche votre meilleur allié bien-être pour faire de votre intérieur un lieu qui vous ressemble et vous ressource. Architecte d'intérieur et décoratrice, Stella Noula partage ici tout ce qu'elle applique au quotidien dans ses projets : comprendre l'impact réel de la décoration sur notre humeur, choisir les bonnes couleurs, placer le mobilier intelligemment, jouer avec la lumière, trouver l'équilibre entre tendances et intemporalité... mais aussi apprendre à écouter ses envies, ses habitudes et son mode de vie. A travers des conseils concrets et des méthodes faciles à appliquer, ce livre vous aidera à identifier les ambiances qui vous apaisent ou au contraire vous fatiguent ; rendre une pièce plus grande sans pousser les murs ; créer des combinaisons de couleurs et matières qui fonctionnent à tous les coups ; éviter les erreurs déco les plus courantes ; bâtir un chez-vous à votre image. Plus qu'un guide déco, c'est un véritable outil de transformation personnelle, qui vous accompagnera dans la création d'un lieu où vous vous sentez vraiment bien.",isbn:"9782889840656",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889840656-M.jpg"},
  {t:"La Maison des trois soeurs",a:"Mosca Lyliane",y:"2026",ed:"Presses de la Cité",cote:"R MOS",pub:"Adulte",sup:"Imprimé",d:"Trois femmes de caractère, trois destins bouleversés par la Grande Guerre et la révélation d'un trésor au coeur de la campagne champenoise. Par l'autrice de La Vie rêvée de Gabrielle . Victoire a toujours rêvé d'être écrivaine. Elle a accepté un peu à contrecoeur de s'installer avec son compagnon dans une vieille maison de la campagne champenoise, mais tout change lorsqu'elle apprivoise la demeure, et qu'elle découvre des lettres et des journaux intimes datant de la Première Guerre mondiale. Il y est question de trois soeurs dont les vies dans la tourmente de la guerre vont devenir une formidable source d'inspiration pour l'aspirante romancière. Il y a Camélia, au fort caractère, qui dirige seule son moulin ; Iris, une infirmière au grand coeur, au chevet des blessés de la Grande Guerre ; Anémone, couturière, qui attend son fiancé parti au front. La réalité et la fiction se mêlent entre espoir, courage, devoir, amour, et la révélation d'un secret légué par leur mère. Dans un roman tout en sensibilité, des héroïnes magnifiques au destin bouleversé.",isbn:"9782258211759",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258211759-M.jpg"},
  {t:"Le pollen du Monte Urticando",a:"Franquin André",y:"2022",ed:"Dupuis",cote:"BDJ YAN",pub:"Jeunesse",sup:"Imprimé",d:"Les cactus Comilt millénaires de la vallée Monte Urticando, fleurissent tous les quinze ans. Cela est le signe que les petits marsupilamis doivent se rendent dans cette vallée pour apprendre à se débrouiller tout seul. Et même s'ils doivent y rencontrer un adversaire tenace, Gatogordo le jaguar...",isbn:"9791034766307",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791034766307-475x500-1.jpg"},
  {t:"Un Petit Tour",a:"Howe Simon",y:"2026",ed:"Kaléidoscope",cote:"A HOW",pub:"Jeunesse",sup:"Imprimé",d:"Un souriceau et son papa se promènent dans la nature. Ils flânent le long d'un ruisseau, admirent les insectes, les nuages... Mais où vont-ils tous ainsi ? Avec délicatesse, Simon Howe signe un album contemplatif et tendre qui invite à prêter attention à ce qui nous entoure... et à savourer le bonheur simple de retrouver le chemin de la maison.",isbn:"9782378883362",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782378883362-475x500-1.jpg"},
  {t:"L'hypnotiseur",a:"Kepler Lars",y:"2026",ed:"Actes Sud",cote:"R KEP",pub:"Adulte",sup:"Imprimé",d:"Erik Maria Bark, psychiatre spécialisé dans le traitement des traumas aigus, a longtemps été l'un des rares véritables experts de l'hypnose médicale. Jusqu'au jour où une séance d'hypnose profonde a très mal tourné. Dix ans plus tard, l'inspecteur Joona Linna le réveille en pleine nuit : Josef, un adolescent, a assisté au massacre de sa famille. Le seul moyen d'interroger le garçon, inconscient et en état de choc, est de pénétrer son subconscient par l'hypnose pour tenter de revoir le carnage à travers ses yeux. Ils sont encore loin de se douter du spectacle horrifique qui les attend... Rythme effréné, richesse et complexité des personnages, écriture au cordeau : un roman policier d'une intelligence redoutable doublé d'un thriller terrifiant.",isbn:"9782330220150",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330220150-M.jpg"},
  {t:"Le Huit",a:"Neville Katherine",y:"2025",ed:"Pocket",cote:"R NEV",pub:"Adulte",sup:"Imprimé",d:"De la Révolution française au XXe siècle, la lutte pour la possession d'un jeu d'échecs aux inquiétants pouvoirs... Provence, 1790. Un \" printemps sanglant \" s'est abattu sur l'abbaye de Montglane. Les cerisiers en fleur, surpris par le gel, nappent le pays de prophétiques taches rouges. La rumeur gronde, les biens de l'Eglise seront bientôt confisqués. Talleyrand, le \" diable boiteux \", convoiterait même les trésors de Montglane. Alertée, la mère supérieure disperse les pièces d'un mystérieux jeu d'échecs, cadeau des Maures au roi Charlemagne... New York, 1972. Approchée par un étrange antiquaire, Catherine Velis se lance sur la piste du légendaire échiquier. De Catherine de Russie à Marat, de Robespierre à Napoléon, elle n'est pas la première. Mais les pièces l'ont choisie : elle sera leur reine noire. \" Un roman époustouflant. \" Le Figaro Magazine Fresque monumentale doublée d'un puzzle diabolique, ce livre est devenu, depuis sa première parution en 1988, un classique du thriller historique, peut-être le sommet du genre.",isbn:"9782266353984",extraUrl:"https://covers.openlibrary.org/b/isbn/9782266353984-M.jpg"},
  {t:"Grand Prince",a:"Stresi Alexia",y:"2026",ed:"Flammarion",cote:"R STR",pub:"Adulte",sup:"Imprimé",d:"L'existence, c'est formidable, paraît-il. C'est surtout long, estime Simone Guillou. A 85 ans, elle pense heureusement avoir fait le plus gros. Il ne peut plus rien lui arriver. Vraiment ? Elle ne le sait pas, Simone. Elle est à mille lieues de s'en douter. Mais la vie lui réserve enfin une surprise... A Barthon-en-Retz, entre océan Atlantique et campagne, il sera question d'un crapaud en ciment, d'une enquête pas tout à fait policière, de la récolte du sel, et d'amour. Ah, et aussi de Pierre Soulages. Le peintre ? Oui, le peintre. Après le succès Des lendemains qui chantent, Alexia Stresi signe un roman lumineux qui confirme son talent pour créer des personnages inoubliables. Grand prince raconte l'inattendu renouveau d'une vie.",isbn:"9782080511256",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080511256-M.jpg"},
  {t:"Au dodo maintenant !",a:"Iriyama Satoshi",y:"2026",ed:"Milan",cote:"A IRI",pub:"Jeunesse",sup:"Imprimé",d:"Les bruits de la forêt empêchent cinq petits ratons laveurs de s'endormir. Ils finissent par trouver le sommeil chacun leur tour, sauf le petit dernier, à qui la nuit réserve une belle surprise...",isbn:"9782408059163",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782408059163-475x500-1.jpg"},
  {t:"Ces grands-parents qui t'aiment infiniment",a:"Lewalle Capucine",y:"2026",ed:"Editions Casterman",cote:"A LEW",pub:"Jeunesse",sup:"Imprimé",d:"Une vibrante déclaration d'amour aux grands-parents. Sur notre planète, il y a plein de grands-parents à qui l'on donne des noms tendres ou surprenants... Mamie, Manou, Nonna, Babouchka, ou Mouty, Papy, Papou, Pépé, Grandpa, ou bien Daddy. Et parmi eux, il y a tes grands-parents qui t'aiment infiniment. Capucine Lewalle présente une joyeuse galerie de grands-parents et met en lumière ce lien si fort qui unit un petit enfant à son aïeul. Une déclaration d'amour à offrir à ceux qui tiennent une place toute particulière dans le coeur des enfants. Un grand format avec couverture cartonnée.",isbn:"9782203303607",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203303607-475x500-1.jpg"},
  {t:"Sibylline",a:"Dano Sixtine",y:"2025",ed:"Glénat",cote:"BD DAN",pub:"Adulte",sup:"Imprimé",d:"Chroniques d'une escort girl A tout juste 19 ans, Raphaëlle ressemble à toutes les jeunes filles de son âge. Fraîchement débarquée à Paris pour ses études d'archi, elle enchaîne à un rythme effréné les cours, les nuits blanches à travailler sur ses maquettes, les soirées à servir des bières ou à refaire le monde avec sa nouvelle meilleure amie. Mais ce que ses camarades d'amphi ne savent pas c'est que certains soirs Raphaëlle se glisse dans les draps d'hôtels parisiens et récolte quelques billets verts. Avec son tout premier roman graphique, Sixtine Dano crée la surprise. Avec l'élégance de l'encre et du fusain elle dépeint les questions existentielles du passage de l'enfance à l'âge adulte, l'exploration de la féminité et des rapports de pouvoir dans une société marquée par le patriarcat et le capitalisme. Au scénario et au dessin la jeune artiste signe un récit terriblement moderne, à la fois intime et politique : une pépite graphique réussie à ne pas manquer.",isbn:"9782344060049",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344060049-M.jpg"},
  {t:"1986, le voyage perdu",a:"Peyrin Laurence",y:"2026",ed:"Calmann-Lévy",cote:"R PEY",pub:"Adulte",sup:"Imprimé",d:"Key West, 1986. Dans ce décor du bout du monde noyé de soleil et d'océan, Freya et Danii ont quasiment grandi ensemble. Les deux jeunes filles se ressemblent peu, l'une est aussi réservée que l'autre est flamboyante, et pourtant leur amitié est fusionnelle. Pour leurs vingt ans, Freya la raisonnable se laisse convaincre par Danii de partir dans un road trip à travers la Floride. Destination Cap Canaveral et le décollage de la navette Challenger, symbole de liberté, d'espoir et de dépassement. Cheveux au vent et Madonna en bande-son, les deux amies s'élancent sur la mythique Overseas Highway, cette route suspendue au-dessus des eaux turquoise. Une aventure qui va les entraîner bien plus loin que prévu, car l'explosion de Challenger n'est pas la tempête la plus violente qu'elles subiront. Les secrets de famille vont se fissurer, la loyauté vaciller, l'enfance s'éloigner... Et l'amour tout bouleverser",isbn:"9782702184240",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702184240-M.jpg"},
  {t:"Chercher le bonheur",a:"Nille Peggy",y:"2022",ed:"Actes Sud",cote:"1042003331",pub:"Jeunesse",sup:"Imprimé",d:"Une nouvelle pépite signée Peggy Nille ! Une aventure pleine de philosophie et de poésie, où l'on suit les questionnements d'un petit pingouin sur le bonheur.",isbn:"9782330167783",extraUrl:"https://www.base-orb.fr/visuels-pim/image/base/9782330167783-475x500-1.jpg"},
  {t:"Bêêê, oui ! Meuh, non !",a:"Gutman Colas",y:"2026",ed:"L'École des loisirs",cote:"A MAU",pub:"Jeunesse",sup:"Imprimé",d:"Petit mouton cherche sa famille, il demande à la vache si elle est sa maman, mais elle lui répond MEUH, NON ! Il demande au tigre s'il est son papa, mais il lui répond GRRR, NON ! Le serpent répond TSSS, NON ! quand il lui demande s'il est sa tata... Pauvre petit mouton... quand va-t-il retrouver quelqu'un de sa famille ?",isbn:"9782211349024",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782211349024-475x500-1.jpg"},
  {t:"Est-ce que vous êtes prêts ?",a:"Ma Daishu",y:"2026",ed:"minedition",cote:"A MA",pub:"Jeunesse",sup:"Imprimé",d:"La petite souris organise une fête. Est-ce que tout le monde sera prêt ? Une histoire qui se jour dans la pénombre et se termine dans la lumière de la fête.",isbn:"9782354137861",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137861-475x500-1.jpg"},
  {t:"Chamanes électriques à la fête du Soleil",a:"Ojeda Monica",y:"2026",ed:"Gallimard",cote:"R OJE",pub:"Adulte",sup:"Imprimé",d:"An 5550 du calendrier andin. Noa et Nicole fuient Guayaquil en direction des sommets de la cordillère des Andes et gagnent les flancs du Chimborazo, le plus haut volcan d'Equateur. Là-bas a lieu un festival mythique qui rassemble chamanes, poètes, danseurs et musiciens à l'occasion de la fête du Soleil inca. Avec d'autres festivaliers, les deux jeunes femmes viennent se soustraire à la violence des sociétés menacées par le narcotrafic et les catastrophes climatiques dans cette immense rave party qui vibre au rythme de la technocumbia spatiale. Mais quand la troupe décide de poursuivre l'ascension du volcan, Noa fait face à son destin : partira-t-elle retrouver son père qui mène une existence d'ermite dans les forêts ? D'autant qu'on raconte que là-bas, dans les hauteurs, vivent des communautés secrètes de jeunes disparus qui ne sont jamais revenus du festival... Dans ce roman postapocalyptique au souffle stupéfiant, Mónica Ojeda déploie une fresque ensorcelante qui dépeint une génération désenchantée en quête d'espoir. Sous les pluies de météorites, la musique expérimentale néochamanique et les légendes ancestrales andines s'allient pour réconcilier passé, présent et avenir.",isbn:"9782073075406",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073075406-M.jpg"},
  {t:"Hermès le Malicieux",a:"Prévot Pascal",y:"2026",ed:"Larousse",cote:"J PRE",pub:"Jeunesse",sup:"Imprimé",d:"P'tit Hermès est un dieu fourbe et malicieux. Il n'hésite pas à faire des farces aux autres dieux, notamment en volant leurs biens les plus précieux. Pour calmer leur colère, Zeus charge Hermès d'accomplir une nouvelle mission : libérer la vache sacrée Io, gardée par le géant Argos. Mais les dieux mécontents cherchent à se venger : ils n'hésitent pas à placer plein d'obstacles sur la route du dieu messager. Hermès va devoir mobiliser toute son ingéniosité pour mener sa quête à bien.",isbn:"9782036089341",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782036089341-475x500-1.jpg"},
  {t:"Yona, Princesse de l'Aube T46",a:"Kusanagi Mizuho",y:"2026",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Yona et Zeno ont été a aspirés par la coupe de sang. À l'intérieur, ils retrouvent les autres guerriers dragons. Enfin réunie, la petite bande cherche à s'échapper et à rentrer sur Terre'",isbn:"9791043307638",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043307638-M.jpg"},
  {t:"Ibiza a beaucoup changé",a:"Beigbeder Frédéric",y:"2026",ed:"Albin Michel",cote:"R BEI",pub:"Adulte",sup:"Imprimé",d:"\"Nous ne savions pas que les années 1990 seraient nos plus belles années. Nous avions entre vingt et trente ans. Un siècle se terminait, un monde nouveau allait naître. Comment aurions-nous pu deviner que notre liberté était provisoire ? La \"décennie dorée\" (1989-2001) fut le dernier instant d'humanité avant le World Wide Web. On se demandait ce que le troisième millénaire nous réservait : la réponse fut Google, Tinder, Facebook, Instagram, TikTok, YouTube, Netflix, YouPorn, Spotify, WhatsApp et ChatGPT\". Frédéric Beigbeder",isbn:"9782226490155",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226490155-M.jpg"},
  {t:"Je suis drôle",a:"Foenkinos David",y:"2026",ed:"Gallimard",cote:"R FOE",pub:"Adulte",sup:"Imprimé",d:"Gustave a compris une chose essentielle : faire rire, c'est être aimé. Alors il décide de faire rire tout le monde. Ce sera sa force, son talent, sa politesse envers les autres. Il en fera un métier, puis une identité. Il n'avait pas prévu que ce serait si dangereux.",isbn:"9782073152985",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073152985-M.jpg"},
  {t:"L'Enfant de la vallée",a:"Groenink Chuck",y:"2026",ed:"Little urban",cote:"A GRO",pub:"Jeunesse",sup:"Imprimé",d:"Depuis la grotte de sa montagne, un garçon rêve de retourner dans la vallée. Ici, il a sa famille mais là-bas le monde l'attend. En chemin, des animaux courent, sautent, volent et bondissent partout autour de lui, jusqu'à arriver près de la rivière, là où un autre garçon se trouve...",isbn:"9782374082134",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782374082134-475x500-1.jpg"},
  {t:"Echec à la reine",a:"Ilesi Alyerel",y:"2026",ed:"Scrineo",cote:"J ILE",pub:"Adolescent",sup:"Imprimé",d:"Terrasul est dirigé par des reines masquées érigées au rang de divinités. La princesse Viviane est amenée à régner. En attendant, chaque été, ses parents l'envoient loin du palais pour qu'elle puisse vivre encore quelques moments d'insouciance. Elle y rencontre Andreas à qui elle est forcée de cacher sa véritable identité. Et ils tombent amoureux. Malheureusement, leurs devoirs respectifs finissent par les séparer. Car le jeune homme porte lui aussi de lourds secrets. Des années plus tard, Viviane se prépare à défendre son reinaume en guerre. Et se retrouve confrontée au spectre de ses décisions passées... Amour, trahison, complots, pouvoir... un roman magistral porté par de magnifiques personnages, confrontés à des choix impossibles...",isbn:"9782381674926",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782381674926-475x500-1.jpg"},
  {t:"Brûlez tout",a:"Molmy Christophe",y:"2025",ed:"Fayard",cote:"R MOL",pub:"Adulte",sup:"Imprimé",d:"Cette nuit-là, un feu ravage la permanence d'un député. Le lendemain, un relais 5G explose. Quelques jours plus tard, un essayiste célèbre est violemment agressé, un avocat menacé de mort. A chaque fois, la même revendication, la même signature : un mystérieux groupe sème la terreur... et diffuse ses exploits sur les réseaux sociaux, sous les yeux d'une France sidérée. Face à cette vague de crimes spectaculaires, Sacha Letellier, flic à l'ancienne, se lance dans une course contre la montre. Marqué par une fusillade qui a pulvérisé sa vie, incompris de ses collègues, il doit affronter une criminalité nouvelle, insaisissable, qui se nourrit du chaos numérique et défie la police à chaque clic. Mais quand la technologie devient le terrain de jeu des criminels, Sacha n'a plus qu'une arme : son instinct. Et s'il était le seul à pouvoir faire tomber ce réseau qui rêve d'insurrection ? Christophe Molmy est flic et écrivain. Ancien patron de la BRI de Paris, il dirige aujourd'hui la brigade de protection des mineurs. Brûlez tout est son septième roman.",isbn:"9782213733920",extraUrl:"https://covers.openlibrary.org/b/isbn/9782213733920-M.jpg"},
  {t:"Trois Mexique",a:"Le Clézio Jean-Marie Gustave",y:"2026",ed:"Gallimard",cote:"R LEC",pub:"Adulte",sup:"Imprimé",d:"\"Ce qui importe à Juana Inés de la Cruz, c'est le chemin du labyrinthe, la vérité que le dédale cachait à Thésée, et que seul le fil d'Ariane pouvait révéler, puisque l'amour était au bout\". Dans ce récit lumineux, J. M. G. Le Clézio se penche sur trois figures mexicaines de son panthéon personnel : la poétesse soeur Juana Inés de la Cruz (1651-1695), génie méconnu et féministe avant l'heure ; l'écrivain Juan Rulfo (1917-1986), mythique auteur du roman Pedro Páramo et d'un seul recueil de nouvelles, véritable inventeur du réalisme magique ; et Luis González y González (1925-2003), historien de son village perché natal, qui est la première expression de ce qui deviendra plus tard la microhistoire. Par leur attachement à la terre, leur \"mexicanité\" instinctive et leur recherche d'authenticité dans l'écriture, Cruz, Rulfo et González illustrent des thèmes chers au plus mexicain des auteurs français.",isbn:"9782073137210",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073137210-M.jpg"},
  {t:"Razzia",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Avant de devenir l'un des cinq Légendaires mythiques, Razzia s'appelait Korbo, l'ombre rouge. Pour venger sa famille, il tue un à un les membres de l'armée des mille loups. Jusqu'au jour où il croise la route de Ténébris qui lui propose de créer un monde meilleur et de diriger à ses côtés l'armée de son père, Darkhell, le sorcier noir.",isbn:"9782756064789",extraUrl:"https://products-images.di-static.com/image/base/9782756064789-475x500-1.jpg"},
