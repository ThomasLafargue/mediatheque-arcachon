<script>
const FLIP=5000, POPUP=60000;

function toASIN(isbn13){
  if(!isbn13||!isbn13.startsWith('978')||isbn13.length!==13) return null;
  const d=isbn13.slice(3,12);
  let s=0; for(let i=0;i<9;i++) s+=parseInt(d[i])*(10-i);
  const c=(11-(s%11))%11;
  return d+(c===10?'X':String(c));
}

function buildUrls(doc){
  const urls=[];
  if(doc.extraUrl) urls.push(doc.extraUrl);
  const asin=toASIN(doc.isbn);
  if(asin){
    urls.push(`https://images-na.ssl-images-amazon.com/images/P/${asin}.01.LZZZZZZZ.jpg`);
    urls.push(`https://m.media-amazon.com/images/P/${asin}.01._SX300_.jpg`);
    urls.push(`https://images-eu.ssl-images-amazon.com/images/P/${asin}.01._SX300_.jpg`);
  }
  if(doc.isbn&&doc.isbn.startsWith('978'))
    urls.push(`https://covers.openlibrary.org/b/isbn/${doc.isbn}-L.jpg`);
  return urls;
}

// Essaie chaque URL et renvoie une Promise résolue avec l'URL valide, ou null si aucune ne fonctionne
function tryUrlsAsync(urls){
  return new Promise(resolve=>{
    function attempt(list){
      if(!list.length){ resolve(null); return; }
      const [url,...rest]=list;
      const img=new Image();
      img.onload=()=>{
        (img.naturalWidth>10 && img.naturalHeight>img.naturalWidth*0.8) ? resolve(url) : attempt(rest);
      };
      img.onerror=()=>attempt(rest);
      img.src=url;
    }
    attempt(urls);
  });
}

  {t:"Sacrées sorcières",a:"Bagieu Pénélope",y:"2020",ed:"Gallimard",cote:"BDJ DAH",pub:"Jeunesse",sup:"Imprimé",d:"Les sorcières n'ont qu'un but, éliminer les enfants qu'elles détestent, grâce à leur apparence tout à fait ordinaire. Un jeune garçon qui vit avec sa grand-mère, chasseuse de sorcières, apprend à les reconnaître à ses dépens, tout en déjouant un complot mené par la Grandissime sorcière. ©Electre 2020",isbn:"9782075126939",extraUrl:"https://www.base-orb.fr/visuels-pim/image/base/9782075126939-475x500-1.jpg"},
  {t:"Chaos",a:"Ogaki Philippe",y:"2020",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Les Mythics ont réussi à libérer Gaïa. Mais, sans le savoir, ils ont aussi rendu sa liberté au Chaos. Le Mal tente d'en prendre le contrôle et un combat s'engage au pied de la tour Eiffel. ©Electre 2020",isbn:"9782413019671",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413019671-M.jpg"},
  {t:"Frigiel et Fluffy / Le secret d'Oriel",a:"Frigiel (youtubeur)",y:"2019",ed:"Slalom",cote:"J FRI",pub:"Adolescent",sup:"Imprimé",d:"Enora, la mère de Frigiel, est bien décidée à invoquer le Dévoreur à la surface pour éradiquer la magie. Impitoyable, elle a quitté l'Ender avec le bloc de commande sans un regard pour son fils. Coincés dans la dimension, le mage et ses compagnons doivent délivrer Alice, retenue en otage par Ourepo, tout en esquivant les attaques du Dévoreur. Mais le monstre affamé semble indestructible. Frigiel et ses amis parviendront-ils à quitter l'Ender sans dommages ? Retrouveront-ils la trace de la prêtresse du Culte avant qu'elle n'invoque le dévoreur dans les Farlands ? Auront-ils le temps d'atteindre les îles célestes d'Oriel pour y trouver de l'aide ? Une chose est sûre : Enora n'a pas fini de les surprendre...",isbn:"9782375541234",extraUrl:"https://static.fnac-static.com/multimedia/Images/FR/NR/8f/84/aa/11175055/1540-1/tsp20191009152557/Le-secret.jpg"},
  {t:"La vérité toute moche",a:"Kinney Jeff",y:"2012",ed:"Seuil",cote:"J KIN",pub:"Jeunesse",sup:"Imprimé",d:"Greg grandit et découvre les secrets de la « puberté », cette étrange maladie que son copain Robert espère bien ne pas attraper... Entre les deux amis, rien ne va plus. Après une grosse dispute, Greg perd son plus fidèle allié et se retrouve seul pour faire face à des problèmes de plus en plus nombreux... Pourra-t-il échapper à l'appareil dentaire ? Participer aux soirées du collège et se faire de nouveaux amis ? En tout cas, il devra apprendre à se remettre en question et faire face à une douloureuse vérité... Lire un extrait sur www.journaldundegonfle.fr",isbn:"9782021060119",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021060119-M.jpg"},
  {t:"Le Gardien",a:"Sobral Patrick",y:"2004",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Danaël, Gryf, Jadina, Shimy et Razzia, cinq justiciers aux pouvoirs fantastiques, font la fierté du monde d'Alysia. Mais, lors d'un ultime combat les opposant à Darkhell, le Sorcier Noir, une épouvantable malédiction s'abat sur leur monde : tous ses habitants - eux compris !- retrouvent leur apparence d'enfant. Aujourd'hui, rejetés par les leurs, les cinq Légendaires veulent briser le sortilège... L'aventure ne fait que commencer !",isbn:"9782847894776",extraUrl:"https://www.bedetheque.com/cache/thb_couv/LegendairesLes2_20112004.jpg"},
  {t:"Gourmandise",a:"Ogaki Philippe",y:"2022",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Parvati débarque à Montréal chez son cousin qui cherche à mettre au point des pilules pour guérir l'obésité. Elle prend cependant le temps de se téléporter régulièrement pour retrouver les autres Mythics, en particulier Albi, qu'elle trouve un peu trop proche d'Amir à son goût. Mais l'heure n'est pas à la jalousie car le maléfique Wendigo cherche à contrefaire les recherches de son cousin. ©Electre 2022",isbn:"9782413041047",extraUrl:"https://products-images.di-static.com/image/base/9782413041047-475x500-1.jpg"},
  {t:"Coeur d'etoile",a:"Colman Stéphane",y:"2013",ed:"Dupuis",cote:"BDJ BAT",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9782800160429",extraUrl:"https://images-eu.ssl-images-amazon.com/images/I/51R0PZPfVQL.jpg"},
  {t:"Le Secret de la grue blanche",a:"Huet-Gomez Christelle",y:"2011",ed:"nobi nobi !",cote:"C HUE",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9782918857075",extraUrl:"https://covers.openlibrary.org/b/isbn/9782918857075-M.jpg"},
  {t:"La soeur à la perle",a:"Riley Lucinda",y:"2020",ed:"Charleston",cote:"R RIL",pub:"Adulte",sup:"Imprimé",d:"A la mort de leur père, énigmatique milliardaire qui les a adoptées aux quatre coins du monde lorsqu'elles étaient bébés, CeCe d'Aplièse et ses soeurs se retrouvent dans la maison de leur enfance, Atlantis, un magnifique château sur les bords du lac de Genève. CeCe, la quatrième soeur, ne s'est jamais vraiment sentie à sa place, et au décès de son père, elle se retrouve complètement perdue. N'ayant que les quelques indices que ce dernier lui a laissés, elle part à la recherche de ses origines jusque dans la chaleur et la poussière du centre rouge de l'Australie. Alors qu'elle découvre des secrets enfouis depuis bien longtemps, elle commence à penser que ce vaste et sauvage continent pourrait lui offrir quelque chose qu'elle a toujours cru impossible : un sentiment d'appartenance et un foyer... La Soeur à la perle est le quatrième tome de la série événement Les Sept Soeurs, qui a conquis 20 millions de lecteurs dans le monde entier. A travers ces romans au souffle unique, peuplés de personnages inoubliables, liés par les drames et l'amour, Lucinda Riley a affirmé comme jamais auparavant son immense talent, créant un nouveau genre littéraire à part entière. Déjà cinq tomes parus aux éditions Charleston !",isbn:"9782368125151",extraUrl:"https://covers.openlibrary.org/b/isbn/9782368125151-M.jpg"},
  {t:"Crazy Kart",a:"Davis Jim",y:"2013",ed:"Dargaud",cote:"BDJ DAV",pub:"Jeunesse",sup:"Imprimé",d:"Garfield décide cette fois de tester ses nouvelles inventions sur Odie et Jon. Au volant d?un bolide, il va entraîner ses amis dans une course-poursuite endiablée.",isbn:"9782205071528",extraUrl:"https://products-images.di-static.com/image/base/9782205071528-475x500-1.jpg"},
  {t:"(Pas encore) une histoire de sorcière",a:"Roussey Christine",y:"2026",ed:"La Martinière",cote:"A ROU",pub:"Jeunesse",sup:"Imprimé",d:"Vous en avez assez des histoires de sorcières traditionnelles ? Parfait ! Car voici l'histoire de Scarrrmozzaaaa, la sorcière la plus nulle, la plus moche et la plus terrifiante de tous les temps ! Avec sa verrue sur le nez, son chat Gros Relou et ses pieds qui puent, elle prépare sa GRANDE VENGEANCE dans sa cabane au fond des bois.",isbn:"9791040125631",extraUrl:"https://m.media-amazon.com/images/I/51s0MrgHsSL._SX195_.jpg"},
  {t:"Kindergarten wars",a:"Chiba You",y:"2026",ed:"Ki-oon",cote:"BD KIN",pub:"Adulte",sup:"Imprimé",d:"Découvrez la maternelle la plus sécurisée du monde et ses enseignants au tempérament... explosif !  Après l'effort, le réconfort ! Maintenant que la menace que représentaient Choran et Hiromi a été neutralisée, les employés de la maternelle Black peuvent enfin prendre un peu de repos et préparer la fête de l'école. L'occasion rêvée pour Rita et Doug d'avouer leurs sentiments...  Mais le chemin qui mène au happy end s'annonce semé d'embûches pour la Sorcière et l'escroc : entre leur travail d'instituteur et la protection des élèves, pas facile de trouver le temps de se dire des mots doux ! Et si une enquête de nuit sur les phénomènes paranormaux qui ont lieu dans l'école rapprochait nos deux tourtereaux ?  Travailler avec des enfants n'est pas de tout repos ! Entre deux activités toboggan, il ne faut pas oublier de s'occuper des kidnappeurs et autres tueurs à gages... Avec son mélange détonant d'humour, d'action et de romance, Kindergarten Wars est une véritable récré, les cocktails molotov en plus !",isbn:"9791032724323",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032724323-M.jpg"},
  {t:"Terres de lumières",a:"Boussaha Illiès",y:"2024",ed:"EPA Editions",cote:"915.044 BOU",pub:"Adulte",sup:"Imprimé",d:"En quête d'un monde meilleur, Camille et Illiès parcourent les sentiers du monde. Passionnés de rencontres et d'apprentissage, ils ont quitté leur vie sédentaire pour s'aventurer là où ils ne pensaient pas aller. Un changement de vie radical les incite à réaliser des documentaires tout en partageant les coulisses de leur quotidien. Dans \" Terres de lumières \", ils reconstituent deux années de voyage, qui les ont conduits de la mer Caspienne jusqu'aux contreforts de l'Himalaya. Ils se lancent sur les traces de lieux et de peuples mythiques : les jardins d'Ispahan, le peuple Baloutche, les vallées isolées de l'Himalaya ou encore les fakirs du Sindh. Témoins de la beauté et de la diversité de notre planète, chaque photographie et chaque histoire qui l'accompagne invitent à apprendre de l'autre. Un périple fascinant où les limites du temps et de l'espace s'estompent pour laisser place à un horizon de merveilles.",isbn:"9782376711643",extraUrl:"https://covers.openlibrary.org/b/isbn/9782376711643-M.jpg"},
  {t:"Monstre rose",a:"Dios Olga de",y:"2026",ed:"Père Fouettard",cote:"A DIO",pub:"Jeunesse",sup:"Imprimé",d:"Monstre Rose est trop grand, trop rose, trop tout. Enfin c'est ce qu'il croit, ais ce ne sont pas les autres qui vont le contredire. Alors direction un monde à sa taille !",isbn:"9782371651494",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782371651494-475x500-1.jpg"},
  {t:"Les Schtroumpfs",a:"Peyo",y:"2023",ed:"Hachette",cote:"LJ PEY",pub:"Jeunesse",sup:"Imprimé",d:"Le Grand Schtroumpf, le Schtroumpf à Lunettes, la Schtroumpfette... Retrouve tes personnages préférés et de nombreux objets dans chacune des scènes schtroumpfantes de ce livre. A toi de jouer !",isbn:"9782017246787",extraUrl:"https://products-images.di-static.com/image/base/9782017246787-475x500-1.jpg"},
  {t:"Curiosity",a:"Motum Markus",y:"2019",ed:"Gallimard",cote:"J 523.4 MOT",pub:"Jeunesse",sup:"Imprimé",d:"Une aventure qui transcende la fiction et vous entraîne au-delà des étoiles, au coeur d'une des plus grandes questions de l'univers. Connaissez-vous Curiosity ? Découvrez l'incroyable histoire de ce rover envoyé sur Mars pour essayer de comprendre pourquoi cette planète autrefois accueillante est devenue hostile aujourd'hui. Doté de 17 caméras, de 6 roues motrices, d'un laboratoire portatif et d'un rayon laser, Curiosity sillonne Mars à la recherche d'une trace de vie et de la vérité.",isbn:"9782075136785",extraUrl:"https://products-images.di-static.com/image/base/9782075136785-475x500-1.jpg"},

  {t:"Le Sac",a:"Adbåge Emma",y:"2026",ed:"Cambourakis",cote:"A HOB",pub:"Jeunesse",sup:"Imprimé",d:"Maman et papa ont fait le ménage ce week-end. On le voit tout de suite. Sauf qu'on ne peut pas ranger tant que ça sans rien jeter, pas vrai ? Et puis, ce grand sac noir, dans l'entrée, c'est suspect...",isbn:"9782386691003",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782386691003-475x500-1.jpg"},

  {t:"C'est dans ma nature !",a:"Salerno Angela",y:"2026",ed:"La Martinière",cote:"A SAL",pub:"Jeunesse",sup:"Imprimé",d:"Es-tu de nature plutôt bavarde, timide, espiègle, impatiente, câline, ou tout cela à la fois ?",isbn:"9791040126027",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040126027-475x500-1.jpg"},
  {t:"Histoire mondiale du Covid",a:"Audureau William",y:"2026",ed:"Allary éditions",cote:"614 AUD",pub:"Adulte",sup:"Imprimé",d:"La pandémie de Covid-19 est un événement planétaire dont la véritable histoire restait à écrire. Une histoire au suspense haletant, thriller planétaire où se mêlent disputes scientifiques, épidémie de désinformation et rivalités géopolitiques. Chacun de nous l'a vécu en direct, dans un étourdissant flot d'informations et de fausses informations qui enveloppa cette tragédie d'un épais brouillard. Comment les événements se sont-ils enchaînés ? Que savaient scientifiques et politiques ? Qu'ignoraient-ils ? Quelles informations ont été dissimulées ? Grâce aux milliers de documents rendus public, il est aujourd'hui possible de le savoir. Notes déclassifiées des agences de renseignement, courriels entre chercheurs, directives du gouvernement chinois, témoignages sous serment de décideurs américains, sms entre ministres et présidents européens... Autant de pièces d'un immense puzzle que William Audureau a réunies et ordonnées pour proposer cette première histoire mondiale du Covid. Une histoire qui ressemble d'abord à un compte à rebours, tant cette tragédie était une catastrophe annoncée, avant de virer au film catastrophe. Une histoire au suspense haletant, thriller planétaire où se mêlent disputes scientifiques, épidémie de désinformation et rivalités géopolitiques.",isbn:"9782370736048",extraUrl:"https://covers.openlibrary.org/b/isbn/9782370736048-M.jpg"},
  {t:"Bonne nuit !",a:"Tourlonias Joëlle",y:"2026",ed:"minedition",cote:"A TOU",pub:"Jeunesse",sup:"Imprimé",d:"Un livre interactif pour se préparer à aller au lit ! On se brosse les dents, on fait pipi, et on va au lit... et les peluches, où sont-elles ? Deux frères se préparent à se coucher. L'enfant suit toutes les étapes une à une et grâce aux tirettes et aux rabats sur chaque double page, il est aussi acteur de la lecture.",isbn:"9782354137755",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137755-475x500-1.jpg"},
  {t:"Peut-être le hasard",a:"Charnet Agathe",y:"2026",ed:"Les Corps Conducteurs",cote:"R CHA",pub:"Adulte",sup:"Imprimé",d:"Professeure de philosophie, Marie-Pierre a dû sacrifier ses rêves de cinéma aux tâches domestiques et à la charge mentale maternelle. A l'aube de ses 50 ans, alors qu'elle a divorcé et que ses enfants quittent la maison, une catastrophe percute sa nouvelle existence : elle commence à chercher ses mots, puis à les perdre. Elle ne peut plus enseigner ; elle est atteinte d'un Alzheimer précoce. Cette femme est la mère de l'autrice. Celle-ci lui redonne en littérature la place qui aurait dû être la sienne, raconte l'irruption de la maladie et ses bouleversements, et un parcours de soin où s'instaure une relation de jeune aidante à malade, avec ses moments de joie, ses espoirs, ses abîmes. D'une écriture rageuse et empathique, Agathe Charnet retrace deux trajectoires de femmes de générations différentes, et nous interroge avec une franchise saisissante : comment accompagnons-nous nos proches quand ils souffrent ? Qu'est-ce qu'une fin de vie et une mort dignes ? En bref : comment résister et apporter du soin face aux douleurs qui nous affligent ?",isbn:"9782488557108",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488557108-M.jpg"},
  {t:"Une année terrestre",a:"Brunet Dragon Sarah",y:"2025",ed:"Les Avrils",cote:"808.1 BRU",pub:"Adulte",sup:"Imprimé",d:"Venu du Québec, le roman-poème de la grande aventure de la maternité. C'est une année ordinaire et périlleuse, qui transforme radicalement le rapport au temps, au corps, à la famille, à la mémoire, à l'écriture. Une année où la vie apparaît. Une fille comme un lapin de velours. A la sortie du terrier, dans la lumière de l'automne, le présent n'est soudain plus le même. Car dans l'expérience de la maternité, le langage s'ouvre à un réel amplifié.",isbn:"9782383110491",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383110491-M.jpg"},
  {t:"La sorcière aux yeux de lune",a:"Dahman Myriam",y:"2025",ed:"Gallimard",cote:"C DAH",pub:"Jeunesse",sup:"Imprimé",d:"Ses yeux peuvent voir la vérité même dans les âmes les plus secrètes. Découvrez le nouveau chef-d'oeuvre des créateurs du Talisman du loup et Leina et le Seigneur des Amanites, célébrant la sincérité et le pouvoir de l'amitié.",isbn:"9782075228732",extraUrl:"https://products-images.di-static.com/image/base/9782075228732-475x500-1.jpg"},
  {t:"Je sommes plusieurs",a:"Bayard Pierre",y:"2025",ed:"Les Editions de Minuit",cote:"155.2 BAY",pub:"Adulte",sup:"Imprimé",d:"Plutôt que de présenter l'être humain comme déchiré entre des pulsions contradictoires, ne serait-il pas plus simple d'admettre que chacun·e d'entre nous abrite différentes personnes, qui parfois ne se connaissent même pas ? Une telle évolution théorique, qui devrait logiquement nous inciter à prendre plusieurs noms, contribuerait à apaiser la vie en société, puisqu'il n'y aurait plus de sens à reprocher aux politiciens de changer d'avis, à accuser son conjoint d'adultère ou à condamner les malfaiteurs pour des actes qu'ils ont commis à leur insu.",isbn:"9782707356857",extraUrl:"https://covers.openlibrary.org/b/isbn/9782707356857-M.jpg"},
  {t:"Les oursons de l'air",a:"Lobel Arnold",y:"2026",ed:"L'École des loisirs",cote:"J LOB",pub:"Jeunesse",sup:"Imprimé",d:"Dans le livre préféré de grand-père, il est écrit qu'un ours doit absolument savoir se promener, se reposer, attraper du poisson et grimper aux arbres. Ronald, Donald, Harold et Sam, eux, préfèrent jouer du violon, faire des triples saltos ou manier un lasso. Grand-père décide de prendre les choses en main.",isbn:"9782211349666",extraUrl:"https://products-images.di-static.com/image/base/9782211349666-475x500-1.jpg"},
  {t:"Les plus grands fleuves du monde",a:"Mehnert Volker",y:"2021",ed:"Rue du Monde",cote:"551.48 MEH",pub:"Jeunesse",sup:"Imprimé",d:"Un documentaire présentant 18 des plus grands fleuves du globe et ce qui les entoure : la faune, la flore, les villes, l'économie, les hommes au cours de leur histoire et les questions écologiques. Chaque double page donne de nombreuses informations sur chacun de ces cours d'eau grâce à des vignettes. Au centre de l'ouvrage, une quadruple page détaille en particulier ce qui a trait au Nil. ©Electre 2021",isbn:"9782355046681",extraUrl:"https://www.babelio.com/couv/CVT_Les-plus-grands-fleuves-du-monde_229.jpg"},
  {t:"1966, année mirifique",a:"Compagnon Antoine",y:"2026",ed:"Gallimard",cote:"944.083 6",pub:"Adulte",sup:"Imprimé",d:"\"L'année des cheveux longs et de la minijupe\", résume le journal rétrospectif des Actualités françaises le 27 décembre 1966. Sommet des Trente Glorieuses, arrivée des enfants du baby-boom à l'âge adulte, début d'une révolution accélérée des moeurs et entrée dans la société d'abondance, 1966 a été une année tournant sur de nombreux fronts - démographique, économique, politique, social et culturel. C'est à restituer le tissu de ses jours que s'attache cette enquête profondément novatrice où se croisent, entre marée structuraliste et Nouvelle Vague, Georges Perec, Michel Foucault, le briquet jetable, André Malraux, les livres de poche, La Grande Vadrouille, la microcassette Philips, ainsi que Marguerite Duras, Aragon, Jean-Luc Godard, Roland Barthes et bien d'autres. Il y est question de choses et de mots, de sons et d'images, mais encore d'histoire et de sociologie, de cinéma et de télévision, de poésie et de musique, de révolte aussi - deux ans avant Mai -, et de mémoire, avec le débat sur les camps d'extermination. Il n'en faut pas moins pour recomposer cet incendie prodigieux qui marque un seuil entre deux époques.",isbn:"9782073130112",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073130112-M.jpg"},
  {t:"Azur et le mystère de la pièce d'or",a:"Beauvais Clémentine",y:"2022",ed:"Rageot",cote:"A BEA",pub:"Jeunesse",sup:"Imprimé",d:"Paris, au tournant du XXe siècle. Pour gagner sa vie, Azur, orphelin, porte à vélo les lettres les plus urgentes de la capitale. Un jour, il remarque une enveloppe différente des autres. A l'intérieur, il y a... une pièce d'or ! Azur se laisse tenter : il garde la pièce et le message qu'il devait livrer...",isbn:"9782700277289",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782700277289-475x500-1.jpg"},
  {t:"Le pacte de Venise",a:"Massimi Fabiano",y:"2026",ed:"Albin Michel",cote:"R MAS",pub:"Adulte",sup:"Imprimé",d:"\"Massimi s'impose définitivement comme l'un des plus sérieux prétendants à la succession de Philip Kerr\". Le Figaro Magazine Place Saint-Marc, juin 1934. Benito Mussolini et Adolf Hitler se rencontrent pour la première fois en public. Dans la foule des chemises noires, l'ancien commissaire Siegfried Sauer et son compère, Mutti. En lien avec la résistance antifasciste, ils sont venus pour mettre à exécution une mission à haut risque. Mais une mystérieuse affaire les détourne de leur projet. Une affaire qui concerne l'intimité de Mussolini et la vie d'une femme... Après le succès de L'Ange de Munich et des Démons de Berlin, Fabiano Massimi poursuit une fresque sombre et captivante, et nous raconte une histoire de bruit et de fureur, de passion charnelle et de scandale, celle d'Ida Dalser, première épouse du Duce, mère de leur fils caché. Il puise ainsi parmi les grands secrets de l'Histoire la matière d'un suspense hors norme. Traduit de l'italien par Renaud Temperini",isbn:"9782226500373",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226500373-M.jpg"},
  {t:"Rapport d'activité",a:"Orokieta Sarah",y:"2026",ed:"Editions Zoé",cote:"R ORO",pub:"Adulte",sup:"Imprimé",d:"Loïc, trente et un ans, mène une existence bien rangée qui lui convient parfaitement : la semaine, il travaille ; le soir, il regarde les informations et des documentaires historiques ; le dimanche, il change ses draps. Le jour où un ami l'encourage à tenir un journal intime, Loïc hésite. \"C'est pour les cassos\", lui confirme sa soeur. Il décide de se lancer quand même - et se retrouve, au fil des mois, à consigner méthodiquement la façon dont son existence entière se dérègle peu à peu. Ce premier roman déjoue les attentes et les codes pour épouser jusqu'au bout la logique de son narrateur, un homme qui s'efforce de comprendre les autres et de deviner ce qu'on attend de lui. Mais au-delà de son intériorité, ce qu'évoque cette voix atypique, hachée, tour à tour drôle et poignante, c'est le monde contemporain, ses violences, ses espoirs, ses contradictions et son absurdité.",isbn:"9782889075706",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889075706-M.jpg"},
  {t:"Encore une folle semaine pour M. Dubois",a:"Lewis-Jones Huw",y:"2026",ed:"Kimane",cote:"A LEW",pub:"Jeunesse",sup:"Imprimé",d:"Un lundi matin, M. Dubois découvre que l'ours a emprunté son vélo et l'a cassé. Les roues sont toutes tordues. Comment va-t-il pouvoir se rendre au travail ? Encore une folle semaine qui commence pour M. Dubois et il n'est pas au bout de ses surprises !",isbn:"9782383224761",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383224761-475x500-1.jpg"},
  {t:"Le déni",a:"Perlant Hélène",y:"2026",ed:"Michel Lafon",cote:"364 PER",pub:"Adulte",sup:"Imprimé",d:"\" Il y a quelque chose de vraiment très puissant et très intelligent qui traverse tout ce livre. \" - Sonia Devilliers, La Grande Matinale de France Inter \" Bouleversant. \" - Juliette Hochberg, Marie-Claire BRISER LE SILENCE, COMPRENDRE LE DENI : LE LIVRE-EVENEMENT D'HELENE PERLANT \"Le geste déplacé s'est déroulé au milieu d'une assistance nombreuse, une fête de famille, une sortie de groupe. Ou devant les gens que vous aimez, qui sont censés vous aimer aussi, enfin, vous croyiez. Et là, rien. Un coup de Jarnac. C'est l'incrédulité, qui s'étend, se redouble, se retourne contre elle-même\". Bétharram n'a pas seulement révélé des violences. Il a mis au jour un mécanisme : l'impossibilité de dire non. Dans Le Déni, Hélène Perlant analyse la manière dont des dispositifs de perversion s'installent et se maintiennent, non par ignorance ou par mensonge, mais par des formes de survie, de honte sociale et de détournement du regard. La violence peut alors se déployer à ciel ouvert tout en devenant impensable. En interrogeant la confusion persistante entre absence de réaction et consentement, ce livre démonte un système collectif et donne des outils pour penser ce qui, trop longtemps, a empêché de vivre.",isbn:"9782749963365",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749963365-M.jpg"},
  {t:"Mouette",a:"Rouchon-Borie Dimitri",y:"2026",ed:"Le Tripode Editions",cote:"R ROU",pub:"Adulte",sup:"Imprimé",d:"Après Le Démon de la Colline aux Loups et Le Chien des étoiles, Dimitri Rouchon-Borie confirme avec Mouette sa puissance narrative et le talent avec lequel il fait jaillir la poésie de la noirceur. Un homme se réveille dans l'obscurité, cerné de parois humides et froides. De sa vie et de ce qui l'a mené ici, il ne sait rien. Sur les traces de sa mémoire, il explore les entrailles de ce qu'il nomme Le Boyau, un immense labyrinthe souterrain dont il est prisonnier, et qui semble vivant. Il croisera le chemin de trois hommes sans souvenirs, réunis malgré eux et coopérant dans une violence latente pour chercher une issue. Jusqu'à ce qu'une femme, Mouette, surgisse et vienne bousculer l'ordre établi, portant avec elle la tendresse et l'espoir. Empli de beauté et de lumière, ce roman est une plongée dans les profondeurs des pensées et du coeur d'un homme égaré. Dimitri Rouchon-Borie, auteur du Démon de la Colline aux Loups, poursuit avec ce cinquième livre la construction d'une oeuvre singulière. Celle d'un auteur dont les textes sont empreints d'humanisme, et font jaillir de l'obscurité la poésie.",isbn:"9782370554802",extraUrl:"https://covers.openlibrary.org/b/isbn/9782370554802-M.jpg"},
  {t:"Petit pays",a:"Faye Gaël",y:"2026",ed:"Voir de près",cote:"R FAY",pub:"Adulte",sup:"Imprimé",d:"\"Avant, Gabriel faisait les quatre cents coups avec ses copains dans leur coin de paradis. Et puis l'harmonie familiale s'est disloquée en même temps que son « petit pays », le Burundi, ce bout d'Afrique centrale brutalement malmené par l'Histoire. Plus tard, Gabriel fait revivre un monde à jamais perdu. Les battements de cœur et les souffles coupés, les pensées profondes et les rires déployés, le parfum de citronnelle, les termites les jours d'orage, les jacarandas en fleur… L'enfance, son infinie douceur, ses douleurs qui ne nous quittent jamais.\"",isbn:"9782378288662",extraUrl:"https://covers.openlibrary.org/b/isbn/9782378288662-M.jpg"},
  {t:"Islande",a:"",y:"2022",ed:"Lonely Planet",cote:"914.912 ISL",pub:"Adulte",sup:"Imprimé",d:"Pour vivre la destination au plus près Un guide Lonely Planet pour s'imprégner de la culture, de l'art de vivre et des paysages grandioses de l'Islande et vivre une expérience immersive du pays. Regarder, marcher, écouter, sentir, goûter, un guide qui fait appel à tous les sens pour vivre intensément son séjour. Des pages introductives thématiques pour aborder le pays sous tous les angles : histoire et sagas, sources d'eau chaude, gastronomie, volcans et glaciers, sites perdus... Les régions islandaises à ne pas manquer (Reykjavík, le Cercle d'Or, la péninsule de Reykjanes, Vestmannaeyjar (îles Vestmann), les fjords de l'Ouest, etc.) traitées sous forme d'activités, de promenades et de visites incontournables ou insolites. Des cartes des principales régions et des clés pour construire son trajet en un clin d'œil. De nombreuses propositions d'activités nature et de plein air (plongée dans le parc national de Þingvellir, paddle dans la vallée du Hvítá, approche d'un volcan sur la péninsule de Reykjanes, découverte des macareux sur les îles Vestmann, baignade dans des sources d'eau chaude... partout !) pour s'évader et s'émerveiller dans des paysages grandioses. Et toujours : des informations pratiques pour préparer son séjour et ses visites. Une carte détachable du pays avec les incontournable par région et des propositions d'itinéraires.LA COLLECTION \" DECOUVERTES ET EXPERIENCES \" Un guide construit autour d'expériences pour sortir des sentiers battus, découvrir les sites incontournables de manière originale, changer sa manière de voyager : apprendre à cuisiner, s'initier aux savoir-faire locaux, emprunter les chemins de traverse en compagnie d'habitants, assister à une démonstration d'artisans, etc. Pour chaque région, des expériences pour une immersion dans la nature et les paysages grandioses : randonner sur les plus beaux sentiers, pagayer sur des eaux sauvages, parcourir les plus belles routes en van ou à vélo, plonger dans des sources chaudes ou des vagues...",isbn:"9782816195842",extraUrl:"https://covers.openlibrary.org/b/isbn/9782816195842-M.jpg"},
  {t:"Matcha thérapie",a:"Massarotto Cyril",y:"2026",ed:"Nami",cote:"R MAS",pub:"Adulte",sup:"Imprimé",d:"Quand la douceur du matcha apaise les blessures de l'âme... A Montmartre, Etienne, papa solo de jumeaux, tient une pharmacie de quartier pas comme les autres. Persuadé que la parole guérit autant que les médicaments, il propose aux habitués comme aux clients de passage de discuter autour d'un délicieux thé matcha. Un soir, alors que l'officine est déjà fermée, une inconnue frappe à la grille et supplie Etienne de lui fournir le nécessaire pour mettre fin à ses jours. Bouleversé, le pharmacien lui propose un marché, sans savoir que cette rencontre va devenir la chance de sa vie. Dans ce roman drôle et profond, Cyril Massarotto célèbre les amitiés qui naissent du hasard et se révèlent plus fortes que tout.",isbn:"9782487606258",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487606258-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2025",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Yona et Hak sont de retour à Kûto. Tandis que l atmosphère se fait de plus en plus pesante, ils se dirigent là où tout a commencé pour Zeno, au château de Hiryû...",isbn:"9791043303098",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303098-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2025",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Zeno a enfermé l les trois autres dragons dans la coupe de sang. Il explique alors que pour pouvoir mettre fin à ses jours, il doit renvoyer les guerriers dragons au ciel. Puis il fait ses adieux à Yona et Hak&",isbn:"9791043300134",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043300134-M.jpg"},
  {t:"Audace et Préjugés",a:"Karklins-Marchay Alexis",y:"2024",ed:"Presses de la Cité",cote:"820.9 KAR",pub:"Adulte",sup:"Imprimé",d:"Armées de leur plume, elles ont défendu leurs droits et exprimé leur puissance créatrice. Depuis des siècles, des femmes s'élèvent avec audace contre l'inégalité qui règne entre les genres. Parmi elles, trois autrices anglaises se sont particulièrement distinguées : Jane Austen, Charlotte Brontë et Virginia Woolf. En quoi leurs textes sont-ils toujours aussi actuels et percutants, au point que l'on continue de s'en inspirer ? L'auteur nous invite à une promenade littéraire débutant avec O rgueil et Préjugés, dont l'héroïne affirme son droit à faire un mariage d'amour. Elle se poursuit avec Jane Eyre, qui aspire à l'indépendance, et s'achève avec Une chambre à soi, où Virginia Woolf revendique l'importance de l'intimité et de la créativité pour les femmes.",isbn:"9782258207660",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258207660-M.jpg"},
  {t:"De l'autre côté de la rivière",a:"Talty Morgan",y:"2026",ed:"Albin Michel",cote:"R TAL",pub:"Adulte",sup:"Imprimé",d:"\"Je voulais que la petite connaisse la vérité. Je voulais qu'elle sache qui j'étais - qui j'étais réellement, plutôt que cet homme blanc qui habitait en face de chez elle depuis toujours et qui la regardait grandir de l'autre côté de la rivière\". Charles Lamosway a grandi sur une réserve indienne du Maine dont il est aujourd'hui séparé par un cours d'eau. C'est là que vit Elizabeth, sa fille, qui ignore qu'il est son père. La cinquantaine venue, Charles ressent l'urgence de se libérer de ce secret trop longtemps gardé. Elevé par une mère blanche et un beau-père autochtone, abîmé par la vie, hanté par la mort de son beau-père lors d'un accident de chasse, il se raccroche au seul lien qui lui donne l'impression d'exister. Tandis qu'il s'apprête à révéler la vérité à Elizabeth, la jeune femme disparaît mystérieusement, le plongeant dans une inquiétude plus grande encore. D'une écriture âpre et singulière, Morgan Talty raconte l'histoire d'une famille déchirée par le mensonge. Interrogeant les notions d'appartenance et d'identité, il leur oppose l'amour d'un père pour sa fille.",isbn:"9782226494641",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226494641-M.jpg"},
  {t:"Moi d'abord !",a:"Escoffier Michaël",y:"2010",ed:"Frimousse",cote:"A ESC",pub:"Jeunesse",sup:"Imprimé",d:"C’est l’histoire d’un caneton qui veut toujours être le premier. Que maman canne (ou papa canard, difficile de trancher!) propose une promenade, une partie de pêche (aux canards, bien sûr) ou une baignade… «Moi d’abord, moi d’abord» cancanne l’insupportable palmidède en envoyant au tapis toute sa fratrie. Aussi quand il entend crier «À table!» ce n’est évidemment qu’un cri… mais à trop se précipiter on a quelquefois de bien mauvaises surprises!",isbn:"9782352410553",extraUrl:"https://www.babelio.com/couv/CVT_cvt_Moi-dabord-_9651.jpg"},
  {t:"Magimage",a:"Albon Lucie",y:"2024",ed:"Thierry Magnier",cote:"A ALB",pub:"Jeunesse",sup:"Imprimé",d:"Ce livre est vraiment magique : il transforme les images grâce à un simple miroir. Et voici comment le poisson se transforme soudain... en chat !",isbn:"9791035207243",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035207243-475x500-1.jpg"},
  {t:"1776",a:"Van Ruymbeke Bertrand",y:"2026",ed:"Coédition Tallandier/Ministère des armées",cote:"973 VAN",pub:"Adulte",sup:"Imprimé",d:"Le 4 juillet 1776, treize colonies d'Amérique du Nord se proclament indépendantes de la Grande-Bretagne, donnant naissance à une nation nouvelle : un événement destiné à bouleverser l'équilibre du monde. Ce moment fondateur est le fruit d'une série de choix politiques et stratégiques décidés de part et d'autre de l'Atlantique : les délégués du Congrès continental à Philadelphie, pris entre l'enthousiasme de leur lutte et les risques encourus face à une Angleterre toute puissante ; le Parlement, les ministres et le roi George III à Londres, intransigeants face à ce qu'ils perçoivent comme une rébellion et, à Versailles, le ministre des Affaires étrangères, Vergennes, et Louis XVI, impatients de prendre leur revanche sur l'amère défaite de la guerre de Sept Ans. Des enjeux considérables sont au coeur des débats : l'indépendance de treize colonies qui quittent le plus grand empire de l'époque, devenant une ligue de républiques indépendantes et, pour la France, l'entrée dans une guerre totale contre la Grande-Bretagne. Ce livre retrace pas à pas l'enchaînement de ces étapes, de la Boston Tea Party, le début de la révolte américaine en décembre 1773, à l'arrivée de Benjamin Franklin en France en décembre 1776. Il éclaire tout particulièrement les sept mois cruciaux, de janvier à juillet 1776, qui mènent à la naissance des Etats-Unis.",isbn:"9791021049499",extraUrl:"https://covers.openlibrary.org/b/isbn/9791021049499-M.jpg"},
  {t:"Skateparks",a:"Andreu David",y:"2023",ed:"Editions Place des Victoires",cote:"725.8 MEL",pub:"Adulte",sup:"Imprimé",d:"Découvrez Skateparks, un voyage à travers les designs innovants et modernes des meilleurs skateparks internationaux. Un incontournable pour les architectes, designers et skateurs qui souhaitent explorer l'évolution de ces lieux emblématiques, véritables centres sociaux et sportifs du monde entier. Ce beau-livre passe en revue les travaux récents des meilleurs designers contemporains, à la pointe de la technologie et novateurs dans la conception et le design de ces espaces si particuliers. David Andreu, avec l'aide et les conseils de Luka Melloni (Vulcano Skateparks), a rassemblé une sélection de skateparks internationaux à l'esprit particulier, des espaces conçus et construits par des techniciens et des sportifs pratiquants. Ce livre est un outil utile pour les architectes, les designers, les paysagistes, les constructeurs, les urbanistes et bien sûr pour les skateurs du monde entier, qui veulent se tenir au courant de l'évolution des skateparks, des rampes et des pumptracks qui ont été récemment construits pour leur usage et leur plaisir. Les skateparks ne sont pas seulement des terrains de sport. Pour les jeunes en particulier, ils remplissent diverses fonctions sociales au-delà du sport.",isbn:"9782809920239",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809920239-M.jpg"},
  {t:"La colline qui travaille",a:"Manevy Philippe",y:"2025",ed:"Le Bruit du monde",cote:"R MAN",pub:"Adulte",sup:"Imprimé",d:"\"J'écris pour que les êtres et les liens qui les unissent cessent de se distendre et de disparaitre\". Le bruit d'un téléphone, l'odeur de l'eau de Javel, le goût d'un nescafé... Philippe Manevy tire le fil du souvenir et tisse l'étoffe d'un roman familial sur quatre générations en commençant justement parle personnage d'Alice, sa grand-mère maternelle, tisseuse de métier. Pointilleuse et déterminée, elle devint la figure de proue d'un mouvement ouvrier au lendemain de la victoire du Front populaire. Très vite, René, son époux, fait son apparition dans le récit. Ancien sportif, il fut un typographe possiblement engagé, avec d'autres héros de l'ombre, dans un acte spectaculaire de résistance. Tous deux parents dévoués de Martine, ils seront prêts à tout pour assurer le futur de leur fille studieuse et appliquée. Chaque chapitre met en lumière un membre de la famille aux prises avec les épreuves que lui réservent son époque et l'existence. Apparaissent progressivement des liens entre eux et des échos que l'auteur consigne ici, sans rien cacher des doutes qui surgissent au fil de son travail d'écriture. Et l'on traverse ainsi deux guerres mondiales, des crises économiques, les Trente glorieuses, les espoirs et les désillusions du XXe siècle. Déclaration d'amour et hommage vibrant à la classe ouvrière, La colline qui travaille revigore le genre de la chronique familiale et offre au lecteur un sentiment de réconfort et de douce nostalgie.",isbn:"9782386010460",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386010460-M.jpg"},
  {t:"Teruko & Loui",a:"Inoue Areno",y:"2026",ed:"Philippe Picquier",cote:"R INO",pub:"Adulte",sup:"Imprimé",d:"Elles s'appellent Teruko et Loui et sont les meilleures amies du monde. A 70 ans, elles entreprennent une grande évasion du foyer conjugal et d'un foyer pour seniors : une équipée de rêve et sans le sou à travers le Japon dans de grands éclats de rire à répétition. Loui, dans sa robe panthère et sous sa doudoune fluo, gagne sa vie en chantant des chansons françaises dans les bars, et Teruko, qui se dit volontiers mamie mauvais genre, exerce son talent de \"divination par les cartes\" dans des petits cafés. Leur nouvelle vie démarre vent arrière, pleines voiles. Teruko et Loui, c'est avant tout une grande histoire d'amitié, des instants poétiques et des rêveries partagées, une exaltation devant ce qu'est la vie. A tour de rôle, elles sont l'une et l'autre sages ou fantasques, impertinentes ou allègres, la bouteille de whisky dans une main et le bâton de rouge à lèvres dans l'autre. Toutes deux prétendent avoir la vie devant elles et se lancent aussi bien dans des déclarations d'amour que dans des folies culinaires pour la préparation d'un dîner de Noël improvisé, dans le brouhaha de toutes les voix de leurs nouveaux amis. Pour tout dire, elles sèment autour d'elles joies et excentricités et un goût immodéré de la vie.",isbn:"9782809717402",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809717402-M.jpg"},
  {t:"Napoléon",a:"Jannin Frédéric",y:"2024",ed:"Graine de Loup jeunesse",cote:"944.05 JAN",pub:"Jeunesse",sup:"Imprimé",d:"Deux siècles après la mort de Napoléon Bonaparte (1769 - 1821), que savent les enfants de son histoire'Clotilde Jannin fait revivre dans cet album quelques épisodes fameux de la légende napoléonienne. Elle sest attachée à lenfance et à la jeunesse de cet « enfant corse » que rien ne prédestinait à devenir empereur, avant de décrire quelques grands moments de sa carrière militaire sans oublier le couronnement, la campagne de Russie et lexil à Sainte-Hélène. Napoléon a gouverné la France pendant seize années. Grâce à son génie militaire, il a dominé lEurope, reconstituant lempire de Charlemagne, mille ans après lempereur à la barbe fleurie. Ces conquêtes auront été faites au prix de la vie de dix millions de soldats et son orgueil ambitieux aura été la cause de sa chute. Mais son souvenir est encore présent dans nos lois, le baccalauréat, la Légion dHonneur... Le petit officier corse adoré par ses soldats, détesté par les uns, admiré par les autres, a pris sa place dans lHistoire de France. AUTEURS Mère de famille passionnée par lHistoire, habitant à Cherbourg, auteur de plusieurs biographies pour la jeunesse (Éd. Edilys), Clotilde Jannin a choisi de raconter, dans un style direct, très vivant et riche en dialogues, quelques épisodes parmi les plus significatifs de la vie de Napoléon Bonaparte. Formé aux Arts Appliqués de Lyon, longtemps directeur artistique dans la publicité, féru dhistoire, de littérature et de bande dessinée, Cyril Flautat vit avec sa famille au coeur des montagnes de Savoie. Il a déjà publié trois livres en tant quauteur et illustrateur : William Adams le samouraï des mers (Éd. du Jasmin) ; Au temps des samouraïs (Éd. Fleurus) ; Les Ténèbres de lInquisition (Éd. Elisa), tous fondés sur lhistoire. Conjuguant savoir-faire classique et savoir-faire digital, il a créé des illustrations aussi documentées quénergiques.",isbn:"9782487568013",extraUrl:"https://products-images.di-static.com/image/base/9782487568013-475x500-1.jpg"},
  {t:"Le vin des poilus",a:"Corbeyran",y:"2024",ed:"Glénat",cote:"BD COR",pub:"Adulte",sup:"Imprimé",d:"1916. Dans la Vallée de la Marne, les soldats français englués dans la boue des tranchées se donnent du courage avec une ration quotidienne de vin. Mais ils sont nombreux à juger ce breuvage imbuvable. Certains prétendent que le bon vin de Bourgogne est réservé aux officiers, tandis que les soldats hériteraient de la piquette ! Parmi eux, Gaston, un jeune homme dont le père était vigneron prend le débat à cœur. Les différentes appartenances régionales liées à la production de vin avivent parfois les tensions entre les poilus qui restent attachés à leur terroir. Alors, quand le mercanti, le marchand civil, vient ravitailler les tranchées, Gaston commande sa ration en évitant l’absinthe dont d’autres raffolent… Pendant ce temps, à Reims, des kilomètres de caves abritent un trésor que les obus n’ont pas encore détruit : le champagne ! La collection s’agrandit avec un album qui revisite l’histoire viticole de la France, prise dans la tourmente de la Grande Guerre de 14-18. Une période noire pour la production au cours de laquelle le marché mondial du vin prend un tournant. Un portrait documenté qui rend hommage à la diversité des cépages et nous rappelle l’effort de guerre des femmes pendant le conflit.",isbn:"9782344041932",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344041932-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Les combats qui opposent le pays de Kôka et le Kai du sud gagnent en intensité. Bien qu'enrôlé au seinde l'armée du Kai du sud, Hak agit pour la victoire du pays de Kôka, jusqu'au moment où il se retrouve nez à nez avec le Général Laan avec qui il a déjà croisé le fer. Ainsi privé d'anonymat, il se retrouve en péril…",isbn:"9782811680381",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811680381-M.jpg"},
  {t:"L'école des superhéros",a:"Bloch Serge",y:"2022",ed:"BD Kids",cote:"J BLO",pub:"Jeunesse",sup:"Imprimé",d:"Le super-héros SamSam fait sa rentrée des classes, avec sa maîtresse Marie-Agnès, qu'il adore, et ses camarades de l'école. ©Electre 2022",isbn:"9791036350504",extraUrl:"https://products-images.di-static.com/image/base/9791036350504-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Yona et ses comparses parviennent à faire reculer Tchagol mais, dans la bataille, ils ont perdu la trace de Shin-ah, Jae-ha et Zeno. Soudain, Yona perçoit le cri des dragons…",isbn:"9782811692384",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811692384-M.jpg"},
  {t:"Le grand livre jeu du merveilleux",a:"Subi",y:"2026",ed:"La Martinière",cote:"LJ SUB",pub:"Jeunesse",sup:"Imprimé",d:"TROIS JEUX DANS UN SEUL LIVRE ! Assemblée de dragons, forêt enchantée, troupeau de licornes, monstres mythologiques, cité engloutie, congrès de sorcières... embarquez pour un merveilleux voyage à la découverte des créatures magiques ! Un cherche et trouve fantastique avec trois niveaux de difficulté pour jouer en famille, enrichi par deux pages documentaires pour tout savoir sur ces créatures merveilleuses qui peuplent notre imaginaire collectif. Un cherche et trouve palpitant avec trois niveaux de difficulté, pour jouer avec toute la famille.",isbn:"9791040125426",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040125426-475x500-1.jpg"},
  {t:"Vivre",a:"Badinter Robert",y:"2025",ed:"Flammarion",cote:"320.944 BAD",pub:"Adulte",sup:"Imprimé",d:"\"Au cours d'un discours, j'avais prononcé cette phrase : \"Quand on parle des morts, les morts nous écoutent. \" Je ne parle jamais de mes sentiments personnels, mais la condition des enfants de déportés est tout de même singulière. Je ne crois pas qu'il faille perdre le souvenir et je ne crois pas que l'on doive vivre pour le souvenir et dans le souvenir des morts. Honorer les morts, s'en souvenir et vivre. Je crois que c'est ça, le véritable hommage à leur rendre. En essayant d'être fidèle à ce qu'ils pensaient, mais surtout : vivre\". Dans ce récit intime, Robert Badinter raconte sa vie avec une éblouissante sincérité. En 2006, pour l'INA et la Fondation pour la Mémoire de la Shoah, il convoque ses souvenirs d'enfance, dont l'arrestation et la déportation de son père. En 2023, toujours pour l'INA, l'homme de l'abolition livre son dernier entretien. Un témoignage pour l'histoire.",isbn:"9782080147158",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080147158-M.jpg"},
  {t:"Le chantier",a:"Hédelin Pascale",y:"2017",ed:"Milan",cote:"624 HED",pub:"Jeunesse",sup:"Imprimé",d:"Cette collection documentaire pour les petits développe des encyclopédies complètes, accessibles et modernes. Elle se veut une référence d'images, tant pour les parents et leurs enfants que pour les enseignants.",isbn:"9782745980946",extraUrl:"https://products-images.di-static.com/image/base/9782745980946-475x500-1.jpg"},
  {t:"Parfois, je suis en colère",a:"Bowles Paula",y:"2026",ed:"Chantecler",cote:"A BOW",pub:"Jeunesse",sup:"Imprimé",d:"Votre enfant est parfois en colère. Il crie, tape du pied ou s'énerve envers tout le monde. C'est tout à fait normal et cela fait partie de son développement. Ce livre aidera votre enfant à reconnaître la colère, à la comprendre et à mieux la gérer. La petite histoire lui montrera comment retrouver le calme d'une manière simple.",isbn:"9782803464999",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782803464999-475x500-1.jpg"},
  {t:"Le pire des chevaliers",a:"Kemp Anna",y:"2026",ed:"Milan",cote:"A KEM",pub:"Jeunesse",sup:"Imprimé",d:"Riquiqui le crapaud, tout gluant et pas très beau, veut devenir un héros. Un vrai, un grand, un costaud ! Le roi des nénuphars en a assez des libellules, il se rêve chevalier, même avec ses pustules. Comme dans les contes de fées, seule une princesse pourrait l'aider et, d'un baiser, le transformer en fier et noble chevalier...",isbn:"9782408060428",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408060428-475x500-1.jpg"},
  {t:"Secret Bodyguard T09",a:"Masamitsu Nigatsu",y:"2026",ed:"Pika édition",cote:"BD SEC",pub:"Adulte",sup:"Imprimé",d:"Sôji Kodô a fondé son propre clan composé uniquement de lui et de sa progéniture dans le but de renverser le pouvoir de la société criminelle. Ses cibles à abattre sont, naturellement, le chef du clan Jingû, ainsi que son héritière supposée Honeko Akabane. Après avoir déjoué l'attaque sur le festival du lycée, Ibuki rentre chez lui pour y trouver l'un des fils de Sôji Kodô, Yuma Kodô. Ce dernier fait sauter la maison de Ibuki qui se retrouve à l'hôpital pour guérir de ses blessures. Dans le même temps, le clan Kodô se met en mouvement, et sa prochaine cible n'est autre que Kuran, la benjamine du clan !",isbn:"9791043303661",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303661-M.jpg"},
  {t:"Twisted-Wonderland",a:"Hazuki Wakana",y:"2026",ed:"nobi nobi !",cote:"BD TWI",pub:"Jeunesse",sup:"Imprimé",d:"“En ce bas monde, on n'a rien sans rien.”Azul Ashengrotto a réussi à piéger la majorité des étudiants de Night Raven avec son terrible contrat, et règne en maître sur l'académie. Déterminés à sauver leurs amis, Yu et Jack obtiennent un tête-à-tête avec le gardien de la maison Octavinelle, et acceptent de passer un nouveau marché  avec lui... Mais sans aptitude magique à lui offrir, quels termes et garanties  le peu scrupuleux Azul peut-il bien attendre en retour ?  La maison Ramshackle serait-elle sur le point de sombrer ?",isbn:"9782384966752",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384966752-M.jpg"},
  {t:"Déclaration des droits de la femme et de la citoyenne",a:"Gouges Olympe de",y:"2021",ed:"Flammarion",cote:"305.4 GOU",pub:"Adulte",sup:"Imprimé",d:"Parcours Ecrire et combattre pour l'égalité\". La femme naît libre et demeure égale à l'homme en droits. Les distinctions sociales ne peuvent être fondées que sur l'utilité commune\". TOUT POUR COMPRENDRE- Notes lexicales- Biographie et contexte- Genèse et genre de l'oeuvre- Pour mieux interpréterECRIRE ET COMBATTRE POUR L'EGALITE- Analyse du parcours- Groupement de textes- Histoire des idéesVERS LE BAC- Explications linéaires guidées- Sujets de dissertation et de commentaire guidés- MéthodologieANNEXE- La Déclaration de 1789 annotéeCAHIER ICONOGRAPHIQUE",isbn:"9782080253163",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080253163-M.jpg"},
  {t:"Auguste Renoir",a:"Protais Johann",y:"2026",ed:"Larousse",cote:"759.4 PRO",pub:"Adulte",sup:"Imprimé",d:"Enfant de son siècle, Renoir est également celui d'une France et d'un monde artistique en pleine révolution. Celui qui se présente avant tout comme un \"ouvrier de la peinture\" et qui va devenir l'une des figures majeures d'un courant d'avant-garde, l'impressionnisme, s'y ménage toutefois une place particulière. Se laissant porter au gré de ses inspirations et de ses rencontres, il s'impose comme le peintre de la figure humaine. Maître des jeux de lumière, Auguste Renoir est aussi celui qui voue un véritable culte à la sensualité par le biais de ses portraits et de ses nus féminins. Riche de très nombreuses illustrations, cet ouvrage retrace la vie passionnante de Renoir et explique comment, tout au long de sa carrière prolifique, il n'a eu qu'un seul objectif : \"peindre du bonheur\" . Vous pensiez tout savoir sur Renoir ? Détrompez-vous, cet ouvrage vous réserve bien des surprises !",isbn:"9782036086760",extraUrl:"https://covers.openlibrary.org/b/isbn/9782036086760-M.jpg"},
  {t:"Fossiles",a:"Potte-Bonneville Laurence",y:"2026",ed:"Editions Verdier",cote:"R POT",pub:"Adulte",sup:"Imprimé",d:"Un orage a foudroyé le grand épicéa qui s'est abattu sur la maison, berceau de tant de souvenirs d'enfance, où Marie-Pierre se rend toutes affaires cessantes. Sous la blessure du toit qui bée, la charpente menace de s'effondrer. Les travaux s'annoncent, il va falloir déménager la phénoménale collection de fossiles de son père. En tentant de les classer, Marie-Pierre découvre un pendentif, et se souvient... Dans la grange, des ombres passent. Entrelaçant les époques et les destins, le roman nous entraîne sur les traces de ces femmes, bergères ou vagabondes, qui disparaissent sans témoin. Il se déploie par-dessus les vallées pour nous ramener au désert de Platé, puisque c'est là que cette histoire commence, au milieu des fleurs d'altitude, où rôdent les chiens, les souvenirs et les fantômes.",isbn:"9782378562786",extraUrl:"https://covers.openlibrary.org/b/isbn/9782378562786-M.jpg"},
  {t:"La grande guerre du Péloponnèse",a:"Canfora Luciano",y:"2026",ed:"Perrin",cote:"938.05 CAN",pub:"Adulte",sup:"Imprimé",d:"Si les conflits de grande ampleur n'ont pas manqué dans l'Antiquité, la guerre du Péloponnèse est celui qui a le plus frappé les esprits. Durant la seconde moitié du Ve siècle avant notre ère, elle met aux prises la cité d'Athènes - démocratique - et celle de Sparte - sous régime oligarchique-, ainsi que les coalitions formées autour d'elles. Depuis, les historiens n'ont cessé de s'y pencher, elle est enseignée dans les écoles militaires et les spécialistes de géopolitique y recourent volontiers pour décrypter les relations internationales, notamment les rapports des Etats-Unis et de la Chine. Si cet affrontement se caractérise par un bilan matériel et humain considérable, il annonce aussi la fin de la domination politique et artistique d'Athènes, marquée par la construction du Parthénon et l'avènement des célèbres tragédies d'Eschyle, Sophocle et Euripide. Enfin et surtout, l'histoire de la guerre du Péloponnèse nous a été racontée en détail par celui que l'on considère, davantage encore que son prédécesseur immédiat, Hérodote, comme le premier historien au sens moderne du terme, Thucydide. Le livre de Luciano Canfora sur cette guerre \"totale\" ne se veut pas un simple récit exhaustif des événements. Classiciste aguerri, l'auteur multiplie aussi les observations judicieuses au sujet du texte de Thucydide et d'autres auteurs postérieurs qui ont traité du conflit, sans jamais faire l'économie d'un récit haletant qui permet une lecture de l'histoire au plus près des lieux où elle s'est jouée. Ainsi l'application des analyses de Thucydide à d'autres épisodes historiques ou à la compréhension de la situation internationale actuelle se révèle-t-elle extrêmement éclairante. En construisant son livre autour du texte thucydidien, Canfora en fait la brillante démonstration.",isbn:"9782262112301",extraUrl:"https://covers.openlibrary.org/b/isbn/9782262112301-M.jpg"},
  {t:"Les Fantômes de Rome",a:"O'Connor Joseph",y:"2026",ed:"Rivages",cote:"R OCO",pub:"Adulte",sup:"Imprimé",d:"Février 1944. Les forces allemandes occupent Rome depuis six mois. Les combattants alliés ont débarqué à Anzio mais peinent à progresser. La Résistance s'organise autour de la filière d'évasion mise en place en plein coeur du Vatican par Hugh O'Flaherty et ses comparses. En première ligne : la Contessa Giovanna Landini, libre et intrépide, offrant un souffle féminin, flamboyant et plein d'humour à cette aventure haletante, où chaque ruelle cache un piège... et chaque choix peut coûter la vie. Excellente suite de \"Dans la maison de mon père\", nommé au Walter Scott Prize et au prix Historia, \"Les Fantômes de Rome\" confirme l'immense talent de conteur du maître du roman historique, Joseph O'Connor.",isbn:"9782743669171",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743669171-M.jpg"},
  {t:"Yona, Princesse de l'Aube T40",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Les Dolomos, un groupuscule d'assassins du Kai du Sud, s'infiltrent dans le château de Hiryû avec la ferme intention de le détruire par le feu. Tandis que le général Val et Mei Niang essaient de les repousser, ils ont la mauvaise surprise de voir surgir un personnage inattendu qui va redistribuer les cartes'",isbn:"9782811684853",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811684853-M.jpg"},
  {t:"Le chat sauvage",a:"Luciani Brigitte",y:"2016",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeunesse",sup:"Imprimé",d:"Alors que Roussette, la petite renarde, se pose de plus en plus questions sur ses origines, un chat sauvage, accompagné de genettes, prépare un spectacle destiné à montrer son agilité dans les arbres. Mais ce chat dissimule un secret sur sa véritable identité ; un secret qui va aider Roussette à comprendre que sa nouvelle famille l'aime plus que tout. A travers cette histoire, les auteures abordent autant l'acceptation de la différence que l'idée de rester soi-même et de s'ouvrir aux autres. Le bonheur n'est jamais bien loin ! Chaque tome de la série sera dorénavant proposé à partir de 2026 en version souple à plus petit format (195 x 260) avec un bonus de huit pages supplémentaires (jeux, cahier didactique...). Le tout à petit prix !",isbn:"9782205074451",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205074451-475x500-1.jpg"},
  {t:"Twisted-Wonderland",a:"Hazuki Wakana",y:"2025",ed:"nobi nobi !",cote:"BD TWI",pub:"Jeunesse",sup:"Imprimé",d:"“Pauvres âmes en perdition !” Depuis son arrivée à l’académie Night Raven, Yu s’efforce tant bien que mal de trouver sa place dans le monde singulier de Twisted Wonderland. À l’approche des examens finaux, il remarque qu’Ace, Deuce et Grimm affichent une confiance étonnante et négligent leurs révisions. Et lorsque les résultats tombent, c’est la stupeur : de nombreux élèves ont brillamment réussi toutes les épreuves. Yu découvre alors la supercherie : ils ont conclu un contrat avec Azul Ashengrotto… mais chacun sait qu’avec le gardien de la maison Octavinelle, rien n’est jamais offert sans contrepartie. Après les tumultes de Heartslabyul et Savanaclaw, retenez votre souffle et plongez dans les abysses d’un nouveau dortoir, inspiré d’Ursula et de La Petite Sirène !",isbn:"9782384963614",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963614-M.jpg"},
  {t:"Ne vous mariez jamais ! Vraiment ?",a:"Ferry Luc",y:"2026",ed:"Editions de l'Observatoire",cote:"128 FER",pub:"Adulte",sup:"Imprimé",d:"Et si le secret du désir tenait dans la distance ? Depuis les troubadours du XIIe siècle, l'amour-passion se heurte au même paradoxe : peut-il survivre à la vie conjugale ? Faut-il choisir entre l'ivresse d'Eros et la sérénité du quotidien partagé ? Luc Ferry revisite avec brio les grands récits médiévaux - Tristan et Iseut, Lancelot et Guenièvre - pour éclairer nos tourments modernes. Ces amours illégitimes, ces désirs incessants qui défient l'honneur et la raison nous parlent encore : ils révèlent la nature même de la passion, qui se nourrit d'obstacles et de manque. A travers une relecture audacieuse de la littérature courtoise, le philosophe interroge la tension fondamentale entre désir et possession, absence et présence. Avec la clarté qui le caractérise, Luc Ferry nous invite à repenser nos attentes amoureuses. Non pour renoncer au mariage, mais pour comprendre ce qui fait vivre - ou mourir - la flamme du désir. Une méditation lumineuse sur l'amour, entre philosophie antique et psychologie contemporaine, qui nous réconcilie avec nos contradictions les plus intimes.",isbn:"9791032925683",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032925683-M.jpg"},
  {t:"Appel manqué",a:"Fives Carole",y:"2026",ed:"Gallimard",cote:"R FIV",pub:"Adulte",sup:"Imprimé",d:"\"Vous avez eu la pilule, l'IVG, on vous a tout apporté sur un plateau doré et vous venez encore vous plaindre ! On a fait notre part, c'était à vous de saisir le relais qu'on vous tendait à bout de bras, bande d'ingrates ! Qu'est-ce que vous avez fichu pendant tout ce temps ? Travaillé, travaillé, mais enfin, ça ne vous empêchait pas de vous battre pour vos droits. Après le boulot, après avoir couché le gosse et terminé ton ménage, après avoir appelé ta vieille mère, il te restait encore un peu de temps pour militer, non ? Au lieu d'aller chez le psy... Ah, t'en auras perdu du temps et de l'argent avec ça, mais c'est pas chez les psys qu'on fait la révolution, ma fille\". Après le succès d'Une femme au téléphone, Appel manqué signe le grand retour de Charlène, soixante-treize ans, plus déjantée que jamais. Quand la solitude lui pèse, elle bombarde sa fille de messages téléphoniques, qui sont autant de reproches, d'appels à l'aide et de révélations. Qu'ont à transmettre les \"boomeuses\" ? MeToo peut-il rapprocher les générations ? Portrait d'une mère qui appuie toujours là où ça fait mal, ce roman drôle et mordant interroge aussi le rapport au féminisme à tous les âges.",isbn:"9782073129819",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073129819-M.jpg"},
  {t:"Les guerres des mers",a:"Vaujour Nicolas",y:"2026",ed:"Tallandier",cote:"359 VAU",pub:"Adulte",sup:"Imprimé",d:"Pour la première fois, un chef d'état-major de la Marine en exercice prend la plume. Il dresse un état des lieux des nouvelles menaces et explique le rôle essentiel de la Marine nationale dans cette nouvelle ère d'affirmation des puissances. Disposant du deuxième domaine maritime mondial, la France tient son rang au sein des marines internationales et de l'Otan. Alors que plus de 90% des échanges commerciaux et des flux de communication passent aujourd'hui par les mers, les défis sont considérables. Défis technologiques et humains d'abord, avec des navires et des équipements exigeant des compétences nucléaires, numériques et de cybersécurité de plus en plus sophistiquées. Défis géopolitiques aussi, car les démonstrations de forces navales russes et chinoises en mer sont quotidiennes. Défis environnementaux enfin, car l'intensité des événements climatiques augmente tandis que le réchauffement ouvre de nouvelles voies de navigation, notamment en Arctique. La Marine nationale est aux avant-postes de toutes ces mutations pour protéger les intérêts de la France et des Français. \"De nos jours, naviguer au sud de la mer Rouge signifie traverser de vastes espaces sous la menace permanente d'attaques terroristes, de drones ou de missiles. Il n'y a plus de zone de détente, nous sommes défiés partout\". Amiral Nicolas Vaujour",isbn:"9791021066700",extraUrl:"https://covers.openlibrary.org/b/isbn/9791021066700-M.jpg"},
  {t:"Hérétique",a:"Morrison Robbie",y:"2026",ed:"Delcourt",cote:"BD MOR",pub:"Adulte",sup:"Imprimé",d:"Un magnifique RÉCIT COMPLET par ROBBIE MORRISON & CHARLIE ADLARD au format album, justifié par la beauté des pages de Charlie. La meilleure façon de le décrire'Le croisement parfait entre Sherlock Holmes et Le Nom de la rose. Ce thriller historique aux accents d'horreur et de surnaturel se concentre sur la relation entre le docteur, chevalier, avocat, occultiste, philosophe et magicien Cornelius Agrippa et son jeune élève Johann Weyer alors qu'ils enquêtent sur une horrible série de meurtres à Anvers au XVIe siècle.",isbn:"9782413091134",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413091134-M.jpg"},
  {t:"Dune : Maison Corrino",a:"Herbert Brian",y:"2026",ed:"Huginn & Muninn",cote:"BD HER",pub:"Adulte",sup:"Imprimé",d:"Complots. trahisons et luttes de pouvoir rythment l'empire galactique. A l'aube d'une nouvelle ère. la Maison Corrino tente de préserver sa domination alors que la Maison Atréides menace de bouleverser l'équilibre des forces. L'Empereur Shaddam. décidé à saboter la production d'épice pour imposer son substitut. précipite la galaxie dans la tourmente. Tandis que les Atréides et la Maison Vernius s'unissent contre les Tleilaxu sur lx. le duc Leto et Jessica préparent la venue de leur enfant, cible de multiples intrigues, dont celle des Bene Gesserit. Profitant de la vulnérabilité du fief des Atréides. les Harkonnen lancent leur assaut...",isbn:"9782386400810",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386400810-M.jpg"},
  {t:"Les animaux",a:"Jugla Cécile",y:"2026",ed:"Lito",cote:"J 590.83 JIG",pub:"Jeunesse",sup:"Imprimé",d:"Plus de 160 questions étonnantes, et leurs réponses tout aussi passionnantes, pour découvrir les animaux du monde entier !",isbn:"9782244428710",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782244428710-475x500-1.jpg"},
  {t:"Je fais le plein de protéines à l'Air Fryer",a:"Lalbaltry Juliette",y:"2026",ed:"Larousse",cote:"641.5 LAL",pub:"Adulte",sup:"Imprimé",d:"Préparez des recettes croustillantes, rassasiantes et délicieusement protéinées ! Découvrez 150 recettes adaptées à toutes les machines d'air fryer. Que ce soit pour un petit-déjeuner rapide, un dîner gourmand ou une collation healthy, laissez-vous guider par des idées audacieuses et équilibrées. Au menu : burger veggie, baked oats framboise et chocolat, nuggets de poisson panés à la noix de coco, moelleux chocolat-banane, bowl de riz croustillant, chou rouge et saumon rôti... Des recettes variées pour tous les appétits et toutes les envies !",isbn:"9782036091979",extraUrl:"https://covers.openlibrary.org/b/isbn/9782036091979-M.jpg"},
  {t:"L'univers incompris",a:"Carassou Sébastien",y:"2026",ed:"Editions Les Arènes",cote:"523 CAR",pub:"Adulte",sup:"Imprimé",d:"Jamais l'Humanité n'a aussi bien compris le cosmos. Les observations des grands télescopes et des satellites de toute dernière génération semblent confirmer les principales théories scientifiques. Et pourtant... Plus l'Univers se dévoile à nous, plus le mystère s'épaissit : A-t-il des limites ? Qu'y avait-il avant le big bang ? Existe-t-il d'autres univers que le nôtre ? Qu'est-ce qui a déclenché son expansion ? Où est passée l'antimatière ? Ces observations ouvrent de nouvelles interrogations époustouflantes : la matière ordinaire, celle qui compose les étoiles, les planètes et les galaxies, ne représente qu'une infime part du cosmos. Quelle est la nature des 95 % restants, matière noire et énergie sombre ? Comprend-on vraiment la formation des galaxies ? D'où viennent les trous noirs en leur centre ? L'Univers incompris vous invite à une plongée dans les zones d'ombre de notre savoir cosmologique, ces espaces inconnus où s'écrit déjà la science de demain.",isbn:"9791037512482",extraUrl:"https://covers.openlibrary.org/b/isbn/9791037512482-M.jpg"},
  {t:"La cuisine c'est aussi de la chimie",a:"Le Caisne Arthur",y:"2013",ed:"Hachette Pratique",cote:"641.5 LEC",pub:"Adulte",sup:"Imprimé",d:"Partant des dernières recherches scientifiques les plus pointues, Arthur Le Caisne revisite 70 recettes des plus courantes : poulet rôti, pot-au-feu, poisson mariné, purée de pommes de terre, et même les œufs coque ou dur et vous explique avec des dessins et beaucoup d'humour ce qui se passe réellement pendant la réalisation de ces recettes. Vous n'allez plus jamais cuisiner vos plats préférés comme avant...",isbn:"9782012309746",extraUrl:"https://covers.openlibrary.org/b/isbn/9782012309746-M.jpg"},
  {t:"Le château",a:"Cooper Catherine",y:"2026",ed:"L'Archipel",cote:"R COO",pub:"Adulte",sup:"Imprimé",d:"\" L'autrice du best-seller Le Chalet revient avec un thriller psychologique tout aussi addictif qui vous tiendra en haleine jusqu'au petit matin. \" The Sun \" Glaçant ! \" Bella Aura et son mari Nick, la trentaine, ont décidé de quitter Londres avec leurs deux enfants en bas âge pour transformer un château du Sud-Ouest de la France en Bed & Breakfast. Sur place, ils sont rejoints par une équipe chargée de filmer leurs travaux de rénovation pour une émission de téléréalité. C'est alors que des phénomènes étranges commencent à se produire. Jusqu'à ce meurtre commis au cours d'une soirée... Nick et Aura voulaient fuir leur passé. Ce dernier vient de les rattraper !",isbn:"9782809853490",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809853490-M.jpg"},
  {t:"Twisted-Wonderland - La Maison Savanaclaw",a:"Oda Suzuka",y:"2025",ed:"Nobi Nobi",cote:"BD TWI",pub:"Jeunesse",sup:"Imprimé",d:"Le territoire sauvage de Savanaclaw vous ouvre ses portes. Soyez prêts ! Transportée à Twisted Wonderland, Yuka Hirasaka parcourt ce monde extraordinaire bien malgré elle. Alors qu'un grand tournoi magique se prépare, d'étranges événements semblent agiter les élèves de l'Académie Night Raven... Les griffes du dortoir Savanaclaw seraient-elles les plus dangereuses de Twisted Wonderland ? Après la maison Heartslabyul, inspirée de l'univers d'Alice au pays des merveilles, découvrez une relecture fascinante et fantastique du monde du Roi Lion avec la maison Savanaclaw !",isbn:"9782384963225",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963225-M.jpg"},
  {t:"L'étreinte des siècles",a:"Pirotte Jean-Claude",y:"2026",ed:"Cherche midi",cote:"R PIR",pub:"Adulte",sup:"Imprimé",d:"A l'université de Glasgow, Benedict s'ennuie ferme. Entre ses étudiants trop sages et le ronron des séminaires, seuls son chat et son whisky trouvent grâce à ses yeux. Mais voilà qu'une campagne de fouilles archéologiques va bouleverser sa vie. Qui est cette femme enterrée avec ses chevaux, ses bijoux et son bâton d'enchantement ? Ragnhild Kettilsdottir, du clan du Loup, est en mission de conquête dans les îles de l'Ouest. Amour, ambition, trahison, solitude : les Puissances lui ont tissé un sombre et fabuleux destin. L'hiver approche, et les signes sont chaque jour plus manifestes : elle ne rentrera jamais au pays... Lui, archéologue écossais. Elle, prêtresse viking. Douze siècles les séparent, mais une ile des Hébrides va les réunir, et condenser le temps. Avec un art consommé de la langue et de la narration, Emmanuelle Pirotte place son nouveau récit à la charnière entre les vivants et les morts, entre notre présent désenchanté et une époque parée des couleurs du mythe. Elle propose au lecteur de jeter des ponts entre ces mondes et d'accompagner, dans un fascinant jeu de miroirs où une réalité éclaire l'autre, l'intimité qui grandit entre deux êtres, au-delà du temps.",isbn:"9782749182261",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749182261-M.jpg"},
  {t:"Ta naissance",a:"Le Guen Sandra",y:"2024",ed:"Editions Casterman",cote:"A LEG",pub:"Jeunesse",sup:"Imprimé",d:"Au commencement, il y a nous, tes parents. Il y a moi, ta maman. Et il y a moi, ton papa. Nous nous sommes rencontrés. Nous nous sommes aimés. Tant et tant que nous ne voulions plus nous quitter. Et puis... tu es arrivé. A travers les voix d'un couple de gorilles, une approche sensible pour aborder avec son enfant les moments qui ont précédé sa naissance, sa venue au monde et ses premiers instants de vie.",isbn:"9782203247895",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203247895-M.jpg"},
  {t:"Le vol",a:"Barber Caroline",y:"2019",ed:"Éditions Les 400 Coups",cote:"A BAR",pub:"Jeunesse",sup:"Imprimé",d:"Ah ! ce coquin de Philémon Croquenot ! Le voleur veut absolument les dernières longs à la mode pour sa collection. Réussira-t-il à dérober cette 402e paire de chaussures ?",isbn:"9782895408581",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782895408581-475x500-1.jpg"},
  {t:"Je n'aurai plus peur",a:"Rea Simone",y:"2026",ed:"La Partie",cote:"A REA",pub:"Jeunesse",sup:"Imprimé",d:"Un album sensible et profond sur la violence, la guerre et la résilience. Dans le calme de la nuit, une mère et son fils commencent une conversation difficile. L'enfant hésite à raconter une scène de violence dont il a été témoin à l'école. Il en saisit d'autant plus la gravité qu'il a fui un pays en guerre. Les souvenirs de ce passé traumatique se superposent au présent, et la frontière entre les événements se brouille pour mieux mettre en lumière les mécanismes de la peur. Grâce à l'écoute et l'amour de sa mère, il trouve le courage d'agir. Décidé à en parler à l'école le lendemain, l'enfant s'endort apaisé.",isbn:"9782494591417",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494591417-475x500-1.jpg"},
  {t:"C'est moi qui choisis !",a:"Gao Yile",y:"2026",ed:"Rue du Monde",cote:"A GAO",pub:"Jeunesse",sup:"Imprimé",d:"Un vêtement, un cadeau, un chemin... Plusieurs fois par jour, on doit décider et choisir. Il y a des choix que l'on fait sans même réfléchir, et d'autres, qui sont de véritables casse-têtes ! On hésite, on regrette... Choisir, c'est vraiment compliqué ! Dans ce livre, je vous raconte comment moi, je me débrouille quand je dois choisir !",isbn:"9782355048128",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355048128-475x500-1.jpg"},
  {t:"Ti'Tigre",a:"Prasadam-Halls Smriti",y:"2026",ed:"Éditions Sarbacane",cote:"A PRA",pub:"Jeunesse",sup:"Imprimé",d:"Ti'Tigre en a assez. Quand il demande : Je peux manger tout le gâteau ? Je peux aller à l'école en pyjama ? la réponse à ses bonnes idées est toujours : non. Et pourquoi donc ? C'est pas juste ! Pourtant, le craquant Ti'Tigre au caractère bien trempé et aux émotions fortes, n'a peur de rien. Enfin presque...",isbn:"9791040808237",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791040808237-475x500-1.jpg"},
  {t:"Le bain des quatre saisons",a:"Kim Hyojeong",y:"2026",ed:"Gallimard",cote:"A KIM",pub:"Jeunesse",sup:"Imprimé",d:"Un album plein d'humour, fourmillant de détails, pour célébrer la nature qui s'éveille ! C'est le printemps ! Papy Mousse s'active : il ouvre sa maison et prépare son bassin. Tout doit être prêt pour l'arrivée des animaux ! Déjà, un ours sort d'hibernation. Il a besoin d'un bon bain !",isbn:"9782075233729",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075233729-475x500-1.jpg"},
  {t:"Le divan des femmes",a:"Roudinesco Elisabeth",y:"2026",ed:"Seuil",cote:"150.195 ROU",pub:"Adulte",sup:"Imprimé",d:"Epouses ou amantes des hommes qui composèrent le premier cercle psychanalytique, les femmes durent batailler ferme pour se faire une place dans un univers qui n'avait pas été conçu pour elles, puis s'imposer progressivement comme cheffes d'écoles et créatrices de nouvelles approches de l'inconscient. Les découvertes, les débats, les controverses qui furent originellement alimentées par l'étude des symptômes et des souffrances de toutes ces anonymes sont racontées ici avec science et pédagogie au long d'un récit passionnant, hommage de l'historienne de la psychanalyse à l'engagement de toutes ces femmes, qu'elles soient devenues célèbres (de Lou-Andréa Salomé à Françoise Dolto) ou demeurées dans l'ombre. Depuis le berceau viennois de la découverte freudienne, la saga se déploie dans le monde entier - Berlin, Saint-Pétersbourg, Londres, Paris, New York, Buenos Aires, Rio de Janeiro -, chaque ville générant son lot de personnalités d'exception (patientes ou thérapeutes) et d'avancées cliniques majeures auxquelles les femmes ont pris une part décisive. Chacun, chacune aussi, au terme de cette lecture bouleversante, reconnaîtra sa dette.",isbn:"9782021622423",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021622423-M.jpg"},
  {t:"Pourquoi avons-nous peur ?",a:"Bohler Sébastien",y:"2026",ed:"Plon",cote:"152.4 BOH",pub:"Adulte",sup:"Imprimé",d:"Un essai de vulgarisation accessible et brillant s'appuyant sur les neurosciences pour décrypter point par point les mécanismes de la peur Il y a 7 millions d'années, nos gènes ont muté à un rythme 1 000 fois supérieur à celui des autres espèces. Grâce à notre faculté d'adaptation et d'anticipation, nous sommes peu à peu devenus l'espèce la plus intelligente, mais aussi la plus craintive du règne animal. Aujourd'hui, 60% des 18-35 ans disent souffrir d'éco-anxiété et 1 personne sur 10 est concernée par des phobies maladives. La peur est la plus ancestrale de nos émotions. Elle existe chez tous les vertébrés depuis la nuit des temps. Une glande, nommée amygdale, en déclenche l'activité. Face à l'imminence d'un danger, l'amygdale, tel un signal de détection, lance l'alerte. Face à cette peur, le corps s'immobilise, fuit ou entre en lutte. Ainsi en est-il pour tous les vertébrés, espèce humaine comprise, qui, grâce à ce comportement de défiance, a pu assurer sa survie. Le problème est que, si nous avons domestiqué de grandes peurs - depuis la peur d'un troupeau de mammouths jusqu'à la peur de la foudre - d'autres sont apparues aujourd'hui. Peur de déclassement, peur d'un conflit planétaire, peur climatique. L'ère contemporaine a réactivé la peur. Pourquoi ? En nous éloignant du vivre-ensemble, nous cultivons un individualisme sans repères. Livré à lui-même, l'individu combat ses peurs par des projections fantastiques et des comportements addictifs, deux traits caractéristiques de notre modernité. Il est possible de reprendre le contrôle sur nos peurs en nous évertuant à mieux exercer notre faculté de raisonner, en cherchant à donner plus d'ambition à nos projets collectifs et en reconnectant nos corps à la nature et aux autres.",isbn:"9782259322638",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259322638-M.jpg"},
  {t:"Revenez, amis martiens !",a:"Thinard Florence",y:"2026",ed:"Thierry Magnier",cote:"J THI",pub:"Adolescent",sup:"Imprimé",d:"Quand Eva, une collégienne solitaire et harcelée, recueille deux chats errants miraculeusement sauvés des eaux, elle ignore qu'elle se trouve face à FWFX et WDWC, des extraterrestres en mission secrète sur Terre. Nom de Mars, cette rencontre va changer sa vie ! C'est le début d'une aventure pleine de rebondissements, de télescopages improbables et de répliques inoubliables. Prêts, bande de schmulaââgs ramollis ? ! Des chats venus d'une autre planète, une ado en détresse, une vache complice : un roman aussi déjanté que jubilatoire !",isbn:"9791035209308",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209308-475x500-1.jpg"},
  {t:"Cendrillon",a:"Dahl Roald",y:"2025",ed:"Gallimard",cote:"C DAH",pub:"Jeunesse",sup:"Imprimé",d:"Vous pensez connaître cette histoire ? Vous vous trompez... Cendrillon veut aller au bal ! Entendant ses pleurs, sa marraine la bonne fée apparaît et hop ! D'un coup de baguette magie, Cendrillon est prête à se rendre au palais et... vous connaissez la suite, à rencontrer son prince charmant. Mais les apparences sont trompeuses, et ce prince-là n'est peut-être pas aussi parfait qu'il n'y paraît...",isbn:"9782075228749",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075228749-475x500-1.jpg"},
