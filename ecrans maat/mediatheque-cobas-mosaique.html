  {t:"La chute de l'Etoile rouge",a:"John D. B.",y:"2026",ed:"Plon",cote:"R JOH",pub:"Adulte",sup:"Imprimé",d:"Sept ans après le succès de L'étoile du nord, le nouvel opus attendu de D. B. John. Un thriller géopolitique haletant de New York à Singapour, entre Donald Trump et Kim Jong-un, qui nous plonge au coeur de la folie politique contemporaine et de l'espionnage. Février 2017 : un Coréen est empoisonné en plein jour à l'aéroport de Kuala Lumpur. L'homme est le demi-frère de Kim Jong-un, le dictateur nord-coréen. Dans un hôtel cossu de Washington, un haut-gradé des services secrets russes est retrouvé mort dans sa chambre dans des circonstances plus que suspectes. Dans le même temps, Donald Trump, un magnat de l'immobilier élu 45e président des Etats-Unis, fait ses premiers pas à la Maison Blanche. Dans l'ombre, le monde est au bord du gouffre et trois personnes sont aux premières loges. Jenna, une agente américano-coréenne de la CIA, hantée par son passé. Six ans plus tôt, au terme d'une mission d'infiltration, elle est parvenue à sauver sa soeur jumelle des geôles nord-coréennes et à dévoiler un programme d'espions dormants qui s'apprêtaient à infiltrer la société américaine. Lyosha, un étudiant moscovite qui paye le prix fort pour avoir humilié Vladimir Poutine en direct à la télévision. Le FSB commence à lui tourner autour. Eric, un jeune américain d'origine coréenne, qui travaille comme conseiller spécial auprès de Trump, unique rescapé du programme d'infiltration que Jenna pensait avoir démantelé des années plus tôt... Quand les supérieurs de Jenna l'informent de l'existence d'un programme au coeur du Kremlin, ils l'envoient en toute clandestinité à Moscou prendre contact avec Lyosha qui détiendrait des documents révélant le complot. La mission s'avère plus dangereuse que prévue, tandis qu'à Washington les décisions erratiques du président menacent le monde du chaos...",isbn:"9782259323710",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259323710-M.jpg"},
  {t:"A qui sont ces grandes dents ?",a:"Beau Sandrine",y:"2021",ed:"D'eux",cote:"A BEA",pub:"Jeunesse",sup:"Imprimé",d:"A qui sont ces grandes dents ? Et si on regardait de plus près ? Et si on s'éloignait pour mieux voir...",isbn:"9782924645024",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782924645024-475x500-1.jpg"},
  {t:"Vivement ce soir !",a:"Lili la Baleine",y:"2026",ed:"Editions Casterman",cote:"A LIL",pub:"Jeunesse",sup:"Imprimé",d:"Un premier album sur le temps qui passe, pour aider les petits à patienter. Prune, Pablo et Oscar arriveront ce soir. Mais pour l'instant, le ciel est bleu et ce petit garçon doit attendre encore un peu. Attendre ? Quelle drôle d'histoire ! C'est long et ennuyeux. Heureusement, la neige est là, dans le jardin, pour jouer et patienter. Tiens, un bruit... il fait bientôt nuit. Les voilà ! Pour éveiller les sens des tout-petits, dès la naissance. Pour un moment de partage intense entre l'adulte et l'enfant grâce aux premières histoires lues avec bébé contre soi. Lili La Baleine, qui a illustré de nombreux textes, nous propose son tout premier texte qu'elle a écrit avec beaucoup d'amour pour les bébés.",isbn:"9782203302303",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203302303-475x500-1.jpg"},
  {t:"Et... Paf !",a:"Raisson Gwendoline",y:"2026",ed:"Nathan",cote:"A RAI",pub:"Jeunesse",sup:"Imprimé",d:"Bim, boum, splash, cling... A vous de faire claquer les pages pour provoquer collisions, explosions et autres rencontres.",isbn:"9782095058548",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782095058548-475x500-1.jpg"},
  {t:"Naissance d'un chef-d'oeuvre du cinéma",a:"Hanks Tom",y:"2026",ed:"Seuil",cote:"R HAN",pub:"Adulte",sup:"Imprimé",d:"L'histoire de la réalisation d'un film de super-héros au budget colossal, et du comics inconnu qui l'a inspiré. 1947, en Californie, un talentueux petit garçon de cinq ans recopie les comic strips du journal local ; 2020, une émouvante projection a lieu Times Square. Entre les deux, 70 ans d'une Amérique en pleine mutation, un tournage rocambolesque et une galerie de personnages hauts en couleur : un soldat traumatisé par la guerre, un réalisateur inspiré et excentrique, une star prétentieuse, une assistante de production infatigable et les innombrables membres de l'équipe de tournage qui, ensemble, créent la magie hollywoodienne. Vif, touchant, inventif, parfois loufoque, porté par un humour teinté d'ironie et un rythme effréné, le premier roman de Tom Hanks pose un regard d'initié sur les efforts considérables nécessaires à la production d'un film - et la formidable aventure humaine qu'elle constitue.",isbn:"9782021549621",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021549621-M.jpg"},
  {t:"Un chat, deux chats, trop de chats...",a:"Emmet Jonathan",y:"2026",ed:"Glénat Jeunesse",cote:"A HOD",pub:"Jeunesse",sup:"Imprimé",d:"Des chats se sont faufilés sous les volets et les pop-ups de ce livre animé. Combien sont-ils ? Tu donnes ta langue aux chats ? A toi de les retrouver et de les compter ! Un livre plein de surprises, tout en poils et en couleurs !",isbn:"9791026405283",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791026405283-475x500-1.jpg"},
  {t:"ChatGPT pour les nuls",a:"Salmandjee Yasmina",y:"2026",ed:"First Editions",cote:"006.3 SAL",pub:"Adulte",sup:"Imprimé",d:"Pour tout savoir sur l'outil d'intelligence artificielle générative dont tout le monde parle et qui est en passe de révolutionner le monde des affaires et de la connaissance. INTRODUCTION A L'INTELLIGENCE ARTIFICIELLE : Pour tout savoir sur l'outil d'intelligence artificielle générative dont tout le monde parle et qui est en passe de révolutionner le monde des affaires et de la connaissance. Vous entendez parler de ChatGPT tous les jours depuis des mois. Cet outil développé par la société OpenAI génère des textes à partir de simples requêtes saisies par l'utilisateur sur tous les sujets possibles, ce qui ouvre des perspectives inédites aussi bien pour transmettre le savoir que pour communiquer. Cet ouvrage pour les Nuls, premier livre en français sur le sujet vous révèle tous les secrets de ChatGPT : comment il fonctionne, comment rédiger les bonnes questions et comment l'intégrer dans votre activité professionnelle. Vous découvrirez également d'autres outils concurrents d'intelligence artificielle générative. POUR TOUT SAVOIR SUR CHATGPT : Ce livre d'informatique pour les Nuls s'adresse à tous ceux qui veulent découvrir l'intelligence artificielle, et apprendre à utiliser ChatGPT. L'intelligence artificielle s'annonce comme la révolution du siècle, et est en passe de transformer la société en profondeur. Que vous soyez néophytes ou passionnés de ce sujet, ChatGPT pour les Nuls vous donnera toutes les clés pour comprendre et devenir un maître des prompts. UTILISEZ CHATGPT DANS LA VIE DE TOUS LES JOURS : Grâce à notre livre d'informatique, vous serez capable de comprendre et d'utiliser ChatGPT dans votre quotidien. Que ce soit lié à votre activité professionnelle, ou simplement dans votre vie personnelle, n'hésitez plus et rejoignez la révolution de l'intelligence artificielle. ChatGPT pour les Nuls balayera toutes les caractéristiques de cette IA générative, de la rédaction du prompt à ses spécificités, et fera de vous un véritable pro de cet outil !",isbn:"9782412107270",extraUrl:"https://covers.openlibrary.org/b/isbn/9782412107270-M.jpg"},
  {t:"Sophie Adenot",a:"Dana Marc",y:"2026",ed:"Editions du Rocher",cote:"B ADE",pub:"Adulte",sup:"Imprimé",d:"Au départ de la mission Epsilon, Sophie Adenot est la première Française depuis Claudie Haigneré à intégrer le très fermé corps des astronautes européens, après une sélection titanesque. Parmi 22 500 candidats, cette quadragénaire - officier de l'Année de l'Air et de l'Espace, et pilote d'essai d'hélicoptère - a franchi chaque étape avec détermination. Dans cette biographie passionnante, riche en entretiens exclusifs, archives inédites et témoignages de personnalités de premier plan, Marc Dana dévoile les coulisses du parcours exceptionnel de Sophie Adenot : ses doutes et ses combats, ses mentors, ses missions militaires, sa préparation mentale et ses entraînements, tous les moments clefs qui ont façonné cette astronaute... mais aussi cette femme engagée, inspirante, profondément humaine. Entre récit intime et grande histoire du spatial, ce livre retrace l'ascension d'une figure qui marque déjà son époque, une pionnière qui montre que les étoiles ne sont jamais aussi loin qu'on le croit.",isbn:"9782268112992",extraUrl:"https://covers.openlibrary.org/b/isbn/9782268112992-M.jpg"},
  {t:"Santé mentale tous concernés !",a:"Kierzek Gérald",y:"2026",ed:"Leduc",cote:"616.89 KIE",pub:"Adulte",sup:"Imprimé",d:"Et si prendre soin de sa santé mentale devenait aussi naturel que prendre soin de son corps ? Stress, anxiété, dépression, addictions, troubles du comportement alimentaire... Retrouvez dans ce livre un panorama de tous les principaux troubles psychiques, afin de mieux les comprendre, de repérer les signes de souffrance, de déconstruire les idées reçues et de les soigner. Dans ce guide pratique, découvrez que faire au quotidien pour prendre soin de votre santé mentale et comment réagir si vous n'allez pas bien : quand consulter, vers qui vous tourner et quelles sont les solutions mises à votre disposition pour aller mieux. Un livre qui vous aidera à vous informer, vous rassurer, et avancer pas à pas vers un mieux-être, pour soi ou pour ses proches.",isbn:"9791028536817",extraUrl:"https://covers.openlibrary.org/b/isbn/9791028536817-M.jpg"},
  {t:"Le cercle de ronces",a:"Anssel Camille",y:"2025",ed:"Gallimard",cote:"J ANS",pub:"Jeunesse",sup:"Imprimé",d:"Le pari fou d'une rébellion clandestine féministe, dans un monde où la magie détraque les esprits. Au coeur d'une forteresse assiégée, Lalie, la plus grande Sorcière de l'Histoire, livre à huit scribes un récit aux airs de testament. Celui d'une orpheline, qui a fait trembler l'Empire. D'une jeune prodige, qui défie un système patriarcal cruel. D'une cheffe de guerre, au bord de la défaite...",isbn:"9782075232302",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075232302-475x500-1.jpg"},
  {t:"Fissures",a:"Efa",y:"2024",ed:"Dupuis",cote:"BD EFA",pub:"Adulte",sup:"Imprimé",d:"Dans un futur où la montée des eaux a redessiné l'Europe, le concept d'océan n'existe plus : c'est le Nocéan. Atari et Tika, les deux jeunes activistes traquées par la police de la cité totalitaire dans laquelle elles tentent de survivre, sont maintenant menacées par les flots déchaînés frappant inlassablement les digues vieillissantes ceinturant les zones basses de la ville. Paniqués, les habitants, tentent de monter vers les zones hautes... Ce que la police lEUR refuse. Atari, Tika et leurs amis n'ont donc que deux solutions : mourir noyés ou tenter le tout pour le tout en accédant au très protégé \" Cumulus \", commandant tous les systèmes d'accès de la ville... Mais comment Tika connaît-elle le chemin vers le \" Cumulus \" ? La vérité éclatera bientôt. Et elle sera terrible... Efa conclut sa trilogie d'anticipation à la fois palpitante, raffinée et génératrice d'interrogations sur la marche de notre monde. Son propos est comme toujours servi par un dessin remarquable.",isbn:"9782808504959",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808504959-M.jpg"},
  {t:"Secret Bodyguard T08",a:"Masamitsu Nigatsu",y:"2026",ed:"Pika édition",cote:"BD SEC",pub:"Adulte",sup:"Imprimé",d:"Cela fait maintenant six mois qu'Ibuki est garde du corps. Alors que la terminale 4 se prépare à vivre son dernier festival lycéen, un nouveau défi se présente à elle : Ogami et Nozu attaquent durant ledit festival ! Heureusement, Ibuki a la brillante idée de déguiser leur affrontement en pièce de théâtre. Un spectacle époustouflant pour tout le lycée qui réserve son lot de surprises !",isbn:"9791043303647",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303647-M.jpg"},
  {t:"L'Invention de la douleur",a:"Fritsch Valerie",y:"2026",ed:"Plon",cote:"R FRI",pub:"Adulte",sup:"Imprimé",d:"Un roman troublant de force et de profondeur sur la dépendance mentale et physique, la tendresse et la cruauté de l'amour, qui explore les thèmes de la mythomanie et le syndrome de Münchhausen. August Drach grandit dans une maison à la périphérie d'une petite bourgade silencieuse et étrange. Son père, déçu par lui-même et par la vie, maltraite son fils, qui trouve du réconfort auprès de sa mère, Lily. Mais un jour, le père quitte sa famille sans donner d'explications et sa mère ne parvient plus à lui donner la même tendresse. Elle se met progressivement à affaiblir l'enfant pour qu'il continue d'avoir besoin d'elle. Ce n'est que des années plus tard qu'August, grâce à des accidents de la vie et la présence chaleureuse de son médecin, parvient à se libérer de l'emprise de sa mère. Il essaie alors de mener sa propre vie. Mais comment un adulte peut-il résoudre l'énigme d'une enfance qui a entremêlé si profondément cruauté et amour ? Comment briser le cycle des mensonges et des tromperies ? Et que se passe-t-il lorsque, des années plus tard, cet homme ose revenir à la source de sa douleur ?",isbn:"9782259320900",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259320900-M.jpg"},
  {t:"Le Porte-bonheur",a:"Luciani Brigitte",y:"2023",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeunesse",sup:"Imprimé",d:"- \"Moi je veux bien un porte-bonheur comme Martis\". - \"Quoi ? Ne me dis pas que tu crois à ces trucs ? \" Décidément, blaireaux et renards ne sont pas pareils. Et quand il s'agit des croyances, évidemment, ils ne sont jamais d'accord. Quand leur ami Martis arrive avec un porte-bonheur, Carcajou se moque et décide de prouver à tout le monde qu'il n'y a rien de magique dans ces amulettes en bois. Mais l'affaire n'est pas simple, l'expérience tourne mal et le doute s'installe. Si tout ça n'est qu'une question de hasard, comment se fait-il que certains semblent clairement plus chanceux que d'autres ? Avoir de la chance, finalement, à quoi ça tient ? Chaque tome de la série sera dorénavant proposé à partir de 2026 en version souple à plus petit format (195 x 260) avec un bonus de huit pages supplémentaires (jeux, cahier didactique...). Le tout à petit prix !",isbn:"9782205077964",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205077964-475x500-1.jpg"},
  {t:"Victor Hugo",a:"Sandras Agnès",y:"2023",ed:"Coédition Perrin/BNF",cote:"B HUG",pub:"Adulte",sup:"Imprimé",d:"Le dernier géant La vie et l'oeuvre de Victor Hugo (1802-1885) incarnent le XIXe siècle par leur éclectisme, leur caractère visionnaire et leur immensité. Que ce soit en poésie (Les Rayons et les Ombres, Les Orientales), au théâtre (Hernani, Ruy Blas) ou naturellement dans ses romans en particulier Notre-Dame de Paris et Les Misérables, ce génie - qui a dépassé en notoriété son idole de jeunesse Chateaubriand - a bouleversé l'histoire de la littérature avant de demeurer dans la mémoire collective jusqu'à nos jours. Mais Victor Hugo fut aussi un politique de grande envergure, le romantique ultra de la jeunesse laissant place à l'orléaniste social de la maturité avant de finir en prophète de la République, accablant de ses traits en vers et en prose Napoléon III (Les Châtiments, Histoire d'un crime) tout en dressant l'irremplaçable chronique de son temps dans Choses vues. Le récit de ses vies multiples s'appuie sur une iconographie d'exception, en particulier la reproduction de superbes dessins et des manuscrits du \" voyant \" auxquels s'ajoutent de nombreux portraits, notamment photographiques, et bien entendu le colossal fond Hugo de la Bibliothèque nationale de France, riche en manuscrits aux extraordinaires ratures, en lettres d'amour bouleversantes, en notes intimes, dont quelques-unes inédites, et enfin en une incroyable collection de dessins, qui révèlent l'immense talent de Hugo, artiste majeur de son temps, peignant sans relâche à l'aide de gouache, d'encre et de café des vues apocalyptiques, des tempêtes hallucinées et des châteaux fantastiques. L'alliance spectaculaire du manuscrit et de l'image, au coeur même du projet de la \" Bibliothèque des Illustres \", n'avait jamais été aussi bien mise en avant qu'avec les oeuvres extraordinaires léguées par \" l'Homme océan \". Ce livre a remporté le Prix Napoléon III en 2025.",isbn:"9782262101190",extraUrl:"https://covers.openlibrary.org/b/isbn/9782262101190-M.jpg"},
  {t:"Les mondes de demain",a:"Gave Charles",y:"2025",ed:"Pierre de Taillac",cote:"330 GAV",pub:"Adulte",sup:"Imprimé",d:"Avec lucidité, Charles Gave décrypte les vingt prochaines années : la fin de l'hégémonie du dollar, l'essor de l'océan Indien, le nouvel axe Pékin-Moscou-Delhi et le crépuscule de l'Occident. Là où beaucoup redoutent le chaos, il discerne autre chose : l'avènement d'un monde plus décentralisé, plus libre et donc plus prospère. Un essai visionnaire, qui ne se contente pas d'annoncer l'avenir : il nous aide à le comprendre.",isbn:"9782364453197",extraUrl:"https://covers.openlibrary.org/b/isbn/9782364453197-M.jpg"},
  {t:"Viens Elie",a:"Sollberger Jonas",y:"2026",ed:"Les Editions de Minuit",cote:"R SOL",pub:"Adulte",sup:"Imprimé",d:"\"qu'est-ce que tu fais Moïse dit Elie tu vas où et Elie voit comme Moïse prend de l'élan et se laisse porter par l'air chaud mélangé à l'air frais et humide de la forêt et Elie se dit qu'il faut garder son calme car ça lui arrive à Moïse de s'aventurer un peu autour de quelques arbres avant de revenir se poser sur son épaule\" Tandis que la nuit tombe peu à peu sur la forêt, Elie part à la recherche de son oiseau, ignorant les prières répétées de sa mère et de sa soeur qui l'exhortent à abandonner et rentrer à la maison. Malgré sa peur, Elie persiste à écouter cette autre voix qui l'appelle dans l'obscurité. Viens Elie, premier roman de Jonas Sollberger, est le récit d'une quête d'identité.",isbn:"9782707357250",extraUrl:"https://covers.openlibrary.org/b/isbn/9782707357250-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Jae-ha se transforme en dragon a avant de disparaître sous les yeux de Yona et ses comparses, qui cherchaient désespérément à le retrouver. Pendant ce temps, au sein des troupes du Kôka, les soldats se sentent observés…",isbn:"9782811694593",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811694593-M.jpg"},
  {t:"Les extraterrestres ne sont pas verts !",a:"Quadri Marco",y:"2026",ed:"Rue du Monde",cote:"A QUA",pub:"Jeunesse",sup:"Imprimé",d:"As-tu déjà vu un objet suspect dans le ciel ou une silhouette étrange se dessiner dans l'ombre ? Sache qu'il ne s'agissait pas d'un extraterrestre ! Pour l'instant, rien ne prouve qu'ils existent, et encore moins qu'ils soient verts... On a pourtant le droit de rêver, il y a tellement de place dans l'espace !",isbn:"9782355048111",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355048111-475x500-1.jpg"},
  {t:"Médecin",a:"Bexington Carys",y:"2026",ed:"Editions Gründ",cote:"A BEX",pub:"Jeunesse",sup:"Imprimé",d:"Viens découvrir le métier de docteur avec Gabin ! Gabin est un lapin qui aime découvrir les métiers. Lequel découvrira-t-il aujourd'hui ? Ta-dam ! Aujourd'hui, il est docteur ! Tourne les roues pour l'aider à faire des radios, des bandages et bien plus encore ! Un album tout-carton animé au charme fou pour éveiller les petits. Dans la même collection : Gabin le lapin - Conducteur de train",isbn:"9782324038075",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782324038075-475x500-1.jpg"},
  {t:"Mes premiers pas en origami",a:"Akass Susan",y:"2013",ed:"Les Editions de Saxe",cote:"736.98 AKA",pub:"Jeunesse",sup:"Imprimé",d:"35 modèles d'origami des plus simples (des papillons, des maisons, etc.) aux plus compliqués (des nichoirs, des poupées russes, etc.). Des smileys leur attribuent un niveau de difficulté : le niveau 1 pour les pliages les plus simples, le niveau 2 intermédiaire et le niveau 3 pour les plus difficiles (les pliages inversés).",isbn:"9782756510385",extraUrl:"https://products-images.di-static.com/image/akass-susan-mes-premiers-pas-en-origami/9782756510385-475x500-1.webp"},
  {t:"Le grand air",a:"Othats Margaux",y:"2026",ed:"La Partie",cote:"A OTH",pub:"Jeunesse",sup:"Imprimé",d:"Un imagier pour faire le tour des saisons en jeu et en mouvement ! Sauter, tomber, toucher... cet imagier met en scène une enfant qui goûte chacune des saisons au grand air. Les verbes d'actions, comme une ritournelle, sont mis en pratique par l'enfant, mais aussi par ce qui l'entoure. Ainsi, le pic-vert et le soleil tapent, les bourrasques soufflent, la foudre tombe en été et la nuit tombe en hiver...",isbn:"9782494591370",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494591370-475x500-1.jpg"},
  {t:"Napoléon, la France et l'Europe",a:"Lignereux Aurélien",y:"2026",ed:"Seuil",cote:"944.05 LIG",pub:"Adulte",sup:"Imprimé",d:"Et si embrasser d'un seul regard ou presque le monde napoléonien dans son ensemble devenait possible ? Avec l'infographie, la Grande Armée, le Grand Empire et la vie de Napoléon le Grand se déploient autrement, en une synthèse inventive, qui renouvelle les points de vue et met à la portée de chacun les débats et découvertes de l'historiographie internationale de ces dernières années. Déjà familière à l'histoire militaire napoléonienne pour figurer l'organisation des armées, l'évolution des campagnes ou la présentation des batailles, la visualisation graphique restitue sous une forme expressive et accessible les questionnements d'histoire politique, sociale ou économique.",isbn:"9782021594782",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021594782-M.jpg"},
  {t:"Le Grand Roi Soleil",a:"Mélèse Mathilde",y:"2026",ed:"Editions Panthera",cote:"A MEL",pub:"Jeunesse",sup:"Imprimé",d:"\"J'étais une petite fille assez solitaire et rêveuse, mais autoritaire avec mon frère et ma soeur, plus jeunes que moi. Vers l'âge de six ans, je me suis créé un ami, un compagnon, pas seulement plus sage que moi, mais aussi bien plus sage que mes parents. Il avait un savoir, un sens de la justice, une bonté, une sévérité et une rigueur, beaucoup plus vastes et solides que les leurs. Le Grand Roi Soleil. Mon Grand Roi Soleil\".",isbn:"9782494182318",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494182318-475x500-1.jpg"},
  {t:"Ouvre la bouche en grand !",a:"Ma Daishu",y:"2026",ed:"minedition",cote:"A MA",pub:"Jeunesse",sup:"Imprimé",d:"\"Ouvre la bouche, dit Jade. Et fais \"Ahhh...\"\" Un livre qui va donner à tous les enfants l'envie de se brosser les dents.",isbn:"9782354137854",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137854-475x500-1.jpg"},
  {t:"Maman pour toujours",a:"Lorenzoni Chiara",y:"2026",ed:"Éditions Sarbacane",cote:"A LOR",pub:"Jeunesse",sup:"Imprimé",d:"\" Olivo habite avec son papa. Il y a lui et son papa et puis voilà. \" Comme un doux poème, voici l'histoire d'un enfant dont la maman n'est plus là. Cela le met en colère et ses jambes donnent des coups de pied et cassent des choses. Heureusement, il y a les câlins surprises, qui eux, sont restés. Ils ont même augmenté. Un jour, son papa l'invite à couper du bois\". Un mot triste, un bout de bois, un mot colère, un autre bout de bois. \" Jusqu'à épuiser le tas du jardin - et tous les mots tristes ou colères. Puis ils se rendent auprès du grand chêne, et cette fois, c'est le papa qui va épuiser son chagrin en construisant une cabane dans les hautes branches. D'où Olivo comprendra que sa maman est avec eux - pour toujours...",isbn:"9791040807742",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791040807742-475x500-1.jpg"},
  {t:"So help me god !",a:"Žigunov Ûrij",y:"2026",ed:"Dargaud Benelux",cote:"BD JIG",pub:"Adulte",sup:"Imprimé",d:"Dans un avion pour Moscou, Boris, l'agent russe du FSB que XIII a connu dans sa jeunesse lors de son infiltration à Cuba, rappelle à notre héros une ancienne mission que sa mémoire avait effacée. En stimulant la mémoire perdue de Jason Mac Lane, le Russe espère découvrir la cachette d'une vielle preuve de complot pouvant être utile pour relancer sa carrière. En 1984, du temps de la guerre froide, XIII avait été missionné pour tuer un candidat à la présidence russe jugé un peu trop conservateur par le gouvernement américain dans le cadre du plan de réchauffement des relations Est-Ouest. Mais l'attentat prévu lors d'une réception à Spaso House, la résidence moscovite de l'ambassadeur américain, avait échoué par la faute d'une agente infiltrée du KGB, Nina Orekhova, alias « Babotchka » (« papillon »). Cette dernière, voyant en Jason Mac Lane un jeune idéaliste, glisse dans ses mains une micro-cassette contenant les preuves de complicités de milliardaires russes et américains dans un trafic d'armes et de technologies militaires entre Soviétiques et Américains vénaux ayant des intérêts communs dans le maintien des tensions entre les deux super puissances. XIII parviendra à s'échapper et sera renvoyé par la CIA à Cuba (qu'il quittera bientôt « pour Maria ». Mais ceci est une autre histoire... (cfr tomes 9 et suivants de la série.)",isbn:"9782505140450",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505140450-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Pour sauver Mei Niang des griffes de ses ravisseurs,   Yona et sa bande se sont infiltrés dans le camp  militaire du Kai du sud. Tandis que Hak affronte  le général Hiktan, Val fait irruption et choisit  de le défendre contre ses anciens  compagnons d'armes…",isbn:"9782811687106",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811687106-M.jpg"},
  {t:"L'odyssée de Luca",a:"Bréchignac Catherine",y:"2026",ed:"Cerf",cote:"121 BRE",pub:"Adulte",sup:"Imprimé",d:"Et si la destinée de Luca, jeune homme au nom inspiré du dernier ancêtre commun à tous les êtres vivants (Last Universal Common Ancestor), rejouait toute l'épopée de l'humanité vers la rationalité ? Au lycée, il s'éprend des grands penseurs, rêvant d'une vie guidée par la science et la philosophie. Mais cette noble ambition se heurte bientôt à la réalité : voilà Luca confronté aux limites de la raison, celles de la passion amoureuse et des réseaux sociaux. Comment déjouera-t-il les erreurs de la raison, tels les biais cognitifs ? Comment parviendra-t-il à garder la réflexion pour boussole et à éviter de perdre le nord ? A travers ce récit initiatique, Catherine Bréchignac dépeint avec brio ce nouveau monde où l'opinion prend le pas sur l'argumentation, l'ignorance sur la science, la domination sur l'émancipation. Un constat sans concession, porté par une voix d'exception, sur les pièges mortifères de l'actuelle déraison. Physicienne de renommée internationale, membre de l'Académie des sciences et de l'Académie des technologies, après avoir été directrice puis présidente du CNRS, Catherine Bréchignac est l'autrice d'essais remarqués, dont Retour vers l'obscurantisme (2022) et La Force de nos racines (2024).",isbn:"9782204170451",extraUrl:"https://covers.openlibrary.org/b/isbn/9782204170451-M.jpg"},
  {t:"Mary Cassatt",a:"Gentner Florence",y:"2026",ed:"Fayard",cote:"B CAS",pub:"Adulte",sup:"Imprimé",d:"Mary Cassatt (1844-1926) s'impose comme l'une des grandes figures de l'impressionnisme dans un monde artistique dominé par les hommes. Américaine installée à Paris dès 1874, elle révolutionne la peinture aux côtés de Degas, Monet, Pissarro ou Berthe Morisot, tout en revendiquant la place des femmes artistes. Entre la France et les Etats-Unis, Cassatt joue un rôle décisif : véritable passeuse, elle contribue à faire connaître l'impressionnisme aux collectionneurs américains et participe à l'essor des premières grandes collections d'art de son pays. A l'occasion du centenaire de sa mort, Florence Gentner dresse le portrait inédit d'une pionnière trop longtemps reléguée au second plan. S'appuyant sur un vaste corpus de lettres et de documents d'archives rarement consultés, elle restitue l'itinéraire singulier de Cassatt : ses engagements, ses combats pour la reconnaissance, ses amitiés avec Degas et les impressionnistes, ainsi que sa participation à quatre des expositions du groupe. L'ouvrage montre combien son regard moderne, sensible à la vie quotidienne, aux mères et aux enfants, a profondément marqué l'histoire de l'art. Croisant histoire de l'art et histoire des femmes, cette biographie captivante redonne toute sa place à Mary Cassatt dans l'aventure impressionniste et met en lumière l'influence durable qu'elle a exercée sur les deux rives de l'Atlantique.",isbn:"9782213734279",extraUrl:"https://covers.openlibrary.org/b/isbn/9782213734279-M.jpg"},
  {t:"Sac à poux",a:"Amram Nicole",y:"2023",ed:"Gallimard",cote:"A AMR",pub:"Jeunesse",sup:"Imprimé",d:"Un recueil de poèmes joyeux et pleins d'humour. \"Ils ne sont pas poissons d'eau douce pas poissons scie, ni poissons-chats... On ne les voit pas dans les vagues. Mais en avril, ils seront là, dans ton dos, pour faire des blagues ! \" Un mariage d'hippopotame, un éléphant en hélico, des poux sur la tête, des moustiques qui piquent et tout plein d'oiseaux... Voici de petites poésies, comme des comptines, à apprendre ou à lire à haute voix pour se faire plaisir en jouant avec les mots !",isbn:"9782075175593",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075175593-475x500-1.jpg"},
  {t:"Embraye, Louise",a:"Boussion Clara",y:"2026",ed:"Gallimard",cote:"R BOU",pub:"Adulte",sup:"Imprimé",d:"Ils ont grandi dans des villages, sur des routes de campagne, entre soirées improvisées et boulots de courte durée. Ils croyaient que l'amitié serait leur maison, leur refuge. Louise en faisait partie. Mais à l'heure où chacun choisit une voie, Louise vacille. Elle cherche à habiter son corps, son identité, sa place. Comme s'il fallait atténuer ce flou persistant, comme s'il fallait tout déterminer. Elle avance, travaille, roule la nuit fenêtres ouvertes, se réinvente dans la ville, dans la création, dans les gestes qu'elle apprend à refaire elle-même. Embraye, Louise est l'histoire d'une génération qui se soustrait aux trajectoires déjà tracées. Une génération qui tâtonne, qui brûle, qui chute, qui recommence. Un premier roman sur la force qu'il faut pour se transformer avec courage et détermination sans jamais renier ce que l'on a été.",isbn:"9782073139030",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073139030-M.jpg"},
  {t:"Lyra",a:"Loyer Anne",y:"2026",ed:"Editions Casterman",cote:"J LOY",pub:"Jeunesse",sup:"Imprimé",d:"On dit que la musique adoucit les moeurs... dans cette famille, elle rapproche les soeurs ! Depuis des semaines, Lyra se prépare pour l'audition de flûte qui lui permettra d'impressionner Léonard Belcanto, son père chef d'orchestre... mais dans sa tête se joue une vraie tempête. Elle s'interroge sur l'absence d'attention de ce père qui refait sa vie de son côté et semble la remplacer, elle s'alarme de ne pas être prête le jour J et, pour couronner le tout, elle doit gérer les amours de sa soeur Antara avec le doux Virgile... Courageuse, assidue et attentive aux autres sans même s'en rendre compte, Lyra va tout faire pour que sa famille entière soit réunie lors de l'audition et s'assurer que ce petit monde reste accordé !",isbn:"9782203300156",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300156-475x500-1.jpg"},
  {t:"Sicario bébé",a:"Taillandier Fanny",y:"2026",ed:"Rivages",cote:"R TAI",pub:"Adulte",sup:"Imprimé",d:"\" Laisse-moi régler deux ou trois choses avant de débouler, petit être. Quelque part, c'était la marche tout entière du monde qu'il eût fallu que je règle. Mais on ne peut pas dire toute la vérité aux enfants. \" Dans la petite ville de V., Blaise et Djen, dix-sept ans et amoureux fous, attendent un bébé. Mais ni l'un ni l'autre n'a les ressources pour l'accueillir. Leur camarade Bobby a une idée : cinquante mille euros contre un assassinat commandité par un redoutable narcotrafiquant du secteur. Commence alors une folle cavalcade à travers le pays - de la cité en démolition au grand port maritime, du foyer de travailleurs à une ZAD cachée dans les bois, des bancs de l'école jusqu'à l'océan -, une course contre la montre, un récit de passion et de sang. Inspiré de plusieurs faits divers, Sicario bébé propose de regarder notre monde à travers les yeux grands ouverts de jeunes gens confrontés au mal mais portés par une seule force : le désir de vivre. Ode au romanesque, cette fresque de la France métropolitaine d'aujourd'hui - de ses paysages, de ses fractures et de ses luttes - est avant tout une histoire de jeunesse : celle qui fait les rêves, les erreurs et les révolutions.",isbn:"9782743669164",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743669164-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"À la veille d'une bataille qui opposera le pays de Kôka au Kai du sud, Yona se prépare à rejoindre le front. De leur côté, Hak et Yeon traversent la province de Kin à la recherche de la milleplantes. Mais Geun-tae ayant été sérieusement blessé, Hak prend la tête des troupes affaiblies et se retrouve en première ligne pour repousser l'ennemi…",isbn:"9782811673512",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811673512-M.jpg"},
  {t:"La petite poule rousse",a:"Paku",y:"2026",ed:"Fleurus",cote:"A PAK",pub:"Jeunesse",sup:"Imprimé",d:"Il était une fois... L'histoire de La Petite Poule rousse tendrement illustrée pour faire découvrir aux tout-petits les contes de notre enfance.",isbn:"9782215201564",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215201564-475x500-1.jpg"},
  {t:"Yona, Princesse de l'Aube T38",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Afin de préparer la bataille avec le Kai du sud, le pays de Kôka rassemble toutes les tribus sous son égide pour fortifier ses troupes. Accompagnée des quatre guerriers dragons, Yona rallie elle aussi les rangs de l'armée et rejoint le front. Mais qu'est-il advenu de Hak, porté disparu après l'attaque submersive du général Laan'",isbn:"9782811677855",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811677855-M.jpg"},
  {t:"Ce temps où nous mourons de ne pas vivre",a:"Leroux Théophane",y:"2026",ed:"Plon",cote:"305.5 LER",pub:"Adulte",sup:"Imprimé",d:"Une chronique douce-amère du néoruralisme et de la quête de sens, ces antidotes en trompe-l'oeil au mal-être moderne des jeunes générations. Un récit littéraire, spirituel et social d'une justesse rare. Théophane a 30 ans, et ce fan de Georges Brassens ne trouve pas sa voie professionnelle et personnelle dans ce monde. Il décide de tout plaquer - son travail, Paris, ses amis - pour partir vivre en Anjou, au milieu des vignes, où il devient ouvrier agricole. Voilà des années que l'on nous vend la \" reconnexion à la nature \" comme la solution miracle à la plupart de nos problèmes et impasses. Loin d'un beau discours enchanteur relevant du mythe, ou du conte de fées moderne pour adultes désorientés, l'auteur propose un récit et des réflexions sur l'Homme et Dieu, et préfère - dans la solitude des vignes - se tourner vers le Beau, l'ascèse et le goût du travail bien fait.",isbn:"9782259324519",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259324519-M.jpg"},
  {t:"Les araignées, 100 infos à connaître",a:"Collectif",y:"2024",ed:"Piccolia",cote:"J 595.4 DEL",pub:"Jeunesse",sup:"Imprimé",d:"Un concept pertinent de documentaire, avec photos et illustrations, de 100 infos, avec des quizz et des activités à réaliser. 100 faits numérotés, accompagnés de magnifiques illustrations, plongeront les enfants dans une aventure irrésistible de bout en bout, racontée avec humour grâce à des détails et des dessins amusants. Les jeunes esprits curieux y apprécieront les quiz et activités qui leur permettront de tout connaître sur leur sujet favori !",isbn:"9782753075221",extraUrl:"https://m.media-amazon.com/images/I/51JtYYV9EFL._SX95_.jpg"},
  {t:"Venise",a:"Plisson Philip",y:"2016",ed:"La Martinière",cote:"914.5 VEN",pub:"Adulte",sup:"Imprimé",d:"Fondée au Ve siècle, la ville insulaire devenue cinq siècles plus tard une grande puissance maritime, s'étend sur plus de 118 îlots et compte près de 400 ponts. Navigant à bord de son petit bateau dans l'enchevêtrement des canaux de Venise, Philip Plisson, dont le statut de résident vénitien lui ouvre les portes les plus secrètes de la ville, se consacre depuis près de trois années à cet ouvrage. C'est un rêve nourri de longue date : naviguer sur les canaux aux mille-et-une légendes, marcher, de jour comme de nuit, se perdre, se retrouver dans ce double labyrinthe de terre et d'eau, d'ombre et de lumière où s'agitent des silhouettes. Se promener, sans jamais mettre le pied à terre et explorer les lieux souvent secrets où Venise garde la mémoire d'anciens hôtes prestigieux. Témoin privilégié de la vie des habitants de Venise, Philip Plisson a embarqué au petit matin avec les livreurs, les remorqueurs, avec les pilotes du port, ou sur le plus gros porte-conteneur qui, régulièrement, décharge au terminal industriel. De jour comme de nuit, il est monté à bord des navettes de la police, des pompiers ou des ambulanciers. Ses photographies révèlent la Sérénissime comme un décor de théâtre posé à fleur d'eau.",isbn:"9782732480237",extraUrl:"https://covers.openlibrary.org/b/isbn/9782732480237-M.jpg"},
  {t:"Organique",a:"Enders Giulia",y:"2026",ed:"Albin Michel",cote:"612 END",pub:"Adulte",sup:"Imprimé",d:"Giulia Enders entremêle avec talent et humour connaissances scientifiques et conseil pratique. L'Express On y apprend beaucoup de choses vitales, et d'autres plus inattendues et réjouissantes. A lire sans modération. Psychologies Magazine Giulia Enders met un point d'honneur à rendre accessible ce savoir sur le corps, alliant ses connaissances rigoureuses à un joli talent de conteuse. Le Nouvel obs Optant pour la même démarche de vulgarisation que pour le premier opus, à la fois plein d'humour et scientifiquement irréprochable, elle vante dans son nouvel ouvrage les mérites insoupçonnés de cinq nouveaux organes. Le Monde Avec Le Charme discret de l'intestin, son immense bestseller, Giulia Enders a inventé une nouvelle manière d'écrire la science. Dans Organique, elle nous convie à un voyage fascinant à travers notre organisme. En s'appuyant sur les découvertes les plus récentes, et grâce à son inimitable talent de conteuse, elle dessine une cartographie sensible de notre être organique et éveille un intérêt passionné pour ce qui nous est à la fois si proche et si lointain : nous-mêmes.",isbn:"9782226506603",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226506603-M.jpg"},
  {t:"Les griffes du Gévaudan",a:"Runberg Sylvain",y:"2026",ed:"Glénat",cote:"BD RUN",pub:"Adulte",sup:"Imprimé",d:"Sur les traces d'une bête terrifiante aux multiples visages !1765. Missionné par Louis XV pour restaurer l'honneur de la couronne, François Antoine, chasseur du roi, pensait capturer rapidement la Bête qui traumatise la population de Gévaudan. Mais ce monstre insaisissable, surnommé la Mal Bête, semble défier toute logique et toute arme. D'ailleurs, est-ce bien d'une bête qu'il s'agit ? Car quelle sorte d'animal décapite, démembre et parfois déshabille ses proies ? Alors que la traque s'intensifie, plusieurs suspects sont écartés. Alors qu'on compte déjà, plusieurs dizaines de victimes,   la carcasse d'un loup qu'on exhibe à Paris semble clore cette sombre affaire qui embarrasse le Roi. Pourtant, les exactions recommencent ! Désormais seul, sans le soutien du roi, François Antoine revient dans les hauteurs du Gévaudan, bien décidé à trouver les coupables ! Il sait que dans cette région rongée par la misère, la violence et les secrets, les comptes se règlent à huis clos. Ce qu'il va découvrir pourrait embraser toute la région et ébranler le royaume. Et si la Bête était le fruit d'une vengeance née dans les flammes ? La traque sanglante va bientôt le mener dans un repaire cauchemardesque où le souvenir d'un crime oublié va resurgir…D'après des faits réels survenus en Lozère au XVIIIe siècle, le mythe de la « Bête du Gévaudan », jamais élucidé, a marqué l'Histoire et inspiré le cinéma. Sylvain Runberg et Jean-Charles Poupard s'emparent d'un mythe connu de tous, et réinventent l'histoire de la « Malbête » pour mieux brouiller les pistes et nous entraîner dans une enquête terrifiante. Ce deuxième tome nous plonge au cœur du mystère où la frontière entre l'homme et le monstre devient de plus en plus floue.",isbn:"9782344058251",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344058251-M.jpg"},
  {t:"Danemark et îles Féroé",a:"O'Malley Thomas",y:"2025",ed:"Lonely Planet",cote:"914.8 DAN",pub:"Adulte",sup:"Imprimé",d:"Le guide de référence pour organiser votre voyage de rêve au Danemark ! Lonely Planet, l'éditeur n?1 de guides de voyage dans le monde. Ce guide tout en couleur vous accompagne dans votre voyage pour découvrir les incontournables du Danemark et sortir des sentiers battus . De Copenhague à Kronborg Slo, découvrez tous les trésors repérés par nos auteurs sur le terrain . - Les sites incontournables d'un voyage au Danemark : Copenhague, les jardin de Tivoli, Refshaleoen, Kronborg Slot, le château de Hamlet, Frederiksborg Slot, le Versailles danois, Egeskov Slot, Moesgaard Museum, le parc à thème Legoland ... . - Des conseils d'experts Lonely Planet mis à jour régulièrement : les meilleures adresses (restaurants, cafés, hôtels), des recommandations pratiques pour organiser son voyage... - Les plus belles expériences à vivre au Danemark pour un voyage hors du commun : des activités et sorties originales avec toutes les informations nécessaires et les astuces pour les réaliser au mieux. - Des sélections d'itinéraires thématiques à pied, à vélo ou en voiture : balade gourmande à Copenhague, à vélo dans la péninsule de Jungshoved, histoire, poneys sauvages et moulin à vent sur l'île de Langeland ... Mais aussi des itinéraires régionaux pour découvrir le meilleur du Danemark, en toute saison, quel que soit le temps ou le budget disponible. - Un focus complet sur les activités de plein air à faire au Danemark, avec une attention particulière portée sur la randonnée, mais aussi le vélo, le canoë kayak ou encore les sports nautiques. - Plus de 60 cartes et plans clairs du Danemark et de ses villes principales pour repérer les sites en un coup d'oeil et organiser ses déplacements. Ce guide propose également des informations pour voyager responsable et avec des enfants, ainsi que des chapitres thématiques sur la vie des habitants, l'histoire et les traditions du Danemark. Un guide clair et synthétique pour construire facilement son voyage et vivre des expériences inoubliables au Danemark, au plus près des habitants.",isbn:"9782384927760",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384927760-M.jpg"},
  {t:"Comment la Palestine fut perdue et pourquoi Israël n'a pas gagné",a:"Filiu Jean-Pierre",y:"2025",ed:"Points",cote:"956 FIL",pub:"Adulte",sup:"Imprimé",d:"Comment la Palestine fut perdue Si vous estimez connaître assez du conflit israélo-palestinien pour en nourrir des opinions définitives, mieux vaut ne pas ouvrir ce livre. Vous risqueriez d'y apprendre que le sionisme fut très longtemps chrétien avant que d'être juif. Ou que la dynamique factionnelle a, dès l'origine, miné et affaibli le nationalisme palestinien. Jean-Pierre Filiu, spécialiste incontesté de la question, redonne du sens à un conflit apparemment sans fin. Israël a gagné guerre après guerre, sans pour autant remporter la victoire, car son avenir ne sera garanti que par l'établissement d'un Etat palestinien vivant en paix à ses côtés. A l'heure où Israël croit effacer la Palestine en anéantissant Gaza, ce livre est un formidable message d'espoir. Jean-Pierre Filiu Professeur en histoire du Moyen-Orient à Sciences Po, Paris, il est l'auteur de nombreux ouvrages de référence, traduits dans une vingtaine de langues, dont Histoire du Moyen-Orient (\"Points Histoire\", 2023) et Un historien à Gaza (Les Arènes, 2025).",isbn:"9791041415502",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041415502-M.jpg"},
  {t:"Partir sur la Route 66",a:"Bender Andrew",y:"2026",ed:"Lonely Planet",cote:"917.3 ETA",pub:"Adulte",sup:"Imprimé",d:"Grâce à la nouvelle collection Partir de Lonely Planet, lancez-vous sur l'itinéraire mythique de la Route 66 qui célèbre son centième anniversaire ! De Chicago à Los Angeles, suivez les conseils d'auteurs expérimentés et préparez-vous à vivre l'aventure de vos rêves. La Route 66 est un mythe : 4000 km de Chicago à Santa Monica (non loin de Los Angeles), des grands espaces ponctués de villes fantômes, des diners où engloutir des litres de café, des stations-services vintages. Autant de symboles qui ont construit la légende de cette \" mère des routes \" états-uniennes. 7 auteurs ont parcouru et couvert cette route emblématique, certains à plusieurs reprises. Ces experts vous livrent leur vision de la Route 66 ainsi que leurs conseils pour planifier, organiser et réussir votre périple. 8 Etats américains traversés (Illinois, Missouri, Kansas, Oklahoma, Texas, Nouveau-Mexique, Arizona et Californie) et des villes emblématiques à découvrir (Chicago, Tulsa, Oklahoma City, Santa Fe, Albuquerque, Los Angeles) L'itinéraire de la Route 66 est décrit étape par étape, avec pour chaque portion tous les incontournables à découvrir, les meilleures adresses des auteurs, la durée recommandée... Des essais thématiques apportent des éclairages sur la Route 66 et ses symboles (l'attrait pour les grands espaces, le rôle du cinéma dans son succès, les motels et les stations-services vintage...). Richement illustré de photos pour vous inspirer et de cartes (cartes régionales avec le tracé de l'itinéraire et plans des villes principales avec les points d'intérêts) pour vous repérer facilement et construire votre propre Route 66. Et bien sûr, toutes les informations pratiques pour vous lancer à votre tour (budget, assurance, permis de conduire, location...). En clair, un joli carnet de route avec des pages aux coins arrondis et un format pratique, à emporter avec soi sur la Route 66.",isbn:"9782384929429",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929429-M.jpg"},
  {t:"Invincibles",a:"De Decker Arnaud",y:"2025",ed:"Kennes",cote:"320.947 DEC",pub:"Adulte",sup:"Imprimé",d:"Depuis 2022, Arnaud De Decker sillonne l'Ukraine en guerre, micro et carnet à la main. Là où les caméras ne vont plus, il reste. Là où la peur fige, il avance. Dans Invincibles, il revient sur ses nombreux séjours en zones de combat à travers les récits intimes et bouleversants de soldats, de civils, d'enfants, de médecins... En s'attachant ainsi à mettre en lumière des parcours individuels, il rappelle cette force qui, plus que toute autre, surgit dans l'adversité : être capable d'aimer malgré la perte, d'espérer malgré la désolation. Refusant le spectaculaire ou la posture de héros, l'auteur propose une approche sobre, humaine, directe. Son livre est un cri retenu, une documentation précieuse, un hommage sincère à la résilience d'un peuple.",isbn:"9782931300312",extraUrl:"https://covers.openlibrary.org/b/isbn/9782931300312-M.jpg"},
  {t:"Algérie",a:"Ham Anthony",y:"2026",ed:"Lonely Planet",cote:"916.5 ALG",pub:"Adulte",sup:"Imprimé",d:"Le guide de référence pour organiser votre voyage de rêve en Algérie ! Lonely Planet, l'éditeur n?1 de guides de voyage dans le monde. Ce guide tout en couleur vous accompagne dans votre voyage pour découvrir les incontournables de l'Algérie et sortir des sentiers battus. D'Oran à Alger, en passant par le Sahara algérien, découvrez tous les trésors repérés par nos auteurs sur le terrain. - Les sites incontournables d'un voyage en Algérie : la casbah d'Alger, les Grands Ergs, véritables mers de sable, la vallée du M'Zab et ses villages fortifiés, les vestiges romains de Tipaza et de Timgad, Annaba et ses plages, le patrimoine architectural d'Oran et de Constantine, le Sahara algérien... - Des conseils d'experts Lonely Planet mis à jour régulièrement : les meilleures adresses (restaurants, cafés, hôtels), des recommandations pratiques pour organiser son voyage... - Les plus belles expériences à vivre en Algérie pour un voyage hors du commun : des activités et sorties originales avec toutes les informations nécessaires et les astuces pour les réaliser au mieux. - Des sélections d'itinéraires thématiques à pied, à vélo ou en voiture : tour à pied dans la casbah, dans les pas d'Albert Camus et Yves Saint-Laurent à Oran, à la découverte des paysages ocre et des oasis qui entourent Timimoun, traversée du Tassili N'Ajjer, ce labyrinthe de canyons sculptés par les éléments au coeur du Sahara ... Mais aussi des itinéraires régionaux pour découvrir le meilleur de l'Algérie, en toute saison, quel que soit le temps ou le budget disponible. - Un focus complet sur les activités de plein air à faire en Algérie, avec une attention particulière portée sur la randonnée, mais aussi le vélo, les balades à dos de dromadaire ou encore les sports nautiques. - Plus de 70 cartes et plans clairs de l'Algérie et de ses villes principales pour repérer les sites en un coup d'oeil et organiser ses déplacements. Ce guide propose également des informations pour voyager responsable et avec des enfants, ainsi que des chapitres thématiques sur la vie des habitants, l'histoire et les traditions de l'Algérie. Un guide clair et synthétique pour construire facilement son voyage et vivre des expériences inoubliables en Algérie, au plus près des habitants.",isbn:"9782384929092",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929092-M.jpg"},
  {t:"Grand-Père",a:"Ieradi Assia",y:"2026",ed:"Alice",cote:"A IER",pub:"Jeunesse",sup:"Imprimé",d:"Au lieu de parler, Grand-Père fait des sons étranges. Le seul qui semble le comprendre, c'est son chien. Mais ça, on n'en est pas bien sûrs.",isbn:"9782874266904",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782874266904-475x500-1.jpg"},
  {t:"La princesse qui aimait les chenilles",a:"Ceccatty René de",y:"2026",ed:"Philippe Picquier",cote:"R CEC",pub:"Adulte",sup:"Imprimé",d:"Ces six contes sont aussi anciens que le Japon. Puisés dans le folklore et adaptés de recueils de légendes anciennes et de contes du Moyen Age, ils se donnent à lire comme un trésor de récits dans lesquels bien souvent le fantastique le dispute au merveilleux. Monde peuplé de monstres et de géants, de spectres terrifiants et de fantômes bienveillants, dans lequel on peut entendre les voix du rêve et du surnaturel : parfois les enfants naissent dans un coquillage ou dans une pêche, souvent les objets magiques font des prodiges, et les princesses sont délivrées comme dans nos contes d'enfants, même s'il leur arrive d'avoir des caprices inexplicables.",isbn:"9782809717365",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809717365-M.jpg"},
  {t:"Le Fil de notre histoire",a:"Negrin Fabian",y:"2026",ed:"La Martinière",cote:"A NEG",pub:"Jeunesse",sup:"Imprimé",d:"Un voyage extraordinaire à travers le temps : l'histoire d'une famille racontée à rebours, jusqu'à ses origines les plus lointaines... Lucie, 90 ans, se rappelle de tendres souvenirs qui, par ricochets, en invoquent d'autres plus anciens : les joyeuses soirées avec Giorgio dans les années 1960, leur rencontre quand elle avait 16 ans, sur cette plage où elle passait depuis sa plus tendre enfance tous ses étés. Son père était reporter, il avait rencontré sa mère à Londres. Le père de cette Anglaise, grand-père Charles, capitaine au long cours, était tombé amoureux à Shanghai, au début du siècle, de Mei, une jeune Chinoise. Il avait offert à la petite Lucie une bague qui était dans la famille depuis l'époque des Croisades, lorsqu'un chevalier saxon et une princesse arabe s'étaient unis. Et avant cela ? Une aïeule reine d'Egypte, des esclaves, des chasseurs de crocodiles ou des marchands de fruits, qui sait... Des instants évocateurs et émouvants saisis en peu de mots sont servis par des illustrations et une mise en pages captivantes. Lucie, en remontant le temps, raconte la richesse de ses origines. Ce récit familial nous convie à une exploration poétique de l'identité et de nos racines. En prenant l'amour comme fil conducteur, il montre combien chaque histoire personnelle est un fragment d'une vaste mosaïque humaine et s'inscrit dans une histoire commune et universelle ; il célèbre ce lien qui devrait nous unir, ce patrimoine génétique partagé, hérité d'un ancêtre perdu dans la nuit des temps. Le lecteur rencontrera avec délice chaque génération de cette famille paradigmatique, s'interrogera sur la transmission d'une bague, croisera des personnages hauts en couleur. Jusqu'à cette silhouette dont la narratrice porte fièrement le nom, l'arrière-arrière-arrière-grand-tante de l'humanité : l'australopithèque Lucy. Une grande famille ? L'humanité tout entière ! Un album fascinant, original et graphique qui met en lumière la mixité de nos racines en même temps que notre origine commune, comme une invitation à la fraternité.",isbn:"9791040124320",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040124320-475x500-1.jpg"},
  {t:"Arnaque à Central Park",a:"Payet Jean-Michel",y:"2016",ed:"Milan",cote:"J PAY",pub:"Jeunesse",sup:"Imprimé",d:"Prénom : Scarlett. Signe distinctif : détective en herbe. Particularité son chat, Watson, l'aide dans ses enquêtes... Petit détail : le plus malin des deux n'est pas celui qu'on croit !  En voyage à New York, Scarlett achète une petite souris en origami sur un stand de Central Park. Voilà qui fera un joli souvenir pour Watson, resté de l'autre côté de l'Atlantique. Mais la souris en papier disparait et Scarlett se rend compte qu'elle avait bien plus de valeur qu'il n'y paraît...",isbn:"9782745976758",extraUrl:"https://products-images.di-static.com/image/base/9782745976758-475x500-1.jpg"},
  {t:"Cyberpunk",a:"Mhalla Asma",y:"2025",ed:"Seuil",cote:"327 MHA",pub:"Jeunesse",sup:"Imprimé",d:"E n ce début de XXIe siècle, l'alliance chaotique de Donald Trump et d'Elon Musk a fait surgir une créature technopolitique à deux têtes. L'une orchestre le show, l'autre code le système. Quelque chose d'insaisissable est pourtant à l'oeuvre. Gourous de la Silicon Valley et idéologues néo-réactionnaires orchestrent un fascisme-simulacre annonciateur d'un bouleversement plus profond. Un nouveau régime, hybride, où l'Etat s'efface... pour mieux tout contrôler. L'emprise avance en silence, à l'échelle planétaire. Un empire cognitif reconfigure la démocratie, colonise les corps et les esprits. Depuis le laboratoire américain où s'expérimente le futur, ce livre décrypte le logiciel techno-totalitaire. Dans le monde qui vient, vous ne serez pas augmentés. Vous serez programmés. Le futur est déjà là. La dystopie cyberpunk n'est plus une fiction, c'est notre réalité. Comprendrons-nous à temps ce qui se joue ? Asma Mhalla signe un essai coup de poing pour nommer la nouvelle arène du pouvoir. Et défendre ce qu'il nous reste : notre liberté. Asma Mhalla est politologue et essayiste. Elle est l'autrice d'un premier livre remarqué, Technopolitique. Comment la technologie fait de nous des soldats (Seuil, 2024).",isbn:"9782021587586",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021587586-M.jpg"},
  {t:"Le talisman des 4 dragons - Tome 1 : La flamme perdue",a:"Djebel Yasmine",y:"2026",ed:"Rageot",cote:"J DJE",pub:"Jeunesse",sup:"Imprimé",d:"Le talisman des 4 dragons a &eacute;t&eacute; bris&eacute;&nbsp; ! Selon la l&eacute;gende, les Temp&ecirc;tes risquent de d&eacute;ferler sur l&rsquo;Archipel.<br />Ne&iuml;la se fiche de ces vieilles histoires jusqu&rsquo;au moment o&ugrave; la statue d&rsquo;un fennec prend vie devant ses yeux. Il affirme &ecirc;tre un esprit des temps anciens et confirme la menace qui plane. Ne&iuml;la, qui a plusieurs choses &agrave; se reprocher, d&eacute;cide de partir &agrave; la rencontre du dragon rouge pour demander son aide&hellip",isbn:"9782700286175",extraUrl:"https://products-images.di-static.com/image/base/9782700286175-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2019",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Le lendemain de la déclaration d'amour de Hak, Yona est troublée par les moindres faits et gestes du jeune homme. De son côté, Zeno explique que les blessures des quatre dragons guériraient mieux près du château de Hiryû, et suggère qu'ils se mettent en route pour Kûto.Au même moment, les terres de la tribu du feu subissent l'invasion des troupes armées de l'empire de Kai, situé au nord…",isbn:"9782811645724",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811645724-M.jpg"},
  {t:"L'habitant de l'infini",a:"Samura Hiroaki",y:"2023",ed:"Editions Casterman",cote:"BD HAB",pub:"Adulte",sup:"Imprimé",d:"Japon, fin du XVIII siècle. Manji, samouraï sans maître et hors-la-loi, est immortel : il porte en lui un mystérieux ver qui guérit ses plus terribles blessures. Pour expier ses crimes, et retrouver peut-être un jour sa mortalité, il s'est juré de sabrer mille scélérats. Sa route croise celle de Rin, jeune fille en quête de vengeance depuis que l'Ittôryû, école de sabre renégate menée par le redoutable et charismatique Anotsu Kagehisa, a tué ses parents. Celle-ci cherche un garde du corps pour l'aider dans cette tâche et Manji accepte de mettre son sabre à son service",isbn:"9782203245532",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203245532-M.jpg"},
  {t:"L'habitant de l'infini",a:"Samura Hiroaki",y:"2023",ed:"Editions Casterman",cote:"",pub:"Adulte",sup:"Imprimé",d:"Pour contrer le danger que représente Manji, Anotsu Kagehisa, le grand maître de l'Ittôryû, décide de faire appel à la plus fine lame de sa connaissance : sa cousine Makie, guerrière insurpassable qu'il admire depuis l'enfance. Toutefois, celle-ci est aussi douée pour le combat que réticente à y prendre part, et préfère encore se prostituer que de tuer des gens. Mais sa confrontation avec Rin et Manji mettra chacun face à ses contradictions et amènera la jeune fille à questionner le sens de sa vengeance",isbn:"9782203257788",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203257788-M.jpg"},
  {t:"Androsace",a:"Choplin Antoine",y:"2026",ed:"La fosse aux ours",cote:"841 CHO",pub:"Adulte",sup:"Imprimé",d:"En route vers la cime, il se souvient et pense à elle là-bas. Elle qui, au même instant, quitte son village d'altitude pour gagner la grande ville. Elle y retrouvera ses compagnes de lutte pour y mener le combat pour la liberté. Androsace (petite fleur qui pousse sur la roche nue en altitude, dans des conditions difficiles) évoque ainsi le croisement de deux trajectoires. Celle d'un homme d'âge mûr, montagnard, cultivant la ressource de son regard sur le monde mais lucide pourtant sur les vertus de cette orpheline contemplation, fût-elle nourrie par les plus hautes exigences et celle d'une jeune femme qui a décidé de se vouer, au péril de sa vie, à un engagement existentiel.",isbn:"9782357071964",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357071964-M.jpg"},
  {t:"Le dernier des Mohicans",a:"Vermot Thibault",y:"2025",ed:"Éditions Sarbacane",cote:"C VER",pub:"Jeunesse",sup:"Imprimé",d:"Publié pour la première fois en 1826, Le Dernier des Mohicans est une vaste épopée mêlant vérité historique et personnages de fiction. Elle raconte l'expédition dans le nord-est américain, alors sauvage, d'un jeune officier anglais escortant deux soeurs vers la garnison de leur père. En chemin, ils devront déjouer pièges et embuscades des Iroquois, alliés des Français contre les Anglais dans les guerres de conquête du continent, de 1740 à 1804, et menés par le terrifiant Magua. Ils pourront en revanche s'appuyer sur Hawkeye, le chasseur blanc élevé par les Delaware alliés des Anglais, et ses deux amis Mohicans, père et fils.",isbn:"9791040805441",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040805441-475x500-1.jpg"},
  {t:"J'aime les comptines du monde entier",a:"Ivanovitch-Lair Albena",y:"2024",ed:"Rue du Monde",cote:"J 841.9 IVA",pub:"Jeunesse",sup:"Imprimé",d:"Partout sur Terre, des comptines rythment les jeux des enfants et, le soir venues, certaines viennent tendrement les endormir.  En voici une quarantaine, venues des quatre coins du monde, en français et dans leur langue d'origine.",isbn:"9782355047503",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355047503-475x500-1.jpg"},
  {t:"On ne verra pas les fleurs le long de la route",a:"Pessan Éric",y:"2026",ed:"Aux forges de Vulcain",cote:"SF PES",pub:"Adulte",sup:"Imprimé",d:"Dans un monde au bord de l'effondrement climatique, les livres n'existent plus. Rares sont les personnes qui savent encore lire. Alors qu'ils parcourent les routes, fuyant incendies et ravages, un homme et une femme commencent à écrire. Pour que les histoires perdurent, ils puisent dans les centaines d'oeuvres littéraires gravées en eux et tissent les mémoires d'un monde en perdition. Eric Pessan mêle avec brio son écriture à plus de mille citations d'oeuvres pour créer une fiction d'anticipation hors-norme, à mi-chemin entre Fahrenheit 451 de Ray Bradbury et les plus grandes créations de l'OuLiPo.",isbn:"9782373053715",extraUrl:"https://covers.openlibrary.org/b/isbn/9782373053715-M.jpg"},
  {t:"La Recette",a:"Verjus Bruno",y:"2026",ed:"Albin Michel",cote:"R VER",pub:"Adulte",sup:"Imprimé",d:"Un conte initiatique et sensuel où la cusine fait corps - et âme - avec notre humanité. La Tribune Dimanche Un premier roman plein de de relief, de surprises, de découvertes. Le Figaro Magazine Une odyssée vibrante d'humanité, où le goût aide à réenchanter le monde Miki, jeune femme cantonaise vivant à Paris, est habitée par une fascination singulière pour la mémoire culinaire française. Lorsqu'elle découvre un carnet ancien signé du mystérieux Henry Cornil, elle se lance dans une quête inattendue : retrouver la trace d'un dessert oublié - la tarte aux pralines roses - et, à travers elle, celle de chefs qui ont fait de la cuisine un art de vivre, de penser, d'aimer. Des bistrots parisiens aux tables étoilées jusqu'à la frugalité lumineuse des villages grecs, Miki avance à la recherche d'un goût juste, d'un geste vrai. Chemin faisant, elle explore ce que signifie réellement \"bien manger\" : un geste d'amour et de beauté. Avec La Recette, Bruno Verjus signe un premier roman sensuel et érudit, où la cuisine devient une langue universelle, capable de dire le temps, la mémoire et le bonheur partagé. Chef doublement étoilé au Michelin, Bruno Verjus a exercé de nombreux métiers à travers le monde, notamment en Asie, avant de s'imposer en autodidacte parmi les grandes voix de la gastronomie mondiale contemporaine. Il est également l'auteur de l'essai L'Art de nourrir (Flammarion).",isbn:"9782226504791",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226504791-M.jpg"},
  {t:"400 fourmis, 3 souris et 1 genou d'éléphant",a:"Taboni Sophie",y:"2026",ed:"Frimousse",cote:"A TAB",pub:"Jeunesse",sup:"Imprimé",d:"Un imagier qui remet tout le monde à sa place ! Vous êtes-vous déjà demandé ce que l'on pourrait mettre dans un livre de 22 cm ? Suivons cette enfant curieuse qui s'est, pour l'occasion, faite toute petite... - Peut-on faire rentrer une fourmi ? - Oui ! Plein de fourmis, même ! - Un poussin ? - Oui ! Ca tient ! Et ainsi de suite, du plus petit au plus grand... Vont-ils tous rentrer dans le livre ? C'est au lecteur de le découvrir !",isbn:"9782383496014",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496014-475x500-1.jpg"},
  {t:"Nom d'un ours !",a:"Viale Marco",y:"2026",ed:"Hélium",cote:"A VIA",pub:"Jeunesse",sup:"Imprimé",d:"Tout le monde est au courant maintenant, les ours sont parfaitement inutiles et ils ne savent vraiment rien faire du tout. Les bonnes manières leurs sont complètement étrangères... En un mot : évitez à tout prix leur compagnie !",isbn:"9782330208165",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330208165-475x500-1.jpg"},
  {t:"Le loup ne viendra pas",a:"Ouyessad Myriam",y:"2021",ed:"Editions L'Elan vert",cote:"A OUY",pub:"Jeunesse",sup:"Imprimé",d:"- Maman, tu es sûre que le loup ne viendra pas ? - Tout à fait sûre, mon lapin. - Mais comment tu peux être aussi sûre ?",isbn:"9782844556462",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782844556462-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Pour remplacer Soo-won, qui souffre de la maladie écarlate, Yona siège à la réunion avec les représentants de l'Empire de Kai. Elle parvient à se faire respecter et à discuter à pied d'égalité avec eux, mais l'un des émissaires décède brutalement, et la jeune princesse se retrouve accusée du meurtre…",isbn:"9782811668167",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811668167-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Après avoir réussi à quitter sa cellule, Mei Niang rencontre Hak mais ce dernier refuse de s'évader avec elle. Elle s'enfuit donc seule mais elle finit par perdre connaissance et est secourue par Yeon. Pendant ce temps, sur les terres du Kai du sud, on s'inquiète de son absence…",isbn:"9782811669652",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811669652-M.jpg"},
  {t:"Farmhand",a:"Guillory Rob",y:"2026",ed:"Delcourt",cote:"BD GUI",pub:"Adulte",sup:"Imprimé",d:"Les expériences génétiques menées par Jedidiah Jenkins et Monica Thorne ont transformé cette dernière en entité maléfique. Elle est dorénavant aux commandes de Freetown, et a construit un pont reliant la Terre à l'Enfer. Ce pont passe par le coeur de la jeune Abby Jenkins... Les membres survivants de la famille Jenkins se préparent à livrer leur dernier combat. Rob Guillory, co-créateur et dessinateur de Tony Chu, Détective Cannibale, apporte ici la touche finale à cette comédie écologique noire où la science est devenue folle !",isbn:"9782413078821",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413078821-M.jpg"},
  {t:"Les Secrets du Chocolat (2)",a:"Harris Joanne",y:"2026",ed:"Cherche midi",cote:"R HAR",pub:"Adulte",sup:"Imprimé",d:"Le retour de Vianne, l'héroïne de Chocolat le roman culte vendu à plus de douze millions d'exemplaires dans le monde. Un beau jour d'été, une jeune femme arrive à Marseille. Elle a vingt et un ans, elle est enceinte. Selon ses faux papiers, il s'agit de Sylvianne Rochas, le dernier d'une longue suite de pseudonymes. Elevée par une mère mystérieuse et fantasque, qui vient juste de mourir à New York, elle n'a plus de famille, pas d'argent, nulle part où aller. A Marseille, elle fait la connaissance de Louis Martin, le propriétaire d'un café-restaurant. Il l'engage comme serveuse et l'initie à la cuisine traditionnelle en lui confiant le précieux livre de recettes de sa défunte femme. Autre rencontre décisive, sur le Vieux-Port : celle de Guy Lacarriére, qui s'appréte à ouvrir une chocolaterie et qui va lui enseigner les vertus et les secrets du chocolat. Si sa nouvelle vie semble prendre un bon départ, Sylvianne, qui se fait désormais appeler Vienne, réalise assez vite qu'autour d'elle beaucoup ont des secrets bien gardés. C'est également son cas : elle dissimule en effet un don singulier grâce auquel elle peut ressentir les émotions profondes et les espoirs cachés de ceux qui l'entourent. Un pouvoir qui peut guérir... ou blesser. La solution serait-elle d'utiliser ses recettes pour mieux le maîtriser ? Joanne Harris partage avec nous quelques mois de la vie de Vienne, l'héroïne de son best-seller Chocolat adapté au cinéma avec Juliette Binoche et Johnny Depp. Revenant sur l'énigme de ses angines, elle nous propose une intrigue passionnante, peuplée de personnages hauts en couleur et agrémentée de recettes qui mettent l'eau à la bouche. Surtout, elle renoue avec cette magie du quotidien, des petites choses de la vie, et en particulier celle de la cuisine gourmande, qui peut permettre de trouver le bonheur en le faisant autour de soi.",isbn:"9782749184951",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749184951-M.jpg"},
  {t:"Shibu et ses émotions",a:"Thomas Tess",y:"2026",ed:"Gallimard",cote:"A OLL",pub:"Jeunesse",sup:"Imprimé",d:"Un album plein d'humour et de poésie qui célèbre l'importance d'exprimer ses émotions et la joie d'être soi-même!<br>Shibu d&#x00E9;borde d'&#x00E9;motions, et il adore les partager ! Il peut se montrer fier ou triste, rempli de col&#x00E8;re ou d'amour... Et bien plus encore ! Mais un doute l'envahit petit &#x00E0; petit : et si ses &#x00E9;motions &#x00E9;taient trop visibles'Apr&#x00E8;s tout, ses amis sont si discrets..",isbn:"9782075236140",extraUrl:"https://products-images.di-static.com/image/base/9782075236140-475x500-1.jpg"},
  {t:"L'amour et la fureur",a:"Suter Martin",y:"2026",ed:"Phébus",cote:"R SUT",pub:"Adulte",sup:"Imprimé",d:"Lasse de se morfondre dans une vie étriquée, Camilla quitte du jour au lendemain son boulot de comptable et son petit ami, Noah, artiste sans le sou qui vit à ses crochets. Elle se dit pourtant encore amoureuse, mais cela ne lui suffit plus. Désespéré, le jeune peintre est prêt à tout pour reconquérir sa muse. Alors lorsqu'il rencontre Betty, la veuve sexagénaire d'un homme d'affaires poussé dans la tombe par son associé, Noah accepte la mission de tueur à gages qu'elle lui propose pour obtenir vengeance, moyennant une juteuse rémunération. Mais l'amour et la fureur ont-ils jamais fait bon ménage ? Maître du trompe-l'oeil, des ellipses savamment distillées et des dialogues à double fond, Martin Suter nous offre un suspense acide et jouissif, où la vérité se joue de nous jusqu'à la dernière ligne. Une étourdissante réflexion sur les jeux de pouvoir, les dynamiques de couple, les mensonges et la trahison.",isbn:"9782752915283",extraUrl:"https://covers.openlibrary.org/b/isbn/9782752915283-M.jpg"},
  {t:"Le Diable, tout le temps",a:"Pollock Donald Ray",y:"2026",ed:"Albin Michel",cote:"R POL",pub:"Adulte",sup:"Imprimé",d:"L'un des plus grands chefs-d'oeuvre américains de ces 30 dernières années. Le Figaro Magazine Lisez ou relisez d'urgence Donald Ray Pollock. Le Monde Traduit de l'américain par Christophe Mercier \"S'il s'agit bien d'une fiction, si Pollock reconnaît avoir forcé le trait, il n'y en a pas moins une part de vérité sur la nature humaine et - n'en déplaise à l'auteur - une part d'amour aux êtres qui peuplent ce territoire\". Marie Vingtras (extrait de la préface) Sacré meilleur roman de l'année par le magazine Lire, Grand prix de la littérature policière, Le Diable, tout le temps est devenu un livre culte. De l'Ohio à la Virginie-Occidentale, de la fin de la Seconde Guerre mondiale aux années 1960, il est question de pauvres diables dont les trajectoires s'entrechoquent : un rescapé de l'enfer du Pacifique, traumatisé et prêt à tout pour sauver sa femme, quitte à délaisser son fils ; un couple sordide qui piège les auto-stoppeurs ; un prédicateur et un musicien en fauteuil roulant qui errent de ville en ville, fuyant la loi ; un shérif corrompu et un pasteur au comportement déviant... L'écriture à vif de Donald Ray Pollock fait surgir un univers aussi puissant que ceux de Flannery O'Connor, Jim Thompson ou Cormac McCarthy.",isbn:"9782226507013",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226507013-M.jpg"},
  {t:"Ne pas être le prochain",a:"Massé Philippe",y:"2025",ed:"Spinelle éditions",cote:"R MAS",pub:"Adulte",sup:"Imprimé",d:"Arcachon, début juillet. Les serviettes s'étalent, les glaces fondent trop vite, les vacanciers savourent la douceur de vivre... Mais sous le soleil éclatant, le Sud Bassin s'assombrit soudain : un ancien maire meurt dans d'étranges circonstances, un yacht explose en mer, et bientôt la peur s'installe. La ville se replie sur elle-même, l'économie vacille... et l'ombre d'un tueur méthodique plane. Sans témoins, sans mobile apparent, \" Abstrus \" sévit. Il ne laisse aucune trace et ne commet aucune erreur. A peine arrivée à Arcachon pour un job d'été au Sud-Ouest, Emmanuelle Lavigne, jeune journaliste au tempérament fougueux, qui espérait des articles anodins sur les marées, les associations locales et la douceur de vivre du Bassin, se laisse rapidement happer par une enquête où s'entremêlent secrets d'affaires, manipulations politiques et règlements de comptes. Aux côtés d'un commissaire obstiné, et malgré les avertissements, elle s'enfonce dans les zones d'ombre d'une ville qui ne dort qu'en apparence. Dans cette atmosphère de faux-semblants et de menaces, une certitude s'impose : nul ne sait qui sera le prochain...",isbn:"9782386512957",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386512957-M.jpg"},
  {t:"Odilon",a:"Davenier Christine",y:"2026",ed:"Bayard éditions",cote:"A DAV",pub:"Jeunesse",sup:"Imprimé",d:"Un envol plein de tendresse et de malice Odilon est un petit papillon adorable... mais tétanisé à l'idée de quitter le nid. Contrairement à ses frères et soeurs qui volent, il préfère écouter leurs histoires de là-haut, bien au chaud. Mais ça, c'était avant qu'Isabelle, une coccinelle intrépide, débarque pour jouer. Elle l'entraîne dans un jeu inattendu et, par accident (ou par magie ? ), Odilon tombe... pour mieux s'envoler ! Une première aventure remplie de douceur, de rires et de courage. Un petit héros auquel les enfants peuvent s'identifier Ce joli récit aborde avec tendresse la peur de se lancer, ce moment où l'on hésite encore avant de grandir. Les jeunes lecteurs se reconnaîtront dans Odilon et sa crainte de l'inconnu, tandis que les parents apprécieront la manière bienveillante dont l'histoire montre que chacun avance à son rythme. Parfait pour aborder la confiance en soi, les premiers pas (ou vols ! ) et l'amitié. Une illustratrice reconnue et une collection craquante Les illustrations de Christine Davenier - déjà adorée pour la série \"Minusculette\" (à l'Ecole des loisirs) - apportent une chaleur et un charme irrésistibles à cette histoire. Elle s'inscrit dans la collection Tout Carton Tout Mignon, des livres solides et joyeux, spécialement pensés pour les petites mains... et les grands sourires.",isbn:"9791036375293",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036375293-475x500-1.jpg"},
  {t:"Des équations personnelles",a:"Serfaty Sylvia",y:"2026",ed:"Flammarion",cote:"510 SER",pub:"Adulte",sup:"Imprimé",d:"Et si les mathématiques étaient le lieu de la vérité et de la beauté par excellence ? C'était l'hypothèse de l'auteure au sortir de ses études. A l'âge où trop d'entre nous perdent le contact avec les maths, Sylvia Serfaty s'engage dans une carrière internationale. Elle nous fait entrer ici dans l'esprit d'une brillante mathématicienne et nous invite à la suivre. Qu'est-ce que l'abstraction ? \"J'écris surtout pour ceux qui ne font pas de mathématiques\", dit-elle. Guidée par son expérience personnelle, femme dans un monde très masculin, Sylvia Serfaty nous livre un témoignage intime et sensible sur les mathématiques. Elle fait surgir ce qui l'amuse, l'apaise, la réjouit et la fascine : le plaisir de la démonstration, la découverte de la preuve. Elle raconte le quotidien, la place de l'intuition et de la créativité, les déceptions et les frustrations, les errements comme les illuminations. Elle rend aussi hommage aux grands maîtres du passé, sans oublier les figures d'aujourd'hui. Quel avenir pour l'humain dans une discipline bouleversée par l'intelligence artificielle ? Garderons-nous la joie de chercher par nous-mêmes ?",isbn:"9782080145871",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080145871-M.jpg"},
  {t:"La Cafetière et autres contes fantastiques",a:"Gautier Théophile",y:"2000",ed:"Hachette",cote:"843 GAU",pub:"Adulte",sup:"Imprimé",d:"Peut-on tomber amoureux d'une cafetière ? Ou demander la main d'une momie vieille de trente siècles ? Un acteur risque-t-il d'être emporté par le diable ? Telles sont quelques-unes des histoires étranges imaginées par Théophile Gautier, qui donne vie à des personnages évadés de leurs tableaux ou entraîne son héros dans d'incroyables conversations avec des divinités échappées d'antiques tapisseries. Souvent burlesques, parodiques ou ironiques, ces contes fantastiques sont aussi une étonnante galerie de symboles et d'images romantiques.",isbn:"9782011679512",extraUrl:"https://covers.openlibrary.org/b/isbn/9782011679512-M.jpg"},
  {t:"Louise Michel",a:"Thomas Édith",y:"2026",ed:"Gallimard",cote:"B MIC",pub:"Adulte",sup:"Imprimé",d:"Archiviste paléographe, formée par l'Ecole des chartes, Edith Thomas s'est fait connaître d'abord comme auteure de romans. Rapidement engagée dans la presse de gauche pendant la guerre d'Espagne, membre active de la Résistance, au sein de laquelle elle fonde, avec Jean Paulhan et Claude Morgan, le Comité national des écrivains, elle adhère au Parti communiste en 1942 ; elle le quittera en 1949. Historienne et féministe, elle publie Les Femmes de 1848, avant d'enquêter sur le rôle des révoltées pendant la Commune. D'où son livre fameux Les \"Pétroleuses\" (1963). L'une d'elles, qui assume carrément ce terme injurieux infligé par les Versaillais, était Louise Michel, devenue une figure emblématique de l'insurrection parisienne de 1871. Dans cette biographie célèbre, jamais remplacée, Edith Thomas retrace la vie de cette femme hors du commun, avec sympathie mais aussi avec la rigueur qu'impose le métier d'historien, servie par une écriture de romancière. Comment la modeste institutrice Louise, qui s'essaie à la poésie et entretient une correspondance affectueuse avec Victor Hugo, est-elle devenue une combattante de la Commune ? Comment, après sa déportation en Nouvelle-Calédonie, s'est-elle lancée dans une infatigable campagne en faveur du socialisme anarchiste ? Edith Thomas raconte cette vie exaltée dans un ouvrage pionnier à tant d'égards. Paru en 1971, l'année du centenaire de la Commune, il était posthume : Edith Thomas l'avait achevé juste avant de mourir. Le voici réédité avec une préface inédite de Michelle Perrot.",isbn:"9782073140272",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073140272-M.jpg"},
