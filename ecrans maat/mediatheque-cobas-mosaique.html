const FLIP=5000, POPUP=60000;

function toASIN(isbn13){
  if(!isbn13||!isbn13.startsWith('978')||isbn13.length!==13) return null;
  const d=isbn13.slice(3,12);
  let s=0; for(let i=0;i<9;i++) s+=parseInt(d[i])*(10-i);
  const c=(11-(s%11))%11;
  return d+(c===10?'X':String(c));
}

function buildUrls(doc){
  const urls=[];
  if(doc.extraUrl) urls.push(doc.extraUrl);
  const asin=toASIN(doc.isbn);
  if(asin){
    urls.push(`https://images-na.ssl-images-amazon.com/images/P/${asin}.01.LZZZZZZZ.jpg`);
    urls.push(`https://m.media-amazon.com/images/P/${asin}.01._SX300_.jpg`);
    urls.push(`https://images-eu.ssl-images-amazon.com/images/P/${asin}.01._SX300_.jpg`);
  }
  if(doc.isbn&&doc.isbn.startsWith('978'))
    urls.push(`https://covers.openlibrary.org/b/isbn/${doc.isbn}-L.jpg`);
  return urls;
}

// Essaie chaque URL et renvoie une Promise résolue avec l'URL valide, ou null si aucune ne fonctionne
function tryUrlsAsync(urls){
  return new Promise(resolve=>{
    function attempt(list){
      if(!list.length){ resolve(null); return; }
      const [url,...rest]=list;
      const img=new Image();
      img.onload=()=>{
        (img.naturalWidth>10 && img.naturalHeight>img.naturalWidth*0.8) ? resolve(url) : attempt(rest);
      };
      img.onerror=()=>attempt(rest);
      img.src=url;
    }
    attempt(urls);
  });
}

const BOOKS=[
  {t:"L'Homme qui trahit Hitler",a:"",y:"DL 2026",ed:"Glénat",cote:"BD RIC",pub:"Adulte",sup:"Imprimé",d:"Un héros ordinaire Après le succès des Mystères de la République, Philippe Richelle revient avec une nouvelle série-concept consacrée à l'émergence des services secrets au XXe siècle. Chaque tome explore une opération menée dans l'ombre, le plus souvent au coeur de conflits majeurs : Seconde Guerre mondiale, guerre froide, après-guerre froide ou encore conflit israélo-arabe. Avec un réalisme saisissant, cette série de polars historiques, tous autoconclusifs, dévoile des récits passionnants et met en lumière des personnages hors normes, prêts à tout, souvent au mépris des règles, pour parvenir à leurs fins. Chaque album est illustré par un dessinateur différent et peut être lu indépendamment. 1931. Dans une Allemagne ruinée par la guerre, Hans-Thilo Schmidt, ancien chimiste accepte un poste modeste au ministère de la Défense sans savoir qu'il va bientôt travailler avec une machine révolutionnaire. \" Enigma \" sert à chiffrer des messages secrets. Alors qu'Enigma devient l'outil stratégique numéro 1 pour le régime nazi, ce discret employé entame une double vie et n'hésite pas à transmettre des informations capitales à l'armée française sous le nom de code Asche ! Entre manipulations, trahisons et jeux d'influence, ce père de famille en apparence fidèle au régime, va devenir la pièce maîtresse d'un affrontement souterrain où le moindre faux pas peut se révéler fatal... Philippe Richelle et Jorge Miguel nous entrainent dans une course contre la montre pleine de rebondissements. Tiré de faits réels, ce premier tomenous offre une plongée haletante dans les coulisses de l'espionnage durant la Seconde guerre mondiale. Dans un récit mêlant trahison et tension historique, ce polar captivant retrace le destin de Hans-Thilo Schmidt, considéré aujourd'hui comme l'un des plus grands espions du XXe siècle.",isbn:"9782344063675",extraUrl:"https://couverture.geobib.fr/api/v1/9782344063675/M"},
  {t:"La Boutique aux horreurs",a:"",y:"DL 2026",ed:"Glénat",cote:"BD RIC",pub:"Adulte",sup:"Imprimé",d:"Soumission chimique : retour sur les expériences top secrètes du gouvernement américain durant la guerre froide Après le succès des Mystères de la République, Philippe Richelle revient avec une nouvelle série-concept consacrée à l'émergence des services secrets au XXe siècle. Chaque tome explore une opération menée dans l'ombre, le plus souvent au coeur conflits majeurs : Seconde Guerre mondiale, Guerre froide, après-Guerre froide ou encore conflit israélo-arabe. Avec un réalisme saisissant, cette série de polars historiques, tous autoconclusifs, dévoile des récits passionnants et met en lumière des personnages hors normes, prêts à tout, souvent au mépris des règles, pour parvenir à leurs fins. Chaque album est illustré par un dessinateur différent et peut être lu indépendamment. 1953. Etats-Unis. Bill Barney a toujours été un jeune homme soucieux de servir son pays. De retour de la guerre de Corée, son idéal patriotique le pousse à devenir agent de la CIA. Mais il est loin de se douter que sa mission va le plonger dans un univers cauchemardesque... Car MK-Ultra, l'obscur programme auquel il va participer, utilise une nouvelle méthode : la soumission chimique ! A travers ces recherches top secrètes, le gouvernement américain n'a qu'un objectif : découvrir comment modifier l'esprit humain et en prendre le contrôle. En assistant le docteur Gottlieb, cheville ouvrière du Programme, Barney va bientôt comprendre que tous les moyens sont bons pour parvenir à ses fins : thérapie du sommeil, médicaments, LSD, électrochocs... Plus Gottlieb multiplie les expériences, plus il détruit la vie de ses \"cobayes\", et plus Barney sombre dans une spirale infernale, impuissant face à l'horreur... Avec ce thriller psychologique inspiré de faits réels, Philippe Richelle et Steven Lejeune nous plongent en pleine guerre froide pour un récit choc où la tension croissante est poussée à son paroxysme. Le deixième tome de la série Guerres secrètes met en lumière une page sombre de l'Histoire des Etats-Unis en revenant sur les expérimentations humaines perpétrées en secret par le gouvernement américain entre 1950 et 1960 notamment en Corée et au Viêtnam.",isbn:"9782344063699",extraUrl:"https://couverture.geobib.fr/api/v1/9782344063699/M"},
  {t:"Ann Bonny",a:"Bonnet",y:"2026",ed:"Glénat (Grenoble, Isère, France; 1969-...)",cote:"BD BON",pub:"Adulte",sup:"Imprimé",d:"L’histoire vraie de la plus grande femme pirate de l’Histoire !  Après leur fuite de Nassau, rien ne peut arrêter les amants terribles : Ann Bonny et John Rackham écument les Caraïbes à bord du William. Leurs prises sont spectaculaires. Après une halte à Cuba où Ann donne naissance à un enfant de la piraterie qui ne connaitra jamais sa mère, elle rejoint Rackham. Mais cette fois les corsaires de Woodes Rogers sont à leurs trousses et le mari d’Ann a mis sa tête à prix pour quiconque la ramènerait vivante à Nassau. Menacée de toutes parts, Ann s’attend à tout sauf à croiser le chemin d’une autre femme, une pirate comme elle. Elle s’appelle Mary alias Mark Read, elle aussi grimée en homme. Défiant le code des pirates, les deux femmes entament une relation passionnelle sous l’œil de Rackham. Il concède à Ann cette aventure mais à une condition : aucun homme sur le navire ne devra savoir ce qui se trame. Mais les secrets ne durent jamais longtemps en mer… Entre jalousies et rivalités le trio continue de s’adonner aux pillages bien que l’étau se resserre. Le gouverneur Woodes Rogers qui s’est donné pour mission d’éradiquer la piraterie sous toutes ses formes ne compte pas s’arrêter là… Jusqu’à quand Ann poursuivra-t-elle sa course folle sous le feu des canons ? Combien de temps lui reste-t-il avant que son monde ne s’effondre ? Habitué des fresques maritimes, Franck Bonnet nous entraîne dans une aventure épique à travers cet ambitieux diptyque dans lequel il revient sur l’histoire vraie de la plus grande femme pirate. Entre passions, dangers et affrontements sanglants, ce second tome qui clôt le récit, montre le vrai mode de vie des pirates, loin de l'imagerie vulgarisée par le cinéma, sublimé par le dessin et la connaissance de l'architecture navale de Franck Bonnet, ici au sommet de son art.",isbn:"9782344064030",extraUrl:"https://couverture.geobib.fr/api/v1/9782344064030/M"},
  {t:"Haley",a:"Oda",y:"DL 2026",ed:"Glénat",cote:"BD ONE",pub:"Jeune",sup:"Imprimé",d:"Se hisser sur les épaules des géants ! Maintenant qu'elle a débarqué sur Erbaf, Robin peut enfin fêter ses retrouvailles tant attendues avec Sauro. Mais alors que de nouvelles aventures débutent dans cette contrée inconnue, des personnages pour le moins inquiétants font leur apparition. Faut-il y voir le présage d'une tempête ? ! Les aventures de Luffy à la poursuite du One Piece continuent !",isbn:"9782344068922",extraUrl:"https://couverture.geobib.fr/api/v1/9782344068922/M"},
  {t:"Bloom",a:"Mikami",y:"DL 2026",ed:"Nobi Nobi",cote:"BD BLO",pub:"Jeune",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n'accueillir que des cancres, est tombé amoureux de Kaoruko Waguri, qui fréquente un établissement pour fi lles de bonne famille, Kikyô. Alors qu'ils profi tent de leur première sortie en amoureux depuis la fi n des grandes vacances, ils sont aperçus par quatre fi lles de Kikyô. Inquiètes pour leur camarade, les lycéennes se montrent fortement opposées à cette relation. Mais grâce à la présence de Madoka Yuzuhara, une jeune fi lle qui ne porte aucun préjugé aux élèves de Chidori, elles décident tout de même de rencontrer Rintarô... Le fossé profondément ancré entre les deux écoles serait-il sur le point d'être comblé ? Roméo et Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions !",isbn:"9782384967070",extraUrl:"https://couverture.geobib.fr/api/v1/9782384967070/M"},
  {t:"A sign of affection",a:"Morishita",y:"DL 2026",ed:"Akata",cote:"BD SIG",pub:"Jeune",sup:"Imprimé",d:"Charmée par l'affection qu'Itsuomi lui porte de jour en jour, Yuki prend la décision de concrétiser leur amour. Toujours plus complice, le couple se prépare même à partir en voyage à l'étranger. Toutefois, après avoir appris que Shin et Ema sortaient ensemble dans l'optique de se marier, un doute émerge dans l'esprit de Yuki : quelle place son amoureux lui réserve-t-il dans son avenir ? A Sign of Affection décrit avec pudeur et simplicité l'histoire d'amour entre une jeune femme sourde et un grand voyageur. A n'en pas douter, les personnages de ce manga ne manqueront pas de vous émouvoir !",isbn:"9782385692964",extraUrl:"https://couverture.geobib.fr/api/v1/9782385692964/M"},
  {t:"La voie du tablier",a:"Oono",y:"DL 2026",ed:"Kana",cote:"BD VOI",pub:"Jeune",sup:"Imprimé",d:"Ne sous-estimez jamais un homme au foyer ! Tatsu doit accompagner son beau-père chez le vétérinaire pour faire vacciner son chien. Mais ce canidé a un drôle de défaut : il se met à trembler de tout son corps rien qu'en entendant les mots \"vaccin\", \"piqûres\" et \"piquer\"... Avec tous ces \"adversaires\" qui se succèdent, même le plus coriace des hommes au foyer en bave ! Voici le seizième volume de ce manga comique, qui raconte la vie d'un ancien yakuza à la maison !",isbn:"9782505144038",extraUrl:"https://couverture.geobib.fr/api/v1/9782505144038/M"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito",y:"DL 2024",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeune",sup:"Imprimé",d:"Le monde est anéanti... Partons le visiter à moto ! Après leur escale à Karuizawa, Yôko et Airi sont reparties en direction de Gunma. Sur leur chemin se trouve le fameux Mont Asama, un volcan encore actif et entrant régulièrement en éruption... et Yôko s'est soudain effondrée en respirant les gaz toxiques de ce dernier ! C'est alors qu'est apparu un jeune homme qui va leur venir en aide et les conduire jusqu'aux sources chaudes de Kusatsu...",isbn:"9791041106882",extraUrl:"https://couverture.geobib.fr/api/v1/9791041106882/M"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito",y:"DL 2025",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeune",sup:"Imprimé",d:"Nos deux motardes décident de faire une halte à l'abri qui a été le point de départ de leur périple. Une occasion pour elles de se remémorer le bon vieux temps. Elles reprendront ensuite la route vers la région du Tôhoku, au nord de l'île principale. Entre excavation de fossiles à Iwaki et pêche miraculeuse dans le lac Inawashiro, leur trépidant voyage les conduira jusqu'à Nagaoka, dans le département de Niigata.",isbn:"9791041111732",extraUrl:"https://couverture.geobib.fr/api/v1/9791041111732/M"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito",y:"DL 2025",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeune",sup:"Imprimé",d:"Le monde est anéanti... Partons le visiter à moto ! Un avion de chasse a fait irruption dans le ciel de Nagaoka. Désireuses de faire connaissance avec son mystérieux pilote, Yôko et Airi entreprennent de se rendre à la base aérienne de Misawa dans le département d'Aomori, où l'avion est censé atterrir. Elles en profiteront pour visiter la région du Tôhoku, en faisant halte successivement à Yamagata, Sendai, Morioka et Akita.",isbn:"9791041116263",extraUrl:"https://couverture.geobib.fr/api/v1/9791041116263/M"},
  {t:"Spy X Family",a:"Endo",y:"DL 2026",ed:"Kurokawa",cote:"BD SPY",pub:"Jeune",sup:"Imprimé",d:"Sauvez le monde avec l'élite des agents (très) spéciaux : la famille Forger ! Une comédie d'espionnage pétillante ! Loid a l'opportunité de se renseigner lors d'une consultation de Melinda. Quels secrets de Donovan Desmond lui seront dévoilés ? A la rentrée scolaire, Anya se retrouve dans des classes différentes en fonction de son niveau. Cela l'amène à être impliquée dans un conflit international !",isbn:"9791042021030",extraUrl:"https://couverture.geobib.fr/api/v1/9791042021030/M"},
  {t:"Blue Lock",a:"",y:"DL 2025",ed:"Pika édition",cote:"BD BLU",pub:"Jeune",sup:"Imprimé",d:"Grâce à sa nouvelle arme d'étonante, Isagi permet au club allemand d'égaliser ! Face à son rival qui se retrouve sous les projecteurs du monde entier, Kaiser, acculé, joue le tout pour le tout avec une technique encore incomplète, dans l'espoir de régler ses comptes avec le passé ! Boostés par cette tension, les autres individualistes affamés de buts se battent, eux aussi, pour définir la ligne à franchir afin de briller à leur tour. Qui parviendra à atteindre une nouvelle dimension dans sa progression transcendantale faite de destruction et de reconstruction ? !",isbn:"9791043303326",extraUrl:"https://couverture.geobib.fr/api/v1/9791043303326/M"},
  {t:"Blue Lock",a:"",y:"DL 2026",ed:"Pika édition",cote:"BD BLU",pub:"Jeune",sup:"Imprimé",d:"La rencontre explosive du football et du \"baffle royale\". Le match est relancé par le but égalisateur phénoménal de Rin Itoshi ! Portée par une série de changements fulgurants, la tension atteint son paroxysme sur le terrain. Sous l'effet de cette effervescence, Loki, encore resté sur le banc jusqu'ici, et Noa annoncent brusquement leur entrée en jeu ! Au coeur du tumulte, Isagi plonge dans une analyse acharnée, à la recherche d'une stratégie décisive... Le dénouement approche, et cette ultime bataille s'apprête à déclencher une onde de choc capable de bouleverser le monde !",isbn:"9791043306068",extraUrl:"https://couverture.geobib.fr/api/v1/9791043306068/M"},
  {t:"Blue Lock",a:"",y:"DL 2026",ed:"Pika édition",cote:"BD BLU",pub:"Jeune",sup:"Imprimé",d:"Pour s'emparer du dernier but, Isagi et Kaiser unissent leurs forces, rallumant l'envie de vaincre dans tout le club allemand ! La formation française, loin de se laisser abattre, resserre également ses rangs et rend coup pour coup, transformant l'affrontement en un duel d'une intensité sans précédent ! Au coeur de cette arène en ébullition, Ness, laissé un peu de côté, cherche désespérément à retrouver Kaiser et à découvrir la voie de sa propre renaissance. Dans ce brasier où s'enchaînent les rebondissements imprévisibles, quelle équipe finira par obtenir la victoire absolue ? ! Soyez témoins du dénouement le plus imprévisible de l'histoire !",isbn:"9791043306471",extraUrl:"https://couverture.geobib.fr/api/v1/9791043306471/M"},
  {t:"L'Atelier des Sorciers",a:"Shirahama",y:"DL 2026",ed:"Pika édition",cote:"BD ATE",pub:"Jeune",sup:"Imprimé",d:"Coco et les sorciers ont établi un plan pour stopper la sangsue-rideau qui déferle sur la ville. Malheureusement, l'opération semble vouée à l'échec à cause des intempéries. Mais Coco a une idée et elle se précipite vers le danger avec Agathe pour tenter de régler la situation... Le plan va-t-il être finalement couronné de succès ?",isbn:"9791043307751",extraUrl:"https://couverture.geobib.fr/api/v1/9791043307751/M"},
  {t:"Prince du Tennis",a:"Konomi",y:"DL 2010",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Nous voici à la finale du championnat de Tokyo. Seigaku se mesure à la redoutable équipe de Yamabuki. Grâce à sa victoire lors du second double, Seigaku rattrape son retard. Les deux équipes sont à égalité avec, chacune, une victoire et une défaite. Seigaku nourrit de grands espoirs concernant ses joueurs en simple mais Momo se fait malmener par Sengoku, dit \"le renard\". Ryôma est, quant à lui, sur le point de rencontrer l'imposant Akutsu...!",isbn:"9782505000358",extraUrl:"https://couverture.geobib.fr/api/v1/9782505000358/M"},
  {t:"Prince du Tennis",a:"Konomi",y:"DL 2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"La finale du championnat de Tokyo a fait monter la pression d'un cran !! Avec deux victoires et une seule défaite, Seigaku est à deux doigts du triomphe mais encore faut-il que Ryôma gagne son match ! Face au colossal Akutsu Jin, Ryôma, tantôt dominé, tantôt en position de force, devra grandir et améliorer son jeu s'il veut sortir vainqueur de ce match ! Le courage dont il fait preuve suffira-t-il ?!",isbn:"9782505000969",extraUrl:"https://couverture.geobib.fr/api/v1/9782505000969/M"},
  {t:"Prince du Tennis",a:"Konomi",y:"DL 2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Momoshiro n’a pas donné signe de vie depuis trois jours et personne au club de tennis ne sait où il se trouve. Même s’il ne fait plus partie de l’équipe des titulaires, c’est inquiétant... Par ailleurs, Ôishi se fâche avec Kikumaru, son coéquipier, lui reprochant la légèreté de ses paroles et son sens de l’humour déplacé. Serait-ce la faille qui fera voler en éclat la légendaire golden pair ?! Cela tombe vraiment mal, vu que la force de Seigaku réside dans l’unité de ses membres... Une étrange atmosphère plane sur nos héros !!",isbn:"9782505001010",extraUrl:"https://couverture.geobib.fr/api/v1/9782505001010/M"},
  {t:"Prince du Tennis",a:"Konomi",y:"DL 2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Le petit accident d’Ôishi a forcé Seigaku à improviser : Kikumaru se retrouve en double n° 2 avec Momoshiro. Hyôtei profite de la situation pour prendre le dessus. Nos deux joueurs sont en bien mauvaise posture et Kikumaru est prêt à renoncer. Par chance, les paroles d’Ôishi résonnent dans son cœur et commencent à devenir réalité. Parviendront-ils à s’en sortir ?!",isbn:"9782505001560",extraUrl:"https://couverture.geobib.fr/api/v1/9782505001560/M"},
  {t:"Prince du Tennis",a:"Konomi",y:"DL 2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Shishido et Ootori, de Hyôtei, mènent Inui et Kaidô par le bout du nez. En fait, il s’agit d’une stratégie qu’Inui a mise au point afin de récolter le plus d’informations possible sur ses adversaires. Heureusement, au bout de quelques minutes de jeu, il finit par trouver ce qu’il cherchait ! Mais pourront-ils remonter la pente ? Le boomerang snake de Kaidô sera-t-il à la hauteur ?!…",isbn:"9782505001706",extraUrl:"https://couverture.geobib.fr/api/v1/9782505001706/M"},
  {t:"Prince du Tennis",a:"Konomi",y:"DL 2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Grâce à son talent, qui n’est plus à prouver, et à sa technique de la triple contre-attaque, Fuji passe à l’offensive avec un nouveau coup fatal ! Quel est donc ce coup inconnu jusqu’alors et qu’il appelle \"la baleine blanche\" ?! Le mystérieux Fuji montre enfin son vrai potentiel et provoque une véritable hystérie du côté des spectateurs ! Toutefois, le match le plus attendu reste celui qui opposera les capitaines des deux équipes : Tezuka et Atobe !",isbn:"9782505001959",extraUrl:"https://couverture.geobib.fr/api/v1/9782505001959/M"},
  {t:"Mashle",a:"Komoto",y:"DL 2023",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeune",sup:"Imprimé",d:"Innocent Zero poursuit Mash après lui avoir arraché le coeur, mais est arrêté dans son élan par Domina. Ce dernier, qui avait sombré dans de la lave en fusion, resurgit pour barrer le passage à son redoutable père, au nom de l'amitié qui le lie à son ancien adversaire ! Pendant ce temps, les camarades de Mash, prêts à défier la mort, se démènent pour l'emmener auprès de Meliadoul. Réussiront-ils à atteindre leur destination malgré leurs blessures et les ennemis lancés à leurs trousses ? De son côté, Mash se retrouve à errer dans les limbes, où il fait une rencontre des plus incongrues...",isbn:"9782820346506",extraUrl:"https://couverture.geobib.fr/api/v1/9782820346506/M"},
  {t:"Komi cherche ses mots",a:"Oda",y:"DL 2026",ed:"Pika édition",cote:"BD KOM",pub:"Jeune",sup:"Imprimé",d:"Komi et Tadano sortent ensemble. L'un comme l'autre n'ayant aucune expérience, ils sont souvent malhabiles. Komi aimerait lui tenir la main mais n'arrive pas à se faire comprendre sans l'exprimer oralement. A part ça, entre la remise des diplômes et la session shopping de Komi, les uns et les autres ne manquent pas d'occasions de briller...",isbn:"9791043305269",extraUrl:"https://couverture.geobib.fr/api/v1/9791043305269/M"},
  {t:"Komi cherche ses mots",a:"Oda",y:"DL 2026",ed:"Pika édition",cote:"BD KOM",pub:"Jeune",sup:"Imprimé",d:"Komi est désormais en terminale ! Répartie dans la même classe que Tadano et Najimi, elle est néanmoins séparée de ses amis de la première 1, et notamment de Manbagi. Une petite inquiétude se fait sentir... alors que commence une guerre organisée entre les différentes classes du lycée ! Seconde contre première contre terminale, Komi gagnera-t-elle appuyée de nouveaux camarades toujours aussi déjantés ? !",isbn:"9791043306037",extraUrl:"https://couverture.geobib.fr/api/v1/9791043306037/M"},
  {t:"L'archéologie",a:"Beaumont",y:"impr. 2013",ed:"Fleurus",cote:"J 930.1 BEAU",pub:"Jeune",sup:"Imprimé",d:"11 doubles pages pour mieux connaître ce métier passionnant : la découverte d'un site, les étapes d'une fouille, l'archéologie sous-marine, le travail en laboratoire, les méthodes de datation et de reconstitution des vestiges, comment transmettre le passé?",isbn:"9782215115700",extraUrl:"https://products-images.di-static.com/image/base/9782215115700-120x160-1.jpg"},
  {t:"Les minéraux",a:"Beaumont",y:"impr. 2013",ed:"Fleurus",cote:"J 549 BEAU",pub:"Jeune",sup:"Imprimé",d:"Comment se forme les minéraux ? où les trouve-t-on ? En quoi sont-ils importants dans notre vie quotidienne ? Un livre pour tout savoir sur ce sujet qui captive les enfants. De belles doubles pages sur l'or, les diamants, les pierres précieuses et les minéraux extraordinaires, avec des précisions sur leur mode d'extraction et des histoires sur les pierres.",isbn:"9782215116219",extraUrl:"https://products-images.di-static.com/image/base/9782215116219-120x160-1.jpg"},
  {t:"Arnaque à Central Park",a:"Payet",y:"DL 2016",ed:"Milan",cote:"J PAY",pub:"Jeune",sup:"Imprimé",d:"Prénom : Scarlett. Signe distinctif : détective en herbe. Particularité son chat, Watson, l'aide dans ses enquêtes... Petit détail : le plus malin des deux n'est pas celui qu'on croit !  En voyage à New York, Scarlett achète une petite souris en origami sur un stand de Central Park. Voilà qui fera un joli souvenir pour Watson, resté de l'autre côté de l'Atlantique. Mais la souris en papier disparait et Scarlett se rend compte qu'elle avait bien plus de valeur qu'il n'y paraît...",isbn:"9782745976758",extraUrl:"https://products-images.di-static.com/image/base/9782745976758-475x500-1.jpg"},
  {t:"Les Schtroumpfs",a:"Peyo",y:"DL 2023",ed:"Hachette",cote:"LJ PEY",pub:"Jeune",sup:"Imprimé",d:"Le Grand Schtroumpf, le Schtroumpf à Lunettes, la Schtroumpfette... Retrouve tes personnages préférés et de nombreux objets dans chacune des scènes schtroumpfantes de ce livre. A toi de jouer !",isbn:"9782017246787",extraUrl:"https://products-images.di-static.com/image/base/9782017246787-475x500-1.jpg"},
  {t:"La mission de Péril",a:"Sutherland",y:"DL 2025",ed:"Gallimard Jeunesse",cote:"A SUT",pub:"Jeune",sup:"Imprimé",d:"La cruelle reine Scarlet veut tuer Argil et les autres Dragonnets du Destin. Entre la reine déchue et son seul ami, qui Péril va-t-elle choisir, elle qui est connue pour prendre toujours les pires décisions ?",isbn:"9782075221061",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782075221061-475x500-1.jpg"},
  {t:"La sorcière aux yeux de lune",a:"Dahman",y:"DL 2025",ed:"Gallimard",cote:"C DAH",pub:"Jeune",sup:"Imprimé",d:"Ses yeux peuvent voir la vérité même dans les âmes les plus secrètes. Découvrez le nouveau chef-d'oeuvre des créateurs du Talisman du loup et Leina et le Seigneur des Amanites, célébrant la sincérité et le pouvoir de l'amitié.",isbn:"9782075228732",extraUrl:"https://products-images.di-static.com/image/base/9782075228732-475x500-1.jpg"},
  {t:"Cendrillon",a:"Dahl",y:"DL 2025",ed:"Gallimard",cote:"C DAH",pub:"Jeune",sup:"Imprimé",d:"Vous pensez connaître cette histoire ? Vous vous trompez... Cendrillon veut aller au bal ! Entendant ses pleurs, sa marraine la bonne fée apparaît et hop ! D'un coup de baguette magie, Cendrillon est prête à se rendre au palais et... vous connaissez la suite, à rencontrer son prince charmant. Mais les apparences sont trompeuses, et ce prince-là n'est peut-être pas aussi parfait qu'il n'y paraît...",isbn:"9782075228749",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075228749-475x500-1.jpg"},
  {t:"Les pieds de Papa",a:"Jadoul",y:"DL 2026",ed:"L'École des loisirs",cote:"A JAD",pub:"Jeune",sup:"Imprimé",d:"Mes deux petits pieds sur le grand pied de Papa, je suis prêt pour l'aventure ! Tagada, tagada, grands pieds cheval ! A l'eau, grands pieds bateau ! On rentre à la maison, grands pieds avion ! Et quand Papa n'est pas là, les grandes bottes, c'est pour moi !",isbn:"9782211349949",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782211349949-475x500-1.jpg"},
  {t:"La petite fille aux allumettes",a:"Andersen",y:"DL 2025",ed:"Albin Michel",cote:"C AND",pub:"Jeune",sup:"Imprimé",d:"C'est le tout dernier soir de l'année, celui du Nouvel An. Une petite fille arpente les rues, tête nue, pieds nus. Personne na voulu acheter ses allumettes. Pour se réchauffer, elle les craque une une, et chaque flamme lui procure une vision de bonheur : un festin sublime, un sapin de Noël richement décoré, des bougies qui se transforment en toiles... jusqu'au doux visage de sa grand-mère qui n'est plus.",isbn:"9782226499790",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226499790-475x500-1.jpg"},
  {t:"Les animaux",a:"Jugla",y:"DL 2026",ed:"Lito",cote:"J 590.83 JIG",pub:"Jeune",sup:"Imprimé",d:"Plus de 160 questions étonnantes, et leurs réponses tout aussi passionnantes, pour découvrir les animaux du monde entier !",isbn:"9782244428710",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782244428710-475x500-1.jpg"},
  {t:"Médecin",a:"Bexington",y:"DL 2026",ed:"Editions Gründ",cote:"A BEX",pub:"Jeune",sup:"Imprimé",d:"Viens découvrir le métier de docteur avec Gabin ! Gabin est un lapin qui aime découvrir les métiers. Lequel découvrira-t-il aujourd'hui ? Ta-dam ! Aujourd'hui, il est docteur ! Tourne les roues pour l'aider à faire des radios, des bandages et bien plus encore ! Un album tout-carton animé au charme fou pour éveiller les petits. Dans la même collection : Gabin le lapin - Conducteur de train",isbn:"9782324038075",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782324038075-475x500-1.jpg"},
  {t:"Love",a:"Cashell",y:"DL 2026",ed:"Editions Gründ",cote:"A CAS",pub:"Jeune",sup:"Imprimé",d:"Un album tendre et poétique sur l'amour pour les petits ! Et s'il existait un monde où règne l'amour ? Et si ce monde, c'était le nôtre ? Ce livre regorge de belles idées pour transmettre l'amour autour de soi. Il nous rappelle qu'avec de petits gestes du quotidien, ou même simplement en étant présent, chacun peut contribuer à rendre le monde plus tendre. Un bel album cartonné sur l'amour, les différences et la tolérance, illustré avec tendresse par Axel Scheffler.",isbn:"9782324038099",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782324038099-475x500-1.jpg"},
  {t:"Ouvre la bouche en grand !",a:"Ma",y:"DL 2026",ed:"minedition",cote:"A MA",pub:"Jeune",sup:"Imprimé",d:"\"Ouvre la bouche, dit Jade. Et fais \"Ahhh...\"\" Un livre qui va donner à tous les enfants l'envie de se brosser les dents.",isbn:"9782354137854",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137854-475x500-1.jpg"},
  {t:"Est-ce que vous êtes prêts ?",a:"Ma",y:"DL 2026",ed:"minedition",cote:"A MA",pub:"Jeune",sup:"Imprimé",d:"La petite souris organise une fête. Est-ce que tout le monde sera prêt ? Une histoire qui se jour dans la pénombre et se termine dans la lumière de la fête.",isbn:"9782354137861",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137861-475x500-1.jpg"},
  {t:"Les plus grands fleuves du monde",a:"Mehnert",y:"2021",ed:"Rue du Monde",cote:"551.48 MEH",pub:"Jeune",sup:"Imprimé",d:"Un documentaire présentant 18 des plus grands fleuves du globe et ce qui les entoure : la faune, la flore, les villes, l'économie, les hommes au cours de leur histoire et les questions écologiques. Chaque double page donne de nombreuses informations sur chacun de ces cours d'eau grâce à des vignettes. Au centre de l'ouvrage, une quadruple page détaille en particulier ce qui a trait au Nil. ©Electre 2021",isbn:"9782355046681",extraUrl:"https://www.babelio.com/couv/CVT_Les-plus-grands-fleuves-du-monde_229.jpg"},
  {t:"J'aime les comptines du monde entier",a:"Ivanovitch-Lair",y:"DL 2024",ed:"Rue du Monde",cote:"J 841.9 IVA",pub:"Jeune",sup:"Imprimé",d:"Partout sur Terre, des comptines rythment les jeux des enfants et, le soir venues, certaines viennent tendrement les endormir.  En voici une quarantaine, venues des quatre coins du monde, en français et dans leur langue d'origine.",isbn:"9782355047503",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355047503-475x500-1.jpg"},
  {t:"Au dodo maintenant !",a:"Iriyama",y:"DL 2026",ed:"Milan",cote:"A IRI",pub:"Jeune",sup:"Imprimé",d:"Les bruits de la forêt empêchent cinq petits ratons laveurs de s'endormir. Ils finissent par trouver le sommeil chacun leur tour, sauf le petit dernier, à qui la nuit réserve une belle surprise...",isbn:"9782408059163",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782408059163-475x500-1.jpg"},
  {t:"Napoléon",a:"Jannin",y:"2024",ed:"Graine de Loup jeunesse",cote:"944.05 JAN",pub:"Jeune",sup:"Imprimé",d:"Deux siècles après la mort de Napoléon Bonaparte (1769 - 1821), que savent les enfants de son histoire'Clotilde Jannin fait revivre dans cet album quelques épisodes fameux de la légende napoléonienne. Elle sest attachée à lenfance et à la jeunesse de cet « enfant corse » que rien ne prédestinait à devenir empereur, avant de décrire quelques grands moments de sa carrière militaire sans oublier le couronnement, la campagne de Russie et lexil à Sainte-Hélène. Napoléon a gouverné la France pendant seize années. Grâce à son génie militaire, il a dominé lEurope, reconstituant lempire de Charlemagne, mille ans après lempereur à la barbe fleurie. Ces conquêtes auront été faites au prix de la vie de dix millions de soldats et son orgueil ambitieux aura été la cause de sa chute. Mais son souvenir est encore présent dans nos lois, le baccalauréat, la Légion dHonneur... Le petit officier corse adoré par ses soldats, détesté par les uns, admiré par les autres, a pris sa place dans lHistoire de France. AUTEURS Mère de famille passionnée par lHistoire, habitant à Cherbourg, auteur de plusieurs biographies pour la jeunesse (Éd. Edilys), Clotilde Jannin a choisi de raconter, dans un style direct, très vivant et riche en dialogues, quelques épisodes parmi les plus significatifs de la vie de Napoléon Bonaparte. Formé aux Arts Appliqués de Lyon, longtemps directeur artistique dans la publicité, féru dhistoire, de littérature et de bande dessinée, Cyril Flautat vit avec sa famille au coeur des montagnes de Savoie. Il a déjà publié trois livres en tant quauteur et illustrateur : William Adams le samouraï des mers (Éd. du Jasmin) ; Au temps des samouraïs (Éd. Fleurus) ; Les Ténèbres de lInquisition (Éd. Elisa), tous fondés sur lhistoire. Conjuguant savoir-faire classique et savoir-faire digital, il a créé des illustrations aussi documentées quénergiques.",isbn:"9782487568013",extraUrl:"https://products-images.di-static.com/image/base/9782487568013-475x500-1.jpg"},
  {t:"Azur et le mystère de la pièce d'or",a:"Beauvais",y:"DL 2022",ed:"Rageot",cote:"A BEA",pub:"Jeune",sup:"Imprimé",d:"Paris, au tournant du XXe siècle. Pour gagner sa vie, Azur, orphelin, porte à vélo les lettres les plus urgentes de la capitale. Un jour, il remarque une enveloppe différente des autres. A l'intérieur, il y a... une pièce d'or ! Azur se laisse tenter : il garde la pièce et le message qu'il devait livrer...",isbn:"9782700277289",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782700277289-475x500-1.jpg"},
  {t:"Le chantier",a:"Hédelin",y:"DL 2017",ed:"Milan",cote:"624 HED",pub:"Jeune",sup:"Imprimé",d:"Cette collection documentaire pour les petits développe des encyclopédies complètes, accessibles et modernes. Elle se veut une référence d'images, tant pour les parents et leurs enfants que pour les enseignants.",isbn:"9782745980946",extraUrl:"https://products-images.di-static.com/image/base/9782745980946-475x500-1.jpg"},
  {t:"Mes premiers pas en origami",a:"Akass",y:"cop. 2013",ed:"Les Editions de Saxe",cote:"736.98 AKA",pub:"Jeune",sup:"Imprimé",d:"35 modèles d'origami des plus simples (des papillons, des maisons, etc.) aux plus compliqués (des nichoirs, des poupées russes, etc.). Des smileys leur attribuent un niveau de difficulté : le niveau 1 pour les pliages les plus simples, le niveau 2 intermédiaire et le niveau 3 pour les plus difficiles (les pliages inversés).",isbn:"9782756510385",extraUrl:"https://products-images.di-static.com/image/akass-susan-mes-premiers-pas-en-origami/9782756510385-475x500-1.webp"},
  {t:"Parfois, je suis triste",a:"Bowles",y:"DL 2026",ed:"Chantecler",cote:"A BOW",pub:"Jeune",sup:"Imprimé",d:"Votre enfant est parfois triste. Il veut rester dans son coin et n'a pas envie de jouer. C'est tout à fait normal et cela fait partie de son développement. Ce livre aidera votre enfant à reconnaître la tristesse, à la comprendre et à mieux la gérer. La petite histoire lui montrera comment retrouver le sourire d'une manière simple.",isbn:"9782803465002",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782803465002-475x500-1.jpg"},
  {t:"Animaux LEGO",a:"Padulano",y:"DL 2026",ed:"Nuinui jeunesse",cote:"737.7 PAD",pub:"Jeune",sup:"Imprimé",d:"50 adorables animaux à construire avec des briques LEGO® ! Laisse-toi guider par les conseils de l'auteur et donne libre cours à ton imagination. Dans cet ouvrage ludique et créatif, découvre comment assembler une tigre féroce, un ours tout mignon, un cygne élégant et bien d'autres animaux encore, tous réalisés avec des briques LEGO(r) ! Pour chaque modèle, tu trouveras : - Une liste détaillée des pièces nécessaires - Des instructions claires et illustrées - Des astuces pour trouver les bonnes briques LEGO(r) - Un QR code pour accéder aux tutoriels vidéo",isbn:"9782889574452",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782889574452-475x500-1.jpg"},
  {t:"Le grand livre jeu du merveilleux",a:"Subi",y:"DL 2026",ed:"La Martinière",cote:"LJ SUB",pub:"Jeune",sup:"Imprimé",d:"TROIS JEUX DANS UN SEUL LIVRE ! Assemblée de dragons, forêt enchantée, troupeau de licornes, monstres mythologiques, cité engloutie, congrès de sorcières... embarquez pour un merveilleux voyage à la découverte des créatures magiques ! Un cherche et trouve fantastique avec trois niveaux de difficulté pour jouer en famille, enrichi par deux pages documentaires pour tout savoir sur ces créatures merveilleuses qui peuplent notre imaginaire collectif. Un cherche et trouve palpitant avec trois niveaux de difficulté, pour jouer avec toute la famille.",isbn:"9791040125426",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040125426-475x500-1.jpg"},
  {t:"Le dernier des Mohicans",a:"Vermot",y:"DL 2025",ed:"Éditions Sarbacane",cote:"C VER",pub:"Jeune",sup:"Imprimé",d:"Publié pour la première fois en 1826, Le Dernier des Mohicans est une vaste épopée mêlant vérité historique et personnages de fiction. Elle raconte l'expédition dans le nord-est américain, alors sauvage, d'un jeune officier anglais escortant deux soeurs vers la garnison de leur père. En chemin, ils devront déjouer pièges et embuscades des Iroquois, alliés des Français contre les Anglais dans les guerres de conquête du continent, de 1740 à 1804, et menés par le terrifiant Magua. Ils pourront en revanche s'appuyer sur Hawkeye, le chasseur blanc élevé par les Delaware alliés des Anglais, et ses deux amis Mohicans, père et fils.",isbn:"9791040805441",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040805441-475x500-1.jpg"},
  {t:"Comment le monde est parti en saucisse",a:"Schmauch",y:"DL 2026",ed:"Éditions Sarbacane",cote:"J SCH",pub:"Jeune",sup:"Imprimé",d:"Moi, c'est Célestin, 11 ans, spécialiste mondial de la lutte anti-microbes. Mes trois pires ennemis ? Les bactéries. Le nez morveux de mon petit frère. La bave de son chien, Saucisse. Je rêvais de vacances paisibles. Sans germes, sans drames. Raté. Et puis, une extraterrestre s'est écrasée sur notre toit, a semé des graines de trou noir partout... et il paraît que NOUS aurions, peut-être-un-tout-petit-peu, déclenché la fin du monde. Ah, et avant de tourner la page : merci de reculer d'un mètre. Mesures sanitaires.",isbn:"9791040808008",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791040808008-475x500-1.jpg"},
  {t:"Les belles photos de famille",a:"Lee",y:"DL 2026",ed:"Gautier-Languereau",cote:"A LEE",pub:"Jeune",sup:"Imprimé",d:"Dans le village de la forêt, chez Hibou et Ours, les photographes, tous les animaux défilent pour poser en famille. Mais panda, lui, est tout seul : avec qui va-t-il poser ?",isbn:"9782017371007",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782017371007-475x500-1.jpg"},
  {t:"Le bain des quatre saisons",a:"Kim",y:"DL 2026",ed:"Gallimard",cote:"A KIM",pub:"Jeune",sup:"Imprimé",d:"Un album plein d'humour, fourmillant de détails, pour célébrer la nature qui s'éveille ! C'est le printemps ! Papy Mousse s'active : il ouvre sa maison et prépare son bassin. Tout doit être prêt pour l'arrivée des animaux ! Déjà, un ours sort d'hibernation. Il a besoin d'un bon bain !",isbn:"9782075233729",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075233729-475x500-1.jpg"},
  {t:"C'est à moi !",a:"Lang",y:"DL 2026",ed:"Editions Casterman",cote:"A LAN",pub:"Jeune",sup:"Imprimé",d:"Un album pour accompagner le difficile apprentissage du partage. C'est l'heure du déjeuner pour Gaston le chimpanzé. Il cueille la toute dernière banane sur le bananier. Mais il la fait tomber ! Et quand il descend de l'arbre pour la récupérer, Phacochère l'a déjà ramassée. - C'est ma banane ! déclare Gaston. - Je l'ai trouvée, je la garde ! répond Phacochère. Phacochère se met en colère. Et Gaston aussi. C'EST A MOI ! Et pas question de partager !",isbn:"9782203300217",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300217-475x500-1.jpg"},
  {t:"Bêêê, oui ! Meuh, non !",a:"Maudet",y:"DL 2026",ed:"L'École des loisirs",cote:"A MAU",pub:"Jeune",sup:"Imprimé",d:"Petit mouton cherche sa famille, il demande à la vache si elle est sa maman, mais elle lui répond MEUH, NON ! Il demande au tigre s'il est son papa, mais il lui répond GRRR, NON ! Le serpent répond TSSS, NON ! quand il lui demande s'il est sa tata... Pauvre petit mouton... quand va-t-il retrouver quelqu'un de sa famille ?",isbn:"9782211349024",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782211349024-475x500-1.jpg"},
  {t:"Ouvre cette porte !",a:"Robert",y:"DL 2026",ed:"Albin Michel",cote:"A ROB",pub:"Jeune",sup:"Imprimé",d:"C'est toujours la même histoire avec le loup : c'est lui qui décide ! Pourtant, cette fois-ci, il a beau supplier, ruser, menacer... rien n'y fait. Mais qui peut bien se cacher derrière la porte ? !",isbn:"9782226503848",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226503848-475x500-1.jpg"},
  {t:"Le Grozours arrive !",a:"Allepuz",y:"DL 2026",ed:"Albin Michel",cote:"A ALL",pub:"Jeune",sup:"Imprimé",d:"Au coeur de la forêt vivent quatre oursons tout fous et tout mignons. Alors qu'ils se préparent à aller se coucher, ils entendent un bruit. Ils tendent l'oreille, lèvent la truffe et ouvrent grand les yeux... Qui va là ? C'EST LE GROZOURS !",isbn:"9782226507105",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226507105-475x500-1.jpg"},
  {t:"Neige",a:"Brunet",y:"impr. 2021",ed:"Didier jeunesse",cote:"A BRU",pub:"Jeune",sup:"Imprimé",d:"Un album qui raconte l'attente, le ciel en coton, la légèreté des premiers flocons, les mains qui rougissent, le bonheur des luges qui glissent et des pas qui crissent, le scintillement de la glace, la neige qui fond, et les premiers bourgeons gorgés d'eau et de promesses…L'univers graphique d'Anaïs Brunet est fort, sensible et singulier. Ses peintures nous transportent au cœur d'une nature merveilleuse.",isbn:"9782278097852",extraUrl:"https://m.media-amazon.com/images/I/512ueUS5neL._SX195_.jpg"},
  {t:"Hue Cocotte !",a:"Collet",y:"DL 2026",ed:"Glénat Jeunesse",cote:"A COL",pub:"Jeune",sup:"Imprimé",d:"La vie te donne des ailes. Prends ton envol ! Au poulailler, Mariette est bouleversée. A quoi bon avoir des ailes si on ne peut pas voler ? Pourtant grâce à son amie Josette, Mariette va comprendre qu'avec un peu d'entrain et beaucoup de courage, même une poule peut décoller... et viser la Lune !",isbn:"9782344070178",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344070178-475x500-1.jpg"},
  {t:"Bonne nuit !",a:"Tourlonias",y:"DL 2026",ed:"minedition",cote:"A TOU",pub:"Jeune",sup:"Imprimé",d:"Un livre interactif pour se préparer à aller au lit ! On se brosse les dents, on fait pipi, et on va au lit... et les peluches, où sont-elles ? Deux frères se préparent à se coucher. L'enfant suit toutes les étapes une à une et grâce aux tirettes et aux rabats sur chaque double page, il est aussi acteur de la lecture.",isbn:"9782354137755",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137755-475x500-1.jpg"},
  {t:"Un Petit Tour",a:"Howe",y:"DL 2026",ed:"Kaléidoscope",cote:"A HOW",pub:"Jeune",sup:"Imprimé",d:"Un souriceau et son papa se promènent dans la nature. Ils flânent le long d'un ruisseau, admirent les insectes, les nuages... Mais où vont-ils tous ainsi ? Avec délicatesse, Simon Howe signe un album contemplatif et tendre qui invite à prêter attention à ce qui nous entoure... et à savourer le bonheur simple de retrouver le chemin de la maison.",isbn:"9782378883362",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782378883362-475x500-1.jpg"},
  {t:"Le coup de la cacahuète",a:"Manceau",y:"DL 2026",ed:"Sens dessus dessous",cote:"A MAN",pub:"Jeune",sup:"Imprimé",d:"Pour transformer une grosses cacahuète, il faut être malin et faire preuve de beaucoup d'imagination...",isbn:"9782385071202",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782385071202-475x500-1.jpg"},
  {t:"Edmond gros mouton",a:"Mallié",y:"DL 2026",ed:"Editions Margot",cote:"A MAL",pub:"Jeune",sup:"Imprimé",d:"Alors qu'il gambade derrière un papillon, Edmond se perd dans la montagne. Sans personne pour le tondre, sa laine POUSSE, POUSSE, POUSSE, et il finit par ressembler à une ENORME boule de coton ! Se faisant passer pour de gentils bergers, le loup, le renard et l'aigle vont essayer de le CROQUER. Mais ce mouton n'est pas une proie si facile...",isbn:"9782494797567",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494797567-475x500-1.jpg"},
  {t:"Parfois, je suis en colère",a:"Bowles",y:"DL 2026",ed:"Chantecler",cote:"A BOW",pub:"Jeune",sup:"Imprimé",d:"Votre enfant est parfois en colère. Il crie, tape du pied ou s'énerve envers tout le monde. C'est tout à fait normal et cela fait partie de son développement. Ce livre aidera votre enfant à reconnaître la colère, à la comprendre et à mieux la gérer. La petite histoire lui montrera comment retrouver le calme d'une manière simple.",isbn:"9782803464999",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782803464999-475x500-1.jpg"},
  {t:"Pourquôôââ ?",a:"Voutch",y:"DL 2026",ed:"Thierry Magnier",cote:"A VOU",pub:"Jeune",sup:"Imprimé",d:"Les enfants grenouilles sont comme les autres : ils sont curieux. Et quand vient l'heure de dormir, leur curiosité s'aiguise d'autant plus. Les parents grenouilles se retrouvent alors face à une avalanche de \"Pourquôôôâââ ? \" qui semblent intarissables. Sauront-ils y répondre sans perdre leur sang-froid ? !",isbn:"9791035209285",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209285-475x500-1.jpg"},
  {t:"Odilon",a:"Davenier",y:"DL 2026",ed:"Bayard éditions",cote:"A DAV",pub:"Jeune",sup:"Imprimé",d:"Un envol plein de tendresse et de malice Odilon est un petit papillon adorable... mais tétanisé à l'idée de quitter le nid. Contrairement à ses frères et soeurs qui volent, il préfère écouter leurs histoires de là-haut, bien au chaud. Mais ça, c'était avant qu'Isabelle, une coccinelle intrépide, débarque pour jouer. Elle l'entraîne dans un jeu inattendu et, par accident (ou par magie ? ), Odilon tombe... pour mieux s'envoler ! Une première aventure remplie de douceur, de rires et de courage. Un petit héros auquel les enfants peuvent s'identifier Ce joli récit aborde avec tendresse la peur de se lancer, ce moment où l'on hésite encore avant de grandir. Les jeunes lecteurs se reconnaîtront dans Odilon et sa crainte de l'inconnu, tandis que les parents apprécieront la manière bienveillante dont l'histoire montre que chacun avance à son rythme. Parfait pour aborder la confiance en soi, les premiers pas (ou vols ! ) et l'amitié. Une illustratrice reconnue et une collection craquante Les illustrations de Christine Davenier - déjà adorée pour la série \"Minusculette\" (à l'Ecole des loisirs) - apportent une chaleur et un charme irrésistibles à cette histoire. Elle s'inscrit dans la collection Tout Carton Tout Mignon, des livres solides et joyeux, spécialement pensés pour les petites mains... et les grands sourires.",isbn:"9791036375293",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036375293-475x500-1.jpg"},
  {t:"Le Fil de notre histoire",a:"Negrin",y:"DL 2026",ed:"La Martinière",cote:"A NEG",pub:"Jeune",sup:"Imprimé",d:"Un voyage extraordinaire à travers le temps : l'histoire d'une famille racontée à rebours, jusqu'à ses origines les plus lointaines... Lucie, 90 ans, se rappelle de tendres souvenirs qui, par ricochets, en invoquent d'autres plus anciens : les joyeuses soirées avec Giorgio dans les années 1960, leur rencontre quand elle avait 16 ans, sur cette plage où elle passait depuis sa plus tendre enfance tous ses étés. Son père était reporter, il avait rencontré sa mère à Londres. Le père de cette Anglaise, grand-père Charles, capitaine au long cours, était tombé amoureux à Shanghai, au début du siècle, de Mei, une jeune Chinoise. Il avait offert à la petite Lucie une bague qui était dans la famille depuis l'époque des Croisades, lorsqu'un chevalier saxon et une princesse arabe s'étaient unis. Et avant cela ? Une aïeule reine d'Egypte, des esclaves, des chasseurs de crocodiles ou des marchands de fruits, qui sait... Des instants évocateurs et émouvants saisis en peu de mots sont servis par des illustrations et une mise en pages captivantes. Lucie, en remontant le temps, raconte la richesse de ses origines. Ce récit familial nous convie à une exploration poétique de l'identité et de nos racines. En prenant l'amour comme fil conducteur, il montre combien chaque histoire personnelle est un fragment d'une vaste mosaïque humaine et s'inscrit dans une histoire commune et universelle ; il célèbre ce lien qui devrait nous unir, ce patrimoine génétique partagé, hérité d'un ancêtre perdu dans la nuit des temps. Le lecteur rencontrera avec délice chaque génération de cette famille paradigmatique, s'interrogera sur la transmission d'une bague, croisera des personnages hauts en couleur. Jusqu'à cette silhouette dont la narratrice porte fièrement le nom, l'arrière-arrière-arrière-grand-tante de l'humanité : l'australopithèque Lucy. Une grande famille ? L'humanité tout entière ! Un album fascinant, original et graphique qui met en lumière la mixité de nos racines en même temps que notre origine commune, comme une invitation à la fraternité.",isbn:"9791040124320",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040124320-475x500-1.jpg"},
  {t:"Ti'Tigre",a:"Prasadam-Halls",y:"DL 2026",ed:"Éditions Sarbacane",cote:"A PRA",pub:"Jeune",sup:"Imprimé",d:"Ti'Tigre en a assez. Quand il demande : Je peux manger tout le gâteau ? Je peux aller à l'école en pyjama ? la réponse à ses bonnes idées est toujours : non. Et pourquoi donc ? C'est pas juste ! Pourtant, le craquant Ti'Tigre au caractère bien trempé et aux émotions fortes, n'a peur de rien. Enfin presque...",isbn:"9791040808237",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791040808237-475x500-1.jpg"},
  {t:"Petit Tête en l'air",a:"Lestrade",y:"DL 2026",ed:"Gautier-Languereau",cote:"A LES",pub:"Jeune",sup:"Imprimé",d:"Pour les étourderies, il n'y a pas plus fort que Petit tête en l'air ! Est-ce possible d'oublier de mettre son pantalon, de confondre le shampoing avec le dentifrice et de se tromper de maison ? Ce champion mérite bien son surnom. Mais heureusement, pour garder les pieds sur terre, il a sa famille et ses amis qui l'aiment à la folie !",isbn:"9782017348276",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782017348276-475x500-1.jpg"},
  {t:"Et... Paf !",a:"Raisson",y:"DL 2026",ed:"Nathan",cote:"A RAI",pub:"Jeune",sup:"Imprimé",d:"Bim, boum, splash, cling... A vous de faire claquer les pages pour provoquer collisions, explosions et autres rencontres.",isbn:"9782095058548",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782095058548-475x500-1.jpg"},
  {t:"Vivement ce soir !",a:"Lili la Baleine",y:"DL 2026",ed:"Editions Casterman",cote:"A LIL",pub:"Jeune",sup:"Imprimé",d:"Un premier album sur le temps qui passe, pour aider les petits à patienter. Prune, Pablo et Oscar arriveront ce soir. Mais pour l'instant, le ciel est bleu et ce petit garçon doit attendre encore un peu. Attendre ? Quelle drôle d'histoire ! C'est long et ennuyeux. Heureusement, la neige est là, dans le jardin, pour jouer et patienter. Tiens, un bruit... il fait bientôt nuit. Les voilà ! Pour éveiller les sens des tout-petits, dès la naissance. Pour un moment de partage intense entre l'adulte et l'enfant grâce aux premières histoires lues avec bébé contre soi. Lili La Baleine, qui a illustré de nombreux textes, nous propose son tout premier texte qu'elle a écrit avec beaucoup d'amour pour les bébés.",isbn:"9782203302303",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203302303-475x500-1.jpg"},
  {t:"La petite poule rousse",a:"Paku",y:"DL 2026",ed:"Fleurus",cote:"A PAK",pub:"Jeune",sup:"Imprimé",d:"Il était une fois... L'histoire de La Petite Poule rousse tendrement illustrée pour faire découvrir aux tout-petits les contes de notre enfance.",isbn:"9782215201564",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215201564-475x500-1.jpg"},
  {t:"Il pleut, il mouille",a:"",y:"DL 2026",ed:"Didier jeunesse",cote:"A SAJ",pub:"Jeune",sup:"",d:"Un livre cartonné et animé de tirettes, pour jouer avec la comptine traditionnelle et célébrer le printemps ! Une grenouille rotative cartonnée, mais aussi un arc-en-ciel, un poisson, une hirondelle, une libellule... que les tout-petits auront plaisir à manipuler et à faire bouger au rythme de la comptine. Sur la dernière page, un pop-up pour fêter le printemps en grand !",isbn:"9782278120086",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782278120086-475x500-1.jpg"},
  {t:"Le livre qu'il ne faut pas ouvrir (sous aucun prétexte !)",a:"Patschke",y:"2021",ed:"Glénat",cote:"A PAT",pub:"Jeune",sup:"Imprimé",d:"Pierre, Sami, Sarah et Lucie découvrent une mystérieuse caisse en bois. Sur le couvercle, un message leur intime l'ordre de ne pas l'ouvrir. Un album sur le thème de l'interdit. ©Electre 2022",isbn:"9782344050835",extraUrl:"https://www.babelio.com/couv/CVT_Le-livre-quil-ne-faut-pas-ouvrir_2425.jpg"},
  {t:"Fan de carotte",a:"Ilustrajo",y:"DL 2026",ed:"Glénat Jeunesse",cote:"A ILU",pub:"Jeune",sup:"Imprimé",d:"Au potager, monsieur Lapin bêche, sème, arrose et surveille. Mais quand arrive le moment de la récolte, il va faire une rencontre très spéciale : une carotte qui danse et qui chante, une carotte un poil envahissante ! Comment dire, monsieur Lapin n'est pas très \"fan\" de cette carotte, lui qui tient plus que tout à sa solitude. Ah oui ? Vraiment ? !",isbn:"9782344070048",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344070048-475x500-1.jpg"},
  {t:"Moi d'abord !",a:"Escoffier",y:"2010",ed:"Frimousse",cote:"A ESC",pub:"Jeune",sup:"Imprimé",d:"C’est l’histoire d’un caneton qui veut toujours être le premier. Que maman canne (ou papa canard, difficile de trancher!) propose une promenade, une partie de pêche (aux canards, bien sûr) ou une baignade… «Moi d’abord, moi d’abord» cancanne l’insupportable palmidède en envoyant au tapis toute sa fratrie. Aussi quand il entend crier «À table!» ce n’est évidemment qu’un cri… mais à trop se précipiter on a quelquefois de bien mauvaises surprises!",isbn:"9782352410553",extraUrl:"https://www.babelio.com/couv/CVT_cvt_Moi-dabord-_9651.jpg"},
  {t:"C'est moi qui choisis !",a:"Gao",y:"DL 2026",ed:"Rue du Monde",cote:"A GAO",pub:"Jeune",sup:"Imprimé",d:"Un vêtement, un cadeau, un chemin... Plusieurs fois par jour, on doit décider et choisir. Il y a des choix que l'on fait sans même réfléchir, et d'autres, qui sont de véritables casse-têtes ! On hésite, on regrette... Choisir, c'est vraiment compliqué ! Dans ce livre, je vous raconte comment moi, je me débrouille quand je dois choisir !",isbn:"9782355048128",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355048128-475x500-1.jpg"},
  {t:"Encore une folle semaine pour M. Dubois",a:"Lewis-Jones",y:"DL 2026",ed:"Kimane",cote:"A LEW",pub:"Jeune",sup:"Imprimé",d:"Un lundi matin, M. Dubois découvre que l'ours a emprunté son vélo et l'a cassé. Les roues sont toutes tordues. Comment va-t-il pouvoir se rendre au travail ? Encore une folle semaine qui commence pour M. Dubois et il n'est pas au bout de ses surprises !",isbn:"9782383224761",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383224761-475x500-1.jpg"},
  {t:"Drôles d'expressions sur... les émotions",a:"Mialon",y:"DL 2026",ed:"Grenouille éditions",cote:"A MIA",pub:"Jeune",sup:"Imprimé",d:"En voilà de drôles d'expressions ! En douceur ou en couleurs, nos émotions sont une grande source d'inspiration pour notre imagination. Douze comptines illustrées pour découvrir le monde poétique et imagé des expressions... et des émotions !",isbn:"9782384862856",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782384862856-475x500-1.jpg"},
  {t:"Le pire des chevaliers",a:"Kemp",y:"DL 2026",ed:"Milan",cote:"A KEM",pub:"Jeune",sup:"Imprimé",d:"Riquiqui le crapaud, tout gluant et pas très beau, veut devenir un héros. Un vrai, un grand, un costaud ! Le roi des nénuphars en a assez des libellules, il se rêve chevalier, même avec ses pustules. Comme dans les contes de fées, seule une princesse pourrait l'aider et, d'un baiser, le transformer en fier et noble chevalier...",isbn:"9782408060428",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408060428-475x500-1.jpg"},
  {t:"Les araignées, 100 infos à connaître",a:"Collectif",y:"2024",ed:"Piccolia",cote:"J 595.4 DEL",pub:"Jeune",sup:"Imprimé",d:"Un concept pertinent de documentaire, avec photos et illustrations, de 100 infos, avec des quizz et des activités à réaliser. 100 faits numérotés, accompagnés de magnifiques illustrations, plongeront les enfants dans une aventure irrésistible de bout en bout, racontée avec humour grâce à des détails et des dessins amusants. Les jeunes esprits curieux y apprécieront les quiz et activités qui leur permettront de tout connaître sur leur sujet favori !",isbn:"9782753075221",extraUrl:"https://m.media-amazon.com/images/I/51JtYYV9EFL._SX95_.jpg"},
  {t:"Magimage",a:"Albon",y:"DL 2024",ed:"Thierry Magnier",cote:"A ALB",pub:"Jeune",sup:"Imprimé",d:"Ce livre est vraiment magique : il transforme les images grâce à un simple miroir. Et voici comment le poisson se transforme soudain... en chat !",isbn:"9791035207243",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035207243-475x500-1.jpg"},
  {t:"Magimage",a:"Albon",y:"DL 2025",ed:"Thierry Magnier",cote:"A THI",pub:"Jeune",sup:"Imprimé",d:"Ce livre est vraiment magique : il transforme les images grâce à un simple miroir. Et voici comment un panier de fruits se transforme soudain... en glace !",isbn:"9791035208523",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035208523-475x500-1.jpg"},
  {t:"(Pas encore) une histoire de sorcière",a:"Roussey",y:"DL 2026",ed:"La Martinière",cote:"A ROU",pub:"Jeune",sup:"Imprimé",d:"Vous en avez assez des histoires de sorcières traditionnelles ? Parfait ! Car voici l'histoire de Scarrrmozzaaaa, la sorcière la plus nulle, la plus moche et la plus terrifiante de tous les temps ! Avec sa verrue sur le nez, son chat Gros Relou et ses pieds qui puent, elle prépare sa GRANDE VENGEANCE dans sa cabane au fond des bois.",isbn:"9791040125631",extraUrl:"https://m.media-amazon.com/images/I/51s0MrgHsSL._SX195_.jpg"},
  {t:"Curiosity",a:"Motum",y:"DL 2019",ed:"Gallimard",cote:"J 523.4 MOT",pub:"Jeune",sup:"Imprimé",d:"Une aventure qui transcende la fiction et vous entraîne au-delà des étoiles, au coeur d'une des plus grandes questions de l'univers. Connaissez-vous Curiosity ? Découvrez l'incroyable histoire de ce rover envoyé sur Mars pour essayer de comprendre pourquoi cette planète autrefois accueillante est devenue hostile aujourd'hui. Doté de 17 caméras, de 6 roues motrices, d'un laboratoire portatif et d'un rayon laser, Curiosity sillonne Mars à la recherche d'une trace de vie et de la vérité.",isbn:"9782075136785",extraUrl:"https://products-images.di-static.com/image/base/9782075136785-475x500-1.jpg"},
  {t:"Sac à poux",a:"Amram",y:"DL 2023",ed:"Gallimard",cote:"A AMR",pub:"Jeune",sup:"Imprimé",d:"Un recueil de poèmes joyeux et pleins d'humour. \"Ils ne sont pas poissons d'eau douce pas poissons scie, ni poissons-chats... On ne les voit pas dans les vagues. Mais en avril, ils seront là, dans ton dos, pour faire des blagues ! \" Un mariage d'hippopotame, un éléphant en hélico, des poux sur la tête, des moustiques qui piquent et tout plein d'oiseaux... Voici de petites poésies, comme des comptines, à apprendre ou à lire à haute voix pour se faire plaisir en jouant avec les mots !",isbn:"9782075175593",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075175593-475x500-1.jpg"},
  {t:"Hé ho, croco !",a:"Alzial",y:"DL 2026",ed:"Marcel et Joachim/Gallimard Jeunesse",cote:"A ALZ",pub:"Jeune",sup:"Imprimé",d:"Un petit lapin gourmand, attiré par de beaux liserons charnus, s'approche de la rivière. Trop près. Un gros crocodile en profite pour l'avaler tout rond. Bien embêté, le petit lapin se demande comment il va bien pouvoir sortir de ce ventre dégoûtant. Quand il entend son geôlier se réjouir de cette belle prise d'un \"Hé hé hé\" sonore et cruel, il lui vient une idée : le lapin invite le crocodile à articuler des sons vraiment effrayants (et pas un petit Hé hé hé ridicule). Piqué dans son orgueil, le crocodile va se laisser guider par le petit lapin, comme un comédien le serait par son metteur en scène... Jusqu'au HA HA HA final, qui nécessite que le crocodile ouvre grand sa gueule. Le lapin malin en profite pour s'échapper, bien content !",isbn:"9782075233477",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075233477-475x500-1.jpg"},
  {t:"Ces grands-parents qui t'aiment infiniment",a:"Lewalle",y:"DL 2026",ed:"Editions Casterman",cote:"A LEW",pub:"Jeune",sup:"Imprimé",d:"Une vibrante déclaration d'amour aux grands-parents. Sur notre planète, il y a plein de grands-parents à qui l'on donne des noms tendres ou surprenants... Mamie, Manou, Nonna, Babouchka, ou Mouty, Papy, Papou, Pépé, Grandpa, ou bien Daddy. Et parmi eux, il y a tes grands-parents qui t'aiment infiniment. Capucine Lewalle présente une joyeuse galerie de grands-parents et met en lumière ce lien si fort qui unit un petit enfant à son aïeul. Une déclaration d'amour à offrir à ceux qui tiennent une place toute particulière dans le coeur des enfants. Un grand format avec couverture cartonnée.",isbn:"9782203303607",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203303607-475x500-1.jpg"},
  {t:"5 petits moutons",a:"Chebret",y:"DL 2024",ed:"L'École des loisirs",cote:"A CHE",pub:"Jeune",sup:"Imprimé",d:"Cinq petits moutons jouent dans la forêt, mais ils doivent vite aller au lit avant que le soleil se couche, car le loup sort de chez lui à la nuit tombée. Hélas, les petits moutons ont oublié leurs doudous dans la forêt et, faute de moutons, le loup emporte les doudous pour en faire son repas. Les cinq petits moutons ont alors une idée pour aller sauver leurs doudous...",isbn:"9782211336840",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782211336840-475x500-1.jpg"},
  {t:"Nom d'un ours !",a:"Viale",y:"DL 2026",ed:"Hélium",cote:"A VIA",pub:"Jeune",sup:"Imprimé",d:"Tout le monde est au courant maintenant, les ours sont parfaitement inutiles et ils ne savent vraiment rien faire du tout. Les bonnes manières leurs sont complètement étrangères... En un mot : évitez à tout prix leur compagnie !",isbn:"9782330208165",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330208165-475x500-1.jpg"},
  {t:"Le Sac",a:"Adbåge",y:"DL 2026",ed:"Cambourakis",cote:"A HOB",pub:"Jeune",sup:"Imprimé",d:"Maman et papa ont fait le ménage ce week-end. On le voit tout de suite. Sauf qu'on ne peut pas ranger tant que ça sans rien jeter, pas vrai ? Et puis, ce grand sac noir, dans l'entrée, c'est suspect...",isbn:"9782386691003",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782386691003-475x500-1.jpg"},
  {t:"Miam, ouvre grand",a:"Montanari",y:"DL 2026",ed:"Thierry Magnier",cote:"A MON",pub:"Jeune",sup:"Imprimé",d:"Mâchoire serrée, assiette renversée, pas question d'avaler cette bouchée ! Et si le repas quittait la table pour devenir une grande aventure à vivre en famille ?",isbn:"9791035209278",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209278-475x500-1.jpg"},
  {t:"C'est dans ma nature !",a:"Salerno",y:"DL 2026",ed:"La Martinière",cote:"A SAL",pub:"Jeune",sup:"Imprimé",d:"Es-tu de nature plutôt bavarde, timide, espiègle, impatiente, câline, ou tout cela à la fois ?",isbn:"9791040126027",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040126027-475x500-1.jpg"},
  {t:"Maman pour toujours",a:"Lorenzoni",y:"DL 2026",ed:"Éditions Sarbacane",cote:"A LOR",pub:"Jeune",sup:"Imprimé",d:"\" Olivo habite avec son papa. Il y a lui et son papa et puis voilà. \" Comme un doux poème, voici l'histoire d'un enfant dont la maman n'est plus là. Cela le met en colère et ses jambes donnent des coups de pied et cassent des choses. Heureusement, il y a les câlins surprises, qui eux, sont restés. Ils ont même augmenté. Un jour, son papa l'invite à couper du bois\". Un mot triste, un bout de bois, un mot colère, un autre bout de bois. \" Jusqu'à épuiser le tas du jardin - et tous les mots tristes ou colères. Puis ils se rendent auprès du grand chêne, et cette fois, c'est le papa qui va épuiser son chagrin en construisant une cabane dans les hautes branches. D'où Olivo comprendra que sa maman est avec eux - pour toujours...",isbn:"9791040807742",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791040807742-475x500-1.jpg"},
  {t:"C'était quoi, ce craquement ?",a:"Cali",y:"DL 2026",ed:"Éditions Sarbacane",cote:"A CAL",pub:"Jeune",sup:"Imprimé",d:"Deux frères sont couchés dans leur lit. L'un entend toujours des \" craquements \" et finit par communiquer sa peur à l'autre, qui est pourtant de nature beaucoup plus cool... C'est parti pour un échange d'explications fantaisistes qui feront intervenir : le parquet qui craque (mais ils ont du carrelage), le chien (mais ça ne craque pas, un chien ? ), un voleur (au 7e étage ? ), le père Noël... La vraie réponse sera toute différente ! Et l'effet épatant, pour l'enfant lecteur : rien de tel que l'humour pour balayer la peur !",isbn:"9791040808152",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040808152-475x500-1.jpg"},
  {t:"Madame la Nuit",a:"Colin",y:"DL 2025",ed:"Gautier-Languereau",cote:"A COL",pub:"Jeune",sup:"Imprimé",d:"Madame la Nuit aime faire la fête! Sortir, danser sans s'arrêter...Alors pourquoi aller se reposer ? Un jour, elle décide de ne pas rentrer. Du tout. Depuis, dans la Grande Ville, il fait toujours nuit. Sortir le chien, jouer à la marelle, courir à l'école... tout se passe dans le miroitement des étoiles et des réverbères. C'est amusant... et puis, ça l'est un peu moins. Comment convaincre Madame la Nuit d'aller se coucher ? Un conte nocturne poétique et enchanteur, éclatant de couleurs, pour s'émerveiller des petits mystères de la nuit.",isbn:"9782017348214",extraUrl:"https://m.media-amazon.com/images/I/513VXxwul2L._SX210_.jpg"},
  {t:"Jeanne et le secret des petites voix dans la tête",a:"Charvel",y:"DL 2026",ed:"Flammarion",cote:"A CHA",pub:"Jeune",sup:"Imprimé",d:"Jeanne adore se promener avec sa tante Hélène et discuter avec elle, car elle écoute toujours et connaît plein de choses. Aujourd'hui, Jeanne a envie de lui confier un secret : - Tu sais, Tata, parfois je me parle dans ma tête et j'entends une petite voix... Un album éclairant sur un phénomène utile, précieux et même un peu magique, pour aider les enfants à apprivoiser leur monde intérieur.",isbn:"9782080480477",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782080480477-475x500-1.jpg"},
  {t:"NON ! dit lapin",a:"Henrichs",y:"DL 2026",ed:"Nathan",cote:"A HEN",pub:"Jeune",sup:"Imprimé",d:"Lapin n'a pas envie d'écouter sa maman. Non, non, non ! proteste-t-il. Maman et Lapin trouveront-ils quelque chose qu'ils aiment faire tous les deux ?",isbn:"9782095057275",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782095057275-475x500-1.jpg"},
  {t:"Bisous bisous",a:"Geis",y:"DL 2026",ed:"Editions Casterman",cote:"A GEI",pub:"Jeune",sup:"Imprimé",d:"Des flaps et des pop-ups pour se faire des bisous par milliers ! Mamie Miel envoie un bisou à Grisou, qui le reçoit sur la joue. De flaps en flaps, une véritable chaîne de bisous se met en place : des bisous pour guérir, des bisous pour souhaiter un anniversaire, des bisous pour demander pardon, des bisous pour tout le monde ! Un très bel objet ludique et plein d'amour : le petit lecteur pourra lui-même déplacer le bisou, grâce au rabat, vers le copain suivant !",isbn:"9782203296510",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203296510-475x500-1.jpg"},
  {t:"Maman (Oie)  Ours n'aime pas l'hive",a:"Higgins",y:"DL 2026",ed:"Albin Michel",cote:"A HIG",pub:"Jeune",sup:"Imprimé",d:"Les souris sont prêtes pour leurs activités hivernales préférées : ski, luge, patinage et fabrication de bonshommes de neige. Malheureusement, Michel a un rhume et sa famille ne veut pas le laisser tout à seul à la maison. Si Michel ne peut pas jouer dans la neige, alors celle-ci viendra à lui... et les bêtises des souris, aussi !",isbn:"9782226507969",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226507969-475x500-1.jpg"},
  {t:"Les veilleurs de rêves",a:"Marcero",y:"DL 2026",ed:"Didier jeunesse",cote:"A MAR",pub:"Jeune",sup:"Imprimé",d:"Lenny et ses amis avaient décidé de faire ensemble une grande collection de souhaits, de rêves et d'espoirs. Mais une tempête arriva et détruisit tout. A quoi bon rêver si on pouvait tout perdre ? Traduction de l'anglais de Rose-Marie Vassallo.",isbn:"9782278133000",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782278133000-475x500-1.jpg"},
  {t:"Emmie, petite souris de génie",a:"Crosby-Fairall",y:"DL 2026",ed:"Editions Gründ",cote:"A CRO",pub:"Jeune",sup:"Imprimé",d:"Emmie, la petite souris, avait de grandes idées. Grâce à ses inventions astucieuses, tout fonctionnait à merveille. Jusqu'au jour où un énorme problème apparut...",isbn:"9782324038945",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782324038945-475x500-1.jpg"},
  {t:"L'inondation",a:"Modéré",y:"DL 2026",ed:"Actes Sud",cote:"A MOD",pub:"Jeune",sup:"Imprimé",d:"Un soir d'orage, alors que la pluie ne cesse de tomber, la rivière déborde. La maison de Léa, enfouie dans un terrier, est submergée. Désemparée, elle fuit avec sa famille en quête d'un refuge. Mais quand tout semble désespéré, il reste toujours une lueur d'espoir.",isbn:"9782330215453",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330215453-475x500-1.jpg"},
  {t:"A tes côtés",a:"Hughes",y:"DL 2026",ed:"Kimane",cote:"A HUG",pub:"Jeune",sup:"Imprimé",d:"Une histoire rassurante et adorablement illustrée par Alex Latimer sur le lien indéfectible entre parent et enfant. \"Lorsque Petit Dino est séparé de sa maman par une tempête, il sait qu'il doit faire preuve de courage et la retrouver. Mais le monde peut être effrayant sans elle à ses côtés... La gentillesse des autres animaux et quelques indices laissés dans le sable aideront-ils à ramener Petit Dino auprès de sa maman ? Une histoire rassurante, en rimes, pour célébrer le lien indéfectible entre un parent et son enfant\".",isbn:"9782383224594",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383224594-475x500-1.jpg"},
  {t:"Le pitou",a:"Escoffier",y:"DL 2025",ed:"Frimousse",cote:"A ESC",pub:"Jeune",sup:"Imprimé",d:"Zais perdu mon pitou ! Un petit manchot est seul sur la banquise. Il a perdu son \" pitou \". Il rencontre un ours blanc ronchon. \" Tu as vu mon pitou ? \" demande le petit manchot. L'ours l'envoie loin en lui afrmant que son pitou est caché \" là bas \". Il part donc... loin... seul... sur la banquise ostile. Qui se retrouve par le plus grand des hasards sur son chemin ? Le Père Noël en personne ! Celui-ci vient d'avoir un accident de traineau... Il a heurté un drôle de personnage... Le petit manchot lui explique : \" zai perdu mon pitou \" . Le Père Noêl se met immédiatement à la recherche d'un pitou... Il doit bien y avoir ça parmi tous les cadeaux du traîneau. Mais un hurlement devance l'ours blanc, visiblement poursuivi par un monstre terrifiant... \" Mon Pitou ! \" s'exclame le petit manchot. Ouf ! doudou retrouvé.",isbn:"9782383496205",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496205-475x500-1.jpg"},
  {t:"Babinoche mon grand chien",a:"Surribas",y:"DL 2026",ed:"Frimousse",cote:"A SUR",pub:"Jeune",sup:"Imprimé",d:"A quoi ressemble une année avec mon chien Babinoche ? Ce que je peux vous dire, c'est qu'on ne s'ennuie jamais... Nos bêtises et nos aventures sont comme lui : gi-gan-tesques !",isbn:"9782383496557",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496557-475x500-1.jpg"},
  {t:"Jaloux comme Manchot !",a:"Lewis-Jones",y:"DL 2026",ed:"Milan",cote:"A LEW",pub:"Jeune",sup:"Imprimé",d:"Comment peut-on être jaloux des mouettes ? Elles savent voler, et alors ? Après tout, il suffit d'avoir des ailes ! Pour Manchot, rien d'impossible... ou presque !",isbn:"9782408060435",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408060435-475x500-1.jpg"},
  {t:"Capricieuse",a:"Fontanel",y:"DL 2019",ed:"L'Etagère du bas",cote:"A FON",pub:"Jeune",sup:"Imprimé",d:"Capricieuse, une petite fille plutôt mal élevée, se retrouve parachutée dans le monde des animaux et autres insectes de la forêt. Enfant autoritaire et impatiente, elle va devoir ralentir la cadence à cause d'une blessure au pied et se déplacer à dos de tortue. Ce rythme modéré va l'amener à observer davantage tout ce qui l'entoure... c'est le début de bien des aventures !",isbn:"9782490253159",extraUrl:"https://static.wixstatic.com/media/b71342_4a5c6216edc34d6f8ed28d20b081c3ba~mv2_d_1662_2320_s_2.png/v1/fill/w_358,h_488,al_c,q_85,usm_0.66_1.00_0.01/Capricieuse-couverture.webp"},
  {t:"Je n'aurai plus peur",a:"Rea",y:"DL 2026",ed:"La Partie",cote:"A REA",pub:"Jeune",sup:"Imprimé",d:"Un album sensible et profond sur la violence, la guerre et la résilience. Dans le calme de la nuit, une mère et son fils commencent une conversation difficile. L'enfant hésite à raconter une scène de violence dont il a été témoin à l'école. Il en saisit d'autant plus la gravité qu'il a fui un pays en guerre. Les souvenirs de ce passé traumatique se superposent au présent, et la frontière entre les événements se brouille pour mieux mettre en lumière les mécanismes de la peur. Grâce à l'écoute et l'amour de sa mère, il trouve le courage d'agir. Décidé à en parler à l'école le lendemain, l'enfant s'endort apaisé.",isbn:"9782494591417",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494591417-475x500-1.jpg"},
  {t:"Grand-Père",a:"Ieradi",y:"DL 2026",ed:"Alice",cote:"A IER",pub:"Jeune",sup:"Imprimé",d:"Au lieu de parler, Grand-Père fait des sons étranges. Le seul qui semble le comprendre, c'est son chien. Mais ça, on n'en est pas bien sûrs.",isbn:"9782874266904",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782874266904-475x500-1.jpg"},
  {t:"L'arbre de la gentillesse",a:"Teckentrup",y:"2019",ed:"Quatre Fleuves",cote:"A TEC",pub:"Jeune",sup:"Imprimé",d:"Un album poétique et profond pour faire réfléchir petits et grands sur les bienfaits de l’attention aux autres et les conséquences de la méchanceté.Avec un texte rimé et des découpes simples qui représentent habilement la complexité des sentiments. En amitié, un mot blessant crée parfois une fissure qui ne fait que grandir... Mais que se passe-t-il lorsque l’on sème la gentillesse et la bienveillance ? Grâce à de belles illustrations imprégnées de symbolisme et des découpes astucieuses, Britta Teckentrup met en regard les comportements égoïstes qui créent des fossés obscurs entre les personnes, et la magie de mots doux ou de gestes tendres qui illuminent nos journées, effacent nos peines et font naître l’affection. Pour célébrer les valeurs de l’amitié et instaurer un dialogue parents-enfants.",isbn:"9791026402718",extraUrl:"https://www.babelio.com/couv/CVT_LARBRE-DE-LA-GENTILLESSE_9130.jpg"},
  {t:"Un chat, deux chats, trop de chats...",a:"Hodgson",y:"DL 2026",ed:"Glénat Jeunesse",cote:"A HOD",pub:"Jeune",sup:"Imprimé",d:"Des chats se sont faufilés sous les volets et les pop-ups de ce livre animé. Combien sont-ils ? Tu donnes ta langue aux chats ? A toi de les retrouver et de les compter ! Un livre plein de surprises, tout en poils et en couleurs !",isbn:"9791026405283",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791026405283-475x500-1.jpg"},
  {t:"Cochon caché !",a:"Aaron",y:"DL 2026",ed:"Gallimard",cote:"A AAR",pub:"Jeune",sup:"Imprimé",d:"L'histoire hilarante d'une héroïne qui ne fait rien comme tout le monde et qui aimerait bien qu'on l'accepte comme elle est ! Mimi a un secret : elle est un cochon ! Aucun des singes avec qui elle vit dans la jungle ne s'en est aperçu. Sauf Raymond, leur chef, qui a des soupçons...",isbn:"9782075237819",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075237819-475x500-1.jpg"},
  {t:"Il paraît que",a:"Tallec",y:"DL 2026",ed:"L'École des loisirs",cote:"A TAL",pub:"Jeune",sup:"Imprimé",d:"J'ai avalé un pépin de pomme sans faire exprès... Il paraît que si on avale un pépin, on a un arbre qui pousse à l'intérieur. Si ça se trouve, les pommiers du vieux verger sont des gens qui ont avalé un pépin de pomme ! Günther m'a dit que si on avale un pépin de pomme rouge, on a un arbre rouge qui pousse dans le ventre. Non... ça ne peut pas vraiment arriver, hein ?",isbn:"9782211350983",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782211350983-475x500-1.jpg"},
  {t:"Où est ta tétine ?",a:"Van Genechten",y:"DL 2024",ed:"Albin Michel",cote:"A VAN",pub:"Jeune",sup:"Imprimé",d:"Petite Souris est vraiment très curieuse. Elle veut tout comprendre et tout voir... même les tétines de ses amis. Et ils en ont beaucoup ! Mais que va-t-elle faire de toutes ces tétines ?Un livre plein d'humour pour apprendre à dire au revoir à sa tétine",isbn:"9782226488367",extraUrl:"https://m.media-amazon.com/images/I/416vnYZxc1L._SX195_.jpg"},
  {t:"Monstre rose",a:"Dios",y:"DL 2026",ed:"Père Fouettard",cote:"A DIO",pub:"Jeune",sup:"Imprimé",d:"Monstre Rose est trop grand, trop rose, trop tout. Enfin c'est ce qu'il croit, ais ce ne sont pas les autres qui vont le contredire. Alors direction un monde à sa taille !",isbn:"9782371651494",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782371651494-475x500-1.jpg"},
