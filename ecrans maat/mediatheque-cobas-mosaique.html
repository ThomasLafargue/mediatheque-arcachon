  {t:"Nous qui avons connu Solange",a:"Vareille Marie",y:"2026",ed:"Flammarion",cote:"R VAR",pub:"Adulte",sup:"Imprimé",d:"Sarégnac, Corrèze. Célestine grandit dans la ferme familiale, bien décidée à réussir ses études pour échapper à la vie de labeur qui l'attend aux champs. Cadiran, Gironde. Solange est internée dans une école de préservation pour jeunes filles où sont envoyées des adolescentes jugées \"déviantes\". Quel secret lie ces deux jeunes femmes ? Pourquoi Solange déteste-t-elle tant Célestine ? Et comment cette dernière a-t-elle pu commettre l'irréparable ? De la France de nos grands-parents jusqu'à nos jours, cette intrigue poignante ménage autant de suspense que de rebondissements. A travers les destinées de quatre générations de femmes puissantes, Marie Vareille retrace l'extraordinaire évolution de notre monde depuis un siècle et nous rappelle ce que nous devons tous à la persévérance et au courage de nos aînées.",isbn:"9782080476418",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080476418-M.jpg"},
  {t:"Tu m'avais promis",a:"Ankaoua Maud",y:"2026",ed:"Eyrolles",cote:"R ANK",pub:"Adulte",sup:"Imprimé",d:"Et si une promesse pouvait transformer votre destin ? Luce compte les jours depuis trois ans ! Son père, Gabin, lui avait fait la promesse de l'emmener en voyage pour ses huit ans. Malgré ses appréhensions, le quadragénaire sait qu'il doit honorer son engagement, et la décision est prise : ils s'envoleront bientôt pour rejoindre la tante de la petite fille en mission vétérinaire au Kenya. Mais le départ a un goût doux-amer : l'absence de Julie, la maman de Luce et la femme de Gabin, leur serre le coeur à tous les deux. Elle a disparu il y a déjà sept ans, sans que jamais sa trace soit retrouvée. Gabin est prisonnier de cette incertitude, ignorant s'il a le droit ou non de conserver une forme d'espoir. Lorsqu'ils atterrissent à Nairobi, il est loin de se douter que les semaines qui l'attendent ne seront pas seulement l'occasion pour lui de partager un beau voyage avec sa fille, mais le cadre d'une transformation intérieure, sur le chemin de la résilience et de la joie profonde. Entre rires et larmes, rencontres bouleversantes et révélations, ce roman puissant sur la force de l'âme nous rappelle que même dans nos plus grandes blessures se cachent les graines de notre renaissance. Une leçon d'espoir et de sagesse qui touche au coeur de ce qui nous rend profondément humains.",isbn:"9782416024542",extraUrl:"https://covers.openlibrary.org/b/isbn/9782416024542-M.jpg"},
  {t:"Comment habiller un garçon",a:"Martinez Cyrille",y:"2026",ed:"Verticales",cote:"R MAR",pub:"Adulte",sup:"Imprimé",d:"\"Avant de connaître les mods, j'en étais presque à regretter la Renaissance, la poudre sur le visage, les rouges à lèvre gras, la perruque lourde, les bijoux voyants, les habits tapageurs, tellement je trouvais ça triste de s'habiller en garçon\". Avignon, début des années 1990. Un jeune homme désoeuvré est initié aux codes vestimentaires des mods, une sous-culture née dans la working class anglaise des sixties. Chaque chapitre propose une aventure, extravagante ou burlesque, liée à une pièce de ce vestiaire jusqu'à ce que la tenue soit complète, et la vie du narrateur réinventée. Un roman en forme d'histoire intime de la mode masculine.",isbn:"9782073123329",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073123329-M.jpg"},
  {t:"Chiens",a:"Viteau Julien",y:"2026",ed:"Editions Verdier",cote:"R VIT",pub:"Adulte",sup:"Imprimé",d:"1985. A quinze ans, le narrateur travaille dans une librairie du Touquet. Il doit cet emploi à François, un ami de la famille. Si les journées sont consacrées aux livres, les soirées et les nuits sont celles d'un adolescent avec ses désirs d'amour et d'amitié. Ce sont aussi les premières vacances pour explorer la danse, la liberté des corps dans les dunes et les discussions jusqu'à l'aube. Une vie en quatre mois, dilatée dans l'écriture de l'intime et de l'introspection.",isbn:"9782378562793",extraUrl:"https://covers.openlibrary.org/b/isbn/9782378562793-M.jpg"},
  {t:"L'émerveillement",a:"Valognes Aurélie",y:"2026",ed:"Jean-Claude Lattès",cote:"R VAL",pub:"Adulte",sup:"Imprimé",d:"Avec plus de 5 millions de livres vendus, Aurélie Valognes est une figure incontournable de la littérature contemporaine. Née en 1983 à Châtenay-Malabry, l'écrivaine a publié plus de dix romans, dont Mémé dans les orties, Au petit bonheur la chance, Né sous une bonne étoile, ou encore L'Envol, qui ont tous connu un succès retentissant et sont traduits dans plus de quinze langues. La Fugue, publiée en 2025 chez JC Lattés, a conquis lecteurs et critiques.",isbn:"9782709676465",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709676465-M.jpg"},
  {t:"Habibi Beyrouth",a:"Salamé Manal",y:"2026",ed:"La Tribu",cote:"R SAL",pub:"Adulte",sup:"Imprimé",d:"\"Un matin, je me suis réveillée en rêvant que je ne parlais plus l'arabe. J'ai compris qu'il fallait rentrer.\" Après dix-sept ans en France, loin de son pays natal, Amal revient à Beyrouth pour obtenir une carte d'identité. Mais ce qui ne devait être qu'une simple formalité se révèle beaucoup plus compliqué que prévu et Amal doit prolonger son séjour. Ses démarches administratives la conduisent des rues palpitantes de la capitale jusqu'au sud du pays, dans son village familial désormais tenu d'une main de fer par le Hezbollah. Elle devra affronter ce qu'elle avait fui : la tyrannie des apparences, les sales rumeurs réservées aux femmes non mariées et sans enfants. La traversée de ce pays aussi beau que tourmenté devient un voyage au coeur de la mémoire et des blessures de l'exil.",isbn:"9782487858459",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487858459-M.jpg"},
  {t:"Cycle 4 - Voyage au centr des terres",a:"Filippi Denis-Pierre",y:"2025",ed:"Vents d'Ouest",cote:"BDJ FIL",pub:"Jeunesse",sup:"Imprimé",d:"La quête ultime Egypte. Emilien, Noémie et Mathilde se retrouvent au coeur du désert. Traqués par Ursula et ses sbires qui veulent récupérer la sphère d'activation, les enfants n'ont d'autre choix que de faire confiance à leur guide Sélim et de fuir à bord d'une felouque des sables. Sous une chaleur écrasante, ils parviennent à franchir le mur de sable d'une tempête errante. Bientôt, ils atterrissent dans une cité cachée qui se trouve être le berceau de la civilisation ayant créé les technologies obscures ! Les enfants n'en croient pas leur yeux et l'espoir de retrouver leurs parents renaît ! Mais en explorant ce lieu, ils sont confrontés à une nouvelle menace : de monstrueux robots sauvages qui n'ont rien à voir avec leur gentil Robby les prennent en chasse... Par chance, Kiritsu et ses robots ninjas viennent en aide à nos jeunes explorateurs. Finalement coincés dans une antique bâtisse, encerclés par une horde de robots, il leur reste peu de temps pour percer le secret qui sommeille dans cet endroit mystérieux. Après avoir sillonné le monde, les enfants touchent presque au but. Parviendront-ils à retrouver leurs parents et à élucider l'énigme de l'origine des technologies obscures ? Ce dernier tome plein de rebondissements clôt une incroyable série fantastique qui a captivé les lecteurs depuis 2012 grâce à ses nombreuses péripéties, son intrigue bien ficelée et une galerie de personnages toujours en quête de vérité. Une saga à ne pas manquer !",isbn:"9782749310350",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310350-475x500-1.jpg"},
  {t:"La notaire",a:"Glowacki Ingrid",y:"2026",ed:"Albin Michel",cote:"R GLO",pub:"Adulte",sup:"Imprimé",d:"Glowacki maîtrise tant l'art du suspense qu'elle relève son défi haut la main. Version Fémina Perspicace, hypersensible, un brin décalée, Anna, notaire, sait d'expérience qu'héritage rime souvent avec carnage. Les héritiers qui font appel à ses services ignorent en revanche qu'au-delà des clauses testamentaires, Anna perce leurs secrets, tous leurs secrets... Un vieux château au fin fond du Morvan, un intendant sinistre, une comtesse privée de droits et, bientôt, un meurtre : Ingrid Glowacki abat ses cartes. A vous de jouer. Ingrid Glowacki a exercé le métier de notaire. Elle s'est largement inspirée de son expérience pour écrire ce roman.",isbn:"9782226510112",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226510112-M.jpg"},
  {t:"Woke Up Like This",a:"Lea Amy",y:"2026",ed:"Flammarion",cote:"J LEA",pub:"Adolescent",sup:"Imprimé",d:"Organiser le bal de promo parfait est la dernière tâche parfaite à accomplir sur la liste parfaite de Charlotte Wu. Tout irait bien si l'insupportablement désinvolte (et très beau) J. T. Renner, n'avait pas décidé de lui gâcher la vie jusqu'au bout en devenant président du comité des élèves... De rivalités en sarcasmes, un \"accident de décoration\" survient et vingt-quatre heures plus tard, tous deux se réveillent côte à côte dans un lit inconnu : ils ont 30 ans et ils sont fiancés ! Passer à l'âge adulte, savourer le moment présent : une comédie romantique pétillante et irrésistible.",isbn:"9782080493712",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782080493712-475x500-1.jpg"},
  {t:"Hulda",a:"Jónasson Ragnar",y:"2026",ed:"La Martinière",cote:"R JON",pub:"Adulte",sup:"Imprimé",d:"Un soir de novembre 1980, un ours en peluche refait surface dans un pavillon de chasse du nord islandais. Ce simple jouet pourrait être la clé d'un mystère volontairement enfoui : une disparition d'enfant vieille de vingt ans, jamais élucidée. La jeune inspectrice Hulda Hermannsdóttir est envoyée dans cette vallée isolée. Dans un paysage hivernal hostile, Hulda affronte les silences d'un village replié sur lui-même, en même temps que la poursuivent les fantômes de sa propre vie.",isbn:"9791040123989",extraUrl:"https://covers.openlibrary.org/b/isbn/9791040123989-M.jpg"},
  {t:"Sous les vagues de Barcelone",a:"Blancard Gabriel",y:"2026",ed:"Maison Pop",cote:"R BLA",pub:"Adulte",sup:"Imprimé",d:"Architecte rigoureuse, Bianca a étouffé ses origines espagnoles sous le béton parisien. Entre sa thèse, son emploi dans un cabinet et sa routine avec Gontran, tout est sous contrôle. Peut-être trop. Son quotidien vacille lorsqu'elle est chargée d'expertiser la verrière d'un hôtel particulier pour Brigitte Viard, cliente aussi fortunée qu'exubérante. Sous la poussière des décennies, gravée dans le métal, une signature attire son regard : \"C. Vilá, 1900\" . Au fil de ses recherches, dans les couloirs feutrés des archives et les rues dansantes de Barcelone, Bianca découvre l'histoire de Juan Carmen Vilá, dont le travail a été éclipsé par l'oeuvre d'Antoni Gaudí. Au coeur de la capitale catalane, aux prémices de l'Art nouveau, et au plus près de ses racines familiales, Bianca se lance sur les traces de cette figure oubliée, dont le nom résonne étrangement en elle. Deux destins séparés par le temps, unis par une même question : comment laisser son empreinte sans se perdre soi-même ?",isbn:"9782488201704",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488201704-M.jpg"},
  {t:"Pourquôôââ ?",a:"Voutch",y:"2026",ed:"Thierry Magnier",cote:"A VOU",pub:"Jeunesse",sup:"Imprimé",d:"Les enfants grenouilles sont comme les autres : ils sont curieux. Et quand vient l'heure de dormir, leur curiosité s'aiguise d'autant plus. Les parents grenouilles se retrouvent alors face à une avalanche de \"Pourquôôôâââ ? \" qui semblent intarissables. Sauront-ils y répondre sans perdre leur sang-froid ? !",isbn:"9791035209285",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209285-475x500-1.jpg"},
  {t:"Inventaire de la basse période",a:"Dantzig Charles",y:"2026",ed:"Grasset & Fasquelle",cote:"844 DAN",pub:"Adulte",sup:"Imprimé",d:"Le monde occidental vit un moment à la fois piteux et menaçant. Ce moment, Charles Dantzig l'appelle la Basse Période. Basse, comme il y a marée basse ; période, parce que les choses n'ont pas encore suffisamment duré pour pouvoir être qualifiées d'époque. Nous pensions les barbares à l'extérieur. Quel optimisme. Ils sont à l'intérieur, et à l'oeuvre. La réaction la plus glaciale est au pouvoir dans bien des pays, souvent portée par une alliance entre des milliardaires et une partie de l'électorat qu'ils ont enragée. Cet Inventaire établit l'accumulation des faits anciens et récents qui, joints à cette volonté de conspirateurs en plein jour, sont devenus des causes : l'injure institutionnalisée, l'abandon du droit au profit de la force, la destruction de toute culture, la course à l'obéissance, un narcissisme féroce... Direction : la tyrannie, dans cet espace mental nommé Occident pourtant fondé contre elle. Ses ennemis intérieurs cherchent à créer un nouvel espace mental d'archaïsme moral joint à la technique la plus perfectionnée. Et parmi cela, la vie, la vie qui continue, distraite, frivole, avec l'amour, la jalousie, la sexualité... qui ne sont pas des absolus. Les sentiments sont aussi des produits du monde où ils apparaissent. Et eux aussi changent, et bien souvent dans le sens de la réaction contre toute humanité. La marée remontera-t-elle ou la tyrannie nous entraînera-t-elle par le fond ?",isbn:"9782246845324",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246845324-M.jpg"},
  {t:"Sans carte ni boussole",a:"Hall Meredith",y:"2026",ed:"Philippe Rey",cote:"R HAL",pub:"Adulte",sup:"Imprimé",d:"Meredith grandit dans la campagne du New Hampshire, au sein d'une de ces \"bonnes familles\" pour qui les apparences comptent plus que tout. Un quotidien réglé où elle se sent importante et aimée, malgré un père absent qui s'est très tôt remarié. Mais lorsque sa mère traverse à son tour une période de changements tumultueux, l'adolescente se retrouve livrée à elle-même et bientôt tombe enceinte d'un homme de vingt ans, inconscient et cynique. Nous sommes en 1965, Meredith a alors seize ans. Expulsée de son lycée, chassée par sa mère et envoyée chez son père dans une maison froide et vide, elle vit seule sa grossesse avant d'accoucher d'un enfant, immédiatement placé à l'adoption sans qu'elle ait son mot à dire. S'ensuivent vingt ans de détresse et d'errance, qui mènent Meredith à fuir toujours plus loin, en Europe, au Moyen-Orient, en équilibre au bord du monde. Même la naissance de deux autres enfants ne réussit pas à susciter l'espoir d'un avenir meilleur - jusqu'au jour où son fils perdu retrouve sa trace. Est-elle prête à l'accueillir ? L'autrice du magistral roman Plus grands que le mande retrace ici son parcours avec sincérité et subtilité. Un voyage inoubliable, qui pose de manière lumineuse la question du pardon au sein d'une famille meurtrie.",isbn:"9782384822768",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384822768-M.jpg"},
  {t:"Un balcon à Naples",a:"Elamine Juliette",y:"2026",ed:"Maison Pop",cote:"R ELA",pub:"Adulte",sup:"Imprimé",d:"Anita, jeune chercheuse française, sillonne l'Italie pour redonner une voix aux héroïnes de la Résistance à travers sa thèse. Après Rome et Milan, sa route la mène à Naples, dans une petite auberge nichée sur le pont Sanità. Lorsqu'elle pose ses valises, la jeune femme reçoit un étrange guide aux allures de jeu de piste confié par Gabriella, la propriétaire, l'invitant à découvrir la ville sous un jour nouveau. Entre les ruelles bouillonnantes du quartier de la Sanità et les récits vibrants de Leone, un réceptionniste aussi troublant qu'érudit, l'Histoire se confronte à la réalité brute des marques laissées par la guerre. Dans cette ville où le passé ne meurt jamais, Anita s'apprête à découvrir que les archives les plus précieuses ne se trouvent pas toujours dans les bibliothèques, mais dans le coeur de ceux qui se souviennent.",isbn:"9782488201650",extraUrl:"https://covers.openlibrary.org/b/isbn/9782488201650-M.jpg"},
  {t:"Mon cerveau sous emprise",a:"Michelon Pascale",y:"2026",ed:"Leduc",cote:"155.2 MIC",pub:"Adulte",sup:"Imprimé",d:"L'emprise combine manipulation, contrôle et abus pour vulnérabiliser et maîtriser autrui. Violente, elle est souvent incompréhensible. Comment un être humain peut-il en faire souffrir un autre de la sorte ? Et pourquoi la personne ciblée reste-t-elle en lien ? Aujourd'hui, les neurosciences offrent des réponses à ces questions : l'emprise remodèle le cerveau des personnes prises au piège, provoquant confusion et dépendance. Du côté des auteurs d'emprise, la neuroimagerie révèle des dysfonctionnements émotionnels et relationnels. Ce livre, écrit du point de vue de la personne sous emprise, permet de prendre conscience des mécanismes cérébraux et psychologiques à l'oeuvre. Il propose également des solutions pour échapper à la violence de la situation et éviter sa répétition. une approche neuroscientifique qui offre : > Une perspective inédite par la compréhension de ce qui se joue à la fois dans le cerveau des auteurs d'emprise et dans celui de leurs cibles. > Une vision factuelle et déculpabilisante de ce qu'est une relation d'emprise. > Des pistes concrètes pour se libérer, grâce à la plasticité neuronale. Accessible et riche de nombreux cas, Mon cerveau sous emprise s'adresse à vous, qui avez vécu ou vivez encore une relation d'emprise. Il sera également précieux pour vos proches et pour les professionnels qui vous accompagnent. Il ouvre la voie vers l'action et la libération. Pascale Michelon est docteure en neurosciences et psychologue. Après une carrière dans la recherche scientifique aux Etats-Unis, elle ouvre un cabinet de consultation à Genève. Ses années d'accompagnement et d'étude du cerveau lui ont donné une compréhension en profondeur du fonctionnement humain et des relations. Elle a publié Au coeur des cerveaux hauts potentiels et hypersensibles chez Leduc.",isbn:"9791028534066",extraUrl:"https://covers.openlibrary.org/b/isbn/9791028534066-M.jpg"},
  {t:"Pourquoi je mens",a:"Klein Pauline",y:"2026",ed:"Gallimard",cote:"R KLE",pub:"Adulte",sup:"Imprimé",d:"\"Je doutais de la fiabilité de mes souvenirs. De tous les souvenirs. Je savais bien que dans le fond ils étaient inventés. Et cette propension à l'invention s'est répandue comme un liquide\". Pourquoi sabotons-nous nos relations amoureuses ? Alors que la narratrice, Pauline, quarante-cinq ans, retrouve Roman, son amour de jeunesse, vient l'heure du bilan. Elle rouvre un dossier qu'elle croyait clos : celui de son père, cet homme si beau et si malheureux dont elle ignore tout, sinon qu'il est mort mystérieusement lorsqu'elle avait dix ans. En revenant sur les silences qui entourent ce personnage trouble, elle interroge son propre sens du drame et son penchant pour la mythomanie, qui lui ont valu tant de déboires sentimentaux. Aidée d'un détective privé à l'imagination rocambolesque, elle remonte, avec espièglerie, la piste de ce père méconnu qui a déterminé sa vie. A partir d'archives, de témoignages et de ses rares souvenirs, elle explore des hypothèses. Cherche des secrets. Attend de grandes révélations. Au risque de découvrir que, en amour comme dans l'existence, les histoires qu'on se raconte l'emportent bien souvent sur la réalité... Ce roman poignant, plein de fantaisie et d'humour, explore ce que sont les pères pour les filles, et la part d'ombre que l'on reçoit en héritage.",isbn:"9782073129710",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073129710-M.jpg"},
  {t:"Volare",a:"Giuliano Serena",y:"2026",ed:"Calmann-Lévy",cote:"R GIU",pub:"Adulte",sup:"Imprimé",d:"Ambre a tout pour être heureuse : un métier qu'elle aime au milieu d'adolescents en pleine crise, Manuela, sa meilleure amie excentrique, des soeurs jumelles qu'elle chérit comme une mère, et un drôle d'animal de compagnie à l'aile brisée. Alors, elle ne comprend pas ce manque d'énergie qui la plaque au fond de son lit et cette lassitude pour tout ce qui faisait le sel de sa vie. \"Dépression\", lui dit le médecin. Elle, dépressive ? Manuela prend les choses en main et l'expédie en Sicile, où sa cousine organise des retraites spirituelles. La spiritualité, ce n'est pas trop le truc d'Ambre ; mais le soleil, la mer, une vespa, Stromboli, les cannoli... Pourquoi pas, au fond. Cela pourrait lui redonner envie de vivre, tout simplement.",isbn:"9782702194423",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702194423-M.jpg"},
  {t:"Le voyage dans le temps",a:"Mallorquí César",y:"2026",ed:"Editions Casterman",cote:"J MAL",pub:"Jeunesse",sup:"Imprimé",d:"Une suite attendue pour la série à succès ! Quand un bébé nommé Kid est laissé à l'entrée de l'école Zener, Axel est loin de s'imaginer qu'il s'apprête à vivre sa plus folle aventure ! Car si le bambin semble a priori inoffensif, il est capable de voyager à travers le temps et l'espace. C'est ainsi qu'Axel, Lola et Treize se retrouvent malgré eux projetés d'une bataille médiévale à la destruction de Pompéi au péril de leurs vies... Mais la situation dégénère encore quand des créatures tout droit sorties de la préhistoire commencent à apparaître dans le pensionnat. Le temps presse, Axel et ses amis doivent trouver un moyen d'arrêter cet enfant avant qu'il ne détruise l'école !",isbn:"9782203300187",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300187-475x500-1.jpg"},
  {t:"La voisine sans histoire",a:"Nugent Liz",y:"2026",ed:"Michel Lafon",cote:"R NUG",pub:"Adulte",sup:"Imprimé",d:"VOTRE VOISINE N'EST PAS TOUJOURS CELLE QUE VOUS CROYEZ... Sally Diamond déteste les surprises et les questions. Elle obéit toujours aux consignes à la lettre. Même quand son père lui fait part d'une étrange dernière volonté, au risque de voir la police et les médias attirer l'attention sur elle... Mais les journalistes ne sont pas les seuls à l'observer : quand des missives signées par un mystérieux \"S\", apparaissent dans sa boite aux lettres, Sally ne peut plus échapper à son passé.",isbn:"9782749960180",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749960180-M.jpg"},
  {t:"Corps célestes à la lisière du monde",a:"Stefánsson Jón Kalman",y:"2026",ed:"Christian Bourgois éditeur",cote:"R STE",pub:"Adulte",sup:"Imprimé",d:"Islande, XVIIe siècle. Le révérend Pétur, un homme tourmenté précédé d'une réputation sulfureuse, écrit une longue lettre à une destinataire mystérieuse. Après des études à Copenhague et un séjour en Angleterre, il a été nommé à la paroisse de Brúnisandur dans les fjords de l'Ouest. A son arrivée, Pétur est accueilli par la servante Dóróthea, une femme à la mémoire prodigieuse et au caractère affirmé. Elle deviendra rapidement un soutien indéfectible face à l'adversité et dans son projet de relater les événements tragiques qui secouent l'île : le bailli Ari Magnússon - représentant de la couronne danoise - a décidé de s'attaquer aux pêcheurs espagnols échoués sur l'île après le naufrage de leurs bateaux, et Pétur tente d'empêcher le pire. Son récit oscille entre le passé et le présent, l'intime et le politique, et met en scène des personnages inoubliables - un capitaine anglais amoureux de l'Islande, la chienne Sappho, les pêcheurs espagnols Pedro et Sebastián, la mystérieuse Helga - pour raconter cette tragédie qui compte parmi les pages les plus sombres de l'histoire de l'Islande. Corps célestes à la lisière du monde est un très grand roman, assurément l'un des plus puissants de Stefánsson, à la résonance très contemporaine.",isbn:"9782267058376",extraUrl:"https://covers.openlibrary.org/b/isbn/9782267058376-M.jpg"},
  {t:"Ulysse",a:"Joyce James",y:"2004",ed:"Gallimard",cote:"823 JOY",pub:"Adulte",sup:"Imprimé",d:"Une première traduction de l'Ulysse de James Joyce, de la plume d'Auguste Morel, assisté à des degrés divers par Stuart Gilbert, Valery Larbaud et l'auteur, a vu le jour en 1929 à La maison des Amis des Livres d'Adrienne Monnier. Elle a donc dépassé \" l'âge antédiluvien maximum de 70 ans \", que James Joyce prend soin de rappeler dans son livre après avoir dûment établi l'étroite correspondance entre la littérature et l'existence humaine... La présente traduction s'adresse, elle, aux générations d'aujourd'hui, pour lesquelles la lecture, l'écriture, et leur intrication, constitutive de la tradition littéraire, introduisent à un univers autre, textuel, marqué par la diversité et la polyphonie. Ce parti explique le choix fait des traducteurs : un tiers de ces pages a été traduit par des écrivains, un autre par un traducteur littéraire, un troisième par des universitaires.",isbn:"9782070763498",extraUrl:"https://covers.openlibrary.org/b/isbn/9782070763498-M.jpg"},
  {t:"Les Buddenbrook",a:"Mann Thomas",y:"2014",ed:"LGF (Le Livre de poche)",cote:"RMAN",pub:"Adulte",sup:"Imprimé",d:"Les Buddenbrook, premier roman de Thomas Mann, devenu l'un des classiques de la littérature allemande, , retrace l'effondrement progressif d'une grande famille de la Hanse, de Johann, le solide fondateur de la dynastie, à Hanno, le frêle musicien qui s'éteint quarante ans plus tard dans un pavillon de banlieue. Le style, tout en nuances, où l'émotion se teinte de connivence et d'ironie, d'affinités et de détachement, traduit parfaitement la relation que l'auteur entretient avec la réalité et accentue subtilement la transcription du lent processus de décadence. Les Buddenbrook ou le grand livre de la dégénérescence.",isbn:"9782253063193",extraUrl:"https://covers.openlibrary.org/b/isbn/9782253063193-M.jpg"},
  {t:"Quatre filles et une coloc",a:"Tsuno Mizoko",y:"2026",ed:"Groupe Delcourt",cote:"BD QUA",pub:"Jeunesse",sup:"Imprimé",d:"Employée de bureau de 28 ans, Shûko Maeda vit en colocation avec trois amies : Eika Matsuki, une forcenée du travail, Misaki Kawaseda, une artiste romantique, et Shio Momoyama, une indépendante née sous une bonne étoile",isbn:"9782413090250",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413090250-M.jpg"},
  {t:"Tu ne tueras point",a:"Pobi Robert",y:"2026",ed:"Editions Les Arènes",cote:"R POB",pub:"Adulte",sup:"Imprimé",d:"New York, par une nuit glacée En accompagnant sa femme, chirurgienne, à un gala de bienfaisance, Lucas Page est frappé par une vidéo d'hommage aux disparus de l'année : trop de médecins sont morts dans des circonstances étranges, accidents troublants ou suicides inexpliqués. Astrophysicien bourru, professeur d'université atrabilaire et ancien agent du FBI, le Dr Lucas Page est doté d'un don unique pour déceler les schémas cachés derrière les chiffres et les statistiques. Il comprend que quelque chose ne tourne pas rond... Et si les médecins étaient pris pour cible par un tueur particulièrement intelligent ? Et si la prochaine cible n'était autre que sa femme ? Alors qu'il s'était juré de se retirer, Page se trouve entraîné malgré lui dans la traque d'un nouveau tueur en série redoutable. \" Un personnage fascinant. Ce livre va faire frémir vos neurones. \" Associated Press \" Un thriller implacable ! Les rebondissements tiennent le lecteur en haleine jusqu'à la fin. \" Publishers Weekly",isbn:"9791037515704",extraUrl:"https://covers.openlibrary.org/b/isbn/9791037515704-M.jpg"},
  {t:"Même pas morte",a:"Rioux Geneviève",y:"2026",ed:"Stock",cote:"R RIO",pub:"Adulte",sup:"Imprimé",d:"27 mars 2016. Steph est victime d'une tentative de viol et de meurtre au coeur de la nuit. Son agresseur, qui l'a laissée pour morte, ignore qu'elle tire sa force des récits d'une autre survivante, sa mère, attaquée seize ans auparavant dans des circonstances d'une troublante similarité. Une question brûle : qui est le coupable ? Un inconnu, un ami, un proche ? Steph fera tout pour découvrir l'identité de celui qu'elle a combattu et qui l'a emmenée à la lisière de la mort. Pour comprendre son geste et, peut-être un jour, guérir. Récit d'une enquête judiciaire haletante, quête profonde de justice, ce premier roman saisissant, inspiré du vécu de l'autrice, est un cri de vie.",isbn:"9782234099449",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234099449-M.jpg"},
  {t:"Lyndon",a:"Marchesini Irene",y:"2026",ed:"Le Lombard",cote:"BD MAR",pub:"Adulte",sup:"Imprimé",d:"Le nouveau roman graphique coup de coeur des autrices de Rebis. Écosse. Fin du XIXe siècle. Lyndon est un jeune enseignant souffrant de graves troubles anxieux. Afin d'apaiser ses tourments, il décide de fuir l'agitation londonienne pour partir enseigner dans une petite école sur une île au large des côtes écossaises. Mais lorsqu'un de ses élèves disparaît, le passé de Lyndon ressurgit. Dans une lande brumeuse où les croyances et les esprits semblent encore bien vivants, les villageois préfèrent éviter de s'intéresser de trop près à cette disparition. Seuls Lyndon et le frère aîné du petit disparu décident de partir à la recherche de l'enfant. Au fur et à mesure de leur enquête, les deux hommes en apprendront davantage l'un sur l'autre, mais aussi peut-être sur eux-mêmes.",isbn:"9782808215565",extraUrl:"https://covers.openlibrary.org/b/isbn/9782808215565-M.jpg"},
  {t:"J'irai jusqu'au bout de vos nuits",a:"Gutmann Caroline",y:"2026",ed:"Editions de l'Observatoire",cote:"R GUT",pub:"Adulte",sup:"Imprimé",d:"Paris, l'été. Après une opération au cerveau, Caroline Mendel, lasse de ses rendez-vous à l'hôpital dans la capitale désertée, cherche une échappatoire. C'est au parc Montsouris qu'elle va la trouver : grâce à la rencontre d'une vieille dame fantasque, elle découvre le mystère du palais du Bardo. Reproduction du palais du bey de Tunis et haut lieu de science, il a trôné pendant plus de cent vingt ans sur la colline de Montsouris, avant de disparaître le 5 mars 1991 dans un incendie dont on n'a jamais su l'origine. La narratrice se livre alors à un véritable jeu de pistes. D'un palais oublié aux laboratoires de l'Empire allemand, de la grande chimiste Clara Immerwahr, suicidée par idéal pacifiste, à une histoire d'amour lourde de secrets, elle tente à tout prix d'élucider cette \" affaire du Bardo \". Enquête passionnante autour d'un joyau disparu de Paris qui donne voix à des femmes que l'on a longtemps tenté de réduire au silence, J'irai jusqu'au bout de vos nuits nous rappelle que si la mémoire est oublieuse, il reste toujours, dans les cendres, des traces du passé.",isbn:"9791032938423",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032938423-M.jpg"},
  {t:"Mashle",a:"Komoto Hajime",y:"2024",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeunesse",sup:"Imprimé",d:"Innocent Zero a atteint le stade ultime de son évolution et est désormais l'égal d'un dieu... Désespérés, les habitants du monde de la magie n'ont d'autre choix que de se prosterner à ses pieds. Mais c'est compter sans Mash, qui, avec sa musculature d'une tout autre dimension, s'est façonné une technique ravageuse ! Même mis en difficulté par son adversaire, il revient encore et toujours à la charge, galvanisé par le soutien du peuple tout entier ! Mash va-t-il prouver une dernière fois que la force de ses muscles et celle de son amitié sont capables d'accomplir des miracles ? !",isbn:"9782820348029",extraUrl:"https://covers.openlibrary.org/b/isbn/9782820348029-M.jpg"},
  {t:"Schmoof le Chien",a:"McKinnon Heidi",y:"2026",ed:"Editions L'Elan vert",cote:"A MCK",pub:"Jeunesse",sup:"Imprimé",d:"Schmoof est doux. Schmoof est le plus doux, câlin, mignon des toutous ! Schmoof a hâte de se faire un ami. Et Floof ?",isbn:"9782844559227",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782844559227-475x500-1.jpg"},
  {t:"Les mystères de Sinclair. Le vol du moineau d'or",a:"Woodfine Katherine",y:"2026",ed:"Poulpe fictions",cote:"J WOO",pub:"Jeunesse",sup:"Imprimé",d:"Bienvenue chez Sinclair, le plus grand et le plus élégant magasin de Londres ! Sophie, une jeune orpheline débrouillarde, vient d'y être embauchée comme vendeuse. A elle les robes en soie, les chapeaux à plumes et les vitrines somptueuses ! Mais le rêve tourne au cauchemar lorsque l'inestimable Moineau d'Or y est volé... et que Sophie est accusée ! Accompagnée de Billy, garçon d'étage fan de romans policiers, et de Lil, mannequin qui rêve de devenir actrice, réussira-t-elle à faire éclater la vérité ?",isbn:"9782377424405",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782377424405-475x500-1.jpg"},
  {t:"Komi cherche ses mots",a:"Oda Tomohito",y:"2026",ed:"Pika édition",cote:"BD KOM",pub:"Jeunesse",sup:"Imprimé",d:"Komi et Tadano sortent ensemble. L'un comme l'autre n'ayant aucune expérience, ils sont souvent malhabiles. Komi aimerait lui tenir la main mais n'arrive pas à se faire comprendre sans l'exprimer oralement. A part ça, entre la remise des diplômes et la session shopping de Komi, les uns et les autres ne manquent pas d'occasions de briller...",isbn:"9791043305269",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043305269-M.jpg"},
  {t:"Mashle",a:"Komoto Hajime",y:"2023",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeunesse",sup:"Imprimé",d:"Innocent Zero poursuit Mash après lui avoir arraché le coeur, mais est arrêté dans son élan par Domina. Ce dernier, qui avait sombré dans de la lave en fusion, resurgit pour barrer le passage à son redoutable père, au nom de l'amitié qui le lie à son ancien adversaire ! Pendant ce temps, les camarades de Mash, prêts à défier la mort, se démènent pour l'emmener auprès de Meliadoul. Réussiront-ils à atteindre leur destination malgré leurs blessures et les ennemis lancés à leurs trousses ? De son côté, Mash se retrouve à errer dans les limbes, où il fait une rencontre des plus incongrues...",isbn:"9782820346506",extraUrl:"https://covers.openlibrary.org/b/isbn/9782820346506-M.jpg"},
  {t:"Komi cherche ses mots",a:"Oda Tomohito",y:"2026",ed:"Pika édition",cote:"BD KOM",pub:"Jeunesse",sup:"Imprimé",d:"Komi est désormais en terminale ! Répartie dans la même classe que Tadano et Najimi, elle est néanmoins séparée de ses amis de la première 1, et notamment de Manbagi. Une petite inquiétude se fait sentir... alors que commence une guerre organisée entre les différentes classes du lycée ! Seconde contre première contre terminale, Komi gagnera-t-elle appuyée de nouveaux camarades toujours aussi déjantés ? !",isbn:"9791043306037",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043306037-M.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2025",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeunesse",sup:"Imprimé",d:"Nos deux motardes décident de faire une halte à l'abri qui a été le point de départ de leur périple. Une occasion pour elles de se remémorer le bon vieux temps. Elles reprendront ensuite la route vers la région du Tôhoku, au nord de l'île principale. Entre excavation de fossiles à Iwaki et pêche miraculeuse dans le lac Inawashiro, leur trépidant voyage les conduira jusqu'à Nagaoka, dans le département de Niigata.",isbn:"9791041111732",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041111732-M.jpg"},
  {t:"Skandar et la guerre de l'esprit",a:"Steadman A. F.",y:"2026",ed:"Hachette",cote:"J STE",pub:"Jeunesse",sup:"Imprimé",d:"L'Ile est en guerre. Skandar, devenu hors-la-loi, se cache depuis que Rex Manning a révélé l'identité de sa mère lors de la dernière Coupe du Chaos. Mais alors que Rex se prépare à envahir le continent, les habitants de l'Ile ne savent plus à qui se fier. Et après la trahison de Florence, qui se bat maintenant pour le camp ennemi, Skandar doit construire de nouvelles alliances, y compris avec Kenna. Pour remporter la Guerre de l'Esprit, Skandar et ses amis devront remonter aux origines de l'Ile et exploiter toute la puissance de leur magie.",isbn:"9782017248378",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782017248378-475x500-1.jpg"},
  {t:"Honey Lemon Soda T15",a:"Murata Mayu",y:"2026",ed:"Nobi Nobi",cote:"BD HON",pub:"Jeunesse",sup:"Imprimé",d:"Uka Ishimori et Kai Miura filent le parfait amour depuis plus d'un an. La classe verte des terminales approche à grands pas ! S'agissant du dernier événement scolaire de ses années lycée, Uka attend ce séjour avec impatience... Mais voilà que les problèmes s'enchaînent juste avant le départ ! Le voyage se passera-t-il comme prévu ? Cinq nuits et quatre jours auprès de la personne qu'on aime, que peut-on rêver de mieux ?",isbn:"9782384966646",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384966646-M.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2024",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeunesse",sup:"Imprimé",d:"Le monde est anéanti... Partons le visiter à moto ! Après leur escale à Karuizawa, Yôko et Airi sont reparties en direction de Gunma. Sur leur chemin se trouve le fameux Mont Asama, un volcan encore actif et entrant régulièrement en éruption... et Yôko s'est soudain effondrée en respirant les gaz toxiques de ce dernier ! C'est alors qu'est apparu un jeune homme qui va leur venir en aide et les conduire jusqu'aux sources chaudes de Kusatsu...",isbn:"9791041106882",extraUrl:"https://covers.openlibrary.org/b/isbn/9791041106882-M.jpg"},
  {t:"L'inondation",a:"Modéré Armelle",y:"2026",ed:"Actes Sud",cote:"A MOD",pub:"Jeunesse",sup:"Imprimé",d:"Un soir d'orage, alors que la pluie ne cesse de tomber, la rivière déborde. La maison de Léa, enfouie dans un terrier, est submergée. Désemparée, elle fuit avec sa famille en quête d'un refuge. Mais quand tout semble désespéré, il reste toujours une lueur d'espoir.",isbn:"9782330215453",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330215453-475x500-1.jpg"},
  {t:"Ces promesses qu'on croyait éternelles",a:"Gorman Nine",y:"2025",ed:"Albin Michel",cote:"J GOR",pub:"Adolescent",sup:"Imprimé",d:"Ils pensaient que leur amitié était écrite dans les étoiles. Mais depuis leur séjour à Las Vegas, quelque chose s’est brisé entre Kenna et Kurt. Leurs regards se fuient, laissant place à l’incompréhension[xe2][x80][xa6] Dans le silence qui ponctue désormais leur relation, ils s’accrochent à leurs ultimes repères. Kenna emménage avec son cousin Wes, qui lui apporte la sécurité et la stabilité dont elle pense avoir besoin. Kurt, lui, se met en couple avec une fille qui comprend sa différence, bien qu’au fond il sache qu’une seule personne fait véritablement battre son cœur. Sa meilleure amie",isbn:"9782226503442",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226503442-M.jpg"},
  {t:"Cavillore",a:"Claes Jérémie",y:"2026",ed:"Editions Héloïse d'Ormesson",cote:"R CLA",pub:"Adulte",sup:"Imprimé",d:"De retour au village de Gourdon, Nico est renvoyé à son passé et aux meurtres non élucidés qui ont secoué le village trente ans plus tôt. Le prédateur qui sévissait à l'époque court toujours. La menace sourde plane encore. Personnage à part entière, la nature provençale colore cette intrigue de ses ombres et lumières. Quelle est cette créature qui a déposé à l'aube le cadavre d'une jeune inconnue devant l'auberge de Gourdon ? Que veut-elle exposer ? Nul ne croit vraiment à la thèse de l'accident, et dans le village à la tranquillité bousculée, les langues médisantes accusent les Camillieri, une famille de marginaux récemment installée sur les hauteurs. La rumeur enfle et détourne l'attention des ombres menaçantes qui rôdent. Déterminée à protéger les siens, la mère Camillieri se lance à leur poursuite. Mais le silence s'installe, dense comme la roche qui les cerne, et scelle les lèvres des coupables. Patience... La vérité attend son heure. Ode à la nature provençale et au lien charnel qui unit la terre et ceux qui y vivent, Cavillore est un roman noir aussi éclatant qu'un orage de montagne. Jérémie Claes embarque le lecteur dans une traque à flanc de falaise et sonde le coeur battant des hommes.",isbn:"9782487819696",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487819696-M.jpg"},
  {t:"Edmond gros mouton",a:"Mallié Vincent",y:"2026",ed:"Editions Margot",cote:"A MAL",pub:"Jeunesse",sup:"Imprimé",d:"Alors qu'il gambade derrière un papillon, Edmond se perd dans la montagne. Sans personne pour le tondre, sa laine POUSSE, POUSSE, POUSSE, et il finit par ressembler à une ENORME boule de coton ! Se faisant passer pour de gentils bergers, le loup, le renard et l'aigle vont essayer de le CROQUER. Mais ce mouton n'est pas une proie si facile...",isbn:"9782494797567",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494797567-475x500-1.jpg"},
  {t:"Mon refuge et mon orage",a:"Roy Arundhati",y:"2026",ed:"Gallimard",cote:"R ROY",pub:"Adulte",sup:"Imprimé",d:"Mon refuge et mon orage est une invitation à retrouver toute la puissance romanesque de la grande autrice indienne du Dieu des Petits Riens. Dans ce récit littéraire d'une infinie beauté, Arundhati Roy revient sur son passé : une enfance chaotique dans le sud de l'Inde, son émancipation précoce, le goût de l'écriture, la fulgurance du succès international avec le Booker Prize en 1997, puis la découverte que sa plume peut devenir une arme pour déjouer les injustices et la violence du gouvernement indien. Au fil des chapitres, c'est aussi le portrait de sa mère, Mary Roy, qui prend forme. Une grande âme, généreuse et adulée dans sa région pour y avoir bâti une école, mais qui dans l'intimité s'avérait une mère impitoyable et maltraitante. Toute sa vie durant, elle aura été pour sa fille à la fois son refuge et son orage. Dans ce livre magnifique au style luxuriant, Arundhati Roy nous ouvre les portes de sa vie hors norme et haletante, mêlée à celle d'une figure maternelle redoutable mais qui lui a transmis le goût de la liberté, et la nécessité d'écrire.",isbn:"9782073103482",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073103482-M.jpg"},
  {t:"Chair",a:"Szalay David",y:"2026",ed:"Albin Michel",cote:"R SZA",pub:"Adulte",sup:"Imprimé",d:"Lauréat du Booker Prize 2025 On sent en refermant ce roman grandiose que quelque chose d'important est arrivé à la littérature. Elle Impressionnant. Le Figaro Grandiose. L'évènement de cet hiver. Elle Dès les premières pages, on est sûr de tenir entre ses mains un grand livre. Les Echos Une expérience de lecture sensuelle et dépouillée, addictive et destabilisante. Lire Magazine [... ]fascinant. Un roman dont le laconisme, l'opacité, ne ménagent pas le lecteur et qui s'avère pourtant difficile à reposer, plus encore à oublier. Le Monde István, quinze ans, vient d'emménager avec sa mère dans un quartier modeste d'une petite ville de Hongrie. Isolé, désoeuvré, c'est par hasard qu'il se lie avec sa voisine de palier, une quadragénaire mariée. Celle-ci lui fait découvrir les plaisirs de la chair, jusqu'à ce qu'un incident mette un terme à leur relation. Après quelques années dans un centre de détention pour mineurs, István s'engage dans l'armée et combat en Irak. De retour, il part pour l'Angleterre où, travaillant comme chauffeur et agent de sécurité, il intègre la sphère de l'élite économique et politique, et tente de faire fortune dans l'immobilier. Mais par-delà son ascension sociale se cache un être fondamentalement passif, comme étranger au monde et à lui-même. Même dans son rapport au sexe. A travers la figure d'István, David Szalay décrypte la crise de la masculinité dans un monde dominé par la marchandisation, le culte de la performance et l'augmentation des inégalités. L'implacable anatomie de l'homme contemporain. Un superbe roman. Mordant, intelligent et d'une sagesse troublante... William Boyd Ce qui fait la force de Chair, c'est son style : sobre et nerveux, sans fioritures. Lionel Shirver",isbn:"9782226445995",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226445995-M.jpg"},
  {t:"Le petit Gus",a:"Desmarteau Claudine",y:"2026",ed:"Gallimard",cote:"BDJ DES",pub:"Jeunesse",sup:"Imprimé",d:"Ecole, famille, copains... des tranches de vie aussi tendres que drôles racontées par un truculent petit diable. \"Moi c'est Gus. En fait, je m'appelle Gustave, tout ça parce que les vieux prénoms moches étaient à la mode le jour où je suis né. J'aurais préféré m'appeler Brad, Bob ou même Brian, mais je suis bien obligé de me coltiner Gustave\".",isbn:"9782075226189",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075226189-475x500-1.jpg"},
  {t:"La chute de l'ordre",a:"Whyte Jack",y:"2020",ed:"Bragelonne",cote:"R WHY",pub:"Adulte",sup:"Imprimé",d:"Octobre 1307. Le roi Philippe IV fait arrêter tous les Templiers de France et saisit leurs biens avec l'aide du pape. William St. Clair réussit de justesse à s'échapper. Fuyant le pays en compagnie de quelques centaines de frères d'armes, il emporte le trésor de l'ordre. Face à cette traîtrise de la couronne, le chevalier décide qu'il est temps d'abandonner le passé : il libère ses hommes de leurs voeux d'obéissance à la papauté et les mène une dernière fois au combat lors de la bataille de Bannockburn. Une fois la victoire assurée, William et les survivants de l'ordre quittent l'Europe pour une terre de légendes : l'Amérique...",isbn:"9791028107536",extraUrl:"https://covers.openlibrary.org/b/isbn/9791028107536-M.jpg"},
  {t:"Elizabeth va très bien",a:"Dufresne-Lamy Julien",y:"2026",ed:"Jean-Claude Lattès",cote:"R DUF",pub:"Adulte",sup:"Imprimé",d:"\"Il me fallait réécrire ma mère fragile, féroce, ma mère au-dessus de sa vie, au-dessus de la mienne. Mais cette fois, pourvu que ça ait été beau\". \"Elizabeth va très bien\". Quatre mots inscrits sur un cahier par un infirmier. Quelques heures plus tard, Elizabeth est retrouvée morte dans son salon. Lorsque son fils apprend la nouvelle et revient sur les lieux maternels, des éléments inquiétants surgissent : des documents médicaux, une plainte pour harcèlement, des appels à l'aide. Qu'est-il arrivé à Elizabeth ? Avec une écriture fébrile et habitée, Julien Dufresne-Lamy déploie une enquête saisissante sur ce qu'Elizabeth a enduré, sur ce qu'il ignorait, sur leur lien fusionnel, désormais brisé. Une autre histoire se dessine : celle de toutes ces femmes qu'on abîme, délaisse, et efface sans bruit. \"Dans ce double portrait d'une femme et d'un amour dingue entre une mère et son fils, Julien Dufresne-Lamy s'y attelle avec une dignité admirable\". La Tribune Dimanche",isbn:"9782709676250",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709676250-M.jpg"},
  {t:"Les Voies souterraines",a:"Kermici Sylvain",y:"2026",ed:"Plon",cote:"R KER",pub:"Adulte",sup:"Imprimé",d:"Deux âmes à la dérive que tout aimante, jusqu'au pire... Dans un snack miteux d'une zone périphérique décrépie, Liz rencontre Joshua. Liz vient de s'enfuir de l'hôpital psychiatrique où ses parents l'ont abandonnée quelques années auparavant : depuis qu'elle est enfant, elle évolue dans un monde peuplé de fantômes et de démons qu'elle seule peut voir. Une fois sortie de ce cauchemar médicalisé et arrivée en ville, Liz erre, dans les rues, les gares, les bars. Joshua, lui, est un jeune homme en colère. Rebelle radical, il est en guerre contre toutes les normes sociales. Lui aussi est en fuite, mais pas pour les mêmes raisons : il a tué ses parents. En cavale, il n'a plus rien à perdre. Ces deux êtres à la dérive s'aimantent au premier regard. Joshua propose à Liz de partager sa chambre dans un sinistre hôtel peuplé de sans-papiers, de travailleurs précaires qui se lèvent au coeur de la nuit pour aller bosser. Joshua et Liz commencent à voler dans les chambres, de menues rapines mais c'est comme si le feu avait pris. Très vite, ils passent à la vitesse supérieure, vivent dans des squats, préparent les prochains coups. Ces deux-là se nourrissent l'un l'autre : Liz permet à Joshua d'assumer sa violence impulsive et macabre, Joshua donne à Liz l'impression de compter enfin pour quelqu'un. Un jour, Joshua repousse les limites : il demande à Liz de lui livrer des victimes pour les tuer... Les Voies souterraines est un livre vénéneux et âpre, une expérience littéraire qui marque le lecteur au fer rouge. S'inspirant des couples de serial killers comme Michel Fourniret et Monique Olivier ou le couple anglais des West, Sylvain Kermici décrit cette dynamique qui se crée entre deux personnes n'ayant plus rien à perdre mais obéissant seulement à la tyrannie du présent et à leurs pulsions destructrices. Mais aussi fascinant et dérangeant que cela puisse être, Les Voies souterraines est d'abord une histoire d'amour, et l'exploration sans fard de sa dimension noire et morbide.",isbn:"9782259322751",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259322751-M.jpg"},
  {t:"Klaus",a:"Collard Gilles",y:"2025",ed:"Climats",cote:"B KLA",pub:"Adulte",sup:"Imprimé",d:"Dans la célèbre famille du prix Nobel de littérature Thomas Mann, c'est du fils que nous pouvons tirer des leçons pour notre temps. Ecrivain précoce et prolifique, Klaus Mann invente une manière de vivre préfigurant les sexualités queer. Avec sa soeur Erika, il incarne l'esprit de la République de Weimar. Dès le début des années 1930, Klaus alerte sur les dangers qui menacent la fragile démocratie et l'Europe tout entière. En mars 1933, il prend le chemin de l'exil et devient, à travers ses romans, ses essais et la revue Die Sammlung, une figure de proue du combat contre le nazisme. Parmi les premiers déchus de la nationalité allemande, il mène une vie d'errance et de lutte entre le sud de la France, Amsterdam et New York, sans jamais renoncer à l'idéal d'un humanisme socialiste et européen. Dans ce portrait biographique passionné, qui ne sépare pas les gestes des idées, Gilles Collard redonne tout son relief à un pan entier de l'histoire intellectuelle du XX ? siècle, qui voit dialoguer Klaus Mann et Stefan Zweig, Walter Benjamin, André Gide ou encore Hannah Arendt. Il retrace l'histoire de la \"gravité désespérée\" qui fut celle de Klaus Mann. Eloigné à la fois d'un héroïsme sacrificiel et de la victimisation stérile, celui-ci n'aura jamais cédé ni sur les principes universels, ni sur sa part d'ombre, opaque et singulière. C'est cette tension, tragique et lumineuse, qui fait de Klaus Mann un modèle pour les temps troublés qui sont à nouveau les nôtres.",isbn:"9782080480101",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080480101-M.jpg"},
  {t:"Le Cataclysme",a:"Aupied Pauline",y:"2026",ed:"Gallimard",cote:"J AUP",pub:"Adolescent",sup:"Imprimé",d:"Eléments déchaînés, tentation du mal et destins tragiques : un final fracassant pour ce diptyque de fantasy. A peine sortis de Fort-Ressac, les Azuriens se retrouvent prisonniers au fond d'une grotte. Hors de question pour Nérée de les laisser dépérir comme de vieilles algues séchées ! Il convainc donc ses amis de repartir à l'aventure. Objectif : s'assurer contre les Pyres le soutien de Ryk, la plus terrible des prodiges. Alors que menace rien de moins que la fin du monde, Nérée est déterminé à être le héros de l'histoire. Quitte à affronter le Cataclysme, et peut-être même à perdre ses amis.",isbn:"9782075236096",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075236096-475x500-1.jpg"},
  {t:"Christmas Pudding",a:"Bottier Isabelle",y:"2025",ed:"EP média",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Connaissez-vous la recette du Christmas pudding selon Hercule Poirot ? Prenez une belle maison dans la campagne anglaise, installez-y une famille respectable, où se mélangent la jeunesse et la tradition, insérez une mission secrête, un peu d'imprévu et quelques invités, tournez bien l'ensemble, et n'oubliez pas... Tout le monde doit mettre la pain à la pâte, y compris le voleur et l'assassin ! Une nouvelle enquête pour le plus grand des détectives, dans la tradition d'un Noël anglais, mais avec le chauffage central. Car c'est important, ça, le chauffage central...",isbn:"9782889326655",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889326655-M.jpg"},
  {t:"Le Noël d'Hercule Poirot",a:"Bottier Isabelle",y:"2023",ed:"EP média",cote:"BD CHR",pub:"Adulte",sup:"Imprimé",d:"Quoi de plus beau et de plus romantique qu'une famille réunie à quelques jours de Noël ? L'occasion de se retrouver, de partager la chaleur d'un foyer alors que la neige tombe au-dehors. Mais le vieux Siméon Lee n'est pas du genre sentimental et, s'il a réuni ses enfants autour de lui, c'est qu'il a des choses à leur annoncer, ce qui risque de ne pas plaire à tout le monde. De ne pas plaire au point de tuer ? Pour Hercule Poirot, en visite chez son ami le colonel Johnson, une vieille connaissance rencontrée autour du Drame en trois actes, élucider un crime sera le plus beau des cadeaux de Noël !",isbn:"9782889323739",extraUrl:"https://covers.openlibrary.org/b/isbn/9782889323739-M.jpg"},
  {t:"Les ailes de la forêt",a:"Gourmaud Jamy",y:"2026",ed:"Albin Michel",cote:"R GOU",pub:"Adulte",sup:"Imprimé",d:"Un savoureux voyage depuis des forêts encore mal connues jusqu'au coeur du Paris des années folles. Sciences et Avenir Un premier roman d'aventures emballant entre la forêt guyanaise et le Paris des années 1920. Le Télégramme Un battement d'aile peut changer un destin. Saint-Laurent-du-Maroni, 1924. Lorsqu'il s'enfonce dans la forêt guyanaise, sur cette terre qui l'a vu grandir, Emile retrouve la saveur de son enfance, les parfums et la moiteur de l'air. S'il est revenu, c'est pour trouver une espèce rare. Chasseur de papillons et aventurier malgré lui, il veut profiter de l'engouement pour les lépidoptères et sauver sa boutique parisienne. Aidé de Florine, une jeune femme insaisissable, il affronte la nature et les hommes, bagnards à l'affût de trésors, trafiquants prêts à tuer... Quand apparaît, tel un miracle, le morpho gynandromorphe, spécimen rarissime aux ailes d'un bleu aveuglant, sa quête se transforme en traque périlleuse, la convoitise embrasant la jungle et les salons parisiens. De l'Amazonie vénéneuse au Paris des Années folles, Jamy, formidable conteur, signe un grand roman d'aventures, qui nous plonge au coeur des mystères de la nature et des passions insensées des hommes.",isbn:"9782226498700",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226498700-M.jpg"},
  {t:"Le triangle des passions du monde",a:"Moïsi Dominique",y:"2026",ed:"R. Laffont",cote:"327 MOI",pub:"Adulte",sup:"Imprimé",d:"Dominique Moïsi est un de nos experts en géopolitique les plus reconnus internationalement. Cet essai est indispensable pour comprendre les bouleversements actuels du monde. \" Alors que nous entrons dans le second quart du xxie siècle, nous avons connu le retour de la guerre en Europe, le déchaînement de la violence au Moyen-Orient et l'abandon du rôle de garant de l'ordre mondial par les Etats-Unis. Vivons-nous une simple parenthèse cauchemardesque ou assistons-nous à la fin d'un cycle historique et au début d'un autre ? Dans notre monde qui n'a jamais été plus complexe qu'aujourd'hui, le triomphe de la passion sur la raison s'accompagne de celui de la force brute sur le droit et la morale. Et pourtant, en dépit de la fuite en arrière du monde, rien ne serait plus dangereux pour nous que de céder à la peur ou à la résignation. Je reste convaincu que la démocratie a un avenir et qu'elle mérite que l'on se batte pour elle ; nous avons le devoir d'espérer. \" D. M.",isbn:"9782221285435",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221285435-M.jpg"},
  {t:"Je marche vers elle",a:"Méril Macha",y:"2026",ed:"Albin Michel",cote:"B MER",pub:"Adulte",sup:"Imprimé",d:"\"Elle est ma soeur. Elle nous a quittés l'été dernier. La mort n'est pas discrète. Elle entre dans nos vies avec fracas. Ces pages fixent à jamais la place de cette femme lumineuse.\" Macha Méril",isbn:"9782226509703",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226509703-M.jpg"},
  {t:"Ma déclaration",a:"Aymon Gaël",y:"2026",ed:"Gallimard",cote:"J AYM",pub:"Jeunesse",sup:"Imprimé",d:"Une romance lycéenne à deux voix, aussi juste que sensible, par l'auteur de Ma réputation. Yanis est fou amoureux de Camille. Camille aime Yanis, mais elle lui avoue dans une lettre avoir embrassé d'autres garçons. Yanis vit seul avec sa mère et se demande ce que signifie \"être un mec\" aujourd'hui. Camille est en conflit avec ses parents, qui avaient prévu pour elle un avenir tout tracé. Chacun traversé par des doutes et des questionnements, réussiront-ils à préserver le lien qui les unit ?",isbn:"9782075226035",extraUrl:"https://products-images.di-static.com/image/base/9782075226035-475x500-1.jpg"},
  {t:"Myrmidon sous les mers",a:"Dauvillier Loïc",y:"2024",ed:"Editions de la Gouttière",cote:"BDJ DAU",pub:"Jeunesse",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même... C'est quoi Myrmidon ? Une série de bande dessinée sans texte, créative, drôle, et poétique à lire dès 2 ans, en autonomie ou avec un accompagnement !",isbn:"9782357961050",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782357961050-475x500-1.jpg"},
  {t:"Myrmidon et la grotte mystérieuse",a:"Dauvillier Loïc",y:"2016",ed:"les Éditions de la Gouttière",cote:"BDJ DAU",pub:"Jeunesse",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même... Vêtu d'une peau de bête et lance en main, Myrmidon se retrouve projeté à l'époque de la Préhistoire, mais attention à l'effrayant tigre aux dents de sabre...",isbn:"9791092111415",extraUrl:"https://products-images.di-static.com/image/base/9791092111415-475x500-1.jpg"},
  {t:"Myrmidon et la bête de la montagne",a:"Dauvillier Loïc",y:"2018",ed:"les Éditions de la Gouttière",cote:"BDJ DAU",pub:"Jeunesse",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même...",isbn:"9791092111828",extraUrl:"https://images.epagine.fr/828/9791092111828_1_m.jpg"},
  {t:"TKT",a:"Arca Fabien",y:"2026",ed:"Rouergue",cote:"J ARC",pub:"Adolescent",sup:"Imprimé",d:"Alors qu'il attend sa copie de brevet blanc, Tristan stresse, sa note va peser lourd dans son orientation. Trop mauvaise = filière professionnelle. Pas trop mauvaise = filière générale. Et alors qu'il attend, Tristan pense à Ava. Qu'est-ce qui a bien pu se passer entre eux ? Pourtant, c'était bien au début. Alors pourquoi, elle ne veut plus lui parler ? Au fond de lui, Tristan sait. Et c'est en attendant cette note, celle qui fera prendre ou pas un virage à sa vie d'ado, que les souvenirs remontent petit à petit. Ava est dans tous. C'est normal, Ava occupait toutes ses pensées. Ava occupe toujours ses pensées...",isbn:"9782812627873",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782812627873-475x500-1.jpg"},
  {t:"Querelle à la française",a:"Guillot Bertrand",y:"2026",ed:"Les Avrils",cote:"R GUI",pub:"Adulte",sup:"Imprimé",d:"1401. Dans les rues de Paris, on trouve des astrologues, des théologiens, des écrivains. Parmi eux, Christine de Pizan et Jean de Montreuil. Ils ne se connaissent pas mais leurs routes vont se croiser autour d'un best-seller : Le Roman de la Rose. Sommet de misogynie ou joyau de subtilité? Le débat fait rage, des camps se forment. Et pendant ce temps, les princes se déchirent et la guerre approche...",isbn:"9782383110422",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383110422-M.jpg"},
  {t:"Femmes sur fond azur",a:"Thomas Chantal",y:"2026",ed:"Seuil",cote:"R THO",pub:"Adulte",sup:"Imprimé",d:"Six vies, différentes et reliées. Six expériences de la liberté ouvertement ou secrètement revendiquée contre les impératifs de l'époque. Sophie Cruvelli vicomtesse Vigier, la reine Victoria, Marie Bashkirtseff, Katherine Mansfield, Colette, Jackie... Une cantatrice, une reine, une artiste, deux écrivaines, une jeune veuve et ses deux enfants, dont l'autrice. Autant de femmes dont la découverte de la Méditerranée a modifié le destin. Elles ont en commun d'avoir vécu la Côte d'Azur comme un lieu de respiration, de désir, d'échappement et d'accomplissement. Chantal Thomas, en une suite de portraits qui saisit la singularité de chacune, nous invite à une sensuelle réflexion sur le corps féminin, sur l'effort magnifique de \"ne pas se laisser voler sa vie\", comme disait Rimbaud. Son écriture est portée par une formidable capacité à redonner souffle, ce qu'on appelle l'enthousiasme. Avec empathie, érudition et une énergie romanesque très personnelle, elle défait le corset des interdits et nous fait partager la merveilleuse, mystérieuse et revigorante rencontre avec le bleu du ciel et de la mer. Elle nous offre la joie.",isbn:"9782021601275",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021601275-M.jpg"},
  {t:"Le Chant du Sol",a:"Denormandie Julien",y:"2026",ed:"Seuil",cote:"R DEN",pub:"Adulte",sup:"Imprimé",d:"Il y a des personnages que nous regardons sans réellement les voir, que nous pensons connaitre mais dont nous ignorons tout, que nous croyons aimer mais sans considération. Et si le Sol se mettait en grève ? Lui, cet ami précieux qui nous veut du bien. Lui, qui souffre en silence. Un conte ne relate pas une véritable histoire. Il peut, en revanche, reposer sur des éléments réels. Ainsi, tout début dans la capitale, un 22 septembre, par un étrange bruit...",isbn:"9782021618815",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021618815-M.jpg"},
  {t:"Prédateurs de la nuit",a:"Gründ Maria",y:"2026",ed:"R. Laffont",cote:"R GRU",pub:"Adulte",sup:"Imprimé",d:"\" MON NOM, C'EST SANNA BERLING. ON PEUT PARLER ICI, OU VOUS PREFEREZ AILLEURS ? \" Un thriller psychologique redoutable par la reine du suspense suédois. Suède, Mars 1986. Un brouillard glacial recouvre les lacs d'Augu. Deux ans plus tôt, à cet endroit précis, les restes d'une adolescente ont été retrouvés dans deux valises blanches. Depuis le meurtrier est derrière les barreaux. C'est du moins ce que croient les habitants des environs. Lorsque Sanna Berling, policière tout juste diplômée, apprend qu'une autre fille du village a disparu, elle décide de mener l'enquête et découvre des incohérences dans le dossier. Plus elle s'enfonce dans ce dédale de mensonges et de secrets, plus elle est déterminée à faire éclater la vérité. \" DE LA PROFONDEUR, UNE CONSTRUCTION IRREPROCHABLE ET UNE TENSION CROISSANTE : TOUT Y EST. \" Annaïk Kerneuzet, Librairie Dialogues, Brest",isbn:"9782221281185",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221281185-M.jpg"},
  {t:"L'esprit d'élégance",a:"Ternynck Catherine",y:"2026",ed:"Desclée de Brouwer",cote:"153 TER",pub:"Adulte",sup:"Imprimé",d:"Autour de nous, les incivilités se multiplient, les barbaries se répandent, l'impudeur règne, l'outrance est la norme. L'élégance semble être devenue une pensée anachronique, l'emblème d'un âge ancien. Ce qui aujourd'hui anime les esprits, c'est la consommation, le profit, la libéralité, l'immédiateté en toutes circonstances. Il y a pourtant ce \"quelque-chose, presque-rien\" fugitivement saisi dans l'ordinaire du temps, comme une distinction singulière, une tension vers la beauté, une grandeur ajoutée à la vie. Cette impression, qui n'a rien de mièvre ou de naïf, a amené Catherine Ternynck à envisager, bien au-delà de sa dimension esthétique, la force de l'expression spirituelle de l'élégance. Cet esprit d'élégance s'impose comme une résistance à la vulgarité de notre époque. Il nous permet de trouver une plus haute qualité d'existence, et nous mène vers des joies humaines inattendues. Catherine Ternynck est docteur en psychologie, psychanalyste. Elle a exercé à l'hôpital Saint Philibert de Lomme et enseigné à l'université catholique de Lille. Elle est l'auteur de plusieurs essais dont Chambre à part (Desclée de Brouwer, 2007 ; prix du Furet et de La Voix du Nord), L'homme de sable (Seuil, 2011), La possibilité de l'âme (Bayard, 2018).",isbn:"9782220099392",extraUrl:"https://covers.openlibrary.org/b/isbn/9782220099392-M.jpg"},
  {t:"Chine - Etats-Unis : la nouvelle guerre froide",a:"Niblett Robin",y:"2026",ed:"Armand Colin",cote:"327 NIB",pub:"Adulte",sup:"Imprimé",d:"Face a la nouvelle guerre froide, l'europe joue sa survie stratégique. La lutte entre les Etats-Unis et la Chine est mondiale, elle englobe tous les principaux instruments de gouvernance - économiques, politiques et militaires. Et les deux protagonistes travaillent dur pour attirer à leurs côtés des alliés du monde entier. Mais cette nouvelle guerre froide n'a rien à voir avec le conflit entre l'Union soviétique et l'Occident qui a marqué la seconde moitié du XXe siècle. La manière dont cette rivalité sera gérée déterminera la survie de la coopération internationale, l'issue de l'urgence climatique et de la révolution technologique et, bien sûr, quelles puissances domineront le XXIe siècle et quel modèle de gouvernement définira notre avenir. Dans ce livre, Sir Robin Niblett affirme que ce n'est qu'en regardant en arrière que nous pourrons tirer les leçons qui nous guideront à travers cette nouvelle réalité. Il revient ici sur les dix particularités de la nouvelle guerre froide et propose cinq pistes pour la surmonter.",isbn:"9782200642037",extraUrl:"https://covers.openlibrary.org/b/isbn/9782200642037-M.jpg"},
  {t:"Les pouvoirs extraordinares du drainage lymphatique",a:"Nado Elisabeth",y:"2026",ed:"Solar",cote:"615.822 NAD",pub:"Adulte",sup:"Imprimé",d:"Grâce à des protocoles ciblés, transformez durablement votre silhouette et améliorez votre bien-être ! Elisabeth Nado, créatrice de la méthode Nado et du programme d'auto-drainage Boost'Lymph, mais aussi masseuse de célébrités depuis presque trente ans, dévoile ses protocoles exclusifs. Grâce à des technique douces et précises mais d'une grande simplicité de réalisation, ils permettent d'obtenir des effets spectaculaires et multidimensionnels : dégonflement rapide, silhouette affinée (une taille de pantalon perdue en quelques jours pour de nombreuses femmes), regain d'énergie et sensation de légèreté profonde. Que vous souhaitiez aplanir votre ventre, galber vos jambes ou redessiner l'ovale de votre visage, atténuer les signes visibles de la ménopause, libérer vos émotions ou gagner en confort pendant la grossesse, vous trouverez dans ce guide des pas-à-pas illustrés qui vous permettront d'adapter votre action et d'obtenir des résultats visibles, avec seulement 5 à 12 minutes de pratique quotidienne.",isbn:"9782263194092",extraUrl:"https://covers.openlibrary.org/b/isbn/9782263194092-M.jpg"},
  {t:"Brown-out : quand le travail perd son sens",a:"Desmet Etienne",y:"2026",ed:"Eyrolles",cote:"158.7 DES",pub:"Adulte",sup:"Imprimé",d:"De plus en plus de salariés s'interrogent sur la valeur et le sens de leur travail. Perte de sens, chute de le motivation, désengagement ou désalignement... le phénomène touche tous les secteurs, publics comme privés, et a désormais un nom : le brown-out. Premier ouvrage de référence sur le sujet, ce livre en propose une analyse complète, à la fois rigoureuse et accessible. A travers des témoignages concrets, des apports théoriques éclairants et des outils pratiques, il aide à comprendre les mécanismes du brown-out et à agir pour le prévenir. Dirigeants, managers, RH, coach et professionnels de l'accompagnement y trouveront des clés pour nourrir le sens au travail des équipes, recréer de l'engagement et construire des organisations à la fois plus humaines, plus performantes et plus durables.",isbn:"9782416024047",extraUrl:"https://covers.openlibrary.org/b/isbn/9782416024047-M.jpg"},
  {t:"Les mots qui tuent",a:"Fines Michelle",y:"2026",ed:"Arthaud",cote:"364.152 FIN",pub:"Adulte",sup:"Imprimé",d:"Il est la face cachée des violences conjugales. Le suicide forcé, c'est ainsi que l'on appelle le harcèlement dans le couple qui mène au suicide ou à une tentative de suicide. Ces meurtres invisibilisés font deux fois et demie plus de victimes que les féminicides : neuf cent six en 2024. En 2010, sept ans après le meurtre de Marie Trintignant, le suicide de Krisztina Rády, la femme de Bertrand Cantat, a mis le phénomène en lumière. En 2020, une loi a été votée qui punit les responsables de suicides forcés à une peine pouvant aller jusqu'à dix ans de prison. Mais le texte, encore peu connu, est rarement appliqué. Michelle Fines, journaliste d'investigation, a connu comme des milliers de femmes la violence conjugale et s'appuie sur son expérience personnelle pour en décrypter les mécanismes. Comment peut-on vouloir mourir pour échapper à l'enfer ? Qu'est-ce qui lie les victimes aux bourreaux, jusqu'à la mort ? Pour répondre à ces questions, Michelle Fines donne la parole aux victimes. Les mortes, celles qui ont raconté leur calvaire avant de disparaître, et les vivantes, qui en ont réchappé. Elle se confronte aussi aux auteurs, pervers dits narcissiques, harceleurs, manipulateurs. Elle s'intéresse enfin aux mécanismes du cerveau qui empêchent les victimes de partir pour se sauver. Une enquête nécessaire pour comprendre le suicide forcé et, au-delà, les mécanismes de l'emprise et de la violence conjugale.",isbn:"9782080482280",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080482280-M.jpg"},
  {t:"Iles secrètes en Europe",a:"Firquet Hélène",y:"2026",ed:"Gallimard",cote:"914.04 FIR",pub:"Adulte",sup:"Imprimé",d:"Envie de larguer les amarres ? D'être dépaysé sans vous envoler à l'autre bout du monde ? Aux antipodes de stars comme Capri, Santorin ou Ibiza, ces îles plus confidentielles promettent des séjours inédits, à l'écart des foules, mais tout aussi riches ! Sauvages ou habitées, elles réservent des trésors de plages, criques, petits ports de charme, volcans, montagnes, dunes et falaises, réserves sous-marines, eaux bleu marine ou turquoise... Des paysages d'une infinité variété sous toutes les latitudes, de la mer de Norvège à la mer Egée, en passant par l'Atlantique et la Baltique... et même les lacs italiens ou finlandais. Ces voyages augurent de belles rencontres avec les îliens, toujours à l'écoute des éléments et de la nature. Mais aussi des expériences entre ciel et terre : dormir dans un phare à l'île Vierge, jouer les Robinson aux îles Kornati, accompagner les pêcheurs dans l'archipel de Solund, se baigner dans des piscines volcaniques à Faial...",isbn:"9782742469789",extraUrl:"https://covers.openlibrary.org/b/isbn/9782742469789-M.jpg"},
  {t:"Magimage",a:"Albon Lucie",y:"2025",ed:"Thierry Magnier",cote:"A THI",pub:"Jeunesse",sup:"Imprimé",d:"Ce livre est vraiment magique : il transforme les images grâce à un simple miroir. Et voici comment un panier de fruits se transforme soudain... en glace !",isbn:"9791035208523",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035208523-475x500-1.jpg"},
  {t:"Un rêve dangereux",a:"Westin Miila",y:"2026",ed:"Éditions Sarbacane",cote:"BDJ WES",pub:"Jeunesse",sup:"Imprimé",d:"L'été n'a pas été de tout repos pour Eevi : elle a sauvé le monde d'un hiver sans fin en libérant l'esprit du printemps... Et voilà que son ami, le gnome Otso, fait irruption dans sa chambre pour lui demander de l'aider à sauver sa soeur, victime d'une malédiction. Eevi et Otso partent pour le monde des gnomes. Mais attention, la terrible sorcière Louhi et ses affreux lutins sont à leurs trousses...",isbn:"9791040807063",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040807063-475x500-1.jpg"},
  {t:"La base secrète",a:"Bocquet Olivier",y:"2025",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeunesse",sup:"Imprimé",d:"La nuit, sur un toit, trois enfants déguisés en superhéros fuient des robots belliqueux. Le garçon glisse... et se tue ! Comment Ziad, Louna et Billie en sont arrivés là ? Pour comprendre, il faut remonter aux funérailles du père de Louna et Ziad quand frère et soeur s'étaient juré de ne plus tenter de devenir des superhéros. Une promesse qu'ils n'avaient pas tenue longtemps...",isbn:"9782808505116",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808505116-475x500-1.jpg"},
  {t:"Un hiver sans fin",a:"Westin Miila",y:"2025",ed:"Éditions Sarbacane",cote:"BDJ WES",pub:"Jeunesse",sup:"Imprimé",d:"Il neige encore en juin ! Alors que l'été refuse d'arriver, Eevi accompagne sa famille chez sa grand-mère pour trier les affaires de son grand-père récemment disparu. Se promenant près de la rivière, elle fait une rencontre pour le moins étonnante : un esprit de l'orge ! Il lui explique que l'esprit du printemps est retenu prisonnier par une terrible sorcière et qu'il suffit de le libérer pour mettre fin à cet interminable hiver. Eevi se retrouve alors dans les profondeurs de Tuonela, un monde peuplé de créatures magiques où l'on règle les problèmes à coups de puissants sortilèges !",isbn:"9791040807056",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040807056-475x500-1.jpg"},
  {t:"Pommes, poires, abricots",a:"La Croix Séverine de",y:"2016",ed:"Delcourt",cote:"BDJ LAC",pub:"Jeunesse",sup:"Imprimé",d:"Une préadolescente s'interroge, s'inquiète et s'enthousiasme des transformations de son corps. ©Electre 2019",isbn:"9782756080215",extraUrl:"https://www.base-orb.fr/visuels-pim/image/base/9782756080215-475x500-1.jpg"},
  {t:"Un abri pour Lampedusa",a:"Régis Elsa",y:"2026",ed:"les Éditions du Panseur",cote:"R REG",pub:"Adulte",sup:"Imprimé",d:"Architecte, Giuseppe rénove une villa en bordure de Rome lors d'un été caniculaire qui le marquera à vie. La chaleur alanguit les corps, les nuits sont étouffantes, les songes viennent, étranges, décousus. Mais cet été, il y a surtout une rumeur qui circule dans les rues de Rome jusqu'à venir attraper Giuseppe à la terrasse d'un café sur la place du Campo de'Fiori. La rumeur parle d'une île, un rocher perdu dans la Méditerranée, un caillou au coeur d'une crise humanitaire, politique, migratoire : l'île de Lampedusa. En compagnie de Giuseppe, un homme en errance et déraciné à sa façon, confronté à une réalité qui le dépasse, le lecteur traverse la canicule des journées romaines autant que la mer pour découvrir l'île de Lampedusa devenue tragiquement le centre du monde. Poétique et sensuel, le premier roman d'Elsa Régis, Un abri pour Lampedusa, est une quête d'humanité, un élan vers l'autre ouvrant une brèche dans l'atmosphère brulante et pesante de l'été. L'autrice nous emporte par son écriture langoureuse, flottante, envoutante, faite de silence, de sensualité dans les tensions discrètes entre les personnages, corps qui se frôlent à peine et se tiennent à distance, une sorte de détachement dont se dégage pourtant une grande émotion et sensibilité, comme si le narrateur manquait de mots, ou de courage pour les trouver. Nous plongeons ainsi dans une lecture caniculaire, poétique et mélancolique pour explorer l'amitié, l'amour et la solidarité.",isbn:"9782490834297",extraUrl:"https://covers.openlibrary.org/b/isbn/9782490834297-M.jpg"},
  {t:"Les nouveaux territoires",a:"Ly Grace",y:"2026",ed:"HarperCollins",cote:"R LY",pub:"Adulte",sup:"Imprimé",d:"\" Ca veut dire quoi, en vrai, la conquête et la soumission ? Ca veut dire quoi avaler 6 kilomètres de distance et 552 mètres d'altitude en pousse-pousse ? Moi, j'ai le souffle coupé rien qu'en montant les escaliers du métro. Les hommes courbés à l'avant des rickshaws, eux, n'avaient pas le luxe de prendre l'escalator. Voilà ce que ça veut dire. Ces hommes qui tiraient les maîtres ressemblaient à mon père. Dans cette histoire dispensée par les professeurs, je suis du mauvais côté du pousse-pousse\". Pour échapper au pressing familial de Belleville et aux silences de son père, la jeune Sam-Yut décroche un job inespéré dans une grande entreprise à Hong Kong et quitte la France. Entre les tours vertigineuses de Central et les ruelles prolifiques de Kowloon, elle cherche à tourner une page et à apaiser sa peur de ne jamais être à la hauteur. Dans cette ville électrique à l'ambition démesurée, elle se lie à Nicolas, un chef français qui a le vent en poupe. Il lui ouvre les portes des soirées mondaines et de l'univers léché des expatriés... jusqu'à ce que Sam-Yut réalise qu'elle n'en fera jamais vraiment partie. Les Nouveaux Territoires explore les paradoxes nés de nos fantasmes coloniaux ; c'est aussi l'histoire d'une métamorphose : le chemin d'une femme qui choisit enfin de s'appartenir. A propos de l'autrice Grace Ly est engagée pour le féminisme et l'antiracisme. Son premier roman, Jeune fille modèle, a paru chez Fayard en 2018. Originaire du Cambodge et amoureuse de la langue cantonaise, elle vit à Paris.",isbn:"9791033925798",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033925798-M.jpg"},
  {t:"Twisted-Wonderland",a:"Oda Suzuka",y:"2025",ed:"nobi nobi !",cote:"BD TWI",pub:"Jeunesse",sup:"Imprimé",d:"Longue vie au Roi ! Alors que le tournoi de Spelldrive arrive à grands pas, Yu, Grimm et les élèves de Heartslabyul poursuivent leur enquête afin de démasquer le responsable des mystérieux accidents qui frappent les meilleurs athlètes du campus. Lorsqu’un élève de Scarabia est à son tour victime d’un de ces incidents, Jack Howl décide de révéler ce qu’il sait... quitte à risquer de se mettre son dortoir à dos. Lorsqu’elle est attaquée, la maison Savanaclaw montre ses crocs !",isbn:"9782384964727",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384964727-M.jpg"},
  {t:"Frieren",a:"Yamada Kanehito",y:"2026",ed:"Ki-oon",cote:"BD FRI",pub:"Jeunesse",sup:"Imprimé",d:"Que deviennent les héros une fois le mal vaincu ?  Alors que Frieren et Fern cherchent une solution pour soigner Stark, empoisonné par une flèche ennemie, un sauveur inattendu fait son apparition en la personne de Sein ! Le prêtre a en effet reconnu l'énergie de l'elfe tandis qu'il parcourait la capitale...  À quatre, ils arrivent à déjouer la stratégie des guerriers de l'ombre et à leur échapper ! Mais le combat n'est pas passé inaperçu aux yeux des forces spéciales magiques, qui traquent à présent les coupables. De leur côté, Land et Übel ont enfin rejoint leurs compagnons avec le message de Lineal... Grâce à lui, la société des mages du continent parviendra-t-elle à protéger Serie ?",isbn:"9791032721216",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032721216-M.jpg"},
  {t:"La gosse",a:"Baur Cati",y:"2026",ed:"Rue de Sèvres",cote:"BD BAU",pub:"Adulte",sup:"Imprimé",d:"Comment être nostalgique de l'enfance de son enfant sans la figer'Comment la prémunir de la violence des hommes sans la cloîtrer'Comment lui conter ses romances calamiteuses sans la décourager d'oser l'amour'Comment la regarder se faire belle quand on vient tout juste de faire le choix de renoncer, avec soulagement et les cheveux sales, à se rendre désirable'",isbn:"9782810210176",extraUrl:"https://covers.openlibrary.org/b/isbn/9782810210176-M.jpg"},
  {t:"Intelligence criminelle",a:"Weaver Thomas R.",y:"2026",ed:"Seuil",cote:"SF WEA",pub:"Adulte",sup:"Imprimé",d:"Nous sommes en 2050. Notre intelligence nous a conduit au bord du gouffre. Alors qu'une catastrophe climatique sans précédent ravage la planète, l'humanité n'a plus qu'une solution radicale pour éviter l'effondrement : confier son destin à un dirigeant global, chargé de la guider à travers l'apocalypse annoncée. Deux candidats s'affrontent pour ce pouvoir absolu. Lockwood, ancien président des Etats-Unis. Solomon, première intelligence artificielle politique de l'Histoire. Quand la créatrice de Solomon est retrouvée assassinée, le journaliste d'investigation Marcus Tully comprend que cette élection n'est qu'une façade : quelqu'un tire les ficelles. Alors que la rumeur d'un complot mondial enflamme les nations, Tully découvre bientôt que son enquête en cache une autre. Car ce n'est plus seulement l'issue de l'élection qui est en jeu, mais ce qui définit l'humanité : sa liberté.",isbn:"9782386433597",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386433597-M.jpg"},
