  {t:"Algérie",a:"Ham Anthony",y:"2026",ed:"Lonely Planet",cote:"916.5 ALG",pub:"Adulte",sup:"Imprimé",d:"Le guide de référence pour organiser votre voyage de rêve en Algérie ! Lonely Planet, l'éditeur n?1 de guides de voyage dans le monde. Ce guide tout en couleur vous accompagne dans votre voyage pour découvrir les incontournables de l'Algérie et sortir des sentiers battus. D'Oran à Alger, en passant par le Sahara algérien, découvrez tous les trésors repérés par nos auteurs sur le terrain. - Les sites incontournables d'un voyage en Algérie : la casbah d'Alger, les Grands Ergs, véritables mers de sable, la vallée du M'Zab et ses villages fortifiés, les vestiges romains de Tipaza et de Timgad, Annaba et ses plages, le patrimoine architectural d'Oran et de Constantine, le Sahara algérien... - Des conseils d'experts Lonely Planet mis à jour régulièrement : les meilleures adresses (restaurants, cafés, hôtels), des recommandations pratiques pour organiser son voyage... - Les plus belles expériences à vivre en Algérie pour un voyage hors du commun : des activités et sorties originales avec toutes les informations nécessaires et les astuces pour les réaliser au mieux. - Des sélections d'itinéraires thématiques à pied, à vélo ou en voiture : tour à pied dans la casbah, dans les pas d'Albert Camus et Yves Saint-Laurent à Oran, à la découverte des paysages ocre et des oasis qui entourent Timimoun, traversée du Tassili N'Ajjer, ce labyrinthe de canyons sculptés par les éléments au coeur du Sahara ... Mais aussi des itinéraires régionaux pour découvrir le meilleur de l'Algérie, en toute saison, quel que soit le temps ou le budget disponible. - Un focus complet sur les activités de plein air à faire en Algérie, avec une attention particulière portée sur la randonnée, mais aussi le vélo, les balades à dos de dromadaire ou encore les sports nautiques. - Plus de 70 cartes et plans clairs de l'Algérie et de ses villes principales pour repérer les sites en un coup d'oeil et organiser ses déplacements. Ce guide propose également des informations pour voyager responsable et avec des enfants, ainsi que des chapitres thématiques sur la vie des habitants, l'histoire et les traditions de l'Algérie. Un guide clair et synthétique pour construire facilement son voyage et vivre des expériences inoubliables en Algérie, au plus près des habitants.",isbn:"9782384929092",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384929092-M.jpg"},
  {t:"Le Rêve de Marie-Hélise",a:"Malroux Antonin",y:"2026",ed:"Deborée",cote:"R MAL",pub:"Adulte",sup:"Imprimé",d:"Ce jour-là, au square, Marie-Hélise croise la route de Pierre Destourbe. Ensemble, ils observent une femme allaitant son bébé, scène tendre et touchante qui fait naître en eux une émotion inattendue. La jeune fille, sensible et solitaire, a grandi à l'Assistance publique. Pierre, paysan retraité, porte, lui, le deuil de sa femme et de son enfant, demeurant seul avec son fidèle chien, Padouille. Leurs confidences et leur amitié nouvelle éveilleront chez le vieil homme une profonde introspection, et chez Marie-Hélise, la force d'affronter son destin.",isbn:"9782812941436",extraUrl:"https://covers.openlibrary.org/b/isbn/9782812941436-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2019",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Victimes des manigances du prêtre Gobi, Yona et ses amis sont emmenés de force jusqu'à l'empire de Kai. Ayant repéré la puissance de Jae-ha,  Cuerbo prend Yona en otage et contraint Jae-ha à se soumettre à ses ordres. De son côté, afin de retrouver Yona et les autres captifs, Hak accepte la proposition de Kye-sook et décide de s'allier avec l'armée du pays de Kôka...",isbn:"9782811652241",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811652241-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2020",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"En pleine bataille opposant le pays de Kôka à la province de Sen, les quatre dragons se prêtent au jeu des simulacres pour gagner du temps. En toute première ligne, Hak, qui se bat comme un forcené, finit par rencontrer Cuerbo et s'engage dans un duel acharné contre lui. Au même moment, le prêtre Gobi se rend au château de la province de Sen et fait irruption devant Yona et Yûlan, la femme de Cuerbo.",isbn:"9782811654382",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811654382-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2019",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Lors de la bataille contre l'empire de Kai, Yona et les dragons portent secours à la tribu du feu. Les membres de la tribu du feu, fervents adorateurs du roi Hiryû, découvrent ainsi l'existence de nos héros et la nouvelle parvient aux oreilles de Soo-won et Kye-sook. Grâce à l'aide de Tae-jun, Yona et ses amis trouvent refuge au château de Saika mais ils sont rapidement rejoints par Kye-sook qui vient s'entretenir de la sécurisation des frontières nord du pays avec la tribu du feu.",isbn:"9782811649258",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811649258-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2018",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Arrivés à Ryûsui, Yona et Hak contactent l'informateur Ogi pour lui demander d'envoyer un message à Soo-won. Ils espèrent ainsi empêcher une guerre entre le pays de Shin et celui de Kôka. Jae-ha et les autres dragons, pris en otage à Shin, se remettent doucement de leurs blessures grâce aux bons soins de Mizari dont la curiosité à l'égard des dragons est sans bornes. Mais la guerre parait inévitable et la vie des quatre dragons et de Yeon ne semble tenir qu'à un fil.",isbn:"9782811643423",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811643423-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2019",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Le lendemain de la déclaration d'amour de Hak, Yona est troublée par les moindres faits et gestes du jeune homme. De son côté, Zeno explique que les blessures des quatre dragons guériraient mieux près du château de Hiryû, et suggère qu'ils se mettent en route pour Kûto.Au même moment, les terres de la tribu du feu subissent l'invasion des troupes armées de l'empire de Kai, situé au nord…",isbn:"9782811645724",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811645724-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2018",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Les dragons ont laissé exploser leur pouvoir pour protéger Yona mais ce n'est pas sans conséquence. Après la mort de Neguro, et la blessure de Yotaka, les “cinq étoiles” sont en mauvaise posture et la Princesse Kôren est sans protection face au piège du prêtre Gobi. Mais cette princesse et sa jeune sœur ne se laisseront pas faire et elles feront tout pour sauver leur pays et tenter de négocier la paix.",isbn:"9782811645687",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811645687-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Le tournoi de présentation officielle des quatre dragons a commencé. Ki-jae et Jae-ha, qui affrontent respectivement Joo-doh et Geun-tae, font une telle démonstration de force qu'ils en détruisent l'arène… Les exploits des guerriers dragons ajoutés au retour de la princesse Yona et de La Foudre mettent le peuple en liesse. Mais que ressent Hak, tenu à l'écart de Yona et des dragons ?",isbn:"9782811660086",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811660086-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2020",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Sorti vainqueur de la bataille contre la province de Sen, le pays de Kôka agrandit son territoire. Mais Hak est grièvement blessé, et Yona n'a presque plus de voix... Réquisitionné pour soigner les soldats blessés au combat, Yeon s'intéresse aux techniques de soins de la tribu du ciel. Que peut bien avoir derrière la tête le conseiller Kye-sook lorsqu'il lui propose de l'accompagner au château de Hiryû pour y apprendre la médecine ?",isbn:"9782811657345",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811657345-M.jpg"},
  {t:"Une vie si lointaine",a:"Stedman M. L.",y:"2026",ed:"Stock",cote:"R STE",pub:"Adulte",sup:"Imprimé",d:"Australie-Occidentale, 1958. Depuis des générations, les MacBride vivent à Meredith Downs, une ferme de cinq mille hectares perdue au coeur de l'outback. Quand, sur une route déserte, le patriarche Phil dévie de sa trajectoire pour éviter un kangourou, c'est toute la famille qui vole en éclats. A travers les vies d'âmes isolées cherchant refuge face aux tempêtes de l'existence, M. L. Stedman explore comme nulle autre les liens qui fédèrent une communauté. Un roman époustouflant sur la résilience et le dévouement dont nous sommes capables pour protéger ceux que nous aimons.",isbn:"9782234100022",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234100022-M.jpg"},
  {t:"Avez-vous vu Tilda ?",a:"Tara Jane",y:"2026",ed:"Seuil",cote:"R TAR",pub:"Adulte",sup:"Imprimé",d:"Lorsque son petit doigt disparaît un matin, Tilda affronte la situation avec self-control : en pleurant et en buvant plus que de raison. Le diagnostic tombe, elle est atteinte d’invisibilité, un mal prétendu incurable, méconnu, qui touche pourtant de nombreuses femmes après quarante ans. Avec l’aide de ses deux filles, d’un groupe de soutien de femmes plus ou moins invisibles, et armée de son inébranlable sens de l’humour, Tilda entreprend de recouvrer sa confiance en elle-même. En commençant par oublier son ex-mari et les petites phrases humiliantes dans sa tête. Quand elle tombe sous le charme du séduisant Patrick, elle se dit qu’elle est peut-être enfin prête à se regarder, tout entière, dans la glace.",isbn:"9782021609059",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021609059-M.jpg"},
  {t:"L'ultime traque",a:"Romana Muriel",y:"2026",ed:"Albin Michel",cote:"R ROM",pub:"Adulte",sup:"Imprimé",d:"L'heure de la confrontation finale a sonné. L'Ultime traque est le 4e et dernier opus de la série historique L'Escadron volant.  Alertée par un sombre présage, Catherine de Médicis dépêche son Escadron volant à Madrid : sa fille Élisabeth de Valois, reine d'Espagne, y serait en danger de mort. Sous le faste de la cour de Philippe II, Louise, Claudine, Isabeau et Madeleine découvrent une réalité glaçante : empoisonnements, violences étouffées sous les dorures, complots diplomatiques... et surtout, la présence de Gabriel de Montgomery, recherché depuis des années et désormais protégé par l'Angleterre. Pour Catherine de Médicis, Montgomery doit mourir, quel que soit le moyen employé. De l'Alcazar de Madrid aux brumes de Londres en passant par Paris, la traque peut reprendre. Et il n'y aura ni pardon ni salut.",isbn:"9782226511515",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226511515-M.jpg"},
  {t:"Robot sauvage en mission",a:"Brown Peter",y:"2026",ed:"Gallimard",cote:"J BRO",pub:"Jeunesse",sup:"Imprimé",d:"Une merveilleuse aventure sur les traces d'un robot dont l'humanité n'est plus à prouver. De retour sur son ile, Roz retrouve enfin ses amis et son coin de paradis. Mais son bonheur est de courte durée : un courant toxique se dirige droit vers eux ! Immense, mystérieux et mortel, il menace tout sur son passage. Malgré le danger, Roz est bien décidée à l'arrêter. Elle doit sauver tous ceux qu'elle aime.",isbn:"9782075222051",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075222051-M.jpg"},
  {t:"Querelle à la française",a:"Guillot Bertrand",y:"2026",ed:"Les Avrils",cote:"R GUI",pub:"Adulte",sup:"Imprimé",d:"1401. Dans les rues de Paris, on trouve des astrologues, des théologiens, des écrivains. Parmi eux, Christine de Pizan et Jean de Montreuil. Ils ne se connaissent pas mais leurs routes vont se croiser autour d'un best-seller : Le Roman de la Rose. Sommet de misogynie ou joyau de subtilité? Le débat fait rage, des camps se forment. Et pendant ce temps, les princes se déchirent et la guerre approche...",isbn:"9782383110422",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383110422-M.jpg"},
  {t:"Victor Hugo",a:"Sandras Agnès",y:"2023",ed:"Coédition Perrin/BNF",cote:"B HUG",pub:"Adulte",sup:"Imprimé",d:"Le dernier géant La vie et l'oeuvre de Victor Hugo (1802-1885) incarnent le XIXe siècle par leur éclectisme, leur caractère visionnaire et leur immensité. Que ce soit en poésie (Les Rayons et les Ombres, Les Orientales), au théâtre (Hernani, Ruy Blas) ou naturellement dans ses romans en particulier Notre-Dame de Paris et Les Misérables, ce génie - qui a dépassé en notoriété son idole de jeunesse Chateaubriand - a bouleversé l'histoire de la littérature avant de demeurer dans la mémoire collective jusqu'à nos jours. Mais Victor Hugo fut aussi un politique de grande envergure, le romantique ultra de la jeunesse laissant place à l'orléaniste social de la maturité avant de finir en prophète de la République, accablant de ses traits en vers et en prose Napoléon III (Les Châtiments, Histoire d'un crime) tout en dressant l'irremplaçable chronique de son temps dans Choses vues. Le récit de ses vies multiples s'appuie sur une iconographie d'exception, en particulier la reproduction de superbes dessins et des manuscrits du \" voyant \" auxquels s'ajoutent de nombreux portraits, notamment photographiques, et bien entendu le colossal fond Hugo de la Bibliothèque nationale de France, riche en manuscrits aux extraordinaires ratures, en lettres d'amour bouleversantes, en notes intimes, dont quelques-unes inédites, et enfin en une incroyable collection de dessins, qui révèlent l'immense talent de Hugo, artiste majeur de son temps, peignant sans relâche à l'aide de gouache, d'encre et de café des vues apocalyptiques, des tempêtes hallucinées et des châteaux fantastiques. L'alliance spectaculaire du manuscrit et de l'image, au coeur même du projet de la \" Bibliothèque des Illustres \", n'avait jamais été aussi bien mise en avant qu'avec les oeuvres extraordinaires léguées par \" l'Homme océan \". Ce livre a remporté le Prix Napoléon III en 2025.",isbn:"9782262101190",extraUrl:"https://covers.openlibrary.org/b/isbn/9782262101190-M.jpg"},
  {t:"Skateparks",a:"Andreu David",y:"2023",ed:"Editions Place des Victoires",cote:"725.8 MEL",pub:"Adulte",sup:"Imprimé",d:"Découvrez Skateparks, un voyage à travers les designs innovants et modernes des meilleurs skateparks internationaux. Un incontournable pour les architectes, designers et skateurs qui souhaitent explorer l'évolution de ces lieux emblématiques, véritables centres sociaux et sportifs du monde entier. Ce beau-livre passe en revue les travaux récents des meilleurs designers contemporains, à la pointe de la technologie et novateurs dans la conception et le design de ces espaces si particuliers. David Andreu, avec l'aide et les conseils de Luka Melloni (Vulcano Skateparks), a rassemblé une sélection de skateparks internationaux à l'esprit particulier, des espaces conçus et construits par des techniciens et des sportifs pratiquants. Ce livre est un outil utile pour les architectes, les designers, les paysagistes, les constructeurs, les urbanistes et bien sûr pour les skateurs du monde entier, qui veulent se tenir au courant de l'évolution des skateparks, des rampes et des pumptracks qui ont été récemment construits pour leur usage et leur plaisir. Les skateparks ne sont pas seulement des terrains de sport. Pour les jeunes en particulier, ils remplissent diverses fonctions sociales au-delà du sport.",isbn:"9782809920239",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809920239-M.jpg"},
  {t:"Pilote automatique",a:"Ruffel Eliot",y:"2026",ed:"Editions de l'Olivier",cote:"R RUF",pub:"Adulte",sup:"Imprimé",d:"Oscar, vingt-cinq ans, travaille comme livreur d'électroménager pour une grande enseigne. Les journées se succèdent : zones périphériques qui se ressemblent toutes, trajets en camion, clients plus ou moins aimables, musique partagée et cafés trop serrés. Puis viennent les soirées à refaire le monde, la fatigue et les lendemains brumeux. Autour de lui, il y a Kamel, le collègue danseur, Toutac et Sanders, les potes d'enfance. En miroir, il y a Clément, le frère modèle, celui qui avance pendant qu'Oscar stagne, moteur allumé mais itinéraire inconnu. Quand Chloé, un visage du passé, réapparaît par hasard, une fissure s'ouvre dans la routine et ravive chez Oscar le besoin de reprendre la main sur sa vie. Pilote automatique raconte la lente usure du quotidien et du travail, les fidélités qui sauvent et le désir têtu de recommencer. Eliot Ruffel déploie une langue à la fois orale et poétique, capable de saisir la beauté des gestes ordinaires.",isbn:"9782823623642",extraUrl:"https://covers.openlibrary.org/b/isbn/9782823623642-M.jpg"},
  {t:"Les Buddenbrook",a:"Mann Thomas",y:"2014",ed:"LGF (Le Livre de poche)",cote:"RMAN",pub:"Adulte",sup:"Imprimé",d:"Les Buddenbrook, premier roman de Thomas Mann, devenu l'un des classiques de la littérature allemande, , retrace l'effondrement progressif d'une grande famille de la Hanse, de Johann, le solide fondateur de la dynastie, à Hanno, le frêle musicien qui s'éteint quarante ans plus tard dans un pavillon de banlieue. Le style, tout en nuances, où l'émotion se teinte de connivence et d'ironie, d'affinités et de détachement, traduit parfaitement la relation que l'auteur entretient avec la réalité et accentue subtilement la transcription du lent processus de décadence. Les Buddenbrook ou le grand livre de la dégénérescence.",isbn:"9782253063193",extraUrl:"https://covers.openlibrary.org/b/isbn/9782253063193-M.jpg"},
  {t:"La vie en relief",a:"Delerm Philippe",y:"2022",ed:"Points",cote:"R DEL",pub:"Adulte",sup:"Imprimé",d:"Etre riche, à chaque époque de notre existence, de tous les moments qu'on a vécus, qu'on vit, qu'on vivra encore : c'est cela, la vie en relief. Voir ses souvenirs et ses sensations non pas additionnés les uns aux autres, mais comme démultipliés, à l'infini. Vivre comme si c'était la première fois. Trouver de la beauté dans l'ordinaire des choses. Aimer vieillir, écouter le bruit du temps qui passe.",isbn:"9782757892886",extraUrl:"https://covers.openlibrary.org/b/isbn/9782757892886-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Après avoir réussi à quitter sa cellule, Mei Niang rencontre Hak mais ce dernier refuse de s'évader avec elle. Elle s'enfuit donc seule mais elle finit par perdre connaissance et est secourue par Yeon. Pendant ce temps, sur les terres du Kai du sud, on s'inquiète de son absence…",isbn:"9782811669652",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811669652-M.jpg"},
  {t:"Mea Culpa",a:"Alves Morgane",y:"2026",ed:"Flammarion",cote:"R ALV",pub:"Adulte",sup:"Imprimé",d:"\"- Pardon, je ne peux pas, c'est impossible. Les yeux bleus, de ce bleu profond qui rappelle celui de la nuit floutée par la brume, se détournent, tombent au sol, puis ricochent sur le mur. Elle fait un pas en arrière, semble hésiter. Une seule seconde, ou peut-être deux, un bref temps mort auquel Peter repensera longuement ensuite. Pourquoi, à ce moment précis, ne saisit-il pas sa main, pourquoi n'avance-t-il pas vers elle, pourquoi reste-t-il planté là alors que l'amour de sa vie s'apprête à franchir la porte de leur appartement, la porte vers un autre monde ? \" Pour se libérer des fantômes de son passé, Liv a menti et a fait de sa meilleure amie, Claire, sa complice. Aujourd'hui, elle risque de perdre Peter, l'homme qu'elle aime. Que fait-on par amitié ? Qu'accepte-t-on par amour ?",isbn:"9782080159885",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080159885-M.jpg"},
  {t:"Couture",a:"Guidicelli Catherine",y:"2025",ed:"Fleurus",cote:"646.2 GUI",pub:"Adulte",sup:"Imprimé",d:"Avec cette véritable encyclopédie spécialement écrite tou(te)s les débutant(e)s, apprendre toutes les bases de la couture est un jeu d'enfant ! Premiers points à la main, découverte du fonctionnement d'une machine à coudre, coupe du tissu, assemblages, réalisation d'un ourlet ou encore pose d'un bouton... Des modèles entièrement expliqués étape par étape avec des schémas clairs permettent de mettre en pratique, au fur et à mesure, toutes les techniques. ? Après des ouvrages simples à la main suivis par des réalisations faciles à la machine, on peut rapidement se lancer dans des ouvrages un peu plus ambitieux, mais toujours abordables.",isbn:"9782215196938",extraUrl:"https://covers.openlibrary.org/b/isbn/9782215196938-M.jpg"},
  {t:"J'ai trouve un cercle",a:"",y:"2023",ed:"Les Malins",cote:"A CAR",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9782898107962",extraUrl:"https://covers.openlibrary.org/b/isbn/9782898107962-M.jpg"},
  {t:"Silence of the lamps",a:"Midam",y:"2022",ed:"Dupuis",cote:"BDJ MID",pub:"Jeunesse",sup:"Imprimé",d:"De nouvelles aventures de Kid Paddle, qui, cette fois, apprend à capturer un Blork, à utiliser un Copy 2000 ou encore à comprendre où atterrit l'argent glissé dans la fente d'une caisse automatique. ©Electre 2022",isbn:"9791034763122",extraUrl:"https://products-images.di-static.com/image/base/9791034763122-475x500-1.jpg"},
  {t:"A double tranchant",a:"Cornwell Patricia",y:"2026",ed:"Jean-Claude Lattès",cote:"R COR",pub:"Adulte",sup:"Imprimé",d:"Au petit matin du jour de Noël, le Dr Kay Scarpetta, reçoit un appel glaçant : le \"tueur fantôme\" a encore frappé. Depuis des mois, ce meurtrier terrorise le nord de la Virginie, traquant ses victimes à l'aide d'une technologie sophistiquée qui lui permet de s'introduire chez elles et d'observer chacun de leurs mouvements. Lorsque celles-ci se réveillent face à un hologramme fantomatique, il est déjà trop tard. Convoquée à Mercy Island, dans un hôpital psychiatrique où deux personnes ont été brutalement agressées, Scarpetta reconnaît l'une des victimes et commence à se demander si elle ne serait pas la prochaine sur la liste... Traduit de l'anglais (Etats-Unis) par Dominique Defert",isbn:"9782709677431",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709677431-M.jpg"},
  {t:"Je suis drôle",a:"Foenkinos David",y:"2026",ed:"Gallimard",cote:"R FOE",pub:"Adulte",sup:"Imprimé",d:"Gustave a compris une chose essentielle : faire rire, c'est être aimé. Alors il décide de faire rire tout le monde. Ce sera sa force, son talent, sa politesse envers les autres. Il en fera un métier, puis une identité. Il n'avait pas prévu que ce serait si dangereux.",isbn:"9782073152985",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073152985-M.jpg"},
  {t:"La Maison des trois soeurs",a:"Mosca Lyliane",y:"2026",ed:"Presses de la Cité",cote:"R MOS",pub:"Adulte",sup:"Imprimé",d:"Trois femmes de caractère, trois destins bouleversés par la Grande Guerre et la révélation d'un trésor au coeur de la campagne champenoise. Par l'autrice de La Vie rêvée de Gabrielle . Victoire a toujours rêvé d'être écrivaine. Elle a accepté un peu à contrecoeur de s'installer avec son compagnon dans une vieille maison de la campagne champenoise, mais tout change lorsqu'elle apprivoise la demeure, et qu'elle découvre des lettres et des journaux intimes datant de la Première Guerre mondiale. Il y est question de trois soeurs dont les vies dans la tourmente de la guerre vont devenir une formidable source d'inspiration pour l'aspirante romancière. Il y a Camélia, au fort caractère, qui dirige seule son moulin ; Iris, une infirmière au grand coeur, au chevet des blessés de la Grande Guerre ; Anémone, couturière, qui attend son fiancé parti au front. La réalité et la fiction se mêlent entre espoir, courage, devoir, amour, et la révélation d'un secret légué par leur mère. Dans un roman tout en sensibilité, des héroïnes magnifiques au destin bouleversé.",isbn:"9782258211759",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258211759-M.jpg"},
  {t:"L'Or du soir",a:"Duplessy-Rousée Carole",y:"2026",ed:"Presses de la Cité",cote:"R DUP",pub:"Adulte",sup:"Imprimé",d:"Au coeur du Quercy blanc, le destin d'Alek, cabossé par la vie mais épris de justice face au drame des violences faites aux femmes. Par l'autrice du Coeur à l'envers . Renvoyé de la police après une terrible bavure, Alek a sombré. Il aurait pu mettre fin à ses jours si un ami ne l'avait pas emmené loin de Paris, à Montaigu-de-Quercy. Au coeur d'une nature réconfortante, Alek retrouve peu à peu le goût de vivre. Un matin, il croise une inconnue couverte d'hématomes. Aussitôt, son instinct de policier reprend le dessus. Il commence à enquêter, et se met en tête de sauver Guillemette Jory des griffes de son mari. S'introduisant dans le domaine des Jory, une lavanderaie, il tente de convaincre Guillemette et son employée, Farah, de partir. Sans succès. Pourquoi les deux femmes ne fuient-elles pas le danger que représente Jory ? Un secret les condamne-t-il à rester aux mains de cet homme violent ? Sur un thème aux résonances contemporaines, un roman guidé par l'espoir et la lumière d'âmes libres.",isbn:"9782258213227",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258213227-M.jpg"},
  {t:"Les cogne-trottoirs",a:"Bartabas",y:"2026",ed:"Gallimard",cote:"R BAR",pub:"Adulte",sup:"Imprimé",d:"\"Ce qu'ils virent ce jour-là fut si incroyable qu'ils ne purent en rendre compte ; les enfants furent traités de menteurs et les adultes d'affabulateurs. Même l'escouade de policiers, arrivés en nombre pour dissiper l'attroupement et verbaliser les fauteurs de troubles, resta en arrêt et tomba le képi. Les regards étaient somptueux. A la fin, l'angelotte et l'âne, immobiles sur la corde, en équilibre l'un sur l'autre, vibraient en silence au même diapason\". Une jeune fille muette s'enfuit de chez son oncle après y avoir mis le feu et se réfugie dans la forêt, accompagnée de son âne. Une rencontre menant à l'autre, ils échouent à Paris, dans une troupe de saltimbanques, les Baladins du Temple. De la place Saint-Eustache à Montparnasse, sous la houlette de l'Amiral, les membres de cette joyeuse tribu de marginaux donnent des spectacles de rue, font la manche, défient l'ordre bourgeois. Renommée Cascabelle, l'adolescente va recueillir leurs confidences, découvrir la liberté et partager leurs excès, leurs rêves et leurs chagrins... Avec Les cogne-trottoirs, roman d'apprentissage mettant en scène le duo touchant d'un âne funambule et d'une môme qu'un drame a privée de parole, Bartabas signe un premier roman halluciné, lyrique et gouailleur, au style éblouissant.",isbn:"9782073129963",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073129963-M.jpg"},
  {t:"Gais, innocents et sans coeur",a:"Forest Philippe",y:"2026",ed:"Gallimard",cote:"844 FOR",pub:"Adulte",sup:"Imprimé",d:"\"Deux fois est le début de la fin... Je me rappelle. Je reviens trente ans en arrière. A l'époque où j'avais trente ans ou à peine plus. Aux jours lointains où, pour la première fois, pour Pauline, j'ai lu Peter Pan\". Pour sa fille, comme il l'avait fait autrefois et ainsi que le relatait déjà son premier roman, trente ans après, Philippe Forest entreprend de raconter à nouveau l'histoire de Peter, le petit garçon qui ne voulait pas grandir, et de Wendy, qui fut peut-être la véritable héroïne de la fable autrefois inventée par l'écrivain écossais James Matthew Barrie. Aux aventures enchantées qui menèrent les deux enfants vers le territoire merveilleux du Neverland, à la sombre et pathétique existence de l'homme qui, pour se distraire de sa mélancolie, conçut cette inoubliable légende, Philippe Forest mêle un peu du récit de sa propre vie. Pour l'auteur, on le sait, toutes les histoires existent avant même qu'on s'en empare. Plus de quinze livres n'ont pas épuisé cette réflexion sur l'enfance éternelle et sur la littérature, que Philippe Forest renouvelle magnifiquement.",isbn:"9782073146137",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073146137-M.jpg"},
  {t:"Une histoire d'amour et de violence",a:"Bourdeaut Olivier",y:"2026",ed:"Gallimard",cote:"B BOU",pub:"Adulte",sup:"Imprimé",d:"Le jour où il enterre son père, tout le monde félicite Olivier pour le succès de son premier roman. La scène est absurde, presque irréelle. Et pourtant, c'est là que tout commence. Car derrière la consécration de l'écrivain se cache une histoire intime. Celle d'un fils qui a grandi dans l'ombre d'un père aussi impressionnant qu'insaisissable, d'un enfant qui s'est construit contre la violence et sous les coups, d'un adolescent qui les a rendus et d'un homme qui, au moment de devenir père à son tour, choisit de transformer son héritage. De Nantes à l'Espagne, des bancs de la pension aux plateaux de télévision, Olivier Bourdeaut remonte le fil d'une vie faite de chutes, de réconciliations inattendues et de victoires inespérées. Peut-on réécrire son histoire familiale ? Et que reste-t-il, au fond, de nos pères ? Traversé par une émotion et un humour irrésistibles, ce livre raconte la métamorphose d'un mauvais élève en écrivain, d'un fils blessé en un père attentionné. Un récit vibrant sur la filiation, les épreuves, et finalement la joie de trouver enfin sa place.",isbn:"9782073130242",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073130242-M.jpg"},
  {t:"La vie entière",a:"Fombelle Timothée de",y:"2026",ed:"Gallimard",cote:"R FOM",pub:"Adulte",sup:"Imprimé",d:"\"Hier j'ai eu dix-neuf ans, mais il y a sous mes mains cette nuit une femme qui se met à exister dans ma chambre, bavarde et vieille. Elle descend le clavier comme un escalier d'honneur. Une femme très âgée qui parle et me survivra. C'est moi\". Paris sous l'Occupation. Claire attend son chef de réseau, dont le retard laisse présager le pire. Elle devrait quitter l'appartement. C'est la règle. Mais elle reste et tape à la machine, inventant sa vie avec cet homme qu'elle aime en secret : les baisers sur les toits, l'amour fou, les enfants, la mer, la vieillesse heureuse, et tous les miracles ordinaires d'un temps de paix. Dans l'urgence de cette nuit où l'existence ne tient qu'à un fil, Claire se sauve par les mots et crée sur le papier l'espace d'une vie entière. Habitué des récits au long cours - Tobie Lolness, Vango, Alma -, Timothée de Fombelle célèbre ici en quelques pages virtuoses la toute-puissance de l'écriture et de l'imaginaire.",isbn:"9782073132543",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073132543-M.jpg"},
  {t:"Assaut contre la frontière",a:"Slimani Leïla",y:"2026",ed:"Gallimard",cote:"R SLI",pub:"Adulte",sup:"Imprimé",d:"\"Il me semble que tout roman est la tentative de répondre à une question. Et que celle qui fut à l'origine et au centre de ma trilogie est celle-ci : pourquoi est-ce que je ne parle pas ma langue ? Cette langue arabe, qu'est-elle pour moi ? Penser à ça, à la langue arabe, c'est ressentir un mélange de chagrin et de honte, de colère et de frustration. Comment pourrais-je vous raconter, vous faire comprendre que je parle comme une enfant la langue qui devrait être la mienne ? Que je vis avec une langue fantôme comme on parle d'un membre fantôme dont on sent encore la présence bien qu'il ait été amputé. Cette langue, je l'ai cherchée partout. Je l'ai désirée, je l'ai poursuivie, j'ai pu suivre des inconnus dans la rue simplement pour les entendre prononcer ces syllabes familières. Je pourrais aisément reprendre à mon compte les mots de l'écrivaine et peintre libanaise Etel Adnan : \"Je me suis retrouvée à la porte de cette langue. Je l'ai érigée en mythe, en une sorte de paradis perdu. \"\" Une première version de ce texte a été lue en public par Leïla Slimani lors du Festival d'Avignon 2025.",isbn:"9782073152930",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073152930-M.jpg"},
  {t:"Le jour de guerre est arrivé",a:"Seksik Laurent",y:"2026",ed:"Gallimard",cote:"R SEK",pub:"Adulte",sup:"Imprimé",d:"Eté 1914. A l'approche de la guerre, un élève officier de Saint-Cyr découvre que son grand-père, capitaine de l'armée française cinquante ans auparavant, n'était pas le héros qu'il croyait. Pressée de révéler la vérité d'un homme, sa grand-mère lui confie enfin leur histoire : la passion destructrice d'une servante et d'un haut gradé, unis sous les fastes du Second Empire puis ennemis, chacun d'un côté des barricades pendant la Commune de Paris. Cette tragédie à la Roméo et Juliette sur fond de guerre civile française va ébranler les certitudes du jeune homme, tandis qu'à Saint-Cyr gronde un autre drame où son propre sort se joue... Comme dans ses romans précédents, Laurent Seksik mêle la petite histoire à la grande et compose un récit enchâssé bouleversant, qui résonne avec notre temps. Le jour de guerre est arrivé donne vie à un personnage de femme inoubliable, impuissante face aux guerres des hommes et héroïque dans la tourmente.",isbn:"9782073148445",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073148445-M.jpg"},
  {t:"Le temps d'une décision",a:"Le Maire Bruno",y:"2026",ed:"Gallimard",cote:"320.944 LEM",pub:"Adulte",sup:"Imprimé",d:"Le temps d'une décision est un livre de vérité. Il met à nu la grande bascule du monde. Que signifie la décision politique quand plus rien ne tient, ni le temps long, ni la parole publique, ni la souveraineté des nations ? Qui décide encore dans le monde actuel ? Qui décide vraiment ? De la scène nationale aux coulisses des sommets internationaux, Bruno Le Maire décrit les négociations avec Donald Trump, Vladimir Poutine ou Xi Jinping, les G20 ou les Conseils européens vidés de leur sens, la montée des régimes autoritaires et le sentiment grandissant que les décisions se prennent désormais ailleurs : dans la finance ou dans les monopoles des géants de la tech. Le temps d'une décision est un récit nourri par vingt-cinq ans de responsabilités au plus haut niveau dans un contexte mondial où la force a repris le pas sur le droit. Ce récit ne décrit pas le pouvoir, il le fait vivre, minute par minute, jour par jour, de manière haletante. Les rapports de force y apparaissent dans toute leur brutalité, l'engagement public devient un combat moral et physique qui met les nerfs à rude épreuve. Les relations humaines se nouent et se distendent, au fil de portraits taillés au scalpel.",isbn:"9782073071972",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073071972-M.jpg"},
  {t:"Ma gloire",a:"Oiseau Florent",y:"2026",ed:"Gallimard",cote:"R OIS",pub:"Adulte",sup:"Imprimé",d:"\"C'est la nuit et le dehors qui m'ont fait ça, ils m'ont attrapé et ne m'ont pas rendu\". Alcoolique débonnaire, le narrateur a pour philosophie l'absence d'ambition. Fraîchement licencié, il vit de petits trafics, passe ses journées à arpenter le Paris populaire, du cimetière de Charonne à la porte de Bagnolet, et ses soirées dans les bars. Sa gloire, ce sont les deux femmes qu'il aime : son épouse, Almeria, et leur fille, l'espiègle Lune, dix ans. Mais elles s'inquiètent de ses excès, qui ressemblent à un lent suicide. Jusqu'au jour où il est choisi pour jouer une fée dans le spectacle de fin d'année de l'école : l'occasion de trouver, enfin, le rôle de sa vie ? ... Hommage à la nuit, à l'ivresse et aux rencontres de hasard, Ma gloire interroge nos loyautés et la place que nous occupons dans le monde. De sa plume poétique et fantasque, Florent Oiseau poursuit son exploration fraternelle des gens de l'ombre, et signe un roman poignant sur les histoires que nous nous racontons tous pour survivre.",isbn:"9782073114273",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073114273-M.jpg"},
  {t:"La Demoiselle du moulin",a:"Onaglia Frédérick d'",y:"2026",ed:"Presses de la Cité",cote:"R ONA",pub:"Adulte",sup:"Imprimé",d:"Années 1980. A Fontvieille où les apparences règnent en maître, où les secrets ravagent les consciences, Cathy fait la rencontre d'un mystérieux ouvrier saisonnier, tandis que sa meilleure amie vit de terribles épreuves au sein de sa famille. Destins croisés dans ce roman sensible et âpre au coeur de la Provence. Sur une colline battue par le mistral, un moulin abandonné abrite le temps d'une nuit d'orage la rencontre improbable de Cathy et Selim. Un lien se tisse entre eux, aussi fragile qu'inattendu. Mais au village de Fontvieille, les apparences règnent, empêchant les élans du coeur. Cathy, la fille du primeur, s'interroge sur les silences de Selim, ouvrier saisonnier. Lui cacherait-il quelque chose ? Et il y a Béatrice, sa meilleure amie, qui, entre doutes et désir de s'affirmer, vacille. Son mari, Armand, notable local, la trompe... Une nouvelle épreuve va bientôt ébranler son mariage déjà rongé par les non-dits et par le secret d'une maladie. Dans un contexte difficile, car elle voit son père s'éloigner d'elle, Cathy veut aider son amie. Saura-t-elle également sauvegarder son histoire naissante avec Selim ? En Provence, les destins croisés de deux couples en pleine tourmente dans un roman âpre et sensible.",isbn:"9782258213326",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258213326-M.jpg"},
  {t:"L'arbre de fer",a:"Connelly Michael",y:"2026",ed:"Calmann-Lévy",cote:"R CON",pub:"Adulte",sup:"Imprimé",d:"L'inspecteur Stilwell mène l'enquête aux côtés de Renée Ballard Au coeur de la nuit sur Santa Catalina, un avion atterrit discrètement dans un petit aéroport niché dans la montagne. Au courant grâce à une source, l'inspecteur Stilwell et son équipe sont aux premières loges pour assister à ce qui ressemble à du trafic de drogue, mais leur intervention tourne mal. Mis sur la touche le temps d'une enquête interne, Stilwell se plonge dans une affaire de randonneuse disparue il y a quatre ans à Los Angeles et dont le sac à dos a été retrouvé sur l'île deux mois plus tôt. Ses recherches l'amènent à l'unité des Affaires non résolues de Renée Ballard. Travaillant ensemble sur le continent et sur Santa Catalina, tous deux seront confrontés à un criminel qui nargue les autorités depuis déjà longtemps, et révéleront une affaire d'une ampleur inédite.",isbn:"9782702194577",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702194577-M.jpg"},
  {t:"A not so innocent deal",a:"Messina Lynn",y:"2025",ed:"Fleurus",cote:"J MES",pub:"Adolescent",sup:"Imprimé",d:"A vingt-et-un ans, Catherine Fellingham découvre que sa famille risque la faillite et le scandale : pour régler les dettes de son époux, Lady Fellingham s'est enlisée dans une affaire de pots-de-vin. Catherine supplie la complice de sa mère, Lady Courtland, de mettre fin à ces manigances... mais, en contrepartie, elle doit accepter un arrangement : se livrer à une autre saison pour trouver un mari. Après trois années sans que le moindre prétendant s'intéresse à elle, Catherine accepte à contrecoeur. Lorsqu'elle découvre que le célèbre Lord Deverill a été chargé de feindre un intérêt pour elle pour que d'autres la remarquent... et qu'il juge cette mission impossible, Catherine décide que c'en est trop. Humiliée, elle compte rendre au marquis la monnaie de sa pièce et le prendre à son propre jeu. A moins, bien sûr, que son coeur n'en fasse qu'à sa tête...",isbn:"9782215199908",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215199908-475x500-1.jpg"},
  {t:"C'est à moi !",a:"Lang Suzanne",y:"2026",ed:"Editions Casterman",cote:"A LAN",pub:"Jeunesse",sup:"Imprimé",d:"Un album pour accompagner le difficile apprentissage du partage. C'est l'heure du déjeuner pour Gaston le chimpanzé. Il cueille la toute dernière banane sur le bananier. Mais il la fait tomber ! Et quand il descend de l'arbre pour la récupérer, Phacochère l'a déjà ramassée. - C'est ma banane ! déclare Gaston. - Je l'ai trouvée, je la garde ! répond Phacochère. Phacochère se met en colère. Et Gaston aussi. C'EST A MOI ! Et pas question de partager !",isbn:"9782203300217",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300217-475x500-1.jpg"},
  {t:"Dans la jungle",a:"Dieudonné Adeline",y:"2026",ed:"Iconoclaste (l')",cote:"R DIE",pub:"Adulte",sup:"Imprimé",d:"Une jolie villa dans le Brabant wallon, l'été à la mer, l'hiver au ski, deux enfants : Aurélie et Arnaud se sont construit une vie qui leur ressemble. Pourtant, un soir d'été, Arnaud prend une arme et assassine les siens avant de se suicider. Adeline Dieudonné rembobine le film de l'histoire de ce couple, du premier regard à la mise en place d'un quotidien bourgeois. A chaque étape, la mécanique prend forme sous nos yeux, insidieuse, inéluctable. Chronique d'une mise à mort annoncée, ce roman haletant nous entraîne au coeur de la bourgeoisie belge, où il est courant de tutoyer son banquier et où la violence se dissimule derrière les façades de briques blanches.",isbn:"9782378805814",extraUrl:"https://covers.openlibrary.org/b/isbn/9782378805814-M.jpg"},
  {t:"¡Vamos!",a:"Ruiz Olivia",y:"2026",ed:"Jean-Claude Lattès",cote:"R RUI",pub:"Adulte",sup:"Imprimé",d:"D'Orlando à Madrid, du café de Marseillette aux rives du Nil, des poésies déclamées sur le port d'Essaouira aux fêtes endiablées de La Havane, Lola s'est donné un an pour transmettre à son petit garçon Ennio ce que l'école ne pourra jamais lui apprendre mais que peut une mère : l'amour de la vie et de l'autre. Et si en chemin elle pouvait se retrouver elle-même, leur échappée prendrait tout son sens... Porté par la plume racée d'Olivia Ruiz, à la fois poétique et puissante, ¡Vamos! nous entraîne dans un tourbillon d'émotions et de sensations, de couleurs et de saveurs. Un voyage à l'énergie contagieuse, une ode à la filiation, un roman à fleur de peau.",isbn:"9782709674935",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709674935-M.jpg"},
  {t:"L'amour est dans le thé - Tome 12",a:"Yamanaka Umebachi",y:"2026",ed:"Glénat Manga",cote:"BD AMO",pub:"Adulte",sup:"Imprimé",d:"Chako et Isshin se sont enfin unis ! Leur relation commence à se concrétiser. Pour soutenir l’activité de la plantation Hananoki, Chako a décidé de faire ses débuts dans la production de thé roulé lors d’un événement organisé par monsieur Otori, un entrepreneur sagace de Kyoto. Mais le recrutement de Chako par monsieur Otori entraîne des conséquences inattendues… Une douce vie de jeunes mariés semble à portée de main… mais cette perspective est emportée par un scandale impliquant un jeune homme raffiné de Kyoto !",isbn:"9782344071441",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344071441-M.jpg"},
  {t:"Les Insatiables",a:"Peyraube Marie",y:"2026",ed:"Stock",cote:"364.153 PEY",pub:"Adulte",sup:"Imprimé",d:"Cette histoire est celle d'une époque et d'un déni. C'est un voyage dans la folie des années 1980-1990, L'âge d'or des podiums et des soirées jet set, où la cocaïne et le champagne coulent à flots. C'est aussi celle d'une ère ambiguë, où sous couvert de liberté, de glamour et d'insolence, on a laissé prospérer, à L'ombre de l'industrie la plus envoûtante de la planète, un système de prédation sexuelle d'une ampleur inédite. Si l'affaire Epstein est un scandale planétaire, on ignore que cette bombe a été activée en France. Dès la fin des années 1970, des directeurs d'agence de mannequins tout-puissants, des photographes, des bookeurs ont profité de leur influence pour abuser de jeunes adolescentes venues tenter leur chance à Paris. Un trafic sexuel dissimulé, protégé par l'entre-soi et le silence. Quand Epstein apparaît des années plus tard, la mécanique est déjà bien huilée. Il se glisse dans le système, il optimise, il industrialise. Aujourd'hui, la loi du silence se fissure. En s'appuyant sur des témoignages exclusifs, des archives judiciaires et des documents déclassifiés du dossier Epstein, Marie Peyraube livre une enquête choc, qui interroge l'enracinement de La culture du viol et les méandres toxiques du milieu du mannequinat.",isbn:"9782234112230",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234112230-M.jpg"},
  {t:"Morvan",a:"Belpois Bénédicte",y:"2026",ed:"Gallimard",cote:"R BEL",pub:"Adulte",sup:"Imprimé",d:"\"Je ne sais pas pourquoi, mais, à la dernière bouchée avalée sans faim, il s'est brisé quelque chose en moi, une sorte d'amarre qui m'attachait là, à caboter inlassablement contre le crépi moisi de la maison. J'ai senti nettement quelque chose se défaire, qui m'a laissé libre, vacillant, légèrement groggy. Je suis allé dans ma chambre, j'ai fait une valise rapidement sans vraiment réfléchir à quoi emporter\". Un jeune homme solitaire, surnommé Morvan, décide de tout laisser derrière lui un dimanche de printemps : sa maison ardéchoise, son travail d'ouvrier agricole et ses douloureux souvenirs auprès d'un père alcoolique. Sa route va croiser celle de Monica et de Giovanni, dans une pizzeria au pied du mont Blanc, et sa vie prendra dès lors un tour inattendu, à la faveur de l'amour et de l'amitié. Le trio nous entraîne dans une équipée romanesque entre la France, l'Italie et la Suisse, en passant par l'Espagne imaginaire contée par la Duquesita, une vieille femme qui les marquera à jamais. Avec ce roman à l'écriture vibrante, porté par des personnages d'une profonde humanité, Bénédicte Belpois explore le mystère des paysages que chacun porte en soi.",isbn:"9782073132390",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073132390-M.jpg"},
  {t:"Theo",a:"Levi Allen",y:"2026",ed:"Jean-Claude Lattès",cote:"R LEV",pub:"Adulte",sup:"Imprimé",d:"Un matin de printemps, un étranger arrive dans la petite ville américaine de Golden. Personne ne sait d'où il vient. Ni pourquoi. Il s'appelle Theo. Et pose bien plus de questions qu'il n'apporte de réponses. Il se rend au café du coin, où quatre-vingt-douze portraits sont accrochés aux murs - des dessins au crayon des habitants de Golden réalisés par un artiste local. Il les achète, un par un, afin de les remettre entre les mains de leurs \"véritables propriétaires\" . A chaque rencontre, une histoire est racontée, une amitié naît et une vie est transformée. Ode au don et à la bienveillance, au regard porté sur l'autre, Theo est un roman sur le pouvoir de la générosité, l'importance de l'émerveillement pour mener une vie pleine de sens. Traduit de l'anglais (Etats-Unis) par Sophie Aslanides \"Son récit rappelle ceux de Paulo Coelho, il nous apprend à regarder avec respect les multiples bifurcations de la vie\". The Washington Post \"Theo est un véritable miracle de bouche-à-oreille\". The New York Times \"Poignant\". Publishers Weekly",isbn:"9782709677363",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709677363-M.jpg"},
  {t:"La reine des bandits",a:"Shroff Parini",y:"2026",ed:"Mercure de France",cote:"R SHR",pub:"Adulte",sup:"Imprimé",d:"\"Gandhiji n'avait pas toujours raison. Lorsque quelqu'un menace ton corps, tu as tout à fait le droit de te protéger. La résistance passive c'est peut-être bien pour les manifestations pour la liberté, mais pas quand quelqu'un essaie de te violer. Tu n'es pas obligée d'aimer les connards qui t'oppriment, ne laisse personne te dire le contraire\". En Inde, parfois mieux vaut être veuve que mariée ! Pour Geeta, c'est indéniable. Il y a cinq ans, son mari violent a disparu sans laisser de trace. Le mystère reste entier, mais dans son village tout le monde pense qu'elle l'a tué... Depuis, elle s'épanouit et, grâce au groupe de microcrédit qu'elle a rejoint, sa petite entreprise de bijoux artisanaux est florissante. Sa tranquillité de veuve fait bien des envieuses. Bientôt, Farah vient lui demander conseil pour se débarrasser de son propre époux. Puis c'est au tour de Preity... Les sollicitations de femmes mariées affluent, et Geeta est prise dans un engrenage de vengeances qu'elle ne maîtrise plus - à moins qu'il ne s'agisse de solidarité féminine en action ?",isbn:"9782715267701",extraUrl:"https://covers.openlibrary.org/b/isbn/9782715267701-M.jpg"},
  {t:"Carnet de potes",a:"Erroc",y:"2025",ed:"Bamboo Edition",cote:"BDJ ERR",pub:"Jeunesse",sup:"Imprimé",d:"Plus forts que Zorro, plus courageux qu'Indiana Jones et bien moins payés que James Bond, ces enseignants de choc n'hésitent pas à braver quotidiennement la jungle étouffante des lycées peuplés de tribus d'élèves hostiles. Suivez le prof adepte de Napoléon, le prof de gym survitaminé, le prof de français sexy, le prof de philo blasé et la prof d'anglais peau de vache dans leur croisade contre l'ignorance et le poil dans la main !",isbn:"9791041112173",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791041112173-475x500-1.jpg"},
  {t:"Gryfenfer",a:"Sobral Patrick",y:"2014",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Récit du passé de Danaël, l'un des héros de Les Légendaires. D'un caractère impétueux, le jeune Faucon d'argent ne parvient pas à s'intégrer au corps d'armée dirigé par son frère. Prix Essentiel Jeunesse du meilleur album, Angoulême 2013",isbn:"9782756041278",extraUrl:"https://www.bedetheque.com/media/Couvertures/215609_c.jpg"},
  {t:"Avant moi",a:"Houssais Emmanuelle",y:"2026",ed:"Editions du Ricochet",cote:"A HOU",pub:"Jeunesse",sup:"Imprimé",d:"Un album unique qui raconte l'évolution aux plus jeunes. Ce magnifique album répond avec simplicité aux questions des enfants sur l'origine de la vie sur Terre. Depuis le Big Bang jusqu'à la naissance d'un enfant, chaque étape de l'évolution est expliquée : formation des planètes, premières formes de vie dans les océans, apparition de la vie terrestre... Le texte est accompagné de sublimes illustrations vives et colorées pour une immersion complète !",isbn:"9782352635574",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782352635574-475x500-1.jpg"},
  {t:"Les archanges de la nuit",a:"Fouassier Éric",y:"2026",ed:"Albin Michel",cote:"R FOU",pub:"Adulte",sup:"Imprimé",d:"Avril 1834. On retrouve un homme assassiné dans le palais de la Bourse, l'un des lieux emblématiques de cette monarchie de Juillet qui a fait de l'argent son nouveau dieu. Sur le cadavre, un texte aux accents prophétiques, sur son front un symbole mystérieux gravé au fer rouge et dans sa bouche, du plomb fondu. L'affaire, d'autant plus délicate que la victime est un riche banquier, soutien du régime, est confiée à Valentin Verne. Ce meurtre semble s'inscrire dans une série d'assassinats commis dans des circonstances similaires. En outre, les textes, extraits du Livre d'Hénoch, dénoncent l'accumulation des richesses. Et les métaux qui obstruent la bouche des victimes, ainsi que les symboles gravés sur leur front, correspondent aux étapes du Grand OEuvre, celles de la transmutation alchimique. Qui sont ces archanges qui suivent des préceptes hermétiques pour tuer des personnalités emblématiques de la société nouvelle ? Une nouvelle enquête de l'inspecteur Valentin Verne, le génial créateur du Bureau des affaires occultes, où la science flirte avec le vice et le crime.",isbn:"9782226486721",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226486721-M.jpg"},
  {t:"Le banc",a:"Smith Géraldine",y:"2026",ed:"Albin Michel",cote:"R SMI",pub:"Adulte",sup:"Imprimé",d:"Drôle, tendre, bouleversant. Mélissa da Costa Coup de coeurde Valérie Expert - Sud Radio Un très joli roman, malicieux, drôle. Sophie Aurenche RTL Le roman dresse une galerie bouleversante de portraits et offre un regard tendre et réaliste sur le grand âge. Biblioteca Chaque jour, à la résidence des Merles bleus, Georges, 95 ans, Marcel, de six ans son cadet, et Jean-Marc, fraîchement retraité, se retrouvent sur leur banc. Ensemble, ils devisent sur le monde qui passe... et celui qui s'efface. Un matin, Georges est retrouvé mort au fond de son lit, dans des circonstances suspectes. Qui aurait pu vouloir la peau du nonagénaire ? Isabelle et Paul, ses enfants ? Mariola, son auxiliaire de vie ? Chantal, qui lui faisait la lecture... et les poches ? Alain, le \"shérif\" de l'immeuble ? Ou Abdel, le gérant de la baraque à frites ? Avec une immense tendresse pour ses personnages, Géraldine Smith signe un roman policier aussi léger que subtil. Car sous les pas de l'inspecteur Moussa Mballo, une vérité se dessine : le très grand âge cache parfois une jeunesse intacte, simplement rangée dans la cave des souvenirs. Géraldine Smith vit en Caroline du Nord. Elle a publié plu-sieurs livres de non-fiction dont, chez Stock, Vu en Amérique, bientôt en France (2018) et Rue Jean-Pierre-Timbaud (2016). Le banc est son premier roman.",isbn:"9782226502834",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226502834-M.jpg"},
  {t:"Après les ténèbres",a:"Delomme Martine",y:"2026",ed:"Presses de la Cité",cote:"R DEL",pub:"Adulte",sup:"Imprimé",d:"Une riche famille de marchands d'art, un tableau de Matisse disparu pendant la guerre, une étudiante curieuse et déterminée... Pour mener son enquête, Marion osera-t-elle faire émerger les sombres secrets du passé ? Par l'autrice de La Résistance des coeurs . Etudiante en droit et en histoire de l'art, Marion revient à Apt auprès de ses parents à l'occasion d'un stage chez Fabien Goldberg, notaire et homme politique à la carrière prometteuse. Séduit par le charme et l'enthousiasme de la jeune fille, celui-ci l'invite dans son domaine familial et lui fait admirer quelques tableaux de grands maîtres. Une toile de Matisse retient l'attention de Marion. Ce Soleil couchant à Collioure ne ferait-il pas partie des oeuvres disparues pendant la Seconde Guerre mondiale ? Le mystère qui se cache derrière cette découverte va bouleverser le destin de Marion et de ceux qu'elle aime. Martine Delomme signe un roman captivant entre histoire d'amour, intrigues et enquête sur les ombres du passé.",isbn:"9782258212770",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258212770-M.jpg"},
  {t:"L'âge expérimental",a:"De Luca Erri",y:"2026",ed:"Gallimard",cote:"305.26 LUC",pub:"Adulte",sup:"Imprimé",d:"\"J'ai l'étrange sensation que personne n'a été vieux avant moi. La vieillesse de ceux qui m'ont précédé ne me sert pas de modèle et ne me prépare à rien. Lorsqu'elle arrive, c'est la première fois pour le corps de chacun\". Jamais une génération n'avait atteint un âge avancé en aussi grand nombre et dans un état aussi actif, constate Erri De Luca. La vieillesse devient aujourd'hui un territoire inédit, un âge encore largement à inventer, qui ne se réduit pas à un temps de repli ou de contemplation nostalgique. Elle ouvre au contraire un espace de découverte, offre une occasion de porter un regard neuf sur soi-même et sur les autres, d'entraîner son corps et son esprit avec plus de conscience, et peut-être avec plus de plaisir. Le contrepoint d'Ines de la Fressange, sensible et amical, vient enrichir cette réflexion d'une dimension nouvelle. Sa voix complice dialogue avec celle d'Erri De Luca et donne chair à l'exploration de cet \"âge expérimental\", vécu non comme un crépuscule, mais comme un moment de transmission, d'élan et de réinvention.",isbn:"9782073119827",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073119827-M.jpg"},
  {t:"World Without",a:"Sobral Patrick",y:"2017",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"En 2004 naquit ce qui allait devenir LE phénomène éditorial de la bande dessinée jeunesse du début du XXIe siècle : Les Légendaires. Dans ce tome 20, Artémus et ses compagnons auront fort à faire pour éviter le pire... C'est un grand jour à Orchidia ! Des quatre coins d'Alysia, les grands de ce monde sont venus assister à l'épreuve du bâtonaigle de Jadilyna qui désignera la princesse Shun-Day comme reine du royaume à la place de sa tante, l'impitoyable Invidia. Mais dans l'ombre de cet événement se trame une sombre machination qui pourrait bien finir en tragédie. Mais qui est visé par cet infâme complot ?",isbn:"9782756064765",extraUrl:"https://www.bedetheque.com/media/Couvertures/Couv_312707.jpg"},
  {t:"Cendrillon",a:"Dahl Roald",y:"2025",ed:"Gallimard",cote:"C DAH",pub:"Jeunesse",sup:"Imprimé",d:"Vous pensez connaître cette histoire ? Vous vous trompez... Cendrillon veut aller au bal ! Entendant ses pleurs, sa marraine la bonne fée apparaît et hop ! D'un coup de baguette magie, Cendrillon est prête à se rendre au palais et... vous connaissez la suite, à rencontrer son prince charmant. Mais les apparences sont trompeuses, et ce prince-là n'est peut-être pas aussi parfait qu'il n'y paraît...",isbn:"9782075228749",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075228749-475x500-1.jpg"},
  {t:"Bienvenue à Dietland",a:"Walker Sarai",y:"2026",ed:"Editions Gallmeister",cote:"R WAL",pub:"Adulte",sup:"Imprimé",d:"Prune vit dans l'ombre, prisonnière d'un corps que la société refuse d'accepter. Rédactrice anonyme pour un magazine destiné aux adolescentes, elle répond aux lettres désespérées de jeunes filles brisées. Mais l'apparition mystérieuse d'une jeune femme aux collants colorés et le mot énigmatique \"Dietland\" tracé sur sa paume vont tout bouleverser. Prune découvre un monde où les femmes refusent les diktats de la beauté et de la minceur. Tandis qu'un mouvement féministe radical et violent du nom de \"Jennifer\" secoue le pays, elle doit choisir : continuer à fuir son reflet ou enfin affronter la vérité sur elle-même. Entre rage contenue et quête d'identité, Sarai Walker signe un roman féministe coup de poing, aussi féroce que libérateur, qui interroge avec audace les normes étouffant les femmes.",isbn:"9782404081090",extraUrl:"https://covers.openlibrary.org/b/isbn/9782404081090-M.jpg"},
  {t:"Jaune soleil",a:"Chevillard Éric",y:"2026",ed:"Les Editions de Minuit",cote:"R CHE",pub:"Adulte",sup:"Imprimé",d:"C'était il y a longtemps, au Moyen Age peut-être ou dans l'enfance, Philéon aimait Godelive, une fille avec le cou très fin et des cheveux jaune soleil. Clodomir aussi était épris d'elle, allait-il falloir se battre ? Aujourd'hui, on se demande surtout ce que monsieur Ristretto, vieil écrivain qui observe le monde avec perplexité depuis la terrasse du café Les Grands Ducs, on se demande bien ce qu'il fait là, au milieu de ces souvenirs.",isbn:"9782707357663",extraUrl:"https://covers.openlibrary.org/b/isbn/9782707357663-M.jpg"},
  {t:"Le domaine aux secrets",a:"Musso Valentin",y:"2026",ed:"Julliard",cote:"R MUS",pub:"Adulte",sup:"Imprimé",d:"Un été. Deux drames. Une vie entière pour affronter la vérité. 1962. Adrien Blondeau, quinze ans, arrive à la Vénerie, vaste domaine niché dans la campagne lyonnaise, où sa mère vient d'obtenir un poste de gouvernante. Le maître des lieux, Henri Mallet, député respecté et ancien résistant, le prend sous son aile. Bientôt, le garçon tombe sous le charme de Clara, la cadette de la famille. Brillante, rebelle, elle brûle d'échapper à l'univers bourgeois dans lequel elle a grandi. Dans la lumière d'un été fait de confidences et de baignades à la rivière, Adrien vit son premier amour. Mais en un après-midi, tout bascule... Vingt ans plus tard, devenu journaliste, Adrien retourne à la Vénerie, appelé au chevet d'un Henri Mallet mourant. Leurs ultimes échanges poussent Adrien à affronter le passé. Il se lance alors dans une enquête qui changera à jamais ce qu'il croyait savoir sur Clara, sur sa \" famille d'adoption \", et sur lui-même. De la Résistance à nos jours, Valentin Musso tisse un suspense psychologique captivant sur la mémoire, le désir et les secrets de famille, où la vérité n'éclate que dans les dernières pages.",isbn:"9782260056744",extraUrl:"https://covers.openlibrary.org/b/isbn/9782260056744-M.jpg"},
  {t:"La Baronne de minuit",a:"Duquesnoy Isabelle",y:"2025",ed:"Seuil",cote:"R DUQ",pub:"Adulte",sup:"Imprimé",d:"Après L'Oiseleuse de la Reine, le second volet de la saga féroce et charnelle du CHATEAU DES SOUPIRS ! 1789. Le coeur brisé, Liselotte de Beaupré doit quitter Narong, son mystérieux amant venu du Siam, et fuir son domaine menacé par les révolutionnaires. Démunie et seule, elle cherche à gagner l'Angleterre, comme tant d'autres aristocrates terrorisés. Lorsqu'au prix de combines honteuses, la baronne déchue débarque enfin à Londres, elle devient une proie à la merci d'employeurs cupides et implacables. Jusqu'au jour où, engagée comme préceptrice par un Lord naturaliste du roi George III, elle s'attache à une merveilleuse petite fille condamnée à ne vivre que la nuit... Dans l'étrange manoir peuplé d'ombres et d'animaux empaillés, Liselotte semble avoir trouvé un havre de paix. Mais sa vraie famille lui manque cruellement. Pourra-t-elle réaliser son rêve fou de regagner la France pour revoir Narong ? De gouverner enfin librement son domaine autant quesa vie de femme ? Diplômée d'histoire et de restauration du patrimoine, Isabelle Duquesnoy est l'autrice de romans historiques à succès, parmi lesquels L'Embaumeur et La Redoutable Veuve Mozart, salués par la critique et récompensés par de nombreux prix.",isbn:"9782386432538",extraUrl:"https://covers.openlibrary.org/b/isbn/9782386432538-M.jpg"},
  {t:"L'axe du loup",a:"Tesson Sylvain",y:"2004",ed:"R. Laffont",cote:"910.4 TES",pub:"Adulte",sup:"Imprimé",d:"Pendant huit mois, Sylvain Tesson a refait le long voyage de la Sibérie au golfe du Bengale qu'effectuaient naguère les évadés du Goulag. Pour rendre hommage à ceux dont la soif de liberté a triomphé des obstacles les plus grands, seul, il a franchi les taïgas, la steppe mongole, le désert de Gobi, les Hauts Plateaux tibétains, la chaîne himalayenne, la forêt humide jusqu'à la montagne de Darjeeling. A pied, à cheval, en vélo, sur six mille kilomètres, il a connu ce qu'il a cherché de plein gré : le froid, la faim, la solitude extrême. La splendeur de la haute Asie l'a récompensé, comme les mots d'une très ancienne déportée heureuse de se confier à lui : \"On a le droit de se souvenir\".",isbn:"9782221100417",extraUrl:"https://covers.openlibrary.org/b/isbn/9782221100417-M.jpg"},
  {t:"La veuve",a:"Saramago José",y:"2026",ed:"Seuil",cote:"R SAR",pub:"Adulte",sup:"Imprimé",d:"Le premier roman de José Saramago. Au début du XXe siècle, dans un petit village du Portugal, une femme de trente ans, mère de deux jeunes enfants, perd subitement son mari. Si elle chasse sa mélancolie en s'occupant du domaine agricole familial, elle tombe dans les affres du désir et cède, un court instant, aux avances de son beau-frère. Le regard accusateur de sa fidèle domestique la plonge dans un enfer de culpabilité et de remords. Tensions, crises de nerfs, incompréhensions rythment les journées, heureusement ponctuées des rires des enfants et de leurs promenades dans les champs écrasés de soleil. Jusqu'à une demande en mariage inattendue. Pour ses premiers faits d'armes, à seulement vingt-quatre ans, José Saramgo signe un texte remarquablement abouti, lumineux, marqué par une atmosphère enveloppante et hors du temps qui tient à la beauté des paysages et à la légèreté du monde de l'enfance. Surtout, derrière le charme suranné, pointent déjà le style du grand Saramago et les thématiques qui lui seront chères.",isbn:"9782021566246",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021566246-M.jpg"},
  {t:"La mariée silencieuse",a:"Pulixi Piergiorgio",y:"2026",ed:"Editions Gallmeister",cote:"R PUL",pub:"Adulte",sup:"Imprimé",d:"Une vague de féminicides d'une violence inouïe secoue la ville de Milan. Lorsque Maria Donata est retrouvée assassinée, vêtue d'une robe de mariée qui n'est pas la sienne, son père Italo, vieil homme brisé mais déterminé, supplie qu'on ne laisse pas l'affaire sombrer dans l'oubli. Après huit mois d'enquêtes infructueuses, il n'a plus qu'un seul espoir : Vito Strega. Si Eva et Mara, ainsi que les autres membres de l'équipe de Vito, traversent une mauvaise passe, aucun n'a le coeur de décevoir Italo. Entre Milan et la Sardaigne, les policiers plongent dans les abîmes de la haine et de l'obsession. Mais dans cette affaire plus déstabilisante que prévu, certains secrets du passé menacent de tout faire basculer. Piergiorgio Pulixi nous entraîne dans les ténèbres d'une société contemporaine où, chaque jour, la haine des femmes prospère.",isbn:"9782351783986",extraUrl:"https://covers.openlibrary.org/b/isbn/9782351783986-M.jpg"},
  {t:"Les vaisseaux noirs",a:"Jurgensen Axel",y:"2026",ed:"Albin Michel",cote:"R JUR",pub:"Adulte",sup:"Imprimé",d:"Prix Jules-Sandeau 2026 Une odysée captivante. Version Femina Une entrée en littérature particulièrement aboutie. Lire Axel Jurgensen réinvente le peplum littéraire. Le Figaro Magazine D'une écriture remarquablement maitrisée, ce page-turner ambitieux mérite notre attention. Marianne Pélée, prince déchu et chasseur solitaire, s'éprend d'une nymphe marine : la belle Thétis à la chevelure d'algues. De leurs noces somptueuses auxquelles prennent part les dieux de l'Olympe naîtront le plus valeureux des Grecs, Achille, mais aussi la plus emblématique des guerres, celle de Troie. S'inspirant de cette rencontre originelle et des destins croisés d'Achille et de son contraire troyen, Pâris, Axel Jurgensen retrace dans ce premier roman la montée inexorable du conflit qui, selon la légende, embrasa il y a trois mille ans les rives de la Méditerranée. Aux prises avec des dieux tout-puissants et capricieux, les héros grecs et troyens tenteront de recouvrer leur liberté et d'éviter un affrontement inéluctable. A court d'expédients, ils devront se résoudre à embarquer à bord de leurs \" vaisseaux noirs\", à la rencontre de leur destin. Le poème d'Homère peut commencer... Imprégné de poésie, porté par un souffle épique, Les Vaisseaux noirs, qui ressuscite avec brio une épopée perdue, résonne aujourd'hui avec une force toute particulière.",isbn:"9782226512659",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226512659-M.jpg"},
  {t:"La fabrique du mal",a:"Delcroix Angélina",y:"2026",ed:"Michel Lafon",cote:"R DEL",pub:"Adulte",sup:"Imprimé",d:"Le nouveau thriller événement d'Angélina Delcroix après le best-seller Mémoires d'un expert psychiatre . \" Un chef d'oeuvre. Terrifiant, magistralement écrit, inoubliable. \" Jean-Michel Barland, La Provence A quinze ans, on devrait encore être un enfant. Pas un tueur. Un thriller glaçant et contemporain.",isbn:"9782749964003",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749964003-M.jpg"},
  {t:"Les grues volent vers le sud",a:"Ridzén Lisa",y:"2026",ed:"Editions La Peuplade",cote:"R RID",pub:"Adulte",sup:"Imprimé",d:"Bo n'a plus beaucoup de temps devant lui. A quatre-vingt-neuf ans, il vit isolé dans un village suédois et sa santé décline rapidement. Sa solitude n'est troublée que par le va-et-vient de ses aides à domicile. Parmi les rares choses qui lui restent, il y a les appels à son meilleur ami et la fidèle compagnie de Sixten, son gros chien auquel il tient comme à la prunelle de ses yeux. Bo aime s'endormir avec lui, sa main enfouie dans l'épais pelage. Quand son fils juge qu'il ne peut plus s'occuper d'un tel animal, l'orgueilleux Bo plonge dans un tourbillon d'émotions. Père et fils n'ont jamais su communiquer. Comment dire aujourd'hui ce qui compte vraiment ? Bo dresse le bilan de sa vie, de ses liens familiaux, et se penche sur la façon imparfaite dont il a exprimé son amour au fil des ans. Bestseller international profondément émouvant, gagnant du Prix du livre de l'année en Suède, Les grues volent vers le sud est le récit d'une dernière réconciliation. Lisa Ridzén célèbre la beauté des lumières du crépuscule avec une oeuvre irrésistible, traduit dans plus de quarante langues.",isbn:"9782925416890",extraUrl:"https://covers.openlibrary.org/b/isbn/9782925416890-M.jpg"},
  {t:"Le bon mal",a:"Schweblin Samanta",y:"2026",ed:"Grasset & Fasquelle",cote:"R SCH",pub:"Adulte",sup:"Imprimé",d:"Après Sept maisons vides, couronné en 2022 par le prestigieux National Book Award du meilleur livre étranger et applaudi par la critique française et internationale, nous retrouvons l'autrice argentine Samanta Schweblin avec son nouveau livre \" d'une rare puissance évocatrice \" (Joyce Carole Oates). Une mère s'installe dans sa cuisine avec ses filles, malgré l'odeur de vase du lac où elle a tenté de se noyer ; une architecte argentine reconnaît un petit garçon disparu dans l'oeil d'un cheval maltraité ; un père n'arrive plus à soutenir le regard de son fils qui, après avoir avalé une pile, a dû subir une trachéotomie ; une femme héberge la patiente d'une maison de retraite en fugue, avant de se faire séquestrer par le fils de cette dernière... Autant de situations de non-retour où le bien et le mal sont inextricablement liés. Fragiles, les personnages de ces histoires sont saisis à l'instant où l'étrangeté fait irruption dans leur vie - laissant les uns face à la douleur, les autres aux prises avec la culpabilité, et pour tous un besoin de tendresse plus puissant que jamais. La prose de Schweblin, tout en tension, forme un univers où les monstres du quotidien nous observent de si près qu'on croirait sentir leur souffle. Plongeant le lecteur dans un état d'alerte aussi troublant qu'hypnotique, Le bon mal est une expérience de lecture inoubliable. Traduit de l'espagnol (Argentine) par Isabelle Gugnon",isbn:"9782246840275",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246840275-M.jpg"},
  {t:"La Ville d'Hiver",a:"Bona Dominique",y:"2005",ed:"Grasset",cote:"R BON",pub:"Adulte",sup:"Imprimé",d:"Consciente d'être parvenue à un tournant de sa vie, Sarah a trouvé refuge dans une villa de la Belle Epoque, sur les hauteurs d'Arcachon. La maison, à la chaleur de serre, la fascine. Entourée d'un paysage délavé de gris, elle se prend à rêver des passions et des fièvres dont la ville a été jadis le théâtre.",isbn:"9782246633716",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246633716-M.jpg"},
  {t:"Le Braconnier du lac perdu",a:"May Peter",y:"2014",ed:"Actes Sud",cote:"R MAY",pub:"Adulte",sup:"Imprimé",d:"Depuis qu'il a quitté la police, Fin Macleod vit sur son île natale des Hébrides, à l'ouest de l'Ecosse. Engagé pour pourchasser les braconniers qui pillent les eaux sauvages des domaines de pêche, il se trouve confronté à Whistler, son ami de jeunesse qui vit désormais comme un vagabond, privé de la garde de sa fille unique. Alors qu'ils viennent de traverser ensemble une nuit d'orage, ils découvrent l'épave d'un avion abritée depuis dix-sept ans par un lac. L'appareil, qu'on avait cru abîmé en mer, recèle le corps d'un homme assassiné. Opus final de la \"Trilogie de Lewis\", Le Braconnier du lac perdu en est aussi le plus apocalyptique. Tandis que resurgissent les démons enfouis et que les insulaires affrontent une nature dévastatrice, l'heure des comptes a sonné et les damnés viennent réclamer leur lot de victimes.",isbn:"9782330026950",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330026950-M.jpg"},
  {t:"Ulysse",a:"Joyce James",y:"2004",ed:"Gallimard",cote:"823 JOY",pub:"Adulte",sup:"Imprimé",d:"Une première traduction de l'Ulysse de James Joyce, de la plume d'Auguste Morel, assisté à des degrés divers par Stuart Gilbert, Valery Larbaud et l'auteur, a vu le jour en 1929 à La maison des Amis des Livres d'Adrienne Monnier. Elle a donc dépassé \" l'âge antédiluvien maximum de 70 ans \", que James Joyce prend soin de rappeler dans son livre après avoir dûment établi l'étroite correspondance entre la littérature et l'existence humaine... La présente traduction s'adresse, elle, aux générations d'aujourd'hui, pour lesquelles la lecture, l'écriture, et leur intrication, constitutive de la tradition littéraire, introduisent à un univers autre, textuel, marqué par la diversité et la polyphonie. Ce parti explique le choix fait des traducteurs : un tiers de ces pages a été traduit par des écrivains, un autre par un traducteur littéraire, un troisième par des universitaires.",isbn:"9782070763498",extraUrl:"https://covers.openlibrary.org/b/isbn/9782070763498-M.jpg"},
  {t:"Dansez sans moi",a:"Shalev Zeruya",y:"2026",ed:"Gallimard",cote:"R SHA",pub:"Adulte",sup:"Imprimé",d:"En quatre-vingt-neuf brefs chapitres, une femme tire le fil d'un monologue féroce et débridé, traversé par le désarroi. Dans cette confession en forme de performance, il ne fait aucun doute qu'elle a tout perdu : sa fille, ses amours, sa famille, ses cheveux, jusqu'à son propre nom. Oscillant entre fureur et désir, crainte et regret, elle livre plusieurs versions de son histoire, la déforme, la réinvente, la pousse dans ses retranchements les plus absurdes, les plus démesurés. Plus de trente ans après sa parution en Israël, le premier roman de Zeruya Shalev n'a rien perdu de sa force subversive. Ancré dans un univers à la lisière du rêve, il interroge la maternité, le mariage et le désir dans ce qu'ils ont de plus complexe, parfois de cauchemardesque. En matérialisant des peurs et des angoisses vécues par de nombreuses femmes, Zeruya Shalev en révèle toutes les nuances, annonçant déjà les thèmes majeurs qui ne cesseront d'habiter son oeuvre. Surréaliste et provocateur, Dansez sans moi nous entraîne dans un voyage aussi troublant que fascinant, dont on ne revient pas tout à fait indemne.",isbn:"9782073077837",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073077837-M.jpg"},
  {t:"Chamanes électriques à la fête du Soleil",a:"Ojeda Monica",y:"2026",ed:"Gallimard",cote:"R OJE",pub:"Adulte",sup:"Imprimé",d:"An 5550 du calendrier andin. Noa et Nicole fuient Guayaquil en direction des sommets de la cordillère des Andes et gagnent les flancs du Chimborazo, le plus haut volcan d'Equateur. Là-bas a lieu un festival mythique qui rassemble chamanes, poètes, danseurs et musiciens à l'occasion de la fête du Soleil inca. Avec d'autres festivaliers, les deux jeunes femmes viennent se soustraire à la violence des sociétés menacées par le narcotrafic et les catastrophes climatiques dans cette immense rave party qui vibre au rythme de la technocumbia spatiale. Mais quand la troupe décide de poursuivre l'ascension du volcan, Noa fait face à son destin : partira-t-elle retrouver son père qui mène une existence d'ermite dans les forêts ? D'autant qu'on raconte que là-bas, dans les hauteurs, vivent des communautés secrètes de jeunes disparus qui ne sont jamais revenus du festival... Dans ce roman postapocalyptique au souffle stupéfiant, Mónica Ojeda déploie une fresque ensorcelante qui dépeint une génération désenchantée en quête d'espoir. Sous les pluies de météorites, la musique expérimentale néochamanique et les légendes ancestrales andines s'allient pour réconcilier passé, présent et avenir.",isbn:"9782073075406",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073075406-M.jpg"},
  {t:"Mon refuge et mon orage",a:"Roy Arundhati",y:"2026",ed:"Gallimard",cote:"R ROY",pub:"Adulte",sup:"Imprimé",d:"Mon refuge et mon orage est une invitation à retrouver toute la puissance romanesque de la grande autrice indienne du Dieu des Petits Riens. Dans ce récit littéraire d'une infinie beauté, Arundhati Roy revient sur son passé : une enfance chaotique dans le sud de l'Inde, son émancipation précoce, le goût de l'écriture, la fulgurance du succès international avec le Booker Prize en 1997, puis la découverte que sa plume peut devenir une arme pour déjouer les injustices et la violence du gouvernement indien. Au fil des chapitres, c'est aussi le portrait de sa mère, Mary Roy, qui prend forme. Une grande âme, généreuse et adulée dans sa région pour y avoir bâti une école, mais qui dans l'intimité s'avérait une mère impitoyable et maltraitante. Toute sa vie durant, elle aura été pour sa fille à la fois son refuge et son orage. Dans ce livre magnifique au style luxuriant, Arundhati Roy nous ouvre les portes de sa vie hors norme et haletante, mêlée à celle d'une figure maternelle redoutable mais qui lui a transmis le goût de la liberté, et la nécessité d'écrire.",isbn:"9782073103482",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073103482-M.jpg"},
  {t:"L'empereur de la joie",a:"Vuong Ocean",y:"2026",ed:"Gallimard",cote:"R VUO",pub:"Adulte",sup:"Imprimé",d:"Un soir d'été, sous une pluie battante, Hai se retrouve sur un pont, prêt à sauter. Il faut dire que grandir dans un coin aussi perdu qu'East Gladness peut ôter tout espoir, même à dix-neuf ans. Mais le destin en décide autrement quand Grazina, vieille veuve logeant près de la rive, repère sa silhouette à temps et l'interpelle - c'est ainsi qu'elle sauve Hai, et lui ouvre la porte de sa maison délabrée. Un tandem incongru et joyeux se forme alors entre ce jeune homme d'origine vietnamienne, accro aux opioïdes et mythomane, et cette ancienne réfugiée lituanienne qui n'a plus toute sa tête. Quand ils n'arrivent plus à joindre les deux bouts, Hai décroche un poste dans un fast-food du coin où une bande de marginaux l'accueille chaleureusement. Mais alors qu'il reprend doucement goût à la vie, la santé de Grazina se dégrade sérieusement. Parviendra-t-il pour une fois à ne pas fuir la réalité?",isbn:"9782073090270",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073090270-M.jpg"},
  {t:"Ce qui reste",a:"Schlink Bernhard",y:"2026",ed:"Gallimard",cote:"R SCH",pub:"Adulte",sup:"Imprimé",d:"A soixante-seize ans, Martin apprend qu'il n'a plus que quelques mois devant lui. Il s'attelle alors à mettre sa vie en ordre avant de mourir : il le doit à son épouse, Ulla, et à leur jeune fils, David. Mais comment savoir ce qui sera le plus important pour eux, une fois qu'il ne sera plus là? Et comment profiter ensemble du peu de temps dont ils disposent, tout en préparant celui de l'après ? Dans Ce qui reste, Bernhard Schlink nous invite au coeur d'une famille qui traverse des semaines bouleversantes, parce qu'elles ne reviendront jamais et par ce qu'elles révèlent comme surprises. Posant l'essentielle question de la transmission dans le cadre intime, le grand romancier allemand nous interroge délicatement sur le sens de nos choix, la possibilité du pardon et, en dernière instance, le rôle de l'amour dans nos existences.",isbn:"9782073060631",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073060631-M.jpg"},
  {t:"La onzième heure",a:"Rushdie Salman",y:"2026",ed:"Gallimard",cote:"R RUS",pub:"Adulte",sup:"Imprimé",d:"Avec La onzième heure, le majestueux écrivain Salman Rushdie signe son grand retour à la fiction depuis l'attaque au couteau dont il a été victime en 2022. Ce superbe recueil de nouvelles radieuses et poétiques nous fait voyager dans des royaumes enchanteurs dont l'auteur a le secret. De Bombay au campus d'Oxford, de mythes anciens aux décors d'aujourd'hui, ce conteur-né renoue avec les univers et les thèmes qui ont fait la richesse de son oeuvre : cadres luxuriants, histoires de fantômes, curiosités du destin, liens d'amitié invincibles, prodiges artistiques... Autant de manières romanesques et singulières d'interroger le sens de la vie.",isbn:"9782073125347",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073125347-M.jpg"},
