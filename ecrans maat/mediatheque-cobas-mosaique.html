  {t:"Trop de bananes",a:"Courgeon Rémi",y:"2024",ed:"Milan",cote:"A COU",pub:"Jeunesse",sup:"Imprimé",d:"\" Any, sans son grand-père, ne serait pas vraiment Any. Il est le phare de sa vie. Un vieux à roulettes qui peint la mer depuis plus de quatre-vingts ans, tous les jours, en râlant qu'il n'y arrive jamais, que c'est tellement plus beau en vrai. Any aussi dessine tous les jours. Tout et n'importe quoi. C'est une artiste un peu cinglée, mais un seul adjectif n'est pas suffisant pour parler d'elle... \" Un personnage féminin fort Sous les mots et les pinceaux de Rémi Courgeon, cette histoire nous dresse le portrait d'Any, une jeune fille forte, déterminée, passionnée et rêveuse. Un personnage très attachant et inspirant dont les dessins animent l'album du début à la fin. Un album sur la relation entre un grand-père et sa petite-fille Rémi Courgeon décrit une très belle relation entre le grand-père et sa petite-fille, réunis par leur amour du dessin et leur caractère bien trempé. Un album drôle et émouvant à la fois. \" Cette histoire pleine d'humour et d'énergie, un brin loufoque, aux illustrations très colorées, nous montre comment une passion peut habiter toute une vie\". Frédérique Franco (Librairie Le Goût des mots, Mortagne-au-Perche) \"Elles ne sont pas fréquentes, les histoires abracadabrantes, qui tiennent sur la longueur sans signe d'essoufflement. Cet album en raconte une, fondée sur l'excentricité de son héroïne, fascinée par les peaux de banane. Non pas pour les semer sous les pieds des inopportuns, mais pour en faire des tableaux, des collages, voire des sculptures. Quelle sacrée personnalité Rémi Courgeon lui a donnée, en plus d'un nez de peinture sortie du tube et de cheveux en poils de pinceau écrasé ! \" Télérama",isbn:"9782408050757",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408050757-475x500-1.jpg"},
  {t:"Shibu et ses émotions",a:"Thomas Tess",y:"2026",ed:"Gallimard",cote:"A OLL",pub:"Jeunesse",sup:"Imprimé",d:"Un album plein d'humour et de poésie qui célèbre l'importance d'exprimer ses émotions et la joie d'être soi-même!<br>Shibu d&#x00E9;borde d'&#x00E9;motions, et il adore les partager ! Il peut se montrer fier ou triste, rempli de col&#x00E8;re ou d'amour... Et bien plus encore ! Mais un doute l'envahit petit &#x00E0; petit : et si ses &#x00E9;motions &#x00E9;taient trop visibles'Apr&#x00E8;s tout, ses amis sont si discrets..",isbn:"9782075236140",extraUrl:"https://products-images.di-static.com/image/base/9782075236140-475x500-1.jpg"},
  {t:"Le Grand Roi Soleil",a:"Mélèse Mathilde",y:"2026",ed:"Editions Panthera",cote:"A MEL",pub:"Jeunesse",sup:"Imprimé",d:"\"J'étais une petite fille assez solitaire et rêveuse, mais autoritaire avec mon frère et ma soeur, plus jeunes que moi. Vers l'âge de six ans, je me suis créé un ami, un compagnon, pas seulement plus sage que moi, mais aussi bien plus sage que mes parents. Il avait un savoir, un sens de la justice, une bonté, une sévérité et une rigueur, beaucoup plus vastes et solides que les leurs. Le Grand Roi Soleil. Mon Grand Roi Soleil\".",isbn:"9782494182318",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494182318-475x500-1.jpg"},
  {t:"400 fourmis, 3 souris et 1 genou d'éléphant",a:"Taboni Sophie",y:"2026",ed:"Frimousse",cote:"A TAB",pub:"Jeunesse",sup:"Imprimé",d:"Un imagier qui remet tout le monde à sa place ! Vous êtes-vous déjà demandé ce que l'on pourrait mettre dans un livre de 22 cm ? Suivons cette enfant curieuse qui s'est, pour l'occasion, faite toute petite... - Peut-on faire rentrer une fourmi ? - Oui ! Plein de fourmis, même ! - Un poussin ? - Oui ! Ca tient ! Et ainsi de suite, du plus petit au plus grand... Vont-ils tous rentrer dans le livre ? C'est au lecteur de le découvrir !",isbn:"9782383496014",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496014-475x500-1.jpg"},
  {t:"A qui sont ces grandes dents ?",a:"Beau Sandrine",y:"2021",ed:"D'eux",cote:"A BEA",pub:"Jeunesse",sup:"Imprimé",d:"A qui sont ces grandes dents ? Et si on regardait de plus près ? Et si on s'éloignait pour mieux voir...",isbn:"9782924645024",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782924645024-475x500-1.jpg"},
  {t:"One-Punch Man",a:"Murata Yusuke",y:"2026",ed:"Kurokawa",cote:"BD ONE",pub:"Jeunesse",sup:"Imprimé",d:"Saitama est trop puissant ; tellement puissant qu'il élimine tous les monstres les plus farouches avec un simple coup de poing. Découvrez l'histoire du plus puissant des super-héros dans ce manga qui va vous mettre K. O. !! L'affrontement entre Garoh et Saitama est si violent que la Terre est au bord de la destruction. La lutte acharnée, poings contre poings, se poursuit jusque dans l'espace. Face à Garoh, qui exécute les techniques mortelles apprises jusqu'ici, Saitama passe en mode vénère. C'est alors qu'un événement inattendu se produit ! Disponible ne version collector !",isbn:"9791042021665",extraUrl:"https://covers.openlibrary.org/b/isbn/9791042021665-M.jpg"},
  {t:"Echec à la reine",a:"Ilesi Alyerel",y:"2026",ed:"Scrineo",cote:"J ILE",pub:"Adolescent",sup:"Imprimé",d:"Terrasul est dirigé par des reines masquées érigées au rang de divinités. La princesse Viviane est amenée à régner. En attendant, chaque été, ses parents l'envoient loin du palais pour qu'elle puisse vivre encore quelques moments d'insouciance. Elle y rencontre Andreas à qui elle est forcée de cacher sa véritable identité. Et ils tombent amoureux. Malheureusement, leurs devoirs respectifs finissent par les séparer. Car le jeune homme porte lui aussi de lourds secrets. Des années plus tard, Viviane se prépare à défendre son reinaume en guerre. Et se retrouve confrontée au spectre de ses décisions passées... Amour, trahison, complots, pouvoir... un roman magistral porté par de magnifiques personnages, confrontés à des choix impossibles...",isbn:"9782381674926",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782381674926-475x500-1.jpg"},
  {t:"L'Enfant de la vallée",a:"Groenink Chuck",y:"2026",ed:"Little urban",cote:"A GRO",pub:"Jeunesse",sup:"Imprimé",d:"Depuis la grotte de sa montagne, un garçon rêve de retourner dans la vallée. Ici, il a sa famille mais là-bas le monde l'attend. En chemin, des animaux courent, sautent, volent et bondissent partout autour de lui, jusqu'à arriver près de la rivière, là où un autre garçon se trouve...",isbn:"9782374082134",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782374082134-475x500-1.jpg"},
  {t:"Le vol",a:"Barber Caroline",y:"2019",ed:"Éditions Les 400 Coups",cote:"A BAR",pub:"Jeunesse",sup:"Imprimé",d:"Ah ! ce coquin de Philémon Croquenot ! Le voleur veut absolument les dernières longs à la mode pour sa collection. Réussira-t-il à dérober cette 402e paire de chaussures ?",isbn:"9782895408581",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782895408581-475x500-1.jpg"},
  {t:"Yona, Princesse de l'Aube T38",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Afin de préparer la bataille avec le Kai du sud, le pays de Kôka rassemble toutes les tribus sous son égide pour fortifier ses troupes. Accompagnée des quatre guerriers dragons, Yona rallie elle aussi les rangs de l'armée et rejoint le front. Mais qu'est-il advenu de Hak, porté disparu après l'attaque submersive du général Laan'",isbn:"9782811677855",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811677855-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Les combats qui opposent le pays de Kôka et le Kai du sud gagnent en intensité. Bien qu'enrôlé au seinde l'armée du Kai du sud, Hak agit pour la victoire du pays de Kôka, jusqu'au moment où il se retrouve nez à nez avec le Général Laan avec qui il a déjà croisé le fer. Ainsi privé d'anonymat, il se retrouve en péril…",isbn:"9782811680381",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811680381-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Pour sauver Mei Niang des griffes de ses ravisseurs,   Yona et sa bande se sont infiltrés dans le camp  militaire du Kai du sud. Tandis que Hak affronte  le général Hiktan, Val fait irruption et choisit  de le défendre contre ses anciens  compagnons d'armes…",isbn:"9782811687106",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811687106-M.jpg"},
  {t:"Yona, Princesse de l'Aube T40",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Les Dolomos, un groupuscule d'assassins du Kai du Sud, s'infiltrent dans le château de Hiryû avec la ferme intention de le détruire par le feu. Tandis que le général Val et Mei Niang essaient de les repousser, ils ont la mauvaise surprise de voir surgir un personnage inattendu qui va redistribuer les cartes'",isbn:"9782811684853",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811684853-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2025",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Yona et Hak sont de retour à Kûto. Tandis que l atmosphère se fait de plus en plus pesante, ils se dirigent là où tout a commencé pour Zeno, au château de Hiryû...",isbn:"9791043303098",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303098-M.jpg"},
  {t:"Yona, Princesse de l'Aube T46",a:"Kusanagi Mizuho",y:"2026",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Yona et Zeno ont été a aspirés par la coupe de sang. À l'intérieur, ils retrouvent les autres guerriers dragons. Enfin réunie, la petite bande cherche à s'échapper et à rentrer sur Terre'",isbn:"9791043307638",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043307638-M.jpg"},
  {t:"Un Petit Tour",a:"Howe Simon",y:"2026",ed:"Kaléidoscope",cote:"A HOW",pub:"Jeunesse",sup:"Imprimé",d:"Un souriceau et son papa se promènent dans la nature. Ils flânent le long d'un ruisseau, admirent les insectes, les nuages... Mais où vont-ils tous ainsi ? Avec délicatesse, Simon Howe signe un album contemplatif et tendre qui invite à prêter attention à ce qui nous entoure... et à savourer le bonheur simple de retrouver le chemin de la maison.",isbn:"9782378883362",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782378883362-475x500-1.jpg"},
  {t:"Un séisme",a:"Frèche Emilie",y:"2026",ed:"Albin Michel",cote:"364.152 FRE",pub:"Adulte",sup:"Imprimé",d:"Prix du livre politique 2026 Un récit passionnant. Le Point Collection Audiences - un procès, un écrivain Le 16 octobre 2020, Samuel Paty était tué pour avoir enseigné la liberté. En 2024, à la Cour d'assises spéciale de Paris, Emilie Frèche a suivi pour Le Point le procès des huit personnes accusées d'avoir apporté leur concours à son assassin. A travers un journal intime nourri de scènes d'audiences, de dessins pris sur le vif et de portraits des acteurs de ce grand procès terroriste, l'écrivaine dissèque les mécanismes qui ont ébranlé la République dans le sanctuaire qu'était jusque-là l'école. Un professeur a été décapité, c'est un séisme dont on ne se remet pas, dira un enseignant à la barre. Au coeur de ces journées noires, Un séisme donne aussi à voir l'humanité qui s'est déployée face à cette tragédie, et nous interroge sur notre capacité à résister pour faire vivre la démocratie.",isbn:"9782226504685",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226504685-M.jpg"},
  {t:"Piaf",a:"Margolis Noé",y:"2025",ed:"Gallimard",cote:"A MAR",pub:"Jeunesse",sup:"Imprimé",d:"Une plongée dans la vie tourbillonnante d'une icône de la chanson française. Piaf est née à Paris. C'est avec son père qu'elle apprend à chanter dans les rues de Belleville jusqu'à se faire remarquer pour sa voix sublime. Très rapidement, elle devient la voix de la chanson française. Ses immenses succès commeLa vie en rose ou Padampadam l'emmèneront aux Etats-Unis et dans les plus grandes salles de concert du monde. Elle aura pour amis les plus grands de l'époque : Trenet, Cocteau, Monnot. Elle est considérée comme l'une des plus grandes chanteuses de son temps.",isbn:"9782075212724",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075212724-M.jpg"},
  {t:"Un caillou magique",a:"Courtot Béatrice",y:"2026",ed:"Gautier-Languereau",cote:"A COU",pub:"Jeunesse",sup:"Imprimé",d:"Alba adore collectionner les cailloux : les petits, les grands, les pailletés et même les multicolores. Un jour, elle en découvre un nouveau, comme elle n'en a jamais vu... Quelle histoire va-t-il lui raconter ?",isbn:"9782017371014",extraUrl:"https://covers.openlibrary.org/b/isbn/9782017371014-M.jpg"},
  {t:"Une Fin de loup",a:"Camil Jérôme",y:"2019",ed:"Alice",cote:"A CAM",pub:"Jeunesse",sup:"Imprimé",d:"Dans un pré, Super-Mouton, le mouton super fort et super puissant, vole au secours de pauvres brebis attaquées par le Grand Méchant Loup ! J'ai dis attaquées par LE GRAND MECHANT LOUP ! Mais qu'est ce qu'il fabrique ? C'est le moment de l'histoire où le loup est censé entrer sur scène ! Furieux, Super-Mouton décide d'aller lui secouer les puces... Mais il va vite s'apercevoir qu'il n'est pas le seul à vouloir que le loup joue dans son histoire. Dans un pré, Super-Mouton, le mouton super fort et super puissant, vole au secours de pauvres brebis attaquées par le Grand Méchant Loup ! J'ai dis attaquées par LE GRAND MECHANT LOUP ! Mais qu'est ce qu'il fabrique ? C'est le moment de l'histoire où le loup est censé entrer sur scène ! Furieux, Super-Mouton décide d'aller lui secouer les puces... Mais il va vite s'apercevoir qu'il n'est pas le seul à vouloir que le loup joue dans son histoire.",isbn:"9782874263866",extraUrl:"https://covers.openlibrary.org/b/isbn/9782874263866-M.jpg"},
  {t:"Un ours pour deux",a:"Corrigan Patrick",y:"2026",ed:"Kimane",cote:"A COR",pub:"Jeunesse",sup:"Imprimé",d:"Lorsque Léo perd Lulu, son ours en peluche et meilleir ami, il est inconsolable. Mais il découvre rapidement qu'une petite fille l'a retrouvé et adopté. Avec son chien Toto à ses côtés, Léo élabore un plan pour récupérer Lulu... Une histoire touchante et joliment illustrée sur l'importance d'apprécier ce que l'on a, et de partager autour de soi.",isbn:"9782383225072",extraUrl:"https://covers.openlibrary.org/b/isbn/9782383225072-M.jpg"},
  {t:"Je suis capable",a:"Hostingue Déborah d'",y:"2026",ed:"Editions Les Arènes",cote:"A HOS",pub:"Jeunesse",sup:"Imprimé",d:"Un album pour accompagner les enfants quand ils perdent confiance en eux et développer leur force intérieure. Se séparer de ses parents le matin, se faire de nouveaux amis, parler devant tout le monde, ne pas réussir du premier coup... Autant de moments de défi, où l'enfant peut perdre confiance en lui. Pourtant, la confiance peut revenir. Cet album permet à l'enfant de retrouver une sécurité intérieure pour être à nouveau capable d'oser, de s'affirmer et de se relever de ses échecs. Et de pouvoir dire à son tour \" Je suis capable \".",isbn:"9791037515384",extraUrl:"https://covers.openlibrary.org/b/isbn/9791037515384-M.jpg"},
  {t:"Mille et une histoires d'une petite souris",a:"Barroux",y:"2026",ed:"Little urban",cote:"A BAR",pub:"Jeunesse",sup:"Imprimé",d:"Nichée dans une immense bibliothèque, une petite souris passe son temps à dévorer des livres. Malheureusement, ses jours sont comptés : un gros chat noir l'observe avec délectation. Il adorerait la croquer. Mais pas avant de connaître la fin de l'histoire racontée à voix haute par la courageuse lectrice ! Démarre alors le plus beau des voyages...",isbn:"9782374082240",extraUrl:"https://covers.openlibrary.org/b/isbn/9782374082240-M.jpg"},
  {t:"I Hope this doesn't find you",a:"Liang Ann",y:"2026",ed:"Pocket",cote:"J LIA",pub:"Adolescent",sup:"Imprimé",d:"Quand ses e-mails privés sont envoyés par erreur, Sadie Wen se retrouve plongée dans un tourbillon de rumeurs et de secrets... Sadie Wen, c'est la fille parfaite sur le papier : présidente du lycée et l'élève modèle. Mais pour garder ce sourire impeccable, Sadie a un petit secret : elle balance toutes ses frustrations dans des brouillons d'e-mails qu'elle n'enverra jamais. Plutôt mourir que de dire à voix haute ce qu'elle pense vraiment. Facile d'être honnête quand personne ne te lit. Jusqu'au jour où... tous ces mails sont envoyés. A tout le monde. En une nuit, sa vie parfaite explose en plein vol. Pourtant, au milieu du carnage, une personne commence à voir la vraie Sadie sous un autre jour : Julius. Le garçon qu'elle adore détester...",isbn:"9782266355278",extraUrl:"https://covers.openlibrary.org/b/isbn/9782266355278-M.jpg"},
  {t:"D'ailleurs, ce n'est pas ma maison",a:"Le Gall Tiphaine",y:"2026",ed:"Manufacture de livres éditions",cote:"R LEG",pub:"Adulte",sup:"Imprimé",d:"\"Il fallait partir. Je suis montée à regret dans la voiture, et j'ai regardé s'éloigner l'image de Louise et de son amie, assises devant la mer. Mon coeur s'est serré. Nous rentrions à Rennes, et j'aurais rêvé d'avoir, moi aussi, cette liberté voluptueuse de journées face à l'océan\". A Brest, une femme se retrouve seule dans sa maison et se demande de quelle façon ce lieu agit sur elle. Qu'est-ce qui a motivé son installation dans ces murs, des années auparavant ? Et comment apprendre, après une rupture, à l'habiter ? Alors, elle remonte le fil de sa vie et des lieux qui l'ont façonnée. Immédiatement, une figure s'impose : celle de Louise, l'amie d'enfance disparue prématurément, un double ancré dans ce fantasmagorique Finistère, qu'elle fait renaître pour interroger son propre chemin. A travers une constellation de fragments, Tiphaine Le Gall tisse un récit lumineux et intime qui relie passé et présent. D'ailleurs, ce n'est pas ma maison est une réflexion sur l'empreinte des lieux, ceux qui nous précèdent, qui nous modèlent et qui nous transforment malgré nous.",isbn:"9782385532963",extraUrl:"https://covers.openlibrary.org/b/isbn/9782385532963-M.jpg"},
  {t:"Les soeurs Blue",a:"Mellors Coco",y:"2026",ed:"Calmann-Lévy",cote:"R MEL",pub:"Adulte",sup:"Imprimé",d:"\" On est tes soeurs. Quoi que tu fasses, au bout du compte on sera toujours de ton côté. \" Les soeurs Blue sont aussi exceptionnelles et inoubliables qu'elles sont différentes : Sérieuse et responsable, Avery semble être la fille aînée parfaite. Mais cette avocate à Londres cache une liaison secrète qui risque de bouleverser sa vie. Déprimée après sa première défaite, Bonnie voit sa carrière de boxeuse remise en question. Alors qu'elle tente de se reconstruire à Los Angeles, un acte de violence va l'obliger à fuir la police. Lucky, la benjamine rebelle, est mannequin à Paris où elle passe son temps de soirée en soirée avant que ses excès ne la rattrapent. Un an après la mort soudaine et accidentelle de Nicky Blue, ses trois soeurs se rendent à New York pour empêcher la vente de l'appartement familial. Entre crises et disputes mais aussi fous rires et gestes d'amour, elles tentent tant bien que mal de surmonter leurs difficultés et de trouver leur chemin.",isbn:"9782702196083",extraUrl:"https://covers.openlibrary.org/b/isbn/9782702196083-M.jpg"},
  {t:"La Citadelle de Jomsborg",a:"Le Gris Jérôme",y:"2026",ed:"Glénat",cote:"BDJ GRI",pub:"Jeunesse",sup:"Imprimé",d:"Kara, jeune guerrière viking, a malencontreusement ouvert les portes des Neuf Royaumes, libérant des créatures prêtes à semer le chaos sur Midgard. Pour expier sa faute et apaiser la colère d'Odin, elle doit traquer ces monstres et les renvoyer là d'où ils viennent. Aux côtés de Bojan, un prêtre pas très dégourdi, et de la sulfureuse sorcière Rùna, Skara s'engage dans une guète épique digne des plus grandes sagas nordiques.",isbn:"9782344074060",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344074060-M.jpg"},
  {t:"Haut les mains, peau de bovin !",a:"Puls David",y:"2026",ed:"Auzou",cote:"BDJ PUL",pub:"Jeunesse",sup:"Imprimé",d:"Du haut de ses 9 ans, Mia n'a qu'un seul rêve : devenir la plus grande crapule de l'Ouest ! Du haut de ses 9 ans, Mia n'a qu'un seul rêve : devenir la plus grande crapule de l'Ouest ! Mais il y a deux problèmes. D'abord, c'est Villain Farmer, l'inarrêtable braqueur aux vaches-gangsters, qui détient ce titre honorifique. Ensuite, dès qu'il s'agit d'attaquer des banques, Mia enchaîne les gaffes et les échecs... Ainsi, quand elle se retrouve nez-à-nez avec le fameux bandit, Mia va devoir mettre le paquet pour prouver que c'est ELLE, la véritable terreur de l'Ouest.",isbn:"9791039563529",extraUrl:"https://covers.openlibrary.org/b/isbn/9791039563529-M.jpg"},
  {t:"Iceworld",a:"Rivière Anne",y:"2026",ed:"Bayard éditions",cote:"BDJ RIV",pub:"Jeunesse",sup:"Imprimé",d:"Au statioport de Bluetown, Roméo est témoin d'un bug informatique. Il a à peine le temps de comprendre ce qu'il a vu sa navette spatiale est attaquée par un drone ! Roméo s'écrase sur Seiren, une planète déserte et glacée. Il lui reste 17 heures pour trouver de l'aide et comprendre qui est à ses trousses, après quoi sa combinaison thermique n'aura plus de batterie, et il sera victime du froid...",isbn:"9791036356292",extraUrl:"https://covers.openlibrary.org/b/isbn/9791036356292-M.jpg"},
  {t:"A la recherche de Rosaly Green",a:"Le Lay Delphine",y:"2026",ed:"Dargaud",cote:"BDJ LAY",pub:"Jeunesse",sup:"Imprimé",d:"Un étrange mot, et les voilà réduits... rétrécis... rapetissés. Sans le précieux carnet de Rosaty Green, comment Lynette et son ami Nino vont-its rentrer chez eux... et retrouver leur taille normale ? Une aventure mini en taille... Maxi en émotion !",isbn:"9782205214826",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205214826-M.jpg"},
  {t:"Il était une fois",a:"Derrien Jean-Christophe",y:"2026",ed:"Soleil",cote:"BDJ DER",pub:"Jeunesse",sup:"Imprimé",d:"Pour l'anniversaire de Frigiel (il a déjà 20 ans ! ), Abel a enfin terminé son autobiographie, où il évoque toutes les histoires précédentes de nos héros... mais de son point de vue ! A Lanniel, on prépare une surprise pour l'anniversaire de Frigiel : une grande fête pour ses 20 ans ! Et c'est aussi l'occasion pour Abel de dévoiler enfin son autobiographie longtemps promise... où il va revenir sur son parcours et toutes les aventures avec ses compagnons. Mais, comme toujours, notre bâtisseur préféré a sa propre vision des choses... contredite parfois par ses amis.",isbn:"9782302107595",extraUrl:"https://covers.openlibrary.org/b/isbn/9782302107595-M.jpg"},
  {t:"Ana et l'Entremonde",a:"Dubuisson Marc",y:"2026",ed:"Glénat",cote:"BDJ DUB",pub:"Jeunesse",sup:"Imprimé",d:"Quand les portes de L'Entremonde s'ouvrent enfin... Ana et Domingo, deux jeunes orphelins embarqués par accident dans la fameuse expédition de Christophe Colomb, se sont retrouvés projetés dans l'Entremonde, un univers fantastique peuplé de pirates en tous genres ! Tandis que La Main continue d'étendre son pouvoir sur Kawa-Qawa, Ana et ses amis sont plus déterminés que jamais à l'arrêter avant que les mystérieuses Portes-aux-mondes ne tombent en sa possession. Entre surprises, révélations et bataille navale explosive, l'ultime tome de la série nous plonge dans une aventure fantastique pleine d'imagination et de rebondissements avec, toujours, des planches en couleur directe à couper le souffle !",isbn:"9782344068564",extraUrl:"https://covers.openlibrary.org/b/isbn/9782344068564-M.jpg"},
  {t:"Dit comme ça...",a:"Ennis Garth",y:"2016",ed:"Panini",cote:"BD ENN",pub:"Adulte",sup:"Imprimé",d:"Les P'tits Gars décident de venir troubler une orgie entre super héros. Les héros de Butcher affrontent une nouvelle équipe de surhumains. La Crème, le Français et la Fille dévoilent leurs origines. Compilation des épisodes Hérogasme, Question de survie et Rien de tel dans le monde entier. Avec des épisodes inédits et un carnet de croquis. ©Electre 2021",isbn:"9782809455397",extraUrl:"https://covers.openlibrary.org/b/isbn/9782809455397-M.jpg"},
  {t:"L'incroyable destin de Katherine Johnson, mathématicienne de génie à la NASA",a:"Hédelin Pascale",y:"2026",ed:"Bayard éditions",cote:"J HED",pub:"Jeunesse",sup:"Imprimé",d:"L'incroyable destin de Katherine Johnson, mathématicienne de génie à la Nasa Dès son enfance, l'américaine Katherine Johnson est une génie des mathématiques. Mais elle doit se battre et s'imposer pour surmonter sa condition de femme noire dans un monde dirigé par des hommes blancs... En 1953, elle parvient à intégrer l'agence spatiale américaine. Avec d'autres femmes surnommées les \"calculatrices en jupe\" elle manie les chiffres comme personne. Figure de l'ombre, elle a permis l'envoi de fusées et d'hommes dans l'espace.",isbn:"9791036382529",extraUrl:"https://covers.openlibrary.org/b/isbn/9791036382529-M.jpg"},
  {t:"La clé de Dedaleum",a:"Lees Jordan",y:"2026",ed:"Auzou",cote:"J LEE",pub:"Jeunesse",sup:"Imprimé",d:"Le grand final d'une saga époustouflante ! Le terrible magus Manfred Tarr est à la recherche d'une clé. Une clé perdue depuis des années, qui détient le pouvoir de libérer les ténèbres dans le labyrinthe... Pour sauver Dedaleum, Benjamiah et Elizabella n'ont qu'une seule solution : accomplir les épreuves des Trois Soeurs et retrouver la clé avant. Ils se lancent dans un dangereux voyage jusqu'à la Forêt Tordue, qui abrite les créatures les plus incroyables, et jusqu'à l'ultime bataille. Une guerre dont ils ne sortiront pas indemnes.",isbn:"9791039575119",extraUrl:"https://covers.openlibrary.org/b/isbn/9791039575119-M.jpg"},
  {t:"Les femmes de sciences vues par une ado un peu vénère !",a:"Quentin Natacha",y:"2021",ed:"Poulpe fictions",cote:"J QUE",pub:"Jeunesse",sup:"Imprimé",d:"Les femmes ont fait avancer la science, voici leur bio, drôle et illustrée ! Depuis que son frère a déclaré que les femmes étaient nulles en sciences, Louise est prête à tout pour lui prouver qu'il a tort. Et pour ça, quoi de mieux qu'une émission sur Internet qui mette en lumière le parcours et les travaux des grandes femmes scientifiques ? De la chimie à l'astronautique, c'est parti pour un tour d'horizon drôle et documenté de ces grandes figures, sans prise de tête ! Entre anecdotes, explications scientifiques et interview d'une vraie chercheuse, Louise te présente avec humour 25 femmes qui ont marqué l'histoire des sciences. Le bonus ? Grâce aux illustrations BD, les personnages prennent vie pour tout te raconter ! #ilnyapasquemariecurie #féminisme #endirectdulabo Dans la même collection, retrouve aussi d'autres personnalités vues par des ados : Léonard de Vinci, Molière, Einstein, Mozart, les figures de la mythologie grecque et Cléopâtre ! Prix Le goût des sciences 2022 . Sélection pour le Prix Tangente des lycéens 2023 .",isbn:"9782377421497",extraUrl:"https://covers.openlibrary.org/b/isbn/9782377421497-M.jpg"},
  {t:"Une vie de fantôme",a:"Langaney Anouk",y:"2026",ed:"Syros",cote:"J LAN",pub:"Adolescent",sup:"Imprimé",d:"Tu es un fantôme et tu n'as aucun souvenir de ta vie d'avant. Qui es-tu et que t'est-il arrivé ? A toi de le découvrir. Tu te réveilles dans un état cotonneux, léger comme l'air. En face de toi, un grand miroir ovale. Tu te regardes dedans, mais tu ne te vois pas. Tu comprends que tu es mort. Ou plutôt... que tu es devenu un fantôme. Tu ne te souviens de rien, pas même de ton identité. A toi de mener l'enquête en explorant le château gothique où tu t'es réveillé. Ses occupants, issus d'une ancienne et noble famille, semblent cacher de lourds secrets. L'un d'eux a-t-il un lien avec ta mort ? Et qui sont-ils pour toi ? Pour découvrir la vérité, tu devras ouvrir les yeux et fouiller aux bons endroits ! Ensuite, tu pourras passer à l'action. Choisiras-tu la vengeance ou le pardon ?",isbn:"9782748539530",extraUrl:"https://covers.openlibrary.org/b/isbn/9782748539530-M.jpg"},
  {t:"Le manga",a:"Kotenka Théo",y:"2023",ed:"Poulpe fictions",cote:"J KOT",pub:"Jeunesse",sup:"Imprimé",d:"La grande aventure du manga, racontée par deux ados passionnés ! Nilou et J. -B. sont voisins... et surtout rivaux ! Les deux collégiens sont constamment en compétition, que ce soit pour obtenir la meilleure note de la classe... ou pour décider quel est le meilleur manga de tous les temps ! Afin de les réconcilier, la documentaliste de leur collège leur propose de travailler ensemble sur une exposition autour de leur passion commune. A eux de présenter à leurs camarades l'histoire du manga, de One Piece à Sailor Moon en passant par Astroboy . Avec autant de choses à raconter, la collaboration s'annonce aussi motivante... qu'explosive ! Dans la collection 100 % Bio, découvre aussi d'autres sujets captivants présentés par des ados : Einstein, Molière, Cléopâtre, Léonard de Vinci, Mozart, Picasso, la mythologie grecque, les femmes de sciences, les femmes artistes, les grandes aventurières, les grandes chanteuses et musiciennes, l'astronomie, les grandes inventions et la Rome antique ! #lemangacestlavie #anticlichés #humour Pré-sélection pour le Prix des Incorruptibles 2025 .",isbn:"9782377422821",extraUrl:"https://covers.openlibrary.org/b/isbn/9782377422821-M.jpg"},
  {t:"Laïka, chienne cosmonaute",a:"Pouget Anne",y:"2024",ed:"Editions Casterman",cote:"J POU",pub:"Jeunesse",sup:"Imprimé",d:"1957. Le jeune Igor, 12 ans, vit avec son père Nicolaï une vie de paysans modeste. Un jour, Igor trouve dans la forêt une petite chienne chétive et se prend immédiatement d'affection pour elle. Cette chienne s'appellera Laïka. Très vite adoptée, elle apporte douceur et joie dans le coeur du garçon et de son père. Mais le bonheur est de courte durée car des hommes croisent la route de Laïka et l'embarquent avec eux jusqu'à une base scienti¿que appelée \" La Cité des Etoiles \". Révolté de voir son amie enlevée par des inconnus, Igor compte bien retrouver Laïka et veiller à ce qu'on ne lui fasse aucun mal... Il ignore qu'elle va participer malgré elle à un voyage spatial sans retour à bord de Spoutnik 2, et marquer à tout jamais notre histoire.",isbn:"9782203275966",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203275966-M.jpg"},
  {t:"L'incroyable destin d'Antoni Gaudi, le génie qui transforma Barcelone",a:"Lamoureux Sophie",y:"2026",ed:"Bayard éditions",cote:"J LAM",pub:"Jeunesse",sup:"Imprimé",d:"L'incroyable histoire de Gaudí, le génie qui transforma Barcelone Des couleurs vives qui éclatent au soleil, des tours ajourées qui grimpent vers le ciel, un lézard recouvert de mosaïques... l'oeuvre de Gaudí n'en finit pas de surprendre ceux qui visitent Barcelone. Alors qu'on commémore en 2026 l'achèvement de la Sagrada Familia, la vie mouvementée de cet architecte tourmenté fascine : entre son enfance insouciante dans sa campagne natale et sa mort brutale en 1926, Gaudí a réussi à s'affirmer comme l'un des artistes les plus marquants et originaux de toute la Catalogne.",isbn:"9791036382345",extraUrl:"https://covers.openlibrary.org/b/isbn/9791036382345-M.jpg"},
  {t:"Sel",a:"Lan Nina",y:"2026",ed:"Didier jeunesse",cote:"J LAN",pub:"Adolescent",sup:"Imprimé",d:"Nami, fille du peuple des Mouvants, a le Sel dans le sang. Cette année, elle guidera la caravane de son clan vers les salines de Perlevent. Son rêve se réalise et avec lui, surtout, l'espoir de retrouver Calist et Elian, ses amis de toujours. Mais la cité du Sud n'a plus la douce saveur de l'enfance : dirigée d'une main de fer par la Dauphine et gangrénée par un mystérieux groupe de rebelles, elle est au bord du chaos. Alors, quand les Mouvants sont suspectés d'avoir volé le Sel magique de leur propre récolte, Nami se jure de prouver leur innocence. Entre amitié contrariée et amour naissant, la jeune Mouvante devra forger des alliances délicates... et déterrer des secrets lourds de conséquences. \" Ce n'est pas seulement une histoire de magie et de révolte, mais aussi une ode à l'amitié qui m'a touchée en plein coeur. \" Romy, Librairie de Paris (Saint-Etienne)",isbn:"9782278132119",extraUrl:"https://covers.openlibrary.org/b/isbn/9782278132119-M.jpg"},
  {t:"Le dernier mouton",a:"Hub Ulrich",y:"2022",ed:"Gallimard",cote:"J HUB",pub:"Jeunesse",sup:"Imprimé",d:"Quelle étrange lumière ! Elle est si vive qu'elle réveille le troupeau de moutons en pleine nuit. Mais où sont passés leurs bergers ? Ont-ils été kidnappés par des OVNIS ou cela a-t-il quelque chose à voir avec la petite fille qui, paraît-il, est née dans une étable voisine ? Pour en avoir le coeur net, les moutons décident de suivre la lumière et se lancent dans une expédition nocturne plus que mouvementée...",isbn:"9782075166317",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075166317-M.jpg"},
  {t:"Ceci n'est pas une prune !",a:"Ojari Dan",y:"2026",ed:"Editions Gründ",cote:"A OJA",pub:"Jeunesse",sup:"Imprimé",d:"Est-ce vraiment une araignée velue ? Et une oie bien dodue ? UNE IMAGE PEUT EN CACHER UNE AUTRE !",isbn:"9782324039119",extraUrl:"https://covers.openlibrary.org/b/isbn/9782324039119-M.jpg"},
  {t:"Où vas-tu, petit fleuve ?",a:"Gallardo Nuria",y:"2026",ed:"Seuil",cote:"A GAL",pub:"Jeunesse",sup:"Imprimé",d:"Tout débute au matin, quand Petit Fleuve, du haut des montagnes enneigées, commence son voyage. Il descend le long des berges et des forêts... croise ici un canard, là une carpe, plus loin une loutre... Il fait des tours et des détours, dit bonjour aux nuages. Sa musique résonne jusqu'au fond de la campagne. Vite, la nuit tombe, Petit Fleuve se dépêche. Il a rendez-vous quelque part. La lune se lève à présent, bientôt l'embouchure. L'heure est aux retrouvailles, et voilà Petit Fleuve qui se jette dans la mer. Dans ce livre d'éveil pour les 0-3 ans, l'enfant découvre un autre sens de lecture : du haut vers le bas. Ainsi peut-il suivre le fleuve tout le long de sa descente, dans une adorable promenade au point de croix.",isbn:"9791023523201",extraUrl:"https://covers.openlibrary.org/b/isbn/9791023523201-M.jpg"},
  {t:"Les écrans, pas tout le temps !",a:"Gallissot Romain",y:"2026",ed:"Bayard éditions",cote:"A JAL",pub:"Jeunesse",sup:"Imprimé",d:"Un enfant face aux grands... et à leurs écrans ! Pendant que les adultes sont rivés sur leurs écrans, un petit bondit, rit, joue... et se demande pourquoi personne ne l'écoute vraiment. Dans cet album drôle et touchant, le quotidien numérique des parents est vu à hauteur d'enfant. Une situation familière, racontée avec malice, qui invite à réfléchir ensemble au bon usage des écrans à la maison. Un outil bienveillant pour mieux vivre avec les écrans Pensé pour les 3-6 ans, cet album tout-carton aborde un sujet d'actualité sans culpabiliser. Il encourage le dialogue entre adultes et enfants, en posant des mots simples sur ce que ressentent les plus petits. Issu du programme pédagogique Croc'écran, il offre des repères concrets pour instaurer de bonnes habitudes et retrouver des moments de qualité en famille, loin des écrans. Un duo complice pour parler d'enfance et de numérique Professeur des écoles, médiateur et auteur jeunesse, Romain Gallissot signe un album sensible et actuel sur la place des écrans dans le quotidien des enfants. Porté par l'univers graphique et chatoyant de Matthias Malingrey, Les écrans, pas tout le temps ! est un livre à découvrir en famille, pour apprendre à mieux vivre avec le numérique... tout en gardant les yeux grands ouverts sur le monde.",isbn:"9791036386084",extraUrl:"https://covers.openlibrary.org/b/isbn/9791036386084-M.jpg"},
  {t:"Robot sauvage sur l'île",a:"Brown Peter",y:"2025",ed:"Gallimard",cote:"C BRO",pub:"Jeunesse",sup:"Imprimé",d:"Plongez dans l'univers de Robot sauvage et partagez avec les petits ce sublime album qui met en images les aventures du roman à succès, adapté en film. Un jour, une mystérieuse créature échoue sur une île sauvage, au milieu de l'océan : Roz, qui va peu à peu apprendre à vivre dans la nature, au contact des animaux...",isbn:"9782075226349",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075226349-M.jpg"},
  {t:"Hue Cocotte !",a:"Collet Géraldine",y:"2026",ed:"Glénat Jeunesse",cote:"A COL",pub:"Jeunesse",sup:"Imprimé",d:"La vie te donne des ailes. Prends ton envol ! Au poulailler, Mariette est bouleversée. A quoi bon avoir des ailes si on ne peut pas voler ? Pourtant grâce à son amie Josette, Mariette va comprendre qu'avec un peu d'entrain et beaucoup de courage, même une poule peut décoller... et viser la Lune !",isbn:"9782344070178",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344070178-475x500-1.jpg"},
  {t:"Les Ouröbörös",a:"Duval Fred",y:"2023",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"Lisä et des officiers de Renaissance observent, à partir d'une base lunaire, un vaisseau du monde Ouröbörös qui stationne dans l'espace à proximité de Mars. Une véritable menace pour le système solaire et, donc, la planète Terre ! ... Ce nouvel album de Renaissance ponctue la série de très belle manière, une série devenue une véritable référence pour les lecteurs de bande dessinée amateurs du genre.",isbn:"9782205207903",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205207903-M.jpg"},
  {t:"Les Hybrides",a:"Duval Fred",y:"2022",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"Sätie et Swänn, originaires de la planète NäKän, vivent sur Terre depuis vingt ans. Ils appartiennent au personnel médical et militaire de Renaissance, l'expédition financée par le Complexe, une fédération de civilisations extraterrestres venue organiser le sauvetage écologique de la Terre. Une partie des humains vit désormais en harmonie avec ses hôtes, mais Renaissance doit aussi faire face à une opposition armée et radicalisée, prête à tout pour que le Complexe se retire du Système solaire.",isbn:"9782205203189",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205203189-M.jpg"},
  {t:"Interzone",a:"Duval Fred",y:"2019",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"2084, les pires scénarios prédisant la funeste destinée de la Terre se sont réalisés. La Fédération des Intelligences Mammifères décide d'engager une intervention sur cette planète en voie d'extinction. Swänn, jeune extraterrestre droit et ouvert, se porte volontaire. Originaire d'une planète apparaissant comme une version réussie de notre monde, il souhaite contribuer à pacifier la Terre et empêcher son anéantissement. Sa rencontre avec Liz, au Texas, marque le début du choc des deux mondes. La suite spectaculaire de cette odyssée...",isbn:"9782205078633",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205078633-M.jpg"},
  {t:"Les déracinés",a:"Duval Fred",y:"2018",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"084, les pires scénarios prédisant la funeste destinée de la Terre se sont réalisés. La Fédération des Intelligences Mammifères décide d'engager une intervention sur cette planète en voie d'extinction. Swänn, jeune extraterrestre droit et ouvert, se porte volontaire. Originaire d'une planète apparaissant comme une version réussie de notre monde, il souhaite contribuer à pacifier la Terre et empêcher son anéantissement. Sa rencontre avec Liz, au Texas, marque le début du choc des deux mondes...",isbn:"9782205078022",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205078022-M.jpg"},
  {t:"Permafrost",a:"Duval Fred",y:"2020",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"La suite des aventures de Swänn et de Säti, un jeune couple d'extraterrestres envoyés sur la Terre pour la sauver de l'extinction. ©Electre 2020",isbn:"9782205085082",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205085082-M.jpg"},
  {t:"Sui Juris",a:"Duval Fred",y:"2021",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"Sätie et Swänn, originaires de la planète NäKän, vivent sur Terre depuis vingt ans. Ils appartiennent au personnel médical et militaire de Renaissance, l'expédition financée par le Complexe, une fédération de civilisations extraterrestres venue organiser le sauvetage écologique de la Terre. Une partie des humains vit désormais en harmonie avec ses hôtes, mais Renaissance doit aussi faire face à une opposition armée et radicalisée, prête à tout pour que le Complexe se retire du système solaire.",isbn:"9782205089103",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205089103-M.jpg"},
  {t:"Hermès conditionné",a:"Cazenove Christophe",y:"2021",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeunesse",sup:"Imprimé",d:"La mythologie grecque revisitée avec un humour légendaire. Le pauvre Hermès ne s'en sort plus... En plus d'être le messager personnel de Zeus, il doit s'occuper des carrefours, des voyageurs, des voleurs, du commerce... et devinez qui doit conduire les morts aux Enfers ? Hermès, bien sûr ! Bref, même si ses sandales ailées lui permettent de courir plus vite qu'un éternuement de foudre, il aurait bien besoin d'un coup de main de nos Petits Mythos. Le hic, c'est que ceux-ci sont déjà bien occupés à libérer Io, leur copine changée en vache et surveillée par le terrible Argos, le gardien aux 100 yeux ! Qui a dit que Petit Mythos était un métier de tout repos ?",isbn:"9782818977163",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818977163-475x500-1.jpg"},
  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"Le royaume de Boss est en crise. Son fondateur à la force surhumaine est gravement malade. Son héritier, le prince Bojji, est sourd-muet. Dans un monde où la puissance des rois fait tout, cette faiblesse ne le destine pas à régner et son frère cadet Daida reçoit le soutien populaire. Mais l'aîné, d'un optimisme à toute épreuve, garde son objectif en tête, devenir le meilleur roi du monde. ©Electre 2022",isbn:"9791032712191",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712191-M.jpg"},
  {t:"Secret bodyguard",a:"Nigatsu Masamitsu",y:"2025",ed:"Pika édition",cote:"BD SEC",pub:"Adulte",sup:"Imprimé",d:"La nuit qui suit la cérémonie de fin de semestre, deux puissantes organisations d assassins, les Chiens de chasse et le Service funéraire, unissent leurs forces pour attaquer Akabane. La terminale 4, qui attendait leur arrivée de pied ferme, enchaîne les victoires contre les deux groupes& Jusqu à ce que Moral, des Chiens de chasse, kidnappe Kuran Shutô. Ibuki et ses camarades partent à sa poursuite, aidés de Masachika Jingû, Nanafuri et Hyôka. Mais un élément les interpelle : Shutô et Moral ont l air de déjà se connaître& Quelle sera l issue de cet affrontement riche en rebondissements ?",isbn:"9782811698805",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811698805-M.jpg"},
  {t:"Komi cherche ses mots",a:"Oda Tomohito",y:"2026",ed:"Pika édition",cote:"BD KOM",pub:"Jeunesse",sup:"Imprimé",d:"Komi est désormais en terminale ! Répartie dans la même classe que Tadano et Najimi, elle est néanmoins séparée de ses amis de la première 1, et notamment de Manbagi. Une petite inquiétude se fait sentir... alors que commence une guerre organisée entre les différentes classes du lycée ! Seconde contre première contre terminale, Komi gagnera-t-elle appuyée de nouveaux camarades toujours aussi déjantés ? !",isbn:"9791043306037",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043306037-M.jpg"},
  {t:"Secret bodyguard",a:"Nigatsu Masamitsu",y:"2026",ed:"Pika édition",cote:"BD SEC",pub:"Adulte",sup:"Imprimé",d:"La terminale 4 est parvenue à vaincre deux organisations d assassins. Cependant, l affrontement s est terminé sur de nombreuses révélations concernant un certain Sôji Kodô qui a pour but de hisser son propre groupe, le clan Kodô, au sommet du monde criminel. De plus, Ibuki apprend que l auteur des messages de haine envers Akabane n est pas Kuran ! Mais alors, qui peut bien être derrière ces messages étranges ?",isbn:"9782811698812",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811698812-M.jpg"},
  {t:"Komi cherche ses mots",a:"Oda Tomohito",y:"2026",ed:"Pika édition",cote:"BD KOM",pub:"Jeunesse",sup:"Imprimé",d:"Komi et Tadano sortent ensemble. L'un comme l'autre n'ayant aucune expérience, ils sont souvent malhabiles. Komi aimerait lui tenir la main mais n'arrive pas à se faire comprendre sans l'exprimer oralement. A part ça, entre la remise des diplômes et la session shopping de Komi, les uns et les autres ne manquent pas d'occasions de briller...",isbn:"9791043305269",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043305269-M.jpg"},
  {t:"Le temps de l'obsolescence humaine",a:"Patino Bruno",y:"2026",ed:"Grasset & Fasquelle",cote:"302.23 PAT",pub:"Adulte",sup:"Imprimé",d:"\"La révolution technologique que nous avons traversée en quelques décennies prépare peut-être le temps de l'obsolescence humaine. Elle s'est jouée en trois actes. L'ère de l'accès, à partir de 1989, a établi le réseau universel : un Internet accessible à chacun, avec sa promesse originelle d'un monde meilleur. Lui a succédé l'ère de la propagation avec l'invention du smartphone. Pour la première fois, nous avons tenu l'univers dans notre main. L'économie de l'attention s'est développée à une vitesse foudroyante, a ciblé notre temps et fait de nous des mines à ciel ouvert. Voici venue désormais l'ère de l'imbrication. Avec le développement des intelligences artificielles, tout se mêle. L'homme et la machine. Le vrai et le faux. Le réel devient instable et flottant. Dans cette nouvelle économie de la relation, c'est notre curiosité qui est ciblée... et notre esprit menacé. Vivons-nous les dernières années de la civilisation née de Gutenberg ? Est-il encore possible de renouer avec l'utopie première du réseau, universelle et humaniste ? \" B. P.",isbn:"9782246845348",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246845348-M.jpg"},
  {t:"Panique à Yosemite",a:"Le Gat Yan",y:"2023",ed:"Éditions Sarbacane",cote:"BDJ LEG",pub:"Jeunesse",sup:"Imprimé",d:"1906 c'est la panique à Yosemite ! Le légendaire enquêteur Angus Niper a été appelé par les responsables du parc national californien pour résoudre l'affaire des mystérieuses agressions commises sur des touristes... Mais quelle n'est pas leur surprise quand ils voient débarquer... une femme ! C'est Penny Sugar, l'assistante photographe de Niper. Son patron, retenu sur une enquête, l'a chargée de commencer à collecter les indices. Follette et maladroite, elle ne semble pas avoir les épaules pour assumer une telle tâche. Mais ces braves messieurs ont tort de s'en faire, ils sont entre de bonnes mains ! Angus Niper n'est en réalité qu'une couverture, qui permet à Penny, experte en combat, fine enquêteuse et habile transformiste, d'exercer son métier sans éveiller les soupçons. Penny saura-t-elle déchiffrer les énigmatiques mises en scène de l'agresseur qui détrousse les visiteurs ? Ces vols ont-ils un lien avec le mouvement spiritualiste \" Ghost Dance \" composé d'Indiens natifs du parc qui s'adonnent à la nuit tombée à d'étranges rituels ? Ou bien avec le projet de barrage défendu par le verreux sénateur Johnson ? Dans la traque qui s'annonce qui est le chasseur ? Qui est la proie ?",isbn:"9791040803584",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040803584-475x500-1.jpg"},
  {t:"La sorcière des Everglades",a:"Le Gat Yan",y:"2024",ed:"Éditions Sarbacane",cote:"BDJ LEG",pub:"Jeunesse",sup:"Imprimé",d:"Une nouvelle enquête impossible appelle le célèbre enquêteur Angus Nyper en Floride : une sorcière hanterait les mines de phosphate de la riche famille Golpah, l'obligeant à mettre à l'arrêt sa production. La faillite menace ! Penny Sugar, qui se fait passer pour l'assistante étourdie de Nyper, personnage qu'elle a inventé de toutes pièces pour pouvoir exercer un métier réservé aux hommes, débarque donc sur cette terre peuplée de crocodiles et de légendes séminoles effrayantes. Accueillie dans le manoir des Golpah, elle est tout de suite témoin de vives tensions entre Jerry, le fils héritier des mines, et sa soeur Elry, jeune femme amère qui ne semble pas se soucier le moins du monde de la malédiction qui frappe l'entreprise familiale. Qui est donc cette sorcière ? Quelles sont ses motivations ? Et pourquoi l'accès au sous-sol du manoir a-t-il été condamné ?",isbn:"9791040804963",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040804963-475x500-1.jpg"},
  {t:"Fechamos (on ferme)",a:"Baum Gilles",y:"2020",ed:"les Éditions des éléphants",cote:"BDJ BAU",pub:"Jeunesse",sup:"Imprimé",d:"Déserté du public, un musée est contraint de fermer ses portes définitivement. En cette nuit, le gardien Edson Arantes entame en compagnie de quelques habitués une ultime déambulation au cours de laquelle les collections sont distribuées. Le musée est détruit dans un incendie mais les objets qu'il conservait sont sauvés. Inspiré du sinistre survenu au musée national de Rio de Janeiro. ©Electre 2020",isbn:"9782372730914",extraUrl:"https://products-images.di-static.com/image/base/9782372730914-475x500-1.jpg"},
  {t:"Les Portes d'Odin",a:"Le Gris Jérôme",y:"2026",ed:"Glénat",cote:"BDJ LEG",pub:"Jeunesse",sup:"Imprimé",d:"Une guerrière viking n'abandonne jamais ! Skara est une jeune viking qui a reçu à la naissance un talent rare et divin : le don du Loup. Ce don fait d'elle une redoutable guerrière pouvant tenir tête à n'importe qui malgré son jeune âge ! Après la mort de sa mère - tuée par des pillards - Skara, emportée par la colère et le désespoir, incendie accidentellement un temple sacré d'Odin. Le brasier ravageur ouvre alors les portes entre les Neuf Royaumes et libère sur Midgard des monstruosités venues des mondes inférieurs. Venant visiter Skara dans ses rêves, Urd, la déesse tisseuse du Destin, lui explique que le seul moyen de réparer sa faute est de chasser elle-même ces créatures maléfiques. Alors seulement, Odin pourra lui pardonner. Accompagnée de Bojan, un jeune prêtre russe peu dégourdi, et de la sulfureuse sorcière Rùna, la jeune viking se lance alors dans une aventure digne des grandes sagas nordiques ! Avec ce récit mettant en scène une jeune adolescente au caractère colérique en quête de rédemption, Jérôme Le Gris et Letizia Depedri signent une nouvelle série épique au ton décalé. Mêlant action, loyauté et sororité, le duo nous plonge dans un récit sans temps mort où l'imaginaire de la mythologie nordique sert de décor au parcours initiatique jalonné d'épreuves de leur héroïne.",isbn:"9782344064535",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344064535-475x500-1.jpg"},
  {t:"Je suis là pour toi",a:"Parapaboom",y:"2026",ed:"Editions Amaterra",cote:"A PAR",pub:"Jeunesse",sup:"Imprimé",d:"Un livre cartonné graphique et coloré sur l'entraide, empreint d'humour et de tendresse. A chaque page, un personnage se retrouve dans l'embarras... Le lecteur soulève le rabat, le visuel évolue et hop ! Le problème est résolu. Avec la ritournelle rassurante \"Ne t'inquiète pas, je suis là pour toi\", ce livre interactif invite les tout-petits à découvrir la magie de l'entraide et la joie de partager, l'histoire est rythmée et le plaisir de la lecture à voix haute renforcé.",isbn:"9782368563878",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782368563878-475x500-1.jpg"},
  {t:"L'automne des aspirants",a:"Puysségur Alain T.",y:"2023",ed:"Scrineo",cote:"J PUY",pub:"Adolescent",sup:"Imprimé",d:"Qui a dit que les chats ne pouvaient pas faire de la magie ? Suivez les premières aventures de Kovhan, Bruyne, Lexios et Serenya, et découvrez avec eux les secrets du Manoir de Castlecatz... \" Il n'existe pas d'endroit plus prestigieux que le Manoir de Castlecatz pour étudier les arts occultes de la magie. C'est à Castlecatz que les Maggocatz les plus puissants sont formés. Mais pas seulement. Les meilleurs Mécanimateurs et les plus grands Alchimistes y étudient également depuis des siècles. \" Une nouvelle année de cours débute au Manoir de Castlecatz ! Kovhan rêve depuis toujours d'y entrer et de devenir Aspirant. Mais pour lui qui maîtrise si mal l'indispensable Maggocculture, triompher des épreuves d'admission n'est pas une tâche facile... Il y a pourtant pire. Une menace plane sur Castlecatz cet automne : des incidents magiques se multiplient, certains félins rapportent même avoir aperçu une horrible créature rôder dans les couloirs... Heureusement, le jeune chat peut compter sur Bruyne, son amie gourmande et malicieuse, ainsi que sur Lexios et Serenya, toujours prêts à lui filer un coup de patte !",isbn:"9782381672854",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782381672854-475x500-1.jpg"},
  {t:"Les Filles-au-Diable",a:"Taraud Christelle",y:"2026",ed:"La Découverte",cote:"305.42 TAR",pub:"Adulte",sup:"Imprimé",d:"En 1621, Anne Lauritsdatter est exécutée en tant que \" sorcière \" aux côtés de douze autres femmes, à Steilneset. En 2011, la Norvège érige un Mémorial dédié à toutes celles qui ont été brûlées vives, durant le XVIIe siècle, dans cette région du Finnmark. Celui-ci vise à éclairer le fait que ces femmes n'étaient pas des \" sorcières \" mais des victimes d'une persécution misogyne et d'un crime de masse aujourd'hui nommés féminicide. En 2022, Christelle Taraud se rend dans ce lieu si symbolique des violences systémiques contre les femmes et fait l'expérience sensible du souvenir de ces exécutions. Pensé comme un laboratoire scientifique, politique et littéraire, Les Filles-au-Diable suit les traces des \" sorcières \" de Steilneset en racontant l'histoire singulière d'un lieu au travers des expériences croisées de deux femmes : l'une, Norvégienne, venue du passé, l'autre, Française, vivant aujourd'hui. Dans la longue trame du temps qui se dessine entre 1620 et 2022, d'autres territoires (Irak, Mexique, Canada, Ghana, Rwanda, Cambodge...) ayant connu des épisodes féminicidaires paroxystiques sont convoqués. Entre récit historique, analyse politique et déambulation poétique, les parcours s'entrelacent, les voix s'entrechoquent, les récits s'enchevêtrent. Emerge alors une autre histoire des chasses aux \" sorcières \", qui fait écho à des situations très contemporaines de haine contre les femmes un peu partout dans le monde.",isbn:"9782348090585",extraUrl:"https://covers.openlibrary.org/b/isbn/9782348090585-M.jpg"},
  {t:"L'enfant des vagues",a:"Kelly Julia",y:"2026",ed:"Jean-Claude Lattès",cote:"R KEL",pub:"Adulte",sup:"Imprimé",d:"Ecosse, hiver 1900. Un petit garçon vient s'échouer sur la plage d'un village de pêcheurs. Il ressemble étrangement au fils de l'institutrice, Dorothy, disparu en mer plusieurs années auparavant. Lorsque Skerry est enseveli sous la neige, Dorothy accepte de s'occuper de l'enfant jusqu'à ce qu'il puisse rentrer chez lui. Mais, à mesure que le passé refait surface, les secrets de cette communauté très soudée resurgissent. Et Dorothy doit se confronter à nouveau à Joseph, le pêcheur solitaire qu'elle a passé les dernières années à fuir... Traduit de l'anglais (Royaume-Uni) par Claire Desserrey \"un premier roman très réussi\" Livres hebdo",isbn:"9782709674577",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709674577-M.jpg"},
  {t:"Le Dernier Passager",a:"Gürsel Nedim",y:"2026",ed:"Actes Sud",cote:"R GUR",pub:"Adulte",sup:"Imprimé",d:"Deniz Cakir vit à Paris avec sa femme Pénélope depuis des années. Pour les besoins d'un documentaire revenant sur sa carrière d'écrivain, il part pour Istanbul où il espère retrouver Songül, sa maîtresse. Durant le vol, il convoque les fantômes de son passé, retraçant le parcours des différents membres de sa famille dans l'Europe du XXe siècle. Le temps d'un dernier voyage, Deniz tisse le fil de son destin façonné par les guerres et les déracinements et célèbre l'écriture comme ultime rempart face à l'oubli. D'un rivage à l'autre, Nedim Gürsel pose un regard intime et politique sur la Turquie d'hier et d'aujourd'hui.",isbn:"9782330216122",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330216122-M.jpg"},
  {t:"La mauvaise humeur",a:"Pressensé Domitille de",y:"2008",ed:"Editions Casterman",cote:"A PRE",pub:"Jeunesse",sup:"Imprimé",d:"Mais qu'est-ce qui arrive à Emilie, aujourd'hui ? Elle se lève de très mauvaise humeur, tombe dans l'escalier, renverse son bol de lait, s'en prend à son frère Stéphane et à sa soeur Elise. Elle demande même au hérisson Arthur de cesser de la suivre ! Mais heureusement que Maman est là. Elle, qui connait bien Emilie, trouve tout de suite la solution. Après un temps calme dans sa chambre, Emilie se sent beaucoup mieux. Tout est bien qui finit bien.",isbn:"9782203014282",extraUrl:"https://covers.openlibrary.org/b/isbn/9782203014282-M.jpg"},
  {t:"Les Secrets du Chocolat (2)",a:"Harris Joanne",y:"2026",ed:"Cherche midi",cote:"R HAR",pub:"Adulte",sup:"Imprimé",d:"Le retour de Vianne, l'héroïne de Chocolat le roman culte vendu à plus de douze millions d'exemplaires dans le monde. Un beau jour d'été, une jeune femme arrive à Marseille. Elle a vingt et un ans, elle est enceinte. Selon ses faux papiers, il s'agit de Sylvianne Rochas, le dernier d'une longue suite de pseudonymes. Elevée par une mère mystérieuse et fantasque, qui vient juste de mourir à New York, elle n'a plus de famille, pas d'argent, nulle part où aller. A Marseille, elle fait la connaissance de Louis Martin, le propriétaire d'un café-restaurant. Il l'engage comme serveuse et l'initie à la cuisine traditionnelle en lui confiant le précieux livre de recettes de sa défunte femme. Autre rencontre décisive, sur le Vieux-Port : celle de Guy Lacarriére, qui s'appréte à ouvrir une chocolaterie et qui va lui enseigner les vertus et les secrets du chocolat. Si sa nouvelle vie semble prendre un bon départ, Sylvianne, qui se fait désormais appeler Vienne, réalise assez vite qu'autour d'elle beaucoup ont des secrets bien gardés. C'est également son cas : elle dissimule en effet un don singulier grâce auquel elle peut ressentir les émotions profondes et les espoirs cachés de ceux qui l'entourent. Un pouvoir qui peut guérir... ou blesser. La solution serait-elle d'utiliser ses recettes pour mieux le maîtriser ? Joanne Harris partage avec nous quelques mois de la vie de Vienne, l'héroïne de son best-seller Chocolat adapté au cinéma avec Juliette Binoche et Johnny Depp. Revenant sur l'énigme de ses angines, elle nous propose une intrigue passionnante, peuplée de personnages hauts en couleur et agrémentée de recettes qui mettent l'eau à la bouche. Surtout, elle renoue avec cette magie du quotidien, des petites choses de la vie, et en particulier celle de la cuisine gourmande, qui peut permettre de trouver le bonheur en le faisant autour de soi.",isbn:"9782749184951",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749184951-M.jpg"},
  {t:"Bone Parish",a:"Bunn Cullen",y:"2021",ed:"Delcourt",cote:"BD SCH",pub:"Adulte",sup:"Imprimé",d:"Ce dernier tome est sans doute le meilleur de la trilogie tant la famille Winters, autrefois seule détentrice de la \"Cendre\", est malmenée ! Cette nouvelle drogue ravage tout sur son passage et attise les convoitises...",isbn:"9782413016694",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413016694-M.jpg"},
  {t:"Le Chant du Sol",a:"Denormandie Julien",y:"2026",ed:"Seuil",cote:"R DEN",pub:"Adulte",sup:"Imprimé",d:"Il y a des personnages que nous regardons sans réellement les voir, que nous pensons connaitre mais dont nous ignorons tout, que nous croyons aimer mais sans considération. Et si le Sol se mettait en grève ? Lui, cet ami précieux qui nous veut du bien. Lui, qui souffre en silence. Un conte ne relate pas une véritable histoire. Il peut, en revanche, reposer sur des éléments réels. Ainsi, tout début dans la capitale, un 22 septembre, par un étrange bruit...",isbn:"9782021618815",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021618815-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Momoshiro n’a pas donné signe de vie depuis trois jours et personne au club de tennis ne sait où il se trouve. Même s’il ne fait plus partie de l’équipe des titulaires, c’est inquiétant... Par ailleurs, Ôishi se fâche avec Kikumaru, son coéquipier, lui reprochant la légèreté de ses paroles et son sens de l’humour déplacé. Serait-ce la faille qui fera voler en éclat la légendaire golden pair ?! Cela tombe vraiment mal, vu que la force de Seigaku réside dans l’unité de ses membres... Une étrange atmosphère plane sur nos héros !!",isbn:"9782505001010",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505001010-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"La finale du championnat de Tokyo a fait monter la pression d'un cran !! Avec deux victoires et une seule défaite, Seigaku est à deux doigts du triomphe mais encore faut-il que Ryôma gagne son match ! Face au colossal Akutsu Jin, Ryôma, tantôt dominé, tantôt en position de force, devra grandir et améliorer son jeu s'il veut sortir vainqueur de ce match ! Le courage dont il fait preuve suffira-t-il ?!",isbn:"9782505000969",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505000969-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2010",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Nous voici à la finale du championnat de Tokyo. Seigaku se mesure à la redoutable équipe de Yamabuki. Grâce à sa victoire lors du second double, Seigaku rattrape son retard. Les deux équipes sont à égalité avec, chacune, une victoire et une défaite. Seigaku nourrit de grands espoirs concernant ses joueurs en simple mais Momo se fait malmener par Sengoku, dit \"le renard\". Ryôma est, quant à lui, sur le point de rencontrer l'imposant Akutsu...!",isbn:"9782505000358",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505000358-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Shishido et Ootori, de Hyôtei, mènent Inui et Kaidô par le bout du nez. En fait, il s’agit d’une stratégie qu’Inui a mise au point afin de récolter le plus d’informations possible sur ses adversaires. Heureusement, au bout de quelques minutes de jeu, il finit par trouver ce qu’il cherchait ! Mais pourront-ils remonter la pente ? Le boomerang snake de Kaidô sera-t-il à la hauteur ?!…",isbn:"9782505001706",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505001706-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Le petit accident d’Ôishi a forcé Seigaku à improviser : Kikumaru se retrouve en double n° 2 avec Momoshiro. Hyôtei profite de la situation pour prendre le dessus. Nos deux joueurs sont en bien mauvaise posture et Kikumaru est prêt à renoncer. Par chance, les paroles d’Ôishi résonnent dans son cœur et commencent à devenir réalité. Parviendront-ils à s’en sortir ?!",isbn:"9782505001560",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505001560-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Grâce à son talent, qui n’est plus à prouver, et à sa technique de la triple contre-attaque, Fuji passe à l’offensive avec un nouveau coup fatal ! Quel est donc ce coup inconnu jusqu’alors et qu’il appelle \"la baleine blanche\" ?! Le mystérieux Fuji montre enfin son vrai potentiel et provoque une véritable hystérie du côté des spectateurs ! Toutefois, le match le plus attendu reste celui qui opposera les capitaines des deux équipes : Tezuka et Atobe !",isbn:"9782505001959",extraUrl:"https://covers.openlibrary.org/b/isbn/9782505001959-M.jpg"},
  {t:"Le grand air",a:"Othats Margaux",y:"2026",ed:"La Partie",cote:"A OTH",pub:"Jeunesse",sup:"Imprimé",d:"Un imagier pour faire le tour des saisons en jeu et en mouvement ! Sauter, tomber, toucher... cet imagier met en scène une enfant qui goûte chacune des saisons au grand air. Les verbes d'actions, comme une ritournelle, sont mis en pratique par l'enfant, mais aussi par ce qui l'entoure. Ainsi, le pic-vert et le soleil tapent, les bourrasques soufflent, la foudre tombe en été et la nuit tombe en hiver...",isbn:"9782494591370",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494591370-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Jae-ha se transforme en dragon a avant de disparaître sous les yeux de Yona et ses comparses, qui cherchaient désespérément à le retrouver. Pendant ce temps, au sein des troupes du Kôka, les soldats se sentent observés…",isbn:"9782811694593",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811694593-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2025",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Zeno a enfermé l les trois autres dragons dans la coupe de sang. Il explique alors que pour pouvoir mettre fin à ses jours, il doit renvoyer les guerriers dragons au ciel. Puis il fait ses adieux à Yona et Hak&",isbn:"9791043300134",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043300134-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Yona et ses comparses parviennent à faire reculer Tchagol mais, dans la bataille, ils ont perdu la trace de Shin-ah, Jae-ha et Zeno. Soudain, Yona perçoit le cri des dragons…",isbn:"9782811692384",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811692384-M.jpg"},
  {t:"Le coeur d'Alluria",a:"Wilkinson L. M.",y:"2025",ed:"Saxo",cote:"J WIL",pub:"Jeunesse",sup:"Imprimé",d:"Il y a bien des manières d'être brave. Fluette a grandi avec les histoires de Bravepatte, le plus grand guerrier du monde des souris. Depuis, elle rêve d'être comme lui : elle aussi veut vivre des aventures et affronter des ennemis. Mais impossible, dans son village où il ne se passe jamais rien ! Jusqu'au jour où surgissent des ombres qui se nourrissent de couleurs et de vie. Pour Fluette, c'est alors l'occasion de prouver qu'être courageux n'est pas une affaire de taille... Bonus exclusif : 2 marque-pages à découper !",isbn:"9782385701529",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701529-475x500-1.jpg"},
  {t:"La Griffe de Sylvemorne",a:"Wilkinson L. M.",y:"2026",ed:"Saxo",cote:"J WIL",pub:"Jeunesse",sup:"Imprimé",d:"Une petite souris. Une grande quête. Pour sauver Alluria de la destruction, Fluette a quitté la protection de son village. Elle a suivi son coeur... jusque dans un marécage lugubre ! Or, les créatures qui peuplent cet endroit ne sont pas aimables DU TOUT. Mais face à un monstre recouvert de mousse et une tortue diabolique, que peut bien faire une petite souris ? Peu importe les obstacles, Fluette se montrera à la hauteur !",isbn:"9782385701628",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701628-475x500-1.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9791032712146",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712146-M.jpg"},
  {t:"Le chef d'oeuvre maudit",a:"Renucci Clélia",y:"2026",ed:"Albin Michel",cote:"R REN",pub:"Adulte",sup:"Imprimé",d:"Première sélection du Prix Roger Nimier \"Je ne cherche pas seulement Balzac, je cherche la source de Balzac, l'origine de la création\". Auguste Rodin 18 août 1850. La France pleure Honoré de Balzac. Un an plus tard, Alexandre Dumas lance une souscription pour que soit érigée une statue digne de l'auteur de la monumentale Comédie humaine. Le projet traîne, Emile Zola reprend le flambeau, mais il faudra attendre 1891 et de nombreuses péripéties pour qu'Auguste Rodin soit enfin désigné par le comité Balzac. A lui d'honorer le grand romancier du siècle. Comment représenter un tel génie ? La tâche s'avère plus ardue qu'il n'y paraît. D'esquisses en lectures annotées de l'oeuvre de l'écrivain, de modèles en reprises, l'artiste cherche, fait, défait, prend du retard, essuyant critiques et polémiques, jusqu'à déclencher le scandale... Ensorcelée par la quête du sculpteur, Clélia Renucci se glisse dans son esprit, accompagne ses doutes comme ses épiphanies. Des ateliers d'artistes aux abris de la Seconde Guerre mondiale en passant par les cercles artistiques new-yorkais, elle retrace la rocambolesque histoire d'une oeuvre maudite et pourtant fondatrice de la modernité à travers une fabuleuse galerie de personnages.",isbn:"9782226495631",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226495631-M.jpg"},
  {t:"Comme au premier jour",a:"Lombardo Claire",y:"2026",ed:"Rivages",cote:"R LOM",pub:"Adulte",sup:"Imprimé",d:"Mère, épouse et ancienne rebelle, Julia voit son quotidien bouleversé par une série d'événements qui réveillent ses contradictions les plus profondes. Entre humour et tendresse, \"Comme au premier jour\" explore les failles et la force d'une femme qui refuse de se laisser réduire à un rôle. Un roman brillant et drôle sur les secondes chances, les blessures anciennes et l'identité. Après le succès de \"Tout le bonheur du monde\", Claire Lombardo confirme son talent pour dépeindre avec une immense finesse la complexité des dynamiques familiales, dans la lignée d'Anne Tyler et Elizabeth Strout.",isbn:"9782743671617",extraUrl:"https://covers.openlibrary.org/b/isbn/9782743671617-M.jpg"},
  {t:"Cavillore",a:"Claes Jérémie",y:"2026",ed:"Editions Héloïse d'Ormesson",cote:"R CLA",pub:"Adulte",sup:"Imprimé",d:"De retour au village de Gourdon, Nico est renvoyé à son passé et aux meurtres non élucidés qui ont secoué le village trente ans plus tôt. Le prédateur qui sévissait à l'époque court toujours. La menace sourde plane encore. Personnage à part entière, la nature provençale colore cette intrigue de ses ombres et lumières. Quelle est cette créature qui a déposé à l'aube le cadavre d'une jeune inconnue devant l'auberge de Gourdon ? Que veut-elle exposer ? Nul ne croit vraiment à la thèse de l'accident, et dans le village à la tranquillité bousculée, les langues médisantes accusent les Camillieri, une famille de marginaux récemment installée sur les hauteurs. La rumeur enfle et détourne l'attention des ombres menaçantes qui rôdent. Déterminée à protéger les siens, la mère Camillieri se lance à leur poursuite. Mais le silence s'installe, dense comme la roche qui les cerne, et scelle les lèvres des coupables. Patience... La vérité attend son heure. Ode à la nature provençale et au lien charnel qui unit la terre et ceux qui y vivent, Cavillore est un roman noir aussi éclatant qu'un orage de montagne. Jérémie Claes embarque le lecteur dans une traque à flanc de falaise et sonde le coeur battant des hommes.",isbn:"9782487819696",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487819696-M.jpg"},
  {t:"Grand Prince",a:"Stresi Alexia",y:"2026",ed:"Flammarion",cote:"R STR",pub:"Adulte",sup:"Imprimé",d:"L'existence, c'est formidable, paraît-il. C'est surtout long, estime Simone Guillou. A 85 ans, elle pense heureusement avoir fait le plus gros. Il ne peut plus rien lui arriver. Vraiment ? Elle ne le sait pas, Simone. Elle est à mille lieues de s'en douter. Mais la vie lui réserve enfin une surprise... A Barthon-en-Retz, entre océan Atlantique et campagne, il sera question d'un crapaud en ciment, d'une enquête pas tout à fait policière, de la récolte du sel, et d'amour. Ah, et aussi de Pierre Soulages. Le peintre ? Oui, le peintre. Après le succès Des lendemains qui chantent, Alexia Stresi signe un roman lumineux qui confirme son talent pour créer des personnages inoubliables. Grand prince raconte l'inattendu renouveau d'une vie.",isbn:"9782080511256",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080511256-M.jpg"},
  {t:"Habibi Beyrouth",a:"Salamé Manal",y:"2026",ed:"La Tribu",cote:"R SAL",pub:"Adulte",sup:"Imprimé",d:"\"Un matin, je me suis réveillée en rêvant que je ne parlais plus l'arabe. J'ai compris qu'il fallait rentrer.\" Après dix-sept ans en France, loin de son pays natal, Amal revient à Beyrouth pour obtenir une carte d'identité. Mais ce qui ne devait être qu'une simple formalité se révèle beaucoup plus compliqué que prévu et Amal doit prolonger son séjour. Ses démarches administratives la conduisent des rues palpitantes de la capitale jusqu'au sud du pays, dans son village familial désormais tenu d'une main de fer par le Hezbollah. Elle devra affronter ce qu'elle avait fui : la tyrannie des apparences, les sales rumeurs réservées aux femmes non mariées et sans enfants. La traversée de ce pays aussi beau que tourmenté devient un voyage au coeur de la mémoire et des blessures de l'exil.",isbn:"9782487858459",extraUrl:"https://covers.openlibrary.org/b/isbn/9782487858459-M.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2022",ed:"Ki-oon",cote:"BD RAn",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9791032712153",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712153-M.jpg"},
  {t:"Ce temps où nous mourons de ne pas vivre",a:"Leroux Théophane",y:"2026",ed:"Plon",cote:"305.5 LER",pub:"Adulte",sup:"Imprimé",d:"Une chronique douce-amère du néoruralisme et de la quête de sens, ces antidotes en trompe-l'oeil au mal-être moderne des jeunes générations. Un récit littéraire, spirituel et social d'une justesse rare. Théophane a 30 ans, et ce fan de Georges Brassens ne trouve pas sa voie professionnelle et personnelle dans ce monde. Il décide de tout plaquer - son travail, Paris, ses amis - pour partir vivre en Anjou, au milieu des vignes, où il devient ouvrier agricole. Voilà des années que l'on nous vend la \" reconnexion à la nature \" comme la solution miracle à la plupart de nos problèmes et impasses. Loin d'un beau discours enchanteur relevant du mythe, ou du conte de fées moderne pour adultes désorientés, l'auteur propose un récit et des réflexions sur l'Homme et Dieu, et préfère - dans la solitude des vignes - se tourner vers le Beau, l'ascèse et le goût du travail bien fait.",isbn:"9782259324519",extraUrl:"https://covers.openlibrary.org/b/isbn/9782259324519-M.jpg"},
  {t:"Mashle",a:"Komoto Hajime",y:"2023",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeunesse",sup:"Imprimé",d:"Innocent Zero poursuit Mash après lui avoir arraché le coeur, mais est arrêté dans son élan par Domina. Ce dernier, qui avait sombré dans de la lave en fusion, resurgit pour barrer le passage à son redoutable père, au nom de l'amitié qui le lie à son ancien adversaire ! Pendant ce temps, les camarades de Mash, prêts à défier la mort, se démènent pour l'emmener auprès de Meliadoul. Réussiront-ils à atteindre leur destination malgré leurs blessures et les ennemis lancés à leurs trousses ? De son côté, Mash se retrouve à errer dans les limbes, où il fait une rencontre des plus incongrues...",isbn:"9782820346506",extraUrl:"https://covers.openlibrary.org/b/isbn/9782820346506-M.jpg"},
  {t:"Mashle",a:"Komoto Hajime",y:"2024",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeunesse",sup:"Imprimé",d:"Innocent Zero a atteint le stade ultime de son évolution et est désormais l'égal d'un dieu... Désespérés, les habitants du monde de la magie n'ont d'autre choix que de se prosterner à ses pieds. Mais c'est compter sans Mash, qui, avec sa musculature d'une tout autre dimension, s'est façonné une technique ravageuse ! Même mis en difficulté par son adversaire, il revient encore et toujours à la charge, galvanisé par le soutien du peuple tout entier ! Mash va-t-il prouver une dernière fois que la force de ses muscles et celle de son amitié sont capables d'accomplir des miracles ? !",isbn:"9782820348029",extraUrl:"https://covers.openlibrary.org/b/isbn/9782820348029-M.jpg"},
  {t:"Moi, quand je me réincarne en Slime - Tome 30",a:"Kawakami Taiki",y:"2026",ed:"Kurokawa",cote:"BD MOI",pub:"Jeunesse",sup:"Imprimé",d:"Comment un slime devient le seigneur du royaume ! Limule affronte Yûki, manipulé par le pouvoir de Mariabell, mais comprend qu'il n'arrivera pas à le libérer de son emprise. Alors que le duel bat son plein, ils sont interrompus de façon plutôt inattendue. Millim est partie rejoindre le dragon du chaos, et pendant ce temps, Mariabell s'est volatilisée... La situation évolue rapidement sur plusieurs fronts à la fois. Comment Limule fera-t-il face à cette crise ?",isbn:"9791042021825",extraUrl:"https://covers.openlibrary.org/b/isbn/9791042021825-M.jpg"},
  {t:"Au saccage des petits bonheurs",a:"Cyrulnik Boris",y:"2026",ed:"Editions Odile Jacob",cote:"155.9 CYR",pub:"Adulte",sup:"Imprimé",d:"\"Pourrait-on vivre sans civilisation ? Un enfant sauvage privé de relations humaines n'a aucune chance de devenir humain. Chez les animaux, déjà, les rituels d'interaction harmonisent les rencontres. Chez les humains, les rituels de civilisation organisent les relations quotidiennes et facilitent l'art de vivre ensemble. On utilise une fourchette, on découpe la viande, on se tient bien à table, on respecte les tours de parole, ce qui met en scène des scénarios différents selon les cultures et les époques. Depuis les années 1990, ces rituels sont mal transmis, les mots ne désignent plus les mêmes choses, les récits discordants désorganisent les petits bonheurs de la vie quotidienne, provoquent l'amertume et l'explosion des incivilités. Que se passe-t-il dans notre culture ? Les enfants sont anxieux, les femmes pensent au suicide, les hommes décrochent et les agressions sexuelles augmentent, révélant ainsi une décivilisation des moeurs. Par bonheur, après chaque catastrophe, une renaissance invente de nouveaux rituels, rétablit une autre manière d'être heureux ensemble. Il nous faut réinventer une civilité pour permettre une coexistence harmonieuse entre hommes et femmes, entre adultes et enfants, entre humains différents - mais aussi entre les humains et la nature\", B. C. Un grand message d'espoir.",isbn:"9782415015091",extraUrl:"https://covers.openlibrary.org/b/isbn/9782415015091-M.jpg"},
  {t:"Des choux et des reines",a:"Pancol Katherine",y:"2026",ed:"Albin Michel",cote:"R PAN",pub:"Adulte",sup:"Imprimé",d:"Sophie a sauté dans le premier train pour Rouen avec, pour seul bagage, son chien Sherlock. Elle s'est enfuie. Ce jour-là, son amant avait oublié de l'enfermer à double tour...",isbn:"9782226512499",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226512499-M.jpg"},
  {t:"Miguel",a:"Sobral Patrick",y:"",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001959",extraUrl:"https://catalogue.bnf.fr/couverture?appName=NE&idImage=355910&couverture=1"},
  {t:"Théorême vivant",a:"Villani Cédric",y:"2012",ed:"Grasset",cote:"510.92 VIL",pub:"Adulte",sup:"Imprimé",d:"Histoire romancée de la traque de l'énigme mathématique que l'auteur a cherché à résoudre pendant de longues années et qui lui a valu la médaille Fields en 2010, avec des portraits de grandes figures de l'histoire des maths et de vertigineuses équations.",isbn:"9782246798828",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246798828-M.jpg"},
