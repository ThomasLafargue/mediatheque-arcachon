  {t:"Ecume d'hiver",a:"Muis Anne-Solange",y:"2026",ed:"Phébus",cote:"R MUI",pub:"Adulte",sup:"Imprimé",d:"Dans le village de Miquelon, l'hiver a tout effacé et l'horizon n'existe plus. C'est ici que sont nés Michel et Jean, deux frères qui vivent de la pêche traditionnelle à la morue. Mais un soir de grand froid, Jean disparaît. Son sort va alors sceller le destin de son fils Yoann, contraint à revenir sur l'île qu'il avait quittée enfant. Se heurtant à un quotidien où la nature guide tout, cet homme devra renouer avec la terre qui l'a vu naître et, qui sait, avec son passé. A travers des chapitres composés comme des tableaux, Anne-Solange Muis plonge le lecteur dans les paysages et les légendes de Miquelon-Langlade, à Saint-Pierre-et-Miquelon, ce bout de France perdu aux confins de l'Atlantique Nord. Et bâtit, avec une langue d'une infinie sobriété, le décor immense d'une vibrante histoire de transmission.",isbn:"9782752915108",extraUrl:"https://covers.openlibrary.org/b/isbn/9782752915108-M.jpg"},
  {t:"Off",a:"Renard Romain",y:"2026",ed:"Daniel Maghen",cote:"BD REN",pub:"Adulte",sup:"Imprimé",d:"Une tempête solaire a provoqué à l'échelle mondiale une coupure de courant généralisée qui risquent d'être durable. Tout s'arrête et menace de s'effondrer. Les destins croisés de cinq hommes et femmes racontent la chronique d'un monde qui pourrait être le nôtre... quand il faudra tout recommencer",isbn:"9782356742162",extraUrl:"https://covers.openlibrary.org/b/isbn/9782356742162-M.jpg"},
  {t:"Apogée",a:"Duval Fred",y:"2026",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"Voici le récit d'une alliance entre les dignitaires du Complexe et un spécimen d'une espèce considérée comme peu avancée mais qui est observée de près: l'Homme. Au premier siècle de l'ère chrétienne, un centurion romain, Marcus Valerius se retrouve au coeur d'une guerre sans merci, au-delà de la Voie lactée. Le premier conflit stellaire voit s'affronter les 23 planètes du Complexe et la redoutable civilisation Ouröbörös, dévoreuse de mondes",isbn:"9782205214369",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205214369-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeunesse",sup:"Imprimé",d:"Seigaku et Saint-Rudolph s’acheminent vers la demi-finale. Durant les doubles n° 1 et n° 2, leurs équipes s’affrontent dans des face-à-face explosifs ! Un rythme à couper le souffle !!  Ôishi et Kikumaru perdent leur match alors que, de leur côté, Kaidô et Momo semblent avoir trouvé un terrain d’entente. Que nous réservent-ils ?",isbn:"9782871299356",extraUrl:"https://covers.openlibrary.org/b/isbn/9782871299356-M.jpg"},
  {t:"L'intelligence naturelle et l'éveil de la conscience",a:"Damasio Antonio R.",y:"2026",ed:"Editions Odile Jacob",cote:"153.9 DAM",pub:"Adulte",sup:"Imprimé",d:"\"Ce livre est né d'une conviction : je crois qu'il est possible d'expliquer de manière convaincante comment la conscience est fabriquée et ce qu'elle apporte à l'humanité. Alors comment la définir ? Donnons-en une formulation rapide : la conscience est le processus biologique qui permet à chacun de faire l'expérience de sa vie individuelle. En d'autres termes, telle que je la conçois, la conscience nous permet de sentir que nous sommes en vie, que nous existons. Grâce à elle, il nous est possible de conclure que nous avons un esprit, mais aussi d'avoir l'intuition de sa nature privée, et même la conviction assez forte que nous n'avons qu'un seul esprit et non pas plusieurs. C'est incroyable, mais nous sommes parvenus à approcher, je crois, au moins une petite partie du mystère - la fabrication de la conscience - et à la résoudre\". (A. D.) Le nouveau livre d'Antonio Damasio explore les mystères de la conscience.",isbn:"9782415011499",extraUrl:"https://covers.openlibrary.org/b/isbn/9782415011499-M.jpg"},
  {t:"La voie",a:"Tallent Gabriel",y:"2026",ed:"Editions Gallmeister",cote:"R TAL",pub:"Adulte",sup:"Imprimé",d:"Dans le sud du désert de Mojave, Dan et Tamma traversent leur dernière année de lycée comme on aborde une voie d'escalade, entre appréhension et excitation. Dan est un garçon prodige et discret, Tamma, une fille bavarde et intrépide. Inséparables, ils passent leur temps à escalader des rochers durant les froides nuits du désert. C'est là qu'est né leur rêve commun, leur désir d'aventure. Mais à mesure que l'année avance, ils se heurtent aux réalités du monde adulte. Leurs différences de milieu social, de talent et d'ambition ne peuvent plus être balayées d'un rire ou d'un serment. Un choix se profile, inévitable : rester fidèles à eux-mêmes, ou céder aux exigences du monde. Chacun devra, quoi qu'il en coûte, tracer sa propre voie. Après My Absolute Darling, le deuxième roman de Gabriel Tallent est une histoire lumineuse et pleine d'adrénaline sur le pouvoir rédempteur de l'amitié et l'importance de savoir tout risquer pour changer sa vie.",isbn:"9782351783238",extraUrl:"https://covers.openlibrary.org/b/isbn/9782351783238-M.jpg"},
  {t:"qui se ressemble",a:"Desarthe Agnès",y:"2026",ed:"Buchet-Chastel",cote:"R DES",pub:"Adulte",sup:"Imprimé",d:"\"Tu es ma vie, chante la femme à l'épaisse chevelure noire maintenue en un chignon gonflé. Elle a un mouchoir à la main, comme ma grand-mère, des lunettes fumées, comme ma grand-mère, elle parle arabe, comme ma grand-mère\". 1956, Besançon : un jeune homme venu d'Algérie découvre la France. 6 octobre 1973, Paris, jour de Kippour : une enfant comprend confusément qu'une guerre vient d'éclater. Au fil du texte, la chanson Enta Omri d'Oum Kalsoum devient fil d'Ariane : une musique-mémoire pour dire l'exil, la langue, la transmission, la traduction ? et ce \" douanier \" imaginaire qui laisse passer les mots mais retient la culture. Avec une justesse éblouissante, Agnès Desarthe signe un récit la fois intime et ample où la musique ouvre les portes du passé et éclaire la complexité d'une appartenance.",isbn:"9782283041307",extraUrl:"https://covers.openlibrary.org/b/isbn/9782283041307-M.jpg"},
  {t:"Pilote automatique",a:"Ruffel Eliot",y:"2026",ed:"Editions de l'Olivier",cote:"R RUF",pub:"Adulte",sup:"Imprimé",d:"Oscar, vingt-cinq ans, travaille comme livreur d'électroménager pour une grande enseigne. Les journées se succèdent : zones périphériques qui se ressemblent toutes, trajets en camion, clients plus ou moins aimables, musique partagée et cafés trop serrés. Puis viennent les soirées à refaire le monde, la fatigue et les lendemains brumeux. Autour de lui, il y a Kamel, le collègue danseur, Toutac et Sanders, les potes d'enfance. En miroir, il y a Clément, le frère modèle, celui qui avance pendant qu'Oscar stagne, moteur allumé mais itinéraire inconnu. Quand Chloé, un visage du passé, réapparaît par hasard, une fissure s'ouvre dans la routine et ravive chez Oscar le besoin de reprendre la main sur sa vie. Pilote automatique raconte la lente usure du quotidien et du travail, les fidélités qui sauvent et le désir têtu de recommencer. Eliot Ruffel déploie une langue à la fois orale et poétique, capable de saisir la beauté des gestes ordinaires.",isbn:"9782823623642",extraUrl:"https://covers.openlibrary.org/b/isbn/9782823623642-M.jpg"},
  {t:"Il faudrait leur dire",a:"Ponte Carène",y:"2026",ed:"Fleuve éditions",cote:"R PON",pub:"Adulte",sup:"Imprimé",d:"Six amis viennent d'avoir leur bac. Lors de leur dernière soirée ensemble, ils se font la promesse de se revoir, quoiqu'il arrive, tous les cinq ans. Ils vont tenir cette promesse, mais rien ne sera simple, parce que la vie ne l'est pas... Une histoire d'amitié à l'épreuve du temps et de la vie.",isbn:"9782265158931",extraUrl:"https://covers.openlibrary.org/b/isbn/9782265158931-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2018",ed:"Pika édition",cote:"BD YON",pub:"Jeunesse",sup:"Imprimé",d:"Arrivés à Ryûsui, Yona et Hak contactent l'informateur Ogi pour lui demander d'envoyer un message à Soo-won. Ils espèrent ainsi empêcher une guerre entre le pays de Shin et celui de Kôka. Jae-ha et les autres dragons, pris en otage à Shin, se remettent doucement de leurs blessures grâce aux bons soins de Mizari dont la curiosité à l'égard des dragons est sans bornes. Mais la guerre parait inévitable et la vie des quatre dragons et de Yeon ne semble tenir qu'à un fil.",isbn:"9782811643423",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811643423-M.jpg"},
  {t:"Fleur de peau",a:"Guisset Constance",y:"2026",ed:"Flammarion",cote:"R GUI",pub:"Adulte",sup:"Imprimé",d:"\"Toutes les fleurs semblent hostiles, même les plus délicates. Les corolles sont autant de grenades dégoupillées et les pistils ricanent de ma naïveté. Je respire mal, je tremble, j'ai peur. Quelle est la probabilité que je tombe malade ? Ne le suis-je pas déjà ? Ces fleurs sont pourtant mes alliées, impossible d'envisager leur complicité\". Pour Ava, fleuriste parisienne et mère de deux enfants, les saisons s'écoulent au gré des clients et des messages à transmettre avec les fleurs. Jusqu'au jour où elle reçoit des analyses inquiétantes qui lui font penser que son sang contient des taux élevés de pesticides. Malgré l'apparition des premières perturbations physiques, elle garde le secret. Même auprès de Jérôme, son mari, qui ne voit rien. Prise dans une course contre la montre, Ava tente la diversion. Un séminaire en Normandie dans un jardin légendaire et une nuit insolite passée à la belle étoile vont déclencher en elle le désir effréné de redevenir vivante.",isbn:"9782080498144",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080498144-M.jpg"},
  {t:"L'impasse des rêves",a:"Van Cauwelaert Didier",y:"2025",ed:"Albin Michel",cote:"R VAN",pub:"Adulte",sup:"Imprimé",d:"\"Nous nous sommes connus grâce à une erreur d'enveloppes, un éditeur ayant renvoyé à chacun le manuscrit de l'autre. Dès les premières pages, c'est le coup de foudre. Et notre rencontre dans la réalité ne fera qu'amplifier l'attirance. Sauf qu'Anaïs est mariée, deux enfants. Et que son roman renferme les clés du crime que, peut-être, elle commettra l'automne suivant\". Quand on a vingt ans et des poussières, comment concilier l'amour fou et les conséquences d'un meurtre ? Entre réalité trompeuse et fiction révélatrice, Didier van Cauwelaert interroge le pouvoir de la littérature sur nos destins, nous offrant son roman le plus intime. La formidable histoire d'une passion sans issue qui conduit à une renaissance.",isbn:"9782226497215",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226497215-M.jpg"},
  {t:"La mémoire des vaincus",a:"Guillou Bleuenn",y:"2026",ed:"Didier jeunesse",cote:"J GUI",pub:"Adolescent",sup:"Imprimé",d:"A Novi Zora, tout s'achète, même les souvenirs. Voilà quatorze ans que la nation, vaincue par Mirska lors d'une guerre sans merci, vit dans la honte et la misère. Anastasia connaît bien la valeur de la poussière mémorielle : elle a vendu son passé pour devenir voleuse de souvenirs. Ses missions, de plus en plus dangereuses, la mènent jusqu'au Parlement des Trente. C'est là que Lev compte trouver sa place en gravissant les échelons politiques, aidé d'un mentor anonyme. Contrairement à ses traîtres de parents, effacés de toutes les mémoires par le châtiment de la damnatio memoriae, il entend marquer l'Histoire en restaurant la gloire de sa patrie. Mais dans les coulisses du Parlement, les souvenirs les plus précieux attisent les convoitises. Quand les échos du passé se heurtent aux ambitions de l'avenir, il faut parfois se méfier de sa propre mémoire...",isbn:"9782278132157",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782278132157-475x500-1.jpg"},
  {t:"You rock me",a:"Iwashita Keiko",y:"2025",ed:"Pika édition",cote:"BD YOU",pub:"Adulte",sup:"Imprimé",d:"Hibari, étudiante en graphisme, se trouve beaucoup trop sérieuse mais n arrive pas du tout à lâcher prise, ce qui l empêche d avancer dans son travail. Un jour, dans le restaurant de ramen où elle travaille, elle fait la rencontre tumultueuse de Gaku, étudiant en art dans la même université et tête d affiche dans un groupe de rock. C est un garçon libre et fougueux, aux antipodes de ce qu elle est, qui va complétement secouer la vie de Hibari et l inciter à changer totalement ses habitudes&",isbn:"9782811692100",extraUrl:"https://covers.openlibrary.org/b/isbn/9782811692100-M.jpg"},
  {t:"Miam, ouvre grand",a:"Montanari Eva",y:"2026",ed:"Thierry Magnier",cote:"A MON",pub:"Jeunesse",sup:"Imprimé",d:"Mâchoire serrée, assiette renversée, pas question d'avaler cette bouchée ! Et si le repas quittait la table pour devenir une grande aventure à vivre en famille ?",isbn:"9791035209278",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209278-475x500-1.jpg"},
  {t:"Arrière-cuisine",a:"Chapman Katriona",y:"2026",ed:"Futuropolis Gallisol Editions",cote:"BD CHA",pub:"Adulte",sup:"Imprimé",d:"La jeune trentaine, Claudia est en passe de devenir une véritable star de la scène culinaire. Alors qu'elle s'efforce de faire connaître son restaurant d'un quartier hype du Sud-Est de Londres, le Alley, elle décide de participer au prochain concours du Chef de l'année. Tout cela, alors qu'elle tente également de se faire un nom, loin de l'ombre de son célèbre père chef cuisinier français, à la retraite. A l'approche du concours, la tension monte, la pressions des affaires, de la famille et de l'amitié menacent de bouleverser son univers. Pour ce livre, Katriona Chapman donne vie à l'atmosphère sous tension de la vie d'un restaurant. Ses personnages, la chef Claudia, sa meilleure amie et sous-chef Lisa, et le barman Ben sonnent on ne peut plus juste. Le lecteur s'installe à la meilleure table et observe avec gourmandise les envies et les doutes des différents personnages, dans leurs vies personnelles comme professionnelles. Après le très remarqué Breakwater (élu l'un des meilleurs romans graphiques de 2020 pour le New York Times), Katriona Chapman revient avec un récit intimiste au coeur d'un restaurant londonien à la mode. Arrière-cuisine parait quasi simultanément en France et aux USA chez Fantagraphics.",isbn:"9782754848091",extraUrl:"https://covers.openlibrary.org/b/isbn/9782754848091-M.jpg"},
  {t:"Bisous bisous",a:"Geis Patricia",y:"2026",ed:"Editions Casterman",cote:"A GEI",pub:"Jeunesse",sup:"Imprimé",d:"Des flaps et des pop-ups pour se faire des bisous par milliers ! Mamie Miel envoie un bisou à Grisou, qui le reçoit sur la joue. De flaps en flaps, une véritable chaîne de bisous se met en place : des bisous pour guérir, des bisous pour souhaiter un anniversaire, des bisous pour demander pardon, des bisous pour tout le monde ! Un très bel objet ludique et plein d'amour : le petit lecteur pourra lui-même déplacer le bisou, grâce au rabat, vers le copain suivant !",isbn:"9782203296510",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203296510-475x500-1.jpg"},
  {t:"C'est à moi !",a:"Lang Suzanne",y:"2026",ed:"Editions Casterman",cote:"A LAN",pub:"Jeunesse",sup:"Imprimé",d:"Un album pour accompagner le difficile apprentissage du partage. C'est l'heure du déjeuner pour Gaston le chimpanzé. Il cueille la toute dernière banane sur le bananier. Mais il la fait tomber ! Et quand il descend de l'arbre pour la récupérer, Phacochère l'a déjà ramassée. - C'est ma banane ! déclare Gaston. - Je l'ai trouvée, je la garde ! répond Phacochère. Phacochère se met en colère. Et Gaston aussi. C'EST A MOI ! Et pas question de partager !",isbn:"9782203300217",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300217-475x500-1.jpg"},
  {t:"La prisonnière d'Antésalem",a:"Gazzotti Bruno",y:"2026",ed:"Rue de Sèvres",cote:"BDJ GAZ",pub:"Jeunesse",sup:"Imprimé",d:"Les Cinq ne sont pas revenus indemnes de leur expédition sur l'île au bord du monde mais ils savent désormais où Jezabel est retenue captive. Parti libérer la mystérieuse prisonnière en compagnie du Maître-Fou, Dodji découvre les ruines d'Antésalem, vestiges de la précédente guerre : éloigné de son camp, il ignore que Saul a déployé ses forces et se tient prêt à frapper. Convaincu d'oeuvrer pour le Bien, le jeune Imperator a activé de nouveaux Protecteurs et s'est doté d'une arme implacable : les Séraphins, une milice d'enfants-soldats d'une fidélité absolue, prêts à se sacrifier pour lui. Grisé par la puissance de ses pouvoirs, Saul lance une attaque sans pitié : la Nouvelle Guerre des Limbes a commencé.",isbn:"9782810206162",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782810206162-475x500-1.jpg"},
  {t:"Le pégase",a:"Chamblain Joris",y:"2026",ed:"Editions de la Gouttière",cote:"BDJ CHA",pub:"Jeunesse",sup:"Imprimé",d:"Caché au coeur d'un Muséum d'histoire Naturelle se trouve le cabinet d'Enola, une vétérinaire hors du commun. Sa spécialité ? Les animaux des contes et légendes ! Centaures, trolls et autres gargouilles n'ont aucun secret pour elle. Avec son compagnon de route Maneki et à l'aide des inventions du génial Archibald, elle parcourt le monde pour soigner les maux des créatures extraordinaires. La petite souris n'est pas passée ? Votre minotaure semble égaré ? Demandez conseil à Enola, elle saura vous aider !",isbn:"9782357961432",extraUrl:"https://covers.openlibrary.org/b/isbn/9782357961432-M.jpg"},
  {t:"Comment embobiner la momie",a:"Parme Fabrice",y:"2026",ed:"Rue de Sèvres",cote:"BDJ PAR",pub:"Jeunesse",sup:"Imprimé",d:"Monsieur de Rosette, le célèbre égyptologue a découvert un incroyable tombeau pharaonique. Le sarcophage va être envoyé aux Etats-Unis pour être conservé dans un musée ! Karnak, un étrange client désargenté du Grand Louxor Hotel, saisit l'occasion : ce sarcophage serait une cache idéale pour lui, l'occasion de fuir en toute discrétion sans régler sa note... Il n'y a plus qu'à se déguiser, s'allonger et remplacer la momie qui s'y trouve déjà. Mais cette dernière n'a pas dit son dernier mot... Une nouvelle enquête pour Astrid qui embarque elle aussi sur le paquebot. Une traversée qui s'annonce mouvementée !",isbn:"9782810209637",extraUrl:"https://covers.openlibrary.org/b/isbn/9782810209637-M.jpg"},
  {t:"Lincoln dans la ligne de mire",a:"Neidhardt Fred",y:"2025",ed:"Dupuis",cote:"BDJ NEI",pub:"Jeunesse",sup:"Imprimé",d:"Condamné au peloton d'exécution pour une désertion de trop, Blutch se retrouve emprisonné, avec pour voisine la mystérieuse Isabella Boyd, elle-même frappée de peine capitale pour intelligence avec l'ennemi. Parvenant à s'évader avec cette dernière, l'ancien caporal intègre un groupe de conspirateurs sudistes, qui vont lui demander d'abattre le président Lincoln ! Blutch, pacifiste par nature, parviendra-t-il à résister à l'insistance de ses nouveaux \"amis\" ? Cela s'annonce compliqué, car les charmes de la belle Isabella semblent l'éloigner des bras de Chesterfield qui, se sentant coupable de l'arrestation de son ami, le recherche désespérément... Entre grande aventure, gags en rafale et exploration de l'Histoire, Fred Neidhardt poursuit avec un épatant respect l'oeuvre de Raoul Cauvin, toujours en compagnie de l'inusable Willy Lambil ! Fred Neidhardt, à l'aise dans de nombreux registres, chausse les bottes des Tuniques Bleues pour des intrigues pleines d'humour et de culture. L'inépuisable Lambil est, comme toujours, impeccable.",isbn:"9782808507660",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808507660-475x500-1.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2026",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n accueillir que des cancres, s'est lié d'amitié avec Kaoruko Waguri, qui fréquente un établissement pour filles de bonne famille, Kikyô.Tandis que l été qui marque le début de leur relation touche bientôt à sa fin, Rintarô donne rendez-vous à Waguri pour lui offrir un gâteau en récompense de son dur labeur estival. Le jour de leur tête-à-tête, le jeune homme s attendait à tout& sauf à se retrouver soudain invité à dîner chez la famille de sa petite amie ! L aspirant pâtissier en profite alors pour transmettre ses bonnes intentions à la mère de Waguri&Roméo & Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions![xc2][xa0]",isbn:"9782384966448",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384966448-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeunesse",sup:"Imprimé",d:"Rintarô Tsumugi, un élève d un lycée qui rassemble des garçons au plus bas de l échelle scolaire, fait un jour la connaissance de Kaoruko Waguri, qui fréquente un établissement de filles de bonne famille.Appréciant de plus en plus les moments passés en compagnie de la jeune fille, notre héros commence bientôt à s apercevoir de ses sentiments naissants à son égard.Un jour, alors qu ils se retrouvent tous les deux, submergé par ses sentiments à l égard de Kaoruko, les mots lui échappent& et Rintarô lui déclare sa flamme.  Suite à cet épisode, il est bien déterminé à lui transmettre tout ce qu il ressent pour elle.  L amour sincère entre ces deux lycéens que tout oppose, et pourtant si proches, finira-t-il par éclore ?",isbn:"9782384963928",extraUrl:"https://covers.openlibrary.org/b/isbn/9782384963928-M.jpg"},
  {t:"L'Or du soir",a:"Duplessy-Rousée Carole",y:"2026",ed:"Presses de la Cité",cote:"R DUP",pub:"Adulte",sup:"Imprimé",d:"Au coeur du Quercy blanc, le destin d'Alek, cabossé par la vie mais épris de justice face au drame des violences faites aux femmes. Par l'autrice du Coeur à l'envers . Renvoyé de la police après une terrible bavure, Alek a sombré. Il aurait pu mettre fin à ses jours si un ami ne l'avait pas emmené loin de Paris, à Montaigu-de-Quercy. Au coeur d'une nature réconfortante, Alek retrouve peu à peu le goût de vivre. Un matin, il croise une inconnue couverte d'hématomes. Aussitôt, son instinct de policier reprend le dessus. Il commence à enquêter, et se met en tête de sauver Guillemette Jory des griffes de son mari. S'introduisant dans le domaine des Jory, une lavanderaie, il tente de convaincre Guillemette et son employée, Farah, de partir. Sans succès. Pourquoi les deux femmes ne fuient-elles pas le danger que représente Jory ? Un secret les condamne-t-il à rester aux mains de cet homme violent ? Sur un thème aux résonances contemporaines, un roman guidé par l'espoir et la lumière d'âmes libres.",isbn:"9782258213227",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258213227-M.jpg"},
  {t:"La Colline",a:"Beaussault Mathilde",y:"2026",ed:"Seuil",cote:"R BEA",pub:"Adulte",sup:"Imprimé",d:"Un jour d'hiver, dans une cité de Rennes, un nouveau-né est découvert au fond d'un container à ordures. Vivant. Quelques étages plus haut, une jeune fille se vide de son sang. Elle s'appelle Monroe, elle a dix-sept ans. Dans cette chambre où sa mère l'a enfermée, Monroe revit les mois passés sur la colline, chez sa grand-mère Madeleine. Là-haut, le vent, le labeur et le silence façonnent les corps. Auprès de cette vieille femme solitaire aux mains guérisseuses, Monroe, enceinte, a découvert une paix inespérée. Et puis tout s'est écroulé. Monroe s'affaiblit, les policiers enquêtent, les soignants espèrent, les pompiers s'interrogent, la famille se désintègre : durant ces quelques heures d'une intensité foudroyante, chacun mesurera ce qu'il a perdu - ou sauvé - de son humanité.",isbn:"9782021602302",extraUrl:"https://covers.openlibrary.org/b/isbn/9782021602302-M.jpg"},
  {t:"Cathédrale",a:"Noui Tarik",y:"2026",ed:"Actes Sud",cote:"R NOU",pub:"Adulte",sup:"Imprimé",d:"Une nuit, dans la cité déchue d'Enoch, un garçon noir issu des quartiers miséreux est pris pour cible par la police. Corban Khôl ne souhaitait pourtant qu'une chose : découvrir la construction en cours de \"la plus grande cathédrale du monde\". Quelques mois plus tard, alors que des nuées de corneilles se sont abattues sur les rues, Sarah Stavisky, une jeune étudiante a priori sans histoires, disparaît. Jonathan Lamm, affecté à l'enquête, sait qu'il doit faire vite : semant des cadavres sur son passage, la pègre pourrait bien être elle aussi à la recherche du coupable... Tarik Noui signe ici un grand roman noir sur une humanité qui contemple sa propre fin et tente à toute force d'y échapper. Entre ténèbres et éclat, au coeur d'une ville qui dévore ses enfants : un lieu en devenir où tous pourront réclamer leur part de pardon. Mais, en enfer, rares sont les innocents, et rares ceux qui n'obéissent qu'à une seule loi.",isbn:"9782330215880",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330215880-M.jpg"},
  {t:"Noah de Montréal",a:"Husar Stéphane",y:"2021",ed:"ABC melody",cote:"J 917.14 HUS",pub:"Jeunesse",sup:"Imprimé",d:"Pars à la découverte de Montréal, avec Noah, un petit Québécois de 8 ans. Il te présente sa maison, sa famille, son école, ses amis, le mont Royal, le Biodôme, les activités d'hiver, la poutine... Prêt(e) pour la visite ? Bienvenue à Montréal ! Avec la collection Viens voir ma ville, départ immédiat pour découvrir les villes du monde dès 5 ans ! De belles double-pages illustrées, des détails amusants et des textes pleins d'humour ! Sans oublier le lexique québécois de Noah pour te faire plein d'amis lors de ton prochain voyage à Montréal !",isbn:"9782368362495",extraUrl:"https://covers.openlibrary.org/b/isbn/9782368362495-M.jpg"},
  {t:"Assaut contre la frontière",a:"Slimani Leïla",y:"2026",ed:"Gallimard",cote:"R SLI",pub:"Adulte",sup:"Imprimé",d:"\"Il me semble que tout roman est la tentative de répondre à une question. Et que celle qui fut à l'origine et au centre de ma trilogie est celle-ci : pourquoi est-ce que je ne parle pas ma langue ? Cette langue arabe, qu'est-elle pour moi ? Penser à ça, à la langue arabe, c'est ressentir un mélange de chagrin et de honte, de colère et de frustration. Comment pourrais-je vous raconter, vous faire comprendre que je parle comme une enfant la langue qui devrait être la mienne ? Que je vis avec une langue fantôme comme on parle d'un membre fantôme dont on sent encore la présence bien qu'il ait été amputé. Cette langue, je l'ai cherchée partout. Je l'ai désirée, je l'ai poursuivie, j'ai pu suivre des inconnus dans la rue simplement pour les entendre prononcer ces syllabes familières. Je pourrais aisément reprendre à mon compte les mots de l'écrivaine et peintre libanaise Etel Adnan : \"Je me suis retrouvée à la porte de cette langue. Je l'ai érigée en mythe, en une sorte de paradis perdu. \"\" Une première version de ce texte a été lue en public par Leïla Slimani lors du Festival d'Avignon 2025.",isbn:"9782073152930",extraUrl:"https://covers.openlibrary.org/b/isbn/9782073152930-M.jpg"},
  {t:"Max décide de faire des efforts",a:"Saint Mars Dominique de",y:"2009",ed:"Calligram",cote:"BDJ SAI",pub:"Jeunesse",sup:"Imprimé",d:"Max se surpasse pour faire de la planche à voile. Il décide d'appliquer la même méthode à l'école... Avec ses copains, il crée un club d'entraide. Mais il en fait trop, il se prive de tout ! Va-t-il tenir le coup ? Ou craquer ? Ce livre de Max et Lili parle de la difficulté de faire des efforts, ou comment s'obliger à faire ce qu'on n'aime pas, à résister aux tentations, ne pas se décourager et arriver à se concentrer. Il faut aussi savoir se relaxer et chasser les soucis de sa tête pour garder toute son énergie et avoir le plaisir et la fierté d'arriver à ce qu'on veut ! La persévérance, c'est une baguette magique pour être bon en sport, en musique, à l'école... !",isbn:"9782884805315",extraUrl:"https://covers.openlibrary.org/b/isbn/9782884805315-M.jpg"},
  {t:"Les femmes du France",a:"Brisby Zoe",y:"2026",ed:"Albin Michel",cote:"R BRI",pub:"Adulte",sup:"Imprimé",d:"Sur ce paquebot, personne n'est ce qu'il prétend être. Septembre 1974, le France effectue sa dernière traversée. Les marins, qui refusent son démantèlement, organisent une mutinerie, prenant en otages équipage et passagers. A bord, trois femmes avancent dans la tourmente. Jane, passagère de Première classe. Charlie, coiffeuse sur le navire. Rose, femme de chambre. Elles ont embarqué en secret pour retrouver Alice, mystérieusement disparue à bord. Dans cette poudrière qu'est devenu le France, la quête de vérité a un prix, et fait ressurgir les ombres du passé. Sur fond d'histoire vraie, Zoe Brisby livre un roman haletant sur la mémoire, la justice et la reconstruction. \"Zoe Brisby est une formidable raconteuse d'histoires\". Gérard Collard, France 5",isbn:"9782226499035",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226499035-M.jpg"},
  {t:"Créer sa boîte pour les Nuls",a:"Percin Laurence de",y:"2026",ed:"First Editions",cote:"658.11 PER",pub:"Adulte",sup:"Imprimé",d:"Lancez votre petite entreprise ! Dans cette nouvelle édition entièrement mise à jour, vous trouverez tous les conseils pour mettre votre produit au point et cerner votre marché, des explications pour comprendre les différentes formes d'entreprises, des stratégies infaillibles pour séduire les investisseurs, des méthodes de gestion éprouvées pour affronter les difficultés, ainsi que des outils pour maîtriser la comptabilité et vous ouvrir la voie du succès.",isbn:"9782412106310",extraUrl:"https://covers.openlibrary.org/b/isbn/9782412106310-M.jpg"},
  {t:"La petite fille aux allumettes",a:"Andersen Hans Christian",y:"2025",ed:"Albin Michel",cote:"C AND",pub:"Jeunesse",sup:"Imprimé",d:"C'est le tout dernier soir de l'année, celui du Nouvel An. Une petite fille arpente les rues, tête nue, pieds nus. Personne na voulu acheter ses allumettes. Pour se réchauffer, elle les craque une une, et chaque flamme lui procure une vision de bonheur : un festin sublime, un sapin de Noël richement décoré, des bougies qui se transforment en toiles... jusqu'au doux visage de sa grand-mère qui n'est plus.",isbn:"9782226499790",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226499790-475x500-1.jpg"},
  {t:"5 petits moutons gloutons",a:"Claire Céline",y:"2026",ed:"L'École des loisirs",cote:"A CLA",pub:"Jeunesse",sup:"Imprimé",d:"C'est l'hiver et 5 petits moutons jouent dans la neige quand soudain une odeur alléchante de chocolat les attire vers la maison du loup. En passant par la cheminée, les moutons espèrent tomber directement dans le chaudron plein de chocolat sans se faire croquer ! Est-ce une bonne idée ?",isbn:"9782211346153",extraUrl:"https://covers.openlibrary.org/b/isbn/9782211346153-M.jpg"},
  {t:"Ceci n'est pas une prune !",a:"Ojari Dan",y:"2026",ed:"Editions Gründ",cote:"A OJA",pub:"Jeunesse",sup:"Imprimé",d:"Est-ce vraiment une araignée velue ? Et une oie bien dodue ? UNE IMAGE PEUT EN CACHER UNE AUTRE !",isbn:"9782324039119",extraUrl:"https://covers.openlibrary.org/b/isbn/9782324039119-M.jpg"},
  {t:"Où vas-tu, petit fleuve ?",a:"Gallardo Nuria",y:"2026",ed:"Seuil",cote:"A GAL",pub:"Jeunesse",sup:"Imprimé",d:"Tout débute au matin, quand Petit Fleuve, du haut des montagnes enneigées, commence son voyage. Il descend le long des berges et des forêts... croise ici un canard, là une carpe, plus loin une loutre... Il fait des tours et des détours, dit bonjour aux nuages. Sa musique résonne jusqu'au fond de la campagne. Vite, la nuit tombe, Petit Fleuve se dépêche. Il a rendez-vous quelque part. La lune se lève à présent, bientôt l'embouchure. L'heure est aux retrouvailles, et voilà Petit Fleuve qui se jette dans la mer. Dans ce livre d'éveil pour les 0-3 ans, l'enfant découvre un autre sens de lecture : du haut vers le bas. Ainsi peut-il suivre le fleuve tout le long de sa descente, dans une adorable promenade au point de croix.",isbn:"9791023523201",extraUrl:"https://covers.openlibrary.org/b/isbn/9791023523201-M.jpg"},
  {t:"Les écrans, pas tout le temps !",a:"Gallissot Romain",y:"2026",ed:"Bayard éditions",cote:"A JAL",pub:"Jeunesse",sup:"Imprimé",d:"Un enfant face aux grands... et à leurs écrans ! Pendant que les adultes sont rivés sur leurs écrans, un petit bondit, rit, joue... et se demande pourquoi personne ne l'écoute vraiment. Dans cet album drôle et touchant, le quotidien numérique des parents est vu à hauteur d'enfant. Une situation familière, racontée avec malice, qui invite à réfléchir ensemble au bon usage des écrans à la maison. Un outil bienveillant pour mieux vivre avec les écrans Pensé pour les 3-6 ans, cet album tout-carton aborde un sujet d'actualité sans culpabiliser. Il encourage le dialogue entre adultes et enfants, en posant des mots simples sur ce que ressentent les plus petits. Issu du programme pédagogique Croc'écran, il offre des repères concrets pour instaurer de bonnes habitudes et retrouver des moments de qualité en famille, loin des écrans. Un duo complice pour parler d'enfance et de numérique Professeur des écoles, médiateur et auteur jeunesse, Romain Gallissot signe un album sensible et actuel sur la place des écrans dans le quotidien des enfants. Porté par l'univers graphique et chatoyant de Matthias Malingrey, Les écrans, pas tout le temps ! est un livre à découvrir en famille, pour apprendre à mieux vivre avec le numérique... tout en gardant les yeux grands ouverts sur le monde.",isbn:"9791036386084",extraUrl:"https://covers.openlibrary.org/b/isbn/9791036386084-M.jpg"},
  {t:"J'en fais toute une histoire",a:"Ephron Nora",y:"2026",ed:"Editions de l'Olivier",cote:"814.54 EPH",pub:"Adulte",sup:"Imprimé",d:"\"Ce que je regrette de ne pas avoir su : Bloquez tout le monde sur votre messagerie instantanée. Les quatre dernières années de psychanalyse sont une dépense inutile. L'avion ne va pas s'écraser. Tout ce qui vous déplaît dans votre corps à l'âge de trente-cinq ans, vous le regretterez à l'âge de quarante-cinq. Si la chaussure ne vous va pas dans le magasin de chaussures, elle ne vous ira jamais. Quand vos enfants sont adolescents, il est important d'avoir un chien pour que quelqu'un dans la maison soit content de vous voir.\" J'en fais toute une histoire peut se lire comme un manuel de survie dans le monde moderne ou un one-woman show sur la \"condition féminine\". Tout y passe : l'amour, le divorce, l'argent, les enfants, la chirurgie esthétique... Nora Ephron s'empare de chaque sujet avec ironie, sans jamais oublier d'être tendre.",isbn:"9782823624007",extraUrl:"https://covers.openlibrary.org/b/isbn/9782823624007-M.jpg"},
  {t:"La pensionnaire",a:"Fielding Joy",y:"2026",ed:"Michel Lafon",cote:"R FIE",pub:"Adulte",sup:"Imprimé",d:"Le nouveau thriller de Joy Fielding, après le succès de La Gouvernante vendu à plus de 40 000 exemplaires en France ! \" Ce thriller de Joy Fielding joue habilement avec la frontière entre folie, culpabilité et vérité jusqu'à la dernière page. \" Le Courrier Picard \"C'est un secret. Vous ne devez le dire à personne\". A la suite de la disparition de son mari, Linda Davidson rend visite à une amie installée à Legacy Place, une résidence pour personnes âgées. Elle y rencontre Jenny Cooper, une pensionnaire qui lui fait un aveu troublant : elle tue des gens. Dans un premier temps, Linda accorde peu de crédit à ces paroles. Mais la mort soudaine d'un autre résident éveille ses soupçons. Jenny Cooper est-elle une vieille dame sénile... ou une serial killer ? \" Un thriller puissant qui touche en plein coeur ! \" Oprah Winfrey",isbn:"9782749963860",extraUrl:"https://covers.openlibrary.org/b/isbn/9782749963860-M.jpg"},
  {t:"Ouvre cette porte !",a:"Robert Yannick",y:"2026",ed:"Albin Michel",cote:"A ROB",pub:"Jeunesse",sup:"Imprimé",d:"C'est toujours la même histoire avec le loup : c'est lui qui décide ! Pourtant, cette fois-ci, il a beau supplier, ruser, menacer... rien n'y fait. Mais qui peut bien se cacher derrière la porte ? !",isbn:"9782226503848",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226503848-475x500-1.jpg"},
  {t:"Robot sauvage sur l'île",a:"Brown Peter",y:"2025",ed:"Gallimard",cote:"C BRO",pub:"Jeunesse",sup:"Imprimé",d:"Plongez dans l'univers de Robot sauvage et partagez avec les petits ce sublime album qui met en images les aventures du roman à succès, adapté en film. Un jour, une mystérieuse créature échoue sur une île sauvage, au milieu de l'océan : Roz, qui va peu à peu apprendre à vivre dans la nature, au contact des animaux...",isbn:"9782075226349",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075226349-M.jpg"},
  {t:"Robot sauvage en mission",a:"Brown Peter",y:"2026",ed:"Gallimard",cote:"J BRO",pub:"Jeunesse",sup:"Imprimé",d:"Une merveilleuse aventure sur les traces d'un robot dont l'humanité n'est plus à prouver. De retour sur son ile, Roz retrouve enfin ses amis et son coin de paradis. Mais son bonheur est de courte durée : un courant toxique se dirige droit vers eux ! Immense, mystérieux et mortel, il menace tout sur son passage. Malgré le danger, Roz est bien décidée à l'arrêter. Elle doit sauver tous ceux qu'elle aime.",isbn:"9782075222051",extraUrl:"https://covers.openlibrary.org/b/isbn/9782075222051-M.jpg"},
  {t:"Les portes de Jurassia",a:"Paré-Sorel Julien",y:"2022",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeunesse",sup:"Imprimé",d:"Rex et Cory poursuivent leur chemin vers le volcan Kaliédos dans l'espoir de secourir Patchy et Gogo, toujours captifs de l'infâme général Ank. Traqués par Ovi la sorcière, ils devront traverser la mythique jungle de Troïka afin d'atteindre leur destination. Ils ne se doutent pas qu'une bouleversante révélation viendra sceller leur destin à tout jamais !",isbn:"9782897518721",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518721-475x500-1.jpg"},
  {t:"Il paraît que",a:"Tallec Olivier",y:"2026",ed:"L'École des loisirs",cote:"A TAL",pub:"Jeunesse",sup:"Imprimé",d:"J'ai avalé un pépin de pomme sans faire exprès... Il paraît que si on avale un pépin, on a un arbre qui pousse à l'intérieur. Si ça se trouve, les pommiers du vieux verger sont des gens qui ont avalé un pépin de pomme ! Günther m'a dit que si on avale un pépin de pomme rouge, on a un arbre rouge qui pousse dans le ventre. Non... ça ne peut pas vraiment arriver, hein ?",isbn:"9782211350983",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782211350983-475x500-1.jpg"},
  {t:"Les habitantes",a:"Peyrade Pauline",y:"2026",ed:"Les Editions de Minuit",cote:"R PEY",pub:"Adulte",sup:"Imprimé",d:"L'histoire se déroule entre la fin du printemps et celle de l'été, dans un hameau et ses alentours, au coeur de collines couvertes de forêts, de champs et de routes. Emily vit seule avec sa chienne Loyse dans la maison héritée de sa grand-mère. C'est là qu'elle a grandi, quand son père est parti fonder une nouvelle famille. Elle y mène une existence en marge, rythmée par les promenades rituelles, les baignades à l'étang, le travail chez Aude dans la ferme voisine. Un jour, des lettres arrivent, lui signifiant la mise en vente imminente de la maison. Pauline Peyrade est écrivaine. En 2023, elle publie L'Age de détruire, qui reçoit le prix Goncourt du premier roman. Dans Les Habitantes, chiennes, hirondelles, abeilles, héron, peuplier tremble, champs de chanvres, qu'ils agissent ou non sur les événements de l'histoire, occupent le même plan que les personnages et participent à leur quête.",isbn:"9782707357205",extraUrl:"https://covers.openlibrary.org/b/isbn/9782707357205-M.jpg"},
  {t:"Hue Cocotte !",a:"Collet Géraldine",y:"2026",ed:"Glénat Jeunesse",cote:"A COL",pub:"Jeunesse",sup:"Imprimé",d:"La vie te donne des ailes. Prends ton envol ! Au poulailler, Mariette est bouleversée. A quoi bon avoir des ailes si on ne peut pas voler ? Pourtant grâce à son amie Josette, Mariette va comprendre qu'avec un peu d'entrain et beaucoup de courage, même une poule peut décoller... et viser la Lune !",isbn:"9782344070178",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344070178-475x500-1.jpg"},
  {t:"L'autre moi",a:"Thilliez Franck",y:"2026",ed:"Fleuve Noir",cote:"R THI",pub:"Adulte",sup:"Imprimé",d:"Ici, le cauchemar commence. Longepin. Un endroit niché au coeur de la forêt de la Grande Chartreuse. Un site sur lequel militaires et civils travaillent à des projets classés secret-défense. Un cadre de vie d'exception, mais ultra-surveillé et régi par des règles étranges. Sibylle vient d'arriver avec son compagnon, Erwann. Docteur en neurosciences, celui-ci a vu la possibilité d'intégrer cette communauté comme la chance de sa carrière. Comme un espoir, aussi, que là-bas des confrères parviennent à aider celle qu'il aime. Car Sibylle, depuis l'accident qui a coûté la vie à son enfant et lui a valu une douloureuse reconstruction du visage, n'est plus la même. Elle souffre d'une amnésie post-traumatique et est sujette à des cauchemars aussi intenses que troublants, au point de ne plus toujours savoir distinguer le rêve de la réalité...",isbn:"9782265159075",extraUrl:"https://covers.openlibrary.org/b/isbn/9782265159075-M.jpg"},
  {t:"Spécimen",a:"Clavière Pauline",y:"2026",ed:"Grasset & Fasquelle",cote:"R CLA",pub:"Adulte",sup:"Imprimé",d:"\"Quel genre de jeune homme faut-il être pour écrire une chose pareille ? L'écriture est soignée, la calligraphie appliquée. Tout cela rend le texte plus dérangeant encore. Comme si l'auteur savait qu'il serait lu. Qu'il m'attendait.\" Une mère, la narratrice, dépose son jeune fils chez sa nourrice, Mina. Elle a ainsi du temps pour écrire. Mina vit seule et a aussi un enfant, Rafael, plus âgé. Il a disparu sans raison et a laissé un mystérieux carnet. En découvrant le contenu du carnet que lui a confié la nourrice, la narratrice est bouleversée. Il n'en fallait pas plus pour que la menace plane, qu'elle contamine tout. Les souvenirs refont surface. Qu'est devenue son amie d'enfance disparue vingt-cinq ans auparavant ? Des questions restées sans réponses reviennent la hanter. Passé et présent se confondent et le lecteur découvre peu à peu l'histoire de Rafaël. S'il est un spécimen, unique, ou s'il est à l'image de son espèce, qui sera en mesure de l'affronter ? Pauline Claviere nous offre un roman diabolique, travaillé par le grand sujet de notre époque : jusqu'où irions-nous pour protéger nos enfants, et de qui ? Son intrigue implacable nous conduit dans un Marseille intime et inquiétant où toute la société se désaxe. Entre nos mains, le roman d'une enquêtrice au-dessus de tout soupçon... Vous ne dormirez plus avant de savoir qui est vraiment \" le spécimen \" . Ce texte impossible à lâcher est en cours d'adaptation par RT Features, société de production du brésilien Rodrigo Teixeira, notamment producteur de \" Call me by you name \" (2017) et\" Je suis toujours là \" (Oscar du meilleur film 2025). \" Il y a des romans qu'on lit et d'autres, comme celui-ci, qu'on dévore. Rarement, la fin d'un roman, m'aura à ce point surpris, et donné l'envie immédiate de le relire. \" (Maxime Chattam).",isbn:"9782246846109",extraUrl:"https://covers.openlibrary.org/b/isbn/9782246846109-M.jpg"},
  {t:"Le gardien de la forêt",a:"Di Gregorio Giovanni",y:"2025",ed:"Dupuis",cote:"BDJ DIG",pub:"Jeunesse",sup:"Imprimé",d:"Quelque chose se cache au fond des bois. Quelque chose qui dort sous les feuilles sèches, enveloppé par les murmures du vent... et que les Grémillet s'apprêtent à réveiller, alors qu'elles découvrent la gare désaffectée où leur mère passait ses étés lorsqu'elle était jeune. Entre légendes anciennes, amours oubliées et un mystérieux enfant sans nom, les trois soeurs devront résoudre une énigme resurgie des brumes du passé. Mais cette fois, elles ne seront pas seules, le gardien de la forêt surveille chacun de leurs pas. Est-il hostile ou bienveillant ? Va-t-il les empêcher de mener leur enquête ? Mais la véritable épreuve qui les attend sera d'une toute autre nature...",isbn:"9782808510462",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782808510462-475x500-1.jpg"},
  {t:"Maman (Oie)  Ours n'aime pas l'hive",a:"Higgins Ryan T.",y:"2026",ed:"Albin Michel",cote:"A HIG",pub:"Jeunesse",sup:"Imprimé",d:"Les souris sont prêtes pour leurs activités hivernales préférées : ski, luge, patinage et fabrication de bonshommes de neige. Malheureusement, Michel a un rhume et sa famille ne veut pas le laisser tout à seul à la maison. Si Michel ne peut pas jouer dans la neige, alors celle-ci viendra à lui... et les bêtises des souris, aussi !",isbn:"9782226507969",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226507969-475x500-1.jpg"},
  {t:"Miguel",a:"Sobral Patrick",y:"",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001959",extraUrl:"https://catalogue.bnf.fr/couverture?appName=NE&idImage=355910&couverture=1"},
  {t:"J'écrirai votre histoire",a:"Léost Claire",y:"2026",ed:"Jean-Claude Lattès",cote:"R LEO",pub:"Adulte",sup:"Imprimé",d:"Olga n'est pas médecin, mais elle réanime les patients. C'est ainsi qu'on a présenté la biographe hospitalière au Dr Frédéric Grangier de l'hôpital de Fontainebleau. Elle n'ajoute pas des jours à la vie mais de la vie aux jours en permettant aux malades d'écrire le livre de leur vie, qui sera remis à leurs proches. Elle recueille alors les souvenirs de Jeanne, cette dame qui chante et danse pieds nus, les mots de Thomas, père taiseux d'une petite fille, ou encore ceux de Manon, six ans, la plus jeune des patientes de Frédéric. D'abord sceptique, le médecin constate bientôt les miracles accomplis par Olga. Mais pourquoi a-t-elle tout quitté pour rejoindre ce service, à la poursuite de quelle vérité ? Croisant les destins d'Olga, de Frédéric et de ses patients, et celui de Linh, la jeune directrice de l'hôpital, Claire Leost éclaire avec une infinie délicatesse un métier inconnu, d'une humanité folle, et déploie son talent de conteuse, rendant un hommage vibrant au pouvoir des mots.",isbn:"9782709676458",extraUrl:"https://covers.openlibrary.org/b/isbn/9782709676458-M.jpg"},
  {t:"A not so innocent deal",a:"Messina Lynn",y:"2025",ed:"Fleurus",cote:"J MES",pub:"Adolescent",sup:"Imprimé",d:"A vingt-et-un ans, Catherine Fellingham découvre que sa famille risque la faillite et le scandale : pour régler les dettes de son époux, Lady Fellingham s'est enlisée dans une affaire de pots-de-vin. Catherine supplie la complice de sa mère, Lady Courtland, de mettre fin à ces manigances... mais, en contrepartie, elle doit accepter un arrangement : se livrer à une autre saison pour trouver un mari. Après trois années sans que le moindre prétendant s'intéresse à elle, Catherine accepte à contrecoeur. Lorsqu'elle découvre que le célèbre Lord Deverill a été chargé de feindre un intérêt pour elle pour que d'autres la remarquent... et qu'il juge cette mission impossible, Catherine décide que c'en est trop. Humiliée, elle compte rendre au marquis la monnaie de sa pièce et le prendre à son propre jeu. A moins, bien sûr, que son coeur n'en fasse qu'à sa tête...",isbn:"9782215199908",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215199908-475x500-1.jpg"},
  {t:"Silence of the lamps",a:"Midam",y:"2022",ed:"Dupuis",cote:"BDJ MID",pub:"Jeunesse",sup:"Imprimé",d:"De nouvelles aventures de Kid Paddle, qui, cette fois, apprend à capturer un Blork, à utiliser un Copy 2000 ou encore à comprendre où atterrit l'argent glissé dans la fente d'une caisse automatique. ©Electre 2022",isbn:"9791034763122",extraUrl:"https://products-images.di-static.com/image/base/9791034763122-475x500-1.jpg"},
  {t:"L'île aux crabes",a:"Vermot Thibault",y:"2024",ed:"Éditions Sarbacane",cote:"J VER",pub:"Jeunesse",sup:"Imprimé",d:"Depuis le casse du siècle avec deux rônins pas bien méchants, Yanagi (le grand maigre) et Takata (le petit gros), Kyoko, 9 ans, court la campagne médiévale en quête d'aventures. Leur magot sur le dos, le trio s'arrête un soir, pour se restaurer, mais l'aubergiste leur apprend que tous les crabes ont disparu sur une île mystérieuse. En échange de quelques kobans, et la promesse de riz au crabe, le trio se lance alors à la pêche aux crustacés. Or, à leur arrivée sur l'île, ils découvrent que l'aubergiste les a bernés et leur a volé leur magot. Pire ! Les crabes, oui les crabes ! sont gigantesques et les pourchassent. Ils se réfugient alors dans la forêt, mais ils ne sont pas au bout de leur surprise ! Des fantômes de naufragés les attendent, tapis dans l'obscurité d'une grotte...",isbn:"9791040806394",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040806394-475x500-1.jpg"},
  {t:"Esprits rebelles",a:"Sobral Patrick",y:"2026",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"La série Les Légendaires - Origines est de retour ! Apparu en 2012, ce tout premier spin-off est le second plus gros succès commercial de la série et narre le passé de nos héros avant qu'ils ne deviennent Les Légendaires. Les Légendaires croisent Samaël, toujours à la recherche de Shimy, en compagnie de Regen. Les retrouvailles inattendues avec Gryf ne vont pas sans leur lot de tensions, malgré leur but commun : retrouver Darkhell et le mettre hors de nuire. Pendant ce temps, Shimy, prisonnière du Sorcier Noir, parvient à s'enfuir alors que Ténébris doit faire face aux tourments de son passé.",isbn:"9782413093459",extraUrl:"https://covers.openlibrary.org/b/isbn/9782413093459-M.jpg"},
  {t:"Le Grozours arrive !",a:"Allepuz Anuska",y:"2026",ed:"Albin Michel",cote:"A ALL",pub:"Jeunesse",sup:"Imprimé",d:"Au coeur de la forêt vivent quatre oursons tout fous et tout mignons. Alors qu'ils se préparent à aller se coucher, ils entendent un bruit. Ils tendent l'oreille, lèvent la truffe et ouvrent grand les yeux... Qui va là ? C'EST LE GROZOURS !",isbn:"9782226507105",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226507105-475x500-1.jpg"},
  {t:"Le cauchemar du Loch Leathan",a:"Lieron Cyril",y:"2025",ed:"Ankama Éditions",cote:"BD LIE",pub:"Adulte",sup:"Imprimé",d:"Une lettre insensée attise la curiosité de Sherlock Holmes et entraîne son départ jusqu'au fin fond de l'Ecosse. Le détective et son fidèle ami, le Dr Watson, vont se heurter à un village pétri de méfiance où semble rôder une créature cauchemardesque. Réfutant le mysticisme, le duo de détectives est bien décidé à découvrir ce que cache réellement \"la malédiction du Kelpie\" ! Quels sombres secrets se cachent dans les brumes du Loch Leathan ?",isbn:"9791033518044",extraUrl:"https://covers.openlibrary.org/b/isbn/9791033518044-M.jpg"},
  {t:"Bande de compotes !",a:"Mr Tan",y:"2025",ed:"Mr Tan & Co",cote:"BDJ TAN",pub:"Jeunesse",sup:"Imprimé",d:"Mortelle Adèle revient dans un 22e tome de gags, publié chez Mr Tan & Co ! \" Dans la vie, c'est simple, y a deux catégories de gens : les potes, et les compotes ! Laisse-moi t'expliquer comment faire le tri. Tu peux me faire confiance, la vérité sort de la bouche des... BIZARRES ! \" Mortelle Adèle n'aime pas les nazebroques, et encore moins les flagadas du cerveau ! Avec sa nouvelle catapulte, la voilà bien décidée à envoyer sur la lune le premier qui viendra lui casser les pieds ! Alors gare à vous... BANDE DE COMPOTES ! © Mr Tan et Diane Le Feyer d'après l'oeuvre créée par Mr Tan et Miss Prickly © Mr Tan & Co",isbn:"9782494678378",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782494678378-475x500-1.jpg"},
  {t:"Kilomètre zéro",a:"Ankaoua Maud",y:"2017",ed:"Eyrolles",cote:"R ANK",pub:"Adulte",sup:"Imprimé",d:"Et vous, jusqu'où irez-vous pour sauver une amie ? Maëlle, directrice financière d'une start-up en pleine expansion, vit le rythme effréné de ses journées ; sa vie se résume au travail, au luxe et à sa salle de sport. Ses rêves... quels rêves ? Cette vie bien rodée ne lui en laisse pas la place ; jusqu'au jour où sa meilleures amie, Romane, lui demande un immense service. Question de vie ou de mort. Maëlle sceptique, accepte la mission malgré elle. Elle rejoint le Népal, où l'ascension des Annapurnas sera un véritable parcours initiatique. Quand la jeune femme prend conscience que la réalité n'est peut-être pas celle que l'on a toujours voulu lui faire croire... c'est sa propre quête qui commence. C'est au cours d'expériences et de rencontres bouleversantes que Maëlle va apprendre les secrets du bonheur profond et transformer sa vie. Mais réussira-t-elle à sauver son amie ? \" Vous devez trouver à l'intérieur de vous-même l'endroit où rien n'est impossible\" Deepak Chopra Passionnée par les relations humaines, Maud Ankaoua signe un premier roman riche d'enseignements et rempli d'espoir. Il changera pour toujours notre compréhension des autres et nous rappelle l'essentiel de la vie.",isbn:"9782212567434",extraUrl:"https://covers.openlibrary.org/b/isbn/9782212567434-M.jpg"},
  {t:"La bataille du néant",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"Un mystérieux phénomène, le \"Néant\", menace le monde elfique. Shimy doit aider les elfes à sauver Astria grâce à ses pouvoirs élémentaires naissants. Mais des survivants Galinas n'apprécient pas ce renfort, tout comme ils ne souhaitent pas la disparition de ce très mystérieux \"Néant\". Quel noir secret ce dernier renferme-t-il ? Un nouvel épisode bourré d'adrénaline pour nos amis les Légendaires.",isbn:"9782756064772",extraUrl:"https://images.epagine.fr/772/9782756064772_1_m.jpg"},
  {t:"Ruptures",a:"Minier Bernard",y:"2026",ed:"XO Editions",cote:"R MIN",pub:"Adulte",sup:"Imprimé",d:"Lucia Guerrero face aux nouveaux maîtres du monde. Lundi 28 avril 2025. L'Espagne est paralysée par la plus grande panne électrique de son histoire. Directrice de la filiale espagnole de StarCo, Emma Bosch se précipite au chevet de son père, dont la vie dépend d'un respirateur artificiel. Elle n'arrivera jamais. Aux Etats-Unis, les corps sans vie de plusieurs collaboratrices du célèbre milliardaire Milton Gail, le fantasque et génial fondateur de StarCo, sont retrouvés. Toutes étaient enceintes. C'est le début de l'extraordinaire enquête que va mener Lucia Guerrero des deux côtés de l'Atlantique et dans les fabriques ultra-secrètes où s'inventent le présent et le futur de milliards d'individus. Jusqu'à un face-à-face inoubliable avec celui qui a fait main basse sur la terre et sur l'espace. Une plongée glaçante dans la toute-puissance de l'Amérique de Donald Trump.",isbn:"9782374489513",extraUrl:"https://covers.openlibrary.org/b/isbn/9782374489513-M.jpg"},
  {t:"La fin de l'histoire ?",a:"Sobral Patrick",y:"2015",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"C'est l'énigmatique Kalandre qui, depuis le début de la série, provoque et manipule le destin de nos Légendaires. Ce tome 18 sera un épisode éprouvant, dramatique, qui verra les Légendaires malmenés dans leurs corps et dans leurs cœurs comme jamais ils ne l'ont été. Le final sera apocalyptique et meurtrier mais, tel le phénix, ce sera pour mieux faire renaître la série ensuite.",isbn:"9782756053578",extraUrl:"https://www.bedetheque.com/cache/thb_couv/Couv_256882.jpg"},
  {t:"Le temps suspendu",a:"Bocquet Olivier",y:"2024",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeunesse",sup:"Imprimé",d:"Ziad et Louna ont réussi tous les deux à se faire inviter aux Golden Powers, la soirée des récompenses pour superhéros. Mais la cérémonie ne se déroule pas tout à fait comme prévu : un pod de téléportation apparaît sur scène et des yeux géants en jaillissent et commencent à tirer dans la foule. C'est un vrai carnage parmi les superhéros présents. Ziad et Louna arrivent à fuir par le pod et se retrouvent en plein océan. Et Louna se noie... Fatiah et Amine, les parents de Ziad et Louna qui ont assisté, impuissants et tétanisés, à la retransmission télévisée du chaos et de l'horreur, sont interrogés par la police qui soupçonne leurs deux enfants d'êtres des \" supers \" ! Amine et Fatiah décident de prendre les choses en mains et s'incrustent dans l'enquête de police au grand dam de l'inspectrice qui la dirige. Dans Le Métier le plus dangereux du monde, Olivier Bocquet et Fabio Lai nous présentent une société légèrement futuriste où même les superhéros sont pervertis par l'argent et les réseaux sociaux. Ca n'empêche pas la série d'être passionnante, trépidante, émouvante et drôle. De la BD jubilatoire !",isbn:"9791034768578",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791034768578-475x500-1.jpg"},
  {t:"D'autres printemps",a:"Grimaldi Virginie",y:"2026",ed:"Flammarion",cote:"R GRI",pub:"Adulte",sup:"Imprimé",d:"Flora vient de voir son plus grand rêve s'effondrer. Pourtant, quand on l'appelle au chevet de sa grand-mère, elle envoie tout valser pour la retrouver. A son arrivée, Line, quatre-vingt-dix printemps, a une requête des plus surprenantes : Flora doit l'arracher à l'hôpital pour la conduire dans un petit village de Toscane. Pourquoi là-bas ? Personne ne lui connaît d'attaches en Italie. Flora hésite, mais Line insiste : c'est sa dernière volonté. Alors, au matin, elles fuguent. Embarquée dans un road trip insolite, Flora ignore la vraie raison de ce voyage et l'ampleur du secret qu'elle s'apprête à découvrir. L'une roule vers son passé, l'autre vers son avenir : grand-mère et petite-fille ont des choses à se dire. Elles n'imaginent rien de ce qui les attend au bout du chemin, là où l'histoire a commencé.",isbn:"9782080510655",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080510655-M.jpg"},
  {t:"Les orphelins",a:"Vuillard Éric",y:"2026",ed:"Actes Sud",cote:"R VUI",pub:"Adulte",sup:"Imprimé",d:"Soudain, le vide se fit en lui. Son petit corps se contracta tout entier, il trembla ; et, à cette minute, il sut qu'il serait toujours seul. Une terrible angoisse lui remonta par le bas du ventre. Il aperçut à contre-jour la gueule de Cahill, la mort lui parut proche, toute proche ! Sur sa joue, il sentit le soleil, son harmonie mortelle, sa beauté. Il eut envie de pleurer. Alors, les visages des soldats, des garçons vachers qui faisaient cercle autour de lui, s'évaporèrent dans le néant. Sa main se faufila jusqu'à l'arme, et il tira.",isbn:"9782330217556",extraUrl:"https://covers.openlibrary.org/b/isbn/9782330217556-M.jpg"},
  {t:"Hercule Poirot",a:"Eckartsberg Benjamin von",y:"2017",ed:"Paquet",cote:"BD ECK",pub:"Adulte",sup:"Imprimé",d:"Hercule Poirot est à Istanbul où il compte faire un peu de tourisme. Mais un télégramme lui demande de rentrer de toute urgence. Il doit prendre alors un billet pour l'Orient-Express en direction de Londres. Il reconnaît son ami M. Bouc, directeur de la ligne, qui va aussi en direction de Londres. Dans le train, M. Ratchett, un riche Américain, est tué au milieu de la nuit. Examinant le corps avec l'aide du docteur Constantine, il constate qu'il a été tué de douze coups de couteau. Poirot, en collaboration avec M. Bouc et le docteur Constantine, interroge les passagers du train et découvre un grand nombre d'informations complémentaires. Mais le mystère s'épaissit, tout comme la neige autour du train immobilisé au milieu de nulle part.",isbn:"9782888908760",extraUrl:"https://covers.openlibrary.org/b/isbn/9782888908760-M.jpg"},
  {t:"Les Ouröbörös",a:"Duval Fred",y:"2023",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"Lisä et des officiers de Renaissance observent, à partir d'une base lunaire, un vaisseau du monde Ouröbörös qui stationne dans l'espace à proximité de Mars. Une véritable menace pour le système solaire et, donc, la planète Terre ! ... Ce nouvel album de Renaissance ponctue la série de très belle manière, une série devenue une véritable référence pour les lecteurs de bande dessinée amateurs du genre.",isbn:"9782205207903",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205207903-M.jpg"},
  {t:"Les Hybrides",a:"Duval Fred",y:"2022",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"Sätie et Swänn, originaires de la planète NäKän, vivent sur Terre depuis vingt ans. Ils appartiennent au personnel médical et militaire de Renaissance, l'expédition financée par le Complexe, une fédération de civilisations extraterrestres venue organiser le sauvetage écologique de la Terre. Une partie des humains vit désormais en harmonie avec ses hôtes, mais Renaissance doit aussi faire face à une opposition armée et radicalisée, prête à tout pour que le Complexe se retire du Système solaire.",isbn:"9782205203189",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205203189-M.jpg"},
  {t:"Interzone",a:"Duval Fred",y:"2019",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"2084, les pires scénarios prédisant la funeste destinée de la Terre se sont réalisés. La Fédération des Intelligences Mammifères décide d'engager une intervention sur cette planète en voie d'extinction. Swänn, jeune extraterrestre droit et ouvert, se porte volontaire. Originaire d'une planète apparaissant comme une version réussie de notre monde, il souhaite contribuer à pacifier la Terre et empêcher son anéantissement. Sa rencontre avec Liz, au Texas, marque le début du choc des deux mondes. La suite spectaculaire de cette odyssée...",isbn:"9782205078633",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205078633-M.jpg"},
  {t:"Les déracinés",a:"Duval Fred",y:"2018",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"084, les pires scénarios prédisant la funeste destinée de la Terre se sont réalisés. La Fédération des Intelligences Mammifères décide d'engager une intervention sur cette planète en voie d'extinction. Swänn, jeune extraterrestre droit et ouvert, se porte volontaire. Originaire d'une planète apparaissant comme une version réussie de notre monde, il souhaite contribuer à pacifier la Terre et empêcher son anéantissement. Sa rencontre avec Liz, au Texas, marque le début du choc des deux mondes...",isbn:"9782205078022",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205078022-M.jpg"},
  {t:"Permafrost",a:"Duval Fred",y:"2020",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"La suite des aventures de Swänn et de Säti, un jeune couple d'extraterrestres envoyés sur la Terre pour la sauver de l'extinction. ©Electre 2020",isbn:"9782205085082",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205085082-M.jpg"},
  {t:"Sui Juris",a:"Duval Fred",y:"2021",ed:"Dargaud",cote:"BD DUV",pub:"Adulte",sup:"Imprimé",d:"Sätie et Swänn, originaires de la planète NäKän, vivent sur Terre depuis vingt ans. Ils appartiennent au personnel médical et militaire de Renaissance, l'expédition financée par le Complexe, une fédération de civilisations extraterrestres venue organiser le sauvetage écologique de la Terre. Une partie des humains vit désormais en harmonie avec ses hôtes, mais Renaissance doit aussi faire face à une opposition armée et radicalisée, prête à tout pour que le Complexe se retire du système solaire.",isbn:"9782205089103",extraUrl:"https://covers.openlibrary.org/b/isbn/9782205089103-M.jpg"},
  {t:"Les âmes folles",a:"Dalban-Moreynas Géraldine",y:"2026",ed:"Flammarion",cote:"R DAL",pub:"Adulte",sup:"Imprimé",d:"\"Elle le voit tout de suite en descendant les marches en pierre du perron de l'hôtel. Elle ne peut pas ne pas le voir, on ne voit que lui. Ils sont pourtant une dizaine assis autour de la table, mais on ne voit que lui. Il se retourne, comme s'il avait senti son regard, sourit. Bonjour, vous vous asseyez avec nous ? Sans très bien savoir pourquoi, elle répond oui\". Où s'arrête l'amour ? Où commence l'emprise ?",isbn:"9782080511072",extraUrl:"https://covers.openlibrary.org/b/isbn/9782080511072-M.jpg"},
  {t:"Hermès conditionné",a:"Cazenove Christophe",y:"2021",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeunesse",sup:"Imprimé",d:"La mythologie grecque revisitée avec un humour légendaire. Le pauvre Hermès ne s'en sort plus... En plus d'être le messager personnel de Zeus, il doit s'occuper des carrefours, des voyageurs, des voleurs, du commerce... et devinez qui doit conduire les morts aux Enfers ? Hermès, bien sûr ! Bref, même si ses sandales ailées lui permettent de courir plus vite qu'un éternuement de foudre, il aurait bien besoin d'un coup de main de nos Petits Mythos. Le hic, c'est que ceux-ci sont déjà bien occupés à libérer Io, leur copine changée en vache et surveillée par le terrible Argos, le gardien aux 100 yeux ! Qui a dit que Petit Mythos était un métier de tout repos ?",isbn:"9782818977163",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818977163-475x500-1.jpg"},
  {t:"Le coup de la cacahuète",a:"Manceau Édouard",y:"2026",ed:"Sens dessus dessous",cote:"A MAN",pub:"Jeunesse",sup:"Imprimé",d:"Pour transformer une grosses cacahuète, il faut être malin et faire preuve de beaucoup d'imagination...",isbn:"9782385071202",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782385071202-475x500-1.jpg"},
  {t:"La dernière chasse",a:"Franquin André",y:"2026",ed:"Dupuis",cote:"BDJ CED",pub:"Jeunesse",sup:"Imprimé",d:"Ils sont cinq. Les cinq meilleurs chasseurs du monde, envoyés en Palombie par un mystérieux commanditaire avec un objectif : capturer un marsupilami ! Backalive, l'ennemi habituel du Marsu, cette fois accompagné de la terrible Estefania Forbalez, du débonnaire Léon de Bourgogne, du cruel Parhavi et de la jeune Violette Delacourt flanquée de ses drones, va-t-il parvenir à ses fins ? Les chances du Marsu semblent minces, tant ses ennemis sont déterminés et bardés de techniques de chasse imparables. D'autant plus qu'ils sont accompagnés par Tatou, un jeune guide chahuta spécialiste de la jungle et acquis à leur cause (ou pas...). Toujours sous les crayons du légendaire Batem, le Marsupilami revient avec un scénario signé Kid Toussaint (Animal Jack, Magic 7, Elles) accompagné de Ced, le sniper du gag. Un mélange parfait de grande aventure, de frisson, de vertige graphique et d'humour !",isbn:"9791034770830",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9791034770830-475x500-1.jpg"},
  {t:"Eclair de génie",a:"Zidrou",y:"2025",ed:"Le Lombard",cote:"BDJ ZID",pub:"Jeunesse",sup:"Imprimé",d:"Léonard voit les choses en grand, très grand ! son dernier projet ? Fonder la Siliconval(i) du Moyen Age et révolutionner les télécoms avec sa société Génie.com. Crypto-monnaie, panneaux solaires et OGM s'invitent à la ferme, avec le génie farfelu du Maître et la maladresse légendaire du disciple. Un concentré d'humour absurde et d'inventions (presque) révolutionnaires, signé par la série culte qui défie la logique depuis 56 tomes.",isbn:"9782808212465",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808212465-475x500-1.jpg"},
  {t:"Gribouillis & Kraboutchat",a:"Bailly Pierre",y:"2025",ed:"Dupuis",cote:"BDJ BAI",pub:"Jeunesse",sup:"Imprimé",d:"Il est petit. Il est poilu. C'est Petit Poilu ! Le v'là parti de bon matin. Le vie parti et tout va bien. Mais ? ... Que se passe-t-il ? Ca se bouscule. Et tout bascule ! Un crayon à tailler. Des copeaux de toutes les couleurs. Des noeuds, des boucles et des entrelacs. Deux compères complètement fadas. Des folies, des pitreries, des dingueries... Vas-y, Petit Poilu, fonce ! Petit débrouillard de la vie ! Petit Poilu est un petit bonhomme curieux, optimiste et courageux qui plonge malgré lui dans des aventures extraordinaires dont il ressort toujours grande. Petit Poilu tord le cou aux idées reçues et apprend la vie en s'initiant aux relations humaines. Viens grandir avec lui !",isbn:"9782808510127",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808510127-475x500-1.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2026",ed:"Pika édition",cote:"BD BLU",pub:"Jeunesse",sup:"Imprimé",d:"La rencontre explosive du football et du \"baffle royale\". Le match est relancé par le but égalisateur phénoménal de Rin Itoshi ! Portée par une série de changements fulgurants, la tension atteint son paroxysme sur le terrain. Sous l'effet de cette effervescence, Loki, encore resté sur le banc jusqu'ici, et Noa annoncent brusquement leur entrée en jeu ! Au coeur du tumulte, Isagi plonge dans une analyse acharnée, à la recherche d'une stratégie décisive... Le dénouement approche, et cette ultime bataille s'apprête à déclencher une onde de choc capable de bouleverser le monde !",isbn:"9791043306068",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043306068-M.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2026",ed:"Pika édition",cote:"BD BLU",pub:"Jeunesse",sup:"Imprimé",d:"Pour s'emparer du dernier but, Isagi et Kaiser unissent leurs forces, rallumant l'envie de vaincre dans tout le club allemand ! La formation française, loin de se laisser abattre, resserre également ses rangs et rend coup pour coup, transformant l'affrontement en un duel d'une intensité sans précédent ! Au coeur de cette arène en ébullition, Ness, laissé un peu de côté, cherche désespérément à retrouver Kaiser et à découvrir la voie de sa propre renaissance. Dans ce brasier où s'enchaînent les rebondissements imprévisibles, quelle équipe finira par obtenir la victoire absolue ? ! Soyez témoins du dénouement le plus imprévisible de l'histoire !",isbn:"9791043306471",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043306471-M.jpg"},
  {t:"L'escadron ravage",a:"Sobral Patrick",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeunesse",sup:"Imprimé",d:"La base d'Ultima est prise d'assaut par l'Escadron Ravage mené par Kalypso et son frère Kénian. Aidés des Magicors de Dame Kalandre, ils semblent inarrêtables... A mille lieux de là, de retour du Nirvanis, Galen et ses compagnons sont loin de se douter du drame qui se joue et des pertes subies dans leurs rangs. Le destin d'Alysia semble se jouer dans ce terrible affrontement.",isbn:"9782413087847",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782413087847-475x500-1.jpg"},
  {t:"Crète party",a:"Cazenove Christophe",y:"2020",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeunesse",sup:"Imprimé",d:"La mythologie grecque revisitée par un humour légendaire ! Mais où donc habite Poséidon ? Et pourquoi n'en sait-on pas plus sur ses enfants, Triton et Rhodé ? Et si on en profitait pour expliquer pourquoi c'est à cause du dieu de la mer qu'est né le Minotaure ? Et le Minotaure, pourquoi est-il obligé de vivre dans un labyrinthe construit par un certain Dédale sur ordre du roi Minos ? Les questions sont nombreuses, espérons que nos petits Mythos sauront apporter plus de réponses que de catastrophes !",isbn:"9782818976746",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818976746-475x500-1.jpg"},
  {t:"La Terre déchirée",a:"Hicks Faith Erin",y:"2019",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeunesse",sup:"Imprimé",d:"La tribu Dao va s'allier aux Yisun pour mener une offensive contre le général Erzi et ses troupes qui font régner la terreur. Rat et Kai veulent voler le livre de Napatha contenant la formule de destruction massive, avant que l'habile Mura ne la revende aux nations pour entretenir les guerres. ©Electre 2019",isbn:"9782369813767",extraUrl:"https://products-images.di-static.com/image/base/9782369813767-475x500-1.jpg"},
  {t:"Que la mort nous frôle",a:"Bussi Michel",y:"2026",ed:"Presses de la Cité",cote:"R BUS",pub:"Adulte",sup:"Imprimé",d:"Avec Que la mort nous frôle, Michel Bussi revient à l'essence de son art : un suspense psychologique haletant, un huis clos oppressant et une intrigue savamment orchestrée, où rien n'est jamais ce qu'il paraît être. Quand on frôle la mort, ce n'est pas son passé que l'on voit défiler. Ce sont les rêves que l'on ne pourra pas réaliser. Près de Lausanne, Jeanne, jeune psychiatre spécialisée dans les traumatismes, rejoint le manoir des Amarantes, qui, depuis 1945, abrite des pensionnaires brisés par la guerre. Parmi eux, Charly, adolescent imprévisible et paranoïaque, et Téréza, orpheline du ghetto de Varsovie, ont noué un lien très fort. Mais ces dernières semaines, des événements inquiétants secouent les lieux : des pensionnaires disparaissent, de mort naturelle prétend-on ; des statues changent de place ; le docteur Gruber, directeur de l'établissement, mène des expériences mystérieuses. Tandis que les ombres et les non-dits pèsent sur ce manoir hors du temps, le danger est partout. Derrière un décor faussement paisible, entre les rives du Léman et les sommets alpins, le passé peut-il encore tuer ? Avec Que la mort nous frôle, Michel Bussi signe un suspense psychologique haletant, où chaque révélation renverse tout ce que l'on croyait savoir, jusqu'au twist final. Maître dans l'illusion et l'art de la manipulation, Michel Bussi est l'un des auteurs préférés des Français, et le plus adapté à la télévision et en bandes dessinées.",isbn:"9782258214460",extraUrl:"https://covers.openlibrary.org/b/isbn/9782258214460-M.jpg"},
  {t:"La promesse de Tyratops",a:"Paré-Sorel Julien",y:"2025",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeunesse",sup:"Imprimé",d:"L'heure est grave. Alors que Patchy est toujours sous l'emprise d'Ovi la sorcière et que la menace du retour des Titans se fait sentir, Rex s'est fait capturer par les sbires de Tyratops ! Il tentera d'infiltrer le repaire du sorcier maléfique afin de l'arrêter. Pendant ce temps, d'anciens alliés uniront leurs forces pour sauver les enfants du royaume de Mézoïk. Cependant, Tyratops a plus d'un tour dans son sac et sa patience tire à sa fin... Rex sera-t-il assez fort pour affronter les démons du passé ?",isbn:"9782897518806",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518806-475x500-1.jpg"},
  {t:"Une part de tarte sauce trahison",a:"Moulin Aurélie C.",y:"2026",ed:"Nathan",cote:"J MOU",pub:"Jeunesse",sup:"Imprimé",d:"Mystère, humour et brioches à gogo ! Une nouvelle enquête savoureuse dans l'univers irrésistible de Wilhelmina Picpus. Bienvenue à l'Académie Wilford, où les secrets se cachent derrière chaque brioche ! Et ne faites confiance à personne... Jour de rentrée à l'austère Académie Wilford ! Wilhelmina Picpus - élève indisciplinée le jour, enquêtrice en herbe la nuit (et pas seulement...) - est ravie. Elle commençait à s'ennuyer et elle sait que les distractions ne manqueront pas dans cet étonnant pensionnat. Au programme : un concours inter-académies, des manigances, des secrets inavouables, un mariage interdit... le tout saupoudré de sucre vanillé, bien entendu ! Un roman cosy mystery drôle et rythmé qui mêle enquête, humour et gourmandises",isbn:"9782095059620",extraUrl:"https://products-images.di-static.com/image/base/9782095059620-475x500-1.jpg"},
  {t:"Départ(s)",a:"Barnes Julian",y:"2026",ed:"Stock",cote:"R BAR",pub:"Adulte",sup:"Imprimé",d:"Le narrateur, un dénommé Julian, nous prévient dès les premières pages : il y aura bien une histoire dans ce livre. Une histoire d'amour, celle de deux amis d'université qui se sont aimés puis séparés dans les années 1960. Quarante ans plus tard, Julian tente à nouveau de les réunir. Départ(s), c'est aussi une réflexion sur la nature malicieuse de la mémoire, le temps qui passe, la place du bonheur dans nos vies et quand vient le temps de dire au revoir. Julian Barnes, l'un de nos plus grands romanciers contemporains, signe un roman perçant sur le lien entre fiction et réalité, entre chance et destin. Traduit de l'anglais par Jean-Pierre Aoustin",isbn:"9782234099210",extraUrl:"https://covers.openlibrary.org/b/isbn/9782234099210-M.jpg"},
  {t:"La vision de Patchy",a:"Paré-Sorel Julien",y:"2024",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeunesse",sup:"Imprimé",d:"Désormais au fait de la machination maléfique de Tyratops, Rex est plus déterminé que jamais à mettre fin à son règne ! Or, le cruel empereur met tout en oeuvre pour le capturer et ses forces du mal gagnent en puissance de jour en jour. Même Patchy, maintenant sous l'emprise de la sorcière Ovi, est devenue une redoutable rivale ! Jusqu'où Rex et ses amis sont-ils prêts à aller afin de percer les sombres mystères du grand royaume de Mézoïk ?",isbn:"9782897518769",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518769-475x500-1.jpg"},
  {t:"Les belles photos de famille",a:"Lee Siwon",y:"2026",ed:"Gautier-Languereau",cote:"A LEE",pub:"Jeunesse",sup:"Imprimé",d:"Dans le village de la forêt, chez Hibou et Ours, les photographes, tous les animaux défilent pour poser en famille. Mais panda, lui, est tout seul : avec qui va-t-il poser ?",isbn:"9782017371007",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782017371007-475x500-1.jpg"},
  {t:"Carnet de potes",a:"Erroc",y:"2025",ed:"Bamboo Edition",cote:"BDJ ERR",pub:"Jeunesse",sup:"Imprimé",d:"Plus forts que Zorro, plus courageux qu'Indiana Jones et bien moins payés que James Bond, ces enseignants de choc n'hésitent pas à braver quotidiennement la jungle étouffante des lycées peuplés de tribus d'élèves hostiles. Suivez le prof adepte de Napoléon, le prof de gym survitaminé, le prof de français sexy, le prof de philo blasé et la prof d'anglais peau de vache dans leur croisade contre l'ignorance et le poil dans la main !",isbn:"9791041112173",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791041112173-475x500-1.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2025",ed:"Pika édition",cote:"BD BLU",pub:"Jeunesse",sup:"Imprimé",d:"Grâce à sa nouvelle arme d'étonante, Isagi permet au club allemand d'égaliser ! Face à son rival qui se retrouve sous les projecteurs du monde entier, Kaiser, acculé, joue le tout pour le tout avec une technique encore incomplète, dans l'espoir de régler ses comptes avec le passé ! Boostés par cette tension, les autres individualistes affamés de buts se battent, eux aussi, pour définir la ligne à franchir afin de briller à leur tour. Qui parviendra à atteindre une nouvelle dimension dans sa progression transcendantale faite de destruction et de reconstruction ? !",isbn:"9791043303326",extraUrl:"https://covers.openlibrary.org/b/isbn/9791043303326-M.jpg"},
  {t:"Submersion",a:"Dugain Marc",y:"2026",ed:"Albin Michel",cote:"R DUG",pub:"Adulte",sup:"Imprimé",d:"\"On en a connu, des crises, depuis le début de mon mandat, mais celle-là est particulière parce que, avant même que la partie ait commencé, nous avons été mis en échec\". Ainsi s'engage la confession du président d'une République française essoufflée, au coeur d'une nouvelle donne internationale. La chronique d'une démocratie assiégée, tant par des forces intérieures qu'extérieures. Pour qu'elle survive, le locataire de l'Elysée est prêt à tout, même à l'impensable. Si le recul était autrefois nécessaire pour analyser l'Histoire, Marc Dugain, lui, prend le parti de sonder notre époque en temps réel, jusqu'à notre futur proche. Après Tsunami, Submersion nous hisse de nouveau au sommet de l'Etat pour mieux saisir la nature du pouvoir au 21ème siècle. Le résultat ? Un roman vertigineux et sidérant de réalisme, où tout pourrait être vrai...",isbn:"9782226503503",extraUrl:"https://covers.openlibrary.org/b/isbn/9782226503503-M.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2022",ed:"Ki-oon",cote:"BD RAn",pub:"Jeunesse",sup:"Imprimé",d:"",isbn:"9791032712153",extraUrl:"https://covers.openlibrary.org/b/isbn/9791032712153-M.jpg"},
