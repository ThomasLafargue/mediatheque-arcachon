  {t:"Moi, Lubochka",a:"Baum",y:"DL 2026",ed:"les Éditions des éléphants",cote:"BDJ BAU",pub:"Jeune",sup:"Imprimé",d:"Un ours mène une vie d'ours au fil des saisons. Et puis un Jour, la terre tremble, les bombes pleuvent, le ciel prend feu... Une fable qui permet d'évoquer, avec finesse et subtilité, l'impact des conflits sur les hommes et la nature Cette singulière histoire d'amitié est aussi un hymne puissant à la solidarité et à l'espoir. Amnesty International.",isbn:"9782372731720",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782372731720-475x500-1.jpg"},
  {t:"Au pot, Hippo !",a:"Antony",y:"DL 2026",ed:"Circonflexe",cote:"A ANT",pub:"Jeune",sup:"Imprimé",d:"Suivez Hippo, un petit hippopotame qui n'a pas vraiment envie d'aller sur le pot[xe2][x80][xa6] une histoire pour accompagner les enfants dans l'apprentissage de la propreté",isbn:"9782378625573",extraUrl:"https://products-images.di-static.com/image/base/9782378625573-475x500-1.jpg"},
  {t:"Sanglillon",a:"Baer",y:"DL 2026",ed:"Kaléidoscope",cote:"A BAE",pub:"Jeune",sup:"Imprimé",d:"Sanglillon n'a pas une vie facile : il récure, cuisine, astique du matin au soir pendant que ses chipies de soeurs se prélassent. Jusqu'au jour où le bal royal est annoncé. Et si, pour une fois, c'était à son tour de briller ? Une version poilue et déjantée de Cendrillon, où le héros ne se laisse pas marcher sur les sabots !",isbn:"9782378883287",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782378883287-475x500-1.jpg"},
  {t:"La collectionneuse",a:"Pétry-Sirvin",y:"DL 2024",ed:"L'Etagère du bas",cote:"A PET",pub:"Jeune",sup:"Imprimé",d:"Depuis toute petite, Tanaquil collectionne tout. Des doudous et des peluches, des mousses et des lichens, des autocollants et du parfum, des théières et des guitares. Tant et si bien que, tout le long de sa vie, Tanaquil n'a jamais eu de place pour autre chose... Saura-t-elle accueillir ce qui pourrait arriver ?",isbn:"9782490253623",extraUrl:"https://products-images.di-static.com/image/base/9782490253623-475x500-1.jpg"},
  {t:"Le grand air",a:"Othats",y:"DL 2026",ed:"La Partie",cote:"A OTH",pub:"Jeune",sup:"Imprimé",d:"Un imagier pour faire le tour des saisons en jeu et en mouvement ! Sauter, tomber, toucher... cet imagier met en scène une enfant qui goûte chacune des saisons au grand air. Les verbes d'actions, comme une ritournelle, sont mis en pratique par l'enfant, mais aussi par ce qui l'entoure. Ainsi, le pic-vert et le soleil tapent, les bourrasques soufflent, la foudre tombe en été et la nuit tombe en hiver...",isbn:"9782494591370",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494591370-475x500-1.jpg"},
  {t:"Schmoof le Chien",a:"McKinnon",y:"DL 2026",ed:"Editions L'Elan vert",cote:"A MCK",pub:"Jeune",sup:"Imprimé",d:"Schmoof est doux. Schmoof est le plus doux, câlin, mignon des toutous ! Schmoof a hâte de se faire un ami. Et Floof ?",isbn:"9782844559227",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782844559227-475x500-1.jpg"},
  {t:"Shibu et ses émotions",a:"Ollier",y:"2026",ed:"Gallimard",cote:"A OLL",pub:"Jeune",sup:"Imprimé",d:"Un album plein d'humour et de poésie qui célèbre l'importance d'exprimer ses émotions et la joie d'être soi-même!<br>Shibu d&#x00E9;borde d'&#x00E9;motions, et il adore les partager ! Il peut se montrer fier ou triste, rempli de col&#x00E8;re ou d'amour... Et bien plus encore ! Mais un doute l'envahit petit &#x00E0; petit : et si ses &#x00E9;motions &#x00E9;taient trop visibles'Apr&#x00E8;s tout, ses amis sont si discrets..",isbn:"9782075236140",extraUrl:"https://products-images.di-static.com/image/base/9782075236140-475x500-1.jpg"},
  {t:"Je serai un homme des cavernes",a:"Tanco",y:"DL 2026",ed:"L'École des loisirs",cote:"A MOZ",pub:"Jeune",sup:"Imprimé",d:"Devenir président, banquier ou commandant ? Non merci, quel ennui ! Alors qu'il existe depuis la nuit des temps un emploi qui permet d'être tout cracra, de manger avec ses doigts, de grogner, et de pêcher ses crottes de nez : homme des cavernes. Mais même avec la vocation, c'est une dure profession... Pour bien la pratiquer, mieux vaut commencer tout de suite à s'entraîner !",isbn:"9782211349048",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782211349048-475x500-1.jpg"},
  {t:"Chercher le bonheur",a:"Nille",y:"2022",ed:"Actes Sud",cote:"1042003331",pub:"Jeune",sup:"Imprimé",d:"Une nouvelle pépite signée Peggy Nille ! Une aventure pleine de philosophie et de poésie, où l'on suit les questionnements d'un petit pingouin sur le bonheur.",isbn:"9782330167783",extraUrl:"https://www.base-orb.fr/visuels-pim/image/base/9782330167783-475x500-1.jpg"},
  {t:"Avant moi",a:"Houssais",y:"DL 2026",ed:"Editions du Ricochet",cote:"A HOU",pub:"Jeune",sup:"Imprimé",d:"Un album unique qui raconte l'évolution aux plus jeunes. Ce magnifique album répond avec simplicité aux questions des enfants sur l'origine de la vie sur Terre. Depuis le Big Bang jusqu'à la naissance d'un enfant, chaque étape de l'évolution est expliquée : formation des planètes, premières formes de vie dans les océans, apparition de la vie terrestre... Le texte est accompagné de sublimes illustrations vives et colorées pour une immersion complète !",isbn:"9782352635574",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782352635574-475x500-1.jpg"},
  {t:"Les extraterrestres ne sont pas verts !",a:"Quadri",y:"DL 2026",ed:"Rue du Monde",cote:"A QUA",pub:"Jeune",sup:"Imprimé",d:"As-tu déjà vu un objet suspect dans le ciel ou une silhouette étrange se dessiner dans l'ombre ? Sache qu'il ne s'agissait pas d'un extraterrestre ! Pour l'instant, rien ne prouve qu'ils existent, et encore moins qu'ils soient verts... On a pourtant le droit de rêver, il y a tellement de place dans l'espace !",isbn:"9782355048111",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355048111-475x500-1.jpg"},
  {t:"L'Enfant de la vallée",a:"Groenink",y:"DL 2026",ed:"Little urban",cote:"A GRO",pub:"Jeune",sup:"Imprimé",d:"Depuis la grotte de sa montagne, un garçon rêve de retourner dans la vallée. Ici, il a sa famille mais là-bas le monde l'attend. En chemin, des animaux courent, sautent, volent et bondissent partout autour de lui, jusqu'à arriver près de la rivière, là où un autre garçon se trouve...",isbn:"9782374082134",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782374082134-475x500-1.jpg"},
  {t:"De l'autre côté de l'Arc-en-ciel",a:"Blue",y:"DL 2026",ed:"Little urban",cote:"A BLU",pub:"Jeune",sup:"Imprimé",d:"Elio n'aime pas le changement. Il ne quitte presque jamais le calme rassurant de sa chambre. Jusqu'au jour où il rencontre une petite flamme qui lui fait découvrir les merveilles de la nature et l'incite à s'ouvrir au monde extérieur. Une histoire MAGIQUE au rythme des saisons pour voir la vie du bon côté.",isbn:"9782374082288",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782374082288-475x500-1.jpg"},
  {t:"400 fourmis, 3 souris et 1 genou d'éléphant",a:"Taboni",y:"DL 2026",ed:"Frimousse",cote:"A TAB",pub:"Jeune",sup:"Imprimé",d:"Un imagier qui remet tout le monde à sa place ! Vous êtes-vous déjà demandé ce que l'on pourrait mettre dans un livre de 22 cm ? Suivons cette enfant curieuse qui s'est, pour l'occasion, faite toute petite... - Peut-on faire rentrer une fourmi ? - Oui ! Plein de fourmis, même ! - Un poussin ? - Oui ! Ca tient ! Et ainsi de suite, du plus petit au plus grand... Vont-ils tous rentrer dans le livre ? C'est au lecteur de le découvrir !",isbn:"9782383496014",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496014-475x500-1.jpg"},
  {t:"Trop de bananes",a:"Courgeon",y:"DL 2024",ed:"Milan",cote:"A COU",pub:"Jeune",sup:"Imprimé",d:"\" Any, sans son grand-père, ne serait pas vraiment Any. Il est le phare de sa vie. Un vieux à roulettes qui peint la mer depuis plus de quatre-vingts ans, tous les jours, en râlant qu'il n'y arrive jamais, que c'est tellement plus beau en vrai. Any aussi dessine tous les jours. Tout et n'importe quoi. C'est une artiste un peu cinglée, mais un seul adjectif n'est pas suffisant pour parler d'elle... \" Un personnage féminin fort Sous les mots et les pinceaux de Rémi Courgeon, cette histoire nous dresse le portrait d'Any, une jeune fille forte, déterminée, passionnée et rêveuse. Un personnage très attachant et inspirant dont les dessins animent l'album du début à la fin. Un album sur la relation entre un grand-père et sa petite-fille Rémi Courgeon décrit une très belle relation entre le grand-père et sa petite-fille, réunis par leur amour du dessin et leur caractère bien trempé. Un album drôle et émouvant à la fois. \" Cette histoire pleine d'humour et d'énergie, un brin loufoque, aux illustrations très colorées, nous montre comment une passion peut habiter toute une vie\". Frédérique Franco (Librairie Le Goût des mots, Mortagne-au-Perche) \"Elles ne sont pas fréquentes, les histoires abracadabrantes, qui tiennent sur la longueur sans signe d'essoufflement. Cet album en raconte une, fondée sur l'excentricité de son héroïne, fascinée par les peaux de banane. Non pas pour les semer sous les pieds des inopportuns, mais pour en faire des tableaux, des collages, voire des sculptures. Quelle sacrée personnalité Rémi Courgeon lui a donnée, en plus d'un nez de peinture sortie du tube et de cheveux en poils de pinceau écrasé ! \" Télérama",isbn:"9782408050757",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408050757-475x500-1.jpg"},
  {t:"Le Grand Roi Soleil",a:"Mélèse",y:"DL 2026",ed:"Editions Panthera",cote:"A MEL",pub:"Jeune",sup:"Imprimé",d:"\"J'étais une petite fille assez solitaire et rêveuse, mais autoritaire avec mon frère et ma soeur, plus jeunes que moi. Vers l'âge de six ans, je me suis créé un ami, un compagnon, pas seulement plus sage que moi, mais aussi bien plus sage que mes parents. Il avait un savoir, un sens de la justice, une bonté, une sévérité et une rigueur, beaucoup plus vastes et solides que les leurs. Le Grand Roi Soleil. Mon Grand Roi Soleil\".",isbn:"9782494182318",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494182318-475x500-1.jpg"},
  {t:"L'éternité ne dure qu'un temps",a:"Sobral",y:"2013",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Dans ce nouvel épisode, Gryf est confronté à un choix cornélien : sauver celle qu'il aime ou sauver la race humaine de l'extinction.",isbn:"9782756032634",extraUrl:"https://www.bedetheque.com/media/Couvertures/Couv_199456.jpg"},
  {t:"La bataille du néant",a:"Sobral",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Un mystérieux phénomène, le \"Néant\", menace le monde elfique. Shimy doit aider les elfes à sauver Astria grâce à ses pouvoirs élémentaires naissants. Mais des survivants Galinas n'apprécient pas ce renfort, tout comme ils ne souhaitent pas la disparition de ce très mystérieux \"Néant\". Quel noir secret ce dernier renferme-t-il ? Un nouvel épisode bourré d'adrénaline pour nos amis les Légendaires.",isbn:"9782756064772",extraUrl:"https://images.epagine.fr/772/9782756064772_1_m.jpg"},
  {t:"Le loup ne viendra pas",a:"Ouyessad",y:"DL 2021",ed:"Editions L'Elan vert",cote:"A OUY",pub:"Jeune",sup:"Imprimé",d:"- Maman, tu es sûre que le loup ne viendra pas ? - Tout à fait sûre, mon lapin. - Mais comment tu peux être aussi sûre ?",isbn:"9782844556462",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782844556462-475x500-1.jpg"},
  {t:"Le vol",a:"Barber",y:"DL 2019",ed:"Éditions Les 400 Coups",cote:"A BAR",pub:"Jeune",sup:"Imprimé",d:"Ah ! ce coquin de Philémon Croquenot ! Le voleur veut absolument les dernières longs à la mode pour sa collection. Réussira-t-il à dérober cette 402e paire de chaussures ?",isbn:"9782895408581",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782895408581-475x500-1.jpg"},
  {t:"A qui sont ces grandes dents ?",a:"Beau",y:"DL 2021",ed:"D'eux",cote:"A BEA",pub:"Jeune",sup:"Imprimé",d:"A qui sont ces grandes dents ? Et si on regardait de plus près ? Et si on s'éloignait pour mieux voir...",isbn:"9782924645024",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782924645024-475x500-1.jpg"},
  {t:"Les Portes d'Odin",a:"Le Gris",y:"DL 2026",ed:"Glénat",cote:"BDJ LEG",pub:"Jeune",sup:"Imprimé",d:"Une guerrière viking n'abandonne jamais ! Skara est une jeune viking qui a reçu à la naissance un talent rare et divin : le don du Loup. Ce don fait d'elle une redoutable guerrière pouvant tenir tête à n'importe qui malgré son jeune âge ! Après la mort de sa mère - tuée par des pillards - Skara, emportée par la colère et le désespoir, incendie accidentellement un temple sacré d'Odin. Le brasier ravageur ouvre alors les portes entre les Neuf Royaumes et libère sur Midgard des monstruosités venues des mondes inférieurs. Venant visiter Skara dans ses rêves, Urd, la déesse tisseuse du Destin, lui explique que le seul moyen de réparer sa faute est de chasser elle-même ces créatures maléfiques. Alors seulement, Odin pourra lui pardonner. Accompagnée de Bojan, un jeune prêtre russe peu dégourdi, et de la sulfureuse sorcière Rùna, la jeune viking se lance alors dans une aventure digne des grandes sagas nordiques ! Avec ce récit mettant en scène une jeune adolescente au caractère colérique en quête de rédemption, Jérôme Le Gris et Letizia Depedri signent une nouvelle série épique au ton décalé. Mêlant action, loyauté et sororité, le duo nous plonge dans un récit sans temps mort où l'imaginaire de la mythologie nordique sert de décor au parcours initiatique jalonné d'épreuves de leur héroïne.",isbn:"9782344064535",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344064535-475x500-1.jpg"},
  {t:"Je suis là pour toi",a:"Parapaboom",y:"DL 2026",ed:"Editions Amaterra",cote:"A PAR",pub:"Jeune",sup:"Imprimé",d:"Un livre cartonné graphique et coloré sur l'entraide, empreint d'humour et de tendresse. A chaque page, un personnage se retrouve dans l'embarras... Le lecteur soulève le rabat, le visuel évolue et hop ! Le problème est résolu. Avec la ritournelle rassurante \"Ne t'inquiète pas, je suis là pour toi\", ce livre interactif invite les tout-petits à découvrir la magie de l'entraide et la joie de partager, l'histoire est rythmée et le plaisir de la lecture à voix haute renforcé.",isbn:"9782368563878",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782368563878-475x500-1.jpg"},
  {t:"Fechamos (on ferme)",a:"Baum",y:"2020",ed:"les Éditions des éléphants",cote:"BDJ BAU",pub:"Jeune",sup:"Imprimé",d:"Déserté du public, un musée est contraint de fermer ses portes définitivement. En cette nuit, le gardien Edson Arantes entame en compagnie de quelques habitués une ultime déambulation au cours de laquelle les collections sont distribuées. Le musée est détruit dans un incendie mais les objets qu'il conservait sont sauvés. Inspiré du sinistre survenu au musée national de Rio de Janeiro. ©Electre 2020",isbn:"9782372730914",extraUrl:"https://products-images.di-static.com/image/base/9782372730914-475x500-1.jpg"},
  {t:"La robe de soie",a:"Mezzalama",y:"DL 2022",ed:"les Éditions des éléphants",cote:"BDJ MEZ",pub:"Jeune",sup:"Imprimé",d:"Les vieilles maisons gardent la mémoire et les secrets. Il ne faut pas avoir peur des ancêtres et des fantômes, ni les oublier.",isbn:"9782372731065",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782372731065-475x500-1.jpg"},
  {t:"Résolutions",a:"Borecki",y:"DL 2024",ed:"Kennes",cote:"BDJ BOR",pub:"Jeune",sup:"Imprimé",d:"Bienvenue dons l'univers de Léo rempli d'amitié, de guerres de nunuches, de remises en question, d'embrouilles familiales et d'histoires d'amour. En somme, une vie compliquée d'adolescente empreinte de réalisme et d'humour.",isbn:"9782380759419",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782380759419-475x500-1.jpg"},
  {t:"Eclair de génie",a:"Zidrou",y:"DL 2025",ed:"Le Lombard",cote:"BDJ ZID",pub:"Jeune",sup:"Imprimé",d:"Léonard voit les choses en grand, très grand ! son dernier projet ? Fonder la Siliconval(i) du Moyen Age et révolutionner les télécoms avec sa société Génie.com. Crypto-monnaie, panneaux solaires et OGM s'invitent à la ferme, avec le génie farfelu du Maître et la maladresse légendaire du disciple. Un concentré d'humour absurde et d'inventions (presque) révolutionnaires, signé par la série culte qui défie la logique depuis 56 tomes.",isbn:"9782808212465",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808212465-475x500-1.jpg"},
  {t:"Duels au collège",a:"Cazot",y:"DL 2026",ed:"Dupuis",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"Punie par sa mère pour lui avoir caché qu'elle faisait de la boxe malgré son interdiction formelle, trahie par Elias, son ex-meilleur ami, qui a tout cafté, harcelée par ses camarades de classe qui ne ratent pas une occasion de se moquer de son format réduit, Colette manque terriblement de moments un peu excitants dans sa vie. Et puis Astrid, qui la persécute depuis des années dans la cour de récréation, lui propose un marché : elle arrêtera de l'embêter si Colette accepte de faire quelques combats clandestins dans la salle de sport de l'école. Pour Colette, c'est l'occasion rêvée d'enfiler à nouveau des gants de boxe et de retrouver les sensations qu'elle avait précédemment adorées. \"Mi-mouche\", c'est le poids minimum pour faire des combats de boxe. C'est désormais également une série de bande dessinée d'une grande richesse, passant de la tragédie à la comédie. Avec beaucoup d'humour et ? on s'en doute ? énormément d'émotion.",isbn:"9782808506823",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808506823-475x500-1.jpg"},
  {t:"Gribouillis & Kraboutchat",a:"Bailly",y:"DL 2025",ed:"Dupuis",cote:"BDJ BAI",pub:"Jeune",sup:"Imprimé",d:"Il est petit. Il est poilu. C'est Petit Poilu ! Le v'là parti de bon matin. Le vie parti et tout va bien. Mais ? ... Que se passe-t-il ? Ca se bouscule. Et tout bascule ! Un crayon à tailler. Des copeaux de toutes les couleurs. Des noeuds, des boucles et des entrelacs. Deux compères complètement fadas. Des folies, des pitreries, des dingueries... Vas-y, Petit Poilu, fonce ! Petit débrouillard de la vie ! Petit Poilu est un petit bonhomme curieux, optimiste et courageux qui plonge malgré lui dans des aventures extraordinaires dont il ressort toujours grande. Petit Poilu tord le cou aux idées reçues et apprend la vie en s'initiant aux relations humaines. Viens grandir avec lui !",isbn:"9782808510127",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808510127-475x500-1.jpg"},
  {t:"Panique à Yosemite",a:"Le Gat",y:"DL 2023",ed:"Éditions Sarbacane",cote:"BDJ LEG",pub:"Jeune",sup:"Imprimé",d:"1906 c'est la panique à Yosemite ! Le légendaire enquêteur Angus Niper a été appelé par les responsables du parc national californien pour résoudre l'affaire des mystérieuses agressions commises sur des touristes... Mais quelle n'est pas leur surprise quand ils voient débarquer... une femme ! C'est Penny Sugar, l'assistante photographe de Niper. Son patron, retenu sur une enquête, l'a chargée de commencer à collecter les indices. Follette et maladroite, elle ne semble pas avoir les épaules pour assumer une telle tâche. Mais ces braves messieurs ont tort de s'en faire, ils sont entre de bonnes mains ! Angus Niper n'est en réalité qu'une couverture, qui permet à Penny, experte en combat, fine enquêteuse et habile transformiste, d'exercer son métier sans éveiller les soupçons. Penny saura-t-elle déchiffrer les énigmatiques mises en scène de l'agresseur qui détrousse les visiteurs ? Ces vols ont-ils un lien avec le mouvement spiritualiste \" Ghost Dance \" composé d'Indiens natifs du parc qui s'adonnent à la nuit tombée à d'étranges rituels ? Ou bien avec le projet de barrage défendu par le verreux sénateur Johnson ? Dans la traque qui s'annonce qui est le chasseur ? Qui est la proie ?",isbn:"9791040803584",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040803584-475x500-1.jpg"},
  {t:"La sorcière des Everglades",a:"Le Gat",y:"DL 2024",ed:"Éditions Sarbacane",cote:"BDJ LEG",pub:"Jeune",sup:"Imprimé",d:"Une nouvelle enquête impossible appelle le célèbre enquêteur Angus Nyper en Floride : une sorcière hanterait les mines de phosphate de la riche famille Golpah, l'obligeant à mettre à l'arrêt sa production. La faillite menace ! Penny Sugar, qui se fait passer pour l'assistante étourdie de Nyper, personnage qu'elle a inventé de toutes pièces pour pouvoir exercer un métier réservé aux hommes, débarque donc sur cette terre peuplée de crocodiles et de légendes séminoles effrayantes. Accueillie dans le manoir des Golpah, elle est tout de suite témoin de vives tensions entre Jerry, le fils héritier des mines, et sa soeur Elry, jeune femme amère qui ne semble pas se soucier le moins du monde de la malédiction qui frappe l'entreprise familiale. Qui est donc cette sorcière ? Quelles sont ses motivations ? Et pourquoi l'accès au sous-sol du manoir a-t-il été condamné ?",isbn:"9791040804963",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040804963-475x500-1.jpg"},
  {t:"Bande de compotes !",a:"Mr Tan",y:"DL 2025",ed:"Mr Tan & Co",cote:"BDJ TAN",pub:"Jeune",sup:"Imprimé",d:"Mortelle Adèle revient dans un 22e tome de gags, publié chez Mr Tan & Co ! \" Dans la vie, c'est simple, y a deux catégories de gens : les potes, et les compotes ! Laisse-moi t'expliquer comment faire le tri. Tu peux me faire confiance, la vérité sort de la bouche des... BIZARRES ! \" Mortelle Adèle n'aime pas les nazebroques, et encore moins les flagadas du cerveau ! Avec sa nouvelle catapulte, la voilà bien décidée à envoyer sur la lune le premier qui viendra lui casser les pieds ! Alors gare à vous... BANDE DE COMPOTES ! © Mr Tan et Diane Le Feyer d'après l'oeuvre créée par Mr Tan et Miss Prickly © Mr Tan & Co",isbn:"9782494678378",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782494678378-475x500-1.jpg"},
  {t:"Au nom d'Amra",a:"Deschard",y:"DL 2026",ed:"Vents d'Ouest",cote:"BDJ DES",pub:"Jeune",sup:"Imprimé",d:"Qui survivra au Jugement d'Amra ? Alors qu'Asmodée et Oni reviennent tout juste de leur périlleuse mission à Ferroc, le royaume de Sayran est en proie au chaos : un culte fanatique, celui d'Amra, a pris le contrôle de la ville, imposant sa foi par la force et la peur, et demandant expressément la libération de Sainte Namielle, leur Semi-déus guérisseuse. Mais les négociations tournent court, et pour écraser Amra, la Reine Bérénice n'hésite pas à libérer les plus dangereux des Semi-Déus enfermés depuis des années dans le Cloître Doré. Pendant ce temps, Asmodée et Orphée tentent un plan pour essayer de raisonner les Amraïtes. Mais Antios, l'archonte d'Amra, impose bientôt un jugement divin : les pouvoirs des Semi-Déus doivent être purifiés ou éradiqués. La tension monte, les alliances se brisent et les trahisons se multiplient. Une guerre sainte est sur le point d'éclater, opposant fanatiques, résistants et Semi-Déus. Ces derniers, longtemps utilisés comme armes, doivent choisir : se soumettre, fuir... ou se battre. Dans ce nouveau tome, les masques tombent, les secrets éclatent, et la frontière entre foi et folie devient floue. Un album captivant, entre intrigues politiques, manipulations et suspense, qui nous offre son florilège de personnages et une héroïne attachante dans un univers empreint de mystère.",isbn:"9782749310336",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310336-475x500-1.jpg"},
  {t:"Lincoln dans la ligne de mire",a:"Neidhardt",y:"DL 2025",ed:"Dupuis",cote:"BDJ NEI",pub:"Jeune",sup:"Imprimé",d:"Condamné au peloton d'exécution pour une désertion de trop, Blutch se retrouve emprisonné, avec pour voisine la mystérieuse Isabella Boyd, elle-même frappée de peine capitale pour intelligence avec l'ennemi. Parvenant à s'évader avec cette dernière, l'ancien caporal intègre un groupe de conspirateurs sudistes, qui vont lui demander d'abattre le président Lincoln ! Blutch, pacifiste par nature, parviendra-t-il à résister à l'insistance de ses nouveaux \"amis\" ? Cela s'annonce compliqué, car les charmes de la belle Isabella semblent l'éloigner des bras de Chesterfield qui, se sentant coupable de l'arrestation de son ami, le recherche désespérément... Entre grande aventure, gags en rafale et exploration de l'Histoire, Fred Neidhardt poursuit avec un épatant respect l'oeuvre de Raoul Cauvin, toujours en compagnie de l'inusable Willy Lambil ! Fred Neidhardt, à l'aise dans de nombreux registres, chausse les bottes des Tuniques Bleues pour des intrigues pleines d'humour et de culture. L'inépuisable Lambil est, comme toujours, impeccable.",isbn:"9782808507660",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808507660-475x500-1.jpg"},
  {t:"Le gardien de la forêt",a:"Di Gregorio",y:"DL 2025",ed:"Dupuis",cote:"BDJ DIG",pub:"Jeune",sup:"Imprimé",d:"Quelque chose se cache au fond des bois. Quelque chose qui dort sous les feuilles sèches, enveloppé par les murmures du vent... et que les Grémillet s'apprêtent à réveiller, alors qu'elles découvrent la gare désaffectée où leur mère passait ses étés lorsqu'elle était jeune. Entre légendes anciennes, amours oubliées et un mystérieux enfant sans nom, les trois soeurs devront résoudre une énigme resurgie des brumes du passé. Mais cette fois, elles ne seront pas seules, le gardien de la forêt surveille chacun de leurs pas. Est-il hostile ou bienveillant ? Va-t-il les empêcher de mener leur enquête ? Mais la véritable épreuve qui les attend sera d'une toute autre nature...",isbn:"9782808510462",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782808510462-475x500-1.jpg"},
  {t:"Les portes de Jurassia",a:"Paré-Sorel, Julien",y:"DL 2022",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeune",sup:"Imprimé",d:"Rex et Cory poursuivent leur chemin vers le volcan Kaliédos dans l'espoir de secourir Patchy et Gogo, toujours captifs de l'infâme général Ank. Traqués par Ovi la sorcière, ils devront traverser la mythique jungle de Troïka afin d'atteindre leur destination. Ils ne se doutent pas qu'une bouleversante révélation viendra sceller leur destin à tout jamais !",isbn:"9782897518721",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518721-475x500-1.jpg"},
  {t:"Silence of the lamps",a:"Midam",y:"2022",ed:"Dupuis",cote:"BDJ MID",pub:"Jeune",sup:"Imprimé",d:"De nouvelles aventures de Kid Paddle, qui, cette fois, apprend à capturer un Blork, à utiliser un Copy 2000 ou encore à comprendre où atterrit l'argent glissé dans la fente d'une caisse automatique. ©Electre 2022",isbn:"9791034763122",extraUrl:"https://products-images.di-static.com/image/base/9791034763122-475x500-1.jpg"},
  {t:"Le pollen du Monte Urticando",a:"Franquin",y:"DL 2022",ed:"Dupuis",cote:"BDJ YAN",pub:"Jeune",sup:"Imprimé",d:"Les cactus Comilt millénaires de la vallée Monte Urticando, fleurissent tous les quinze ans. Cela est le signe que les petits marsupilamis doivent se rendent dans cette vallée pour apprendre à se débrouiller tout seul. Et même s'ils doivent y rencontrer un adversaire tenace, Gatogordo le jaguar...",isbn:"9791034766307",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791034766307-475x500-1.jpg"},
  {t:"La dernière chasse",a:"Franquin",y:"DL 2026",ed:"Dupuis",cote:"BDJ CED",pub:"Jeune",sup:"Imprimé",d:"Ils sont cinq. Les cinq meilleurs chasseurs du monde, envoyés en Palombie par un mystérieux commanditaire avec un objectif : capturer un marsupilami ! Backalive, l'ennemi habituel du Marsu, cette fois accompagné de la terrible Estefania Forbalez, du débonnaire Léon de Bourgogne, du cruel Parhavi et de la jeune Violette Delacourt flanquée de ses drones, va-t-il parvenir à ses fins ? Les chances du Marsu semblent minces, tant ses ennemis sont déterminés et bardés de techniques de chasse imparables. D'autant plus qu'ils sont accompagnés par Tatou, un jeune guide chahuta spécialiste de la jungle et acquis à leur cause (ou pas...). Toujours sous les crayons du légendaire Batem, le Marsupilami revient avec un scénario signé Kid Toussaint (Animal Jack, Magic 7, Elles) accompagné de Ced, le sniper du gag. Un mélange parfait de grande aventure, de frisson, de vertige graphique et d'humour !",isbn:"9791034770830",extraUrl:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9791034770830-475x500-1.jpg"},
  {t:"L'école sous les étoiles",a:"Arlène",y:"DL 2025",ed:"Auzou",cote:"BDJ ARL",pub:"Jeune",sup:"Imprimé",d:"Les élèves sont de retour à l'Académie Royale et leur rentrée se fait pendant la nuit ! Etrange... Les élèves sont de retour à l'Académie Royale et leur rentrée se fait pendant la nuit ! Etrange... Un nouveau professeur noctambule va leur donner des cours d'astronomie. Il paraît qu'une comète magique va passer au-dessus du château et les élèves devront l'observer. Génial ! Migali est ravie d'avoir une nouvelle mission et de super occasions de faire des bêtises.",isbn:"9791039541299",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791039541299-475x500-1.jpg"},
  {t:"L'île aux momies",a:"Arlène",y:"DL 2025",ed:"Auzou",cote:"BDJ ARL",pub:"Jeune",sup:"Imprimé",d:"Un voyage scolaire au pays des momies ? Voilà qui ravit Migali et ses amis, bien décidés à en profiter pour faire un maximum de bêtises. Migali est ravie : toute sa classe part en voyage scolaire sur l'île aux momies, une île très ancienne, qui a connu des milliers de civilisations passées. Le professeur Flamberge a prévu de leur visiter les pyramides dans lesquelles serait caché un trésor, génial ! Mais gare aux créatures qui hantent les couloirs de ces lieux à l'histoire effrayante !",isbn:"9791039559829",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791039559829-475x500-1.jpg"},
  {t:"Le secret du coeur de pierre",a:"Faith Erin Hicks",y:"2018",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeune",sup:"Imprimé",d:"Une tentative d'assassinat vient d'être commise contre le Général de toutes les Lames et le chaos éclate à nouveau dans la cité sans nom. Malgré les efforts de ses habitants pacifiques, la cité est au bord de la guerre. Luttant avec l'aide de Kaidu pour sauver la ville, Rat révèle quelque secrets sur le monastère dans lequel elle a grandi. ©Electre 2018",isbn:"9782369813736",extraUrl:"https://www.bedetheque.com/cache/thb_couv/Couv_327045.jpg"},
  {t:"Cycle 4 - Voyage au centr des terres",a:"Filippi",y:"DL 2025",ed:"Vents d'Ouest",cote:"BDJ FIL",pub:"Jeune",sup:"Imprimé",d:"La quête ultime Egypte. Emilien, Noémie et Mathilde se retrouvent au coeur du désert. Traqués par Ursula et ses sbires qui veulent récupérer la sphère d'activation, les enfants n'ont d'autre choix que de faire confiance à leur guide Sélim et de fuir à bord d'une felouque des sables. Sous une chaleur écrasante, ils parviennent à franchir le mur de sable d'une tempête errante. Bientôt, ils atterrissent dans une cité cachée qui se trouve être le berceau de la civilisation ayant créé les technologies obscures ! Les enfants n'en croient pas leur yeux et l'espoir de retrouver leurs parents renaît ! Mais en explorant ce lieu, ils sont confrontés à une nouvelle menace : de monstrueux robots sauvages qui n'ont rien à voir avec leur gentil Robby les prennent en chasse... Par chance, Kiritsu et ses robots ninjas viennent en aide à nos jeunes explorateurs. Finalement coincés dans une antique bâtisse, encerclés par une horde de robots, il leur reste peu de temps pour percer le secret qui sommeille dans cet endroit mystérieux. Après avoir sillonné le monde, les enfants touchent presque au but. Parviendront-ils à retrouver leurs parents et à élucider l'énigme de l'origine des technologies obscures ? Ce dernier tome plein de rebondissements clôt une incroyable série fantastique qui a captivé les lecteurs depuis 2012 grâce à ses nombreuses péripéties, son intrigue bien ficelée et une galerie de personnages toujours en quête de vérité. Une saga à ne pas manquer !",isbn:"9782749310350",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310350-475x500-1.jpg"},
  {t:"La prisonnière d'Antésalem",a:"Gazzotti",y:"DL 2026",ed:"Rue de Sèvres",cote:"BDJ GAZ",pub:"Jeune",sup:"Imprimé",d:"Les Cinq ne sont pas revenus indemnes de leur expédition sur l'île au bord du monde mais ils savent désormais où Jezabel est retenue captive. Parti libérer la mystérieuse prisonnière en compagnie du Maître-Fou, Dodji découvre les ruines d'Antésalem, vestiges de la précédente guerre : éloigné de son camp, il ignore que Saul a déployé ses forces et se tient prêt à frapper. Convaincu d'oeuvrer pour le Bien, le jeune Imperator a activé de nouveaux Protecteurs et s'est doté d'une arme implacable : les Séraphins, une milice d'enfants-soldats d'une fidélité absolue, prêts à se sacrifier pour lui. Grisé par la puissance de ses pouvoirs, Saul lance une attaque sans pitié : la Nouvelle Guerre des Limbes a commencé.",isbn:"9782810206162",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782810206162-475x500-1.jpg"},
  {t:"Le carnaval",a:"Luciani",y:"2012",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeune",sup:"Imprimé",d:"Monsieur Blaireau et Madame Rebarde décident qu'ils vont tous vivre dans le même terrier !",isbn:"9782205067835",extraUrl:"https://products-images.di-static.com/image/base/9782205067835-475x500-1.jpg"},
  {t:"Le secret du Viking King",a:"Fromental",y:"DL 2025",ed:"Hélium",cote:"BDJ FRO",pub:"Jeune",sup:"Imprimé",d:"Elle mène ses enquêtes à patte de velours, mais quand elle sort ses griffes, ça déchire... Le Polp'z, milk-bar préféré de Miss Chat, est fermé. Ole, le barman, a disparu. Sur la piste de son ami, la détective croise le chemin de Big Ø, le chef du gang des Six Poulpes de la rue Treize qu'elle a envoyé en prison au début de sa carrière. La voici immergée en compagnie de la pétulante Griselda, archiviste au quotidien Dag Tablet, dans une sombre affaire d'archéologie sous-marine. Quel secret historique dort dans la mystérieuse épave du Viking King ? Pour le savoir, il va falloir plonger. Chat échaudé craint l'eau froide, mais chez notre féline, la curiosité l'emporte toujours sur l'effroi.",isbn:"9782330209735",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330209735-475x500-1.jpg"},
  {t:"La Terre déchirée",a:"Faith Erin Hicks",y:"2019",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeune",sup:"Imprimé",d:"La tribu Dao va s'allier aux Yisun pour mener une offensive contre le général Erzi et ses troupes qui font régner la terreur. Rat et Kai veulent voler le livre de Napatha contenant la formule de destruction massive, avant que l'habile Mura ne la revende aux nations pour entretenir les guerres. ©Electre 2019",isbn:"9782369813767",extraUrl:"https://products-images.di-static.com/image/base/9782369813767-475x500-1.jpg"},
  {t:"Crète party",a:"Cazenove",y:"DL 2020",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"La mythologie grecque revisitée par un humour légendaire ! Mais où donc habite Poséidon ? Et pourquoi n'en sait-on pas plus sur ses enfants, Triton et Rhodé ? Et si on en profitait pour expliquer pourquoi c'est à cause du dieu de la mer qu'est né le Minotaure ? Et le Minotaure, pourquoi est-il obligé de vivre dans un labyrinthe construit par un certain Dédale sur ordre du roi Minos ? Les questions sont nombreuses, espérons que nos petits Mythos sauront apporter plus de réponses que de catastrophes !",isbn:"9782818976746",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818976746-475x500-1.jpg"},
  {t:"Hermès conditionné",a:"Cazenove",y:"DL 2021",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"La mythologie grecque revisitée avec un humour légendaire. Le pauvre Hermès ne s'en sort plus... En plus d'être le messager personnel de Zeus, il doit s'occuper des carrefours, des voyageurs, des voleurs, du commerce... et devinez qui doit conduire les morts aux Enfers ? Hermès, bien sûr ! Bref, même si ses sandales ailées lui permettent de courir plus vite qu'un éternuement de foudre, il aurait bien besoin d'un coup de main de nos Petits Mythos. Le hic, c'est que ceux-ci sont déjà bien occupés à libérer Io, leur copine changée en vache et surveillée par le terrible Argos, le gardien aux 100 yeux ! Qui a dit que Petit Mythos était un métier de tout repos ?",isbn:"9782818977163",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818977163-475x500-1.jpg"},
  {t:"A Troie, on lâche tout !",a:"Larbier",y:"DL 2022",ed:"Bamboo Edition",cote:"BDJ LAR",pub:"Jeune",sup:"Imprimé",d:"La mythologie grecque revisitée par un humour légendaire ! Sale période pour Achille. La mère d'un des plus grands héros de la mythologie grecque a peur pour son fils car elle a appris qu'il ne reviendra pas de la guerre. Elle décide de le déguiser en fille et de le planquer sur une île habitée uniquement par des femmes. Il faudra toute la ruse d'Ulysse pour démasquer son copain et le traîner avec lui pour se préparer à ce qui deviendra, des années plus tard, la guerre de Troie... Qui a dit que Petit Mythos était un métier de tout repos ?",isbn:"9782818994894",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818994894-475x500-1.jpg"},
  {t:"Micmac à la ferme",a:"Schmitt",y:"DL 2015",ed:"La Boîte à bulles",cote:"BDJ SCH",pub:"Jeune",sup:"Imprimé",d:"Qui, comme Léopold, n'a jamais rêvé de devenir invisible à volonté ? Un pouvoir étonnant qui lui permet de faire toutes sortes de bêtises et autres espiègleries. Cette fois-ci, c'est à la ferme que Léopold et sa soeur, Céline, se retrouvent, coincés chez Papy et Mamie pour les vacances ! Bien décidé à devenir Super-Léo pour libérer les animaux de la ferme et découvrir le mystérieux voleur qui sévit dans les environs, le dynamique Léopold n'en reste pas moins un farceur invétéré... C'est certain, au village, ils n'oublieront pas de sitôt Super-Léo !",isbn:"9782849532133",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782849532133-475x500-1.jpg"},
  {t:"Silence, Léo, ça tourne",a:"Schmitt",y:"DL 2024",ed:"La Boîte à bulles",cote:"BDJ SCH",pub:"Jeune",sup:"Imprimé",d:"En visite au musée, Céline est repérée pour rejoindre le casting de la prochaine série de Proflix. Intégrant une équipe de super héros affrontant des aliens pilleurs de trésors, elle interprétera bientôt le rôle de Zif, la fille la plus rapide du monde. Face à la célébrité grandissante de sa soeur, difficile pour Léopold de ne pas être jaloux. N'est-ce pas lui le véritable super héros ? Pire encore, il est obligé d'assister au tournage des aventures de ces héros de seconde zone ! Jamais à court de bêtises, il va mettre la zizanie dans les studios. Et c'est au détour d'un couloir qu'il fait une découverte de taille : des extra-terrestres déguisés en humains semblent préparer un complot visant à piller les trésors de l'humanité. S'agit-il d'un complot intergalactique ou Léopold fabule-t-il ? Parfois, la frontière entre fiction et réalité est floue et faire la part de choses n'est pas chose aisée.",isbn:"9782849535035",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782849535035-475x500-1.jpg"},
  {t:"Monstres à l'horizon",a:"Bloch",y:"DL 2024",ed:"Bayard éditions",cote:"BDJ BLO",pub:"Jeune",sup:"Imprimé",d:"SamSam est un superhéros qui vit sur une planète peuplée d'êtres extraordinaires, affrontant à la fois les dangers de l'espace et les problèmes d'une vie d'enfant. Ses aventures l'aident finalement à grandir et à devenir plus fort. SamSam revient à la télévision pour une nouvelle saison sur Okoo ! 20 épisodes réunis en 3 chapitres : - Plus fort que les monstres ! - Marchel 1er contre-attaque ! - L'amitié c'est sacré !",isbn:"9791036365379",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791036365379-475x500-1.jpg"},
  {t:"SamSam, Tome 01",a:"Bloch",y:"2026",ed:"Bayard éditions",cote:"BDJ BLO",pub:"Jeune",sup:"Imprimé",d:"Ensemble, SamPapa, SamMaman, SamSam et SamNounours affrontent tous les dangers et protègent la SamPlanète. Mais ils sont aussi très forts pour les bisous, les câlins et la rigolade ! SamSam, le plus petit des grands héros SamSam, le héros créé par Serge Bloch pour Pomme d'Api, est un enfant comme les autres : il aime jouer avec ses copains, regarder la télé un peu trop longtemps, faire des bêtises... et beaucoup moins ranger sa chambre ou obéir à ses parents ! Mais c'est aussi un superhéros qui part à l'aventure, découvre des planètes inconnues et joue avec des monstres bizarres ! Dans cette nouvelle présentation, les cases ont été agrandies, le texte est plus lisible et la lecture partagée plus simple : un classique à redécouvrir et offrir à tous les enfants de 3 à 7 ans ! SamSam, un héros à retrouver partout ! SamSam est publié tous les mois dans le magazine Pomme d'Api, il est aussi le héros d'un dessin animé diffusé sur France Télévisions, Netflix, YouTube et Okoo et d'un film sorti au cinéma, prix du public au festival Anima de Bruxelles. On le retrouve aussi sur Lumni, en collaboration avec Bayard jeunesse, dans une série sur le vivre-ensemble. SamSam, c'est aussi des histoires audio, des jouets, des jeux et des déguisements. Serge Bloch, l'auteur de SamSam, est aussi le scénariste de Zouk et Max et Lili, et le dessinateur de Toto. « SamSam est un personnage attachant, qui a la particularité de vivre sa vie de superhéros grâce à sa cape magique et son rayon spatial, tout en rencontrant les mêmes problèmes que tout petit Terrien de 6 ans : des lâches attaques de Pipiolis (certaines en plein jour !) à la difficulté de se séparer de son fidèle doudou... » Télérama",isbn:"9791036385292",extraUrl:"https://products-images.di-static.com/image/base/9791036385292-475x500-1.jpg"},
  {t:"Parvati",a:"Ogaki",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001966",extraUrl:"https://images.epagine.fr/966/9782413001966_1_m.jpg"},
  {t:"HONG KONG",a:"Ogaki",y:"2019",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Deux voleurs travaillant pour un receleur dérobent la tête de l'un des fameux soldats de la grande armée de terre cuite qui protège la tombe de Qin Shi Huang, premier empereur de Chine. Le fantôme de ce dernier est réveillé par le Mal. En quête d'alliés, il a besoin de l'empereur pour libérer le Chaos et accentuer sa domination sur le Monde. Mais les choses ne se passent pas comme il l'a prévu...",isbn:"9782413013082",extraUrl:"https://images.epagine.fr/082/9782413013082_1_m.jpg"},
  {t:"Gourmandise",a:"Ogaki",y:"2022",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Parvati débarque à Montréal chez son cousin qui cherche à mettre au point des pilules pour guérir l'obésité. Elle prend cependant le temps de se téléporter régulièrement pour retrouver les autres Mythics, en particulier Albi, qu'elle trouve un peu trop proche d'Amir à son goût. Mais l'heure n'est pas à la jalousie car le maléfique Wendigo cherche à contrefaire les recherches de son cousin. ©Electre 2022",isbn:"9782413041047",extraUrl:"https://products-images.di-static.com/image/base/9782413041047-475x500-1.jpg"},
  {t:"Réha",a:"Ogaki",y:"DL 2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Ils sont six ! Six héros pourvus d'armes sacrées, six héritiers des plus grands héros antiques. Leur mission : sauver notre monde ! On les appelle... les Mythics.",isbn:"9782413085126",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782413085126-475x500-1.jpg"},
  {t:"Pommes, poires, abricots",a:"La Croix",y:"2016",ed:"Delcourt",cote:"BDJ LAC",pub:"Jeune",sup:"Imprimé",d:"Une préadolescente s'interroge, s'inquiète et s'enthousiasme des transformations de son corps. ©Electre 2019",isbn:"9782756080215",extraUrl:"https://www.base-orb.fr/visuels-pim/image/base/9782756080215-475x500-1.jpg"},
  {t:"La base secrète",a:"Bocquet",y:"DL 2025",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeune",sup:"Imprimé",d:"La nuit, sur un toit, trois enfants déguisés en superhéros fuient des robots belliqueux. Le garçon glisse... et se tue ! Comment Ziad, Louna et Billie en sont arrivés là ? Pour comprendre, il faut remonter aux funérailles du père de Louna et Ziad quand frère et soeur s'étaient juré de ne plus tenter de devenir des superhéros. Une promesse qu'ils n'avaient pas tenue longtemps...",isbn:"9782808505116",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808505116-475x500-1.jpg"},
  {t:"La vision de Patchy",a:"Paré-Sorel, Julien",y:"DL 2024",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeune",sup:"Imprimé",d:"Désormais au fait de la machination maléfique de Tyratops, Rex est plus déterminé que jamais à mettre fin à son règne ! Or, le cruel empereur met tout en oeuvre pour le capturer et ses forces du mal gagnent en puissance de jour en jour. Même Patchy, maintenant sous l'emprise de la sorcière Ovi, est devenue une redoutable rivale ! Jusqu'où Rex et ses amis sont-ils prêts à aller afin de percer les sombres mystères du grand royaume de Mézoïk ?",isbn:"9782897518769",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518769-475x500-1.jpg"},
  {t:"La promesse de Tyratops",a:"Julien Paré-Sorel",y:"DL 2025",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeune",sup:"Imprimé",d:"L'heure est grave. Alors que Patchy est toujours sous l'emprise d'Ovi la sorcière et que la menace du retour des Titans se fait sentir, Rex s'est fait capturer par les sbires de Tyratops ! Il tentera d'infiltrer le repaire du sorcier maléfique afin de l'arrêter. Pendant ce temps, d'anciens alliés uniront leurs forces pour sauver les enfants du royaume de Mézoïk. Cependant, Tyratops a plus d'un tour dans son sac et sa patience tire à sa fin... Rex sera-t-il assez fort pour affronter les démons du passé ?",isbn:"9782897518806",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518806-475x500-1.jpg"},
  {t:"Un hiver sans fin",a:"Miila Westin",y:"DL 2025",ed:"Éditions Sarbacane",cote:"BDJ WES",pub:"Jeune",sup:"Imprimé",d:"Il neige encore en juin ! Alors que l'été refuse d'arriver, Eevi accompagne sa famille chez sa grand-mère pour trier les affaires de son grand-père récemment disparu. Se promenant près de la rivière, elle fait une rencontre pour le moins étonnante : un esprit de l'orge ! Il lui explique que l'esprit du printemps est retenu prisonnier par une terrible sorcière et qu'il suffit de le libérer pour mettre fin à cet interminable hiver. Eevi se retrouve alors dans les profondeurs de Tuonela, un monde peuplé de créatures magiques où l'on règle les problèmes à coups de puissants sortilèges !",isbn:"9791040807056",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040807056-475x500-1.jpg"},
  {t:"Carnet de potes",a:"Erroc",y:"DL 2025",ed:"Bamboo Edition",cote:"BDJ ERR",pub:"Jeune",sup:"Imprimé",d:"Plus forts que Zorro, plus courageux qu'Indiana Jones et bien moins payés que James Bond, ces enseignants de choc n'hésitent pas à braver quotidiennement la jungle étouffante des lycées peuplés de tribus d'élèves hostiles. Suivez le prof adepte de Napoléon, le prof de gym survitaminé, le prof de français sexy, le prof de philo blasé et la prof d'anglais peau de vache dans leur croisade contre l'ignorance et le poil dans la main !",isbn:"9791041112173",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791041112173-475x500-1.jpg"},
  {t:"Yuko",a:"Sobral",y:"DL 2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001928",extraUrl:"https://images.epagine.fr/928/9782413001928_1_m.jpg"},
  {t:"Amir",a:"Ogaki",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue",isbn:"9782413001935",extraUrl:"https://images.epagine.fr/935/9782413001935_1_m.jpg"},
  {t:"Miguel",a:"Sobral",y:"",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001959",extraUrl:"https://catalogue.bnf.fr/couverture?appName=NE&idImage=355910&couverture=1"},
  {t:"La tour des mensonges",a:"Sobral",y:"DL 2024",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Les Légendaires Résistance démarre 20 ans après le grand cycle des Légendaires. Le monde a vécu de belles années de paix mais aujourd'hui les descendants de nos héros doivent reprendre les armes pour défendre Alysia ! La lutte contre les Célestes continue. Malgré les soins de Toopie, Eloa détient toujours les pouvoirs du Dieu-Roi Akamandis. A terme, ceux-ci pourraient bien détruire tout Alysia... Nos héros ont besoin du peuple elfique pour la sauver. Seul obstacle : la tour de Fatamorgana, forteresse imprenable et meurtrière, qu'il leur faudra détruire pour accéder au monde des Elfes...",isbn:"9782413083139",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413083139-475x500-1.jpg"},
  {t:"L'escadron ravage",a:"Sobral",y:"DL 2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"La base d'Ultima est prise d'assaut par l'Escadron Ravage mené par Kalypso et son frère Kénian. Aidés des Magicors de Dame Kalandre, ils semblent inarrêtables... A mille lieux de là, de retour du Nirvanis, Galen et ses compagnons sont loin de se douter du drame qui se joue et des pertes subies dans leurs rangs. Le destin d'Alysia semble se jouer dans ce terrible affrontement.",isbn:"9782413087847",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782413087847-475x500-1.jpg"},
  {t:"Le dernier des fils",a:"Sobral",y:"DL 2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Les Légendaires Résistance démarre 20 ans après le grand cycle des Légendaires. Le monde a vécu de belles années de paix mais aujourd'hui les descendants de nos héros doivent reprendre les armes pour défendre Alysia ! Maintenant que tout Alysia sait que les lunes n'ont jamais été détruites par les Dieux, partout dans le monde on se révolte et se dresse contre l'envahisseur divin. Du côté de la résistance, l'ambiance est explosive et Toopie est contestée pour ses décisions qui ont mené à la mort tragique d'Amy. Les tensions menacent la résistance alors qu'un espion des Célestes a infiltré leur base.",isbn:"9782413088486",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413088486-475x500-1.jpg"},
  {t:"Gryfenfer",a:"Patrick Sobral / Nadou",y:"2014",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Récit du passé de Danaël, l'un des héros de Les Légendaires. D'un caractère impétueux, le jeune Faucon d'argent ne parvient pas à s'intégrer au corps d'armée dirigé par son frère. Prix Essentiel Jeunesse du meilleur album, Angoulême 2013",isbn:"9782756041278",extraUrl:"https://www.bedetheque.com/media/Couvertures/215609_c.jpg"},
  {t:"La fin de l'histoire ?",a:"Sobral",y:"2015",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"C'est l'énigmatique Kalandre qui, depuis le début de la série, provoque et manipule le destin de nos Légendaires. Ce tome 18 sera un épisode éprouvant, dramatique, qui verra les Légendaires malmenés dans leurs corps et dans leurs cœurs comme jamais ils ne l'ont été. Le final sera apocalyptique et meurtrier mais, tel le phénix, ce sera pour mieux faire renaître la série ensuite.",isbn:"9782756053578",extraUrl:"https://www.bedetheque.com/cache/thb_couv/Couv_256882.jpg"},
  {t:"World Without",a:"Sobral",y:"2017",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"En 2004 naquit ce qui allait devenir LE phénomène éditorial de la bande dessinée jeunesse du début du XXIe siècle : Les Légendaires. Dans ce tome 20, Artémus et ses compagnons auront fort à faire pour éviter le pire... C'est un grand jour à Orchidia ! Des quatre coins d'Alysia, les grands de ce monde sont venus assister à l'épreuve du bâtonaigle de Jadilyna qui désignera la princesse Shun-Day comme reine du royaume à la place de sa tante, l'impitoyable Invidia. Mais dans l'ombre de cet événement se trame une sombre machination qui pourrait bien finir en tragédie. Mais qui est visé par cet infâme complot ?",isbn:"9782756064765",extraUrl:"https://www.bedetheque.com/media/Couvertures/Couv_312707.jpg"},
  {t:"Razzia",a:"Sobral",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Avant de devenir l'un des cinq Légendaires mythiques, Razzia s'appelait Korbo, l'ombre rouge. Pour venger sa famille, il tue un à un les membres de l'armée des mille loups. Jusqu'au jour où il croise la route de Ténébris qui lui propose de créer un monde meilleur et de diriger à ses côtés l'armée de son père, Darkhell, le sorcier noir.",isbn:"9782756064789",extraUrl:"https://products-images.di-static.com/image/base/9782756064789-475x500-1.jpg"},
  {t:"Lyra",a:"Loyer",y:"DL 2026",ed:"Editions Casterman",cote:"J LOY",pub:"Jeune",sup:"Imprimé",d:"On dit que la musique adoucit les moeurs... dans cette famille, elle rapproche les soeurs ! Depuis des semaines, Lyra se prépare pour l'audition de flûte qui lui permettra d'impressionner Léonard Belcanto, son père chef d'orchestre... mais dans sa tête se joue une vraie tempête. Elle s'interroge sur l'absence d'attention de ce père qui refait sa vie de son côté et semble la remplacer, elle s'alarme de ne pas être prête le jour J et, pour couronner le tout, elle doit gérer les amours de sa soeur Antara avec le doux Virgile... Courageuse, assidue et attentive aux autres sans même s'en rendre compte, Lyra va tout faire pour que sa famille entière soit réunie lors de l'audition et s'assurer que ce petit monde reste accordé !",isbn:"9782203300156",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300156-475x500-1.jpg"},
  {t:"Le chat sauvage",a:"Luciani",y:"DL 2016",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeune",sup:"Imprimé",d:"Alors que Roussette, la petite renarde, se pose de plus en plus questions sur ses origines, un chat sauvage, accompagné de genettes, prépare un spectacle destiné à montrer son agilité dans les arbres. Mais ce chat dissimule un secret sur sa véritable identité ; un secret qui va aider Roussette à comprendre que sa nouvelle famille l'aime plus que tout. A travers cette histoire, les auteures abordent autant l'acceptation de la différence que l'idée de rester soi-même et de s'ouvrir aux autres. Le bonheur n'est jamais bien loin ! Chaque tome de la série sera dorénavant proposé à partir de 2026 en version souple à plus petit format (195 x 260) avec un bonus de huit pages supplémentaires (jeux, cahier didactique...). Le tout à petit prix !",isbn:"9782205074451",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205074451-475x500-1.jpg"},
  {t:"Le Porte-bonheur",a:"Luciani",y:"DL 2023",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeune",sup:"Imprimé",d:"- \"Moi je veux bien un porte-bonheur comme Martis\". - \"Quoi ? Ne me dis pas que tu crois à ces trucs ? \" Décidément, blaireaux et renards ne sont pas pareils. Et quand il s'agit des croyances, évidemment, ils ne sont jamais d'accord. Quand leur ami Martis arrive avec un porte-bonheur, Carcajou se moque et décide de prouver à tout le monde qu'il n'y a rien de magique dans ces amulettes en bois. Mais l'affaire n'est pas simple, l'expérience tourne mal et le doute s'installe. Si tout ça n'est qu'une question de hasard, comment se fait-il que certains semblent clairement plus chanceux que d'autres ? Avoir de la chance, finalement, à quoi ça tient ? Chaque tome de la série sera dorénavant proposé à partir de 2026 en version souple à plus petit format (195 x 260) avec un bonus de huit pages supplémentaires (jeux, cahier didactique...). Le tout à petit prix !",isbn:"9782205077964",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205077964-475x500-1.jpg"},
  {t:"A not so innocent deal",a:"Messina",y:"DL 2025",ed:"Fleurus",cote:"J MES",pub:"Adolescent",sup:"Imprimé",d:"A vingt-et-un ans, Catherine Fellingham découvre que sa famille risque la faillite et le scandale : pour régler les dettes de son époux, Lady Fellingham s'est enlisée dans une affaire de pots-de-vin. Catherine supplie la complice de sa mère, Lady Courtland, de mettre fin à ces manigances... mais, en contrepartie, elle doit accepter un arrangement : se livrer à une autre saison pour trouver un mari. Après trois années sans que le moindre prétendant s'intéresse à elle, Catherine accepte à contrecoeur. Lorsqu'elle découvre que le célèbre Lord Deverill a été chargé de feindre un intérêt pour elle pour que d'autres la remarquent... et qu'il juge cette mission impossible, Catherine décide que c'en est trop. Humiliée, elle compte rendre au marquis la monnaie de sa pièce et le prendre à son propre jeu. A moins, bien sûr, que son coeur n'en fasse qu'à sa tête...",isbn:"9782215199908",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215199908-475x500-1.jpg"},
  {t:"Myrmidon sous les mers",a:"Dauvillier",y:"DL 2024",ed:"Editions de la Gouttière",cote:"BDJ DAU",pub:"Jeune",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même... C'est quoi Myrmidon ? Une série de bande dessinée sans texte, créative, drôle, et poétique à lire dès 2 ans, en autonomie ou avec un accompagnement !",isbn:"9782357961050",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782357961050-475x500-1.jpg"},
  {t:"Le temps suspendu",a:"Bocquet",y:"DL 2024",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeune",sup:"Imprimé",d:"Ziad et Louna ont réussi tous les deux à se faire inviter aux Golden Powers, la soirée des récompenses pour superhéros. Mais la cérémonie ne se déroule pas tout à fait comme prévu : un pod de téléportation apparaît sur scène et des yeux géants en jaillissent et commencent à tirer dans la foule. C'est un vrai carnage parmi les superhéros présents. Ziad et Louna arrivent à fuir par le pod et se retrouvent en plein océan. Et Louna se noie... Fatiah et Amine, les parents de Ziad et Louna qui ont assisté, impuissants et tétanisés, à la retransmission télévisée du chaos et de l'horreur, sont interrogés par la police qui soupçonne leurs deux enfants d'êtres des \" supers \" ! Amine et Fatiah décident de prendre les choses en mains et s'incrustent dans l'enquête de police au grand dam de l'inspectrice qui la dirige. Dans Le Métier le plus dangereux du monde, Olivier Bocquet et Fabio Lai nous présentent une société légèrement futuriste où même les superhéros sont pervertis par l'argent et les réseaux sociaux. Ca n'empêche pas la série d'être passionnante, trépidante, émouvante et drôle. De la BD jubilatoire !",isbn:"9791034768578",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791034768578-475x500-1.jpg"},
  {t:"Revenez, amis martiens !",a:"Thinard",y:"DL 2026",ed:"Thierry Magnier",cote:"J THI",pub:"Adolescent",sup:"Imprimé",d:"Quand Eva, une collégienne solitaire et harcelée, recueille deux chats errants miraculeusement sauvés des eaux, elle ignore qu'elle se trouve face à FWFX et WDWC, des extraterrestres en mission secrète sur Terre. Nom de Mars, cette rencontre va changer sa vie ! C'est le début d'une aventure pleine de rebondissements, de télescopages improbables et de répliques inoubliables. Prêts, bande de schmulaââgs ramollis ? ! Des chats venus d'une autre planète, une ado en détresse, une vache complice : un roman aussi déjanté que jubilatoire !",isbn:"9791035209308",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209308-475x500-1.jpg"},
  {t:"L'école des superhéros",a:"Bloch",y:"2022",ed:"BD Kids",cote:"J BLO",pub:"Jeune",sup:"Imprimé",d:"Le super-héros SamSam fait sa rentrée des classes, avec sa maîtresse Marie-Agnès, qu'il adore, et ses camarades de l'école. ©Electre 2022",isbn:"9791036350504",extraUrl:"https://products-images.di-static.com/image/base/9791036350504-475x500-1.jpg"},
  {t:"Un rêve dangereux",a:"Miila Westin",y:"DL 2026",ed:"Éditions Sarbacane",cote:"BDJ WES",pub:"Jeune",sup:"Imprimé",d:"L'été n'a pas été de tout repos pour Eevi : elle a sauvé le monde d'un hiver sans fin en libérant l'esprit du printemps... Et voilà que son ami, le gnome Otso, fait irruption dans sa chambre pour lui demander de l'aider à sauver sa soeur, victime d'une malédiction. Eevi et Otso partent pour le monde des gnomes. Mais attention, la terrible sorcière Louhi et ses affreux lutins sont à leurs trousses...",isbn:"9791040807063",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040807063-475x500-1.jpg"},
  {t:"Myrmidon et la grotte mystérieuse",a:"Dauvillier",y:"2016",ed:"les Éditions de la Gouttière",cote:"BDJ DAU",pub:"Jeune",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même... Vêtu d'une peau de bête et lance en main, Myrmidon se retrouve projeté à l'époque de la Préhistoire, mais attention à l'effrayant tigre aux dents de sabre...",isbn:"9791092111415",extraUrl:"https://products-images.di-static.com/image/base/9791092111415-475x500-1.jpg"},
  {t:"Myrmidon et la bête de la montagne",a:"Dauvillier",y:"DL 2018",ed:"les Éditions de la Gouttière",cote:"BDJ DAU",pub:"Jeune",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même...",isbn:"9791092111828",extraUrl:"https://images.epagine.fr/828/9791092111828_1_m.jpg"},
  {t:"Le Cataclysme",a:"Aupied",y:"DL 2026",ed:"Gallimard",cote:"J AUP",pub:"Adolescent",sup:"Imprimé",d:"Eléments déchaînés, tentation du mal et destins tragiques : un final fracassant pour ce diptyque de fantasy. A peine sortis de Fort-Ressac, les Azuriens se retrouvent prisonniers au fond d'une grotte. Hors de question pour Nérée de les laisser dépérir comme de vieilles algues séchées ! Il convainc donc ses amis de repartir à l'aventure. Objectif : s'assurer contre les Pyres le soutien de Ryk, la plus terrible des prodiges. Alors que menace rien de moins que la fin du monde, Nérée est déterminé à être le héros de l'histoire. Quitte à affronter le Cataclysme, et peut-être même à perdre ses amis.",isbn:"9782075236096",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075236096-475x500-1.jpg"},
  {t:"Le voyage dans le temps",a:"Mallorquí",y:"DL 2026",ed:"Editions Casterman",cote:"J MAL",pub:"Jeune",sup:"Imprimé",d:"Une suite attendue pour la série à succès ! Quand un bébé nommé Kid est laissé à l'entrée de l'école Zener, Axel est loin de s'imaginer qu'il s'apprête à vivre sa plus folle aventure ! Car si le bambin semble a priori inoffensif, il est capable de voyager à travers le temps et l'espace. C'est ainsi qu'Axel, Lola et Treize se retrouvent malgré eux projetés d'une bataille médiévale à la destruction de Pompéi au péril de leurs vies... Mais la situation dégénère encore quand des créatures tout droit sorties de la préhistoire commencent à apparaître dans le pensionnat. Le temps presse, Axel et ses amis doivent trouver un moyen d'arrêter cet enfant avant qu'il ne détruise l'école !",isbn:"9782203300187",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300187-475x500-1.jpg"},
  {t:"Une journée avec Lucy",a:"Geronimo Stilton / Béatrice Didiot",y:"DL 2026",ed:"Albin Michel",cote:"J DAM",pub:"Jeune",sup:"Imprimé",d:"UNE AVENTURE AU COEUR DE LA PREHISTOIRE EN COMPAGNIE DES PREMIERS AUSTRALOPITHEQUES ! Par cent mille mimolettes, jamais je n'aurais imaginé me retrouver dans la savane africaine trois millions d'années plus tôt, en compagnie de Lucy, l'australopithèque ! Alors que ma nouvelle amie me fait découvrir son monde, son bébé est kidnappé. Nous voici lancés dans une course-poursuite pour le sauver... si on échappe aux prédateurs et au volcan qui s'est réveillé !",isbn:"9782226508263",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226508263-475x500-1.jpg"},
  {t:"Les mystères de Sinclair. Le vol du moineau d'or",a:"Woodfine",y:"DL 2026",ed:"Poulpe fictions",cote:"J WOO",pub:"Jeune",sup:"Imprimé",d:"Bienvenue chez Sinclair, le plus grand et le plus élégant magasin de Londres ! Sophie, une jeune orpheline débrouillarde, vient d'y être embauchée comme vendeuse. A elle les robes en soie, les chapeaux à plumes et les vitrines somptueuses ! Mais le rêve tourne au cauchemar lorsque l'inestimable Moineau d'Or y est volé... et que Sophie est accusée ! Accompagnée de Billy, garçon d'étage fan de romans policiers, et de Lil, mannequin qui rêve de devenir actrice, réussira-t-elle à faire éclater la vérité ?",isbn:"9782377424405",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782377424405-475x500-1.jpg"},
  {t:"L'automne des aspirants",a:"Puysségur",y:"DL 2023",ed:"Scrineo",cote:"J PUY",pub:"Adolescent",sup:"Imprimé",d:"Qui a dit que les chats ne pouvaient pas faire de la magie ? Suivez les premières aventures de Kovhan, Bruyne, Lexios et Serenya, et découvrez avec eux les secrets du Manoir de Castlecatz... \" Il n'existe pas d'endroit plus prestigieux que le Manoir de Castlecatz pour étudier les arts occultes de la magie. C'est à Castlecatz que les Maggocatz les plus puissants sont formés. Mais pas seulement. Les meilleurs Mécanimateurs et les plus grands Alchimistes y étudient également depuis des siècles. \" Une nouvelle année de cours débute au Manoir de Castlecatz ! Kovhan rêve depuis toujours d'y entrer et de devenir Aspirant. Mais pour lui qui maîtrise si mal l'indispensable Maggocculture, triompher des épreuves d'admission n'est pas une tâche facile... Il y a pourtant pire. Une menace plane sur Castlecatz cet automne : des incidents magiques se multiplient, certains félins rapportent même avoir aperçu une horrible créature rôder dans les couloirs... Heureusement, le jeune chat peut compter sur Bruyne, son amie gourmande et malicieuse, ainsi que sur Lexios et Serenya, toujours prêts à lui filer un coup de patte !",isbn:"9782381672854",extraUrl:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782381672854-475x500-1.jpg"},
  {t:"Echec à la reine",a:"Ilesi",y:"DL 2026",ed:"Scrineo",cote:"J ILE",pub:"Adolescent",sup:"Imprimé",d:"Terrasul est dirigé par des reines masquées érigées au rang de divinités. La princesse Viviane est amenée à régner. En attendant, chaque été, ses parents l'envoient loin du palais pour qu'elle puisse vivre encore quelques moments d'insouciance. Elle y rencontre Andreas à qui elle est forcée de cacher sa véritable identité. Et ils tombent amoureux. Malheureusement, leurs devoirs respectifs finissent par les séparer. Car le jeune homme porte lui aussi de lourds secrets. Des années plus tard, Viviane se prépare à défendre son reinaume en guerre. Et se retrouve confrontée au spectre de ses décisions passées... Amour, trahison, complots, pouvoir... un roman magistral porté par de magnifiques personnages, confrontés à des choix impossibles...",isbn:"9782381674926",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782381674926-475x500-1.jpg"},
  {t:"La Griffe de Sylvemorne",a:"Wilkinson",y:"DL 2026",ed:"Saxo",cote:"J WIL",pub:"Jeune",sup:"Imprimé",d:"Une petite souris. Une grande quête. Pour sauver Alluria de la destruction, Fluette a quitté la protection de son village. Elle a suivi son coeur... jusque dans un marécage lugubre ! Or, les créatures qui peuplent cet endroit ne sont pas aimables DU TOUT. Mais face à un monstre recouvert de mousse et une tortue diabolique, que peut bien faire une petite souris ? Peu importe les obstacles, Fluette se montrera à la hauteur !",isbn:"9782385701628",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701628-475x500-1.jpg"},
  {t:"L'Aube des dragons",a:"Mancusi",y:"DL 2026",ed:"Saxo",cote:"J MAN",pub:"Adolescent",sup:"Imprimé",d:"Les dragons arrivent. Etes-vous prêts ? Le monde extérieur est devenu dangereux. Des incendies ravagent les terres et rendent l'air quasiment irrespirable. Comme tous les habitants de sa ville, Lucas est donc forcé de passer la majorité de son temps à la maison. Son ami Noah est persuadé que des dragons sont à l'origine des feux, mais Lucas a du mal à y voir plus que des théories du complot... Pourtant, quand la famille de Noah quitte précipitamment la région et que de mystérieux agents débarquent pour fouiller leur maison, Lucas commence à se demander si son ami n'approchait pas de trop près de la vérité. Décidé à connaître le fond de l'histoire, le jeune garçon fait alors une découverte qui menace de tout embraser...",isbn:"9782385701659",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701659-475x500-1.jpg"},
  {t:"Le jour où je suis devenue plus méchante que le loup",a:"Javaux",y:"DL 2026",ed:"Mijade",cote:"J JAV",pub:"Jeune",sup:"Imprimé",d:"Dans mon école, il y a un méchant loup. Elle s'appelle Agnès et se déplace toujours avec sa meute. Pour que ses moqueries cessent et avoir moi aussi des super copines... je suis devenue plus méchante que le loup.",isbn:"9782807702752",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782807702752-475x500-1.jpg"},
  {t:"TKT",a:"Arca",y:"DL 2026",ed:"Rouergue",cote:"J ARC",pub:"Adolescent",sup:"Imprimé",d:"Alors qu'il attend sa copie de brevet blanc, Tristan stresse, sa note va peser lourd dans son orientation. Trop mauvaise = filière professionnelle. Pas trop mauvaise = filière générale. Et alors qu'il attend, Tristan pense à Ava. Qu'est-ce qui a bien pu se passer entre eux ? Pourtant, c'était bien au début. Alors pourquoi, elle ne veut plus lui parler ? Au fond de lui, Tristan sait. Et c'est en attendant cette note, celle qui fera prendre ou pas un virage à sa vie d'ado, que les souvenirs remontent petit à petit. Ava est dans tous. C'est normal, Ava occupait toutes ses pensées. Ava occupe toujours ses pensées...",isbn:"9782812627873",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782812627873-475x500-1.jpg"},
  {t:"La folle idée de Suzette la Mouette",a:"Carquain",y:"DL 2026",ed:"La Joie de lire",cote:"J CAR",pub:"Jeune",sup:"Imprimé",d:"Quand Suzette la mouette rieuse et Niko le corbeau parisien débarquent en Normandie, c'est la surprise générale. Leur duo a de quoi étonner : l'une, fantasque et excessive, a toujours le bec ouvert, tandis que l'autre est calme et réfléchi. Mais pour les autres mouettes et goélands, il est surtout interdit de se mélanger entre oiseaux des villes et oiseaux des mers ! Niko parviendra-t-il à se faire une petite place sur la plage ? Son amitié avec Suzette survivra-t-elle à cette épreuve ?",isbn:"9782889860562",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782889860562-475x500-1.jpg"},
  {t:"Le palais de sang",a:"June Hur / Marion Roman",y:"DL 2025",ed:"Bayard éditions",cote:"J HUR",pub:"Jeune",sup:"Imprimé",d:"Corée, 1758. Fille illégitime, Hyeon, 18 ans, a réussi à devenir infirmière au palais à force de travail et d'acharnement. Elle n'a d'autre but que d'effectuer son métier discrètement et, peut-être, gagner enfin l'approbation de son père. Lorsque quatre femmes sont sauvagement assassinées en une nuit et que sa mentor est accusée, Hyeon décide d'enquêter en secret pour prouver son innocence. Elle croise alors la route d'Eojin, un jeune inspecteur. Ensemble, ils plongent dans les recoins les plus sombres du palais. Mais les secrets mortels qu'ils découvrent les mènent vers une piste sanglante et dangereuse... Une immersion palpitante dans la Corée impériale Entre secrets d'Etat, romance naissante et condition féminine, Le palais de sang est un thriller historique aussi haletant qu'émouvant. A la manière des k-dramas, il mêle thriller et amour sur fond de décors somptueux et de tensions politiques. Porté par la plume précise et sensible de June Hur, ce récit envoûtant dévoile les rouages du pouvoir à travers une héroïne forte, lucide et bouleversante. Pour vibrer entre enquête et émotion Ce roman dès 13 ans invite à explorer une culture fascinante, tout en posant des questions très actuelles : comment s'imposer quand on ne rentre dans aucune case ? Comment distinguer le vrai du faux quand tout semble masque et manipulation ? Lauréat du prestigieux Prix Edgar Allan Poe 2023, ce texte mêle brillamment quête de justice, recherche d'identité et premiers émois.",isbn:"9791036373381",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791036373381-475x500-1.jpg"},
  {t:"Voisines",a:"Debrocq",y:"DL 2025",ed:"Bayard éditions",cote:"J DEB",pub:"Jeune",sup:"Imprimé",d:"Qui n'a jamais rêvé d'habiter en face de sa meilleure amie ? Lou et Lila sont meilleures amies depuis toujours, tout comme leurs mères. Elles vivent de part et d'autre d'une rue tranquille de Bruxelles. Ensemble, leurs deux famille forment une grande tribu de coeur. Soirées d'été, vacances à la campagne, sorties au parc : inséparables ! Et puis un jour, tout bascule. Désormais, ce sera chacun chez soi. Lou, désemparée, veut comprendre : où sont passés les liens qu'on pensait plus forts que tout ? Un roman très actuel : l'histoire d'amitié bouleversante entre deux fillettes à l'aube de l'adolescence Une plongée très juste au coeur de l'évolution d'une enfant, de ses 9 à ses 13 ans, avec ses métamorphoses, ses émotions, ses incertitudes.",isbn:"9791036374241",extraUrl:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791036374241-475x500-1.jpg"},
  {t:"Chansons des bois",a:"Piercey",y:"DL 2025",ed:"Gallimard",cote:"841 PIE",pub:"Jeune",sup:"Imprimé",d:"La forêt regorge de magie et de poésie à observer et à méditer au travers de ces 40 chansons des bois. Papa ours invite son ourson à se laisser bercer par les secrets de la nature et à partager la délicatesse de chaque instant, même infime. Aube, rosée ou champignon, chaque élément est célébré. Il y a tant de merveilles à découvrir !",isbn:"9782075211864",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075211864-475x500-1.jpg"},
  {t:"L'Exilée",a:"De Castell",y:"DL 2026",ed:"Gallimard",cote:"J DEC",pub:"Adolescent",sup:"Imprimé",d:"Le dernier tome des aventures de Furia Perfax, l'héroïne que rien n'arrête. Un univers de fantasy sombre et fascinant, entre action spectaculaire et humour incisif ! En libérant la belle Arissa des geôles berabesa, Furia fait la rencontre de Chedran, l'un des derniers Mahdek. Déchirée entre son amour naissont et l'appel de ses origines, elle est confrontée à un choix qui pourrait sceller son avenir et celui de son peuple.",isbn:"9782075215251",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075215251-475x500-1.jpg"},
  {t:"Titanic",a:"Boudeville",y:"DL 2026",ed:"Fleurus",cote:"J BOU",pub:"Adolescent",sup:"Imprimé",d:"Le 11 avril 1912, le Titanic s'élance en direction de New York avec, à son bord, plus de deux mille personnes. Parmi eux, Ernest ainsi que Juliette et sa famille, tous pleins d'espoir et de rêves. Mais, dans la nuit du 14 au 15 avril, l'impensable arrive : après avoir heurté un iceberg, le paquebot coule petit à petit dans les eaux glaciales de l'Atlantique. Ernest et Juliette vont alors devoir unir leurs forces et faire preuve d'un courage extraordinaire pour survivre et tenter de sauver des enfants perdus dans le chaos du naufrage.",isbn:"9782215197416",extraUrl:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215197416-475x500-1.jpg"},
  {t:"Eiao",a:"Marin Ledun",y:"DL 2026",ed:"Au vent des îles",cote:"J LED",pub:"Adolescent",sup:"Imprimé",d:"En Polynésie, dans Les années 1970, La France mène des essais nucléaires qui meurtrissent la région et mettent en danger ses habitants ainsi que sa faune et sa flore. Quand elle arrive à Eiao en 1972, à 19 ans, Simone pense avoir été embauchée par une compagnie de forage minier, mais L'Arvecom semble cacher ses véritables intentions... Au contact d'autres employés et du mystérieux Tahi, elle s'engage dans une Lutte qui La dépasse. En explorant les îles des Marquises et la jeunesse de la mère du futur lieutenant Morel de son roman Henua, Marin Ledun plonge dans un passé tourmenté et tumultueux, et nous entraîne dans une histoire d'amour radioactive.",isbn:"9782367346540",extraUrl:"https://products-images.di-static.com/image/orb-ef67b8aadc689cbb3d743f72577b9d21/9782367346540-475x500-1.jpg"},
