  {t:"Moi, quand je me réincarne en Slime - Tome 30",a:"Kawakami Taiki",y:"2026",ed:"Kurokawa",cote:"BD MOI",pub:"Jeune",sup:"Imprimé",d:"Comment un slime devient le seigneur du royaume ! Limule affronte Yûki, manipulé par le pouvoir de Mariabell, mais comprend qu'il n'arrivera pas à le libérer de son emprise. Alors que le duel bat son plein, ils sont interrompus de façon plutôt inattendue. Millim est partie rejoindre le dragon du chaos, et pendant ce temps, Mariabell s'est volatilisée... La situation évolue rapidement sur plusieurs fronts à la fois. Comment Limule fera-t-il face à cette crise ?",isbn:"9791042021825",img:"https://covers.openlibrary.org/b/isbn/9791042021825-M.jpg"},
  {t:"Le gardien de la forêt",a:"Di Gregorio Giovanni",y:"2025",ed:"Dupuis",cote:"BDJ DIG",pub:"Jeune",sup:"Imprimé",d:"Quelque chose se cache au fond des bois. Quelque chose qui dort sous les feuilles sèches, enveloppé par les murmures du vent... et que les Grémillet s'apprêtent à réveiller, alors qu'elles découvrent la gare désaffectée où leur mère passait ses étés lorsqu'elle était jeune. Entre légendes anciennes, amours oubliées et un mystérieux enfant sans nom, les trois soeurs devront résoudre une énigme resurgie des brumes du passé. Mais cette fois, elles ne seront pas seules, le gardien de la forêt surveille chacun de leurs pas. Est-il hostile ou bienveillant ? Va-t-il les empêcher de mener leur enquête ? Mais la véritable épreuve qui les attend sera d'une toute autre nature...",isbn:"9782808510462",img:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782808510462-475x500-1.jpg"},
  {t:"Pommes, poires, abricots",a:"La Croix Séverine de",y:"2016",ed:"Delcourt",cote:"BDJ LAC",pub:"Jeune",sup:"Imprimé",d:"Une préadolescente s'interroge, s'inquiète et s'enthousiasme des transformations de son corps. ©Electre 2019",isbn:"9782756080215",img:"https://www.base-orb.fr/visuels-pim/image/base/9782756080215-475x500-1.jpg"},
  {t:"Spy X Family",a:"Endo Tatsuya",y:"2026",ed:"Kurokawa",cote:"BD SPY",pub:"Jeune",sup:"Imprimé",d:"Sauvez le monde avec l'élite des agents (très) spéciaux : la famille Forger ! Une comédie d'espionnage pétillante ! Loid a l'opportunité de se renseigner lors d'une consultation de Melinda. Quels secrets de Donovan Desmond lui seront dévoilés ? A la rentrée scolaire, Anya se retrouve dans des classes différentes en fonction de son niveau. Cela l'amène à être impliquée dans un conflit international !",isbn:"9791042021030",img:"https://covers.openlibrary.org/b/isbn/9791042021030-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2026",ed:"Nobi Nobi",cote:"BD BLO",pub:"Jeune",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n'accueillir que des cancres, est tombé amoureux de Kaoruko Waguri, qui fréquente un établissement pour fi lles de bonne famille, Kikyô. Alors qu'ils profi tent de leur première sortie en amoureux depuis la fi n des grandes vacances, ils sont aperçus par quatre fi lles de Kikyô. Inquiètes pour leur camarade, les lycéennes se montrent fortement opposées à cette relation. Mais grâce à la présence de Madoka Yuzuhara, une jeune fi lle qui ne porte aucun préjugé aux élèves de Chidori, elles décident tout de même de rencontrer Rintarô... Le fossé profondément ancré entre les deux écoles serait-il sur le point d'être comblé ? Roméo et Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions !",isbn:"9782384967070",img:"https://covers.openlibrary.org/b/isbn/9782384967070-M.jpg"},
  {t:"Miguel",a:"Sobral Patrick",y:"",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001959",img:"https://catalogue.bnf.fr/couverture?appName=NE&idImage=355910&couverture=1"},
  {t:"Réha",a:"Ogaki Philippe",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Ils sont six ! Six héros pourvus d'armes sacrées, six héritiers des plus grands héros antiques. Leur mission : sauver notre monde ! On les appelle... les Mythics.",isbn:"9782413085126",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782413085126-475x500-1.jpg"},
  {t:"HONG KONG",a:"Ogaki Philippe",y:"2019",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Deux voleurs travaillant pour un receleur dérobent la tête de l'un des fameux soldats de la grande armée de terre cuite qui protège la tombe de Qin Shi Huang, premier empereur de Chine. Le fantôme de ce dernier est réveillé par le Mal. En quête d'alliés, il a besoin de l'empereur pour libérer le Chaos et accentuer sa domination sur le Monde. Mais les choses ne se passent pas comme il l'a prévu...",isbn:"9782413013082",img:"https://images.epagine.fr/082/9782413013082_1_m.jpg"},
  {t:"Amir",a:"Ogaki Philippe",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue",isbn:"9782413001935",img:"https://images.epagine.fr/935/9782413001935_1_m.jpg"},
  {t:"La chasse aux stryges",a:"Fontaine Maxime",y:"2024",ed:"Jungle",cote:"BDJ FON",pub:"Jeune",sup:"Imprimé",d:"Mina et Khoren sont les souffre-douleur des brutes et de la peste de leur collège. Un jour, une femme masquée les aiguille vers l'étrange bureau des injustices, une mystérieuse organisation peuplée de monstres amusants, qui prétend réparer les torts que l'on subit. Un agent prénommé Gary se charge de leur dossier, et transforme leurs tortionnaires en poètes sensibles ou en ballons de baudruche. D'abord ravis, Mina et Khoren découvrent que certains cas sont les plus épineux que d'autres, et que bien souvent la vengeance fait naître d'autres vengeances...",isbn:"9782822241342",img:"https://covers.openlibrary.org/b/isbn/9782822241342-M.jpg"},
  {t:"L'Atelier des Sorciers",a:"Shirahama Kamome",y:"2026",ed:"Pika édition",cote:"BD ATE",pub:"Jeune",sup:"Imprimé",d:"Coco et les sorciers ont établi un plan pour stopper la sangsue-rideau qui déferle sur la ville. Malheureusement, l'opération semble vouée à l'échec à cause des intempéries. Mais Coco a une idée et elle se précipite vers le danger avec Agathe pour tenter de régler la situation... Le plan va-t-il être finalement couronné de succès ?",isbn:"9791043307751",img:"https://covers.openlibrary.org/b/isbn/9791043307751-M.jpg"},
  {t:"A sign of affection",a:"Morishita Suu",y:"2026",ed:"Akata",cote:"BD SIG",pub:"Jeune",sup:"Imprimé",d:"Charmée par l'affection qu'Itsuomi lui porte de jour en jour, Yuki prend la décision de concrétiser leur amour. Toujours plus complice, le couple se prépare même à partir en voyage à l'étranger. Toutefois, après avoir appris que Shin et Ema sortaient ensemble dans l'optique de se marier, un doute émerge dans l'esprit de Yuki : quelle place son amoureux lui réserve-t-il dans son avenir ? A Sign of Affection décrit avec pudeur et simplicité l'histoire d'amour entre une jeune femme sourde et un grand voyageur. A n'en pas douter, les personnages de ce manga ne manqueront pas de vous émouvoir !",isbn:"9782385692964",img:"https://covers.openlibrary.org/b/isbn/9782385692964-M.jpg"},
  {t:"Honey Lemon Soda T15",a:"Murata Mayu",y:"2026",ed:"Nobi Nobi",cote:"BD HON",pub:"Jeune",sup:"Imprimé",d:"Uka Ishimori et Kai Miura filent le parfait amour depuis plus d'un an. La classe verte des terminales approche à grands pas ! S'agissant du dernier événement scolaire de ses années lycée, Uka attend ce séjour avec impatience... Mais voilà que les problèmes s'enchaînent juste avant le départ ! Le voyage se passera-t-il comme prévu ? Cinq nuits et quatre jours auprès de la personne qu'on aime, que peut-on rêver de mieux ?",isbn:"9782384966646",img:"https://covers.openlibrary.org/b/isbn/9782384966646-M.jpg"},
  {t:"Eclair de génie",a:"Zidrou",y:"2025",ed:"Le Lombard",cote:"BDJ ZID",pub:"Jeune",sup:"Imprimé",d:"Léonard voit les choses en grand, très grand ! son dernier projet ? Fonder la Siliconval(i) du Moyen Age et révolutionner les télécoms avec sa société Génie.com. Crypto-monnaie, panneaux solaires et OGM s'invitent à la ferme, avec le génie farfelu du Maître et la maladresse légendaire du disciple. Un concentré d'humour absurde et d'inventions (presque) révolutionnaires, signé par la série culte qui défie la logique depuis 56 tomes.",isbn:"9782808212465",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808212465-475x500-1.jpg"},

  {t:"Woke Up Like This",a:"Lea Amy",y:"2026",ed:"Flammarion",cote:"J LEA",pub:"Adolescent",sup:"Imprimé",d:"Organiser le bal de promo parfait est la dernière tâche parfaite à accomplir sur la liste parfaite de Charlotte Wu. Tout irait bien si l'insupportablement désinvolte (et très beau) J. T. Renner, n'avait pas décidé de lui gâcher la vie jusqu'au bout en devenant président du comité des élèves... De rivalités en sarcasmes, un \"accident de décoration\" survient et vingt-quatre heures plus tard, tous deux se réveillent côte à côte dans un lit inconnu : ils ont 30 ans et ils sont fiancés ! Passer à l'âge adulte, savourer le moment présent : une comédie romantique pétillante et irrésistible.",isbn:"9782080493712",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782080493712-475x500-1.jpg"},

];

// Palettes par public visé
const PALETTES = {
  'Jeunesse':   { accent:'#d4782a', tagBg:'#fdf0e6' },  // orange chaud
  'Adolescent': { accent:'#3a6ea8', tagBg:'#e6eef8' },  // bleu
  'Tout public':{ accent:'#3d6b4f', tagBg:'#e8f0eb' },  // vert (défaut)
};
function getPalette(pub){
  return PALETTES[pub] || PALETTES['Tout public'];
}

// Interleave par type de support pour alterner au maximum
function interleave(slides){
  const buckets = {};
  slides.forEach(s => {
    const key = s.sup || 'Imprimé';
    if(!buckets[key]) buckets[key] = [];
    buckets[key].push(s);
  });
  // Mélanger chaque bucket
  Object.values(buckets).forEach(b => {
    for(let i=b.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [b[i],b[j]]=[b[j],b[i]];
    }
  });
  // Round-robin entre les buckets
  const keys = Object.keys(buckets);
  const result = [];
  let more = true;
  while(more){
    more = false;
    keys.forEach(k => {
      if(buckets[k].length){
        result.push(buckets[k].shift());
        more = true;
      }
    });
  }
  return result;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Mélange les slides
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

// Teste chaque image en conditions réelles de navigateur avant de
// construire les slides (même principe que la mosaïque : certaines URLs
// passent une vérification serveur mais échouent quand même à charger
// depuis le navigateur -- ne jamais afficher un cadre vide à l'écran).
function imageChargeable(url){
  return new Promise(resolve=>{
    if(!url){ resolve(false); return; }
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function construirePoolValide(slides){
  const resultats = await Promise.all(slides.map(async s => ({s, ok: await imageChargeable(s.img)})));
  return resultats.filter(r => r.ok).map(r => r.s);
}

let pool = [];
let current = 0;
let timer = null;
let progTimer = null;

function buildSlide(data){
  const slide = document.createElement('div');
  slide.className = 'slide';
  // Appliquer la palette selon le public
  const pal = getPalette(data.pub);
  slide.style.setProperty('--c-accent', pal.accent);
  slide.style.setProperty('--c-tag-bg', pal.tagBg);

  // Badge public
  const badge = document.createElement('div');
  badge.className = 'pub-badge';
  badge.textContent = data.pub || 'Jeunesse';

  // Colonne gauche
  const cover = document.createElement('div');
  cover.className = 'slide-cover';

  const blur = document.createElement('div');
  blur.className = 'slide-cover-blur';
  blur.style.backgroundImage = `url(${data.img})`;

  const img = document.createElement('img');
  img.src = data.img;
  img.alt = data.t;
  img.onerror = () => { cover.style.background = '#ddd8d0'; img.style.display='none'; };

  cover.appendChild(blur);
  cover.appendChild(badge);
  cover.appendChild(img);

  // Colonne droite
  const info = document.createElement('div');
  info.className = 'slide-info';

  const label = document.createElement('div');
  label.className = 'slide-label';
  label.textContent = 'Nouvelle acquisition';

  const title = document.createElement('div');
  title.className = 'slide-title';
  title.textContent = data.t || '';

  const author = document.createElement('div');
  author.className = 'slide-author';
  author.textContent = data.a || '';

  const meta = document.createElement('div');
  meta.className = 'slide-meta';
  const parts = [];
  if(data.y) parts.push(data.y);
  if(data.ed) parts.push(data.ed);
  meta.textContent = parts.join(' · ');

  const summary = document.createElement('div');
  summary.className = 'slide-summary';
  summary.textContent = data.d || '';

  // Tags
  const tags = document.createElement('div');
  tags.className = 'slide-tags';

  const tagData = [
    {label:'Cote', val:data.cote},
    {label:'Support', val:data.sup},
  ];
  tagData.forEach(td => {
    if(!td.val) return;
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.innerHTML = `<span>${esc(td.label)}</span><strong>${esc(td.val)}</strong>`;
    tags.appendChild(tag);
  });

  info.appendChild(label);
  info.appendChild(title);
  if(data.a) info.appendChild(author);
  if(parts.length) info.appendChild(meta);
  if(data.d) info.appendChild(summary);
  info.appendChild(tags);

  slide.appendChild(cover);
  slide.appendChild(info);
  return slide;
}

const stage = document.getElementById('stage');
const fill = document.getElementById('progress-fill');
const counter = document.getElementById('counter');

let builtSlides = [];

function showSlide(idx){
  builtSlides.forEach((s,i) => {
    s.classList.toggle('active', i === idx);
  });
  counter.textContent = (idx+1) + ' / ' + pool.length;
  // Mettre à jour la couleur de la barre selon le public du slide actif
  const pal = getPalette(pool[idx].pub);
  fill.style.background = pal.accent;
  document.getElementById('progress-bar').style.background = pal.accent + '33';
  startProgress();
}

function startProgress(){
  fill.style.transition = 'none';
  fill.style.height = '0%';
  // Délai minimal pour que le reset soit pris en compte avant la transition
  setTimeout(() => {
    fill.style.transition = `height ${DURATION - 300}ms linear`;
    fill.style.height = '100%';
  }, 50);
}

function next(){
  current = (current + 1) % pool.length;
  showSlide(current);
}

(async function demarrer(){
  const valides = await construirePoolValide(SLIDES);
  pool = interleave(valides);
  builtSlides = pool.map(buildSlide);
  builtSlides.forEach(s => stage.appendChild(s));
  if(!pool.length) return;  // sécurité : aucune image chargeable
  showSlide(0);
  timer = setInterval(next, DURATION);
})();
</script>
