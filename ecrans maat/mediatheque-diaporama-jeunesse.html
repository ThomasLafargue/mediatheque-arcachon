  {t:"Le grand air",a:"Othats Margaux",y:"2026",ed:"La Partie",cote:"A OTH",pub:"Jeune",sup:"Imprimé",d:"Un imagier pour faire le tour des saisons en jeu et en mouvement ! Sauter, tomber, toucher... cet imagier met en scène une enfant qui goûte chacune des saisons au grand air. Les verbes d'actions, comme une ritournelle, sont mis en pratique par l'enfant, mais aussi par ce qui l'entoure. Ainsi, le pic-vert et le soleil tapent, les bourrasques soufflent, la foudre tombe en été et la nuit tombe en hiver...",isbn:"9782494591370",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494591370-475x500-1.jpg"},
  {t:"Cath & son chat",a:"Cazenove Christophe",y:"2013",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"Sushi le chat a tellement bien pris ses marques et ses habitudes de confort dans la maison que Cath et son père se demandent s'ils sont encore chez eux où s'ils habitent chez lui.",isbn:"9782818921524",img:"https://covers.openlibrary.org/b/isbn/9782818921524-M.jpg"},
  {t:"Le pitou",a:"Escoffier Michaël",y:"2025",ed:"Frimousse",cote:"A ESC",pub:"Jeune",sup:"Imprimé",d:"Zais perdu mon pitou ! Un petit manchot est seul sur la banquise. Il a perdu son \" pitou \". Il rencontre un ours blanc ronchon. \" Tu as vu mon pitou ? \" demande le petit manchot. L'ours l'envoie loin en lui afrmant que son pitou est caché \" là bas \". Il part donc... loin... seul... sur la banquise ostile. Qui se retrouve par le plus grand des hasards sur son chemin ? Le Père Noël en personne ! Celui-ci vient d'avoir un accident de traineau... Il a heurté un drôle de personnage... Le petit manchot lui explique : \" zai perdu mon pitou \" . Le Père Noêl se met immédiatement à la recherche d'un pitou... Il doit bien y avoir ça parmi tous les cadeaux du traîneau. Mais un hurlement devance l'ours blanc, visiblement poursuivi par un monstre terrifiant... \" Mon Pitou ! \" s'exclame le petit manchot. Ouf ! doudou retrouvé.",isbn:"9782383496205",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496205-475x500-1.jpg"},
  {t:"NON ! dit lapin",a:"Henrichs Marjoke",y:"2026",ed:"Nathan",cote:"A HEN",pub:"Jeune",sup:"Imprimé",d:"Lapin n'a pas envie d'écouter sa maman. Non, non, non ! proteste-t-il. Maman et Lapin trouveront-ils quelque chose qu'ils aiment faire tous les deux ?",isbn:"9782095057275",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782095057275-475x500-1.jpg"},
  {t:"Un hiver sans fin",a:"Westin Miila",y:"2025",ed:"Éditions Sarbacane",cote:"BDJ WES",pub:"Jeune",sup:"Imprimé",d:"Il neige encore en juin ! Alors que l'été refuse d'arriver, Eevi accompagne sa famille chez sa grand-mère pour trier les affaires de son grand-père récemment disparu. Se promenant près de la rivière, elle fait une rencontre pour le moins étonnante : un esprit de l'orge ! Il lui explique que l'esprit du printemps est retenu prisonnier par une terrible sorcière et qu'il suffit de le libérer pour mettre fin à cet interminable hiver. Eevi se retrouve alors dans les profondeurs de Tuonela, un monde peuplé de créatures magiques où l'on règle les problèmes à coups de puissants sortilèges !",isbn:"9791040807056",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040807056-475x500-1.jpg"},
  {t:"Le Grand Roi Soleil",a:"Mélèse Mathilde",y:"2026",ed:"Editions Panthera",cote:"A MEL",pub:"Jeune",sup:"Imprimé",d:"\"J'étais une petite fille assez solitaire et rêveuse, mais autoritaire avec mon frère et ma soeur, plus jeunes que moi. Vers l'âge de six ans, je me suis créé un ami, un compagnon, pas seulement plus sage que moi, mais aussi bien plus sage que mes parents. Il avait un savoir, un sens de la justice, une bonté, une sévérité et une rigueur, beaucoup plus vastes et solides que les leurs. Le Grand Roi Soleil. Mon Grand Roi Soleil\".",isbn:"9782494182318",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494182318-475x500-1.jpg"},
  {t:"Ma déclaration",a:"Aymon Gaël",y:"2026",ed:"Gallimard",cote:"J AYM",pub:"Jeune",sup:"Imprimé",d:"Une romance lycéenne à deux voix, aussi juste que sensible, par l'auteur de Ma réputation. Yanis est fou amoureux de Camille. Camille aime Yanis, mais elle lui avoue dans une lettre avoir embrassé d'autres garçons. Yanis vit seul avec sa mère et se demande ce que signifie \"être un mec\" aujourd'hui. Camille est en conflit avec ses parents, qui avaient prévu pour elle un avenir tout tracé. Chacun traversé par des doutes et des questionnements, réussiront-ils à préserver le lien qui les unit ?",isbn:"9782075226035",img:"https://products-images.di-static.com/image/base/9782075226035-475x500-1.jpg"},
  {t:"Une journée avec Lucy",a:"Dami Elisabetta",y:"2026",ed:"Albin Michel",cote:"J DAM",pub:"Jeune",sup:"Imprimé",d:"UNE AVENTURE AU COEUR DE LA PREHISTOIRE EN COMPAGNIE DES PREMIERS AUSTRALOPITHEQUES ! Par cent mille mimolettes, jamais je n'aurais imaginé me retrouver dans la savane africaine trois millions d'années plus tôt, en compagnie de Lucy, l'australopithèque ! Alors que ma nouvelle amie me fait découvrir son monde, son bébé est kidnappé. Nous voici lancés dans une course-poursuite pour le sauver... si on échappe aux prédateurs et au volcan qui s'est réveillé !",isbn:"9782226508263",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226508263-475x500-1.jpg"},
  {t:"Ouvre la bouche en grand !",a:"Ma Daishu",y:"2026",ed:"minedition",cote:"A MA",pub:"Jeune",sup:"Imprimé",d:"\"Ouvre la bouche, dit Jade. Et fais \"Ahhh...\"\" Un livre qui va donner à tous les enfants l'envie de se brosser les dents.",isbn:"9782354137854",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137854-475x500-1.jpg"},
  {t:"Maman pour toujours",a:"Lorenzoni Chiara",y:"2026",ed:"Éditions Sarbacane",cote:"A LOR",pub:"Jeune",sup:"Imprimé",d:"\" Olivo habite avec son papa. Il y a lui et son papa et puis voilà. \" Comme un doux poème, voici l'histoire d'un enfant dont la maman n'est plus là. Cela le met en colère et ses jambes donnent des coups de pied et cassent des choses. Heureusement, il y a les câlins surprises, qui eux, sont restés. Ils ont même augmenté. Un jour, son papa l'invite à couper du bois\". Un mot triste, un bout de bois, un mot colère, un autre bout de bois. \" Jusqu'à épuiser le tas du jardin - et tous les mots tristes ou colères. Puis ils se rendent auprès du grand chêne, et cette fois, c'est le papa qui va épuiser son chagrin en construisant une cabane dans les hautes branches. D'où Olivo comprendra que sa maman est avec eux - pour toujours...",isbn:"9791040807742",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791040807742-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Pour sauver Mei Niang des griffes de ses ravisseurs,   Yona et sa bande se sont infiltrés dans le camp  militaire du Kai du sud. Tandis que Hak affronte  le général Hiktan, Val fait irruption et choisit  de le défendre contre ses anciens  compagnons d'armes…",isbn:"9782811687106",img:"https://covers.openlibrary.org/b/isbn/9782811687106-M.jpg"},
  {t:"Sac à poux",a:"Amram Nicole",y:"2023",ed:"Gallimard",cote:"A AMR",pub:"Jeune",sup:"Imprimé",d:"Un recueil de poèmes joyeux et pleins d'humour. \"Ils ne sont pas poissons d'eau douce pas poissons scie, ni poissons-chats... On ne les voit pas dans les vagues. Mais en avril, ils seront là, dans ton dos, pour faire des blagues ! \" Un mariage d'hippopotame, un éléphant en hélico, des poux sur la tête, des moustiques qui piquent et tout plein d'oiseaux... Voici de petites poésies, comme des comptines, à apprendre ou à lire à haute voix pour se faire plaisir en jouant avec les mots !",isbn:"9782075175593",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075175593-475x500-1.jpg"},
  {t:"Lyra",a:"Loyer Anne",y:"2026",ed:"Editions Casterman",cote:"J LOY",pub:"Jeune",sup:"Imprimé",d:"On dit que la musique adoucit les moeurs... dans cette famille, elle rapproche les soeurs ! Depuis des semaines, Lyra se prépare pour l'audition de flûte qui lui permettra d'impressionner Léonard Belcanto, son père chef d'orchestre... mais dans sa tête se joue une vraie tempête. Elle s'interroge sur l'absence d'attention de ce père qui refait sa vie de son côté et semble la remplacer, elle s'alarme de ne pas être prête le jour J et, pour couronner le tout, elle doit gérer les amours de sa soeur Antara avec le doux Virgile... Courageuse, assidue et attentive aux autres sans même s'en rendre compte, Lyra va tout faire pour que sa famille entière soit réunie lors de l'audition et s'assurer que ce petit monde reste accordé !",isbn:"9782203300156",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300156-475x500-1.jpg"},
  {t:"Crète party",a:"Cazenove Christophe",y:"2020",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"La mythologie grecque revisitée par un humour légendaire ! Mais où donc habite Poséidon ? Et pourquoi n'en sait-on pas plus sur ses enfants, Triton et Rhodé ? Et si on en profitait pour expliquer pourquoi c'est à cause du dieu de la mer qu'est né le Minotaure ? Et le Minotaure, pourquoi est-il obligé de vivre dans un labyrinthe construit par un certain Dédale sur ordre du roi Minos ? Les questions sont nombreuses, espérons que nos petits Mythos sauront apporter plus de réponses que de catastrophes !",isbn:"9782818976746",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818976746-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"À la veille d'une bataille qui opposera le pays de Kôka au Kai du sud, Yona se prépare à rejoindre le front. De leur côté, Hak et Yeon traversent la province de Kin à la recherche de la milleplantes. Mais Geun-tae ayant été sérieusement blessé, Hak prend la tête des troupes affaiblies et se retrouve en première ligne pour repousser l'ennemi…",isbn:"9782811673512",img:"https://covers.openlibrary.org/b/isbn/9782811673512-M.jpg"},
  {t:"La petite poule rousse",a:"Paku",y:"2026",ed:"Fleurus",cote:"A PAK",pub:"Jeune",sup:"Imprimé",d:"Il était une fois... L'histoire de La Petite Poule rousse tendrement illustrée pour faire découvrir aux tout-petits les contes de notre enfance.",isbn:"9782215201564",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215201564-475x500-1.jpg"},
  {t:"L'automne des aspirants",a:"Puysségur Alain T.",y:"2023",ed:"Scrineo",cote:"J PUY",pub:"Adolescent",sup:"Imprimé",d:"Qui a dit que les chats ne pouvaient pas faire de la magie ? Suivez les premières aventures de Kovhan, Bruyne, Lexios et Serenya, et découvrez avec eux les secrets du Manoir de Castlecatz... \" Il n'existe pas d'endroit plus prestigieux que le Manoir de Castlecatz pour étudier les arts occultes de la magie. C'est à Castlecatz que les Maggocatz les plus puissants sont formés. Mais pas seulement. Les meilleurs Mécanimateurs et les plus grands Alchimistes y étudient également depuis des siècles. \" Une nouvelle année de cours débute au Manoir de Castlecatz ! Kovhan rêve depuis toujours d'y entrer et de devenir Aspirant. Mais pour lui qui maîtrise si mal l'indispensable Maggocculture, triompher des épreuves d'admission n'est pas une tâche facile... Il y a pourtant pire. Une menace plane sur Castlecatz cet automne : des incidents magiques se multiplient, certains félins rapportent même avoir aperçu une horrible créature rôder dans les couloirs... Heureusement, le jeune chat peut compter sur Bruyne, son amie gourmande et malicieuse, ainsi que sur Lexios et Serenya, toujours prêts à lui filer un coup de patte !",isbn:"9782381672854",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782381672854-475x500-1.jpg"},
  {t:"Yona, Princesse de l'Aube T38",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Afin de préparer la bataille avec le Kai du sud, le pays de Kôka rassemble toutes les tribus sous son égide pour fortifier ses troupes. Accompagnée des quatre guerriers dragons, Yona rallie elle aussi les rangs de l'armée et rejoint le front. Mais qu'est-il advenu de Hak, porté disparu après l'attaque submersive du général Laan'",isbn:"9782811677855",img:"https://covers.openlibrary.org/b/isbn/9782811677855-M.jpg"},
  {t:"Les derniers retrouveurs",a:"Dixen Victor",y:"2024",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Les derniers retrouveurs Chaque jour, des objets et des gens disparaissent. Vous les pensez perdus ? Ils ont été volés par des créatures avides, venues d'un autre monde pour arracher des morceaux du nôtre : les croquemitaines. La vie de Lucy bascule quand sa mère disparaît mystérieusement. La jeune orpheline est contrainte de quitter sa campagne et d'aller vivre à New York chez sa tante Doris, qui l'oblige à voler dans les trains pour payer son \"loyer\". Jusqu'au jour où Lucy fait la connaissance de Rita Perdido, une femme entourée de secrets, qui lui propose de rejoindre son agence de retrouvage. Lucy découvre qu'elle fait partie d'une caste en voie de disparition : les retrouveurs. Depuis la nuit des temps, ces humains ont le pouvoir de pénétrer dans les oubliettes pour en rapporter les objets, les personnes et les souvenirs perdus. Persuadée que sa mère a été enlevée par un croquemitaine, Lucy se lance à sa recherche. Mais ce n'est pas seulement le sort de sa famille qui est en jeu : à mesure que s'éteigne les derniers retrouveurs, les croquemitaines gagnent en puissance et préparent leur effroyable revanche contre la surface...",isbn:"9791036374692",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036374692-475x500-1.jpg"},
  {t:"Frieren",a:"Yamada Kanehito",y:"2026",ed:"Ki-oon",cote:"BD FRI",pub:"Jeune",sup:"Imprimé",d:"Que deviennent les héros une fois le mal vaincu ?  Alors que Frieren et Fern cherchent une solution pour soigner Stark, empoisonné par une flèche ennemie, un sauveur inattendu fait son apparition en la personne de Sein ! Le prêtre a en effet reconnu l'énergie de l'elfe tandis qu'il parcourait la capitale...  À quatre, ils arrivent à déjouer la stratégie des guerriers de l'ombre et à leur échapper ! Mais le combat n'est pas passé inaperçu aux yeux des forces spéciales magiques, qui traquent à présent les coupables. De leur côté, Land et Übel ont enfin rejoint leurs compagnons avec le message de Lineal... Grâce à lui, la société des mages du continent parviendra-t-elle à protéger Serie ?",isbn:"9791032721216",img:"https://covers.openlibrary.org/b/isbn/9791032721216-M.jpg"},
  {t:"Les araignées, 100 infos à connaître",a:"Collectif",y:"2024",ed:"Piccolia",cote:"J 595.4 DEL",pub:"Jeune",sup:"Imprimé",d:"Un concept pertinent de documentaire, avec photos et illustrations, de 100 infos, avec des quizz et des activités à réaliser. 100 faits numérotés, accompagnés de magnifiques illustrations, plongeront les enfants dans une aventure irrésistible de bout en bout, racontée avec humour grâce à des détails et des dessins amusants. Les jeunes esprits curieux y apprécieront les quiz et activités qui leur permettront de tout connaître sur leur sujet favori !",isbn:"9782753075221",img:"https://m.media-amazon.com/images/I/51JtYYV9EFL._SX95_.jpg"},
  {t:"Myrmidon sous les mers",a:"Dauvillier Loïc",y:"2024",ed:"Editions de la Gouttière",cote:"BDJ DAU",pub:"Jeune",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même... C'est quoi Myrmidon ? Une série de bande dessinée sans texte, créative, drôle, et poétique à lire dès 2 ans, en autonomie ou avec un accompagnement !",isbn:"9782357961050",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782357961050-475x500-1.jpg"},
  {t:"Il paraît que",a:"Tallec Olivier",y:"2026",ed:"L'École des loisirs",cote:"A TAL",pub:"Jeune",sup:"Imprimé",d:"J'ai avalé un pépin de pomme sans faire exprès... Il paraît que si on avale un pépin, on a un arbre qui pousse à l'intérieur. Si ça se trouve, les pommiers du vieux verger sont des gens qui ont avalé un pépin de pomme ! Günther m'a dit que si on avale un pépin de pomme rouge, on a un arbre rouge qui pousse dans le ventre. Non... ça ne peut pas vraiment arriver, hein ?",isbn:"9782211350983",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782211350983-475x500-1.jpg"},
  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeune",sup:"Imprimé",d:"Après la mort du roi, alors que le prince Boiji est pressenti pour le remplacer, la reine Hiling tente de contrecarrer son accession au trône. Et comble de malchance, son ami Ombre a disparu. ©Electre 2022",isbn:"9791032712184",img:"https://covers.openlibrary.org/b/isbn/9791032712184-M.jpg"},
  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeune",sup:"Imprimé",d:"Le royaume de Boss est en crise. Son fondateur à la force surhumaine est gravement malade. Son héritier, le prince Bojji, est sourd-muet. Dans un monde où la puissance des rois fait tout, cette faiblesse ne le destine pas à régner et son frère cadet Daida reçoit le soutien populaire. Mais l'aîné, d'un optimisme à toute épreuve, garde son objectif en tête, devenir le meilleur roi du monde. ©Electre 2022",isbn:"9791032712191",img:"https://covers.openlibrary.org/b/isbn/9791032712191-M.jpg"},
  {t:"Ranking of kings",a:"Toka Sosuke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeune",sup:"Imprimé",d:"La reine Hiling consent à laisser le prince Bojji, héritier du royaume de Boss, partir en voyage, accompagné de Domas, son maître d'armes, et de Hokuro, un jeune soldat qui connaît la langue des signes. Lorsque le groupe arrive devant la porte des Enfers, Bojji est confronté à une trahison inattendue. ©Electre 2022",isbn:"9791032712177",img:"https://covers.openlibrary.org/b/isbn/9791032712177-M.jpg"},
  {t:"L'Enfant de la vallée",a:"Groenink Chuck",y:"2026",ed:"Little urban",cote:"A GRO",pub:"Jeune",sup:"Imprimé",d:"Depuis la grotte de sa montagne, un garçon rêve de retourner dans la vallée. Ici, il a sa famille mais là-bas le monde l'attend. En chemin, des animaux courent, sautent, volent et bondissent partout autour de lui, jusqu'à arriver près de la rivière, là où un autre garçon se trouve...",isbn:"9782374082134",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782374082134-475x500-1.jpg"},
  {t:"Grand-Père",a:"Ieradi Assia",y:"2026",ed:"Alice",cote:"A IER",pub:"Jeune",sup:"Imprimé",d:"Au lieu de parler, Grand-Père fait des sons étranges. Le seul qui semble le comprendre, c'est son chien. Mais ça, on n'en est pas bien sûrs.",isbn:"9782874266904",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782874266904-475x500-1.jpg"},
  {t:"Les 5 lettres du mot coeur",a:"Cassidy Cathy",y:"2026",ed:"Pocket",cote:"J CAS",pub:"Jeune",sup:"Imprimé",d:"Par l'autrice de la série culte Les Filles au chocolat ! Un coeur, cinq amis, zéro contact depuis deux ans... et si tout changeait ? Carrie, Omisha, Eden, Uma et Ryan sont inséparables depuis leur enfance. Leurs prénoms commencent comme les cinq lettres du mot coeur... C'est un signe ! Mais une violente dispute lors de l'anniversaire de Carrie vient séparer le groupe d'amis. Eden et Ryan qui étaient amoureux secrètement, sont fâchés à mort. Vont-ils tous pouvoir recoller les morceaux de l'amour et de l'amitié ?",isbn:"9782266357678",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782266357678-475x500-1.jpg"},
  {t:"Sous le soleil exactement",a:"Multon Anne-Fleur",y:"2026",ed:"Poulpe fictions",cote:"J MUL",pub:"Jeune",sup:"Imprimé",d:"Ingrédients pour des vacances survoltées : prenez quatre copines à l'imagination débridée et invitez-les dans un grand manoir mystérieux. Ajoutez un tableau intriguant, des rencontres surprenantes, une bonne dose de curiosité et une chaîne YouTube pour documenter le tout... Vous obtiendrez une enquête haletante et des aventures délirantes !",isbn:"9782377424597",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782377424597-475x500-1.jpg"},
  {t:"C'est à moi !",a:"Lang Suzanne",y:"2026",ed:"Editions Casterman",cote:"A LAN",pub:"Jeune",sup:"Imprimé",d:"Un album pour accompagner le difficile apprentissage du partage. C'est l'heure du déjeuner pour Gaston le chimpanzé. Il cueille la toute dernière banane sur le bananier. Mais il la fait tomber ! Et quand il descend de l'arbre pour la récupérer, Phacochère l'a déjà ramassée. - C'est ma banane ! déclare Gaston. - Je l'ai trouvée, je la garde ! répond Phacochère. Phacochère se met en colère. Et Gaston aussi. C'EST A MOI ! Et pas question de partager !",isbn:"9782203300217",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300217-475x500-1.jpg"},
  {t:"Ouvre cette porte !",a:"Robert Yannick",y:"2026",ed:"Albin Michel",cote:"A ROB",pub:"Jeune",sup:"Imprimé",d:"C'est toujours la même histoire avec le loup : c'est lui qui décide ! Pourtant, cette fois-ci, il a beau supplier, ruser, menacer... rien n'y fait. Mais qui peut bien se cacher derrière la porte ? !",isbn:"9782226503848",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226503848-475x500-1.jpg"},
  {t:"Hue Cocotte !",a:"Collet Géraldine",y:"2026",ed:"Glénat Jeunesse",cote:"A COL",pub:"Jeune",sup:"Imprimé",d:"La vie te donne des ailes. Prends ton envol ! Au poulailler, Mariette est bouleversée. A quoi bon avoir des ailes si on ne peut pas voler ? Pourtant grâce à son amie Josette, Mariette va comprendre qu'avec un peu d'entrain et beaucoup de courage, même une poule peut décoller... et viser la Lune !",isbn:"9782344070178",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344070178-475x500-1.jpg"},
  {t:"The Ice Guy & The Cool Girl",a:"Tonogaya Miyuki",y:"2022",ed:"Mangetsu",cote:"BD ICE",pub:"Jeune",sup:"Imprimé",d:"Himuro, descendant moderne d'une femme des neiges, est collègue avec la gentille et discrète Fuyutsuki. Lors d'un voyage au ski, Himuro réussit progressivement mais sûrement à se rapprocher de celle qu'il aime. Au fur et à mesure du temps passé ensemble, leurs souvenirs s'accumulent, tout comme leurs sentiments... The Ice Guy & The Cool Girl est un manga publié originellement sur le compte Twitter de Miyuki Tonogaya. Grâce à son dessin magnifique et à ses personnages charismatiques, la mangaka nous offre une romance aussi chaleureuse que mignonne.",isbn:"9782382810453",img:"https://covers.openlibrary.org/b/isbn/9782382810453-M.jpg"},
  {t:"Le Fil de notre histoire",a:"Negrin Fabian",y:"2026",ed:"La Martinière",cote:"A NEG",pub:"Jeune",sup:"Imprimé",d:"Un voyage extraordinaire à travers le temps : l'histoire d'une famille racontée à rebours, jusqu'à ses origines les plus lointaines... Lucie, 90 ans, se rappelle de tendres souvenirs qui, par ricochets, en invoquent d'autres plus anciens : les joyeuses soirées avec Giorgio dans les années 1960, leur rencontre quand elle avait 16 ans, sur cette plage où elle passait depuis sa plus tendre enfance tous ses étés. Son père était reporter, il avait rencontré sa mère à Londres. Le père de cette Anglaise, grand-père Charles, capitaine au long cours, était tombé amoureux à Shanghai, au début du siècle, de Mei, une jeune Chinoise. Il avait offert à la petite Lucie une bague qui était dans la famille depuis l'époque des Croisades, lorsqu'un chevalier saxon et une princesse arabe s'étaient unis. Et avant cela ? Une aïeule reine d'Egypte, des esclaves, des chasseurs de crocodiles ou des marchands de fruits, qui sait... Des instants évocateurs et émouvants saisis en peu de mots sont servis par des illustrations et une mise en pages captivantes. Lucie, en remontant le temps, raconte la richesse de ses origines. Ce récit familial nous convie à une exploration poétique de l'identité et de nos racines. En prenant l'amour comme fil conducteur, il montre combien chaque histoire personnelle est un fragment d'une vaste mosaïque humaine et s'inscrit dans une histoire commune et universelle ; il célèbre ce lien qui devrait nous unir, ce patrimoine génétique partagé, hérité d'un ancêtre perdu dans la nuit des temps. Le lecteur rencontrera avec délice chaque génération de cette famille paradigmatique, s'interrogera sur la transmission d'une bague, croisera des personnages hauts en couleur. Jusqu'à cette silhouette dont la narratrice porte fièrement le nom, l'arrière-arrière-arrière-grand-tante de l'humanité : l'australopithèque Lucy. Une grande famille ? L'humanité tout entière ! Un album fascinant, original et graphique qui met en lumière la mixité de nos racines en même temps que notre origine commune, comme une invitation à la fraternité.",isbn:"9791040124320",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040124320-475x500-1.jpg"},
  {t:"Le Grozours arrive !",a:"Allepuz Anuska",y:"2026",ed:"Albin Michel",cote:"A ALL",pub:"Jeune",sup:"Imprimé",d:"Au coeur de la forêt vivent quatre oursons tout fous et tout mignons. Alors qu'ils se préparent à aller se coucher, ils entendent un bruit. Ils tendent l'oreille, lèvent la truffe et ouvrent grand les yeux... Qui va là ? C'EST LE GROZOURS !",isbn:"9782226507105",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226507105-475x500-1.jpg"},
  {t:"Arnaque à Central Park",a:"Payet Jean-Michel",y:"2016",ed:"Milan",cote:"J PAY",pub:"Jeune",sup:"Imprimé",d:"Prénom : Scarlett. Signe distinctif : détective en herbe. Particularité son chat, Watson, l'aide dans ses enquêtes... Petit détail : le plus malin des deux n'est pas celui qu'on croit !  En voyage à New York, Scarlett achète une petite souris en origami sur un stand de Central Park. Voilà qui fera un joli souvenir pour Watson, resté de l'autre côté de l'Atlantique. Mais la souris en papier disparait et Scarlett se rend compte qu'elle avait bien plus de valeur qu'il n'y paraît...",isbn:"9782745976758",img:"https://products-images.di-static.com/image/base/9782745976758-475x500-1.jpg"},
  {t:"Cyberpunk",a:"Mhalla Asma",y:"2025",ed:"Seuil",cote:"327 MHA",pub:"Jeune",sup:"Imprimé",d:"E n ce début de XXIe siècle, l'alliance chaotique de Donald Trump et d'Elon Musk a fait surgir une créature technopolitique à deux têtes. L'une orchestre le show, l'autre code le système. Quelque chose d'insaisissable est pourtant à l'oeuvre. Gourous de la Silicon Valley et idéologues néo-réactionnaires orchestrent un fascisme-simulacre annonciateur d'un bouleversement plus profond. Un nouveau régime, hybride, où l'Etat s'efface... pour mieux tout contrôler. L'emprise avance en silence, à l'échelle planétaire. Un empire cognitif reconfigure la démocratie, colonise les corps et les esprits. Depuis le laboratoire américain où s'expérimente le futur, ce livre décrypte le logiciel techno-totalitaire. Dans le monde qui vient, vous ne serez pas augmentés. Vous serez programmés. Le futur est déjà là. La dystopie cyberpunk n'est plus une fiction, c'est notre réalité. Comprendrons-nous à temps ce qui se joue ? Asma Mhalla signe un essai coup de poing pour nommer la nouvelle arène du pouvoir. Et défendre ce qu'il nous reste : notre liberté. Asma Mhalla est politologue et essayiste. Elle est l'autrice d'un premier livre remarqué, Technopolitique. Comment la technologie fait de nous des soldats (Seuil, 2024).",isbn:"9782021587586",img:"https://covers.openlibrary.org/b/isbn/9782021587586-M.jpg"},
  {t:"Le fantastique voyage de Nicola au pays des démons",a:"Miyanaga Asaya",y:"2024",ed:"Nobi Nobi",cote:"BD FAN",pub:"Jeune",sup:"Imprimé",d:"Un périple initiatique touchant et surprenant ! Nicola, une jeune humaine, parcourt le monde des démons aux côtés de Simon, un marchand ambulant du peuple des diables. Recueillie plus jeune par son compagnon de route, elle doit constamment cacher sa véritable nature, au risque d'être pourchassée. Mais Nicola n'est pas non plus tout à fait une humaine comme les autres : elle est la petite-fille d'une sorcière ! Au travers des péripéties de la téméraire Nicola et du bienveillant Simon, c'est un univers de démons, de fantômes, de fées et autres créatures magiques qui se dévoile.",isbn:"9782373493092",img:"https://covers.openlibrary.org/b/isbn/9782373493092-M.jpg"},
  {t:"Le fantastique voyage de Nicola au pays des démons",a:"Miyanaga Asaya",y:"2024",ed:"Nobi Nobi",cote:"BD FAN",pub:"Jeune",sup:"Imprimé",d:"Nicola et Simon s'enfoncent encore plus loin dans les terres du monde des démons. Sur leur route, ils vont faire de nouvelles rencontres toujours plus enrichissantes, mais aussi croiser des personnes chères à Simon... dont son père ! Toujours aussi téméraire, Nicola va même au devant d'un danger afin de sauver son acolyte, victime d'une flèche empoisonnée ! De ville en village, la jeune fille se rapprochera peut-être de ce qu'elle était venue chercher dans le monde des démons...",isbn:"9782384963065",img:"https://covers.openlibrary.org/b/isbn/9782384963065-M.jpg"},
  {t:"Le talisman des 4 dragons - Tome 1 : La flamme perdue",a:"Djebel Yasmine",y:"2026",ed:"Rageot",cote:"J DJE",pub:"Jeune",sup:"Imprimé",d:"Le talisman des 4 dragons a &eacute;t&eacute; bris&eacute;&nbsp; ! Selon la l&eacute;gende, les Temp&ecirc;tes risquent de d&eacute;ferler sur l&rsquo;Archipel.<br />Ne&iuml;la se fiche de ces vieilles histoires jusqu&rsquo;au moment o&ugrave; la statue d&rsquo;un fennec prend vie devant ses yeux. Il affirme &ecirc;tre un esprit des temps anciens et confirme la menace qui plane. Ne&iuml;la, qui a plusieurs choses &agrave; se reprocher, d&eacute;cide de partir &agrave; la rencontre du dragon rouge pour demander son aide&hellip",isbn:"9782700286175",img:"https://products-images.di-static.com/image/base/9782700286175-475x500-1.jpg"},
  {t:"Fechamos (on ferme)",a:"Baum Gilles",y:"2020",ed:"les Éditions des éléphants",cote:"BDJ BAU",pub:"Jeune",sup:"Imprimé",d:"Déserté du public, un musée est contraint de fermer ses portes définitivement. En cette nuit, le gardien Edson Arantes entame en compagnie de quelques habitués une ultime déambulation au cours de laquelle les collections sont distribuées. Le musée est détruit dans un incendie mais les objets qu'il conservait sont sauvés. Inspiré du sinistre survenu au musée national de Rio de Janeiro. ©Electre 2020",isbn:"9782372730914",img:"https://products-images.di-static.com/image/base/9782372730914-475x500-1.jpg"},
  {t:"La robe de soie",a:"Mezzalama Chiara",y:"2022",ed:"les Éditions des éléphants",cote:"BDJ MEZ",pub:"Jeune",sup:"Imprimé",d:"Les vieilles maisons gardent la mémoire et les secrets. Il ne faut pas avoir peur des ancêtres et des fantômes, ni les oublier.",isbn:"9782372731065",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782372731065-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2019",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Le lendemain de la déclaration d'amour de Hak, Yona est troublée par les moindres faits et gestes du jeune homme. De son côté, Zeno explique que les blessures des quatre dragons guériraient mieux près du château de Hiryû, et suggère qu'ils se mettent en route pour Kûto.Au même moment, les terres de la tribu du feu subissent l'invasion des troupes armées de l'empire de Kai, situé au nord…",isbn:"9782811645724",img:"https://covers.openlibrary.org/b/isbn/9782811645724-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2026",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeune",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n accueillir que des cancres, s'est lié d'amitié avec Kaoruko Waguri, qui fréquente un établissement pour filles de bonne famille, Kikyô.Tandis que l été qui marque le début de leur relation touche bientôt à sa fin, Rintarô donne rendez-vous à Waguri pour lui offrir un gâteau en récompense de son dur labeur estival. Le jour de leur tête-à-tête, le jeune homme s attendait à tout& sauf à se retrouver soudain invité à dîner chez la famille de sa petite amie ! L aspirant pâtissier en profite alors pour transmettre ses bonnes intentions à la mère de Waguri&Roméo & Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions![xc2][xa0]",isbn:"9782384966448",img:"https://covers.openlibrary.org/b/isbn/9782384966448-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeune",sup:"Imprimé",d:"Rintarô Tsumugi, un élève d un lycée qui rassemble des garçons au plus bas de l échelle scolaire, fait un jour la connaissance de Kaoruko Waguri, qui fréquente un établissement de filles de bonne famille.Appréciant de plus en plus les moments passés en compagnie de la jeune fille, notre héros commence bientôt à s apercevoir de ses sentiments naissants à son égard.Un jour, alors qu ils se retrouvent tous les deux, submergé par ses sentiments à l égard de Kaoruko, les mots lui échappent& et Rintarô lui déclare sa flamme.  Suite à cet épisode, il est bien déterminé à lui transmettre tout ce qu il ressent pour elle.  L amour sincère entre ces deux lycéens que tout oppose, et pourtant si proches, finira-t-il par éclore ?",isbn:"9782384963928",img:"https://covers.openlibrary.org/b/isbn/9782384963928-M.jpg"},
  {t:"Magimage",a:"Albon Lucie",y:"2025",ed:"Thierry Magnier",cote:"A THI",pub:"Jeune",sup:"Imprimé",d:"Ce livre est vraiment magique : il transforme les images grâce à un simple miroir. Et voici comment un panier de fruits se transforme soudain... en glace !",isbn:"9791035208523",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035208523-475x500-1.jpg"},
  {t:"Moi, quand je me réincarne en Slime - Tome 29",a:"Fuse",y:"2026",ed:"Kurokawa",cote:"BD MOI",pub:"Jeune",sup:"Imprimé",d:"**Comment un slime devient le seigneur du royaume !** Après avoir déjoué bien des pièges, Tempest rejoint le conseil des pays de l'Occident sur la base d'une relation équitable. Limule se rapproche de son idéal de coexistence pacifique entre humains et monstres. En revanche, Mariabell, tête pensante du clan Rozzo, a vu tous ses plans bouleversés et s'apprête à utiliser un atout secret qui inquiète même Yûki..",isbn:"9791042021818",img:"https://covers.openlibrary.org/b/isbn/9791042021818-M.jpg"},
  {t:"C'était quoi, ce craquement ?",a:"Cali Davide",y:"2026",ed:"Éditions Sarbacane",cote:"A CAL",pub:"Jeune",sup:"Imprimé",d:"Deux frères sont couchés dans leur lit. L'un entend toujours des \" craquements \" et finit par communiquer sa peur à l'autre, qui est pourtant de nature beaucoup plus cool... C'est parti pour un échange d'explications fantaisistes qui feront intervenir : le parquet qui craque (mais ils ont du carrelage), le chien (mais ça ne craque pas, un chien ? ), un voleur (au 7e étage ? ), le père Noël... La vraie réponse sera toute différente ! Et l'effet épatant, pour l'enfant lecteur : rien de tel que l'humour pour balayer la peur !",isbn:"9791040808152",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040808152-475x500-1.jpg"},
  {t:"Le dernier des fils",a:"Sobral Patrick",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Les Légendaires Résistance démarre 20 ans après le grand cycle des Légendaires. Le monde a vécu de belles années de paix mais aujourd'hui les descendants de nos héros doivent reprendre les armes pour défendre Alysia ! Maintenant que tout Alysia sait que les lunes n'ont jamais été détruites par les Dieux, partout dans le monde on se révolte et se dresse contre l'envahisseur divin. Du côté de la résistance, l'ambiance est explosive et Toopie est contestée pour ses décisions qui ont mené à la mort tragique d'Amy. Les tensions menacent la résistance alors qu'un espion des Célestes a infiltré leur base.",isbn:"9782413088486",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413088486-475x500-1.jpg"},
  {t:"SamSam, Tome 01",a:"Bloch Serge",y:"2026",ed:"Bayard éditions",cote:"BDJ BLO",pub:"Jeune",sup:"Imprimé",d:"Ensemble, SamPapa, SamMaman, SamSam et SamNounours affrontent tous les dangers et protègent la SamPlanète. Mais ils sont aussi très forts pour les bisous, les câlins et la rigolade ! SamSam, le plus petit des grands héros SamSam, le héros créé par Serge Bloch pour Pomme d'Api, est un enfant comme les autres : il aime jouer avec ses copains, regarder la télé un peu trop longtemps, faire des bêtises... et beaucoup moins ranger sa chambre ou obéir à ses parents ! Mais c'est aussi un superhéros qui part à l'aventure, découvre des planètes inconnues et joue avec des monstres bizarres ! Dans cette nouvelle présentation, les cases ont été agrandies, le texte est plus lisible et la lecture partagée plus simple : un classique à redécouvrir et offrir à tous les enfants de 3 à 7 ans ! SamSam, un héros à retrouver partout ! SamSam est publié tous les mois dans le magazine Pomme d'Api, il est aussi le héros d'un dessin animé diffusé sur France Télévisions, Netflix, YouTube et Okoo et d'un film sorti au cinéma, prix du public au festival Anima de Bruxelles. On le retrouve aussi sur Lumni, en collaboration avec Bayard jeunesse, dans une série sur le vivre-ensemble. SamSam, c'est aussi des histoires audio, des jouets, des jeux et des déguisements. Serge Bloch, l'auteur de SamSam, est aussi le scénariste de Zouk et Max et Lili, et le dessinateur de Toto. « SamSam est un personnage attachant, qui a la particularité de vivre sa vie de superhéros grâce à sa cape magique et son rayon spatial, tout en rencontrant les mêmes problèmes que tout petit Terrien de 6 ans : des lâches attaques de Pipiolis (certaines en plein jour !) à la difficulté de se séparer de son fidèle doudou... » Télérama",isbn:"9791036385292",img:"https://products-images.di-static.com/image/base/9791036385292-475x500-1.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Afin de se mettre en jambes en vue des demi-finales du championnat de Tokyo, l’équipe de Seigaku reprend ses entraînements. Nos titulaires se mesurent les uns aux autres, chacun faisant démonstration de sa puissance de jeu. Le premier match d’entraînement oppose Ryôma à Fuji ! Notre petit génie est plus que déterminé mais leur rencontre prend une tournure très inattendue !",isbn:"9782871299806",img:"https://covers.openlibrary.org/b/isbn/9782871299806-M.jpg"},
  {t:"A Troie, on lâche tout !",a:"Larbier Philippe",y:"2022",ed:"Bamboo Edition",cote:"BDJ LAR",pub:"Jeune",sup:"Imprimé",d:"La mythologie grecque revisitée par un humour légendaire ! Sale période pour Achille. La mère d'un des plus grands héros de la mythologie grecque a peur pour son fils car elle a appris qu'il ne reviendra pas de la guerre. Elle décide de le déguiser en fille et de le planquer sur une île habitée uniquement par des femmes. Il faudra toute la ruse d'Ulysse pour démasquer son copain et le traîner avec lui pour se préparer à ce qui deviendra, des années plus tard, la guerre de Troie... Qui a dit que Petit Mythos était un métier de tout repos ?",isbn:"9782818994894",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818994894-475x500-1.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Nous voici dans la seconde partie du championnat de Tokyo ! Seigaku a réussi un tour de force en se qualifiant pour la finale. Son futur adversaire n'est autre que la brillante équipe de Yamabuki, dont les équipes en double étaient classées au niveau national l'année précédente. Le premier match est une catastrophe. Le duo Fuji - Kawamura se fait littéralement balayer! L'équipe jouant l'autre double, constituée de la golden pair Ôishi - Kikumaru, prend le relais mais la tension est à son comble !",isbn:"9782871299905",img:"https://covers.openlibrary.org/b/isbn/9782871299905-M.jpg"},
  {t:"L'éternité ne dure qu'un temps",a:"Sobral Patrick",y:"2013",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Dans ce nouvel épisode, Gryf est confronté à un choix cornélien : sauver celle qu'il aime ou sauver la race humaine de l'extinction.",isbn:"9782756032634",img:"https://www.bedetheque.com/media/Couvertures/Couv_199456.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"La finale du championnat de Tokyo a fait monter la pression d'un cran !! Avec deux victoires et une seule défaite, Seigaku est à deux doigts du triomphe mais encore faut-il que Ryôma gagne son match ! Face au colossal Akutsu Jin, Ryôma, tantôt dominé, tantôt en position de force, devra grandir et améliorer son jeu s'il veut sortir vainqueur de ce match ! Le courage dont il fait preuve suffira-t-il ?!",isbn:"9782505000969",img:"https://covers.openlibrary.org/b/isbn/9782505000969-M.jpg"},
  {t:"Baisers et coquillages",a:"Tessier Greg",y:"2012",ed:"Jungle",cote:"BDJ TES",pub:"Jeune",sup:"Imprimé",d:"Cahier de Vacances de la 4ème vers la 3ème: Voici pour Chloé, venu le temps des vacances d'été. Momentanément éloignée de ses camarades, c'est en famille et sans enthousiasme que notre charmante héroïne va être amenée à découvrir un monde à part: le camping. Entre inconfort et rencontres insolites, pas évident pour elle dès lors de parader tranquillement en maillot! Heureusement d'agréables surprises seront également au rendez-vous.",isbn:"9782874428913",img:"https://covers.openlibrary.org/b/isbn/9782874428913-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2010",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Nous voici à la finale du championnat de Tokyo. Seigaku se mesure à la redoutable équipe de Yamabuki. Grâce à sa victoire lors du second double, Seigaku rattrape son retard. Les deux équipes sont à égalité avec, chacune, une victoire et une défaite. Seigaku nourrit de grands espoirs concernant ses joueurs en simple mais Momo se fait malmener par Sengoku, dit \"le renard\". Ryôma est, quant à lui, sur le point de rencontrer l'imposant Akutsu...!",isbn:"9782505000358",img:"https://covers.openlibrary.org/b/isbn/9782505000358-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Momoshiro n’a pas donné signe de vie depuis trois jours et personne au club de tennis ne sait où il se trouve. Même s’il ne fait plus partie de l’équipe des titulaires, c’est inquiétant... Par ailleurs, Ôishi se fâche avec Kikumaru, son coéquipier, lui reprochant la légèreté de ses paroles et son sens de l’humour déplacé. Serait-ce la faille qui fera voler en éclat la légendaire golden pair ?! Cela tombe vraiment mal, vu que la force de Seigaku réside dans l’unité de ses membres... Une étrange atmosphère plane sur nos héros !!",isbn:"9782505001010",img:"https://covers.openlibrary.org/b/isbn/9782505001010-M.jpg"},
  {t:"Ces promesses qu'on croyait éternelles",a:"Gorman Nine",y:"2025",ed:"Albin Michel",cote:"J GOR",pub:"Adolescent",sup:"Imprimé",d:"Ils pensaient que leur amitié était écrite dans les étoiles. Mais depuis leur séjour à Las Vegas, quelque chose s’est brisé entre Kenna et Kurt. Leurs regards se fuient, laissant place à l’incompréhension[xe2][x80][xa6] Dans le silence qui ponctue désormais leur relation, ils s’accrochent à leurs ultimes repères. Kenna emménage avec son cousin Wes, qui lui apporte la sécurité et la stabilité dont elle pense avoir besoin. Kurt, lui, se met en couple avec une fille qui comprend sa différence, bien qu’au fond il sache qu’une seule personne fait véritablement battre son cœur. Sa meilleure amie",isbn:"9782226503442",img:"https://covers.openlibrary.org/b/isbn/9782226503442-M.jpg"},
  {t:"Dans les griffes de la vipère",a:"Vehlmann Fabien",y:"2013",ed:"Dupuis",cote:"BDJ VEH",pub:"Jeune",sup:"Imprimé",d:"Catastrophe : Le journal de Spirou est menacé de faillite suite à un procès retentissant ! Le rédacteur en chef, Fantasio, ne veut pas laisser mourir son magazine. Mais il n'est pas le seul : Gil Coeur-Vaillant, le célèbre détective-explorateur et admirateur des exploits de Spirou, va venir à sa rescousse. Il va trouver un fonds d'investissement, la VIPER, qui va renflouer le journal. Ouf ! Le célèbre hebdomadaire est sauvé ! Pas tout à fait, car Spirou est en fait tombé dans les griffes d'un milliardaire sans scrupules. Prisonnier dans une villa de rêve sur une île paradisiaque, notre héros ne va pas supporter longtemps cette vie oisive. Il va se rebeller, ignorant qu'il va ainsi précipiter ses amis dans de terribles ennuis...",isbn:"9782800154343",img:"https://covers.openlibrary.org/b/isbn/9782800154343-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Shishido et Ootori, de Hyôtei, mènent Inui et Kaidô par le bout du nez. En fait, il s’agit d’une stratégie qu’Inui a mise au point afin de récolter le plus d’informations possible sur ses adversaires. Heureusement, au bout de quelques minutes de jeu, il finit par trouver ce qu’il cherchait ! Mais pourront-ils remonter la pente ? Le boomerang snake de Kaidô sera-t-il à la hauteur ?!…",isbn:"9782505001706",img:"https://covers.openlibrary.org/b/isbn/9782505001706-M.jpg"},
  {t:"Résolutions",a:"Borecki Ludo",y:"2024",ed:"Kennes",cote:"BDJ BOR",pub:"Jeune",sup:"Imprimé",d:"Bienvenue dons l'univers de Léo rempli d'amitié, de guerres de nunuches, de remises en question, d'embrouilles familiales et d'histoires d'amour. En somme, une vie compliquée d'adolescente empreinte de réalisme et d'humour.",isbn:"9782380759419",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782380759419-475x500-1.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Grâce à son talent, qui n’est plus à prouver, et à sa technique de la triple contre-attaque, Fuji passe à l’offensive avec un nouveau coup fatal ! Quel est donc ce coup inconnu jusqu’alors et qu’il appelle \"la baleine blanche\" ?! Le mystérieux Fuji montre enfin son vrai potentiel et provoque une véritable hystérie du côté des spectateurs ! Toutefois, le match le plus attendu reste celui qui opposera les capitaines des deux équipes : Tezuka et Atobe !",isbn:"9782505001959",img:"https://covers.openlibrary.org/b/isbn/9782505001959-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2007",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Le petit accident d’Ôishi a forcé Seigaku à improviser : Kikumaru se retrouve en double n° 2 avec Momoshiro. Hyôtei profite de la situation pour prendre le dessus. Nos deux joueurs sont en bien mauvaise posture et Kikumaru est prêt à renoncer. Par chance, les paroles d’Ôishi résonnent dans son cœur et commencent à devenir réalité. Parviendront-ils à s’en sortir ?!",isbn:"9782505001560",img:"https://covers.openlibrary.org/b/isbn/9782505001560-M.jpg"},
  {t:"Mashle",a:"Komoto Hajime",y:"2023",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeune",sup:"Imprimé",d:"Innocent Zero poursuit Mash après lui avoir arraché le coeur, mais est arrêté dans son élan par Domina. Ce dernier, qui avait sombré dans de la lave en fusion, resurgit pour barrer le passage à son redoutable père, au nom de l'amitié qui le lie à son ancien adversaire ! Pendant ce temps, les camarades de Mash, prêts à défier la mort, se démènent pour l'emmener auprès de Meliadoul. Réussiront-ils à atteindre leur destination malgré leurs blessures et les ennemis lancés à leurs trousses ? De son côté, Mash se retrouve à errer dans les limbes, où il fait une rencontre des plus incongrues...",isbn:"9782820346506",img:"https://covers.openlibrary.org/b/isbn/9782820346506-M.jpg"},
  {t:"One-Punch Man",a:"Murata Yusuke",y:"2026",ed:"Kurokawa",cote:"BD ONE",pub:"Jeune",sup:"Imprimé",d:"Saitama est trop puissant ; tellement puissant qu'il élimine tous les monstres les plus farouches avec un simple coup de poing. Découvrez l'histoire du plus puissant des super-héros dans ce manga qui va vous mettre K. O. !! L'affrontement entre Garoh et Saitama est si violent que la Terre est au bord de la destruction. La lutte acharnée, poings contre poings, se poursuit jusque dans l'espace. Face à Garoh, qui exécute les techniques mortelles apprises jusqu'ici, Saitama passe en mode vénère. C'est alors qu'un événement inattendu se produit ! Disponible ne version collector !",isbn:"9791042021665",img:"https://covers.openlibrary.org/b/isbn/9791042021665-M.jpg"},
  {t:"The Ice Guy & The Cool Girl",a:"Tonogaya Miyuki",y:"2023",ed:"Mangetsu",cote:"BD ICE",pub:"Jeune",sup:"Imprimé",d:"\"Si c'est pour toi... Je suis prêt à tout ! \" D'un côté, nous avons Himuro, descendant des temps modernes de la célèbre femme des neiges. De l'autre, Fuyutsuki, sa collègue aussi gentille qu'unique... Mais aussi frais qu'ils puissent paraître, aucun des deux n'est doué en relations amoureuses. Saejima et Komori s'offrent une virée en moto, Katori se rend à une soirée dansante avec Otonashi... Quant à Himuro, il invite Fuyutsuki chez lui pour la première fois. Ensemble, ils ont prévu de regarder le film d'horreur dans lequel joue sa petite soeur. Mais plus que le film, c'est avant tout celle qu'il aime qui fera battre son coeur ! The Ice Guy & The Cool Girl est un manga publié originellement sur le compte Twitter de Miyuki Tonogaya. Grâce à son dessin magnifique et à ses personnages charismatiques, la mangaka nous offre une romance aussi chaleureuse que mignonne.",isbn:"9782382812266",img:"https://covers.openlibrary.org/b/isbn/9782382812266-M.jpg"},
  {t:"Mashle",a:"Komoto Hajime",y:"2024",ed:"Crunchyroll",cote:"BD MAS",pub:"Jeune",sup:"Imprimé",d:"Innocent Zero a atteint le stade ultime de son évolution et est désormais l'égal d'un dieu... Désespérés, les habitants du monde de la magie n'ont d'autre choix que de se prosterner à ses pieds. Mais c'est compter sans Mash, qui, avec sa musculature d'une tout autre dimension, s'est façonné une technique ravageuse ! Même mis en difficulté par son adversaire, il revient encore et toujours à la charge, galvanisé par le soutien du peuple tout entier ! Mash va-t-il prouver une dernière fois que la force de ses muscles et celle de son amitié sont capables d'accomplir des miracles ? !",isbn:"9782820348029",img:"https://covers.openlibrary.org/b/isbn/9782820348029-M.jpg"},
  {t:"Lois Lane & le challenge de l'amitié",a:"Ellis Grace",y:"2021",ed:"Urban Comics",cote:"BDJ ELL",pub:"Jeune",sup:"Imprimé",d:"A treize ans, Lois Lane est accro aux réseaux sociaux, et plus particulièrement aux challenges en tous genres que l'on trouve sur Internet. Alors pourquoi ne pas apporter sa pierre à l'édifice en créant sa propre chaîne de vidéos ? Après tout, c'est le début de l'été à Liberty View et dans quelques jours se tiendra la course annuelle de vélo du quartier. Une toile de fond idéale pour célébrer son \" amiversaire \" avec Kristen, sa meilleure amie, et lancer son #challengedelamitié dans l'espoir de gagner un tas d'abonnés. Alors quand Lois apprend que les feux d'artifice de la fête ont été volés, elle y voit une opportunité supplémentaire d'alimenter son projet et de prouver au monde à quel point elle et Kristen sont soudées. Elle n'avait pas imaginé une seule seconde qu'une autre fille puisse accaparer l'attention de son amie à un moment si important, ni que celle-ci prévoirait de partir en camp de vacances juste après la course, la laissant seule pour les semaines à venir. Le challenge de l'amitié est encore loin d'être gagné.",isbn:"9791026819974",img:"https://products-images.di-static.com/image/base/9791026819974-475x500-1.jpg"},
  {t:"Cath & son chat",a:"Cazenove Christophe",y:"2014",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"Sushi le chat passe ses journées à surveiller son territoire. Lorsque toute la famille décide de partir en camping ou à la montagne, il craint que d'autres chats viennent rôder autour de sa maison et de son jardin.",isbn:"9782818924587",img:"https://covers.openlibrary.org/b/isbn/9782818924587-M.jpg"},
  {t:"Chercher le bonheur",a:"Nille Peggy",y:"2022",ed:"Actes Sud",cote:"1042003331",pub:"Jeune",sup:"Imprimé",d:"Une nouvelle pépite signée Peggy Nille ! Une aventure pleine de philosophie et de poésie, où l'on suit les questionnements d'un petit pingouin sur le bonheur.",isbn:"9782330167783",img:"https://www.base-orb.fr/visuels-pim/image/base/9782330167783-475x500-1.jpg"},
  {t:"De l'autre côté de l'Arc-en-ciel",a:"Blue Beatrice",y:"2026",ed:"Little urban",cote:"A BLU",pub:"Jeune",sup:"Imprimé",d:"Elio n'aime pas le changement. Il ne quitte presque jamais le calme rassurant de sa chambre. Jusqu'au jour où il rencontre une petite flamme qui lui fait découvrir les merveilles de la nature et l'incite à s'ouvrir au monde extérieur. Une histoire MAGIQUE au rythme des saisons pour voir la vie du bon côté.",isbn:"9782374082288",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782374082288-475x500-1.jpg"},
  {t:"Gribouillis & Kraboutchat",a:"Bailly Pierre",y:"2025",ed:"Dupuis",cote:"BDJ BAI",pub:"Jeune",sup:"Imprimé",d:"Il est petit. Il est poilu. C'est Petit Poilu ! Le v'là parti de bon matin. Le vie parti et tout va bien. Mais ? ... Que se passe-t-il ? Ca se bouscule. Et tout bascule ! Un crayon à tailler. Des copeaux de toutes les couleurs. Des noeuds, des boucles et des entrelacs. Deux compères complètement fadas. Des folies, des pitreries, des dingueries... Vas-y, Petit Poilu, fonce ! Petit débrouillard de la vie ! Petit Poilu est un petit bonhomme curieux, optimiste et courageux qui plonge malgré lui dans des aventures extraordinaires dont il ressort toujours grande. Petit Poilu tord le cou aux idées reçues et apprend la vie en s'initiant aux relations humaines. Viens grandir avec lui !",isbn:"9782808510127",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782808510127-475x500-1.jpg"},
  {t:"Voisines",a:"Debrocq Aliénor",y:"2025",ed:"Bayard éditions",cote:"J DEB",pub:"Jeune",sup:"Imprimé",d:"Qui n'a jamais rêvé d'habiter en face de sa meilleure amie ? Lou et Lila sont meilleures amies depuis toujours, tout comme leurs mères. Elles vivent de part et d'autre d'une rue tranquille de Bruxelles. Ensemble, leurs deux famille forment une grande tribu de coeur. Soirées d'été, vacances à la campagne, sorties au parc : inséparables ! Et puis un jour, tout bascule. Désormais, ce sera chacun chez soi. Lou, désemparée, veut comprendre : où sont passés les liens qu'on pensait plus forts que tout ? Un roman très actuel : l'histoire d'amitié bouleversante entre deux fillettes à l'aube de l'adolescence Une plongée très juste au coeur de l'évolution d'une enfant, de ses 9 à ses 13 ans, avec ses métamorphoses, ses émotions, ses incertitudes.",isbn:"9791036374241",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791036374241-475x500-1.jpg"},
  {t:"Lincoln dans la ligne de mire",a:"Neidhardt Fred",y:"2025",ed:"Dupuis",cote:"BDJ NEI",pub:"Jeune",sup:"Imprimé",d:"Condamné au peloton d'exécution pour une désertion de trop, Blutch se retrouve emprisonné, avec pour voisine la mystérieuse Isabella Boyd, elle-même frappée de peine capitale pour intelligence avec l'ennemi. Parvenant à s'évader avec cette dernière, l'ancien caporal intègre un groupe de conspirateurs sudistes, qui vont lui demander d'abattre le président Lincoln ! Blutch, pacifiste par nature, parviendra-t-il à résister à l'insistance de ses nouveaux \"amis\" ? Cela s'annonce compliqué, car les charmes de la belle Isabella semblent l'éloigner des bras de Chesterfield qui, se sentant coupable de l'arrestation de son ami, le recherche désespérément... Entre grande aventure, gags en rafale et exploration de l'Histoire, Fred Neidhardt poursuit avec un épatant respect l'oeuvre de Raoul Cauvin, toujours en compagnie de l'inusable Willy Lambil ! Fred Neidhardt, à l'aise dans de nombreux registres, chausse les bottes des Tuniques Bleues pour des intrigues pleines d'humour et de culture. L'inépuisable Lambil est, comme toujours, impeccable.",isbn:"9782808507660",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808507660-475x500-1.jpg"},
  {t:"5 petits moutons",a:"Claire Céline",y:"2024",ed:"L'École des loisirs",cote:"A CHE",pub:"Jeune",sup:"Imprimé",d:"Cinq petits moutons jouent dans la forêt, mais ils doivent vite aller au lit avant que le soleil se couche, car le loup sort de chez lui à la nuit tombée. Hélas, les petits moutons ont oublié leurs doudous dans la forêt et, faute de moutons, le loup emporte les doudous pour en faire son repas. Les cinq petits moutons ont alors une idée pour aller sauver leurs doudous...",isbn:"9782211336840",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782211336840-475x500-1.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeune",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé pour n'accueillir que des cancres,   a tissé des liens avec Kaoruko Waguri, qui fréquente l'établissement des filles de bonne famille,   Kikyô. Malgré tout un monde qui les sépare, les deux jeunes trouvent une forme de réconfort dans les moments passés l'un avec l'autre.  Mais si la distance entre Rintarô et Kaoruko se réduit peu à peu, le mur entre leurs deux lycées demeure, et Rintarô se garde toujours de parler de cette relation à ses amis, ce qui finit par créer un malentendu entre eux...  Un soir après les cours, alors qu'il avait pris son courage à deux mains pour proposer à Kaoruko et son amie Subaru de se voir, une bande de lycéens vient le provoquer. Comment réussir à éviter la menace d'une bagarre ou pire... qu'ils s'en prennent aux filles?Roméo & Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d'émotions!",isbn:"9782373499773",img:"https://covers.openlibrary.org/b/isbn/9782373499773-M.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeune",sup:"Imprimé",d:"Rintarô Tsumugi, un élève du lycée Chidori qui rassemble des garçons au plus bas de l échelle scolaire, fait un jour la connaissance de Kaoruko Waguri, qui fréquente l établissement des filles de bonne famille, Kikyô.  Alors que Rintarô trouve un certain réconfort dans les moments passés avec la jeune fille, il restait préoccupé par le fossé entre leurs deux écoles, avant de finalement décider de présenter Kaoruko et Subaru à ses amis.  À partir de ce jour, de bonnes relations s installent petit à petit entre les six jeunes, et notre héros commence à s'ouvrir davantage à son entourage.  Invitant ses amis chez lui, il leur livre un récit de son enfance et leurs liens s'approfondissent.  Si sa mère se retrouve chamboulée par ces souvenirs et l évolution de son fils, de son côté, Rintarô s apprête à vivre un été sous le signe de la jeunesse et de l'amitié en compagnie de ses camarades !Un récit de jeunesse entre deux adolescents que tout oppose& et pourtant si proches.",isbn:"9782384963904",img:"https://covers.openlibrary.org/b/isbn/9782384963904-M.jpg"},
  {t:"Les Blagues de Toto T17",a:"Coppée Thierry",y:"2023",ed:"Delcourt",cote:"BDJ COP",pub:"Jeune",sup:"Imprimé",d:"Il est temps pour Toto de penser à son avenir ! Que veut il faire plus tard'Ou plutôt que ne veut il pas faire ! Car si l'avenir appartient à ceux qui se lèvent tôt, il ne va pas rester grand chose à Toto. Il prend donc les choses en mains car il n'est pas question de finir comme ces pauvres adultes qui ont des métiers terriblement déprimants. Vous imaginez s'il finit maitre d'école..",isbn:"9782413024538",img:"https://covers.openlibrary.org/b/isbn/9782413024538-M.jpg"},
  {t:"Héros en délire !",a:"Sobral Patrick",y:"2016",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Lorsque les forces du mal menacent l'amour et la paix sur Parodia, surgissent cinq héros Légendaires avec un seul et unique but : nous faire rire ! Après Les Légendaires et Les Légendaires - Origines, changement complet de registre avec cette série de gags en une planche qui mettront en scène aussi bien les principaux personnages de la série que leur créateur : le démiurge Maître Pamplemousse.",isbn:"9782756073453",img:"https://covers.openlibrary.org/b/isbn/9782756073453-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2020",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"En pleine bataille opposant le pays de Kôka à la province de Sen, les quatre dragons se prêtent au jeu des simulacres pour gagner du temps. En toute première ligne, Hak, qui se bat comme un forcené, finit par rencontrer Cuerbo et s'engage dans un duel acharné contre lui. Au même moment, le prêtre Gobi se rend au château de la province de Sen et fait irruption devant Yona et Yûlan, la femme de Cuerbo.",isbn:"9782811654382",img:"https://covers.openlibrary.org/b/isbn/9782811654382-M.jpg"},
  {t:"TKT",a:"Arca Fabien",y:"2026",ed:"Rouergue",cote:"J ARC",pub:"Adolescent",sup:"Imprimé",d:"Alors qu'il attend sa copie de brevet blanc, Tristan stresse, sa note va peser lourd dans son orientation. Trop mauvaise = filière professionnelle. Pas trop mauvaise = filière générale. Et alors qu'il attend, Tristan pense à Ava. Qu'est-ce qui a bien pu se passer entre eux ? Pourtant, c'était bien au début. Alors pourquoi, elle ne veut plus lui parler ? Au fond de lui, Tristan sait. Et c'est en attendant cette note, celle qui fera prendre ou pas un virage à sa vie d'ado, que les souvenirs remontent petit à petit. Ava est dans tous. C'est normal, Ava occupait toutes ses pensées. Ava occupe toujours ses pensées...",isbn:"9782812627873",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782812627873-475x500-1.jpg"},
  {t:"La prisonnière d'Antésalem",a:"Gazzotti Bruno",y:"2026",ed:"Rue de Sèvres",cote:"BDJ GAZ",pub:"Jeune",sup:"Imprimé",d:"Les Cinq ne sont pas revenus indemnes de leur expédition sur l'île au bord du monde mais ils savent désormais où Jezabel est retenue captive. Parti libérer la mystérieuse prisonnière en compagnie du Maître-Fou, Dodji découvre les ruines d'Antésalem, vestiges de la précédente guerre : éloigné de son camp, il ignore que Saul a déployé ses forces et se tient prêt à frapper. Convaincu d'oeuvrer pour le Bien, le jeune Imperator a activé de nouveaux Protecteurs et s'est doté d'une arme implacable : les Séraphins, une milice d'enfants-soldats d'une fidélité absolue, prêts à se sacrifier pour lui. Grisé par la puissance de ses pouvoirs, Saul lance une attaque sans pitié : la Nouvelle Guerre des Limbes a commencé.",isbn:"9782810206162",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782810206162-475x500-1.jpg"},
  {t:"Toilet-bound Hanako-kun T24",a:"AidaIro",y:"2026",ed:"Pika édition",cote:"BD TOI",pub:"Jeune",sup:"Imprimé",d:"Toujours dans ce monde modifié, Kô et Mitsuba sont conduits inconsciemment dans la Maison Rouge. De leur côté, Nene et ses amis se rendent également dans la bâtisse maudite pour en apprendre plus sur le passé de Hanako et de Tsukasa. En ces lieux maléfiques, la nouvelle vie des élèves de Kamome va se retrouver complètement chamboulée'",isbn:"9791043305740",img:"https://covers.openlibrary.org/b/isbn/9791043305740-M.jpg"},
  {t:"Le dernier des Mohicans",a:"Vermot Thibault",y:"2025",ed:"Éditions Sarbacane",cote:"C VER",pub:"Jeune",sup:"Imprimé",d:"Publié pour la première fois en 1826, Le Dernier des Mohicans est une vaste épopée mêlant vérité historique et personnages de fiction. Elle raconte l'expédition dans le nord-est américain, alors sauvage, d'un jeune officier anglais escortant deux soeurs vers la garnison de leur père. En chemin, ils devront déjouer pièges et embuscades des Iroquois, alliés des Français contre les Anglais dans les guerres de conquête du continent, de 1740 à 1804, et menés par le terrifiant Magua. Ils pourront en revanche s'appuyer sur Hawkeye, le chasseur blanc élevé par les Delaware alliés des Anglais, et ses deux amis Mohicans, père et fils.",isbn:"9791040805441",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040805441-475x500-1.jpg"},
  {t:"J'aime les comptines du monde entier",a:"Ivanovitch-Lair Albena",y:"2024",ed:"Rue du Monde",cote:"J 841.9 IVA",pub:"Jeune",sup:"Imprimé",d:"Partout sur Terre, des comptines rythment les jeux des enfants et, le soir venues, certaines viennent tendrement les endormir.  En voici une quarantaine, venues des quatre coins du monde, en français et dans leur langue d'origine.",isbn:"9782355047503",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355047503-475x500-1.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Seigaku et Saint-Rudolph s’acheminent vers la demi-finale. Durant les doubles n° 1 et n° 2, leurs équipes s’affrontent dans des face-à-face explosifs ! Un rythme à couper le souffle !!  Ôishi et Kikumaru perdent leur match alors que, de leur côté, Kaidô et Momo semblent avoir trouvé un terrain d’entente. Que nous réservent-ils ?",isbn:"9782871299356",img:"https://covers.openlibrary.org/b/isbn/9782871299356-M.jpg"},
  {t:"Prince du Tennis",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Le championnat de Tokyo a bel et bien commencé ! Tous les participants s'affrontent dans des matches enflammés avec pour unique objectif d'atteindre le championnat du Kantô ! Seigaku, qui jusqu'à présent enchaîne les victoires, se retrouve face au célèbre collège de Saint-Rudolph. Un nouveau challenge pour Ryoma et ses coéquipiers!",isbn:"9782871299158",img:"https://covers.openlibrary.org/b/isbn/9782871299158-M.jpg"},
  {t:"La forêt vivante",a:"Frigiel",y:"2025",ed:"Soleil",cote:"BDJ DER",pub:"Jeune",sup:"Imprimé",d:"Frigiel et Alice partent récupérer une cargaison de fruits qui est le repas préféré d'une des créatures du zoo d'Ernald. Pour cela, ils pénètrent dans une sombre forêt pour rejoindre le village d'Endless, où certains habitants ont disparu. Que se cache derrière tous ces arbres ? Frigiel et ses amis vont devoir se confronter à un danger mortel, face à un ennemi quasi indestructible.",isbn:"9782302104617",img:"https://covers.openlibrary.org/b/isbn/9782302104617-M.jpg"},
  {t:"Point de mire !",a:"Konomi Takeshi",y:"2006",ed:"Kana",cote:"BD PRI",pub:"Jeune",sup:"Imprimé",d:"Le match opposant Ryôma à Fuji Yûta est sur le point d'avoir lieu. Ce dernier n'est autre que le petit frère du prodigieux Fuji Shûsuke ! Ryôma va devoir faire face à cet excellent joueur surnommé \"le tueur gaucher\" et à son twist lifté surpuissant !! Ryôma s'en sortira-t-il indemne ?!",isbn:"9782871299653",img:"https://covers.openlibrary.org/b/isbn/9782871299653-M.jpg"},
  {t:"L'archéologie",a:"Beaumont Jacques",y:"2013",ed:"Fleurus",cote:"J 930.1 BEAU",pub:"Jeune",sup:"Imprimé",d:"11 doubles pages pour mieux connaître ce métier passionnant : la découverte d'un site, les étapes d'une fouille, l'archéologie sous-marine, le travail en laboratoire, les méthodes de datation et de reconstitution des vestiges, comment transmettre le passé?",isbn:"9782215115700",img:"https://products-images.di-static.com/image/base/9782215115700-120x160-1.jpg"},
  {t:"Les minéraux",a:"Beaumont Jacques",y:"2013",ed:"Fleurus",cote:"J 549 BEAU",pub:"Jeune",sup:"Imprimé",d:"Comment se forme les minéraux ? où les trouve-t-on ? En quoi sont-ils importants dans notre vie quotidienne ? Un livre pour tout savoir sur ce sujet qui captive les enfants. De belles doubles pages sur l'or, les diamants, les pierres précieuses et les minéraux extraordinaires, avec des précisions sur leur mode d'extraction et des histoires sur les pierres.",isbn:"9782215116219",img:"https://products-images.di-static.com/image/base/9782215116219-120x160-1.jpg"},
  {t:"Duels au collège",a:"Cazot Vero",y:"2026",ed:"Dupuis",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"Punie par sa mère pour lui avoir caché qu'elle faisait de la boxe malgré son interdiction formelle, trahie par Elias, son ex-meilleur ami, qui a tout cafté, harcelée par ses camarades de classe qui ne ratent pas une occasion de se moquer de son format réduit, Colette manque terriblement de moments un peu excitants dans sa vie. Et puis Astrid, qui la persécute depuis des années dans la cour de récréation, lui propose un marché : elle arrêtera de l'embêter si Colette accepte de faire quelques combats clandestins dans la salle de sport de l'école. Pour Colette, c'est l'occasion rêvée d'enfiler à nouveau des gants de boxe et de retrouver les sensations qu'elle avait précédemment adorées. \"Mi-mouche\", c'est le poids minimum pour faire des combats de boxe. C'est désormais également une série de bande dessinée d'une grande richesse, passant de la tragédie à la comédie. Avec beaucoup d'humour et ? on s'en doute ? énormément d'émotion.",isbn:"9782808506823",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808506823-475x500-1.jpg"},
  {t:"La base secrète",a:"Bocquet Olivier",y:"2025",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeune",sup:"Imprimé",d:"La nuit, sur un toit, trois enfants déguisés en superhéros fuient des robots belliqueux. Le garçon glisse... et se tue ! Comment Ziad, Louna et Billie en sont arrivés là ? Pour comprendre, il faut remonter aux funérailles du père de Louna et Ziad quand frère et soeur s'étaient juré de ne plus tenter de devenir des superhéros. Une promesse qu'ils n'avaient pas tenue longtemps...",isbn:"9782808505116",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782808505116-475x500-1.jpg"},
  {t:"Le temps suspendu",a:"Bocquet Olivier",y:"2024",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeune",sup:"Imprimé",d:"Ziad et Louna ont réussi tous les deux à se faire inviter aux Golden Powers, la soirée des récompenses pour superhéros. Mais la cérémonie ne se déroule pas tout à fait comme prévu : un pod de téléportation apparaît sur scène et des yeux géants en jaillissent et commencent à tirer dans la foule. C'est un vrai carnage parmi les superhéros présents. Ziad et Louna arrivent à fuir par le pod et se retrouvent en plein océan. Et Louna se noie... Fatiah et Amine, les parents de Ziad et Louna qui ont assisté, impuissants et tétanisés, à la retransmission télévisée du chaos et de l'horreur, sont interrogés par la police qui soupçonne leurs deux enfants d'êtres des \" supers \" ! Amine et Fatiah décident de prendre les choses en mains et s'incrustent dans l'enquête de police au grand dam de l'inspectrice qui la dirige. Dans Le Métier le plus dangereux du monde, Olivier Bocquet et Fabio Lai nous présentent une société légèrement futuriste où même les superhéros sont pervertis par l'argent et les réseaux sociaux. Ca n'empêche pas la série d'être passionnante, trépidante, émouvante et drôle. De la BD jubilatoire !",isbn:"9791034768578",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791034768578-475x500-1.jpg"},
  {t:"Face. Louna",a:"Bocquet Olivier",y:"2023",ed:"Dupuis",cote:"BDJ BOC",pub:"Jeune",sup:"Imprimé",d:"Nous sommes dans un monde légèrement futuriste où les superhéros sont légion. Il faut dire qu'une météorite s'est écrasée sur Terre et que chaque morceau de cette météorite donne des superpouvoirs. Il suffit de toucher un de ces cailloux pour en acquérir un... qu'on gardera jusqu'à la mort. Mais nous sommes aussi dans un monde hyper connecté de réseaux sociaux où seuls les superhéros bien cotés sur le web ont du travail. Parce que, quand vous vous faites agresser, vous allez faire appel à un superhéros qui a 98 ou 97 % d'avis positifs. Pas un loser à 83 %. La vie des superhéros n'est pas simple donc... Mais ça n'empêche pas la jeune Louna de rêver de devenir une superhéroïne. Malgré son physique chétif, elle a une volonté de fer et un désir ardent de faire régner la justice. Après avoir pris des cours de boxe, elle tente d'intégrer un groupe de superhéros. Et c'est là que vont commencer les gros ennuis...",isbn:"9791034750252",img:"https://covers.openlibrary.org/b/isbn/9791034750252-M.jpg"},
  {t:"Yuko",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001928",img:"https://images.epagine.fr/928/9782413001928_1_m.jpg"},
  {t:"Razzia",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Avant de devenir l'un des cinq Légendaires mythiques, Razzia s'appelait Korbo, l'ombre rouge. Pour venger sa famille, il tue un à un les membres de l'armée des mille loups. Jusqu'au jour où il croise la route de Ténébris qui lui propose de créer un monde meilleur et de diriger à ses côtés l'armée de son père, Darkhell, le sorcier noir.",isbn:"9782756064789",img:"https://products-images.di-static.com/image/base/9782756064789-475x500-1.jpg"},
  {t:"Au nom d'Amra",a:"Deschard Jean-Gaël",y:"2026",ed:"Vents d'Ouest",cote:"BDJ DES",pub:"Jeune",sup:"Imprimé",d:"Qui survivra au Jugement d'Amra ? Alors qu'Asmodée et Oni reviennent tout juste de leur périlleuse mission à Ferroc, le royaume de Sayran est en proie au chaos : un culte fanatique, celui d'Amra, a pris le contrôle de la ville, imposant sa foi par la force et la peur, et demandant expressément la libération de Sainte Namielle, leur Semi-déus guérisseuse. Mais les négociations tournent court, et pour écraser Amra, la Reine Bérénice n'hésite pas à libérer les plus dangereux des Semi-Déus enfermés depuis des années dans le Cloître Doré. Pendant ce temps, Asmodée et Orphée tentent un plan pour essayer de raisonner les Amraïtes. Mais Antios, l'archonte d'Amra, impose bientôt un jugement divin : les pouvoirs des Semi-Déus doivent être purifiés ou éradiqués. La tension monte, les alliances se brisent et les trahisons se multiplient. Une guerre sainte est sur le point d'éclater, opposant fanatiques, résistants et Semi-Déus. Ces derniers, longtemps utilisés comme armes, doivent choisir : se soumettre, fuir... ou se battre. Dans ce nouveau tome, les masques tombent, les secrets éclatent, et la frontière entre foi et folie devient floue. Un album captivant, entre intrigues politiques, manipulations et suspense, qui nous offre son florilège de personnages et une héroïne attachante dans un univers empreint de mystère.",isbn:"9782749310336",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310336-475x500-1.jpg"},
  {t:"The Ice Guy & The Cool Girl",a:"Tonogaya Miyuki",y:"2023",ed:"Mangetsu",cote:"BD ICE",pub:"Jeune",sup:"Imprimé",d:"\"Ne détourne pas le regard et regarde-moi dans les yeux ! \" D'un côté, nous avons Himuro, descendant des temps modernes de la célèbre femme des neiges. De l'autre, Fuyutsuki, sa collègue aussi gentille qu'unique... Mais aussi frais qu'ils puissent paraître, aucun des deux n'est doué en relations amoureuses. Entre le shopping pour la fête d'Halloween organisée par leur boîte, la visite du Jour de l'an au sanctuaire et la sortie par une nuit étoilée, Himuro serait-il en train de devenir bien plus qu'un simple collègue pour Fuyutsuki ? ! Dans tous les cas, entre elle et lui, la glace est définitivement brisée !",isbn:"9782382810507",img:"https://covers.openlibrary.org/b/isbn/9782382810507-M.jpg"},
  {t:"The Ice Guy & The Cool Girl",a:"Tonogaya Miyuki",y:"2023",ed:"Mangetsu",cote:"BD ICE",pub:"Jeune",sup:"Imprimé",d:"\"En fait, depuis notre voyage d'affaires, je n'arrête pas de penser à toi... \" D'un côté, nous avons Himuro, descendant des temps modernes de la célèbre femme des neiges. De l'autre, Fuyutsuki, sa collègue aussi gentille qu'unique... Mais aussi frais qu'ils puissent paraître, aucun des deux n'est doué en relations amoureuses. Invité chez Fuyutsuki, Himuro tente par tous les moyens de se rapprocher d'elle. Forts de leur complicité renouvelée, ils se soutiennent mutuellement au cours de leur déplacement professionnel et se retrouvent finalement au karaoké... où Fuyutsuki lui fait un surprenant aveu ! Cette fois, c'est sûr, ils sont bien plus que simples collègues !",isbn:"9782382811474",img:"https://covers.openlibrary.org/b/isbn/9782382811474-M.jpg"},
  {t:"Sanglillon",a:"Baer Julien",y:"2026",ed:"Kaléidoscope",cote:"A BAE",pub:"Jeune",sup:"Imprimé",d:"Sanglillon n'a pas une vie facile : il récure, cuisine, astique du matin au soir pendant que ses chipies de soeurs se prélassent. Jusqu'au jour où le bal royal est annoncé. Et si, pour une fois, c'était à son tour de briller ? Une version poilue et déjantée de Cendrillon, où le héros ne se laisse pas marcher sur les sabots !",isbn:"9782378883287",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782378883287-475x500-1.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2022",ed:"Ki-oon",cote:"BD RAn",pub:"Jeune",sup:"Imprimé",d:"",isbn:"9791032712153",img:"https://covers.openlibrary.org/b/isbn/9791032712153-M.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2022",ed:"Ki-oon",cote:"BD RAN",pub:"Jeune",sup:"Imprimé",d:"",isbn:"9791032712146",img:"https://covers.openlibrary.org/b/isbn/9791032712146-M.jpg"},
  {t:"La folle idée de Suzette la Mouette",a:"Carquain Sophie",y:"2026",ed:"La Joie de lire",cote:"J CAR",pub:"Jeune",sup:"Imprimé",d:"Quand Suzette la mouette rieuse et Niko le corbeau parisien débarquent en Normandie, c'est la surprise générale. Leur duo a de quoi étonner : l'une, fantasque et excessive, a toujours le bec ouvert, tandis que l'autre est calme et réfléchi. Mais pour les autres mouettes et goélands, il est surtout interdit de se mélanger entre oiseaux des villes et oiseaux des mers ! Niko parviendra-t-il à se faire une petite place sur la plage ? Son amitié avec Suzette survivra-t-elle à cette épreuve ?",isbn:"9782889860562",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782889860562-475x500-1.jpg"},
  {t:"Ranking of kings",a:"T?ka S?suke",y:"2023",ed:"Ki-oon",cote:"BD RAN",pub:"Jeune",sup:"Imprimé",d:"",isbn:"9791032712764",img:"https://covers.openlibrary.org/b/isbn/9791032712764-M.jpg"},
  {t:"400 fourmis, 3 souris et 1 genou d'éléphant",a:"Taboni Sophie",y:"2026",ed:"Frimousse",cote:"A TAB",pub:"Jeune",sup:"Imprimé",d:"Un imagier qui remet tout le monde à sa place ! Vous êtes-vous déjà demandé ce que l'on pourrait mettre dans un livre de 22 cm ? Suivons cette enfant curieuse qui s'est, pour l'occasion, faite toute petite... - Peut-on faire rentrer une fourmi ? - Oui ! Plein de fourmis, même ! - Un poussin ? - Oui ! Ca tient ! Et ainsi de suite, du plus petit au plus grand... Vont-ils tous rentrer dans le livre ? C'est au lecteur de le découvrir !",isbn:"9782383496014",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496014-475x500-1.jpg"},
