<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouvelles acquisitions Jeunesse — Médiathèque d'Arcachon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;}

  :root{
    --bg:        #f5f2ed;
    --panel:     #ffffff;
    --accent:    #3d6b4f;
    --accent2:   #c8a45a;
    --text-dark: #1a1a1a;
    --text-mid:  #4a4a4a;
    --text-light:#8a8a8a;
    --tag-bg:    #e8f0eb;
  }

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}

  /* ── STRUCTURE PRINCIPALE ─────────────────────────────── */
  #stage{
    position:relative;
    width:100vw;height:100vh;
    display:flex;align-items:stretch;
  }

  /* ── SLIDE ────────────────────────────────────────────── */
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:stretch;
    opacity:0;
    transition:opacity .9s ease;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto;}
  .slide.ville{background:#000;display:block;}
  .slide.ville img{width:100%;height:100%;object-fit:cover;display:block;}
  

  /* Colonne gauche : couverture */
  .slide-cover{
    flex:0 0 52%;
    background:#e8e4de;
    position:relative;
    overflow:hidden;
  }
  /* Fond flouté de la couverture */
  .slide-cover-blur{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    filter:blur(18px) brightness(.7) saturate(.6);
    transform:scale(1.1);
    opacity:.5;
  }
  .slide-cover img{
    position:absolute;
    inset:20px;
    width:calc(100% - 40px);
    height:calc(100% - 40px);
    object-fit:contain;
    object-position:center;
    border-radius:3px;
    filter:drop-shadow(0 12px 32px rgba(0,0,0,.4));
  }

  /* Badge public visé */
  .pub-badge{
    position:absolute;top:22px;left:22px;
    background:var(--c-accent);color:#fff;
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;
    padding:5px 12px;border-radius:20px;
    z-index:2;
  }

  /* Colonne droite : infos */
  .slide-info{
    flex:1;
    background:var(--panel);
    display:flex;flex-direction:column;justify-content:flex-start;
    padding:44px 56px 32px 52px;
    position:relative;
    overflow:hidden;
  }



  .slide-label{
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--c-accent);
    margin-bottom:14px;
  }

  .slide-title{
    font-family:'Playfair Display',serif;
    font-size:clamp(30px,4.4vw,58px);
    font-weight:700;
    color:var(--text-dark);
    line-height:1.18;
    margin-bottom:12px;
  }

  .slide-author{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:clamp(20px,2.4vw,32px);
    color:var(--c-accent);
    margin-bottom:6px;
  }

  .slide-meta{
    font-family:'Inter',sans-serif;
    font-size:15px;color:var(--text-light);
    margin-bottom:28px;
  }

  .slide-summary{
    font-family:'Inter',sans-serif;
    font-size:clamp(15px,1.5vw,20px);
    line-height:1.75;
    color:var(--text-mid);
    flex:1;
    overflow-y:auto;
    margin-bottom:20px;
    scrollbar-width:none;
  }
  .slide-summary::-webkit-scrollbar{display:none;}

  /* Tags infos */
  .slide-tags{
    display:flex;gap:12px;flex-wrap:wrap;
    margin-top:auto;
  }
  .tag{
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;
    background:var(--c-tag-bg);
    color:var(--c-accent);
    padding:6px 14px;border-radius:20px;
    letter-spacing:.04em;
  }
  .tag strong{
    color:var(--text-dark);
    font-weight:600;
    display:block;
    font-size:12px;
    margin-top:1px;
  }
  .tag span{
    color:var(--text-light);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  /* ── BARRE DE PROGRESSION ─────────────────────────────── */
  #progress-bar{
    position:fixed;left:52%;top:0;bottom:0;
    width:4px;background:rgba(0,0,0,.12);
    z-index:100;transform:translateX(-50%);
  }
  #progress-fill{
    width:100%;height:0%;
    background:#3d6b4f;
    transition:height linear;
    position:absolute;bottom:0;left:0;
  }

  /* ── LOGO MÉDIATHÈQUE ────────────────────────────────── */
  #logo{
    position:fixed;bottom:14px;right:20px;
    font-family:'Inter',sans-serif;
    font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-light);
    z-index:100;
  }

  /* ── SLIDE COMPTEUR ──────────────────────────────────── */
  #counter{
    position:fixed;bottom:14px;left:20px;
    font-family:'Inter',sans-serif;
    font-size:10px;color:var(--text-light);
    z-index:100;letter-spacing:.06em;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="logo">Médiathèque d'Arcachon</div>
<div id="counter"></div>

<script>
const DURATION = 15000; // durée d'affichage d'une diapo
// Diapos d'information de la ville (fichiers du dossier diapos_ville,
// téléversés sur OVH par generer_ecrans_maat.py). Une diapo ville

const NB_ENTRE_VILLE = 4;
const DIAPOS_VILLE=[
  "marche-aiguillon.jpg",

];

const SLIDES=[
  {t:"Revenez, amis martiens !",a:"Thinard Florence",y:"2026",ed:"Thierry Magnier",cote:"J THI",pub:"Adolescent",sup:"Imprimé",d:"Quand Eva, une collégienne solitaire et harcelée, recueille deux chats errants miraculeusement sauvés des eaux, elle ignore qu'elle se trouve face à FWFX et WDWC, des extraterrestres en mission secrète sur Terre. Nom de Mars, cette rencontre va changer sa vie ! C'est le début d'une aventure pleine de rebondissements, de télescopages improbables et de répliques inoubliables. Prêts, bande de schmulaââgs ramollis ? ! Des chats venus d'une autre planète, une ado en détresse, une vache complice : un roman aussi déjanté que jubilatoire !",isbn:"9791035209308",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209308-475x500-1.jpg"},
  {t:"La mémoire des vaincus",a:"Guillou Bleuenn",y:"2026",ed:"Didier jeunesse",cote:"J GUI",pub:"Adolescent",sup:"Imprimé",d:"A Novi Zora, tout s'achète, même les souvenirs. Voilà quatorze ans que la nation, vaincue par Mirska lors d'une guerre sans merci, vit dans la honte et la misère. Anastasia connaît bien la valeur de la poussière mémorielle : elle a vendu son passé pour devenir voleuse de souvenirs. Ses missions, de plus en plus dangereuses, la mènent jusqu'au Parlement des Trente. C'est là que Lev compte trouver sa place en gravissant les échelons politiques, aidé d'un mentor anonyme. Contrairement à ses traîtres de parents, effacés de toutes les mémoires par le châtiment de la damnatio memoriae, il entend marquer l'Histoire en restaurant la gloire de sa patrie. Mais dans les coulisses du Parlement, les souvenirs les plus précieux attisent les convoitises. Quand les échos du passé se heurtent aux ambitions de l'avenir, il faut parfois se méfier de sa propre mémoire...",isbn:"9782278132157",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782278132157-475x500-1.jpg"},
  {t:"La Légende de Tristan et Yseut",a:"Rachmühl Françoise",y:"2026",ed:"Flammarion",cote:"J RAC",pub:"Adolescent",sup:"Imprimé",d:"Le roi Marc de Cornouailles a décidé de prendre pour épouse la belle Yseut et charge son neveu, le chevalier Tristan, d'aller la trouver en Irlande. Mais sur le bateau du retour, les deux jeunes gens boivent par erreur un philtre d'amour. Désormais, ils sont condamnés à s'aimer à tout jamais... Retrouvez un des couples les plus mythiques de la littérature dans ce roman de chevalerie et d'amour, adapté par Françoise Rachmuhl.",isbn:"9782080497314",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080497314-475x500-1.jpg"},
  {t:"Tout ce que je ne sais pas",a:"Lume Chloé",y:"2026",ed:"Éditions Sarbacane",cote:"J LUM",pub:"Adolescent",sup:"Imprimé",d:"Eléonore a eu un accident. Après un an de convalescence, elle sort de son cocon pour se confronter à sa vie d'avant, dont elle a tout oublié. Anciens amis, amoureux, profs... ont chacun une version différente de qui elle était, et de ce qui s'est réellement passé. Plus elle tente de reconstituer le puzzle, plus la vérité lui échappe. Que cherche-t-on à lui cacher ?",isbn:"9791040809326",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040809326-475x500-1.jpg"},
  {t:"Ces promesses qu'on croyait éternelles",a:"Gorman Nine",y:"2025",ed:"Albin Michel",cote:"J GOR",pub:"Adolescent",sup:"Imprimé",d:"Ils pensaient que leur amitié était écrite dans les étoiles. Mais depuis leur séjour à Las Vegas, quelque chose s’est brisé entre Kenna et Kurt. Leurs regards se fuient, laissant place à l’incompréhension[xe2][x80][xa6] Dans le silence qui ponctue désormais leur relation, ils s’accrochent à leurs ultimes repères. Kenna emménage avec son cousin Wes, qui lui apporte la sécurité et la stabilité dont elle pense avoir besoin. Kurt, lui, se met en couple avec une fille qui comprend sa différence, bien qu’au fond il sache qu’une seule personne fait véritablement battre son cœur. Sa meilleure amie",isbn:"9782226503442",img:"https://covers.openlibrary.org/b/isbn/9782226503442-M.jpg"},
  {t:"L'Exilée",a:"De Castell Sebastien",y:"2026",ed:"Gallimard",cote:"J DEC",pub:"Adolescent",sup:"Imprimé",d:"Le dernier tome des aventures de Furia Perfax, l'héroïne que rien n'arrête. Un univers de fantasy sombre et fascinant, entre action spectaculaire et humour incisif ! En libérant la belle Arissa des geôles berabesa, Furia fait la rencontre de Chedran, l'un des derniers Mahdek. Déchirée entre son amour naissont et l'appel de ses origines, elle est confrontée à un choix qui pourrait sceller son avenir et celui de son peuple.",isbn:"9782075215251",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075215251-475x500-1.jpg"},
  {t:"A not so innocent deal",a:"Messina Lynn",y:"2025",ed:"Fleurus",cote:"J MES",pub:"Adolescent",sup:"Imprimé",d:"A vingt-et-un ans, Catherine Fellingham découvre que sa famille risque la faillite et le scandale : pour régler les dettes de son époux, Lady Fellingham s'est enlisée dans une affaire de pots-de-vin. Catherine supplie la complice de sa mère, Lady Courtland, de mettre fin à ces manigances... mais, en contrepartie, elle doit accepter un arrangement : se livrer à une autre saison pour trouver un mari. Après trois années sans que le moindre prétendant s'intéresse à elle, Catherine accepte à contrecoeur. Lorsqu'elle découvre que le célèbre Lord Deverill a été chargé de feindre un intérêt pour elle pour que d'autres la remarquent... et qu'il juge cette mission impossible, Catherine décide que c'en est trop. Humiliée, elle compte rendre au marquis la monnaie de sa pièce et le prendre à son propre jeu. A moins, bien sûr, que son coeur n'en fasse qu'à sa tête...",isbn:"9782215199908",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215199908-475x500-1.jpg"},
  {t:"Les derniers retrouveurs",a:"Dixen Victor",y:"2024",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Les derniers retrouveurs Chaque jour, des objets et des gens disparaissent. Vous les pensez perdus ? Ils ont été volés par des créatures avides, venues d'un autre monde pour arracher des morceaux du nôtre : les croquemitaines. La vie de Lucy bascule quand sa mère disparaît mystérieusement. La jeune orpheline est contrainte de quitter sa campagne et d'aller vivre à New York chez sa tante Doris, qui l'oblige à voler dans les trains pour payer son \"loyer\". Jusqu'au jour où Lucy fait la connaissance de Rita Perdido, une femme entourée de secrets, qui lui propose de rejoindre son agence de retrouvage. Lucy découvre qu'elle fait partie d'une caste en voie de disparition : les retrouveurs. Depuis la nuit des temps, ces humains ont le pouvoir de pénétrer dans les oubliettes pour en rapporter les objets, les personnes et les souvenirs perdus. Persuadée que sa mère a été enlevée par un croquemitaine, Lucy se lance à sa recherche. Mais ce n'est pas seulement le sort de sa famille qui est en jeu : à mesure que s'éteigne les derniers retrouveurs, les croquemitaines gagnent en puissance et préparent leur effroyable revanche contre la surface...",isbn:"9791036374692",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036374692-475x500-1.jpg"},
  {t:"Le musée effacé",a:"Dixen Victor",y:"2025",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Depuis des siècles, les marais de Floride dévorent des personnes et engloutissent des trésors. Dans leurs sombres profondeurs, loin du soleil tropical de la surface, les croquemitaines attendent leur heure. Luciole \"Lucy\" Lachance et Jasper Tan commencent leur apprentissage de retrouveurs dans le Sunshine State, sous la houlette de Rita Perdido. Le temps presse pour retrouver les régalias maudits et éviter l'ascension d'un Haut-Roi des croquemitaines. Les membres de l'agence Perdido comptent profiter de la célèbre Foire d'Art Contemporain de Miami pour tendre un piège à la Muse Malade, détentrice du deuxième régalia. Cette effaceuse hante les artistes de génie depuis des siècles, volant leurs idées et les poussant à la folie. Mais depuis les palaces luxueux de South Beach jusqu'aux mangroves ancestrales du fin fond de la Floride, Luciole et Jasper vont découvrir que l'attaque des croquemitaines contre la surface est plus imminente que jamais...",isbn:"9791036365225",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036365225-475x500-1.jpg"},
  {t:"Eiao",a:"Ledun Marin",y:"2026",ed:"Au vent des îles",cote:"J LED",pub:"Adolescent",sup:"Imprimé",d:"En Polynésie, dans Les années 1970, La France mène des essais nucléaires qui meurtrissent la région et mettent en danger ses habitants ainsi que sa faune et sa flore. Quand elle arrive à Eiao en 1972, à 19 ans, Simone pense avoir été embauchée par une compagnie de forage minier, mais L'Arvecom semble cacher ses véritables intentions... Au contact d'autres employés et du mystérieux Tahi, elle s'engage dans une Lutte qui La dépasse. En explorant les îles des Marquises et la jeunesse de la mère du futur lieutenant Morel de son roman Henua, Marin Ledun plonge dans un passé tourmenté et tumultueux, et nous entraîne dans une histoire d'amour radioactive.",isbn:"9782367346540",img:"https://products-images.di-static.com/image/orb-ef67b8aadc689cbb3d743f72577b9d21/9782367346540-475x500-1.jpg"},
  {t:"TKT",a:"Arca Fabien",y:"2026",ed:"Rouergue",cote:"J ARC",pub:"Adolescent",sup:"Imprimé",d:"Alors qu'il attend sa copie de brevet blanc, Tristan stresse, sa note va peser lourd dans son orientation. Trop mauvaise = filière professionnelle. Pas trop mauvaise = filière générale. Et alors qu'il attend, Tristan pense à Ava. Qu'est-ce qui a bien pu se passer entre eux ? Pourtant, c'était bien au début. Alors pourquoi, elle ne veut plus lui parler ? Au fond de lui, Tristan sait. Et c'est en attendant cette note, celle qui fera prendre ou pas un virage à sa vie d'ado, que les souvenirs remontent petit à petit. Ava est dans tous. C'est normal, Ava occupait toutes ses pensées. Ava occupe toujours ses pensées...",isbn:"9782812627873",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782812627873-475x500-1.jpg"},
  {t:"L'automne des aspirants",a:"Puysségur Alain T.",y:"2023",ed:"Scrineo",cote:"J PUY",pub:"Adolescent",sup:"Imprimé",d:"Qui a dit que les chats ne pouvaient pas faire de la magie ? Suivez les premières aventures de Kovhan, Bruyne, Lexios et Serenya, et découvrez avec eux les secrets du Manoir de Castlecatz... \" Il n'existe pas d'endroit plus prestigieux que le Manoir de Castlecatz pour étudier les arts occultes de la magie. C'est à Castlecatz que les Maggocatz les plus puissants sont formés. Mais pas seulement. Les meilleurs Mécanimateurs et les plus grands Alchimistes y étudient également depuis des siècles. \" Une nouvelle année de cours débute au Manoir de Castlecatz ! Kovhan rêve depuis toujours d'y entrer et de devenir Aspirant. Mais pour lui qui maîtrise si mal l'indispensable Maggocculture, triompher des épreuves d'admission n'est pas une tâche facile... Il y a pourtant pire. Une menace plane sur Castlecatz cet automne : des incidents magiques se multiplient, certains félins rapportent même avoir aperçu une horrible créature rôder dans les couloirs... Heureusement, le jeune chat peut compter sur Bruyne, son amie gourmande et malicieuse, ainsi que sur Lexios et Serenya, toujours prêts à lui filer un coup de patte !",isbn:"9782381672854",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782381672854-475x500-1.jpg"},
  {t:"Le Cataclysme",a:"Aupied Pauline",y:"2026",ed:"Gallimard",cote:"J AUP",pub:"Adolescent",sup:"Imprimé",d:"Eléments déchaînés, tentation du mal et destins tragiques : un final fracassant pour ce diptyque de fantasy. A peine sortis de Fort-Ressac, les Azuriens se retrouvent prisonniers au fond d'une grotte. Hors de question pour Nérée de les laisser dépérir comme de vieilles algues séchées ! Il convainc donc ses amis de repartir à l'aventure. Objectif : s'assurer contre les Pyres le soutien de Ryk, la plus terrible des prodiges. Alors que menace rien de moins que la fin du monde, Nérée est déterminé à être le héros de l'histoire. Quitte à affronter le Cataclysme, et peut-être même à perdre ses amis.",isbn:"9782075236096",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075236096-475x500-1.jpg"},
  {t:"Echec à la reine",a:"Ilesi Alyerel",y:"2026",ed:"Scrineo",cote:"J ILE",pub:"Adolescent",sup:"Imprimé",d:"Terrasul est dirigé par des reines masquées érigées au rang de divinités. La princesse Viviane est amenée à régner. En attendant, chaque été, ses parents l'envoient loin du palais pour qu'elle puisse vivre encore quelques moments d'insouciance. Elle y rencontre Andreas à qui elle est forcée de cacher sa véritable identité. Et ils tombent amoureux. Malheureusement, leurs devoirs respectifs finissent par les séparer. Car le jeune homme porte lui aussi de lourds secrets. Des années plus tard, Viviane se prépare à défendre son reinaume en guerre. Et se retrouve confrontée au spectre de ses décisions passées... Amour, trahison, complots, pouvoir... un roman magistral porté par de magnifiques personnages, confrontés à des choix impossibles...",isbn:"9782381674926",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782381674926-475x500-1.jpg"},
  {t:"L'Aube des dragons",a:"Mancusi Mari",y:"2026",ed:"Saxo",cote:"J MAN",pub:"Adolescent",sup:"Imprimé",d:"Les dragons arrivent. Etes-vous prêts ? Le monde extérieur est devenu dangereux. Des incendies ravagent les terres et rendent l'air quasiment irrespirable. Comme tous les habitants de sa ville, Lucas est donc forcé de passer la majorité de son temps à la maison. Son ami Noah est persuadé que des dragons sont à l'origine des feux, mais Lucas a du mal à y voir plus que des théories du complot... Pourtant, quand la famille de Noah quitte précipitamment la région et que de mystérieux agents débarquent pour fouiller leur maison, Lucas commence à se demander si son ami n'approchait pas de trop près de la vérité. Décidé à connaître le fond de l'histoire, le jeune garçon fait alors une découverte qui menace de tout embraser...",isbn:"9782385701659",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701659-475x500-1.jpg"},
  {t:"Titanic",a:"Boudeville Peggy",y:"2026",ed:"Fleurus",cote:"J BOU",pub:"Adolescent",sup:"Imprimé",d:"Le 11 avril 1912, le Titanic s'élance en direction de New York avec, à son bord, plus de deux mille personnes. Parmi eux, Ernest ainsi que Juliette et sa famille, tous pleins d'espoir et de rêves. Mais, dans la nuit du 14 au 15 avril, l'impensable arrive : après avoir heurté un iceberg, le paquebot coule petit à petit dans les eaux glaciales de l'Atlantique. Ernest et Juliette vont alors devoir unir leurs forces et faire preuve d'un courage extraordinaire pour survivre et tenter de sauver des enfants perdus dans le chaos du naufrage.",isbn:"9782215197416",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215197416-475x500-1.jpg"},

// Palettes par public visé
const PALETTES = {
  'Jeunesse':   { accent:'#d4782a', tagBg:'#fdf0e6' },  // orange chaud
  'Adolescent': { accent:'#3a6ea8', tagBg:'#e6eef8' },  // bleu
  'Tout public':{ accent:'#3d6b4f', tagBg:'#e8f0eb' },  // vert (défaut)
};
function getPalette(pub){
  return PALETTES[pub] || PALETTES['Tout public'];
}

// Interleave par type de support pour alterner au maximum
function interleave(slides){
  const buckets = {};
  slides.forEach(s => {
    const key = s.sup || 'Imprimé';
    if(!buckets[key]) buckets[key] = [];
    buckets[key].push(s);
  });
  // Mélanger chaque bucket
  Object.values(buckets).forEach(b => {
    for(let i=b.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [b[i],b[j]]=[b[j],b[i]];
    }
  });
  // Round-robin entre les buckets
  const keys = Object.keys(buckets);
  const result = [];
  let more = true;
  while(more){
    more = false;
    keys.forEach(k => {
      if(buckets[k].length){
        result.push(buckets[k].shift());
        more = true;
      }
    });
  }
  return result;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Mélange les slides
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

// Teste chaque image en conditions réelles de navigateur avant de
// construire les slides (même principe que la mosaïque : certaines URLs
// passent une vérification serveur mais échouent quand même à charger
// depuis le navigateur -- ne jamais afficher un cadre vide à l'écran).
function imageChargeable(url){
  return new Promise(resolve=>{
    if(!url){ resolve(false); return; }
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function construirePoolValide(slides){
  const resultats = await Promise.all(slides.map(async s => ({s, ok: await imageChargeable(s.img)})));
  return resultats.filter(r => r.ok).map(r => r.s);
}

let pool = [];
let current = 0;
let timer = null;
let progTimer = null;

function buildSlide(data){
  if(data.ville){
    const s = document.createElement('div');
    s.className = 'slide ville';
    const im = document.createElement('img');
    im.src = data.img; im.alt = 'Information ville';
    s.appendChild(im);
    return s;
  }
  const slide = document.createElement('div');
  slide.className = 'slide';
  // Appliquer la palette selon le public
  const pal = getPalette(data.pub);
  slide.style.setProperty('--c-accent', pal.accent);
  slide.style.setProperty('--c-tag-bg', pal.tagBg);

  // Badge public
  const badge = document.createElement('div');
  badge.className = 'pub-badge';
  badge.textContent = data.pub || 'Jeunesse';

  // Colonne gauche
  const cover = document.createElement('div');
  cover.className = 'slide-cover';

  const blur = document.createElement('div');
  blur.className = 'slide-cover-blur';
  blur.style.backgroundImage = `url(${data.img})`;

  const img = document.createElement('img');
  img.src = data.img;
  img.alt = data.t;
  img.onerror = () => { cover.style.background = '#ddd8d0'; img.style.display='none'; };

  cover.appendChild(blur);
  cover.appendChild(badge);
  cover.appendChild(img);

  // Colonne droite
  const info = document.createElement('div');
  info.className = 'slide-info';

  const label = document.createElement('div');
  label.className = 'slide-label';
  label.textContent = 'Nouvelle acquisition';

  const title = document.createElement('div');
  title.className = 'slide-title';
  title.textContent = data.t || '';

  const author = document.createElement('div');
  author.className = 'slide-author';
  author.textContent = data.a || '';

  const meta = document.createElement('div');
  meta.className = 'slide-meta';
  const parts = [];
  if(data.y) parts.push(data.y);
  if(data.ed) parts.push(data.ed);
  meta.textContent = parts.join(' · ');

  const summary = document.createElement('div');
  summary.className = 'slide-summary';
  summary.textContent = data.d || '';

  // Tags
  const tags = document.createElement('div');
  tags.className = 'slide-tags';

  const tagData = [
    {label:'Cote', val:data.cote},
    {label:'Support', val:data.sup},
  ];
  tagData.forEach(td => {
    if(!td.val) return;
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.innerHTML = `<span>${esc(td.label)}</span><strong>${esc(td.val)}</strong>`;
    tags.appendChild(tag);
  });

  info.appendChild(label);
  info.appendChild(title);
  if(data.a) info.appendChild(author);
  if(parts.length) info.appendChild(meta);
  if(data.d) info.appendChild(summary);
  info.appendChild(tags);

  slide.appendChild(cover);
  slide.appendChild(info);
  return slide;
}

const stage = document.getElementById('stage');
const fill = document.getElementById('progress-fill');
const counter = document.getElementById('counter');

let builtSlides = [];

function showSlide(idx){
  builtSlides.forEach((s,i) => {
    s.classList.toggle('active', i === idx);
  });
  counter.textContent = (idx+1) + ' / ' + pool.length;
  // Mettre à jour la couleur de la barre selon le public du slide actif
  const pal = getPalette(pool[idx].pub);
  fill.style.background = pal.accent;
  document.getElementById('progress-bar').style.background = pal.accent + '33';
  startProgress();
}

function startProgress(){
  fill.style.transition = 'none';
  fill.style.height = '0%';
  // Délai minimal pour que le reset soit pris en compte avant la transition
  setTimeout(() => {
    fill.style.transition = `height ${DURATION - 300}ms linear`;
    fill.style.height = '100%';
  }, 50);
}

function next(){
  current = (current + 1) % pool.length;
  showSlide(current);
}

function tisserVille(catalogue, villes){
  if(!villes.length) return catalogue;
  const sortie = [];
  let v = 0;
  catalogue.forEach((s, i) => {
    sortie.push(s);
    if((i + 1) % NB_ENTRE_VILLE === 0){
      sortie.push({ville:true, img:villes[v % villes.length], pub:'Tout public'});
      v++;
    }
  });
  return sortie;
}

(async function demarrer(){
  const valides = await construirePoolValide(SLIDES);
  const villesValides = [];
  for(const u of DIAPOS_VILLE){
    if(await imageChargeable(u)) villesValides.push(u);
  }
  pool = tisserVille(interleave(valides), villesValides);
  builtSlides = pool.map(buildSlide);
  builtSlides.forEach(s => stage.appendChild(s));
  if(!pool.length) return;  // sécurité : aucune image chargeable
  showSlide(0);
  timer = setInterval(next, DURATION);
})();
</script>
