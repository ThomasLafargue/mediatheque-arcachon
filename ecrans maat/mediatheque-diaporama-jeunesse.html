<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouvelles acquisitions Jeunesse — Médiathèque d'Arcachon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;}

  :root{
    --bg:        #f5f2ed;
    --panel:     #ffffff;
    --accent:    #3d6b4f;
    --accent2:   #c8a45a;
    --text-dark: #1a1a1a;
    --text-mid:  #4a4a4a;
    --text-light:#8a8a8a;
    --tag-bg:    #e8f0eb;
  }

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}

  /* ── STRUCTURE PRINCIPALE ─────────────────────────────── */
  #stage{
    position:relative;
    width:100vw;height:100vh;
    display:flex;align-items:stretch;
  }

  /* ── SLIDE ────────────────────────────────────────────── */
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:stretch;
    opacity:0;
    transition:opacity .9s ease;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto;}

  /* Colonne gauche : couverture */
  .slide-cover{
    flex:0 0 52%;
    background:#e8e4de;
    position:relative;
    overflow:hidden;
  }
  /* Fond flouté de la couverture */
  .slide-cover-blur{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    filter:blur(18px) brightness(.7) saturate(.6);
    transform:scale(1.1);
    opacity:.5;
  }
  .slide-cover img{
    position:absolute;
    inset:20px;
    width:calc(100% - 40px);
    height:calc(100% - 40px);
    object-fit:contain;
    object-position:center;
    border-radius:3px;
    filter:drop-shadow(0 12px 32px rgba(0,0,0,.4));
  }

  /* Badge public visé */
  .pub-badge{
    position:absolute;top:22px;left:22px;
    background:var(--c-accent);color:#fff;
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;
    padding:5px 12px;border-radius:20px;
    z-index:2;
  }

  /* Colonne droite : infos */
  .slide-info{
    flex:1;
    background:var(--panel);
    display:flex;flex-direction:column;justify-content:flex-start;
    padding:44px 56px 32px 52px;
    position:relative;
    overflow:hidden;
  }



  .slide-label{
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--c-accent);
    margin-bottom:14px;
  }

  .slide-title{
    font-family:'Playfair Display',serif;
    font-size:clamp(30px,4.4vw,58px);
    font-weight:700;
    color:var(--text-dark);
    line-height:1.18;
    margin-bottom:12px;
  }

  .slide-author{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:clamp(20px,2.4vw,32px);
    color:var(--c-accent);
    margin-bottom:6px;
  }

  .slide-meta{
    font-family:'Inter',sans-serif;
    font-size:15px;color:var(--text-light);
    margin-bottom:28px;
  }

  .slide-summary{
    font-family:'Inter',sans-serif;
    font-size:clamp(15px,1.5vw,20px);
    line-height:1.75;
    color:var(--text-mid);
    flex:1;
    overflow-y:auto;
    margin-bottom:20px;
    scrollbar-width:none;
  }
  .slide-summary::-webkit-scrollbar{display:none;}

  /* Tags infos */
  .slide-tags{
    display:flex;gap:12px;flex-wrap:wrap;
    margin-top:auto;
  }
  .tag{
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;
    background:var(--c-tag-bg);
    color:var(--c-accent);
    padding:6px 14px;border-radius:20px;
    letter-spacing:.04em;
  }
  .tag strong{
    color:var(--text-dark);
    font-weight:600;
    display:block;
    font-size:12px;
    margin-top:1px;
  }
  .tag span{
    color:var(--text-light);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  /* ── BARRE DE PROGRESSION ─────────────────────────────── */
  #progress-bar{
    position:fixed;left:52%;top:0;bottom:0;
    width:4px;background:rgba(0,0,0,.12);
    z-index:100;transform:translateX(-50%);
  }
  #progress-fill{
    width:100%;height:0%;
    background:#3d6b4f;
    transition:height linear;
    position:absolute;bottom:0;left:0;
  }

  /* ── LOGO MÉDIATHÈQUE ────────────────────────────────── */
  #logo{
    position:fixed;bottom:14px;right:20px;
    font-family:'Inter',sans-serif;
    font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-light);
    z-index:100;
  }

  /* ── SLIDE COMPTEUR ──────────────────────────────────── */
  #counter{
    position:fixed;bottom:14px;left:20px;
    font-family:'Inter',sans-serif;
    font-size:10px;color:var(--text-light);
    z-index:100;letter-spacing:.06em;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="logo">Médiathèque d'Arcachon</div>
<div id="counter"></div>

<script>
const DURATION = 15000; // 25 secondes par slide

const SLIDES=[
  {t:"J'attends un petit frère ou une petite soeur",a:"Dolto-Tolitch Catherine",y:"2019",ed:"Gallimard-Jeunesse Giboulées",cote:"J 155.44 DOL",pub:"Jeune",sup:"Imprimé",d:"\"Bientôt nous aurons un bébé à la maison. Je me demande bien si c'est un frère ou une soeur. À partir de maintenant tout sera différent, ça me fait tout drôle, mais je crois que ce sera bien\".",isbn:"9782075115339",img:"https://covers.openlibrary.org/b/isbn/9782075115339-M.jpg"},
  {t:"Crazy Kart",a:"Davis Jim",y:"2013",ed:"Dargaud",cote:"BDJ DAV",pub:"Jeune",sup:"Imprimé",d:"Garfield décide cette fois de tester ses nouvelles inventions sur Odie et Jon. Au volant d?un bolide, il va entraîner ses amis dans une course-poursuite endiablée.",isbn:"9782205071528",img:"https://products-images.di-static.com/image/base/9782205071528-475x500-1.jpg"},
  {t:"Les carnets de l'apothicaire",a:"Nanao Itsuki",y:"2021",ed:"Ki-oon",cote:"BD CAR",pub:"Jeune",sup:"Imprimé",d:"Intrigues et poisons au cœur du palais impérial ! Après avoir réussi à sauver Lifa, Mao Mao est conviée à la réception d'hiver, un grand banquet qui réunit les personnalités les plus importantes de la cour intérieure. La jeune apothicaire ne s'y rend pas seulement en tant que dame de compagnie, mais aussi comme goûteuse de Gyokuyo...",isbn:"9791032707975",img:"https://covers.openlibrary.org/b/isbn/9791032707975-M.jpg"},
  {t:"Coeur d'etoile",a:"Colman Stéphane",y:"2013",ed:"Dupuis",cote:"BDJ BAT",pub:"Jeune",sup:"Imprimé",d:"",isbn:"9782800160429",img:"https://images-eu.ssl-images-amazon.com/images/I/51R0PZPfVQL.jpg"},
  {t:"(Pas encore) une histoire de sorcière",a:"Roussey Christine",y:"2026",ed:"La Martinière",cote:"A ROU",pub:"Jeune",sup:"Imprimé",d:"Vous en avez assez des histoires de sorcières traditionnelles ? Parfait ! Car voici l'histoire de Scarrrmozzaaaa, la sorcière la plus nulle, la plus moche et la plus terrifiante de tous les temps ! Avec sa verrue sur le nez, son chat Gros Relou et ses pieds qui puent, elle prépare sa GRANDE VENGEANCE dans sa cabane au fond des bois.",isbn:"9791040125631",img:"https://m.media-amazon.com/images/I/51s0MrgHsSL._SX195_.jpg"},
  {t:"La planète-trophée",a:"Russo Marco",y:"2024",ed:"Dupuis",cote:"BDJ RUS",pub:"Jeune",sup:"Imprimé",d:"Cela fait sept ans que Kyle a abouti sur cette planète lointaine et qu'il suit les cours sans grande conviction. Il faut dire que son don naturel le transforme en une espèce de singe qui se laisse très facilement distraire. Pas terrible comme pouvoir pour prétendre gagner le grand tournoi. Mais, un jour, il reconnaît sur Mohll la montre-talkie-walkie offerte à son anniversaire. Il commence à se souvenir de sa vie d'avant et n'a plus dorénavant qu'un but : retourner sur Terre et retrouver sa petite soeur !",isbn:"9791034767854",img:"https://covers.openlibrary.org/b/isbn/9791034767854-M.jpg"},
  {t:"Est-ce que vous êtes prêts ?",a:"Ma Daishu",y:"2026",ed:"minedition",cote:"A MA",pub:"Jeune",sup:"Imprimé",d:"La petite souris organise une fête. Est-ce que tout le monde sera prêt ? Une histoire qui se jour dans la pénombre et se termine dans la lumière de la fête.",isbn:"9782354137861",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137861-475x500-1.jpg"},
  {t:"Monstre rose",a:"Dios Olga de",y:"2026",ed:"Père Fouettard",cote:"A DIO",pub:"Jeune",sup:"Imprimé",d:"Monstre Rose est trop grand, trop rose, trop tout. Enfin c'est ce qu'il croit, ais ce ne sont pas les autres qui vont le contredire. Alors direction un monde à sa taille !",isbn:"9782371651494",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782371651494-475x500-1.jpg"},
  {t:"Les Schtroumpfs",a:"Peyo",y:"2023",ed:"Hachette",cote:"LJ PEY",pub:"Jeune",sup:"Imprimé",d:"Le Grand Schtroumpf, le Schtroumpf à Lunettes, la Schtroumpfette... Retrouve tes personnages préférés et de nombreux objets dans chacune des scènes schtroumpfantes de ce livre. A toi de jouer !",isbn:"9782017246787",img:"https://products-images.di-static.com/image/base/9782017246787-475x500-1.jpg"},
  {t:"Curiosity",a:"Motum Markus",y:"2019",ed:"Gallimard",cote:"J 523.4 MOT",pub:"Jeune",sup:"Imprimé",d:"Une aventure qui transcende la fiction et vous entraîne au-delà des étoiles, au coeur d'une des plus grandes questions de l'univers. Connaissez-vous Curiosity ? Découvrez l'incroyable histoire de ce rover envoyé sur Mars pour essayer de comprendre pourquoi cette planète autrefois accueillante est devenue hostile aujourd'hui. Doté de 17 caméras, de 6 roues motrices, d'un laboratoire portatif et d'un rayon laser, Curiosity sillonne Mars à la recherche d'une trace de vie et de la vérité.",isbn:"9782075136785",img:"https://products-images.di-static.com/image/base/9782075136785-475x500-1.jpg"},
  {t:"Petit Tête en l'air",a:"Lestrade Agnès de",y:"2026",ed:"Gautier-Languereau",cote:"A LES",pub:"Jeune",sup:"Imprimé",d:"Pour les étourderies, il n'y a pas plus fort que Petit tête en l'air ! Est-ce possible d'oublier de mettre son pantalon, de confondre le shampoing avec le dentifrice et de se tromper de maison ? Ce champion mérite bien son surnom. Mais heureusement, pour garder les pieds sur terre, il a sa famille et ses amis qui l'aiment à la folie !",isbn:"9782017348276",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782017348276-475x500-1.jpg"},
  {t:"Le Sac",a:"Adbåge Emma",y:"2026",ed:"Cambourakis",cote:"A HOB",pub:"Jeune",sup:"Imprimé",d:"Maman et papa ont fait le ménage ce week-end. On le voit tout de suite. Sauf qu'on ne peut pas ranger tant que ça sans rien jeter, pas vrai ? Et puis, ce grand sac noir, dans l'entrée, c'est suspect...",isbn:"9782386691003",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782386691003-475x500-1.jpg"},
  {t:"Miam, ouvre grand",a:"Montanari Eva",y:"2026",ed:"Thierry Magnier",cote:"A MON",pub:"Jeune",sup:"Imprimé",d:"Mâchoire serrée, assiette renversée, pas question d'avaler cette bouchée ! Et si le repas quittait la table pour devenir une grande aventure à vivre en famille ?",isbn:"9791035209278",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209278-475x500-1.jpg"},
  {t:"Neige",a:"Brunet Anaïs",y:"2021",ed:"Didier jeunesse",cote:"A BRU",pub:"Jeune",sup:"Imprimé",d:"Un album qui raconte l'attente, le ciel en coton, la légèreté des premiers flocons, les mains qui rougissent, le bonheur des luges qui glissent et des pas qui crissent, le scintillement de la glace, la neige qui fond, et les premiers bourgeons gorgés d'eau et de promesses…L'univers graphique d'Anaïs Brunet est fort, sensible et singulier. Ses peintures nous transportent au cœur d'une nature merveilleuse.",isbn:"9782278097852",img:"https://m.media-amazon.com/images/I/512ueUS5neL._SX195_.jpg"},
  {t:"C'est dans ma nature !",a:"Salerno Angela",y:"2026",ed:"La Martinière",cote:"A SAL",pub:"Jeune",sup:"Imprimé",d:"Es-tu de nature plutôt bavarde, timide, espiègle, impatiente, câline, ou tout cela à la fois ?",isbn:"9791040126027",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040126027-475x500-1.jpg"},
  {t:"Le carnaval",a:"Luciani Brigitte",y:"2012",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeune",sup:"Imprimé",d:"Monsieur Blaireau et Madame Rebarde décident qu'ils vont tous vivre dans le même terrier !",isbn:"9782205067835",img:"https://products-images.di-static.com/image/base/9782205067835-475x500-1.jpg"},
  {t:"Le Cataclysme",a:"Aupied Pauline",y:"2026",ed:"Gallimard",cote:"J AUP",pub:"Adolescent",sup:"Imprimé",d:"Eléments déchaînés, tentation du mal et destins tragiques : un final fracassant pour ce diptyque de fantasy. A peine sortis de Fort-Ressac, les Azuriens se retrouvent prisonniers au fond d'une grotte. Hors de question pour Nérée de les laisser dépérir comme de vieilles algues séchées ! Il convainc donc ses amis de repartir à l'aventure. Objectif : s'assurer contre les Pyres le soutien de Ryk, la plus terrible des prodiges. Alors que menace rien de moins que la fin du monde, Nérée est déterminé à être le héros de l'histoire. Quitte à affronter le Cataclysme, et peut-être même à perdre ses amis.",isbn:"9782075236096",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075236096-475x500-1.jpg"},
  {t:"Cycle 4 - Voyage au centr des terres",a:"Filippi Denis-Pierre",y:"2025",ed:"Vents d'Ouest",cote:"BDJ FIL",pub:"Jeune",sup:"Imprimé",d:"La quête ultime Egypte. Emilien, Noémie et Mathilde se retrouvent au coeur du désert. Traqués par Ursula et ses sbires qui veulent récupérer la sphère d'activation, les enfants n'ont d'autre choix que de faire confiance à leur guide Sélim et de fuir à bord d'une felouque des sables. Sous une chaleur écrasante, ils parviennent à franchir le mur de sable d'une tempête errante. Bientôt, ils atterrissent dans une cité cachée qui se trouve être le berceau de la civilisation ayant créé les technologies obscures ! Les enfants n'en croient pas leur yeux et l'espoir de retrouver leurs parents renaît ! Mais en explorant ce lieu, ils sont confrontés à une nouvelle menace : de monstrueux robots sauvages qui n'ont rien à voir avec leur gentil Robby les prennent en chasse... Par chance, Kiritsu et ses robots ninjas viennent en aide à nos jeunes explorateurs. Finalement coincés dans une antique bâtisse, encerclés par une horde de robots, il leur reste peu de temps pour percer le secret qui sommeille dans cet endroit mystérieux. Après avoir sillonné le monde, les enfants touchent presque au but. Parviendront-ils à retrouver leurs parents et à élucider l'énigme de l'origine des technologies obscures ? Ce dernier tome plein de rebondissements clôt une incroyable série fantastique qui a captivé les lecteurs depuis 2012 grâce à ses nombreuses péripéties, son intrigue bien ficelée et une galerie de personnages toujours en quête de vérité. Une saga à ne pas manquer !",isbn:"9782749310350",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782749310350-475x500-1.jpg"},
  {t:"Yona, Princesse de l'Aube T46",a:"Kusanagi Mizuho",y:"2026",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Yona et Zeno ont été a aspirés par la coupe de sang. À l'intérieur, ils retrouvent les autres guerriers dragons. Enfin réunie, la petite bande cherche à s'échapper et à rentrer sur Terre'",isbn:"9791043307638",img:"https://covers.openlibrary.org/b/isbn/9791043307638-M.jpg"},
  {t:"Le prisonnier du Bouddha",a:"Franquin André",y:"1960",ed:"Dupuis",cote:"BDJ FRA",pub:"Jeune",sup:"Imprimé",d:"L'inventeur d'une machine capable de modifier le climat est enlevé. Spirou et Fantasio partent à sa recherche.",isbn:"9782800100166",img:"https://covers.openlibrary.org/b/isbn/9782800100166-M.jpg"},
  {t:"Bonne nuit !",a:"Tourlonias Joëlle",y:"2026",ed:"minedition",cote:"A TOU",pub:"Jeune",sup:"Imprimé",d:"Un livre interactif pour se préparer à aller au lit ! On se brosse les dents, on fait pipi, et on va au lit... et les peluches, où sont-elles ? Deux frères se préparent à se coucher. L'enfant suit toutes les étapes une à une et grâce aux tirettes et aux rabats sur chaque double page, il est aussi acteur de la lecture.",isbn:"9782354137755",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782354137755-475x500-1.jpg"},
  {t:"La sorcière aux yeux de lune",a:"Dahman Myriam",y:"2025",ed:"Gallimard",cote:"C DAH",pub:"Jeune",sup:"Imprimé",d:"Ses yeux peuvent voir la vérité même dans les âmes les plus secrètes. Découvrez le nouveau chef-d'oeuvre des créateurs du Talisman du loup et Leina et le Seigneur des Amanites, célébrant la sincérité et le pouvoir de l'amitié.",isbn:"9782075228732",img:"https://products-images.di-static.com/image/base/9782075228732-475x500-1.jpg"},
  {t:"A tes côtés",a:"Hughes Hollie",y:"2026",ed:"Kimane",cote:"A HUG",pub:"Jeune",sup:"Imprimé",d:"Une histoire rassurante et adorablement illustrée par Alex Latimer sur le lien indéfectible entre parent et enfant. \"Lorsque Petit Dino est séparé de sa maman par une tempête, il sait qu'il doit faire preuve de courage et la retrouver. Mais le monde peut être effrayant sans elle à ses côtés... La gentillesse des autres animaux et quelques indices laissés dans le sable aideront-ils à ramener Petit Dino auprès de sa maman ? Une histoire rassurante, en rimes, pour célébrer le lien indéfectible entre un parent et son enfant\".",isbn:"9782383224594",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383224594-475x500-1.jpg"},
  {t:"Les oursons de l'air",a:"Lobel Arnold",y:"2026",ed:"L'École des loisirs",cote:"J LOB",pub:"Jeune",sup:"Imprimé",d:"Dans le livre préféré de grand-père, il est écrit qu'un ours doit absolument savoir se promener, se reposer, attraper du poisson et grimper aux arbres. Ronald, Donald, Harold et Sam, eux, préfèrent jouer du violon, faire des triples saltos ou manier un lasso. Grand-père décide de prendre les choses en main.",isbn:"9782211349666",img:"https://products-images.di-static.com/image/base/9782211349666-475x500-1.jpg"},
  {t:"Les plus grands fleuves du monde",a:"Mehnert Volker",y:"2021",ed:"Rue du Monde",cote:"551.48 MEH",pub:"Jeune",sup:"Imprimé",d:"Un documentaire présentant 18 des plus grands fleuves du globe et ce qui les entoure : la faune, la flore, les villes, l'économie, les hommes au cours de leur histoire et les questions écologiques. Chaque double page donne de nombreuses informations sur chacun de ces cours d'eau grâce à des vignettes. Au centre de l'ouvrage, une quadruple page détaille en particulier ce qui a trait au Nil. ©Electre 2021",isbn:"9782355046681",img:"https://www.babelio.com/couv/CVT_Les-plus-grands-fleuves-du-monde_229.jpg"},
  {t:"Azur et le mystère de la pièce d'or",a:"Beauvais Clémentine",y:"2022",ed:"Rageot",cote:"A BEA",pub:"Jeune",sup:"Imprimé",d:"Paris, au tournant du XXe siècle. Pour gagner sa vie, Azur, orphelin, porte à vélo les lettres les plus urgentes de la capitale. Un jour, il remarque une enveloppe différente des autres. A l'intérieur, il y a... une pièce d'or ! Azur se laisse tenter : il garde la pièce et le message qu'il devait livrer...",isbn:"9782700277289",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782700277289-475x500-1.jpg"},
  {t:"Avant moi",a:"Houssais Emmanuelle",y:"2026",ed:"Editions du Ricochet",cote:"A HOU",pub:"Jeune",sup:"Imprimé",d:"Un album unique qui raconte l'évolution aux plus jeunes. Ce magnifique album répond avec simplicité aux questions des enfants sur l'origine de la vie sur Terre. Depuis le Big Bang jusqu'à la naissance d'un enfant, chaque étape de l'évolution est expliquée : formation des planètes, premières formes de vie dans les océans, apparition de la vie terrestre... Le texte est accompagné de sublimes illustrations vives et colorées pour une immersion complète !",isbn:"9782352635574",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782352635574-475x500-1.jpg"},
  {t:"Le jour où je suis devenue plus méchante que le loup",a:"Javaux Amélie",y:"2026",ed:"Mijade",cote:"J JAV",pub:"Jeune",sup:"Imprimé",d:"Dans mon école, il y a un méchant loup. Elle s'appelle Agnès et se déplace toujours avec sa meute. Pour que ses moqueries cessent et avoir moi aussi des super copines... je suis devenue plus méchante que le loup.",isbn:"9782807702752",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782807702752-475x500-1.jpg"},
  {t:"Le voyage dans le temps",a:"Mallorquí César",y:"2026",ed:"Editions Casterman",cote:"J MAL",pub:"Jeune",sup:"Imprimé",d:"Une suite attendue pour la série à succès ! Quand un bébé nommé Kid est laissé à l'entrée de l'école Zener, Axel est loin de s'imaginer qu'il s'apprête à vivre sa plus folle aventure ! Car si le bambin semble a priori inoffensif, il est capable de voyager à travers le temps et l'espace. C'est ainsi qu'Axel, Lola et Treize se retrouvent malgré eux projetés d'une bataille médiévale à la destruction de Pompéi au péril de leurs vies... Mais la situation dégénère encore quand des créatures tout droit sorties de la préhistoire commencent à apparaître dans le pensionnat. Le temps presse, Axel et ses amis doivent trouver un moyen d'arrêter cet enfant avant qu'il ne détruise l'école !",isbn:"9782203300187",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203300187-475x500-1.jpg"},
  {t:"Encore une folle semaine pour M. Dubois",a:"Lewis-Jones Huw",y:"2026",ed:"Kimane",cote:"A LEW",pub:"Jeune",sup:"Imprimé",d:"Un lundi matin, M. Dubois découvre que l'ours a emprunté son vélo et l'a cassé. Les roues sont toutes tordues. Comment va-t-il pouvoir se rendre au travail ? Encore une folle semaine qui commence pour M. Dubois et il n'est pas au bout de ses surprises !",isbn:"9782383224761",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383224761-475x500-1.jpg"},
  {t:"La Terre déchirée",a:"Hicks Faith Erin",y:"2019",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeune",sup:"Imprimé",d:"La tribu Dao va s'allier aux Yisun pour mener une offensive contre le général Erzi et ses troupes qui font régner la terreur. Rat et Kai veulent voler le livre de Napatha contenant la formule de destruction massive, avant que l'habile Mura ne la revende aux nations pour entretenir les guerres. ©Electre 2019",isbn:"9782369813767",img:"https://products-images.di-static.com/image/base/9782369813767-475x500-1.jpg"},
  {t:"Silence of the lamps",a:"Midam",y:"2022",ed:"Dupuis",cote:"BDJ MID",pub:"Jeune",sup:"Imprimé",d:"De nouvelles aventures de Kid Paddle, qui, cette fois, apprend à capturer un Blork, à utiliser un Copy 2000 ou encore à comprendre où atterrit l'argent glissé dans la fente d'une caisse automatique. ©Electre 2022",isbn:"9791034763122",img:"https://products-images.di-static.com/image/base/9791034763122-475x500-1.jpg"},
  {t:"Quatre filles et une coloc",a:"Tsuno Mizoko",y:"2026",ed:"Groupe Delcourt",cote:"BD QUA",pub:"Jeune",sup:"Imprimé",d:"Employée de bureau de 28 ans, Shûko Maeda vit en colocation avec trois amies : Eika Matsuki, une forcenée du travail, Misaki Kawaseda, une artiste romantique, et Shio Momoyama, une indépendante née sous une bonne étoile",isbn:"9782413090250",img:"https://covers.openlibrary.org/b/isbn/9782413090250-M.jpg"},
  {t:"Jaloux comme Manchot !",a:"Lewis-Jones Huw",y:"2026",ed:"Milan",cote:"A LEW",pub:"Jeune",sup:"Imprimé",d:"Comment peut-on être jaloux des mouettes ? Elles savent voler, et alors ? Après tout, il suffit d'avoir des ailes ! Pour Manchot, rien d'impossible... ou presque !",isbn:"9782408060435",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408060435-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2025",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Yona et Hak sont de retour à Kûto. Tandis que l atmosphère se fait de plus en plus pesante, ils se dirigent là où tout a commencé pour Zeno, au château de Hiryû...",isbn:"9791043303098",img:"https://covers.openlibrary.org/b/isbn/9791043303098-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2025",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Zeno a enfermé l les trois autres dragons dans la coupe de sang. Il explique alors que pour pouvoir mettre fin à ses jours, il doit renvoyer les guerriers dragons au ciel. Puis il fait ses adieux à Yona et Hak&",isbn:"9791043300134",img:"https://covers.openlibrary.org/b/isbn/9791043300134-M.jpg"},
  {t:"Fan de carotte",a:"Ilustrajo Mariajo",y:"2026",ed:"Glénat Jeunesse",cote:"A ILU",pub:"Jeune",sup:"Imprimé",d:"Au potager, monsieur Lapin bêche, sème, arrose et surveille. Mais quand arrive le moment de la récolte, il va faire une rencontre très spéciale : une carotte qui danse et qui chante, une carotte un poil envahissante ! Comment dire, monsieur Lapin n'est pas très \"fan\" de cette carotte, lui qui tient plus que tout à sa solitude. Ah oui ? Vraiment ? !",isbn:"9782344070048",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344070048-475x500-1.jpg"},
  {t:"L'Aube des dragons",a:"Mancusi Mari",y:"2026",ed:"Saxo",cote:"J MAN",pub:"Adolescent",sup:"Imprimé",d:"Les dragons arrivent. Etes-vous prêts ? Le monde extérieur est devenu dangereux. Des incendies ravagent les terres et rendent l'air quasiment irrespirable. Comme tous les habitants de sa ville, Lucas est donc forcé de passer la majorité de son temps à la maison. Son ami Noah est persuadé que des dragons sont à l'origine des feux, mais Lucas a du mal à y voir plus que des théories du complot... Pourtant, quand la famille de Noah quitte précipitamment la région et que de mystérieux agents débarquent pour fouiller leur maison, Lucas commence à se demander si son ami n'approchait pas de trop près de la vérité. Décidé à connaître le fond de l'histoire, le jeune garçon fait alors une découverte qui menace de tout embraser...",isbn:"9782385701659",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701659-475x500-1.jpg"},
  {t:"Je serai un homme des cavernes",a:"Mozzillo Angelo",y:"2026",ed:"L'École des loisirs",cote:"A MOZ",pub:"Jeune",sup:"Imprimé",d:"Devenir président, banquier ou commandant ? Non merci, quel ennui ! Alors qu'il existe depuis la nuit des temps un emploi qui permet d'être tout cracra, de manger avec ses doigts, de grogner, et de pêcher ses crottes de nez : homme des cavernes. Mais même avec la vocation, c'est une dure profession... Pour bien la pratiquer, mieux vaut commencer tout de suite à s'entraîner !",isbn:"9782211349048",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782211349048-475x500-1.jpg"},
  {t:"L'inondation",a:"Modéré Armelle",y:"2026",ed:"Actes Sud",cote:"A MOD",pub:"Jeune",sup:"Imprimé",d:"Un soir d'orage, alors que la pluie ne cesse de tomber, la rivière déborde. La maison de Léa, enfouie dans un terrier, est submergée. Désemparée, elle fuit avec sa famille en quête d'un refuge. Mais quand tout semble désespéré, il reste toujours une lueur d'espoir.",isbn:"9782330215453",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330215453-475x500-1.jpg"},
  {t:"La fleur du souvenir",a:"Russo Marco",y:"2023",ed:"Dupuis",cote:"BDJ RUS",pub:"Jeune",sup:"Imprimé",d:"Une fois de plus, Kyle, sept ans, se fait embêter par trois brutes à peine plus âgées que lui. En cause : la tache de naissance de Selen, sa petite soeur, objet de moqueries de tous les enfants. Kyle adore sa soeur mais ne peut pas s'empêcher de lui en vouloir : personne n'est venu à son anniversaire de peur d'une maladie contagieuse ! Après avoir fini de bouder dans sa cabane dans le jardin, il rejoint la maison familiale... avant de disparaître dans un rayon de lumière ! En route pour une planète mystérieuse dont les dirigeants ont de grands projets pour lui... Marco Russo et Alessio Zonno nous livrent un récit touchant de SF avec un héros qui, a priori, a peu de chances de s'en sortir. Un graphisme largement influencé par le manga tout à fait adapté à un jeune public.",isbn:"9791034762361",img:"https://covers.openlibrary.org/b/isbn/9791034762361-M.jpg"},
  {t:"Pourquôôââ ?",a:"Voutch",y:"2026",ed:"Thierry Magnier",cote:"A VOU",pub:"Jeune",sup:"Imprimé",d:"Les enfants grenouilles sont comme les autres : ils sont curieux. Et quand vient l'heure de dormir, leur curiosité s'aiguise d'autant plus. Les parents grenouilles se retrouvent alors face à une avalanche de \"Pourquôôôâââ ? \" qui semblent intarissables. Sauront-ils y répondre sans perdre leur sang-froid ? !",isbn:"9791035209285",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209285-475x500-1.jpg"},
  {t:"Moi d'abord !",a:"Escoffier Michaël",y:"2010",ed:"Frimousse",cote:"A ESC",pub:"Jeune",sup:"Imprimé",d:"C’est l’histoire d’un caneton qui veut toujours être le premier. Que maman canne (ou papa canard, difficile de trancher!) propose une promenade, une partie de pêche (aux canards, bien sûr) ou une baignade… «Moi d’abord, moi d’abord» cancanne l’insupportable palmidède en envoyant au tapis toute sa fratrie. Aussi quand il entend crier «À table!» ce n’est évidemment qu’un cri… mais à trop se précipiter on a quelquefois de bien mauvaises surprises!",isbn:"9782352410553",img:"https://www.babelio.com/couv/CVT_cvt_Moi-dabord-_9651.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2020",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Sorti vainqueur de la bataille contre la province de Sen, le pays de Kôka agrandit son territoire. Mais Hak est grièvement blessé, et Yona n'a presque plus de voix... Réquisitionné pour soigner les soldats blessés au combat, Yeon s'intéresse aux techniques de soins de la tribu du ciel. Que peut bien avoir derrière la tête le conseiller Kye-sook lorsqu'il lui propose de l'accompagner au château de Hiryû pour y apprendre la médecine ?",isbn:"9782811657345",img:"https://covers.openlibrary.org/b/isbn/9782811657345-M.jpg"},
  {t:"Myrmidon et la grotte mystérieuse",a:"Dauvillier Loïc",y:"2016",ed:"les Éditions de la Gouttière",cote:"BDJ DAU",pub:"Jeune",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même... Vêtu d'une peau de bête et lance en main, Myrmidon se retrouve projeté à l'époque de la Préhistoire, mais attention à l'effrayant tigre aux dents de sabre...",isbn:"9791092111415",img:"https://products-images.di-static.com/image/base/9791092111415-475x500-1.jpg"},
  {t:"Un rêve dangereux",a:"Westin Miila",y:"2026",ed:"Éditions Sarbacane",cote:"BDJ WES",pub:"Jeune",sup:"Imprimé",d:"L'été n'a pas été de tout repos pour Eevi : elle a sauvé le monde d'un hiver sans fin en libérant l'esprit du printemps... Et voilà que son ami, le gnome Otso, fait irruption dans sa chambre pour lui demander de l'aider à sauver sa soeur, victime d'une malédiction. Eevi et Otso partent pour le monde des gnomes. Mais attention, la terrible sorcière Louhi et ses affreux lutins sont à leurs trousses...",isbn:"9791040807063",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040807063-475x500-1.jpg"},
  {t:"Magimage",a:"Albon Lucie",y:"2024",ed:"Thierry Magnier",cote:"A ALB",pub:"Jeune",sup:"Imprimé",d:"Ce livre est vraiment magique : il transforme les images grâce à un simple miroir. Et voici comment le poisson se transforme soudain... en chat !",isbn:"9791035207243",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035207243-475x500-1.jpg"},
  {t:"Maman (Oie)  Ours n'aime pas l'hive",a:"Higgins Ryan T.",y:"2026",ed:"Albin Michel",cote:"A HIG",pub:"Jeune",sup:"Imprimé",d:"Les souris sont prêtes pour leurs activités hivernales préférées : ski, luge, patinage et fabrication de bonshommes de neige. Malheureusement, Michel a un rhume et sa famille ne veut pas le laisser tout à seul à la maison. Si Michel ne peut pas jouer dans la neige, alors celle-ci viendra à lui... et les bêtises des souris, aussi !",isbn:"9782226507969",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226507969-475x500-1.jpg"},
  {t:"Napoléon",a:"Jannin Frédéric",y:"2024",ed:"Graine de Loup jeunesse",cote:"944.05 JAN",pub:"Jeune",sup:"Imprimé",d:"Deux siècles après la mort de Napoléon Bonaparte (1769 - 1821), que savent les enfants de son histoire'Clotilde Jannin fait revivre dans cet album quelques épisodes fameux de la légende napoléonienne. Elle sest attachée à lenfance et à la jeunesse de cet « enfant corse » que rien ne prédestinait à devenir empereur, avant de décrire quelques grands moments de sa carrière militaire sans oublier le couronnement, la campagne de Russie et lexil à Sainte-Hélène. Napoléon a gouverné la France pendant seize années. Grâce à son génie militaire, il a dominé lEurope, reconstituant lempire de Charlemagne, mille ans après lempereur à la barbe fleurie. Ces conquêtes auront été faites au prix de la vie de dix millions de soldats et son orgueil ambitieux aura été la cause de sa chute. Mais son souvenir est encore présent dans nos lois, le baccalauréat, la Légion dHonneur... Le petit officier corse adoré par ses soldats, détesté par les uns, admiré par les autres, a pris sa place dans lHistoire de France. AUTEURS Mère de famille passionnée par lHistoire, habitant à Cherbourg, auteur de plusieurs biographies pour la jeunesse (Éd. Edilys), Clotilde Jannin a choisi de raconter, dans un style direct, très vivant et riche en dialogues, quelques épisodes parmi les plus significatifs de la vie de Napoléon Bonaparte. Formé aux Arts Appliqués de Lyon, longtemps directeur artistique dans la publicité, féru dhistoire, de littérature et de bande dessinée, Cyril Flautat vit avec sa famille au coeur des montagnes de Savoie. Il a déjà publié trois livres en tant quauteur et illustrateur : William Adams le samouraï des mers (Éd. du Jasmin) ; Au temps des samouraïs (Éd. Fleurus) ; Les Ténèbres de lInquisition (Éd. Elisa), tous fondés sur lhistoire. Conjuguant savoir-faire classique et savoir-faire digital, il a créé des illustrations aussi documentées quénergiques.",isbn:"9782487568013",img:"https://products-images.di-static.com/image/base/9782487568013-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Les combats qui opposent le pays de Kôka et le Kai du sud gagnent en intensité. Bien qu'enrôlé au seinde l'armée du Kai du sud, Hak agit pour la victoire du pays de Kôka, jusqu'au moment où il se retrouve nez à nez avec le Général Laan avec qui il a déjà croisé le fer. Ainsi privé d'anonymat, il se retrouve en péril…",isbn:"9782811680381",img:"https://covers.openlibrary.org/b/isbn/9782811680381-M.jpg"},
  {t:"L'école des superhéros",a:"Bloch Serge",y:"2022",ed:"BD Kids",cote:"J BLO",pub:"Jeune",sup:"Imprimé",d:"Le super-héros SamSam fait sa rentrée des classes, avec sa maîtresse Marie-Agnès, qu'il adore, et ses camarades de l'école. ©Electre 2022",isbn:"9791036350504",img:"https://products-images.di-static.com/image/base/9791036350504-475x500-1.jpg"},
  {t:"Le musée effacé",a:"Dixen Victor",y:"2025",ed:"Bayard éditions",cote:"J DIX",pub:"Adolescent",sup:"Imprimé",d:"Depuis des siècles, les marais de Floride dévorent des personnes et engloutissent des trésors. Dans leurs sombres profondeurs, loin du soleil tropical de la surface, les croquemitaines attendent leur heure. Luciole \"Lucy\" Lachance et Jasper Tan commencent leur apprentissage de retrouveurs dans le Sunshine State, sous la houlette de Rita Perdido. Le temps presse pour retrouver les régalias maudits et éviter l'ascension d'un Haut-Roi des croquemitaines. Les membres de l'agence Perdido comptent profiter de la célèbre Foire d'Art Contemporain de Miami pour tendre un piège à la Muse Malade, détentrice du deuxième régalia. Cette effaceuse hante les artistes de génie depuis des siècles, volant leurs idées et les poussant à la folie. Mais depuis les palaces luxueux de South Beach jusqu'aux mangroves ancestrales du fin fond de la Floride, Luciole et Jasper vont découvrir que l'attaque des croquemitaines contre la surface est plus imminente que jamais...",isbn:"9791036365225",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036365225-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Yona et ses comparses parviennent à faire reculer Tchagol mais, dans la bataille, ils ont perdu la trace de Shin-ah, Jae-ha et Zeno. Soudain, Yona perçoit le cri des dragons…",isbn:"9782811692384",img:"https://covers.openlibrary.org/b/isbn/9782811692384-M.jpg"},
  {t:"Le grand livre jeu du merveilleux",a:"Subi",y:"2026",ed:"La Martinière",cote:"LJ SUB",pub:"Jeune",sup:"Imprimé",d:"TROIS JEUX DANS UN SEUL LIVRE ! Assemblée de dragons, forêt enchantée, troupeau de licornes, monstres mythologiques, cité engloutie, congrès de sorcières... embarquez pour un merveilleux voyage à la découverte des créatures magiques ! Un cherche et trouve fantastique avec trois niveaux de difficulté pour jouer en famille, enrichi par deux pages documentaires pour tout savoir sur ces créatures merveilleuses qui peuplent notre imaginaire collectif. Un cherche et trouve palpitant avec trois niveaux de difficulté, pour jouer avec toute la famille.",isbn:"9791040125426",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040125426-475x500-1.jpg"},
  {t:"Moi, Lubochka",a:"Baum Gilles",y:"2026",ed:"les Éditions des éléphants",cote:"BDJ BAU",pub:"Jeune",sup:"Imprimé",d:"Un ours mène une vie d'ours au fil des saisons. Et puis un Jour, la terre tremble, les bombes pleuvent, le ciel prend feu... Une fable qui permet d'évoquer, avec finesse et subtilité, l'impact des conflits sur les hommes et la nature Cette singulière histoire d'amitié est aussi un hymne puissant à la solidarité et à l'espoir. Amnesty International.",isbn:"9782372731720",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782372731720-475x500-1.jpg"},
  {t:"Le chantier",a:"Hédelin Pascale",y:"2017",ed:"Milan",cote:"624 HED",pub:"Jeune",sup:"Imprimé",d:"Cette collection documentaire pour les petits développe des encyclopédies complètes, accessibles et modernes. Elle se veut une référence d'images, tant pour les parents et leurs enfants que pour les enseignants.",isbn:"9782745980946",img:"https://products-images.di-static.com/image/base/9782745980946-475x500-1.jpg"},
  {t:"La guerre des Lulus",a:"Hautière Régis",y:"2025",ed:"Editions Casterman",cote:"BDJ HAU",pub:"Jeune",sup:"Imprimé",d:"Septembre 1918. Ludwig, sans nouvelles des autres Lulus, se morfond au camp de prisonniers de Döberitz. Dans les baraquements, la probabilité d'un arrêt prochain des combats alimente les conversations, mais il n'y fait pas attention : ce genre de bruit circulait déjà en 1914. Une autre rumeur l'intrigue, en revanche ; elle parle de révolution..",isbn:"9782203224285",img:"https://covers.openlibrary.org/b/isbn/9782203224285-M.jpg"},
  {t:"Parfois, je suis en colère",a:"Bowles Paula",y:"2026",ed:"Chantecler",cote:"A BOW",pub:"Jeune",sup:"Imprimé",d:"Votre enfant est parfois en colère. Il crie, tape du pied ou s'énerve envers tout le monde. C'est tout à fait normal et cela fait partie de son développement. Ce livre aidera votre enfant à reconnaître la colère, à la comprendre et à mieux la gérer. La petite histoire lui montrera comment retrouver le calme d'une manière simple.",isbn:"9782803464999",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782803464999-475x500-1.jpg"},
  {t:"Le pire des chevaliers",a:"Kemp Anna",y:"2026",ed:"Milan",cote:"A KEM",pub:"Jeune",sup:"Imprimé",d:"Riquiqui le crapaud, tout gluant et pas très beau, veut devenir un héros. Un vrai, un grand, un costaud ! Le roi des nénuphars en a assez des libellules, il se rêve chevalier, même avec ses pustules. Comme dans les contes de fées, seule une princesse pourrait l'aider et, d'un baiser, le transformer en fier et noble chevalier...",isbn:"9782408060428",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408060428-475x500-1.jpg"},
  {t:"Capricieuse",a:"Fontanel Béatrice",y:"2019",ed:"L'Etagère du bas",cote:"A FON",pub:"Jeune",sup:"Imprimé",d:"Capricieuse, une petite fille plutôt mal élevée, se retrouve parachutée dans le monde des animaux et autres insectes de la forêt. Enfant autoritaire et impatiente, elle va devoir ralentir la cadence à cause d'une blessure au pied et se déplacer à dos de tortue. Ce rythme modéré va l'amener à observer davantage tout ce qui l'entoure... c'est le début de bien des aventures !",isbn:"9782490253159",img:"https://static.wixstatic.com/media/b71342_4a5c6216edc34d6f8ed28d20b081c3ba~mv2_d_1662_2320_s_2.png/v1/fill/w_358,h_488,al_c,q_85,usm_0.66_1.00_0.01/Capricieuse-couverture.webp"},
  {t:"Twisted-Wonderland",a:"Hazuki Wakana",y:"2026",ed:"nobi nobi !",cote:"BD TWI",pub:"Jeune",sup:"Imprimé",d:"“En ce bas monde, on n'a rien sans rien.”Azul Ashengrotto a réussi à piéger la majorité des étudiants de Night Raven avec son terrible contrat, et règne en maître sur l'académie. Déterminés à sauver leurs amis, Yu et Jack obtiennent un tête-à-tête avec le gardien de la maison Octavinelle, et acceptent de passer un nouveau marché  avec lui... Mais sans aptitude magique à lui offrir, quels termes et garanties  le peu scrupuleux Azul peut-il bien attendre en retour ?  La maison Ramshackle serait-elle sur le point de sombrer ?",isbn:"9782384966752",img:"https://covers.openlibrary.org/b/isbn/9782384966752-M.jpg"},
  {t:"Twisted-Wonderland",a:"Oda Suzuka",y:"2025",ed:"nobi nobi !",cote:"BD TWI",pub:"Jeune",sup:"Imprimé",d:"Longue vie au Roi ! Alors que le tournoi de Spelldrive arrive à grands pas, Yu, Grimm et les élèves de Heartslabyul poursuivent leur enquête afin de démasquer le responsable des mystérieux accidents qui frappent les meilleurs athlètes du campus. Lorsqu’un élève de Scarabia est à son tour victime d’un de ces incidents, Jack Howl décide de révéler ce qu’il sait... quitte à risquer de se mettre son dortoir à dos. Lorsqu’elle est attaquée, la maison Savanaclaw montre ses crocs !",isbn:"9782384964727",img:"https://covers.openlibrary.org/b/isbn/9782384964727-M.jpg"},
  {t:"Micmac à la ferme",a:"Schmitt Michel-Yves",y:"2015",ed:"La Boîte à bulles",cote:"BDJ SCH",pub:"Jeune",sup:"Imprimé",d:"Qui, comme Léopold, n'a jamais rêvé de devenir invisible à volonté ? Un pouvoir étonnant qui lui permet de faire toutes sortes de bêtises et autres espiègleries. Cette fois-ci, c'est à la ferme que Léopold et sa soeur, Céline, se retrouvent, coincés chez Papy et Mamie pour les vacances ! Bien décidé à devenir Super-Léo pour libérer les animaux de la ferme et découvrir le mystérieux voleur qui sévit dans les environs, le dynamique Léopold n'en reste pas moins un farceur invétéré... C'est certain, au village, ils n'oublieront pas de sitôt Super-Léo !",isbn:"9782849532133",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782849532133-475x500-1.jpg"},
  {t:"Yona, Princesse de l'Aube T40",a:"Kusanagi Mizuho",y:"2023",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Les Dolomos, un groupuscule d'assassins du Kai du Sud, s'infiltrent dans le château de Hiryû avec la ferme intention de le détruire par le feu. Tandis que le général Val et Mei Niang essaient de les repousser, ils ont la mauvaise surprise de voir surgir un personnage inattendu qui va redistribuer les cartes'",isbn:"9782811684853",img:"https://covers.openlibrary.org/b/isbn/9782811684853-M.jpg"},
  {t:"Les Portes d'Odin",a:"Le Gris Jérôme",y:"2026",ed:"Glénat",cote:"BDJ LEG",pub:"Jeune",sup:"Imprimé",d:"Une guerrière viking n'abandonne jamais ! Skara est une jeune viking qui a reçu à la naissance un talent rare et divin : le don du Loup. Ce don fait d'elle une redoutable guerrière pouvant tenir tête à n'importe qui malgré son jeune âge ! Après la mort de sa mère - tuée par des pillards - Skara, emportée par la colère et le désespoir, incendie accidentellement un temple sacré d'Odin. Le brasier ravageur ouvre alors les portes entre les Neuf Royaumes et libère sur Midgard des monstruosités venues des mondes inférieurs. Venant visiter Skara dans ses rêves, Urd, la déesse tisseuse du Destin, lui explique que le seul moyen de réparer sa faute est de chasser elle-même ces créatures maléfiques. Alors seulement, Odin pourra lui pardonner. Accompagnée de Bojan, un jeune prêtre russe peu dégourdi, et de la sulfureuse sorcière Rùna, la jeune viking se lance alors dans une aventure digne des grandes sagas nordiques ! Avec ce récit mettant en scène une jeune adolescente au caractère colérique en quête de rédemption, Jérôme Le Gris et Letizia Depedri signent une nouvelle série épique au ton décalé. Mêlant action, loyauté et sororité, le duo nous plonge dans un récit sans temps mort où l'imaginaire de la mythologie nordique sert de décor au parcours initiatique jalonné d'épreuves de leur héroïne.",isbn:"9782344064535",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782344064535-475x500-1.jpg"},
  {t:"Le chat sauvage",a:"Luciani Brigitte",y:"2016",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeune",sup:"Imprimé",d:"Alors que Roussette, la petite renarde, se pose de plus en plus questions sur ses origines, un chat sauvage, accompagné de genettes, prépare un spectacle destiné à montrer son agilité dans les arbres. Mais ce chat dissimule un secret sur sa véritable identité ; un secret qui va aider Roussette à comprendre que sa nouvelle famille l'aime plus que tout. A travers cette histoire, les auteures abordent autant l'acceptation de la différence que l'idée de rester soi-même et de s'ouvrir aux autres. Le bonheur n'est jamais bien loin ! Chaque tome de la série sera dorénavant proposé à partir de 2026 en version souple à plus petit format (195 x 260) avec un bonus de huit pages supplémentaires (jeux, cahier didactique...). Le tout à petit prix !",isbn:"9782205074451",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205074451-475x500-1.jpg"},
  {t:"Le livre qu'il ne faut pas ouvrir (sous aucun prétexte !)",a:"Patschke Steve",y:"2021",ed:"Glénat",cote:"A PAT",pub:"Jeune",sup:"Imprimé",d:"Pierre, Sami, Sarah et Lucie découvrent une mystérieuse caisse en bois. Sur le couvercle, un message leur intime l'ordre de ne pas l'ouvrir. Un album sur le thème de l'interdit. ©Electre 2022",isbn:"9782344050835",img:"https://www.babelio.com/couv/CVT_Le-livre-quil-ne-faut-pas-ouvrir_2425.jpg"},
  {t:"Le secret du coeur de pierre",a:"Hicks Faith Erin",y:"2018",ed:"Rue de Sèvres",cote:"BDJ HIC",pub:"Jeune",sup:"Imprimé",d:"Une tentative d'assassinat vient d'être commise contre le Général de toutes les Lames et le chaos éclate à nouveau dans la cité sans nom. Malgré les efforts de ses habitants pacifiques, la cité est au bord de la guerre. Luttant avec l'aide de Kaidu pour sauver la ville, Rat révèle quelque secrets sur le monastère dans lequel elle a grandi. ©Electre 2018",isbn:"9782369813736",img:"https://www.bedetheque.com/cache/thb_couv/Couv_327045.jpg"},
  {t:"A not so innocent deal",a:"Messina Lynn",y:"2025",ed:"Fleurus",cote:"J MES",pub:"Adolescent",sup:"Imprimé",d:"A vingt-et-un ans, Catherine Fellingham découvre que sa famille risque la faillite et le scandale : pour régler les dettes de son époux, Lady Fellingham s'est enlisée dans une affaire de pots-de-vin. Catherine supplie la complice de sa mère, Lady Courtland, de mettre fin à ces manigances... mais, en contrepartie, elle doit accepter un arrangement : se livrer à une autre saison pour trouver un mari. Après trois années sans que le moindre prétendant s'intéresse à elle, Catherine accepte à contrecoeur. Lorsqu'elle découvre que le célèbre Lord Deverill a été chargé de feindre un intérêt pour elle pour que d'autres la remarquent... et qu'il juge cette mission impossible, Catherine décide que c'en est trop. Humiliée, elle compte rendre au marquis la monnaie de sa pièce et le prendre à son propre jeu. A moins, bien sûr, que son coeur n'en fasse qu'à sa tête...",isbn:"9782215199908",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215199908-475x500-1.jpg"},
  {t:"Une part de tarte sauce trahison",a:"Moulin Aurélie C.",y:"2026",ed:"Nathan",cote:"J MOU",pub:"Jeune",sup:"Imprimé",d:"Mystère, humour et brioches à gogo ! Une nouvelle enquête savoureuse dans l'univers irrésistible de Wilhelmina Picpus. Bienvenue à l'Académie Wilford, où les secrets se cachent derrière chaque brioche ! Et ne faites confiance à personne... Jour de rentrée à l'austère Académie Wilford ! Wilhelmina Picpus - élève indisciplinée le jour, enquêtrice en herbe la nuit (et pas seulement...) - est ravie. Elle commençait à s'ennuyer et elle sait que les distractions ne manqueront pas dans cet étonnant pensionnat. Au programme : un concours inter-académies, des manigances, des secrets inavouables, un mariage interdit... le tout saupoudré de sucre vanillé, bien entendu ! Un roman cosy mystery drôle et rythmé qui mêle enquête, humour et gourmandises",isbn:"9782095059620",img:"https://products-images.di-static.com/image/base/9782095059620-475x500-1.jpg"},
  {t:"Twisted-Wonderland",a:"Hazuki Wakana",y:"2025",ed:"nobi nobi !",cote:"BD TWI",pub:"Jeune",sup:"Imprimé",d:"“Pauvres âmes en perdition !” Depuis son arrivée à l’académie Night Raven, Yu s’efforce tant bien que mal de trouver sa place dans le monde singulier de Twisted Wonderland. À l’approche des examens finaux, il remarque qu’Ace, Deuce et Grimm affichent une confiance étonnante et négligent leurs révisions. Et lorsque les résultats tombent, c’est la stupeur : de nombreux élèves ont brillamment réussi toutes les épreuves. Yu découvre alors la supercherie : ils ont conclu un contrat avec Azul Ashengrotto… mais chacun sait qu’avec le gardien de la maison Octavinelle, rien n’est jamais offert sans contrepartie. Après les tumultes de Heartslabyul et Savanaclaw, retenez votre souffle et plongez dans les abysses d’un nouveau dortoir, inspiré d’Ursula et de La Petite Sirène !",isbn:"9782384963614",img:"https://covers.openlibrary.org/b/isbn/9782384963614-M.jpg"},
  {t:"Love",a:"Cashell Sophie",y:"2026",ed:"Editions Gründ",cote:"A CAS",pub:"Jeune",sup:"Imprimé",d:"Un album tendre et poétique sur l'amour pour les petits ! Et s'il existait un monde où règne l'amour ? Et si ce monde, c'était le nôtre ? Ce livre regorge de belles idées pour transmettre l'amour autour de soi. Il nous rappelle qu'avec de petits gestes du quotidien, ou même simplement en étant présent, chacun peut contribuer à rendre le monde plus tendre. Un bel album cartonné sur l'amour, les différences et la tolérance, illustré avec tendresse par Axel Scheffler.",isbn:"9782324038099",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782324038099-475x500-1.jpg"},
  {t:"L'énergie du désespoir",a:"Russo Marco",y:"2025",ed:"Dupuis",cote:"BDJ RUS",pub:"Jeune",sup:"Imprimé",d:"Jusqu'à ses sept ans, Kyle avait une vie tout à fait normale. Et puis, le jour de son anniversaire, il a été enlevé par des extraterrestres. Nous le retrouvons sept ans plus tard sur une planète inconnue avec des enfants venus des quatre coins de la galaxie. Tous semblent avoir oublié leur vie passée. Mais, dernièrement, Kyle a commencé à se souvenir de sa vie d'avant... Malgré l'imminence du grand tournoi et une première tentative d'évasion ratée, Kyle n'a qu'un but : s'évader et retrouver la Terre et sa petite soeur Selen...",isbn:"9782808500470",img:"https://covers.openlibrary.org/b/isbn/9782808500470-M.jpg"},
  {t:"Silence, Léo, ça tourne",a:"Schmitt Michel-Yves",y:"2024",ed:"La Boîte à bulles",cote:"BDJ SCH",pub:"Jeune",sup:"Imprimé",d:"En visite au musée, Céline est repérée pour rejoindre le casting de la prochaine série de Proflix. Intégrant une équipe de super héros affrontant des aliens pilleurs de trésors, elle interprétera bientôt le rôle de Zif, la fille la plus rapide du monde. Face à la célébrité grandissante de sa soeur, difficile pour Léopold de ne pas être jaloux. N'est-ce pas lui le véritable super héros ? Pire encore, il est obligé d'assister au tournage des aventures de ces héros de seconde zone ! Jamais à court de bêtises, il va mettre la zizanie dans les studios. Et c'est au détour d'un couloir qu'il fait une découverte de taille : des extra-terrestres déguisés en humains semblent préparer un complot visant à piller les trésors de l'humanité. S'agit-il d'un complot intergalactique ou Léopold fabule-t-il ? Parfois, la frontière entre fiction et réalité est floue et faire la part de choses n'est pas chose aisée.",isbn:"9782849535035",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782849535035-475x500-1.jpg"},
  {t:"La sorcière des Everglades",a:"Le Gat Yan",y:"2024",ed:"Éditions Sarbacane",cote:"BDJ LEG",pub:"Jeune",sup:"Imprimé",d:"Une nouvelle enquête impossible appelle le célèbre enquêteur Angus Nyper en Floride : une sorcière hanterait les mines de phosphate de la riche famille Golpah, l'obligeant à mettre à l'arrêt sa production. La faillite menace ! Penny Sugar, qui se fait passer pour l'assistante étourdie de Nyper, personnage qu'elle a inventé de toutes pièces pour pouvoir exercer un métier réservé aux hommes, débarque donc sur cette terre peuplée de crocodiles et de légendes séminoles effrayantes. Accueillie dans le manoir des Golpah, elle est tout de suite témoin de vives tensions entre Jerry, le fils héritier des mines, et sa soeur Elry, jeune femme amère qui ne semble pas se soucier le moins du monde de la malédiction qui frappe l'entreprise familiale. Qui est donc cette sorcière ? Quelles sont ses motivations ? Et pourquoi l'accès au sous-sol du manoir a-t-il été condamné ?",isbn:"9791040804963",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040804963-475x500-1.jpg"},
  {t:"Cochon caché !",a:"Aaron Huw",y:"2026",ed:"Gallimard",cote:"A AAR",pub:"Jeune",sup:"Imprimé",d:"L'histoire hilarante d'une héroïne qui ne fait rien comme tout le monde et qui aimerait bien qu'on l'accepte comme elle est ! Mimi a un secret : elle est un cochon ! Aucun des singes avec qui elle vit dans la jungle ne s'en est aperçu. Sauf Raymond, leur chef, qui a des soupçons...",isbn:"9782075237819",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075237819-475x500-1.jpg"},
  {t:"Les animaux",a:"Jugla Cécile",y:"2026",ed:"Lito",cote:"J 590.83 JIG",pub:"Jeune",sup:"Imprimé",d:"Plus de 160 questions étonnantes, et leurs réponses tout aussi passionnantes, pour découvrir les animaux du monde entier !",isbn:"9782244428710",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782244428710-475x500-1.jpg"},
  {t:"Sous haute tension !",a:"",y:"2025",ed:"Hachette",cote:"BDJ NIC",pub:"Jeune",sup:"Imprimé",d:"Lincoln Loud évolue grâce à la MILICE, la Merveilleuse et Inégalable Ligue d'Incroyables Chasseurs d'Esprits, qui résout des mystères high-tech ! Retrouve les CASAGRANDES. Ronnie Anne accompagne sa cousine Carlota à une exposition canine complètement déjantée. Mais aussi : les Loud réussiront-ils cet escape game... de l'enfer ? Au milieu d'une avalanche de portes dérobées et d'énigmes, les Loud vont devoir faire preuve d'ingéniosité pour s'échapper avant que le temps soit écoulé ! Des histoires inédites par les talents à l'origine des célèbres dessins animés nommés pour un Emmy Award, Bienvenue chez les Loud et Bienvenue chez les Casagrandes !",isbn:"9782017252665",img:"https://covers.openlibrary.org/b/isbn/9782017252665-M.jpg"},
  {t:"Schmoof le Chien",a:"McKinnon Heidi",y:"2026",ed:"Editions L'Elan vert",cote:"A MCK",pub:"Jeune",sup:"Imprimé",d:"Schmoof est doux. Schmoof est le plus doux, câlin, mignon des toutous ! Schmoof a hâte de se faire un ami. Et Floof ?",isbn:"9782844559227",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782844559227-475x500-1.jpg"},
  {t:"Villageois LVL 999",a:"Hoshitsuki Koneko",y:"2026",ed:"Mana books",cote:"BD VIL",pub:"Jeune",sup:"Imprimé",d:"Un grand LVL implique de grandes responsabilités ! Si la trahison de Kurusu a été révélée, le mystère concernant ses intentions s'épaissit. La petite troupe de Kagami, qui cherche comment traverser la mer pour se rendre en Russie, s'efforce de remettre sur pied une Résistance plongée dans le chaos. Kagami, désireux de venger Menoh par la violence, sent sa colère croître. Rex s'entraîne sans relâche, frustré par son impuissance, tandis que Palna et les autres travaillent dur pour tenter d'oublier leur tristesse. C'est alors que Tina, longtemps restée silencieuse, leur révèle ce qu'elle a sur le coeur.",isbn:"9791035508494",img:"https://covers.openlibrary.org/b/isbn/9791035508494-M.jpg"},
  {t:"Le coup de la cacahuète",a:"Manceau Édouard",y:"2026",ed:"Sens dessus dessous",cote:"A MAN",pub:"Jeune",sup:"Imprimé",d:"Pour transformer une grosses cacahuète, il faut être malin et faire preuve de beaucoup d'imagination...",isbn:"9782385071202",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782385071202-475x500-1.jpg"},
  {t:"Chansons des bois",a:"Piercey Rachel",y:"2025",ed:"Gallimard",cote:"841 PIE",pub:"Jeune",sup:"Imprimé",d:"La forêt regorge de magie et de poésie à observer et à méditer au travers de ces 40 chansons des bois. Papa ours invite son ourson à se laisser bercer par les secrets de la nature et à partager la délicatesse de chaque instant, même infime. Aube, rosée ou champignon, chaque élément est célébré. Il y a tant de merveilles à découvrir !",isbn:"9782075211864",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075211864-475x500-1.jpg"},
  {t:"Twisted-Wonderland - La Maison Savanaclaw",a:"Oda Suzuka",y:"2025",ed:"Nobi Nobi",cote:"BD TWI",pub:"Jeune",sup:"Imprimé",d:"Le territoire sauvage de Savanaclaw vous ouvre ses portes. Soyez prêts ! Transportée à Twisted Wonderland, Yuka Hirasaka parcourt ce monde extraordinaire bien malgré elle. Alors qu'un grand tournoi magique se prépare, d'étranges événements semblent agiter les élèves de l'Académie Night Raven... Les griffes du dortoir Savanaclaw seraient-elles les plus dangereuses de Twisted Wonderland ? Après la maison Heartslabyul, inspirée de l'univers d'Alice au pays des merveilles, découvrez une relecture fascinante et fantastique du monde du Roi Lion avec la maison Savanaclaw !",isbn:"9782384963225",img:"https://covers.openlibrary.org/b/isbn/9782384963225-M.jpg"},
  {t:"Par humour de l'art",a:"Coppée Thierry",y:"2025",ed:"Delcourt",cote:"BDJ COP",pub:"Jeune",sup:"Imprimé",d:"Notre petit rigolo se confronte à l'art sous toutes ses formes, de l'architecture, le premier art en passant par le cinéma, le septième, sans oublier la bande dessinée, le neuvième... mais s'il y a un art dans lequel Toto excelle, c'est bien l'art de la blague !",isbn:"9782413092582",img:"https://covers.openlibrary.org/b/isbn/9782413092582-M.jpg"},
  {t:"Ta naissance",a:"Le Guen Sandra",y:"2024",ed:"Editions Casterman",cote:"A LEG",pub:"Jeune",sup:"Imprimé",d:"Au commencement, il y a nous, tes parents. Il y a moi, ta maman. Et il y a moi, ton papa. Nous nous sommes rencontrés. Nous nous sommes aimés. Tant et tant que nous ne voulions plus nous quitter. Et puis... tu es arrivé. A travers les voix d'un couple de gorilles, une approche sensible pour aborder avec son enfant les moments qui ont précédé sa naissance, sa venue au monde et ses premiers instants de vie.",isbn:"9782203247895",img:"https://covers.openlibrary.org/b/isbn/9782203247895-M.jpg"},
  {t:"Panique à Yosemite",a:"Le Gat Yan",y:"2023",ed:"Éditions Sarbacane",cote:"BDJ LEG",pub:"Jeune",sup:"Imprimé",d:"1906 c'est la panique à Yosemite ! Le légendaire enquêteur Angus Niper a été appelé par les responsables du parc national californien pour résoudre l'affaire des mystérieuses agressions commises sur des touristes... Mais quelle n'est pas leur surprise quand ils voient débarquer... une femme ! C'est Penny Sugar, l'assistante photographe de Niper. Son patron, retenu sur une enquête, l'a chargée de commencer à collecter les indices. Follette et maladroite, elle ne semble pas avoir les épaules pour assumer une telle tâche. Mais ces braves messieurs ont tort de s'en faire, ils sont entre de bonnes mains ! Angus Niper n'est en réalité qu'une couverture, qui permet à Penny, experte en combat, fine enquêteuse et habile transformiste, d'exercer son métier sans éveiller les soupçons. Penny saura-t-elle déchiffrer les énigmatiques mises en scène de l'agresseur qui détrousse les visiteurs ? Ces vols ont-ils un lien avec le mouvement spiritualiste \" Ghost Dance \" composé d'Indiens natifs du parc qui s'adonnent à la nuit tombée à d'étranges rituels ? Ou bien avec le projet de barrage défendu par le verreux sénateur Johnson ? Dans la traque qui s'annonce qui est le chasseur ? Qui est la proie ?",isbn:"9791040803584",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040803584-475x500-1.jpg"},
  {t:"Le vol",a:"Barber Caroline",y:"2019",ed:"Éditions Les 400 Coups",cote:"A BAR",pub:"Jeune",sup:"Imprimé",d:"Ah ! ce coquin de Philémon Croquenot ! Le voleur veut absolument les dernières longs à la mode pour sa collection. Réussira-t-il à dérober cette 402e paire de chaussures ?",isbn:"9782895408581",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782895408581-475x500-1.jpg"},
  {t:"Je n'aurai plus peur",a:"Rea Simone",y:"2026",ed:"La Partie",cote:"A REA",pub:"Jeune",sup:"Imprimé",d:"Un album sensible et profond sur la violence, la guerre et la résilience. Dans le calme de la nuit, une mère et son fils commencent une conversation difficile. L'enfant hésite à raconter une scène de violence dont il a été témoin à l'école. Il en saisit d'autant plus la gravité qu'il a fui un pays en guerre. Les souvenirs de ce passé traumatique se superposent au présent, et la frontière entre les événements se brouille pour mieux mettre en lumière les mécanismes de la peur. Grâce à l'écoute et l'amour de sa mère, il trouve le courage d'agir. Décidé à en parler à l'école le lendemain, l'enfant s'endort apaisé.",isbn:"9782494591417",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494591417-475x500-1.jpg"},
  {t:"C'est moi qui choisis !",a:"Gao Yile",y:"2026",ed:"Rue du Monde",cote:"A GAO",pub:"Jeune",sup:"Imprimé",d:"Un vêtement, un cadeau, un chemin... Plusieurs fois par jour, on doit décider et choisir. Il y a des choix que l'on fait sans même réfléchir, et d'autres, qui sont de véritables casse-têtes ! On hésite, on regrette... Choisir, c'est vraiment compliqué ! Dans ce livre, je vous raconte comment moi, je me débrouille quand je dois choisir !",isbn:"9782355048128",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355048128-475x500-1.jpg"},
  {t:"Ti'Tigre",a:"Prasadam-Halls Smriti",y:"2026",ed:"Éditions Sarbacane",cote:"A PRA",pub:"Jeune",sup:"Imprimé",d:"Ti'Tigre en a assez. Quand il demande : Je peux manger tout le gâteau ? Je peux aller à l'école en pyjama ? la réponse à ses bonnes idées est toujours : non. Et pourquoi donc ? C'est pas juste ! Pourtant, le craquant Ti'Tigre au caractère bien trempé et aux émotions fortes, n'a peur de rien. Enfin presque...",isbn:"9791040808237",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791040808237-475x500-1.jpg"},
  {t:"La Griffe de Sylvemorne",a:"Wilkinson L. M.",y:"2026",ed:"Saxo",cote:"J WIL",pub:"Jeune",sup:"Imprimé",d:"Une petite souris. Une grande quête. Pour sauver Alluria de la destruction, Fluette a quitté la protection de son village. Elle a suivi son coeur... jusque dans un marécage lugubre ! Or, les créatures qui peuplent cet endroit ne sont pas aimables DU TOUT. Mais face à un monstre recouvert de mousse et une tortue diabolique, que peut bien faire une petite souris ? Peu importe les obstacles, Fluette se montrera à la hauteur !",isbn:"9782385701628",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782385701628-475x500-1.jpg"},
  {t:"Le bain des quatre saisons",a:"Kim Hyojeong",y:"2026",ed:"Gallimard",cote:"A KIM",pub:"Jeune",sup:"Imprimé",d:"Un album plein d'humour, fourmillant de détails, pour célébrer la nature qui s'éveille ! C'est le printemps ! Papy Mousse s'active : il ouvre sa maison et prépare son bassin. Tout doit être prêt pour l'arrivée des animaux ! Déjà, un ours sort d'hibernation. Il a besoin d'un bon bain !",isbn:"9782075233729",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075233729-475x500-1.jpg"},
  {t:"Eiao",a:"Ledun Marin",y:"2026",ed:"Au vent des îles",cote:"J LED",pub:"Adolescent",sup:"Imprimé",d:"En Polynésie, dans Les années 1970, La France mène des essais nucléaires qui meurtrissent la région et mettent en danger ses habitants ainsi que sa faune et sa flore. Quand elle arrive à Eiao en 1972, à 19 ans, Simone pense avoir été embauchée par une compagnie de forage minier, mais L'Arvecom semble cacher ses véritables intentions... Au contact d'autres employés et du mystérieux Tahi, elle s'engage dans une Lutte qui La dépasse. En explorant les îles des Marquises et la jeunesse de la mère du futur lieutenant Morel de son roman Henua, Marin Ledun plonge dans un passé tourmenté et tumultueux, et nous entraîne dans une histoire d'amour radioactive.",isbn:"9782367346540",img:"https://products-images.di-static.com/image/orb-ef67b8aadc689cbb3d743f72577b9d21/9782367346540-475x500-1.jpg"},
  {t:"Blue Box",a:"Miura Kouji",y:"2026",ed:"Delcourt",cote:"BD BLU",pub:"Jeune",sup:"Imprimé",d:"Après Video Girl Aï et We Never Learn, découvrez la dernière comédie sentimentale à succès publiée dans le Shonen Jump. L'ascension d'un jeune sportif qui va tout faire pour se hisser au niveau de la fille qu'il aime, soit la star du club de basket ! Taiki Inomata, membre du club de badminton, a eu le coup de foudre pour Chinatsu Kano, la star du club de basket de son établissement. Il s'entraîne à ses côtés tous les matin. Sa relation avec Chinatsu va prendre un tournant totalement inédit lorsqu'un jour de printemps, une nouvelle des plus déconcertantes va lui offrir une opportunité inespérée de conquérir sa belle.",isbn:"9782413086512",img:"https://covers.openlibrary.org/b/isbn/9782413086512-M.jpg"},
  {t:"Coeur Flocon",a:"Cassidy Cathy",y:"2025",ed:"Jungle",cote:"BDJ CAS",pub:"Jeune",sup:"Imprimé",d:"Enfin les vacances de Noël, Coco se réjouit à l'approche des festivités. Mais tout bascule lorsqu'un cacatoès atterrit dans son jardin... En voulant l'aider, elle fait la rencontre de Jon, le neveu de la vétérinaire. Dès leur premier échange, Coco sent naître un trouble inattendu... au point de remettre en question sa relation avec Stevie, son amoureux de toujours. Tiraillée entre raison et émotion, Coco devra écouter son coeur... et faire un choix.",isbn:"9782822247405",img:"https://covers.openlibrary.org/b/isbn/9782822247405-M.jpg"},
  {t:"Revenez, amis martiens !",a:"Thinard Florence",y:"2026",ed:"Thierry Magnier",cote:"J THI",pub:"Adolescent",sup:"Imprimé",d:"Quand Eva, une collégienne solitaire et harcelée, recueille deux chats errants miraculeusement sauvés des eaux, elle ignore qu'elle se trouve face à FWFX et WDWC, des extraterrestres en mission secrète sur Terre. Nom de Mars, cette rencontre va changer sa vie ! C'est le début d'une aventure pleine de rebondissements, de télescopages improbables et de répliques inoubliables. Prêts, bande de schmulaââgs ramollis ? ! Des chats venus d'une autre planète, une ado en détresse, une vache complice : un roman aussi déjanté que jubilatoire !",isbn:"9791035209308",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791035209308-475x500-1.jpg"},
  {t:"Cendrillon",a:"Dahl Roald",y:"2025",ed:"Gallimard",cote:"C DAH",pub:"Jeune",sup:"Imprimé",d:"Vous pensez connaître cette histoire ? Vous vous trompez... Cendrillon veut aller au bal ! Entendant ses pleurs, sa marraine la bonne fée apparaît et hop ! D'un coup de baguette magie, Cendrillon est prête à se rendre au palais et... vous connaissez la suite, à rencontrer son prince charmant. Mais les apparences sont trompeuses, et ce prince-là n'est peut-être pas aussi parfait qu'il n'y paraît...",isbn:"9782075228749",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075228749-475x500-1.jpg"},
  {t:"A qui sont ces grandes dents ?",a:"Beau Sandrine",y:"2021",ed:"D'eux",cote:"A BEA",pub:"Jeune",sup:"Imprimé",d:"A qui sont ces grandes dents ? Et si on regardait de plus près ? Et si on s'éloignait pour mieux voir...",isbn:"9782924645024",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782924645024-475x500-1.jpg"},
  {t:"Vivement ce soir !",a:"Lili la Baleine",y:"2026",ed:"Editions Casterman",cote:"A LIL",pub:"Jeune",sup:"Imprimé",d:"Un premier album sur le temps qui passe, pour aider les petits à patienter. Prune, Pablo et Oscar arriveront ce soir. Mais pour l'instant, le ciel est bleu et ce petit garçon doit attendre encore un peu. Attendre ? Quelle drôle d'histoire ! C'est long et ennuyeux. Heureusement, la neige est là, dans le jardin, pour jouer et patienter. Tiens, un bruit... il fait bientôt nuit. Les voilà ! Pour éveiller les sens des tout-petits, dès la naissance. Pour un moment de partage intense entre l'adulte et l'enfant grâce aux premières histoires lues avec bébé contre soi. Lili La Baleine, qui a illustré de nombreux textes, nous propose son tout premier texte qu'elle a écrit avec beaucoup d'amour pour les bébés.",isbn:"9782203302303",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203302303-475x500-1.jpg"},
  {t:"Babinoche mon grand chien",a:"Surribas Caroline",y:"2026",ed:"Frimousse",cote:"A SUR",pub:"Jeune",sup:"Imprimé",d:"A quoi ressemble une année avec mon chien Babinoche ? Ce que je peux vous dire, c'est qu'on ne s'ennuie jamais... Nos bêtises et nos aventures sont comme lui : gi-gan-tesques !",isbn:"9782383496557",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782383496557-475x500-1.jpg"},
  {t:"Je suis là pour toi",a:"Parapaboom",y:"2026",ed:"Editions Amaterra",cote:"A PAR",pub:"Jeune",sup:"Imprimé",d:"Un livre cartonné graphique et coloré sur l'entraide, empreint d'humour et de tendresse. A chaque page, un personnage se retrouve dans l'embarras... Le lecteur soulève le rabat, le visuel évolue et hop ! Le problème est résolu. Avec la ritournelle rassurante \"Ne t'inquiète pas, je suis là pour toi\", ce livre interactif invite les tout-petits à découvrir la magie de l'entraide et la joie de partager, l'histoire est rythmée et le plaisir de la lecture à voix haute renforcé.",isbn:"9782368563878",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782368563878-475x500-1.jpg"},
  {t:"Et... Paf !",a:"Raisson Gwendoline",y:"2026",ed:"Nathan",cote:"A RAI",pub:"Jeune",sup:"Imprimé",d:"Bim, boum, splash, cling... A vous de faire claquer les pages pour provoquer collisions, explosions et autres rencontres.",isbn:"9782095058548",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782095058548-475x500-1.jpg"},
  {t:"Trop de bananes",a:"Courgeon Rémi",y:"2024",ed:"Milan",cote:"A COU",pub:"Jeune",sup:"Imprimé",d:"\" Any, sans son grand-père, ne serait pas vraiment Any. Il est le phare de sa vie. Un vieux à roulettes qui peint la mer depuis plus de quatre-vingts ans, tous les jours, en râlant qu'il n'y arrive jamais, que c'est tellement plus beau en vrai. Any aussi dessine tous les jours. Tout et n'importe quoi. C'est une artiste un peu cinglée, mais un seul adjectif n'est pas suffisant pour parler d'elle... \" Un personnage féminin fort Sous les mots et les pinceaux de Rémi Courgeon, cette histoire nous dresse le portrait d'Any, une jeune fille forte, déterminée, passionnée et rêveuse. Un personnage très attachant et inspirant dont les dessins animent l'album du début à la fin. Un album sur la relation entre un grand-père et sa petite-fille Rémi Courgeon décrit une très belle relation entre le grand-père et sa petite-fille, réunis par leur amour du dessin et leur caractère bien trempé. Un album drôle et émouvant à la fois. \" Cette histoire pleine d'humour et d'énergie, un brin loufoque, aux illustrations très colorées, nous montre comment une passion peut habiter toute une vie\". Frédérique Franco (Librairie Le Goût des mots, Mortagne-au-Perche) \"Elles ne sont pas fréquentes, les histoires abracadabrantes, qui tiennent sur la longueur sans signe d'essoufflement. Cet album en raconte une, fondée sur l'excentricité de son héroïne, fascinée par les peaux de banane. Non pas pour les semer sous les pieds des inopportuns, mais pour en faire des tableaux, des collages, voire des sculptures. Quelle sacrée personnalité Rémi Courgeon lui a donnée, en plus d'un nez de peinture sortie du tube et de cheveux en poils de pinceau écrasé ! \" Télérama",isbn:"9782408050757",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782408050757-475x500-1.jpg"},
  {t:"Un chat, deux chats, trop de chats...",a:"Emmet Jonathan",y:"2026",ed:"Glénat Jeunesse",cote:"A HOD",pub:"Jeune",sup:"Imprimé",d:"Des chats se sont faufilés sous les volets et les pop-ups de ce livre animé. Combien sont-ils ? Tu donnes ta langue aux chats ? A toi de les retrouver et de les compter ! Un livre plein de surprises, tout en poils et en couleurs !",isbn:"9791026405283",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791026405283-475x500-1.jpg"},
  {t:"Le cercle de ronces",a:"Anssel Camille",y:"2025",ed:"Gallimard",cote:"J ANS",pub:"Jeune",sup:"Imprimé",d:"Le pari fou d'une rébellion clandestine féministe, dans un monde où la magie détraque les esprits. Au coeur d'une forteresse assiégée, Lalie, la plus grande Sorcière de l'Histoire, livre à huit scribes un récit aux airs de testament. Celui d'une orpheline, qui a fait trembler l'Empire. D'une jeune prodige, qui défie un système patriarcal cruel. D'une cheffe de guerre, au bord de la défaite...",isbn:"9782075232302",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075232302-475x500-1.jpg"},
  {t:"Le Porte-bonheur",a:"Luciani Brigitte",y:"2023",ed:"Dargaud",cote:"BDJ LUC",pub:"Jeune",sup:"Imprimé",d:"- \"Moi je veux bien un porte-bonheur comme Martis\". - \"Quoi ? Ne me dis pas que tu crois à ces trucs ? \" Décidément, blaireaux et renards ne sont pas pareils. Et quand il s'agit des croyances, évidemment, ils ne sont jamais d'accord. Quand leur ami Martis arrive avec un porte-bonheur, Carcajou se moque et décide de prouver à tout le monde qu'il n'y a rien de magique dans ces amulettes en bois. Mais l'affaire n'est pas simple, l'expérience tourne mal et le doute s'installe. Si tout ça n'est qu'une question de hasard, comment se fait-il que certains semblent clairement plus chanceux que d'autres ? Avoir de la chance, finalement, à quoi ça tient ? Chaque tome de la série sera dorénavant proposé à partir de 2026 en version souple à plus petit format (195 x 260) avec un bonus de huit pages supplémentaires (jeux, cahier didactique...). Le tout à petit prix !",isbn:"9782205077964",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782205077964-475x500-1.jpg"},
  {t:"Où est ta tétine ?",a:"Van Genechten Guido",y:"2024",ed:"Albin Michel",cote:"A VAN",pub:"Jeune",sup:"Imprimé",d:"Petite Souris est vraiment très curieuse. Elle veut tout comprendre et tout voir... même les tétines de ses amis. Et ils en ont beaucoup ! Mais que va-t-elle faire de toutes ces tétines ?Un livre plein d'humour pour apprendre à dire au revoir à sa tétine",isbn:"9782226488367",img:"https://m.media-amazon.com/images/I/416vnYZxc1L._SX195_.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2024",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Jae-ha se transforme en dragon a avant de disparaître sous les yeux de Yona et ses comparses, qui cherchaient désespérément à le retrouver. Pendant ce temps, au sein des troupes du Kôka, les soldats se sentent observés…",isbn:"9782811694593",img:"https://covers.openlibrary.org/b/isbn/9782811694593-M.jpg"},
  {t:"Les extraterrestres ne sont pas verts !",a:"Quadri Marco",y:"2026",ed:"Rue du Monde",cote:"A QUA",pub:"Jeune",sup:"Imprimé",d:"As-tu déjà vu un objet suspect dans le ciel ou une silhouette étrange se dessiner dans l'ombre ? Sache qu'il ne s'agissait pas d'un extraterrestre ! Pour l'instant, rien ne prouve qu'ils existent, et encore moins qu'ils soient verts... On a pourtant le droit de rêver, il y a tellement de place dans l'espace !",isbn:"9782355048111",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782355048111-475x500-1.jpg"},
  {t:"Médecin",a:"Bexington Carys",y:"2026",ed:"Editions Gründ",cote:"A BEX",pub:"Jeune",sup:"Imprimé",d:"Viens découvrir le métier de docteur avec Gabin ! Gabin est un lapin qui aime découvrir les métiers. Lequel découvrira-t-il aujourd'hui ? Ta-dam ! Aujourd'hui, il est docteur ! Tourne les roues pour l'aider à faire des radios, des bandages et bien plus encore ! Un album tout-carton animé au charme fou pour éveiller les petits. Dans la même collection : Gabin le lapin - Conducteur de train",isbn:"9782324038075",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782324038075-475x500-1.jpg"},
  {t:"Emmie, petite souris de génie",a:"Crosby-Fairall Marjorie",y:"2026",ed:"Editions Gründ",cote:"A CRO",pub:"Jeune",sup:"Imprimé",d:"Emmie, la petite souris, avait de grandes idées. Grâce à ses inventions astucieuses, tout fonctionnait à merveille. Jusqu'au jour où un énorme problème apparut...",isbn:"9782324038945",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782324038945-475x500-1.jpg"},
  {t:"Mes premiers pas en origami",a:"Akass Susan",y:"2013",ed:"Les Editions de Saxe",cote:"736.98 AKA",pub:"Jeune",sup:"Imprimé",d:"35 modèles d'origami des plus simples (des papillons, des maisons, etc.) aux plus compliqués (des nichoirs, des poupées russes, etc.). Des smileys leur attribuent un niveau de difficulté : le niveau 1 pour les pliages les plus simples, le niveau 2 intermédiaire et le niveau 3 pour les plus difficiles (les pliages inversés).",isbn:"9782756510385",img:"https://products-images.di-static.com/image/akass-susan-mes-premiers-pas-en-origami/9782756510385-475x500-1.webp"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Le tournoi de présentation officielle des quatre dragons a commencé. Ki-jae et Jae-ha, qui affrontent respectivement Joo-doh et Geun-tae, font une telle démonstration de force qu'ils en détruisent l'arène… Les exploits des guerriers dragons ajoutés au retour de la princesse Yona et de La Foudre mettent le peuple en liesse. Mais que ressent Hak, tenu à l'écart de Yona et des dragons ?",isbn:"9782811660086",img:"https://covers.openlibrary.org/b/isbn/9782811660086-M.jpg"},
