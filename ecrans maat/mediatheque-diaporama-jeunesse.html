  {t:"Nom d'un ours !",a:"Viale Marco",y:"2026",ed:"Hélium",cote:"A VIA",pub:"Jeune",sup:"Imprimé",d:"Tout le monde est au courant maintenant, les ours sont parfaitement inutiles et ils ne savent vraiment rien faire du tout. Les bonnes manières leurs sont complètement étrangères... En un mot : évitez à tout prix leur compagnie !",isbn:"9782330208165",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330208165-475x500-1.jpg"},
  {t:"Astérix en Lusitanie",a:"Fabcaro",y:"2025",ed:"Hachette",cote:"BDJ FAB",pub:"Jeune",sup:"Imprimé",d:"Le 23 octobre MMXXV paraîtra le nouvel album des aventures du plus célèbre des Gaulois : Astérix en Lusitanie ! Par un beau matin de printemps, un inconnu débarque au village. Il arrive de Lusitanie, cette terre de soleil à l'ouest de l'Hispanie qui se trouve également sous la férule de Rome. Cet ancien esclave croisé dans le Domaine des dieux est venu demander de l'aide à nos irréductibles Gaulois car il connaît les effets puissants de la potion magique. Pour Astérix et Obélix, une nouvelle aventure commence !",isbn:"9782017253709",img:"https://covers.openlibrary.org/b/isbn/9782017253709-M.jpg"},
  {t:"Au dodo maintenant !",a:"Iriyama Satoshi",y:"2026",ed:"Milan",cote:"A IRI",pub:"Jeune",sup:"Imprimé",d:"Les bruits de la forêt empêchent cinq petits ratons laveurs de s'endormir. Ils finissent par trouver le sommeil chacun leur tour, sauf le petit dernier, à qui la nuit réserve une belle surprise...",isbn:"9782408059163",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782408059163-475x500-1.jpg"},
  {t:"La promesse de Tyratops",a:"Paré-Sorel Julien",y:"2025",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeune",sup:"Imprimé",d:"L'heure est grave. Alors que Patchy est toujours sous l'emprise d'Ovi la sorcière et que la menace du retour des Titans se fait sentir, Rex s'est fait capturer par les sbires de Tyratops ! Il tentera d'infiltrer le repaire du sorcier maléfique afin de l'arrêter. Pendant ce temps, d'anciens alliés uniront leurs forces pour sauver les enfants du royaume de Mézoïk. Cependant, Tyratops a plus d'un tour dans son sac et sa patience tire à sa fin... Rex sera-t-il assez fort pour affronter les démons du passé ?",isbn:"9782897518806",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518806-475x500-1.jpg"},
  {t:"Le loup ne viendra pas",a:"Ouyessad Myriam",y:"2021",ed:"Editions L'Elan vert",cote:"A OUY",pub:"Jeune",sup:"Imprimé",d:"- Maman, tu es sûre que le loup ne viendra pas ? - Tout à fait sûre, mon lapin. - Mais comment tu peux être aussi sûre ?",isbn:"9782844556462",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782844556462-475x500-1.jpg"},
  {t:"La vision de Patchy",a:"Paré-Sorel Julien",y:"2024",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeune",sup:"Imprimé",d:"Désormais au fait de la machination maléfique de Tyratops, Rex est plus déterminé que jamais à mettre fin à son règne ! Or, le cruel empereur met tout en oeuvre pour le capturer et ses forces du mal gagnent en puissance de jour en jour. Même Patchy, maintenant sous l'emprise de la sorcière Ovi, est devenue une redoutable rivale ! Jusqu'où Rex et ses amis sont-ils prêts à aller afin de percer les sombres mystères du grand royaume de Mézoïk ?",isbn:"9782897518769",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518769-475x500-1.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Pour remplacer Soo-won, qui souffre de la maladie écarlate, Yona siège à la réunion avec les représentants de l'Empire de Kai. Elle parvient à se faire respecter et à discuter à pied d'égalité avec eux, mais l'un des émissaires décède brutalement, et la jeune princesse se retrouve accusée du meurtre…",isbn:"9782811668167",img:"https://covers.openlibrary.org/b/isbn/9782811668167-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2022",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Après avoir réussi à quitter sa cellule, Mei Niang rencontre Hak mais ce dernier refuse de s'évader avec elle. Elle s'enfuit donc seule mais elle finit par perdre connaissance et est secourue par Yeon. Pendant ce temps, sur les terres du Kai du sud, on s'inquiète de son absence…",isbn:"9782811669652",img:"https://covers.openlibrary.org/b/isbn/9782811669652-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Privée de contacts avec Hak et les quatre dragons, Yona demande une entrevue avec Soo-won mais on la lui refuse. Si bien qu'un soir, elle quitte sa chambre discrètement pour rejoindre Soo-won dans son bureau. Mais une fois face à lui, Yona peine à trouver les mots. De leur côté, les dragons sont réquisitionnés pour un entraînement militaire…Également inclus dans ce volume, un court épisode bonus sur l'enfance de Hak !",isbn:"9782811663674",img:"https://covers.openlibrary.org/b/isbn/9782811663674-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2021",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Yona poursuit sa lecture du journal de Yon-hi, la mère de Soo-won. Elle découvre que Yu-hon a exécuté les prêtres qui avaient découvert que sa femme descendait du roi Hiryû. Neuf ans plus tard, Yon-hi, qui a donné naissance à son fils quelques années auparavant, fait la connaissance d'une femme qui s'avère être Kashi, prêtresse rescapée du meurtre perpétré par son mari…",isbn:"9782811666385",img:"https://covers.openlibrary.org/b/isbn/9782811666385-M.jpg"},
  {t:"Coeur Nougat",a:"Grisseaux Véronique",y:"2024",ed:"Jungle",cote:"BDJ CAS",pub:"Jeune",sup:"Imprimé",d:"Kat, la petite soeur de Tommy et Anna, adore l'astronomie et l'écologie. Avec Paul, un ami du collège, ils vont tout faire pour remporter le concours du Jeune scientifique de l'année. Ils ont choisi le thème : \" Les déchets qui polluent l'espace \". Mais Kat va être troublée par Sam, cette fille pas comme les autres qui vient d'arriver à Kitnor... Avec son allure de garçon manqué, c'est une fervente défenseuse de la cause écologique, un brin activiste ! Quant à Kat et Paul, remporteront-ils ce fameux concours ? Pour le savoir, rendez-vous à Tanglewood, avec les Filles au chocolat !",isbn:"9782822242806",img:"https://covers.openlibrary.org/b/isbn/9782822242806-M.jpg"},
  {t:"Mamie Pirouette",a:"Renaud Claire",y:"2026",ed:"Éditions Sarbacane",cote:"J REN",pub:"Jeune",sup:"Imprimé",d:"Quand la danse classique vire à la tyrannie, une solution : appeler Mamie Marguerite et sa bande de copains retraités ! PLIÉ, TENDU PLIÉ, TENDU À l'école de danse, Mademoiselle Gisèle règne d'une main de fer : entre cris, punitions et chorégraphies interminables, Juliette et ses amies n'en peuvent plus. Mais Juliette peut compter sur Mamie, toujours prête à dégainer ses idées farfelues ! Avec l'aide de ses copains retraités - et d'une bande d'élèves bien décidés à dire « non à la tyrannie » - la révolte s'organise. Cette fois, fini les entrechats, vive la liberté !",isbn:"9791040808121",img:"https://products-images.di-static.com/image/base/9791040808121-475x500-1.jpg"},
  {t:"Les portes de Jurassia",a:"Paré-Sorel Julien",y:"2022",ed:"Presses Aventure",cote:"BDJ PAR",pub:"Jeune",sup:"Imprimé",d:"Rex et Cory poursuivent leur chemin vers le volcan Kaliédos dans l'espoir de secourir Patchy et Gogo, toujours captifs de l'infâme général Ank. Traqués par Ovi la sorcière, ils devront traverser la mythique jungle de Troïka afin d'atteindre leur destination. Ils ne se doutent pas qu'une bouleversante révélation viendra sceller leur destin à tout jamais !",isbn:"9782897518721",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782897518721-475x500-1.jpg"},
  {t:"La collectionneuse",a:"Pétry-Sirvin Emmanuèle",y:"2024",ed:"L'Etagère du bas",cote:"A PET",pub:"Jeune",sup:"Imprimé",d:"Depuis toute petite, Tanaquil collectionne tout. Des doudous et des peluches, des mousses et des lichens, des autocollants et du parfum, des théières et des guitares. Tant et si bien que, tout le long de sa vie, Tanaquil n'a jamais eu de place pour autre chose... Saura-t-elle accueillir ce qui pourrait arriver ?",isbn:"9782490253623",img:"https://products-images.di-static.com/image/base/9782490253623-475x500-1.jpg"},
  {t:"Madame la Nuit",a:"Colin Fabrice",y:"2025",ed:"Gautier-Languereau",cote:"A COL",pub:"Jeune",sup:"Imprimé",d:"Madame la Nuit aime faire la fête! Sortir, danser sans s'arrêter...Alors pourquoi aller se reposer ? Un jour, elle décide de ne pas rentrer. Du tout. Depuis, dans la Grande Ville, il fait toujours nuit. Sortir le chien, jouer à la marelle, courir à l'école... tout se passe dans le miroitement des étoiles et des réverbères. C'est amusant... et puis, ça l'est un peu moins. Comment convaincre Madame la Nuit d'aller se coucher ? Un conte nocturne poétique et enchanteur, éclatant de couleurs, pour s'émerveiller des petits mystères de la nuit.",isbn:"9782017348214",img:"https://m.media-amazon.com/images/I/513VXxwul2L._SX210_.jpg"},
  {t:"Gourmandise",a:"Ogaki Philippe",y:"2022",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Parvati débarque à Montréal chez son cousin qui cherche à mettre au point des pilules pour guérir l'obésité. Elle prend cependant le temps de se téléporter régulièrement pour retrouver les autres Mythics, en particulier Albi, qu'elle trouve un peu trop proche d'Amir à son goût. Mais l'heure n'est pas à la jalousie car le maléfique Wendigo cherche à contrefaire les recherches de son cousin. ©Electre 2022",isbn:"9782413041047",img:"https://products-images.di-static.com/image/base/9782413041047-475x500-1.jpg"},
  {t:"Myrmidon et la bête de la montagne",a:"Dauvillier Loïc",y:"2018",ed:"les Éditions de la Gouttière",cote:"BDJ DAU",pub:"Jeune",sup:"Imprimé",d:"Lorsque Myrmidon enfile un déguisement, le monde qui l'entoure n'est plus le même...",isbn:"9791092111828",img:"https://images.epagine.fr/828/9791092111828_1_m.jpg"},
  {t:"Shibu et ses émotions",a:"Thomas Tess",y:"2026",ed:"Gallimard",cote:"A OLL",pub:"Jeune",sup:"Imprimé",d:"Un album plein d'humour et de poésie qui célèbre l'importance d'exprimer ses émotions et la joie d'être soi-même!<br>Shibu d&#x00E9;borde d'&#x00E9;motions, et il adore les partager ! Il peut se montrer fier ou triste, rempli de col&#x00E8;re ou d'amour... Et bien plus encore ! Mais un doute l'envahit petit &#x00E0; petit : et si ses &#x00E9;motions &#x00E9;taient trop visibles'Apr&#x00E8;s tout, ses amis sont si discrets..",isbn:"9782075236140",img:"https://products-images.di-static.com/image/base/9782075236140-475x500-1.jpg"},
  {t:"Monstres à l'horizon",a:"Bloch Serge",y:"2024",ed:"Bayard éditions",cote:"BDJ BLO",pub:"Jeune",sup:"Imprimé",d:"SamSam est un superhéros qui vit sur une planète peuplée d'êtres extraordinaires, affrontant à la fois les dangers de l'espace et les problèmes d'une vie d'enfant. Ses aventures l'aident finalement à grandir et à devenir plus fort. SamSam revient à la télévision pour une nouvelle saison sur Okoo ! 20 épisodes réunis en 3 chapitres : - Plus fort que les monstres ! - Marchel 1er contre-attaque ! - L'amitié c'est sacré !",isbn:"9791036365379",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791036365379-475x500-1.jpg"},
  {t:"Les mystères de Sinclair. Le vol du moineau d'or",a:"Woodfine Katherine",y:"2026",ed:"Poulpe fictions",cote:"J WOO",pub:"Jeune",sup:"Imprimé",d:"Bienvenue chez Sinclair, le plus grand et le plus élégant magasin de Londres ! Sophie, une jeune orpheline débrouillarde, vient d'y être embauchée comme vendeuse. A elle les robes en soie, les chapeaux à plumes et les vitrines somptueuses ! Mais le rêve tourne au cauchemar lorsque l'inestimable Moineau d'Or y est volé... et que Sophie est accusée ! Accompagnée de Billy, garçon d'étage fan de romans policiers, et de Lil, mannequin qui rêve de devenir actrice, réussira-t-elle à faire éclater la vérité ?",isbn:"9782377424405",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782377424405-475x500-1.jpg"},
  {t:"Echec à la reine",a:"Ilesi Alyerel",y:"2026",ed:"Scrineo",cote:"J ILE",pub:"Adolescent",sup:"Imprimé",d:"Terrasul est dirigé par des reines masquées érigées au rang de divinités. La princesse Viviane est amenée à régner. En attendant, chaque été, ses parents l'envoient loin du palais pour qu'elle puisse vivre encore quelques moments d'insouciance. Elle y rencontre Andreas à qui elle est forcée de cacher sa véritable identité. Et ils tombent amoureux. Malheureusement, leurs devoirs respectifs finissent par les séparer. Car le jeune homme porte lui aussi de lourds secrets. Des années plus tard, Viviane se prépare à défendre son reinaume en guerre. Et se retrouve confrontée au spectre de ses décisions passées... Amour, trahison, complots, pouvoir... un roman magistral porté par de magnifiques personnages, confrontés à des choix impossibles...",isbn:"9782381674926",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782381674926-475x500-1.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeune",sup:"Imprimé",d:"Rintarô Tsumugi, un élève du lycée Chidori qui  rassemble des garçons au plus bas de l échelle  scolaire, fait un jour la connaissance de  Kaoruko Waguri, qui fréquente l établissement  des filles de bonne famille, Kikyô.  Le jeune homme aux traits durs, habitué à  effrayer les autres sans le vouloir, est d'abord  perplexe devant l attitude de Kaoruko,   qui lui fait face avec une grande sincérité.  Cependant, il va peu à peu oser s ouvrir à la  jeune fille&Malgré le rapprochement qui s'opère entre  les deux lycéens, le fossé entre leurs écoles  voisines reste encore profond. C est alors qu un  jour, Subaru Hoshina, une amie de Kaoruko  qui déteste cordialement Chidori, interpelle  Rintarô&Roméo et Juliette moderne,   référence incontournable au Japon,   Bloom est une vraie pépite de  comédie et d émotions !",isbn:"9782373499766",img:"https://covers.openlibrary.org/b/isbn/9782373499766-M.jpg"},
  {t:"L'Exilée",a:"De Castell Sebastien",y:"2026",ed:"Gallimard",cote:"J DEC",pub:"Adolescent",sup:"Imprimé",d:"Le dernier tome des aventures de Furia Perfax, l'héroïne que rien n'arrête. Un univers de fantasy sombre et fascinant, entre action spectaculaire et humour incisif ! En libérant la belle Arissa des geôles berabesa, Furia fait la rencontre de Chedran, l'un des derniers Mahdek. Déchirée entre son amour naissont et l'appel de ses origines, elle est confrontée à un choix qui pourrait sceller son avenir et celui de son peuple.",isbn:"9782075215251",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075215251-475x500-1.jpg"},
  {t:"Les belles photos de famille",a:"Lee Siwon",y:"2026",ed:"Gautier-Languereau",cote:"A LEE",pub:"Jeune",sup:"Imprimé",d:"Dans le village de la forêt, chez Hibou et Ours, les photographes, tous les animaux défilent pour poser en famille. Mais panda, lui, est tout seul : avec qui va-t-il poser ?",isbn:"9782017371007",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782017371007-475x500-1.jpg"},
  {t:"The Ice Guy & The Cool Girl",a:"Tonogaya Miyuki",y:"2022",ed:"Mangetsu",cote:"BD ICE",pub:"Jeune",sup:"Imprimé",d:"D'un côté, nous avons Himuro, descendant des temps modernes de la célèbre femme des neiges. De l'autre, Fuyutsuki, sa collègue aussi gentille qu'unique... Mais aussi frais qu'ils puissent paraître, aucun des deux n'est doué en relations amoureuses. Nos héros passent de plus en plus de temps ensemble et Himuro dévoile un aspect inattendu de sa personnalité, tandis que Fuyutsuki parvient toujours plus à faire fondre le coeur du jeune homme par sa gentillesse. Le vent du changement va-t-il enfin souffler sur eux ?",isbn:"9782382811108",img:"https://covers.openlibrary.org/b/isbn/9782382811108-M.jpg"},
  {t:"Le dernier espadon",a:"Van Hamme Jean",y:"2021",ed:" Blake & Mortimer",cote:"BDJ VAN",pub:"Jeune",sup:"Imprimé",d:"Sur une route d'Angleterre, une voiture roule en direction de l'aéroport militaire de Hasley. À son bord, le major Rupert Humbletweed, chargé d'une mission secrète pour le gouvernement britannique. Au Centaur Club, à Londres, le capitaine Francis Blake dîne d'un roastbeef trop cuit avec son ami, le professeur Philip Mortimer. Il lui confie une opération de la plus haute importance : se rendre au Pakistan pour modifier le code d'activation des Espadons stockés dans la base de Makran, afin de permettre leur transfert jusqu'à Scaw-Fell, en Angleterre. Blake, qui vient de prendre la direction du MI 5, doit ensuite partir pour l'Ulster : d'après l'un de ses agents, l'IRA préparerait un complot d'envergure contre l'Angleterre... Premier scénariste à avoir repris les aventures de Blake et Mortimer, avec L'Affaire Francis Blake, Jean Van Hamme imagine une suite à l'album inaugural de la série, Le Secret de l'Espadon, qu'il avait découvert lors de sa parution dans Tintin. Vibrant hommage à Edgard P. Jacobs, ce Dernier Espadon est servi par le graphisme très « jacobsien » de Teun Berserik et Peter van Dongen, les dessinateurs de La Vallée des Immortels.",isbn:"9782870972854",img:"https://covers.openlibrary.org/b/isbn/9782870972854-M.jpg"},
  {t:"Les pieds de Papa",a:"Jadoul Emile",y:"2026",ed:"L'École des loisirs",cote:"A JAD",pub:"Jeune",sup:"Imprimé",d:"Mes deux petits pieds sur le grand pied de Papa, je suis prêt pour l'aventure ! Tagada, tagada, grands pieds cheval ! A l'eau, grands pieds bateau ! On rentre à la maison, grands pieds avion ! Et quand Papa n'est pas là, les grandes bottes, c'est pour moi !",isbn:"9782211349949",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782211349949-475x500-1.jpg"},
  {t:"Hermès conditionné",a:"Cazenove Christophe",y:"2021",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"La mythologie grecque revisitée avec un humour légendaire. Le pauvre Hermès ne s'en sort plus... En plus d'être le messager personnel de Zeus, il doit s'occuper des carrefours, des voyageurs, des voleurs, du commerce... et devinez qui doit conduire les morts aux Enfers ? Hermès, bien sûr ! Bref, même si ses sandales ailées lui permettent de courir plus vite qu'un éternuement de foudre, il aurait bien besoin d'un coup de main de nos Petits Mythos. Le hic, c'est que ceux-ci sont déjà bien occupés à libérer Io, leur copine changée en vache et surveillée par le terrible Argos, le gardien aux 100 yeux ! Qui a dit que Petit Mythos était un métier de tout repos ?",isbn:"9782818977163",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782818977163-475x500-1.jpg"},
  {t:"Chaos Bang",a:"Nob",y:"2025",ed:"Dupuis",cote:"BDJ NOB",pub:"Jeune",sup:"Imprimé",d:"Dad, tout le monde l'adore, et en premier lieu ses filles ! Ca, ça ne change pas. Mais pour le reste, tout évolue ! Car entre Panda qui cherche à quitter l'appartement familial, Mouf qui démarre une carrière d'influenceuse canine, Ondine qui gagne en maturité, Roxane qui se coupe elle-même les cheveux façon pétard et Bébérénice qui développe un sacré caractère, le super-papa va en voir de toutes les couleurs ! Un sacré \" chaos bang \" en perspective, mais toujours avec beaucoup d'humour, des tonnes de tendresse et un rien de nostalgie. La vie, quoi ! Une famille, ça évolue. Nob le sait et garde un oeil attentif sur la famille de Dad, dont chaque membre grandit d'une manière aussi fine que terriblement drôle !",isbn:"9782808510349",img:"https://covers.openlibrary.org/b/isbn/9782808510349-M.jpg"},
  {t:"Parvati",a:"Ogaki Philippe",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Il y a longtemps, alors que le Mal répandait sa toute puissance de destruction, six héros dotés de pouvoirs extraordinaires se dressèrent contre lui. Il fut vaincu et scellé dans un endroit secret du désert rouge de la planète Mars... Aujourd'hui, les six héritiers et dignes successeurs de ces héros antiques vont devoir faire face à la plus grande menace que le monde contemporain ait jamais connue.",isbn:"9782413001966",img:"https://images.epagine.fr/966/9782413001966_1_m.jpg"},
  {t:"Hé ho, croco !",a:"Alzial Sylvain",y:"2026",ed:"Marcel et Joachim/Gallimard Jeunesse",cote:"A ALZ",pub:"Jeune",sup:"Imprimé",d:"Un petit lapin gourmand, attiré par de beaux liserons charnus, s'approche de la rivière. Trop près. Un gros crocodile en profite pour l'avaler tout rond. Bien embêté, le petit lapin se demande comment il va bien pouvoir sortir de ce ventre dégoûtant. Quand il entend son geôlier se réjouir de cette belle prise d'un \"Hé hé hé\" sonore et cruel, il lui vient une idée : le lapin invite le crocodile à articuler des sons vraiment effrayants (et pas un petit Hé hé hé ridicule). Piqué dans son orgueil, le crocodile va se laisser guider par le petit lapin, comme un comédien le serait par son metteur en scène... Jusqu'au HA HA HA final, qui nécessite que le crocodile ouvre grand sa gueule. Le lapin malin en profite pour s'échapper, bien content !",isbn:"9782075233477",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075233477-475x500-1.jpg"},
  {t:"Odilon",a:"Davenier Christine",y:"2026",ed:"Bayard éditions",cote:"A DAV",pub:"Jeune",sup:"Imprimé",d:"Un envol plein de tendresse et de malice Odilon est un petit papillon adorable... mais tétanisé à l'idée de quitter le nid. Contrairement à ses frères et soeurs qui volent, il préfère écouter leurs histoires de là-haut, bien au chaud. Mais ça, c'était avant qu'Isabelle, une coccinelle intrépide, débarque pour jouer. Elle l'entraîne dans un jeu inattendu et, par accident (ou par magie ? ), Odilon tombe... pour mieux s'envoler ! Une première aventure remplie de douceur, de rires et de courage. Un petit héros auquel les enfants peuvent s'identifier Ce joli récit aborde avec tendresse la peur de se lancer, ce moment où l'on hésite encore avant de grandir. Les jeunes lecteurs se reconnaîtront dans Odilon et sa crainte de l'inconnu, tandis que les parents apprécieront la manière bienveillante dont l'histoire montre que chacun avance à son rythme. Parfait pour aborder la confiance en soi, les premiers pas (ou vols ! ) et l'amitié. Une illustratrice reconnue et une collection craquante Les illustrations de Christine Davenier - déjà adorée pour la série \"Minusculette\" (à l'Ecole des loisirs) - apportent une chaleur et un charme irrésistibles à cette histoire. Elle s'inscrit dans la collection Tout Carton Tout Mignon, des livres solides et joyeux, spécialement pensés pour les petites mains... et les grands sourires.",isbn:"9791036375293",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036375293-475x500-1.jpg"},
  {t:"Comment le monde est parti en saucisse",a:"Schmauch Anne",y:"2026",ed:"Éditions Sarbacane",cote:"J SCH",pub:"Jeune",sup:"Imprimé",d:"Moi, c'est Célestin, 11 ans, spécialiste mondial de la lutte anti-microbes. Mes trois pires ennemis ? Les bactéries. Le nez morveux de mon petit frère. La bave de son chien, Saucisse. Je rêvais de vacances paisibles. Sans germes, sans drames. Raté. Et puis, une extraterrestre s'est écrasée sur notre toit, a semé des graines de trou noir partout... et il paraît que NOUS aurions, peut-être-un-tout-petit-peu, déclenché la fin du monde. Ah, et avant de tourner la page : merci de reculer d'un mètre. Mesures sanitaires.",isbn:"9791040808008",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9791040808008-475x500-1.jpg"},
  {t:"Bêêê, oui ! Meuh, non !",a:"Gutman Colas",y:"2026",ed:"L'École des loisirs",cote:"A MAU",pub:"Jeune",sup:"Imprimé",d:"Petit mouton cherche sa famille, il demande à la vache si elle est sa maman, mais elle lui répond MEUH, NON ! Il demande au tigre s'il est son papa, mais il lui répond GRRR, NON ! Le serpent répond TSSS, NON ! quand il lui demande s'il est sa tata... Pauvre petit mouton... quand va-t-il retrouver quelqu'un de sa famille ?",isbn:"9782211349024",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782211349024-475x500-1.jpg"},
  {t:"L'école sous les étoiles",a:"Arlène Alexandre",y:"2025",ed:"Auzou",cote:"BDJ ARL",pub:"Jeune",sup:"Imprimé",d:"Les élèves sont de retour à l'Académie Royale et leur rentrée se fait pendant la nuit ! Etrange... Les élèves sont de retour à l'Académie Royale et leur rentrée se fait pendant la nuit ! Etrange... Un nouveau professeur noctambule va leur donner des cours d'astronomie. Il paraît qu'une comète magique va passer au-dessus du château et les élèves devront l'observer. Génial ! Migali est ravie d'avoir une nouvelle mission et de super occasions de faire des bêtises.",isbn:"9791039541299",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791039541299-475x500-1.jpg"},
  {t:"Les périphériques",a:"Blondel Jean-Philippe",y:"2026",ed:"Gallimard",cote:"J BLO",pub:"Jeune",sup:"Imprimé",d:"Axel a quinze ans et vit dans une petite ville de province. Au pied de l'immeuble, il zone avec les copains en tentant d'oublier que l'avenir est un horizon bouché. Et qu'il n'a pas trouvé de stage pour clore son année de seconde. Grâce à son beau-père, il atterrit à Totem Radio, une radio locale que personne n'écoute... Quand les rencontres font des miracles. Un roman social lumineux dont les héros sont les oubliés du système, par l'auteur de Blog et Un été 79.",isbn:"9782075223645",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075223645-475x500-1.jpg"},
  {t:"Skandar et la guerre de l'esprit",a:"Steadman A. F.",y:"2026",ed:"Hachette",cote:"J STE",pub:"Jeune",sup:"Imprimé",d:"L'Ile est en guerre. Skandar, devenu hors-la-loi, se cache depuis que Rex Manning a révélé l'identité de sa mère lors de la dernière Coupe du Chaos. Mais alors que Rex se prépare à envahir le continent, les habitants de l'Ile ne savent plus à qui se fier. Et après la trahison de Florence, qui se bat maintenant pour le camp ennemi, Skandar doit construire de nouvelles alliances, y compris avec Kenna. Pour remporter la Guerre de l'Esprit, Skandar et ses amis devront remonter aux origines de l'Ile et exploiter toute la puissance de leur magie.",isbn:"9782017248378",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782017248378-475x500-1.jpg"},
  {t:"Les fables du Roi des Aulnes",a:"Ba Juni",y:"2026",ed:"Bayard éditions",cote:"BDJ BA",pub:"Jeune",sup:"Imprimé",d:"Au coeur de la fabuleuse foret de Mynislyvix, deux figures se font face : Goupil, rusé manipulateur qui a déjoué la mort, et le Roi des Aulnes, immortel et solitaire. Leur rivalité anime la forêt depuis la nuit des temps, donnant naissance à une série de contes qui forment la grande Histoire. Reste à savoir comment finira la leur ! Et si les deux ennemis n'étaient finalement pas aussi différents qu'ils ne le pensent ? Un roman graphique qui dégoupille les classiques... Deux figures iconiques se font face dans ce roman graphique : le renard rusé, d'une part, et le monstre mystérieux de l'autre. A travers leurs affrontements répétés, ces deux personnages hauts en nuance questionnent et déconstruisent les rôles classiques des fables : le héros ne serait finalement pas si héroïque, et l'antagoniste pas si méchant... ... signé par un dessinateur au style incomparable Juni Ba nous livre une fois de plus une oeuvre percutante, dans la lignée de Mobilis et The Boy Wonder (Urban Comics). Le dessinateur de comics acclamé joue avec les codes graphiques et n'hésite pas à bousculer nos modes de lectures : contrastes bluffants, découpages ultra dynamique, sens du détail... Les Fables du Roi des Aulnes ne laissera personne indifférent.",isbn:"9791036387654",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791036387654-475x500-1.jpg"},
  {t:"De briques et de blocs",a:"Bailly Pierre",y:"2025",ed:"Dupuis",cote:"BDJ BAI",pub:"Jeune",sup:"Imprimé",d:"Piégé dans une mystérieuse forêt, trempé par une pluie battante, Petit Poilu doit vite se trouver un abri ! Ceux que lui offriront Claude le castor, Marguerite la taupe ou Mimine la fourmi conviendront-ils à notre héros dégoulinant ? Si ce n'est pas le cas, comptez sur lui pour laisser parler son inventivité à grands renforts de briques, de blocs et d'imagination, afin de construire avec ses nouveaux amis une incroyable cabane ! Une maison bricolée à leur façon, mais qui pourrait bien rendre un riche service à Jojo le pauvre hérisson... Construire, déconstruire, s'amuser avec mille cabanes et en donner à ceux qui n'en ont pas : c'est la nouvelle grande aventure que va partager Petit Poilu avec ses lectrices et lecteurs ! La cabane : un élément clé de l'imaginaire, de la construction et de l'équilibre des enfants. Une notion qu'habitent avec intelligence et humour Céline Fraipont et Pierre Bailly !",isbn:"9782808510134",img:"https://covers.openlibrary.org/b/isbn/9782808510134-M.jpg"},
  {t:"Le fantastique voyage de Nicola au pays des démons",a:"Miyanaga Asaya",y:"2025",ed:"Nobi Nobi",cote:"BD FAN",pub:"Jeune",sup:"Imprimé",d:"Un périple initiatique touchant et surprenant ! Arrivés dans la vallée de Zagande, Nicola et Simon doivent affronter une gigantesque araignée qui les empêche de progresser dans la grotte qui abriterait des humains. Heureusement, ils tombent nez à nez avec Bruno, le chevalier popé, qui les aide à atteindre le village caché. Nicola retrouvera-t-elle enfin sa mère et pourra-t-elle trouver le chemin du retour dans son monde d'origine ?",isbn:"9782384963270",img:"https://covers.openlibrary.org/b/isbn/9782384963270-M.jpg"},
  {t:"Honey Lemon Soda T14",a:"Murata Mayu",y:"2026",ed:"nobi nobi !",cote:"BD HON",pub:"Jeune",sup:"Imprimé",d:"Uka Ishimori et Kai Miura filent  le parfait amour et l'ont proclamé  haut et fort lors de la fête du lycée.  Il est d'ailleurs temps pour eux de  fêter le premier anniversaire de  leur relation ! Afin de célébrer ce  grand jour, la jeune fi lle a préparé  un planning aux petits oignons'  Réussira-t-elle à rendre la journée  aussi inoubliable qu'elle l'imagine'L'amour repars pour un tour !",isbn:"9782384966622",img:"https://covers.openlibrary.org/b/isbn/9782384966622-M.jpg"},
  {t:"Jeanne et le secret des petites voix dans la tête",a:"Charvel Johann",y:"2026",ed:"Flammarion",cote:"A CHA",pub:"Jeune",sup:"Imprimé",d:"Jeanne adore se promener avec sa tante Hélène et discuter avec elle, car elle écoute toujours et connaît plein de choses. Aujourd'hui, Jeanne a envie de lui confier un secret : - Tu sais, Tata, parfois je me parle dans ma tête et j'entends une petite voix... Un album éclairant sur un phénomène utile, précieux et même un peu magique, pour aider les enfants à apprivoiser leur monde intérieur.",isbn:"9782080480477",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782080480477-475x500-1.jpg"},
  {t:"L'escadron ravage",a:"Sobral Patrick",y:"2025",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"La base d'Ultima est prise d'assaut par l'Escadron Ravage mené par Kalypso et son frère Kénian. Aidés des Magicors de Dame Kalandre, ils semblent inarrêtables... A mille lieux de là, de retour du Nirvanis, Galen et ses compagnons sont loin de se douter du drame qui se joue et des pertes subies dans leurs rangs. Le destin d'Alysia semble se jouer dans ce terrible affrontement.",isbn:"9782413087847",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782413087847-475x500-1.jpg"},
  {t:"Titanic",a:"Boudeville Peggy",y:"2026",ed:"Fleurus",cote:"J BOU",pub:"Adolescent",sup:"Imprimé",d:"Le 11 avril 1912, le Titanic s'élance en direction de New York avec, à son bord, plus de deux mille personnes. Parmi eux, Ernest ainsi que Juliette et sa famille, tous pleins d'espoir et de rêves. Mais, dans la nuit du 14 au 15 avril, l'impensable arrive : après avoir heurté un iceberg, le paquebot coule petit à petit dans les eaux glaciales de l'Atlantique. Ernest et Juliette vont alors devoir unir leurs forces et faire preuve d'un courage extraordinaire pour survivre et tenter de sauver des enfants perdus dans le chaos du naufrage.",isbn:"9782215197416",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782215197416-475x500-1.jpg"},
  {t:"Bisous bisous",a:"Geis Patricia",y:"2026",ed:"Editions Casterman",cote:"A GEI",pub:"Jeune",sup:"Imprimé",d:"Des flaps et des pop-ups pour se faire des bisous par milliers ! Mamie Miel envoie un bisou à Grisou, qui le reçoit sur la joue. De flaps en flaps, une véritable chaîne de bisous se met en place : des bisous pour guérir, des bisous pour souhaiter un anniversaire, des bisous pour demander pardon, des bisous pour tout le monde ! Un très bel objet ludique et plein d'amour : le petit lecteur pourra lui-même déplacer le bisou, grâce au rabat, vers le copain suivant !",isbn:"9782203296510",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203296510-475x500-1.jpg"},
  {t:"Merlin et Chou chez les pirates",a:"Stower Adam",y:"2025",ed:"Flammarion",cote:"J CLE",pub:"Jeune",sup:"Imprimé",d:"Un chat pantouflard, un lapin à la crème, une chatière magique... En avant pour des aventures poilantes ! Merlin et Chou forment un duo aussi poilu que craquant. Ensemble, ils partent à l'aventure ! Car, oui, la chatière de Merlin est magique. Aujourd'hui, elle propulse les deux amis sur un bateau de pirates ! Cap sur l'Île aux Monstres, à la recherche d'un fabuleux trésor..",isbn:"9782080489241",img:"https://products-images.di-static.com/image/base/9782080489241-475x500-1.jpg"},
  {t:"Jusqu'à leur dernier souffle",a:"Craig Erin A.",y:"2026",ed:"Editions Casterman",cote:"J CRA",pub:"Jeune",sup:"Imprimé",d:"Tous les dons ont un prix... Avant même sa naissance, Hazel Trépas fut promise au dieu de la Mort. Devenant son parrain, il lui offre un don qui fera d'elle une grande guérisseuse. D'un simple toucher elle est capable de déduire le mal dont souffre quelqu'un. En contrepartie, si elle utilise son pouvoir et qu'un crâne apparaît sur le patient, elle a pour devoir d'abréger ses souffrances... A 18 ans, Hazel est déjà hantée par les fantômes de tous ceux qu'elle a tués et aspire à fuir ses responsabilités. Mais le destin l'amène à la cour royale, où elle est confrontée à un dilemme : prendre la vie d'un roi marqué par la mort, condamnant ainsi le royaume à un chaos certain, ou chercher par tous les moyens un remède en défiant la Mort en personne... Prise entre les complots à la cour, un panthéon de divinités à la moralité douteuse et l'agaçant mais non moins séduisant prince Léopold, Hazel va devoir faire un choix et en assumer les conséquences.",isbn:"9782203293090",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782203293090-475x500-1.jpg"},
  {t:"La mémoire des vaincus",a:"Guillou Bleuenn",y:"2026",ed:"Didier jeunesse",cote:"J GUI",pub:"Adolescent",sup:"Imprimé",d:"A Novi Zora, tout s'achète, même les souvenirs. Voilà quatorze ans que la nation, vaincue par Mirska lors d'une guerre sans merci, vit dans la honte et la misère. Anastasia connaît bien la valeur de la poussière mémorielle : elle a vendu son passé pour devenir voleuse de souvenirs. Ses missions, de plus en plus dangereuses, la mènent jusqu'au Parlement des Trente. C'est là que Lev compte trouver sa place en gravissant les échelons politiques, aidé d'un mentor anonyme. Contrairement à ses traîtres de parents, effacés de toutes les mémoires par le châtiment de la damnatio memoriae, il entend marquer l'Histoire en restaurant la gloire de sa patrie. Mais dans les coulisses du Parlement, les souvenirs les plus précieux attisent les convoitises. Quand les échos du passé se heurtent aux ambitions de l'avenir, il faut parfois se méfier de sa propre mémoire...",isbn:"9782278132157",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782278132157-475x500-1.jpg"},
  {t:"Les Mystères de Byton Cove - La nuit de la disparition",a:"Sivi Laëtitia",y:"2026",ed:"Fleurus",cote:"J SIV",pub:"Jeune",sup:"Imprimé",d:"De retour à Byton Cove après Noël, Ruby retrouve ses amis du club international et intègre le département de photographie. Elle espère un nouveau départ, loin de l'attention médiatique des dernières semaines. Mais voilà qu'elle est entraînée dans une nouvelle affaire ! Juana Moya lui demande d'enquêter, avec Charles, sur la disparition de son fils, Arturo, vingt-huit années plus tôt. Un seul témoin : le petit frère de la victime, Gabriel, qui l'accompagnait dans les bois de Williams Wood, cette nuit-là'et qui est persuadé qu'Arturo a été enlevé par des extraterrestres ! Ruby, Charles et leurs amis essaient de démêler le vrai du faux, s'intéressent aux théories du complot et investiguent le passé de cet Arturo, brillant étudiant d'origine immigrée qui rêvait d'être astrophysicien'Ruby cherche la vérité. Pourtant, elle sait bien que l'on peut se perdre soi-même à poursuivre des fantômes",isbn:"9782215200253",img:"https://products-images.di-static.com/image/base/9782215200253-475x500-1.jpg"},
  {t:"Les Nouvelles Vagues",a:"Cathrine Arnaud",y:"2026",ed:"Pocket",cote:"J CAT",pub:"Jeune",sup:"Imprimé",d:"Après le succès de *Romance*, découvrez l'histoire de Vince, Micha, Marilyn et Octave : quatre ados en quête d'eux-mêmes, entre premiers amours, doutes et épreuves de la vie. Les Nouvelles Vagues, c'est Vince, Micha, Marilyn et Octave. Les Nouvelles Vagues, c'est le portrait d'une génération qui invente sa façon d'aimer et d'être soi. Moi, je veux flamber. Sinon on n'est pas vivant. Je veux me jeter sur tout ce qui est inflammable. Même si j'ai peur. La vie me fait peur. Les garçons me font peur. Les filles me font peur. Mais je veux cramer. Ce sera bref, et qu'est-ce qu'on s'en fout : pourquoi une histoire courte ne serait-elle pas une histoire tout court'",isbn:"9782266354462",img:"https://products-images.di-static.com/image/base/9782266354462-475x500-1.jpg"},
  {t:"Yôkai",a:"Vermot Thibault",y:"2022",ed:"Éditions Sarbacane",cote:"J VER",pub:"Jeune",sup:"Imprimé",d:"\"Voici Yanagi, et voici Takata. C'est pas des si mauvais garçons : s'ils m'ont enlevée, c'est qu'ils avaient besoin d'argent. Takata dit qu'il a cassé son sabre et qu'il doit en racheter un. Au fait, moi, c'est Kyoko, et je suis la fille du calligraphe. Ils ont décidé de se cacher dans la montagne en attendant la rançon, mais mon père est si radin qu'ils peuvent toujours courir ! Avec Yanagi, on a pêché des poissons, et j'ai mis une branche dans l'oeil de Takata sans le faire exprès. Moi je m'amuse bien ! Mais Yanagi guette les gens dans la vallée. Bientôt, la montagne grouillera d'hommes du daimyo, le chef de la police. C'est là que j'ai l'idée proposer un plan époustouflant à mes nouveaux copains : le casse du siècle, pas moins ! \"",isbn:"9782377316564",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782377316564-475x500-1.jpg"},
  {t:"Hermès le Malicieux",a:"Prévot Pascal",y:"2026",ed:"Larousse",cote:"J PRE",pub:"Jeune",sup:"Imprimé",d:"P'tit Hermès est un dieu fourbe et malicieux. Il n'hésite pas à faire des farces aux autres dieux, notamment en volant leurs biens les plus précieux. Pour calmer leur colère, Zeus charge Hermès d'accomplir une nouvelle mission : libérer la vache sacrée Io, gardée par le géant Argos. Mais les dieux mécontents cherchent à se venger : ils n'hésitent pas à placer plein d'obstacles sur la route du dieu messager. Hermès va devoir mobiliser toute son ingéniosité pour mener sa quête à bien.",isbn:"9782036089341",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782036089341-475x500-1.jpg"},
  {t:"Les aventures d'une poule aveugle et d'un canard boiteux",a:"Hub Ulrich",y:"2024",ed:"Gallimard",cote:"J HUB",pub:"Jeune",sup:"Imprimé",d:"Une fable subtile, drôle et pétillante qui célèbre le pouvoir de l'imagination et la force de l'amitié. Il existe un endroit où l'on peut réaliser son voeu le plus secret, et la poule veut s'y rendre ! Elle aurait bien aimée être accompagnée d'un chien guide, mais c'est sur un canard boiteux et très peureux qu'elle tombe. Il tremble déjà à l'idée de quitter son arrière-cour. Qu'importe, il fera bien l'affaire !",isbn:"9782075206907",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075206907-475x500-1.jpg"},
  {t:"Athéna la Guerrière",a:"Prévot Pascal",y:"2026",ed:"Larousse",cote:"J PRE",pub:"Jeune",sup:"Imprimé",d:"P'tite Athéna est une déesse rusée et fière. Dans toute sa bonté, elle aide les dieux à affronter les géants, déterminés à détruire l'Olympe. Pleine de sagesse, elle guide P'tit Hercule, missionné par Zeus, pour sauver tout le Panthéon grec. Mais parviendra-t-elle à éviter tous les obstacles ? P'tite Athéna devra mobiliser toute la ruse qui est en elle pour y parvenir.",isbn:"9782036079830",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782036079830-475x500-1.jpg"},
  {t:"L'attrape-foudre",a:"Bussy Sarah",y:"2026",ed:"R. Laffont",cote:"J BUS",pub:"Adolescent",sup:"Imprimé",d:"Farah a le coup de foudre pour Tao. Ensemble, ils vont prendre le risque de se brûler les ailes... Un superbe roman sur l'urgence et la voracité de l'adolescence. En attendant l'année du bac, Farah travaille tout l'été à la station-service familiale. Un jour, une vieille Ferrari blanche brinquebalante s'arrête à la pompe. A son volant : Tao, un garçon au charme magnétique, si libre, si différent de ceux que Farah connaît. Lorsqu'il lui propose de le suivre dans son road-trip vers les orages du Sud, la jeune fille ne peut qu'accepter. Mais au fil des kilomètres et des confidences, Farah comprend que Tao joue avec le feu. Et que sa fuite pourrait bien les brûler tous les deux...",isbn:"9782221286654",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782221286654-475x500-1.jpg"},
  {t:"La Légende de Tristan et Yseut",a:"Rachmühl Françoise",y:"2026",ed:"Flammarion",cote:"J RAC",pub:"Adolescent",sup:"Imprimé",d:"Le roi Marc de Cornouailles a décidé de prendre pour épouse la belle Yseut et charge son neveu, le chevalier Tristan, d'aller la trouver en Irlande. Mais sur le bateau du retour, les deux jeunes gens boivent par erreur un philtre d'amour. Désormais, ils sont condamnés à s'aimer à tout jamais... Retrouvez un des couples les plus mythiques de la littérature dans ce roman de chevalerie et d'amour, adapté par Françoise Rachmuhl.",isbn:"9782080497314",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782080497314-475x500-1.jpg"},
  {t:"Tout ce que je ne sais pas",a:"Lume Chloé",y:"2026",ed:"Éditions Sarbacane",cote:"J LUM",pub:"Adolescent",sup:"Imprimé",d:"Eléonore a eu un accident. Après un an de convalescence, elle sort de son cocon pour se confronter à sa vie d'avant, dont elle a tout oublié. Anciens amis, amoureux, profs... ont chacun une version différente de qui elle était, et de ce qui s'est réellement passé. Plus elle tente de reconstituer le puzzle, plus la vérité lui échappe. Que cherche-t-on à lui cacher ?",isbn:"9791040809326",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791040809326-475x500-1.jpg"},
  {t:"Le zoo des animaux disparus",a:"Cazenove Christophe",y:"2020",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"Le seul endroit où découvrir des animaux jamais vu ou qu’on ne verra malheureusement plus. Déborah, stagiaire vétérinaire qui rêve de travailler dans un zoo, se voit affecter dans un parc zoologique très particulier, car il ne présente aux visiteurs que des animaux éteints depuis des siècles, quelques décennies ou même quelques mois. Pas évident de savoir quel vaccin faire à un dodo, comment nourrir un éléphant de Sicile ou si cet oiseau tahitien, l'O'u, est en pleine forme ou pas...",isbn:"9782818976302",img:"https://covers.openlibrary.org/b/isbn/9782818976302-M.jpg"},
  {t:"Le zoo des animaux disparus",a:"Cazenove Christophe",y:"2022",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"Le seul endroit où découvrir des animaux jamais vu ou qu'on ne verra malheureusement plus. Dans ce parc zoologique qui ne présente que des animaux éteints depuis des siècles, quelques décennies ou même quelques mois, de nouvelles espèces font leur entrée. Parmi elle, l'ours de Californie (l'emblème de cet État : ça valait bien la peine de l'exterminer, pas vrai ?), et le paresseux marcheur de Jefferson... parti il y a plus de 10 000 ans ! Les animaux très menacés dans leur milieu naturel, comme le Tenkile, un marsupial vraiment trognon, ou le tatou géant, y ont trouvé refuge. Et on y attend même les cinq dernières espèces de rhinocéros encore en vie... Inclus : un cahier en partenariat avec l'Association Française des Parcs Zoologiques (AFdPZ)",isbn:"9782818992029",img:"https://covers.openlibrary.org/b/isbn/9782818992029-M.jpg"},
  {t:"L'île des animaux fabuleux",a:"Chanfreau Sofia",y:"2025",ed:"Milan",cote:"J CHA",pub:"Jeune",sup:"Imprimé",d:"« Loin, au milieu de l'océan (sans doute précisément l'océan que tu imagines), se trouve une île (sans doute précisément l'île que tu imagines). Cette île a la forme d'une girafe, en tout cas si on la regarde d'en haut, ou bien si on l'observe sur une carte et qu'on a un peu d'imagination : c'est l'Île-Girafe. On dirait que cette île a trois jambes et une petite queue, un grand corps et un long cou terminé par une tête. Au milieu de son corps, il y a un grand lac qu'on appelle le Coeur-de-la-Girafe. L'eau du lac est aussi sucrée que de la limonade et sa surface est presque toujours calme, alors que la mer salée qui entoure l'île est toujours agitée. (...) Dans l'une des maisons les plus hautes de la Capitale vit une petite fille. (...) Cette fille s'appelle Vega, et elle s'assoit souvent à sa fenêtre pour rêver de ce qui se trouve de l'autre côté de la mer. »Une héroïne touchanteVega vit seule avec son papa. Seule ? Pas du tout en fait, car toute une ribambelle d'animaux lui tiennent compagnie. Même si son père les trouve bien trop envahissants, Vega est la seule à les voir : grizzlis, zèbres, hippocampes ou rhinocéros... vivent dans son placard, au coin de la rue ou dans la salle de bains. Elle croise même des lapins sans oreilles, des souris à rayures, des chevaux petits comme des chats et des scarabées gros comme des cochons d'Inde. Sans parler de tous ceux qu'il est impossible de décrire, comme les fripourdons, les spatulots, les crapaçons et les tétrabranchipattes... Quête et résilienceDepuis quelque temps, Vega est inquiète : son père a changé, il s'absente souvent. Il semble lointain, il l'écoute à peine, il est devenu... froid ! Bientôt, Vega apprend qu'une femme de glace s'est emparée de son coeur, et voit son père en train de se couvrir de givre... Pour le sauver, elle part à la recherche de sa mère dont elle ne sait rien...Un texte pour s'évader et voyager très loin, jouer avec son imagination et apprivoiser ses peurs.Revue de presse« Un livre qui...",isbn:"9782408050924",img:"https://products-images.di-static.com/image/base/9782408050924-475x500-1.jpg"},
  {t:"Le petit Gus",a:"Desmarteau Claudine",y:"2026",ed:"Gallimard",cote:"BDJ DES",pub:"Jeune",sup:"Imprimé",d:"Ecole, famille, copains... des tranches de vie aussi tendres que drôles racontées par un truculent petit diable. \"Moi c'est Gus. En fait, je m'appelle Gustave, tout ça parce que les vieux prénoms moches étaient à la mode le jour où je suis né. J'aurais préféré m'appeler Brad, Bob ou même Brian, mais je suis bien obligé de me coltiner Gustave\".",isbn:"9782075226189",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782075226189-475x500-1.jpg"},
  {t:"Le fantastique voyage de Nicola au pays des démons",a:"Miyanaga Asaya",y:"2025",ed:"Nobi Nobi",cote:"BD FAN",pub:"Jeune",sup:"Imprimé",d:"UN PERIPLE INITIATIQUE TOUCHANT ET SURPRENANT ! Nicola et Simon continuent leur tournée à travers le monde des démons. Ils croisent à nouveau la route de certaines personnes qu'ils ont rencontrées auparavant, mais ils vont surtout faire des découvertes très importantes qui vont peut-être changer le cours de leur voyage. Alors qu'ils font face tous les deux aux mêmes obstacles, ces aventures vont resserrer les liens de nos deux compagnons... Un voyage inattendu dans un monde rempli de merveilles digne de Tim Burton.",isbn:"9782384963263",img:"https://covers.openlibrary.org/b/isbn/9782384963263-M.jpg"},
  {t:"Au pot, Hippo !",a:"Antony Steve",y:"2026",ed:"Circonflexe",cote:"A ANT",pub:"Jeune",sup:"Imprimé",d:"Suivez Hippo, un petit hippopotame qui n'a pas vraiment envie d'aller sur le pot[xe2][x80][xa6] une histoire pour accompagner les enfants dans l'apprentissage de la propreté",isbn:"9782378625573",img:"https://products-images.di-static.com/image/base/9782378625573-475x500-1.jpg"},
  {t:"Rousse et l'oiselle de feu",a:"Chan Élodie",y:"2026",ed:"L'École des loisirs",cote:"J CHA",pub:"Jeune",sup:"Imprimé",d:"Rousse s'engouffre dans les tréfonds du bois, sur les traces de Yaya, la sorcière d'automne. Accompagnée de ses chimères, celle-ci a juré d'emporter sa grand-mère au royaume des morts. Mais Rousse est bien décidée à l'affronter ! A moins que l'oiselle de feu, créature aux pouvoirs légendaires, ne lui ouvre un autre chemin ?",isbn:"9782211350068",img:"https://products-images.di-static.com/image/base/9782211350068-475x500-1.jpg"},
  {t:"Le secret du Viking King",a:"Fromental Jean-Luc",y:"2025",ed:"Hélium",cote:"BDJ FRO",pub:"Jeune",sup:"Imprimé",d:"Elle mène ses enquêtes à patte de velours, mais quand elle sort ses griffes, ça déchire... Le Polp'z, milk-bar préféré de Miss Chat, est fermé. Ole, le barman, a disparu. Sur la piste de son ami, la détective croise le chemin de Big Ø, le chef du gang des Six Poulpes de la rue Treize qu'elle a envoyé en prison au début de sa carrière. La voici immergée en compagnie de la pétulante Griselda, archiviste au quotidien Dag Tablet, dans une sombre affaire d'archéologie sous-marine. Quel secret historique dort dans la mystérieuse épave du Viking King ? Pour le savoir, il va falloir plonger. Chat échaudé craint l'eau froide, mais chez notre féline, la curiosité l'emporte toujours sur l'effroi.",isbn:"9782330209735",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782330209735-475x500-1.jpg"},
  {t:"La petite fille aux allumettes",a:"Andersen Hans Christian",y:"2025",ed:"Albin Michel",cote:"C AND",pub:"Jeune",sup:"Imprimé",d:"C'est le tout dernier soir de l'année, celui du Nouvel An. Une petite fille arpente les rues, tête nue, pieds nus. Personne na voulu acheter ses allumettes. Pour se réchauffer, elle les craque une une, et chaque flamme lui procure une vision de bonheur : un festin sublime, un sapin de Noël richement décoré, des bougies qui se transforment en toiles... jusqu'au doux visage de sa grand-mère qui n'est plus.",isbn:"9782226499790",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782226499790-475x500-1.jpg"},
  {t:"Le cri du Moloch",a:"Dufaux Jean",y:"2020",ed:" Blake & Mortimer",cote:"BDJ DUF",pub:"Jeune",sup:"Imprimé",d:"Dans le précédent opus scénarisé par Jean Dufaux, \"L'Onde Septimus\", la menace d'un engin extraterrestre, baptisé Orpheus, avait été déjouée grâce au sacrifice d'Olrik. Depuis, le \"colonel\" vit reclus dans un asile psychiatrique. Tandis que Philip Mortimer tente de ramener à la raison son vieil adversaire, il apprend qu'il existe un autre Orpheus. À bord d'un cargo transformé en laboratoire secret, le professeur découvre l'étrange pilote de cette machine : un alien à forme humaine, sombre et hiératique, auquel les scientifiques ont donné le nom de \"Moloch\", la divinité biblique. Mais les réactions de ce Moloch, et les hiéroglyphes qu'il laisse derrière lui comme autant de messages indéchiffrables, font craindre le pire. Cette fois encore, la capitale britannique est en danger. À moins qu'Olrik ne joue de nouveau les héros..",isbn:"9782870972922",img:"https://covers.openlibrary.org/b/isbn/9782870972922-M.jpg"},
  {t:"Tes mots sur les murs",a:"Renard Eve",y:"2026",ed:"Rageot",cote:"J REN",pub:"Jeune",sup:"Imprimé",d:"Dans le collège d'Olympe, un poète anonyme écrit ou colle sur les murs des messages féministes éphémères qu'elle et Assia, sa meilleure amie, immortalisent en les repostant sur Instagram. Comme ces poèmes-collages se font de plus en plus engagés, le Principal est décidé à démasquer celui qu'il considère comme un vandale. Olympe aussi veut découvrir l'identité du Poète. Elle brûle de se sentir utile dans cette lutte féministe qui s'étend dans le collège, encouragée par leur professeure de français. Elle se fait une nouvelle amie, Laula, rencontrée au club féministe. Jusqu'où iront-elles, au nom d'une noble cause ?",isbn:"9782700286953",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782700286953-475x500-1.jpg"},
  {t:"Renversante",a:"Hinckel Florence",y:"2026",ed:"L'École des loisirs",cote:"J HIN",pub:"Jeune",sup:"Imprimé",d:"Depuis la nuit des temps, ce sont les hommes qui s'occupent des enfants. C'est normale et naturelle, puisque les femmes, elles, portent les enfants dans leur ventre pendant neuf mois, puis elles les allaitent si elles veulent, ce qui les fatigue beaucoup. Elles n'allaient pas, en plus, s'en occuper le restant du temps ![xe2][x80][xa6] C'est pour ça que, dans mon pays, ce sont les femmes qui sont à la tête de l'État. Quelques hommes particulièrement intelligents ont réussi à se hisser au même rang qu'elles (même si on n'a encore jamais vu un homme présidente de la République). Ils sont très méritants, quand on pense à la charge qu'ils assument en plus à la maison[xe2][x80][xa6]",isbn:"9782211350921",img:"https://products-images.di-static.com/image/base/9782211350921-475x500-1.jpg"},
  {t:"Bloom",a:"Mikami Saka",y:"2025",ed:"nobi nobi !",cote:"BD BLO",pub:"Jeune",sup:"Imprimé",d:"Rintarô Tsumugi, un élève au lycée public pour garçons de Chidori, réputé n accueillir que des cancres, s est rapproché de Kaoruko Waguri, qui fréquente unétablissement pour filles de bonne famille, Kikyô.Les vacances d été commencent, l occasion propice pour passer du temps entre amis. Mais, prenant conscience de ses sentiments à l égard de la jeune fille, Rintarô perd ses moyens lorsqu il apprend que l anniversaire de Kaoruko approche à grands pas. Après des heures de réflexion, il décide de lui préparer un gâteau pour exprimer sa gratitude. Kaoruko saura-t-elle apprécier ce cadeau empreint desincérité ?Roméo et Juliette moderne, référence incontournable au Japon, Bloom est une vraie pépite de comédie et d émotions !",isbn:"9782384963911",img:"https://covers.openlibrary.org/b/isbn/9782384963911-M.jpg"},
  {t:"La bataille du néant",a:"Sobral Patrick",y:"2018",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Un mystérieux phénomène, le \"Néant\", menace le monde elfique. Shimy doit aider les elfes à sauver Astria grâce à ses pouvoirs élémentaires naissants. Mais des survivants Galinas n'apprécient pas ce renfort, tout comme ils ne souhaitent pas la disparition de ce très mystérieux \"Néant\". Quel noir secret ce dernier renferme-t-il ? Un nouvel épisode bourré d'adrénaline pour nos amis les Légendaires.",isbn:"9782756064772",img:"https://images.epagine.fr/772/9782756064772_1_m.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2018",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Les dragons ont laissé exploser leur pouvoir pour protéger Yona mais ce n'est pas sans conséquence. Après la mort de Neguro, et la blessure de Yotaka, les “cinq étoiles” sont en mauvaise posture et la Princesse Kôren est sans protection face au piège du prêtre Gobi. Mais cette princesse et sa jeune sœur ne se laisseront pas faire et elles feront tout pour sauver leur pays et tenter de négocier la paix.",isbn:"9782811645687",img:"https://covers.openlibrary.org/b/isbn/9782811645687-M.jpg"},
  {t:"La montagne de feu",a:"Burniat Mathieu",y:"2025",ed:"Charivari",cote:"BDJ BUR",pub:"Jeune",sup:"Imprimé",d:"Grâce à l'électricité, Icare et Kalio ont quitté l'Atlantide, à la recherche de Lyssa qui a été enlevée par l'armée de Neptune. Ils débarquent sur la montagne de feu, où ils découvrent un peuple asservi - rationné en une ressource vitale : l'eau - et terrorisé par une terrifiante Inquisitrice, qui régente l'île du haut de son château, construit au sommet du volcan. Nos deux héros, aidé par un jeune chevalier, réussiront-ils à percer le mystère de la montagne de feu ?",isbn:"9782487663190",img:"https://covers.openlibrary.org/b/isbn/9782487663190-M.jpg"},
  {t:"Animaux LEGO",a:"Padulano Jody",y:"2026",ed:"Nuinui jeunesse",cote:"737.7 PAD",pub:"Jeune",sup:"Imprimé",d:"50 adorables animaux à construire avec des briques LEGO® ! Laisse-toi guider par les conseils de l'auteur et donne libre cours à ton imagination. Dans cet ouvrage ludique et créatif, découvre comment assembler une tigre féroce, un ours tout mignon, un cygne élégant et bien d'autres animaux encore, tous réalisés avec des briques LEGO(r) ! Pour chaque modèle, tu trouveras : - Une liste détaillée des pièces nécessaires - Des instructions claires et illustrées - Des astuces pour trouver les bonnes briques LEGO(r) - Un QR code pour accéder aux tutoriels vidéo",isbn:"9782889574452",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782889574452-475x500-1.jpg"},
  {t:"La fin de l'histoire ?",a:"Sobral Patrick",y:"2015",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"C'est l'énigmatique Kalandre qui, depuis le début de la série, provoque et manipule le destin de nos Légendaires. Ce tome 18 sera un épisode éprouvant, dramatique, qui verra les Légendaires malmenés dans leurs corps et dans leurs cœurs comme jamais ils ne l'ont été. Le final sera apocalyptique et meurtrier mais, tel le phénix, ce sera pour mieux faire renaître la série ensuite.",isbn:"9782756053578",img:"https://www.bedetheque.com/cache/thb_couv/Couv_256882.jpg"},
  {t:"L'île aux momies",a:"Arlène Alexandre",y:"2025",ed:"Auzou",cote:"BDJ ARL",pub:"Jeune",sup:"Imprimé",d:"Un voyage scolaire au pays des momies ? Voilà qui ravit Migali et ses amis, bien décidés à en profiter pour faire un maximum de bêtises. Migali est ravie : toute sa classe part en voyage scolaire sur l'île aux momies, une île très ancienne, qui a connu des milliers de civilisations passées. Le professeur Flamberge a prévu de leur visiter les pyramides dans lesquelles serait caché un trésor, génial ! Mais gare aux créatures qui hantent les couloirs de ces lieux à l'histoire effrayante !",isbn:"9791039559829",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9791039559829-475x500-1.jpg"},
  {t:"Inspectrice à gadget",a:"Murail Marie-Aude",y:"2025",ed:"BD Kids",cote:"BDJ CEU",pub:"Jeune",sup:"Imprimé",d:"Romarine rêverait d'être une espionne avec autant d'accessoires que James Bond. Grâce à son imagination et à son sens de la débrouillardise, elle va faire bien mieux : elle va créer ses propres gadgets et ainsi triompher de tous les mystères, qu'il s'agisse de mamans clonées ou de la présence d'antihumains en classe de CM2. Un album sous le signe de l'imagination et du bricolage ! Ce 4e tome réunit trois histoires qui mettent en scène des gadgets tous plus loufoques les uns que les autres : \" L'espionne déclonne \", \" L'espionne s'en mêle \" et \" L'espionne se croit tout permis \". L'occasion d'admirer l'imagination sans faille de Romarine, mais aussi l'humour de ses autrices ! Un apprentie espionne irrésistible ! Imaginée par l'autrice culte Marie-Aude Murail, l'espionne est une héroïne intelligente, têtue et attachante qui a déjà séduit XXX lecteurs dans des romans désopilants. Dans cette adaptation en BD, l'illustratrice Eglantine Ceulemens ajoute à cette recette son trait généreux et tendre : irrésistible !",isbn:"9791036378508",img:"https://covers.openlibrary.org/b/isbn/9791036378508-M.jpg"},
  {t:"Le garçon et le dragon",a:"Idonaka",y:"2025",ed:"Bamboo Edition",cote:"BD GAR",pub:"Jeune",sup:"Imprimé",d:"Deux êtres jusqu'ici très solitaires surmontent ensemble leurs peurs et les blessures de leur passé. + Shitarô, un jeune collégien, se réveille un jour sur le banc d'un mystérieux sanctuaire. Il y fait la rencontre d'un dragon qui croyait retrouver là sa \"fiancée\", celle qu'il attendait depuis des siècles... Le jeune garçon, quant à lui, n'a plus aucun souvenirs en tête. Mais ils vont progressivement se lier d'amitié, oublier ensemble leur solitude et se questionner sur ce qu'est réellement l'amour. Ils vont vivre ensemble une journée fantastique et hors du temps à l'issue de laquelle leur vie à tous les deux pourrait bien se trouver changée à tout jamais. Un récit plein d'humanité, à la fois fantastique et dramatique.",isbn:"9791041112357",img:"https://covers.openlibrary.org/b/isbn/9791041112357-M.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2024",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeune",sup:"Imprimé",d:"Le monde est anéanti... Partons le visiter à moto ! Après leur escale à Karuizawa, Yôko et Airi sont reparties en direction de Gunma. Sur leur chemin se trouve le fameux Mont Asama, un volcan encore actif et entrant régulièrement en éruption... et Yôko s'est soudain effondrée en respirant les gaz toxiques de ce dernier ! C'est alors qu'est apparu un jeune homme qui va leur venir en aide et les conduire jusqu'aux sources chaudes de Kusatsu...",isbn:"9791041106882",img:"https://covers.openlibrary.org/b/isbn/9791041106882-M.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2025",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeune",sup:"Imprimé",d:"Nos deux motardes décident de faire une halte à l'abri qui a été le point de départ de leur périple. Une occasion pour elles de se remémorer le bon vieux temps. Elles reprendront ensuite la route vers la région du Tôhoku, au nord de l'île principale. Entre excavation de fossiles à Iwaki et pêche miraculeuse dans le lac Inawashiro, leur trépidant voyage les conduira jusqu'à Nagaoka, dans le département de Niigata.",isbn:"9791041111732",img:"https://covers.openlibrary.org/b/isbn/9791041111732-M.jpg"},
  {t:"L'arbre de la gentillesse",a:"Teckentrup Britta",y:"2019",ed:"Quatre Fleuves",cote:"A TEC",pub:"Jeune",sup:"Imprimé",d:"Un album poétique et profond pour faire réfléchir petits et grands sur les bienfaits de l’attention aux autres et les conséquences de la méchanceté.Avec un texte rimé et des découpes simples qui représentent habilement la complexité des sentiments. En amitié, un mot blessant crée parfois une fissure qui ne fait que grandir... Mais que se passe-t-il lorsque l’on sème la gentillesse et la bienveillance ? Grâce à de belles illustrations imprégnées de symbolisme et des découpes astucieuses, Britta Teckentrup met en regard les comportements égoïstes qui créent des fossés obscurs entre les personnes, et la magie de mots doux ou de gestes tendres qui illuminent nos journées, effacent nos peines et font naître l’affection. Pour célébrer les valeurs de l’amitié et instaurer un dialogue parents-enfants.",isbn:"9791026402718",img:"https://www.babelio.com/couv/CVT_LARBRE-DE-LA-GENTILLESSE_9130.jpg"},
  {t:"Les veilleurs de rêves",a:"Marcero Deborah",y:"2026",ed:"Didier jeunesse",cote:"A MAR",pub:"Jeune",sup:"Imprimé",d:"Lenny et ses amis avaient décidé de faire ensemble une grande collection de souhaits, de rêves et d'espoirs. Mais une tempête arriva et détruisit tout. A quoi bon rêver si on pouvait tout perdre ? Traduction de l'anglais de Rose-Marie Vassallo.",isbn:"9782278133000",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782278133000-475x500-1.jpg"},
  {t:"Edmond gros mouton",a:"Mallié Vincent",y:"2026",ed:"Editions Margot",cote:"A MAL",pub:"Jeune",sup:"Imprimé",d:"Alors qu'il gambade derrière un papillon, Edmond se perd dans la montagne. Sans personne pour le tondre, sa laine POUSSE, POUSSE, POUSSE, et il finit par ressembler à une ENORME boule de coton ! Se faisant passer pour de gentils bergers, le loup, le renard et l'aigle vont essayer de le CROQUER. Mais ce mouton n'est pas une proie si facile...",isbn:"9782494797567",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782494797567-475x500-1.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2025",ed:"Pika édition",cote:"BD BLU",pub:"Jeune",sup:"Imprimé",d:"Grâce à sa nouvelle arme d'étonante, Isagi permet au club allemand d'égaliser ! Face à son rival qui se retrouve sous les projecteurs du monde entier, Kaiser, acculé, joue le tout pour le tout avec une technique encore incomplète, dans l'espoir de régler ses comptes avec le passé ! Boostés par cette tension, les autres individualistes affamés de buts se battent, eux aussi, pour définir la ligne à franchir afin de briller à leur tour. Qui parviendra à atteindre une nouvelle dimension dans sa progression transcendantale faite de destruction et de reconstruction ? !",isbn:"9791043303326",img:"https://covers.openlibrary.org/b/isbn/9791043303326-M.jpg"},
  {t:"Yona, princesse de l'aube",a:"Kusanagi Mizuho",y:"2019",ed:"Pika édition",cote:"BD YON",pub:"Jeune",sup:"Imprimé",d:"Victimes des manigances du prêtre Gobi, Yona et ses amis sont emmenés de force jusqu'à l'empire de Kai. Ayant repéré la puissance de Jae-ha,  Cuerbo prend Yona en otage et contraint Jae-ha à se soumettre à ses ordres. De son côté, afin de retrouver Yona et les autres captifs, Hak accepte la proposition de Kye-sook et décide de s'allier avec l'armée du pays de Kôka...",isbn:"9782811652241",img:"https://covers.openlibrary.org/b/isbn/9782811652241-M.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2026",ed:"Pika édition",cote:"BD BLU",pub:"Jeune",sup:"Imprimé",d:"Pour s'emparer du dernier but, Isagi et Kaiser unissent leurs forces, rallumant l'envie de vaincre dans tout le club allemand ! La formation française, loin de se laisser abattre, resserre également ses rangs et rend coup pour coup, transformant l'affrontement en un duel d'une intensité sans précédent ! Au coeur de cette arène en ébullition, Ness, laissé un peu de côté, cherche désespérément à retrouver Kaiser et à découvrir la voie de sa propre renaissance. Dans ce brasier où s'enchaînent les rebondissements imprévisibles, quelle équipe finira par obtenir la victoire absolue ? ! Soyez témoins du dénouement le plus imprévisible de l'histoire !",isbn:"9791043306471",img:"https://covers.openlibrary.org/b/isbn/9791043306471-M.jpg"},
  {t:"Blue Lock",a:"Kaneshiro Muneyuki",y:"2026",ed:"Pika édition",cote:"BD BLU",pub:"Jeune",sup:"Imprimé",d:"La rencontre explosive du football et du \"baffle royale\". Le match est relancé par le but égalisateur phénoménal de Rin Itoshi ! Portée par une série de changements fulgurants, la tension atteint son paroxysme sur le terrain. Sous l'effet de cette effervescence, Loki, encore resté sur le banc jusqu'ici, et Noa annoncent brusquement leur entrée en jeu ! Au coeur du tumulte, Isagi plonge dans une analyse acharnée, à la recherche d'une stratégie décisive... Le dénouement approche, et cette ultime bataille s'apprête à déclencher une onde de choc capable de bouleverser le monde !",isbn:"9791043306068",img:"https://covers.openlibrary.org/b/isbn/9791043306068-M.jpg"},
  {t:"Haley",a:"Oda Eiichirō",y:"2026",ed:"Glénat",cote:"BD ONE",pub:"Jeune",sup:"Imprimé",d:"Se hisser sur les épaules des géants ! Maintenant qu'elle a débarqué sur Erbaf, Robin peut enfin fêter ses retrouvailles tant attendues avec Sauro. Mais alors que de nouvelles aventures débutent dans cette contrée inconnue, des personnages pour le moins inquiétants font leur apparition. Faut-il y voir le présage d'une tempête ? ! Les aventures de Luffy à la poursuite du One Piece continuent !",isbn:"9782344068922",img:"https://covers.openlibrary.org/b/isbn/9782344068922-M.jpg"},
  {t:"La voie du tablier",a:"Oono Kousuke",y:"2026",ed:"Kana",cote:"BD VOI",pub:"Jeune",sup:"Imprimé",d:"Ne sous-estimez jamais un homme au foyer ! Tatsu doit accompagner son beau-père chez le vétérinaire pour faire vacciner son chien. Mais ce canidé a un drôle de défaut : il se met à trembler de tout son corps rien qu'en entendant les mots \"vaccin\", \"piqûres\" et \"piquer\"... Avec tous ces \"adversaires\" qui se succèdent, même le plus coriace des hommes au foyer en bave ! Voici le seizième volume de ce manga comique, qui raconte la vie d'un ancien yakuza à la maison !",isbn:"9782505144038",img:"https://covers.openlibrary.org/b/isbn/9782505144038-M.jpg"},
  {t:"Komi cherche ses mots",a:"Oda Tomohito",y:"2026",ed:"Pika édition",cote:"BD KOM",pub:"Jeune",sup:"Imprimé",d:"Komi est désormais en terminale ! Répartie dans la même classe que Tadano et Najimi, elle est néanmoins séparée de ses amis de la première 1, et notamment de Manbagi. Une petite inquiétude se fait sentir... alors que commence une guerre organisée entre les différentes classes du lycée ! Seconde contre première contre terminale, Komi gagnera-t-elle appuyée de nouveaux camarades toujours aussi déjantés ? !",isbn:"9791043306037",img:"https://covers.openlibrary.org/b/isbn/9791043306037-M.jpg"},
  {t:"Komi cherche ses mots",a:"Oda Tomohito",y:"2026",ed:"Pika édition",cote:"BD KOM",pub:"Jeune",sup:"Imprimé",d:"Komi et Tadano sortent ensemble. L'un comme l'autre n'ayant aucune expérience, ils sont souvent malhabiles. Komi aimerait lui tenir la main mais n'arrive pas à se faire comprendre sans l'exprimer oralement. A part ça, entre la remise des diplômes et la session shopping de Komi, les uns et les autres ne manquent pas d'occasions de briller...",isbn:"9791043305269",img:"https://covers.openlibrary.org/b/isbn/9791043305269-M.jpg"},
  {t:"Toilet-bound",a:"",y:"2025",ed:"Pika édition",cote:"BD TOI",pub:"Jeune",sup:"Imprimé",d:"Après le procès tenu par les Gardiens de l horloge, ces derniers ont jugé nécessaire d altérer le passé pour changer le présent. Propulsée dans une autre réalité, Nene prend peu à peu conscience qu elle ne se trouve pas dans son monde d origine, et constate qu un rituel semble être en vogue& et non pas l un des plus anodins.",isbn:"9791043303043",img:"https://covers.openlibrary.org/b/isbn/9791043303043-M.jpg"},
  {t:"Les Promeneuses de l'apocalypse",a:"Saito Sakae",y:"2025",ed:"Bamboo Edition",cote:"BD PRO",pub:"Jeune",sup:"Imprimé",d:"Le monde est anéanti... Partons le visiter à moto ! Un avion de chasse a fait irruption dans le ciel de Nagaoka. Désireuses de faire connaissance avec son mystérieux pilote, Yôko et Airi entreprennent de se rendre à la base aérienne de Misawa dans le département d'Aomori, où l'avion est censé atterrir. Elles en profiteront pour visiter la région du Tôhoku, en faisant halte successivement à Yamagata, Sendai, Morioka et Akita.",isbn:"9791041116263",img:"https://covers.openlibrary.org/b/isbn/9791041116263-M.jpg"},
  {t:"Bande de compotes !",a:"Mr Tan",y:"2025",ed:"Mr Tan & Co",cote:"BDJ TAN",pub:"Jeune",sup:"Imprimé",d:"Mortelle Adèle revient dans un 22e tome de gags, publié chez Mr Tan & Co ! \" Dans la vie, c'est simple, y a deux catégories de gens : les potes, et les compotes ! Laisse-moi t'expliquer comment faire le tri. Tu peux me faire confiance, la vérité sort de la bouche des... BIZARRES ! \" Mortelle Adèle n'aime pas les nazebroques, et encore moins les flagadas du cerveau ! Avec sa nouvelle catapulte, la voilà bien décidée à envoyer sur la lune le premier qui viendra lui casser les pieds ! Alors gare à vous... BANDE DE COMPOTES ! © Mr Tan et Diane Le Feyer d'après l'oeuvre créée par Mr Tan et Miss Prickly © Mr Tan & Co",isbn:"9782494678378",img:"https://products-images.di-static.com/image/orb-00918f3f3c32e3f5977542d6fc6fb17a/9782494678378-475x500-1.jpg"},
  {t:"Shangri-La Frontier",a:"Katarina",y:"2026",ed:"Glénat",cote:"BD SHA",pub:"Jeune",sup:"Imprimé",d:"Le combat contre Kthaanid des Abysses, l'un des Sept Suprêmes, est entré dans sa troisième phase ! Sunraku et ses coéquipiers, dont les genres et les stats ont été intervertis, passent à l'attaque en inversant aussi les rôles. Les humains d'aujourd'hui seront-ils capables de suivre les illustres traces divines célébrées par le maître des Abysses, et surmonter les épreuves qu'il leur impose ?",isbn:"9782344071502",img:"https://covers.openlibrary.org/b/isbn/9782344071502-M.jpg"},
  {t:"Le disparu du train de 15h12",a:"Fiore Faustina",y:"2026",ed:"Albin Michel",cote:"J FIO",pub:"Jeune",sup:"Imprimé",d:"Suivez les aventures palpitantes de Jeanne, Mélina et Francine, les jeunes soeurs de Louis et Auguste Lumière, célèbres inventeurs du cinéma ! Septembre 1890. Le génial inventeur Augustin Leprince se rend à Paris pour affaires. Monté dans le train à 15 h 12, il n'en est jamais descendu... Quelqu'un l'aurait-il enlevé ? Pire, assassiné ? Jeanne, Mélina et Francine redoutent qu'on accuse leurs frères d'avoir voulu éliminer un concurrent gênant, lancé comme eux dans la course à une invention spectaculaire : le cinéma. Afin de prouver leur innocence, les trois soeurs Lumière mènent une enquête époustouflante, en plein coeur de Paris.",isbn:"9782226502421",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782226502421-475x500-1.jpg"},
  {t:"Drôles d'expressions sur... les émotions",a:"Mialon Estelle",y:"2026",ed:"Grenouille éditions",cote:"A MIA",pub:"Jeune",sup:"Imprimé",d:"En voilà de drôles d'expressions ! En douceur ou en couleurs, nos émotions sont une grande source d'inspiration pour notre imagination. Douze comptines illustrées pour découvrir le monde poétique et imagé des expressions... et des émotions !",isbn:"9782384862856",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782384862856-475x500-1.jpg"},
  {t:"La tour des mensonges",a:"Sobral Patrick",y:"2024",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"Les Légendaires Résistance démarre 20 ans après le grand cycle des Légendaires. Le monde a vécu de belles années de paix mais aujourd'hui les descendants de nos héros doivent reprendre les armes pour défendre Alysia ! La lutte contre les Célestes continue. Malgré les soins de Toopie, Eloa détient toujours les pouvoirs du Dieu-Roi Akamandis. A terme, ceux-ci pourraient bien détruire tout Alysia... Nos héros ont besoin du peuple elfique pour la sauver. Seul obstacle : la tour de Fatamorgana, forteresse imprenable et meurtrière, qu'il leur faudra détruire pour accéder au monde des Elfes...",isbn:"9782413083139",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782413083139-475x500-1.jpg"},
  {t:"World Without",a:"Sobral Patrick",y:"2017",ed:"Delcourt",cote:"BDJ SOB",pub:"Jeune",sup:"Imprimé",d:"En 2004 naquit ce qui allait devenir LE phénomène éditorial de la bande dessinée jeunesse du début du XXIe siècle : Les Légendaires. Dans ce tome 20, Artémus et ses compagnons auront fort à faire pour éviter le pire... C'est un grand jour à Orchidia ! Des quatre coins d'Alysia, les grands de ce monde sont venus assister à l'épreuve du bâtonaigle de Jadilyna qui désignera la princesse Shun-Day comme reine du royaume à la place de sa tante, l'impitoyable Invidia. Mais dans l'ombre de cet événement se trame une sombre machination qui pourrait bien finir en tragédie. Mais qui est visé par cet infâme complot ?",isbn:"9782756064765",img:"https://www.bedetheque.com/media/Couvertures/Couv_312707.jpg"},
  {t:"Le pollen du Monte Urticando",a:"Franquin André",y:"2022",ed:"Dupuis",cote:"BDJ YAN",pub:"Jeune",sup:"Imprimé",d:"Les cactus Comilt millénaires de la vallée Monte Urticando, fleurissent tous les quinze ans. Cela est le signe que les petits marsupilamis doivent se rendent dans cette vallée pour apprendre à se débrouiller tout seul. Et même s'ils doivent y rencontrer un adversaire tenace, Gatogordo le jaguar...",isbn:"9791034766307",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9791034766307-475x500-1.jpg"},
  {t:"Un Petit Tour",a:"Howe Simon",y:"2026",ed:"Kaléidoscope",cote:"A HOW",pub:"Jeune",sup:"Imprimé",d:"Un souriceau et son papa se promènent dans la nature. Ils flânent le long d'un ruisseau, admirent les insectes, les nuages... Mais où vont-ils tous ainsi ? Avec délicatesse, Simon Howe signe un album contemplatif et tendre qui invite à prêter attention à ce qui nous entoure... et à savourer le bonheur simple de retrouver le chemin de la maison.",isbn:"9782378883362",img:"https://products-images.di-static.com/image/orb-090659c0269cce24115fbde492529a0a/9782378883362-475x500-1.jpg"},
  {t:"La mission de Péril",a:"Sutherland Tui",y:"2025",ed:"Gallimard jeunesse",cote:"A SUT",pub:"Jeune",sup:"Imprimé",d:"La cruelle reine Scarlet veut tuer Argil et les autres Dragonnets du Destin. Entre la reine déchue et son seul ami, qui Péril va-t-elle choisir, elle qui est connue pour prendre toujours les pires décisions ?",isbn:"9782075221061",img:"https://products-images.di-static.com/image/orb-12c823c6e7144995c41ae5d6f47049d0/9782075221061-475x500-1.jpg"},
  {t:"Le zoo des animaux disparus",a:"Cazenove Christophe",y:"2021",ed:"Bamboo Edition",cote:"BDJ CAZ",pub:"Jeune",sup:"Imprimé",d:"Dans ce parc zoologique très particulier qui ne présente aux visiteurs que des animaux éteints depuis des siècles, quelques décennies ou même quelques mois, Déborah, stagiaire vétérinaire, a fort à faire pour suivre toutes les naissances extraordinaires de ces espèces disparues. Et elle s'émerveille de pouvoir côtoyer le dodo, la véritable star du zoo ! Tandis que de nouveaux animaux continuent d'arriver dans les enclos, les soigneurs prennent autant soin des bêtes que des visiteurs, dans ce zoo définitivement pas comme les autres.   Inclus : un cahier supplémentaire.",isbn:"9782818983379",img:"https://covers.openlibrary.org/b/isbn/9782818983379-M.jpg"},
  {t:"Parfois, je suis triste",a:"Bowles Paula",y:"2026",ed:"Chantecler",cote:"A BOW",pub:"Jeune",sup:"Imprimé",d:"Votre enfant est parfois triste. Il veut rester dans son coin et n'a pas envie de jouer. C'est tout à fait normal et cela fait partie de son développement. Ce livre aidera votre enfant à reconnaître la tristesse, à la comprendre et à mieux la gérer. La petite histoire lui montrera comment retrouver le sourire d'une manière simple.",isbn:"9782803465002",img:"https://products-images.di-static.com/image/orb-4e14a8fbb4ba34b72854b7733894aa8a/9782803465002-475x500-1.jpg"},
  {t:"Chevaux au vent !",a:"Dufreney L.",y:"2018",ed:"Delcourt",cote:"BDJ DUF",pub:"Jeune",sup:"Imprimé",d:"C'est l'occasion d'une nouvelle sortie du club d'équitation. Flash file à toute allure, Smoussi est à la traîne, Xanax s'efforce de contrôler ses émotions tandis que Kara dirige tout ce petit monde pour une randonnée réussie. ©Electre 2019",isbn:"9782413011217",img:"https://covers.openlibrary.org/b/isbn/9782413011217-M.jpg"},
